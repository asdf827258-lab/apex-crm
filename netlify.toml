# Netlify 배포 설정 (GitHub 연동 · GitHub Actions 공용)
# 정적 사이트: 별도 빌드 없이 저장소 루트를 그대로 게시하고,
# netlify/functions 폴더의 서버리스 함수(generate·gemini)를 함께 배포한다.
[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

# 함수가 config/*.json (뉴스 소스·시세 설정)을 런타임에 읽을 수 있게 함께 묶는다.
[functions]
  included_files = ["config/**"]

# 야간 자동 근무 — 매일 새벽 5시(KST, UTC 20:00) 서버에서 스스로 실행
# 앱을 켜두지 않아도 AI 부서들이 데이터를 읽고 회의록·보고서를 만들어 둔다.
[functions."ai-daily"]
  schedule = "0 20 * * *"

# 밤 작업 — 아침에 바로 쓸 물건을 미리 만든다(오늘 만날 고객 상담 준비 등).
# 새벽 2시~6시(KST) 사이 30분마다 돈다. 한 번에 몇 건씩만 처리하고
# 남은 일은 다음 실행이 이어받는다. 할 일이 없으면 곧바로 끝난다.
[functions."night-work"]
  schedule = "0,30 17-21 * * *"

# 투자·경제 자동수집 — 평일 장 마감 뒤 오후 4시 10분(KST, UTC 07:10)
# 보유 종목 종가·경제지표를 쌓고 다음 날 쓸 시황 브리핑을 미리 만들어 둔다.
[functions."market-daily"]
  schedule = "10 7 * * 1-5"

# 투자 월간 리포트 — 매월 1일 아침 6시(KST, UTC 21:00 전날)
# 지난달 계좌별 성과를 계산해 미리 써 둔다. 설계사는 확인하고 보내기만 하면 된다.
[functions."invest-monthly"]
  schedule = "0 21 28-31 * *"

# 모의 포트폴리오 — 매 영업일 KST 16:40(UTC 07:40). 그날 종가로 가상 체결한다.
# market-daily(KST 16:10)가 종가를 채운 뒤에 돌아야 하므로 그보다 30분 뒤에 둔다.
# ⚠️ 주문은 한 건도 나가지 않는다. 증권사에 붙지도 않는다.
[functions."invest-sim"]
  schedule = "40 7 * * 1-5"

# 투자 아침 브리핑 — 매 영업일 KST 07:00(UTC 22:00 전날)에 계좌별로 한 장씩 만들어 둔다.
# market-daily(야간 종가 수집)가 먼저 돌아야 어제 숫자가 채워지므로 그보다 뒤에 둔다.
# 주말은 함수 안에서 스스로 건너뛴다 — 종가가 안 바뀌는데 같은 글을 또 만들 이유가 없다.
[functions."invest-daily"]
  schedule = "0 22 * * *"

# 하루 한 장 — 밤에 서버가 미리 만들던 것을 <b>껐다.</b>
#
# 사장님 지시: 「서버 밤에 안 만들게, 내가 들어가서 확인할 거고」.
# 그래서 daily-brief 는 이제 예약으로 돌지 않는다. 대표 브리핑을 여시면
# 그 자리에서 앱이 직접 모아 세운다(schOpen → schLoad) — 화면에 뜨는 숫자는
# 언제나 <b>지금 이 순간</b>의 것이지, 새벽에 굳어 둔 것이 아니다.
#
# 함수 파일(netlify/functions/daily-brief.js)은 지우지 않고 남겨 둔다.
# 다시 켜고 싶으시면 아래 두 줄을 되살리기만 하면 된다 —
#   [functions."daily-brief"]
#     schedule = "0 22 * * *"          # UTC 22:00 = KST 07:00
# (KST 로 적으면 오후에 돈다. UTC 로 적는 자리다.)
# check-brief 가 이 상태를 지킨다 — 누가 말없이 되살리면 빨간불이 켜진다.

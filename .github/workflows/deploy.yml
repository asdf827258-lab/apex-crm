name: Deploy to Netlify

# main 브랜치에 병합(push)될 때마다 자동으로 라이브 사이트에 배포한다.
# 단, '자동 점검' 이 통과했을 때만 나간다 — 깨진 코드가 라이브로 가지 않게.
# 수동 실행도 가능(Actions 탭 → Run workflow).
on:
  workflow_run:
    workflows: ["자동 점검"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 점검이 빨간불이면 배포하지 않는다. 손으로 돌릴 때는 그대로 나간다.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: 토큰 확인
        id: check
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN 시크릿이 없어 배포를 건너뜁니다. 저장소 Settings → Secrets and variables → Actions 에 NETLIFY_AUTH_TOKEN 을 추가하세요."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Node 설치
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Netlify 배포(프로덕션)
        if: steps.check.outputs.skip != 'true'
        # 사이트 ID는 비밀이 아니라 식별자이므로 여기에 직접 지정(사용자는 토큰 1개만 등록하면 됨).
        run: npx --yes netlify-cli deploy --prod --site 358d3c54-b3cb-4d48-bfaf-f2eb72d38816

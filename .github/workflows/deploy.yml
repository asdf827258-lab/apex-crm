name: Deploy to Netlify

# ⚠️ 평소에는 이 흐름을 쓰지 않는다.
#
# Netlify 사이트가 이 저장소에 직접 연결돼 있다(Deploys from GitHub).
# main 에 병합되면 Netlify 가 스스로 가져가므로 여기서 또 내보낼 필요가 없다.
# 두 곳에서 동시에 내보내면 나중에 끝난 쪽이 이겨서, 무엇이 라이브인지 알 수 없게 된다.
#
# 그래서 자동 실행을 끊고 손으로만 돌릴 수 있게 남겨 둔다.
# 저장소 연결이 끊겼거나 Netlify 쪽이 막혔을 때의 비상구다.
# 쓰려면 NETLIFY_AUTH_TOKEN 이 살아 있어야 한다(Actions 탭 → Run workflow).
on:
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 점검이 빨간불이면 배포하지 않는다. 손으로 돌릴 때는 그대로 나간다.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: 토큰 확인
        id: check
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN 시크릿이 없어 배포를 건너뜁니다. 저장소 Settings → Secrets and variables → Actions 에 NETLIFY_AUTH_TOKEN 을 추가하세요."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Node 설치
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Netlify 배포(프로덕션)
        if: steps.check.outputs.skip != 'true'
        # 사이트 ID는 비밀이 아니라 식별자이므로 여기에 직접 지정(사용자는 토큰 1개만 등록하면 됨).
        # 토큰이 막히면 Forbidden 만 뜨고 왜인지 안 보인다 — 무엇을 해야 하는지 적어 준다.
        run: |
          set -o pipefail
          if npx --yes netlify-cli deploy --prod --site 358d3c54-b3cb-4d48-bfaf-f2eb72d38816 2>&1 | tee /tmp/deploy.log; then
            exit 0
          fi
          if grep -qiE 'forbidden|unauthorized|401|403|invalid token' /tmp/deploy.log; then
            echo "::error title=Netlify 토큰이 막혔습니다::NETLIFY_AUTH_TOKEN 이 더 이상 통하지 않습니다. Netlify → User settings → Applications → Personal access tokens 에서 새 토큰을 만들고, GitHub 저장소 Settings → Secrets and variables → Actions → NETLIFY_AUTH_TOKEN 을 새 값으로 바꾸세요. 토큰은 어디에도 붙여넣지 말고 그 칸에만 넣으세요."
          fi
          exit 1

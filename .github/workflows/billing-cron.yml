name: 자동결제 정기 실행

# 매일 새벽 3시(KST, = 18:00 UTC 전날)에 만기 도래한 구독을 자동 결제한다.
# 토스 키가 아직 없으면 함수가 "미설정" 응답을 주고 아무 것도 결제하지 않는다(안전).
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  charge:
    runs-on: ubuntu-latest
    steps:
      - name: 만기 구독 자동결제 호출
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -X POST "https://apex-os-yunpro.netlify.app/api/toss-billing" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -d '{"action":"charge-due"}')
          echo "HTTP $code"
          cat /tmp/out.json
          echo
          if [ "$code" = "500" ]; then
            echo "::notice::결제 서버가 아직 설정되지 않았습니다(토스 키 미등록). 정상 종료합니다."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::warning::자동결제 호출이 실패했습니다(HTTP $code)."
          fi

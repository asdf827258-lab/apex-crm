name: 자동 점검

# 깨진 코드가 라이브로 나가는 것을 막는다.
# PR 을 올릴 때와 main 에 들어갈 때 모두 돈다.
# 여기서 빨간불이 뜨면 배포가 시작되지 않는다.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # 검사가 56단계로 늘면서 15분에 닿았다. 빠른 날은 13분, 느린 날은 15분을
    # 넘겨 24단계에서 잘렸다 — 코드가 틀려서가 아니라 시간이 모자라서였다.
    # 여유를 준다. 진짜로 멈춘 것은 25분이면 확실히 걸린다.
    # 점검이 105단계로 늘었고, 여기에 그동안 CI 에 안 걸려 있던 여덟 개를
    # 더 붙였다. 25분이면 아슬아슬하다 — 코드가 틀려서가 아니라 시간이
    # 모자라서 잘리는 일이 전에 있었다. 여유를 준다.
    timeout-minutes: 32
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 쌍둥이 — 같은 것이 두 곳에 있지 않은가 (몇 초)
        run: node scripts/check-twins.js

      - name: 화면 파일 문법 검사
        run: node scripts/check-html.js app/index.html app/day.html app/team.html app/finance.html scripts/lib-sbstub.js db-crm.html db-crm-teams.html ta-script.html index.html "app/재무설계/실전화법서.html" "app/재무설계/상담자료.html" "app/상담자료/메인 상담자료.html" app/상담자료/apex-deck.js app/상담자료/미끼레이더/index.html app/상담자료/미끼레이더/사용안내.html "app/상담자료/미끼상품_접촉전략.html" "app/재무설계/질병보험가이드.html" "app/질병가이드-data.js" "app/질병가이드-도해.js" "app/질병가이드-코드.js"

      - name: SQL 문법 검사
        run: |
          python3 -m pip install --quiet pglast
          python3 scripts/check-sql.py

      - name: 브라우저 설치
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: 주요 화면 열어 보기
        run: node scripts/smoke.js

      - name: 로그인 — 서버가 안 받아 줘도 단추가 멈추지 않는가
        run: node scripts/check-login.js

      - name: 서버 사용량 — 저절로 되풀이해 받아 오지 않는가
        run: node scripts/check-egress.js

      - name: 실행 체크판 눌러 보기
        run: node scripts/check-ckboard.js

      - name: 재무설계 라인 눌러 보기
        run: node scripts/check-fp.js

      - name: 성장판 눌러 보기
        run: node scripts/check-growboard.js

      - name: 음성 비서 시켜 보기
        run: node scripts/check-voice.js

      - name: 두뇌 발표자료 만들어 보기
        run: node scripts/check-brainppt.js

      - name: 두뇌를 따라가면 CRM 이 열리는가
        run: node scripts/check-braincrm.js

      - name: 말로 시켜 보기 (자비스)
        run: node scripts/check-jarvis.js

      - name: 고객 365일 눌러 보기
        run: node scripts/check-clients.js

      - name: 30일 안에 모든 고객에게 연락되는가
        run: node scripts/check-crmcare.js

      - name: 담보·제안서·뉴스→카드·달 서랍이 되는가
        run: node scripts/check-cardfix.js

      - name: 자동차사고 과실·보상이 앱 안에서 열리는가
        run: node scripts/check-carfault.js

      - name: 폰에 담기 · 즐겨찾기 · 메뉴 찾기가 되는가
        run: node scripts/check-phonefav.js

      - name: 출발 점검 눌러 보기
        run: node scripts/check-ready.js

      - name: AI 보고 받아 보기
        run: node scripts/check-airep.js

      - name: TEAM 총괄 · 설정 눌러 보기
        run: node scripts/check-teamhub.js

      - name: AI 키가 거절당해도 일이 끊기지 않는가
        run: node scripts/check-aikey.js

      - name: DB 종류 — 대표가 정하고 팀원은 고르기만
        run: node scripts/check-dbsource.js

      - name: AI 보장분석 — 눌렀을 때 결과물이 나오는가
        run: node scripts/check-bojang.js

      - name: 조직도 — 앱 전체에 반영되는가
        run: node scripts/check-org.js

      - name: 조직도 — 화면이 깜빡이지 않는가
        run: node scripts/check-orgcalm.js

      - name: 메뉴 — 크게 접어 두고, 눌러야 펴지는가
        run: node scripts/check-nav.js

      - name: 보장분석 심층 리포트 — 어떤 일이 있어도 결과가 나오는가
        run: node scripts/check-bjdeck.js

      - name: APEX 사용가이드 — 없는 메뉴를 안내하고 있지 않은가
        run: node scripts/check-guide.js

      - name: 증권 읽기 — 계약 건수·회사별 보험료를 정확히 뽑는가
        run: node scripts/check-insread.js

      - name: 보험별 담보 — 상품 이름만 읽고 끝내지 않는가
        run: node scripts/check-plancov.js

      - name: 보던 화면에서 안 튕기는가 · 쓰던 글이 안 날아가는가
        run: node scripts/check-stay.js

      - name: 투자·경제 — 수익률·경고·토스 바로가기가 맞는가
        run: node scripts/check-invest.js

      - name: 시세 서버 — 키가 없어도 안 죽는가
        run: node scripts/check-market-api.js

      - name: 수익률 계산 — 손으로 아는 답과 맞는가
        run: node scripts/check-perf.js

      - name: AI 제안서 — 「서버가 몰려 있습니다」 없이 결과가 나오는가
        run: node scripts/check-proposal.js

      - name: AI 제안서 — 그림으로 나오는가 · 상속세 계산이 맞는가
        run: node scripts/check-prviz.js

      - name: 상담자료 연동 — 소개는 사람마다, 증권은 앱에서 넘어오는가
        run: node scripts/check-bridge.js

      - name: 상담 이야기 — 필요한 열 장이 이 고객에게 맞춰 펼쳐지는가
        run: node scripts/check-deck.js

      - name: 재무 플랜 — 세금·복리 계산이 손으로 푼 답과 같은가
        run: node scripts/check-finplan.js

      - name: 월간 영업보고서 — 목표·실적이 리더까지 흐르는가
        run: node scripts/check-perfrep.js

      - name: 접촉 기록 — 잘못 들어간 것을 본인이 고칠 수 있는가
        run: node scripts/check-calls.js

      - name: 하루 한 장 — 폰에서 누른 것이 CRM 모양 그대로 들어가는가
        run: node scripts/check-day.js

      - name: 팀 하루 한 장 — 팀이 폰에서 보이고, 고객은 AI 로 안 넘어가는가
        run: node scripts/check-team.js

      - name: 단계 · 약속 · 다음 달 — 계약 뒤까지 이어지는가
        run: node scripts/check-stage.js

      - name: 재무설계 첫 화면 — 보장분석과 같은 얼굴인가
        run: node scripts/check-finface.js

      - name: 연금 — 주택연금이 나이를 보는가 · 퇴직금 가정이 맞는가
        run: node scripts/check-pension.js

      - name: 상담 흐름 — 상담자료에서 종합 재무설계까지 끊기지 않는가
        run: node scripts/check-flow.js

      - name: 투자 — 컨설팅이 고객을 보는가 · 복리 숫자가 맞는가
        run: node scripts/check-invcli.js

      - name: TA 스크립트 — 전화 거는 자리에서 화법이 보이는가
        run: node scripts/check-tascript.js

      - name: 서버 준비 SQL — 저장이 안 되던 것들이 여기 들어 있는가
        run: node scripts/check-setup.js

      - name: 파일 이름을 알리지 않는다 — 누를 자리만 알려 주는가
        run: node scripts/check-nofile.js

      - name: 팩트파인딩 — 적은 것이 계산기 사이드바로 저절로 넘어가는가
        run: node scripts/check-tofin.js

      - name: 발표 — 보고 있는 탭이 아니라 고객이 트랙을 정하는가
        run: node scripts/check-track.js

      - name: 달러 네 걸음 · 교육자금 — 분할이 그 해에 다 들어오지 않는가
        run: node scripts/check-dollar-edu.js

      - name: 내 소개 — 기기가 아니라 아이디를 따라다니는가
        run: node scripts/check-intro.js

      - name: 미끼 레이더 — 다른 컴퓨터로 옮길 수 있는가
        run: node scripts/check-mikmove.js

      - name: 비포&애프터 — 회사마다 다른 담보 이름을 잡아내는가
        run: node scripts/check-baba.js

      - name: 전·후 프레젠테이션 — AI 가 없어도 아홉 장이 서는가
        run: node scripts/check-babadeck.js

      - name: 준비정도 게이지 — 권장 대비 지금·바꾸면이 둘 다 보이는가
        run: node scripts/check-babagauge.js

      - name: 해지 반영 — 계약마다 제 보험료 · 「제외」 를 보장으로 안 만듦 · 인쇄 안 짤림
        run: node scripts/check-babadrop.js

      - name: 음성 비서 — 애매하면 세 갈래를 드리는가
        run: node scripts/check-vapick.js

      - name: 오늘의 터치 — 누구에게 어떻게 무엇을, 그리고 바로 할 수 있는가
        run: node scripts/check-cctouch.js

      - name: 내 캘린더 — 폰 달력이 받아 가고, 이름은 가려서 나가는가
        run: node scripts/check-mycal.js

      - name: 폰 화면 — 390px 에서 가로로 밀리지 않는가
        run: node scripts/check-mobile.js

      - name: 숫자 위생 — 화면에 부서진 값·터진 자릿수가 찍혀 있지 않은가
        run: node scripts/check-sane.js

      - name: 한 장 — 연금·투자·상속·부동산·클로징이 서고, 없으면 지어내지 않는가
        run: node scripts/check-oneglance.js

      - name: 같은 질문지 — 상담카드와 고객 365일이 같은 칸을 쓰고, 평균은 평균이라 밝히는가
        run: node scripts/check-ffsame.js

      - name: 고객 365일 → 계산기 — 생활비·이름·나이가 빈 손으로 가지 않는가
        run: node scripts/check-cmsend.js

      - name: 트랙 C — 부동산 도해 · 지어내지 않는 세금 뉴스 · 비과세는 요건만
        run: node scripts/check-trackc.js

      - name: 일시납·쿠폰 — 제안서 값 그대로 · 받은 것+남은 것 · 세금 단정 안 함
        run: node scripts/check-coupon.js

      - name: 교육자금 지역 — 전국 229개를 고르기만 · 자료 없으면 0 으로 안 채움
        run: node scripts/check-eduregion.js

      - name: 미끼 레이더 — 사무실 자료 폴더를 웹에서도 쓰는가
        run: node scripts/check-mkdata.js

      - name: 미끼 레이더 — 사무실 PC 를 안 켜도 오늘 뉴스가 들어오는가
        run: node scripts/check-mknews.js

      - name: 고객에게 전할 뉴스 — 다섯 칸으로 나뉘고 정책·상품 뉴스와 이어지는가
        run: node scripts/check-newslive.js

      - name: 약관 판정 — 팀이 다 같이 보는가 · 약관 원문은 안 나가는가
        run: node scripts/check-tvshare.js

      - name: 서재 — 회사가 준 폴더를 통째로 넣고, 다음 달엔 새 것만 읽는가
        run: node scripts/check-mklib.js

      - name: 공시실 — 요약서 주소만 찾아 오고 PDF 는 서버가 안 받는가
        run: node scripts/check-gongsi.js

      - name: 홍보 발췌 — 상품설명서·약관을 읽어 원문 그대로 뽑는가
        run: node scripts/check-mkpromo.js

      - name: 상담 첫 장·마지막 장 — 고객 말로 열고, 갈래마다 다르게 닫는가
        run: node scripts/check-cover.js

      - name: 비교표 — 색이 뜻을 갖고, 보험이 이기는 자리도 지는 자리도 다 적는가
        run: node scripts/check-compare.js

      - name: 로그인 유지 — 담아 둔 폰이 바로 열리는가
        run: node scripts/check-signedin.js

      - name: 상담 마지막 장 — 갈래마다 다르게 닫는가 · 면책이 그 갈래 것만 나가는가
        run: node scripts/check-closing.js

      - name: 질병 가이드 — 담보 이름이 보장분석과 같은가 · 없으면 지어내지 않는가
        run: node scripts/check-disease.js

      - name: 하루 한 장 — 밤에 안 만드는가 · 여실 때 서는가 · 직책대로 갈리는가 · 모름을 0 으로 적지 않는가
        run: node scripts/check-brief.js

      - name: 재무설계 접이 — 펴도 글씨가 그대로인가 · 넘치면 스크롤되는가
        run: node scripts/check-fpfold.js

      - name: 보장분석 상태 — 납입완료를 해지와 안 섞나 · 뇌심장을 안 숨기나 · 고객정보가 안 지워지나
        run: node scripts/check-covstate.js

      - name: DB 통합 CRM 연결 — 어긋난 설정이 스스로 낫는가 · 되돌릴 자리가 있는가
        run: node scripts/check-crmconn.js

      - name: 비포&애프터 유지·해지 — 유지한 보험이 애프터에 남는가 · 회사 이름이 제 것인가
        run: node scripts/check-babakeep.js

      - name: AI 제안서 — 비포를 그대로 쓰는가 · 윤시현의 말로 쓰는가
        run: node scripts/check-bjbrain.js

      - name: 큰 자료 — 계약이 많아도 끝까지 읽는가 · 회사 이름 표가 한 벌인가
        run: node scripts/check-bigdoc.js

      - name: 모르는 보험사 — 계약이 말없이 사라지지 않는가 · 사장님이 그 자리에서 넣으시는가
        run: node scripts/check-cofind.js

      - name: 미끼레이더 약관 읽기 — 면책 조항을 장점으로 읽지 않는가 · 넓힌 규칙이 걸리는가
        run: node scripts/check-mkterm.js

      - name: 비포&애프터 담보 읽기 — 한 금액을 두 담보가 나눠 갖지 않는가 · 고친 값을 지키는가
        run: node scripts/check-babaread.js

      - name: 보장분석 담보 읽기 — 옆 칸을 삼키지 않는가 · 번호를 금액으로 안 읽는가
        run: node scripts/check-insdiag.js

      - name: 보장분석 값 고치기 — 비우면 읽은 값으로 돌아가는가 · 다른 고객 표에 안 붙는가
        run: node scripts/check-insfix.js

      - name: 서버 이름 가리기 — 상담 글에 실명이 섞여 서버로 나가지 않는가
        run: node scripts/check-repmask.js

      - name: 손으로 치신 것이 안 담기면 말하는가 — 계약 목록·고친 값·권장 금액
        run: node scripts/check-savefail.js

      - name: 아침 TFA — 대표 브리핑이 안에 있나 · 찾기가 화면 안 칸을 보나 · 동시에 도나
        run: node scripts/check-tfamorning.js
      - name: 블로그 공장 — 글감 없이는 글을 안 만드는가 · 서식과 그림까지 올라가는가
        run: node scripts/check-blogauto.js

      - name: 발표 스크롤 — 글씨를 안 줄이나 · 긴 장을 내릴 수 있나 (재무설계·미끼상품)
        run: node scripts/check-deckscroll.js
      - name: 미끼레이더 신상품 찾기 — 한 칸이 화면 전체를 좁히나 · 못 찾으면 공시실로 보내나
        run: node scripts/check-radarfind.js

      - name: 조직도 반영 — 설정이 이기나 · 없는 팀을 안 지어내나 · 메운 것을 말하나
        run: node scripts/check-orgteam.js

      - name: 풀리포트 — 읽어 낸 담보가 하나도 사라지지 않나 · 범위 다른 진단비를 합산하지 않나
        run: node scripts/check-fullreport.js

      - name: 교재 점수판 — 익명에게 열려 있지 않나 · 로그인해야 서버에 가나
        run: node scripts/check-bohumrls.js

      - name: 서버가 대답을 안 할 때 — 화면이 말없이 멈추지 않는가 · 이유를 말하는가
        run: node scripts/check-nohang.js

      # ── 만들어 두고 CI 에 안 걸어 두었던 점검들 ─────────────────────
      # 8개가 저장소에만 있고 한 번도 안 돌고 있었다. 안 도는 알람은
      # 알람이 아니다 (CLAUDE.md 8번). 특히 check-pdfread 는 4-1번이
      # 「이 전부를 지킵니다」 라고 적어 둔 것이다.
      - name: 우리가 뽑은 PDF 를 우리가 다시 읽는가 (tnum · 왕복)
        run: node scripts/check-pdfread.js

      - name: 치료비 — 손으로 아는 답과 맞는가
        run: node scripts/check-treatpay.js


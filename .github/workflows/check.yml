name: 자동 점검

# 깨진 코드가 라이브로 나가는 것을 막는다.
# PR 을 올릴 때와 main 에 들어갈 때 모두 돈다.
# 여기서 빨간불이 뜨면 배포가 시작되지 않는다.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 화면 파일 문법 검사
        run: node scripts/check-html.js app/index.html app/finance.html db-crm.html db-crm-teams.html ta-script.html index.html "app/재무설계/실전화법서.html" "app/재무설계/상담자료.html" "app/상담자료/메인 상담자료.html" app/상담자료/apex-deck.js app/상담자료/미끼레이더/index.html app/상담자료/미끼레이더/사용안내.html

      - name: SQL 문법 검사
        run: |
          python3 -m pip install --quiet pglast
          python3 scripts/check-sql.py

      - name: 브라우저 설치
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: 주요 화면 열어 보기
        run: node scripts/smoke.js

      - name: 실행 체크판 눌러 보기
        run: node scripts/check-ckboard.js

      - name: 재무설계 라인 눌러 보기
        run: node scripts/check-fp.js

      - name: 성장판 눌러 보기
        run: node scripts/check-growboard.js

      - name: 음성 비서 시켜 보기
        run: node scripts/check-voice.js

      - name: 두뇌 발표자료 만들어 보기
        run: node scripts/check-brainppt.js

      - name: 말로 시켜 보기 (자비스)
        run: node scripts/check-jarvis.js

      - name: 고객 365일 눌러 보기
        run: node scripts/check-clients.js

      - name: 출발 점검 눌러 보기
        run: node scripts/check-ready.js

      - name: AI 보고 받아 보기
        run: node scripts/check-airep.js

      - name: TEAM 총괄 · 설정 눌러 보기
        run: node scripts/check-teamhub.js

      - name: 윤시스쿨 — 진짜 우리 팀·우리 DB 를 보는가
        run: node scripts/check-yoonsi.js

      - name: AI 키가 거절당해도 일이 끊기지 않는가
        run: node scripts/check-aikey.js

      - name: DB 종류 — 대표가 정하고 팀원은 고르기만
        run: node scripts/check-dbsource.js

      - name: AI 보장분석 — 눌렀을 때 결과물이 나오는가
        run: node scripts/check-bojang.js

      - name: 조직도 — 앱 전체에 반영되는가
        run: node scripts/check-org.js

      - name: 조직도 — 화면이 깜빡이지 않는가
        run: node scripts/check-orgcalm.js

      - name: 메뉴 — 크게 접어 두고, 눌러야 펴지는가
        run: node scripts/check-nav.js

      - name: 보장분석 심층 리포트 — 어떤 일이 있어도 결과가 나오는가
        run: node scripts/check-bjdeck.js

      - name: APEX 사용가이드 — 없는 메뉴를 안내하고 있지 않은가
        run: node scripts/check-guide.js

      - name: 증권 읽기 — 계약 건수·회사별 보험료를 정확히 뽑는가
        run: node scripts/check-insread.js

      - name: 보던 화면에서 안 튕기는가 · 쓰던 글이 안 날아가는가
        run: node scripts/check-stay.js

      - name: 투자·경제 — 수익률·경고·토스 바로가기가 맞는가
        run: node scripts/check-invest.js

      - name: 시세 서버 — 키가 없어도 안 죽는가
        run: node scripts/check-market-api.js

      - name: 수익률 계산 — 손으로 아는 답과 맞는가
        run: node scripts/check-perf.js

      - name: AI 제안서 — 「서버가 몰려 있습니다」 없이 결과가 나오는가
        run: node scripts/check-proposal.js

      - name: AI 제안서 — 그림으로 나오는가 · 상속세 계산이 맞는가
        run: node scripts/check-prviz.js

      - name: 상담자료 연동 — 소개는 사람마다, 증권은 앱에서 넘어오는가
        run: node scripts/check-bridge.js

      - name: 상담 이야기 — 필요한 열 장이 이 고객에게 맞춰 펼쳐지는가
        run: node scripts/check-deck.js

      - name: 재무 플랜 — 세금·복리 계산이 손으로 푼 답과 같은가
        run: node scripts/check-finplan.js

      - name: 월간 영업보고서 — 목표·실적이 리더까지 흐르는가
        run: node scripts/check-perfrep.js

      - name: 접촉 기록 — 잘못 들어간 것을 본인이 고칠 수 있는가
        run: node scripts/check-calls.js

      - name: 단계 · 약속 · 다음 달 — 계약 뒤까지 이어지는가
        run: node scripts/check-stage.js

      - name: 재무설계 첫 화면 — 보장분석과 같은 얼굴인가
        run: node scripts/check-finface.js

      - name: 연금 — 주택연금이 나이를 보는가 · 퇴직금 가정이 맞는가
        run: node scripts/check-pension.js

      - name: 상담 흐름 — 상담자료에서 종합 재무설계까지 끊기지 않는가
        run: node scripts/check-flow.js

      - name: 투자 — 컨설팅이 고객을 보는가 · 복리 숫자가 맞는가
        run: node scripts/check-invcli.js

      - name: TA 스크립트 — 전화 거는 자리에서 화법이 보이는가
        run: node scripts/check-tascript.js

      - name: 서버 준비 SQL — 저장이 안 되던 것들이 여기 들어 있는가
        run: node scripts/check-setup.js

      - name: 팩트파인딩 — 적은 것이 계산기 사이드바로 저절로 넘어가는가
        run: node scripts/check-tofin.js

      - name: 발표 — 보고 있는 탭이 아니라 고객이 트랙을 정하는가
        run: node scripts/check-track.js

      - name: 달러 네 걸음 · 교육자금 — 분할이 그 해에 다 들어오지 않는가
        run: node scripts/check-dollar-edu.js

      - name: 내 소개 — 기기가 아니라 아이디를 따라다니는가
        run: node scripts/check-intro.js

      - name: 미끼 레이더 — 다른 컴퓨터로 옮길 수 있는가
        run: node scripts/check-mikmove.js

      - name: 비포&애프터 — 회사마다 다른 담보 이름을 잡아내는가
        run: node scripts/check-baba.js

      - name: 미끼 레이더 — 사무실 자료 폴더를 웹에서도 쓰는가
        run: node scripts/check-mkdata.js

name: 자동 점검

# 깨진 코드가 라이브로 나가는 것을 막는다.
# PR 을 올릴 때와 main 에 들어갈 때 모두 돈다.
# 여기서 빨간불이 뜨면 배포가 시작되지 않는다.
#
# ── 왜 이렇게 바뀌었나 ────────────────────────────────────────────
# 점검이 133가지가 되면서 한 줄로 세워 돌리니 <한 판에 22분>이 걸렸다.
# 세션을 여럿 돌려도 PR 마다 22분씩 서니, 사람을 늘려도 안 빨라졌다.
#
# 그래서 점검 목록을 scripts/checks.tsv 로 빼고, 여기서 <여섯 갈래로
# 나눠 동시에> 돌린다. 22분 → 5~6분.
#
# 덤으로 부딪히는 자리 하나가 없어졌다. 새 점검을 넣을 때 여태 이 파일을
# 고쳐야 했고 세션이 여럿이면 매번 부딪혔다.
#   ▶ 새 점검은 이제 <scripts/checks.tsv 맨 끝에 한 줄>만 붙인다.
#     이 파일은 안 건드린다.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── ① 브라우저 없이 몇 초 만에 끝나는 것부터 ──────────────────────
  #    문법이 깨졌으면 5분 기다릴 것 없이 30초 만에 빨간불이 뜬다.
  fast:
    name: 빠른 점검 (문법 · 쌍둥이 · SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 목록이 성한가
        run: node scripts/run-checks.js --list
      - name: 브라우저 없는 점검 전부
        run: node scripts/run-checks.js --group fast

  # ── ② 브라우저를 띄우는 점검 — 여섯 갈래로 나눠 동시에 ─────────────
  #    fail-fast: false — 한 갈래가 빨개져도 나머지를 끝까지 돌린다.
  #    그래야 한 판에 무엇이 다 틀렸는지 보인다(다시 돌리면 또 5분이다).
  web:
    name: 화면 점검
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 브라우저 내려받기가 갈래마다 1~2분이다. 판이 같으면 그대로 쓴다.
      - name: 브라우저 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-1.49.1-${{ runner.os }}
      - name: 브라우저 설치
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: 화면 점검 ${{ matrix.shard }}/6
        run: node scripts/run-checks.js --shard ${{ matrix.shard }}/6

name: Netlify Diag

on:
  push:
    branches: [claude/deploy-diag]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: 토큰으로 접근 가능한 Netlify 사이트 목록
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NO_TOKEN: NETLIFY_AUTH_TOKEN 시크릿이 비어 있습니다."
            exit 0
          fi
          echo "=== 이 토큰이 접근 가능한 사이트 (id | name | url) ==="
          npx --yes netlify-cli@latest api listSites 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const a=JSON.parse(d);if(!a.length){console.log("(사이트 없음 — 토큰이 다른 계정일 수 있음)");}a.forEach(s=>console.log((s.id||"?")+" | "+(s.name||"?")+" | "+(s.ssl_url||s.url||"?")))}catch(e){console.log("PARSE_ERR:",String(d).slice(0,300))}})'
          echo "=== 끝 ==="

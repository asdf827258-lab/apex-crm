name: Netlify Diag

on:
  push:
    branches: [claude/deploy-diag]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 배포 테스트 (--dir . 명시)
        run: |
          echo "=== deploy --prod --dir . --site apex-os-yunpro ==="
          npx --yes netlify-cli deploy --prod --dir . --site 358d3c54-b3cb-4d48-bfaf-f2eb72d38816 2>&1 | tail -50 || echo "RESULT: 실패(exit=$?)"
          echo "=== 끝 ==="

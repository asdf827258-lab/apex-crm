# 나만 보는 판 — 이 폴더만 올리는 사이트의 설정입니다 (판 X524).
#
# ⚠ 저장소 루트에도 netlify.toml 이 있고 거기 publish = "." 입니다.
#   Netlify 는 UI 설정보다 netlify.toml 을 위에 둡니다. 그래서 이 사이트는
#   <b>Base directory 를 site-me 로</b> 잡아야 합니다 — 그래야 루트 것 대신
#   이 파일을 읽고, 엣지 함수도 이 사이트에만 붙습니다. 루트에 두면
#   본 앱까지 로그인을 물게 됩니다.
[build]
  publish = "."
  command = ""

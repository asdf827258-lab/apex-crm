<!doctype html>
<html data-theme="light" lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- 🌗 <b>「나는 밝은 화면이다」</b> — 이 말이 없으면 폰이 다크 모드일 때
     브라우저가 <b>제멋대로 뒤집어</b> 칠합니다. 2026-09-30 사장님이 폰에서
     「블랙인데」 하신 자리입니다. 색은 한 톨도 안 바뀝니다.
     ★ 2026-10-03 사장님 말씀 <b>「화면은 무조건 흰색 고정으로 가자」</b> —
     이제 <b>면제가 없습니다.</b> 다크 한 벌을 갖춘 문서도 CSS 를 지우지 않고
     <b>가림막</b>(:not([data-theme=light]))으로 껐을 뿐입니다. 재는 자는
     scripts/check-lightmode.js -->
<meta name="color-scheme" content="light"/>
  <title>APEX YUN PRO</title>
  <!-- 홈페이지 → 앱(APEX YUN PRO)으로 자동 이동. 기존 DB CRM(출근달력 포함)은 /db-crm.html 에 보관되어 있습니다. -->
  <meta http-equiv="refresh" content="0; url=/app/" />
  <script>
    (function () {
      try {
        location.replace('/app/' + (location.search || '') + (location.hash || ''));
      } catch (e) {
        location.href = '/app/';
      }
    })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      /* 🤍 2026-10-03 — 여기는 <b>앱으로 넘어가기 전 한 번 번쩍이는 화면</b>입니다.
         바탕이 #0D1117 이라 흰 앱으로 넘어갈 때 <b>검은 섬광</b>이 한 번 지나갔습니다.
         사장님 말씀 「화면은 무조건 흰색 고정으로 가자」 — 앱과 같은 바탕으로 맞춥니다. */
      background: #F2F5FA; color: #191F28; text-align: center;
    }
    .wrap { padding: 24px; }
    .mark {
      width: 60px; height: 60px; border-radius: 16px; margin: 0 auto 16px;
      background: linear-gradient(135deg, #54a3ff, #1b64da);
      display: flex; align-items: center; justify-content: center;
    }
    .mark svg { width: 34px; height: 32px; display: block; }
    .sp {
      width: 30px; height: 30px; margin: 18px auto 12px;
      border: 3px solid rgba(0,0,0,.12); border-top-color: #1b64da;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { margin: 0; color: #6B7684; font-size: 13px; line-height: 1.6; }
    a { color: #1b64da; font-weight: 700; text-decoration: none; }
    .sub { margin-top: 14px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><svg viewBox="0 0 240 220" fill="#fff" aria-hidden="true"><path d="M120 26 212 190 168 190 120 104 72 190 28 190Z"/><path d="M120 120 176 214 146 214 120 168 94 214 64 214Z"/></svg></div>
    <h1>APEX YUN PRO</h1>
    <div class="sp" aria-hidden="true"></div>
    <p>앱으로 이동 중입니다…</p>
    <p class="sub">자동으로 열리지 않으면 <a href="/app/">여기를 눌러 입장</a>하세요.<br />
       기존 DB CRM(출근달력)은 <a href="/db-crm.html">여기</a>에 있습니다.<br />
       트레이딩 데스크·자동매매 봇은 <a href="/trading/">여기</a>, 남은 할 일은 <a href="/trading/todo">여기</a>에 있습니다.</p>
  </div>
</body>
</html>

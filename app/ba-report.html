<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>보장 분석 보고서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--k:1;--bl:#3182F6;--nv:#191F28;--gy:#4E5968;--gy2:#8B95A1;--ln:#E5E8EB;--bg:#F2F4F6;--rd:#E5484D;--gr:#0F9D6E}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9EDF2;color:var(--nv);font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;letter-spacing:-.02em;overflow:hidden}
#wrap{position:absolute;left:50%;top:calc(50% - 22px);width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--k));transform-origin:center}
body.embed #wrap{top:50%}
#deck{position:absolute;inset:0}
.sl{position:absolute;inset:0;background:#fff;display:none;overflow:hidden;border-radius:6px}
.sl.on{display:block}
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-top:1px solid var(--ln)}
#bar button{border:1px solid var(--ln);background:#fff;border-radius:10px;padding:6px 14px;font:inherit;font-weight:800;cursor:pointer}
#bar button.go{background:var(--bl);color:#fff;border-color:var(--bl)}
#dots{flex:1;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
#dots i{width:9px;height:9px;border-radius:50%;background:#D1D6DB;cursor:pointer}
#dots i.on{background:var(--bl);transform:scale(1.25)}
/* 머리 · 꼬리 */
.hd{position:absolute;left:36px;right:36px;top:22px;height:56px;display:flex;align-items:center;gap:14px}
.hd h2{margin:0;font-size:30px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd h2 em{font-style:normal;display:inline-flex;width:38px;height:38px;border-radius:50%;background:var(--nv);color:#fff;align-items:center;justify-content:center;font-size:20px;vertical-align:4px;margin-right:4px}
.chip{color:#fff;font-weight:800;font-size:17px;border-radius:999px;padding:7px 16px;white-space:nowrap}
.hr{display:flex;gap:8px}.dur{background:var(--bg);border-radius:999px;padding:7px 14px;font-weight:800;font-size:15px;color:var(--gy);white-space:nowrap}
.ft{position:absolute;left:36px;right:36px;bottom:10px;height:20px;display:flex;gap:14px;font-size:12px;color:var(--gy2);font-weight:600}
.ft span:nth-child(2){flex:1;text-align:center}.ft b{color:var(--gy)}
sup.sn{font-size:10px;color:var(--bl);font-weight:800;margin-left:2px}
.eyebrow{margin:0 0 10px;font-weight:800;color:var(--bl);font-size:18px}
.note{position:absolute;left:36px;right:36px;bottom:40px;margin:0;font-size:14px;color:var(--gy);font-weight:600}
/* 표지 */
.cover{background:linear-gradient(135deg,#0F1B33 0%,#1C2F55 60%,#24427A 100%);color:#fff}
.cv-l{position:absolute;left:64px;top:110px;width:560px}
.cover h1{font-size:58px;line-height:1.18;margin:0 0 24px;font-weight:800}.cover h1 em{font-style:normal;color:#FFD166}
.cover .eyebrow{color:#8FB4FF}.cover .lead{font-size:20px;line-height:1.65;color:#D5DEEA;margin:0 0 36px}.cover .lead b{color:#fff}
.who{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:12px 20px;font-size:20px;font-weight:800}
.cv-r{position:absolute;right:48px;top:70px;width:560px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cv-t{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.3);border-top:6px solid var(--c)}
.cv-t svg{display:block;width:100%;height:auto;aspect-ratio:8/5}
.cv-t b{display:block;color:var(--nv);padding:9px 14px;font-size:17px}
/* 순서 */
.ag{position:absolute;left:36px;right:36px;top:100px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ag-c{border:1px solid var(--ln);border-radius:18px;padding:22px 20px;border-top:8px solid var(--c);height:520px;position:relative}

.ag-c h3{margin:0 0 6px;font-size:26px}.ag-c p{margin:0 0 16px;color:var(--gy);font-size:15px;font-weight:600}
.ag-c ol{margin:0;padding-left:22px;font-size:18px;line-height:2;font-weight:700}
.ag-m{position:absolute;left:20px;right:20px;bottom:20px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:baseline;background:var(--bg);border-radius:12px;padding:12px 14px}
.ag-m span{font-size:13px;color:var(--gy);font-weight:700}.ag-m b{font-size:20px;text-align:right}.ag-m b.up{color:var(--c)}
/* 여정 표지 */
.jc-h{position:absolute;left:60px;top:44px;right:60px;display:flex;gap:22px;align-items:center;border-left:10px solid var(--c);padding-left:24px}
.jc-h .big{font-size:76px}.jc-h h1{margin:0;font-size:54px}.jc-h .lead{margin:6px 0 0;font-size:19px;color:var(--gy);font-weight:700}
.loop{position:absolute;left:40px;right:40px;top:212px;display:flex;align-items:flex-start;gap:8px}.loop .ar{margin-top:66px}
.lp{flex:1;text-align:center}.lp-i{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--ln);box-shadow:0 6px 16px rgba(25,31,40,.08)}
.lp-i svg{display:block;width:100%;height:auto;aspect-ratio:8/5}
.lp-i i{position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--nv);color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center}
.lp>b{display:block;font-size:19px;margin-top:10px}.lp>span{font-size:14px;color:var(--gy);font-weight:700}.lp li b{color:var(--nv)}
.lp ul{margin:8px 0 0;padding:0;list-style:none;text-align:left}.lp li{font-size:13px;line-height:1.45;color:#333D4B;font-weight:600;padding:3px 0 3px 12px;position:relative}.lp li::before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--gy2)}
.ar{font-size:28px;color:var(--gy2);font-weight:800}
.first{position:absolute;left:60px;right:60px;bottom:96px;background:#FFF4E5;border-radius:14px;padding:14px 20px;font-size:19px;font-weight:700;color:#7A4B00}
.loopnote{background:#F0F4FF;border-radius:14px;padding:14px 20px;font-size:17px;font-weight:600;color:#23366B;line-height:1.55}
.jcover .loopnote{position:absolute;left:60px;right:60px;bottom:30px}
.jcover .loop{top:196px}
/* 단계 */
.st-l{position:absolute;left:36px;top:92px;width:752px}
.scene{border-radius:16px;overflow:hidden;border:1px solid var(--ln);box-shadow:0 8px 22px rgba(25,31,40,.08)}
.scene svg{display:block;width:752px;height:470px}
.ph{display:flex;gap:10px;margin-top:10px;align-items:stretch;height:116px}
.ph-t{writing-mode:vertical-rl;font-size:13px;font-weight:800;color:var(--gy);background:var(--bg);border-radius:10px;padding:8px 6px;text-align:center}
.ph figure{margin:0;flex:1;position:relative;border-radius:10px;overflow:hidden;background:#DDE3EA}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:12px;font-weight:700;padding:14px 8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-r{position:absolute;left:808px;right:36px;top:92px;bottom:38px;display:flex;flex-direction:column;gap:10px}
.st-r h4{margin:0 0 6px;font-size:14px;color:var(--gy);font-weight:800}
.ex{background:var(--bg);border-radius:14px;padding:12px 14px}
.ex ol{margin:0;padding:0;list-style:none;counter-reset:e}
.ex li{position:relative;padding-left:20px;font-size:14.5px;line-height:1.5;margin:3px 0;font-weight:600;color:#333D4B}
.ex li::before{content:'';position:absolute;left:4px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--bl)}
.ex li b{color:var(--nv)}
.cost{border:1px solid var(--ln);border-radius:14px;padding:10px 14px}
.cr{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:3px 0}.cr+.cr{border-top:1px dashed var(--ln)}
.cr span{font-size:14.5px;font-weight:700}.cr b{font-size:16px;color:var(--rd);text-align:right}.cr small{grid-column:1/3;font-size:12px;color:var(--gy2);font-weight:600}
.pay{border:1px solid var(--ln);border-radius:14px;padding:10px 14px;flex:1;min-height:0;overflow:hidden}
.pay table{width:100%;border-collapse:collapse}
.pay th{font-size:12px;color:var(--gy2);text-align:right;font-weight:700;padding:0 0 4px}.pay th:first-child{text-align:left}
.pay td{padding:5px 0;border-top:1px solid #F2F4F6;font-size:14.5px;vertical-align:top}
.pay td b{display:block;font-size:14.5px}.pay td small{display:block;font-size:11.5px;color:var(--gy2);font-weight:600}
.pay td.b,.pay td.a{text-align:right;font-weight:800;white-space:nowrap;padding-left:8px}.pay td.b{color:var(--gy2)}.pay td.a{color:var(--bl)}
.no{color:var(--rd)}
.tot{display:flex;align-items:center;gap:10px;background:var(--nv);color:#fff;border-radius:14px;padding:12px 16px}
.tot span{font-size:14px;font-weight:700;color:#B0B8C1}.tot b{font-size:22px}.tot b.up{color:#FFD166}.tot .arw{font-size:20px}
/* 시술 */
.pxg{position:absolute;left:36px;right:36px;top:96px;bottom:40px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
.pxc{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:16px;padding:12px}
.pxf{position:relative;flex:none;width:380px;background:#fff;border-radius:12px;overflow:hidden}
.pxf svg{display:block;width:380px;height:237px}
.pxf i{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--nv);color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center}
.pxc p{margin:0;font-size:16px;line-height:1.6;font-weight:600;color:#333D4B}
/* 왜 */
.wyg{position:absolute;left:36px;right:36px;top:96px;bottom:40px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.wyc{background:var(--bg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.wyf{background:#fff;border-radius:12px;overflow:hidden}.wyf svg{display:block;width:100%;height:auto;aspect-ratio:16/10}
.wyc{justify-content:center}.wyc p{margin:0;font-size:17.5px;line-height:1.6;font-weight:600;color:#333D4B}
/* 합계 */
.sm-l{position:absolute;left:36px;top:100px;width:700px}
.smt{width:100%;border-collapse:collapse;margin-bottom:18px}
.smt th{font-size:13px;color:var(--gy2);text-align:right;padding:8px 10px;border-bottom:2px solid var(--nv)}.smt th:first-child{text-align:left}
.smt td{font-size:18px;padding:13px 10px;border-bottom:1px solid var(--ln);text-align:right;font-weight:700}.smt td:first-child{text-align:left}
.smt td em{font-style:normal;display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--nv);color:#fff;font-size:14px;align-items:center;justify-content:center;margin-right:6px}
.smt td.b{color:var(--gy2)}.smt td.a{color:var(--bl)}.smt .gy{color:var(--gy2);font-size:15px}
.smt tfoot td{font-size:21px;font-weight:900;border-bottom:0;background:var(--bg)}
.smth{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.smth div{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--ln)}.smth svg{display:block;width:100%;height:auto;aspect-ratio:8/5}
.smth i{position:absolute;left:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--nv);color:#fff;font-style:normal;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.sm-r{position:absolute;left:770px;right:36px;top:110px}
.bar{margin-bottom:26px}.bar span{display:block;font-size:15px;font-weight:800;color:var(--gy);margin-bottom:6px}
.bt{height:30px;background:var(--bg);border-radius:8px;overflow:hidden}.bt i{display:block;height:100%;border-radius:8px}
.bar b{display:block;font-size:24px;margin-top:4px}
.gap{font-size:19px;font-weight:700;background:#FFF8E1;border-radius:12px;padding:14px 16px;color:#7A4B00}.gap b{color:var(--rd)}
/* 정리 */
.wr{position:absolute;left:36px;right:36px;top:100px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.wr-c{border-radius:16px;border:1px solid var(--ln);border-top:8px solid var(--c);padding:12px 16px}.wr-n{padding:2px 0!important}
.wr-c svg{display:block;width:100%;height:auto;aspect-ratio:8/5;border-radius:10px;margin-bottom:12px;border:1px solid var(--ln)}.wr-c h3{margin:0 0 8px;font-size:23px}.wr-n{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0}.wr-n span{font-size:14px;color:var(--gy);font-weight:700}.wr-n b{font-size:22px;color:var(--gy2)}
.wr-n.up b{color:var(--c);font-size:26px}.wr-c p{margin:10px 0 0;font-size:13px;color:var(--gy);font-weight:600;line-height:1.5}
.keys{position:absolute;left:36px;right:36px;top:492px;margin:0;padding:0;list-style:none;display:grid;gap:12px}
.keys li{background:var(--bg);border-radius:14px;padding:11px 20px;font-size:18px;font-weight:600}.keys b{color:var(--bl)}
/* 출처 */
.srcs{position:absolute;left:36px;right:36px;top:92px;bottom:40px;overflow:hidden}
.srcs ol{margin:0;padding-left:22px;columns:2;column-gap:28px}.srcs li{font-size:12px;margin-bottom:5px;break-inside:avoid}.srcs li b{display:block;font-size:12.5px}.srcs li span{font-size:10px;color:var(--gy2);word-break:break-all}
.srcs .note{position:static;margin:10px 0}.srcs .phc{font-size:9.5px;color:var(--gy2);line-height:1.45;background:none;padding:0;display:block}
/* ── 메인 ── */
.main{background:linear-gradient(135deg,#0F1B33 0%,#1C2F55 60%,#24427A 100%);color:#fff}
.mn-l{position:absolute;left:56px;top:84px;width:380px}
.main h1{font-size:54px;line-height:1.16;margin:0 0 22px;font-weight:800}.main h1 em{font-style:normal;color:#FFD166}
.main .eyebrow{color:#8FB4FF}.main .lead{font-size:18px;line-height:1.7;color:#D5DEEA;margin:0 0 30px}.main .lead b{color:#fff}
.mn-g{position:absolute;left:470px;right:36px;top:48px;bottom:48px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:14px}
.tile{position:relative;border:0;border-radius:16px;background:#fff;color:var(--nv);text-align:left;padding:0 0 12px;cursor:pointer;overflow:hidden;font:inherit;display:flex;flex-direction:column;box-shadow:0 10px 26px rgba(0,0,0,.28);border-top:6px solid var(--c)}
.tile:hover{transform:translateY(-3px)}
.tile svg{display:block;width:100%;height:auto;aspect-ratio:8/5}
.tile .ti{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:8/5;font-size:58px;background:#F2F4F6;overflow:hidden}
.tile .tm{display:block;color:var(--c);font-size:14px;padding:4px 0 0}
.hd h2 .hl{color:var(--bl)}
.tile .tn{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--nv);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.tile b{display:block;font-size:18px;padding:10px 12px 4px}.tile small{display:block;font-size:12.5px;color:var(--gy);font-weight:600;padding:0 12px;line-height:1.45}
/* ── 담보 줄 ── */
.cv{display:grid;grid-template-columns:1fr 70px 76px;gap:6px;align-items:baseline;padding:3px 0;border-top:1px solid #EEF1F4;font-size:13px}
.cv:first-child{border-top:0}
.cv .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cv .vb,.cv .va{text-align:right;font-weight:800;white-space:nowrap}
.cv .vb{color:var(--gy2)}.cv .va{color:var(--nv)}
.cv.new .va{color:var(--gr)}.cv.new .va::before{content:'＋';font-size:10px}
.cv.up .va{color:var(--bl)}.cv.gone .va{color:var(--rd)}.cv.gone .vb{text-decoration:line-through}.cv.down .va{color:#B45309}
.cv.none{opacity:.45}.cv.none .nm{font-weight:600}
.cvh{display:grid;grid-template-columns:1fr 70px 76px;gap:6px;font-size:11px;color:var(--gy2);font-weight:800;text-align:right;padding-bottom:2px}
.lgd{position:absolute;left:36px;bottom:36px;display:flex;gap:16px;font-size:13px;font-weight:700}
.lgd span::before,.sumc span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:0}
.lgd .new::before,.sumc .new::before{background:var(--gr)}.lgd .up::before,.sumc .up::before{background:var(--bl)}.lgd .same::before,.sumc .same::before{background:var(--nv)}
.lgd .gone::before,.sumc .gone::before{background:var(--rd)}.lgd .none::before,.sumc .none::before{background:#D1D6DB}.sumc .down::before{background:#B45309}
.sumc .hint::before{display:none}
/* 보장 이해 ① */
.kd{position:absolute;left:36px;right:36px;top:92px;bottom:74px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:14px}
.kc{border:1px solid var(--ln);border-radius:16px;padding:12px 14px;border-left:6px solid var(--c);display:flex;flex-direction:column;gap:8px;overflow:hidden}
.kh{display:flex;gap:10px;align-items:center}.ki{flex:none;width:46px;height:46px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:26px}
.kh b{display:block;font-size:18px}.kh small{display:block;font-size:12.5px;color:var(--gy);font-weight:600;line-height:1.4}
.kn{display:flex;gap:8px;align-items:baseline;font-size:14px;font-weight:700;color:var(--gy)}.kn b{font-size:20px;color:var(--nv)}.kn .up b{color:var(--c)}.kn .of{margin-left:auto;font-size:12px;color:var(--gy2)}
.emp{margin:0;font-size:13px;color:var(--gy2);font-weight:600}
.note b{color:var(--nv)}
/* 보장 이해 ② */
.phs{position:absolute;left:30px;right:30px;top:92px;bottom:70px;display:flex;gap:4px;align-items:stretch}
.phc{flex:1;min-width:0;background:var(--bg);border-radius:14px;padding:8px;display:flex;flex-direction:column}
.phi{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--ln)}.phi svg{display:block;width:100%;height:auto;aspect-ratio:8/5}

.phc h4{margin:8px 2px 6px;font-size:17px}.phc .cv,.phc .cvh{grid-template-columns:1fr 50px 58px;font-size:12px}.phc .cvh{font-size:10.5px}

.pha{align-self:center;font-size:26px;color:var(--gy2);font-weight:800}
/* 보장 이해 ③ */
.rbs{position:absolute;left:36px;right:36px;top:96px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rb{border:1px solid var(--ln);border-radius:18px;padding:12px 18px 6px;border-top:8px solid var(--c)}
.rb h3{margin:0 0 8px;font-size:19px}
.rr{margin-bottom:8px}.rl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}.rl b{font-size:17px}
.hv i{font-style:normal;font-size:12px;font-weight:800;color:var(--gy2);background:var(--bg);border-radius:999px;padding:3px 9px;margin-left:5px}.hv i.y{color:var(--nv);background:#E8EEF8}.hv i.y.up{color:#fff;background:var(--c)}
.rt{position:relative;height:22px;background:var(--bg);border-radius:8px;overflow:hidden}.rt i{display:block;height:100%;background:var(--c);border-radius:8px;opacity:.85}
.rt span{position:absolute;right:10px;top:2px;font-weight:900;font-size:14px}

  .concat(ORDER.map(function(j){const T=jTot(j);return {go:j,t:SECNM[j],d:J[j].st.map(function(s){return s.k;}).join(' → '),m:manC(T.b)+' → '+manC(T.a),sc:J[j].st[0].sc};}))
  .concat([{go:'wrap',t:'정리 · 출처',d:'보장은 「한 번」 이 아니라 「한 바퀴」 로'}]);
 add('contents','<div class="toc-l"><p class="kick dk">CONTENTS</p><h1>목차</h1><p class="lead3">'+who+'의 보장을<br>일곱 장으로 정리했습니다.<br><br><span>항목을 누르면 그 장으로 갑니다.</span></p></div>'+
  '<ol class="toc">'+TOC.map(function(t){return '<li data-go="'+t.go+'"><span class="no">'+SECNO[t.go]+'</span><div class="tt"><b>'+t.t+'</b><small>'+t.d+'</small></div>'+
   (t.m?'<span class="tm2">'+t.m+'</span>':'<span class="tm2"></span>')+(t.sc?phImg(t.go,0,'tthumb'):'<span class="tthumb"></span>')+'<span class="pg" data-pg="'+t.go+'"></span></li>';}).join('')+'</ol>'+foot(''),{sec:'toc'});
}

/* ── 자료 한 벌 ── */
/* ═══════════════ 자료 한 벌 — 표지 → 여정 넷(표지 · 단계 넷 · 시술 · 왜 넓어야 · 한 바퀴 합계) → 정리 → 출처 ═══════════════ */
/* ── ba.html 이 보낸 고객 자료 (#d=…) — # 뒤라 서버로 가지 않는다 ── */
var BA=null;try{var bhm=/[#&]d=([^&]*)/.exec(location.hash);if(bhm)BA=JSON.parse(decodeURIComponent(bhm[1]));}catch(e){BA=null;}
var WHO='홍길동 님';
if(BA){
 if(BA.b&&BA.a){COV.b=BA.b;COV.a=BA.a;}
 WHO=(BA.n?BA.n+' 님':'고객님');
 var who2=WHO+(BA.age?(' ('+BA.age+'세)'):''),sx=BA.sex==='남'?'남성':(BA.sex==='여'?'여성':''),bhead=((BA.age?BA.age+'세 ':'')+sx).trim();
 var BDZ={cancer:'폐암',brain:'뇌경색',heart:'급성심근경색'};
 ORDER.forEach(function(k){J[k].who=(k==='care'?(WHO+' (훗날 · 예시)'):who2);if(BDZ[k])J[k].case=(bhead?bhead+' · ':'')+BDZ[k]+' (예시)';});
 if(BA.sex==='여'){const F={sex:'f',hair:'bob',hc:'#2E241E'};HONG.over=Object.assign({},F,{top:'#F1E4EC'});HONGP.over=F;HONGO.role='elderF';}
}
function NMX(t){return (''+t).replace(/홍길동 님/g,WHO);}

const JC={cancer:'#E8734A',brain:'#7C5CFF',heart:'#E5484D',care:'#0F9D6E'};
const MAINPX={cancer:'cancer_tx',brain:'brain_1',heart:'heart_1',care:'care_0'};
const WHYPICK={cancer:[0,1],brain:[0,2],heart:[0,1],care:[0,1]};
function esc(t){return (''+t).replace(/</g,'&lt;');}
function won(v){return v===undefined?'<span class="no">없음</span>':(v===null?'—':man(v)+'원');}
function srcSup(k){return k?'<sup class="sn">'+srcNo(k)+'</sup>':'';}
function pxSvg(s,cls){return '<svg class="'+(cls||'pxs')+'" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg"><defs><marker id="pxar" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8B95A1"/></marker>'+VDEFS+'</defs>'+s+'</svg>';}
function jTot(j){const o={cost:0,b:0,a:0};J[j].st.forEach(function(s){const c=stageCalc(s);o.cost+=c.cost;o.b+=c.b;o.a+=c.a;});return o;}
function head(j,sub,right){const J0=J[j];return '<header class="hd"><span class="chip" style="background:'+JC[j]+'">'+J0.ic+' '+J0.t+'</span><h2>'+sub+'</h2>'+(right?'<div class="hr">'+right+'</div>':'')+'</header>';}
function gapBox(s){const miss=s.pay.filter(function(p){return p.m!=='none'&&payOf(p,'a')===undefined;}).map(function(p){return NM[p.k]||p.k;});
 if(miss.length)return '<div class="tot gapbox"><span>조정 후에도 비는 자리</span><b>'+miss.join(' · ')+'</b><small>이 단계에서 나올 돈이 없습니다 — 보완을 검토할 담보</small></div>';
 const how=(s.pay[0]||{}).how||'';return '<div class="tot gapbox info"><span>이 단계</span><b>따로 나오는 돈은 없습니다</b><small>'+how+'</small></div>';}
function foot(n){return '<footer class="ft"><span class="fb">APEX 사업단 · 보장 분석 보고서 — '+NMX('홍길동 님')+'</span><span>사진 · 도표는 이해를 돕기 위한 자료입니다 — 실제 치료 · 비용은 병원 · 상태마다 다릅니다</span><b>'+n+'</b></footer>';}

const SLIDES=[];
function add(cls,html,meta){SLIDES.push({cls:cls,html:html,meta:meta||{}});}

frontSlides();

ORDER.forEach(function(j){const J0=J[j],T=jTot(j);
 /* 여정 표지 */
 add('jcover',
  '<div class="jc-h" style="--c:'+JC[j]+'"><span class="secno">'+SECNO[j]+'</span><span class="big">'+J0.ic+'</span><div><p class="eyebrow">치료 한 바퀴</p><h1>'+J0.t+'</h1><p class="lead">'+NMX(J0.case)+' · '+NMX(J0.who)+'</p></div></div>'+
  '<div class="loop">'+J0.st.map(function(s,i){return '<div class="lp"><div class="lp-i">'+phImg(j,i,'mini')+'<i>'+(i+1)+'</i></div><b>'+s.k+'</b><span>'+s.dur+'</span>'+(function(){const c=stageCalc(s);return '<div class="lpm"><em>'+man(c.b)+'</em><i>→</i><b>'+man(c.a)+'</b></div>';})()+'<ul>'+s.what.slice(0,3).map(function(w){return '<li>'+w+'</li>';}).join('')+'</ul></div>'+(i<J0.st.length-1?'<div class="ar">→</div>':'');}).join('')+'</div>'+
  (J0.first?'<div class="first">💸 '+J0.first.t+srcSup(J0.first.s)+'</div>':'')+
  '<div class="loopnote">↺ '+NMX(J0.loop)+'</div>',{j:j,sec:j});
 /* 단계 넷 */
 J0.st.forEach(function(s,i){const c=stageCalc(s),ph=(PHOTOS[j+'_'+i]||[]).slice(0,3);
  const rows=s.pay.map(function(p){const b=payOf(p,'b'),a=payOf(p,'a');
   return '<tr><td><b>'+(NM[p.k]||p.k)+'</b><small>'+p.how+'</small></td><td class="b">'+(p.m==='none'?'—':won(b))+'</td><td class="a">'+(p.m==='none'?'—':won(a))+'</td></tr>';}).join('');
  add('stage',
   head(j,'<em>'+(i+1)+'</em> '+s.k,'<span class="dur">⏱ '+s.dur+'</span>')+
   '<div class="st-l">'+heroP(j,i)+factsRow(j,i)+'</div>'+
   '<div class="st-r">'+
    '<section class="ex"><h4>치료 예시 · '+NMX(J0.who)+'</h4><ol>'+s.ex.map(function(e){return '<li>'+NMX(e)+'</li>';}).join('')+'</ol></section>'+
    '<section class="cost"><h4>드는 돈</h4>'+s.cost.map(function(k){return '<div class="cr"><span>'+k.n+srcSup(k.s)+'</span><b>'+(k.v===null?'병원마다 다름':man(k.v)+'원')+'</b><small>'+k.note+'</small></div>';}).join('')+'</section>'+
    '<section class="pay"><h4>보험에서 나오는 돈</h4><table><thead><tr><th>담보</th><th>지금</th><th>조정 후</th></tr></thead><tbody>'+rows+'</tbody></table></section>'+
    (c.a>0?'<div class="tot"><span>이 단계</span><b>'+man(c.b)+'원</b><span class="arw">→</span><b class="up">'+man(c.a)+'원</b></div>':gapBox(s))+
   '</div>'+foot(''),{j:j,i:i});});
 /* 시술 이해하기 */
 const P=PX[MAINPX[j]],ps=P.steps.filter(function(x){return x.s;}).slice(0,4);
 /* 그림이 넷보다 적으면 같은 여정의 다른 도해 첫 장으로 채운다(재가급여 · 2장뿐이던 자리) */
 [1,2,3].forEach(function(n){const Q=PX[j+'_'+n];if(ps.length<4&&Q&&Q!==P&&Q.steps[0]&&Q.steps[0].s)ps.push(Q.steps[0]);});
 add('px',head(j,'🎬 '+P.t,'<span class="dur">쉽게 그린 그림</span>')+
  '<div class="pxg">'+ps.map(function(x,n){return '<div class="pxc"><div class="pxf">'+pxSvg(x.s)+'<i>'+(n+1)+'</i></div><p>'+NMX(x.c)+'</p></div>';}).join('')+'</div>'+foot(''),{j:j});
 /* 왜 넓어야 */
 FSK=1;const W=WHY[j].steps();FSK=1.3;const wp=WHYPICK[j].map(function(n){return W[n];}).filter(Boolean);
 add('why',head(j,'🎯 '+WHY[j].t)+
  '<div class="wyg">'+wp.map(function(x){return '<div class="wyc"><div class="wyf">'+pxSvg(x.s)+'</div><p>'+NMX(x.c)+'</p></div>';}).join('')+'</div>'+foot(''),{j:j});
 /* 한 바퀴 합계 */
 const mx=Math.max(T.cost,T.b,T.a,1);
 add('sum',head(j,'한 바퀴를 돌면 — 합계','<span class="dur">'+NMX(J0.case)+'</span>')+
  '<div class="sm-l"><table class="smt"><thead><tr><th>단계</th><th>드는 돈(알려진 것)</th><th>지금</th><th>조정 후</th></tr></thead><tbody>'+
   J0.st.map(function(s,i){const c=stageCalc(s);return '<tr><td><em>'+(i+1)+'</em> '+s.k+'</td><td>'+(c.costKnown?man(c.cost)+'원':'<span class="gy">병원마다</span>')+'</td><td class="b">'+man(c.b)+'원</td><td class="a">'+man(c.a)+'원</td></tr>';}).join('')+
   '</tbody><tfoot><tr><td>한 바퀴</td><td>'+man(T.cost)+'원+</td><td class="b">'+man(T.b)+'원</td><td class="a">'+man(T.a)+'원</td></tr></tfoot></table>'+
   '<div class="loopnote">↺ '+NMX(J0.loop)+'</div>'+'<div class="smth" style="grid-template-columns:repeat('+J0.st.length+',1fr)">'+J0.st.map(function(s,i){return '<div>'+phImg(j,i,'mini')+'<i>'+(i+1)+'</i></div>';}).join('')+'</div></div>'+
  '<div class="sm-r">'+(function(){const u=J0.st.filter(function(s){return !stageCalc(s).costKnown;}).length;return u?'<p class="unk">⚠ 「병원마다 다른」 단계 '+u+'곳은 드는 돈에서 <b>빼고</b> 셈했습니다 — 실제 비용은 이보다 큽니다'+(J0.first?' · 참고: '+J0.first.t.replace(/<[^>]+>/g,''):'')+'</p>':'';})()+[['드는 돈(알려진 것만)',T.cost,'#4E5968'],['지금 받는 돈',T.b,'#68737F'],['조정 후 받는 돈',T.a,JC[j]]].map(function(r){return '<div class="bar"><span>'+r[0]+'</span><div class="bt"><i style="width:'+(r[1]/mx*100).toFixed(1)+'%;background:'+r[2]+'"></i></div><b style="color:'+r[2]+'">'+man(r[1])+'원</b></div>';}).join('')+
   '<p class="gap">'+(T.a>T.b?'조정하면 한 바퀴에서 <b>'+man(T.a-T.b)+'원</b> 더 받습니다':'')+'</p></div>'+foot(''),{j:j});
});

/* 정리 */
add('wrap','<header class="hd"><h2>정리 — 보장은 「한 번」 이 아니라 「한 바퀴」 로</h2></header>'+
 '<div class="wr">'+ORDER.map(function(j){const T=jTot(j);return '<div class="wr-c" style="--c:'+JC[j]+'">'+phImg(j,1,'mini')+'<h3>'+J[j].ic+' '+J[j].t+'</h3>'+
  '<div class="wr-n"><span>지금</span><b>'+man(T.b)+'원</b></div><div class="wr-n up"><span>조정 후</span><b>'+man(T.a)+'원</b></div>'+
  '<p>'+J[j].st.map(function(s){return s.k;}).join(' → ')+'</p></div>';}).join('')+'</div>'+
 '<ul class="keys"><li><b>진단비</b>는 문을 여는 돈 — 이름이 넓을수록(뇌혈관 · 허혈성) 열리는 경우가 많습니다</li>'+
 '<li><b>치료비</b>는 해마다 · 회차마다 — 비급여 수술 · 항암은 산정특례 5%가 붙지 않습니다</li>'+
 '<li><b>재활 · 돌봄</b>은 끝나는 날이 없습니다 — 간병 · 매달 나오는 돈이 받침이 됩니다</li></ul>'+foot(''),{sec:'wrap'});

/* 출처 */
add('src','<header class="hd"><h2>출처 ① — 통계 · 기사</h2></header><div class="srcs"><ol>'+SRC_ORDER.map(function(k){const S=SRC[k];return '<li><b>'+S.t+'</b><span>'+S.d+' · '+S.u+'</span></li>';}).join('')+'</ol>'+
 '<div class="nwlist"><b>📰 기사 (제목 화면 캡처 · 숫자 요약)</b><ol>'+Object.keys(NEWS).map(function(k){const N=NEWS[k];return '<li>'+N.o+' '+N.d+' 「'+N.h+'」<span>'+N.u+'</span></li>';}).join('')+'</ol></div></div>'+foot(''),{sec:'src'});
add('src2','<header class="hd"><h2>출처 ② — 사진 · 그림</h2></header><div class="srcs"><p class="note">단계 사진은 위키미디어 공용의 자유 라이선스 사진입니다. 기사 화면은 제목 · 날짜 부분만 캡처했고 본문 · 기사 사진은 싣지 않았습니다. 시술 설명 그림은 이해를 돕기 위해 쉽게 그린 도해입니다. 담보별 지급 조건 · 질병코드 범위는 회사 · 상품 · 가입 시기마다 다르니 약관으로 확인하세요.</p>'+
 '<ol class="phl">'+(function(){const seen={},L=[];Object.keys(PHOTOS).forEach(function(k){PHOTOS[k].forEach(function(p){if(!seen[p.u]){seen[p.u]=1;L.push(p);}});});return L.map(function(p){return '<li><b>'+p.t+'</b> — '+p.cr+'</li>';}).join('');})()+'</ol></div>'+foot(''));

/* ── 그리기 · 넘기기 ── */
function build(){const st=document.getElementById('deck');
 st.innerHTML=SLIDES.map(function(s,n){const sk=(s.meta&&(s.meta.sec||s.meta.j))||(s.cls==='src'?'src':'');const lab=SECNO[sk]?('<span class="secl">'+SECNO[sk]+'　'+SECNM[sk]+'</span>'):'';return '<section class="sl '+s.cls+'" data-n="'+(n+1)+'">'+s.html.replace('<header class="hd">','<header class="hd">'+lab).replace(/<b>(<\/b><\/footer>)/,'<b>'+(n+1)+' / '+SLIDES.length+'$1')+'</section>';}).join('');
 document.querySelectorAll('.pg').forEach(function(e){const n=SLIDES.findIndex(function(x){return x.meta&&x.meta.sec===e.dataset.pg;});if(n>=0)e.textContent='p. '+String(n+1).padStart(2,'0');});
 document.getElementById('dots').innerHTML=SLIDES.map(function(s,n){return '<i data-i="'+n+'"></i>';}).join('');}
let CURS=0;
function show(i){const L=document.querySelectorAll('.sl');CURS=Math.max(0,Math.min(L.length-1,i));
 L.forEach(function(e,n){e.classList.toggle('on',n===CURS);});
 document.querySelectorAll('#dots i').forEach(function(e,n){e.classList.toggle('on',n===CURS);});
 L[CURS].querySelectorAll('svg.pxs').forEach(function(sv){try{sv.setCurrentTime(0);sv.unpauseAnimations();}catch(e){}});
 try{history.replaceState(null,'',location.pathname+location.search+'#'+(BA?'d='+encodeURIComponent(JSON.stringify(BA))+'&':'')+'s='+(CURS+1));}catch(e){}}
function fit(){const sc=Math.min(innerWidth/1280,(innerHeight-(document.body.classList.contains('embed')?0:44))/720);document.documentElement.style.setProperty('--k',sc);}
function finish(){document.querySelectorAll('svg.pxs').forEach(function(sv){try{sv.setCurrentTime(60);sv.pauseAnimations();}catch(e){}});}
window.addEventListener('resize',fit);
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();show(CURS+1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(CURS-1);}if(e.key==='Home')show(0);if(e.key==='End')show(SLIDES.length-1);});
document.addEventListener('DOMContentLoaded',function(){build();fit();
 document.getElementById('deck').addEventListener('click',function(e){const t=e.target.closest('[data-go]');if(!t)return;const n=SLIDES.findIndex(function(x){return x.meta&&x.meta.sec===t.dataset.go;});if(n>=0)show(n);});
 document.getElementById('home').onclick=function(){show(1);};
 document.getElementById('dots').addEventListener('click',function(e){if(e.target.dataset.i)show(+e.target.dataset.i);});
 document.getElementById('prev').onclick=function(){show(CURS-1);};document.getElementById('next').onclick=function(){show(CURS+1);};
 document.getElementById('prt').onclick=function(){finish();window.print();};
 window.addEventListener('beforeprint',finish);
 const m=/[#&]s=(\d+)/.exec(location.hash);let st0=m?(+m[1]-1):0;
 /* 본판 4번(왜 넓어야)에서 열면 「보장 이해 ③ 넓은 이름」 부터 */
 if(!m&&BA&&BA.mode==='why'){const w=SLIDES.findIndex(function(x){return x.cls==='u3';});if(w>=0)st0=w;}
 show(st0);
 if(BA&&BA.embed)document.body.classList.add('embed');});

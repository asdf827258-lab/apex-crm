<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APEX HB 본부자료실</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --blue:#3182F6; --blue-dark:#1B64DA; --blue-light:#E8F2FF;
  --red:#F04452; --red-bg:#FEF1F2;
  --success:#19B58D; --success-bg:#E7F8F3;
  --yellow:#FFCD2C; --yellow-bg:#FFF9E6;
  --g900:#191F28; --g800:#333D4B; --g700:#4E5968; --g600:#6B7684;
  --g500:#8B95A1; --g400:#B0B8C1; --g300:#D1D6DB; --g200:#E5E8EB;
  --g100:#F9FAFB;
  --bg:#F2F4F6; --white:#FFFFFF;
  --r-sm:12px; --r-md:20px; --r-pill:100px;
  --shadow:0 1px 3px rgba(0,0,0,.04), 0 12px 28px rgba(0,0,0,.035);
  --shadow-sm:0 1px 2px rgba(0,0,0,.03), 0 4px 12px rgba(0,0,0,.03);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,"Malgun Gothic",sans-serif;
  background:var(--bg); color:var(--g900); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
}
a{color:inherit}

/* ── layout ── */
.wrap{display:grid;grid-template-columns:266px 1fr;min-height:100vh}

/* ── sidebar ── */
aside{
  background:var(--white); border-right:1px solid var(--g200);
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column; overflow:hidden;
}
.brand{padding:24px 22px 18px}
.brand .mark{
  display:inline-block;font-size:11px;letter-spacing:.14em;color:var(--blue);
  font-weight:800;margin-bottom:6px
}
.brand h1{margin:0;font-size:20px;font-weight:800;color:var(--g900);letter-spacing:-.035em}
.brand p{margin:6px 0 0;font-size:12px;color:var(--g500)}

.searchbox{padding:0 18px 12px}
.searchbox input{
  width:100%;padding:11px 14px;border-radius:var(--r-sm);border:1px solid var(--g200);
  background:var(--g100);color:var(--g900);font-size:14px;font-family:inherit;outline:none;
  transition:border-color .12s, background .12s
}
.searchbox input::placeholder{color:var(--g400)}
.searchbox input:focus{border-color:var(--blue);background:var(--white)}

nav{flex:1;overflow-y:auto;padding:2px 12px 20px}
nav::-webkit-scrollbar{width:6px}
nav::-webkit-scrollbar-thumb{background:var(--g300);border-radius:3px}
.catrow{
  display:flex;align-items:center;gap:8px;padding:10px 10px 6px;margin:10px 0 2px;
  font-size:11.5px;font-weight:800;letter-spacing:.02em;color:var(--g500);
  border-top:1px solid var(--g200)
}
.catrow:first-child{border-top:0;margin-top:0}
.navitem{
  display:block;padding:9px 12px;border-radius:var(--r-sm);font-size:14px;color:var(--g700);
  cursor:pointer;border:0;background:none;width:100%;text-align:left;font-family:inherit;
  line-height:1.4;font-weight:500;letter-spacing:-.015em
}
.navitem:hover{background:var(--g100);color:var(--g900)}
.navitem.on{background:var(--blue-light);color:var(--blue-dark);font-weight:700}
.navitem small{display:block;font-size:11.5px;color:var(--g500);font-weight:400;margin-top:2px}
.navitem.on small{color:var(--blue)}

.foot{padding:14px 22px;font-size:11.5px;color:var(--g500);border-top:1px solid var(--g200)}

/* ── main ── */
main{padding:38px 44px 90px;max-width:1080px}
.crumb{font-size:12.5px;color:var(--g500);margin-bottom:10px;font-weight:600}
h2.title{margin:0;font-size:30px;font-weight:800;letter-spacing:-.045em;line-height:1.28;color:var(--g900)}
.sub{margin:10px 0 0;color:var(--g600);font-size:15px}
.sub b{color:var(--g800)}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 26px}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:var(--r-sm);
  border:1px solid var(--g200);background:var(--white);color:var(--g800);font-size:14px;
  font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit;letter-spacing:-.02em;
  transition:background .12s,border-color .12s
}
.btn:hover{background:var(--g100);border-color:var(--g300)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}

.tagline{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 24px}
.tag{
  font-size:12px;padding:5px 12px;border-radius:var(--r-pill);background:var(--white);
  color:var(--g600);font-weight:500
}

section.blk{
  background:var(--white);border-radius:var(--r-md);box-shadow:var(--shadow-sm);
  padding:24px 26px;margin-bottom:14px
}
section.blk > h3{
  margin:0 0 14px;font-size:16px;font-weight:800;color:var(--g900);
  letter-spacing:-.03em;display:flex;align-items:center;gap:9px
}
section.blk > h3::before{
  content:"";width:3px;height:16px;background:var(--blue);border-radius:2px;flex:none
}
/* 홈 화면의 카테고리 묶음 — 배경 위에 카드만 뜨게 */
section.blk.open{background:transparent;box-shadow:none;padding:4px 2px 12px;margin-bottom:22px}
section.blk.open > h3{font-size:17px;margin-bottom:12px}

ul.plain{margin:0;padding:0;list-style:none}
ul.plain li{
  position:relative;padding:8px 0 8px 18px;border-bottom:1px solid var(--g200);
  font-size:14.5px;color:var(--g700)
}
ul.plain li:last-child{border-bottom:0}
ul.plain li b{color:var(--g900);font-weight:700}
ul.plain li::before{
  content:"";position:absolute;left:2px;top:16px;width:5px;height:5px;
  border-radius:50%;background:var(--blue)
}

ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{
  counter-increment:s;position:relative;padding:10px 0 10px 40px;
  border-bottom:1px solid var(--g200);font-size:14.5px;color:var(--g700)
}
ol.steps li:last-child{border-bottom:0}
ol.steps li b{color:var(--g900);font-weight:700}
ol.steps li::before{
  content:counter(s);position:absolute;left:0;top:10px;width:26px;height:26px;
  border-radius:50%;background:var(--blue-light);color:var(--blue-dark);
  font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center
}

.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th,td{border:1px solid var(--g200);padding:10px 12px;text-align:left;vertical-align:top;color:var(--g700)}
th{background:var(--g100);font-weight:700;color:var(--g800);white-space:nowrap}
td b{color:var(--g900);font-weight:700}

.caution{
  background:var(--red-bg);border-radius:var(--r-sm);
  padding:15px 18px;font-size:14px;color:#B3313C;margin-bottom:14px;line-height:1.6
}
.caution b{color:var(--red);font-weight:700}
.caution code{background:rgba(240,68,82,.1);padding:2px 6px;border-radius:6px;font-size:12.5px}

.filecard{
  display:flex;align-items:center;gap:14px;background:var(--white);border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);padding:16px 18px;margin-bottom:14px
}
.filecard .ic{
  width:42px;height:42px;border-radius:var(--r-sm);background:var(--blue-light);color:var(--blue-dark);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none
}
.filecard .nm{flex:1;min-width:0}
.filecard .nm div{font-size:14px;font-weight:600;word-break:break-all;color:var(--g900)}
.filecard .nm small{color:var(--g500);font-size:12px}

/* ── 환수율 위젯 ── */
.hw{background:var(--white);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:24px 26px;margin-bottom:14px}
.hw h3{margin:0 0 5px;font-size:17px;font-weight:800;color:var(--g900);letter-spacing:-.03em}
.hw .hint{font-size:13.5px;color:var(--g500);margin:0 0 16px}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{
  padding:8px 20px;border-radius:var(--r-pill);border:1px solid var(--g200);background:var(--white);
  font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--g600)
}
.seg button:hover{background:var(--g100)}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.chip{
  padding:7px 14px;border-radius:var(--r-pill);border:1px solid var(--g200);background:var(--white);
  font-size:13px;cursor:pointer;font-family:inherit;color:var(--g700);font-weight:500;
  transition:background .12s,border-color .12s
}
.chip:hover{background:var(--g100);border-color:var(--g300)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
#hwOut table{min-width:660px;font-size:13px}
#hwOut th,#hwOut td{padding:7px 8px;text-align:center;white-space:nowrap}
#hwOut td:first-child,#hwOut th:first-child{
  text-align:left;position:sticky;left:0;background:var(--white);z-index:1;
  min-width:158px;white-space:normal;font-weight:600;color:var(--g800)
}
#hwOut th:first-child{background:var(--g100)}
#hwOut td.v100{background:var(--red-bg);color:var(--red);font-weight:700}
#hwOut td.v0{background:var(--success-bg);color:var(--success);font-weight:700}
#hwOut .note{font-size:13px;color:var(--g600);margin-top:12px;padding-left:2px;line-height:1.6}

/* ── 카드 그리드 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:12px}
.card{
  background:var(--white);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:18px 20px;
  cursor:pointer;text-align:left;font-family:inherit;font-size:14px;border:0;
  transition:box-shadow .14s, transform .14s
}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card .k{font-size:11.5px;color:var(--blue);font-weight:800;letter-spacing:.02em}
.card h4{margin:6px 0 5px;font-size:15.5px;font-weight:700;letter-spacing:-.03em;color:var(--g900)}
.card p{margin:0;font-size:13px;color:var(--g500);line-height:1.55}
.empty{color:var(--g500);padding:48px 0;text-align:center}
mark{background:var(--yellow-bg);color:var(--g900);padding:1px 3px;border-radius:5px;font-weight:600}

@media (max-width:880px){
  .wrap{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--g200)}
  nav{max-height:none}
  main{padding:26px 18px 60px}
  h2.title{font-size:25px}
}
@media print{
  aside,.tools{display:none}
  .wrap{display:block}
  main{max-width:none;padding:0}
  section.blk,.hw,.filecard{break-inside:avoid;box-shadow:none;border:1px solid var(--g200);padding:14px 16px}
  body{background:#fff;font-size:11pt}
}
</style>
</head>
<body>
<div class="wrap">

  <aside>
    <div class="brand">
      <span class="mark">APEX HB</span>
      <h1>A+본부자료실</h1>
      <p>본부 운영자료 <span id="cnt"></span>건 · <span id="upd"></span> 기준</p>
    </div>
    <div class="searchbox">
      <input id="q" type="search" placeholder="검색 — 예: DB신청, 환수율, 장학금" autocomplete="off">
    </div>
    <nav id="nav"></nav>
    <div class="foot">원본 파일 20개는 바로 열립니다. 강의용 PPT 2개는 용량이 커서 본부 카톡 원본을 받으십시오.</div>
  </aside>

  <main id="main"></main>
</div>

<script src="자료.js"></script>
<script src="환수율_202608.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('cnt').textContent = HQ.items.length;
document.getElementById('upd').textContent = HQ.updated;

/* 원본 파일 링크 — 한글 파일명 인코딩 */
const fileHref = f => '원본/' + encodeURIComponent(f);
const extOf = f => (f.split('.').pop() || '').toUpperCase();

/* 용량이 커서 함께 담지 않은 원본 두 개.
   CRM 에 올리면 저장소가 무거워지고, 눌러도 몇 분씩 받아야 해서 아무도 안 엽니다.
   파일 이름은 그대로 보여 주되 링크는 걸지 않습니다 — 본부 카톡에서 받으십시오. */
const NOFILE = [
  "260807_무경력 CIS_(찐최종).pptx",
  "(강의용) 한눈에 보는 간편추천 플러스_소현도 프로_V1.pptx"
];
const hasFile = f => !!f && NOFILE.indexOf(f) === -1;

/* ── 사이드바 ── */
function buildNav(){
  let h = '';
  HQ.cats.forEach(c => {
    const its = HQ.items.filter(i => i.cat === c.id);
    if(!its.length) return;
    h += `<div class="catrow"><span>${c.icon}</span>${esc(c.name)}</div>`;
    its.forEach(i => {
      h += `<button class="navitem" data-id="${i.id}">${esc(i.title)}<small>${esc(i.sub)}</small></button>`;
    });
  });
  $('#nav').innerHTML = h;
  $('#nav').onclick = e => {
    const b = e.target.closest('.navitem');
    if(b) show(b.dataset.id);
  };
}

/* ── 본문 렌더 ── */
function renderBody(body){
  return body.map(b => {
    if(b.caution) return `<div class="caution">${b.caution}</div>`;
    let inner = '';
    if(b.steps) inner = `<ol class="steps">${b.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`;
    else if(b.list) inner = `<ul class="plain">${b.list.map(s=>`<li>${s}</li>`).join('')}</ul>`;
    else if(b.table){
      inner = `<div class="tblwrap"><table><thead><tr>${
        b.table.head.map(x=>`<th>${x}</th>`).join('')
      }</tr></thead><tbody>${
        b.table.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')
      }</tbody></table></div>`;
    }
    return `<section class="blk">${b.h?`<h3>${esc(b.h)}</h3>`:''}${inner}</section>`;
  }).join('');
}

function show(id){
  const it = HQ.items.find(i => i.id === id);
  if(!it) return;
  document.querySelectorAll('.navitem').forEach(n => n.classList.toggle('on', n.dataset.id === id));
  const cat = HQ.cats.find(c => c.id === it.cat);

  let h = `<div class="crumb">${cat.icon} ${esc(cat.name)}</div>
    <h2 class="title">${esc(it.title)}</h2>
    <p class="sub">${esc(it.sub)}</p>
    <div class="tools">
      ${hasFile(it.file) ? `<a class="btn pri" href="${fileHref(it.file)}" target="_blank">📄 원본 열기</a>` : ''}
      ${it.link ? `<a class="btn" href="${it.link}" target="_blank">🔗 사이트 바로가기</a>` : ''}
      <button class="btn" onclick="window.print()">🖨 인쇄</button>
    </div>
    <div class="tagline">${it.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;

  if(it.file){
    h += `<div class="filecard">
      <div class="ic">${extOf(it.file)}</div>
      <div class="nm"><div>${esc(it.file)}</div><small>${hasFile(it.file) ? '원본/ 폴더' : '용량이 커서 함께 담지 않았습니다 — 본부 카톡 원본을 받으십시오'}</small></div>
      ${hasFile(it.file) ? `<a class="btn" href="${fileHref(it.file)}" target="_blank">열기</a>` : ''}
    </div>`;
  }

  h += renderBody(it.body);
  if(it.widget === 'hwansu') h += hwansuHTML();

  $('#main').innerHTML = h;
  if(it.widget === 'hwansu') initHwansu();
  if(location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  window.scrollTo(0,0);
}

/* ── 환수율 위젯 ── */
function hwansuHTML(){
  return `<div class="hw">
    <h3>환수율 조회 — ${esc(HWANSU.기준월)}</h3>
    <p class="hint">회사를 고르면 유지회차별 환수율이 뜹니다. 표는 가로로 넘겨서 보세요.</p>
    <div class="seg">
      <button data-sec="생보" class="on">생보</button>
      <button data-sec="손보">손보</button>
    </div>
    <div class="chips" id="hwChips"></div>
    <div id="hwOut"></div>
  </div>`;
}
let hwSec = '생보', hwCo = null;
function initHwansu(){
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    hwSec = b.dataset.sec; hwCo = null;
    document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
    drawChips();
  });
  drawChips();
}
function drawChips(){
  const list = HWANSU.표.filter(c => c.section === hwSec);
  if(!hwCo) hwCo = list[0].company;
  $('#hwChips').innerHTML = list.map(c =>
    `<button class="chip${c.company===hwCo?' on':''}" data-co="${esc(c.company)}">${esc(c.company)}</button>`
  ).join('');
  $('#hwChips').onclick = e => {
    const b = e.target.closest('.chip');
    if(!b) return;
    hwCo = b.dataset.co; drawChips();
  };
  drawTable();
}
function drawTable(){
  const c = HWANSU.표.find(x => x.section === hwSec && x.company === hwCo);
  if(!c){ $('#hwOut').innerHTML=''; return; }
  const cell = v => {
    if(!v) return '<td>–</td>';
    const cls = v === '100%' ? ' class="v100"' : (v === '0%' ? ' class="v0"' : '');
    return `<td${cls}>${v}</td>`;
  };
  $('#hwOut').innerHTML = `<div class="tblwrap"><table>
    <thead><tr><th>유지 회차</th>${c.cols.map(n=>`<th>${n}</th>`).join('')}</tr></thead>
    <tbody>${c.rows.map(r=>`<tr><td>${esc(r.label)}</td>${r.values.map(cell).join('')}</tr>`).join('')}</tbody>
  </table></div>` + c.notes.map(n=>`<div class="note">${esc(n)}</div>`).join('');
}

/* ── 검색 ── */
function searchText(it){
  const parts = [it.title, it.sub, it.tags.join(' ')];
  it.body.forEach(b => {
    if(b.h) parts.push(b.h);
    if(b.list) parts.push(b.list.join(' '));
    if(b.steps) parts.push(b.steps.join(' '));
    if(b.caution) parts.push(b.caution);
    if(b.table){ parts.push(b.table.head.join(' ')); b.table.rows.forEach(r=>parts.push(r.join(' '))); }
  });
  return parts.join(' ').replace(/<[^>]+>/g,'');
}
HQ.items.forEach(i => i._txt = searchText(i));

function showSearch(q){
  document.querySelectorAll('.navitem').forEach(n => n.classList.remove('on'));
  const key = q.trim().toLowerCase();
  const hits = HQ.items.filter(i => i._txt.toLowerCase().includes(key));
  let h = `<div class="crumb">검색</div><h2 class="title">“${esc(q)}” — ${hits.length}건</h2>
    <p class="sub">제목·태그뿐 아니라 본문 내용까지 찾습니다.</p><div style="height:22px"></div>`;
  if(!hits.length){
    h += `<div class="empty">찾는 내용이 없습니다. 다른 낱말로 검색해 보세요.</div>`;
  } else {
    h += `<div class="grid">${hits.map(i=>{
      const cat = HQ.cats.find(c=>c.id===i.cat);
      const idx = i._txt.toLowerCase().indexOf(key);
      let snip = '';
      if(idx > -1){
        const s = Math.max(0, idx-32);
        snip = (s?'…':'') + esc(i._txt.slice(s, idx)) + '<mark>' + esc(i._txt.substr(idx, key.length)) + '</mark>' + esc(i._txt.slice(idx+key.length, idx+key.length+64)) + '…';
      }
      return `<button class="card" data-id="${i.id}">
        <div class="k">${cat.icon} ${esc(cat.name)}</div>
        <h4>${esc(i.title)}</h4><p>${snip || esc(i.sub)}</p></button>`;
    }).join('')}</div>`;
  }
  $('#main').innerHTML = h;
  $('#main').onclick = e => { const b = e.target.closest('.card'); if(b) show(b.dataset.id); };
  window.scrollTo(0,0);
}

/* ── 홈 ── */
function home(){
  document.querySelectorAll('.navitem').forEach(n => n.classList.remove('on'));
  if(location.hash) history.replaceState(null, '', location.pathname);
  let h = `<div class="crumb">APEX HB 사업단</div>
    <h2 class="title">본부 운영자료를 한 곳에서</h2>
    <p class="sub">카톡으로 흩어져 오던 본부 자료 ${HQ.items.length}건을 항목별로 정리하고, 각 자료의 <b>실제 절차·기준</b>을 본문으로 옮겨 두었습니다. 원본 파일은 자료마다 <b>📄 원본 열기</b>로 바로 열립니다.</p>
    <div class="tools"><button class="btn" onclick="window.print()">🖨 인쇄</button></div>`;
  HQ.cats.forEach(c => {
    const its = HQ.items.filter(i => i.cat === c.id);
    if(!its.length) return;
    h += `<section class="blk open"><h3>${c.icon} ${esc(c.name)}</h3>
      <div class="grid">${its.map(i=>`<button class="card" data-id="${i.id}">
        <h4>${esc(i.title)}</h4><p>${esc(i.sub)}</p></button>`).join('')}</div></section>`;
  });
  $('#main').innerHTML = h;
  $('#main').onclick = e => { const b = e.target.closest('.card'); if(b) show(b.dataset.id); };
}

let t = null;
$('#q').addEventListener('input', e => {
  clearTimeout(t);
  const v = e.target.value;
  t = setTimeout(() => v.trim() ? showSearch(v) : home(), 160);
});

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  if(id && HQ.items.some(i => i.id === id)) show(id); else home();
}
window.addEventListener('hashchange', route);

buildNav();
route();
</script>
</body>
</html>

}
function wonRaw(v){              /* 칸에 친 글자에서 쉼표·공백·「원」 을 지운다 */
  return String(v===null||v===undefined?'':v).replace(/[,\s원]/g,'');
}
function manOfWon(v){            /* 칸에 친 <b>원</b> 글자 → 담을 <b>만원</b> 값 */
  var w=krWon(v),n=(w!==null)?w:num(wonRaw(v)); if(n===null)return '';

function wonEcho(v){             /* 되읽기 — 「= 12만 4,000원」 (지어내지 않고 친 수 그대로) */
  var w=krWon(v),n=(w!==null)?w:num(wonRaw(v)); if(n===null||!isFinite(n))return '';
  var neg=n<0; n=Math.round(Math.abs(n));

  var e=Math.floor(n/100000000), m=Math.floor((n%100000000)/10000), r=n%10000, t='';

  if(m)t+=(t?' ':'')+m.toLocaleString()+'만';
  if(r||!t)t+=(t?' ':'')+r.toLocaleString();
  return '= '+(neg?'-':'')+t+'원';
}

     「3만원」 · 「30,000원」 처럼 <b>원</b> 을 붙이면 원으로 읽습니다(일당 3만원 → 3).
   ★ 쉼표를 지웁니다 — 담보 칸에 「5,000」 을 치면 전에는 5 가 됐습니다(천 배). */
function krWon(v){               /* 「450만」「1억2천만」「5만2천원」 → 원. 억 · 만 · 천 · 백 · 십 이 없으면 null */
  var t=String(v===null||v===undefined?'':v).replace(/[,\s]/g,'').replace(/원$/,'');
  if(!/[억만천백십]/.test(t)||!/^[0-9.억만천백십]+$/.test(t))return null;
  var tot=0,sec=0,re=/(\d+(?:\.\d+)?)?([억만천백십])?/g,m;
  while((m=re.exec(t))&&m[0]){
    var x=(m[1]===undefined)?null:parseFloat(m[1]),u=m[2];
    if(!isFinite(x)&&x!==null)return null;
    if(u==='억'||u==='만'){tot+=(sec+(x===null?(sec?0:1):x))*(u==='억'?1e8:1e4);sec=0;}
    else if(u==='천')sec+=(x===null?1:x)*1000;
    else if(u==='백')sec+=(x===null?1:x)*100;
    else if(u==='십')sec+=(x===null?1:x)*10;
    else sec+=x;
  }
  tot+=sec;
  return isFinite(tot)?Math.round(tot):null;
}
function covIn(v){               /* 담보 칸에 친 글자 → 담을 <b>만원</b> 글자. 못 읽으면 친 그대로 */
  var s0=String(v===null||v===undefined?'':v).trim(); if(s0==='')return '';
  var t=s0.replace(/[,\s]/g,'');
  if(/^\d+(?:\.\d+)?$/.test(t))return t;                                   /* 맨 숫자 = 만원 (전과 같음) */
  var a=t.match(/^(\d+(?:\.\d+)?)원$/);if(a)return String(Math.round(parseFloat(a[1])/100)/100);
  var w=/^[0-9.천백십]+$/.test(t)?krWon(t+'만'):krWon(t);                  /* 「3천」 = 3천만원 */
  if(w===null)return s0;
  return String(Math.round(w/100)/100);
}
function covFix(el){var c=covIn(el.value);if(c!==el.value)el.value=c;}
/* 되읽기 글만 갈아 끼운다 — 칸은 다시 안 그린다(커서가 튄다) */

function setPolWon(sd,i,k,el){ setPol(sd,i,k,manOfWon(el.value)); wonEchoPut('we_'+sd+'_'+i+'_'+k,el.value); }
/* 돈 칸 하나를 통째로 내준다 — 네 자리가 같은 모양이어야 한다 (5번) */

function amt(k,v){if(v===null||v===undefined||!isFinite(v))return '—';
  var u=UNIT[k]||'L';
  if(u==='D')return man(v)+'원/일';
  if(u==='M')return man(v)+'원/월';
  if(u==='A')return man(v)+'원 한도';
  return man(v)+'원';}
function pct(v){return (v===null||v===undefined||!isFinite(v))?'—':(Math.round(v)+'%');}


/* ── 납입 셈 ─────────────────────────────────────────────────────
   총 납입 = 월 보험료 × 납입기간(개월).  가입시기로 <b>이미 낸 것</b>과
   <b>앞으로 낼 것</b>을 가른다. 해지해도 <b>이미 낸 돈은 안 돌아온다</b> —
   그래서 「앞으로 낼 돈」이 실제 의사결정의 자다.
   월 보험료가 올라도 <b>앞으로 낼 돈은 줄어드는</b> 일이 실제로 있다.  */
function ymMonths(start){
  var m=(''+(start||'')).match(/^(\d{4})[-.\/ ]?(\d{1,2})/);
  if(!m)return null;
  var y=+m[1],mo=+m[2],d=new Date();
  return Math.max(0,(d.getFullYear()-y)*12+(d.getMonth()+1-mo));
}
function payCalc(pol,which){
  var prem=num((which==='after'&&pol.act==='endo'&&pol.premMan2!=='')?pol.premMan2:pol.premMan);
  var yrs=num(pol.years),mTot=(yrs!==null&&yrs>0)?Math.round(yrs*12):null;
  var gone=ymMonths(pol.start);
  var paidM=(mTot!==null&&gone!==null)?Math.min(mTot,gone):null;
  var leftM=(mTot!==null&&paidM!==null)?(mTot-paidM):null;
  return {prem:prem,mTot:mTot,paidM:paidM,leftM:leftM,
    total:(prem!==null&&mTot!==null)?prem*mTot:null,
    paid:(prem!==null&&paidM!==null)?prem*paidM:null,
    left:(prem!==null&&leftM!==null)?prem*leftM:null,
    done:(mTot!==null&&paidM!==null&&paidM>=mTot)};
}
/* ── 보험료 셈 ─────────────────────────────────────────────────────
   <b>못 센 것을 0 으로 적지 않는다</b> (1번). 납입기간을 안 적은 계약만
   있으면 「앞으로 낼 돈」은 <b>모름</b>이지 0 이 아니다. 0 으로 적으면
   화면이 「앞으로 낼 돈 0원」이라고 말하고, 설계사는 고객 앞에서 그것을
   그대로 읽는다 — 새빨간 거짓말이 된다. 실제로 그렇게 찍히고 있었다.

   그래서 <b>몇 건을 실제로 셌는지</b>(nXxx)를 같이 들고 다닌다.
     · 한 건도 못 셌으면 <b>null</b>
     · 몇 건만 셌으면 값은 주되 <b>「N건은 빠졌습니다」</b>를 화면에 적는다 */
/* ── 전에 넣어 둔 KB 계약 되살리기 ─────────────────────────────────
   kbApply 는 <b>올릴 때 한 번만</b> 돈다. 그 전에 넣어 둔 계약은 가입
   시기·납입기간이 빈칸인 채로 남아, 사장님이 <b>다시 올리기 전까지</b>
   「앞으로 낼 돈」이 안 뜬다. 읽어 둔 원본(S.kbRaw)이 그대로 있으니
   <b>열 때 한 번</b> 채워 준다.

   ■ 사장님이 <b>손으로 적어 둔 값은 안 건드린다.</b> 빈칸만 채운다.
   ■ 원본이 없으면 아무것도 안 한다 — 지어내지 않는다.             */
function kbBackfill(){
  var K=S.kbRaw;
  if(!K||!K.contracts||!K.contracts.length)return 0;
  var age=(K.person&&K.person.age)||null,hit=0;
  S.before.forEach(function(pol){
    if(!pol.kb)return;
    if(pol.start&&pol.years)return;
    var c=null,i;
    for(i=0;i<K.contracts.length;i++){
      var x=K.contracts[i];
      if((x.co||'')===(pol.co||'')&&(x.nm||'')===(pol.nm||'')){c=x;break;}
    }
    if(!c)return;
    if(!pol.start&&c.issue){pol.start=(''+c.issue).slice(0,7);hit++;}
    if(!pol.years){var y=kbYears(c.payTerm,c.term,age);if(y!==null){pol.years=String(y);hit++;}}
  });
  if(hit)save();
  return hit;
}
function premCalc(){
  var o={monB:0,monA:0,leftB:0,leftA:0,totB:0,totA:0,paidSunk:0,
         nMonB:0,nMonA:0,nLeftB:0,nLeftA:0,nTotB:0,nTotA:0,nPaid:0,
         noPremB:0,noPremA:0,noTermB:0,noTermA:0,rows:[]};
  S.before.forEach(function(pol){
    var a=pol.act||'keep',b=payCalc(pol,'before'),af=payCalc(pol,'after');
    var r={pol:pol,side:'before',act:a,b:b,a:af};
    if(b.prem===null)o.noPremB++;else if(!b.done){o.monB+=b.prem;o.nMonB++;}else o.nMonB++;
    if(b.left===null){if(b.prem!==null)o.noTermB++;}else{o.leftB+=b.left;o.nLeftB++;}
    if(b.total!==null){o.totB+=b.total;o.nTotB++;}
    if(b.paid!==null){o.paidSunk+=b.paid;o.nPaid++;}
    if(a==='cancel'){
      r.aMon=0;r.aLeft=0;r.aTot=(b.paid===null?null:b.paid);
      o.nMonA++;o.nLeftA++;
      if(b.paid!==null){o.totA+=b.paid;o.nTotA++;}
    }else{
      var pr=(a==='endo')?af.prem:b.prem;
      var lf=(a==='endo')?af.left:b.left, tt=(a==='endo')?af.total:b.total;
      r.aMon=pr;r.aLeft=lf;r.aTot=tt;
      if(pr===null)o.noPremA++;else if(!b.done){o.monA+=pr;o.nMonA++;}else o.nMonA++;
      if(lf===null){if(pr!==null)o.noTermA++;}else{o.leftA+=lf;o.nLeftA++;}
      if(tt!==null){o.totA+=tt;o.nTotA++;}
    }
    o.rows.push(r);
  });
  S.after.forEach(function(pol){
    var c=payCalc(pol,'after');
    o.rows.push({pol:pol,side:'after',act:'new',b:null,a:c,aMon:c.prem,aLeft:c.left,aTot:c.total});
    if(c.prem===null)o.noPremA++;else{o.monA+=c.prem;o.nMonA++;}
    if(c.left===null){if(c.prem!==null)o.noTermA++;}else{o.leftA+=c.left;o.nLeftA++;}
    if(c.total!==null){o.totA+=c.total;o.nTotA++;}
  });
  /* 한 건도 못 셌으면 <b>모름</b>으로 돌려준다 — 0 이 아니다 */
  if(!o.nMonB)o.monB=null;   if(!o.nMonA)o.monA=null;
  if(!o.nLeftB)o.leftB=null; if(!o.nLeftA)o.leftA=null;
  if(!o.nTotB)o.totB=null;   if(!o.nTotA)o.totA=null;
  if(!o.nPaid)o.paidSunk=null;
  /* <b>짝이 안 맞으면 견줄 수 없다.</b> 한쪽이 모름인데 다른 쪽만 세우면
     「전 — → 후 0원」 처럼 <b>줄었다</b>는 뜻으로 읽힌다. 둘 다 모름으로 둔다. */
  if(o.monB===null||o.monA===null){o.monB=null;o.monA=null;}
  if(o.leftB===null||o.leftA===null){o.leftB=null;o.leftA=null;}
  if(o.totB===null||o.totA===null){o.totB=null;o.totA=null;}
  function d(a,b){return (a===null||b===null)?null:(a-b);}
  o.monD=d(o.monA,o.monB);o.leftD=d(o.leftA,o.leftB);o.totD=d(o.totA,o.totB);
  return o;
}

/* ═══════════════ 셈 ═══════════════
   유지 → 담보 그대로 후에.  배서 → 후 칸을 따로 적은 것만.  해지 → 후에서 뺌.  */
function autoCalc(){
  var b={},a={},i,k,pb=0,pa=0,pbN=0,paN=0;
  function add(t,cov){for(k in cov)if(cov.hasOwnProperty(k)){var v=num(cov[k]);if(v===null)continue;t[k]=(t[k]||0)+v;}}
  for(i=0;i<S.before.length;i++){
    var p=S.before[i],act=p.act||'keep';
    add(b,p.cov);
    if(num(p.premMan)!==null)pb+=num(p.premMan);else pbN++;
    if(act==='keep'){ add(a,p.cov); if(num(p.premMan)!==null)pa+=num(p.premMan);else paN++; }
    else if(act==='endo'){
      /* 배서 — 계약은 남고 <b>담보만</b> 바뀐다. 후 칸에 적으신 것이 후가 된다 */
      add(a,p.cov2||{});
      var pm2=(p.premMan2!==''&&p.premMan2!==undefined)?num(p.premMan2):num(p.premMan);
      if(pm2!==null)pa+=pm2;else paN++;
    }
  }
  for(i=0;i<S.after.length;i++){
    var q=S.after[i];
    add(a,q.cov);
    if(num(q.premMan)!==null)pa+=num(q.premMan);else paN++;
  }
  return {b:b,a:a,premB:pb,premA:pa,premBn:pbN,premAn:paN};
}
function calc(){
  var A=autoCalc(),b={},a={},k;
  for(k in A.b)b[k]=A.b[k];
  for(k in A.a)a[k]=A.a[k];
  for(k in S.man.b)if(S.man.b.hasOwnProperty(k)){var v=num(S.man.b[k]);if(v!==null)b[k]=v;else delete b[k];}
  for(k in S.man.a)if(S.man.a.hasOwnProperty(k)){var w=num(S.man.a[k]);if(w!==null)a[k]=w;else delete a[k];}
  return {b:b,a:a,auto:A,premB:A.premB,premA:A.premA,premBn:A.premBn,premAn:A.premAn};
}
function diff(C){
  var loss=[],gain=[],k,seen={};
  for(k in C.b)seen[k]=1;for(k in C.a)seen[k]=1;
  for(k in seen)if(seen.hasOwnProperty(k)){
    var bb=C.b[k]||0,aa=C.a[k]||0;
    if(aa<bb)loss.push({k:k,v:bb-aa,b:bb,a:aa});
    else if(aa>bb)gain.push({k:k,v:aa-bb,b:bb,a:aa});
  }
  loss.sort(function(x,y){return y.v-x.v;});gain.sort(function(x,y){return y.v-x.v;});
  return {loss:loss,gain:gain};
}
/* 부위별 — <b>최대</b>(다 열릴 때)와 <b>평균</b>(범위 % 반영) 둘 다 낸다 */
function partCalc(pt,C){
  var keys=[],i,j;
  for(i=0;i<STD.length;i++){ if(pt.mids.indexOf(STD[i].mid)<0)continue;
    for(j=0;j<STD[i].rows.length;j++)keys.push(STD[i].rows[j].k); }
  var o={keys:keys,maxB:0,maxA:0,expB:0,expA:0,dayB:0,dayA:0,monB:0,monA:0,rows:[]};
  keys.forEach(function(k){
    var b=C.b[k],a=C.a[k],u=UNIT[k],cv=COV[k];
    o.rows.push({k:k,b:b,a:a});
    if(u==='D'){o.dayB+=b||0;o.dayA+=a||0;return;}
    if(u==='M'){o.monB+=b||0;o.monA+=a||0;return;}
    if(u==='A')return;                       /* 한도는 금액으로 안 더한다 */
    o.maxB+=b||0;o.maxA+=a||0;
    var r=(cv===null||cv===undefined)?1:(cv/100);
    o.expB+=(b||0)*r;o.expA+=(a||0)*r;
  });
  o.hasCov=keys.some(function(k){return COV[k];});
  return o;
}
function evCalc(ev,C){
  var cost=num(S.scen[ev.k].cost),days=num(S.scen[ev.k].days),off=num(S.scen[ev.k].off);
  function sum(t,keys,useCov){var s=0,n=0,i;for(i=0;i<(keys||[]).length;i++){
    var v=t[keys[i]];if(v===undefined||v===null)continue;
    var r=useCov?((COV[keys[i]]===null||COV[keys[i]]===undefined)?1:COV[keys[i]]/100):1;
    s+=v*r;n++;}return {v:s,n:n};}
  var lb=sum(C.b,ev.lump),la=sum(C.a,ev.lump);
  var eb=sum(C.b,ev.lump,1),ea=sum(C.a,ev.lump,1);
  var db=sum(C.b,ev.day),da=sum(C.a,ev.day);
  var mb=sum(C.b,ev.month),ma=sum(C.a,ev.month);
  var dayB=(days!==null&&days>0)?db.v*days:null,dayA=(days!==null&&days>0)?da.v*days:null;
  var totB=lb.v+(dayB||0),totA=la.v+(dayA||0);
  var expB=eb.v+(dayB||0),expA=ea.v+(dayA||0);
  return {cost:cost,days:days,off:off,lumpB:lb.v,lumpA:la.v,expLB:eb.v,expLA:ea.v,nB:lb.n,nA:la.n,
    dayPerB:db.v,dayPerA:da.v,dayB:dayB,dayA:dayA,monB:mb.v,monA:ma.v,
    totB:totB,totA:totA,expB:expB,expA:expA,
    rateB:(cost>0)?(totB/cost*100):null,rateA:(cost>0)?(totA/cost*100):null,
    eRateB:(cost>0)?(expB/cost*100):null,eRateA:(cost>0)?(expA/cost*100):null,
    gapB:(cost>0)?Math.max(0,cost-totB):null,gapA:(cost>0)?Math.max(0,cost-totA):null,
    eGapA:(cost>0)?Math.max(0,cost-expA):null};
}
/* ── 경제활동기 ─────────────────────────────────────────────────
   사건이 왔을 때 <b>준비된 돈이 이 집을 몇 달 버티게 하는가</b>.
   버티는 달 = (준비된 목돈 − 치료비) ÷ 월 생활비.  치료비를 못 대면 0 이다. */
function lifeCalc(C){
  var age=num(S.who.age),ret=num(S.who.retire),life=num(S.who.life)||85;
  var inc=num(S.who.incMan),exp=num(S.who.expMan);
  var o={age:age,ret:ret,life:life,inc:inc,exp:exp,ok:(age!==null&&ret!==null&&exp!==null),ev:[]};
  o.workYears=(age!==null&&ret!==null)?Math.max(0,ret-age):null;
  o.afterYears=(ret!==null)?Math.max(0,life-ret):null;
  o.kids=(S.fam||[]).map(function(f){
    var a=num(f.age);return {rel:f.rel,age:a,until:(a===null?null:Math.max(0,22-a))};
  }).filter(function(f){return f.age!==null;});
  EVENTS.forEach(function(ev){
    var r=evCalc(ev,C),cost=r.cost,offM=r.off;
    var e={k:ev.k,t:ev.t,ic:ev.ic,cost:cost,off:offM,
      keepB:null,keepA:null,needM:null,lostInc:null};
    if(exp>0){
      if(cost!==null&&cost>0){
        e.keepB=Math.max(0,(r.totB-cost))/exp;
        e.keepA=Math.max(0,(r.totA-cost))/exp;
        e.eKeepA=Math.max(0,(r.expA-cost))/exp;
        e.payB=(r.totB>=cost);e.payA=(r.totA>=cost);
      }else{ e.keepB=r.totB/exp; e.keepA=r.totA/exp; e.eKeepA=r.expA/exp; e.payB=null;e.payA=null; }
    }
    if(offM!==null&&inc!==null)e.lostInc=inc*offM;
    e.needM=offM;
    o.ev.push(e);
  });
  return o;
}
function tally(){
  var t={pols:S.before.length+S.after.length,rows:0,no:0,keep:0,endo:0,cancel:0},i,j;
  S.before.forEach(function(p){
    var a=p.act||'keep';
    if(a==='keep')t.keep++;else if(a==='endo')t.endo++;else t.cancel++;
    for(j in p.cov)if(p.cov.hasOwnProperty(j)&&num(p.cov[j])!==null)t.rows++;
  });
  S.after.forEach(function(p){for(j in p.cov)if(p.cov.hasOwnProperty(j)&&num(p.cov[j])!==null)t.rows++;});
  if(S.kbRaw)S.kbRaw.contracts.forEach(function(c){(c.covs||[]).forEach(function(v){
    if(!mapName(v.std||v.raw)&&!mapName(v.raw))t.no++;});});
  return t;
}


/* ── 사건 시뮬레이션 ─────────────────────────────────────────────
   「암이 오면 무슨 일이 벌어지고, 그때 <b>지금</b> 얼마 나오고 <b>조정 후</b>
   얼마 나오는가」를 단계로 푼다. 단계 비용은 기준 치료비를 <b>비중</b>으로
   나눈 것이다 — 나눈 값이라는 사실을 화면에 적는다.               */
function simCalc(ev,C){
  var cost=num(S.scen[ev.k].cost),days=num(S.scen[ev.k].days)||0;
  var out={cost:cost,days:days,steps:[],totB:0,totA:0,needTot:0};
  if(cost===null||!(cost>0))return out;
  (ev.sim||[]).forEach(function(st){
    var need=Math.round(cost*st.w);
    var b=0,a=0,payB=[],payA=[],act=0;
    st.pay.forEach(function(k){
      var u=UNIT[k];
      if(u==='A'){act++;return;}                       /* 실손은 금액으로 안 바꾼다 */
      var vb=C.b[k],va=C.a[k];
      /* 하루치는 <b>그 단계 몫의 입원일수</b>만큼만 센다 — 전체 일수를 다 곱하면 부풀어 오른다 */
      var mul=(u==='D')?Math.max(1,Math.round(days*st.w)):1;
      if(u==='M')mul=1;
      if(vb!==undefined){b+=vb*mul;payB.push(k);}
      if(va!==undefined){a+=va*mul;payA.push(k);}
    });
    out.steps.push({st:st,need:need,b:b,a:a,payB:payB,payA:payA,act:act,
      gapB:Math.max(0,need-b),gapA:Math.max(0,need-a),mul:(days?Math.max(1,Math.round(days*st.w)):0)});
    out.totB+=b;out.totA+=a;out.needTot+=need;
  });
  return out;
}
/* ── 지금 더 넣으셔야 할 것 ───────────────────────────────────────
   표준(엑셀 기준)에 견주어 <b>모자란 담보</b>를 골라 세운다.
   「없다」와 「모자라다」를 가르고, <b>얼마를 더</b> 넣어야 하는지 적는다.  */
function needList(C){
  var out=[],i,j;
  for(i=0;i<STD.length;i++)for(j=0;j<STD[i].rows.length;j++){
    var r=STD[i].rows[j];
    if(!r.std)continue;
    if(r.u==='A')continue;                        /* 실손 한도는 표준 미달로 안 센다 */
    var a=C.a[r.k];
    var have=(a===undefined)?0:a;
    if(have>=r.std)continue;
    out.push({k:r.k,g:STD[i],need:r.std-have,have:have,std:r.std,
      none:(a===undefined),
      /* 사건에 걸리는 담보를 먼저 세운다 — 급한 것부터 */
      pri:(EVENTS.some(function(e){return (e.lump||[]).indexOf(r.k)>=0;})?0:
           ((r.u==='L')?1:2))});
  }
  out.sort(function(x,y){return (x.pri-y.pri)||(y.need-x.need);});
  return out;
}

          return '<option value="'+o.v+'"'+(((p.rnw||'')===o.v)?' selected':'')+'>'+esc(o.t)+'</option>';
        }).join('')+'</select></div>'+

  if(isB&&act==='endo')
    h+='<div class="note w" style="margin-bottom:8px">배서입니다 — 아래 담보판이 <b>「배서 후」</b> 로 바뀝니다. '+
       '<b>바꿀 담보만</b> 적으시면 됩니다. 안 적은 담보는 <b>없어집니다</b>(배서로 뺀 것으로 봅니다).'+
       '<div class="f c2" style="margin-top:7px"><div class="uw"><label>배서 후 월 보험료 (안 적으면 그대로)'+
       '<em class="wec" id="we_'+sd+'_'+i+'_premMan2">'+esc(wonEcho(wonOfMan(p.premMan2)))+'</em></label>'+
       '<div class="uwr"><input value="'+esc(wonOfMan(p.premMan2))+'" placeholder="'+esc(wonOfMan(p.premMan)||'그대로')+'" inputmode="numeric" onfocus="this.select()" '+
       'oninput="setPolWon(&quot;'+sd+'&quot;,'+i+',&quot;premMan2&quot;,this)"><i>원</i></div>'+
       '</div></div></div>';
  h+=padHtml(p,sd,i,(isB&&act==='endo')?'cov2':'cov');
  h+=extHtml(p,sd,i);   /* 판 X357 — 제안서에서 읽은 「표준표에 칸이 없는 담보」 */
  return h+'</div>';
}
function extHtml(p,sd,i){

    p.ext.map(function(x,j){var D=ppDict(x.d);

function extDel(sd,i,j){var p=S[sd][i];if(!p||!p.ext)return;p.ext.splice(j,1);save();render();}

/* 계약 한 줄 아래 <b>납입이 어떻게 되는가</b>를 바로 보여 준다.
   mini 면 <b>둘만</b> — 매달 나가는 돈과 앞으로 낼 돈. 다섯을 늘어놓으면
   어느 것이 중요한지 안 보인다. 세는 자리는 payCalc 하나뿐이라,
   접힌 줄과 펼친 줄이 <b>다른 숫자를 말할 수 없다.</b>                */
function payLine(pol,sd,i,mini){
  var c=payCalc(pol,(sd==='before')?'before':'after');
  if(mini){
    var m='<span>월 <b>'+(c.prem===null?'미입력':fee(c.prem))+'</b></span>';
    if(c.done)m+='<span class="g"><b>납입완료</b></span>';
    else if(c.left!==null)m+='<span class="w">앞으로 <b>'+fee(c.left)+'</b></span>';
    else m+='<span class="q">앞으로 낼 돈 <b>—</b></span>';
    return '<span class="paym" id="pm_'+sd+'_'+i+'">'+m+'</span>';
  }
  if(c.prem===null&&c.mTot===null)
    return '<div class="payl none" id="pl_'+sd+'_'+i+'">가입 시기와 납입기간을 적으시면 <b>총 납입 보험료</b>와 <b>앞으로 낼 돈</b>이 여기 나옵니다.</div>';
  var b=[];
  b.push('<span>월 <b>'+(c.prem===null?'미입력':fee(c.prem))+'</b></span>');
  b.push('<span>납입 <b>'+(c.mTot===null?'미입력':(Math.round(c.mTot/12)+'년 · '+c.mTot+'개월'))+'</b></span>');
  if(c.paidM!==null)b.push('<span>낸 것 <b>'+c.paidM+'개월'+(c.paid!==null?(' · '+fee(c.paid)):'')+'</b></span>');
  if(c.leftM!==null)b.push('<span class="'+(c.done?'g':'w')+'">'+(c.done?'<b>납입완료</b>':('앞으로 <b>'+c.leftM+'개월 · '+(c.left===null?'—':fee(c.left))+'</b>'))+'</span>');
  if(c.total!==null)b.push('<span class="t">총 납입 <b>'+fee(c.total)+'</b></span>');
  return '<div class="payl" id="pl_'+sd+'_'+i+'">'+b.join('')+'</div>';
}

/* 담보판 — 표준 담보를 <b>묶음째</b> 한눈에 */
function padHtml(p,sd,i,field){
  var key=sd+i,cur=S.pick[key];
  var bag=p[field]||{};
  /* ── 추가 보험은 <b>부위별로만</b> ────────────────────────────────
     새로 넣는 설계는 「전부 보기」로 열면 담보칸이 예순 개 넘게 한꺼번에
     펴져, 어디를 적고 있었는지 사장님이 놓친다. 새 설계는 <b>부위 하나를
     골라</b> 그것만 적는다. 기존 계약(비포)은 <b>읽어 온 것을 훑는</b>
     자리라 「전부 보기」를 그대로 둔다.

     <b>숨기는 게 아니다</b> — 부위 단추마다 몇 개 적었는지 숫자가 붙어
     있고, 한 번 누르면 그 자리로 간다.                               */
  var isNew=(sd==='after');
  if(cur===undefined||(isNew&&cur==='__all'))cur=isNew?STD[0].mid:'__all';
  /* ── 접혀 있는 것이 <b>기본</b>이다 ─────────────────────────────
     계약 여섯 건이면 담보칸이 400개가 되어 화면이 열세 장이 된다.
     담보를 손볼 때만 편다. 접혀 있어도 <b>무엇이 들었는지</b>는 보인다. */
  var nn=0,kk;
  for(kk in bag)if(bag.hasOwnProperty(kk)&&num(bag[kk])!==null)nn++;
  if(!S.padOpen[key])
    return '<div class="padshut" onclick="padOpen(\''+key+'\')">'+
      (field==='cov2'?'<b style="color:var(--or)">배서 후 담보</b>':'<b>보장내용</b>')+
      '<em>'+(nn?(nn+'개 적혀 있습니다'):'아직 안 적으셨습니다')+'</em>'+
      '<span>✍️ 담보 적기 ▾</span></div>'+
      (nn?('<div class="padsum">'+padSum(bag)+'</div>'):'');
  var h='<div style="border-top:1px solid #F1F3F5;padding-top:10px;margin-top:4px">'+
    (field==='cov2'?'<div style="font-size:var(--t6,13px);font-weight:800;color:var(--or);margin-bottom:7px">배서 후 담보 — 여기 적은 것만 남습니다</div>':'')+
    qkHtml(sd,i,field,key)+
    '<div class="gsel">'+
    STD.map(function(g,gi){
      var n=0;g.rows.forEach(function(r){if(num(bag[r.k])!==null)n++;});
      return '<button class="'+(cur===g.mid?'on':'')+'" onclick="setPick(\''+key+'\',\''+g.mid+'\')">'+g.ic+' '+esc(g.mid)+(n?(' <b>'+n+'</b>'):'')+'</button>';
    }).join('')+
    (isNew?'':('<button class="'+(cur==='__all'?'on':'')+'" onclick="setPick(\''+key+'\',\'__all\')">전부 보기</button>'))+
    '</div>'+
    (isNew?'<div class="gnote">🧩 <b>부위를 골라</b> 그 담보만 적습니다. 단추의 숫자는 <b>이미 적으신 개수</b>입니다 — 안 보이는 것은 없어진 것이 아니라 <b>다른 부위 칸</b>에 있습니다.</div>':'');
  STD.forEach(function(g){
    if(cur!=='__all'&&cur!==g.mid)return;
    h+='<div class="pad" style="margin-bottom:7px"><div class="ph2"><span class="dot" style="background:'+g.c+'"></span>'+
      g.ic+' '+esc(g.mid)+'<em>'+esc(g.big)+'</em></div><div class="gr2">';
    g.rows.forEach(function(r){
      var v=bag[r.k];
      h+='<div class="pr'+(num(v)!==null?' has':'')+'" title="'+esc((r.d||'').replace(/<[^>]*>/g,''))+'">'+
        '<div class="nm">'+esc(r.n)+(r.cov?('<i>'+r.cov+'%</i>'):'')+
        '<em>표준 '+(r.std?man(r.std):'—')+' · '+UNIT_FULL[r.u]+'</em></div>'+
        '<input value="'+esc(v===undefined?'':v)+'" placeholder="—" inputmode="text" onfocus="this.select()" onchange="covFix(this)" '+
          'oninput="setCov(\''+sd+'\','+i+',\''+field+'\',\''+r.k+'\',this.value)">'+
        '<span class="un">'+UNIT_LB[r.u]+'</span></div>';
    });
    h+='</div></div>';
  });
  return h+'<div class="padclose" onclick="padOpen(\''+key+'\')">담보칸 접기 ▴</div></div>';
}
/* 접힌 계약도 <b>무엇이 들었는지</b>는 보여야 한다 — 접는 것과 감추는 것은 다르다 */
function padSum(bag){
  var out=[],k;
  for(k in bag)if(bag.hasOwnProperty(k)&&num(bag[k])!==null&&ROW[k])
    out.push({k:k,v:num(bag[k]),u:UNIT[k]});
  out.sort(function(x,y){return ((x.u==='L')?0:1)-((y.u==='L')?0:1)||(y.v-x.v);});
  /* ── <b>「외 N개」 로 자르지 않는다</b> ─────────────────────────────
     열 개에서 잘라 놓으니, 금액이 작다는 이유로 <b>뇌·심장 담보가 그 뒤에
     숨었다.</b> 사장님이 「없나 보다」 하고 고객 앞에서 말하면 그 자리에서
     끝난다. 칩은 한 줄에 여러 개 들어가니 <b>다 세운다.</b>          */
  return out.map(function(o){
    return '<span>'+esc(NAME[o.k])+' <b>'+amt(o.k,o.v)+'</b></span>';
  }).join('');
}
function padOpen(k){S.padOpen[k]=!S.padOpen[k];save();render();}

/* 🔁 갱신주기 고를 것 — <b>여기 한 곳</b>입니다 (5번 · 판 X423).

var BA_RNW=[{v:'',t:'모름'},{v:'no',t:'비갱신'},{v:'1',t:'1년'},{v:'3',t:'3년'},

  S[sd].push(p);S.polOpen[p.id]=true;S.padOpen[sd+(S[sd].length-1)]=true;save();render();qkFocus(sd+(S[sd].length-1));}

/* ══ 치는 대로 <b>계약 머리의 납입 칩</b>도 같이 바뀝니다 ═══════════════
   2026-10-23 · 판 X168 · 사장님 말씀 「고쳐줘」.

   보험료를 쳐 넣는 동안 바로 위 칩이 <b>「월 미입력」 그대로</b>였습니다.
   setPol 은 stOnly() 만 불러 <b>옆 요약</b>과 <b>단계 칸</b>만 고쳤고,
   계약 줄은 다시 그릴 일이 없어 옛 글을 들고 있었습니다. 고객 앞에서
   금액을 적는데 바로 위가 「미입력」 이면 안 들어간 줄 압니다 (1번).

   ★ <b>칸(input)은 안 건드립니다</b> — 다시 그리면 커서가 튀어 못 칩니다.
     칩과 그 아래 한 줄만 갈아 끼웁니다.
   ★ 글을 만드는 곳은 <b>payLine 하나뿐</b>입니다 (5번) — 여기서 그것을
     부르기만 합니다. 두 곳에서 각자 만들면 한쪽만 고쳐 어긋납니다.     */
function payPut(sd,i){
  try{
    var p=S[sd]&&S[sd][i]; if(!p)return;
    var a=document.getElementById('pm_'+sd+'_'+i);
    if(a)a.outerHTML=payLine(p,sd,i,true);
    var b=document.getElementById('pl_'+sd+'_'+i);
    if(b)b.outerHTML=payLine(p,sd,i);
  }catch(e){}
}
function setPol(sd,i,k,v){S[sd][i][k]=v;save();stOnly();payPut(sd,i);}
function setAct(i,a){
  var p=S.before[i];
  p.act=a;
  /* 배서를 처음 누르면 <b>지금 담보를 그대로 복사</b>해 둔다 — 빈 판에서 시작하면 다 새로 쳐야 한다 */
  if(a==='endo'&&(!p.cov2||!Object.keys(p.cov2).length)){p.cov2={};for(var k in p.cov)if(p.cov.hasOwnProperty(k))p.cov2[k]=p.cov[k];}
  save();render();
}
function setCov(sd,i,field,k,v){
  var p=S[sd][i];
  if(!p[field])p[field]={};
  v=covIn(v);
  if(v==='')delete p[field][k];else p[field][k]=v;
  save();stOnly();
}

/* ══ ✍️ 한 번에 적기 (판 X366 · 사장님 말씀 2026-11-06 「만들기나 입력하는 부분들 조금 더 쉽게 작성할 수 있도록」) ══
   담보 하나를 넣으려면 부위 단추를 찾고 → 칸을 찾고 → 숫자를 쳐야 했습니다. 77칸 중 어디에 있는지 알아야 했습니다.
   이제는 <b>말하듯 한 줄</b>로 적습니다 — 「암진단 3천, 뇌혈관 1000, 입원일당 3만」.
   ■ 이름은 제안서 읽기와 <b>같은 규칙</b>(ppRule · 담보사전)으로 칸을 찾습니다 — 두 벌로 두면 한쪽만 고쳐 어긋납니다.
     사람들이 줄여 부르는 말 몇 개(「입원일당」 「수술비」 「간병인」)만 QK_ALIAS 로 보탭니다.
   ■ 바로 넣지 않습니다 — 어느 칸으로 가는지 <b>아래에 먼저 보여 주고</b>, 「칸에 넣기」 를 눌러야 들어갑니다.
     못 알아본 줄은 칸을 고르게 합니다. 지어내서 채우지 않습니다(1번).
   ■ 「월 보험료 52,300원 · 20년납 · 100세만기 · 회사 이름」 이 섞여 있으면 계약 칸에도 넣습니다(빈 칸만). */
var QK_ALIAS={'입원일당':'inpD','질병입원':'inpD','상해입원':'inpA','수술비':'surg','종수술':'surg5D','1-5종수술':'surg5D','1~5종수술':'surg5D',
  '허혈성':'heart','허혈성심장':'heart','허혈':'heart','심혈관':'heartA','심혈관질환':'heartA','뇌경색':'braini','간병인':'nurUD','간병':'nurUD',
  '간호간병':'nurNS','치매':'dem2','중증치매':'dem2','후유장해':'disabA','상해후유':'disabA','질병후유':'disabD',
  '배상책임':'liab','일상배상':'liab','중환자실':'icu','암입원':'inpC','암통원':'outC','깁스':'cast','화상':'burn'};
function qkRule(name){
  var c=String(name||'').replace(/\s+/g,''),bare=c.replace(/(비|금)$/,'');
  if(QK_ALIAS[c])return {k:QK_ALIAS[c],d:PP_K2D[QK_ALIAS[c]]||''};
  if(QK_ALIAS[bare])return {k:QK_ALIAS[bare],d:PP_K2D[QK_ALIAS[bare]]||''};
  return ppRule(name);
}
function qkParse(txt){
  var items=[],meta={};
  String(txt||'').split(/\n|[;；]|,(?!\d{3}(?!\d))/).forEach(function(s){
    s=s.replace(/\s+/g,' ').trim(); if(!s)return;
    var co='';PP_CO.forEach(function(c){if(!co&&s.indexOf(c)>=0)co=c.replace(/손보$/,'손해보험');});
    var y=s.match(/(\d{1,2})\s*년\s*납/),tm=s.match(/(\d{2,3})\s*세\s*만기/)||s.match(/(\d{1,2})\s*년\s*만기/);
    if(co)meta.co=co; if(y)meta.years=y[1];
    if(tm)meta.term=/년\s*만기/.test(tm[0])?(tm[1]+'년만기'):(tm[1]+'세만기'); else if(/종신/.test(s))meta.term='종신';
    if(/보험료/.test(s)){
      var pm=s.match(/보험료\s*[:：=]?\s*(\d[\d,.]*(?:\s*[억만천백십](?:\s*\d[\d,.]*)?)*\s*원?)/);
      if(pm){var w=krWon(pm[1]),q=(w!==null)?w:num(wonRaw(pm[1]));if(q!==null&&q>0)meta.prem=String(q/10000);}
      /* 보험료 뒤에 담보가 이어 적혔으면 그것은 담보로 읽는다 — 「월 보험료 5만원 20년납」 은 여기서 끝 */
      s=s.replace(/^.*?보험료\s*[:：=]?\s*\d[\d,.]*(?:\s*[억만천백십](?:\s*\d[\d,.]*)?)*\s*원?/,'').trim();
      if(!s||/^(?:\d{1,2}\s*년\s*납입?|\d{2,3}\s*세\s*만기|\d{1,2}\s*년\s*만기|종신|\s)*$/.test(s.replace(co,'')))return;
    }
    var rest=s;if(co)rest=rest.replace(co,'');
    rest=rest.replace(/\d{1,2}\s*년\s*납입?|\d{2,3}\s*세\s*만기|\d{1,2}\s*년\s*만기|종신/g,'').trim();
    if(!rest)return;
    var m=rest.match(/^(.+?)\s*[:：=]?\s*(\d[\d,.]*(?:\s*[억만천백십](?:\s*\d[\d,.]*)?)*\s*원?)\s*(?:\/\s*일)?$/);
    var name=(m?m[1]:rest).replace(/[\-–·:：=]+$/,'').trim(),v=null,plain=false;
    if(m){var c=covIn(m[2]);v=num(c);plain=/^\d[\d,.]*$/.test(m[2].replace(/\s/g,''));}
    if(!/[가-힣A-Za-z]/.test(name))return;
    var R=qkRule(name),k=R.k||'';
    /* 일당 · 매달 칸에 「30000」 처럼 원으로 친 맨 숫자 — 만원으로 보면 3억원/일이 된다. 원으로 다시 읽는다 */

/* ── KB 가 적어 준 <b>납입기간</b>을 연 수로 ────────────────────────
   「앞으로 낼 돈」·「총 납입 보험료」는 <b>월 보험료 × 납입기간</b>이다.
   납입기간이 없으면 둘 다 셈이 안 되고 화면에 못 뜬다 — 실제로 KB 에서
   읽어 넣은 계약이 <b>전부</b> 그랬다. 파서는 이미 읽고 있었는데
   <b>계약에 안 넣고 버리고</b> 있었다.

   ■ 「20년납」 은 <b>그대로 읽은 값</b>이다.
   ■ 「70세납」·「전기납」 은 <b>나이·만기에서 뺀 값</b>이다 — 지어낸 것이
     아니라 KB 가 적어 준 두 값으로 셈한 것이고, 사장님이 고칠 수 있다.
   ■ <b>못 읽으면 빈칸으로 둔다.</b> 0 으로 채우면 「낼 돈이 없다」가 된다. */
function kbYears(payTerm,term,age){
  /* KB 는 <b>종신</b>을 「9999세만기」로 적는다. 그대로 빼면 9,959년이 된다 —
     사람이 낼 수 있는 햇수를 넘으면 <b>모름</b>으로 둔다. */
  function ok(v){return (v>0&&v<=60)?v:null;}
  var t=(''+(payTerm||'')).replace(/\s/g,'');
  var m=t.match(/(\d+)\s*년/);
  if(m)return ok(+m[1]);              /* 「0년」(일시납)도 여기서 모름이 된다 */
  var sm=t.match(/(\d+)\s*세/);
  if(sm&&age)return ok(+sm[1]-age);
  if(/전기|만기납|종신납/.test(t)){
    var w=(''+(term||'')).replace(/\s/g,'');
    var a=w.match(/(\d+)\s*세/);
    if(a&&age)return ok(+a[1]-age);
    var b=w.match(/(\d+)\s*년/);
    if(b)return ok(+b[1]);
  }
  return null;
}
function kbApply(K,fname){
  var added=0,pols=0,no=0,noTerm=0,noStart=0,derived=0,lump=0,i,j;
  var age=(K.person&&K.person.age)||null;
  for(i=0;i<K.contracts.length;i++){
    var c=K.contracts[i],cov={},n=0;
    for(j=0;j<(c.covs||[]).length;j++){
      var v=c.covs[j],key=mapName(v.std||v.raw)||mapName(v.raw);
      if(!key){no++;continue;}
      var m=kbMan(v.won);if(m===null)continue;
      cov[key]=(num(cov[key])||0)+m;n++;
    }
    /* 가입일자와 납입기간을 <b>넣는다</b> — 이게 없으면 「앞으로 낼 돈」이 안 선다 */
    var yrs=kbYears(c.payTerm,c.term,age),st=(c.issue||'').slice(0,7);
    if(yrs===null)noTerm++;else if(!/\d+\s*년/.test(''+(c.payTerm||'')))derived++;
    if(!st)noStart++;
    /* <b>일시납</b>은 매달 내는 돈이 아니다. 그 금액을 월 보험료 칸에 넣으면
       「매달 3,400만원」이 되어 버린다 — <b>비워 두고 몇 건인지 말한다.</b> */
    var once=/일시/.test(''+(c.payWay||''));
    if(once)lump++;
    S.before.push({id:nid(),co:c.co||'',nm:c.nm||'',term:(c.payTerm||'')+(c.term?(' '+c.term):''),
      start:st,years:(yrs===null?'':String(yrs)),
      premMan:once?'':(c.paidUp?'0':(kbMan(c.premWon)===null?'':kbMan(c.premWon))),premMan2:'',act:'keep',kb:true,cov:cov,cov2:{}});
    added+=n;pols++;
  }
  S.kbRaw=K;S.kbInfo={file:fname,pols:pols,covs:added,no:no,noTerm:noTerm,noStart:noStart,derived:derived,lump:lump,
    person:(K.person&&K.person.name)||''};
  save();render();
}

function sideList(kind,rows){
  var loss=(kind==='loss');
  if(!rows.length)return '<div class="empty">'+(loss?'아직 해지·배서로 줄인 담보가 없습니다.':'아직 늘린 담보가 없습니다.')+'</div>';
  return '<div class="lis">'+rows.map(function(x){
    var gone=loss?(x.a===0):(x.b===0);
    return '<div class="li"><div class="n">'+esc(NAME[x.k])+

      '<div class="d"><b>'+amt(x.k,x.v)+'</b>'+

  }).join('')+'</div>';
}
function sideHtml(){
  /* 「지금 매달 얼마」는 <b>premCalc 한 곳</b>이 답한다 — 납입이 끝난 계약은
     매달 안 나가므로 0 이다. calc().premB 로 따로 세면 「한눈에」 129,900원 ·
     「보험료 변화」 117,500원이 한 고객 화면에 나란히 선다 (0-1 · 5번). */
  var D=diff(calc()),T=tally(),P=premCalc(),d=P.monD,h='';
  h+='<div class="sum"><div class="hh">지금 이 순간</div><div class="prem">'+
    '<div><span>월 보험료 · 지금</span><b>'+fee(P.monB)+'</b></div><div class="ar">→</div>'+
    '<div><span>조정 후</span><b class="'+(d>0?'up':(d<0?'dn':''))+'">'+fee(P.monA)+'</b></div></div>';
  if(d!==null&&d!==0)h+='<div class="note i" style="margin-top:8px">매달 <b>'+fee(Math.abs(d))+'</b> '+(d>0?'더':'덜')+' 나갑니다.</div>';
  if(P.noPremB||P.noPremA)h+='<div class="note w">보험료를 안 적으신 계약이 있어 <b>합계에 안 들어갔습니다</b>(지금 '+P.noPremB+'건 · 조정 후 '+P.noPremA+'건).</div>';
  h+='<div class="chips" style="margin-top:9px"><span>유지 <b>'+T.keep+'</b></span><span>배서 <b>'+T.endo+'</b></span>'+
    '<span>해지 <b>'+T.cancel+'</b></span><span>담보 <b>'+T.rows+'</b></span>'+
    (T.no?('<span class="w">못 알아봄 <b>'+T.no+'</b></span>'):'')+'</div></div>';
  h+='<div class="sum loss"><div class="hh">줄어드는 담보 <em>'+D.loss.length+'건</em></div>'+sideList('loss',D.loss)+'</div>';

   발표가 끝나면 사장님은 지금까지 화면에서 정한 것을 <b>손으로 다시
   옮겨</b> 적어야 했다. 옮겨 적는 자리마다 <b>틀릴 자리</b>가 생긴다 —
   담보 하나를 빠뜨리거나, 금액을 한 칸 밀려 적는다.

   그래서 화면에 있는 것을 <b>그대로</b> 한 장으로 뽑는다.

     ■ 새로 넣을 설계 — 회사 · 상품 · 납입기간 · 월보험료 · <b>담보 하나하나</b>
     ■ 고칠 계약(배서) — 무엇을 어떻게
     ■ 정리할 계약(해지) — <b>해지 전 확인</b>을 같이 적는다
     ■ 합계 — 월 보험료 · 앞으로 낼 돈

   ■ <b>모름은 모름으로 둔다.</b> 안 적힌 칸은 「—」이고, 몇 칸이
     비었는지 위에 적는다 — 빈칸인 채로 청약이 넘어가면 그게 사고다.
   ■ <b>청약은 여기서 하지 않는다.</b> 이 종이는 원수사·GA 시스템에
     넣기 위한 <b>받아 적을 자료</b>다. 그렇게 화면에 적는다.       */
function reqRows(pol,which){
  /* 담보는 <b>STD 차례대로</b> 세운다 — 적은 순서로 두면 회사마다 뒤죽박죽이다 */
  var cov=(which==='cov2')?(pol.cov2||{}):(pol.cov||{});
  var out=[];
  STD.forEach(function(g){g.rows.forEach(function(r){
    var v=num(cov[r.k]);
    if(v===null||v===undefined)return;
    out.push({k:r.k,n:r.n,g:g.mid,v:v});
  });});
  return out;
}
function reqCovTable(rows){
  if(!rows.length)return '<div class="rqno">담보 금액이 <b>안 적혀 있습니다</b> — 적어 주시면 여기 그대로 나옵니다.</div>';
  return '<table class="rqc"><tr><th>묶음</th><th>담보</th><th>가입금액</th></tr>'+
    rows.map(function(r){
      return '<tr><td class="g">'+esc(r.g)+'</td><td>'+esc(r.n)+'</td><td class="a">'+amt(r.k,r.v)+'</td></tr>';
    }).join('')+'</table>';
}

/* ── 「이 병이 오면」 — <b>한 바퀴를 한 장</b>에 ─────────────────────

   되었다 — 「진단부터 추적관찰까지 한 번에」 가 안 보였다.

   이제는 네 단계를 <b>옆으로</b> 세운다. 1280 무대 폭이면 네 칸이 나란히
   앉고, 칸마다 「드는 돈 · 지금 · 조정 후」 세 줄과 열리는 담보만 둔다.
   아래 점선 고리가 <b>마지막 단계에서 첫 단계로</b> 돌아간다 — 재발하면
   한 바퀴가 다시 돈다는 것을 그림이 말한다.

   ■ 숫자는 simCalc 가 이미 내는 값만 쓴다. 여기서 지어내는 값은 없다 (1번).
   ■ 단계마다 붙은 긴 설명(.cs)은 무대에서 접고 「읽는 말」이 대신한다.
     죽 이어서 · 종이에는 그대로 나온다.
   ■ 막대 길이는 <b>사건 전체</b>의 제일 큰 값으로 잰다 — 칸마다 다시 재면
     작은 단계의 막대가 「큰 돈」 처럼 보인다.                         */

/* ── 3번 · 4번 — 보장 분석 보고서 · 왜 보장이 넓어야 (판 X232 → X257) ──────────────
   화면에서는 ba-report.html(보장 분석 보고서 42장 — 표지 · 목차 · 보장 이해 · 한눈에 모든 담보 · 암/뇌/심/돌봄 한 바퀴 ·
   실제 사진 · 질병코드 · 통계)을 iframe 으로 띄운다. 판 X257 에서 3D(ba-3d.html) 를 이것으로 바꿨다 — 사장님 말씀
   「캐릭터가 허접 · 신뢰감 있게 · 다 되었다면 본판에 넣어」. 4번(mode why)은 같은 보고서를 「보장 이해 ③」 장부터 연다.
   고객 이름 · 나이 · 지금/조정 후 보장(calc 의 만원 값)을 주소의 <b># 뒤</b>에 싣는다 — # 뒤는 서버로 안 간다.
   <b>종이(인쇄 · PDF)에는 3D 가 안 찍힌다</b> — printAll 일 때는 아래 「한 바퀴 한 장」 을 그대로 그린다. */
/* 계약을 한 줄씩 — 보고서가 「어느 회사에서 · 어떻게 나오나」 를 그린다 (판 X316 · 사장님 말씀
   「어디 보험회사에서 어떻게 지급되는지도」). 유지는 지금 담보 그대로, 배서는 후 칸(cov2), 해지는 없음,
   새 설계는 조정 후에만. 값이 없는 담보는 싣지 않는다 — 0 으로 적으면 「없다」 가 된다 (1번). */
function baPolicies(){
  var P=[];
  function nums(o){var r={},k,v;o=o||{};for(k in o)if(o.hasOwnProperty(k)){v=num(o[k]);if(v!==null&&v>0)r[k]=v;}return r;}
  S.before.forEach(function(p){var act=p.act||'keep',b=nums(p.cov);
    P.push({c:p.co||'회사 미상',n:p.nm||'',s:act,b:b,a:act==='keep'?b:(act==='endo'?nums(p.cov2):{})});});
  S.after.forEach(function(q){P.push({c:q.co||'회사 미상',n:q.nm||'',s:'new',b:{},a:nums(q.cov),x:(q.ext||[]).map(function(e){return {n:e.n||e.raw,v:e.v};})});});
  return P;
}
function ba3dSrc(mode,C,more){
  var d={n:S.who.name||'',age:S.who.age||'',sex:S.who.sex||'',b:C.b,a:C.a,j:S.sim||'cancer',embed:0,mode:mode,

   ■ 「지금」 = 유지 · 배서로 <b>남는</b> 기존 계약만이다(새 제안은 뺀다). 제안마다 그 「지금」 의 빈자리를 얼마나 채우는지 센다.

       점수 = Σ 채움 × 그 묶음의 급함(지금 바로 3 · 그다음 2 · 나중에 1 · 이 나이엔 굳이 0.25)

   ■ <b>범위가 넓은 담보가 좁은 담보를 덮는다</b> — 뇌혈관질환이 있으면 뇌출혈 자리는 이미 찬 것으로 본다(RANK_UP).
     안 그러면 뇌혈관 2,000 이 있는 분께 「뇌출혈이 비었습니다」 라고 말하게 된다.
   ■ 제안이 없으면 — 비어 있는 <b>묶음</b>을 급한 순서(순위 → 빈 비율 → 설계 순서)로 세 개 고르고,
     묶음마다 모자란 담보 · 권장 금액 · 이유를 적는다. 뇌 · 심장과 순환계(뇌+심장)는 같은 자리라 함께 고르지 않는다.
   ■ 권장 금액은 사내 상담 기준이지 정답이 아니다 — 화면에 그렇게 적는다.                                 */
var RANK_W={1:3,2:2,3:1,0:0.25};
/* 나이를 모를 때 — 설계 순서 번호(DESIGN_ORDER 의 n). 1~2 → 지금 바로 · 3~4 → 그다음 · 5~6 → 나중에 */
var RANK_DO={'실손의료비':1,'암':2,'뇌':2,'심장':2,'순환계 (뇌+심장)':2,'암 치료비':2,'수술비':3,'입원 · 간병':3,'사망 · 장해':4,'골절 · 화상':6,'배상 · 운전자':6};
/* 이 담보를 덮는 <b>더 넓은</b> 담보 — 뇌혈관 ⊃ 뇌졸중 ⊃ 뇌출혈 · 뇌경색, 심혈관 ⊃ 허혈성 ⊃ 급성심근경색, 순환계 ⊃ 둘 다 */
var RANK_UP={brain:['circD'],stroke:['brain','circD'],brainh:['stroke','brain','circD'],braini:['stroke','brain','circD'],
             heartA:['circD'],heart:['heartA','circD'],mi:['heart','heartA','circD']};
function rankPri(mid){
  var b=ageBand();
  if(b){var o=agePlanOf(b.k,mid);return {p:o.p,why:o.why,src:b.t+' 담보안'};}
  var n=RANK_DO[mid]||5,d=DESIGN_ORDER[n-1]||{};
  return {p:(n<=2?1:(n<=4?2:3)),why:d.d||'',src:'설계 순서 '+n+'번'};
}
function rankBase(){
  var a={},i,k;
  function add(cov){for(k in cov)if(cov.hasOwnProperty(k)){var v=num(cov[k]);if(v===null)continue;a[k]=(a[k]||0)+v;}}
  for(i=0;i<S.before.length;i++){var p=S.before[i],act=p.act||'keep';
    if(act==='keep')add(p.cov);else if(act==='endo')add(p.cov2||{});}
  return a;
}
/* 넓은 담보까지 쳐서 「지금 얼마 있는가」 — 순환계 진단은 뇌혈관 · 심혈관이 <b>둘 다</b> 있으면 작은 쪽만큼 있는 것으로 본다 */
function rankHave(k,base){
  var v=base[k]||0;
  (RANK_UP[k]||[]).forEach(function(u){if((base[u]||0)>v)v=base[u];});
  if(k==='circD'){var bh=Math.min(rankHave('brain',base),rankHave('heartA',base));if(bh>v)v=bh;}
  return v;
}
function rankTarget(k){
  var sd=SSTD[k];if(!(sd>0))return null;
  var b=ageBand();return agePlanAmt(sd,b?agePlanOf(b.k,MID[k]).m:1);
}
function rankFill(k,v,base){
  if(!(v>0))return null;
  var have=rankHave(k,base);
  if(UNIT[k]==='A')return have>0?null:{k:k,f:1,have:0,t:null,add:v};
  var t=rankTarget(k);
  if(t===null)return have>0?null:{k:k,f:0.3,have:0,t:null,add:v};
  var gap=t-have;if(gap<=0)return null;
  var add=Math.min(v,gap);return {k:k,f:add/t,have:have,t:t,add:add};
}
function rankProps(){
  var base=rankBase();
  var L=S.after.map(function(p,i){
    var parts=[],sc=0,k;
    for(k in p.cov)if(p.cov.hasOwnProperty(k)&&MID[k]){
      var x=rankFill(k,num(p.cov[k]),base);if(!x)continue;
      var pr=rankPri(MID[k]);x.p=pr.p;x.s=x.f*RANK_W[pr.p];sc+=x.s;parts.push(x);}
    /* 판 X410 — 이유는 <b>큰 자리부터</b> 보인다. 채움 비율(s)로만 줄 세우면 유사암 1,000 · 질병 수술비 30만원처럼
       작은 담보가 100% 라서 앞에 서고, 급여 암주요치료비 · 뇌혈관 같은 큰 자리가 「그 밖에」 로 묻혔다(실제 제안서로 확인).
       점수(sc)는 그대로 — 보이는 순서만: 급함 → 기준 있는 담보 → 설계 순서 → 채우는 금액 */
    parts.sort(function(a,b){return (RANK_W[b.p]-RANK_W[a.p])||((a.t===null?1:0)-(b.t===null?1:0))||
      ((RANK_DO[MID[a.k]]||9)-(RANK_DO[MID[b.k]]||9))||((UNIT[a.k]==='L'?b.add:0)-(UNIT[b.k]==='L'?a.add:0))||(b.s-a.s);});
    return {p:p,i:i,sc:Math.round(sc*1000)/1000,parts:parts,prem:num(p.premMan)};});
  L.sort(function(a,b){return (b.sc-a.sc)||((a.prem===null?1e9:a.prem)-(b.prem===null?1e9:b.prem))||(a.i-b.i);});
  L.forEach(function(x,j){x.rank=j+1;x.tie=(j>0&&L[j-1].sc===x.sc&&x.sc>0);});
  /* 판 X411 — 위가 프로그램의 <b>1차안</b>이다. 사장님이 ✏️ 로 순서를 고치셨으면 그 순서로 다시 세운다(점수 · 이유 숫자는 그대로).
     x.auto = 1차안 순위 — 「급한 빈자리를 가장 많이 채워 1순위」 같은 문장은 1차안 순위가 맞을 때만 쓴다 */
  L.forEach(function(x){x.auto=x.rank;});

     넓게 채우는 비싼 제안이 1순위가 될 때 「비싸서 1순위」 로 들리지 않게 */

  E.forEach(function(x){x.eff=x.sc/x.prem;});
  E.slice().sort(function(a,b){return (b.eff-a.eff)||(a.rank-b.rank);}).forEach(function(x,j){x.effN=j+1;if(!j)L.effTop=x;});
  L.effCnt=E.length;

}
function rankOf(id){var L=rankProps(),j;for(j=0;j<L.length;j++)if(L[j].p.id===id)return L[j];return null;}
function rankTag(p){var x=rankOf(p.id);if(!x)return '';
  return '<span class="tag rk'+(x.rank<=3?x.rank:'n')+'" title="제안 순위 — ③ 추가 보험 위 「🥇 제안 순위」 에 이유가 있습니다">'+x.rank+'순위</span>';}
function rankSuggest(){
  var base=rankBase(),out=[];
  STD.forEach(function(g){
    var pr=rankPri(g.mid);if(pr.p===0)return;
    var rows=[],tot=0,miss=0;
    g.rows.forEach(function(r){
      if(!(r.std>0))return;tot++;
      var have=rankHave(r.k,base);
      if(r.u==='A'){if(have>0)return;miss+=1;rows.push({k:r.k,have:0,t:null,need:null});return;}
      var t=rankTarget(r.k);if(t===null||have>=t)return;
      miss+=(t-have)/t;rows.push({k:r.k,have:have,t:t,need:t-have});});
    /* 더 넓은 담보가 같이 비어 있으면 좁은 것은 따로 권하지 않는다 — 넓은 것 하나로 같이 찬다 */
    var gap={};rows.forEach(function(r){gap[r.k]=1;});
    rows=rows.filter(function(r){return !(RANK_UP[r.k]||[]).some(function(u){return gap[u];});});
    if(!rows.length)return;

  var pick=[],has={},circ=out.some(function(x){return x.g.mid==='순환계 (뇌+심장)';});
  out.forEach(function(x){if(pick.length>=3)return;var m=x.g.mid;
    if(m==='순환계 (뇌+심장)'&&(has['뇌']||has['심장']))return;
    if((m==='뇌'||m==='심장')&&has['순환계 (뇌+심장)'])return;
    x.circ=(circ&&(m==='뇌'||m==='심장'));has[m]=1;pick.push(x);});

  var e=rkEd();

    var mine=[];e.og.forEach(function(m){if(by[m]&&mine.indexOf(by[m])<0)mine.push(by[m]);});

/* ── 판 X411 — ✏️ 1차안 고치기 ──────────────────────────────────────────

   ✏️ 를 누르면 순서(▲▼) · 이유 문장 · 발표 화면 한 마디를 고치고, 추가 제안은 묶음을 빼고 넣는다.
   고친 것은 S.rankEd 에만 둔다 — 점수 · 채움 금액 · 보험료 대비 숫자는 손대지 않는다(지어낸 숫자 금지).
     op = 제안 순서('p:'+id) · og = 추가 제안 묶음 순서(mid) · why[key] = 이유 문장 · sayP/sayG = 발표 한 마디
   「↺ 1차안으로」 는 지금 보고 있는 쪽(제안 순위 또는 추가 제안)만 되돌린다.                         */
function rkEd(){if(!S.rankEd||typeof S.rankEd!=='object')S.rankEd={};if(!S.rankEd.why||typeof S.rankEd.why!=='object')S.rankEd.why={};return S.rankEd;}
function rkOrder(L,keyOf,nm){
  var o=rkEd()[nm];if(!o||!o.length)return L;
  var by={},out=[];L.forEach(function(x){by[keyOf(x)]=x;});
  o.forEach(function(k){if(by[k]){out.push(by[k]);delete by[k];}});
  L.forEach(function(x){if(by[keyOf(x)])out.push(x);});   /* 나중에 넣은 제안은 1차안 순서대로 뒤에 */
  return out;
}
function rkTouched(t){

  return !!((t==='p'?e.op:e.og)||[]).length||(rkSayOf(t==='p'?'sayP':'sayG')!==null);
}
function rkSayOf(nm){var e=S.rankEd;var v=e&&typeof e==='object'?e[nm]:null;return (typeof v==='string'&&v.trim())?esc(v.trim()).replace(/\n/g,'<br>'):null;}

  if(x.auto!==undefined&&x.auto!==x.rank)return '<span class="rk-m">✏️ 1차안 '+x.auto+'순위</span>';

}

function studyHtml(){
  var h='<div class="card st2"><h2>📖 보장분석 기준 — 보고 공부하는 자리'+
    '<span class="r"><button class="mini" onclick="showPanel(\'study\')">닫기</button>'+
    '<button class="mini" onclick="window.print()">🖨 인쇄</button></span></h2>'+
    '<p>이 도구가 <b>무엇을 근거로</b> 셈하는지를 모았습니다. 그대로 고객 앞에서 쓰셔도 됩니다.</p><div class="study">';
  STUDY_DOC.concat(STUDY_DOC2).forEach(function(d){
    h+='<div class="sd3"><div class="sh3">'+d.ic+' '+esc(d.t)+'</div><ul>'+
      d.b.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'+
      '<div class="sk">'+d.k+'</div></div>';
  });
  h+='</div>';
  /* 범위 겹침을 <b>그림</b>으로 */
  h+='<div class="sd3" style="margin-top:11px"><div class="sh3">🎯 범위가 어떻게 겹치는가</div>'+
    '<div class="venn">'+
      vennHtml('🧠 뇌',[['뇌혈관질환',100],['뇌졸중',67],['뇌경색',58],['뇌출혈',9]])+
      vennHtml('❤️ 심장',[['심혈관질환',100],['허혈성심장질환',60],['급성심근경색',9]])+
    '</div>'+
    '<div class="sk">바깥 띠가 넓을수록 <b>더 자주 열립니다.</b> 같은 1,000만원이면 <b>바깥쪽</b>이 훨씬 값어치가 큽니다.</div></div>';
  return h+'</div>';
}
function vennHtml(t,rows){
  return '<div class="vn"><div class="vt">'+esc(t)+'</div>'+rows.map(function(r,i){
    var wide=(r[1]>=32);
    return '<div class="vrow"><div class="vr" style="width:'+Math.max(7,r[1])+'%;background:'+['#1E3A8A','#2563EB','#60A5FA','#93C5FD'][i]+'">'+
      (wide?('<span>'+esc(r[0])+' '+r[1]+'%</span>'):'')+'</div>'+
      (wide?'':('<em>'+esc(r[0])+' <b>'+r[1]+'%</b></em>'))+'</div>';
  }).join('')+'</div>';
}

/* ── 사장님이 고치는 기준 ─────────────────────────────────────────
   위 표(AGE_PLAN)는 <b>처음 값</b>일 뿐입니다. 현장에서 맞는 기준은
   사장님이 압니다 — 고치시면 <b>그것이 이 도구의 기준</b>이 됩니다.

   ■ 고친 값은 <b>이 브라우저에만</b> 남습니다(localStorage). 서버로 안 갑니다.
   ■ 고친 자리는 <b>고쳤다고 표시</b>합니다. 어느 것이 사장님 값이고 어느 것이
     처음 값인지 모르면, 나중에 왜 그 숫자인지 아무도 설명 못 합니다.
   ■ <b>되돌리기</b>를 항상 둡니다. 되돌릴 수 없는 편집은 무섭습니다.
   ■ 「지금 이 나이대·이 묶음의 기준이 무엇인가」는 <b>여기 한 곳</b>만 답합니다
     — 화면도 인쇄도 이 함수를 부릅니다 (5번).                        */
function agePlanOf(k,mid){
  var base=(AGE_PLAN[k]||{})[mid]||{p:2,m:1,why:''};
  var mine=((S.apEdit||{})[k]||{})[mid];
  if(!mine)return {p:base.p,m:base.m,why:base.why,mine:false,base:base};
  return {p:(mine.p===undefined?base.p:mine.p),
          m:(mine.m===undefined?base.m:mine.m),
          why:(mine.why===undefined?base.why:mine.why),
          mine:true,base:base};
}
function apEditOpen(mid){S.apEditing=(S.apEditing===mid?'':mid);save();render();}
function apEditSave(k,mid){
  var p=document.getElementById('apeP'),m=document.getElementById('apeM'),w=document.getElementById('apeW');
  if(!p||!m||!w)return;
  var mv=parseFloat(m.value);
  if(!(mv>0)||mv>3){toast('배수는 0 보다 크고 3 이하로 적어 주십시오 — 표준의 100% 는 1 입니다',6000);return;}
  if(!S.apEdit)S.apEdit={};
  if(!S.apEdit[k])S.apEdit[k]={};
  S.apEdit[k][mid]={p:parseInt(p.value,10),m:mv,why:w.value};
  S.apEditing='';save();render();
  toast('고치셨습니다 — 이제 이 값이 이 도구의 기준입니다');
}
function apEditReset(k,mid){
  if(S.apEdit&&S.apEdit[k])delete S.apEdit[k][mid];
  S.apEditing='';save();render();toast('처음 값으로 되돌렸습니다');
}
function apEditResetAll(k){
  if(S.apEdit)delete S.apEdit[k];
  S.apEditing='';save();render();toast('이 나이대를 처음 값으로 되돌렸습니다');
}
function apEditCount(k){
  var o=(S.apEdit||{})[k],c=0,x;
  if(o)for(x in o)if(o.hasOwnProperty(x))c++;
  return c;
}
function agePriOf(p){var i;for(i=0;i<AGE_PRI.length;i++)if(AGE_PRI[i].p===p)return AGE_PRI[i];return AGE_PRI[3];}
/* 표준 × 배수 — 자릿수에 맞게 <b>읽히는 수</b>로 맞춘다.
   표준이 없는 담보(0)는 <b>「—」</b> 다. 없는 숫자를 만들지 않는다 (1번). */
function agePlanAmt(std,m){
  if(!(std>0))return null;
  var v=std*m;
  if(v>=1000)return Math.round(v/100)*100;
  if(v>=100) return Math.round(v/10)*10;
  return Math.round(v);
}
function ageBand(){
  var a=num(S.who.age);
  if(a===null)return null;
  for(var i=0;i<AGE_GUIDE.length;i++)
    if(a>=AGE_GUIDE[i].range[0]&&a<=AGE_GUIDE[i].range[1])return AGE_GUIDE[i];
  return null;
}
function agePlanPick(k){S.agePlan=k;save();render();window.scrollTo(0,0);}
function agePlanFold(k){S.apOpen=(S.apOpen===k?'':k);save();render();}

    }).join('');
    return '<div class="apf'+(open?' on':'')+'">'+
      '<button class="apb" onclick="agePlanFold(\''+gr.mid.replace(/'/g,"\\'")+'\')">'+

              }).join('')+'</select></label>'+

               '<button class="btn n" onclick="apEditOpen(\'\')">그만두기</button>'+
               '<span>고친 값은 <b>이 브라우저에만</b> 남습니다 — 서버로 안 갑니다.</span>'+
             '</div></div>')
          : ('<button class="apeo noprint" onclick="apEditOpen(\''+gr.mid.replace(/'/g,"\\'")+'\')">✏️ 이 기준 고치기</button>'))+

/* ══ 이 고객, 이렇게 여십시오 ═══════════════════════════════════════
   같은 40대라도 <b>외벌이에 아이 둘</b>과 <b>맞벌이 무자녀</b>는 다른 상담이다.
   적어 두신 것(나이 · 가족 · 소득 · 지금 계약)에서 <b>읽어 낸다.</b>

   ■ 없는 것은 <b>말하지 않는다.</b> 대신 <b>무엇을 더 알아야 하는지</b>를 적는다.
   ■ 화법은 <b>이 도구가 셈한 숫자</b>로만 만든다 — 지어낸 사정은 넣지 않는다. */
function pointCalc(){
  var C=calc(),D=diff(C),P=premCalc(),L=lifeCalc(C),band=ageBand();
  var o={band:band,age:num(S.who.age),sex:S.who.sex,
    inc:num(S.who.incMan),exp:num(S.who.expMan),ret:num(S.who.retire),
    kids:[],spouse:false,need:[],gaps:[],narrow:[],paidUp:[],
    ratio:null,free:null,workYears:null,eduUntil:null};
  (S.fam||[]).forEach(function(f){
    var a=num(f.age),r=(f.rel||'').replace(/\s/g,'');
    if(a===null)return;
    if(/자녀|아들|딸/.test(r))o.kids.push({rel:f.rel,age:a,until:Math.max(0,22-a)});
    if(/배우자|아내|남편|처|부인/.test(r))o.spouse=true;
  });
  o.kids.sort(function(x,y){return x.age-y.age;});
  if(o.kids.length)o.eduUntil=o.kids[0].until;
  if(o.inc!==null&&o.exp!==null)o.free=o.inc-o.exp;
  if(o.inc>0&&P.monB!==null)o.ratio=P.monB/o.inc*100;
  if(o.age!==null&&o.ret!==null)o.workYears=Math.max(0,o.ret-o.age);
  /* 사건별로 지금 얼마나 비는가 */
  EVENTS.forEach(function(ev){
    var r=evCalc(ev,C);
    if(r.cost===null||!(r.cost>0))return;
    if(r.gapB>0)o.gaps.push({t:ev.t,ic:ev.ic,gap:r.gapB,have:r.totB,cost:r.cost,
      pct:(r.rateB===null?null:Math.round(r.rateB))});
  });
  o.gaps.sort(function(x,y){return y.gap-x.gap;});
  /* 범위가 좁은 자리 — 넓은 담보 없이 좁은 것만 들고 있는 경우 */
  if(C.b.brain===undefined&&C.b.circD===undefined&&(C.b.brainh!==undefined||C.b.braini!==undefined||C.b.stroke!==undefined))
    o.narrow.push({t:'뇌',has:[C.b.stroke!==undefined?'뇌졸중':null,C.b.brainh!==undefined?'뇌출혈':null,
      C.b.braini!==undefined?'뇌경색':null].filter(Boolean).join('·'),want:'뇌혈관질환(전체)'});
  if(C.b.heartA===undefined&&C.b.circD===undefined&&(C.b.mi!==undefined||C.b.heart!==undefined))
    o.narrow.push({t:'심장',has:[C.b.heart!==undefined?'허혈성':null,C.b.mi!==undefined?'급성심근경색':null].filter(Boolean).join('·'),
      want:'심혈관질환(전체)'});
  /* 납입이 끝난 계약 — 해지해도 안 싸진다 */
  S.before.forEach(function(pol){
    var c=payCalc(pol,'before');
    if(c.done&&c.prem)o.paidUp.push({nm:(pol.co||'')+' '+(pol.nm||''),prem:c.prem});
  });
  /* 더 알아야 하는 것 */
  if(o.age===null)o.need.push('나이');
  if(o.inc===null)o.need.push('월 소득');
  if(o.exp===null)o.need.push('월 생활비');
  if(!S.fam.length)o.need.push('가족 구성(관계·나이)');
  if(!S.before.length)o.need.push('지금 들고 계신 보험');

/* ══ 자동 보장분석 ═════════════════════════════════════════════════
   「표준 5,000만원」은 <b>모두에게 같은 값</b>이다. 그런데 월 생활비
   200만원인 집과 500만원인 집의 필요액이 같을 리 없다.
   그래서 <b>이 집의 숫자로</b> 다시 셈한다.

   ■ 셈하는 법을 <b>화면에 그대로 적는다</b> — 근거 없는 「적정」은 없다.
   ■ 모르는 값이 있으면 그 줄은 <b>셈하지 않고</b> 무엇이 없는지 말한다.  */
function fitCalc(){
  var A=S.assume||{},C=calc(),o={A:A,rows:[],need:[],inc:num(S.who.incMan),exp:num(S.who.expMan),
    age:num(S.who.age),ret:num(S.who.retire),life:num(S.who.life)||85,kids:[],dep:null};
  (S.fam||[]).forEach(function(f){
    var a=num(f.age);if(a===null)return;
    if(/자녀|아들|딸/.test((f.rel||'').replace(/\s/g,'')))o.kids.push(a);
  });
  o.kids.sort(function(a,b){return a-b;});
  /* 부양 기간 — 막내가 <b>22살</b>이 될 때까지. 자녀가 없으면 은퇴까지 */
  var depAge=num((S.assume||{}).depAge); if(depAge===null)depAge=22;
  if(o.kids.length)o.dep=Math.max(0,depAge-o.kids[0]);
  else if(o.age!==null&&o.ret!==null)o.dep=Math.max(0,o.ret-o.age);
  if(o.inc===null)o.need.push('월 소득');
  if(o.exp===null)o.need.push('월 생활비');
  if(o.age===null)o.need.push('나이');

  function ev(k){var e=null,i;for(i=0;i<EVENTS.length;i++)if(EVENTS[i].k===k)e=EVENTS[i];return e;}
  function got(keys,useCov){
    var v=0,i;for(i=0;i<keys.length;i++){
      var x=C.b[keys[i]];if(x===undefined||x===null)continue;
      if(UNIT[keys[i]]!=='L')continue;
      var r=useCov?((COV[keys[i]]==null)?1:COV[keys[i]]/100):1;
      v+=x*r;}
    return v;
  }
  function gotA(keys,useCov){
    var v=0,i;for(i=0;i<keys.length;i++){
      var x=C.a[keys[i]];if(x===undefined||x===null)continue;
      if(UNIT[keys[i]]!=='L')continue;
      var r=useCov?((COV[keys[i]]==null)?1:COV[keys[i]]/100):1;
      v+=x*r;}
    return v;
  }
  /* ── 사건 셋 — 치료비 + 그 기간의 생활비 ── */
  ['cancer','brain','heart'].forEach(function(k){
    var e=ev(k),sc=S.scen[k],cost=num(sc.cost),off=num(sc.off);
    var live=(o.exp!==null&&off!==null)?o.exp*off:null;
    var fit=(cost===null)?null:(cost+(live||0));
    o.rows.push({k:k,t:e.t,ic:e.ic,keys:e.lump,
      now:got(e.lump),nowE:got(e.lump,1),aft:gotA(e.lump),aftE:gotA(e.lump,1),
      fit:fit,
      how:(cost===null)?'기준 치료비가 없어 셈하지 않았습니다'
        :('치료비 <b>'+won(cost)+'</b>'+(live!==null?(' + 그 기간 생활비 <b>'+won(o.exp)+' × '+off+'개월 = '+won(live)+'</b>'):' (소득중단 개월·생활비를 넣으시면 더 정확해집니다)')),
      why:'치료비만 맞추면 <b>일 못 하는 동안의 생활비</b>가 빕니다. 그 둘을 더한 것이 실제 필요액입니다.'});
  });
  /* ── 간병 ── */
  (function(){
    var sc=S.scen.care,cost=num(sc.cost);
    o.rows.push({k:'care',t:'간병 · 요양',ic:'🧑‍⚕️',keys:['dem2'],
      now:got(['dem2']),nowE:got(['dem2']),aft:gotA(['dem2']),aftE:gotA(['dem2']),
      fit:cost,
      how:(cost===null)?'기준을 안 정하셨습니다'
        :('기준 <b>'+won(cost)+'</b> — 요양 <b>월 '+(num(A.careMon)||150)+'만원</b> × <b>'+(num(A.careMonths)||24)+'개월</b> 로 본 값입니다'),
      why:'끝나는 날이 정해져 있지 않은 <b>유일한</b> 지출입니다. 목돈과 <b>매달 나오는 급여</b>를 함께 봅니다.',
      extra:'장기요양 급여(매달) 지금 <b>'+won(C.b.ltcF)+'</b> → 조정 후 <b>'+won(C.a.ltcF)+'</b>'});
  })();
  /* ── 사망 — 남은 가족이 살아갈 돈 ── */
  (function(){
    var keys=['deathD','deathA'];
    /* 남은 가족이 쓸 돈은 <b>지금 생활비 전부</b>가 아니다 — 고인 몫이 빠진다 */
    var pct=num(A.deathPct); if(pct===null)pct=70;
    var fit=(o.exp!==null&&o.dep!==null)?Math.round(o.exp*12*o.dep*pct/100):null;
    o.rows.push({k:'death',t:'사망',ic:'🕊️',keys:keys,
      now:got(keys),nowE:got(keys),aft:gotA(keys),aftE:gotA(keys),fit:fit,
      how:(fit===null)?'월 생활비와 가족 나이를 넣으시면 셈합니다'
        :('월 생활비 <b>'+won(o.exp)+'</b> × 12개월 × <b>'+o.dep+'년</b> × <b>'+pct+'%</b>'+
          (o.kids.length?('(막내 '+o.kids[0]+'세 → '+(num(A.depAge)||22)+'세까지)'):'(은퇴까지)')+' = <b>'+won(fit)+'</b>'),

          /* <b>실제로 뭐라고 말하는가</b> — 여기가 혼자 공부하는 자리다.
             「무엇을 보여준다」까지만 적어 두면, 정작 입이 안 떨어진다. */
          (r.say?('<div class="fwsay">'+r.say+'</div>'):'')+
          /* 판 X330 — 그대로 읽을 말만 보이고, 나머지는 「자세히」 안으로 */
          '<details class="gd2-more fwmore"><summary>자세히 <small>무엇을 · 이렇게 나오면 · 보여줄 화면</small></summary>'+
          '<div class="fwd">'+r.d+'</div>'+
          (r.if1?('<div class="fwif"><span>'+esc(r.if1)+'</span>'+r.if2+'</div>'):'')+
          '<div class="fwmeta"><span class="sh">보여줄 화면 · '+esc(r.show)+'</span>'+
          '<span class="gl">이 칸의 목표 · '+r.goal+'</span></div></details></div></div>';
      }).join('')+'</div></div>';
  });
  if(f.care.length)
    h+='<div class="fwcare"><b>이 흐름에서 조심할 것</b><ul>'+
      f.care.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>';
  h+='<div class="fwclose">'+f.close+'</div></div>';
  return h;
}

    if(B.hot.length>6)h+='<details class="gd2-more bhotmore"><summary>바로 걸리는 말 '+(B.hot.length-6)+'개 더 보기</summary>'+

  h+='<details id="bq4" class="gd2-sec gd2-fold"'+(S.nhOpen?' open':'')+'><summary>'+gdHead(4,'병원비 공부방','고객에게 읽는 말이 아니라 사장님이 먼저 아셔야 하는 것 · 눌러서 펴기')+'</summary>'+brainStudyHtml()+'</details>';

/* ═══════════════ 인체 해부도 ═══════════════ */
function anatSvg(C){
  var pins='';
  PARTS.forEach(function(pt){
    var o=partCalc(pt,C),up=(o.maxA>o.maxB),dn=(o.maxA<o.maxB);
    var col=(o.maxA===0&&o.maxB===0)?'#CBD5E1':(up?'#3182F6':(dn?'#DC2626':pt.c));
    pins+='<g><circle cx="'+pt.dot[0]+'" cy="'+pt.dot[1]+'" r="13" fill="'+col+'" opacity=".18"/>'+
      '<circle cx="'+pt.dot[0]+'" cy="'+pt.dot[1]+'" r="7" fill="'+col+'"/>'+
      '<circle cx="'+pt.dot[0]+'" cy="'+pt.dot[1]+'" r="7" fill="none" stroke="#fff" stroke-width="2"/></g>';
  });
  /* 몸 그림은 apex-body.js 한 벌 — 진단·치료 지도의 몸 지도와 같이 씁니다 (5번 · 판 X318) */
  return window.APXBody.svg(pins);
}
function pinHtml(pt,C){
  var o=partCalc(pt,C),on=(S.printAll||S.pin===pt.p);
  var d=o.maxA-o.maxB;
  var h='<div class="pin'+(on?' on':'')+'" onclick="togglePin(\''+pt.p+'\')">'+
    '<div class="pt"><span class="dot" style="background:'+pt.c+'"></span>'+pt.ic+' '+esc(pt.t)+
    (o.hasCov?('<span class="cv">범위 반영 '+won(o.expA)+'</span>'):'')+'</div>'+
    '<div class="pv"><div class="c"><span>전</span><b style="color:var(--gy)">'+(o.maxB?won(o.maxB):'없음')+'</b></div>'+
      '<div class="ar">→</div>'+
      '<div class="c a"><span>후</span><b class="'+(d<0?'dn':'')+'">'+(o.maxA?won(o.maxA):'없음')+'</b></div></div>';
  var mx=Math.max(o.maxB,o.maxA,1);
  h+='<div class="bars">'+
    '<div class="b1"><span>전</span><div class="t"><i style="width:'+(o.maxB/mx*100)+'%;background:#94A3B8"></i></div></div>'+
    '<div class="b1"><span>후</span><div class="t"><i style="width:'+(o.maxA/mx*100)+'%;background:'+(d<0?'#DC2626':'#3182F6')+'"></i></div></div></div>';
  if(o.dayB||o.dayA)h+='<div class="det" style="border:0;padding-top:5px">하루 나오는 돈 <b>'+won(o.dayB)+' → '+won(o.dayA)+'</b>/일 (목돈과 따로 셉니다)</div>';
  if(o.monB||o.monA)h+='<div class="det" style="border:0;padding-top:3px">매달 나오는 돈 <b>'+won(o.monB)+' → '+won(o.monA)+'</b>/월</div>';
  if(on){
    h+='<div class="det">'+o.rows.map(function(r){
      if(r.b===undefined&&r.a===undefined)return '<div class="dr"><span class="z">'+esc(NAME[r.k])+'</span><span class="z">없음</span></div>';
      return '<div class="dr"><span>'+esc(NAME[r.k])+(COV[r.k]?(' <b style="color:var(--or)">'+COV[r.k]+'%</b>'):'')+'</span>'+
        '<span>'+(r.b===undefined?'—':man(r.b))+' → <b>'+(r.a===undefined?'—':man(r.a))+'</b></span></div>';
    }).join('')+
    (o.hasCov?('<div style="margin-top:6px;color:var(--or)">※ <b>%</b> 는 그 사건이 왔을 때 이 담보가 <b>열릴 확률</b>입니다. '+
      '다 더한 <b>'+won(o.maxA)+'</b> 은 <b>전부 열렸을 때</b>이고, 확률을 반영하면 평균 <b>'+won(o.expA)+'</b> 입니다.</div>'):'')+
    '</div>';
  }
  return h+'</div>';
}
function togglePin(p){S.pin=(S.pin===p)?'':p;save();render();}
function anatHtml(C){
  var L=PARTS.filter(function(p){return p.side==='L';}),R=PARTS.filter(function(p){return p.side==='R';});
  /* 읽는 말은 <b>맨 아래</b>다 — 그림 위에 두면 그림이 밀려 한 장을 넘는다 */

    '<p class="sd">사건이 <b>몸 어디에서</b> 일어나느냐에 따라 열리는 지갑이 다릅니다. 파란 점은 <b>늘어난 부위</b>, 붉은 점은 <b>줄어든 부위</b>, '+
    '회색 점은 <b>아직 아무것도 없는 부위</b>입니다.</p>'+
    '<div class="anat"><div>'+L.map(function(p){return pinHtml(p,C);}).join('')+'</div>'+

    '<div>'+R.map(function(p){return pinHtml(p,C);}).join('')+'</div></div>'+
    sayLine('사람 몸을 부위로 나눠 보면 <b>어디는 두껍고 어디는 얇은지</b>가 한눈에 보입니다. 얇은 쪽부터 같이 보시죠.')+
    '</section>';
}
/* ═══════════════ 경제활동기 ═══════════════ */
function lifeHtml(C){
  var L=lifeCalc(C);
  if(!L.ok)
    return '<section id="s7" data-grp="돈은 이렇게 됩니다" data-nm="경제활동기"><h3>경제활동기 — 언제까지 벌고, 언제부터 쓰는가</h3>'+
      '<div class="note w">나이 · 은퇴 예정 · 월 생활비를 넣으시면 이 그래프가 그려집니다. <b>없는 값을 만들지 않습니다.</b></div></section>';
  var a0=L.age,a1=L.life,span=Math.max(1,a1-a0);
  function x(age){return ((age-a0)/span*100);}
  var h='<section id="s7" data-grp="돈은 이렇게 됩니다" data-nm="경제활동기"><h3>경제활동기 — 언제까지 벌고, 언제부터 쓰는가'+
    '<small>지금 '+a0+'세 · 은퇴 '+L.ret+'세 · '+a1+'세까지</small></h3>'+
    '<p class="sd">보험은 <b>돈의 크기</b>만이 아니라 <b>버티는 기간</b>의 문제입니다. 아래는 이 집이 <b>얼마나 오래 버티는가</b>를 그린 것입니다.</p>'+
    '<div class="life"><div class="tl">'+
      '<div class="band" style="left:0;width:'+x(L.ret)+'%;background:linear-gradient(90deg,#3182F6,#60A5FA)">'+
        '경제활동기 '+L.workYears+'년'+(L.inc?(' · 월 '+won(L.inc)):'')+'</div>'+
      '<div class="band" style="left:'+x(L.ret)+'%;width:'+(100-x(L.ret))+'%;background:#94A3B8">'+
        '은퇴 후 '+L.afterYears+'년'+(L.exp?(' · 월 '+won(L.exp)+' 나감'):'')+'</div>'+
      '<div class="mk" style="left:'+x(L.ret)+'%"><em>은퇴 '+L.ret+'세</em></div>';
  L.kids.forEach(function(kd,i){
    if(kd.until===null||kd.until<=0)return;
    h+='<div class="kid" style="left:0;width:'+Math.min(100,x(a0+kd.until))+'%;top:'+(48+i*16)+'px">'+
      '<em>'+esc(kd.rel)+' '+kd.age+'세 → 독립까지 '+kd.until+'년</em></div>';
  });
  h+='<div class="ax">'+[0,0.25,0.5,0.75,1].map(function(f){
      var ag=Math.round(a0+span*f);
      /* 양끝 라벨이 화면 밖으로 나가지 않게 안으로 붙인다 */
      var st=(f===0)?'left:0;transform:none':((f===1)?'right:0;left:auto;transform:none':('left:'+(f*100)+'%'));
      return '<i style="'+st+'">'+ag+'세</i>';}).join('')+'</div>'+
    '</div>';
  /* 사건별 버티는 기간 */
  var maxM=1;
  L.ev.forEach(function(e){ if(e.keepA)maxM=Math.max(maxM,e.keepA,e.keepB||0,(e.off||0)); });
  h+='<div class="mon">'+L.ev.map(function(e){
    if(e.cost===null||!(e.cost>0))
      return '<div class="mo"><div class="mh">'+e.ic+' '+esc(e.t)+'</div>'+
        '<div class="mn">기준 치료비를 안 적으셔서 <b>버티는 기간을 셈하지 않았습니다.</b></div></div>';
    var offX=(e.off?(e.off/maxM*100):null);
    function bar(lbl,v,col){
      return '<div class="mb"><span>'+lbl+'</span><div class="t">'+
        '<i style="width:'+Math.min(100,(v||0)/maxM*100)+'%;background:'+col+'"></i>'+
        (offX!==null?('<u style="left:'+Math.min(100,offX)+'%"></u>'):'')+
        '</div><b style="color:'+col+'">'+(v===null?'—':(Math.round(v)+'개월'))+'</b></div>';
    }
    var g='';
    if(e.payB===false)g+='지금은 <b class="r">치료비도 다 못 냅니다</b> — 버티는 기간이 <b>0개월</b>입니다. ';
    if(e.off)g+='소득이 <b>'+e.off+'개월</b> 끊긴다고 보면, ';
    if(e.keepA!==null&&e.off)g+=(e.keepA>=e.off
      ? ('조정 후에는 그 기간을 <b class="o">메우고도 '+Math.round(e.keepA-e.off)+'개월</b>이 남습니다.')
      : ('조정 후에도 <b class="r">'+Math.round(e.off-e.keepA)+'개월</b>이 모자랍니다.'));
    if(e.lostInc)g+=' 그동안 <b>'+won(e.lostInc)+'</b>의 소득이 함께 사라집니다.';
    return '<div class="mo"><div class="mh">'+e.ic+' '+esc(e.t)+'</div>'+
      bar('전',e.keepB,'#94A3B8')+bar('후',e.keepA,'#3182F6')+
      (e.off?('<div class="mb"><span>공백</span><div class="t"><i style="width:'+Math.min(100,e.off/maxM*100)+'%;background:#FCA5A5"></i></div>'+
        '<b style="color:var(--rd)">'+e.off+'개월</b></div>'):'')+
      '<div class="mn">'+(g||'치료비를 내고 남는 돈으로 <b>'+Math.round(e.keepA||0)+'개월</b>을 버팁니다.')+'</div></div>';
  }).join('')+'</div>'+
  '<div class="note i">「버티는 기간」 = (준비된 목돈 − 기준 치료비) ÷ 월 생활비 '+(L.exp?('('+won(L.exp)+')'):'')+'. '+
  '<b>붉은 선</b>이 소득이 끊기는 기간입니다 — 막대가 그 선을 넘어야 <b>버팁니다.</b> '+
  '실손·통원처럼 쓴 만큼 나오는 담보는 <b>넣지 않았습니다.</b></div></div>'+
  sayLine('지금 '+a0+'세시니까 <b>'+Math.max(0,L.ret-a0)+'년</b>을 더 버시고, 그 뒤로 <b>'+Math.max(0,a1-L.ret)+'년</b>을 '+
    '벌어 둔 것으로 사십니다. 보험은 금액만이 아니라 <b>이 기간을 버티느냐</b>의 문제입니다.')+
  '</section>';
  return h;
}
/* ═══════════════ 표준 담보표 (고객용) ═══════════════ */
/* ── 그림 하나로 말한다 — 전 · 후 막대 ────────────────────────────
   고객은 숫자 네 개를 나란히 놓아 주면 <b>안 읽는다.</b> 길이가 다른 막대
   둘이면 설명 없이 읽는다. 그리는 자리는 <b>여기 하나</b>다 — 장마다
   따로 그리면 색이나 눈금이 어긋나 같은 자료가 달라 보인다.

   ■ 눈금은 <b>둘 중 큰 것</b>에 맞춘다. 각자 100%로 그리면 작은 쪽이
     꽉 찬 것처럼 보여 그림이 거짓말을 한다.
   ■ 값이 없으면 막대를 안 그린다. 0 으로 그리면 「없다」가 아니라
     「0 이다」로 읽힌다 (1번).                                       */
function cmpBar(lb,pb,pa,tb,ta){
  if(pb===null&&pa===null)return '';
  var max=Math.max(100,pb||0,pa||0);
  function row(nm,p,t,cls){
    if(p===null||p===undefined)return '<div class="cbr"><span class="cbn">'+nm+'</span>'+
      '<span class="cbt none">아직 안 적었습니다</span></div>';
    return '<div class="cbr"><span class="cbn">'+nm+'</span>'+
      '<span class="cbg"><i class="'+cls+'" style="width:'+Math.max(1,Math.round(p/max*100))+'%"></i>'+
      (max>100?('<u style="left:'+Math.round(100/max*100)+'%"></u>'):'')+'</span>'+
      '<span class="cbt">'+esc(t||'')+'<em>'+p+'%</em></span></div>';
  }
  return '<div class="cmpb"><div class="cbl">'+esc(lb)+'</div>'+
    row('지금',pb,tb,'b')+row('조정 후',pa,ta,'a')+
    /* 눈금이 100 을 넘을 때만 세로줄이 그어진다 — 안 그은 줄을 설명하지 않는다 */
    (max>100?'<div class="cbf">가는 세로줄이 <b>표준(권장) 100%</b> 자리입니다.</div>':
             '<div class="cbf">막대 끝이 <b>표준(권장) 100%</b> 입니다.</div>')+'</div>';
}
/* ── 담보표를 <b>묶음마다 한 장</b>으로 ────────────────────────────
   한 장에 표 열 개를 넣었더니 그 한 장이 <b>다섯 화면</b>이 됐다. 넘기는
   판에서 한 장이 다섯 화면이면 넘기는 뜻이 없고, 고객은 어디를 보는지
   모른다. 큰 갈래(병원비·3대질병·생활)로만 나눠 봤더니 3대질병 하나가
   <b>네 화면</b>이라 그대로였다 — 그 안에 묶음이 여섯이기 때문이다.

   그래서 <b>묶음(암·뇌·심장·수술비…)마다 한 장</b>으로 나눈다. 한 장이
   반 화면쯤이라 고객이 한눈에 본다. 위 목차에서 바로 건너뛴다.

   <b>숨기는 게 아니라 나누는 것</b>이다 — 담보는 하나도 안 빠지고,

/* 묶음 하나가 <b>표준 대비 얼마나 찼나</b> — 표를 읽기 전에 보는 그림 */
function stFill(C,g){return stFillRows(C,g.rows);}
function stFillRows(C,rows){
  var std=0,b=0,a=0,got=false;
  rows.forEach(function(r){
    /* 목돈(L)만 더한다 — 하루·매달·한도는 같은 자로 잴 수 없다 */
    if(UNIT[r.k]!=='L'||!r.std)return;
    std+=r.std;got=true;
    if(C.b[r.k]!==undefined)b+=C.b[r.k];
    if(C.a[r.k]!==undefined)a+=C.a[r.k];
  });
  if(!got||!std)return null;
  return {std:std,b:b,a:a,pb:Math.round(b/std*100),pa:Math.round(a/std*100)};
}

  var vis='<div class="tkm"><div><span>매달 내는 돈</span><b>'+fee(P.monB)+'<i>→</i>'+fee(P.monA)+'</b><u class="'+(d>0?'r':'o')+'">'+(d===null?'':(d>0?'+':(d<0?'−':''))+fee(Math.abs(d)))+'</u></div>'+
      '<div><span>앞으로 낼 돈</span><b>'+won(P.leftB)+'<i>→</i>'+won(P.leftA)+'</b></div>'+
      '<div><span>새로 생기는 담보 · 없어지는 담보</span><b><em class="o">+'+D.gain.length+'</em> · <em class="r">−'+D.loss.length+'</em></b></div></div>'+

      (D.loss.length?'<div><h5 class="r">없어지는 것 '+D.loss.length+'가지 — 아시고 정하셔야 합니다</h5>'+chips(D.loss,'l')+'</div>':'')+'</div>'+
    (no.length?'<div class="tkn"><b>'+esc(no.join(', '))+'</b>은 기준 치료비를 아직 안 정해서 「드는 돈」 을 세지 않았습니다.</div>':'');
  return '<section id="s3" data-grp="정리" data-nm="한 줄 요약"><h3>한 줄로 말씀드리면<small>돈 한 줄 · 병마다 한 장 · 생기는 것과 없어지는 것</small></h3>'+
    '<p class="sd">아래 문장은 <b>위에서 센 숫자를 그대로 옮긴 것</b>입니다 — 새로 만든 값이 없습니다.</p>'+
    vis+

    sayLine('여기까지가 <b>한 줄 요약</b>입니다. 지금 읽어 드린 문장은 전부 <b>위에서 센 숫자</b>를 그대로 옮긴 것이고, '+
      '새로 만든 값은 없습니다.')+

/* 고객 화면 — 납입 보험료가 어떻게 달라지는가 */
/* 보험료 셋을 <b>길이</b>로 — 두 값을 같은 자로 재야 뜻이 있다 */
function premBars(P){
  var rows=[['월 납입',P.monB,P.monA],['앞으로 낼 돈',P.leftB,P.leftA],['총 납입',P.totB,P.totA]];
  var out='';
  rows.forEach(function(r){
    var b=r[1],a=r[2];
    if(b===null||a===null||!isFinite(b)||!isFinite(a))return;
    var max=Math.max(b,a,1);
    out+='<div class="pbn">'+esc(r[0])+'</div>'+
      '<div class="pbg"><i class="b" style="width:'+Math.max(2,Math.round(b/max*100))+'%"></i></div>'+
      '<span>'+fee(b)+'</span>'+
      '<div class="pbg"><i class="a" style="width:'+Math.max(2,Math.round(a/max*100))+'%"></i></div>'+
      '<span>'+fee(a)+'</span>';
  });
  return out?('<div class="pbars"><div class="pbk"><span class="b">지금</span><span class="a">조정 후</span></div>'+out+'</div>'):'';
}
/* ── 해마다 내는 보험료 — 계약마다 <b>언제까지</b> 내는지로 쌓는다 (판 X319) ─────────────
   사장님 말씀 「보험료 변화 · 이 돈이 무엇이 되는가 신빙성이 떨어져 · 디테일 · 신빙성 있는 그래픽」.
   막대 셋(월 · 앞으로 · 총)만으로는 <b>왜</b> 그렇게 되는지가 안 보인다. 그래서 계약마다
   가입 시기 + 납입기간으로 <b>끝나는 해</b>를 셈해, 올해부터 해마다 실제로 나갈 보험료를
   지금 · 조정 후 두 줄로 그린다. 값은 <b>월 보험료 × 그 해에 내는 달 수</b> — 이자 · 갱신 인상은
   셈하지 않는다(1번). 납입기간을 모르는 계약은 그래프에서 빼고 그 수를 적는다. */
function premYears(P){
  var d=new Date(),now=d.getFullYear()*12+d.getMonth(),Y0=d.getFullYear();
  function abs(s){var m=(''+(s||'')).match(/^(\d{4})[-.\/ ]?(\d{1,2})/);return m?(+m[1]*12+(+m[2]-1)):null;}
  var lines=[],skip=0,endY=Y0;
  P.rows.forEach(function(r){
    var pol=r.pol,st=abs(pol.start),c=r.b||r.a,mTot=c?c.mTot:null;
    function seg(side,prem){
      if(prem===null||prem===undefined||!(prem>0))return;
      if(st===null||mTot===null){skip++;return;}
      var end=st+mTot,from=Math.max(now,st);
      if(end<=from)return;
      lines.push({side:side,prem:prem,from:from,end:end,co:pol.co||'',nm:pol.nm||''});
      endY=Math.max(endY,Math.floor((end-1)/12));
    }
    if(r.side==='before'){seg('b',r.b.prem);if(r.act!=='cancel')seg('a',r.aMon);}
    else seg('a',r.aMon);
  });
  endY=Math.min(endY,Y0+40);
  var ys=[],y;
  for(y=Y0;y<=endY;y++){
    var o={y:y,b:0,a:0};
    lines.forEach(function(l){
      var lo=Math.max(l.from,y*12),hi=Math.min(l.end,y*12+12),n=Math.max(0,hi-lo);
      o[l.side]+=l.prem*n;
    });
    ys.push(o);
  }
  return {ys:ys,lines:lines,skip:skip,Y0:Y0};
}
function premChart(P){
  var T=premYears(P),ys=T.ys;
  if(ys.length<2)return '';
  var W=600,H=272,L=58,R=14,Tp=18,B=38,iw=W-L-R,ih=H-Tp-B;
  var mx=Math.max.apply(null,ys.map(function(o){return Math.max(o.b,o.a);}).concat([1]));
  /* 눈금 — 1·2·5 단위로 둥글게 */
  var raw=mx/4,p=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),st=[1,2,5,10].map(function(k){return k*p;}).filter(function(v){return v>=raw;})[0];
  mx=Math.ceil(mx/st)*st;
  var n=ys.length,bw=iw/n;
  function X(i){return L+i*bw;}
  function Yv(v){return Tp+ih-(v/mx)*ih;}
  var age=num(S.who.age),s='';
  for(var g=0;g<=mx+1e-9;g+=st){
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Yv(g)+'" y2="'+Yv(g)+'" stroke="#E7E0D2" stroke-width="1"/>'+
       '<text x="'+(L-6)+'" y="'+(Yv(g)+4)+'" text-anchor="end" font-size="12" fill="#68737F">'+(g?man(Math.round(g))+'':'0')+'</text>';
  }
  function path(k){var d='';ys.forEach(function(o,i){var yy=Yv(o[k]);d+=(i?'L':'M')+X(i)+' '+yy+'H'+X(i+1);});return d;}
  s+='<path d="'+path('b')+'V'+Yv(0)+'H'+L+'Z" fill="#CBD2DC" fill-opacity=".55"/>'+
     '<path d="'+path('b')+'" fill="none" stroke="#8B95A1" stroke-width="2.5"/>'+
     '<path d="'+path('a')+'" fill="none" stroke="var(--bl,#2A5BD7)" stroke-width="3.5"/>';
  var every=n>24?5:(n>12?2:1);
  ys.forEach(function(o,i){
    if(i%every&&i!==n-1)return;
    s+='<text x="'+(X(i)+bw/2)+'" y="'+(H-B+17)+'" text-anchor="middle" font-size="12" fill="#4E5968" font-weight="700">'+o.y+'</text>'+
      (age!==null?'<text x="'+(X(i)+bw/2)+'" y="'+(H-B+32)+'" text-anchor="middle" font-size="11" fill="#8B95A1">'+(age+i)+'세</text>':'');
  });
  s+='<text x="'+L+'" y="11" font-size="12" fill="#68737F" font-weight="700">해마다 내는 보험료 (그 해 합계)</text>';
  var sumB=ys.reduce(function(t,o){return t+o.b;},0),sumA=ys.reduce(function(t,o){return t+o.a;},0);
  return '<div class="pr2c"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="해마다 내는 보험료 — 지금과 조정 후">'+s+'</svg>'+
    '<div class="pr2l"><span><i class="b"></i>지금 — 올해부터 '+man(Math.round(sumB))+'원</span><span><i class="a"></i>조정 후 — '+man(Math.round(sumA))+'원</span>'+
    (T.skip?'<em>납입기간을 모르는 '+T.skip+'건은 그래프에서 뺐습니다</em>':'')+'</div></div>';
}
function premRows(P){
  var LB={keep:'유지',endo:'배서',cancel:'해지',new:'새 계약'},CL={keep:'k',endo:'e',cancel:'c',new:'n'};
  var Y0=(new Date()).getFullYear();
  function endTxt(c,pol){
    var m=(''+(pol.start||'')).match(/^(\d{4})[-.\/ ]?(\d{1,2})/);
    if(!m||!c||c.mTot===null)return '납입기간 모름';
    if(c.done)return '<b class="ok">납입 끝</b>';
    var e=(+m[1])*12+(+m[2]-1)+c.mTot,ey=Math.floor((e-1)/12);
    return '<span title="'+Math.round(c.mTot/12)+'년납"><b>'+ey+'년</b>까지 · '+Math.max(0,ey-Y0+1)+'년 남음</span>';
  }
  return '<table class="pr2t"><thead><tr><th>계약</th><th>납입 끝</th><th>월 보험료</th><th>앞으로 낼 돈</th></tr></thead><tbody>'+
    P.rows.map(function(r){
      var c=r.b||r.a,bm=r.b?r.b.prem:null,bl=r.b?r.b.left:null;
      return '<tr class="'+CL[r.act]+'"><td><b>'+esc(r.pol.co||'—')+'</b> <span class="tg">'+LB[r.act]+'</span><small>'+esc(r.pol.nm||'')+'</small></td>'+
        '<td>'+endTxt(c,r.pol)+'</td>'+
        '<td class="n">'+(r.side==='before'?fee(bm):'—')+'<i>→</i><b>'+(r.aMon===null||r.aMon===undefined?'—':fee(r.aMon))+'</b></td>'+
        '<td class="n">'+(r.side==='before'?won(bl):'—')+'<i>→</i><b>'+(r.aLeft===null||r.aLeft===undefined?'—':won(r.aLeft))+'</b></td></tr>';
    }).join('')+'</tbody></table>';
}

  var h='<section id="s2" data-grp="돈은 이렇게 됩니다" data-nm="보험료 변화"><h3>보험료는 이렇게 달라집니다<small>계약마다 언제까지 · 해마다 얼마 — 월 · 앞으로 낼 돈 · 총 납입</small></h3>'+
    '<p class="sd">월 보험료만 보면 절반만 보는 것입니다. <b>앞으로 낼 돈</b>이 실제로 통장에서 더 나갈 금액입니다.</p>'+
    /* 판 X319 — 해마다 나갈 보험료 그래프 + 계약별 표. 숫자 셋(월 · 앞으로 · 총)은 위 띠로 */
    '<div class="pr2k">'+

       '총 납입(낸 것 + 낼 것)|'+won(P.totB)+'|'+won(P.totA)+'|'+(P.totD===null?'':((P.totD>0?'▲ ':(P.totD<0?'▼ ':''))+won(Math.abs(P.totD))))]
      .map(function(x){var q=x.split('|');return '<div><span>'+q[0]+'</span><b>'+q[1]+'<i>→</i><em>'+q[2]+'</em></b><u>'+q[3]+'</u></div>';}).join('')+

      premBox('앞으로 낼 돈','오늘부터 납입 끝까지',P.leftB,P.leftA,P.leftD,false,premWhy(P,'left'),P.noTermB+P.noTermA)+
      premBox('총 납입 보험료','이미 낸 것 + 앞으로 낼 것',P.totB,P.totA,P.totD,false,premWhy(P,'tot'),P.noTermB+P.noTermA)+
    '</div>';
  if(P.monD>0&&P.leftD<0)
    h+='<div class="note g">매달은 <b>'+fee(P.monD)+' 더</b> 나가지만 앞으로 낼 돈은 <b>'+fee(-P.leftD)+' 줄어듭니다.</b></div>';
  h+=sayLine((P.leftB===null||P.leftA===null)?
      '월 보험료만 보면 절반만 보시는 겁니다 — <b>앞으로 낼 돈</b>까지 같이 보셔야 합니다.':
      ('통장에서 나갈 돈 '+won(P.leftB)+' → <b>'+won(P.leftA)+'</b> — 그래프의 <b>계단</b>이 계약이 끝나는 해입니다.'));

/* 장이 이어진다 — <b>어디에 무엇이 있는지</b> 먼저 보여 준다.
   여기는 <b>장의 짧은 이름표</b>만 든다. 「어떤 장이 실제로 섰는가」는
   이 표가 아니라 <b>화면</b>이 안다(deckList) — 자료가 없어 안 그려진 장이
   있기 때문이다. 표로 세면 빈 장이 목차에 남는다.                       */
/* 장의 <b>짧은 이름</b>은 그 장이 스스로 들고 있다(data-nm). 따로 표를
   두면 장을 하나 늘릴 때마다 표에 적는 것을 잊고, 목차에 「제 8 장」 같은
   말이 뜬다. 실제로 담보표를 셋으로 쪼개면서 그 자리가 생겼다. */
function secName(el){
  if(!el)return '';
  return el.getAttribute('data-nm')||'';
}

/* ══ 고객이 보는 「왜 나에게 맞는가」 ═══════════════════════════════
   고객은 <b>남의 표준</b>을 보고 정하지 않는다. 「이게 <b>왜 나한테</b>
   맞는데?」 가 안 풀리면 아무리 좋은 설계도 안 넘어간다.

   ■ 이유는 <b>이 사람의 사정</b>에서만 가져온다 — 나이 · 가족 · 소득 ·
     지금 들고 있는 계약. 없는 사정은 지어내지 않는다.
   ■ 「지금 무슨 상담을 받고 있는지」 도 함께 보여 준다 — 어디까지 왔고
     무엇이 남았는지 모르면 <b>불안해서</b> 못 정한다.                  */
function whyCalc(){
  var o=pointCalc(),F=fitCalc(),C=o.C,P=F.prem,r=[];
  /* ① 나이 · 가족에서 */
  if(o.age!==null&&o.band)
    r.push({ic:'👤',t:'지금 '+o.age+'세, '+esc(o.band.t)+'이시라',
      d:o.band.one+' 그래서 <b>'+((o.band.first||[])[0]||'')+'</b> 쪽을 먼저 보았습니다.'});
  if(o.kids.length){
    var k=o.kids[0];
    r.push({ic:'👨‍👩‍👧',t:esc(k.rel)+'가 '+k.age+'살, 앞으로 '+k.until+'년',
      d:'<b>'+k.until+'년</b>은 더 책임지셔야 합니다. 이 기간에 무슨 일이 생기면 '+
        (o.exp!==null?('매달 <b>'+won(o.exp)+'</b>의 생활비가 <b>그대로</b> 나갑니다.'):'생활비는 그대로 나갑니다.')+
        ' 그래서 <b>사망 · 소득중단</b>을 이 기간에 맞춰 잡았습니다.'});
  }
  /* ② 소득 · 여력에서 */
  if(o.inc!==null&&o.exp!==null)
    r.push({ic:'💳',t:'쓰고 남는 돈이 월 '+won(o.free),
      d:'보험료를 <b>여기 안에서</b> 잡았습니다. 조정 후 <b>'+fee(P.aft)+'</b>'+
        (F.capFree!==null?(' — 남는 돈의 <b>'+F.premPct+'%('+fee(F.capFree)+')</b> 안쪽입니다.'):'.')+
        ' <b>끝까지 낼 수 있는 금액</b>이어야 의미가 있습니다.'});
  /* ③ 지금 계약에서 — 잘하고 계신 것도 말한다 */
  var good=[];
  if(C.b.silD!==undefined||C.b.silson!==undefined)good.push('<b>실손</b>을 들고 계십니다');
  if(o.paidUp.length)good.push('<b>'+esc(o.paidUp[0].nm)+'</b>은 이미 납입이 끝났습니다');
  F.rows.forEach(function(x){ if(x.rate!==null&&x.rate>=100&&good.length<3)good.push('<b>'+esc(x.t)+'</b>은 이미 넉넉합니다'); });
  if(good.length)
    r.push({ic:'✅',t:'이미 잘 되어 있는 것',
      d:good.join(' · ')+'. <b>이건 그대로 둡니다</b> — 바꾸자는 이야기가 아닙니다.'});
  /* ④ 비는 곳 — 왜 그게 문제인지 */
  if(o.gaps.length){
    var g=o.gaps[0];
    r.push({ic:'🕳',t:esc(g.t)+'이 오면 '+won(g.gap)+'이 빕니다',
      d:'드는 돈 <b>'+won(g.cost)+'</b> 가운데 지금 나오는 것이 <b>'+won(g.have)+'</b>입니다. '+
        '나머지는 <b>통장에서</b> 나갑니다 — 그래서 여기를 먼저 채웠습니다.'});
  }
  /* ⑤ 범위 */
  if(o.narrow.length){
    var w=o.narrow[0];
    r.push({ic:'🎯',t:esc(w.t)+' 담보가 「'+esc(w.has)+'」 뿐이라',
      d:'이 담보는 <b>정해진 병일 때만</b> 나옵니다. 같은 값이면 <b>'+esc(w.want)+'</b>이 어떤 경우든 열립니다 — '+
        '<b>금액을 키운 게 아니라 범위를 넓혔습니다.</b>'});
  }
  /* ⑥ 안 한 것도 말한다 */
  var not=[];
  if(o.paidUp.length)not.push('납입 끝난 계약은 <b>건드리지 않았습니다</b>');
  if(C.b.silD!==undefined||C.b.silson!==undefined)not.push('오래된 <b>실손은 그대로</b> 두었습니다');
  var keepN=0;S.before.forEach(function(x){if((x.act||'keep')==='keep')keepN++;});
  if(keepN)not.push('기존 계약 <b>'+keepN+'건</b>은 그대로 유지합니다');
  if(not.length)r.push({ic:'🤝',t:'일부러 안 바꾼 것',d:not.join(' · ')+'. <b>바꿀 이유가 없는 것은 안 바꿉니다.</b>'});

}

  for(i=0;i<L.length;i++){
    /* 가로로 뽑는 중에는 <b>전부</b> 세운다 — 한 쪽에 한 장씩 나가야 한다.
       무대 모양(.cur)이 안 붙으면 칸이 무너져 글자가 한 자씩 줄바꿈된다.
       인쇄 직전 printAllOn() 이 다시 그리므로 여기서 답해야 한다 —
       「지금 어느 장인가」를 아는 자리는 여기 하나뿐이다 (5번). */
    if(BA_LAND||(on&&i===cur))L[i].classList.add('cur');else L[i].classList.remove('cur');
    /* 제목 앞 <b>01.</b> — 여기가 순서를 아는 유일한 자리다. CSS 로는 못 센다
       (안 보이는 장은 counter 가 늘지 않아 늘 00 이 된다). 표지는 0 이라 뺀다. */
    L[i].style.setProperty('--no',i?('"'+(i<10?'0':'')+i+'."'):'""');
  }
  toc=document.getElementById('baToc');
  if(toc){toc.innerHTML=L.map(function(el,i){
    return '<a href="#'+el.id+'"'+(on&&i===cur?' class="on"':'')+' onclick="return deckJump('+i+')">'+
      '<b>'+(i+1)+'</b>'+esc(secName(el)||('제 '+(i+1)+' 장'))+'</a>';
    }).join('');
    /* 무대 안 「오늘 순서」도 <b>같은 목록</b>에서 그린다 — 두 곳에 두지 않는다.
       자기 자신과 표지는 뺀다(제 이름을 제 목차에 적지 않는다). */
    /* 묶음은 <b>장이 스스로</b> 들고 있다(data-grp) — 여기서 다시 정하지
       않는다. 장을 옮기면 순서도 따라 옮겨진다 (5번). */
    var tin=document.getElementById('deckToc');
    if(tin){
      var blocks=[],cb=null;
      L.forEach(function(el,i){
        if(i===0||el.id==='sToc'||el.id==='sSee')return;   /* 판 X349 — 고르는 장도 목차가 아니다 */
        var g=el.getAttribute('data-grp')||'';
        if(!cb||cb.g!==g){cb={g:g,items:[]};blocks.push(cb);}
        cb.items.push({i:i,id:el.id,nm:secName(el)||('제 '+i+' 장')});
      });
      tin.innerHTML=blocks.map(function(b){
        return '<div class="tgc"><div class="tgh">'+esc(b.g||'그 밖에')+
          '<em>'+b.items.length+'</em></div>'+
          b.items.map(function(x){
            return '<a href="#'+x.id+'" onclick="return deckJump('+x.i+')">'+
              '<b>'+(x.i<10?'0':'')+x.i+'</b><span>'+esc(x.nm)+'</span></a>';
          }).join('')+'</div>';
      }).join('');
    }
    /* 한 줄로 누웠으니 <b>지금 장</b>이 눈에 들어오게 밀어 준다 */
    if(on){var cc=toc.children[cur];
      if(cc&&cc.offsetLeft!==undefined)toc.scrollLeft=Math.max(0,cc.offsetLeft-toc.clientWidth/2+cc.offsetWidth/2);}
  }
  bar=document.getElementById('deckBar');
  /* 띠에는 <b>어디쯤인지</b>만 둔다. 「몇 번째 장으로」 는 위 목차가 이미
     하는 일이라, 여기에 또 두면 같은 것이 두 곳이 된다 (5번). */
  if(bar)bar.innerHTML=(!on||!L.length)?'':(
    '<button class="dnav" onclick="deckMove(-1)"'+(cur<=0?' disabled':'')+' aria-label="앞 장">◀</button>'+
    '<div class="dbar"><i style="width:'+Math.round((cur+1)/L.length*100)+'%"></i></div>'+
    '<span class="dt">'+esc(secName(L[cur]))+(function(){var w=rpWin(L[cur]),p=w&&w.REP.pos();
      return p&&p[1]>1?' <small class="dsub">· '+p[0]+' / '+p[1]+'쪽</small>':'';})()+'</span>'+
    '<span class="dn"><b>'+(cur+1)+'</b> / '+L.length+'</span>'+
    '<button class="dnav" onclick="deckMove(1)"'+(cur>=L.length-1?' disabled':'')+' aria-label="다음 장">▶</button>'+
    '<button class="dnav kk" onclick="baKakao()" aria-label="이 장을 카톡으로 복사" title="보고 계신 이 장을 글로 복사합니다">💬</button>'+
    '<button class="dnav'+(baWalkOn()?' on':'')+'" onclick="baWalkSet('+(baWalkOn()?'false':'true')+')" aria-label="설계사 길잡이 켜고 끄기" title="장마다 ① 짚기 ② 읽기 ③ 물으면">'+(baIco('compass',18)||'길잡이')+'</button>'+
    (DECK_SHOW?'<button class="dnav x" onclick="deckShow(false)" aria-label="발표 끝내기">✕</button>':''));
  baGistPaint(L,on);   /* 판 X349 — 장마다 한 줄 결론 */
  baTermPaint(L,on);   /* 판 X348 — 어려운 말은 처음 나오는 장에 한 줄 풀이 */
  baWalkPaint(L,cur,on);
  deckFit();
}

function baTermClear(root){
  [].slice.call(root.querySelectorAll('.tmg')).forEach(function(x){x.remove();});
  [].slice.call(root.querySelectorAll('[data-tmz]')).forEach(function(x){x.style.zoom='';x.removeAttribute('data-tmz');});
  [].slice.call(root.querySelectorAll('u.tmw')).forEach(function(u){var p=u.parentNode;p.replaceChild(document.createTextNode(u.textContent),u);p.normalize();});
}
/* secs — 순서대로 훑을 장들 · put(장, 풀이 줄) — 풀이를 어디에 둘지. 단 풀이 수를 돌려준다 */
function baTermMark(secs,put){
  var seen={},n=0;
  secs.forEach(function(sec){
    var got=[];
    BA_TERMS.forEach(function(t){
      if(seen[t[0]])return;
      var w=document.createTreeWalker(sec,NodeFilter.SHOW_TEXT,{acceptNode:function(x){
        var e=x.parentNode;
        if(!e||(e.closest&&e.closest('script,style,.tmg,u.tmw,button,input,select,textarea,option,.noprint,h3.hasgist small')))return NodeFilter.FILTER_REJECT;
        return x.nodeValue.indexOf(t[0])>=0?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP;}});
      var x=w.nextNode();if(!x)return;
      var r=x.splitText(x.nodeValue.indexOf(t[0]));r.splitText(t[0].length);
      var u=document.createElement('u');u.className='tmw';u.textContent=t[0];r.parentNode.replaceChild(u,r);
      seen[t[0]]=1;got.push(t);
    });
    if(!got.length)return;
    var p=document.createElement('p');p.className='tmg';
    p.innerHTML='<i>📖</i>'+got.map(function(t){return '<span><b>'+t[1]+'</b> '+t[2]+'</span>';}).join('');
    put(sec,p);n+=got.length;
  });
  return n;
}
function baTermPaint(L,on){
  var box=document.querySelector('.show');if(!box)return;
  baTermClear(box);
  if(!on)return;
  baTermMark(L.filter(function(s){return !/^r_/.test(s.id||'');}),function(sec,p){
    var say=sec.querySelector(':scope>p.say');if(say)sec.insertBefore(p,say);else sec.appendChild(p);});
  /* 꽉 찬 장은 풀이 한 줄 때문에 넘칠 수 있다(글꼴이 다른 컴퓨터에서 s7 · sSave · sTrust 가 6~22px) —
     그 장만, 넘친 만큼만 본문(제목 · 풀이 · 말풍선 사이)을 줄인다. 잴 수 있는 것은 지금 선 장뿐이라 그릴 때마다 잰다. */
  var cur=box.querySelector(':scope>section.cur');
  if(!cur||!cur.querySelector(':scope>.tmg'))return;
  var d=cur.scrollHeight-cur.clientHeight;if(d<=1)return;
  var mid=[].slice.call(cur.children).filter(function(e){var cs=getComputedStyle(e);
    return !/^H3$/.test(e.tagName)&&!e.classList.contains('tmg')&&!e.classList.contains('say')&&cs.position!=='absolute'&&cs.display!=='none';});
  var tot=0;mid.forEach(function(e){tot+=e.offsetHeight;});if(!tot)return;
  var z=Math.max(.85,(tot-d-4)/tot);
  mid.forEach(function(e){e.style.zoom=z;e.setAttribute('data-tmz','1');});
}

function baTopCov(D){

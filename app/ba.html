<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보장 전·후 만들기 — APEX YUN PRO</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--nv:#191F28;--gy:#6B7684;--gy2:#8B95A1;--ln:#E5E8EB;--bg:#F2F4F6;
 --bl:#3182F6;--bl2:#E8F3FF;--gd:#B99A3A;--rd:#DC2626;--rd2:#FEF2F2;
 --gr:#0F766E;--gr2:#ECFDF5;--or:#B45309;--or2:#FFFBEB;--pu:#7C3AED;--pu2:#F5F3FF}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
 background:var(--bg);color:var(--nv);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:1460px;margin:0 auto;padding:16px 14px 90px}
.bar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--ln);margin:-16px -14px 16px;padding:10px 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.bar .lg{font-size:16px;font-weight:800;letter-spacing:-.02em}.bar .lg em{font-style:normal;color:var(--bl)}
.bar .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tab{appearance:none;border:1px solid var(--ln);background:#fff;color:var(--gy);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700}
.tab.on{background:var(--nv);border-color:var(--nv);color:#fff}
.btn{appearance:none;border:1px solid var(--bl);background:var(--bl);color:#fff;border-radius:10px;padding:8px 15px;font-size:13px;font-weight:800}
.btn.g{background:#fff;color:var(--bl)}.btn.n{background:#fff;border-color:var(--ln);color:var(--gy)}
.btn.d{background:#fff;border-color:#FECACA;color:var(--rd)}
.mini{appearance:none;border:1px solid var(--ln);background:#fff;color:var(--gy);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700}
.mini.on{background:var(--nv);border-color:var(--nv);color:#fff}.mini.d{border-color:#FECACA;color:var(--rd)}
.mini.go{background:var(--bl);border-color:var(--bl);color:#fff}
.grid{display:grid;grid-template-columns:1fr 340px;gap:15px;align-items:start}
.side{position:sticky;top:66px;display:flex;flex-direction:column;gap:11px}
@media(max-width:1180px){.grid{grid-template-columns:1fr}.side{position:static}}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:17px 19px;margin-bottom:13px}
.card>h2{margin:0 0 3px;font-size:16px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .n{width:22px;height:22px;border-radius:7px;background:var(--nv);color:#fff;font-size:12px;font-weight:800;
 display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.card>h2 .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.card>p{margin:0 0 13px;font-size:12px;color:var(--gy);line-height:1.7}.card>p b{color:var(--nv)}
.f{display:grid;gap:9px}.f.c2{grid-template-columns:repeat(2,1fr)}.f.c3{grid-template-columns:repeat(3,1fr)}
.f.c4{grid-template-columns:repeat(4,1fr)}.f.c5{grid-template-columns:repeat(5,1fr)}.f.c6{grid-template-columns:repeat(6,1fr)}
@media(max-width:820px){.f.c3,.f.c4,.f.c5,.f.c6{grid-template-columns:repeat(2,1fr)}}
.f label{display:block;font-size:12px;font-weight:700;color:var(--gy2);margin-bottom:3px}
.f input,.f select{width:100%;border:1px solid var(--ln);border-radius:9px;padding:8px 10px;font-size:13px;font-weight:700;background:#fff;min-height:38px}
.f input:focus,.f select:focus{outline:2px solid #BFDBFE;border-color:var(--bl)}
.f .u{position:relative}.f .u input{padding-right:36px;text-align:right}
.f .u i{position:absolute;right:10px;bottom:10px;font-style:normal;font-size:12px;font-weight:700;color:var(--gy2);pointer-events:none}
/* ── 계약 한 줄 ── 왼쪽 색 띠로 유지·배서·해지를 <b>글자 없이</b> 센다 */
.pol{border:1px solid var(--ln);border-left:4px solid var(--ln);border-radius:13px;
 padding:11px 13px;margin-bottom:8px;background:#fff}
.pol.keep{border-left-color:var(--gr)}
.pol.new{border-color:#DDD6FE;border-left-color:var(--pu);background:#FDFCFF}
.pol.off{background:#FAFBFC;opacity:.6;border-left-color:var(--rd)}
.pol.endo{border-color:#FDE68A;border-left-color:var(--or);background:#FFFDF6}
.pol.open{padding:13px 14px}
.pol .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pol.open .ph{margin-bottom:10px}
.pcar{appearance:none;border:0;background:#F2F4F6;color:var(--gy);border-radius:7px;
 width:24px;height:24px;font-size:11px;font-weight:800;flex:none;padding:0}
.pcar:hover{background:var(--ln);color:var(--nv)}
/* 접힌 줄에는 <b>돈 둘</b>만 — 다섯을 늘어놓으면 어느 것이 중요한지 안 보인다 */
.paym{display:flex;gap:5px;flex-wrap:wrap}
.paym span{font-size:12px;font-weight:700;color:var(--gy);background:#F8FAFC;
 border:1px solid var(--ln);border-radius:7px;padding:3px 8px;white-space:nowrap}
.paym span b{color:var(--nv);font-weight:800}
.paym span.w{background:var(--or2);border-color:#FDE68A;color:var(--or)}.paym span.w b{color:#92400E}
.paym span.g{background:var(--gr2);border-color:#A7F3D0;color:var(--gr)}.paym span.g b{color:#065F46}
.paym span.q{color:var(--gy2)}.paym span.q b{color:var(--gy2)}
/* 위 띠 — 자주 쓰는 것만 세우고 나머지는 <b>⋯ 더보기</b> 안에 */
.moreWrap{position:relative}
.moreBox{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:70;min-width:210px;
 background:#fff;border:1px solid var(--ln);border-radius:12px;padding:6px;
 box-shadow:0 12px 30px rgba(0,0,0,.13);flex-direction:column;gap:4px}
.moreBox.on{display:flex}
.moreBox button{width:100%;text-align:left}
/* 옆 칸의 목록은 <b>자르지 않고</b> 이 안에서 굴린다 */
.sum .lis{max-height:340px;overflow-y:auto;overscroll-behavior:contain}
/* ── 자동 보장분석 다섯 칸 ── */
.ftabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin:12px 0 15px}
.ftb{appearance:none;text-align:left;border:1px solid var(--ln);background:#fff;border-radius:12px;
 padding:10px 12px;position:relative;font-family:inherit}
.ftb i{display:block;font-style:normal;font-size:10.5px;font-weight:800;color:var(--gy2);
 background:#F2F4F6;border-radius:5px;width:18px;height:18px;line-height:18px;text-align:center;margin-bottom:5px}
.ftb b{display:block;font-size:13px;font-weight:800;color:var(--nv)}
.ftb em{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--gy2);margin-top:2px}
.ftb.on{border-color:var(--nv);background:var(--nv)}
.ftb.on i{background:rgba(255,255,255,.22);color:#fff}
.ftb.on b{color:#fff}.ftb.on em{color:rgba(255,255,255,.72)}
.fitsec{display:none}
.fitsec.on{display:block}
/* ── 롤플레잉 대본 ── */
.brp{margin-top:9px;border-top:1px dashed var(--ln);padding-top:9px}
.brp>summary{font-size:12px;font-weight:800;color:var(--bl);cursor:pointer;list-style:none;
 background:var(--bl2);border-radius:8px;padding:6px 10px;display:inline-block}
.brp>summary::-webkit-details-marker{display:none}
.brp[open]>summary{margin-bottom:9px}
.brc,.brm{display:flex;gap:7px;margin-bottom:6px;align-items:flex-start}
.brc>span,.brm>span{flex:none;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px;margin-top:2px}
.brc>span{background:#F2F4F6;color:var(--gy)}
.brm>span{background:var(--nv);color:#fff}
.brc>p,.brm>p{margin:0;font-size:12.5px;line-height:1.75}
.brc>p{color:var(--gy)}
.brm>p{color:var(--nv)}.brm>p b{font-weight:800}
.brf{font-size:11px;color:var(--gy2);margin-top:8px;line-height:1.6}
.gnote{font-size:11.5px;color:var(--gy);background:var(--bl2);border:1px solid #CFE0FE;
 border-radius:9px;padding:7px 10px;margin:-3px 0 9px;line-height:1.6}
.gnote b{color:var(--nv)}
/* 진단서는 통째로 드리는 종이다 — 인쇄하면 다섯 칸이 전부 나온다 */
@media print{.fitsec{display:block!important}}
.pol .ph b{font-size:14px;font-weight:800}.pol .ph .sub{font-size:12px;color:var(--gy);font-weight:700}
.pol .ph .rt{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tg{display:flex;gap:4px}
.tg button{appearance:none;border:1px solid var(--ln);background:#fff;color:var(--gy);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:800}
.tg button.k.on{background:var(--gr);border-color:var(--gr);color:#fff}
.tg button.e.on{background:var(--or);border-color:var(--or);color:#fff}
.tg button.c.on{background:var(--rd);border-color:var(--rd);color:#fff}
.tag{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px}
.tag.kb{color:#1B64DA;background:var(--bl2)}.tag.hand{color:var(--gy);background:#F2F4F6}
.tag.h{color:var(--pu);background:var(--pu2)}
/* ── 담보 입력판 — 한눈에 ── */
.gsel{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.gsel button{appearance:none;border:1px solid var(--ln);background:#fff;color:var(--gy);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.gsel button.on{background:var(--nv);border-color:var(--nv);color:#fff}
.gsel button b{color:var(--bl)}.gsel button.on b{color:#8FC0FF}
.pad{border:1px solid var(--ln);border-radius:11px;overflow:hidden}
.pad .ph2{background:#F8FAFC;padding:6px 11px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.pad .ph2 .dot{width:8px;height:8px;border-radius:3px}
.pad .ph2 em{font-style:normal;margin-left:auto;font-size:10.5px;color:var(--gy2);font-weight:700}
.pad .gr2{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:0}
.pr{display:flex;align-items:center;gap:6px;padding:5px 9px;border-top:1px solid #F5F6F8;border-right:1px solid #F5F6F8}
.pr.has{background:#F8FBFF}
.pr .nm{flex:1;min-width:0;font-size:12px;font-weight:700;line-height:1.3}
.pr .nm em{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--gy2)}
.pr .nm i{font-style:normal;font-size:10.5px;font-weight:800;color:var(--or);background:var(--or2);border-radius:4px;padding:0 4px;margin-left:3px}
.pr input{width:70px;border:1px solid var(--ln);border-radius:6px;padding:4px 6px;font-size:12px;font-weight:800;text-align:right;min-height:28px}
.pr .un{font-size:10.5px;font-weight:700;color:var(--gy2);width:24px;flex:0 0 auto}
.kb{border:1px solid #C7D2FE;background:#F7FAFF;border-radius:14px;padding:13px 15px;margin-bottom:11px}
.kb .kh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.kb .kh b{font-size:14px;font-weight:800}.kb .kh .btn{margin-left:auto}
.kb .kd{font-size:12px;color:var(--gy);line-height:1.7}.kb .kd b{color:var(--nv)}
.drop{border:2px dashed #C7D2FE;border-radius:12px;background:#fff;padding:18px 14px;text-align:center;font-size:12px;color:var(--gy);font-weight:700;margin-top:8px}
.drop.on{border-color:var(--bl);background:var(--bl2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips span{font-size:12px;font-weight:700;color:var(--gy);background:#fff;border:1px solid var(--ln);border-radius:8px;padding:5px 10px}
.chips span b{color:var(--nv);font-weight:800}
.chips span.w{background:var(--or2);border-color:#FDE68A;color:var(--or)}.chips span.w b{color:#92400E}
.chips span.g{background:var(--gr2);border-color:#A7F3D0;color:var(--gr)}.chips span.g b{color:#065F46}
.note{font-size:12px;line-height:1.7;border-radius:10px;padding:10px 12px;margin-top:9px}.note b{font-weight:800}
.note.i{background:#F8FAFC;color:var(--gy)}.note.i b{color:var(--nv)}
.note.w{background:var(--or2);color:var(--or);border:1px solid #FDE68A}.note.w b{color:#92400E}
.note.g{background:var(--gr2);color:var(--gr);border:1px solid #A7F3D0}.note.g b{color:#065F46}
/* ── 표준 담보표 ── */
.st{border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin-bottom:10px}
.st .sh{background:#F8FAFC;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800}
.st .sh .dot{width:9px;height:9px;border-radius:3px}
.st .sh .big{font-size:10.5px;font-weight:800;color:var(--gy2);background:#fff;border:1px solid var(--ln);border-radius:5px;padding:1px 6px}
.st .sh .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--gy2)}
.st table{width:100%;border-collapse:collapse}
.st th{font-size:10.5px;font-weight:800;color:var(--gy2);padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
.st th:first-child{text-align:left}
.st td{padding:5px 8px;border-bottom:1px solid #F5F6F8;text-align:right;white-space:nowrap;font-size:12px}
.st td:first-child{text-align:left;font-weight:700;white-space:normal}
.st td .un{font-size:10.5px;font-weight:700;color:var(--gy2)}
.st td .cov{font-size:10.5px;font-weight:800;color:var(--or);background:var(--or2);border-radius:4px;padding:0 4px;margin-left:3px}
.st td.std{color:var(--gy2);font-weight:700}
.st input{width:92px;border:1px solid var(--ln);border-radius:7px;padding:5px 7px;font-size:12px;font-weight:800;text-align:right;min-height:30px;background:#fff}
.st input.auto{color:var(--gy);background:#FBFCFD}
.st input.hand{border-color:#DDD6FE;background:var(--pu2);color:var(--pu)}
.st td.df{font-weight:800}.st td.df.up{color:var(--bl)}.st td.df.dn{color:var(--rd)}.st td.df.same{color:#C4CBD3}
.st .rst{appearance:none;border:0;background:transparent;color:var(--pu);font-size:12px;font-weight:800;cursor:pointer;padding:0 0 0 3px}
.st td.rd{font-size:10.5px;font-weight:800}
.st td.rd.up{color:var(--gr)}.st td.rd.no{color:var(--rd)}.st td.rd.mid{color:var(--or)}
/* ── 붙박이 ── */
.sum{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px 15px}
.sum .hh{font-size:13px;font-weight:800;margin-bottom:9px;display:flex;align-items:center}
.sum .hh em{font-style:normal;margin-left:auto;font-size:12px;font-weight:800;color:var(--gy2)}
.sum.loss{border-left:4px solid var(--rd)}.sum.gain{border-left:4px solid var(--gr)}
.prem{display:flex;align-items:center;gap:9px}.prem>div{flex:1}
.prem .ar{flex:0 0 auto;color:var(--gy2);font-weight:800;font-size:16px}
.prem span{display:block;font-size:10.5px;font-weight:700;color:var(--gy2)}
.prem b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.prem b.up{color:var(--rd)}.prem b.dn{color:var(--gr)}
.li{border-top:1px solid #F1F3F5;padding:8px 0}.li:first-of-type{border-top:0;padding-top:0}
.li .n{font-size:12px;font-weight:800}
.li .n i{font-style:normal;font-size:10.5px;font-weight:800;color:#fff;background:var(--gy2);border-radius:5px;padding:1px 6px;margin-left:4px}
.li .d{font-size:12px;color:var(--gy);margin-top:2px}.li .d b{color:var(--nv)}
.empty{font-size:12px;color:var(--gy);line-height:1.6}
/* ── 인체 해부도 ── */
.anat{position:relative;display:grid;grid-template-columns:1fr 300px 1fr;gap:12px;align-items:center}
@media(max-width:940px){.anat{grid-template-columns:1fr}}
.anat .fig{display:flex;justify-content:center;position:relative}
.anat .fig svg{width:100%;max-width:290px;height:auto}
.pin{border:1px solid var(--ln);border-radius:12px;background:#fff;padding:10px 12px;margin-bottom:9px;position:relative}
.pin.on{border-color:var(--bl);box-shadow:0 2px 12px rgba(49,130,246,.13)}
.pin .pt{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:5px}
.pin .pt .dot{width:9px;height:9px;border-radius:50%}
.pin .pt .cv{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--or);background:var(--or2);border-radius:5px;padding:1px 6px}
.pin .pv{display:flex;align-items:center;gap:8px}
.pin .pv .c{flex:1}
.pin .pv .c span{display:block;font-size:10.5px;font-weight:700;color:var(--gy2)}
.pin .pv .c b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}
.pin .pv .ar{color:var(--gy2);font-weight:800}
.pin .pv .c.a b{color:var(--bl)}.pin .pv .c.a b.dn{color:var(--rd)}
.pin .bars{margin-top:7px}
.pin .bars .b1{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.pin .bars .b1 span{width:22px;font-size:10.5px;font-weight:800;color:var(--gy2)}
.pin .bars .b1 .t{flex:1;height:9px;background:#F1F3F5;border-radius:4px;overflow:hidden}
.pin .bars .b1 .t i{display:block;height:100%;border-radius:4px}
.pin .det{margin-top:8px;border-top:1px solid #F1F3F5;padding-top:7px;font-size:10.5px;color:var(--gy);line-height:1.6}
.pin .det .dr{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.pin .det .dr b{color:var(--nv);font-weight:800}
.pin .det .dr .z{color:#C4CBD3}
/* ── 경제활동기 ── */
.life{border:1px solid var(--ln);border-radius:14px;padding:15px 16px;background:#fff}
.tl{position:relative;height:96px;margin:16px 0 6px}
.tl .band{position:absolute;height:26px;border-radius:6px;top:16px;display:flex;align-items:center;justify-content:center;
 font-size:10.5px;font-weight:800;color:#fff;overflow:hidden;white-space:nowrap}
.tl .ax{position:absolute;bottom:-2px;left:0;right:0;height:16px}
.tl .ax i{position:absolute;font-style:normal;font-size:10.5px;font-weight:700;color:var(--gy2);transform:translateX(-50%)}
.tl .mk{position:absolute;top:8px;height:36px;width:2px;background:var(--nv);opacity:.55}
.tl .mk em{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10.5px;font-weight:800;color:var(--nv);white-space:nowrap}
.kid{position:absolute;height:13px;border-radius:4px;background:#FDE68A;border:1px solid #F5C542}
.kid em{position:absolute;left:5px;top:-2px;font-style:normal;font-size:10.5px;font-weight:800;color:#92400E;white-space:nowrap}
.mon{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:10px;margin-top:13px}
.mo{border:1px solid var(--ln);border-radius:12px;padding:12px 13px}
.mo .mh{font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.mo .mb{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.mo .mb span{width:26px;font-size:10.5px;font-weight:800;color:var(--gy2)}
.mo .mb .t{flex:1;height:13px;background:#F1F3F5;border-radius:4px;overflow:hidden;position:relative}
.mo .mb .t i{display:block;height:100%;border-radius:4px}
.mo .mb .t u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--rd);text-decoration:none}
.mo .mb b{width:74px;text-align:right;font-size:12px;font-weight:800}
.mo .mn{font-size:10.5px;color:var(--gy);line-height:1.6;margin-top:6px;border-top:1px solid #F1F3F5;padding-top:6px}

/* ══ 한 장씩 넘겨 보기 — <b>16:9 발표 한 장</b> ═══════════════════════
   고객 앞에 세우는 화면은 세로로 긴 문서가 아니라 <b>가로 한 장</b>이다.
   PPT 와 같은 <b>1280 × 720</b>(16:9) 무대를 만들고, 화면에 맞게 통째로
   줄여 앉힌다. 글자 크기를 <b>px 로 못 박을 수 있어</b> 어느 화면에서나
   같은 모양으로 선다 — 화면마다 글자가 커졌다 작아졌다 하지 않는다.

   ■ 무대는 <b>안 늘어난다.</b> 한 장에 안 들어가면 그건 한 장이 아니라
     두 장이라는 뜻이다. (안 들어가는 자세한 것은 .deep 으로 접는다)
   ■ <b>인쇄하면 무대를 걷고</b> 세로 문서로 돌아간다 — 접은 것도 전부.  */
.deckwrap{display:block}
/* flex:none 이 없으면 무대가 <b>눌린다</b> — .deck-fit 이 flex 라
   1280 이 화면 폭에 맞춰 1220 으로 줄어들고, 그러면 16:9 가 아니다. */
.show.deck{width:1280px;height:720px;flex:none;max-width:none;margin:0;padding:0;
 border:0;border-radius:20px;overflow:hidden;position:relative;
 transform-origin:top left;box-shadow:0 18px 50px rgba(15,22,32,.13)}
.deck-fit{display:flex;align-items:flex-start;justify-content:center;overflow:hidden;
 height:calc(100vh - 232px);min-height:360px}
body.presenting .deck-fit{height:calc(100vh - 96px);align-items:center}
/* 한 장 — 넉넉한 여백, 위아래로 벌린 배치 */
.show.deck>section{display:none}
.show.deck>section.cur{display:flex;flex-direction:column;position:absolute;inset:0;
 padding:52px 64px 46px;margin:0;animation:dkin .2s cubic-bezier(.2,.7,.3,1)}
@keyframes dkin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 제목 — 한 줄로 크게. 부제는 회색 한 줄 */
.show.deck>section.cur>h3{font-size:40px;font-weight:800;letter-spacing:-.045em;
 line-height:1.25;margin:0 0 6px;display:block}
.show.deck>section.cur>h3 small{display:block;font-size:16px;font-weight:700;
 color:var(--gy2);margin-top:8px;letter-spacing:-.02em}
/* 본문 — 가운데를 다 쓴다 */
.show.deck>section.cur{font-size:17px;line-height:1.7}
/* 설계사용 설명(.sd)은 <b>안 세운다</b> — 아래 「읽는 말」이 같은 것을
   더 짧게 말한다. 두 번 적으면 글자만 늘고 고객은 둘 다 안 읽는다.
   죽 이어서·인쇄에는 그대로 있다. */
.show.deck>section.cur>.sd{display:none}
/* 자세한 것은 <b>접는다</b> — 한 장에 안 들어가는 것은 죽 이어서·인쇄에서 본다 */
.show.deck>section.cur .deep{display:none}
/* 표지 — 가운데에 크게 */
.show.deck>#sHd.cur{justify-content:center;align-items:flex-start;border:0;
 padding:0 92px;background:linear-gradient(135deg,#0F1620 0%,#1B2B3C 58%,#243B55 100%)}
.show.deck>#sHd.cur .ey{font-size:15px;color:#8FB4E8;letter-spacing:.1em}
.show.deck>#sHd.cur h1{font-size:64px;line-height:1.18;margin:16px 0 14px;color:#fff;letter-spacing:-.045em}
.show.deck>#sHd.cur p{font-size:19px;color:rgba(255,255,255,.72)}
.show.deck>#sHd.cur p b{color:#fff}
/* 마무리 면책 — 작게, 아래에 */
.show.deck>#sEnd.cur{justify-content:flex-end;font-size:14px;line-height:1.85;border:0;padding:52px 64px}
/* ── <b>그대로 읽는 한 문장</b> ────────────────────────────────────
   「읽어만 줘도 되게」 하려면 <b>말이 화면에 있어야</b> 한다. 장마다
   아래에 한 문장을 세운다 — 화면의 숫자에서 만든 말이라 지어낸 것이
   아니고, 설계사는 그대로 읽으면 된다.                              */
.say{margin-top:auto;padding-top:22px;border-top:1px solid var(--ln);
 font-size:26px;font-weight:700;line-height:1.55;letter-spacing:-.03em;color:var(--nv)}
.say b{font-weight:800;color:var(--bl)}
.say .r{color:var(--rd)}.say .o{color:var(--gr)}
.say::before{content:'“';color:var(--ln);font-weight:800;margin-right:2px}
.say::after{content:'”';color:var(--ln);font-weight:800;margin-left:2px}
.show:not(.deck) .say{font-size:17px;padding-top:14px;margin-top:16px}
#sHd .say,#sEnd .say{display:none}
.show.deck>#sHd.cur .say{display:block;border-top-color:rgba(255,255,255,.18);color:#fff;margin-top:26px}
.show.deck>#sHd.cur .say::before,.show.deck>#sHd.cur .say::after{color:rgba(255,255,255,.3)}
/* 목차 — 무대 밖 한 줄 */
.show.deck+.x,.toc{max-width:1280px}
.deck-on .toc{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;
 scrollbar-width:thin;padding:9px 11px;margin-bottom:10px}
.deck-on .toc a{flex:none}
.toc a.on{background:var(--nv);border-color:var(--nv);color:#fff}
.toc a.on b{background:#fff;color:var(--nv)}
/* ── 한 장에 <b>안 들어가는 것</b>은 접는다 ────────────────────────
   한 장이 720 을 넘으면 그건 한 장이 아니다. 고객 앞에서 스크롤이
   생기는 순간 「발표」가 아니라 「문서 읽기」가 된다.

   접는 것은 <b>자세한 것</b>뿐이고, 인쇄·죽 이어서에는 전부 나온다.
   그리고 몇 개를 안 보여 드리는지 <b>화면에 적는다</b> — 잘라 놓고
   말 안 하면 고객은 그게 전부인 줄 안다.                            */
.only-deck{display:none}
.show.deck>section.cur .only-deck{display:block;font-size:15px;font-weight:700;
 color:var(--gy2);margin-top:10px}
.show.deck>section.cur .only-deck b{color:var(--nv)}
/* 왜 나에게 맞는가 — 이유 셋만. 상담 단계는 접는다 */
.show.deck>section.cur .wsteps{display:none}
.show.deck>section.cur .whys>.wh1:nth-child(n+4){display:none}
/* 보험료 — 막대가 말하니 숫자 상자는 접는다 */
.show.deck>section.cur .pgrid{display:none}
/* 더 넣을 것 — 급한 여섯 개만 */
.show.deck>section.cur .needs{grid-template-columns:repeat(3,1fr)}
.show.deck>section.cur .needs>.nd:nth-child(n+7){display:none}
.show.deck>section.cur .ndz{display:none}
/* 몸 그림 — 무대에 맞게 */
/* 몸 그림 — 카드 여섯 개가 <b>다 보이게</b> 촘촘히. 잘라 놓으면
   잘린 카드가 「없는 담보」처럼 보인다. */
.show.deck>section.cur .anat{gap:16px;align-items:start;grid-template-columns:1fr 250px 1fr}
.show.deck>section.cur .anat svg{max-height:330px}
.show.deck>section.cur .pin{padding:8px 11px;margin-bottom:7px;border-radius:11px}
.show.deck>section.cur .pin .pt{font-size:13px;margin-bottom:3px}
.show.deck>section.cur .pin .pv .c span{font-size:10.5px}
.show.deck>section.cur .pin .pv .c b{font-size:16px}
.show.deck>section.cur .pin .pb{margin-top:3px}
.show.deck>section.cur .pin .pb .t{height:5px}
/* 제목 밑 부제는 「읽는 말」이 대신한다 — 한 줄을 아낀다 */
.show.deck>#s5.cur>h3 small{display:none}
.show.deck>#s5.cur{padding:40px 56px 40px}
.show.deck>#s5.cur .say{padding-top:16px}
/* 한 줄 요약 — 여섯 문단을 <b>카드로 나눈다</b>. 한 덩어리로 붙여
   놓으면 글자 수는 같은데 아무도 안 읽는다. 나누면 눈이 따라간다. */
.show.deck>#s3.cur .talk{display:grid;grid-template-columns:1fr 1fr;gap:11px;
 background:none;border-left:0;border-radius:0;padding:0}
.show.deck>#s3.cur .talk p{background:#F8FAFC;border-radius:15px;padding:15px 18px;
 margin:0;font-size:16px;line-height:1.72}
.show.deck>#s3.cur .talk p:first-child{grid-column:1/-1;background:var(--nv);color:#fff}
.show.deck>#s3.cur .talk p:first-child b{color:#fff}
.show.deck>#s3.cur>h3{font-size:34px}
/* 한 장 안에서 커지는 것들 — 무대가 넓으니 시원하게 */
.show.deck>section.cur .big2 .c b{font-size:34px}
.show.deck>section.cur .big2 .c span{font-size:15px}
.show.deck>section.cur .talk p{font-size:20px;line-height:1.9}
.show.deck>section.cur table{font-size:15px}
.show.deck>section.cur td{padding:9px 12px}
.show.deck>section.cur th{font-size:12px}
.show.deck>section.cur .dsc{display:none}
.show.deck>section.cur .cbl,.show.deck>section.cur .cbn,
.show.deck>section.cur .cbt{font-size:16px}
.show.deck>section.cur .cbg{height:22px}
.show.deck>section.cur .pbn{font-size:15px}
.show.deck>section.cur .pbg i{height:20px}
.show.deck>section.cur .pbg span{font-size:16px}
.show.deck>section.cur .st{max-height:none;margin:0}
.show.deck>section.cur .dl{max-height:none}
/* 첫 장의 큰 숫자 — 궁금한 것 하나만 크게 */
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#F8FAFC;
 border-radius:18px;padding:22px 24px;margin-bottom:10px}
.hero .hn{flex:1;min-width:150px}
.hero .hn span{display:block;font-size:12.5px;font-weight:700;color:var(--gy2)}
.hero .hn b{display:block;font-size:32px;font-weight:800;letter-spacing:-.04em;margin-top:3px}
.hero .hn.on b{color:var(--bl)}
.hero .hn b.up{color:var(--rd)}.hero .hn b.dn{color:var(--gr)}
.hero .ha{font-size:24px;font-weight:800;color:var(--gy2);flex:none}
.hsub{font-size:14px;color:var(--gy);margin-bottom:14px}
.hsub b{font-size:16px}.hsub b.up{color:var(--rd)}.hsub b.dn{color:var(--gr)}
.show.deck>section.cur .hero{padding:38px 42px;border-radius:22px}
.show.deck>section.cur .hero .hn span{font-size:16px}
.show.deck>section.cur .hero .hn b{font-size:58px}
.show.deck>section.cur .hero .ha{font-size:34px}
.show.deck>section.cur .hsub{font-size:19px;margin-bottom:0}
/* 보험료 셋을 길이로 */
.pbars{background:#F8FAFC;border-radius:14px;padding:15px 17px;margin-bottom:13px}
.pbk{display:flex;gap:13px;margin-bottom:9px}
.pbk span{font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:5px;color:var(--gy)}
.pbk span::before{content:'';width:11px;height:11px;border-radius:3px;background:#94A3B8}
.pbk span.a::before{background:var(--bl)}
.pbr{margin-bottom:11px}.pbr:last-child{margin-bottom:0}
.pbn{font-size:12.5px;font-weight:800;color:var(--gy);margin-bottom:5px}
.pbg{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.pbg i{display:block;height:14px;border-radius:4px;background:#94A3B8;flex:none;min-width:2px}
.pbg i.a{background:var(--bl)}
.pbg span{font-size:12.5px;font-weight:800;white-space:nowrap}
/* 묶음이 표준 대비 얼마나 찼나 */
.cmpb{background:#F8FAFC;border-radius:14px;padding:15px 17px;margin-bottom:13px}
.cbl{font-size:12.5px;font-weight:800;color:var(--gy);margin-bottom:10px}
.cbr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cbr:last-of-type{margin-bottom:0}
.cbn{font-size:12.5px;font-weight:800;width:56px;flex:none;color:var(--gy)}
.cbg{flex:1;position:relative;height:16px;border-radius:5px;background:var(--ln);overflow:hidden;min-width:60px}
.cbg i{display:block;height:100%;border-radius:5px;background:#94A3B8}
.cbg i.a{background:var(--bl)}
.cbg u{position:absolute;top:0;bottom:0;width:2px;background:var(--nv);opacity:.45}
.cbt{font-size:12.5px;font-weight:800;white-space:nowrap;flex:none;text-align:right;min-width:96px}
.cbt em{font-style:normal;color:var(--gy2);font-weight:700;margin-left:5px}
.cbt.none{color:var(--gy2);font-weight:700}
.cbf{font-size:11px;color:var(--gy2);margin-top:9px}
/* 모자란 담보가 얼마나 찼나 */
.nfill{height:7px;border-radius:4px;background:var(--ln);overflow:hidden;margin:7px 0 6px}
.nfill i{display:block;height:100%;border-radius:4px;background:var(--bl)}
.nd.none .nfill i{background:var(--rd)}
.deckbar{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;align-items:center;gap:10px;
 padding:9px 14px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--ln)}
.deckbar:empty{display:none}
.deckbar .dnav{appearance:none;border:1px solid var(--ln);background:#fff;border-radius:10px;
 width:40px;height:36px;font-size:13px;font-weight:800;color:var(--nv);flex:none}
.deckbar .dnav:disabled{color:var(--ln);cursor:default}
.deckbar .dnav.x{color:var(--gy)}
.deckbar .dbar{flex:1;min-width:40px;height:5px;border-radius:3px;background:var(--ln);overflow:hidden}
.deckbar .dbar i{display:block;height:100%;background:var(--nv);border-radius:3px;transition:width .2s}
.deckbar .dt{font-size:12.5px;font-weight:800;white-space:nowrap;flex:none}
.deckbar .dn{font-size:11.5px;font-weight:700;color:var(--gy2);white-space:nowrap;flex:none}
.deckbar .dn b{color:var(--nv);font-size:13px}
@media(max-width:560px){.deckbar .dt{display:none}}
/* 발표 — 설계사 도구를 치우고 자료만 남긴다 */
body.presenting .bar,body.presenting .showctl,body.presenting .toc{display:none!important}
body.presenting .wrap{padding:8px 14px 74px;max-width:none}
body.presenting .show:not(.deck){border:0;box-shadow:none}
@media print{body{background:#fff}.bar,.noprint{display:none!important}.wrap{max-width:none;padding:0}
 .show{border:0;border-radius:0;padding:0;max-width:none}.show section{page-break-inside:avoid}
 /* 한 장씩 보던 중에 뽑아도 <b>전부</b> 나온다 — 접힌 것을 뺀 것처럼 두지 않는다.
    무대(16:9)를 걷고 세로 문서로 돌아간다. */
 .deck-fit{height:auto!important;display:block!important;overflow:visible!important}
 .show.deck{width:auto!important;height:auto!important;transform:none!important;
  overflow:visible!important;box-shadow:none!important;border-radius:0!important}
 .show.deck>section{display:block!important;position:static!important;padding:0!important;
  margin:0 0 22px!important;animation:none!important;background:none!important}
 .show.deck>section.cur .deep{display:block!important}
 .show.deck>section.cur .dsc{display:block!important}
 .show.deck>section.cur .wsteps,.show.deck>section.cur .pgrid,
 .show.deck>section.cur .ndz,.show.deck>section.cur>.sd{display:block!important}
 .show.deck>section.cur .whys>.wh1,.show.deck>section.cur .needs>.nd{display:block!important}
 .only-deck{display:none!important}
 .show.deck>#sHd.cur{padding:0!important;background:none!important}
 .show.deck>#sHd.cur h1{font-size:24px!important;color:#191F28!important}
 .show.deck>#sHd.cur .ey{color:#B99A3A!important;font-size:10.5px!important}
 .show.deck>#sHd.cur p{color:#6B7684!important;font-size:12px!important}
 .show.deck>section.cur>h3{font-size:16px!important}
 .show.deck>section.cur>h3 small{display:inline!important;font-size:12px!important;margin:0 0 0 8px!important}
 .say{font-size:13px!important;padding-top:9px!important;margin-top:10px!important}
 .anat{grid-template-columns:1fr 300px 1fr!important}.tj{display:flex!important}.st,.life{page-break-inside:avoid}}
</style>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   보장 전 · 후 만들기

   ■ 뼈대는 <b>사장님 엑셀「3.보험 전후 비교자료」</b>다.
     담보 목록·3단 계층(대/중/소)·표준금액·그리고 <b>괄호 안의 %</b> 를 그대로 썼다.
     뇌혈관질환(100%) · 뇌졸중(67%) · 뇌출혈(9%) —
     <b>그 사건이 왔을 때 이 담보가 열릴 확률</b>이다. 이것이 「범위가 곧 돈」이다.

   ■ 기존 계약은 <b>유지 · 배서 · 해지</b> 셋 중 하나다.
       유지 → 담보가 그대로 후에 남는다
       배서 → 계약은 남기고 <b>담보만 바꾼다</b> (후 칸이 열린다)
       해지 → 후에서 통째로 빠진다
     이 셋만 누르면 <b>후는 저절로</b> 만들어진다.

   ■ 새 설계는 <b>따로</b> 적는다 — 상품명 · 월보험료 · 납입기간 · 담보금액을 한 화면에.

   ■ 돈 단위는 <b>전부 만원</b>. KB PDF 만 원 단위라 kbMan 한 곳에서 나눈다.

   ■ 지어내지 않는다 — 안 적으신 칸은 비운다. 목돈·하루·매달·한도를 한 칸에 안 더한다.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 표준 담보 (엑셀 그대로) ─────────────────────────────────────
   u: L 목돈 · D 하루 · M 매달 · A 한도
   cov: 그 사건이 왔을 때 <b>이 담보가 열릴 확률(%)</b> — 엑셀 괄호값
   std: 표준(권장) 금액 — 만원                                   */
var STD=[
 {big:'병원비 보장',mid:'실손의료비',ic:'🩺',c:'#3E6FD9',part:null,rows:[
  {k:'silD', n:'질병입원의료비',u:'A',std:5000,syn:['질병입원의료비','입원의료비'],not:['통원','상해','외래']},
  {k:'silDO',n:'질병통원의료비',u:'A',std:20,  syn:['질병통원의료비','통원의료비','외래의료비'],not:['입원','상해']},

function migrate(v){

  for(k in d)if(d.hasOwnProperty(k)&&(v[k]===undefined||v[k]===null))v[k]=d[k];
  /* 묶음 안쪽도 채운다 */
  ['who','man','scen'].forEach(function(g){
    if(typeof v[g]!=='object'||!v[g]){v[g]=d[g];return;}
    for(var q in d[g])if(d[g].hasOwnProperty(q)&&v[g][q]===undefined)v[g][q]=d[g][q];
  });
  ['before','after','fam'].forEach(function(g){if(!v[g]||!v[g].push)v[g]=[];});
  /* 계약마다 새로 생긴 칸 */
  v.before.concat(v.after).forEach(function(pol){
    if(pol.start===undefined)pol.start='';
    if(pol.years===undefined)pol.years='';
    if(pol.premMan2===undefined)pol.premMan2='';
    if(!pol.cov)pol.cov={};
    if(!pol.cov2)pol.cov2={};
    if(pol.act===undefined)pol.act=(pol.keep===false)?'cancel':'keep';
  });
  return v;
}

/* ── 납입 셈 ─────────────────────────────────────────────────────
   총 납입 = 월 보험료 × 납입기간(개월).  가입시기로 <b>이미 낸 것</b>과
   <b>앞으로 낼 것</b>을 가른다. 해지해도 <b>이미 낸 돈은 안 돌아온다</b> —
   그래서 「앞으로 낼 돈」이 실제 의사결정의 자다.
   월 보험료가 올라도 <b>앞으로 낼 돈은 줄어드는</b> 일이 실제로 있다.  */
function ymMonths(start){
  var m=(''+(start||'')).match(/^(\d{4})[-.\/ ]?(\d{1,2})/);
  if(!m)return null;
  var y=+m[1],mo=+m[2],d=new Date();
  return Math.max(0,(d.getFullYear()-y)*12+(d.getMonth()+1-mo));
}
function payCalc(pol,which){
  var prem=num((which==='after'&&pol.act==='endo'&&pol.premMan2!=='')?pol.premMan2:pol.premMan);
  var yrs=num(pol.years),mTot=(yrs!==null&&yrs>0)?Math.round(yrs*12):null;
  var gone=ymMonths(pol.start);
  var paidM=(mTot!==null&&gone!==null)?Math.min(mTot,gone):null;
  var leftM=(mTot!==null&&paidM!==null)?(mTot-paidM):null;
  return {prem:prem,mTot:mTot,paidM:paidM,leftM:leftM,
    total:(prem!==null&&mTot!==null)?prem*mTot:null,
    paid:(prem!==null&&paidM!==null)?prem*paidM:null,
    left:(prem!==null&&leftM!==null)?prem*leftM:null,
    done:(mTot!==null&&paidM!==null&&paidM>=mTot)};
}
function premCalc(){
  var o={monB:0,monA:0,leftB:0,leftA:0,totB:0,totA:0,paidSunk:0,
         noPremB:0,noPremA:0,noTermB:0,noTermA:0,rows:[]};
  S.before.forEach(function(pol){
    var a=pol.act||'keep',b=payCalc(pol,'before'),af=payCalc(pol,'after');
    var r={pol:pol,side:'before',act:a,b:b,a:af};
    if(b.prem===null)o.noPremB++;else if(!b.done)o.monB+=b.prem;
    if(b.left===null){if(b.prem!==null)o.noTermB++;}else o.leftB+=b.left;
    if(b.total!==null)o.totB+=b.total;
    if(b.paid!==null)o.paidSunk+=b.paid;
    if(a==='cancel'){
      r.aMon=0;r.aLeft=0;r.aTot=(b.paid===null?null:b.paid);
      if(b.paid!==null)o.totA+=b.paid;
    }else{
      var pr=(a==='endo')?af.prem:b.prem;
      var lf=(a==='endo')?af.left:b.left, tt=(a==='endo')?af.total:b.total;
      r.aMon=pr;r.aLeft=lf;r.aTot=tt;
      if(pr===null)o.noPremA++;else if(!b.done)o.monA+=pr;
      if(lf===null){if(pr!==null)o.noTermA++;}else o.leftA+=lf;
      if(tt!==null)o.totA+=tt;
    }
    o.rows.push(r);
  });
  S.after.forEach(function(pol){
    var c=payCalc(pol,'after');
    o.rows.push({pol:pol,side:'after',act:'new',b:null,a:c,aMon:c.prem,aLeft:c.left,aTot:c.total});
    if(c.prem===null)o.noPremA++;else o.monA+=c.prem;
    if(c.left===null){if(c.prem!==null)o.noTermA++;}else o.leftA+=c.left;
    if(c.total!==null)o.totA+=c.total;
  });
  o.monD=o.monA-o.monB;o.leftD=o.leftA-o.leftB;o.totD=o.totA-o.totB;
  return o;
}

/* ═══════════════ 셈 ═══════════════
   유지 → 담보 그대로 후에.  배서 → 후 칸을 따로 적은 것만.  해지 → 후에서 뺌.  */
function autoCalc(){
  var b={},a={},i,k,pb=0,pa=0,pbN=0,paN=0;
  function add(t,cov){for(k in cov)if(cov.hasOwnProperty(k)){var v=num(cov[k]);if(v===null)continue;t[k]=(t[k]||0)+v;}}
  for(i=0;i<S.before.length;i++){
    var p=S.before[i],act=p.act||'keep';
    add(b,p.cov);
    if(num(p.premMan)!==null)pb+=num(p.premMan);else pbN++;
    if(act==='keep'){ add(a,p.cov); if(num(p.premMan)!==null)pa+=num(p.premMan);else paN++; }
    else if(act==='endo'){
      /* 배서 — 계약은 남고 <b>담보만</b> 바뀐다. 후 칸에 적으신 것이 후가 된다 */
      add(a,p.cov2||{});
      var pm2=(p.premMan2!==''&&p.premMan2!==undefined)?num(p.premMan2):num(p.premMan);
      if(pm2!==null)pa+=pm2;else paN++;
    }
  }
  for(i=0;i<S.after.length;i++){
    var q=S.after[i];
    add(a,q.cov);
    if(num(q.premMan)!==null)pa+=num(q.premMan);else paN++;
  }
  return {b:b,a:a,premB:pb,premA:pa,premBn:pbN,premAn:paN};
}
function calc(){
  var A=autoCalc(),b={},a={},k;
  for(k in A.b)b[k]=A.b[k];
  for(k in A.a)a[k]=A.a[k];
  for(k in S.man.b)if(S.man.b.hasOwnProperty(k)){var v=num(S.man.b[k]);if(v!==null)b[k]=v;else delete b[k];}
  for(k in S.man.a)if(S.man.a.hasOwnProperty(k)){var w=num(S.man.a[k]);if(w!==null)a[k]=w;else delete a[k];}
  return {b:b,a:a,auto:A,premB:A.premB,premA:A.premA,premBn:A.premBn,premAn:A.premAn};
}
function diff(C){
  var loss=[],gain=[],k,seen={};
  for(k in C.b)seen[k]=1;for(k in C.a)seen[k]=1;
  for(k in seen)if(seen.hasOwnProperty(k)){
    var bb=C.b[k]||0,aa=C.a[k]||0;
    if(aa<bb)loss.push({k:k,v:bb-aa,b:bb,a:aa});
    else if(aa>bb)gain.push({k:k,v:aa-bb,b:bb,a:aa});
  }
  loss.sort(function(x,y){return y.v-x.v;});gain.sort(function(x,y){return y.v-x.v;});
  return {loss:loss,gain:gain};
}
/* 부위별 — <b>최대</b>(다 열릴 때)와 <b>평균</b>(범위 % 반영) 둘 다 낸다 */
function partCalc(pt,C){
  var keys=[],i,j;
  for(i=0;i<STD.length;i++){ if(pt.mids.indexOf(STD[i].mid)<0)continue;
    for(j=0;j<STD[i].rows.length;j++)keys.push(STD[i].rows[j].k); }
  var o={keys:keys,maxB:0,maxA:0,expB:0,expA:0,dayB:0,dayA:0,monB:0,monA:0,rows:[]};
  keys.forEach(function(k){
    var b=C.b[k],a=C.a[k],u=UNIT[k],cv=COV[k];
    o.rows.push({k:k,b:b,a:a});
    if(u==='D'){o.dayB+=b||0;o.dayA+=a||0;return;}
    if(u==='M'){o.monB+=b||0;o.monA+=a||0;return;}
    if(u==='A')return;                       /* 한도는 금액으로 안 더한다 */
    o.maxB+=b||0;o.maxA+=a||0;
    var r=(cv===null||cv===undefined)?1:(cv/100);
    o.expB+=(b||0)*r;o.expA+=(a||0)*r;
  });

}
function evCalc(ev,C){

  function sum(t,keys,useCov){var s=0,n=0,i;for(i=0;i<(keys||[]).length;i++){

    var r=useCov?((COV[keys[i]]===null||COV[keys[i]]===undefined)?1:COV[keys[i]]/100):1;
    s+=v*r;n++;}return {v:s,n:n};}
  var lb=sum(C.b,ev.lump),la=sum(C.a,ev.lump);
  var eb=sum(C.b,ev.lump,1),ea=sum(C.a,ev.lump,1);
  var db=sum(C.b,ev.day),da=sum(C.a,ev.day);
  var mb=sum(C.b,ev.month),ma=sum(C.a,ev.month);
  var dayB=(days!==null&&days>0)?db.v*days:null,dayA=(days!==null&&days>0)?da.v*days:null;
  var totB=lb.v+(dayB||0),totA=la.v+(dayA||0);

  return {cost:cost,days:days,off:off,lumpB:lb.v,lumpA:la.v,expLB:eb.v,expLA:ea.v,nB:lb.n,nA:la.n,
    dayPerB:db.v,dayPerA:da.v,dayB:dayB,dayA:dayA,monB:mb.v,monA:ma.v,
    totB:totB,totA:totA,expB:expB,expA:expA,
    rateB:(cost>0)?(totB/cost*100):null,rateA:(cost>0)?(totA/cost*100):null,
    eRateB:(cost>0)?(expB/cost*100):null,eRateA:(cost>0)?(expA/cost*100):null,
    gapB:(cost>0)?Math.max(0,cost-totB):null,gapA:(cost>0)?Math.max(0,cost-totA):null,
    eGapA:(cost>0)?Math.max(0,cost-expA):null};

/* ── 경제활동기 ─────────────────────────────────────────────────
   사건이 왔을 때 <b>준비된 돈이 이 집을 몇 달 버티게 하는가</b>.
   버티는 달 = (준비된 목돈 − 치료비) ÷ 월 생활비.  치료비를 못 대면 0 이다. */
function lifeCalc(C){
  var age=num(S.who.age),ret=num(S.who.retire),life=num(S.who.life)||85;
  var inc=num(S.who.incMan),exp=num(S.who.expMan);
  var o={age:age,ret:ret,life:life,inc:inc,exp:exp,ok:(age!==null&&ret!==null&&exp!==null),ev:[]};
  o.workYears=(age!==null&&ret!==null)?Math.max(0,ret-age):null;
  o.afterYears=(ret!==null)?Math.max(0,life-ret):null;
  o.kids=(S.fam||[]).map(function(f){
    var a=num(f.age);return {rel:f.rel,age:a,until:(a===null?null:Math.max(0,22-a))};
  }).filter(function(f){return f.age!==null;});
  EVENTS.forEach(function(ev){
    var r=evCalc(ev,C),cost=r.cost,offM=r.off;
    var e={k:ev.k,t:ev.t,ic:ev.ic,cost:cost,off:offM,
      keepB:null,keepA:null,needM:null,lostInc:null};
    if(exp>0){
      if(cost!==null&&cost>0){
        e.keepB=Math.max(0,(r.totB-cost))/exp;
        e.keepA=Math.max(0,(r.totA-cost))/exp;
        e.eKeepA=Math.max(0,(r.expA-cost))/exp;
        e.payB=(r.totB>=cost);e.payA=(r.totA>=cost);
      }else{ e.keepB=r.totB/exp; e.keepA=r.totA/exp; e.eKeepA=r.expA/exp; e.payB=null;e.payA=null; }
    }
    if(offM!==null&&inc!==null)e.lostInc=inc*offM;
    e.needM=offM;
    o.ev.push(e);
  });
  return o;
}
function tally(){
  var t={pols:S.before.length+S.after.length,rows:0,no:0,keep:0,endo:0,cancel:0},i,j;
  S.before.forEach(function(p){
    var a=p.act||'keep';
    if(a==='keep')t.keep++;else if(a==='endo')t.endo++;else t.cancel++;
    for(j in p.cov)if(p.cov.hasOwnProperty(j)&&num(p.cov[j])!==null)t.rows++;
  });
  S.after.forEach(function(p){for(j in p.cov)if(p.cov.hasOwnProperty(j)&&num(p.cov[j])!==null)t.rows++;});
  if(S.kbRaw)S.kbRaw.contracts.forEach(function(c){(c.covs||[]).forEach(function(v){
    if(!mapName(v.std||v.raw)&&!mapName(v.raw))t.no++;});});
  return t;
}


/* ── 사건 시뮬레이션 ─────────────────────────────────────────────
   「암이 오면 무슨 일이 벌어지고, 그때 <b>지금</b> 얼마 나오고 <b>조정 후</b>
   얼마 나오는가」를 단계로 푼다. 단계 비용은 기준 치료비를 <b>비중</b>으로
   나눈 것이다 — 나눈 값이라는 사실을 화면에 적는다.               */
function simCalc(ev,C){
  var cost=num(S.scen[ev.k].cost),days=num(S.scen[ev.k].days)||0;
  var out={cost:cost,days:days,steps:[],totB:0,totA:0,needTot:0};
  if(cost===null||!(cost>0))return out;
  (ev.sim||[]).forEach(function(st){
    var need=Math.round(cost*st.w);
    var b=0,a=0,payB=[],payA=[],act=0;
    st.pay.forEach(function(k){
      var u=UNIT[k];
      if(u==='A'){act++;return;}                       /* 실손은 금액으로 안 바꾼다 */
      var vb=C.b[k],va=C.a[k];
      /* 하루치는 <b>그 단계 몫의 입원일수</b>만큼만 센다 — 전체 일수를 다 곱하면 부풀어 오른다 */
      var mul=(u==='D')?Math.max(1,Math.round(days*st.w)):1;
      if(u==='M')mul=1;
      if(vb!==undefined){b+=vb*mul;payB.push(k);}
      if(va!==undefined){a+=va*mul;payA.push(k);}
    });
    out.steps.push({st:st,need:need,b:b,a:a,payB:payB,payA:payA,act:act,
      gapB:Math.max(0,need-b),gapA:Math.max(0,need-a),mul:(days?Math.max(1,Math.round(days*st.w)):0)});
    out.totB+=b;out.totA+=a;out.needTot+=need;
  });
  return out;
}
/* ── 지금 더 넣으셔야 할 것 ───────────────────────────────────────
   표준(엑셀 기준)에 견주어 <b>모자란 담보</b>를 골라 세운다.
   「없다」와 「모자라다」를 가르고, <b>얼마를 더</b> 넣어야 하는지 적는다.  */
function needList(C){
  var out=[],i,j;
  for(i=0;i<STD.length;i++)for(j=0;j<STD[i].rows.length;j++){
    var r=STD[i].rows[j];
    if(!r.std)continue;
    if(r.u==='A')continue;                        /* 실손 한도는 표준 미달로 안 센다 */
    var a=C.a[r.k];
    var have=(a===undefined)?0:a;
    if(have>=r.std)continue;
    out.push({k:r.k,g:STD[i],need:r.std-have,have:have,std:r.std,
      none:(a===undefined),
      /* 사건에 걸리는 담보를 먼저 세운다 — 급한 것부터 */
      pri:(EVENTS.some(function(e){return (e.lump||[]).indexOf(r.k)>=0;})?0:
           ((r.u==='L')?1:2))});
  }
  out.sort(function(x,y){return (x.pri-y.pri)||(y.need-x.need);});
  return out;
}

/* 계약 한 줄 아래 <b>납입이 어떻게 되는가</b>를 바로 보여 준다.

   접힌 줄과 펼친 줄이 <b>다른 숫자를 말할 수 없다.</b>                */
function payLine(pol,sd,i,mini){
  var c=payCalc(pol,(sd==='before')?'before':'after');

    else m+='<span class="q">앞으로 낼 돈 <b>—</b></span>';
    return '<span class="paym">'+m+'</span>';
  }
  if(c.prem===null&&c.mTot===null)
    return '<div class="payl none">가입 시기와 납입기간을 적으시면 <b>총 납입 보험료</b>와 <b>앞으로 낼 돈</b>이 여기 나옵니다.</div>';
  var b=[];
  b.push('<span>월 <b>'+(c.prem===null?'미입력':fee(c.prem))+'</b></span>');
  b.push('<span>납입 <b>'+(c.mTot===null?'미입력':(Math.round(c.mTot/12)+'년 · '+c.mTot+'개월'))+'</b></span>');
  if(c.paidM!==null)b.push('<span>낸 것 <b>'+c.paidM+'개월'+(c.paid!==null?(' · '+fee(c.paid)):'')+'</b></span>');
  if(c.leftM!==null)b.push('<span class="'+(c.done?'g':'w')+'">'+(c.done?'<b>납입완료</b>':('앞으로 <b>'+c.leftM+'개월 · '+(c.left===null?'—':fee(c.left))+'</b>'))+'</span>');
  if(c.total!==null)b.push('<span class="t">총 납입 <b>'+fee(c.total)+'</b></span>');

/* 담보판 — 표준 담보를 <b>묶음째</b> 한눈에 */
function padHtml(p,sd,i,field){
  var key=sd+i,cur=S.pick[key];
  var bag=p[field]||{};
  /* ── 추가 보험은 <b>부위별로만</b> ────────────────────────────────
     새로 넣는 설계는 「전부 보기」로 열면 담보칸이 예순 개 넘게 한꺼번에
     펴져, 어디를 적고 있었는지 사장님이 놓친다. 새 설계는 <b>부위 하나를
     골라</b> 그것만 적는다. 기존 계약(비포)은 <b>읽어 온 것을 훑는</b>
     자리라 「전부 보기」를 그대로 둔다.

     <b>숨기는 게 아니다</b> — 부위 단추마다 몇 개 적었는지 숫자가 붙어
     있고, 한 번 누르면 그 자리로 간다.                               */
  var isNew=(sd==='after');
  if(cur===undefined||(isNew&&cur==='__all'))cur=isNew?STD[0].mid:'__all';
  /* ── 접혀 있는 것이 <b>기본</b>이다 ─────────────────────────────
     계약 여섯 건이면 담보칸이 400개가 되어 화면이 열세 장이 된다.
     담보를 손볼 때만 편다. 접혀 있어도 <b>무엇이 들었는지</b>는 보인다. */
  var nn=0,kk;
  for(kk in bag)if(bag.hasOwnProperty(kk)&&num(bag[kk])!==null)nn++;
  if(!S.padOpen[key])
    return '<div class="padshut" onclick="padOpen(\''+key+'\')">'+
      (field==='cov2'?'<b style="color:var(--or)">배서 후 담보</b>':'<b>보장내용</b>')+
      '<em>'+(nn?(nn+'개 적혀 있습니다'):'아직 안 적으셨습니다')+'</em>'+
      '<span>담보 적기 ▾</span></div>'+
      (nn?('<div class="padsum">'+padSum(bag)+'</div>'):'');
  var h='<div style="border-top:1px solid #F1F3F5;padding-top:10px;margin-top:4px">'+
    (field==='cov2'?'<div style="font-size:12px;font-weight:800;color:var(--or);margin-bottom:7px">배서 후 담보 — 여기 적은 것만 남습니다</div>':'')+
    '<div class="gsel">'+
    STD.map(function(g,gi){
      var n=0;g.rows.forEach(function(r){if(num(bag[r.k])!==null)n++;});
      return '<button class="'+(cur===g.mid?'on':'')+'" onclick="setPick(\''+key+'\',\''+g.mid+'\')">'+g.ic+' '+esc(g.mid)+(n?(' <b>'+n+'</b>'):'')+'</button>';
    }).join('')+
    (isNew?'':('<button class="'+(cur==='__all'?'on':'')+'" onclick="setPick(\''+key+'\',\'__all\')">전부 보기</button>'))+
    '</div>'+
    (isNew?'<div class="gnote">🧩 <b>부위를 골라</b> 그 담보만 적습니다. 단추의 숫자는 <b>이미 적으신 개수</b>입니다 — 안 보이는 것은 없어진 것이 아니라 <b>다른 부위 칸</b>에 있습니다.</div>':'');
  STD.forEach(function(g){
    if(cur!=='__all'&&cur!==g.mid)return;
    h+='<div class="pad" style="margin-bottom:7px"><div class="ph2"><span class="dot" style="background:'+g.c+'"></span>'+
      g.ic+' '+esc(g.mid)+'<em>'+esc(g.big)+'</em></div><div class="gr2">';
    g.rows.forEach(function(r){
      var v=bag[r.k];
      h+='<div class="pr'+(num(v)!==null?' has':'')+'" title="'+esc((r.d||'').replace(/<[^>]*>/g,''))+'">'+
        '<div class="nm">'+esc(r.n)+(r.cov?('<i>'+r.cov+'%</i>'):'')+
        '<em>표준 '+(r.std?man(r.std):'—')+' · '+UNIT_FULL[r.u]+'</em></div>'+
        '<input value="'+esc(v===undefined?'':v)+'" placeholder="—" inputmode="decimal" onfocus="this.select()" '+
          'oninput="setCov(\''+sd+'\','+i+',\''+field+'\',\''+r.k+'\',this.value)">'+
        '<span class="un">'+UNIT_LB[r.u]+'</span></div>';
    });
    h+='</div></div>';
  });
  return h+'<div class="padclose" onclick="padOpen(\''+key+'\')">담보칸 접기 ▴</div></div>';
}
/* 접힌 계약도 <b>무엇이 들었는지</b>는 보여야 한다 — 접는 것과 감추는 것은 다르다 */
function padSum(bag){
  var out=[],k;
  for(k in bag)if(bag.hasOwnProperty(k)&&num(bag[k])!==null&&ROW[k])
    out.push({k:k,v:num(bag[k]),u:UNIT[k]});
  out.sort(function(x,y){return ((x.u==='L')?0:1)-((y.u==='L')?0:1)||(y.v-x.v);});
  /* ── <b>「외 N개」 로 자르지 않는다</b> ─────────────────────────────
     열 개에서 잘라 놓으니, 금액이 작다는 이유로 <b>뇌·심장 담보가 그 뒤에
     숨었다.</b> 사장님이 「없나 보다」 하고 고객 앞에서 말하면 그 자리에서
     끝난다. 칩은 한 줄에 여러 개 들어가니 <b>다 세운다.</b>          */
  return out.map(function(o){
    return '<span>'+esc(NAME[o.k])+' <b>'+amt(o.k,o.v)+'</b></span>';
  }).join('');
}
function padOpen(k){S.padOpen[k]=!S.padOpen[k];save();render();}
function setPick(k,g){S.pick[k]=g;save();render();}
function addPol(sd){
  /* 방금 만든 계약은 <b>펴 놓는다</b> — 적으려고 누른 것이라, 접혀 있으면
     한 번 더 눌러야 한다. */
  var p={id:nid(),co:'',nm:'',term:'',start:'',years:'',
    premMan:'',premMan2:'',act:'keep',kb:false,cov:{},cov2:{}};
  S[sd].push(p);S.polOpen[p.id]=true;save();render();}
function delPol(sd,i){if(!confirm('이 계약을 목록에서 뺍니다.'))return;S[sd].splice(i,1);save();render();}
function setPol(sd,i,k,v){S[sd][i][k]=v;save();stOnly();}
function setAct(i,a){
  var p=S.before[i];
  p.act=a;
  /* 배서를 처음 누르면 <b>지금 담보를 그대로 복사</b>해 둔다 — 빈 판에서 시작하면 다 새로 쳐야 한다 */
  if(a==='endo'&&(!p.cov2||!Object.keys(p.cov2).length)){p.cov2={};for(var k in p.cov)if(p.cov.hasOwnProperty(k))p.cov2[k]=p.cov[k];}
  save();render();
}
function setCov(sd,i,field,k,v){
  var p=S[sd][i];
  if(!p[field])p[field]={};
  if((''+v).trim()==='')delete p[field][k];else p[field][k]=v;
  save();stOnly();
}

function scenHtml(){

  S.before=S.before.filter(function(p){return !p.kb;});S.kbInfo=null;S.kbRaw=null;save();render();}
function kbMan(w){return (w===null||w===undefined||!isFinite(w))?null:Math.round(w/10000);}
function kbApply(K,fname){
  var added=0,pols=0,no=0,i,j;
  for(i=0;i<K.contracts.length;i++){
    var c=K.contracts[i],cov={},n=0;
    for(j=0;j<(c.covs||[]).length;j++){
      var v=c.covs[j],key=mapName(v.std||v.raw)||mapName(v.raw);
      if(!key){no++;continue;}
      var m=kbMan(v.won);if(m===null)continue;
      cov[key]=(num(cov[key])||0)+m;n++;
    }
    S.before.push({id:nid(),co:c.co||'',nm:c.nm||'',term:(c.payTerm||'')+(c.term?(' '+c.term):''),
      premMan:c.paidUp?'0':(kbMan(c.premWon)===null?'':kbMan(c.premWon)),premMan2:'',act:'keep',kb:true,cov:cov,cov2:{}});
    added+=n;pols++;
  }
  S.kbRaw=K;S.kbInfo={file:fname,pols:pols,covs:added,no:no,person:(K.person&&K.person.name)||''};
  save();render();
}

/* ── 비는 자리 · 채우는 자리 ─────────────────────────────────────

   굴린다 — 굴려서 보이는 것과 잘라 낸 것은 다르다.

   두 목록이 거의 같아 <b>한 곳</b>에서 그린다. 두 벌로 두었더니 실제로

function sideList(kind,rows){
  var loss=(kind==='loss');
  if(!rows.length)return '<div class="empty">'+(loss?'아직 해지·배서로 줄인 담보가 없습니다.':'아직 늘린 담보가 없습니다.')+'</div>';
  return '<div class="lis">'+rows.map(function(x){
    var gone=loss?(x.a===0):(x.b===0);
    return '<div class="li"><div class="n">'+esc(NAME[x.k])+
      '<i>'+(loss?(gone?'없어짐':'줄어듦'):(gone?'새로':'늘림'))+'</i></div>'+
      '<div class="d"><b>'+amt(x.k,x.v)+'</b>'+
      (loss?(gone?'이 없어집니다.':'만큼 줄어듭니다.'):' 늘어납니다.')+'</div></div>';
  }).join('')+'</div>';
}

    '아래는 각 단계에서 <b>지금(전)</b> 얼마가 나오고 <b>조정 후</b> 얼마가 나오는지입니다.</p>'+

    '<b>없는 것</b>과 <b>모자란 것</b>을 갈라 적었습니다.</p><div class="needs">';

        (COV[x.k]?('<em>'+COV[x.k]+'%</em>'):'')+

        '<div class="nfill"><i style="width:'+Math.max(0,Math.min(100,Math.round((x.have||0)/(x.std||1)*100)))+'%"></i></div>'+

  if(sum>0)h+='<div class="note w">위 목돈 담보를 표준까지 채우면 <b>'+won(sum)+'</b>이 더 필요합니다. '+

  rp:[{c:'저 1억짜리 들었는데요. 충분하지 않아요?',m:'금액은 크십니다. 그래서 오히려 <b>언제 열리는 담보인지</b>만 확인해 드리고 싶어요. 이름이 비슷해도 열리는 자리가 다르거든요.'},{c:'이름이 다르면 뭐가 달라지는데요?',m:'예를 들어 「뇌출혈」은 <b>터진 경우</b>에 열리고, 「뇌혈관질환」은 <b>막힌 것까지</b> 열립니다. 실제로는 막히는 쪽이 훨씬 많고요.'},{c:'그럼 지금 것은 소용없다는 거예요?',m:'아니요, <b>그 상황에서는 제대로 나옵니다.</b> 다만 안 열리는 자리가 남아 있어서, 금액을 키우시기 전에 <b>그 자리부터</b> 메우는 게 순서라고 말씀드리는 겁니다.'}]},
 {t:'한 사건에 지갑이 여럿이다',ic:'👛',tag:'설명이 잘 먹히는 것',
  q:'"수술하면 얼마 나와요?"',
  fig:'<b>한 번 넘어져도 청구서는 여러 장 옵니다.</b>',
  ex:'차 사고가 나면 <b>수리비 · 렌트비 · 병원비</b>가 따로 나오죠. 몸도 같습니다. 암 수술 한 번에 <b>진단비 · 수술비 · 입원일당 · 실손</b>이 각각 열립니다.',
  so:'그래서 「얼마 나와요」는 <b>어느 단계냐</b>를 물어야 답이 됩니다.',
  back:'"한 번에 얼마가 아니라, <b>진단될 때 얼마 · 수술할 때 얼마 · 입원한 날마다 얼마</b>입니다. 지갑이 여럿입니다."',
  rp:[{c:'수술하면 얼마 나와요?',m:'그게 한 숫자로 답이 안 나오는 게, <b>단계마다 따로</b> 열려서요. 진단받을 때 · 수술할 때 · 입원한 날마다, 이렇게 나뉩니다.'},{c:'복잡하네요. 그냥 한 번에 나오면 안 돼요?',m:'복잡하게 느껴지시는 게 당연합니다. 대신 <b>한 사건에 여러 번</b> 나온다는 뜻이기도 해요. 사고 한 번에 수리비·렌트비가 따로 나오는 것과 비슷합니다.'},{c:'그럼 뭐부터 봐야 해요?',m:'<b>제일 큰 것 하나</b>부터 보시죠. 진단비가 제일 크고, 나머지는 그 뒤에 붙는 것들입니다.'}]},
 {t:'갱신형은 전세, 비갱신형은 자가',ic:'🏠',tag:'보험료 이야기할 때',
  q:'"이게 더 싼데 왜 저걸 하래요?"',
  fig:'<b>갱신형은 전세, 비갱신형은 자가입니다.</b>',
  ex:'전세는 지금 목돈이 덜 듭니다. 대신 <b>2년마다 올려 달라고 합니다.</b> 70대에 전세금 올려 달라면 감당이 되겠습니까? 자가는 지금 비싸지만 <b>그 값이 끝</b>입니다.',
  so:'실손은 어쩔 수 없이 갱신입니다. 그런데 <b>진단비까지 갱신</b>이면, 정작 필요한 나이에 못 냅니다.',
  back:'"지금 보험료로 비교하면 <b>갱신형이 늘 이깁니다.</b> 그래서 <b>총 얼마 내는지</b>를 봐야 합니다."',
  rp:[{c:'지금 이게 더 싼데 왜 바꿔요?',m:'지금은 확실히 이쪽이 쌉니다. 그건 <b>맞습니다.</b> 다만 이건 갱신형이라 몇 년마다 다시 값을 매기는 구조예요.'},{c:'얼마나 오르는데요?',m:'그건 저도 <b>확답을 못 드립니다</b> — 그때 나이와 그때 기준으로 정해지거든요. 그래서 <b>지금 값이 얼마인지</b>보다 <b>끝까지 낼 수 있느냐</b>로 보시는 게 안전합니다.'},{c:'그럼 무조건 비갱신이 좋은 거예요?',m:'아니요. 짧게 쓰실 자리는 갱신형이 낫습니다. <b>오래 들고 갈 자리</b>만 비갱신으로 잡으시면 됩니다.'}]},
 {t:'입원일당은 하루치 밥값이다',ic:'🍚',tag:'작아 보이는 것',
  q:'"하루 3만원이 무슨 도움이 돼요?"',
  fig:'<b>하루 3만원이 아니라, 한 달이면 90만원입니다.</b>',
  ex:'입원하면 병원비만 드는 게 아닙니다. <b>보호자 밥값 · 교통비 · 간병인</b>이 매일 나갑니다. 3만원은 그 하루치입니다.',
  so:'21일 입원이면 <b>63만원</b>. 간병인 쓰면 하루 12~15만원이 또 나갑니다.',
  back:'"입원일당은 <b>병원비가 아니라 그날의 생활비</b>입니다. 하루로 보면 작지만 <b>한 달로 보면</b> 다릅니다."',
  rp:[{c:'하루 얼마 안 되는데 그게 의미가 있나요?',m:'하루로 보면 작습니다. 그래서 <b>며칠 누우시느냐</b>로 보셔야 해요. 2~3주가 되면 얘기가 달라집니다.'},{c:'입원할 일이 있겠어요?',m:'안 계시면 제일 좋죠. 다만 사장님은 <b>일을 쉬면 바로 수입이 끊기는</b> 쪽이라, 병원비보다 그쪽이 더 크실 것 같아서요.'},{c:'얼마로 하는 게 맞아요?',m:'<b>하루 버시는 돈</b>을 기준으로 잡습니다. 그 밑으로는 메워지지 않고, 그 위로는 굳이 필요 없어요.'}]},
 {t:'간병은 끝나는 날이 없다',ic:'🕰️',tag:'50대 이후 반드시',
  q:'"간병까지 넣어야 해요?"',
  fig:'<b>다른 병은 끝이 있는데, 간병만 끝이 없습니다.</b>',
  ex:'암은 5년 지나면 완치를 말합니다. 그런데 <b>치매나 뇌졸중 후유증</b>은 시작만 있고 끝이 없습니다. 부모님 겪어 보셨으면 아실 겁니다.',
  so:'요양병원 한 달 <b>150~250만원</b>, 간병인 하루 <b>12~15만원</b>. 이것이 <b>5년, 10년</b> 갑니다.',
  back:'"돈보다 <b>가족 중 한 사람의 시간</b>이 들어갑니다. 그 사람 소득도 같이 끊깁니다."',
  rp:[{c:'그건 나중에 생각해도 되지 않아요?',m:'그럼요, 급한 건 아닙니다. 다만 이건 <b>가까워지면 못 드는</b> 쪽이라, 지금 조건만 확인해 두시자는 겁니다.'},{c:'자식들이 알아서 하겠죠.',m:'그러실 겁니다. 그런데 사장님도 부모님 때 <b>직접 겪어 보셨잖아요.</b> 그때 제일 힘드셨던 게 뭐였는지 여쭤봐도 될까요?'},{c:'돈보다 사람이 없는 게 힘들었죠.',m:'네, 그래서 <b>사람 쓰는 돈</b>을 미리 떼어 두는 자리입니다. 치료비랑은 아예 다른 지갑이에요.'}]},
 {t:'유사암은 이름만 암이다',ic:'🏷️',tag:'분쟁이 잦은 것',
  q:'"갑상선암 걸렸는데 왜 500만원만 나와요?"',
  fig:'<b>같은 「암」이라도 값이 다릅니다.</b>',
  ex:'같은 「자동차」라도 경차와 대형차 값이 다르죠. 보험에서 <b>갑상선·제자리·경계성</b>은 「유사암」으로 따로 값이 매겨져 있습니다.',
  so:'일반암 3,000만원이어도 유사암은 <b>10~20%</b>인 경우가 많습니다.',
  back:'"약관에 <b>이미 그렇게 적혀 있습니다.</b> 그래서 가입할 때 <b>유사암이 얼마인지</b>를 같이 봐야 합니다."',
  rp:[{c:'암 걸리면 나오는 거 아니에요?',m:'나옵니다. 다만 <b>어떤 암이냐</b>에 따라 금액이 갈립니다. 갑상선암 같은 건 「유사암」으로 따로 봅니다.'},{c:'그런 얘기는 못 들었는데요.',m:'이게 <b>제일 많이 놀라시는 자리</b>예요. 나쁘게 든 게 아니라 그때 기준으로는 그렇게 만들어졌던 겁니다.'},{c:'그럼 어떻게 해야 해요?',m:'일반암을 키우기 전에 <b>유사암 쪽</b>을 먼저 올리는 편이 낫습니다. 실제로 걸리는 건수는 이쪽이 적지 않거든요.'}]},
 {t:'가입한 날부터 시계가 돈다',ic:'⏳',tag:'미루시는 분에게',
  q:'"좀 생각해 보고요"',
  fig:'<b>보험은 사는 게 아니라 시계를 켜는 겁니다.</b>',
  ex:'암은 가입 후 <b>90일</b>이 지나야 보장이 시작되고, <b>1~2년</b>은 절반만 나오는 상품이 많습니다.',
  so:'오늘 가입하면 <b>오늘부터</b> 90일이 갑니다. 다음 달에 하시면 그만큼 <b>뒤로 밀립니다.</b>',
  back:'"지금 결정하시라는 게 아니라, <b>미루면 그만큼 늦게 시작된다</b>는 것만 아셨으면 합니다."',
  rp:[{c:'좀 생각해 보고 다음 달에 할게요.',m:'그럼요, 천천히 보셔도 됩니다. 하나만 말씀드리면 이 담보들은 <b>가입한 날부터</b> 기간이 세어져요.'},{c:'그게 무슨 뜻이에요?',m:'가입하고 얼마 동안은 <b>안 나오거나 절반만</b> 나오는 구간이 있습니다. 그 시계가 <b>오늘 시작하느냐 다음 달에 시작하느냐</b>의 차이입니다.'},{c:'압박하시는 거 아니에요?',m:'아닙니다. 지금 정하시라는 게 아니라 <b>시계가 늦게 돈다</b>는 것만 아시고 정하시라는 뜻이에요. 안 하셔도 저는 괜찮습니다.'}]},
 {t:'보험료는 소득이 아니라 여유에서 낸다',ic:'⚖️',tag:'금액 정할 때',
  q:'"얼마짜리를 들어야 해요?"',
  fig:'<b>「얼마짜리」가 아니라 「끝까지 낼 수 있는 금액」입니다.</b>',
  ex:'헬스장 1년 회원권을 끊고 <b>두 달 만에 안 가면</b> 그 돈은 버린 겁니다. 보험은 그보다 훨씬 큽니다 — 20년을 내야 하니까요.',
  so:'월소득이 아니라 <b>소득 − 고정지출</b> 안에서 정합니다. 은퇴 후에도 낼 수 있어야 합니다.',
  back:'"보장을 키우는 것보다 <b>끝까지 유지되는 것</b>이 먼저입니다. 중간에 못 내면 <b>그때까지 낸 돈이 사라집니다.</b>"',
  rp:[{c:'얼마가 적당한 거예요?',m:'흔히 소득의 8~12%를 말씀드리는데, 그건 <b>가정이지 법으로 정해진 게 아닙니다.</b> 저는 <b>쓰고 남는 돈</b>으로 봅니다.'},{c:'남는 돈이 얼마 없는데요.',m:'그럼 <b>그 안에서</b> 잡습니다. 무리하게 넣으면 몇 년 뒤에 못 내시고, 그러면 <b>그때까지 낸 돈이 사라집니다.</b>'},{c:'그럼 다 못 채우는 거잖아요.',m:'네, 오늘 다 채우지 않습니다. <b>급한 순서</b>대로 놓고 하나씩 가시죠. 그게 끝까지 가는 방법입니다.'}]},
 {t:'해지는 되돌릴 수 없다',ic:'🚪',tag:'해지 말리실 때',
  q:'"이거 비싸니까 그냥 해지할래요"',
  fig:'<b>해지는 문을 닫는 게 아니라 <u>문을 없애는</u> 겁니다.</b>',
  ex:'지금은 나이도 있고 검진에서 뭔가 나온 상태입니다. 이 계약을 없애고 <b>내년에 다시</b> 들려면, <b>지금 몸으로</b> 다시 심사받아야 합니다.',
  so:'특히 <b>1·2세대 실손</b>과 <b>지금은 안 파는 담보</b>는 해지하면 끝입니다.',
  back:'"줄이는 방법은 해지 말고도 있습니다 — <b>배서</b>로 담보만 바꾸면 계약은 살아 있습니다."',
  rp:[{c:'이거 그냥 해지할게요.',m:'잠깐만요, 해지 전에 <b>하나만</b> 확인해 드릴게요. 해지하면 다시 드실 때 <b>지금 나이·지금 건강</b>으로 다시 심사받으셔야 합니다.'},{c:'건강한데요 뭐.',m:'지금은 그러시죠. 그런데 그 사이에 검진에서 뭐 하나만 나와도 <b>못 드시게 되는</b> 경우가 있어서요.'},{c:'그럼 어떻게 하라는 거예요?',m:'계약은 두고 <b>담보만 바꾸는 배서</b>가 되는지 먼저 보겠습니다. 많은 경우 그 편이 부담이 덜합니다.'}]},
 {t:'납입이 끝난 계약은 해지해도 안 싸진다',ic:'🧮',tag:'정리 상담할 때',
  q:'"안 쓰는 거 다 해지하면 보험료 줄죠?"',
  fig:'<b>이미 다 낸 계약은 해지해도 <u>한 푼도 안 줄어듭니다.</u></b>',
  ex:'할부가 <b>이미 끝난 자동차</b>를 팔아도 매달 나가는 돈은 안 줄죠. 대신 <b>차는 없어집니다.</b>',
  so:'납입완료 계약을 해지하면 <b>보험료는 그대로인데 보장만 사라집니다.</b> 가장 손해 보는 해지입니다.',
  back:'"이 계약은 <b>앞으로 낼 돈이 0원</b>입니다. 해지해도 안 싸지고, 보장만 없어집니다."',
  rp:[{c:'보험 정리 좀 하려고요. 이건 오래됐으니까 빼죠.',m:'이건 <b>납입이 끝난</b> 계약이라, 해지하셔도 <b>매달 나가는 돈이 안 줄어듭니다.</b>'},{c:'그럼 왜 갖고 있어요?',m:'돈은 안 나가는데 <b>보장은 살아 있어서요.</b> 해지하시면 나가는 돈은 그대로고 보장만 없어집니다.'},{c:'아, 그런 건 줄 몰랐네요.',m:'이게 정리 상담에서 <b>제일 자주 잘못 빠지는 자리</b>입니다. 그래서 먼저 말씀드렸습니다.'}]},
 {t:'진단비는 치료비가 아니라 선택권이다',ic:'🎫',tag:'금액 키울 때',
  q:'"실비 되는데 진단비 왜 크게 해요?"',
  fig:'<b>진단비는 「치료를 고를 수 있는 표」입니다.</b>',
  ex:'같은 암이라도 <b>급여 치료</b>와 <b>비급여 신약</b>이 있습니다. 통장에 목돈이 있으면 <b>의사가 권하는 걸</b> 고르고, 없으면 <b>되는 걸</b> 고릅니다.',
  so:'그 차이가 생존율로 이어집니다. 진단비는 <b>치료를 돈으로 고르지 않게</b> 하는 돈입니다.',
  back:'"돈 때문에 치료를 바꾸는 일은 <b>없어야 합니다.</b> 그러려고 목돈을 만들어 두는 겁니다."',
  rp:[{c:'치료비는 실손으로 되는데 굳이요?',m:'치료비는 되죠. 진단비는 <b>치료비를 내려고</b> 드는 게 아니라서요.'},{c:'그럼 뭐예요?',m:'통장에 목돈이 있으면 <b>치료를 고르실 수 있고</b>, 없으면 <b>되는 쪽</b>을 보게 되더라고요. 그 차이를 사는 겁니다.'},{c:'좀 과한 얘기 아닌가요?',m:'과하게 들리셨다면 죄송합니다. 겁드리려는 게 아니라, <b>선택지가 줄어드는 자리</b>가 어디인지만 짚어 드리고 싶었습니다.'}]}
];

/* ══ 이 고객, 이렇게 여십시오 ═══════════════════════════════════════
   같은 40대라도 <b>외벌이에 아이 둘</b>과 <b>맞벌이 무자녀</b>는 다른 상담이다.
   적어 두신 것(나이 · 가족 · 소득 · 지금 계약)에서 <b>읽어 낸다.</b>

   ■ 없는 것은 <b>말하지 않는다.</b> 대신 <b>무엇을 더 알아야 하는지</b>를 적는다.
   ■ 화법은 <b>이 도구가 셈한 숫자</b>로만 만든다 — 지어낸 사정은 넣지 않는다. */
function pointCalc(){
  var C=calc(),D=diff(C),P=premCalc(),L=lifeCalc(C),band=ageBand();
  var o={band:band,age:num(S.who.age),sex:S.who.sex,
    inc:num(S.who.incMan),exp:num(S.who.expMan),ret:num(S.who.retire),
    kids:[],spouse:false,need:[],gaps:[],narrow:[],paidUp:[],
    ratio:null,free:null,workYears:null,eduUntil:null};
  (S.fam||[]).forEach(function(f){
    var a=num(f.age),r=(f.rel||'').replace(/\s/g,'');
    if(a===null)return;
    if(/자녀|아들|딸/.test(r))o.kids.push({rel:f.rel,age:a,until:Math.max(0,22-a)});
    if(/배우자|아내|남편|처|부인/.test(r))o.spouse=true;
  });
  o.kids.sort(function(x,y){return x.age-y.age;});
  if(o.kids.length)o.eduUntil=o.kids[0].until;
  if(o.inc!==null&&o.exp!==null)o.free=o.inc-o.exp;
  if(o.inc>0)o.ratio=P.monB/o.inc*100;
  if(o.age!==null&&o.ret!==null)o.workYears=Math.max(0,o.ret-o.age);
  /* 사건별로 지금 얼마나 비는가 */
  EVENTS.forEach(function(ev){
    var r=evCalc(ev,C);
    if(r.cost===null||!(r.cost>0))return;
    if(r.gapB>0)o.gaps.push({t:ev.t,ic:ev.ic,gap:r.gapB,have:r.totB,cost:r.cost,
      pct:(r.rateB===null?null:Math.round(r.rateB))});
  });
  o.gaps.sort(function(x,y){return y.gap-x.gap;});
  /* 범위가 좁은 자리 — 넓은 담보 없이 좁은 것만 들고 있는 경우 */
  if(C.b.brain===undefined&&C.b.circD===undefined&&(C.b.brainh!==undefined||C.b.braini!==undefined||C.b.stroke!==undefined))
    o.narrow.push({t:'뇌',has:[C.b.stroke!==undefined?'뇌졸중':null,C.b.brainh!==undefined?'뇌출혈':null,
      C.b.braini!==undefined?'뇌경색':null].filter(Boolean).join('·'),want:'뇌혈관질환(전체)'});
  if(C.b.heartA===undefined&&C.b.circD===undefined&&(C.b.mi!==undefined||C.b.heart!==undefined))
    o.narrow.push({t:'심장',has:[C.b.heart!==undefined?'허혈성':null,C.b.mi!==undefined?'급성심근경색':null].filter(Boolean).join('·'),
      want:'심혈관질환(전체)'});
  /* 납입이 끝난 계약 — 해지해도 안 싸진다 */
  S.before.forEach(function(pol){
    var c=payCalc(pol,'before');
    if(c.done&&c.prem)o.paidUp.push({nm:(pol.co||'')+' '+(pol.nm||''),prem:c.prem});
  });
  /* 더 알아야 하는 것 */
  if(o.age===null)o.need.push('나이');
  if(o.inc===null)o.need.push('월 소득');
  if(o.exp===null)o.need.push('월 생활비');
  if(!S.fam.length)o.need.push('가족 구성(관계·나이)');
  if(!S.before.length)o.need.push('지금 들고 계신 보험');
  o.C=C;o.D=D;o.P=P;o.L=L;
  return o;
}

/* ══ 자동 보장분석 ═════════════════════════════════════════════════
   「표준 5,000만원」은 <b>모두에게 같은 값</b>이다. 그런데 월 생활비
   200만원인 집과 500만원인 집의 필요액이 같을 리 없다.
   그래서 <b>이 집의 숫자로</b> 다시 셈한다.

   ■ 셈하는 법을 <b>화면에 그대로 적는다</b> — 근거 없는 「적정」은 없다.
   ■ 모르는 값이 있으면 그 줄은 <b>셈하지 않고</b> 무엇이 없는지 말한다.  */
function fitCalc(){
  var A=S.assume||{},C=calc(),o={A:A,rows:[],need:[],inc:num(S.who.incMan),exp:num(S.who.expMan),
    age:num(S.who.age),ret:num(S.who.retire),life:num(S.who.life)||85,kids:[],dep:null};
  (S.fam||[]).forEach(function(f){
    var a=num(f.age);if(a===null)return;
    if(/자녀|아들|딸/.test((f.rel||'').replace(/\s/g,'')))o.kids.push(a);
  });
  o.kids.sort(function(a,b){return a-b;});
  /* 부양 기간 — 막내가 <b>22살</b>이 될 때까지. 자녀가 없으면 은퇴까지 */
  var depAge=num((S.assume||{}).depAge); if(depAge===null)depAge=22;

  if(o.exp===null)o.need.push('월 생활비');
  if(o.age===null)o.need.push('나이');

  function ev(k){var e=null,i;for(i=0;i<EVENTS.length;i++)if(EVENTS[i].k===k)e=EVENTS[i];return e;}
  function got(keys,useCov){
    var v=0,i;for(i=0;i<keys.length;i++){
      var x=C.b[keys[i]];if(x===undefined||x===null)continue;
      if(UNIT[keys[i]]!=='L')continue;
      var r=useCov?((COV[keys[i]]==null)?1:COV[keys[i]]/100):1;
      v+=x*r;}
    return v;
  }
  function gotA(keys,useCov){
    var v=0,i;for(i=0;i<keys.length;i++){
      var x=C.a[keys[i]];if(x===undefined||x===null)continue;
      if(UNIT[keys[i]]!=='L')continue;
      var r=useCov?((COV[keys[i]]==null)?1:COV[keys[i]]/100):1;
      v+=x*r;}
    return v;
  }
  /* ── 사건 셋 — 치료비 + 그 기간의 생활비 ── */
  ['cancer','brain','heart'].forEach(function(k){

    var live=(o.exp!==null&&off!==null)?o.exp*off:null;
    var fit=(cost===null)?null:(cost+(live||0));
    o.rows.push({k:k,t:e.t,ic:e.ic,keys:e.lump,
      now:got(e.lump),nowE:got(e.lump,1),aft:gotA(e.lump),aftE:gotA(e.lump,1),
      fit:fit,
      how:(cost===null)?'기준 치료비가 없어 셈하지 않았습니다'
        :('치료비 <b>'+won(cost)+'</b>'+(live!==null?(' + 그 기간 생활비 <b>'+won(o.exp)+' × '+off+'개월 = '+won(live)+'</b>'):' (소득중단 개월·생활비를 넣으시면 더 정확해집니다)')),
      why:'치료비만 맞추면 <b>일 못 하는 동안의 생활비</b>가 빕니다. 그 둘을 더한 것이 실제 필요액입니다.'});
  });
  /* ── 간병 ── */
  (function(){
    var sc=S.scen.care,cost=num(sc.cost);
    o.rows.push({k:'care',t:'간병 · 요양',ic:'🧑‍⚕️',keys:['dem2'],
      now:got(['dem2']),nowE:got(['dem2']),aft:gotA(['dem2']),aftE:gotA(['dem2']),
      fit:cost,
      how:(cost===null)?'기준을 안 정하셨습니다'
        :('기준 <b>'+won(cost)+'</b> — 요양 <b>월 '+(num(A.careMon)||150)+'만원</b> × <b>'+(num(A.careMonths)||24)+'개월</b> 로 본 값입니다'),
      why:'끝나는 날이 정해져 있지 않은 <b>유일한</b> 지출입니다. 목돈과 <b>매달 나오는 급여</b>를 함께 봅니다.',
      extra:'장기요양 급여(매달) 지금 <b>'+won(C.b.ltcF)+'</b> → 조정 후 <b>'+won(C.a.ltcF)+'</b>'});
  })();
  /* ── 사망 — 남은 가족이 살아갈 돈 ── */
  (function(){
    var keys=['deathD','deathA'];
    /* 남은 가족이 쓸 돈은 <b>지금 생활비 전부</b>가 아니다 — 고인 몫이 빠진다 */
    var pct=num(A.deathPct); if(pct===null)pct=70;
    var fit=(o.exp!==null&&o.dep!==null)?Math.round(o.exp*12*o.dep*pct/100):null;
    o.rows.push({k:'death',t:'사망',ic:'🕊️',keys:keys,
      now:got(keys),nowE:got(keys),aft:gotA(keys),aftE:gotA(keys),fit:fit,

  })();
  /* ── 후유장해 ── */
  (function(){
    var keys=['disabD','disabA'];
    /* 장해는 <b>정도</b>에 따라 다르다 — 평생 전액이 아니라 <b>추가로 드는 돈</b>으로 잡는다 */
    var dp=num(A.disabPct); if(dp===null)dp=25;

      now:got(keys),nowE:got(keys),aft:gotA(keys),aftE:gotA(keys),fit:fit,

        :('월 생활비 <b>'+won(o.exp)+'</b> × 12 × <b>'+yrs+'년</b> × <b>'+dp+'%</b> = <b>'+won(fit)+'</b>'),
      why:'장해는 <b>살아서</b> 남는 일이라 「추가로 드는 돈」으로 잡습니다 — 생활비 전액이 아닙니다. <b>'+dp+'% · '+dy+'년</b>은 가정이고, 상태에 따라 크게 다릅니다. <b>아래 ⚙ 에서 고치실 수 있습니다.</b>'});
  })();
  /* ── 수술비 · 실손 · 일당 — 금액보다 <b>있느냐</b>가 먼저 ── */
  o.have={
    sil:(C.b.silD!==undefined||C.b.silson!==undefined),
    silA:(C.a.silD!==undefined||C.a.silson!==undefined),
    surg:(C.b.surg!==undefined||C.b.surgA!==undefined||C.b.surg5D!==undefined),
    surgA:(C.a.surg!==undefined||C.a.surgA!==undefined||C.a.surg5D!==undefined),
    inp:(C.b.inpD!==undefined),inpA:(C.a.inpD!==undefined),
    nur:(C.b.nurUD!==undefined),nurA:(C.a.nurUD!==undefined),
    liab:(C.b.liab!==undefined),liabA:(C.a.liab!==undefined)
  };
  /* 입원일당 적정 = 하루 소득 */
  o.inpFit=(o.inc!==null)?Math.round(o.inc/30*10)/10:null;
  o.inpNow=(C.b.inpD===undefined)?null:C.b.inpD;
  o.inpAft=(C.a.inpD===undefined)?null:C.a.inpD;
  /* ── 보험료 여력 ── */
  var P=premCalc();
  o.prem={now:P.monB,aft:P.monA,leftD:P.leftD};
  o.free=(o.inc!==null&&o.exp!==null)?(o.inc-o.exp):null;
  o.capLo=(o.inc!==null)?Math.round(o.inc*0.08*10)/10:null;
  o.capHi=(o.inc!==null)?Math.round(o.inc*0.12*10)/10:null;
  var pp=num(A.premPct); if(pp===null)pp=30;
  o.premPct=pp;
  o.capFree=(o.free!==null&&o.free>0)?Math.round(o.free*pp/100*10)/10:null;
  /* ── 등급 ── */
  o.rows.forEach(function(r){
    r.rate=(r.fit&&r.fit>0)?(r.now/r.fit*100):null;
    r.rateA=(r.fit&&r.fit>0)?(r.aft/r.fit*100):null;
    r.grade=fitGrade(r.rate);
    r.gradeA=fitGrade(r.rateA);
    r.gap=(r.fit===null)?null:Math.max(0,r.fit-r.now);
    r.gapA=(r.fit===null)?null:Math.max(0,r.fit-r.aft);
  });
  var g=o.rows.filter(function(r){return r.rate!==null;});
  o.score=g.length?Math.round(g.reduce(function(a,r){return a+Math.min(100,r.rate);},0)/g.length):null;
  o.scoreA=g.length?Math.round(g.reduce(function(a,r){return a+Math.min(100,r.rateA||0);},0)/g.length):null;
  if(!o.have.sil)o.score=(o.score===null)?null:Math.max(0,o.score-20);
  o.grade=fitGrade(o.score);o.gradeA=fitGrade(o.scoreA);
  return o;
}
function fitGrade(v){
  if(v===null||v===undefined)return {g:'—',c:'#C4CBD3',t:'셈하지 않음'};
  if(v>=100)return {g:'A',c:'#0F766E',t:'넉넉합니다'};
  if(v>=70) return {g:'B',c:'#3182F6',t:'거의 됩니다'};
  if(v>=40) return {g:'C',c:'#B45309',t:'절반쯤입니다'};
  if(v>0)   return {g:'D',c:'#DC2626',t:'많이 빕니다'};
  return {g:'F',c:'#991B1B',t:'아예 없습니다'};
}

  var cur=S.fitTab||FIT_TABS[0].k;
  return '<div class="fitsec'+(cur===k?' on':'')+'" data-k="'+k+'">'+inner+'</div>';
}
function fitHtml(){
  var o=fitCalc();
  var h='<div class="card"><h2>📋 자동 보장분석 진단서'+
    '<span class="r"><button class="mini" onclick="closePanel()">닫기</button>'+
    '<button class="mini" onclick="window.print()">🖨 인쇄</button></span></h2>'+
    '<p>넣으신 계약과 <b>이 집의 숫자</b>(소득 · 생활비 · 가족)로 <b>적정 금액을 다시 셈했습니다.</b> '+
    '「표준 5,000만원」은 모두에게 같은 값이지만, <b>월 생활비 200만원인 집과 500만원인 집</b>의 필요액은 다릅니다. '+
    '아래 <b>다섯 칸</b>을 눌러 하나씩 보십시오 — <b>인쇄하면 다섯 칸이 전부 나옵니다.</b></p>'+
    fitTabsHtml();
  if(o.need.length)
    h+='<div class="note w">아직 <b>'+esc(o.need.join(' · '))+'</b>을 안 적으셨습니다 — 넣으시면 <b>이 집에 맞는 금액</b>이 나옵니다. 지금은 셈할 수 있는 것만 셌습니다.</div>';
  var g;   /* 칸 하나를 담는 그릇 — 다섯 번 채워 fitSec 으로 감싼다 */
  /* (1) 종합 */
  g='<div class="fgrade"><div class="fg1" style="border-color:'+o.grade.c+'">'+
      '<span>지금</span><b style="color:'+o.grade.c+'">'+o.grade.g+'</b>'+
      '<em>'+(o.score===null?'—':(o.score+'점 · '+o.grade.t))+'</em></div>'+
    '<div class="fgar">→</div>'+
    '<div class="fg1" style="border-color:'+o.gradeA.c+'">'+
      '<span>조정 후</span><b style="color:'+o.gradeA.c+'">'+o.gradeA.g+'</b>'+
      '<em>'+(o.scoreA===null?'—':(o.scoreA+'점 · '+o.gradeA.t))+'</em></div>'+
    '<div class="fgt">점수는 아래 항목들의 <b>준비율 평균</b>입니다'+
      (!o.have.sil?' — <b>실손이 없어 20점 깎았습니다.</b>':'')+
      '. 100점을 넘어도 100으로 셉니다 — <b>넘치는 것을 자랑하지 않습니다.</b></div></div>';
  h+=fitSec('sum',g);
  /* (2) 항목별 */
  g='<div class="ghd">항목별 진단 — <span style="font-size:12px;font-weight:700;color:var(--gy2)">적정 금액이 어떻게 나왔는지 그대로 적었습니다</span></div>';
  g+='<div class="fitrows">'+o.rows.map(function(r){
    return '<div class="fr2"><div class="fh2">'+r.ic+' <b>'+esc(r.t)+'</b>'+
        '<span class="fgb" style="background:'+r.grade.c+'">'+r.grade.g+'</span>'+
        (r.gradeA.g!==r.grade.g?('<span class="far">→</span><span class="fgb" style="background:'+r.gradeA.c+'">'+r.gradeA.g+'</span>'):'')+
      '</div>'+
      '<div class="fbars">'+
        '<div class="fb"><span>적정</span><div class="t"><i style="width:100%;background:#111827"></i></div><b>'+(r.fit===null?'—':won(r.fit))+'</b></div>'+
        '<div class="fb"><span>지금</span><div class="t"><i style="width:'+(r.fit?Math.min(100,r.now/r.fit*100):0)+'%;background:#94A3B8"></i></div><b style="color:var(--gy)">'+won(r.now)+'</b></div>'+
        '<div class="fb"><span>조정 후</span><div class="t"><i style="width:'+(r.fit?Math.min(100,r.aft/r.fit*100):0)+'%;background:'+(r.rateA>=100?'#0F766E':'#3182F6')+'"></i></div><b style="color:'+(r.rateA>=100?'var(--gr)':'var(--bl)')+'">'+won(r.aft)+'</b></div>'+
      '</div>'+
      '<div class="fhow"><span>어떻게 셈했나</span>'+r.how+'</div>'+
      (r.nowE!==r.now?('<div class="fcov">담보가 <b>열릴 확률</b>까지 보면 지금 <b>'+won(r.nowE)+'</b> → 조정 후 <b>'+won(r.aftE)+'</b> 입니다.</div>'):'')+
      (r.extra?('<div class="fcov">'+r.extra+'</div>'):'')+
      '<div class="fwhy">'+r.why+'</div>'+
      ((r.gapA>0)?('<div class="fgap">조정 후에도 <b>'+won(r.gapA)+'</b>이 빕니다.</div>')
                 :(r.fit?'<div class="fgap ok">조정 후에는 <b>채워집니다.</b></div>':''))+
      '</div>';
  }).join('')+'</div>';
  h+=fitSec('row',g);
  /* (3) 금액 아닌 것 - 있느냐 없느냐 */
  g='<div class="ghd">금액보다 <b>있느냐</b>가 먼저인 것</div><div class="fhas">'+
    fitHas('🩺 실손의료비',o.have.sil,o.have.silA,'병원비를 쓴 만큼 메웁니다. <b>없으면 이것부터</b>입니다 — 진단비보다 먼저입니다.')+
    fitHas('💉 수술비',o.have.surg,o.have.surgA,'가장 <b>자주</b> 쓰는 담보입니다. 청구 건수의 대부분이 여기서 나옵니다.')+
    fitHas('🏥 입원일당',o.have.inp,o.have.inpA,
      (o.inpFit!==null?('하루 소득이 <b>'+won(o.inpFit)+'</b>입니다 — 입원일당은 그만큼이 기준입니다. 지금 <b>'+(o.inpNow===null?'없음':won(o.inpNow)+'/일')+'</b>'):'월 소득을 넣으시면 적정 일당을 셈합니다.'))+
    fitHas('🧑‍⚕️ 간병인사용일당',o.have.nur,o.have.nurA,'하루 <b>12~15만원</b>이 드는 자리입니다. 항암·재활 중에는 혼자 못 지냅니다.')+
    fitHas('🚗 배상책임',o.have.liab,o.have.liabA,'보험료가 <b>아주 싼데</b> 쓸 일이 잦습니다. 없으면 꼭 얹습니다.')+
  '</div>';
  h+=fitSec('has',g);
  /* (4) 보험료 여력 */
  g=assumeHtml();
  g+='<div class="ghd">금액을 얼마로 하는 것이 합리적인가</div>';
  if(o.inc===null)g+='<div class="note w">월 소득을 넣으시면 <b>감당 가능한 보험료 구간</b>을 셈합니다.</div>';
  else{
    g+='<div class="fcap">'+
      '<div class="fc1"><span>월 소득의 8~12%</span><b>'+fee(o.capLo)+' ~ '+fee(o.capHi)+'</b>'+
        '<em>흔히 쓰는 기준입니다 — <b>가정</b>이지 법정 기준이 아닙니다</em></div>'+
      (o.capFree!==null?('<div class="fc1"><span>가용자금(소득−생활비)의 30%</span><b>'+fee(o.capFree)+'</b>'+
        '<em>실제로 <b>끝까지 낼 수 있는가</b>를 보는 자입니다</em></div>'):'')+
      '<div class="fc1 now"><span>지금 내고 계신 돈</span><b>'+fee(o.prem.now)+'</b>'+
        '<em>조정 후 <b>'+fee(o.prem.aft)+'</b>'+(o.prem.leftD<0?(' · 앞으로 낼 돈 <b>'+fee(-o.prem.leftD)+' 줄어듦</b>'):'')+'</em></div>'+
    '</div>';
    var over=(o.capFree!==null&&o.prem.aft>o.capFree);
    g+='<div class="note '+(over?'w':'g')+'">'+
      (over
        ? ('조정 후 보험료가 <b>가용자금의 '+o.premPct+'%('+fee(o.capFree)+')</b>를 넘습니다 — <b>납입기간을 늘리거나</b> 급하지 않은 담보를 뒤로 미루는 것을 권합니다. <b>끝까지 못 내면 그때까지 낸 돈이 사라집니다.</b>')
        : '조정 후 보험료가 <b>감당 구간 안</b>에 있습니다. 끝까지 유지될 금액입니다.')+'</div>';
  }
  h+=fitSec('cap',g);
  /* (5) 준비 순서 + 비교하는 법 */
  g='<div class="ghd">그래서 이 순서로 준비합니다</div>'+fitPlan(o);
  /* 비교하는 법 */
  g+='<div class="ghd">보험을 <b>비교하는 법</b> — 이 순서로만 비교합니다</div>'+
    '<p class="gsub">보험료부터 보면 <b>싼 것이 늘 이깁니다.</b> 그래서 보험료는 <b>맨 마지막</b>입니다.</p>'+
    '<div class="cmps">'+COMPARE_RULE.map(function(c){
      return '<div class="cmp"><div class="ch"><div class="cn">'+c.n+'</div><b>'+c.ic+' '+c.t+'</b></div>'+
        '<div class="cd">'+c.d+'</div>'+
        '<ul>'+c.chk.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
    }).join('')+'</div>';
  h+=fitSec('plan',g);
  return h+'</div>';
}
function fitHas(t,now,aft,d){
  var st=now?'있음':(aft?'새로 생김':'없음');
  var c=now?'ok':(aft?'new':'no');
  return '<div class="fh3 '+c+'"><div class="ft3">'+esc(t)+'<em>'+st+'</em></div><div class="fd3">'+d+'</div></div>';
}
/* 지금 / 다음 / 여유 되면 — 급한 순서로 나눈다 */
function fitPlan(o){
  var A=[],B=[],Cc=[];
  if(!o.have.sil)A.push('<b>실손의료비</b> — 이것부터입니다. 없으면 다른 것을 아무리 채워도 병원비가 그대로 나갑니다.');
  o.rows.filter(function(r){return r.gap>0;}).sort(function(x,y){return y.gap-x.gap;}).forEach(function(r,i){
    var line='<b>'+esc(r.t)+'</b> — '+won(r.gap)+' 더 필요합니다 (적정 '+won(r.fit)+' · 지금 '+won(r.now)+')';
    if(i<2)A.push(line); else if(i<4)B.push(line); else Cc.push(line);
  });
  if(!o.have.surg)B.push('<b>수술비</b> — 가장 자주 쓰는 담보인데 비어 있습니다.');
  if(!o.have.inp)B.push('<b>입원일당</b>'+(o.inpFit!==null?(' — 하루 '+won(o.inpFit)+' 기준'):''));
  if(!o.have.nur&&o.age!==null&&o.age>=45)B.push('<b>간병인사용일당</b> — 하루 12~15만원 드는 자리입니다.');
  if(!o.have.liab)Cc.push('<b>배상책임</b> — 보험료가 아주 싼데 쓸 일이 잦습니다.');
  function box(t,sub,arr,c){
    if(!arr.length)return '';
    return '<div class="pl2" style="border-left-color:'+c+'"><div class="plt"><b>'+t+'</b><em>'+sub+'</em></div>'+
      '<ul>'+arr.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>';
  }
  var h=box('지금 바로','비면 가장 크게 다치는 자리',A,'#DC2626')+
        box('다음에','여유가 생기면 이어서',B,'#B45309')+
        box('여유 되면','있으면 좋은 것',Cc,'#3182F6');
  if(!h)h='<div class="note g">지금 자료로는 <b>급한 자리가 없습니다.</b></div>';
  return h+'<div class="note i">한 번에 다 하실 필요 없습니다. <b>「지금 바로」만</b> 먼저 하셔도 큰 구멍은 막힙니다.</div>';
}


/* ══ 이 고객에게 걸리는 비유를 <b>앞으로</b> ═══════════════════════
   열두 가지를 늘 다 뿌리면 <b>참고 모음</b>일 뿐이다.
   진단에서 <b>실제로 걸린 것</b>을 앞에 세우고, 비유 안의 숫자를
   <b>이 고객 숫자</b>로 바꾼다. 안 걸리는 것은 접어 둔다.

   ※ 안 걸린다고 <b>지우지 않는다</b> — 접어 두고 펼 수 있게 한다.
     상담은 늘 예상대로 가지 않는다.                                 */
function brainPick(){
  var o=pointCalc(),F=fitCalc(),C=o.C,hot=[],rest=[],i;
  function amtOf(k){return (C.b[k]===undefined)?null:C.b[k];}
  function fitOf(k){var r=null;F.rows.forEach(function(x){if(x.k===k)r=x;});return r;}
  function put(idx,rank,you,why){
    var d=BRAIN_DOC[idx];
    if(!d)return;
    hot.push({d:d,rank:rank,you:you,why:why});
  }
  /* ① 범위 — 진단에서 <b>좁은 담보</b>가 잡혔을 때 */
  if(o.narrow.length){
    var w=o.narrow[0];
    var kk=(w.t==='뇌')?['stroke','brainh','braini']:['heart','mi'];
    var nm=null,amt2=null,cv=null;
    for(i=0;i<kk.length;i++)if(C.b[kk[i]]!==undefined){nm=NAME[kk[i]];amt2=C.b[kk[i]];cv=COV[kk[i]];break;}
    put(1,0,
      nm?('"지금 <b>'+esc(nm)+' '+won(amt2)+'</b>을 들고 계십니다. 그런데 이 담보는 '+esc(w.t)+' 사건의 <b>'+
          (cv||'일부')+'%</b>에서 열립니다. 나머지 <b>'+(cv?(100-cv):'')+'%</b>는 <b>이 담보로는 안 열리는</b> 쪽이고요. '+
          '그래서 금액을 키우시는 것보다 <b>'+esc(w.want)+'</b>을 먼저 얹으시는 편이 낫습니다."')
        :null,
      '이 고객은 <b>'+esc(w.t)+'</b> 담보가 <b>'+esc(w.has)+'</b>뿐입니다 — 범위 이야기가 바로 걸립니다.');
  }
  /* ② 납입 끝난 계약 */
  if(o.paidUp.length)
    put(10,1,
      '"「'+esc(o.paidUp[0].nm)+'」은 <b>앞으로 낼 돈이 0원</b>입니다. 해지하셔도 <b>매달 나가는 돈은 그대로</b>고 '+
      '<b>보장만 없어집니다.</b> 이건 그대로 두시는 편이 낫겠습니다."',
      '납입이 끝난 계약이 <b>'+o.paidUp.length+'건</b> 있습니다 — 「정리하자」는 말이 나오면 바로 씁니다.');
  /* ③ 실손과 진단비 */
  var haveSil=(C.b.silD!==undefined||C.b.silson!==undefined);
  var canRow=fitOf('cancer');
  if(haveSil&&canRow&&canRow.gap>0)
    put(0,2,
      '"실손은 <b>있으십니다.</b> 그런데 실손은 <b>병원비만</b> 냅니다. '+
      '일 못 하시는 <b>'+(num(S.scen.cancer.off)||0)+'개월</b>치 생활비는 <b>실손이 맡는 자리가 아닙니다.</b> 지금 그 자리가 <b>'+won(canRow.gap)+'</b> 비어 있습니다."',
      '실손은 있는데 <b>진단비가 모자랍니다</b> — 「실손 있는데 왜」에 바로 답이 됩니다.');
  else if(!haveSil)
    put(0,0,'"지금 <b>실손이 안 보입니다.</b> 다른 것을 채워도 <b>병원비는 그대로 남습니다</b> — 그래서 이것부터 보시는 게 좋겠습니다."',
      '<b>실손이 없습니다</b> — 다른 이야기보다 이것이 먼저입니다.');
  /* ④ 간병 */
  var careRow=fitOf('care');
  if(o.age!==null&&o.age>=45&&careRow&&careRow.now<=0)
    put(5,3,
      '"간병 쪽은 아직 비어 있습니다. 요양은 <b>월 '+(num((S.assume||{}).careMon)||150)+'만원</b>이 '+
      '<b>'+Math.round((num((S.assume||{}).careMonths)||24)/12*10)/10+'년</b> 갑니다 — <b>'+won(careRow.fit)+'</b>입니다. '+
      '이 자리는 <b>언제까지일지 정해져 있지 않다</b>는 점이 어렵습니다."',
      '<b>'+o.age+'세</b>인데 간병이 비어 있습니다 — 이 나이부터 실제로 필요한 자리입니다.');
  /* ⑤ 입원일당 */
  if(o.inc!==null){
    var perDay=Math.round(o.inc/30*10)/10, nowD=C.b.inpD;
    if(nowD===undefined||nowD<perDay)
      put(4,4,
        '"하루 버시는 돈이 <b>'+won(perDay)+'</b>입니다. 지금 입원일당은 <b>'+(nowD===undefined?'없습니다':won(nowD)+'/일')+'</b>. '+
        '21일 입원하시면 그 사이 <b>'+won(perDay*21)+'</b>만큼은 들어오지 않습니다."',
        '하루 소득 <b>'+won(perDay)+'</b>에 견주면 입원일당이 <b>모자랍니다.</b>');
  }
  /* ⑥ 유사암 */
  if(C.b.cancer!==undefined){
    var gen=C.b.cancer,sim=C.b.cancer2;
    if(sim===undefined||sim<gen*0.3)
      put(6,5,
        '"일반암은 <b>'+won(gen)+'</b>인데 유사암은 <b>'+(sim===undefined?'없습니다':won(sim))+'</b>입니다. '+
        '갑상선암처럼 <b>유사암으로 보는 암</b>이면 <b>'+(sim===undefined?'이 담보로는 안 나옵니다':won(sim)+'이 나옵니다')+'</b>. '+
        '「암이면 다 같다」가 아니라 <b>어떤 암이냐</b>가 금액을 가릅니다."',
        '유사암이 일반암에 견줘 <b>많이 작습니다</b> — 분쟁이 가장 잦은 자리입니다.');
  }
  /* ⑦ 보험료 여력 */
  if(F.capFree!==null&&F.prem.aft>F.capFree)
    put(8,6,
      '"조정하면 <b>'+fee(F.prem.aft)+'</b>가 됩니다. 쓰고 남는 돈의 <b>'+F.premPct+'%</b>가 <b>'+fee(F.capFree)+'</b>니까 '+
      '조금 넘습니다. <b>납입기간을 늘리거나</b> 급하지 않은 것을 뒤로 미루는 쪽으로 잡아 보겠습니다."',
      '조정 후 보험료가 <b>여력을 넘습니다</b> — 먼저 말해 두어야 나중에 안 흔들립니다.');
  else if(o.ratio!==null&&o.ratio<6)
    put(8,7,
      '"지금 보험료가 소득의 <b>'+Math.round(o.ratio)+'%</b>뿐입니다. 보통 <b>8~12%</b>를 보는데 '+
      '<b>여력은 있으신 편입니다.</b> 무리해서 늘리자는 게 아니라 <b>비어 있는 자리</b>를 채우자는 이야기입니다."',

  /* ⑧ 해지 · 새로 넣기 */
  var cancelN=0;S.before.forEach(function(x){if(x.act==='cancel')cancelN++;});
  if(cancelN)
    put(9,8,

      '해지로 찍으신 계약이 <b>'+cancelN+'건</b> 있습니다 — 배서로 살릴 수 있는지 먼저 봅니다.');
  if(S.after.length)
    put(7,9,
      '"오늘 넣으시면 <b>오늘부터</b> 90일이 갑니다. 다음 달에 하시면 <b>그만큼 뒤로</b> 밀립니다 — '+
      '지금 정하시라는 게 아니라 <b>시계가 늦게 돈다</b>는 것만 아셨으면 합니다."',
      '새로 넣는 계약이 있습니다 — <b>면책·감액</b>을 먼저 말해 두어야 나중에 말이 안 나옵니다.');
  /* ⑨ 진단비 = 선택권 */
  if(canRow&&canRow.gap>0)
    put(11,10,
      '"암이 오면 <b>'+won(canRow.fit)+'</b>이 필요한데 지금 <b>'+won(canRow.now)+'</b>입니다. '+
      '통장에 목돈이 있으면 <b>치료를 고르실 수 있고</b>, 없으면 <b>되는 쪽</b>을 보게 되더라고요."',
      '암 쪽이 <b>'+won(canRow.gap)+'</b> 비어 있습니다 — 금액을 키울 때 쓰는 말입니다.');
  /* 나머지 */
  hot.sort(function(a,b){return a.rank-b.rank;});
  var used={};hot.forEach(function(x){used[x.d.t]=1;});
  BRAIN_DOC.forEach(function(d){if(!used[d.t])rest.push(d);});
  return {hot:hot,rest:rest,o:o};
}

function flowCalc(){

  }else if(gapBig&&loose){
    f.kind='한 번에 정하기';
    f.why='비는 곳이 크고 <b>여력도 있습니다</b>('+Math.round(o.ratio)+'%). 나눠 가면 오히려 <b>흐지부지</b>됩니다.';

    goal:'「이 사람이 <b>내 사정을 듣고 있다</b>」 는 느낌'});
  s1.push({t:'지금 뭘 들고 계신지 보여주기',m:'7분',
    d:'계약을 <b>한 줄씩</b> 정리해 드립니다. 파는 이야기를 아직 안 합니다.',
    show:'📋 계약별 납입내역 · 표준 담보표',
    goal:'「내가 뭘 들고 있는지 <b>처음 알았다</b>」'});
  if(paidUp)
    s1.push({t:'납입 끝난 계약 짚기',m:'3분',
      d:'「'+esc(o.paidUp[0].nm)+'」은 <b>앞으로 낼 돈이 0원</b>입니다. 이건 <b>정리 대상이 아닙니다.</b>',
      show:'📋 계약별 납입내역',
      goal:'<b>안 파는 이야기</b>를 먼저 해서 믿음을 만듭니다'});
  s1.push({t:'비는 곳 하나만 보여주기',m:'7분',
    d:o.gaps.length?('<b>'+esc(o.gaps[0].t)+'</b> 하나만 봅니다 — <b>'+won(o.gaps[0].gap)+'</b>이 빕니다. 나머지는 아직 안 꺼냅니다.')
      :'크게 비는 곳이 없다고 <b>그대로</b> 말씀드립니다.',
    show:'🎯 시뮬레이션 (이 병이 오면)',
    goal:'「이건 <b>내 문제구나</b>」'});
  s1.push({t:'숙제 드리고 닫기',m:'2분',

  f.time='1차 <b>'+m1+'분</b> · 2차 <b>'+m2+'분</b>';

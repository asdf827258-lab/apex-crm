/* ═══════════════ 표준 담보표 (고객용) ═══════════════ */
/* ── 그림 하나로 말한다 — 전 · 후 막대 ────────────────────────────
   고객은 숫자 네 개를 나란히 놓아 주면 <b>안 읽는다.</b> 길이가 다른 막대
   둘이면 설명 없이 읽는다. 그리는 자리는 <b>여기 하나</b>다 — 장마다
   따로 그리면 색이나 눈금이 어긋나 같은 자료가 달라 보인다.

   ■ 눈금은 <b>둘 중 큰 것</b>에 맞춘다. 각자 100%로 그리면 작은 쪽이
     꽉 찬 것처럼 보여 그림이 거짓말을 한다.
   ■ 값이 없으면 막대를 안 그린다. 0 으로 그리면 「없다」가 아니라
     「0 이다」로 읽힌다 (1번).                                       */
function cmpBar(lb,pb,pa,tb,ta){
  if(pb===null&&pa===null)return '';
  var max=Math.max(100,pb||0,pa||0);
  function row(nm,p,t,cls){
    if(p===null||p===undefined)return '<div class="cbr"><span class="cbn">'+nm+'</span>'+
      '<span class="cbt none">아직 안 적었습니다</span></div>';
    return '<div class="cbr"><span class="cbn">'+nm+'</span>'+
      '<span class="cbg"><i class="'+cls+'" style="width:'+Math.max(1,Math.round(p/max*100))+'%"></i>'+
      (max>100?('<u style="left:'+Math.round(100/max*100)+'%"></u>'):'')+'</span>'+
      '<span class="cbt">'+esc(t||'')+'<em>'+p+'%</em></span></div>';
  }
  return '<div class="cmpb"><div class="cbl">'+esc(lb)+'</div>'+
    row('지금',pb,tb,'b')+row('조정 후',pa,ta,'a')+
    /* 눈금이 100 을 넘을 때만 세로줄이 그어진다 — 안 그은 줄을 설명하지 않는다 */
    (max>100?'<div class="cbf">가는 세로줄이 <b>표준(권장) 100%</b> 자리입니다.</div>':
             '<div class="cbf">막대 끝이 <b>표준(권장) 100%</b> 입니다.</div>')+'</div>';
}
/* ── 담보표를 <b>묶음마다 한 장</b>으로 ────────────────────────────
   한 장에 표 열 개를 넣었더니 그 한 장이 <b>다섯 화면</b>이 됐다. 넘기는
   판에서 한 장이 다섯 화면이면 넘기는 뜻이 없고, 고객은 어디를 보는지
   모른다. 큰 갈래(병원비·3대질병·생활)로만 나눠 봤더니 3대질병 하나가
   <b>네 화면</b>이라 그대로였다 — 그 안에 묶음이 여섯이기 때문이다.

   그래서 <b>묶음(암·뇌·심장·수술비…)마다 한 장</b>으로 나눈다. 한 장이
   반 화면쯤이라 고객이 한눈에 본다. 위 목차에서 바로 건너뛴다.

   <b>숨기는 게 아니라 나누는 것</b>이다 — 담보는 하나도 안 빠지고,
   인쇄하면 전부 이어서 나온다.

   장은 STD 를 <b>세어서</b> 만든다. 여기 또 적으면 묶음을 하나 늘릴 때
   그 장이 안 생긴다.                                                */
/* 묶음 하나가 <b>표준 대비 얼마나 찼나</b> — 표를 읽기 전에 보는 그림 */
function stFill(C,g){
  var std=0,b=0,a=0,got=false;
  g.rows.forEach(function(r){
    /* 목돈(L)만 더한다 — 하루·매달·한도는 같은 자로 잴 수 없다 */
    if(UNIT[r.k]!=='L'||!r.std)return;
    std+=r.std;got=true;
    if(C.b[r.k]!==undefined)b+=C.b[r.k];
    if(C.a[r.k]!==undefined)a+=C.a[r.k];
  });
  if(!got||!std)return null;
  return {std:std,b:b,a:a,pb:Math.round(b/std*100),pa:Math.round(a/std*100)};
}
function stShow(C){
  var out='';

    var f=stFill(C,g);
    out+='<section id="s8_'+gi+'" data-nm="'+esc(g.ic+' '+g.mid)+'">'+

    out+='<div class="st"><table><tr><th>담보</th><th>표준</th><th>전</th><th>후</th><th>결과</th></tr>';
    rows.forEach(function(r){
      var b=C.b[r.k],a=C.a[r.k],d=((a||0)-(b||0));
      var res=(a===undefined&&b===undefined)?'':(d>0?'⏫ 보장UP':(d<0?'⏬ 줄어듦':(b?'유지':'')));
      out+='<tr><td>'+esc(r.n)+(r.cov?('<span class="cov">'+r.cov+'%</span>'):'')+
        (r.d?('<div class="dsc">'+r.d+'</div>'):'')+'</td>'+
        '<td class="std">'+(r.std?man(r.std):'—')+'</td>'+
        '<td style="color:var(--gy);font-weight:800">'+(b===undefined?'—':man(b))+'</td>'+
        '<td style="font-weight:800;color:'+(d>0?'var(--bl)':(d<0?'var(--rd)':'var(--nv)'))+'">'+(a===undefined?'—':man(a))+'</td>'+
        '<td class="rd '+(d>0?'up':(d<0?'no':'mid'))+'">'+res+'</td></tr>';
    });
    out+='</table></div>'+
      sayLine(f?('이 묶음은 표준의 <b>'+f.pb+'%</b>가 채워져 있고, 조정하면 <b>'+f.pa+'%</b>가 됩니다.'+
                 (f.pa>=100?' 이 자리는 <span class="o">채워집니다.</span>':' 표에서 어느 담보가 비었는지 같이 보시죠.')):
                '이 묶음은 목돈이 아니라 <b>하루·매달·한도</b>로 나오는 자리라, 하나로 더해 재지 않았습니다.')+
      '<p class="sd deep">「표준」은 <b>일반적으로 권하는 기준</b>, 「전」은 지금, 「후」는 조정 후입니다. '+
      (f?'위 막대는 <b>목돈으로 나오는 담보만</b> 더한 것입니다 — 하루·매달·한도로 나오는 담보는 <b>같은 자로 잴 수 없어</b> 뺐습니다. 표에는 그대로 있습니다.':
         '이 묶음은 <b>목돈이 아닌 방식</b>(하루·매달·한도)으로 나와, 하나로 더해 재지 않았습니다.')+'</p>'+
      '</section>';
  });
  return out;
}

function premBars(P){
  var rows=[['월 납입',P.monB,P.monA],['앞으로 낼 돈',P.leftB,P.leftA],['총 납입',P.totB,P.totA]];

  rows.forEach(function(r){
    var b=r[1],a=r[2];
    if(b===null||a===null||!isFinite(b)||!isFinite(a))return;
    var max=Math.max(b,a,1);
    out+='<div class="pbr"><div class="pbn">'+esc(r[0])+'</div>'+
      '<div class="pbg"><i class="b" style="width:'+Math.max(2,Math.round(b/max*100))+'%"></i>'+
      '<span>'+fee(b)+'</span></div>'+
      '<div class="pbg"><i class="a" style="width:'+Math.max(2,Math.round(a/max*100))+'%"></i>'+
      '<span>'+fee(a)+'</span></div></div>';
  });
  return out?('<div class="pbars"><div class="pbk"><span class="b">지금</span><span class="a">조정 후</span></div>'+out+'</div>'):'';

/* ══ 고객이 보는 「왜 나에게 맞는가」 ═══════════════════════════════
   고객은 <b>남의 표준</b>을 보고 정하지 않는다. 「이게 <b>왜 나한테</b>
   맞는데?」 가 안 풀리면 아무리 좋은 설계도 안 넘어간다.

   ■ 이유는 <b>이 사람의 사정</b>에서만 가져온다 — 나이 · 가족 · 소득 ·
     지금 들고 있는 계약. 없는 사정은 지어내지 않는다.
   ■ 「지금 무슨 상담을 받고 있는지」 도 함께 보여 준다 — 어디까지 왔고
     무엇이 남았는지 모르면 <b>불안해서</b> 못 정한다.                  */
function whyCalc(){

  if(o.kids.length){

        (o.exp!==null?('매달 <b>'+won(o.exp)+'</b>의 생활비가 <b>그대로</b> 나갑니다.'):'생활비는 그대로 나갑니다.')+
        ' 그래서 <b>사망 · 소득중단</b>을 이 기간에 맞춰 잡았습니다.'});
  }
  /* ② 소득 · 여력에서 */
  if(o.inc!==null&&o.exp!==null)
    r.push({ic:'💳',t:'쓰고 남는 돈이 월 '+won(o.free),
      d:'보험료를 <b>여기 안에서</b> 잡았습니다. 조정 후 <b>'+fee(P.aft)+'</b>'+
        (F.capFree!==null?(' — 남는 돈의 <b>'+F.premPct+'%('+fee(F.capFree)+')</b> 안쪽입니다.'):'.')+
        ' <b>끝까지 낼 수 있는 금액</b>이어야 의미가 있습니다.'});
  /* ③ 지금 계약에서 — 잘하고 계신 것도 말한다 */
  var good=[];
  if(C.b.silD!==undefined||C.b.silson!==undefined)good.push('<b>실손</b>을 들고 계십니다');
  if(o.paidUp.length)good.push('<b>'+esc(o.paidUp[0].nm)+'</b>은 이미 납입이 끝났습니다');
  F.rows.forEach(function(x){ if(x.rate!==null&&x.rate>=100&&good.length<3)good.push('<b>'+esc(x.t)+'</b>은 이미 넉넉합니다'); });
  if(good.length)
    r.push({ic:'✅',t:'이미 잘 되어 있는 것',
      d:good.join(' · ')+'. <b>이건 그대로 둡니다</b> — 바꾸자는 이야기가 아닙니다.'});
  /* ④ 비는 곳 — 왜 그게 문제인지 */
  if(o.gaps.length){
    var g=o.gaps[0];
    r.push({ic:'🕳',t:esc(g.t)+'이 오면 '+won(g.gap)+'이 빕니다',
      d:'드는 돈 <b>'+won(g.cost)+'</b> 가운데 지금 나오는 것이 <b>'+won(g.have)+'</b>입니다. '+
        '나머지는 <b>통장에서</b> 나갑니다 — 그래서 여기를 먼저 채웠습니다.'});
  }
  /* ⑤ 범위 */
  if(o.narrow.length){
    var w=o.narrow[0];
    r.push({ic:'🎯',t:esc(w.t)+' 담보가 「'+esc(w.has)+'」 뿐이라',
      d:'이 담보는 <b>정해진 병일 때만</b> 나옵니다. 같은 값이면 <b>'+esc(w.want)+'</b>이 어떤 경우든 열립니다 — '+
        '<b>금액을 키운 게 아니라 범위를 넓혔습니다.</b>'});
  }
  /* ⑥ 안 한 것도 말한다 */
  var not=[];
  if(o.paidUp.length)not.push('납입 끝난 계약은 <b>건드리지 않았습니다</b>');
  if(C.b.silD!==undefined||C.b.silson!==undefined)not.push('오래된 <b>실손은 그대로</b> 두었습니다');

  return {rows:r,o:o,F:F};
}

/* ══ 한 장씩 넘겨 보기 — 고객 앞에서 ═══════════════════════════════
   고객 앞에서 스크롤을 내리면 <b>고객 눈이 아래 문단으로 먼저 달아난다.</b>
   지금 말하는 자리를 놓치고, 아직 설명 안 한 숫자를 먼저 본다. 그래서
   한 장씩 넘기는 판을 따로 둔다. 설계사가 혼자 훑을 때는 죽 이어서.

   ■ 장 목록은 <b>화면에 실제로 선 것</b>에서 센다. 미리 적어 둔 표로 세면,
     자료가 없어 안 그려진 장(왜 나에게 맞는가·보험료 변화는 빈 글을
     돌려준다)까지 세어 <b>빈 장</b>이 생기고 「7 / 12」 가 거짓말이 된다.
   ■ 지금 몇 번째인가는 <b>id 하나로</b> 든다. 번호로 들고 있으면 장 하나가
     빠질 때 엉뚱한 장이 열린다.
   ■ <b>인쇄하면 전부 나온다.</b> 접힌 것을 뺀 것처럼 보이게 두지 않는다
     — 아래 printAllOn 과 같은 이유다. @media print 에서 되살린다.
   ■ 손은 <b>한 번만</b> 단다. 그릴 때마다 달면 겹겹이 쌓여 한 번 눌러도
     여러 장이 넘어간다.                                                */
function deckList(){
  var box=document.querySelector('#app .show'),out=[],i,ns;
  if(!box)return out;
  ns=box.children;
  for(i=0;i<ns.length;i++)if(ns[i].tagName==='SECTION')out.push(ns[i]);
  return out;
}
function deckAt(L){
  var i;for(i=0;i<L.length;i++)if(L[i].id===S.slide)return i;
  return -1;
}
/* ── 16:9 무대를 <b>화면에 맞게</b> 줄여 앉힌다 ────────────────────
   무대는 1280×720 로 못 박혀 있다. 글자 크기를 px 로 정해 두어야 어느
   화면에서나 <b>같은 모양</b>으로 서기 때문이다. 대신 화면이 좁으면
   통째로 줄인다 — 늘리지는 않는다(1.0 을 넘으면 흐릿해진다).
   여는 자리는 여기 하나다. 그릴 때·창 크기가 바뀔 때 부른다.        */
function deckFit(){
  var box=document.querySelector('#app .show'),wrap=document.getElementById('deckWrap');
  if(!box||!wrap)return;
  if(!S.deck){box.style.transform='';wrap.style.height='';wrap.classList.remove('deck-fit');return;}
  wrap.classList.add('deck-fit');
  var avW=wrap.clientWidth,avH=wrap.clientHeight;
  if(!avW||!avH)return;
  var k=Math.min(avW/1280,avH/720,1);
  box.style.transform='scale('+k+')';
  /* 줄인 만큼 자리도 줄여 준다 — 안 그러면 밑에 빈 자리가 남는다 */
  wrap.style.setProperty('--k',k);
  box.style.marginLeft=Math.max(0,(avW-1280*k)/2)+'px';
}
var _fitT=null;
window.addEventListener('resize',function(){
  if(_fitT)clearTimeout(_fitT);
  _fitT=setTimeout(deckFit,80);
});
function deckPaint(){
  var box=document.querySelector('#app .show');
  if(!box)return;
  var L=deckList(),cur=deckAt(L),i,on=!!S.deck,toc,bar;
  /* 보던 장이 사라졌으면 첫 장으로 — 빈 화면을 세우지 않는다 */
  if(cur<0){cur=0;S.slide=L.length?L[0].id:'';save();}
  if(on)box.classList.add('deck');else box.classList.remove('deck');
  if(on)document.body.classList.add('deck-on');else document.body.classList.remove('deck-on');
  for(i=0;i<L.length;i++){
    if(on&&i===cur)L[i].classList.add('cur');else L[i].classList.remove('cur');
  }
  toc=document.getElementById('baToc');
  if(toc){toc.innerHTML=L.map(function(el,i){
    return '<a href="#'+el.id+'"'+(on&&i===cur?' class="on"':'')+' onclick="return deckJump('+i+')">'+
      '<b>'+(i+1)+'</b>'+esc(secName(el)||('제 '+(i+1)+' 장'))+'</a>';
    }).join('');
    /* 한 줄로 누웠으니 <b>지금 장</b>이 눈에 들어오게 밀어 준다 */
    if(on){var cc=toc.children[cur];
      if(cc&&cc.offsetLeft!==undefined)toc.scrollLeft=Math.max(0,cc.offsetLeft-toc.clientWidth/2+cc.offsetWidth/2);}
  }
  bar=document.getElementById('deckBar');
  /* 띠에는 <b>어디쯤인지</b>만 둔다. 「몇 번째 장으로」 는 위 목차가 이미
     하는 일이라, 여기에 또 두면 같은 것이 두 곳이 된다 (5번). */
  if(bar)bar.innerHTML=(!on||!L.length)?'':(
    '<button class="dnav" onclick="deckMove(-1)"'+(cur<=0?' disabled':'')+' aria-label="앞 장">◀</button>'+
    '<div class="dbar"><i style="width:'+Math.round((cur+1)/L.length*100)+'%"></i></div>'+
    '<span class="dt">'+esc(secName(L[cur]))+'</span>'+
    '<span class="dn"><b>'+(cur+1)+'</b> / '+L.length+'</span>'+
    '<button class="dnav" onclick="deckMove(1)"'+(cur>=L.length-1?' disabled':'')+' aria-label="다음 장">▶</button>'+
    (DECK_SHOW?'<button class="dnav x" onclick="deckShow(false)" aria-label="발표 끝내기">✕</button>':''));
  deckFit();
}
function deckJump(i){
  var L=deckList();
  if(!L[i])return true;
  S.slide=L[i].id;save();
  /* 죽 이어서 볼 때는 <b>그 자리로 내려간다</b> — 앵커를 그대로 살린다 */
  if(!S.deck)return true;
  deckPaint();
  try{window.scrollTo(0,0);}catch(e){}
  return false;
}
function deckMove(d){
  var L=deckList(),cur=deckAt(L);
  if(cur<0)cur=0;
  /* 처음·끝의 마개는 <b>deckJump 한 곳</b>이 든다 — 없는 장이면 안 움직인다.
     여기서 또 자르면 마개가 두 곳이 되고, 한쪽만 고치는 날이 온다 (5번). */
  deckJump(cur+d);
}
function setDeck(on){
  S.deck=!!on;save();render();
  /* 한 장씩 → 죽 이어서 로 바꾸면 <b>보던 장</b> 자리에서 이어 준다 */
  if(!S.deck&&S.slide){
    try{var el=document.getElementById(S.slide);if(el)el.scrollIntoView();}catch(e){}
  }else{try{window.scrollTo(0,0);}catch(e){}}
}
/* ── 발표 — 설계사 도구를 치우고 화면을 자료로 채운다 ────────────────
   고객 앞에 「만들기 / 예시 채우기 / 전부 지우기」 가 떠 있으면 그건
   <b>작업 화면</b>이지 자료가 아니다. 전체화면은 <b>되면 좋은 것</b>일 뿐
   — 워크스페이스 안(iframe)에서는 막힐 수 있어, 막혀도 도구는 치운다.
   그래서 <b>브라우저에 묻지 않고</b> 우리가 아는 값으로 든다.        */
var DECK_SHOW=false;
function deckShow(on){
  DECK_SHOW=!!on;
  if(DECK_SHOW)document.body.classList.add('presenting');
  else document.body.classList.remove('presenting');
  try{
    var el=document.documentElement;
    if(DECK_SHOW){if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();}
    else if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();
  }catch(e){}
  deckPaint();
  try{window.scrollTo(0,0);}catch(e){}
}
/* 브라우저 쪽에서 빠져나갔을 때(Esc·F11)도 도구를 되돌려 놓는다 */
document.addEventListener('fullscreenchange',function(){
  if(!document.fullscreenElement&&DECK_SHOW)deckShow(false);
});
/* 넘기는 손 — 리스너는 한 번만 단다 */
document.addEventListener('keydown',function(e){
  if(S.mode!=='show'||!S.deck)return;
  var t=e.target||{},tag=(''+(t.tagName||'')).toUpperCase();
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||t.isContentEditable)return;
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  var k=e.key,L;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Spacebar'){deckMove(1);e.preventDefault();}
  else if(k==='ArrowLeft'||k==='PageUp'){deckMove(-1);e.preventDefault();}
  else if(k==='Home'){deckJump(0);e.preventDefault();}
  else if(k==='End'){L=deckList();deckJump(L.length-1);e.preventDefault();}
  else if(k==='Escape'&&DECK_SHOW){deckShow(false);e.preventDefault();}
});
/* 폰·태블릿에서 쓸어 넘기기. <b>가로로 스크롤되는 상자</b>(담보표·치료
   여정) 안에서 시작한 것은 장을 넘기지 않는다 — 표를 옆으로 미는 손이다. */
var _swX=null,_swY=null;
function deckNoSwipe(el){
  while(el&&el.nodeType===1){
    if(el.className&&(''+el.className).split(/\s+/).indexOf('dl')>=0)return true;
    if(el.className&&(''+el.className).split(/\s+/).indexOf('tj')>=0)return true;
    el=el.parentNode;
  }
  return false;
}
document.addEventListener('touchstart',function(e){

    catch(e){alert('불러오지 못했습니다 — '+e.message);}};
  r.readAsText(f);});
document.addEventListener('dragover',function(e){var d=document.getElementById('kbDrop');if(!d)return;e.preventDefault();d.className='drop on';});
document.addEventListener('dragleave',function(){var d=document.getElementById('kbDrop');if(d)d.className='drop';});
document.addEventListener('drop',function(e){var d=document.getElementById('kbDrop');if(!d)return;
  e.preventDefault();d.className='drop';
  var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)kbRead(f);});
/* ══ 고객 365일과 잇는 다리 ═══════════════════════════════════════
   이 화면은 <b>혼자서도</b> 돌고(파일을 더블클릭), 워크스페이스 안에서도 돈다.
   안에서 열렸을 때만 <b>고객 365일 저장</b> 단추가 선다.

   저장하는 곳 — 새 표를 만들지 않는다. 이미 있는 saved_reports 를 쓴다.
   보내는 것은 <b>이 화면의 자료 한 덩이</b>뿐이고, 저장은 <b>바깥</b>이 한다. */
/* 알림 한 줄 — 이 화면에는 <b>없던 것</b>이다.
   저장이 되어도 안쪽에서 오류가 나 <b>아무 말도 안 떴다</b>. 여기서 만든다. */
function toast(msg,ms){
  var t=document.getElementById("baToast");
  if(!t){
    t=document.createElement("div"); t.id="baToast";
    t.style.cssText="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);"+
      "max-width:min(90vw,520px);padding:12px 18px;border-radius:12px;background:#191F28;"+
      "color:#fff;font-size:14px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.25);"+
      "z-index:9999;opacity:0;transition:opacity .18s;pointer-events:none;text-align:center";
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity="1";
  clearTimeout(t._t); t._t=setTimeout(function(){ t.style.opacity="0"; }, ms||2600);
}
var INFRAME=(function(){try{return window.parent&&window.parent!==window;}catch(e){return false;}})();
var HOST={ready:false,client:'',name:''};
function baPost(m){ try{ if(INFRAME)window.parent.postMessage(m,'*'); }catch(e){} }
function baSaveToClient(){
  if(!INFRAME){toast('워크스페이스 안에서 여셨을 때만 고객 365일에 저장됩니다 — 지금은 「💾 파일로 저장」을 쓰십시오');return;}
  var C=calc(),D=diff(C),P=premCalc();
  var nm=S.who.name||'고객';
  baPost({type:'apexBaSave',
    title:nm+' 보장 전·후 ('+(new Date()).toISOString().slice(0,10)+')',
    state:S,
    /* 목록에서 바로 읽히도록 <b>요약 몇 줄</b>을 같이 보낸다 */
    sum:{name:nm,age:S.who.age||'',
         premB:P.monB,premA:P.monA,leftB:P.leftB,leftA:P.leftA,
         loss:D.loss.length,gain:D.gain.length,
         cov:(function(){var n=0,k;for(k in C.a)n++;return n;})()}});
}
function baLoadFromHost(st){
  if(!st)return;
  try{ S=migrate(st); save(); render(); toast('고객 365일에서 불러왔습니다'); }
  catch(e){ toast('불러오지 못했습니다 — '+((e&&e.message)||'')); }
}
window.addEventListener('message',function(e){
  var d=e&&e.data; if(!d||!d.type)return;
  if(d.type==='apexBaHello'){
    HOST.ready=true;HOST.client=d.client||'';HOST.name=d.name||'';
    if(d.state)baLoadFromHost(d.state);
    render();
    return;
  }
  if(d.type==='apexBaLoad'){ baLoadFromHost(d.state); return; }
  if(d.type==='apexBaAsk'){ baSaveToClient(); return; }   /* 바깥 💾 단추가 자료를 달라고 한 것 */
  if(d.type==='apexBaSaved'){ toast('💾 '+(d.name||'고객')+'님 자료로 저장했습니다'); return; }
});
/* 열리자마자 「나 여기 있습니다」 — 바깥이 이 고객 자료를 내려 준다 */
if(INFRAME)baPost({type:'apexBaReady'});


S=load();render();
</script>

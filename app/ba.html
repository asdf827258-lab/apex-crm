/* ══ 📅 <b>만기 한 줄</b> — 요약에 같이 담아 보냅니다 ═══════════════
   사장님 말씀 (2026-09-24) — 「보장분석이 돌 때 <b>다음 만기일 한 줄</b>을
   적어 두게 하는 것이 다음 판입니다」.

   ■ 왜 여기서 세는가
   만기를 아는 값(start·years·term)은 <b>이 화면</b>에만 있습니다. 홈이
   고객 수백 분의 증권을 다 읽어 세면 그것이 무료 한도를 세 배로 넘긴 그
   자리입니다 (7번). 그래서 <b>여기서 한 줄로 적어</b> sum 에 실어 보냅니다 —
   담보 이름(baTopCov)을 여기서 적어 보내는 것과 같은 까닭입니다 (5번).

   ■ ⚠ <b>「D-30」 이라고 쓰지 않습니다</b> (1번)
   가입 시기(p.start)가 <b>"2019-04" 처럼 달까지만</b> 있습니다. 일(日)이
   없는 값으로 일 단위 D-30 을 만들면 <b>없는 정밀도를 지어내는 것</b>입니다.
     · 납입 만기 = start + years  →  <b>달까지</b>  (2039-04)
     · 보장 만기 = 만기 나이 + 지금 나이  →  <b>해까지</b>  (2059년)
   그래서 화면에도 「다음 달에 납입이 끝납니다」 처럼 <b>아는 만큼만</b> 적습니다.

   ■ ⚠ <b>9999세만기</b>
   KB 는 종신을 「9999세만기」로 적습니다. 그대로 빼면 9,959년이 됩니다 —
   그 자를 <b>이미 kbYears 가 들고 있으므로</b> 여기서 다시 짜지 않고 같은
   기준(1~60년)을 씁니다 (5번). 넘으면 <b>모름</b>으로 두고 안 셉니다.

   ■ ⚠ <b>어느 쪽이 이기는가</b>
   언젠가 policies 표에 증권을 보고 적은 날짜(일까지)가 들어오면 <b>그쪽이
   원본</b>이고 이 줄은 추정입니다. 지금 policies 에는 payment_term ·
   coverage_term 이 <b>글자</b>로만 있어 날짜 칸이 없습니다. 그래서 이 줄에
   <b>출처(src)를 같이 적습니다</b> — 안 적으면 나중에 어느 쪽이 맞는지
   아무도 모릅니다.
   ★ 해지(cancel)한 계약은 안 셉니다 — 없어질 보험의 만기입니다.        */
function baEndAge(termStr){
  /* 「70세납 100세만기」 처럼 <b>세</b>가 둘일 수 있습니다. 만기는 납입보다
     늦으므로 <b>큰 쪽</b>을 만기로 봅니다. 120 을 넘으면(9999세=종신)
     <b>모름</b>입니다 — 종신은 만기가 없는 것이지 9999년이 아닙니다. */
  var t=(''+(termStr||'')).replace(/\s/g,''),m,best=null;
  var re=/(\d{1,4})세/g;
  while((m=re.exec(t))!==null){ var v=+m[1]; if(v>0&&v<=120&&(best===null||v>best))best=v; }
  return best;
}
function baEndOf(){
  var today=new Date(), ty=today.getFullYear(), tm=today.getMonth()+1;
  var age=parseInt((''+((S.who&&S.who.age)||'')).replace(/[^0-9]/g,''),10);
  if(!age||age<=0||age>120)age=null;
  var pay=null,cov=null,rnw=null,i,p,nm;
  for(i=0;i<S.before.length;i++){
    p=S.before[i];
    if(!p||p.act==='cancel')continue;                 /* 없어질 보험은 안 셉니다 */
    nm=((p.co||'')+' '+(p.nm||'')).replace(/^\s+|\s+$/g,'');
    /* ① 납입 만기 — 가입 달 + 납입 햇수 (달까지) */
    var st=(''+(p.start||'')).match(/^(\d{4})-(\d{2})$/);
    var yr=parseInt((''+(p.years||'')).replace(/[^0-9]/g,''),10);
    if(st&&yr>0&&yr<=60){                              /* kbYears 와 같은 자 (5번) */
      var em=(+st[2])+0, ey=(+st[1])+yr;
      var key=ey*12+em;
      if(key>=ty*12+tm&&(pay===null||key<pay.key))
        pay={key:key,ym:ey+'-'+((em<10?'0':'')+em),nm:nm};
    }
    /* ③ <b>다음 갱신일</b> — 가입 달 + 갱신주기 × n (판 X423).
       ★ <b>둘 다 알 때만</b> 셉니다 (1번) — 가입 달을 모르거나 주기가
         「모름」 이면 아무것도 안 돌려줍니다. 날짜를 지어내면 고객 앞에서
         틀립니다(판 X131 에서 그래서 미뤄 둔 자리입니다).
       ★ 「비갱신」('no')은 <b>아는 답</b>이라 역시 안 셉니다 — 갱신이
         없는 것이지 모르는 것이 아닙니다 (8번).
       ★ 셈은 <b>오늘 뒤로 오는 첫 번째</b>입니다. 지난 갱신은 이미 지났고
         사장님이 하실 일이 없습니다. */
    var rv=parseInt((''+(p.rnw||'')).replace(/[^0-9]/g,''),10);
    if(st&&rv>0&&rv<=30){
      var bm=(+st[2]), by=(+st[1]), now=ty*12+tm, k2=by*12+bm;
      while(k2<now)k2+=rv*12;                /* 오늘 뒤로 오는 첫 갱신 */
      if(rnw===null||k2<rnw.key){
        var ry=Math.floor((k2-1)/12), rm=k2-ry*12;
        rnw={key:k2,ym:ry+'-'+((rm<10?'0':'')+rm),nm:nm,every:rv};
      }
    }
    /* ② 보장 만기 — 만기 나이 − 지금 나이 (해까지) */
    var ea=baEndAge(p.term);
    if(ea&&age&&ea>age){
      var y2=ty+(ea-age);
      if(cov===null||y2<cov.y)cov={y:y2,nm:nm,age:ea};
    }
  }
  if(!pay&&!cov&&!rnw)return null;
  return {pay:pay?{ym:pay.ym,nm:pay.nm}:null,
          cov:cov?{y:cov.y,age:cov.age,nm:cov.nm}:null,
          /* 🔁 다음 갱신 — 모르면 <b>아예 안 담습니다</b> (1번 · 판 X423) */
          rnw:rnw?{ym:rnw.ym,nm:rnw.nm,every:rnw.every}:null,
          src:'보장분석에서 셈'};
}

         premB:P.monB,premA:P.monA,leftB:P.leftB,leftA:P.leftA,

         top:baTopCov(D),

         end:baEndOf(),
         cov:(function(){var n=0,k;for(k in C.a)n++;return n;})()}});

function baLoadFromHost(st){
  if(!st)return;
  try{ S=migrate(st); save(); render(); toast('고객 365일에서 불러왔습니다'); }
  catch(e){ toast('불러오지 못했습니다 — '+((e&&e.message)||'')); }
}
window.addEventListener('message',function(e){
  var d=e&&e.data; if(!d||!d.type)return;
  if(d.type==='apexBaHello'){
    HOST.ready=true;HOST.client=d.client||'';HOST.name=d.name||'';
    if(d.state)baLoadFromHost(d.state);
    render();
    return;
  }
  if(d.type==='apexBaLoad'){ baLoadFromHost(d.state); return; }
  if(d.type==='apexBaAsk'){ baSaveToClient(); return; }   /* 바깥 💾 단추가 자료를 달라고 한 것 */
  if(d.type==='apexBaSaved'){ nxSaved(d.name||''); return; }
});

/* ══════════════════════════════════════════════════════════════════
   흐름 한 줄 (nx*) — <b>만들었으면 보여 드리는 데까지</b>

   여태 저장을 누르면 <b>토스트 한 줄</b>이 뜨고 사라졌습니다. 자료는
   담겼는데 <b>다음에 뭘 하는지</b>는 아무도 말해 주지 않았습니다.
   그래서 만들어 놓고 그냥 나가신 자료가 쌓였습니다.

   전·후를 만든 다음은 <b>고객에게 보여 드리는 것</b>입니다. 그 자리는
   이미 있습니다 — 「한 장씩 넘기기 → 발표 시작」. 그런데 「보는 방식」
   줄을 먼저 찾아 토글을 켜야 나옵니다. 두 동작입니다.

   이제 저장한 그 자리에서 <b>한 번</b>에 갑니다.

   ★ <b>없는 자리로 보내지 않습니다</b> (8번). 누르면 이미 있는
     setDeck(true) · deckShow(true) 를 그대로 부릅니다 — 여기서 발표를
     새로 만들지 않습니다 (5번).
   ══════════════════════════════════════════════════════════════════ */
function nxSaved(name){
  nxCss();
  nextSheet('nxSaved',
    '<div class="nx-card" role="status">'+
      '<div class="nx-ok">💾 <b>'+esc(name||'고객')+'</b>님 자료로 저장했습니다 — 고객 365일에 담겼습니다</div>'+
      '<div class="nx-next">다음 — <b>고객에게 보여 드리기</b></div>'+
      '<div class="nx-sub">한 장씩 넘기며 보여 드립니다. 설계사 도구는 치워지고 자료만 남습니다.</div>'+
      '<div class="nx-btns">'+
        '<button class="nx-go" onclick="nxShowDeck()">🔳 지금 보여 드리기</button>'+
        '<button class="nx-stop" onclick="nxClose()">계속 고치기</button>'+
      '</div>'+
    '</div>');
}
function nxClose(){ nextSheetHide('nxSaved'); }
/* 발표로 — <b>이미 있는 자리</b>를 그대로 부른다 (5번) */
function nxShowDeck(){
  nxClose();
  try{ setDeck(true); }catch(e){}
  try{ deckShow(true); }catch(e){}
}
/* 이 화면만 쓰는 <b>말</b>의 옷. 칸과 단추 모양은 apex-next.js 가 입힌다 (5번) */
function nxCss(){
  nextCss();
  if(document.getElementById('nxCssTag'))return;
  var st=document.createElement('style'); st.id='nxCssTag';
  st.textContent=
   '.nx-ok{font-size:var(--t6,13px);font-weight:700;color:#166534;background:#F0FDF4;border:1px solid #BBF7D0;'+
     'border-radius:12px;padding:10px 12px;line-height:1.6}'+
   '.nx-next{margin-top:12px}';
  document.head.appendChild(st);
}

/* 열리자마자 「나 여기 있습니다」 — 바깥이 이 고객 자료를 내려 준다 */
if(INFRAME)baPost({type:'apexBaReady'});


S=load();render();
</script>

<!doctype html>
<html data-theme="light" lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 🌗 <b>「나는 밝은 화면이다」</b> — 이 말이 없으면 폰이 다크 모드일 때
     브라우저가 <b>제멋대로 뒤집어</b> 칠합니다. 2026-09-30 사장님이 폰에서
     「블랙인데」 하신 자리입니다. 색은 한 톨도 안 바뀝니다.
     ★ 2026-10-03 사장님 말씀 <b>「화면은 무조건 흰색 고정으로 가자」</b> —
     이제 <b>면제가 없습니다.</b> 다크 한 벌을 갖춘 문서도 CSS 를 지우지 않고
     <b>가림막</b>(:not([data-theme=light]))으로 껐을 뿐입니다. 재는 자는
     scripts/check-lightmode.js -->
<meta name="color-scheme" content="light"/>
<title>보장 전·후 만들기 — APEX YUN PRO</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 🎨 토스판 한 벌 — 토큰과 .t- 클래스는 app/ui.css <b>한 곳</b>에만 있습니다 (CLAUDE.md 5번) -->
<link rel="stylesheet" href="ui.css">
<style>
/* ══ 발표 무대 테마 「플러스 블루」 ═══════════════════════════════
   사장님이 주신 발표 자료의 결을 그대로 옮겼습니다. 못 박은 것은 넷.

     ■ 위는 <b>파랑 머리띠</b> — 「01. 제목」. 번호는 <b>CSS 가 셉니다</b>.
       손으로 적어 두면 장이 늘 때 빠뜨립니다 (5번).
     ■ 아래는 <b>회백 바탕에 흰 카드</b> — 눈이 한 덩어리씩 따라갑니다.
     ■ 왼쪽 위 <b>「+」 여섯</b> · 오른쪽 위 <b>흰 알약</b> 은 장마다 같은 자리.
       어느 장에서 멈춰도 <b>같은 자료</b>로 보입니다.
     ■ 표지와 마무리는 <b>파랑 전면</b>.

   그림은 남의 자료를 옮기지 않고 <b>직접 SVG</b> 로 그렸습니다 (9번).

   글씨체는 <b>G마켓 산스</b>(지마켓이 무료로 푼 것)를 <b>무대에서만</b>
   씁니다. 못 받아 오면 조용히 Pretendard 로 섭니다(swap) — 글씨체
   하나 때문에 고객 앞 화면이 비면 안 됩니다.                        */
@font-face{font-family:'GmarketSansM';font-style:normal;font-weight:400;font-display:swap;
 src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff')}
@font-face{font-family:'GmarketSansM';font-style:normal;font-weight:700;font-display:swap;
 src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff')}
/* 무대 색은 <b>토스 톤</b>이다 — 본문(--bl)과 같은 파랑을 쓴다.
   두 파랑을 섞으면 같은 화면에서 색이 두 번 튄다. */
:root{ color-scheme:light;  /* 🌗 흰색 고정 (사장님 말씀 2026-10-03) */--dkb:#3182F6;--dkb2:#1B64DA;--dkm:#3182F6;--dkg:#F9FAFB;
 --nv:#191F28;--gy:#636C78;--gy2:#636C78;--ln:#E5E8EB;--bg:#F2F4F6;
 /* ★★ --gy2 는 <b>#8B95A1</b> 이었습니다 — 흰 바탕에서 대비가 <b>3.0</b> 이라
    글자로 쓰면 안 읽힙니다. 이 화면에서만 <b>277곳</b>이 그 색 글자였습니다
    (사장님 말씀 2026-10-21 「가독성이 너무 떨어져서」).
    4.5 를 넘기려면 #6C7684 까지 내려와야 해서 --gy 와 거의 같아졌습니다.
    ⚠ 그래서 이제 <b>옅은 회색으로 층을 나누지 않습니다</b> — 층은 <b>굵기와
      크기</b>로 냅니다. 더 옅게 하면 그만큼 안 읽힙니다.
    ⚠ 테두리·바탕으로 쓰던 다섯 자리는 옛 색(#8B95A1) 그대로 두었습니다 —
      거기는 글자가 아니라 선이라 대비 규칙이 다릅니다.                  */
 /* 글자로 쓰는 파랑 — --bl(#3182F6)은 흰 바탕에서 3.1 입니다. 바탕으로는
    그대로 쓰고, <b>글자</b>일 때만 이 색을 씁니다 (--dkb2 와 같은 값). */
 --blt:#1B64DA;
 /* 옅은 바탕(--bg) 위에 올리는 글자용 — --gy 는 거기서 4.19 입니다 */
 --gyd:#4E5968;
 --bl:#3182F6;--bl2:#E8F3FF;--gd:#B99A3A;--rd:#DC2626;--rd2:#FEF2F2;
 --gr:#0F766E;--gr2:#ECFDF5;--or:#B45309;--or2:#FFFBEB;--pu:#7C3AED;--pu2:#F5F3FF;
  /* ── <b>글자 계단</b> — 본체(app/index.html)와 <b>같은 여섯 칸</b>입니다.
     이름이 갈리면 두 화면의 글자 크기가 따로 놀고, 같은 앱이 아닌 것처럼 보입니다.
     <b>13px 이 바닥</b>입니다 — 폰에서 그 아래는 안경을 벗으면 안 읽힙니다.
     apex-hold.js · apex-next.js 가 여기 값을 그대로 씁니다. ── */
  --t1:24px; --t2:20px; --t3:17px; --t4:15px; --t5:14px; --t6:13px;
}
/* ★★ <b>고객에게 보여주기는 손대지 않습니다</b> (사장님 말씀 2026-10-21
   「고객에게 보여주는 건 지금 좋으니까 냅두고」).
   만들기 쪽 글자를 키우면서 쓴 계단(--t6 …)이 <b>발표 장</b>까지 번져,
   한 장에 안 들어가는 장이 다섯 생겼습니다 — check-bashow 가 잡았습니다.
   그래서 <b>.show 안에서만</b> 계단을 옛 값으로 되돌립니다. 규칙을 두 벌로
   만들지 않고 <b>토큰 한 벌만</b> 바꿔 끼웁니다 (5번).                 */
.show{ --t6:12px; --t5:12.5px; --t4:13px; --t3:16px; --t2:20px; --t1:24px; }
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
 background:var(--bg);color:var(--nv);font-size:var(--t5);line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:1460px;margin:0 auto;padding:16px 14px 90px}
.bar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--ln);margin:-16px -14px 16px;padding:10px 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.bar .lg{font-size:16px;font-weight:800;letter-spacing:-.02em}.bar .lg em{font-style:normal;color:var(--blt)}
.bar .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tab{appearance:none;border:1px solid var(--ln);background:#fff;color:var(--gy);border-radius:999px;padding:7px 15px;font-size:var(--t6);font-weight:700;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.tab.on{background:var(--nv);border-color:var(--nv);color:#fff}
/* ★★ <b>누르는 것은 44px</b> — 이 저장소의 철칙입니다. 재어 보니 이 화면의
   단추 69개 중 <b>67개</b>가 44px 밑이었고, 사장님이 제일 많이 누르시는
   유지·배서·해지가 <b>45×26px</b> 였습니다 (사장님 말씀 2026-10-21).
   ⚠ 글자 크기는 안 키우고 <b>min-height</b> 만 줍니다 — 글자를 키우면 줄이
     접혀 화면이 훨씬 길어집니다.                                       */
.btn{appearance:none;border:1px solid var(--blt);background:var(--blt);color:#fff;border-radius:10px;padding:8px 15px;font-size:var(--t6);font-weight:800;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn.g{background:#fff;color:var(--blt)}.btn.n{background:#fff;border-color:var(--ln);color:var(--gy)}
.btn.d{background:#fff;border-color:#FECACA;color:var(--rd)}
.mini{appearance:none;border:1px solid var(--ln);background:#fff;color:var(--gy);border-radius:8px;padding:5px 12px;font-size:var(--t6);font-weight:700;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.mini.on{background:var(--nv);border-color:var(--nv);color:#fff}.mini.d{border-color:#FECACA;color:var(--rd)}
.mini.go{background:var(--blt);border-color:var(--blt);color:#fff}
/* ★ <b>격자 칸은 기본으로 안 줄어듭니다.</b> grid 자식의 min-width 는 auto(=내용
   크기)라, 안에 넓은 것(표·입력줄)이 하나 있으면 칸이 그만큼 버티고 <b>화면 밖으로</b>
   밀려납니다. 폰에서 옆으로 새던 자리가 여기였습니다 — 잘린 줄은 아무도 안 읽습니다.
   바닥을 0 으로 내려 주면 칸이 줄고, 넓은 것은 제 안에서 굴러갑니다. */
.grid{display:grid;grid-template-columns:1fr 340px;gap:15px;align-items:start}
.grid>*{min-width:0}
.side{position:sticky;top:66px;display:flex;flex-direction:column;gap:11px}
@media(max-width:1180px){.grid{grid-template-columns:1fr}.side{position:static}}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:17px 19px;margin-bottom:13px}
.card>h2{margin:0 0 3px;font-size:16px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .n{width:22px;height:22px;border-radius:7px;background:var(--nv);color:#fff;font-size:var(--t6);font-weight:800;
 display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.card>h2 .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.card>p{margin:0 0 13px;font-size:var(--t6);color:var(--gy);line-height:1.7}.card>p b{color:var(--nv)}
.f{display:grid;gap:9px;min-width:0}.f.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.f.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.f.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.f.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
/* ★ <b>1fr 은 안 줄어든다.</b> 격자 칸의 기본 최소폭은 <b>내용 크기</b>라,
   안에 안 쪼개지는 글자가 하나 있으면 칸이 그만큼 버티고 <b>격자가 화면 밖으로</b>
   나갑니다. 폰에서 옆으로 새던 자리가 여기였습니다. minmax(0,1fr) 로 바닥을 0 으로
   내려 주면 칸이 줄고, 대신 글이 줄바꿈합니다. */
@media(max-width:820px){.f.c3,.f.c4,.f.c5,.f.c6{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.f.c3,.f.c4,.f.c5,.f.c6{grid-template-columns:minmax(0,1fr)}}
.f label{display:block;font-size:var(--t6);font-weight:700;color:var(--gy2);margin-bottom:3px}
.f input,.f select{width:100%;border:1px solid var(--ln);border-radius:9px;padding:8px 10px;font-size:var(--t6);font-weight:700;background:#fff;min-height:44px}/* 38→44px · 판 X241 — 손가락 바닥 (판 X146·X147) */
.f input:focus,.f select:focus{outline:2px solid #BFDBFE;border-color:var(--blt)}
.f .u{position:relative;align-self:start}  /* ★ 늘어나지 않게 — 늘어나면 bottom 에 붙인 단위 글자(「세」)가 칸 밑으로 밀린다. 같은 줄에 키가 큰 칸(.uw)이 생기면서 드러났다 */.f .u input{padding-right:36px;text-align:right}
.f .u i{position:absolute;right:10px;bottom:10px;font-style:normal;font-size:var(--t6);font-weight:700;color:var(--gy2);pointer-events:none}
.uw{min-width:0}
.uw>label{display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap}
.uw>label .wec{margin-left:auto}
.uw .uwr{position:relative}
.uw .uwr input{width:100%;padding-right:32px;text-align:right}
.uw .uwr i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:var(--t6);font-weight:700;color:var(--gy2);pointer-events:none}
.uw .wec{flex:none;font-style:normal;font-size:var(--t6);font-weight:800;color:var(--blt);white-space:nowrap;letter-spacing:-.01em}  /* ★ --bl(#3182F6) 은 흰 바탕에서 대비가 모자라 check-read 가 울었습니다. 새 색을 만들지 않고 앱에 이미 있는 진한 파랑 --blt 를 씁니다 */
/* ── 계약 한 줄 ── 왼쪽 색 띠로 유지·배서·해지를 <b>글자 없이</b> 센다 */
.pol{border:1px solid var(--ln);border-left:4px solid var(--ln);border-radius:13px;
 /* ⚠ 안쪽 여백을 11 → 6px 로 줄였습니다. 누르는 것을 44px 로 키우느라 계약
    한 줄이 18px 씩 길어졌는데, 줄 안에 이미 44px 짜리가 서 있어 <b>여백이
    그만큼 남습니다</b>. check-baedit 의 「8,000px 밑」 선을 올리지 않고
    <b>줄여서</b> 맞췄습니다 (CLAUDE.md 8번 · 「올리지 말고 줄이십시오」). */
 padding:6px 13px;margin-bottom:7px;background:#fff}
.pol.keep{border-left-color:var(--gr)}
.pol.new{border-color:#DDD6FE;border-left-color:var(--pu);background:#FDFCFF}
.pol.off{background:#FAFBFC;opacity:.6;border-left-color:var(--rd)}
.pol.endo{border-color:#FDE68A;border-left-color:var(--or);background:#FFFDF6}
.pol.open{padding:13px 14px}
.pol .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pol.open .ph{margin-bottom:10px}
.pcar{appearance:none;border:0;background:#F2F4F6;color:var(--gyd);border-radius:7px;
 width:24px;height:24px;font-size:var(--t6);font-weight:800;flex:none;padding:0;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
.pcar:hover{background:var(--ln);color:var(--nv)}
/* 접힌 줄에는 <b>돈 둘</b>만 — 다섯을 늘어놓으면 어느 것이 중요한지 안 보인다 */
.paym{display:flex;gap:5px;flex-wrap:wrap}
.paym span{font-size:var(--t6);font-weight:700;color:var(--gyd);background:#F8FAFC;
 border:1px solid var(--ln);border-radius:7px;padding:3px 8px;white-space:nowrap}
.paym span b{color:var(--nv);font-weight:800}
.paym span.w{background:var(--or2);border-color:#FDE68A;color:var(--or)}.paym span.w b{color:#92400E}
.paym span.g{background:var(--gr2);border-color:#A7F3D0;color:var(--gr)}.paym span.g b{color:#065F46}
.paym span.q{color:var(--gy2)}.paym span.q b{color:var(--gy2)}
/* 위 띠 — 자주 쓰는 것만 세우고 나머지는 <b>⋯ 더보기</b> 안에 */
.moreWrap{position:relative}
.moreBox{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:70;min-width:210px;
 background:#fff;border:1px solid var(--ln);border-radius:12px;padding:6px;
 box-shadow:0 12px 30px rgba(0,0,0,.13);flex-direction:column;gap:4px}
.moreBox.on{display:flex}
.moreBox button{width:100%;text-align:left}
/* 옆 칸의 목록은 <b>자르지 않고</b> 이 안에서 굴린다 */
.sum .lis{max-height:340px;overflow-y:auto;overscroll-behavior:contain}
/* ── 자동 보장분석 다섯 칸 ── */
.ftabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin:12px 0 15px}
.ftb{appearance:none;text-align:left;border:1px solid var(--ln);background:#fff;border-radius:12px;
 padding:10px 12px;position:relative;font-family:inherit}
.ftb i{display:block;font-style:normal;font-size:var(--t6);font-weight:800;color:var(--gy2);
 background:#F2F4F6;border-radius:5px;width:18px;height:18px;line-height:18px;text-align:center;margin-bottom:5px}
.ftb b{display:block;font-size:var(--t6);font-weight:800;color:var(--nv)}
.ftb em{display:block;font-style:normal;font-size:var(--t6);font-weight:700;color:var(--gy2);margin-top:2px}
.ftb.on{border-color:var(--nv);background:var(--nv)}
.ftb.on i{background:rgba(255,255,255,.22);color:#fff}
.ftb.on b{color:#fff}.ftb.on em{color:rgba(255,255,255,.72)}
.fitsec{display:none}
.fitsec.on{display:block}
/* ── 롤플레잉 대본 ── */
.brp{margin-top:9px;border-top:1px dashed var(--ln);padding-top:9px}
.brp>summary{font-size:var(--t6);font-weight:800;color:var(--blt);cursor:pointer;list-style:none;
 background:var(--bl2);border-radius:8px;padding:6px 10px;display:inline-block}
.brp>summary::-webkit-details-marker{display:none}
.brp[open]>summary{margin-bottom:9px}
.brc,.brm{display:flex;gap:7px;margin-bottom:6px;align-items:flex-start}
.brc>span,.brm>span{flex:none;font-size:var(--t6);font-weight:800;border-radius:6px;padding:2px 7px;margin-top:2px}
.brc>span{background:#F2F4F6;color:var(--gy)}
.brm>span{background:var(--nv);color:#fff}
.brc>p,.brm>p{margin:0;font-size:var(--t6);line-height:1.75}
.brc>p{color:var(--gy)}
.brm>p{color:var(--nv)}.brm>p b{font-weight:800}
.brf{font-size:var(--t6);color:var(--gy2);margin-top:8px;line-height:1.6}
.gnote{font-size:var(--t6);color:var(--gy);background:var(--bl2);border:1px solid #CFE0FE;
 border-radius:9px;padding:7px 10px;margin:-3px 0 9px;line-height:1.6}
.gnote b{color:var(--nv)}
/* 진단서는 통째로 드리는 종이다 — 인쇄하면 다섯 칸이 전부 나온다 */
@media print{.fitsec{display:block!important}}
/* 상품명도 <b>누르면 펴지는</b> 자리입니다 — 글자만 22px 이라 손이 빗나갑니다.
   글자 크기는 그대로 두고 <b>닿는 넓이</b>만 44px 로 키웁니다.          */
.pol .ph b{font-size:var(--t5);font-weight:800;min-height:44px;display:inline-flex;align-items:center}.pol .ph .sub{font-size:var(--t6);color:var(--gyd);font-weight:700}
.pol .ph .rt{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tg{display:flex;gap:4px}
/* 유지·배서·해지 — 사장님이 제일 많이 누르시는 셋입니다 */
.tg button{appearance:none;border:1px solid var(--ln);background:#fff;color:var(--gy);border-radius:8px;padding:5px 13px;font-size:var(--t6);font-weight:800;
  min-height:44px;min-width:56px;display:inline-flex;align-items:center;justify-content:center}
.tg button.k.on{background:var(--gr);border-color:var(--gr);color:#fff}
.tg button.e.on{background:var(--or);border-color:var(--or);color:#fff}
.tg button.c.on{background:var(--rd);border-color:var(--rd);color:#fff}
.tag{font-size:var(--t6);font-weight:800;border-radius:6px;padding:2px 7px}
.tag.kb{color:#1B64DA;background:var(--bl2)}.tag.hand{color:var(--gyd);background:#F2F4F6}.tag.pp{color:#1B6E45;background:#E6F4EC}   /* 판 X390 — 제안서에서 읽어 넣은 계약 */
.tag.h{color:var(--pu);background:var(--pu2)}
/* 판 X396 — 🥇 제안 순위 · 💡 추가 제안 */
.prk{border:1px solid #E5E8EB;border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff}
.prk h4{margin:0 0 2px;font-size:var(--t4);font-weight:800;color:var(--nv)}
.prk h4 small{display:block;font-weight:600;color:var(--gyd);font-size:var(--t6);margin-top:2px}
.prk .pk-i{display:flex;gap:10px;padding:10px 0;border-top:1px solid #F2F4F6}
.prk .pk-i:first-of-type{border-top:0}
.prk .pk-n{flex:0 0 auto;min-width:56px;height:26px;border-radius:13px;font-weight:800;font-size:var(--t6);display:flex;align-items:center;justify-content:center;color:#fff;background:#4E5968}
.prk .pk-n.r1{background:#DC2626}.prk .pk-n.r2{background:#2563EB}.prk .pk-n.r3{background:#B45309}
.prk .pk-b{flex:1;min-width:0}
.prk .pk-t{font-weight:800;color:var(--nv);font-size:var(--t5)}
.prk .pk-t em{font-style:normal;font-weight:700;color:var(--gyd);font-size:var(--t6);margin-left:6px}
.prk .pk-w{font-size:var(--t6);color:var(--gyd);margin-top:3px;line-height:1.6}
.prk .pk-w b{color:var(--nv)}
.prk ul{margin:4px 0 0;padding-left:18px;font-size:var(--t6);color:var(--gyd);line-height:1.7}
.prk ul b{color:var(--nv)}.prk ul i{font-style:normal;color:var(--gyd)}
.prk .pk-s{font-size:var(--t6);color:var(--gyd);margin:8px 0 0;line-height:1.6}
/* 판 X410 — 💰 보험료 대비(순위는 그대로, 한 줄 덧붙임) */
.prk .pk-e{font-size:var(--t6);color:var(--gyd);margin-top:3px;line-height:1.6}.prk .pk-e b{color:var(--nv)}
.prk .pk-x{font-size:var(--t6);color:#7A4B00;background:#FFF7E6;border-radius:8px;padding:7px 10px;margin:8px 0 0;line-height:1.6}.prk .pk-x b{color:#5C3800}
/* 판 X411 — ✏️ 1차안 고치기(순서 · 이유 · 발표 한 마디) */
.prk .rk-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 2px;padding:8px 10px;background:#F2F6FF;border-radius:8px;font-size:var(--t6);color:var(--gyd);line-height:1.6}
.prk .rk-bar b{color:var(--nv)}.prk .rk-bar .mini{min-height:44px;padding:4px 10px}
.prk .rk-c{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.prk .rk-c .mini{min-height:44px;padding:4px 10px}
.prk textarea.rk-t{width:100%;box-sizing:border-box;margin-top:6px;border:1px solid #CFE0FE;border-radius:8px;padding:7px 9px;font:inherit;font-size:var(--t6);line-height:1.6;resize:vertical;color:var(--nv)}
.prk textarea.rk-t:focus{outline:2px solid var(--blt);outline-offset:0}
.prk .rk-m{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:9px;background:#EEF2FF;color:#3730A3;font-size:var(--t6);font-weight:700;font-style:normal}
.prk .rk-add{margin-top:8px;font-size:var(--t6);color:var(--gyd)}.prk .rk-add .mini{min-height:44px;padding:4px 10px;margin:4px 4px 0 0}
/* 만들기 화면은 담보를 <b>한 줄로 이어</b> 적는다 — 견본(계약 6건) 화면이 9,000px 을 넘지 않게 · 발표 장은 줄마다 */
.prk ul.in{padding-left:0;list-style:none}.prk ul.in li{display:inline}.prk ul.in li+li:before{content:' · ';color:var(--gyd)}
.prk.ed{padding:10px 12px}.prk.ed h4 small{display:none}.prk.ed .pk-i{padding:6px 0}
/* 만들기 화면에서는 <b>한 줄로 접어</b> 둔다(계약 카드처럼) — 순위만 보이고, 펴면 이유 */
.prk.ed>summary{cursor:pointer;list-style:none}.prk.ed>summary::-webkit-details-marker{display:none}
.prk.ed>summary h4{margin:0}.prk.ed>summary h4:before{content:'▸ ';color:var(--gyd)}.prk.ed[open]>summary h4:before{content:'▾ '}
.prk .pk-q{font-weight:700;color:var(--gyd);font-size:var(--t6);margin-left:8px}.prk .pk-q b{color:var(--nv)}
.prk.ed[open]>summary{margin-bottom:4px}
.tag.rk1{color:#fff;background:#DC2626}.tag.rk2{color:#fff;background:#2563EB}.tag.rk3{color:#fff;background:#B45309}.tag.rkn{color:#fff;background:#4E5968}
/* ── 담보 입력판 — 한눈에 ── */
.gsel{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.gsel button{appearance:none;border:1px solid var(--ln);background:#fff;color:var(--gy);border-radius:999px;padding:5px 12px;font-size:var(--t6);font-weight:700}
.gsel button.on{background:var(--nv);border-color:var(--nv);color:#fff}
.gsel button b{color:var(--blt)}.gsel button.on b{color:#8FC0FF}
.pad{border:1px solid var(--ln);border-radius:11px;overflow:hidden}
.pad .ph2{background:#F8FAFC;padding:6px 11px;font-size:var(--t6);font-weight:800;display:flex;align-items:center;gap:6px}
.pad .ph2 .dot{width:8px;height:8px;border-radius:3px}
.pad .ph2 em{font-style:normal;margin-left:auto;font-size:var(--t6);color:var(--gy2);font-weight:700}
.pad .gr2{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:0}
.pr{display:flex;align-items:center;gap:6px;padding:5px 9px;border-top:1px solid #F5F6F8;border-right:1px solid #F5F6F8}
.pr.has{background:#F8FBFF}
.pr .nm{flex:1;min-width:0;font-size:var(--t6);font-weight:700;line-height:1.3}
.pr .nm em{display:block;font-style:normal;font-size:var(--t6);font-weight:700;color:var(--gy2)}
.pr .nm i{font-style:normal;font-size:var(--t6);font-weight:800;color:var(--or);background:var(--or2);border-radius:4px;padding:0 4px;margin-left:3px}
.pr input{width:70px;border:1px solid var(--ln);border-radius:6px;padding:4px 6px;font-size:var(--t6);font-weight:800;text-align:right;min-height:28px}
.pr .un{font-size:var(--t6);font-weight:700;color:var(--gy2);width:24px;flex:0 0 auto}
.kb{border:1px solid #C7D2FE;background:#F7FAFF;border-radius:14px;padding:13px 15px;margin-bottom:11px}
.kb .kh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.kb .kh b{font-size:var(--t5);font-weight:800}.kb .kh .btn{margin-left:auto}
.kb .kd{font-size:var(--t6);color:var(--gyd);line-height:1.7}.kb .kd b{color:var(--nv)}
.drop{border:2px dashed #C7D2FE;border-radius:12px;background:#fff;padding:18px 14px;text-align:center;font-size:var(--t6);color:var(--gy);font-weight:700;margin-top:8px}
.drop.on{border-color:var(--blt);background:var(--bl2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips span{font-size:var(--t6);font-weight:700;color:var(--gy);background:#fff;border:1px solid var(--ln);border-radius:8px;padding:5px 10px}
.chips span b{color:var(--nv);font-weight:800}
.chips span.w{background:var(--or2);border-color:#FDE68A;color:var(--or)}.chips span.w b{color:#92400E}
.chips span.g{background:var(--gr2);border-color:#A7F3D0;color:var(--gr)}.chips span.g b{color:#065F46}
.note{font-size:var(--t6);line-height:1.7;border-radius:10px;padding:10px 12px;margin-top:9px}.note b{font-weight:800}
.note.i{background:#F8FAFC;color:var(--gyd)}.note.i b{color:var(--nv)}
.note.w{background:var(--or2);color:var(--or);border:1px solid #FDE68A}.note.w b{color:#92400E}
.note.g{background:var(--gr2);color:var(--gr);border:1px solid #A7F3D0}.note.g b{color:#065F46}
/* ── 표준 담보표 ── */
/* 담보표를 담는 자리. 줄이 많으면 <b>두 칸으로 나란히</b> — 아래로 이으면
   한 장을 넘고, 잘라 내면 없는 담보가 된다. */
.stwrap{display:block}
.stwrap.two{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:start}
.stwrap.two .st{margin-bottom:0}
.st{border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin-bottom:10px}
.st .sh{background:#F8FAFC;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:var(--t6);font-weight:800;min-height:44px}
.st .sh .dot{width:9px;height:9px;border-radius:3px}
.st .sh .big{font-size:var(--t6);font-weight:800;color:var(--gy2);background:#fff;border:1px solid var(--ln);border-radius:5px;padding:1px 6px}
.st .sh .cnt{margin-left:auto;font-size:var(--t6);font-weight:700;color:var(--gyd)}
.st table{width:100%;border-collapse:collapse}
.st th{font-size:var(--t6);font-weight:800;color:var(--gy2);padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
.st th:first-child{text-align:left}
.st td{padding:5px 8px;border-bottom:1px solid #F5F6F8;text-align:right;white-space:nowrap;font-size:var(--t6)}
.st td:first-child{text-align:left;font-weight:700;white-space:normal}
.st td .un{font-size:var(--t6);font-weight:700;color:var(--gy2)}
.st td .cov{font-size:var(--t6);font-weight:800;color:var(--or);background:var(--or2);border-radius:4px;padding:0 4px;margin-left:3px}
.st td.std{color:var(--gy2);font-weight:700}
.st input{width:92px;border:1px solid var(--ln);border-radius:7px;padding:5px 7px;font-size:var(--t6);font-weight:800;text-align:right;min-height:44px;background:#fff}
.st input.auto{color:var(--gy);background:#FBFCFD}
.st input.hand{border-color:#DDD6FE;background:var(--pu2);color:var(--pu)}
.st td.df{font-weight:800}.st td.df.up{color:var(--blt)}.st td.df.dn{color:var(--rd)}.st td.df.same{color:var(--gy2)}
.st .rst{appearance:none;border:0;background:transparent;color:var(--pu);font-size:var(--t6);font-weight:800;cursor:pointer;padding:0 0 0 3px}
.st td.rd{font-size:var(--t6);font-weight:800}
.st td.rd.up{color:var(--gr)}.st td.rd.no{color:var(--rd)}.st td.rd.mid{color:var(--or)}
/* ── 붙박이 ── */
.sum{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px 15px}
.sum .hh{font-size:var(--t6);font-weight:800;margin-bottom:9px;display:flex;align-items:center}
.sum .hh em{font-style:normal;margin-left:auto;font-size:var(--t6);font-weight:800;color:var(--gy2)}
.sum.loss{border-left:4px solid var(--rd)}.sum.gain{border-left:4px solid var(--gr)}
.prem{display:flex;align-items:center;gap:9px}.prem>div{flex:1}
.prem .ar{flex:0 0 auto;color:var(--gy2);font-weight:800;font-size:16px}
.prem span{display:block;font-size:var(--t6);font-weight:700;color:var(--gy2)}
.prem b{display:block;font-size:var(--t2);font-weight:800;letter-spacing:-.03em;margin-top:2px}
.prem b.up{color:var(--rd)}.prem b.dn{color:var(--gr)}
.li{border-top:1px solid #F1F3F5;padding:8px 0}.li:first-of-type{border-top:0;padding-top:0}
.li .n{font-size:var(--t6);font-weight:800}
.li .n i{font-style:normal;font-size:var(--t6);font-weight:800;color:#fff;background:var(--gy);border-radius:5px;padding:1px 6px;margin-left:4px}
.li .d{font-size:var(--t6);color:var(--gy);margin-top:2px}.li .d b{color:var(--nv)}
.empty{font-size:var(--t6);color:var(--gy);line-height:1.6}
/* ── 인체 해부도 ── */
.anat{position:relative;display:grid;grid-template-columns:1fr 300px 1fr;gap:12px;align-items:center}
@media(max-width:940px){.anat{grid-template-columns:1fr}}
.anat .fig{display:flex;justify-content:center;position:relative}
.anat .fig svg{width:100%;max-width:290px;height:auto}
.pin{border:1px solid var(--ln);border-radius:12px;background:#fff;padding:10px 12px;margin-bottom:9px;position:relative}
.pin.on{border-color:var(--blt);box-shadow:0 2px 12px rgba(49,130,246,.13)}
.pin .pt{display:flex;align-items:center;gap:7px;font-size:var(--t6);font-weight:800;margin-bottom:5px}
.pin .pt .dot{width:9px;height:9px;border-radius:50%}
.pin .pt .cv{margin-left:auto;font-size:var(--t6);font-weight:800;color:var(--or);background:var(--or2);border-radius:5px;padding:1px 6px}
.pin .pv{display:flex;align-items:center;gap:8px}
.pin .pv .c{flex:1}
.pin .pv .c span{display:block;font-size:var(--t6);font-weight:700;color:var(--gy2)}
.pin .pv .c b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}
.pin .pv .ar{color:var(--gy2);font-weight:800}
.pin .pv .c.a b{color:var(--blt)}.pin .pv .c.a b.dn{color:var(--rd)}
.pin .bars{margin-top:7px}
.pin .bars .b1{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.pin .bars .b1 span{width:22px;font-size:var(--t6);font-weight:800;color:var(--gy2)}
.pin .bars .b1 .t{flex:1;height:9px;background:#F1F3F5;border-radius:4px;overflow:hidden}
.pin .bars .b1 .t i{display:block;height:100%;border-radius:4px}
.pin .det{margin-top:8px;border-top:1px solid #F1F3F5;padding-top:7px;font-size:var(--t6);color:var(--gy);line-height:1.6}
.pin .det .dr{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.pin .det .dr b{color:var(--nv);font-weight:800}
.pin .det .dr .z{color:var(--gy2)}
/* ── 경제활동기 ── */
.life{border:1px solid var(--ln);border-radius:14px;padding:15px 16px;background:#fff}
.tl{position:relative;height:96px;margin:16px 0 6px}
.tl .band{position:absolute;height:26px;border-radius:6px;top:16px;display:flex;align-items:center;justify-content:center;
 font-size:var(--t6);font-weight:800;color:#fff;overflow:hidden;white-space:nowrap}
.tl .ax{position:absolute;bottom:-2px;left:0;right:0;height:16px}
.tl .ax i{position:absolute;font-style:normal;font-size:var(--t6);font-weight:700;color:var(--gy2);transform:translateX(-50%)}
.tl .mk{position:absolute;top:8px;height:36px;width:2px;background:var(--nv);opacity:.55}
.tl .mk em{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-style:normal;font-size:var(--t6);font-weight:800;color:var(--nv);white-space:nowrap}
.kid{position:absolute;height:13px;border-radius:4px;background:#FDE68A;border:1px solid #F5C542}
.kid em{position:absolute;left:5px;top:-2px;font-style:normal;font-size:var(--t6);font-weight:800;color:#92400E;white-space:nowrap}
.mon{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:10px;margin-top:13px}
.mo{border:1px solid var(--ln);border-radius:12px;padding:12px 13px}
.mo .mh{font-size:var(--t6);font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.mo .mb{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.mo .mb span{width:26px;font-size:var(--t6);font-weight:800;color:var(--gy2)}
.mo .mb .t{flex:1;height:13px;background:#F1F3F5;border-radius:4px;overflow:hidden;position:relative}
.mo .mb .t i{display:block;height:100%;border-radius:4px}
.mo .mb .t u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--rd);text-decoration:none}
.mo .mb b{width:74px;text-align:right;font-size:var(--t6);font-weight:800}
.mo .mn{font-size:var(--t6);color:var(--gy);line-height:1.6;margin-top:6px;border-top:1px solid #F1F3F5;padding-top:6px}
.mo .mn b{color:var(--nv)}.mo .mn .r{color:var(--rd)}.mo .mn .o{color:var(--gr)}
.ag .ab.ask{background:#F8FAFC;border-radius:9px;padding:8px 10px}
.ag .ab.ask li{color:var(--nv);font-weight:700}
.ag .ab.push{background:var(--bl2);border-radius:9px;padding:8px 10px}
.ag .ab.push .al{color:#1D4ED8}
.ag .ab.push li{color:#1D4ED8;font-weight:700;margin-bottom:4px}
.ag .ab.push li b{color:#1E3A8A;font-weight:800}
/* ── ⚙ 셈하는 기준 ── */
.asg{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:9px}
.as1{border:1px solid var(--ln);border-radius:12px;padding:11px 13px;background:#fff;display:flex;flex-direction:column}
.as1.ch{border-color:#DDD6FE;background:var(--pu2)}
.as1 label{display:block;font-size:var(--t6);font-weight:800;color:var(--nv);margin-bottom:6px}
.asin{position:relative;margin-bottom:6px}
.asin input{width:100%;border:1px solid var(--ln);border-radius:9px;padding:8px 40px 8px 10px;
  font-size:var(--t5);font-weight:800;text-align:right;background:#fff;min-height:38px}
.as1.ch .asin input{border-color:#C4B5FD;color:var(--pu)}
.asin input:focus{outline:2px solid #BFDBFE;border-color:var(--blt)}
.asin i{position:absolute;right:11px;top:11px;font-style:normal;font-size:var(--t6);font-weight:700;color:var(--gy2)}
.asd{font-size:var(--t6);color:var(--gy);line-height:1.7}.asd b{color:var(--nv)}
.asr{margin-top:auto;padding-top:6px;font-size:var(--t6);font-weight:700;color:var(--pu)}
.asr button{appearance:none;border:1px solid #DDD6FE;background:#fff;color:var(--pu);border-radius:6px;
  padding:2px 8px;font-size:var(--t6);font-weight:800;margin-left:5px;cursor:pointer}
/* ── 📋 자동 보장분석 ── */
.fgrade{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#F8FAFC;border-radius:14px;padding:14px 17px;margin-bottom:6px}
.fg1{border:3px solid;border-radius:13px;background:#fff;padding:10px 16px;text-align:center;min-width:112px}
.fg1 span{display:block;font-size:var(--t6);font-weight:700;color:var(--gy2)}
.fg1 b{display:block;font-size:var(--t1);font-weight:800;line-height:1.2}
.fg1 em{display:block;font-style:normal;font-size:var(--t6);font-weight:700;color:var(--gy)}
.fgar{font-size:var(--t2);color:var(--gy2);font-weight:800}
.fgt{flex:1;min-width:220px;font-size:var(--t6);color:var(--gy);line-height:1.7}
.fgt b{color:var(--nv)}
.fitrows{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px}
.fr2{border:1px solid var(--ln);border-radius:13px;padding:13px 15px;background:#fff;display:flex;flex-direction:column}
.fh2{display:flex;align-items:center;gap:6px;font-size:var(--t5);margin-bottom:9px}
.fh2 b{font-weight:800}
.fgb{margin-left:auto;font-size:var(--t6);font-weight:800;color:#fff;border-radius:7px;padding:2px 10px;line-height:1.5}

/* ── 목차 ── */
.toc{display:flex;gap:5px;flex-wrap:wrap;max-width:980px;margin:0 auto 14px;padding:11px 13px;
  background:#fff;border:1px solid var(--ln);border-radius:13px}
.toc a{display:flex;align-items:center;gap:5px;text-decoration:none;font-size:12px;font-weight:700;
  color:var(--gyd);background:#F8FAFC;border:1px solid var(--ln);border-radius:999px;padding:5px 11px}
.toc a:hover{background:var(--bl2);border-color:#BFDBFE;color:var(--blt)}
.toc a b{font-size:10.5px;font-weight:800;color:#fff;background:var(--nv);border-radius:50%;width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
/* ── 담보판 접기 ── */
.padshut{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;margin-top:9px;padding-top:9px;
  border-top:1px solid #F1F3F5;font-size:var(--t6);color:var(--gy)}
.padshut b{font-weight:800;color:var(--nv)}
.padshut em{font-style:normal;font-size:var(--t6);color:var(--gy2);font-weight:700}
.padshut span{margin-left:auto;font-size:var(--t6);font-weight:800;color:var(--blt);background:var(--bl2);
  border-radius:8px;padding:4px 11px}
.padsum{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.padsum span{font-size:var(--t6);font-weight:700;color:var(--gyd);background:#F8FAFC;border:1px solid var(--ln);
  border-radius:6px;padding:3px 8px}
.padsum span b{color:var(--nv);font-weight:800}
.padsum span.more{color:var(--gy2);background:transparent;border:0}
.padclose{text-align:center;font-size:var(--t6);font-weight:800;color:var(--gyd);background:#F8FAFC;
  border-radius:8px;padding:6px;margin-top:7px;cursor:pointer}
.padclose:hover{background:#EEF1F5}
/* ── ✍️ 한 번에 적기 (판 X366) ── */
.qk{background:#F5F9FF;border:1px solid #CFE0FE;border-radius:10px;padding:9px 11px;margin-bottom:10px}
.qkh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px;font-size:var(--t6)}
.qkh b{color:var(--blt);font-weight:800}
.qkh span{color:var(--gyd)}
.qk textarea{width:100%;box-sizing:border-box;border:1px solid #CFE0FE;border-radius:8px;padding:8px 10px;font:inherit;
  font-size:var(--t5,15px);resize:vertical;min-height:46px;background:#fff;color:var(--nv)}
.qk textarea:focus{outline:2px solid var(--blt);outline-offset:0}
.qkv:empty{display:none}
.qkv{margin-top:7px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.qkm,.qka,.qkr.no{grid-column:1/-1}
@media (max-width:760px){.qkv{grid-template-columns:1fr}}
.qkm{font-size:var(--t6);color:var(--gyd);background:#fff;border:1px dashed #CFE0FE;border-radius:7px;padding:5px 9px}
.qkm i{font-style:normal;color:var(--gy2)}
.qkr{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:var(--t6);background:#fff;border:1px solid var(--ln);
  border-left:3px solid var(--gr);border-radius:7px;padding:5px 9px}
.qkr .a{color:var(--gyd)}
.qkr .ar{color:var(--gy2)}
.qkr b{color:var(--nv);font-weight:800}
.qkr em{font-style:normal;font-weight:800;color:var(--blt)}
.qkr i{font-style:normal;color:var(--gy2)}
.qkr .mini{margin-left:auto}
.qkr.dup{border-left-color:#CBD5E1;opacity:.75}
.qkr.nov{border-left-color:var(--or)}
.qkr.nov em{color:var(--or)}
.qkr.ext{border-left-color:#7C3AED}
.qkr.no{border-left-color:var(--rd,#DC2626)}
.qkr.no select{flex:1;min-width:220px;min-height:44px}
.qka{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:3px}
.qka span{font-size:var(--t6);color:var(--gy2)}
.qka .btn[disabled]{opacity:.45;cursor:default}
tr.stmore td{text-align:center;background:#FAFBFC;padding:6px}
/* ── 연령대별 기준 ── */
.ordbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:8px;margin-bottom:10px}
.ord{display:flex;gap:9px;border:1px solid var(--ln);border-radius:11px;padding:10px 12px;background:#fff}
.ord .on2{width:24px;height:24px;flex:0 0 auto;border-radius:50%;background:var(--nv);color:#fff;
  font-size:var(--t6);font-weight:800;display:flex;align-items:center;justify-content:center}
.ord .ot b{display:block;font-size:var(--t6);font-weight:800}
.ord .ot em{display:block;font-style:normal;font-size:var(--t6);color:var(--gy);line-height:1.6;margin-top:2px}
.ord .ot em b{display:inline;color:var(--nv)}
.ages{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:11px;margin-top:12px}
.ag{border:1px solid var(--ln);border-radius:13px;padding:14px 15px;background:#fff}
.ag.on{box-shadow:0 3px 16px rgba(49,130,246,.16);border-color:#BFDBFE}
.ag .ah{display:flex;align-items:center;gap:6px;font-size:var(--t5);margin-bottom:7px}
.ag .ah b{font-weight:800}
.ag .ah em{margin-left:auto;font-style:normal;font-size:var(--t6);font-weight:800;color:#fff;background:var(--blt);
  border-radius:5px;padding:2px 7px}
.ag .a1{font-size:var(--t6);color:var(--gy);line-height:1.7;padding-bottom:9px;border-bottom:1px solid #F1F3F5}
.ag .a1 b{color:var(--nv)}
.ag .ab{margin-top:9px}
.ag .al{font-size:var(--t6);font-weight:800;color:var(--gy2);letter-spacing:.02em;margin-bottom:3px}
.ag .ab ol,.ag .ab ul{margin:0;padding-left:16px}
.ag .ab li{font-size:var(--t6);color:var(--nv);line-height:1.65;font-weight:700}
.ag .ab.miss li{color:var(--rd);font-weight:700}
.ag .ab.miss li b{color:#991B1B}
.ag .av{font-size:var(--t6);color:var(--gy);line-height:1.65}
.ag .av b{color:var(--nv)}
.ag .atalk{margin-top:11px;border-top:1px solid #F1F3F5;padding-top:9px;font-size:var(--t6);
  color:var(--blt);font-weight:700;line-height:1.7}
.ag .atalk b{color:#1D4ED8;font-weight:800}
/* ── 납입 ── */
.payl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid #F5F6F8}
.payl.none{font-size:var(--t6);color:var(--gy2);border-top:1px solid #F5F6F8;display:block}
.payl span{font-size:var(--t6);font-weight:700;color:var(--gyd);background:#F8FAFC;border:1px solid var(--ln);border-radius:7px;padding:4px 9px}
.payl span b{color:var(--nv);font-weight:800}
.payl span.w{background:var(--or2);border-color:#FDE68A;color:var(--or)}.payl span.w b{color:#92400E}
.payl span.g{background:var(--gr2);border-color:#A7F3D0;color:var(--gr)}.payl span.g b{color:#065F46}
.payl span.t{background:#0F172A;border-color:#0F172A;color:#fff}.payl span.t b{color:#93C5FD}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:11px}
.pbox{border:1px solid var(--ln);border-radius:13px;padding:13px 15px;background:#fff}
.pbox .pt2{font-size:var(--t6);font-weight:800;margin-bottom:9px}
.pbox .pt2 em{display:block;font-style:normal;font-size:var(--t6);font-weight:700;color:var(--gy2);margin-top:2px}
.pbox .pt2 em b{color:var(--gy)}
.pbox .pv2{display:flex;align-items:center;gap:8px}
.pbox .pv2 .c{flex:1;min-width:0}
.pbox .pv2 .c span{display:block;font-size:var(--t6);font-weight:700;color:var(--gy2)}
.pbox .pv2 .c b{display:block;font-size:16px;font-weight:800;letter-spacing:-.03em;margin-top:1px;white-space:nowrap}
.pbox .pv2 .c b.up{color:var(--rd)}.pbox .pv2 .c b.dn{color:var(--gr)}
.pbox .pv2 .ar{color:var(--gy2);font-weight:800;flex:0 0 auto}
/* 못 센 값은 <b>점선 + 노랑</b>으로 — 「0 원」처럼 안 보이게 (1번) */
.pbox.unk{border-style:dashed;border-color:#FDE68A;background:var(--or2)}
.pd.unk{color:var(--or);font-weight:700;font-size:var(--t6);line-height:1.55}
.skip{color:var(--or);font-weight:800}
.pd{margin-top:8px;font-size:var(--t6);font-weight:800;color:var(--gy2);border-top:1px solid #F5F6F8;padding-top:7px}
.pbox .pd.up{color:var(--rd)}.pbox .pd.dn{color:var(--gr)}
/* ── 보장분석 기준 ── */
.study{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:11px}
.sd3{border:1px solid var(--ln);border-radius:13px;padding:14px 16px;background:#fff}
.sd3 .sh3{font-size:var(--t5);font-weight:800;margin-bottom:9px}
.sd3 ul{margin:0;padding-left:17px}
.sd3 li{font-size:var(--t6);color:var(--gy);line-height:1.75;margin-bottom:5px}
.sd3 li b{color:var(--nv);font-weight:800}
.sd3 .sk{margin-top:9px;border-top:1px solid #F1F3F5;padding-top:8px;font-size:var(--t6);color:var(--blt);line-height:1.7;font-weight:700}
.sd3 .sk b{color:#1D4ED8;font-weight:800}
.venn{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:4px}
.vn .vt{font-size:var(--t6);font-weight:800;margin-bottom:7px}
.vn .vrow{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.vn .vr{height:26px;border-radius:5px;display:flex;align-items:center;padding-left:10px;flex:0 0 auto}
.vn .vrow em{font-style:normal;font-size:var(--t6);font-weight:700;color:var(--gy);white-space:nowrap}
.vn .vrow em b{color:var(--nv);font-weight:800}
.vn .vr span{font-size:var(--t6);font-weight:800;color:#fff;white-space:nowrap}
/* ── 시뮬레이션 ── */
.simtab{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.simtab button{appearance:none;border:1px solid var(--ln);background:#fff;color:var(--gy);border-radius:999px;padding:6px 14px;font-size:var(--t6);font-weight:800}
.simtab button.on{background:var(--nv);border-color:var(--nv);color:#fff}
.sim{border:1px solid var(--ln);border-radius:14px;overflow:hidden;margin-bottom:12px}
.simhd{background:var(--dkb);color:#fff;padding:11px 15px;font-size:var(--t5);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.simhd b{font-weight:800}.simhd span{margin-left:auto;font-size:var(--t6);opacity:.85;font-weight:700}
.simhd span b{color:#BFDCFF}
.simst{display:flex;gap:13px;padding:13px 15px;border-bottom:1px solid #F1F3F5}
.simst:last-of-type{border-bottom:0}
.simst .sl{width:132px;flex:0 0 auto;text-align:center}
@media(max-width:720px){.simst{flex-direction:column}.simst .sl{width:auto;display:flex;align-items:center;gap:9px;text-align:left}}
.simst .si{width:46px;height:46px;border-radius:50%;background:var(--bl2);border:2px solid var(--bl);
  display:flex;align-items:center;justify-content:center;font-size:var(--t1);margin:0 auto 6px}
@media(max-width:720px){.simst .si{margin:0}}
.simst .sn b{display:block;font-size:var(--t6);font-weight:800}
.simst .sn em{display:block;font-style:normal;font-size:var(--t6);color:var(--gy2);font-weight:700;margin-top:2px}
.simst .sm{flex:1;min-width:0}
.simst .sb{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.simst .sb span{width:56px;flex:0 0 auto;font-size:var(--t6);font-weight:800;color:var(--gy2)}
.simst .sb .t{flex:1;height:14px;background:#F1F3F5;border-radius:4px;overflow:hidden}
.simst .sb .t i{display:block;height:100%;border-radius:4px}
.simst .sb b{width:96px;flex:0 0 auto;text-align:right;font-size:var(--t6);font-weight:800}
.simst .sg{font-size:var(--t6);color:var(--gy);margin-top:6px;line-height:1.6}
.simst .sg b{font-weight:800}.simst .sg .r{color:var(--rd)}.simst .sg .o{color:var(--gr)}
.simst .sp2{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.simst .sp2 span{font-size:10.5px;font-weight:800;color:var(--blt);background:var(--bl2);border-radius:6px;padding:2px 8px}
.simst .sp2 span.no{color:var(--rd);background:var(--rd2)}
.simst .sp2 span.up{color:var(--gr);background:var(--gr2)}
.simst .sp2 span.ac{color:var(--gy);background:#F2F4F6}
.simst .sd2{font-size:var(--t6);color:var(--gy);line-height:1.7;margin-top:7px;border-top:1px solid #F5F6F8;padding-top:6px}
.simst .sd2 b{color:var(--nv)}
.simft{background:#F8FAFC;padding:10px 15px;font-size:var(--t6);color:var(--gyd);line-height:1.7}
.simft b{color:var(--nv)}
/* ── 더 넣으실 것 ── */
.needs{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:9px}
.nd{border:1px solid var(--ln);border-radius:12px;padding:11px 13px;background:#fff}
.nd.none{border-color:#FECACA;background:#FFFBFB}
.nd .nh{display:flex;align-items:center;gap:6px;font-size:var(--t6);font-weight:800;flex-wrap:wrap}
.nd .nh .dot{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.nd .nh em{font-style:normal;font-size:var(--t6);font-weight:800;color:var(--or);background:var(--or2);border-radius:4px;padding:0 4px}
.nd .nh b{margin-left:auto;font-size:var(--t6);font-weight:800}
.nd .nh b.r{color:var(--rd)}.nd .nh b.o{color:var(--or)}
.nd .nb{display:flex;align-items:center;gap:7px;font-size:var(--t6);font-weight:700;color:var(--gy);margin-top:5px}
.nd .nb .ar{color:var(--gy2);font-weight:800}
.nd .nb .tg2{color:var(--nv);font-weight:800}
.nd .ndz{font-size:var(--t6);color:var(--gy);line-height:1.65;margin-top:6px;border-top:1px solid #F5F6F8;padding-top:6px}
.nd .ndz b{color:var(--nv)}
.dsc{font-size:var(--t6);font-weight:700;color:var(--gy2);line-height:1.55;margin-top:2px;max-width:340px;white-space:normal}
.dsc b{color:var(--gy)}
/* ── 사건 · 여정 ── */
.evs{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:11px;align-items:start}
.ev{border:1px solid var(--ln);border-radius:13px;padding:13px 14px;background:#fff}
.ev .eh{display:flex;align-items:center;gap:7px;font-size:var(--t5);font-weight:800;margin-bottom:3px}
.ev .es{font-size:var(--t6);color:var(--gy);margin-bottom:9px}
.ev .bar{height:9px;border-radius:5px;background:#F1F3F5;overflow:hidden;margin:4px 0 3px}
.ev .bar i{display:block;height:100%;border-radius:5px}
.ev .lb{display:flex;justify-content:space-between;font-size:var(--t6);font-weight:700;color:var(--gy2)}.ev .lb b{color:var(--nv)}
.ev .gap{font-size:var(--t6);color:var(--gy);line-height:1.6;margin-top:8px;border-top:1px solid #F1F3F5;padding-top:8px}
.ev .gap b{color:var(--nv)}.ev .gap .r{color:var(--rd)}.ev .gap .o{color:var(--gr)}
.tj{display:flex;gap:9px;flex-wrap:wrap}
.tjs{flex:1 1 168px;min-width:158px;border:1px solid #EEF0F3;border-radius:11px;padding:12px 11px;text-align:center;background:#fff}
.tjs .ic{width:44px;height:44px;border-radius:50%;background:var(--bl2);border:2px solid var(--bl);display:flex;align-items:center;justify-content:center;font-size:var(--t2);margin:0 auto 7px}
.tjs .k{font-size:var(--t6);font-weight:800}.tjs .du{font-size:var(--t6);color:var(--gy2);font-weight:700}
.tjs .py{margin-top:7px;display:flex;flex-direction:column;gap:3px;align-items:center}
.tjs .py span{font-size:var(--t6);font-weight:800;color:var(--blt);background:var(--bl2);border-radius:6px;padding:2px 8px}
.tjs .py span.no{color:var(--rd);background:var(--rd2)}
.tjs .ds{font-size:var(--t6);color:var(--gy);line-height:1.55;margin-top:7px;text-align:left}.tjs .ds b{color:var(--nv)}
/* ── 고객 화면 ── */
.show{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:30px 32px;max-width:980px;margin:0 auto}
.show .hd{border-bottom:2px solid var(--nv);padding-bottom:13px;margin-bottom:22px}
.show .hd .ey{font-size:10.5px;font-weight:800;color:var(--gd);letter-spacing:.08em}
.show .hd h1{margin:4px 0 3px;font-size:24px;font-weight:800;letter-spacing:-.03em}
.show .hd p{margin:0;font-size:12px;color:var(--gy)}
.show section{margin-bottom:26px}
.show section>h3{margin:0 0 4px;font-size:16px;font-weight:800;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.show section>h3 small{font-size:12px;font-weight:700;color:var(--gy2)}
.show section>.sd{font-size:12px;color:var(--gy);margin:0 0 12px;line-height:1.7}.show section>.sd b{color:var(--nv)}
.foot{font-size:var(--t6);color:var(--gy2);line-height:1.75;border-top:1px solid var(--ln);padding-top:12px;margin-top:24px}.foot b{color:var(--gy)}
.big2{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#F8FAFC;border-radius:14px;padding:15px 17px}
.big2 .c{flex:1;min-width:124px}
.big2 .c span{display:block;font-size:var(--t6);font-weight:700;color:var(--gy2)}
.big2 .c b{display:block;font-size:var(--t1);font-weight:800;letter-spacing:-.03em;margin-top:2px}
.big2 .c b.up{color:var(--rd)}.big2 .c b.dn{color:var(--gr)}
.big2 .ar{font-size:var(--t2);color:var(--gy2);font-weight:800}
.talk{background:#F8FAFC;border-left:4px solid var(--nv);border-radius:0 12px 12px 0;padding:14px 17px}
.talk p{margin:0 0 9px;font-size:var(--t5);line-height:1.85}.talk p:last-child{margin:0}
.talk b{font-weight:800}.talk .r{color:var(--rd)}.talk .o{color:var(--gr)}
.show.senior{font-size:16px}.show.senior section>h3{font-size:20px}
.show.senior .talk p{font-size:16px;line-height:1.95}.show.senior .big2 .c b{font-size:24px}
.dl{max-height:420px;overflow:auto;border:1px solid var(--ln);border-radius:11px}
.dl table{width:100%;border-collapse:collapse}
.dl th{position:sticky;top:0;background:#F8FAFC;font-size:var(--t6);font-weight:800;color:var(--gyd);padding:7px 9px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
.dl td{font-size:var(--t6);padding:6px 9px;border-bottom:1px solid #F5F6F8;vertical-align:top}
.dl td.r{text-align:right;white-space:nowrap;font-weight:800}.dl td.no{color:var(--rd);font-weight:800}
/* ── 한 장씩 넘겨 보기 ── */
.showctl{max-width:980px;margin:0 auto 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.showctl .cl{font-size:12px;font-weight:800;color:var(--gy)}
.showctl .ch{font-size:12px;color:var(--gy2)}
/* ══ 한 장씩 넘겨 보기 — <b>16:9 발표 한 장</b> ═══════════════════════
   고객 앞에 세우는 화면은 세로로 긴 문서가 아니라 <b>가로 한 장</b>이다.
   PPT 와 같은 <b>1280 × 720</b>(16:9) 무대를 만들고, 화면에 맞게 통째로
   줄여 앉힌다. 글자 크기를 <b>px 로 못 박을 수 있어</b> 어느 화면에서나
   같은 모양으로 선다 — 화면마다 글자가 커졌다 작아졌다 하지 않는다.

   ■ 무대는 <b>안 늘어난다.</b> 한 장에 안 들어가면 그건 한 장이 아니라
     두 장이라는 뜻이다. (안 들어가는 자세한 것은 .deep 으로 접는다)
   ■ <b>인쇄하면 무대를 걷고</b> 세로 문서로 돌아간다 — 접은 것도 전부.  */
.deckwrap{display:block}
/* flex:none 이 없으면 무대가 <b>눌린다</b> — .deck-fit 이 flex 라
   1280 이 화면 폭에 맞춰 1220 으로 줄어들고, 그러면 16:9 가 아니다. */
.show.deck{width:1280px;height:720px;flex:none;max-width:none;margin:0;padding:0;
 border:0;border-radius:20px;overflow:hidden;position:relative;
 transform-origin:top left;box-shadow:0 18px 50px rgba(15,22,32,.13);
 font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;
 /* 테마 색을 <b>변수로</b> 갈아 끼운다 — 막대·강조·왼쪽 띠가 한꺼번에 따라온다.
    자리마다 색을 다시 적으면 한 군데를 빠뜨린다 (5번).
    판 X315 — 무대 전체를 <b>보험 자산 운용보고서</b>(ba-report.html)와 같은 남색 · 금색 ·
    상아색으로 (사장님 말씀 「머지해 바꿔줘」 — 나머지 파란 장도). 만들기 화면은 토스 파랑 그대로. */
 --dkb:#0F1A2C;--dkb2:#2A5BD7;--dkm:#B08D57;--dkg:#FBF9F4;--gd:#B08D57;
 --bl:#2A5BD7;--blt:#2A5BD7;--bl2:#EEF2FB;
}
/* 오른쪽 위 <b>흰 알약</b> — 무대에 <b>한 번만</b> 단다. 장마다 달면
   장을 늘릴 때 빠뜨린다. 글은 무대가 들고 있다(data-badge). */
.show.deck::after{content:attr(data-badge);position:absolute;right:0;top:40px;z-index:4;
 background:var(--dkb);color:#E2C27D;font-size:15px;font-weight:700;letter-spacing:-.02em;
 padding:8px 26px 8px 22px;border-radius:99px 0 0 99px;
 box-shadow:0 3px 12px rgba(9,20,40,.18);white-space:nowrap}
.deck-fit{display:flex;align-items:flex-start;justify-content:center;overflow:hidden;
 height:calc(100vh - 232px);min-height:360px}
body.presenting .deck-fit{height:calc(100vh - 96px);align-items:center}
/* 한 장 — 넉넉한 여백, 위아래로 벌린 배치 */
.show.deck>section{display:none}
.show.deck>section.cur{display:flex;flex-direction:column;position:absolute;inset:0;
 --pad:60px;padding:0 var(--pad) 30px;margin:0;background:var(--dkg);
 animation:dkin .2s cubic-bezier(.2,.7,.3,1)}
@keyframes dkin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 제목 — 보고서 장 머리와 같은 꼴: 흰 바탕 · 남색 큰 제목 · 금색 번호,
   맨 위 남색→금색 띠 한 줄, 아래 머리카락 선 (판 X315 · 예전엔 파랑 머리띠) */
.show.deck>section.cur>h3{display:block;padding:44px var(--pad) 20px;
 margin:0 calc(var(--pad)*-1) 20px;
 background-color:#fff;background-repeat:no-repeat;background-position:0 0;background-size:100% 5px;
 background-image:linear-gradient(90deg,#0F1A2C 0 78%,#B08D57 78% 100%);
 border-bottom:1px solid #E7E0D2;
 color:var(--dkb);font-size:35px;font-weight:700;letter-spacing:-.035em;line-height:1.24}
.show.deck>section.cur>h3::before{content:var(--no,'');font-weight:800;margin-right:13px;color:#B08D57}
.show.deck>section.cur>h3 small{display:block;font-size:16px;font-weight:500;
 color:#6B7684;margin-top:7px;letter-spacing:-.02em}
/* 본문 — 가운데를 다 쓴다 */
.show.deck>section.cur{font-size:17px;line-height:1.7}
/* 설계사용 설명(.sd)은 <b>안 세운다</b> — 아래 「읽는 말」이 같은 것을
   더 짧게 말한다. 두 번 적으면 글자만 늘고 고객은 둘 다 안 읽는다.
   죽 이어서·인쇄에는 그대로 있다. */
.show.deck>section.cur>.sd{display:none}
/* 자세한 것은 <b>접는다</b> — 한 장에 안 들어가는 것은 죽 이어서·인쇄에서 본다 */
.show.deck>section.cur .deep{display:none}
/* 단계마다 붙은 잔글·꼬리말은 <b>읽는 말이 대신</b> 한다. 종이에는 그대로 나온다. */
.show.deck>section.cur .sd2,.show.deck>section.cur .simft{display:none}
/* 표지 — 「보험 자산 운용보고서」 남색 · 금색 (판 X314)
   사장님 말씀 「만화캐릭터 없애고, 밑에껄로 해 · 보험 자산 운용보고서로」 —
   보장 분석 보고서(ba-report.html) 표지와 <b>같은 한 장</b>이다. 적힌 담보가 있으면
   그 표지를 그대로 띄우고(.hdrep — 4대 위험 고리 · 보유 담보 · 더 받는 돈),
   아직 아무것도 안 적혔으면 아래 글 표지가 같은 색으로 선다 (0 을 그리지 않는다 — 1번). */
.show.deck>#sHd.cur{justify-content:center;align-items:flex-start;border:0;
 padding:0 84px 92px;background:radial-gradient(1100px 620px at 82% 18%,#24365A 0%,#0F1A2C 58%,#0A1220 100%)}
.show.deck>#sHd.cur>*,.show.deck>#sEnd.cur>*,.show.deck>#sToc.cur>*{margin-left:0;margin-right:0}
/* 금색 테 한 줄 — 보고서 표지와 같은 자리 */
.show.deck>#sHd.cur::before{content:'';position:absolute;inset:16px;border:1px solid rgba(201,168,106,.32);z-index:0;pointer-events:none}
.show.deck>#sHd.cur>*{position:relative;z-index:1}
.show.deck>#sHd.cur .ey{font-size:14px;color:#C9A86A;letter-spacing:.14em;font-weight:700}
.show.deck>#sHd.cur h1{font-size:58px;line-height:1.14;margin:14px 0 20px;color:#fff;
 letter-spacing:-.04em;font-weight:800;max-width:760px}
.show.deck>#sHd.cur h1 span{display:block;color:#E2C27D}
.show.deck>#sHd.cur p{display:inline-block;font-size:17px;font-weight:600;color:#D9E0EA;
 background:none;border:1px solid rgba(201,168,106,.45);border-radius:99px;padding:10px 22px;letter-spacing:-.02em}
.show.deck>#sHd.cur p b{color:#E2C27D}
/* 칸 셋 — 이 종이가 무엇을 담고 있는지. <b>무대에서만</b> 세운다. */
.hdks,.hdrep{display:none}
.show.deck>#sHd.cur .hdks{display:grid;grid-template-columns:repeat(3,minmax(0,190px));
 gap:13px;margin-top:26px}
.hdk{background:#fff;border-radius:18px;padding:15px 18px;
 box-shadow:0 7px 24px rgba(5,30,70,.16)}
.hdk span{display:block;font-size:var(--t6);font-weight:700;color:var(--gy2);letter-spacing:-.02em}
.hdk b{display:block;font-size:31px;font-weight:800;color:var(--dkb);
 letter-spacing:-.04em;line-height:1.2;margin-top:2px}
.hdk b i{font-style:normal;font-size:var(--t3);font-weight:700;margin-left:2px}
.hdk b.no{font-size:var(--t3);color:var(--gy2);font-weight:700;letter-spacing:-.02em;margin-top:7px}
.show.deck>#sHd.cur .hdk{background:rgba(255,255,255,.04);border:1px solid rgba(201,168,106,.35);box-shadow:none;border-radius:12px}
.show.deck>#sHd.cur .hdk span{color:#C9A86A}
.show.deck>#sHd.cur .hdk b{color:#fff}
.show.deck>#sHd.cur .hdk b.no{color:#AEB9CA}
/* 보고서 표지를 <b>그대로</b> 띄운다 — 손을 대지 않는 그림(넘기기는 바깥 무대가 한다) */
.show.deck>#sHd.cur .hdrep{display:block;position:absolute;inset:0;width:100%;height:100%;
 border:0;margin:0;z-index:5;pointer-events:none;background:#0F1A2C}
.show.deck>#sHd.cur:has(>.hdrep)::before{display:none}   /* 금색 테는 보고서 표지가 들고 있다 — 두 겹이 안 되게 */
.show.deck:has(>#sHd.cur)::after{display:none}   /* 오른쪽 위 흰 알약 — 표지에서는 걷는다 */
@media print{.hdrep{display:none!important}}
/* 아래 띠 — <b>누가 · 언제</b>. 붙여 둔 글(::after)이 아니라 실제 칸이라
   무대에서는 금색 줄, 죽 이어서·종이에서는 작은 회색 줄로 <b>같은 것</b>이 선다. */
.hd .hdft{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:7px;font-size:11.5px;
 font-weight:700;color:var(--gy2)}
.hd .hdft b{color:var(--gd)}
.show.deck>#sHd.cur .hdft{position:absolute;left:84px;right:84px;bottom:40px;margin:0;
 height:52px;background:none;border-top:1px solid rgba(201,168,106,.35);font-size:15px;letter-spacing:-.02em;
 align-items:center;gap:14px;padding:0;z-index:4}
.show.deck>#sHd.cur .hdft b{color:#C9A86A}
.show.deck>#sHd.cur .hdft span{color:#AEB9CA}
/* 마무리 면책 — 작게, 아래에 */
.show.deck>#sEnd.cur{justify-content:flex-end;font-size:13.5px;line-height:1.8;border:0;
 padding:56px 72px 44px;background:var(--dkb);color:rgba(255,255,255,.84);border-top:0}
.show.deck>#sEnd.cur b{color:#fff;font-weight:700}
/* 파랑 전면 장(오늘 순서 · 마무리)의 제목 — 무대에서는 크게 희게,
   종이·죽 이어서는 <b>작은 회색</b>. 안 보이게 숨기지는 않는다.
   숨기면 종이에서 그 장이 <b>제목 없는 잔글</b>이 된다. */
.fh{font-size:var(--t6);font-weight:800;color:var(--gy);margin-bottom:6px}
.show.deck>section.cur .fh{font-size:46px;font-weight:700;color:#fff;letter-spacing:-.04em;
 line-height:1.2;margin-bottom:18px}
/* ── 오늘 순서 — 주신 자료의 목차 장 자리 ───────────────────────
   장 스물몇 개를 한 줄로 늘어놓으면 고객이 <b>어디를 보는지 모른다.</b>
   묶음(지금 이렇습니다 · 이 일이 생기면 · 돈 · 담보 · 정리)으로 <b>끼리끼리</b>
   세운다. 묶음은 장이 스스로 들고 있다. */
.tocs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0 20px;align-content:start;align-items:start}
.tgc{min-width:0}
.tgh{font-size:var(--t6);font-weight:800;color:var(--gy2);letter-spacing:-.02em;
 border-bottom:1px solid var(--ln);padding-bottom:4px;margin-bottom:6px;
 display:flex;align-items:center;gap:5px}
.tgh em{font-style:normal;font-size:var(--t6);font-weight:700;background:#F1F3F5;color:var(--gy);
 border-radius:99px;padding:0 5px;margin-left:auto}
.tocs a{display:flex;gap:7px;align-items:baseline;text-decoration:none;color:var(--nv);
 font-size:12.5px;font-weight:700;min-width:0;margin-bottom:3px}
.tocs a b{color:var(--gy2);flex:none}
.tocs a>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ── 치료 경로 한 줄 — 직접 그린 것이다 (9번) ────────────────────── */
.flow{display:flex;align-items:flex-start;gap:6px;margin-bottom:11px}
.fl{flex:1 1 0;min-width:0;text-align:center;opacity:.42}
.fl.on{opacity:1}
.fi{width:38px;height:38px;border-radius:50%;margin:0 auto 5px;position:relative;
 background:#fff;border:2px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:var(--t3)}
.fl.on .fi{border-color:var(--blt);box-shadow:0 3px 12px rgba(11,123,255,.2)}
.fi em{position:absolute;top:-6px;left:-6px;font-style:normal;font-size:var(--t6);font-weight:800;
 background:var(--gy);color:#fff;border-radius:50%;width:17px;height:17px;
 display:flex;align-items:center;justify-content:center}
.fl.on .fi em{background:var(--bl)}
.fn{font-size:var(--t6);font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd{font-size:var(--t6);font-weight:700;color:var(--gy2);margin-top:1px}
.fd b{color:var(--gy)}
.fa{flex:0 0 auto;width:14px;height:38px;display:flex;align-items:center;justify-content:center}
.fa::before{content:'';width:6px;height:6px;border-top:2px solid var(--ln);border-right:2px solid var(--ln);
 transform:rotate(45deg)}
/* 경로 띠가 단계 이름과 아이콘을 이미 말한다 — 줄마다 붙던 <b>동그라미는
   접고</b> 이름만 남긴다. 그 자리에 경로가 들어와 한 장에 그대로 앉는다. */
.show.deck>section.cur .simst{padding:8px 15px}
.show.deck>section.cur .simst .sb{margin-bottom:2px}
.show.deck>section.cur .simhd{padding:8px 15px}
.show.deck>section.cur .simst .si{display:none}
.show.deck>section.cur .simst .sl{width:96px;text-align:left}
.show.deck>section.cur .sp2{margin-top:5px;gap:4px}
.show.deck>section.cur .sp2 span{font-size:10px;padding:1px 6px}
.show.deck>section.cur.simsec>.say{font-size:20px;padding:14px 20px}
.show.deck>section.cur .flow{gap:8px;margin-bottom:10px;flex:none}  /* 13px 이면 암 치료비 장이 721px — 잘리지는 않지만 <b>여유가 0</b> 이다.
     한글 한 줄이 늘면 그때 잘린다. 3px 을 미리 비워 둔다. */
.show.deck>section.cur .fi{width:46px;height:46px;font-size:21px;margin-bottom:6px}
.show.deck>section.cur .fn{font-size:15px}
.show.deck>section.cur .fd{font-size:12.5px}
.show.deck>section.cur .fa{height:46px;width:18px}
.ba3d .b3f{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--ln);background:#EEF2F7}
.ba3d .b3f iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.show.deck>section.cur.ba3d{padding:0;background:#fff}
.show.deck>section.cur.ba3d>h3,.show.deck>section.cur.ba3d>.say,.show.deck>section.cur.ba3d>.sd{display:none}
.show.deck>section.cur.ba3d .b3f{position:absolute;inset:0 0 34px 0;aspect-ratio:auto;border:0;border-radius:0}  /* 아래 34px 은 발표 진행 막대 자리 */
.show.deck:has(>section.cur.ba3d)::after{display:none}
@media print{.ba3d{display:none!important}}
/* 보고서 묶음 장(판 X316) — 무대 가득 · 손은 안 닿게(넘기기 · 쓸기는 바깥 무대가 든다) · 죽 이어서에서는 안 선다 */
.show:not(.deck)>section.rp{display:none}
.show.deck>section.cur.rp{background:#fff}
.show.deck>section.cur.rp .b3f{inset:0}
.ba3d iframe.rpf{pointer-events:none}
.show.deck:has(>section.cur.rp)::after{display:none}
.deckbar .dt .dsub{font-weight:600;color:var(--gy2);font-size:.86em}
/* ── 치료 한 바퀴 — 네 단계를 <b>옆으로</b> 한 장에. 직접 그린 것이다 (9번) ──
   아래로 쌓으면 카드 안쪽에서 잘렸다(그래서 두 장이었다). 옆으로 세우면
   1280 무대에 네 칸이 앉는다. 점선 고리는 <b>마지막 → 첫 단계</b>로 돌아간다. */
.cyc{display:flex;align-items:stretch}
.cyk{flex:1 1 0;min-width:0;background:#fff;border:1px solid var(--ln);border-top:4px solid var(--bl);
 border-radius:14px;padding:10px 11px 10px;display:flex;flex-direction:column}
.cyk.ok{border-top-color:var(--gr)}
.cyk.gap{border-top-color:var(--rd)}
.cya{flex:0 0 16px;display:flex;align-items:center;justify-content:center}
.cya::before{content:'';width:7px;height:7px;border-top:2.5px solid var(--gy2);border-right:2.5px solid var(--gy2);transform:rotate(45deg)}
.cyh{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.cyh em{font-style:normal;flex:none;width:20px;height:20px;border-radius:50%;background:var(--bl);color:#fff;
 font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cyh .cyi{flex:none;width:32px;height:32px;border-radius:50%;background:var(--bl2);display:flex;align-items:center;justify-content:center;font-size:17px}
.cyn{min-width:0}
.cyn b{display:block;font-size:var(--t4);font-weight:800;letter-spacing:-.03em;line-height:1.25}
.cyn i{display:block;font-style:normal;font-size:11.5px;color:var(--gy2);font-weight:700}
.cyneed{display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap;
 border-bottom:1px dashed var(--ln);padding-bottom:6px;margin-bottom:7px}
.cyneed span{font-size:11.5px;color:var(--gy);font-weight:700}
.cyneed b{font-size:var(--t3);font-weight:800;color:var(--nv);letter-spacing:-.03em}
.cyb{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.cyb span{flex:0 0 40px;font-size:11.5px;font-weight:800;color:var(--gy2)}
.cyb .t{flex:1;min-width:16px;height:10px;background:#F1F3F5;border-radius:4px;overflow:hidden}
.cyb .t i{display:block;height:100%;border-radius:4px}
.cyb b{flex:none;min-width:58px;text-align:right;font-size:var(--t6);font-weight:800;color:var(--gy)}
.cyb.a b{color:var(--blt)}
.cyg{display:flex;flex-wrap:wrap;align-items:center;gap:3px 4px;font-size:11px;font-weight:800;margin:3px 0 7px}
.cyg span{border-radius:6px;padding:1px 6px}
.cyg .r{color:var(--rd);background:var(--rd2)}.cyg .o{color:var(--gr);background:var(--gr2)}
.cyg i{font-style:normal;color:var(--gy2)}
.cyp{display:flex;flex-wrap:wrap;gap:4px}
.cyp span{font-size:10.5px;font-weight:800;color:var(--blt);background:var(--bl2);border-radius:6px;padding:1px 6px;white-space:nowrap}
.cyp span.no{color:var(--rd);background:var(--rd2)}
.cyp span.up{color:var(--gr);background:var(--gr2)}
.cyp span.ac{color:var(--gy);background:#F2F4F6}
.cys{font-size:var(--t6);color:var(--gy);line-height:1.65;margin-top:8px;border-top:1px solid #F1F3F5;padding-top:6px}
.cys b{color:var(--nv)}
/* 고리 — 오른쪽 끝에서 내려와 왼쪽 끝으로 돌아가 <b>첫 칸을 가리킨다</b> */
.cloop{position:relative;margin:0 30px 10px;padding:7px 20px 6px;border:2px dashed #B8C4D6;border-top:0;
 border-radius:0 0 18px 18px;text-align:center;font-size:11.5px;font-weight:700;color:var(--gy);line-height:1.5}
.cloop::before{content:'';position:absolute;left:-8px;top:-9px;border-left:7px solid transparent;
 border-right:7px solid transparent;border-bottom:10px solid #94A3B8}
.cloop b{color:var(--nv)}
@media(max-width:820px){
 .cyc{flex-wrap:wrap;gap:8px}.cyk{flex:1 1 calc(50% - 8px)}.cya{display:none}
 .cloop{margin:8px 10px 10px}
}
@media(max-width:520px){.cyk{flex-basis:100%}}
@media print{.cyk{break-inside:avoid}}
/* 무대 — 단계 설명은 접는다(읽는 말이 대신한다) */
.show.deck>section.cur .cyc{flex:none}
.show.deck>section.cur .cyk{padding:11px 13px 11px}
.show.deck>section.cur .cyh{margin-bottom:7px}
.show.deck>section.cur .cyh .cyi{width:36px;height:36px;font-size:19px}
.show.deck>section.cur .cyn b{font-size:17px}
.show.deck>section.cur .cyn i{font-size:12.5px}
.show.deck>section.cur .cyneed span{font-size:12.5px}

/* 제목 밑 부제는 「읽는 말」이 대신한다 — 한 줄을 아낀다 */
.show.deck>#s5.cur>h3 small{display:none}
.show.deck>#s5.cur{--pad:44px;padding-bottom:22px}
.show.deck>#s5.cur>h3{padding-top:38px;padding-bottom:20px;margin-bottom:14px;font-size:33px;
 background-position:var(--pad) 11px}
.show.deck>#s5.cur>.say{padding:13px 20px;font-size:21px}
/* 한 줄 요약 — 여섯 문단을 <b>카드로 나눈다</b>. 한 덩어리로 붙여
   놓으면 글자 수는 같은데 아무도 안 읽는다. 나누면 눈이 따라간다. */
.show.deck>#s3.cur .talk{display:grid;grid-template-columns:1fr 1fr;gap:11px;
 background:none;border-left:0;border-radius:0;padding:0}
.show.deck>#s3.cur .talk p{background:#F8FAFC;border-radius:15px;padding:15px 18px;
 margin:0;font-size:16px;line-height:1.72}
.show.deck>#s3.cur .talk p:first-child{grid-column:1/-1;background:var(--nv);color:#fff}
.show.deck>#s3.cur .talk p:first-child b{color:#fff}
.show.deck>#s3.cur>h3{font-size:34px}
/* 바탕이 회백이 되었으니 카드는 <b>흰색</b>으로 띄운다 — 같은 회색끼리
   겹치면 카드가 <b>안 보인다.</b> 자리마다 색을 적지 않고 한 줄로 묶는다. */
.show.deck>section.cur .hero,.show.deck>section.cur .pbars,
.show.deck>section.cur .cmpb,.show.deck>section.cur .big2,
.show.deck>section.cur .talk,.show.deck>section.cur .note.i,
.show.deck>section.cur .st,.show.deck>section.cur .life,
.show.deck>section.cur .sd3,.show.deck>section.cur .simft,
.show.deck>#s3.cur .talk p{background:#fff}
.show.deck>section.cur .st .sh{background:#F6F8FA}
.show.deck>section.cur .hero,.show.deck>section.cur .pbars,
.show.deck>section.cur .cmpb,.show.deck>section.cur .big2,
.show.deck>section.cur .st,.show.deck>section.cur .life,
.show.deck>section.cur .nd,.show.deck>section.cur .ev,
.show.deck>section.cur .pin,.show.deck>section.cur .tjs,
.show.deck>section.cur .wh1,.show.deck>#s3.cur .talk p{
 border-radius:14px;box-shadow:0 3px 14px rgba(12,40,88,.055)}
.show.deck>#s3.cur .talk p:first-child{background:var(--dkb)}
.show.deck>section.cur .ev .bar{background:#EBEEF2}
/* 한 장 안에서 커지는 것들 — 무대가 넓으니 시원하게 */
.show.deck>section.cur .big2 .c b{font-size:34px}
.show.deck>section.cur .big2 .c span{font-size:15px}
.show.deck>section.cur .talk p{font-size:20px;line-height:1.9}
.show.deck>section.cur table{font-size:15px}
.show.deck>section.cur td{padding:9px 12px}
.show.deck>section.cur th{font-size:12px}
.show.deck>section.cur .dsc{display:none}
.show.deck>section.cur .cbl,.show.deck>section.cur .cbn,
.show.deck>section.cur .cbt{font-size:16px}
.show.deck>section.cur .cbg{height:22px}
.show.deck>section.cur .pbn{font-size:15px}
.show.deck>section.cur .pbg i{height:20px}
.show.deck>section.cur .pbars>span{font-size:16px}
.show.deck>section.cur .st{max-height:none;margin:0}
.show.deck>section.cur .stwrap,.show.deck>section.cur .sim{flex:none}
/* 두 칸으로 설 때는 글자를 <b>한 호흡 줄여</b> 여덟 줄이 다 들어오게 한다 */
.show.deck>section.cur .stwrap.two table{font-size:13px}
.show.deck>section.cur .stwrap.two td{padding:6px 9px}
.show.deck>section.cur .stwrap.two th{font-size:12px;padding:5px 9px}
.show.deck>section.cur .stwrap.two .dsc{display:none}
.show.deck>section.cur .dl{max-height:none}
/* 첫 장의 큰 숫자 — 궁금한 것 하나만 크게 */
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#F8FAFC;
 border-radius:18px;padding:22px 24px;margin-bottom:10px}
.hero .hn{flex:1;min-width:150px}
.hero .hn span{display:block;font-size:var(--t6);font-weight:700;color:var(--gy2)}
.hero .hn b{display:block;font-size:32px;font-weight:800;letter-spacing:-.04em;margin-top:3px}
.hero .hn.on b{color:var(--blt)}
.hero .hn b.up{color:var(--rd)}.hero .hn b.dn{color:var(--gr)}
.hero .ha{font-size:var(--t1);font-weight:800;color:var(--gy2);flex:none}
.hsub{font-size:var(--t5);color:var(--gy);margin-bottom:14px}
.hsub b{font-size:16px}.hsub b.up{color:var(--rd)}.hsub b.dn{color:var(--gr)}
.show.deck>section.cur .hero{padding:38px 42px;border-radius:22px}
.show.deck>section.cur .hero .hn span{font-size:16px}
.show.deck>section.cur .hero .hn b{font-size:58px}
.show.deck>section.cur .hero .ha{font-size:34px}
.show.deck>section.cur .hsub{font-size:19px;margin-bottom:0}
/* 보험료 셋을 길이로 */
/* 막대와 금액이 <b>한 격자</b>다 — 금액 칸(max-content)을 여섯 줄이
   같이 쓰므로, 막대 길이를 서로 견줄 수 있고 금액이 안 잘린다. */
/* 보험료 변화 — 위 띠 · 해마다 그래프 · 계약별 표 (판 X319) */
.pr2k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:9px}
.pr2k>div{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:6px 14px}
.pr2k span{display:block;font-size:13px;font-weight:700;color:var(--gy2)}
.pr2k b{display:inline;font-size:17px;font-weight:800;color:var(--gy2);letter-spacing:-.02em}
.pr2k b i{font-style:normal;margin:0 6px;color:var(--gy2)}.pr2k b em{font-style:normal;color:var(--nv)}
.pr2k u{display:inline;text-decoration:none;font-size:13px;font-weight:800;color:var(--blt,#1B64DA);margin-left:8px}
.pr2{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px;align-items:start}
.pr2c{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px 12px 8px}
.pr2c svg{display:block;width:100%;height:auto}
.pr2l{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;font-weight:700;color:var(--nv);margin-top:2px}
.pr2l i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.pr2l i.b{background:#8B95A1}.pr2l i.a{background:var(--bl,#2A5BD7)}.pr2l em{font-style:normal;color:var(--gy2);font-weight:600}
.pr2t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--ln);border-radius:12px;overflow:hidden;font-size:12.5px}
.pr2t th{background:#F6F8FA;color:var(--gy2);font-weight:700;text-align:left;padding:7px 9px;font-size:12.5px}
.pr2t td{padding:4px 8px;border-top:1px solid var(--ln);vertical-align:top;line-height:1.3;white-space:nowrap}
/* 판 X319 — 웹 글꼴을 못 받은 자리(다른 글꼴)에서도 한 줄로 — 줄이 접히면 한 장을 넘는다(점검 [10]) */
.pr2t td:first-child{white-space:normal}.pr2t td small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.pr2t td b{font-weight:800}.pr2t td small{display:block;color:var(--gy2);font-size:12px}
.pr2t td.n{white-space:nowrap;text-align:right;color:var(--gy2)}.pr2t td.n i{font-style:normal;margin:0 4px}.pr2t td.n b{color:var(--nv)}
.pr2t .tg{display:inline-block;margin-left:2px;font-size:11.5px;font-weight:800;border-radius:99px;padding:0 8px;border:1px solid currentColor}
.pr2t tr.k .tg{color:#4E5968}.pr2t tr.e .tg{color:#B08D57}.pr2t tr.c .tg{color:#E5484D}.pr2t tr.n .tg{color:#0F9D6E}
.pr2t tr.c td{opacity:.7}.pr2t b.ok{color:#0F9D6E}
.pbars{background:#F8FAFC;border-radius:14px;padding:15px 17px;margin-bottom:13px;
 display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:5px 10px;align-items:center}
.pbk{grid-column:1/-1;display:flex;gap:13px;margin-bottom:2px}
.pbk span{font-size:var(--t6);font-weight:800;display:flex;align-items:center;gap:5px;color:var(--gy)}
.pbk span::before{content:'';width:11px;height:11px;border-radius:3px;background:#94A3B8}
.pbk span.a::before{background:var(--bl)}
.pbn{grid-column:1/-1;font-size:var(--t6);font-weight:800;color:var(--gy);margin-top:7px}
.pbg{min-width:0}
.pbg i{display:block;height:14px;border-radius:4px;background:#94A3B8;min-width:2px}
.pbg i.a{background:var(--bl)}
.pbars>span{font-size:var(--t6);font-weight:800;white-space:nowrap}
/* 묶음이 표준 대비 얼마나 찼나 */
.cmpb{background:#F8FAFC;border-radius:14px;padding:15px 17px;margin-bottom:13px}
.cbl{font-size:var(--t6);font-weight:800;color:var(--gy);margin-bottom:10px}
.cbr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cbr:last-of-type{margin-bottom:0}
.cbn{font-size:var(--t6);font-weight:800;width:56px;flex:none;color:var(--gy)}
.cbg{flex:1;position:relative;height:16px;border-radius:5px;background:var(--ln);overflow:hidden;min-width:60px}
.cbg i{display:block;height:100%;border-radius:5px;background:#94A3B8}
.cbg i.a{background:var(--bl)}
.cbg u{position:absolute;top:0;bottom:0;width:2px;background:var(--nv);opacity:.45}
.cbt{font-size:var(--t6);font-weight:800;white-space:nowrap;flex:none;text-align:right;min-width:96px}
.cbt em{font-style:normal;color:var(--gy2);font-weight:700;margin-left:5px}
.cbt.none{color:var(--gy2);font-weight:700}
.cbf{font-size:var(--t6);color:var(--gy2);margin-top:9px}
/* 모자란 담보가 얼마나 찼나 */
.nfill{height:7px;border-radius:4px;background:var(--ln);overflow:hidden;margin:7px 0 6px}
.nfill i{display:block;height:100%;border-radius:4px;background:var(--bl)}
.nd.none .nfill i{background:var(--rd)}
.deckbar{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;align-items:center;gap:10px;
 padding:9px 14px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--ln)}
.deckbar:empty{display:none}
.deckbar .dnav{appearance:none;border:1px solid var(--ln);background:#fff;border-radius:10px;
 width:40px;height:36px;font-size:13px;font-weight:800;color:var(--nv);flex:none}
.deckbar .dnav:disabled{color:var(--ln);cursor:default}
.deckbar .dnav.x{color:var(--gy)}
/* 한 장씩 카톡으로 — 넘기는 띠에 둔다. 무대 안에 두면 고객이 먼저 본다. */
.deckbar .dnav.kk{color:var(--blt);border-color:#CFE0FE;background:var(--bl2)}
.deckbar .dbar{flex:1;min-width:40px;height:5px;border-radius:3px;background:var(--ln);overflow:hidden}
.deckbar .dbar i{display:block;height:100%;background:var(--nv);border-radius:3px;transition:width .2s}
.deckbar .dt{font-size:12.5px;font-weight:800;white-space:nowrap;flex:none}
.deckbar .dn{font-size:11.5px;font-weight:700;color:var(--gy2);white-space:nowrap;flex:none}
.deckbar .dn b{color:var(--nv);font-size:13px}
@media(max-width:560px){.deckbar .dt{display:none}}
/* 발표 — 설계사 도구를 치우고 자료만 남긴다 */
body.presenting .bar,body.presenting .showctl,body.presenting .toc{display:none!important}
body.presenting .wrap{padding:8px 14px 74px;max-width:none}
body.presenting .show:not(.deck){border:0;box-shadow:none}
@media print{
 /* <b>색이 날아가던 자리.</b> 브라우저는 인쇄할 때 배경색을 기본으로 안 찍는다
    — 그래서 파랑 머리띠도, 초록·빨강 칸도 하얗게 나오고 글자만 남아 있었다.
    이 한 줄이 없어서 뽑을 때마다 종이가 무너졌다. */
 *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 body{background:#fff}.bar,.noprint{display:none!important}.wrap{max-width:none;padding:0}
 /* 접어 둔 것은 <b>종이에 전부</b> 편다 — 종이는 접을 수가 없다 */
 .api,.nhi{display:block!important}
 .apf,.nhf,.fage{break-inside:avoid;page-break-inside:avoid}
 .show{border:0;border-radius:0;padding:0;max-width:none}.show section{page-break-inside:avoid}
 /* 한 장씩 보던 중에 뽑아도 <b>전부</b> 나온다 — 접힌 것을 뺀 것처럼 두지 않는다.
    무대(16:9)를 걷고 세로 문서로 돌아간다. */
 body:not(.printland) .deck-fit{height:auto!important;display:block!important;overflow:visible!important}
 body:not(.printland) .show.deck{width:auto!important;height:auto!important;transform:none!important;
  overflow:visible!important;box-shadow:none!important;border-radius:0!important}
 body:not(.printland) .show.deck>section{display:block!important;position:static!important;padding:0!important;
  margin:0 0 22px!important;animation:none!important;background:none!important}
 body:not(.printland) .show.deck>section.cur .deep{display:block!important}
 body:not(.printland) .show.deck>section.cur .dsc{display:block!important}
 body:not(.printland) .show.deck>section.cur .wsteps, body:not(.printland) .show.deck>section.cur .pgrid, 
 body:not(.printland) .show.deck>section.cur .ndz, body:not(.printland) .show.deck>section.cur>.sd, 
 body:not(.printland) .show.deck>section.cur .sd2, body:not(.printland) .show.deck>section.cur .simft{display:block!important}
 body:not(.printland) .show.deck>section.cur .whys>.wh1, body:not(.printland) .show.deck>section.cur .needs>.nd{display:block!important}
 body:not(.printland) .only-deck{display:none!important}
 body:not(.printland) .show.deck>#sHd.cur{padding:0!important;background:none!important}
 body:not(.printland) .show.deck>#sHd.cur h1{font-size:24px!important;color:#191F28!important}
 body:not(.printland) .show.deck>#sHd.cur .ey{color:#B99A3A!important;font-size:10.5px!important}
 body:not(.printland) .show.deck>#sHd.cur p{color:#6B7684!important;font-size:12px!important;
  background:none!important;padding:0!important;display:block!important}
 /* 무대 장식은 <b>종이에 안 찍는다</b> — 알약·머리띠·「+」 는 화면 것이다.
    종이에서는 검은 글씨가 제일 잘 읽힌다. */
 body:not(.printland) .show.deck::after, body:not(.printland) .show.deck>#sHd.cur::before, 
 body:not(.printland) .show.deck>#sEnd.cur::before{display:none!important}
 body:not(.printland) .show.deck>#sHd.cur .hdft{position:static!important;height:auto!important;
  background:none!important;padding:0!important;font-size:11.5px!important;
  margin-top:7px!important;color:#8B95A1!important}
 body:not(.printland) .show.deck>#sHd.cur .hdft b{color:#8B95A1!important}
 body:not(.printland) .show.deck>#sHd.cur .hdft{border-top:0!important}
 body:not(.printland) .show.deck>#sHd.cur h1 span{display:inline!important;color:#191F28!important}
 body:not(.printland) .show.deck>#sHd.cur p{border:0!important}
 body:not(.printland) .show.deck>#sHd.cur p b{color:#6B7684!important}
 body:not(.printland) .show.deck>#sToc.cur{background:none!important;padding:0!important}
 body:not(.printland) .show.deck>#sToc.cur::before{display:none!important}
 body:not(.printland) .show.deck>#sToc.cur .tocs a{color:#191F28!important;font-size:12px!important;font-weight:700!important}
 body:not(.printland) .show.deck>#sToc.cur .tocs a b{color:#8B95A1!important}
 body:not(.printland) .show.deck>#sToc.cur .tgh{color:#191F28!important;font-size:11px!important;
  border-bottom-color:#E5E8EB!important}
 body:not(.printland) .show.deck>#sToc.cur .tgh em{background:#F1F3F5!important;color:#6B7684!important}
 body:not(.printland) .show.deck>section.cur .fh{font-size:13px!important;color:#6B7684!important;margin-bottom:6px!important}
 body:not(.printland) .show.deck>#sEnd.cur{background:none!important;color:#8B95A1!important}
 body:not(.printland) .show.deck>#sEnd.cur b{color:#6B7684!important}
 body:not(.printland) .show.deck>section.cur>*{margin-left:0!important;margin-right:0!important}
 body:not(.printland) .show.deck>section.cur>h3{font-size:16px!important;background:none!important;
  color:#191F28!important;padding:0!important;margin:0 0 6px!important}
 body:not(.printland) .show.deck>section.cur>h3 small{color:#8B95A1!important}
 body:not(.printland) .show.deck>section.cur>.say, body:not(.printland) .show.deck>#sHd.cur .say, body:not(.printland) .show.deck>#sEnd.cur .say{
  background:none!important;border-left:0!important;box-shadow:none!important;
  border-top:1px solid #E5E8EB!important;border-radius:0!important;padding:9px 0 0!important}
 body:not(.printland) .show.deck>section.cur>h3 small{display:inline!important;font-size:12px!important;margin:0 0 0 8px!important}
 body:not(.printland) .say{font-size:13px!important;padding-top:9px!important;margin-top:10px!important}
 body:not(.printland) .anat{grid-template-columns:1fr 300px 1fr!important}
 body:not(.printland) .tj{display:flex!important}
 body:not(.printland) .st,body:not(.printland) .life{page-break-inside:avoid}
 /* 가로로 뽑는 규칙은 <b>여기 없다.</b> baPrint('land') 가 그때만 넣는다
    (#baPageCss). @media print 안에 두었더니 인쇄가 도는 사이에 안 먹는
    자리가 있었다 — 22장이 통째로 세로 문서로 나왔다. 넣고 빼는 자리가
    하나라 헷갈릴 일도 없다. */}
.bar .who{font-size:var(--t6);font-weight:800;color:var(--gyd);background:var(--bg);
  border:1px solid var(--ln);border-radius:999px;padding:4px 11px;white-space:nowrap}
.bar .who b{color:var(--blt)}
/* ══ 📘 사용방법 · 🧠 윤시현의 두뇌 · 🎓 기준 · 👥 연령대 — 읽기 쉽게 (판 X330) ══════════════
   사장님 말씀 「어려워서 조금 더 쉽고 가독성 높여서」. 글은 그대로 — 글자 키우기 · 줄 사이 · 묶음 머리 · 바로 가기 ·
   접기만 한다. 글씨 13px · 누르는 곳 44px 바닥(check-bafit)은 그대로 지킨다. */
.gd2,.br2,.st2{line-height:1.75}
.gd2-lead{font-size:16px!important;color:var(--nv)!important;margin:4px 0 12px!important}
.gd2-jump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;position:sticky;top:64px;z-index:5;background:#fff;padding:8px 0;border-bottom:1px solid var(--ln)}
.gd2-jump button{min-height:44px;padding:0 16px;border:1px solid var(--ln);border-radius:99px;background:#F8FAFC;font:inherit;font-size:14.5px;font-weight:700;color:var(--nv);cursor:pointer}
.gd2-jump button:hover{background:#EEF4FF;border-color:#B8D3FF}
.gd2-sec{margin:0 0 18px;scroll-margin-top:130px}
.gd2-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px;padding:10px 0 8px;border-top:2px solid var(--nv)}
.gd2-h i{font-style:normal;flex:none;width:30px;height:30px;border-radius:9px;background:var(--nv);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.gd2-h b{font-size:18.5px;font-weight:800;color:var(--nv)}
.gd2-h em{font-style:normal;font-size:14px;font-weight:600;color:var(--gy2)}
.gd2-fold>summary{list-style:none;cursor:pointer;min-height:44px}
.gd2-fold>summary::-webkit-details-marker{display:none}
.gd2-fold>summary .gd2-h::after{content:'펴기 ▾';margin-left:auto;font-size:14px;font-weight:700;color:var(--blt,#1B64DA)}

   자료에는 그 칸이 없다. S.padOpen[key] 한 줄에서 멈추고 <b>흰 화면</b>이 된다.
   빈 칸은 <b>기본값으로 채워</b> 넣는다 — 적으신 것은 그대로 두고.            */
function migrate(v){
  var d=blank(),k;
  for(k in d)if(d.hasOwnProperty(k)&&(v[k]===undefined||v[k]===null))v[k]=d[k];
  /* 묶음 안쪽도 채운다 */
  ['who','man','scen'].forEach(function(g){
    if(typeof v[g]!=='object'||!v[g]){v[g]=d[g];return;}
    for(var q in d[g])if(d[g].hasOwnProperty(q)&&v[g][q]===undefined)v[g][q]=d[g][q];
  });
  ['before','after','fam'].forEach(function(g){if(!v[g]||!v[g].push)v[g]=[];});
  /* 계약마다 새로 생긴 칸 */
  v.before.concat(v.after).forEach(function(pol){
    if(pol.start===undefined)pol.start='';
    if(pol.years===undefined)pol.years='';
    if(pol.premMan2===undefined)pol.premMan2='';
    if(!pol.cov)pol.cov={};
    if(!pol.cov2)pol.cov2={};
    if(pol.act===undefined)pol.act=(pol.keep===false)?'cancel':'keep';
  });
  return v;
}

function wonOfMan(v){            /* 담은 만원 값 → 칸에 보여 줄 <b>원</b> 글자 */
  var n=num(v); if(n===null)return '';

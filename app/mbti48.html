<!--
  성향검사 48 — 고객에게 링크로 보내는 페이지
  ────────────────────────────────────────────────────────────────
  앱 안의 검사(성향검사 48)와 같은 48문항·같은 채점이지만,
  이 파일은 혼자서 돕니다. 로그인도, 서버도 필요 없습니다.
  고객 휴대폰에서 열어 검사하고, 마지막에 결제까지 됩니다.

  보낼 때는 주소 뒤에 설계사 정보를 붙이면 화면에 같이 나옵니다.
    …/app/mbti48.html?agent=윤시현&tel=01012345678

  아래 CFG 만 채우면 결제가 열립니다(비워 두면 계좌이체 안내만 나옵니다).

<style>

p{margin:8px 0 0;font-size:13.5px;line-height:1.75;color:#6E6982}

.qnav{display:flex;gap:8px;margin-top:18px}
.qnav button{flex:1}

.code{font-size:42px;font-weight:900;letter-spacing:.08em;background:linear-gradient(120deg,#8B7BF0,#FF9EC4);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:6px}
.nick{font-size:17px;font-weight:900;margin-top:2px}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.bdg{font-size:11px;font-weight:800;border-radius:999px;padding:5px 11px;background:#F3F0FF;color:#7C6BE8}
.conf{position:absolute;width:9px;height:14px;border-radius:3px;animation:fall 2.4s ease-in forwards}
.note{border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.7;margin-top:12px}
.note.warn{background:#FFF6E9;color:#A8630F}
.note.bad{background:#FFF0F1;color:#C2405A}
.cap{font-size:14px;font-weight:900;margin:22px 2px 9px;display:flex;align-items:center;gap:7px}
.cap i{font-style:normal;background:#8B7BF0;color:#fff;font-size:11px;font-weight:900;border-radius:8px;padding:3px 8px}
.tbwrap{overflow-x:auto;border-radius:18px;box-shadow:0 8px 22px rgba(139,123,240,.1);background:#fff}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:460px}
th{background:#F5F2FF;color:#6F67A0;text-align:left;padding:11px 12px;font-size:11.5px;font-weight:900;white-space:nowrap}
td{padding:11px 12px;border-top:1px solid #F4F1FB;line-height:1.65;vertical-align:top;color:#55506A}
tbody tr:nth-child(even) td{background:#FDFCFF}
/* 좁은 화면에서는 표를 옆으로 밀지 않고 한 줄씩 카드처럼 편다 —

}
.mini{display:flex;align-items:center;gap:6px;margin-top:6px}

.pill{display:inline-block;font-size:10.5px;font-weight:900;border-radius:999px;padding:3px 9px;white-space:nowrap}

</style>

<script>

(function(){                        /* 주소 뒤에 붙여 보낸 값이 있으면 그것으로 */
  var q=location.search.replace(/^\?/,'').split('&');
  for(var i=0;i<q.length;i++){
    var kv=q[i].split('='); if(kv.length<2)continue;
    var k=decodeURIComponent(kv[0]), v=decodeURIComponent(kv[1].replace(/\+/g,' '));
    if(k==='agent')CFG.agent=v; if(k==='tel')CFG.tel=v;
    if(k==='bank')CFG.bank=v; if(k==='acct')CFG.account=v; if(k==='holder')CFG.holder=v;
    if(k==='key')CFG.tossKey=v; if(k==='price'&&+v>0)CFG.price=+v;
  }
})();

var MBTI_SCALE = [
  { v: 3,  t: '매우 그래요' },
  { v: 2,  t: '그래요' },

];

var MBTI_TIP = {
  E: '말로 풀어야 정리돼요. 결론은 함께 소리 내어 짚어주세요.',
  I: '재촉하지 말아주세요. 자료를 먼저 보고 혼자 생각할 시간이 필요해요.',
  S: '숫자·사례·서류부터. 큰 그림 이야기는 뒤로 미뤄주세요.',
  N: '큰 그림과 5년 뒤 이야기 먼저. 세부는 요약해서 주세요.',

  P: '선택지를 두세 개 남겨 두고 스스로 고르게 해주세요.'
};

var MBTI_Q = [
  { t: '처음 만난 자리에서도 내가 먼저 말을 건다.',              ax: 'EI', k: 1 },
  { t: '사람을 여럿 만나고 오면 오히려 기운이 난다.',            ax: 'EI', k: 1 },
  { t: '혼자 있는 시간이 있어야 머릿속이 정리된다.',             ax: 'EI', k: -1 },
  { t: '전화보다 문자로 정리해서 보내는 편이 편하다.',           ax: 'EI', k: -1 },

  SP:{body:'#FFD79A',dark:'#F5A623',belly:'#FFF3DF',name:'탐험가'}

function grp(c){ return c.charAt(1)==='N' ? (c.charAt(2)==='T'?'NT':'NF') : (c.charAt(3)==='J'?'SJ':'SP'); }
var PROPS={
  ISTJ:'📋',ISFJ:'🧸',INFJ:'🌙',INTJ:'🔭',ISTP:'🔧',ISFP:'🎨',INFP:'🌷',INTP:'🔎',
  ESTP:'⚡',ESFP:'🎈',ENFP:'🌟',ENTP:'💡',ESTJ:'📊',ESFJ:'🍰',ENFJ:'🌻',ENTJ:'👑'
};
function mascot(code,size){
  var g=grp(code), p=PAL[g], E=(code.charAt(0)==='E'), F=(code.charAt(2)==='F'), J=(code.charAt(3)==='J');

      '<circle cx="85" cy="70" r="8" fill="#3D3A50"/><circle cx="88" cy="67" r="2.8" fill="#fff"/>'

/* ── 채점 (앱과 같은 계산) ────────────────────────────────────── */
function clarity(r){
  if(r>=0.60)return {t:'아주 뚜렷',c:'#2E8B72',bg:'#E7F7F2'};
  if(r>=0.36)return {t:'뚜렷',c:'#7C6BE8',bg:'#F1EEFF'};
  if(r>=0.19)return {t:'보통',c:'#A8630F',bg:'#FFF4E6'};
  if(r>=0.07)return {t:'약함',c:'#B4720C',bg:'#FFF7EA'};
  return {t:'경계 · 둘 다',c:'#C2405A',bg:'#FFEFF1'};
}
function score(ans){
  var by={},i;
  for(i=0;i<MBTI_AXIS.length;i++)by[MBTI_AXIS[i].key]={sum:0,cnt:0};
  for(i=0;i<MBTI_Q.length;i++){var v=ans[i],q=MBTI_Q[i];if(!v)continue;by[q.ax].sum+=q.k*v;by[q.ax].cnt++;}
  var axes=MBTI_AXIS.map(function(a){
    var s=by[a.key].sum,max=by[a.key].cnt*3||1,pa=Math.round(((s+max)/(max*2))*100);
    if(pa>100)pa=100; if(pa<0)pa=0;
    var ratio=Math.abs(s)/max,cl=clarity(ratio),letter=s>=0?a.a:a.b;
    return {key:a.key,a:a.a,b:a.b,an:a.an,bn:a.bn,q:a.q,sum:s,max:max,cnt:by[a.key].cnt,
      pctA:pa,pctB:100-pa,letter:letter,other:s>=0?a.b:a.a,ratio:ratio,
      clarity:cl.t,cc:cl.c,cbg:cl.bg,border:cl.t.indexOf('경계')===0,tip:MBTI_TIP[letter]};
  });
  var pairs=MBTI_PAIR.map(function(p){
    var va=ans[p[0]],vb=ans[p[1]];
    if(!va||!vb)return {label:p[2],pct:null};
    return {label:p[2],pct:Math.round((1-Math.abs(va+vb)/6)*100)};
  });
  var done=pairs.filter(function(p){return p.pct!==null;});
  var cons=done.length?Math.round(done.reduce(function(s,p){return s+p.pct;},0)/done.length):0;
  return {axes:axes,code:axes.map(function(x){return x.letter;}).join(''),consistency:cons,pairs:pairs};
}
function consLabel(n){
  if(n>=90)return {t:'아주 일관됨',c:'#2E8B72',bg:'#E7F7F2'};
  if(n>=75)return {t:'일관됨',c:'#7C6BE8',bg:'#F1EEFF'};
  if(n>=60)return {t:'보통',c:'#A8630F',bg:'#FFF4E6'};
  return {t:'흔들림 · 다시 권장',c:'#C2405A',bg:'#FFEFF1'};
}

function confetti(){
  var host=$('crown');if(!host)return;
  var cols=['#FF9EC4','#8B7BF0','#FFD36E','#7FD6C0','#B7D3FF'];
  for(var i=0;i<22;i++){
    var d=document.createElement('i');
    d.className='conf';
    d.style.left=(4+Math.random()*92)+'%';
    d.style.background=cols[i%cols.length];

function start(){
  var v=($('nm')&&$('nm').value||'').replace(/^\s+|\s+$/g,'');
  if(!v){toast('이름을 알려주세요 🙂');if($('nm'))$('nm').focus();return;}
  ST.name=v;ST.ans={};ST.i=0;ST.res=null;ST.paid=false;ST.step='test';save();draw();
}
function resume(){var d=load();if(!d)return;ST.ans=d.ans||{};ST.name=d.name||'';ST.i=d.i||0;ST.step='test';draw();}
function openSaved(){var d=load();if(!d||!d.res)return;ST.res=d.res;ST.name=d.name;ST.paid=!!d.paid;ST.ans=d.ans||{};ST.step='result';draw();}
function reset(){
  ST={step:'intro',i:0,ans:{},name:ST.name,res:null,paid:false};
  try{localStorage.removeItem('mbti48');}catch(e){}
  draw();
}
function quit(){save();ST.step='intro';draw();toast('여기까지 저장했어요 🌸');}
function prev(){if(ST.i>0){ST.i--;save();draw();}}
function pick(v){
  ST.ans[ST.i]=v;save();
  var c=$('qcard');
  if(c){var bs=c.querySelectorAll('.dot');for(var n=0;n<bs.length;n++)bs[n].classList.toggle('on',MBTI_SCALE[n].v===v);}
  setTimeout(function(){
    if(ST.i>=47){finish();return;}
    ST.i++;save();draw();
  },230);
}
function finish(){
  var miss=[],i;
  for(i=0;i<48;i++)if(!ST.ans[i])miss.push(i);
  if(miss.length){ST.i=miss[0];save();draw();toast('아직 답하지 않은 문항이 '+miss.length+'개 있어요');return;}
  var sc=score(ST.ans);
  ST.res={code:sc.code,axes:sc.axes,consistency:sc.consistency,pairs:sc.pairs,ans:ST.ans,name:ST.name,at:new Date().toISOString()};
  ST.step='result';save();draw();
}

function tossReturn(){
  var q=location.search||'';
  function get(n){var m=q.match(new RegExp('[?&]'+n+'=([^&]*)'));return m?decodeURIComponent(m[1]):'';}
  var t=get('toss');if(!t)return;
  try{if(window.history&&history.replaceState)history.replaceState(null,'',location.pathname);}catch(e){}
  if(t!=='success'){toast('결제가 취소되었어요');return;}
  var d=load();if(d){ST.res=d.res;ST.name=d.name;ST.ans=d.ans||{};ST.paid=!!d.paid;if(d.res)ST.step='result';}
  var pk=get('paymentKey'),oid=get('orderId'),amt=get('amount');
  if(!(pk&&oid&&amt)){toast('결제 정보를 확인하지 못했어요');return;}
  toast('결제를 확인하는 중이에요…');
  fetch(CFG.confirmUrl,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({paymentKey:pk,orderId:oid,amount:Number(amt)})})
    .then(function(r){return r.ok;})
    .then(function(ok){
      if(ok)unlock();
      else toast('결제 승인을 확인하지 못했어요. 설계사에게 문의해 주세요.');
    })
    .catch(function(){toast('결제 확인 서버에 연결하지 못했어요. 설계사에게 문의해 주세요.');});
}

/* ── 배경 방울 ────────────────────────────────────────────────── */
(function(){
  var cols=['#FFD8EA','#DCD2FF','#CFEFE4','#D6E7FF','#FFEFC9'],h='';
  for(var i=0;i<9;i++){
    var sz=40+Math.random()*90;
    h+='<span style="width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*95)+'%;top:'+(Math.random()*92)+'%;background:'+cols[i%5]+';animation-delay:-'+(i*1.1)+'s"></span>';
  }
  $('sky').innerHTML=h;
})();

/* ── 시작 ─────────────────────────────────────────────────────── */
(function(){
  var d=load();
  if(d&&d.res){ST.res=d.res;ST.name=d.name||'';ST.paid=!!d.paid;ST.ans=d.ans||{};}
  else if(d){ST.name=d.name||'';}
  draw();
  tossReturn();
})();
</script>

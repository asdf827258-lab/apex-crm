<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APEX 전자책 · 처음 오신 분께</title>
<!-- 사실은 아래 둘에 있고, 쉬운 말은 easy.js 에만 있습니다. 여기서 다시 적지 않습니다. -->
<script src="plan.js"></script>
<script src="master.js"></script>
<script src="easy.js"></script>
<style>
:root{
  --blue:#3182F6;--blue-d:#1B64DA;--blue-l:#E8F3FF;
  --ink:#191F28;--ink-2:#333D4B;--ink-3:#4E5968;--ink-4:#8B95A1;--ink-5:#B0B8C1;
  --bg:#F2F4F6;--card:#fff;--line:#E5E8EB;--line-2:#F2F4F6;
  --red:#F04452;--red-l:#FFEBEE;--grn:#15C47E;--grn-l:#E8FAF3;
  --amb:#E8A31D;--amb-l:#FFF8E7;--pur:#7C5CFC;--pur-l:#F1EDFF;
  --r-lg:20px;--r:16px;--r-sm:12px;--r-xs:8px;
  --sh:0 1px 3px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,system-ui,"Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.85;letter-spacing:-.3px;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased}
b{font-weight:700}
.wrap{max-width:660px;margin:0 auto;padding:0 18px 120px}

/* 위 띠 */
.top{position:sticky;top:0;z-index:20;background:rgba(242,244,246,.92);backdrop-filter:blur(8px);
  padding:10px 0 8px;margin:0 -18px;padding-left:18px;padding-right:18px}
.tbar{display:flex;gap:8px;align-items:center}
.tbar .bk{font-size:13px;font-weight:700;color:var(--ink-4);margin-right:auto}
.pgs{height:4px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}
.pgs i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.mini-b{border:0;background:var(--card);color:var(--ink-3);border-radius:999px;padding:7px 13px;
  font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:var(--sh)}
.mini-b.on{background:var(--ink);color:#fff}

/* 표지 */
.cov{background:var(--card);border-radius:var(--r-lg);padding:44px 26px 34px;margin:14px 0 10px;
  box-shadow:var(--sh);text-align:center}
.cov .em{font-size:44px;line-height:1}
.cov h1{font-size:30px;font-weight:800;letter-spacing:-1.3px;margin:16px 0 0;line-height:1.32;text-wrap:balance}
.cov .s{font-size:16px;color:var(--ink-3);margin-top:14px;line-height:1.8}
.cov .who{display:inline-block;margin-top:18px;background:var(--blue-l);color:var(--blue-d);
  border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:700}

/* 목차 */
.toc{background:var(--card);border-radius:var(--r-lg);padding:8px 6px;box-shadow:var(--sh);margin-bottom:10px}
.tci{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r);cursor:pointer;
  border-top:1px solid var(--line-2)}
.tci:first-child{border-top:0}
.tci:hover{background:var(--bg)}
.tci .no{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--ink-4);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;
  font-variant-numeric:tabular-nums}
.tci.done .no{background:var(--grn);color:#fff}
.tci .tt{flex:1 1 auto;font-size:16px;font-weight:700;letter-spacing:-.5px}
.tci .tn{font-size:12.5px;color:var(--ink-4);font-weight:600}

/* 장 */
.ch{margin-top:26px}
.chh{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.chh .cn{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:0}
.chh h2{font-size:25px;font-weight:800;letter-spacing:-1.1px;margin:0;line-height:1.35;text-wrap:balance}
.chl{font-size:16px;color:var(--ink-3);margin:6px 0 16px;line-height:1.8}

/* 꼭지 */
.sec{background:var(--card);border-radius:var(--r-lg);padding:22px;margin-bottom:10px;box-shadow:var(--sh)}
.sec>h3{font-size:19px;font-weight:800;letter-spacing:-.7px;margin:0 0 4px;line-height:1.4}
.sec .body{font-size:16px;line-height:1.9;color:var(--ink-2)}
.sec .body p{margin:12px 0}
.sec .body ul{margin:10px 0;padding-left:20px}
.sec .body li{margin-bottom:8px}
.hd-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.hd-row>h3{flex:1 1 auto;margin:0}
.hardb{flex:0 0 auto;border:0;background:var(--bg);color:var(--ink-3);border-radius:999px;
  padding:7px 12px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.hardb:hover{background:var(--amb-l);color:#8A6206}
.hardb.on{background:var(--amb);color:#fff}
.easy{background:var(--amb-l);color:#7A5600;border-radius:var(--r);padding:16px 17px;margin-top:12px;
  font-size:15.5px;line-height:1.85}
.easy .lb{display:block;font-size:12px;font-weight:800;color:#B47C0A;margin-bottom:5px}

/* 어려운 낱말 */
.tm{text-decoration:none;border-bottom:2px dotted var(--blue);cursor:pointer;color:inherit;
  padding-bottom:1px}
.tm:hover{background:var(--blue-l)}

/* 아래에서 올라오는 뜻풀이 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-radius:22px 22px 0 0;padding:22px 20px 30px;box-shadow:0 -8px 32px rgba(0,0,0,.16);
  transform:translateY(110%);transition:transform .22s ease;max-height:70vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet .gr{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px}
.sheet .w{font-size:21px;font-weight:800;letter-spacing:-.7px}
.sheet .m{font-size:16px;line-height:1.85;color:var(--ink-2);margin-top:10px}
.sheet .cl{width:100%;margin-top:18px;border:0;background:var(--bg);color:var(--ink-2);
  border-radius:var(--r);padding:14px;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer}
.scrim{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;
  transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}

/* 사진과 그림 */
figure{margin:14px 0;background:var(--bg);border-radius:var(--r);padding:12px;overflow:hidden}
figure img{width:100%;display:block;border-radius:var(--r-sm);background:#fff}
figure svg{width:100%;height:auto;display:block;border-radius:var(--r-sm);background:#fff}
figcaption{font-size:13.5px;color:var(--ink-4);margin-top:9px;line-height:1.7}

/* 그 화면으로 바로 가는 단추 */
.opens{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.op{display:inline-flex;align-items:center;gap:5px;border:0;background:var(--blue);color:#fff;
  border-radius:999px;padding:10px 15px;font-size:14px;font-weight:700;text-decoration:none;
  letter-spacing:-.3px;box-shadow:0 2px 8px rgba(49,130,246,.25)}
.op:active{background:var(--blue-d)}
.op.g{background:var(--card);color:var(--ink-2);box-shadow:var(--sh)}
.opl{font-size:12px;font-weight:800;color:var(--ink-4);margin-top:14px}

/* 쌓기 — 하나씩 쌓여 가는 것을 눈으로 봅니다 */
.stack{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
.stack i{width:20px;height:20px;border-radius:6px;background:var(--line);display:block}
.stack i.on{background:var(--grn)}
.stack i.now{background:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.stkm{font-size:13.5px;color:var(--ink-3);font-weight:600}

/* 표·조각 */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:14.5px;background:var(--bg);
  border-radius:var(--r);overflow:hidden}
th,td{border:0;border-bottom:1px solid var(--card);padding:12px 13px;text-align:left;
  vertical-align:top;line-height:1.7}
th{background:var(--card);font-weight:700;font-size:13px;color:var(--ink-3);white-space:nowrap}
tr:last-child td{border-bottom:0}
.li{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line-2)}
.li:first-child{border-top:0}
.li .bul{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--blue-l);
  color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-size:12.5px;
  font-weight:800;font-variant-numeric:tabular-nums}
.li .bul.g{background:var(--grn-l);color:#0A9D63} .li .bul.r{background:var(--red-l);color:#D93B48}
.li .bul.p{background:var(--pur-l);color:#6242E0} .li .bul.a{background:var(--amb-l);color:#B47C0A}
.li .tx{flex:1 1 auto;min-width:0}
.li .tx b.h{display:block;font-size:16px;font-weight:700;letter-spacing:-.4px;line-height:1.5}
.li .tx .d{font-size:15px;color:var(--ink-3);margin-top:4px;line-height:1.8}
.warn{background:var(--red-l);color:#B4323D;border-radius:var(--r);padding:15px 16px;margin-top:12px;
  font-size:15px;line-height:1.8}
.good{background:var(--grn-l);color:#08825A;border-radius:var(--r);padding:15px 16px;margin-top:12px;
  font-size:15px;line-height:1.8}
.quo{background:var(--blue-l);color:var(--blue-d);border-radius:var(--r);padding:14px 16px;
  margin:10px 0;font-size:16px;font-weight:600;line-height:1.75}
.kv{font-size:12px;font-weight:800;color:var(--ink-4);margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips span{background:var(--bg);border-radius:var(--r-xs);padding:5px 11px;font-size:13px;
  font-weight:600;color:var(--ink-3)}
.chips .num{background:var(--ink);color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.seq{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.seq b{background:var(--bg);color:var(--ink-2);border-radius:var(--r-xs);padding:7px 11px;
  font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.seq i{font-style:normal;color:var(--ink-5)}

/* 장 끝 */
.foot{display:flex;gap:8px;margin:16px 0 8px;flex-wrap:wrap}
.nb{flex:1 1 130px;border:0;background:var(--card);color:var(--ink-2);border-radius:var(--r);
  padding:16px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:var(--sh);
  letter-spacing:-.4px}
.nb.p{background:var(--blue);color:#fff;box-shadow:none}
.nb.d{background:var(--grn);color:#fff;box-shadow:none}
.nb:disabled{opacity:.4;cursor:default}
.prt{position:fixed;right:16px;bottom:16px;z-index:15;border:0;background:var(--ink);color:#fff;
  border-radius:999px;padding:13px 20px;font-size:14px;font-weight:700;font-family:inherit;
  cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.24)}
.empty{color:var(--ink-4);font-size:15px}

@media print{
  .top,.prt,.foot,.sheet,.scrim,.hardb,.toc{display:none!important}
  body{background:#fff;font-size:11pt}
  .wrap{max-width:none;padding:0}
  .sec,.cov{box-shadow:none;border:1px solid #DDD;break-inside:avoid}
  .ch{break-before:page}
  .tm{border-bottom:1px dotted #999}
  .easy{background:#fff;border:1px solid #DDD}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top"><div class="tbar">
    <span class="bk" id="bk">APEX 전자책</span>
    <button class="mini-b" id="tocb">목차</button>
    <button class="mini-b" id="hardl">어려웠던 곳</button>
  </div><div class="pgs"><i id="pgi"></i></div></div>
  <div id="pane"></div>
</div>

<button class="prt" id="prt">🖨 인쇄</button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shw">
  <div class="gr"></div><div class="w" id="shw"></div><div class="m" id="shm"></div>
  <button class="cl" id="shc">닫기</button>
</div>

<script>
(function(){
var P=window.EDU_PLAN, M=window.EDU_MASTER, E=window.EDU_EASY;
var KEY='apex_edu_book';
function ls(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function save(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function st(){var o=ls();o.read=o.read||{};o.hard=o.hard||{};return o;}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rich(s){return esc(s).replace(/&lt;(\/?b)&gt;/g,'<$1>');}

/* 어려운 낱말에 점선을 긋는다 — 태그 밖 글자에만, 한 꼭지에서 처음 한 번만 */
var TERMS=Object.keys(E.terms).sort(function(a,b){return b.length-a.length;});
function termify(html,seen){
  var parts=html.split(/(<[^>]*>)/);
  for(var i=0;i<parts.length;i+=2){
    var t=parts[i]; if(!t) continue;
    for(var k=0;k<TERMS.length;k++){
      var w=TERMS[k]; if(seen[w]) continue;
      var at=t.indexOf(w); if(at<0) continue;
      t=t.slice(0,at)+'<u class="tm" data-tm="'+esc(w)+'">'+esc(w)+'</u>'+t.slice(at+w.length);
      seen[w]=1;
    }
    parts[i]=t;
  }
  return parts.join('');
}
function R(s,seen){return termify(rich(s),seen||{});}

/* ── 그림은 손으로 그립니다 (CLAUDE.md 9) ── */
var C={b:'#3182F6',bl:'#E8F3FF',g:'#15C47E',gl:'#E8FAF3',r:'#F04452',rl:'#FFEBEE',
  a:'#E8A31D',al:'#FFF8E7',p:'#7C5CFC',pl:'#F1EDFF',k:'#191F28',m:'#8B95A1',ln:'#E5E8EB'};
function sv(w,h,inner){return '<svg viewBox="0 0 '+w+' '+h+'" role="img" xmlns="http://www.w3.org/2000/svg">'+
  '<style>.t{font:600 13px -apple-system,sans-serif;fill:'+C.k+'}.s{font:600 11px -apple-system,sans-serif;fill:'+C.m+'}'+
  '.n{font:800 17px -apple-system,sans-serif;fill:'+C.k+'}.w{font:800 13px -apple-system,sans-serif;fill:#fff}</style>'+
  inner+'</svg>';}
var FIG={
 funnel:function(){
   var L=[['TD','받은 명단',C.ln,230],['TA','전화한 것',C.bl,180],['AP','약속 잡힌 것',C.b,130],['PC','계약된 것',C.g,80]];
   var h='',y=18;
   for(var i=0;i<L.length;i++){
     var x=(340-L[i][3])/2;
     h+='<rect x="'+x+'" y="'+y+'" width="'+L[i][3]+'" height="42" rx="10" fill="'+L[i][2]+'"/>'+
        '<text x="170" y="'+(y+26)+'" text-anchor="middle" class="'+(i>1?'w':'t')+'">'+L[i][0]+' · '+L[i][1]+'</text>';
     if(i<3) h+='<path d="M170 '+(y+44)+' l-6 0 6 10 6 -10 z" fill="'+C.m+'"/>';
     y+=58;
   }
   return sv(340,y-10,h)+'';
 },
 wallet:function(){
   var N=['생활','병원비','치료비','소득공백','가족보호','은퇴연금','간병','자산이전'],h='';
   for(var i=0;i<8;i++){
     var x=14+(i%4)*82, y=16+Math.floor(i/4)*76;
     var weak=(i===3||i===6);
     h+='<rect x="'+x+'" y="'+y+'" width="70" height="60" rx="12" fill="'+(weak?C.rl:C.bl)+'"/>'+
        '<text x="'+(x+35)+'" y="'+(y+28)+'" text-anchor="middle" class="s">통장 '+(i+1)+'</text>'+
        '<text x="'+(x+35)+'" y="'+(y+46)+'" text-anchor="middle" class="t" style="font-size:11.5px">'+N[i]+'</text>';
   }
   h+='<text x="170" y="180" text-anchor="middle" class="s">붉은 칸이 지금 비어 있는 곳이에요</text>';
   return sv(340,192,h);
 },
 gap:function(){
   var h='<rect x="14" y="30" width="312" height="26" rx="8" fill="'+C.gl+'"/>'+
     '<text x="20" y="48" class="s">평소 — 소득이 들어옵니다</text>'+
     '<rect x="90" y="74" width="150" height="26" rx="8" fill="'+C.rl+'"/>'+
     '<text x="165" y="92" text-anchor="middle" class="s">일을 못 하는 동안</text>'+
     '<rect x="14" y="74" width="72" height="26" rx="8" fill="'+C.gl+'"/>'+
     '<rect x="244" y="74" width="82" height="26" rx="8" fill="'+C.gl+'"/>'+
     '<text x="165" y="126" text-anchor="middle" class="t">진단금은 한 번, 생활비는 매달</text>'+
     '<text x="165" y="148" text-anchor="middle" class="s">이 붉은 구간이 「소득공백」이에요</text>';
   return sv(340,164,h);
 },
 baba:function(){
   var h='<text x="80" y="22" text-anchor="middle" class="t">지금</text>'+
     '<text x="260" y="22" text-anchor="middle" class="t">바꾼 뒤</text>'+
     '<rect x="30" y="34" width="100" height="70" rx="12" fill="'+C.ln+'"/>'+
     '<text x="80" y="66" text-anchor="middle" class="s">보험료</text>'+
     '<text x="80" y="88" text-anchor="middle" class="n">높음</text>'+
     '<rect x="210" y="52" width="100" height="52" rx="12" fill="'+C.bl+'"/>'+
     '<text x="260" y="76" text-anchor="middle" class="s">보험료</text>'+
     '<text x="260" y="96" text-anchor="middle" class="n">낮음</text>'+
     '<rect x="30" y="116" width="100" height="40" rx="12" fill="'+C.rl+'"/>'+
     '<text x="80" y="141" text-anchor="middle" class="s">버티는 힘 약함</text>'+
     '<rect x="210" y="112" width="100" height="48" rx="12" fill="'+C.gl+'"/>'+
     '<text x="260" y="141" text-anchor="middle" class="s">버티는 힘 강함</text>'+
     '<text x="170" y="182" text-anchor="middle" class="s">「뭘 뺐나」가 아니라 이 두 가지가 어떻게 변했나를 봅니다</text>';
   return sv(340,196,h);
 },
 weekday:function(){
   var D=[['월','명단',C.bl],['화','전화',C.gl],['수','상담',C.pl],['목','결정',C.al],['금','정리',C.ln]],h='';
   for(var i=0;i<5;i++){
     var x=14+i*64;
     h+='<rect x="'+x+'" y="18" width="56" height="72" rx="12" fill="'+D[i][2]+'"/>'+
        '<text x="'+(x+28)+'" y="46" text-anchor="middle" class="n">'+D[i][0]+'</text>'+
        '<text x="'+(x+28)+'" y="70" text-anchor="middle" class="s">'+D[i][1]+'</text>';
   }
   h+='<text x="170" y="112" text-anchor="middle" class="s">매일 똑같이 하면 한 주가 그냥 흘러가요</text>';
   return sv(340,124,h);
 },
 month4:function(){
   var W=[['1주','채운다',C.gl],['2주','연다',C.pl],['3주','닫는다',C.al],['4주','심는다',C.bl]],h='';
   for(var i=0;i<4;i++){
     var x=14+i*80;
     h+='<rect x="'+x+'" y="20" width="70" height="58" rx="12" fill="'+W[i][2]+'"/>'+
        '<text x="'+(x+35)+'" y="44" text-anchor="middle" class="s">'+W[i][0]+'</text>'+
        '<text x="'+(x+35)+'" y="64" text-anchor="middle" class="t">'+W[i][1]+'</text>';
     if(i<3) h+='<path d="M'+(x+72)+' 49 l0 -5 8 5 -8 5 z" fill="'+C.m+'"/>';
   }
   h+='<text x="170" y="100" text-anchor="middle" class="s">다음 달 1주는 이번 달 4주에 만들어집니다</text>';
   return sv(340,112,h);
 },
 stack:function(){
   /* 아래에서 위로 쌓입니다 — 맨 아래가 처음 밟는 칸입니다 */

function figOf(key){
  var f=E.figs&&E.figs[key]; if(!f||!FIG[f])return '';
  return '<figure>'+FIG[f]()+'</figure>';
}
function picOf(key){
  var p2=E.pics&&E.pics[key]; if(!p2)return '';
  return '<figure><img src="'+esc(p2[0])+'" alt="'+esc(p2[1])+'" loading="lazy">'+
    '<figcaption>'+rich(p2[1])+'</figcaption></figure>';
}
/* 그 화면으로 바로 갑니다 — 앱 안에서든 새 탭에서든 */
function opens(ids,label){
  if(!ids||!ids.length) return '';
  var h='<div class="opl">'+esc(label||'여기서 바로 열 수 있어요')+'</div><div class="opens">';
  for(var i=0;i<ids.length;i++){
    var nm=P.screens[ids[i]]; if(!nm) continue;
    h+='<a class="op'+(i?' g':'')+'" target="_top" href="../index.html?go='+
       encodeURIComponent(ids[i])+'">'+esc(nm)+'</a>';
  }
  return h+'</div>';
}

/* 꼭지 하나 — 「어려워요」 단추가 붙는다 */
function sec(key,title,body){
  var o=st(), on=!!o.hard[key];
  var note=E.notes[key];
  return '<div class="sec" id="sec-'+key+'">'+
    (title?('<div class="hd-row"><h3>'+R(title)+'</h3>'+
      (note?'<button class="hardb'+(on?' on':'')+'" data-hard="'+esc(key)+'">'+
        (on?'✓ 표시함':'🙋 어려워요')+'</button>':'')+'</div>'):'')+
    '<div class="body">'+body+figOf(key)+picOf(key)+'</div>'+
    (on&&note?'<div class="easy"><span class="lb">쉽게 말하면요</span>'+rich(note)+'</div>':'')+
  '</div>';
}
function li(bul,cls,head,desc,seen){
  return '<div class="li"><span class="bul '+(cls||'')+'">'+esc(bul)+'</span><div class="tx">'+
    '<b class="h">'+R(head,seen)+'</b>'+(desc?'<div class="d">'+R(desc,seen)+'</div>':'')+'</div></div>';
}

V.ses=function(){
  var s={}, h='';
  P.sessions.forEach(function(x){
    var q={};
    h+=sec('ses',x.when+' · '+x.title,
      '<p>'+R(x.why,q)+'</p>'+
      x.flow.map(function(f){return li(f[0],'g',f[1],f[2],q);}).join('')+
      (x.blanks?'<div class="kv">내가 채우는 칸</div>'+
        x.blanks.map(function(z){return li(z[0],'a',z[1],z[2],q);}).join(''):'')+
      (x.calc?'<div class="kv">계산</div><div class="good">'+x.calc.map(esc).join('<br>')+'</div>':'')+
      (x.sheet?'<div class="kv">소식지 여섯 칸</div><div class="chips">'+
        x.sheet.map(function(z){return '<span>'+esc(z)+'</span>';}).join('')+'</div>':'')+
      (x.rules?'<div class="warn"><b>지키는 것</b><br><br>'+
        x.rules.map(function(z){return '· '+R(z,q);}).join('<br><br>')+'</div>':''));
  });
  return h;
};
V.law=function(){
  var s={};
  return '<div class="chl">'+rich(E.lead.c8)+'</div>'+
    sec('law','고객에게 나가는 것에 꼭 붙는 말',
      '<p>아래가 빠져 있으면 <b>나가기 전에</b> 되돌립니다. 나간 자료는 못 되돌려요.</p>'+
      '<div class="warn">'+P.compliance.map(function(x){return '· '+R(x,s);}).join('<br><br>')+'</div>')+
    sec('','마지막으로',
      '<div class="quo">보장과 지급은 약관과 심사 결과에 따릅니다.</div>'+
      '<p>이 한 줄을 빼지 않는 것이 <b>고객을 지키고 저를 지킵니다.</b></p>');
};
V.dict=function(){
  var h='<div class="chl">'+rich(E.lead.c9)+'</div>'+
    '<div class="sec"><div class="body">';
  Object.keys(E.terms).forEach(function(w){
    h+='<div class="li"><span class="bul">가</span><div class="tx"><b class="h">'+esc(w)+'</b>'+
       '<div class="d">'+rich(E.terms[w])+'</div></div></div>';
  });
  return h+'</div></div>';
};
V.mine=function(){
  var o=st(), keys=Object.keys(o.hard).filter(function(k){return o.hard[k];});
  var h='<div class="chl">「어려워요」를 누르신 자리가 여기 모입니다. '+
    '<b>이 목록을 매니저에게 보여 주세요.</b> 모르는 건 흠이 아니에요.</div>';
  if(!keys.length) return h+'<div class="sec"><div class="body empty">아직 없습니다. '+
    '읽다가 막히면 꼭지 오른쪽 위 <b>「🙋 어려워요」</b>를 눌러 두세요.</div></div>';
  h+='<div class="sec"><div class="body">';
  keys.forEach(function(k){
    h+='<div class="li"><span class="bul a">?</span><div class="tx"><b class="h">'+esc(nameOf(k))+'</b>'+
      '<div class="d">'+rich(E.notes[k]||'')+'</div></div></div>';
  });
  h+='</div></div><div class="foot"><button class="nb" data-clr="1">표시 모두 지우기</button></div>';
  return h;
};
function nameOf(k){
  if(/^m\d\d$/.test(k)){
    var c=M.cards.filter(function(x){return x.n===k.slice(1);})[0];
    return 'MASTER '+k.slice(1)+' · '+(c?c.kr:'');
  }
  var map={creed:'우리 팀의 약속',never:'우리가 하지 않는 일',arc:'신입 — 어디로 가는지',
   career:'경력 — 어디로 가는지',first:'첫 주에 할 세 가지',gate:'게이트',master:'서른 장이 하는 일',
   play:'이럴 땐 뭘 쓰나요',week:'요일마다 하는 일',month:'한 달 네 주',cal:'달력',study:'공부',
   goal:'내 목표',lead:'지점장',edu:'교육매니저',meet:'월·목 조회',cover:'막혔다고 할 때',
   ses:'세션 카드',law:'꼭 지키는 것',read:'이 책을 읽는 법',final:'마지막 시험'};
  return map[k]||k;
}
function tbl(head,rows,seen){
  return '<div class="tw"><table><tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>'+
    rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+R(c,seen)+'</td>';}).join('')+'</tr>';}).join('')+
    '</table></div>';
}
function tocHtml(){
  var o=st();
  return '<div class="toc" id="toc">'+CH.slice(1).map(function(c,i){
    return '<div class="tci'+(o.read[c.k]?' done':'')+'" data-go="'+c.k+'">'+
      '<span class="no">'+(o.read[c.k]?'✓':(i+1))+'</span>'+
      '<span class="tt">'+esc(c.t)+'</span>'+
      '<span class="tn">'+(o.read[c.k]?'읽음':'')+'</span></div>';
  }).join('')+'</div>';
}

function paint(){
  var i=CH.map(function(c){return c.k;}).indexOf(cur), c=CH[i], o=st();
  var body=(V[cur]||function(){return '';})();
  var head=(cur==='cover')?'':'<div class="ch"><div class="chh">'+
    '<span class="cn">'+(i)+'장</span><h2>'+esc(c.t)+'</h2></div></div>';
  var foot='';
  if(cur!=='cover'){
    foot='<div class="foot">'+
      (i>1?'<button class="nb" data-go="'+CH[i-1].k+'">← '+esc(CH[i-1].t)+'</button>':'')+
      '<button class="nb '+(o.read[cur]?'d':'')+'" data-read="'+cur+'">'+
        (o.read[cur]?'✓ 읽었어요':'다 읽었어요')+'</button>'+
      (i<CH.length-1?'<button class="nb p" data-go="'+CH[i+1].k+'">'+esc(CH[i+1].t)+' →</button>':'')+
      '</div>';
  }
  document.getElementById('pane').innerHTML=head+body+foot;
  document.getElementById('bk').textContent=(cur==='cover')?'APEX 전자책':(i+'장 · '+c.t);
  var n=0; CH.forEach(function(x){if(o.read[x.k])n++;});
  document.getElementById('pgi').style.width=Math.round(n/CH.length*100)+'%';
  window.scrollTo(0,0);
}

/* 한 곳에서 받는다 */
document.body.addEventListener('click',function(e){
  var el=e.target.closest('[data-go],[data-hard],[data-tm],[data-read],[data-clr]');
  if(!el) return;
  var v;
  if((v=el.getAttribute('data-go'))){cur=v;try{location.hash=v;}catch(x){}return paint();}
  if((v=el.getAttribute('data-hard'))){var o=st();o.hard[v]=!o.hard[v];save(o);return paint();}
  if((v=el.getAttribute('data-read'))){var o2=st();o2.read[v]=!o2.read[v];save(o2);return paint();}
  if(el.hasAttribute('data-clr')){var o3=st();o3.hard={};save(o3);return paint();}
  if((v=el.getAttribute('data-tm'))) return openSheet(v,E.terms[v]);
});
function openSheet(w,m){
  document.getElementById('shw').textContent=w;
  document.getElementById('shm').innerHTML=rich(m||'');
  document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}
document.getElementById('shc').addEventListener('click',closeSheet);
document.getElementById('scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
document.getElementById('tocb').addEventListener('click',function(){cur='cover';try{location.hash='cover';}catch(x){}paint();});
document.getElementById('hardl').addEventListener('click',function(){cur='mine';try{location.hash='mine';}catch(x){}paint();});
document.getElementById('prt').addEventListener('click',function(){
  /* 인쇄는 전부 폅니다 — 종이는 처음부터 끝까지 읽는 물건입니다 */
  var all=''; CH.forEach(function(c,i){
    all+=(i?'<div class="ch"><div class="chh"><span class="cn">'+i+'장</span><h2>'+esc(c.t)+'</h2></div></div>':'')+
      ((V[c.k]||function(){return '';})());
  });
  document.getElementById('pane').innerHTML=all;
  setTimeout(function(){window.print();setTimeout(paint,300);},60);
});
window.addEventListener('hashchange',function(){
  var h=(location.hash||'').replace('#','');
  if(h&&h!==cur&&CH.some(function(c){return c.k===h;})){cur=h;paint();}
});
paint();
})();
</script>

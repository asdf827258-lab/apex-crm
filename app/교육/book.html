<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APEX 전자책 · 처음 오신 분께</title>
<!-- 사실은 아래 넷에 있습니다. 여기는 그리기만 합니다. -->
<script src="plan.js"></script>
<script src="master.js"></script>
<script src="easy.js"></script>
<script src="ment.js"></script>
<style>
/* ══════════════ 부품 ══════════════
   토스는 색이 아니라 <b>부품</b>입니다. 여기서 지키는 넷 —

     1. <b>한 화면에 한 가지.</b> 스크롤 한 번에 결론 하나.
     2. <b>표를 쓰지 않습니다.</b> 표는 폰에서 못 읽습니다. 「줄」로 풉니다 —
        왼쪽 배지 · 가운데 글 · 오른쪽 화살표.
     3. <b>홈에서 눌러 들어가고, 왼쪽 위로 나옵니다.</b> 칸을 위에 늘어놓지 않습니다.
     4. <b>다음 할 일은 아래 고정.</b> 손가락이 닿는 자리에 하나만 둡니다.        */
:root{
  --blue:#3182F6;--blue-d:#1B64DA;--blue-l:#E8F3FF;
  --ink:#191F28;--ink-2:#333D4B;--ink-3:#4E5968;--ink-4:#8B95A1;--ink-5:#B0B8C1;
  --bg:#F2F4F6;--card:#fff;--line:#E5E8EB;--line-2:#F2F4F6;
  --red:#F04452;--red-l:#FFEBEE;--grn:#15C47E;--grn-l:#E8FAF3;
  --amb:#E8A31D;--amb-l:#FFF8E7;--pur:#7C5CFC;--pur-l:#F1EDFF;
  --r:20px;--r-s:14px;--r-xs:10px;
  --sh:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.05);
  --pad:20px; --nav:56px; --cta:84px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{--fs:17px}
html[data-fs="l"]{--fs:19px}
html[data-fs="xl"]{--fs:21px}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,system-ui,"Malgun Gothic",sans-serif;
  font-size:var(--fs);line-height:1.75;letter-spacing:-.3px;word-break:keep-all;
  overflow-wrap:break-word;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
b{font-weight:700}
.wrap{max-width:660px;margin:0 auto;padding:0 var(--pad) var(--cta)}

/* ── 위 띠 : 뒤로 · 제목 · 글자크기 ── */
.nav{position:sticky;top:0;z-index:30;background:rgba(242,244,246,.94);backdrop-filter:blur(10px);
  margin:0 calc(var(--pad)*-1);padding:0 var(--pad);height:var(--nav);display:flex;align-items:center;gap:10px}
.bk{border:0;background:transparent;font-family:inherit;font-size:22px;line-height:1;color:var(--ink);
  cursor:pointer;padding:6px 8px 6px 0;margin-left:-4px}
.nt{flex:1 1 auto;min-width:0;font-size:.85em;font-weight:700;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsg{display:inline-flex;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--sh);flex:0 0 auto}
.fsb{border:0;background:transparent;color:var(--ink-4);border-radius:999px;padding:3px 9px;
  font-family:inherit;font-weight:800;cursor:pointer;line-height:1.4}
.fsb:nth-child(1){font-size:12px}.fsb:nth-child(2){font-size:14px}.fsb:nth-child(3){font-size:16.5px}
.fsb.on{background:var(--ink);color:#fff}
.bar{height:3px;background:var(--line);margin:0 calc(var(--pad)*-1)}
.bar i{display:block;height:100%;background:var(--blue);transition:width .35s}

/* ── 인사 ── */
.hi{padding:34px 0 6px}
.hi h1{font-size:1.85em;font-weight:800;letter-spacing:-1.1px;line-height:1.32;margin:0;text-wrap:balance}
.hi p{font-size:1em;color:var(--ink-3);margin:14px 0 0;line-height:1.85}

/* ── 큰 숫자 ── */
.stat{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--sh);margin:16px 0 10px}
.stat .k{font-size:.82em;font-weight:700;color:var(--ink-4)}
.stat .v{font-size:2.3em;font-weight:800;letter-spacing:-1.6px;line-height:1.1;margin-top:6px;
  font-variant-numeric:tabular-nums}
.stat .v small{font-size:.42em;font-weight:700;color:var(--ink-4);letter-spacing:-.3px}
.stat .pg{height:8px;border-radius:99px;background:var(--line-2);margin-top:14px;overflow:hidden}
.stat .pg i{display:block;height:100%;background:var(--grn);border-radius:99px;transition:width .35s}
.stat .m{font-size:.85em;color:var(--ink-3);margin-top:10px;line-height:1.7}

/* ── 줄 (표를 대신합니다) ── */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin:10px 0}
.row{display:flex;gap:14px;align-items:center;padding:16px 18px;border-top:1px solid var(--line-2);
  background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;
  font-family:inherit;color:inherit;cursor:default}
.row:first-child{border-top:0}
button.row,a.row{cursor:pointer}
button.row:active,a.row:active{background:var(--line-2)}
.bd{flex:0 0 auto;min-width:36px;height:36px;padding:0 9px;border-radius:999px;background:var(--bg);
  color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:800;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.bd.b{background:var(--blue-l);color:var(--blue-d)} .bd.g{background:var(--grn);color:#fff}
.bd.r{background:var(--red-l);color:#D93B48}  .bd.p{background:var(--pur-l);color:#6242E0}
.bd.a{background:var(--amb-l);color:#B47C0A}  .bd.k{background:var(--ink);color:#fff}
.tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.tx .t{display:block;font-size:1em;font-weight:700;line-height:1.5;letter-spacing:-.4px}
.tx .s{display:block;font-size:.86em;color:var(--ink-3);line-height:1.6;letter-spacing:-.2px}
.ar{flex:0 0 auto;color:var(--ink-5);font-size:1.1em;line-height:1}
.row.done .tx .t{color:var(--ink-5)}

/* ── 글 ── */
.sec{background:var(--card);border-radius:var(--r);padding:24px 22px;box-shadow:var(--sh);margin:10px 0}
.sec>h3{font-size:1.2em;font-weight:800;letter-spacing:-.7px;margin:0 0 10px;line-height:1.45}
.sec .body{font-size:1em;line-height:2;color:var(--ink-2)}
.sec .body p{margin:1em 0}
.sec .body p:first-child{margin-top:0}
.sec .body ul,.sec .body ol{margin:.9em 0;padding-left:20px}
.sec .body li{margin-bottom:.55em}
.hd-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.hd-row>h3{flex:1 1 auto;margin:0}
.hardb{flex:0 0 auto;border:0;background:var(--bg);color:var(--ink-3);border-radius:999px;
  padding:8px 13px;font-size:.76em;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.hardb.on{background:var(--amb);color:#fff}
.easy{background:var(--amb-l);color:#7A5600;border-radius:var(--r-s);padding:18px;margin-top:14px;
  font-size:1em;line-height:1.95}
.easy .lb{display:block;font-size:.72em;font-weight:800;color:#B47C0A;margin-bottom:6px}
.kv{font-size:.74em;font-weight:800;color:var(--ink-4);margin:1.5em 0 .4em}
.kv:first-child{margin-top:0}
.quo{background:var(--blue-l);color:var(--blue-d);border-radius:var(--r-s);padding:17px 19px;
  margin:12px 0;font-size:1.03em;font-weight:600;line-height:1.85}
.warn{background:var(--red-l);color:#B4323D;border-radius:var(--r-s);padding:17px 19px;margin:12px 0;
  font-size:.97em;line-height:1.9}
.good{background:var(--grn-l);color:#08825A;border-radius:var(--r-s);padding:17px 19px;margin:12px 0;
  font-size:.97em;line-height:1.9}
.mini{font-size:.8em;color:var(--ink-4);line-height:1.7}
.clr{border:0;background:var(--bg);color:var(--ink-3);border-radius:var(--r-s);padding:14px 18px;
  font-family:inherit;font-size:.9em;font-weight:700;cursor:pointer;margin-top:12px;width:100%}
.head{font-size:1.5em;font-weight:800;letter-spacing:-1px;line-height:1.35;margin:24px 0 6px;text-wrap:balance}
.lede{font-size:1em;color:var(--ink-3);line-height:1.9;margin:0 0 18px}
.grp{font-size:.8em;font-weight:800;color:var(--ink-4);margin:30px 0 8px;padding-left:2px}

/* ── 어려운 낱말 ── */
.tm{border-bottom:2px dotted var(--blue);cursor:pointer;color:inherit;padding-bottom:1px}

/* ── 아래에서 올라오는 창 ── */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-radius:24px 24px 0 0;padding:10px 20px calc(28px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 32px rgba(0,0,0,.18);transform:translateY(110%);transition:transform .24s ease;
  max-height:76vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet .gr{width:40px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 18px}
.sheet .w{font-size:1.3em;font-weight:800;letter-spacing:-.7px}
.sheet .m{font-size:1em;line-height:1.95;color:var(--ink-2);margin-top:12px}
.sheet .cl{width:100%;margin-top:20px;border:0;background:var(--bg);color:var(--ink-2);
  border-radius:var(--r-s);padding:16px;font-size:1em;font-weight:700;font-family:inherit;cursor:pointer}
.scrim{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;
  transition:opacity .24s}
.scrim.on{opacity:1;pointer-events:auto}

/* ── 아래 고정 · 다음 할 일 하나 ── */
.cta{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px var(--pad)
  calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(242,244,246,0),rgba(242,244,246,.96) 34%)}
.cta .in{max-width:660px;margin:0 auto;display:flex;gap:8px}
.big{flex:1 1 auto;border:0;background:var(--blue);color:#fff;border-radius:var(--r-s);padding:18px;
  font-size:1.02em;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:-.4px}
.big:active{background:var(--blue-d)}
.big.gh{flex:0 0 auto;background:var(--card);color:var(--ink-2);box-shadow:var(--sh);padding:18px 20px}
.big.dn{background:var(--grn)}

/* ── 그림과 사진 ── */
figure{margin:16px 0;background:var(--bg);border-radius:var(--r-s);padding:14px;overflow:hidden}
figure img,figure svg{width:100%;display:block;border-radius:var(--r-xs);background:#fff}
figcaption{font-size:.84em;color:var(--ink-4);margin-top:10px;line-height:1.7}

/* ── 그 화면 열기 ── */
.opens{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.op{display:inline-block;border:0;background:var(--blue);color:#fff;border-radius:999px;
  padding:11px 17px;font-size:.88em;font-weight:700;text-decoration:none;letter-spacing:-.3px}
.op.g{background:var(--bg);color:var(--ink-2)}
.opl{font-size:.74em;font-weight:800;color:var(--ink-4);margin-top:1.4em}

/* ── 쌓기 ── */
.stack{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0 0}
.stack i{width:22px;height:22px;border-radius:7px;background:var(--line);display:block}
.stack i.on{background:var(--grn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips span{background:var(--bg);border-radius:var(--r-xs);padding:6px 12px;font-size:.84em;
  font-weight:600;color:var(--ink-3)}
.chips .num{background:var(--ink);color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.seq{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0}
.seq b{background:var(--bg);color:var(--ink-2);border-radius:var(--r-xs);padding:8px 12px;
  font-size:.86em;font-weight:700;font-variant-numeric:tabular-nums}
.seq i{font-style:normal;color:var(--ink-5)}

/* ── 두 쪽 견주기 (표 대신) ── */
.cmp{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin:10px 0}
.cmp .h{display:flex;background:var(--bg)}
.cmp .h span{flex:1;padding:12px 16px;font-size:.82em;font-weight:800;color:var(--ink-3)}
.cmp .r{border-top:1px solid var(--line-2);padding:14px 16px}
.cmp .r .q{font-size:.78em;font-weight:800;color:var(--ink-4)}
.cmp .r .two{display:flex;gap:12px;margin-top:6px}
.cmp .r .two div{flex:1;font-size:.92em;line-height:1.7}
.cmp .r .two div:first-child{color:var(--ink)}
.cmp .r .two div:last-child{color:var(--ink-3)}

/* ══ 인쇄 — 종이는 다른 물건입니다 ══ */
@page{size:A4;margin:18mm 15mm 20mm}
@media print{
  html{--fs:10.5pt}
  body{background:#fff;line-height:1.72;color:#000}
  .nav,.bar,.cta,.sheet,.scrim,.hardb,.fsg,.stack,.opens,.opl,.ar,.bk{display:none!important}
  .wrap{max-width:none;padding:0}
  .hi{padding:56mm 0 0;text-align:center;break-after:page}
  .hi h1{font-size:30pt} .hi p{font-size:12pt;margin-top:10mm}
  .stat{box-shadow:none;border:0;padding:0;text-align:center;break-after:page}
  .stat .pg{display:none}
  .list{box-shadow:none;border:0;border-radius:0;background:none}
  .row{border-top:1px solid #DDD;padding:3.4mm 0}
  .bd{background:none;color:#888;width:auto;font-size:9pt}
  .ch{break-before:page}
  .head{border-bottom:2px solid #111;padding-bottom:3mm;margin:0 0 5mm}
  .sec{box-shadow:none;border:0;border-top:1px solid #DDD;border-radius:0;
       padding:5mm 0 3mm;margin:0;break-inside:avoid}
  .sec>h3,.hd-row>h3{break-after:avoid}
  figure{background:none;padding:0;border:1px solid #E5E5E5;break-inside:avoid}
  figure img{max-height:95mm;object-fit:contain} figure svg{max-height:70mm}
  .quo,.warn,.good,.easy,.cmp{break-inside:avoid;border:1px solid #DDD}
  .quo{background:#F6F8FC;color:#123} .warn{background:#FDF4F4;color:#611}
  .good{background:#F3FBF6;color:#052} .easy{background:#FFFBF0;color:#543;display:block!important}
  .cmp{box-shadow:none} .tm{border-bottom:1px dotted #999}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="nav">
    <button class="bk" id="bk" aria-label="뒤로">‹</button>
    <span class="nt" id="nt">APEX 전자책</span>
    <span class="fsg" role="group" aria-label="글자 크기">
      <button class="fsb" data-fs="m" title="보통">가</button>
      <button class="fsb" data-fs="l" title="크게">가</button>
      <button class="fsb" data-fs="xl" title="아주 크게">가</button>
    </span>
  </div>
  <div class="bar"><i id="pgi"></i></div>
  <div id="pane"></div>
</div>

<div class="cta" id="cta"><div class="in" id="ctain"></div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shw">
  <div class="gr"></div><div class="w" id="shw"></div><div class="m" id="shm"></div>
  <button class="cl" id="shc">닫기</button>
</div>

<script src="book.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APEX 교육 운영 커리큘럼</title>
<!-- 자료는 plan.js 한 벌만. 이 화면은 그것을 그리기만 한다 (CLAUDE.md 5). -->
<script src="plan.js"></script>
<script src="master.js"></script>
<style>
/* ══════════ 토스 결 ══════════
   색·간격·굵기·모서리로 만듭니다. 글꼴은 기기 것을 씁니다 —
   이 앱 전체가 그렇게 서 있고, 폰에서 웹글꼴이 늦게 뜨면 글자가 한 번 튑니다.

   토스가 하는 것 중 여기서 지키는 것 넷
     · 바탕은 옅은 회색, 칸은 <b>흰색에 테두리 없이</b> 뜬다
     · 모서리를 크게(20px) 굴린다
     · 파랑은 <b>한 화면에 한 군데</b>만 — 나머지는 회색조로 눕힌다
     · 숫자는 크고 굵게. 글은 한 줄에 한 생각                        */
:root{
  --blue:#3182F6; --blue-d:#1B64DA; --blue-l:#E8F3FF;
  --ink:#191F28;  --ink-2:#333D4B;  --ink-3:#4E5968; --ink-4:#8B95A1; --ink-5:#B0B8C1;
  --bg:#F2F4F6;   --card:#FFFFFF;   --line:#E5E8EB;  --line-2:#F2F4F6;
  --red:#F04452;  --red-l:#FFEBEE;  --grn:#15C47E;   --grn-l:#E8FAF3;
  --amb:#E8A31D;  --amb-l:#FFF8E7;  --pur:#7C5CFC;   --pur-l:#F1EDFF;
  --r-lg:20px; --r:16px; --r-sm:12px; --r-xs:8px;
  --sh:0 1px 3px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.04);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,
    system-ui,"Malgun Gothic","맑은 고딕",sans-serif;
  font-size:15px; line-height:1.6; letter-spacing:-.2px;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
b{font-weight:700}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 100px}

/* ── 머리 ── */
.hero{background:var(--card);color:var(--ink);padding:30px 16px 24px;margin:0 0 8px}
.hero .in{max-width:900px;margin:0 auto}
.hero h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.9px;line-height:1.35;text-wrap:balance}
.hero .sub{margin-top:10px;font-size:14px;line-height:1.65;color:var(--ink-3);letter-spacing:-.3px}
.hero .sub b{color:var(--ink);font-weight:700}

/* ── 칸 고르기 ── */
.tabs{display:flex;flex-wrap:wrap;gap:5px;padding:10px 0 12px}
.tgl{flex:0 0 100%;font-size:10.5px;font-weight:700;color:var(--ink-5);letter-spacing:0;
  margin:8px 0 -1px;padding-left:3px}
.tgl:first-child{margin-top:0}
.tb{flex:0 0 auto;border:0;background:var(--card);color:var(--ink-3);border-radius:999px;
  padding:7px 13px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;
  white-space:nowrap;letter-spacing:-.3px;transition:background .12s,color .12s}
.tb:hover{background:#EDEFF2}
.tb.on{background:var(--ink);color:#fff;font-weight:700}
.tb:focus-visible,.cb:focus-visible,.pk:focus-visible,.wy:focus-visible,.add:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px}

/* ── 칸(카드) ── */
.card{background:var(--card);border:0;border-radius:var(--r-lg);margin-bottom:10px;overflow:hidden;
  box-shadow:var(--sh)}
.card>.hd{padding:20px 20px 0;border:0;background:transparent}
.card>.hd .t{font-size:19px;font-weight:800;letter-spacing:-.6px;line-height:1.4}
.card>.hd .d{font-size:14px;color:var(--ink-3);margin-top:7px;line-height:1.65;letter-spacing:-.2px}
.card>.bd{padding:16px 20px 20px}
.card>.hd+.bd{padding-top:14px}
.sec-h{font-size:21px;font-weight:800;margin:32px 0 12px;padding:0;border:0;letter-spacing:-.7px;
  line-height:1.4}
.lead{font-size:14.5px;color:var(--ink-3);line-height:1.7;margin:0 0 14px;letter-spacing:-.2px}

/* ── 줄 ── */
.row{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line-2);align-items:flex-start}
.row:first-child{border-top:0;padding-top:0}
.tag{flex:0 0 auto;min-width:54px;text-align:center;background:var(--blue-l);color:var(--blue-d);
  border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;line-height:1.5;letter-spacing:-.2px}
.tag.g{background:var(--grn-l);color:#0A9D63} .tag.a{background:var(--amb-l);color:#B47C0A}
.tag.p{background:var(--pur-l);color:#6242E0} .tag.r{background:var(--red-l);color:#D93B48}
.row .bodyt{flex:1 1 auto;min-width:0}
.row .n{font-size:15.5px;font-weight:700;line-height:1.55;letter-spacing:-.4px}
.row .s{font-size:14px;color:var(--ink-3);line-height:1.7;margin-top:4px;letter-spacing:-.2px}

/* ── 화면으로 가는 단추 ── */
.gos{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
.go{display:inline-block;border:0;background:var(--bg);color:var(--ink-3);
  border-radius:var(--r-xs);padding:6px 11px;font-size:12.5px;font-weight:600;text-decoration:none;
  white-space:nowrap;letter-spacing:-.2px;transition:background .12s}
.go:hover{background:#E6E9ED} .go:active{background:#DDE1E6}

/* ── 표 ── */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px;background:var(--card);
  border-radius:var(--r);overflow:hidden}
th,td{border:0;border-bottom:1px solid var(--line-2);padding:13px 14px;text-align:left;
  vertical-align:top;line-height:1.65;letter-spacing:-.2px}
th{background:var(--bg);font-weight:700;white-space:nowrap;font-size:13px;color:var(--ink-3)}
tr:last-child td{border-bottom:0}

/* ── 알림 ── */
.note{background:var(--amb-l);border:0;border-radius:var(--r);padding:15px 16px;
  font-size:14px;line-height:1.7;color:#8A6206;margin-top:12px;letter-spacing:-.2px}
.note.b{background:var(--blue-l);color:#1957BE}
.note.r{background:var(--red-l);color:#C7303C}
.note.g{background:var(--grn-l);color:#08825A}
ul.rl{margin:10px 0 0;padding-left:18px}
ul.rl li{font-size:14px;line-height:1.75;margin-bottom:7px}
.mini{font-size:12.5px;color:var(--ink-4);line-height:1.6;letter-spacing:-.2px}

/* ── 조회 대본 ── */
.mt{border:0;border-radius:var(--r-lg);background:var(--card);margin-bottom:10px;overflow:hidden;
  box-shadow:var(--sh)}
.mt .mh{padding:20px;background:var(--ink);color:#fff}
.mt .mh .d{font-size:20px;font-weight:800;letter-spacing:-.7px}
.mt .mh .g{font-size:13.5px;color:#B0B8C1;margin-top:6px;line-height:1.65;letter-spacing:-.2px}
.mt .mb{padding:6px 20px 20px}
.step{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line-2)}
.step:first-child{border-top:0}
.min{flex:0 0 50px;text-align:center;background:var(--bg);color:var(--ink);border-radius:var(--r-xs);
  padding:7px 0;font-size:13px;font-weight:800;height:fit-content;font-variant-numeric:tabular-nums}

/* ── 세션 카드 ── */
.ses .hd{background:transparent}
.chip{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:3px 10px;
  font-size:12px;font-weight:700;margin-right:7px;letter-spacing:-.2px;vertical-align:2px}
.chip.w{background:var(--pur)}

/* ── SYSTEM MASTER ── */
.way{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.wy{flex:1 1 190px;border:0;background:var(--card);border-radius:var(--r);padding:16px;
  text-align:left;font-family:inherit;cursor:pointer;box-shadow:var(--sh);transition:transform .1s}
.wy:active{transform:scale(.985)}
.wy .t{font-size:15px;font-weight:700;letter-spacing:-.4px;display:block}
.wy .d{font-size:13px;color:var(--ink-4);margin-top:5px;line-height:1.6;display:block;letter-spacing:-.2px}
.wy .w{font-size:12px;font-weight:700;color:var(--blue);margin-top:8px;display:block}
.wy.on{background:var(--ink)}
.wy.on .t{color:#fff} .wy.on .d{color:#8B95A1} .wy.on .w{color:#6FA8FF}
.lvh{display:flex;gap:10px;align-items:center;margin:28px 0 10px}
.lvh .b{flex:0 0 auto;background:var(--ink);color:#fff;border-radius:999px;padding:5px 11px;
  font-size:11.5px;font-weight:800;letter-spacing:0}
.lvh .n{font-size:19px;font-weight:800;letter-spacing:-.6px}
.lvh .g{font-size:13.5px;color:var(--ink-4);margin-left:auto;font-weight:700;
  font-variant-numeric:tabular-nums}
.sq{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sq b{background:var(--bg);border:0;color:var(--ink-2);border-radius:var(--r-xs);
  padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:-.3px;
  font-variant-numeric:tabular-nums;transition:background .12s}
.sq b:hover{background:var(--blue-l);color:var(--blue-d)}
.sq i{font-style:normal;color:var(--ink-5);font-size:13px}
.pbc{border:0;border-radius:var(--r-lg);background:var(--card);padding:20px;margin-bottom:10px;
  box-shadow:var(--sh)}
.pbc .ti{font-size:18px;font-weight:800;letter-spacing:-.6px;line-height:1.4}
.pbc .sy{font-size:14.5px;color:var(--blue-d);background:var(--blue-l);border-radius:var(--r-sm);
  padding:12px 14px;margin-top:10px;line-height:1.6;letter-spacing:-.3px;font-weight:600}
.fq{width:100%;border:0;background:var(--card);border-radius:var(--r);padding:15px 16px;
  font-size:16px;font-family:inherit;margin-bottom:12px;color:var(--ink);letter-spacing:-.3px;
  box-shadow:var(--sh)}
.fq::placeholder{color:var(--ink-5)}
.fq:focus{outline:none;box-shadow:0 0 0 2px var(--blue)}
.pw{border:0;border-radius:var(--r);padding:16px;background:var(--bg);margin-top:12px}
.pw .wh{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pw .wh span{background:var(--card);border-radius:var(--r-xs);padding:5px 10px;font-size:12.5px;
  font-weight:600;color:var(--ink-3);letter-spacing:-.2px}
.pw .nm{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pw .nm span{background:var(--ink);color:#fff;border-radius:var(--r-xs);padding:5px 11px;
  font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px}

/* MASTER 카드 */
.ms{border:0;border-radius:var(--r-lg);background:var(--card);margin-bottom:10px;overflow:hidden;
  box-shadow:var(--sh)}
.ms.on{background:#F7FCF9;box-shadow:0 0 0 1.5px var(--grn) inset}
.ms .mh{display:flex;gap:14px;padding:18px;align-items:flex-start;cursor:pointer}
.ms .no{flex:0 0 auto;width:38px;height:38px;border-radius:var(--r-sm);background:var(--bg);
  color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:14px;
  font-weight:800;font-variant-numeric:tabular-nums}
.ms.on .no{background:var(--grn);color:#fff}
/* .mt 는 조회 대본 칸에도 쓰입니다 — 카드 안 글상자가 그 흰 배경과 그림자를 물려받아
   칸 안에 칸이 하나 더 뜨고 있었습니다. 여기서 되돌립니다. */
.ms .mt{flex:1 1 auto;min-width:0;background:transparent;box-shadow:none;border-radius:0;margin:0}
.ms .en{font-size:11.5px;font-weight:700;letter-spacing:0;color:var(--ink-4)}
.ms .kr{font-size:17px;font-weight:800;line-height:1.4;margin-top:3px;letter-spacing:-.6px}
.ms.on .kr{color:#0A9D63}
.ms .do{font-size:14px;color:var(--ink-3);line-height:1.65;margin-top:6px;letter-spacing:-.2px}
.ms .bx{flex:0 0 auto;width:26px;height:26px;border:2px solid var(--line);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
  background:var(--card);margin-top:6px;cursor:pointer;transition:background .12s,border-color .12s}
.ms.on .bx{background:var(--grn);border-color:var(--grn)}
.ms .mb{padding:0 18px 18px 70px}
.msk{font-size:11.5px;font-weight:700;color:var(--ink-4);margin-top:14px;letter-spacing:0}
.msv{font-size:14px;line-height:1.7;margin-top:4px;color:var(--ink-2);letter-spacing:-.2px}
.msv.ok{color:#0A9D63} .msv.bad{color:#D93B48}
.prog{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.prog .bar{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--grn);border-radius:999px;transition:width .3s}
.prog .n{font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}

/* ── 갈래 고르기 ── */
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.pk{flex:1 1 180px;border:0;background:var(--card);border-radius:var(--r);padding:18px;
  text-align:left;font-family:inherit;cursor:pointer;box-shadow:var(--sh);transition:transform .1s}
.pk:active{transform:scale(.985)}
.pk .t{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.5px;display:block}
.pk .d{font-size:13px;color:var(--ink-4);margin-top:5px;line-height:1.6;display:block;letter-spacing:-.2px}
.pk.on{background:var(--blue);box-shadow:none}
.pk.on .t{color:#fff} .pk.on .d{color:#CFE3FF}

/* ── 목표 ── */
.gf{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line-2);
  flex-wrap:wrap}
.gf:first-child{border-top:0;padding-top:0}
.gf .lb{flex:1 1 190px;min-width:0}
.gf .lb>b{display:block;font-size:15px;font-weight:700;letter-spacing:-.4px}
.gf .lb i{display:block;font-style:normal;font-size:13px;color:var(--ink-4);line-height:1.6;
  margin-top:3px;letter-spacing:-.2px}
.gf input{width:120px;border:0;background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;
  font-size:17px;font-family:inherit;font-weight:700;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:-.3px}
.gf input:focus{outline:none;box-shadow:0 0 0 2px var(--blue);background:var(--card)}
.gf .un{font-size:13.5px;color:var(--ink-4);font-weight:600;width:28px}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.rc{flex:1 1 130px;border:0;background:var(--card);border-radius:var(--r);padding:16px;
  box-shadow:var(--sh)}
.rc .k{font-size:12.5px;font-weight:600;color:var(--ink-4);letter-spacing:-.2px}
.rc .v{font-size:26px;font-weight:800;color:var(--ink);line-height:1.2;margin-top:4px;
  font-variant-numeric:tabular-nums;letter-spacing:-1px}
.rc.big{background:var(--blue);box-shadow:none}
.rc.big .k{color:#BBD8FF} .rc.big .v{color:#fff}
.tl{display:flex;gap:8px;margin:4px 0 2px}
.tl .st{flex:1;border-top:0;padding-top:0}
.tl .st .d{font-size:12px;font-weight:700;color:var(--ink-5);background:var(--bg);
  border-radius:999px;padding:4px 0;text-align:center}
.tl .st.on .d{color:#fff;background:var(--blue)}
.tl .st .h{font-size:14px;font-weight:700;margin-top:8px;line-height:1.5;letter-spacing:-.4px;
  color:var(--ink-4)}
.tl .st.on .h{color:var(--ink)}

/* ── 캘린더 ── */
.calbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.calbar .nm{font-size:21px;font-weight:800;margin-right:auto;letter-spacing:-.7px}
.cb{border:0;background:var(--card);color:var(--ink-3);border-radius:999px;padding:9px 14px;
  font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;letter-spacing:-.3px;
  box-shadow:var(--sh);transition:background .12s}
.cb:hover{background:#F7F8F9}
.cb.on{background:var(--ink);color:#fff;font-weight:700}
.calw{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);
  border-radius:var(--r-lg);padding:8px;box-shadow:var(--sh)}
.cal{border-collapse:separate;border-spacing:3px;width:100%;min-width:620px;table-layout:fixed;
  background:transparent}
.cal th{background:transparent;border:0;padding:8px 4px;font-size:12px;text-align:center;
  color:var(--ink-4);font-weight:600}
.cal th.sun{color:var(--red)} .cal th.sat{color:var(--blue)}
.cal td{border:0;background:var(--bg);border-radius:var(--r-sm);vertical-align:top;padding:7px;
  height:100px}
.cal td.off{background:transparent}
.cal td.wk{background:transparent;width:78px;text-align:center}
.dn{font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dn.sun{color:var(--red)} .dn.sat{color:var(--blue)}
.fx{display:block;font-size:11px;line-height:1.45;margin-top:4px;padding:3px 7px;
  border-radius:var(--r-xs);background:var(--card);color:var(--ink-3);font-weight:600;
  letter-spacing:-.2px}
.fx.m{background:var(--blue-l);color:var(--blue-d)} .fx.o{background:var(--amb-l);color:#B47C0A}
.mine{display:flex;gap:4px;align-items:flex-start;font-size:11px;line-height:1.45;margin-top:4px;
  padding:3px 7px;border-radius:var(--r-xs);background:var(--grn);color:#fff;font-weight:600;
  cursor:pointer;letter-spacing:-.2px}
.mine .x{margin-left:auto;opacity:.7;font-weight:800}
.add{display:block;width:100%;margin-top:4px;border:0;background:transparent;color:#C4CBD3;
  border-radius:var(--r-xs);font-size:15px;font-family:inherit;padding:1px 0;cursor:pointer;
  font-weight:700;line-height:1.3;transition:background .12s,color .12s}
.add:hover{background:var(--blue-l);color:var(--blue)}
.wkf{font-size:12.5px;font-weight:700;color:var(--pur);line-height:1.45;padding-top:8px}
.wkf i{display:block;font-style:normal;font-size:11px;color:var(--ink-4);font-weight:600;margin-top:3px}

/* ── 체크 목록 ── */
.ck{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line-2);align-items:flex-start;
  cursor:pointer}
.ck:first-child{border-top:0;padding-top:0}
.ck .bx{flex:0 0 auto;width:24px;height:24px;border:2px solid var(--line);border-radius:50%;
  margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
  background:var(--card);transition:background .12s,border-color .12s}
.ck.on .bx{background:var(--grn);border-color:var(--grn)}
.ck.on .n{color:var(--ink-5);text-decoration:line-through}
.ckmeta{font-size:12.5px;color:var(--ink-4);margin:12px 0 0;letter-spacing:-.2px}

/* ── 인쇄 ──
   tnum(font-feature-settings) 은 켜지 않습니다. 켜고 PDF 로 저장하면 숫자가
   유니코드를 잃습니다 (CLAUDE.md 4-1). font-variant-numeric 은 그와 다릅니다. */
.pbtn{position:fixed;right:16px;bottom:16px;z-index:9;border:0;background:var(--blue);color:#fff;
  border-radius:999px;padding:14px 22px;font-size:14.5px;font-weight:700;font-family:inherit;
  box-shadow:0 4px 16px rgba(49,130,246,.35);cursor:pointer;letter-spacing:-.3px}
.pbtn:active{background:var(--blue-d)}
@media print{
  body{background:#fff;font-size:11pt}
  .tabs,.pbtn,.hero,.add,.calbar .cb{display:none!important}
  .wrap{max-width:none;padding:0}
  .pane{display:block!important;break-inside:auto}
  .card,.mt,.ms,.pbc,.wy,.rc,.calw{break-inside:avoid;box-shadow:none;border:1px solid #DDD}
  .sec-h{break-after:avoid}
  .go{background:#F4F5F6;color:#333}

  12주 지식 과정과 화법 자료는 이미 앱 안에 있습니다. 여기는 <b>그것을 굴리는 법</b>만 적습니다.</div>

<script>
(function(){
var P = window.EDU_PLAN;
var VIEWS = [
  ['welcome','환영합니다','나'], ['master','SYSTEM MASTER','나'], ['me','나의 목표','나'], ['cal','📅 캘린더','나'],
  ['week','주간 미션','나'], ['monthly','월간 미션','나'], ['study','공부','나'],
  ['path','나의 과정','나'], ['gate','게이트','나'],
  ['lead','지점장','팀을 여는 사람'], ['edu','교육매니저','팀을 여는 사람'],
  ['meet','월·목 조회','팀을 여는 사람'], ['cover','커버 처방','팀을 여는 사람'],
  ['ses','세션 카드','팀을 여는 사람'], ['news','9월 3일','팀을 여는 사람'],
  ['run','이 문서를 굴리는 법','팀을 여는 사람'], ['law','준법','모두']
];
var cur = (location.hash||'').replace('#','') || 'welcome';
if(!VIEWS.some(function(v){return v[0]===cur})) cur='start';

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* plan.js 의 글에는 <b> 만 들어 있다 — 그것만 살리고 나머지는 글자로 둔다 */
function rich(s){return esc(s).replace(/&lt;(\/?b)&gt;/g,'<$1>');}

/* 화면 단추 — 이름표는 plan.js 의 screens 한 벌에서만 가져온다 */
function gos(ids){
  if(!ids||!ids.length) return '';
  var h='<div class="gos">';
  for(var i=0;i<ids.length;i++){
    var id=ids[i], nm=P.screens[id];
    if(!nm) continue;                       /* 이름표에 없는 화면은 링크를 만들지 않는다 */
    h+='<a class="go" target="_top" href="../index.html?go='+encodeURIComponent(id)+'">'+esc(nm)+' →</a>';
  }
  return h+'</div>';
}
function row(tag,cls,name,sub,ids){
  return '<div class="row"><span class="tag '+(cls||'')+'">'+esc(tag)+'</span><div class="bodyt">'+
    '<div class="n">'+rich(name)+'</div>'+
    (sub?'<div class="s">'+rich(sub)+'</div>':'')+gos(ids)+'</div></div>';
}
function card(t,d,body){
  return '<div class="card"><div class="hd"><div class="t">'+rich(t)+'</div>'+
    (d?'<div class="d">'+rich(d)+'</div>':'')+'</div><div class="bd">'+body+'</div></div>';
}
function rules(list,cls){
  var h='<div class="note '+(cls||'')+'"><b>지키는 것</b><ul class="rl">';
  for(var i=0;i<list.length;i++) h+='<li>'+rich(list[i])+'</li>';
  return h+'</ul></div>';
}

/* ── 화면들 ── */
function vRun(){
  var h='<div class="note b">새로 오신 분은 이 칸이 아니라 <b>「환영합니다」</b>부터 보십니다. '+
    '여기는 <b>이 문서를 굴리는 사람</b>이 보는 칸입니다.</div>'+
    '<div class="sec-h">이 커리큘럼이 없는 것</div>'+
    '<div class="note b">여기에 <b>12주 지식 과정</b>과 <b>미끼 화법 27장</b>은 없습니다. 빠뜨린 것이 아닙니다 — '+
    '이미 앱 안에 있고, 같은 것을 두 곳에 두면 <b>한쪽만 낡습니다.</b> 이 문서는 그것을 <b>언제·누가·어떻게 확인하는지</b>만 정합니다.'+
    gos(['academy','bohum','mikki_talk','fp_talk'])+'</div>';
  h+='<div class="sec-h">운영 3원칙</div>';
  for(var i=0;i<P.principles.length;i++){
    var p=P.principles[i];
    h+=card(''+(i+1)+'. '+p[0],'','<div class="s" style="font-size:13px;line-height:1.85">'+rich(p[1])+'</div>'+gos(p[2]));
  }
  h+='<div class="sec-h">매니저 관리 문화</div><div class="card"><div class="bd">';
  for(var j=0;j<P.culture.length;j++)
    h+=row('·','p',P.culture[j][0],P.culture[j][1],null);
  h+='</div></div>';
  h+='<div class="sec-h">새로 온 사람에게 이 순서로 줍니다</div><div class="card"><div class="bd">'+
    row('첫날','g','「환영합니다」를 <b>같이</b> 엽니다','혼자 읽으라고 던지지 않습니다. 약속과 「하지 않는 일」은 옆에서 같이 읽습니다.',null)+
    row('첫날','g','갈래를 고르고 <b>시작일을 박습니다</b>','이걸 안 하면 며칠째인지도, 게이트가 언제인지도 아무도 모릅니다.',null)+
    row('첫 주','b','「나의 목표」 다섯 칸을 <b>같이</b> 채웁니다','수수료 값은 매니저가 회사 표를 열어 알려 줍니다 — 앱은 이 값을 모릅니다.',null)+
    row('첫 두 주','a','<b>SYSTEM MASTER</b> LEVEL 1 을 견본 고객으로','안 돌리고 시작하면 매주 화면 찾는 데 시간을 다 씁니다. <b>07 검수</b>와 <b>28 인쇄</b> 두 장은 옆에서 같이 봐 줍니다 — 고객 앞에서 사고가 나는 자리입니다.',null)+
    row('둘째 주','p','「주간 미션」과 「캘린더」로 넘깁니다','이때부터 혼자 굴러갑니다.',null)+
    '</div></div>';
  h+='<div class="sec-h">어디에 무엇이 있나</div><div class="card"><div class="bd">'+
    row('본인','g','환영합니다 · SYSTEM MASTER · 나의 목표 · 나의 과정','새로 온 사람이 <b>스스로</b> 여는 칸입니다',null)+
    row('도구','a','SYSTEM MASTER 서른 장','순서 · 상황 · 기능 세 갈래로 배웁니다 — <b>열두 주와 축이 다릅니다</b>(도구 / 영업)',null)+
    row('매일','b','주간 미션 · 캘린더','요일마다 하는 일이 다릅니다 — 월 명단 · 화 전화 · 수 상담 · 목 결정 · 금 정리',null)+
    row('매달','g','월간 미션','네 주의 초점 — 채운다 · 연다 · 닫는다 · 심는다',null)+
    row('지점장','r','지점장 리스트','<b>숫자</b>를 봅니다 — 하루·주·달·분기, 눌러서 지웁니다',null)+
    row('교육','r','교육매니저 리스트','<b>사람과 자료</b>를 봅니다 — 지점장과 겹치지 않게 갈라 뒀습니다',null)+
    '</div></div>';
  h+='<div class="note">이 표를 고칠 때는 <code>app/교육/plan.js</code> <b>한 곳만</b> 고칩니다. 이 화면은 그것을 그리기만 합니다.</div>';
  return h;
}

function vNews(){
  var s=null;
  for(var i=0;i<P.sessions.length;i++) if(P.sessions[i].key==='news') s=P.sessions[i];
  if(!s) return '';
  var h='<div class="sec-h">'+esc(s.when)+' · 담당 '+esc(s.who)+'</div>';
  h+='<div class="card"><div class="hd"><div class="t">'+rich(s.title)+'</div>'+
     '<div class="d">'+rich(s.why)+'</div></div><div class="bd">';

    var f=s.flow[j];
    h+=row(f[0],'g',f[1],f[2],f[3]);
  }
  h+='</div></div>';

  h+=card('소식지 한 장 — 여섯 칸','칸을 늘리지 않습니다. 한 장을 넘기면 아무도 안 읽습니다.',
    (function(){
      var t='<div class="tw"><table><tr><th style="width:46px">칸</th><th>무엇을 적나</th></tr>';
      for(var k=0;k<s.sheet.length;k++) t+='<tr><td><b>'+(k+1)+'</b></td><td>'+rich(s.sheet[k])+'</td></tr>';
      return t+'</table></div>';
    })());
  h+=rules(s.rules,'r');

     '한 곳이라도 어긋나면 그 소식지는 나가지 않습니다 — 고치고 다시 냅니다.</div>';

/* ══ 저장 — 이 브라우저에만. 서버로 나가지 않는다 ══ */
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}

var CAL_KEY='apex_edu_cal', CK_KEY='apex_edu_ck';
function ymd(d){var p=function(n){return(n<10?'0':'')+n;};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function ym(d){var p=function(n){return(n<10?'0':'')+n;};return d.getFullYear()+'-'+p(d.getMonth()+1);}

/* ══ 캘린더 ══
   고정 리듬은 plan.js 에서 계산한다 — 여기에 요일 이름을 다시 적지 않는다. */
var CAL={cur:new Date()};
function calMine(k){var all=lsGet(CAL_KEY,{});return all[k]||[];}
function calSet(k,list){var all=lsGet(CAL_KEY,{});all[k]=list;
  if(!lsSet(CAL_KEY,all))alert('이 브라우저에 저장하지 못했습니다. 시크릿 창이거나 저장 공간이 막혀 있습니다.');}
function calAdd(ds){
  var t=prompt('무엇을 넣을까요?\n\n· 고객 실명은 적지 않습니다 — 「김○○」\n· 한 날에 셋을 넘기지 않습니다');
  if(t===null)return; t=String(t).replace(/\s+/g,' ').trim(); if(!t)return;
  if(t.length>40)t=t.slice(0,40);
  var k=ym(CAL.cur), list=calMine(k);
  if(list.filter(function(x){return x.d===ds;}).length>=3){
    alert('이 날은 이미 셋입니다.\n넷째를 넣으면 그날은 아무것도 안 됩니다 — 다른 날로 옮기세요.');return;}
  list.push({d:ds,t:t}); calSet(k,list); paint();
}
function calDel(ds,i){
  var k=ym(CAL.cur), list=calMine(k), n=-1;
  for(var j=0;j<list.length;j++){if(list[j].d===ds){n++;if(n===i){list.splice(j,1);break;}}}
  calSet(k,list); paint();
}
function calMove(n){CAL.cur=new Date(CAL.cur.getFullYear(),CAL.cur.getMonth()+n,1);paint();}
function calToday(){CAL.cur=new Date();paint();}
function calClear(){
  if(!confirm('이 달에 <내가 넣은 것>만 지웁니다. 고정 리듬은 그대로입니다. 지울까요?'.replace(/[<>]/g,'')))return;
  calSet(ym(CAL.cur),[]); paint();
}
function calWeekNo(day){return Math.min(4,Math.ceil(day/7));}

function vCal(){
  var Y=CAL.cur.getFullYear(), M=CAL.cur.getMonth();
  var first=new Date(Y,M,1), last=new Date(Y,M+1,0), lastDay=last.getDate();
  var key=ym(CAL.cur), mine=calMine(key), today=ymd(new Date());
  var wkOf={}; for(var i=0;i<P.week.length;i++)wkOf[P.week[i].day]=P.week[i];
  var DOW=['일','월','화','수','목','금','토'];

  var h='<div class="calbar">'+
    '<span class="nm">'+Y+'년 '+(M+1)+'월</span>'+
    '<button class="cb" data-cal="prev">← 지난달</button>'+
    '<button class="cb on" data-cal="today">이번 달</button>'+
    '<button class="cb" data-cal="next">다음 달 →</button>'+
    '<button class="cb" data-cal="clear">내가 넣은 것 비우기</button></div>';

  h+='<div class="calw"><table class="cal"><tr><th class="wk">주차</th>';
  for(var d=0;d<7;d++) h+='<th class="'+(d===0?'sun':d===6?'sat':'')+'">'+DOW[d]+'</th>';
  h+='</tr>';

  var day=1-first.getDay(), rowShown={};
  while(day<=lastDay){
    /* 이 줄에 걸리는 첫 날짜로 주차를 정한다 */
    var anchor=day; for(var a=day;a<day+7;a++){if(a>=1&&a<=lastDay){anchor=a;break;}}
    var wn=calWeekNo(anchor), f=P.monthly.weeks[wn-1];
    h+='<tr><td class="wk">'+(rowShown[wn]?'<span class="mini">이어서</span>':
      '<div class="wkf">'+esc(f[0])+'<i>'+esc(f[1])+'</i></div>')+'</td>';
    rowShown[wn]=1;
    for(var c=0;c<7;c++,day++){
      if(day<1||day>lastDay){h+='<td class="off"></td>';continue;}
      var dt=new Date(Y,M,day), ds=ymd(dt), dw=DOW[dt.getDay()], w=wkOf[dw];
      h+='<td'+(ds===today?' style="box-shadow:inset 0 0 0 2px var(--blue)"':'')+'>'+
         '<span class="dn '+(c===0?'sun':c===6?'sat':'')+'">'+day+'</span>';
      if(w) h+='<span class="fx">'+esc(w.head.split(' —')[0])+'</span>';
      if(dw==='월'||dw==='목') h+='<span class="fx o">조회 40분</span>';
      if(day===1) h+='<span class="fx m">달 열기</span>';
      if(day===lastDay) h+='<span class="fx m">달 닫기</span>';
      var k2=0;
      for(var m2=0;m2<mine.length;m2++){ if(mine[m2].d!==ds) continue;
        h+='<span class="mine" data-del="'+ds+'" data-i="'+k2+'">'+esc(mine[m2].t)+
           '<span class="x">×</span></span>'; k2++; }
      if(k2<3) h+='<button class="add" data-add="'+ds+'" title="이 날에 넣기">+</button>';
      h+='</td>';
    }
    h+='</tr>';
  }
  h+='</table></div>';

  h+='<div class="note b"><b>파란 칸은 자동입니다</b> — 요일 미션 · 월·목 조회 · 달 열기와 닫기 · 왼쪽 주차 초점. '+
     '「주간 미션」과 「월간 미션」 표에서 그대로 계산해 깝니다. 그 표를 고치면 이 달력도 같이 바뀝니다.'+
     '<br><b>초록 칸은 제가 넣은 것</b>입니다. 누르면 지워집니다.</div>';
  h+=rules(P.calRules,'');
  h+='<div class="note g">인쇄하면 이 달력이 <b>그대로 한 장</b>으로 나옵니다. 벽에 붙이시면 됩니다.</div>';
  return h;
}

/* ══ 체크 목록 — 하루는 날짜가 바뀌면, 주간은 월요일에, 월간은 1일에 스스로 비워진다 ══ */
function ckStamp(scope){
  var d=new Date();
  if(scope==='day')return ymd(d);
  if(scope==='week'){var t=new Date(d);t.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(t);}
  return ym(d);
}
function ckState(role,scope){
  var all=lsGet(CK_KEY,{}), k=role+'.'+scope, o=all[k];
  if(!o||o.s!==ckStamp(scope))return {s:ckStamp(scope),on:{}};
  return o;
}
function ckTog(role,scope,id){
  var all=lsGet(CK_KEY,{}), k=role+'.'+scope, o=ckState(role,scope);
  o.on[id]=!o.on[id]; all[k]=o; lsSet(CK_KEY,all); paint();
}
function ckList(role,scope,items,label){
  var st=ckState(role,scope), done=0, h='<div class="card"><div class="hd"><div class="t">'+esc(label)+'</div>'+
    '<div class="d" id="ckd-'+role+'-'+scope+'"></div></div><div class="bd">';
  for(var i=0;i<items.length;i++){
    var it=items[i], on=!!st.on[i]; if(on)done++;
    h+='<div class="ck'+(on?' on':'')+'" data-ck="'+role+'|'+scope+'|'+i+'">'+
       '<span class="bx">'+(on?'✓':'')+'</span><div class="bodyt">'+
       '<div class="n"><span class="tag" style="min-width:0;padding:2px 6px;margin-right:6px">'+esc(it[0])+'</span>'+rich(it[1])+'</div>'+
       (it[2]?'<div class="s">'+rich(it[2])+'</div>':'')+gos(it[3])+'</div></div>';
  }
  h+='<p class="ckmeta">'+done+' / '+items.length+' · '+
     (scope==='day'?'날짜가 바뀌면':scope==='week'?'월요일에':scope==='month'?'1일에':'')+
     (scope==='quarter'?'분기 항목은 스스로 비우지 않습니다 — 눌러서 끕니다':' 스스로 비워집니다')+
     ' · 이 브라우저에만 남습니다</p></div></div>';
  return h;
}

function vWho(){
  var W=P.who, h='<div class="tw"><table><tr><th></th><th>지점장</th><th>교육매니저</th></tr>';
  for(var i=0;i<W.axis.length;i++)
    h+='<tr><td><b>'+rich(W.axis[i][0])+'</b></td><td>'+rich(W.axis[i][1])+'</td><td>'+rich(W.axis[i][2])+'</td></tr>';
  h+='</table></div><div class="note r">'+rich(W.rule)+'</div>';
  return h;
}

  h+='<div class="sec-h">지점장 — 하루</div>'+
    '<p class="lead">순서가 중요합니다. <b>내 것을 먼저 끝낸 상태로</b> 팀을 엽니다. '+

  h+=ckList('lead','day',P.mgrDay,'오늘');
  h+='<div class="note r"><b>지점장이 하지 않는 것</b><ul class="rl">'+
    P.leadNo.map(function(t){return '<li>'+rich(t)+'</li>';}).join('')+'</ul></div>';
  h+='<div class="sec-h">지점장 — 이번 주</div>'+ckList('lead','week',P.lead.week,'이번 주');
  h+='<div class="sec-h">지점장 — 이번 달</div>'+ckList('lead','month',P.lead.month,'이번 달');
  h+='<div class="sec-h">지점장 — 분기</div>'+ckList('lead','quarter',P.lead.quarter,'분기');
  return h;
}

function vEdu(){
  var h='<div class="sec-h">누가 무엇을 챙기나</div>'+vWho();
  h+='<div class="sec-h">교육매니저 — 하루</div>'+

/* ── SYSTEM MASTER — 서른 장. 세 갈래로 배운다 ── */
var M = window.EDU_MASTER;
function msOn(){var o=me();return o.master||{};}
function msTog(n){var o=me();o.master=o.master||{};o.master[n]=!o.master[n];lsSet(ME_KEY,o);paint();}
function msDone(n){return !!msOn()[n];}
function msCount(){var d=msOn(),c=0;for(var i=0;i<M.cards.length;i++)if(d[M.cards[i].n])c++;return c;}
function msWay(){return me().way||'map';}
function msWaySet(w){meSet('way',w);paint();}
function msCard(n){for(var i=0;i<M.cards.length;i++)if(M.cards[i].n===n)return M.cards[i];return null;}
/* 등급 — 마지막 하나만은 스스로 못 오른다 */
function msGrade(){
  var c=msCount(), fin=msDone('30');
  if(fin&&c>=M.cards.length)return M.levels[3];
  if(c>=24)return M.levels[2];
  if(c>=16)return M.levels[1];
  if(c>=6)return M.levels[0];
  return null;
}
function msOpenSet(n){meSet('msOpen',me().msOpen===n?'':n);paint();}

/* 카드 한 장 — 서른 장이 같은 모양이다 */

  var done=msDone(c.n), open=(me().msOpen===c.n);

    '<div class="mh" data-mso="'+c.n+'"><span class="no">'+esc(c.n)+'</span>'+
      '<div class="mt"><div class="en">MASTER '+esc(c.n)+' · '+esc(c.name)+'</div>'+
      '<div class="kr">'+rich(c.kr)+'</div>'+

      '<div class="mini" style="margin-top:4px">⏱ '+esc(c.min)+'</div></div>'+
      '<span class="bx" data-ms="'+c.n+'">'+(done?'✓':'')+'</span></div>';
  if(open){
    h+='<div class="mb">'+
      '<div class="msk">② 언제 쓰는가</div><div class="msv">'+
        c.when.map(function(w){return '· '+rich(w);}).join('<br>')+'</div>'+

      '<div class="msk">합격</div><div class="msv ok">'+rich(c.pass)+'</div>'+
      gos(c.go)+
      (c.next?'<div class="msk">⑦ 다음</div><div class="msv">MASTER '+esc(c.next)+' · '+

     '「모릅니다. 확인해서 알려드리겠습니다.」 — 이 말을 못 하면 지어냅니다. '+
     '지어낸 숫자는 고객이 <b>사실로 믿습니다.</b></div>';
  h+='<div class="note b">금소법 문구 점검은 <b>금소법 AI</b>, 외부 게시글은 <b>외부글 심의필터</b>로 한 번 거칩니다.'+gos(['cs_gso','interpret'])+'</div>';
  return h;
}

var RENDER={welcome:vWelcome,master:vMaster,me:vMe,path:vPath,cal:vCal,week:vWeek,monthly:vMonthly,
  study:vStudy,gate:vGate,lead:vLead,edu:vEdu,meet:vMeet,cover:vCover,
  ses:vSes,news:vNews,run:vRun,law:vLaw};

function paint(){
  var t='',g='';
  for(var i=0;i<VIEWS.length;i++){
    if(VIEWS[i][2]!==g){g=VIEWS[i][2];t+='<span class="tgl">'+esc(g)+'</span>';}
    t+='<button class="tb'+(VIEWS[i][0]===cur?' on':'')+'" data-v="'+VIEWS[i][0]+'">'+esc(VIEWS[i][1])+'</button>';
  }
  document.getElementById('tabs').innerHTML=t;
  document.getElementById('pane').innerHTML='<div class="pane">'+RENDER[cur]()+'</div>';
  window.scrollTo(0,0);
}
/* 한 곳에서 받는다 — 전역 함수를 늘리지 않는다 */
document.getElementById('pane').addEventListener('click',function(e){
  var el=e.target.closest('[data-add],[data-del],[data-cal],[data-ck],[data-tk],[data-ms],[data-mso],[data-way],[data-mgo]');
  if(!el) return;
  var v;
  if((v=el.getAttribute('data-add'))) return calAdd(v);
  if((v=el.getAttribute('data-del'))!==null&&v!==undefined&&el.hasAttribute('data-del'))
    return calDel(v,parseInt(el.getAttribute('data-i'),10)||0);
  if((v=el.getAttribute('data-cal'))){
    if(v==='prev')return calMove(-1);
    if(v==='next')return calMove(1);
    if(v==='today')return calToday();
    if(v==='clear')return calClear();
    return;
  }
  if((v=el.getAttribute('data-ck'))){var a=v.split('|');return ckTog(a[0],a[1],parseInt(a[2],10));}
  if((v=el.getAttribute('data-tk'))){meSet('track',v);return paint();}
  if(el.hasAttribute('data-ms')) return msTog(el.getAttribute('data-ms'));
  if(el.hasAttribute('data-mso')) return msOpenSet(el.getAttribute('data-mso'));
  if((v=el.getAttribute('data-way'))) return msWaySet(v);
  if(el.hasAttribute('data-mgo')){
    /* 플레이북 번호를 누르면 그 카드를 펴서 보여 준다 */
    var n=el.getAttribute('data-mgo'), o=me();
    o.way='find'; o.msq=n; o.msOpen=n; lsSet(ME_KEY,o); return paint();
  }
});
/* 치는 동안 담고, 손을 뗄 때 다시 그린다.
   담기를 change 에만 걸면 칸을 채우고 탭을 옮겨 버렸을 때 <b>말없이 사라진다</b>.
   그리기를 input 에 걸면 한 글자마다 다시 그려 커서가 튄다. 그래서 둘로 나눈다. */
var FQ=null;   /* 찾기 칸에 커서를 돌려 놓기 위한 표시 */
function fieldSave(el){
  var k;
  if(!el||!el.getAttribute) return false;
  if(el.hasAttribute('data-msq')){
    meSet('msq',el.value);
    if(FQ)clearTimeout(FQ);
    FQ=setTimeout(function(){paint();
      var q=document.querySelector('[data-msq]');
      if(q){q.focus();try{q.setSelectionRange(q.value.length,q.value.length);}catch(x){}}
    },260);
    return false;   /* 여기서는 다시 그리지 않는다 — 위 타이머가 한다 */
  }
  if((k=el.getAttribute('data-me'))){meSet(k,String(el.value||'').trim());return true;}
  if((k=el.getAttribute('data-goal'))){
    var o=me(); o.goal=o.goal||{};
    var n=parseFloat(el.value);
    if(isFinite(n)&&n>0)o.goal[k]=n; else delete o.goal[k];
    lsSet(ME_KEY,o); return true;
  }
  return false;
}
var pane=document.getElementById('pane');
pane.addEventListener('input',function(e){fieldSave(e.target);});
pane.addEventListener('change',function(e){if(fieldSave(e.target))paint();});
document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('.tb'); if(!b) return;
  cur=b.getAttribute('data-v'); try{location.hash=cur;}catch(x){}
  paint();
});
/* 인쇄할 때는 전부 펼친다 — 한 칸만 뽑히면 종이가 반쪽이 된다 */
window.addEventListener('beforeprint',function(){
  var all='',i;
  for(i=0;i<VIEWS.length;i++) all+='<div class="pane">'+RENDER[VIEWS[i][0]]()+'</div>';
  /* 종이는 팀 전체가 돌려 봅니다 — 화면에서 안 고른 갈래도 인쇄본에는 담습니다 */
  var t=track(), other=(t==='career')?'new':'career';
  var oa=P.arc[other], ah='';
  for(i=0;i<oa.length;i++) ah+=row(oa[i][0],'p',oa[i][1],oa[i][2],null);
  all+='<div class="pane"><div class="sec-h">'+(other==='career'?'경력 · 여덟 주':'신입 · 열두 주')+
       ' — 다른 갈래</div><div class="card"><div class="bd">'+ah+'</div></div>'+
       gateTable(other)+((other==='career')?vCareer():vNewbie())+'</div>';
  document.getElementById('pane').innerHTML=all;
});
window.addEventListener('afterprint',paint);
/* 주소 뒤 이름표가 바뀌면 따라간다 — 뒤로 가기와 즐겨찾기가 이걸로 돕니다.
   같은 문서 안 이동이라 새로 읽지 않으므로, 안 붙여 두면 화면이 그대로 멈춰 있습니다. */
window.addEventListener('hashchange',function(){
  var h=(location.hash||'').replace('#','');
  if(h&&h!==cur&&VIEWS.some(function(v){return v[0]===h;})){cur=h;paint();}
});
paint();
})();
</script>

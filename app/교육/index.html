<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APEX 교육 운영 커리큘럼</title>
<!-- 자료는 plan.js 한 벌만. 이 화면은 그것을 그리기만 한다 (CLAUDE.md 5). -->
<script src="plan.js"></script>
<style>
:root{
  --ink:#1C2434; --mut:#6B7280; --line:#E5E9F0; --bg:#F6F8FB; --card:#fff;
  --blue:#1A56DB; --blueL:#EFF4FF; --grn:#059669; --grnL:#ECFDF5;
  --red:#DC2626; --redL:#FEF2F2; --amb:#B45309; --ambL:#FFFBEB; --pur:#6D28D9; --purL:#F5F3FF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.75;-webkit-text-size-adjust:100%}
b{font-weight:800}
.wrap{max-width:960px;margin:0 auto;padding:0 14px 80px}

/* 머리 */
.hero{background:linear-gradient(135deg,#1E3A8A,#4C1D95);color:#fff;padding:26px 14px 22px;margin:0 0 16px}
.hero .in{max-width:960px;margin:0 auto}
.hero h1{margin:0;font-size:21px;font-weight:900;letter-spacing:-.4px}
.hero .sub{margin-top:7px;font-size:12.5px;line-height:1.7;color:#C7D2FE}
.hero .sub b{color:#fff}

/* 탭 */
/* 칸이 열다섯이다. 옆으로 밀어 감추면 뒤쪽 칸은 아무도 못 찾는다 — 줄을 바꿔 전부 보여 준다 */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 12px}
.tb{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#4B5563;border-radius:999px;
  padding:8px 14px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.tb.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card>.hd{padding:13px 15px 11px;border-bottom:1px solid var(--line);background:#FCFDFF}
.card>.hd .t{font-size:15px;font-weight:900;letter-spacing:-.3px}
.card>.hd .d{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.65}
.card>.bd{padding:14px 15px}
.sec-h{font-size:16px;font-weight:900;margin:22px 0 10px;padding-left:10px;border-left:4px solid var(--blue)}
.lead{font-size:13px;color:#374151;line-height:1.8;margin:0 0 14px}

/* 줄 목록 */
.row{display:flex;gap:11px;padding:11px 0;border-top:1px solid #F1F4F8;align-items:flex-start}
.row:first-child{border-top:0}
.tag{flex:0 0 auto;min-width:60px;text-align:center;background:var(--blueL);color:var(--blue);
  border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:900;line-height:1.5}
.tag.g{background:var(--grnL);color:var(--grn)} .tag.a{background:var(--ambL);color:var(--amb)}
.tag.p{background:var(--purL);color:var(--pur)} .tag.r{background:var(--redL);color:var(--red)}
.row .bodyt{flex:1 1 auto;min-width:0}
.row .n{font-size:13.5px;font-weight:800;line-height:1.6}
.row .s{font-size:12.5px;color:#4B5563;line-height:1.75;margin-top:3px}

/* 화면 단추 */
.gos{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.go{display:inline-block;border:1px solid #DBE3F0;background:#F8FAFF;color:var(--blue);
  border-radius:7px;padding:3px 8px;font-size:11.5px;font-weight:700;text-decoration:none;white-space:nowrap}
.go:active{background:#E8EFFF}

/* 표 */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:12.5px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;line-height:1.7}
th{background:#F3F6FB;font-weight:800;white-space:nowrap}

/* 알림 */
.note{background:var(--ambL);border:1px solid #FDE68A;border-radius:10px;padding:10px 12px;
  font-size:12.5px;line-height:1.75;color:#7C2D12;margin-top:10px}
.note.b{background:var(--blueL);border-color:#C7D7FF;color:#1E3A8A}
.note.r{background:var(--redL);border-color:#FECACA;color:#991B1B}
.note.g{background:var(--grnL);border-color:#A7F3D0;color:#065F46}
ul.rl{margin:9px 0 0;padding-left:18px}
ul.rl li{font-size:12.5px;line-height:1.8;margin-bottom:5px}
.mini{font-size:11.5px;color:var(--mut);line-height:1.7}

/* 조회 대본 */
.mt{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:12px;overflow:hidden}
.mt .mh{padding:13px 15px;background:linear-gradient(135deg,#1A56DB,#3B82F6);color:#fff}
.mt .mh .d{font-size:17px;font-weight:900}
.mt .mh .g{font-size:12px;color:#DBEAFE;margin-top:4px;line-height:1.7}
.mt .mb{padding:12px 15px}
.step{display:flex;gap:11px;padding:10px 0;border-top:1px solid #F1F4F8}
.step:first-child{border-top:0}
.min{flex:0 0 46px;text-align:center;background:#111827;color:#fff;border-radius:8px;
  padding:5px 0;font-size:12px;font-weight:900;height:fit-content}

/* 세션 카드 */
.ses .hd{background:#FCFCFF}
.chip{display:inline-block;background:#111827;color:#fff;border-radius:6px;padding:2px 8px;
  font-size:11px;font-weight:800;margin-right:6px}
.chip.w{background:var(--pur)}

.tgl{flex:0 0 100%;font-size:10.5px;font-weight:800;color:#9CA3AF;letter-spacing:.06em;
  margin:6px 0 -2px;padding-left:2px}
.tgl:first-child{margin-top:0}

/* 갈래 고르기 */
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.pk{flex:1 1 160px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;
  text-align:left;font-family:inherit;cursor:pointer}
.pk .t{font-size:14px;font-weight:900;color:var(--ink)}
.pk .d{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.6}
.pk.on{border-color:var(--blue);background:var(--blueL);box-shadow:0 0 0 3px rgba(26,86,219,.10)}
.pk.on .t{color:var(--blue)}

/* 목표 */
.gf{display:flex;gap:9px;align-items:center;padding:9px 0;border-top:1px solid #F1F4F8;flex-wrap:wrap}
.gf:first-child{border-top:0}
.gf .lb{flex:1 1 190px;min-width:0}
.gf .lb b{display:block;font-size:13px;font-weight:800}
.gf .lb i{display:block;font-style:normal;font-size:11.5px;color:var(--mut);line-height:1.6;margin-top:2px}
.gf input{width:110px;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;
  font-family:inherit;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;background:#fff;color:var(--ink)}
.gf input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.gf .un{font-size:12px;color:var(--mut);font-weight:700;width:26px}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.rc{flex:1 1 128px;border:1px solid #C7D7FF;background:var(--blueL);border-radius:12px;padding:11px 12px}
.rc .k{font-size:11px;font-weight:800;color:#3B5BA9}
.rc .v{font-size:22px;font-weight:900;color:#1E3A8A;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums}
.rc.big{background:#111827;border-color:#111827}
.rc.big .k{color:#9CA3AF} .rc.big .v{color:#fff}
.tl{display:flex;gap:0;margin:4px 0 2px}
.tl .st{flex:1;border-top:3px solid var(--line);padding-top:9px}
.tl .st.on{border-top-color:var(--blue)}
.tl .st .d{font-size:11px;font-weight:900;color:var(--mut)}
.tl .st.on .d{color:var(--blue)}
.tl .st .h{font-size:13px;font-weight:800;margin-top:2px;line-height:1.45}

/* 캘린더 */
.calbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.calbar .nm{font-size:16px;font-weight:900;margin-right:auto}
.cb{border:1px solid var(--line);background:#fff;color:#374151;border-radius:8px;padding:6px 11px;
  font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
.cb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.calw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cal{border-collapse:collapse;width:100%;min-width:620px;table-layout:fixed}
.cal th{background:#F3F6FB;border:1px solid var(--line);padding:6px 4px;font-size:11.5px;text-align:center}
.cal th.sun{color:var(--red)} .cal th.sat{color:var(--blue)}
.cal td{border:1px solid var(--line);vertical-align:top;padding:4px;height:96px;background:#fff}
.cal td.off{background:#FAFBFD}
.cal td.wk{background:#F8FAFF;width:74px;text-align:center}
.dn{font-size:12px;font-weight:800;color:#374151}
.dn.sun{color:var(--red)} .dn.sat{color:var(--blue)}
.fx{display:block;font-size:10.5px;line-height:1.5;margin-top:3px;padding:2px 5px;border-radius:5px;
  background:var(--blueL);color:#1E3A8A;font-weight:700}
.fx.m{background:#EEF2FF;color:#3730A3} .fx.o{background:var(--ambL);color:var(--amb)}
.mine{display:flex;gap:3px;align-items:flex-start;font-size:10.5px;line-height:1.5;margin-top:3px;
  padding:2px 4px;border-radius:5px;background:var(--grnL);color:#065F46;font-weight:700;cursor:pointer}
.mine .x{margin-left:auto;color:#9CA3AF;font-weight:900}
.add{display:block;width:100%;margin-top:3px;border:1px dashed #CBD5E1;background:transparent;color:#9CA3AF;
  border-radius:5px;font-size:11px;font-family:inherit;padding:1px 0;cursor:pointer}
.wkf{font-size:11px;font-weight:800;color:var(--pur);line-height:1.5}
.wkf i{display:block;font-style:normal;font-size:10px;color:var(--mut);font-weight:600;margin-top:2px}

/* 체크 목록 */
.ck{display:flex;gap:9px;padding:9px 0;border-top:1px solid #F1F4F8;align-items:flex-start;cursor:pointer}
.ck:first-child{border-top:0}
.ck .bx{flex:0 0 auto;width:19px;height:19px;border:1.5px solid #CBD5E1;border-radius:5px;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:#fff}
.ck.on .bx{background:var(--grn);border-color:var(--grn)}
.ck.on .n{color:#9CA3AF;text-decoration:line-through}
.ckmeta{font-size:11px;color:var(--mut);margin:4px 0 0}

/* 인쇄 — tnum 은 쓰지 않는다. 켜고 PDF 로 저장하면 숫자가 유니코드를 잃는다 (CLAUDE.md 4-1). */
.pbtn{position:fixed;right:14px;bottom:14px;z-index:9;border:none;background:var(--blue);color:#fff;
  border-radius:999px;padding:12px 18px;font-size:13px;font-weight:800;font-family:inherit;
  box-shadow:0 6px 18px rgba(26,86,219,.35);cursor:pointer}
@media print{
  body{background:#fff;font-size:11pt}
  .tabs,.pbtn,.hero,.add,.calbar .cb{display:none!important}
  .cal{min-width:0} .cal td{height:78px}
  .wrap{max-width:none;padding:0}
  .pane{display:block!important;break-inside:auto}
  .card,.mt{break-inside:avoid;border-color:#999}
  .sec-h{break-after:avoid}
  .go{border-color:#bbb;color:#333}
  table{min-width:0}
}
</style>
</head>
<body>

<div class="hero"><div class="in">
  <h1>APEX 교육 운영 커리큘럼</h1>
  <div class="sub">신입을 <b>어떻게 가르치고 관리하는가</b> · 매니저가 <b>매일 무엇을 하는가</b> · 월·목 조회를 <b>어떻게 여는가</b><br>
  12주 지식 과정과 화법 자료는 이미 앱 안에 있습니다. 여기는 <b>그것을 굴리는 법</b>만 적습니다.</div>
</div></div>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="pane"></div>
</div>

<button class="pbtn" onclick="window.print()">🖨 인쇄 · PDF</button>

<script>
(function(){
var P = window.EDU_PLAN;
var VIEWS = [
  ['welcome','환영합니다','나'], ['me','나의 목표','나'], ['cal','📅 캘린더','나'],
  ['week','주간 미션','나'], ['monthly','월간 미션','나'], ['study','공부','나'],
  ['path','나의 과정','나'], ['gate','게이트','나'],
  ['lead','지점장','팀을 여는 사람'], ['edu','교육매니저','팀을 여는 사람'],
  ['meet','월·목 조회','팀을 여는 사람'], ['cover','커버 처방','팀을 여는 사람'],
  ['ses','세션 카드','팀을 여는 사람'], ['news','9월 3일','팀을 여는 사람'],
  ['run','이 문서를 굴리는 법','팀을 여는 사람'], ['law','준법','모두']
];
var cur = (location.hash||'').replace('#','') || 'welcome';
if(!VIEWS.some(function(v){return v[0]===cur})) cur='start';

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* plan.js 의 글에는 <b> 만 들어 있다 — 그것만 살리고 나머지는 글자로 둔다 */
function rich(s){return esc(s).replace(/&lt;(\/?b)&gt;/g,'<$1>');}

/* 화면 단추 — 이름표는 plan.js 의 screens 한 벌에서만 가져온다 */
function gos(ids){
  if(!ids||!ids.length) return '';
  var h='<div class="gos">';
  for(var i=0;i<ids.length;i++){
    var id=ids[i], nm=P.screens[id];
    if(!nm) continue;                       /* 이름표에 없는 화면은 링크를 만들지 않는다 */
    h+='<a class="go" target="_top" href="../index.html?go='+encodeURIComponent(id)+'">'+esc(nm)+' →</a>';
  }
  return h+'</div>';
}
function row(tag,cls,name,sub,ids){
  return '<div class="row"><span class="tag '+(cls||'')+'">'+esc(tag)+'</span><div class="bodyt">'+
    '<div class="n">'+rich(name)+'</div>'+
    (sub?'<div class="s">'+rich(sub)+'</div>':'')+gos(ids)+'</div></div>';
}
function card(t,d,body){
  return '<div class="card"><div class="hd"><div class="t">'+rich(t)+'</div>'+
    (d?'<div class="d">'+rich(d)+'</div>':'')+'</div><div class="bd">'+body+'</div></div>';
}
function rules(list,cls){
  var h='<div class="note '+(cls||'')+'"><b>지키는 것</b><ul class="rl">';
  for(var i=0;i<list.length;i++) h+='<li>'+rich(list[i])+'</li>';
  return h+'</ul></div>';
}

/* ── 화면들 ── */
function vRun(){
  var h='<div class="note b">새로 오신 분은 이 칸이 아니라 <b>「환영합니다」</b>부터 보십니다. '+
    '여기는 <b>이 문서를 굴리는 사람</b>이 보는 칸입니다.</div>'+
    '<div class="sec-h">이 커리큘럼이 없는 것</div>'+
    '<div class="note b">여기에 <b>12주 지식 과정</b>과 <b>미끼 화법 27장</b>은 없습니다. 빠뜨린 것이 아닙니다 — '+
    '이미 앱 안에 있고, 같은 것을 두 곳에 두면 <b>한쪽만 낡습니다.</b> 이 문서는 그것을 <b>언제·누가·어떻게 확인하는지</b>만 정합니다.'+
    gos(['academy','bohum','mikki_talk','fp_talk'])+'</div>';
  h+='<div class="sec-h">운영 3원칙</div>';
  for(var i=0;i<P.principles.length;i++){
    var p=P.principles[i];
    h+=card(''+(i+1)+'. '+p[0],'','<div class="s" style="font-size:13px;line-height:1.85">'+rich(p[1])+'</div>'+gos(p[2]));
  }
  h+='<div class="sec-h">매니저 관리 문화</div><div class="card"><div class="bd">';
  for(var j=0;j<P.culture.length;j++)
    h+=row('·','p',P.culture[j][0],P.culture[j][1],null);
  h+='</div></div>';
  h+='<div class="sec-h">새로 온 사람에게 이 순서로 줍니다</div><div class="card"><div class="bd">'+
    row('첫날','g','「환영합니다」를 <b>같이</b> 엽니다','혼자 읽으라고 던지지 않습니다. 약속과 「하지 않는 일」은 옆에서 같이 읽습니다.',null)+
    row('첫날','g','갈래를 고르고 <b>시작일을 박습니다</b>','이걸 안 하면 며칠째인지도, 게이트가 언제인지도 아무도 모릅니다.',null)+
    row('첫 주','b','「나의 목표」 다섯 칸을 <b>같이</b> 채웁니다','수수료 값은 매니저가 회사 표를 열어 알려 줍니다 — 앱은 이 값을 모릅니다.',null)+
    row('둘째 주','p','「주간 미션」과 「캘린더」로 넘깁니다','이때부터 혼자 굴러갑니다.',null)+
    '</div></div>';
  h+='<div class="sec-h">어디에 무엇이 있나</div><div class="card"><div class="bd">'+
    row('본인','g','환영합니다 · 나의 목표 · 나의 과정','새로 온 사람이 <b>스스로</b> 여는 칸입니다',null)+
    row('매일','b','주간 미션 · 캘린더','요일마다 하는 일이 다릅니다 — 월 명단 · 화 전화 · 수 상담 · 목 결정 · 금 정리',null)+
    row('매달','g','월간 미션','네 주의 초점 — 채운다 · 연다 · 닫는다 · 심는다',null)+
    row('지점장','r','지점장 리스트','<b>숫자</b>를 봅니다 — 하루·주·달·분기, 눌러서 지웁니다',null)+
    row('교육','r','교육매니저 리스트','<b>사람과 자료</b>를 봅니다 — 지점장과 겹치지 않게 갈라 뒀습니다',null)+
    '</div></div>';
  h+='<div class="note">이 표를 고칠 때는 <code>app/교육/plan.js</code> <b>한 곳만</b> 고칩니다. 이 화면은 그것을 그리기만 합니다.</div>';
  return h;
}

function vNews(){
  var s=null;
  for(var i=0;i<P.sessions.length;i++) if(P.sessions[i].key==='news') s=P.sessions[i];
  if(!s) return '';
  var h='<div class="sec-h">'+esc(s.when)+' · 담당 '+esc(s.who)+'</div>';
  h+='<div class="card"><div class="hd"><div class="t">'+rich(s.title)+'</div>'+
     '<div class="d">'+rich(s.why)+'</div></div><div class="bd">';
  for(var j=0;j<s.flow.length;j++){
    var f=s.flow[j];
    h+=row(f[0],'g',f[1],f[2],f[3]);
  }
  h+='</div></div>';

  h+=card('소식지 한 장 — 여섯 칸','칸을 늘리지 않습니다. 한 장을 넘기면 아무도 안 읽습니다.',
    (function(){
      var t='<div class="tw"><table><tr><th style="width:46px">칸</th><th>무엇을 적나</th></tr>';
      for(var k=0;k<s.sheet.length;k++) t+='<tr><td><b>'+(k+1)+'</b></td><td>'+rich(s.sheet[k])+'</td></tr>';
      return t+'</table></div>';
    })());
  h+=rules(s.rules,'r');

/* ══ 캘린더 ══
   고정 리듬은 plan.js 에서 계산한다 — 여기에 요일 이름을 다시 적지 않는다. */
var CAL={cur:new Date()};
function calMine(k){var all=lsGet(CAL_KEY,{});return all[k]||[];}
function calSet(k,list){var all=lsGet(CAL_KEY,{});all[k]=list;
  if(!lsSet(CAL_KEY,all))alert('이 브라우저에 저장하지 못했습니다. 시크릿 창이거나 저장 공간이 막혀 있습니다.');}
function calAdd(ds){
  var t=prompt('무엇을 넣을까요?\n\n· 고객 실명은 적지 않습니다 — 「김○○」\n· 한 날에 셋을 넘기지 않습니다');
  if(t===null)return; t=String(t).replace(/\s+/g,' ').trim(); if(!t)return;
  if(t.length>40)t=t.slice(0,40);
  var k=ym(CAL.cur), list=calMine(k);
  if(list.filter(function(x){return x.d===ds;}).length>=3){
    alert('이 날은 이미 셋입니다.\n넷째를 넣으면 그날은 아무것도 안 됩니다 — 다른 날로 옮기세요.');return;}
  list.push({d:ds,t:t}); calSet(k,list); paint();
}
function calDel(ds,i){
  var k=ym(CAL.cur), list=calMine(k), n=-1;
  for(var j=0;j<list.length;j++){if(list[j].d===ds){n++;if(n===i){list.splice(j,1);break;}}}
  calSet(k,list); paint();
}
function calMove(n){CAL.cur=new Date(CAL.cur.getFullYear(),CAL.cur.getMonth()+n,1);paint();}
function calToday(){CAL.cur=new Date();paint();}
function calClear(){
  if(!confirm('이 달에 <내가 넣은 것>만 지웁니다. 고정 리듬은 그대로입니다. 지울까요?'.replace(/[<>]/g,'')))return;

}
function calWeekNo(day){return Math.min(4,Math.ceil(day/7));}

function vCal(){
  var Y=CAL.cur.getFullYear(), M=CAL.cur.getMonth();

  var DOW=['일','월','화','수','목','금','토'];

  var h='<div class="calbar">'+

    /* 이 줄에 걸리는 첫 날짜로 주차를 정한다 */
    var anchor=day; for(var a=day;a<day+7;a++){if(a>=1&&a<=lastDay){anchor=a;break;}}
    var wn=calWeekNo(anchor), f=P.monthly.weeks[wn-1];
    h+='<tr><td class="wk">'+(rowShown[wn]?'<span class="mini">이어서</span>':
      '<div class="wkf">'+esc(f[0])+'<i>'+esc(f[1])+'</i></div>')+'</td>';

      if(dw==='월'||dw==='목') h+='<span class="fx o">조회 40분</span>';
      if(day===1) h+='<span class="fx m">달 열기</span>';

      var k2=0;

        h+='<span class="mine" data-del="'+ds+'" data-i="'+k2+'">'+esc(mine[m2].t)+
           '<span class="x">×</span></span>'; k2++; }
      if(k2<3) h+='<button class="add" data-add="'+ds+'" title="이 날에 넣기">+</button>';
      h+='</td>';
    }

/* ══ 체크 목록 — 하루는 날짜가 바뀌면, 주간은 월요일에, 월간은 1일에 스스로 비워진다 ══ */
function ckStamp(scope){
  var d=new Date();
  if(scope==='day')return ymd(d);
  if(scope==='week'){var t=new Date(d);t.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(t);}
  return ym(d);
}
function ckState(role,scope){
  var all=lsGet(CK_KEY,{}), k=role+'.'+scope, o=all[k];
  if(!o||o.s!==ckStamp(scope))return {s:ckStamp(scope),on:{}};
  return o;
}
function ckTog(role,scope,id){
  var all=lsGet(CK_KEY,{}), k=role+'.'+scope, o=ckState(role,scope);
  o.on[id]=!o.on[id]; all[k]=o; lsSet(CK_KEY,all); paint();
}
function ckList(role,scope,items,label){
  var st=ckState(role,scope), done=0, h='<div class="card"><div class="hd"><div class="t">'+esc(label)+'</div>'+
    '<div class="d" id="ckd-'+role+'-'+scope+'"></div></div><div class="bd">';
  for(var i=0;i<items.length;i++){
    var it=items[i], on=!!st.on[i]; if(on)done++;
    h+='<div class="ck'+(on?' on':'')+'" data-ck="'+role+'|'+scope+'|'+i+'">'+
       '<span class="bx">'+(on?'✓':'')+'</span><div class="bodyt">'+
       '<div class="n"><span class="tag" style="min-width:0;padding:2px 6px;margin-right:6px">'+esc(it[0])+'</span>'+rich(it[1])+'</div>'+
       (it[2]?'<div class="s">'+rich(it[2])+'</div>':'')+gos(it[3])+'</div></div>';
  }
  h+='<p class="ckmeta">'+done+' / '+items.length+' · '+
     (scope==='day'?'날짜가 바뀌면':scope==='week'?'월요일에':scope==='month'?'1일에':'')+
     (scope==='quarter'?'분기 항목은 스스로 비우지 않습니다 — 눌러서 끕니다':' 스스로 비워집니다')+
     ' · 이 브라우저에만 남습니다</p></div></div>';
  return h;
}

  if((v=el.getAttribute('data-add'))) return calAdd(v);
  if((v=el.getAttribute('data-del'))!==null&&v!==undefined&&el.hasAttribute('data-del'))
    return calDel(v,parseInt(el.getAttribute('data-i'),10)||0);
  if((v=el.getAttribute('data-cal'))){
    if(v==='prev')return calMove(-1);
    if(v==='next')return calMove(1);
    if(v==='today')return calToday();
    if(v==='clear')return calClear();
    return;
  }
  if((v=el.getAttribute('data-ck'))){var a=v.split('|');return ckTog(a[0],a[1],parseInt(a[2],10));}
  if((v=el.getAttribute('data-tk'))){meSet('track',v);return paint();}
});
/* 치는 동안 담고, 손을 뗄 때 다시 그린다.
   담기를 change 에만 걸면 칸을 채우고 탭을 옮겨 버렸을 때 <b>말없이 사라진다</b>.
   그리기를 input 에 걸면 한 글자마다 다시 그려 커서가 튄다. 그래서 둘로 나눈다. */
function fieldSave(el){
  var k;
  if(!el||!el.getAttribute) return false;
  if((k=el.getAttribute('data-me'))){meSet(k,String(el.value||'').trim());return true;}
  if((k=el.getAttribute('data-goal'))){
    var o=me(); o.goal=o.goal||{};
    var n=parseFloat(el.value);
    if(isFinite(n)&&n>0)o.goal[k]=n; else delete o.goal[k];
    lsSet(ME_KEY,o); return true;
  }
  return false;
}
var pane=document.getElementById('pane');
pane.addEventListener('input',function(e){fieldSave(e.target);});
pane.addEventListener('change',function(e){if(fieldSave(e.target))paint();});
document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('.tb'); if(!b) return;
  cur=b.getAttribute('data-v'); try{location.hash=cur;}catch(x){}
  paint();
});
/* 인쇄할 때는 전부 펼친다 — 한 칸만 뽑히면 종이가 반쪽이 된다 */
window.addEventListener('beforeprint',function(){
  var all='',i;
  for(i=0;i<VIEWS.length;i++) all+='<div class="pane">'+RENDER[VIEWS[i][0]]()+'</div>';
  /* 종이는 팀 전체가 돌려 봅니다 — 화면에서 안 고른 갈래도 인쇄본에는 담습니다 */
  var t=track(), other=(t==='career')?'new':'career';
  var oa=P.arc[other], ah='';
  for(i=0;i<oa.length;i++) ah+=row(oa[i][0],'p',oa[i][1],oa[i][2],null);
  all+='<div class="pane"><div class="sec-h">'+(other==='career'?'경력 · 여덟 주':'신입 · 열두 주')+
       ' — 다른 갈래</div><div class="card"><div class="bd">'+ah+'</div></div>'+
       gateTable(other)+((other==='career')?vCareer():vNewbie())+'</div>';
  document.getElementById('pane').innerHTML=all;
});
window.addEventListener('afterprint',paint);
paint();
})();
</script>

<title>블로그 공장 — APEX</title>
<!--
  블로그 공장 — <b>블로그에 올리는 일</b> 하나만 하는 화면
  ══════════════════════════════════════════════════════════════════════
  이것은 CRM 안의 기능이 아니다. <b>글을 올리는 일</b>이 주인공이라
  따로 떼어 놓았다. 앱을 열고 메뉴를 찾아 들어가는 동안 오늘 발행이
  끝나 버리기 때문이다. 주소만 눌러 바로 열고, 여기서 끝난다.

  세 걸음이면 끝난다.
     ① 오늘 쓸 것 고르기 — 글감은 이미 있는 것에서 나온다
     ② 초안 — 그 글감에 묶여서 나온다
     ③ 올리기 — <b>서식 있는 복사</b> + <b>그림 내려받기</b>

  ③ 이 이 화면의 이유다. 마크다운을 그대로 붙이면 네이버 편집기에는
  <b>## 이 글자 그대로 보인다.</b> 제목도 표도 안 산다. 그래서 여기서
  <b>서식(HTML)으로 복사</b>한다 — 붙이면 제목·표·인용이 그대로 선다.

  <b>지어내지 않는 규칙은 그대로다.</b>
    · 글감이 없으면 그 줄은 비워 둔다 (없는 것을 만들지 않는다)
    · 근거에 없는 수치는 [[확인 필요: …]] 로 남는다
    · 세금은 요건만 · 보험료는 「심사 결과에 따릅니다」
    · 실명이 남아 있으면 잡는다
    · 축·눈금이 있는 그래프는 그리지 않는다 — 그 숫자가 우리에게 없다

  <b>자료를 여기에 다시 적어 두지 않았다.</b>
    8통장 이름 · 순서표 · 메뉴 이름  →  apex-map-data.js (지도)
    뉴스                              →  /api/market?kind=news&cat=…
                                         (칸은 config/sources.json 이 정한다)
    준법 문구                          →  config/compliance.json
    AI 연결 · 내 소개                  →  앱에 저장해 둔 그 값 (같은 브라우저)
  한 곳이 바뀌면 여기도 같이 바뀐다. 두 벌로 적어 두면 한쪽만 늙는다.
-->

button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:var(--bg);

button.p:hover{filter:brightness(1.08)}

.note{font-size:11.5px;color:var(--sub);background:var(--soft);border:1px solid var(--line);
      border-radius:9px;padding:9px 11px;line-height:1.7;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0F172A;color:#fff;
       padding:9px 16px;border-radius:22px;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;
       transition:opacity .2s;z-index:99;max-width:90vw}
.toast.on{opacity:.96}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--brand);
      border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:640px){.wrap{padding:10px 10px 70px}.card{padding:13px}}

const S = { rows:[], perweek:2, busy:-1, news:{ at:'', items:[], err:'' }, comply:null };

function mine(k){ try{ const v=JSON.parse(localStorage.getItem(MINE(k))||'[]'); return v.push?v:[]; }catch(e){ return []; } }
function mineSave(k,a){ try{ localStorage.setItem(MINE(k),JSON.stringify(a)); }catch(e){} }
function mineAdd(k){
  const el=$('mine_'+k); if(!el) return;
  const q=(el.value||'').trim();
  if(q.length<5){ toast('조금 더 적어 주세요.'); return; }
  const nm=names(q);
  if(nm.length){ toast('이름 같은 말이 있습니다('+nm[0]+'). 이름은 빼고 적어 주세요.'); return; }
  const a=mine(k); a.unshift({q,at:today()}); mineSave(k,a); el.value=''; paint();
}
function mineDel(k,i){ const a=mine(k); a.splice(i,1); mineSave(k,a); paint(); }

/* ══════════ 글감 ══════════ 없으면 없다고 한다 */
function newsSeeds(kind){
  const want=KINDS[kind].cat.split(',');
  return (S.news.items||[]).filter(n=>want.includes(n.cat)).slice(0,24).map(n=>({
    kind, title:n.t, link:n.u||'', paper:n.s||'', when:n.d||'',
    src:'기사 「'+n.t+'」 · '+(n.s||'언론사 미상')+(n.d?(' · '+n.d):'')+(n.u?('\n'+n.u):'')
  }));
}
function mineSeeds(kind,what){
  return mine(kind).map(x=>({ kind, title:x.q, src:what+' — '+(x.at||'')+' 에 적어 두신 것' }));
}
function listSeeds(kind,list,what){
  return list.map(x=>({ kind, title:x.t, doing:x.d, src:what+' 「'+x.t+'」' }));
}
/* 순서표는 <b>지도에서 그대로</b>. 지도를 못 읽으면 만들지 않는다. */
function growthSeeds(){
  if (typeof APEX_MAP==='undefined' || !APEX_MAP || !APEX_MAP.recipes) return [];
  const nm=APEX_MAP.names||{};
  return APEX_MAP.recipes.filter(r=>r&&r.q&&r.steps&&r.steps.length).map(r=>{
    const named=r.steps.map(s=>nm[s.id]||s.id);
    return { kind:'growth', title:r.q, why:r.why||'', real:r.real||'',
      steps:r.steps.map((s,i)=>(i+1)+'. '+(nm[s.id]||s.id)+' — '+(s['do']||'')).join('\n'),
      src:'APEX 전체 지도의 순서표 「'+r.q+'」 — '+named.join(' → ') };
  });
}
function seeds(){
  return {
    econ: newsSeeds('econ'), news: newsSeeds('news'),
    ask: mineSeeds('ask','상담에서 나온 질문'),
    ours: listSeeds('ours',OURS,'우리가 실제로 하는 일'),
    culture: listSeeds('culture',CULTURE,'우리가 실제로 지키는 방식').concat(mineSeeds('culture','적어 두신 우리 문화')),
    growth: growthSeeds()
  };
}

/* ══════════ 뉴스 — 서버 창구에서 칸별로 받는다 ══════════
   낱말표를 여기 다시 적지 않는다. 어느 매체가 어느 칸인지는
   config/sources.json 이 정하고, 서버가 그대로 나눠 준다. */
async function pullNews(){
  const b=$('btnNews'); b.disabled=true; b.innerHTML='<span class="spin"></span> 받는 중…';
  const cats=[...new Set(ORDER.filter(k=>KINDS[k].cat).flatMap(k=>KINDS[k].cat.split(',')))];
  const items=[], errs=[];
  for (const c of cats){
    try{
      const h={Accept:'application/json'};
      const tok=LS('apptoken'); if(tok) h['X-App-Token']=tok;
      const r=await fetch('/api/market?kind=news&cat='+encodeURIComponent(c),{headers:h});
      const txt=await r.text();
      if(r.status===401) throw new Error('공유 토큰이 맞지 않습니다');
      if(!r.ok) throw new Error('서버가 '+r.status+' 로 답했습니다');
      let j; try{ j=JSON.parse(txt); }
      catch(e){ throw new Error('서버 창구(/api/market)가 아직 없습니다'); }
      for (const n of (j.news||j.items||[])){
        const t=String(n.title||'').replace(/<[^>]+>/g,'').trim();
        if(!t||items.some(x=>x.t.slice(0,28)===t.slice(0,28))) continue;
        items.push({ t, u:n.link||'', s:n.source||'', d:String(n.date||'').slice(0,16), cat:c });
      }
    }catch(e){ errs.push(c+': '+(e.message||'실패')); }
  }
  S.news={ at:new Date(Date.now()+9*36e5).toISOString().replace('T',' ').slice(0,16),
           items, err:errs.join(' · ') };
  save(); b.disabled=false; b.textContent='📰 오늘 뉴스 받기'; paint();
  toast(items.length ? (items.length+'건 받았습니다') : ('못 받았습니다 — '+(errs[0]||'기사가 없습니다')));
}

/* ══════════ 편성 ══════════ */
function dlabel(plus){
  const d=new Date(Date.now()+9*36e5+plus*864e5);
  return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+'('+['일','월','화','수','목','금','토'][d.getUTCDay()]+')';
}
function plan(){
  const s=seeds(), used={}, rows=[];
  ORDER.forEach(k=>used[k]=0);
  const n=S.perweek*4, gap=Math.max(1,Math.round(7/S.perweek));
  for(let i=0;i<n;i++){
    const kind=MIX[i%MIX.length], pool=s[kind]||[];
    const seed=pool.length?pool[used[kind]%pool.length]:null;
    used[kind]++;
    rows.push({ when:dlabel(i*gap+1), kind, seed, out:'', guard:null, up:false });
  }
  S.rows=rows; save(); paint();
  const empty=rows.filter(r=>!r.seed).length;
  toast(empty ? (n+'편 편성 — 글감이 없어 '+empty+'줄은 비워 뒀습니다') : (n+'편을 편성했습니다'));
}
function setWeek(n){ S.perweek=n; save(); paint(); }

async function comply(){
  if(S.comply!==null) return S.comply;

/* ══════════ AI — 앱에 저장해 둔 연결을 그대로 쓴다 ══════════ */
function aiReady(){ return LS('conn')==='proxy' ? !!LS('proxy') : !!LS('apikey'); }
async function ask(system,user,max){
  const proxy=LS('conn')==='proxy';
  const url=proxy?LS('proxy'):'https://api.anthropic.com/v1/messages';
  if(!url) throw new Error('앱 설정에서 AI 를 먼저 연결해 주세요.');
  const headers={'Content-Type':'application/json'};
  if(proxy){ const t=LS('apptoken'); if(t) headers['X-App-Token']=t; }
  else{ const k=LS('apikey'); if(!k) throw new Error('앱 설정에서 AI 를 먼저 연결해 주세요.');
        headers['x-api-key']=k; headers['anthropic-version']='2023-06-01';
        headers['anthropic-dangerous-direct-browser-access']='true'; }
  const model=LS('model'); const messages=[{role:'user',content:user}];
  let out='';
  /* 길이 제한에 걸리면 이어 쓴다 — 블로그 글은 길어서 한 번에 안 끝난다 */
  for(let round=0; round<4; round++){
    const payload={ max_tokens:max||9000, system, messages };
    if(model) payload.model=model;
    const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(payload)});
    const txt=await r.text();
    if(!r.ok){ let m=txt; try{ const j=JSON.parse(txt); m=(j.error&&j.error.message)||j.message||txt; }catch(e){}
               throw new Error(m.slice(0,200)); }
    const j=JSON.parse(txt);
    const t=typeof j.text==='string' ? j.text
      : (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    out+=t;
    if(j.stop_reason!=='max_tokens'||!t) break;
    messages.push({role:'assistant',content:t.replace(/\s+$/,'')});
    messages.push({role:'user',content:'방금 응답이 길이 제한으로 끊겼어. 마지막 글자 바로 다음부터 인사말 없이 이어서 끝까지 완성해줘. 이미 쓴 내용은 반복하지 마.'});
  }
  return out;
}

  '[절대 규칙]\n'+

  '5. 고객 실명·동료 실명·특정할 수 있는 사연을 쓰지 않는다. 예를 들 때는 「40대 직장인」 처럼 일반화하고, 이름이 필요하면 홍길동을 쓴다.\n'+

  '9. 글 끝에 「## 이 글이 딛고 선 것」 을 두고 받은 [근거] 를 그대로 옮겨 적는다.';

function userPrompt(row){
  const s=row.seed, d=KINDS[row.kind];
  return '[근거]\n'+s.src+'\n\n[읽는 사람] '+d.reader+
    '\n\n[쓸 수 있는 그림] '+d.art.map(a=>'「'+ART[a].t+'」').join(' · ')+
    ' — 이 이름들만 쓴다. 우리가 직접 그려 넣을 수 있는 그림이 이것뿐이다.\n\n'+d.order(s)+
    '\n\n[출력 형식 — Markdown]\n## 제목 후보 3개\n## 본문\n소제목(##) 4~5개, 소제목마다 5문장 이상. 비교표 1개 이상. [쓸 수 있는 그림] 중에서 골라 [이미지: 그림 이름 | alt: 대체텍스트] 자리표시를 본문에 넣는다.\n## 해시태그\n10개(대형+롱테일)\n## 메타 설명\n2줄\n## 이 글이 딛고 선 것\n위 [근거] 를 그대로 옮겨 적는다.';
}
async function draft(i){
  const row=S.rows[i]; if(!row) return;
  if(!row.seed){ toast('이 줄은 글감이 없습니다. 위에서 글감을 채워 주세요.'); return; }
  if(!aiReady()){ toast('앱 설정에서 AI 를 먼저 연결해 주세요.'); return; }
  if(S.busy>=0){ toast('한 편씩 만듭니다.'); return; }
  S.busy=i; paint();
  try{
    await comply();
    row.out=await ask(sysPrompt(),userPrompt(row),9000);
    row.guard=guard(row.out,row.kind);
    S.busy=-1; save(); paint(); show(i);
  }catch(e){ S.busy=-1; paint(); toast('만들지 못했습니다 — '+(e.message||'네트워크 오류')); }
}

/* ══════════ 발행 게이트 ══════════ */
function names(t){
  const out=[]; let m; const re=/([가-힣]{2,4})(님|씨)(?![가-힣])/g;
  while((m=re.exec(t))){ const w=m[1]+m[2];
    if(NOTNAME[w]||NOTNAME[m[1]]) continue;
    if(!out.includes(w)) out.push(w); }
  return out;
}
function artAsked(t){
  const out=[]; let m; const re=/\[이미지\s*:\s*([^\]|]+)/g;
  while((m=re.exec(t))){ const n=m[1].replace(/\s+/g,'').replace(/[「」'"]/g,'');
    if(n&&!out.includes(n)) out.push(n); }
  return out;
}
/* 넉넉히 견준다 — 이름이 조금 달라도 같은 그림이면 통과시킨다 */
function artMissing(t,kind){
  const have=(KINDS[kind]?KINDS[kind].art:[]).map(a=>ART[a].t.replace(/\s+/g,''));
  return artAsked(t).filter(a=>!have.some(b=>a.includes(b)||b.includes(a)));
}
function guard(t,kind){
  const hits=[];
  BAN.forEach(b=>{ b.re.lastIndex=0; let m; while((m=b.re.exec(t))) hits.push({w:m[0],why:b.why}); });
  names(t).forEach(n=>hits.push({w:n,why:'사람 이름처럼 보입니다 — 실명은 나가면 안 됩니다'}));
  const miss=NEED.filter(n=>n.when.test(t)&&!n.must.test(t)).map(n=>n.why);
  const noart=kind?artMissing(t,kind):[];
  noart.forEach(n=>miss.push('「'+n+'」 는 우리가 그릴 수 있는 그림이 아닙니다 — 목록의 그림으로 바꾸거나 그 자리를 지우세요'));
  const holes=t.match(/\[\[확인\s*필요[^\]]*\]\]/g)||[];
  return { hits, miss, holes, noart, ok:!hits.length&&!miss.length&&!holes.length };
}
</script>
<script src="블로그-그림.js"></script>
<script>
/* ══════════ 마크다운 → 보이는 글 ══════════
   네이버 편집기는 마크다운을 모른다. 「##」 이 글자 그대로 보인다.
   그래서 여기서 HTML 로 만들고, <b>서식 있는 복사</b>로 넘긴다. */
function md2html(md,forPaste){
  const lines=String(md||'').split('\n');
  let h='', inTable=false, tRows=[], inList='';
  const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\[\[확인\s*필요([^\]]*)\]\]/g, forPaste?'[확인 필요$1]':'<span class="hole">[[확인 필요$1]]</span>');
  const flushList = () => { if(inList){ h+='</'+inList+'>'; inList=''; } };
  const flushTable = () => {
    if(!inTable) return;
    const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    const head=cells(tRows[0]), body=tRows.slice(2).map(cells);
    h+='<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
       body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    inTable=false; tRows=[];
  };
  for(const raw of lines){
    const s=raw.trim();
    if(/^\|.*\|$/.test(s)){ if(!inTable){ flushList(); inTable=true; tRows=[]; } tRows.push(s); continue; }
    flushTable();
    if(!s){ flushList(); continue; }
    const img=s.match(/^\[이미지\s*:\s*([^\]|]+)(?:\|\s*alt\s*:\s*([^\]]*))?\]$/);
    if(img){ flushList();
      h+='<div class="ph">🖼️ 여기에 <b>'+esc(img[1].trim())+'</b> 그림을 넣으세요'+
         (img[2]?' <span style="font-weight:400">(alt: '+esc(img[2].trim())+')</span>':'')+'</div>'; continue; }
    let m;
    if((m=s.match(/^###\s+(.*)$/))){ flushList(); h+='<h3>'+inline(m[1])+'</h3>'; continue; }
    if((m=s.match(/^##\s+(.*)$/))){ flushList(); h+='<h2>'+inline(m[1])+'</h2>'; continue; }
    if((m=s.match(/^#\s+(.*)$/))){ flushList(); h+='<h2>'+inline(m[1])+'</h2>'; continue; }
    if((m=s.match(/^>\s?(.*)$/))){ flushList(); h+='<blockquote>'+inline(m[1])+'</blockquote>'; continue; }
    if((m=s.match(/^[-*]\s+(.*)$/))){ if(inList!=='ul'){ flushList(); h+='<ul>'; inList='ul'; }
      h+='<li>'+inline(m[1])+'</li>'; continue; }
    if((m=s.match(/^\d+[.)]\s+(.*)$/))){ if(inList!=='ol'){ flushList(); h+='<ol>'; inList='ol'; }
      h+='<li>'+inline(m[1])+'</li>'; continue; }
    flushList(); h+='<p>'+inline(s)+'</p>';
  }
  flushTable(); flushList();
  return h;
}

/* ══════════ 올리기 ══════════ 이 화면의 이유 */
function packText(i){
  const row=S.rows[i], c=S.comply, out=row.out;
  let tail='';
  if(c){
    tail='\n\n──────────\n'+(c['카드_하단_고정']||'');
    if(/변액|펀드|주식|투자|ETF|수익률/.test(out)&&c['투자상품_문구']) tail+='\n'+c['투자상품_문구'];
    if(/달러|외화|환율/.test(out)&&c['달러보험_문구']) tail+='\n'+c['달러보험_문구'];
    if(/세액공제|비과세|절세|상속|증여|과세/.test(out)&&c['세제_문구']) tail+='\n'+c['세제_문구'];
  }else{
    tail='\n\n──────────\n[준법 문구를 못 읽었습니다 — config/compliance.json 을 확인하고 회사 문구를 직접 붙여 주세요]';
  }
  return out+tail;
}
/* 서식 있는 복사 — 붙이면 제목·표·인용이 그대로 선다.
   안 되는 브라우저에서는 글자만이라도 넘어가게 한다. */
async function copyRich(i){
  const row=S.rows[i];
  if(!row.guard||!row.guard.ok){ toast('고칠 곳이 남아 있습니다. 위 빨간 칸을 먼저 처리해 주세요.'); return; }
  const text=packText(i);
  const html='<div style="font-family:sans-serif;line-height:1.7">'+md2html(text,true)+'</div>';
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html],{type:'text/html'}),
        'text/plain': new Blob([text],{type:'text/plain'})
      })]);
      toast('서식까지 복사했습니다 — 편집기에 그대로 붙여넣으세요');
      return;
    }
    throw new Error('no clipboarditem');
  }catch(e){
    try{ await navigator.clipboard.writeText(text); toast('글자만 복사했습니다 (이 브라우저는 서식 복사를 못 합니다)'); }
    catch(e2){ toast('복사하지 못했습니다 — 아래 글을 직접 끌어서 복사해 주세요'); }
  }
}
async function copyPlain(i){
  try{ await navigator.clipboard.writeText(packText(i)); toast('마크다운 그대로 복사했습니다'); }
  catch(e){ toast('복사하지 못했습니다'); }
}
async function downAll(i){
  const row=S.rows[i], ids=KINDS[row.kind].art;
  let n=0;
  for(const id of ids){
    const r=build(id,row);
    if(r.err) continue;
    png(r); n++;
    await new Promise(r2=>setTimeout(r2,500));   /* 한꺼번에 부르면 브라우저가 막는다 */
  }
  toast(n?(n+'장을 내려받았습니다'):'내려받을 그림이 없습니다');
}
function markUp(i,on){ S.rows[i].up=on; save(); paint(); if(on) toast('올린 것으로 표시했습니다'); }

/* ══════════ 그리기 ══════════ */
function whoChip(r){ return '<span class="who '+(r==='고객'?'c':'t')+'">'+(r==='고객'?'고객이 읽는 글':'동료가 읽는 글')+'</span>'; }
function paintSeeds(){
  const s=seeds();
  $('seeds').innerHTML=ORDER.map(k=>{
    const d=KINDS[k], n=(s[k]||[]).length;
    let h='<div class="seed"><div class="t">'+d.ic+' '+esc(d.t)+
      ' <span style="color:var(--sub);font-weight:700">· 글감 '+n+'개</span> '+whoChip(d.reader)+'</div>'+
      '<div class="w">'+d.why+'</div>'+
      (n||!d.empty?'':'<div class="e">'+d.empty+'</div>');
    if(d.mine){
      const a=mine(k);
      h+='<div style="margin-top:7px"><label>'+d.mine.label+'</label>'+
         '<div class="row"><input id="mine_'+k+'" placeholder="'+esc(d.mine.ph)+
         '" onkeydown="if(event.key===\'Enter\')mineAdd(\''+k+'\')" style="flex:1;min-width:180px">'+
         '<button class="sm" onclick="mineAdd(\''+k+'\')">＋ 담기</button></div>';
      if(a.length) h+='<div style="margin-top:6px">'+a.slice(0,12).map((x,j)=>
        '<span class="chip">'+esc(x.q.slice(0,30))+' <a onclick="mineDel(\''+k+'\','+j+')">×</a></span>').join('')+'</div>';
      h+='</div>';
    }
    return h+'</div>';
  }).join('');
  $('wk').innerHTML=[1,2,3,5].map(n=>'<button class="sm'+(S.perweek===n?' p':'')+'" onclick="setWeek('+n+')">'+n+'편</button>').join(' ');
  const c={}; MIX.forEach(k=>c[k]=(c[k]||0)+1);
  $('mixNote').innerHTML='열 편 도는 비율 — <b>'+ORDER.filter(k=>c[k]).map(k=>KINDS[k].ic+' '+KINDS[k].t+' '+c[k]).join(' · ')+
    '</b>. 홍보는 <b>열에 한 편</b>입니다 — 자랑만 올리는 블로그는 읽히지 않아서, 읽히는 글이 있어야 그 한 편이 읽힙니다. '+
    '<b>동료가 읽는 글</b>(문화·성장)은 고객 글과 섞이면 둘 다 흐려집니다 — 블로그를 따로 두시거나 분류를 나눠 올리세요.';
}
function paintRows(){
  if(!S.rows.length){ $('rows').innerHTML='<div class="note">아직 편성하지 않았습니다. 위에서 «한 달치 편성»을 누르세요.</div>'; return; }
  $('rows').innerHTML='<table><thead><tr><th>날짜</th><th>갈래</th><th>누가 읽나</th><th>글감</th><th>상태</th><th></th></tr></thead><tbody>'+
    S.rows.map((r,i)=>{
      const d=KINDS[r.kind]; if(!d) return '';
      const st=r.up?'<b style="color:var(--ok)">올림 ✓</b>'
        :r.out?(r.guard&&r.guard.ok?'<b style="color:var(--ok)">초안 ✅</b>':'<b style="color:var(--bad)">고칠 곳</b>')
        :(S.busy===i?'<span class="spin"></span> 만드는 중':'<span style="color:var(--dim)">—</span>');
      return '<tr><td>'+esc(r.when)+'</td><td style="white-space:nowrap">'+d.ic+' '+esc(d.t)+'</td>'+
        '<td>'+whoChip(d.reader)+'</td>'+
        '<td>'+(r.seed?esc(r.seed.title.slice(0,40)):'<span style="color:var(--warn)">글감 없음</span>')+'</td>'+
        '<td>'+st+'</td><td style="white-space:nowrap">'+
        (r.seed?'<button class="sm" onclick="draft('+i+')">'+(r.out?'다시':'초안')+'</button> ':'')+
        (r.out?'<button class="sm p" onclick="show('+i+')">올리기</button>':'')+'</td></tr>';
    }).join('')+'</tbody></table>';
}
function gateBox(g){
  if(!g) return '';
  if(g.ok) return '<div class="gate ok">✅ 1차 점검을 통과했습니다. 아래에서 <b>서식 있는 복사</b>와 <b>그림 내려받기</b>로 바로 올리시면 됩니다. 게시 전 회사 준법감시(광고 심의)는 그대로 거치세요.</div>';
  return '<div class="gate no"><b>올리기 전에 고쳐야 합니다.</b><ul>'+
    g.hits.slice(0,8).map(h=>'<li>「<b>'+esc(h.w)+'</b>」 — '+esc(h.why)+'</li>').join('')+
    g.miss.map(m=>'<li>'+esc(m)+'</li>').join('')+
    (g.holes.length?'<li>AI 가 못 채운 자리가 '+g.holes.length+'군데 있습니다 — <b>'+esc(g.holes[0])+
      '</b> 처럼 <span class="hole">노란 칸</span>으로 보입니다. <b>사장님이 확인해 채우셔야</b> 합니다.</li>':'')+
    '</ul></div>';
}
function show(i){
  const row=S.rows[i]; if(!row||!row.out) return;
  const d=KINDS[row.kind], g=row.guard||guard(row.out,row.kind);
  const arts=d.art.map(id=>({id,d:ART[id],r:build(id,row)}));
  const okArts=arts.filter(a=>!a.r.err);
  $('view').innerHTML='<div class="card">'+
    '<h2>③ 올리기 — '+esc(row.when)+' · '+d.ic+' '+esc(d.t)+' '+whoChip(d.reader)+'</h2>'+
    '<div class="desc">이 글이 딛고 선 것 — <b>'+esc(row.seed.src.split('\n')[0])+'</b></div>'+
    gateBox(g)+
    '<div class="row">'+
      '<button class="p" onclick="copyRich('+i+')">📋 서식 있는 복사 (편집기에 그대로)</button>'+
      '<button onclick="copyPlain('+i+')">마크다운으로 복사</button>'+
      '<button onclick="downAll('+i+')">⬇ 그림 '+okArts.length+'장 모두 내려받기</button>'+
      '<button onclick="draft('+i+')">🔄 다시 만들기</button>'+
      (row.up?'<button onclick="markUp('+i+',false)">올림 표시 지우기</button>'
             :'<button onclick="markUp('+i+',true)">✓ 올렸음으로 표시</button>')+
    '</div>'+
    '<ol class="steps">'+
      ['그림을 모두 내려받습니다','«서식 있는 복사»를 누릅니다','편집기에 붙여넣습니다 — 제목·표가 그대로 섭니다',
       '파란 자리마다 이름이 같은 그림을 끌어다 넣고 그 안내 줄은 지웁니다',
       '해시태그·메타 설명을 옮깁니다','회사 준법감시(광고 심의)를 거쳐 발행합니다']
      .map(s=>'<li><input type="checkbox" onchange="this.parentNode.classList.toggle(\'done\',this.checked)"><span>'+s+'</span></li>').join('')+
    '</ol>'+
    '<div class="note">마크다운을 그대로 붙이면 네이버 편집기에는 <b>## 이 글자 그대로</b> 보입니다. '+
      '그래서 <b>서식 있는 복사</b>를 씁니다 — 제목·표·인용이 그대로 섭니다. '+
      '<span class="hole">노란 칸</span>은 <b>AI 가 채우지 못한 자리</b>입니다. 비운 채로 올리지 마십시오.</div>'+
    '<h2 style="margin-top:18px">그림 — 직접 그린 것입니다</h2>'+
    '<div class="desc">남의 삽화를 떠 오지 않습니다. <b>축과 눈금이 있는 그래프는 그리지 않습니다</b> — 그 숫자가 우리에게 없어서, 그리면 그것이 근거가 되어 버립니다.</div>'+
    arts.map(a=>'<div class="art"><div class="t">'+esc(a.d.t)+'</div><div class="w">'+a.d.why+'</div>'+
      (a.r.err?'<div style="font-size:12px;color:var(--warn)">'+esc(a.r.err)+'</div>'
              :'<div class="pv">'+a.r.svg+'</div><div class="alt">alt · '+esc(a.r.alt)+'</div>'+
               '<div class="row"><button class="sm" onclick="pngOne('+i+',\''+a.id+'\')">⬇ PNG</button>'+
               '<button class="sm" onclick="copyAlt('+i+',\''+a.id+'\')">alt 복사</button></div>')+
      '</div>').join('')+
    '<h2 style="margin-top:18px">본문 — 붙여넣으면 이렇게 보입니다</h2>'+
    '<div class="body">'+md2html(packText(i),false)+'</div>'+
  '</div>';
  $('view').scrollIntoView({behavior:'smooth',block:'start'});
}
function pngOne(i,id){ const r=build(id,S.rows[i]); if(r.err){ toast(r.err); return; } png(r); }
function copyAlt(i,id){ const r=build(id,S.rows[i]); if(r.err){ toast(r.err); return; }
  navigator.clipboard.writeText(r.alt).then(()=>toast('alt 를 복사했습니다'),()=>toast('복사하지 못했습니다')); }

function paint(){
  paintSeeds(); paintRows();
  $('tgAi').textContent=aiReady()?'AI 연결됨':'AI 연결 안 됨 — 앱 설정에서';
  $('tgAi').className='tag '+(aiReady()?'on':'off');
  const n=(S.news.items||[]).length;
  $('tgNews').textContent=n?('뉴스 '+n+'건 · '+S.news.at):'뉴스 아직 안 받음';
  $('tgNews').className='tag '+(n?'on':'');
}
load(); paint();
</script>

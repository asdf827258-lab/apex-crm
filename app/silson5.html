  h+='</div><div class="s5-note"><b>고객</b> · '+s5Esc(cur.who)+'<br><b>목표</b> · '+cur.goal+'</div>'+
    '<div class="s5-row s5-noprint"><button class="s5-btn" data-a="hide">'+(st.hide?'🙈 내 대사 보이기':'🙈 내 대사 가리기')+'</button>'+
    '<button class="s5-btn" data-a="step">'+(st.step?'▶ 다음 줄 ('+Math.min(st.step,cur.L.length)+'/'+cur.L.length+')':'▶ 한 줄씩')+'</button>'+
    '<button class="s5-btn" data-a="reset">↺ 처음부터</button></div>';
  cur.L.forEach(function(l,i){
    var later=st.step&&i>=st.step;
    h+='<div class="s5-line '+l[0]+(l[0]==='m'&&st.hide?' hide':'')+(later?' later':'')+'"><span class="w">'+(l[0]==='m'?'나':'고객')+'</span>'+
       '<div class="x">'+s5Esc(l[1])+'</div></div>';
  });
  h+='<div class="s5-coach"><b>코칭</b><ul>';
  cur.coach.forEach(function(c){h+='<li>'+c+'</li>';});
  h+='</ul><div><span class="s5-no">하지 말 말 · </span>'+s5Esc(cur.no)+'</div></div>';
  h+=s5SrcList(pane==='rp5'?['f5']:['nd1','nd2','hb']);
  box.innerHTML=h;
  [].forEach.call(box.querySelectorAll('.s5-scn .s5-chip'),function(b){b.onclick=function(){st.k=b.dataset.k;st.step=0;s5RenderRp(pane);};});
  [].forEach.call(box.querySelectorAll('[data-a]'),function(b){b.onclick=function(){
    var a=b.dataset.a;
    if(a==='hide')st.hide=!st.hide;
    else if(a==='step')st.step=st.step?Math.min(st.step+1,cur.L.length):1;
    else {st.step=0;st.hide=false;}
    s5RenderRp(pane);
  };});
  [].forEach.call(box.querySelectorAll('.s5-line.m.hide .x'),function(x){x.onclick=function(){x.parentNode.classList.remove('hide');};});
}

/* ── 💰 못 받은 보험금 · 찾아드린 사례 ── */
function s5Cases(){ try{ var v=JSON.parse(localStorage.getItem(S5_KEY)||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function s5SaveCases(L){ try{ localStorage.setItem(S5_KEY,JSON.stringify(L)); return true; }catch(e){ return false; } }
/* 가까운 순서 — 나이대·지역 둘 다 같으면 먼저, 하나만 같으면 그다음. 둘 다 다르면 안 꺼냅니다. */
function s5Near(age,area){
  var a=String(area||'').replace(/\s+/g,'');
  return s5Cases().map(function(c){
    var sa=age&&c.age===age?2:0, ca=String(c.area||'').replace(/\s+/g,'');
    var sr=a&&ca&&(ca.indexOf(a)>=0||a.indexOf(ca)>=0)?1:0;
    return {c:c,s:sa+sr};
  }).filter(function(x){return x.s>0;}).sort(function(x,y){return y.s-x.s||String(y.c.ym).localeCompare(String(x.c.ym));});
}
/* 사례 한 줄을 말로 — 금액을 안 적었으면 금액을 말하지 않습니다 (null 과 0 은 다릅니다 · 1번) */
function s5CaseSay(c){
  var amt=s5ManWon(c.man);
  var what={'실손 미청구':'청구 안 하신 실손 보험금','진단금·수술비 미청구':'청구 안 하신 진단금·수술비'}[c.kind]||(c.kind==='기타'?'못 받으신 보험금':c.kind);
  return (c.ym?(c.ym.replace('-','년 ').replace(/년 0/,'년 ')+'월에 '):'')+c.age+', '+c.area+'에 사시는 분께 '+what+(amt?(' '+amt+'을'):'을')+' 찾아 드렸어요.';
}
var S5_FIND={age:'',area:''};
function s5RenderFind(){
  var H=S5_HIDE,L=s5Cases(),near=s5Near(S5_FIND.age,S5_FIND.area),h='';
  h+='<h2>💰 만나면 — 못 받은 보험금부터 찾아 드립니다</h2>'+
    '<div class="s5-sub">새 보험 이야기보다 <b>고객 돈을 먼저 찾아 드리는 사람</b>이 다음 이야기를 할 자리를 얻습니다.</div>'+
    '<h3>공식 숫자 — 금융위원회 2026-07-07'+s5Sup(H.src)+'</h3><ul>'+
    '<li><b>숨은보험금</b> — '+s5Esc(H.def)+'</li>'+
    '<li>잠자는 금액(잔액) — '+s5Esc(H.left)+'</li>'+
    '<li>그 안의 종류 — '+s5Esc(H.kind)+'</li>'+
    '<li>찾아간 금액(환급) — '+s5Esc(H.back)+'</li>'+
    '<li>조회 — '+s5Esc(H.where)+'</li></ul>'+
    '<div class="s5-note">⚠ <b>잔액</b>(10조 3천억원)과 <b>한 해 환급</b>(3조 2,470억원)은 다른 숫자입니다. 섞어 말하지 않습니다. 연령대·지역별 공식 통계는 발표에 없습니다 — 그래서 아래 사례는 <b>사장님이 직접 찾아 드린 것</b>만 씁니다.</div>'+
    '<h3>만나서 하는 순서</h3>'+
    '<div class="s5-step"><i>1</i><div><b>「내보험찾아줌」 같이 조회</b> — 고객 폰으로, <b>고객이 직접</b> 본인인증. 주민번호는 받지 않습니다.'+s5Sup('hb')+'</div></div>'+
    '<div class="s5-step"><i>2</i><div><b>최근 진료 중 청구 안 한 것</b> — 영수증·진료 내역으로 실손·진단금·수술비를 같이 봅니다. 의원·약국까지 실손 청구 전산화(실손24)가 2025-10-25 확대됐습니다.'+s5Sup('s24')+'</div></div>'+
    '<div class="s5-step"><i>3</i><div><b>청구는 고객 이름으로</b> — 보험사 앱·실손24 로 옆에서 같이. 대신 받지 않고, 얼마 나온다고 장담하지 않습니다.</div></div>';
  /* 사례로 니즈 환기 */
  h+='<h3>이 고객과 가까운 사례로 — 니즈 환기</h3><div class="s5-row s5-noprint">'+
    '<select class="s5-in" id="s5FAge"><option value="">고객 나이대</option>'+S5_AGES.map(function(a){return '<option'+(S5_FIND.age===a?' selected':'')+'>'+a+'</option>';}).join('')+'</select>'+
    '<input class="s5-in" id="s5FArea" placeholder="고객 지역 (예: 순천 · 광주 북구)" value="'+s5Esc(S5_FIND.area)+'"></div>';
  if(!L.length){
    h+='<div class="s5-warn" id="s5NoCase">적어 둔 사례가 아직 없습니다 — <b>사례를 지어내지 않습니다.</b> 아래에서 실제로 찾아 드린 것을 적어 두시면 여기서 꺼내 씁니다. 그 전까지는 공식 숫자로 말합니다.</div>'+
       '<div class="s5-say" id="s5Say">「작년 한 해에만 숨은보험금 3조 2,470억원이 주인을 찾아갔다고 금융위원회가 발표했어요. 청구 한 건에 평균 404만원이었고요. 만나 뵈면 고객님 것부터 제일 먼저 찾아 드릴게요.」</div>';
  } else if(!S5_FIND.age&&!S5_FIND.area){
    h+='<div class="s5-note">고객 나이대나 지역을 고르면 가까운 사례부터 꺼냅니다.</div>';
  } else if(!near.length){
    h+='<div class="s5-warn" id="s5NoCase">이 고객과 나이대·지역이 겹치는 사례가 없습니다 — 다른 사례를 「비슷하다」 고 말하지 않습니다. 공식 숫자로 말합니다.</div>'+
       '<div class="s5-say" id="s5Say">「작년 한 해에만 숨은보험금 3조 2,470억원이 주인을 찾아갔다고 금융위원회가 발표했어요. 만나 뵈면 고객님 것부터 찾아 드릴게요.」</div>';
  } else {
    var top=near[0].c, both=near[0].s===3;
    h+='<div class="s5-say" id="s5Say">「'+s5Esc((both?'고객님 또래시고 가까이 사시는 분이 계셨는데요, ':(near[0].s===2?'고객님 또래 분이 계셨는데요, ':'고객님 근처에 사시는 분이 계셨는데요, '))+s5CaseSay(top))+
       ' 본인은 받을 게 없다고 하셨던 분이에요. 고객님도 만나 뵈면 그것부터 찾아 드릴게요.」</div>'+
       '<div class="s5-sub">가까운 순서 — '+near.slice(0,3).map(function(x){return s5Esc(x.c.age+' · '+x.c.area);}).join(' / ')+' · 이름은 말하지 않습니다.</div>';
  }
  /* 사례 적기 */
  h+='<div class="s5-noprint"><h3>찾아 드린 사례 적기 — 이 기기에만</h3>'+
    '<div class="s5-sub">고객 이름 칸은 없습니다. 금액을 모르면 비워 두세요 — 비우면 「금액」 을 말하지 않습니다(0원으로 적지 않습니다).</div>'+
    '<div class="s5-row"><select class="s5-in" id="s5CAge"><option value="">나이대</option>'+S5_AGES.map(function(a){return '<option>'+a+'</option>';}).join('')+'</select>'+
    '<input class="s5-in" id="s5CArea" placeholder="지역 (시·구까지)"></div>'+
    '<div class="s5-row"><select class="s5-in" id="s5CKind"><option value="">찾은 것</option>'+S5_FOUNDK.map(function(a){return '<option>'+a+'</option>';}).join('')+'</select>'+
    '<input class="s5-in" id="s5CMan" inputmode="numeric" placeholder="금액 (만원 · 모르면 비움)">'+
    '<input class="s5-in" id="s5CYm" type="month"></div>'+
    '<div class="s5-row"><button class="s5-btn pri" id="s5CAdd">＋ 사례 적기</button></div><div id="s5CMsg" class="s5-sub"></div>';
  L.slice().reverse().forEach(function(c,ri){
    var i=L.length-1-ri;
    h+='<div class="s5-case" data-i="'+i+'"><button data-del="'+i+'">지우기</button><span class="m">'+s5Esc(c.age)+' · '+s5Esc(c.area)+'</span>'+
       s5Esc(c.kind)+(s5ManWon(c.man)?(' · '+s5ManWon(c.man)):' · 금액 안 적음')+(c.ym?(' · '+s5Esc(c.ym)):'')+'</div>';
  });
  h+='</div>'+s5SrcList(['hb','s24','hz']);
  s5$('s5Find').innerHTML=h;
  s5$('s5FAge').onchange=function(){S5_FIND.age=this.value;s5RenderFind();};
  s5$('s5FArea').onchange=function(){S5_FIND.area=this.value.trim();s5RenderFind();};
  s5$('s5CAdd').onclick=s5AddCase;
  [].forEach.call(document.querySelectorAll('[data-del]'),function(b){b.onclick=function(){
    var L2=s5Cases();L2.splice(Number(b.dataset.del),1);s5SaveCases(L2);s5RenderFind();};});
}
function s5AddCase(){
  var age=s5$('s5CAge').value,area=s5$('s5CArea').value.trim(),kind=s5$('s5CKind').value,
      man=s5$('s5CMan').value.replace(/[^0-9]/g,''),ym=s5$('s5CYm').value,msg=s5$('s5CMsg');
  if(!age||!area||!kind){msg.textContent='나이대 · 지역 · 찾은 것은 꼭 적어 주세요.';return;}
  /* 이름을 적으면 안 받습니다 (3번) — 「○○님」·「○씨」 꼴 */
  if(/님|씨|[가-힣]○○|[가-힣]{2,3}\s*고객/.test(area)){msg.textContent='지역 칸에 이름은 적지 않습니다.';return;}
  var L=s5Cases();L.push({age:age,area:area,kind:kind,man:man===''?null:Number(man),ym:ym||''});
  if(!s5SaveCases(L)){msg.textContent='이 기기에 저장하지 못했습니다(개인 정보 보호 모드 등).';return;}
  s5RenderFind();
}

/* ── 🛡 거절처리 ── */
function s5RenderObj(){
  var h='<h2>🛡 거절처리 — 5세대 · 무사고 할인 · 보험금 찾기</h2>'+
    '<div class="s5-sub">받는 말 → 다음 한마디. <b>하지 말 말</b>과 <b>멈출 자리</b>를 같이 봅니다 — 붙잡다 그 고객을 영영 잃지 않게. 공통 거절(「바빠요」 등)은 ☎️ TA 스크립트 · 🥊 거절 근육 훈련에 있습니다.</div>';
  S5_OBJ.forEach(function(o){
    h+='<div class="s5-ob"><div class="q">「'+s5Esc(o.q)+'」<span>'+s5Esc(o.tag)+'</span></div><div class="a">'+
       '<div class="p">'+s5Esc(o.say)+'</div>'+
       '<div class="p nx"><span class="lb">다음 한마디 ·</span>'+s5Esc(o.nx)+'</div>'+
       '<div class="p no"><span class="lb">하지 말 말 ·</span>'+s5Esc(o.no)+'</div>'+
       '<div class="p st"><span class="lb">여기서 멈춥니다 ·</span>'+s5Esc(o.st)+'</div></div></div>';
  });
  h+=s5SrcList(['f5','hb','nd1']);
  s5$('s5Obj').innerHTML=h;
}

/* ── 탭 ── */
var S5_TABS=['one','who','rp5','rpnd','find','obj'];
function s5Tab(t){
  if(S5_TABS.indexOf(t)<0)t='one';
  [].forEach.call(document.querySelectorAll('#s5Tabs button'),function(b){b.classList.toggle('on',b.dataset.t===t);});
  S5_TABS.forEach(function(k){s5$('s5-'+k).classList.toggle('on',k===t);});
  try{ if(location.hash!=='#'+t)history.replaceState(null,'','#'+t); }catch(e){}
}
[].forEach.call(document.querySelectorAll('#s5Tabs button'),function(b){b.onclick=function(){s5Tab(b.dataset.t);window.scrollTo(0,0);};});
s5RenderOne();s5RenderWho();s5RenderRp('rp5');s5RenderRp('rpnd');s5RenderFind();s5RenderObj();
s5Tab((location.hash||'').replace('#',''));
window.addEventListener('hashchange',function(){s5Tab((location.hash||'').replace('#',''));});
</script>

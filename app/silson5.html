       ② 「아니야 복잡해 … 한장으로 한번에 … 이미지 첨부한 자료를 기반으로 … ta스크립트가 이정도로
          어떻게 고객이 날 만나주냐고」 → 이미지 6단계로 한 장을 만듦
       ③ 「2026년 10월부터 보험료할인 제도는 뭐야? 그리고 <b>시간이 너무 오래걸린다</b>. 실제 이걸
          너가 고객이라고 생각하고 이렇게 스크립트대로 전화하면 되겠니? 그리고 <b>거절처리 바로 볼수
          있도록</b> 해야하는데 안되어 있네」 → 지금 이 판
     고객 자리에서 다시 들어 보니 ② 는 안 됐습니다 — 만날 이유 셋을 한숨에 늘어놓고, 통계를 읽고,
     약 이름을 묻고, 주민번호까지 가는 데 2분이 넘었습니다. 고객은 첫 15초에 끊습니다.
     그래서 —
     ★ <b>대본은 네 마디 · 30초</b>. 이득은 하나로 묶고(무사고 할인 + 못 받은 보험금 = 「몰라서 못 받는
       돈 확인」), 곧바로 <b>둘 중 하나</b>로 약속. 5세대·통계·복용약은 고객이 물을 때 꺼냅니다.
     ★ <b>거절은 화면 아래에 늘 떠 있습니다</b> — 단추 하나 누르면 그 자리에 답이 뜨고, 답은 다시 약속으로.
     ★ 사장님 이미지의 「보장분석디비 스크립트」 6단계 원문은 접어 둡니다(만남이 잡힌 뒤 주소·본인확인
       때 씀). 원문 줄은 점검이 🎓 신입 TA 교육과 한 글자씩 견줍니다 (5번).
     ★ 10월 할인 제도 = 금감원이 2026-10-05 발표한 <b>건강보험 무사고 계약전환 제도 개선</b>(새 할인이
       아니라 있던 할인을 받기 쉽게). 원문의 「10월5일부터 금융감독원에서 시행하는 보험료 할인제도」 는
       할인을 주는 곳이 보험회사라 대본에서 그렇게 말하지 않습니다. 고객이 직접 전화로 신청할 수 있게
       된 제도라, 「저만 해 드릴 수 있다」 고 말하지 않습니다 (1번).
     ★ 숫자는 원문에서만 (1번·9번) · 사례는 사장님이 적은 것이 겹칠 때만 · 이름 칸 없음 (3번)
     점검 : scripts/check-silson5.js                                                -->
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--t-bg);color:var(--t-ink);

.cs-row{font-size:13.5px;border-top:1px solid var(--t-line);padding:6px 0}

.msg{font-size:12.5px;color:var(--t-neg);min-height:1em}

<script>

  }
  ['fAgent','fAge','fArea','fD1','fD2'].forEach(function(id){$(id).addEventListener('input',sync);$(id).addEventListener('change',sync);});
  $('cAdd').onclick=s5AddCase;
  /* 클립보드 권한이 없는 폰에서는 writeText 가 나중에 거절됩니다 — 거절되면 예전 방식으로 한 번 더 */
  function oldCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(x){}document.body.removeChild(ta);return ok;}
  function done(ok){$('bCopy').textContent=ok?'✓ 복사했습니다':'복사하지 못했습니다';setTimeout(function(){$('bCopy').textContent='📋 대본 복사';},1800);}
  $('bCopy').onclick=function(){var t=s5ScriptText();window.__copied=t;
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){done(true);},function(){done(oldCopy(t));});}
    else done(oldCopy(t));};
  $('bPrint').onclick=function(){window.print();};
  s5RenderStatic();s5All();
})();
</script>

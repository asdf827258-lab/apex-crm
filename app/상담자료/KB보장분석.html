/* ── 몇 살에 끝나는가 ── */
function sExpire(){
  var A=W.A,p=A.person,life=[],dated=[],unk=[],i;
  for(i=0;i<A.contracts.length;i++){
    var c=A.contracts[i],e=c.__endAge;
    if(e==='life')life.push(c); else if(typeof e==='number')dated.push({c:c,age:e}); else unk.push(c);
  }
  dated.sort(function(a,b){return a.age-b.age;});
  var lo=p.age||30,hi=105;
  var rows=dated.map(function(d){
    return {t:(d.c.co||'?'), sub:(d.c.nm||'')+' · 담보 '+((d.c.covs||[]).length)+'개',
      v:d.age, pct:Math.max(0,Math.min(100,(d.age-lo)/(hi-lo)*100)),
      tone:d.age<80?'bad':(d.age<100?'warn':'pri'), label:d.age+'세'};
  });
  return '<div class="in"><div class="col" style="justify-content:flex-start">'+
   '<div class="kick">⏳ 몇 살에 끝나는가</div>'+
   '<h2 class="t2">'+(A.endMin!==null?('가장 먼저 <b>'+A.endMin+'세</b>에 하나가 끝납니다'):'끝나는 날이 적혀 있습니다')+'</h2>'+
   '<p class="p">'+(p.age?(p.age+'세부터 '+hi+'세까지 놓고 봤습니다. '):'')+'막대가 길수록 오래 갑니다.</p>'+
   (rows.length?gBars(rows):'<div class="note n-warn">끝나는 나이를 읽어 낸 계약이 없습니다.</div>')+
   '<div style="display:flex;gap:.6em;flex-wrap:wrap;margin-top:.5em">'+
     (life.length?('<div class="note n-ok" style="margin:0">종신 <b>'+life.length+'건</b> — 끝나는 날이 없습니다.</div>'):'')+

     '<h3 class="t3">종신을 볼 때 같이 보는 것</h3>'+

       return '<div class="card pale"><div style="font-size:var(--sm);font-weight:800">'+m.ic+' '+esc(m.t)+'</div>'+
         '<div style="font-size:var(--xs);color:var(--ink4);line-height:1.62;margin-top:.2em">'+m.p+'</div></div>';
     }).join('')+'</div>'+

/* ═══ 마무리 ② — 돈에는 순서가 있습니다 ═══════════════════════════ */
/* 고객 상황 한 줄 — 나이·아이·대출·집. <b>있는 것만</b> 말합니다(없으면 안 씁니다). */
function ordWho(){
  var A=W.A, p=(A&&A.person)||{}, L=W.life||{}, F=W.facts||{}, bits=[];
  if(p.age) bits.push('<b>'+p.age+'세</b>');
  /* ⚠ L.kids 는 배열이 아니라 <b>「12,8」 같은 글자</b>입니다 — 바로 filter 하면 터집니다. */
  var kids=(typeof kdRows==='function') ? kdRows(L.kids,'k') : [];
  if(kids.length) bits.push('아이 <b>'+kids.length+'명</b>');
  var ly=parseFloat(String(F.f_loanyr||L.loanEnd||'').replace(/,/g,''));
  if(isFinite(ly)&&ly>0) bits.push('대출 <b>'+Math.round(ly)+'년</b> 남음');
  var hm=parseFloat(String(F.f_home||'').replace(/,/g,''));
  if(isFinite(hm)&&hm>0) bits.push('집 <b>'+kdWonR(hm*10000)+'</b>');
  if(!bits.length) return '';
  return '<div class="ord-who">'+bits.join(' · ')+' — <span>이 조건에서 매긴 순서입니다</span></div>';
}

       '<div class="eld-t">'+esc(x.t)+'</div><div class="eld-p">'+x.p+'</div></div>';
   }).join('')+'</div>'+
   '<div class="cls-2">'+
     '<div><h3 class="t3" style="margin:0 0 .35em">오늘 이 문서에서 나온 순서</h3>'+

       (rows?('<div class="ord">'+rows+'</div>')

           '<span><b>'+esc(w.t)+'</b><span class="p">'+w.p+'</span></span></div>';}).join('')+'</div>'+
   '</div>'+

   foot('순서는 <b>제가 정한 기준선</b>으로 매긴 것이지 규정이 아닙니다. '+
     '오늘 <b>다 정하지 않으셔도 됩니다</b> — 금액은 계산해서 다음에 가져오겠습니다.')+
   '</div>';
}

/* ═══ 🧾 고객정보 — <b>묻는 칸은 여섯 개</b> ══════════════════════════
   칸을 39개 펼쳐 놓으면 고객이 「이걸 다 답해야 하나」 하고 굳습니다.
   그래서 <b>이미 아는 것은 접어 두고</b> 여섯 칸만 크게 내놓습니다.
   접힌 칸도 화면에 그대로 살아 있어서 [저장]하면 <b>같이 갑니다.</b>
   ⚠ 문서에서 읽었거나 앞 장에서 여쭌 값은 <b>잠가</b> 둡니다 —
     같은 값을 두 군데서 고치면 어느 쪽이 맞는지 알 수 없게 됩니다.  */
function fxCell(r,val,big){
  var lock=(r.src!=='FIN'), inp;
  if(r.sel){
    inp='<select class="inp" id="fx_'+r.id+'"'+(lock?' disabled':' onchange="factsCalc()"')+'>'+
      '<option value=""></option>'+r.sel.map(function(o){
        return '<option value="'+o[0]+'"'+(String(val)===o[0]?' selected':'')+'>'+esc(o[1])+'</option>';
      }).join('')+'</select>';
  }else{
    inp='<input class="inp num" id="fx_'+r.id+'" value="'+esc(val)+'"'+
      (lock?' readonly':' oninput="factsCalc()"')+' placeholder="'+esc(r.ph||'')+'">';
  }
  return '<div class="fx-f'+(lock?' lock':'')+(big?' big':'')+'">'+
    '<label class="lbl">'+esc(r.t)+(r.u?(' <i>'+esc(r.u)+'</i>'):'')+
      (r.src==='KB'?'<span class="fx-b">KB</span>':'')+'</label>'+inp+
    ((big&&r.why)?('<div class="fx-why">'+esc(r.why)+'</div>'):'')+'</div>';
}
function sFacts(){
  var A=W.A, L=W.life||{}, F=W.facts||{};
  var auto=kdLinkAuto(A,L,F);
  var val=function(r){ var x=auto[r.id]; return (F[r.id]!==undefined&&F[r.id]!=='')?F[r.id]:(x||''); };

  /* ① 이미 아는 것 — 문서에서 읽었거나 앞 장에서 여쭌 것 */
  var got=KD_LINK.filter(function(r){return r.src!=='FIN';});
  var gotN=got.filter(function(r){return val(r)!=='';}).length;

  /* ② 꼭 여쭐 여섯 칸 */
  /* ② 꼭 여쭐 칸 — 세 덩이. 두 덩이는 적자마자 <b>답이 나옵니다</b> */
  var key=KD_LINK.filter(function(r){return r.key;});
  var left=key.filter(function(r){return val(r)==='';}).length;
  function blk(b){ return key.filter(function(r){return r.blk===b;})
    .map(function(r){return fxCell(r,val(r),1);}).join(''); }

  /* ③ 나머지 — 적으면 더 정확해지는 것 */
  var rest=KD_LINK.filter(function(r){return r.src==='FIN'&&!r.key;});
  var restHtml=KD_LINK_G.map(function(g){
    var rs=rest.filter(function(r){return r.g===g;});
    if(!rs.length)return '';
    return '<div class="fx-g"><div class="fx-gt">'+esc(g)+'</div><div class="fx-r">'+
      rs.map(function(r){return fxCell(r,val(r));}).join('')+'</div></div>';
  }).join('');

  function sec(cls,ttl,body,outId){
    return '<div class="fx-sec'+(outId?'':' plain')+'">'+
      '<div class="fx-sl">'+ttl+'</div>'+
      '<div class="fx-key '+cls+'">'+body+'</div>'+
      (outId?('<div class="fx-out" id="'+outId+'"></div>'):'')+'</div>';
  }

  return '<div class="in">'+
   '<div class="lf-hd">'+
     '<div><div class="kick">🧾 고객정보</div>'+
       '<h2 class="t2" style="margin:0">적으시면 <b>이미 가진 것</b>부터 세어 드립니다</h2></div>'+
     '<div class="lf-sub">노후 이야기는 보통 「얼마를 더 모을까」로 갑니다. '+
       '그 전에 <b>퇴직금과 집</b>이 얼마가 되는지부터 보시는 게 순서입니다.</div>'+
   '</div>'+
   '<div class="fx-wrap noprint">'+
     '<details class="fx-fold done"><summary>'+
       '<b>✓ 이미 아는 것 '+gotN+'칸</b><span>이름 · 나이 · 보험료 · 진단금 · 은퇴나이…</span>'+
       '<i>보기</i></summary>'+
       '<div class="fx-r">'+got.map(function(r){return fxCell(r,val(r));}).join('')+'</div>'+
     '</details>'+
     '<div class="fx-ask">'+
       sec('k4','💼 일하시는 것',blk('job'),'fxOutJob')+
       sec('k4','🏠 집',blk('home'),'fxOutHome')+
       sec('k4','💰 모으신 것',blk('save'),'')+
     '</div>'+
     '<details class="fx-fold"><summary>'+
       '<b>ⓘ 이 숫자는 어떻게 나온 건가요</b><span>퇴직금·주택연금을 어떻게 셌는지</span>'+
       '<i>보기</i></summary>'+
       '<div class="fx-fine">'+
         '<p><b>퇴직금</b> · '+KD_SEV_NOTE+'</p>'+
         '<p><b>주택연금</b> · '+KD_HF_NOTE+'</p>'+
         '<p class="src">주택연금 금액은 '+KD_HF_SRC+' ('+KD_HF_AT+' 기준)를 그대로 옮긴 표에서 꺼냈습니다. '+
           '표에 없는 나이·집값은 <b>사이를 이어서</b> 본 값이라 실제와 조금 다를 수 있습니다.</p>'+
       '</div>'+
     '</details>'+
     '<details class="fx-fold"><summary>'+
       '<b>＋ 더 자세히 '+rest.length+'칸</b><span>배우자 · 교육비 · 투자자산 · 그 밖 대출…</span>'+
       '<i>펼치기</i></summary>'+restHtml+'</details>'+
   '</div>'+
   '<div class="fx-bar noprint">'+
     '<button class="btn btn-pri" onclick="factsSave()">저장</button>'+
     '<button class="btn" onclick="factsCopy()">재무설계로 넘길 값 복사</button>'+
     '<span class="fx-cnt" id="fxCnt"></span>'+
   '</div>'+
   foot('단위는 전부 <b>만원</b>입니다. <b>모르는 칸은 비워 두십시오</b> — 0 으로 적으면 「없다」가 됩니다. '+
     '퇴직금·주택연금은 <b>어림</b>일 뿐 약속이 아닙니다 — 정확한 금액은 회사·퇴직연금 사업자와 '+
     '한국주택금융공사가 정합니다.')+
   '</div>';
}

/* ═══ 적자마자 답이 나오게 ═══════════════════════════════════════════
   ⚠ 여기서 화면을 <b>다시 그리면 안 됩니다.</b> 글자를 치는 중에 다시 그리면
     커서가 튀어 나갑니다 — 결과 칸 <b>두 군데만</b> 갈아 끼웁니다.  */
function fxV(id){ var e=$('fx_'+id); return e?String(e.value).trim():''; }
function fxN(id){ var n=parseFloat(fxV(id).replace(/,/g,'')); return isFinite(n)?n:0; }

function factsCalc(){
  /* 남은 칸 세기 — 적는 즉시 줄어들어야 <b>끝이 보입니다</b> */
  var c=$('fxCnt');
  if(c){
    var n=KD_LINK.filter(function(r){return r.key&&fxV(r.id)==='';}).length;
    c.innerHTML=n?('여쭐 칸 <b>'+n+'칸</b> 남았습니다'):'<b>다 채우셨습니다</b>';
  }

  var A=W.A, L=W.life||{};
  var auto=kdLinkAuto(A,L,W.facts||{});
  var age=parseFloat(fxV('f_age')||auto.f_age)||0;
  var ret=parseFloat(fxV('f_ret')||auto.f_ret)||0;

  /* ── 퇴직금 ── */
  var j=$('fxOutJob');
  if(j){
    var s=kdSeverance({ins:fxV('f_4ins'), years:fxN('f_years'), income:fxN('f_income'), age:age, retAge:ret});
    var dc=fxN('f_dc');
    if(s.ok){
      j.className='fx-out good';
      j.innerHTML='<div class="fo-t">퇴직금 어림</div>'+
        '<div class="fo-row"><span>지금 그만두시면</span><b>'+kdWonR(s.now*10000)+'</b></div>'+
        (s.more>0?('<div class="fo-row"><span>'+Math.round(ret)+'세까지 다니시면</span><b class="hi">'+
          kdWonR(s.at*10000)+'</b></div>'):'')+
        '<div class="fo-n">적게 잡은 값입니다 — 실제 평균임금은 월급보다 커지는 편이라 <b>보통 이보다 많습니다.</b>'+
        (dc>0?' ⚠ DC형이면 「퇴직연금 적립」에 이미 든 <b>그 돈</b>입니다.':'')+'</div>';
    }else{
      j.className='fx-out'+(s.none?' warn':'');
      j.innerHTML='<div class="fo-t">퇴직금</div><div class="fo-w">'+s.why+'</div>';
    }
  }

  /* ── 주택연금 ── */
  var h=$('fxOutHome');
  if(h){
    var home=fxN('f_home'), hd=fxN('f_hdebt');
    var p=kdHousePension(age, home*10000, hd*10000);
    if(p.ok){
      h.className='fx-out good';
      h.innerHTML='<div class="fo-t">주택연금 어림</div>'+
        '<div class="fo-row"><span>'+p.from+'세부터'+(p.later?' (지금 집값으로)':'')+'</span>'+
          '<b class="hi">달마다 '+kdWonR(p.won)+'</b></div>'+
        (p.warn?('<div class="fo-w">'+p.short+'</div>'):'')+
        '<div class="fo-n">가입 여부는 <b>공시가격</b>으로 따집니다 — 위 금액은 <b>시세</b>로 어림한 것입니다.'+
        '<span class="fo-src">한국주택금융공사 공시 · '+KD_HF_AT+' 기준</span></div>';
    }else{
      h.className='fx-out';
      h.innerHTML='<div class="fo-t">주택연금</div><div class="fo-w">'+
        (p.why||'만 55세부터 신청할 수 있습니다.')+'</div>';
    }
  }
}

function factsSave(){
  W.facts=W.facts||{};
  KD_LINK.forEach(function(r){
    if(r.src!=='FIN')return;   /* 잠근 칸은 여기서 건드리지 않습니다 */
    var e=$('fx_'+r.id); if(e)W.facts[r.id]=e.value.trim();
  });
  kdSave(); go(W.i);
}
function factsCopy(){
  var o=kdLinkSnap({A:W.A,L:W.life||{},F:W.facts||{}});
  var t=JSON.stringify(o);
  try{ navigator.clipboard.writeText(t); alert('재무설계로 넘길 값을 복사했습니다.\n\n채워진 칸 '+
    Object.keys(o.f).filter(function(k){return o.f[k]!=='';}).length+'개'); }
  catch(e){ prompt('복사해서 쓰십시오', t); }
}

/* CRM 안에서 열렸을 때 — 그 자리에 있던 옛 화면과 <b>같은 말</b>로 주고받습니다 */
kdBridge({
  snap:function(){ return kdLinkSnap({A:W.A,L:W.life||{},F:W.facts||{}}); },
  put:function(d){
    var r=kdLinkPut(d,{A:W.A,L:W.life||{},F:W.facts||{}});
    if(r){ W.life=r.L; W.facts=r.F; kdSave(); if(W.slides.length)go(W.i); }
  },
  intro:function(o){
    W.me=W.me||{};
    ['name','title','org'].forEach(function(k){ if(o[k])W.me[k]=o[k]; });
    if(o.phone)W.me.tel=o.phone;
    if(o.years)W.me.years=o.years;
    if(o.motto)W.me.line=o.motto;
    if(o.photo)W.me.photo=o.photo;
    kdSave(); if(W.slides.length)go(W.i);
  }
});

/* ═══ 👤 1장 — 방송 소개카드 ═══════════════════════════════════════
   CRM 「상담자료/intro.html」의 소개카드를 이 덱의 첫 장으로 옮겼습니다.
   검은 화면에 사진이 깔리고, 금빛 결이 지나가고, 이름이 한 글자씩 섭니다.

   ⚠ 여기 나오는 것은 <b>전부 「내 소개」에서 온 값</b>입니다. 비면 안 그립니다.
   ⚠ CRM 원본에는 「ON AIR 방송 스틸」 줄이 있지만 <b>옮기지 않았습니다.</b>
     실제 방송분이 없는데 방송처럼 보이게 하면 허위·과장이 됩니다.
     진짜 방송 캡처가 생기면 그때 넣으십시오.                         */
function ciChars(t){
  var s=String(t||''), out='', i;
  for(i=0;i<s.length;i++)
    out+='<span style="animation-delay:'+(1+i*0.16).toFixed(2)+'s">'+
         (s.charAt(i)===' '?'&nbsp;':esc(s.charAt(i)))+'</span>';
  return out;
}
function ciDust(){
  var out='',i;
  for(i=0;i<24;i++){
    out+='<i style="left:'+(Math.random()*55+40).toFixed(1)+'%;top:'+(Math.random()*80+15).toFixed(1)+'%;'+
      'animation-duration:'+(Math.random()*6+6).toFixed(1)+'s;'+
      'animation-delay:'+(Math.random()*8).toFixed(1)+'s;'+
      'opacity:'+(Math.random()*0.5+0.3).toFixed(2)+'"></i>';
  }
  return out;
}

  var w=String(en||'').split(/\s+/).filter(Boolean);
  return w.length?w.map(function(x){return x.charAt(0).toUpperCase();}).join(''):'';
}

/* 사진은 <b>줄여서</b> 담습니다 — 원본 그대로면 localStorage 를 금방 넘깁니다 */
function mePhoto(el){
  var f=el&&el.files&&el.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=1600, w=im.width, h=im.height, s=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement('canvas');
      cv.width=Math.round(w*s); cv.height=Math.round(h*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      W.me=W.me||{};
      try{ W.me.photo=cv.toDataURL('image/jpeg',0.82); }catch(e){ W.me.photo=rd.result; }
      try{ kdSave(); }
      catch(e){ W.me.photo=''; alert('사진이 너무 커서 이 기기에 저장하지 못했습니다 — 조금 작은 사진으로 넣어 주세요.'); }
      go(W.i);
    };
    im.onerror=function(){ alert('이 파일은 사진으로 열리지 않습니다.'); };
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
}
function mePhotoClear(){ if(W.me)W.me.photo=''; kdSave(); go(W.i); }

/* ═══ 진단비와 치료비는 다른 돈 ═══════════════════════════════════

   맞춰서 비어 있는 칸에 표시를 합니다 — 남의 이야기가 아니게.        */
function sConcept(){
  var C=CR_CONCEPT, A=W.A;
  function state(k){
    if(k==='silson') return A.silsonN>0 ? 'ok' : 'none';
    if(k==='surg'){ var g=A.g.surg||A.g.hosp; return (g&&g.won>0)?'ok':'none'; }
    var G=A.g[k]; if(!G) return null;
    return kdGState(G, kdLineOf(A,k)).s;
  }
  return '<div class="in">'+
   '<div class="lf-hd">'+
     '<div><div class="kick">'+esc(C.kick)+'</div>'+
       '<h2 class="t2" style="margin:0">'+C.title+'</h2></div>'+
     '<div class="lf-sub">'+C.lead+'</div>'+
   '</div>'+
   '<div class="cc2">'+C.two.map(function(x){
     return '<div class="cc" style="border-color:'+gC(x.tone)+'">'+
       '<div class="cc-h"><span class="cc-ic">'+x.ic+'</span>'+
         '<b style="color:'+gC(x.tone)+'">'+esc(x.t)+'</b></div>'+
       '<div class="cc-kv"><span>나오는 때</span><b>'+x.when+'</b></div>'+
       '<div class="cc-kv"><span>나오는 횟수</span><b>'+x.cnt+'</b></div>'+
       '<div class="cc-p">'+x.use+'</div>'+
       '<div class="cc-r">'+x.risk+'</div></div>';
   }).join('')+'</div>'+
   '<div class="note n-pri" style="margin:0;font-size:var(--tx)">'+C.say+'</div>'+
   '<div class="ldr-t">'+C.ladderTitle+'</div>'+
   '<div class="ldr">'+C.ladder.map(function(x){
     var st=state(x.k), cls=(st==='none')?'no':((st==='ok')?'yes':'mid');
     var tag=(st==='none')?'비어 있음':((st==='ok')?'있음':(st===null?'—':'모자람'));
     return '<div class="ldr-r '+cls+'">'+
       '<div class="ldr-lv">'+esc(x.lv)+'</div>'+
       '<div class="ldr-x"><b>'+esc(x.t)+'</b><span>'+x.p+'</span></div>'+
       '<div class="ldr-n">'+esc(x.need)+'</div>'+
       '<div class="ldr-s">'+tag+'</div></div>';
   }).join('')+'</div>'+
   foot(C.foot)+

}

/* ═══ 💵 돈을 이렇게 나눠 보시면 ═══════════════════════════════════
   ⚠ 나이·소득은 <b>이미 읽거나 여쭌 값</b>을 씁니다 — 고르게 하지 않습니다.
   ⚠ 소득을 모르면 <b>비율만</b> 보여 드립니다. 금액을 지어내지 않습니다.  */
function sMoneySplit(){
  var A=W.A, F=W.facts||{}, auto=kdLinkAuto(A,W.life||{},F);
  var age=parseFloat(F.f_age||auto.f_age||((A&&A.person)?A.person.age:''));
  var inc=parseFloat(String(F.f_income||'').replace(/,/g,''));
  var S=kdSplitOf(age);
  var hasInc=isFinite(inc)&&inc>0;
  var rest=S?(100-S.ins-S.save):0;

  var bar = S
    ? ('<div class="msb">'+
        '<div class="msb-p ins"  style="flex:'+Math.max(S.ins,1)+'"><b>보장</b><span>'+S.ins+'%</span></div>'+
        '<div class="msb-p sav"  style="flex:'+Math.max(S.save,1)+'"><b>저축 · 연금</b><span>'+S.save+'%</span></div>'+
        '<div class="msb-p rest" style="flex:'+Math.max(rest,1)+'"><b>쓰시는 돈</b><span>'+rest+'%</span></div>'+
      '</div>')
    : '<div class="note n-flat" style="margin:0">나이를 못 읽어서 나눠 드리지 못했습니다 — '+
      '「🧾 고객정보」에서 나이를 확인해 주십시오.</div>';

  var money = (S&&hasInc)
    ? ('<div class="msn">월 <b>'+kdWonR(inc*10000)+'</b>으로 보면 — '+
        '보장 <b>'+kdWonR(inc*S.ins/100*10000)+'</b> · '+
        '저축·연금 <b>'+kdWonR(inc*S.save/100*10000)+'</b> · '+
        '나머지 <b>'+kdWonR(inc*rest/100*10000)+'</b> 정도입니다.</div>')
    : (S ? '<div class="msn dim">「🧾 고객정보」에 <b>월 소득</b>을 적어 주시면 '+
           '<b>만원 단위</b>로 나눠 보여 드립니다 — 없는 숫자를 지어내지 않았습니다.</div>' : '');

  /* 지금 실제로 내고 계신 보험료가 이 기준과 얼마나 떨어져 있나 */
  var now = null;
  if(S&&hasInc&&typeof kdPremSplit==='function'){
    var SPp=kdPremSplit(A);
    if(SPp&&SPp.pay>0){
      var pct=Math.round(SPp.pay/(inc*10000)*1000)/10;
      now='<div class="msnow">지금은 월 <b>'+kdPrem(SPp.pay)+'</b>을 내고 계시니 소득의 <b>'+pct+'%</b>입니다. '+
        (pct>S.ins+3 ? '제 기준보다 <b>조금 높은 편</b>이라, 늘리기보다 <b>겹친 걸 덜어 내는</b> 쪽으로 보겠습니다.'
         : (pct<S.ins-3 ? '제 기준보다 <b>여유가 있는 편</b>입니다 — 비어 있는 자리부터 보시면 됩니다.'
            : '제 기준과 <b>비슷합니다.</b> 금액보다 <b>어디에 가 있는지</b>를 보겠습니다.'))+'</div>';
    }
  }

  return '<div class="in">'+
   '<div class="lf-hd">'+
     '<div><div class="kick">💵 돈의 자리</div>'+
       '<h2 class="t2" style="margin:0">먼저 돈을 <b>이렇게</b><br>나눠 보시면 좋겠어요</h2></div>'+
     '<div class="lf-sub">'+(S?S.line:'나이를 확인하면 이 자리에서 나눠 보여 드립니다.')+'</div>'+
   '</div>'+
   bar+money+(now||'')+
   '<div class="msv-t">저축은 <b>수익률보다 「언제 쓸 돈인지」</b>부터 봅니다</div>'+
   '<div class="msv">'+KD_SAVE_STD.map(function(x){
     return '<div class="msv-c"><div class="msv-h"><span>'+x.ic+'</span><b>'+esc(x.t)+'</b>'+
       '<u>'+esc(x.when)+'</u></div><div class="msv-p">'+x.p+'</div></div>';
   }).join('')+'</div>'+
   '<div class="note n-warn" style="margin:0;font-size:var(--xs)">'+KD_SPLIT_NOTE+'</div>'+
   foot(KD_SAVE_NOTE)+
   '</div>';
}

      '<input class="inp" id="rv_when_'+i+'" value="'+esc(x.when||'')+'" placeholder="언제 (예: 2026.08)">'+
      '<input class="inp" id="rv_text_'+i+'" value="'+esc(x.text||'')+'" placeholder="'+esc(KD_REVIEW_HINT[i]||'실제로 받으신 말을 그대로')+'">'+
      '</div>';

  /* ⚠ 입력칸은 <b>설계사가 쓰는 것</b>입니다. 아홉 줄을 펼쳐 두면 화면이 넘치고,

   '<div class="lf-hd">'+

       '<h2 class="t2" style="margin:0">고객님들이<br>해 주신 말씀</h2></div>'+
     '<div class="lf-sub">숫자보다 <b>사람 말</b>이 남습니다. 다만 <b>실제로 들은 말만</b> 씁니다.</div>'+
   '</div>'+
   (sample?('<div class="note n-bad" style="margin:0">'+KD_REVIEW_WARN+'</div>'):'')+
   /* ⚠ 한 칸도 안 채웠으면 <b>고객 앞에서 열지 마십시오</b>. 빈 장이 보이면 더 이상합니다. */
   (filled.length===0
     ? '<div class="note n-bad" style="margin:0">아직 <b>한 칸도 채우지 않으셨습니다.</b> '+

       '실제로 들으신 말씀을 아래에 넣으시고, 그 전에는 <b>이 장을 고객 앞에서 열지 마십시오.</b></div>'
     : ('<div class="note n-ok" style="margin:0">아홉 칸 중 <b>'+filled.length+'칸</b>을 채우셨습니다.</div>'))+

       (ex?'<span class="rv-badge">예시</span>':'')+
       '<div class="rv-t">“'+esc(x.text||'')+'”</div>'+
       '<div class="rv-w">'+esc(x.who||'')+(x.when?(' · '+esc(x.when)):'')+'</div></div>';
   }).join('')+'</div>'+
   (real.length?('<div class="note n-ok" style="margin:0">진짜 후기는 이미 갖고 계십니다 — '+
     '<b>「실제 지급 증거」 장의 마지막 '+real.length+'장</b>이 고객님이 직접 보내신 카톡입니다. '+
     '<b>글보다 그게 훨씬 셉니다.</b></div>'):'')+

     '빼고 쓰십시오. 그리고 후기는 <b>앞으로의 지급을 약속하지 않습니다.</b></div>'+

function rvSet(){
  var R=rvRows().map(function(x,i){

    return {who:g('who'),when:g('when'),text:g('text')};

}
function rvClear(){
  W.review=[]; kdSave(); go(W.i);
}

function kdReport(){

/* ═══ 🌓 다크 / 화이트 ══════════════════════════════════════════════
   어두운 옷은 <b>고르는 것</b>입니다. 밝은 사무실·빔프로젝터·연세 있으신
   고객에게는 화이트가 편할 수 있습니다. 고른 값은 이 기기에 남습니다.
   ⚠ 1장 소개카드와 29장 엔딩은 <b>어느 쪽이든 어둡습니다</b> — 그 둘은
     시네마틱 카드라 제 옷이 따로 있습니다.                           */
function themeApply(){
  var dark=(W.theme!=='light');
  document.body.classList.toggle('dark',dark);
  var b=$('thBtn'); if(b)b.textContent=dark?'🌓 화이트':'🌓 다크';
}
function themeToggle(){
  W.theme=(W.theme==='light')?'dark':'light';
  try{localStorage.setItem('kdTheme',W.theme);}catch(e){}
  themeApply();
}
function scToggle(){
  document.body.classList.toggle('scon');
  var b=$('scBtn'),on=document.body.classList.contains('scon');
  if(b){b.textContent=on?'대본 닫기':'대본';b.className='btn'+(on?' btn-pri':'');}
}
function sayHtml(s){
  var k=sayKey(s), S=(typeof KD_SAY!=='undefined')?KD_SAY[k]:null;
  if(!S)return '<div class="sc-h">🎙️ 설계사 대본 <span>이 장에는 대본이 없습니다 · S 키로 여닫기</span></div>';
  function b(cls,t,body){return body?('<div class="sc-b '+cls+'"><div class="sc-bt">'+t+'</div><div class="sc-c">'+body+'</div></div>'):'';}
  return '<div class="sc-h">🎙️ 설계사 대본 <span>고객 화면에는 안 나옵니다 · S(ㄴ) 키로 여닫기 · 인쇄에도 안 나갑니다</span></div>'+
    '<div class="sc-g">'+
      b('sc-open','🗣️ 이렇게 여십시오',S.open)+
      /* 지시문만 있으면 처음 쓰는 사람은 무슨 말을 할지 모릅니다 —
         <b>입으로 그대로 나갈 문장</b>을 맨 앞에 둡니다. */
      (S.say?('<div class="sc-b sc-say"><div class="sc-bt">💬 그대로 읽으셔도 되는 말</div>'+
        S.say.map(function(t){return '<p>'+t+'</p>';}).join('')+'</div>'):'')+
      b('','🧭 왜 이 장이 여기 있는가',S.why)+
      b('','👆 화면을 읽어 주는 순서',S.read)+
      b('sc-gap','🕳️ 빈 칸 비유를 쓰는 법',S.gap)+
      b('sc-deep','🔍 20년차가 확인하는 것',S.deep)+
      b('sc-sim','🎲 시뮬레이션 쓰는 법',S.sim)+
      (S.qa?('<div class="sc-b"><div class="sc-bt">💬 고객이 이렇게 말하면</div>'+
        S.qa.map(function(p){return '<div class="sc-q"><div class="sc-qq">“'+esc(p[0])+'”</div>'+
          '<div class="sc-qa">'+p[1]+'</div></div>';}).join('')+'</div>'):'')+
      (S.never?('<div class="sc-b sc-never"><div class="sc-bt">⛔ 절대 하지 말 말</div>'+
        '<ul class="sc-l">'+S.never.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>'):'')+
      b('sc-bridge','➡️ 다음 장으로',S.bridge)+
    '</div>';
}
function sayKey(s){
  if(!s)return null;
  if(s.k==='story')return 'story:'+(s.s&&s.s.k);
  return s.k;          /* 장마다 제 대본이 있습니다 (대본.js) */
}

    'h2{font-size:13pt;margin:9mm 0 2mm;padding-bottom:1.5mm;border-bottom:2px solid #191f28}'+

    '<div class="hd">'+esc(W.name)+' · '+(new Date()).toLocaleDateString('ko-KR')+

  var seen={};

    if(!S||seen[k])return; seen[k]=1;
    body+='<div class="sec"><h2>'+(i+1)+'. '+esc(s.t)+'</h2>'+
      (S.open?('<h3>이렇게 여십시오</h3><p>'+S.open+'</p>'):'')+
      (S.say?('<h3>그대로 읽으셔도 되는 말</h3>'+S.say.map(function(t){
        return '<p class="sy">'+t+'</p>';}).join('')):'')+
      (S.why?('<h3>왜 이 장이 여기 있는가</h3><p>'+S.why+'</p>'):'')+
      (S.read?('<h3>화면을 읽어 주는 순서</h3><p>'+S.read+'</p>'):'')+
      (S.gap?('<h3>빈 칸 비유를 쓰는 법</h3><p>'+S.gap+'</p>'):'')+
      (S.deep?('<h3>20년차가 확인하는 것</h3><p>'+S.deep+'</p>'):'')+
      (S.qa?('<h3>고객이 이렇게 말하면</h3>'+S.qa.map(function(p){
        return '<div class="q"><b>“'+esc(p[0])+'”</b>'+p[1]+'</div>';}).join('')):'')+
      (S.never?('<h3>절대 하지 말 말</h3><ul class="nv">'+

  w.document.close();

function fullToggle(){
  try{ if(document.fullscreenElement)document.exitFullscreen();
       else document.documentElement.requestFullscreen(); }catch(e){}
}

/* ═══ 키보드 ═══════════════════════════════════════════════════════ */
document.addEventListener('keydown',function(e){
  var t=e.target&&e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  if($('lb').classList.contains('on')&&e.key==='Escape'){lbClose();e.preventDefault();return;}
  if(!W.slides.length)return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){goRel(1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){goRel(-1);e.preventDefault();}
  else if(e.key==='Home'){go(0);e.preventDefault();}
  else if(e.key==='End'){go(W.slides.length-1);e.preventDefault();}
  /* 한글 자판이면 S 자리에서 「ㄴ」, F 자리에서 「ㄹ」 이 옵니다 — 둘 다 받습니다 */
  else if(e.key==='s'||e.key==='S'||e.key==='ㄴ'){scToggle();e.preventDefault();}
  else if(e.key==='f'||e.key==='F'||e.key==='ㄹ'){fullToggle();e.preventDefault();}
  else if(e.key==='t'||e.key==='T'||e.key==='ㅅ'){themeToggle();e.preventDefault();}
});

document.addEventListener('DOMContentLoaded',function(){
  kdLoad();
  var inp=$('kbFile');
  if(inp)inp.onchange=function(){var f=inp.files&&inp.files[0];inp.value='';if(f)readFile(f);};
  var dz=$('dz');
  if(dz){
    dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('over');});
    dz.addEventListener('dragleave',function(){dz.classList.remove('over');});
    dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('over');
      var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)readFile(f);});
  }
  if(/[?&]demo\b/.test(location.search||'')){
    demo();
    /* ?sim=cancer&at=52 — 시뮬 상태를 주소로 바로 엽니다 (캡처·시연용) */
    var sm=(location.search||'').match(/[?&]sim=([a-z]+)/);
    if(sm&&typeof KD_SIM_MAP!=='undefined'&&KD_SIM_MAP[sm[1]]){
      simOn(sm[1]);
      var at=(location.search||'').match(/[?&]at=(\d+)/);
      if(at&&W.sim)W.sim.age=at[1];
    }
    var m=(location.search||'').match(/[?&]s=(\d+)/);
    if(m)go(parseInt(m[1],10)-1);
    if(/[?&]sc\b/.test(location.search||'')&&!document.body.classList.contains('scon'))scToggle();
  }
});

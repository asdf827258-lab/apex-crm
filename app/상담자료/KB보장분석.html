/* ── 어떤 이야기를 켤 것인가 ─────────────────────────────────────
   기준선(KD_LINE)은 <b>우리가 정한 값이 아니라 설계사가 정한 값</b>이다.
   화면에도 그렇게 적는다. 「이 정도는 있어야 한다」를 앱이 말하기
   시작하면 그것이 곧 지어내는 것이다 (CLAUDE.md 1번).             */
/* ⚠ 옛 KD_LINE(고정값)은 없앴습니다. 이제 <b>나이에 맞춘 권장금액</b>을
   기준.js 의 kdRecOf(key, age) 에서 가져옵니다 — 40세와 55세에 같은
   기준을 들이대면 둘 다 틀립니다.                                    */
function kdLineOf(A,key){ return kdRecOf(key, A.person?A.person.age:null); }

/* ── 한 군이 어떤 상태인가 ───────────────────────────────────────
   「없음」과 「하루치뿐」을 <b>반드시 갈라서</b> 말합니다. 간병 일당이
   하나 있는데 「간병 담보가 한 건도 없습니다」라고 말하면, 고객이
   증권을 꺼내는 순간 그 자리에서 무너집니다.                       */
function kdGState(G,line){
  if(!G||G.n===0)return {s:'none',label:'없음',why:'담보가 한 건도 없습니다'};
  if(G.won===0&&G.daily>0)
    return {s:'daily',label:'하루치만',why:'하루치(일당) 담보 '+G.daily+'개뿐입니다 — 목돈으로 나오는 담보가 없습니다'};
  if(G.won===0)return {s:'none',label:'금액 모름',why:'담보는 있는데 금액을 읽지 못했습니다 — 증권 확인이 필요합니다'};
  if(line&&G.won<line)
    return {s:'low',label:kdWonR(G.won),why:'기준선('+kdWonR(line)+')보다 적습니다'};
  return {s:'ok',label:kdWonR(G.won),why:''};
}

function kdPickStories(A){
  var out=[],seen={};
  function add(k,why){
    if(!KD_STORY[k]||seen[k])return;
    seen[k]=1; out.push({k:k,why:why});
  }
  /* 이야기가 붙어 있는 군만 훑습니다 — 순서가 곧 상담 순서입니다 */
  ['cancer_diag','cancer_main','cancer_nonpay','brain','heart','care','death'].forEach(function(k){
    var G=A.g[k]; if(!G)return;
    var line=kdLineOf(A,k), st=kdGState(G,line);
    if(st.s!=='ok'){ add(k,(G.t||k)+' — '+st.why); return; }
    /* 목돈은 있는데 <b>진단비</b>가 얇은 자리도 짚습니다 */
    if(line&&G.dx>0&&G.dx<line)
      add(k,(G.t||k)+' 진단비가 권장('+kdWonR(line)+')보다 적습니다');
  });

  if(A.silsonN===0)add('silson','실손이 한 건도 없습니다');
  else if(A.silsonN>=2)add('silson','실손이 '+A.silsonN+'건입니다 — 합쳐서 나오지 않습니다');

  if(A.endMin!==null&&A.person.age&&A.endMin<90)
    add('expire','가장 먼저 끝나는 계약이 '+A.endMin+'세입니다');

  return out;
}

/* ═══════════════════════════════════════════════════════════════════════
   인생 로드맵 — <b>겹치는 자리가 곧 걱정</b>입니다

   KB 보장분석에는 나이·계약·만기만 있습니다. 은퇴·자녀·부모는 문서에
   없으므로 <b>설계사가 넣습니다.</b> 안 넣으면 그 띠를 안 그립니다 —
   평균으로 채우지 않습니다 (CLAUDE.md 1번).
   ═══════════════════════════════════════════════════════════════════════ */

function kdNums(s){
  return (''+(s||'')).split(/[^0-9]+/).map(function(x){return parseInt(x,10);})
    .filter(function(n){return isFinite(n)&&n>0&&n<120;});
}

/* 국민연금 받기 시작하는 나이는 <b>출생연도</b>에 따라 다릅니다.
   1969년생 이후가 65세입니다 — 이건 법에 적힌 표라 바뀌지 않습니다.
   모르면 null 을 돌려주고, 화면에서는 그 표시를 안 합니다.        */
function kdNpsAge(birthYear){
  if(!birthYear||!isFinite(birthYear))return null;
  if(birthYear<=1952)return 60;
  if(birthYear<=1956)return 61;
  if(birthYear<=1960)return 62;
  if(birthYear<=1964)return 63;
  if(birthYear<=1968)return 64;
  return 65;
}

function kdRoadmap(A,L){
  L=L||{};
  var me=A.person.age||null;
  if(!me)return null;
  var born=(new Date()).getFullYear()-me;
  var retire=parseInt(L.retire,10); if(!isFinite(retire)||retire<me)retire=null;
  var nps=kdNpsAge(born);
  /* 오른쪽 끝은 <b>제일 늦게 끝나는 보장</b>까지 담습니다. 95 로 고정해 두면
     100세 만기가 그림 밖으로 밀려나 「안 보이는 것 = 없는 것」이 됩니다. */
  var lo=Math.max(0,me-2), hi=95, z;
  for(z=0;z<A.ends.length;z++)if(A.ends[z].age+3>hi)hi=Math.min(108,A.ends[z].age+3);

  var bands=[],marks=[],worries=[];

  /* ── 자녀 — 대학 4년을 띠로 ── */
  var kids=kdNums(L.kids), i, kidWin=[];
  for(i=0;i<kids.length;i++){
    var k=kids[i];
    var from=me+(19-k), to=me+(23-k);     /* 그 아이가 19~23세일 때 내 나이 */
    if(to<=me)continue;                    /* 이미 지나갔으면 안 그림 */
    bands.push({from:Math.max(lo,from),to:Math.min(hi,to),
                t:'자녀'+(kids.length>1?(' '+(i+1)):'')+' 대학',tone:'warn'});
    kidWin.push({from:from,to:to,k:k});
  }

  /* ── 부모 — 「간병이 있을 만한 구간」. 예언이 아니라 구간입니다. ── */
  var par=kdNums(L.parents);
  for(i=0;i<par.length;i++){
    var p=par[i];
    var pf=me+(80-p), pt=me+(90-p);
    if(pt<=me)continue;
    bands.push({from:Math.max(lo,Math.max(me,pf)),to:Math.min(hi,pt),
                t:'부모'+(par.length>1?(' '+(i+1)):'')+' 간병 예상',tone:'bad'});
  }

  /* ── 대출 끝나는 해 ── */
  var loanEnd=parseInt(L.loanEnd,10);
  if(isFinite(loanEnd)&&loanEnd>me&&loanEnd<hi)
    marks.push({age:loanEnd,t:'대출 끝',tone:'ok'});

  /* ── 은퇴 · 국민연금 ── */
  if(retire){
    marks.push({age:retire,t:'은퇴',tone:'bad'});
    if(nps&&nps>retire){
      bands.push({from:retire,to:nps,t:'소득 공백',tone:'bad'});
      worries.push({t:retire+'세에 은퇴하시면 국민연금이 나오는 '+nps+'세까지 '+
        (nps-retire)+'년이 빕니다',why:'소득 공백'});
    }
  }
  if(nps)marks.push({age:nps,t:'국민연금 '+nps+'세',tone:'pri'});

  /* ── 보험이 끝나는 나이 ── */
  var ends={};
  for(i=0;i<A.ends.length;i++){
    var e=A.ends[i];
    if(e.age<=me||e.age>hi)continue;
    ends[e.age]=(ends[e.age]||0)+1;
  }
  Object.keys(ends).forEach(function(a){
    marks.push({age:parseInt(a,10),t:'보장 '+ends[a]+'건 끝',tone:'warn'});
  });

  /* ── 겹치는 자리 찾기 — 여기가 「걱정되는 부분」 ── */
  for(i=0;i<kidWin.length;i++){
    var w=kidWin[i];
    if(retire&&retire>=w.from&&retire<=w.to)
      worries.push({t:'자녀가 대학에 다니는 동안 은퇴가 옵니다 ('+retire+'세 무렵)',why:'교육비 + 은퇴'});
    var j;
    for(j=i+1;j<kidWin.length;j++)
      if(!(kidWin[j].to<w.from||kidWin[j].from>w.to))
        worries.push({t:'두 아이 대학이 '+Math.max(w.from,kidWin[j].from)+'세 무렵 겹칩니다',why:'교육비가 두 배'});
    for(j=0;j<A.ends.length;j++)
      if(A.ends[j].age>=w.from&&A.ends[j].age<=w.to)
        worries.push({t:'자녀 대학 기간에 보장 하나가 끝납니다 ('+A.ends[j].age+'세)',why:'교육비 + 보장 종료'});
  }
  for(i=0;i<bands.length;i++){
    if(bands[i].t.indexOf('간병 예상')<0)continue;
    if(retire&&retire>=bands[i].from&&retire<=bands[i].to)
      worries.push({t:'부모님 간병이 있을 만한 때에 은퇴가 겹칩니다',why:'간병 + 은퇴'});
  }
  if(A.endMin!==null&&A.endMin>me&&A.endMin<85)
    worries.push({t:'가장 먼저 '+A.endMin+'세에 보장 하나가 끝납니다',why:'그 나이가 제일 필요한 나이입니다'});

  /* 같은 말을 두 번 하지 않습니다 */
  var seen={},uniq=[];
  for(i=0;i<worries.length;i++)
    if(!seen[worries[i].t]){seen[worries[i].t]=1;uniq.push(worries[i]);}

  marks.sort(function(a,b){return a.age-b.age;});
  return {me:me,lo:lo,hi:hi,retire:retire,nps:nps,born:born,
          bands:bands,marks:marks,worries:uniq,
          needs:!(retire||kids.length||par.length)};
}

/* ═══════════════════════════════════════════════════════════════════════
   인생 한 장에 <b>돈</b>을 얹는다

   지금까지는 「언제」만 있었습니다. 고객이 진짜 궁금한 것은 「얼마」입니다.
   다만 이 화면에 필요한 값은 KB 보장분석에 <b>하나도 안 적혀 있습니다</b> —
   전부 설계사가 넣습니다. 안 넣으면 <b>그 줄은 안 그립니다.</b>

   국민연금 예상 수령액도 <b>짐작하지 않습니다.</b> 공단에서 확인한 값을
   받아 적는 칸입니다 (연금 장의 안내와 같은 규칙).
   ═══════════════════════════════════════════════════════════════════════ */
function kdLifeMoney(A,L){
  L=L||{};
  var n=function(v){var x=parseFloat(v);return (isFinite(x)&&x>0)?x:null;};
  var me=A.person.age||null;
  var born=me?((new Date()).getFullYear()-me):null;
  var nps=born?kdNpsAge(born):null;
  var retire=parseInt(L.retire,10); if(!isFinite(retire))retire=null;

  var nowM   = n(L.liveNow);     /* 지금 월 생활비 (만원) */
  var oldM   = n(L.liveOld);     /* 노후 월 생활비 (만원) */
  var npsM   = n(L.npsAmt);      /* 국민연금 예상 수령액 (월·만원) — 공단 확인값 */
  var careM  = n(L.careCost);    /* 부모 간병 월 비용 (만원) */
  var careY  = n(L.careYears);   /* 간병 예상 기간 (년) */

  /* ── ① 소득 공백 — 은퇴한 날부터 국민연금 나오는 날까지 ── */
  var gapY = (retire&&nps&&nps>retire)?(nps-retire):0;
  var gapWon = (gapY&&oldM)?(gapY*12*oldM*10000):null;

  /* ── ② 국민연금이 나오기 시작한 뒤 — 그래도 모자란 달마다의 돈 ── */
  var shortM = (oldM&&npsM)?(oldM-npsM):null;      /* 만원/월. 음수면 남는 것 */
  var shortTo = (nps&&nps<90)?90:null;             /* 90세까지 놓고 봅니다 */
  var shortWon = (shortM!==null&&shortM>0&&nps&&shortTo)
      ? (shortTo-nps)*12*shortM*10000 : null;

  /* ── ③ 부모 간병 — 기간과 월 비용을 <b>둘 다</b> 넣으셔야 총액이 나옵니다 ── */
  var careWon = (careM&&careY)?(careY*12*careM*10000):null;

  /* ── ④ 지금과 노후의 차이 ── */
  var dropM = (nowM&&oldM)?(nowM-oldM):null;

  return {me:me,born:born,nps:nps,retire:retire,
          nowM:nowM,oldM:oldM,npsM:npsM,careM:careM,careY:careY,
          gapY:gapY,gapWon:gapWon,
          shortM:shortM,shortTo:shortTo,shortWon:shortWon,
          careWon:careWon,dropM:dropM,
          ready:!!(oldM||npsM||careM||nowM)};
}

/* ═══════════════════════════════════════════════════════════════════════
   매달 내는 돈이 <b>어디로</b> 가는가

   이 화면에서 제일 중요한 사실은 합계가 아닙니다 —
   <b>보장에 가는 돈과 저축·연금으로 가는 돈이 섞여 있다</b>는 것입니다.
   월 100만원을 내시는데 보장에 가는 건 10만원인 경우가 아주 흔한데,
   막대가 전부 같은 색이면 그게 <b>안 보입니다.</b>

   ⚠ 가르는 기준은 <b>계약 이름</b>뿐입니다(kdPensionLike 와 같은 잣대).
     단정하지 않습니다 — 화면에도 「이름으로 짐작한 것」이라고 적습니다.
   ═══════════════════════════════════════════════════════════════════════ */
function kdPremSplit(A){
  var pen=kdPensionLike(A), ids={}, i;
  for(i=0;i<pen.length;i++)ids[pen[i].id||pen[i].nm]=1;

  var out={guard:0,save:0,paidUp:0,unknown:0,
           guardN:0,saveN:0,paidUpN:0,unknownN:0,rows:[]};
  for(i=0;i<A.contracts.length;i++){
    var c=A.contracts[i], key=c.id||c.nm, isSave=!!ids[key], w=c.premWon;
    var kind, won=0;
    if(c.paidUp){ kind='paid'; out.paidUpN++; if(w)out.paidUp+=w; }
    else if(w===null||w===undefined){ kind='none'; out.unknownN++; }
    else if(isSave){ kind='save'; out.save+=w; out.saveN++; won=w; }
    else { kind='guard'; out.guard+=w; out.guardN++; won=w; }
    out.rows.push({c:c,kind:kind,won:won});
  }
  out.pay = out.guard + out.save;                       /* 지금 실제로 나가는 돈 */
  out.guardPct = out.pay ? Math.round(out.guard/out.pay*100) : 0;
  out.savePct  = out.pay ? (100-out.guardPct) : 0;
  return out;
}

/* ═══════════════════════════════════════════════════════════════════════
   시뮬레이션 — <b>만약 이런 일이 생기면</b>

   인생 한 장은 「아무 일 없이 흘러갈 때」의 그림입니다. 그런데 상담에서
   진짜 물어야 할 것은 <b>「그 위에 일이 하나 떨어지면 어떻게 되는가」</b>
   입니다. 사건을 하나 골라 그 나이에 떨어뜨리고, 도미노를 넷으로 봅니다.

     ① 그때 당장 나가는 돈   (치료비 + 그동안의 생활비)
     ② 지금 보험에서 나오는 돈 (읽어 온 담보에서)
     ③ 모자란 돈             (①−②)
     ④ 그 뒤 인생이 어떻게 되나 (어디서 빼야 하는가)

   ⚠ 쉬는 기간·회복 여부는 <b>설계사가 고르는 값</b>입니다. 병과 사람에
     따라 완전히 다릅니다 — 앱이 정하지 않습니다. 치료비·간병비 단가는
     근거.js 의 <b>출처 있는 기사</b>를 씁니다.
   ═══════════════════════════════════════════════════════════════════════ */

var KD_SIM=[
 {k:'cancer', ic:'🎗️', t:'암', tone:'bad',
  /* 월 단가는 보험저널 2026.09.15 (비급여 항암 약값 월 300만원 이상, 환자 81%) */
  costM:300, costSrc:'보험저널 2026.09.15 · 비급여 항암 약값 월 300만원 이상',
  offM:6, offNote:'진단 → 수술 → 항암까지 쉬는 기간',
  recover:true,
  pay:['cancer_diag','cancer_main','cancer_nonpay'],
  after:'치료가 끝나도 <b>추적관찰이 몇 해</b> 이어집니다. 그 사이 저축은 멈춥니다.'},

 {k:'brain', ic:'🧠', t:'뇌졸중', tone:'bad',
  costM:150, costSrc:'재활·통원 비용 — <b>설계사가 정한 값</b>입니다 [출처 확인]',
  offM:12, offNote:'급성기 치료 + 재활',
  recover:false,
  pay:['brain'],
  after:'국립재활원 10년 추적에서 <b>28.3%</b>가 장애 등록까지 갔습니다. '+
        '돌아오지 못하면 <b>소득이 그 자리에서 끝납니다.</b>'},

 {k:'care', ic:'🧑‍🦽', t:'부모 간병', tone:'warn',
  /* 월 단가는 디멘시아뉴스 2025.12.01 (간병비 월 200만~267만, 전액 본인부담) */
  costM:200, costSrc:'디멘시아뉴스 2025.12.01 · 간병비 월 200만~267만, 전액 본인부담',
  offM:60, offNote:'간병이 이어지는 기간 — <b>고객이 정하는 값</b>',
  recover:true, keepIncome:true,
  pay:['care'],
  after:'내 소득은 그대로인데 <b>나가는 돈만</b> 늘어납니다. 대개 <b>은퇴자금에서</b> 빠집니다.'},

 {k:'jobless', ic:'📉', t:'실직', tone:'warn',
  /* 나가는 돈이 아니라 <b>안 들어오는 돈</b>입니다 — 생활비만 셉니다 */
  costM:0, costSrc:'',
  offM:6, offNote:'다시 일자리를 찾기까지',
  recover:true, noCost:true,
  pay:[],
  after:'실업급여는 <b>고용보험</b>에서 나옵니다 — 보험 담보와는 별개입니다. '+
        '이 기간에 <b>보험료를 못 내 해지</b>하는 경우가 가장 많습니다.'},

 {k:'incomedown', ic:'📊', t:'소득 감소', tone:'warn',
  costM:0, costSrc:'',
  offM:24, offNote:'소득이 줄어 있는 기간',
  recover:false, noCost:true, cutPct:true,
  pay:[],
  after:'줄어든 만큼 <b>저축이 먼저 멈춥니다.</b> 보험료는 그다음에 줄이게 되고, '+
        '그때 <b>비갱신부터 깨는</b> 경우가 많습니다 — 제일 아까운 순서입니다.'},

 {k:'death', ic:'🕯️', t:'가장 사망', tone:'worst',
  costM:0, costSrc:'',
  offM:0, offNote:'',
  recover:false, forever:true,
  pay:['death'],
  after:'남는 가족의 생활비·교육비·대출이 <b>그대로 남습니다.</b> 소득만 사라집니다.'}
];
var KD_SIM_MAP={};(function(){for(var i=0;i<KD_SIM.length;i++)KD_SIM_MAP[KD_SIM[i].k]=KD_SIM[i];})();

/* 사건 하나를 떨어뜨린다.  S = {ev, age, off, cost, recover} — 전부 설계사 값 */
function kdSimulate(A,L,S){
  S=S||{};
  var E=KD_SIM_MAP[S.ev]; if(!E)return null;
  var me=A.person.age||null; if(!me)return null;

  var age = parseInt(S.age,10);  if(!isFinite(age)||age<me)age=me;
  var off = parseFloat(S.off);   if(!isFinite(off)||off<0)off=E.offM;
  var cost= parseFloat(S.cost);  if(!isFinite(cost)||cost<0)cost=E.costM;
  var recover = (S.recover===undefined)?E.recover:!!S.recover;

  var liveM = parseFloat(L&&L.liveNow);          /* 지금 월 생활비 (만원) */
  if(!isFinite(liveM)||liveM<=0)liveM=null;

  /* ── ① 나가는 돈 ── */
  /* 실직·소득감소는 <b>나가는 돈</b>이 아니라 <b>안 들어오는 돈</b>입니다.
     치료비 칸이 없으니 0 으로 두고 생활비(또는 줄어든 몫)만 셉니다.   */
  var costWon = E.noCost ? 0 : cost*off*10000;   /* 치료비·간병비 */
  /* 간병은 <b>내 소득이 그대로</b>이므로 생활비를 이중으로 세지 않습니다 */
  var cutPct = E.cutPct ? (parseFloat(S.cut)||50) : null;   /* 소득이 몇 % 줄었나 */
  var lostWon = (!E.keepIncome && !E.forever && liveM)
      ? (liveM*off*10000*(cutPct?cutPct/100:1)) : 0;
  var outWon  = costWon + lostWon;

  /* ── ② 지금 보험에서 나오는 돈 ── */
  var inWon=0, parts=[];
  for(var i=0;i<E.pay.length;i++){
    var G=A.g[E.pay[i]]; if(!G)continue;
    /* 진단비가 있는 군은 <b>진단비만</b> 셉니다 — 수술비·일당은 목돈이 아닙니다 */
    var w = (G.dx>0) ? G.dx : G.won;
    if(w>0){ inWon+=w; parts.push({t:G.t, won:w}); }
  }
  /* 사망은 <b>적힌 금액</b>과 <b>실제로 쓸 수 있는 금액</b>을 갈라 둡니다.
     연금·저축에 붙은 사망보장은 쌓인 돈일 수 있어, 그대로 「남는 가족이
     쓸 돈」이라고 말하면 <b>「사망은 충분하시네요」</b>가 되어 버립니다.   */
  var penDeath=0, rawWon=inWon;
  if(E.k==='death'){
    var DP=kdDeathFromPension(A);
    penDeath=DP.won||0;
    inWon=Math.max(0,inWon-penDeath);
  }

  /* ── ③ 모자란 돈 ── */
  var gapWon = (E.forever) ? null : Math.max(0, outWon-inWon);

  /* ── ④ 그 뒤 ── */
  var hits=[];   /* 이 사건이 로드맵의 무엇과 겹치는가 */
  var R=kdRoadmap(A,L);
  if(R){
    for(var b=0;b<R.bands.length;b++){
      var bd=R.bands[b];
      if(age>=bd.from&&age<=bd.to)hits.push(bd.t);
    }
    for(var m=0;m<R.marks.length;m++){
      var mk=R.marks[m];
      if(Math.abs(mk.age-age)<=2)hits.push(mk.t);
    }
  }

  return {E:E, age:age, off:off, cost:cost, recover:recover, liveM:liveM,
          cutPct:cutPct, costWon:costWon, lostWon:lostWon, outWon:outWon,
          inWon:inWon, rawWon:rawWon, parts:parts, penDeath:penDeath,
          gapWon:gapWon, hits:hits,
          ready:!!(off>0||cost>0||E.forever)};
}

</script>
<script>
/* ── 연금종신.js ── */
/* ═══════════════════════════════════════════════════════════════════════
   연금종신.js — 「안 아프고 오래 사실 때」

   여기까지가 <b>아플 때</b> 이야기였다면, 이 파일은 <b>안 아플 때</b>입니다.

/* 이 문서에서 읽은 계약 중 <b>연금성</b>으로 보이는 것 — 이름으로만 거릅니다.

function kdPensionLike(A){
  var out=[],i,c;
  for(i=0;i<A.contracts.length;i++){
    c=A.contracts[i];
    var nm=(c.nm||'');
    if(/연금|변액|저축|퇴직|IRP|유니버셜|달러/.test(nm))out.push(c);
  }
  return out;
}

/* ── 소득 공백 ───────────────────────────────────────────────────
   은퇴한 날부터 국민연금이 나오는 날까지. 이 구간이 이 장의 <b>숫자</b>입니다.
   월 필요액은 설계사가 넣습니다 — 짐작하지 않습니다.                  */
function kdGap(A,L){
  var me=A.person.age||null;
  if(!me)return null;
  var born=(new Date()).getFullYear()-me;
  var nps=kdNpsAge(born);
  var retire=parseInt((L&&L.retire)||'',10);
  if(!isFinite(retire))retire=null;
  var needM=parseFloat((L&&L.retNeed)||'');       /* 만원/월 */
  if(!isFinite(needM)||needM<=0)needM=null;

  var years=(retire&&nps&&nps>retire)?(nps-retire):0;
  var totalWon=(years&&needM)?(years*12*needM*10000):null;
  return {me:me,born:born,nps:nps,retire:retire,needM:needM,
          years:years,totalWon:totalWon,
          ready:!!(retire&&nps)};
}

/* ── 필요보장액 (사망) ───────────────────────────────────────────
   식은 하나입니다.
     필요보장액 = 남은 생활비 + 남은 교육비 + 남은 부채 − 지금 있는 것
   앞의 「인생 한 장」에서 받은 값을 그대로 씁니다 — 두 번 묻지 않습니다.
   하나라도 비면 <b>계산하지 않습니다.</b>                             */
function kdNeedDeath(A,L,N){
  N=N||{};
  var live=parseFloat(N.liveM||'');      /* 유족 월 생활비 (만원) */
  var yrs =parseFloat(N.liveY||'');      /* 몇 년치 */
  var edu =parseFloat(N.eduMan||'');     /* 남은 교육비 (만원) */
  var debt=parseFloat(N.debtMan||'');    /* 남은 부채 (만원) */
  var asset=parseFloat(N.assetMan||'');  /* 지금 쓸 수 있는 자산 (만원) */
  var any=[live,yrs,edu,debt,asset].some(function(v){return isFinite(v)&&v>0;});
  if(!any)return {ready:false};

  var liveWon=(isFinite(live)&&isFinite(yrs))?(live*yrs*12*10000):0;
  var eduWon =isFinite(edu)?edu*10000:0;
  var debtWon=isFinite(debt)?debt*10000:0;
  var assetWon=isFinite(asset)?asset*10000:0;
  var need=liveWon+eduWon+debtWon-assetWon;
  var have=(A.g.death?A.g.death.won:0)||0;      /* 사고일 때만 나오는 건 안 더합니다 */
  return {ready:true,liveWon:liveWon,eduWon:eduWon,debtWon:debtWon,assetWon:assetWon,
          need:Math.max(0,need),have:have,gap:Math.max(0,need-have),over:Math.max(0,have-need)};
}

/* ── ⚠ 사망보장 중 <b>연금·저축 계약에 붙은 것</b> ────────────────
   이 자리를 안 가르면 상담이 통째로 틀어집니다.

   연금보험·변액연금에 붙은 사망보장은 금액이 아주 큽니다. 그걸 그대로
   「죽으면 나오는 돈」에 더하면 <b>「사망은 충분하시네요」</b>가 되어
   버립니다. 그런데 그건 보장이 아니라 <b>쌓인 돈</b>일 수 있습니다 —
   중도에 찾아 쓰면 사라지고, 연금으로 받기 시작하면 또 달라집니다.

   그래서 갈라서 보여 주고 <b>「계약 내용으로 확인하십시오」</b>라고
   적습니다. 판단은 우리가 하지 않습니다.                            */
function kdDeathFromPension(A){
  var pen=kdPensionLike(A), ids={}, i, total=0, list=[];
  for(i=0;i<pen.length;i++)ids[pen[i].id||pen[i].nm]=pen[i];
  var G=A.g.death;
  if(!G)return {won:0,list:[]};
  for(i=0;i<G.items.length;i++){
    var it=G.items[i], key=it.c.id||it.c.nm;
    if(!ids[key])continue;
    if(it.v.won===null||it.v.won===undefined||it.v.__daily)continue;
    total+=it.v.won;
    list.push({co:it.c.co,nm:it.c.nm,won:it.v.won});
  }
  return {won:total,list:list};
}

<script>
/* ── 그림.js ── */
/* ═══════════════════════════════════════════════════════════════════════
   그림.js — 표 대신 <b>그림</b>을 그립니다

   전부 손으로 짠 SVG 입니다. 라이브러리를 안 씁니다 —
   파일 하나로 합쳐야 하고, 인터넷 없이도 떠야 하기 때문입니다.

   여기서는 <b>계산을 하지 않습니다.</b> 받은 값을 그리기만 합니다.
   값을 만드는 곳은 deck.js 한 곳입니다.
   ═══════════════════════════════════════════════════════════════════════ */

function gEsc(s){
  return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* 색은 「메인 상담자료.html」 의 토스 판과 같은 값을 씁니다 */
var G_TONE={ok:'#059669',pri:'#3182f6',warn:'#d97706',bad:'#e5484d',worst:'#b42318',
            purple:'#8a4bff',dim:'#cbd2dd'};
function gC(t){return G_TONE[t]||G_TONE.pri;}

/* ── 도넛 하나 — 「100명 중 81명」 ───────────────────────────────
   숫자를 가운데 크게 놓습니다. 고객이 한 번에 읽는 것은 이것뿐입니다. */
function gDonut(pct,tone,size){
  var s=size||132, r=s/2-11, c=s/2, C=2*Math.PI*r;
  var on=Math.max(0,Math.min(100,pct))/100*C;
  return '<svg viewBox="0 0 '+s+' '+s+'" width="'+s+'" height="'+s+'" role="img" '+
    'aria-label="'+pct+'퍼센트">'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="#EEF1F6" stroke-width="15"/>'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+gC(tone)+'" stroke-width="15" '+
      'stroke-linecap="round" stroke-dasharray="'+on.toFixed(1)+' '+C.toFixed(1)+'" '+
      'transform="rotate(-90 '+c+' '+c+')"/>'+
    '<text x="'+c+'" y="'+(c+2)+'" text-anchor="middle" dominant-baseline="middle" '+
      'font-size="'+(s*0.27)+'" font-weight="800" fill="'+gC(tone)+'">'+pct+'</text>'+
    '<text x="'+c+'" y="'+(c+s*0.20)+'" text-anchor="middle" '+
      'font-size="'+(s*0.11)+'" font-weight="800" fill="'+gC(tone)+'" opacity=".75">%</text>'+
    '</svg>';
}

/* ── 사람 100명 — 퍼센트를 <b>사람 수</b>로 ─────────────────────
   「81%」보다 「100명 중 81명」이 훨씬 빨리 읽힙니다.            */
function gPeople(pct,tone){
  var n=Math.round(Math.max(0,Math.min(100,pct))),i,x,y,out=[];
  for(i=0;i<100;i++){
    x=(i%20)*16+8; y=Math.floor(i/20)*19+10;
    out.push('<g transform="translate('+x+','+y+')" fill="'+(i<n?gC(tone):'#E3E7EE')+'">'+
      '<circle cx="0" cy="0" r="3.1"/><path d="M-3.4 10 v-4.2 a3.4 3.4 0 0 1 6.8 0 V10 z"/></g>');
  }
  return '<svg viewBox="0 0 328 106" width="100%" style="max-width:340px" role="img" '+
    'aria-label="100명 중 '+n+'명">'+out.join('')+'</svg>';
}

/* ── 가로 막대 여러 줄 ──────────────────────────────────────────
   rows: [{t, sub, v, tone, label}] · max 를 안 주면 제일 큰 값에 맞춥니다. */
/* row.pct 를 주면 그 값을 그대로 씁니다 — 한 줄에 10억이 섞여 있으면
   가장 큰 값에 맞춘 막대는 나머지를 <b>전부 0 으로 만들어</b> 버립니다.
   그럴 때는 각 줄을 <b>제 기준선 대비</b>로 그립니다.                */
function gBars(rows,max,opt){
  opt=opt||{};
  var mx=max||0,i;
  if(!mx)for(i=0;i<rows.length;i++)if(rows[i].v>mx)mx=rows[i].v;
  if(!mx)mx=1;
  return '<div class="gb">'+rows.map(function(r){
    var w=(r.pct!==undefined&&r.pct!==null)
      ? Math.max(r.pct>0?2:0,Math.min(100,Math.round(r.pct)))
      : Math.max(r.v>0?2:0,Math.round(r.v/mx*100));
    return '<div class="gb-r">'+
      '<div class="gb-t"><b>'+gEsc(r.t)+'</b>'+(r.sub?('<span>'+gEsc(r.sub)+'</span>'):'')+'</div>'+
      '<div class="gb-l"><i style="width:'+w+'%;background:'+gC(r.tone)+'"></i>'+
        (opt.line?('<u style="left:'+Math.min(100,Math.round(opt.line/mx*100))+'%"></u>'):'')+
      '</div>'+
      '<div class="gb-v num" style="color:'+gC(r.tone)+'">'+gEsc(r.label)+'</div>'+
    '</div>';
  }).join('')+'</div>';
}

/* ── 치료비와 생활비 — 산봉우리와 평지 ──────────────────────────
   이 그림 하나가 이 화면의 전부입니다.
     · 치료비 = 솟았다가 <b>내려옵니다</b>
     · 생활비 = 낮지만 <b>안 내려옵니다</b>
     · 소득 0 구간 = 바닥에 깔린 빗금
   months 만큼의 가로축 위에 그립니다.                            */
function gCostCurve(months,careTotal,liveWonM,haveWon){
  var W=680,H=250,L=46,R=14,T=16,B=34;
  var pw=W-L-R, ph=H-T-B;
  var mM=Math.max(6,months||6);
  var live=liveWonM||0;
  /* 종 모양 곡선의 <b>아래 넓이</b>가 치료비 총액이 되도록 꼭대기를 정합니다.
     넓이를 눈금으로 재서 나눕니다 — 식을 외워 쓰면 모양을 바꿀 때 틀어집니다. */
  var bell=function(k){ return Math.exp(-Math.pow((k-0.22)/0.20,2)); };
  var areaK=0, N=400, q;
  for(q=0;q<N;q++) areaK += bell((q+0.5)/N)/N;      /* 0~1 구간의 넓이 */
  var peak = (careTotal>0 && areaK>0 && mM>0) ? (careTotal/(areaK*mM)) : 0;
  /* ⚠ 진단비 선도 <b>세로 범위에 넣어야</b> 합니다. 안 넣으면 진단비가 치료비보다
     클 때 그 선이 그림 위로 잘려 <b>소리 없이 사라집니다</b> — 「지금 나올 돈」이
     안 보이면 이 그림이 하려던 말이 통째로 없어집니다. */
  /* ⚠ 진단비는 여기 넣지 않습니다. 목돈이라 <b>월 금액 축</b>에 올릴 수 없습니다.
     대신 아래에서 「몇 달까지 덮이는가」로 <b>넓이</b>로 그립니다. */
  var mx=Math.max(peak,live*1.6,1);
  /* 진단비가 덮는 개월 — 달마다 나가는 돈(치료비+생활비)을 앞에서부터 갚아 나갑니다 */
  var coverM=0;
  if(haveWon>0){
    var left=haveWon, st=mM/400, kk;
    for(kk=0;kk<400;kk++){
      var need=(peak*bell((kk+0.5)/400)+live)*st;
      if(left<need){ coverM+=st*(left/need); left=0; break; }
      left-=need; coverM+=st;
    }
  }
  var x=function(m){return L+pw*(m/mM);};
  var y=function(v){return T+ph-ph*(v/mx);};

  /* 치료비 곡선 — 0 에서 솟았다가 치료 끝나면 내려온다 */
  var pts=[],i,m,v;
  for(i=0;i<=40;i++){
    m=mM*i/40;
    /* 진단 직후 급히 오르고 (0.25 지점 정점) 뒤로 완만히 내려온다 */
    var k=m/mM;
    v=peak*bell(k);
    pts.push(x(m).toFixed(1)+','+y(v).toFixed(1));
  }
  var curve='M'+pts.join(' L');
  var area=curve+' L'+x(mM).toFixed(1)+','+y(0).toFixed(1)+' L'+x(0).toFixed(1)+','+y(0).toFixed(1)+' Z';

  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" '+
    'aria-label="치료비는 솟았다 내려오고 생활비는 계속 이어진다">'+
    '<defs><linearGradient id="gcg" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#DC2626" stop-opacity=".30"/>'+
      '<stop offset="1" stop-color="#DC2626" stop-opacity=".02"/></linearGradient>'+
      '<pattern id="gch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
      '<line x1="0" y1="0" x2="0" y2="7" stroke="var(--sv-dim,#9CA3AF)" stroke-width="2.4" opacity=".35"/></pattern>'+
    '</defs>'+
    /* 소득 0 구간 */
    '<rect x="'+L+'" y="'+(T+ph-13)+'" width="'+pw+'" height="13" fill="url(#gch)"/>'+
    '<text x="'+(W-R-5)+'" y="'+(T+ph-3)+'" text-anchor="end" font-size="10.5" font-weight="800" fill="#4B5563">'+
      '이 기간 소득 0</text>'+
    /* 바닥선 */
    '<line x1="'+L+'" y1="'+y(0)+'" x2="'+(W-R)+'" y2="'+y(0)+'" stroke="#D8DEE8" stroke-width="1"/>'+
    /* 치료비 */
    '<path d="'+area+'" fill="url(#gcg)"/>'+
    '<path d="'+curve+'" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-linejoin="round"/>'+
    /* 생활비 — 평지 */
    '<line x1="'+L+'" y1="'+y(live)+'" x2="'+(W-R)+'" y2="'+y(live)+'" '+
      'stroke="#D97706" stroke-width="2.6" stroke-dasharray="7 4"/>'+
    /* 지금 나올 진단비 — 얼마까지 덮이는가 */
    (haveWon>0?(
      '<rect x="'+L+'" y="'+T+'" width="'+Math.max(0,x(Math.min(coverM,mM))-L).toFixed(1)+'" height="'+ph+'" '+
        'fill="#1A56DB" opacity=".10"/>'+
      '<line x1="'+x(Math.min(coverM,mM)).toFixed(1)+'" y1="'+T+'" x2="'+x(Math.min(coverM,mM)).toFixed(1)+'" y2="'+(T+ph)+'" '+
        'stroke="#1A56DB" stroke-width="2" stroke-dasharray="4 4"/>'+
      '<text x="'+(L+7)+'" y="'+(T+15)+'" font-size="11.5" font-weight="800" fill="#1A56DB">'+
        '진단비 '+kdWonR(haveWon)+'로 덮이는 구간</text>'+
      '<text x="'+(L+7)+'" y="'+(T+30)+'" font-size="10.5" fill="#1A56DB">'+
        (coverM>=mM ? ('끝까지 덮습니다') : ('여기까지 — 약 '+(coverM<1?'한 달이 안 됩니다':(Math.round(coverM*10)/10)+'개월'))) +'</text>'
    ):'')+
    /* 이름표 */
    '<text x="'+(x(mM*0.22)+8)+'" y="'+(y(peak)-8)+'" font-size="11.5" font-weight="800" fill="#DC2626">'+
      '치료비 — 솟았다 내려옵니다</text>'+
    '<text x="'+(x(mM*0.22)+8)+'" y="'+(y(peak)+7)+'" font-size="10.5" fill="#B91C1C">'+
      '가장 많이 나가는 달 '+kdWonR(peak)+'</text>'+
    '<text x="'+(L+6)+'" y="'+(y(live)-7)+'" font-size="11.5" font-weight="800" fill="#D97706">'+
      '생활비 — 안 내려옵니다</text>'+
    '<text x="'+(L+6)+'" y="'+(y(live)+13)+'" font-size="10.5" fill="#B45309">'+
      '달마다 '+kdWonR(live)+' × '+mM+'개월 = '+kdWonR(live*mM)+'</text>'+
    /* 가로축 */
    '<text x="'+(L-4)+'" y="'+(T+8)+'" text-anchor="end" font-size="10.5" font-weight="800" '+
      'fill="#6B7280" transform="rotate(-90 '+(L-4)+' '+(T+8)+')">달마다 나가는 돈</text>'+
    '<text x="'+L+'" y="'+(H-10)+'" font-size="11" fill="#6B7280">진단</text>'+
    '<text x="'+(W-R)+'" y="'+(H-10)+'" text-anchor="end" font-size="11" fill="#6B7280">'+mM+'개월 뒤</text>'+
    '</svg>';
}

/* ── 인생 로드맵 ────────────────────────────────────────────────
   이 화면의 심장입니다. <b>내가 지금 어디에 서 있고</b>, 앞으로
   무엇이 언제 겹치는지를 한 장에 놓습니다.

   marks : [{age, t, tone, side}]  — 세로로 세울 일들
   bands : [{from, to, t, tone}]   — 기간으로 깔 것들(교육비·간병 등)
   me    : 지금 나이                                                */
function gRoadmap(me,lo,hi,bands,marks,income,shock){
  /* ⚠ 높이를 넉넉히 둡니다. 예전에는 <b>나이 눈금과 표시 라벨이 겹쳐</b>
     「60세」 위에 「은퇴」가 찍혔습니다. 라벨 두 줄 + 눈금 한 줄이
     서로 안 닿을 만큼의 자리를 먼저 확보합니다.                        */
  /* 가로판은 화면이 넓습니다. 세로로 긴 그림은 높이에 맞춰 줄어들어
     <b>좌우가 텅 빕니다.</b> 납작하게 잡아야 가로를 다 씁니다.      */
  var W=1180,H=310,L=18,R=18,T=36,B=54;
  var pw=W-L-R, base=H-B, top=T;
  var x=function(a){return L+pw*Math.max(0,Math.min(1,(a-lo)/(hi-lo)));};

  var ret=(income&&income.retire)||60;
  var np=(income&&income.nps)||65;
  var cy=base-84, lowy=base-24;
  /* 아무 일 없을 때의 곡선 — 은퇴에서 한 번 떨어집니다 */
  var curve='M'+x(lo)+','+(cy+16)+
    ' C'+x(lo+(ret-lo)*0.45)+','+(cy-16)+' '+x(ret-2)+','+(cy-8)+' '+x(ret)+','+cy+
    ' L'+x(ret)+','+lowy+
    ' L'+x(np)+','+lowy+
    ' C'+x(np+1)+','+(lowy-10)+' '+x(np+3)+','+(lowy-14)+' '+x(hi)+','+(lowy-16);

  /* ── 사건이 떨어지면 ──────────────────────────────────────────
     그 나이에서 소득이 <b>바닥으로</b> 떨어집니다. 돌아오면 다시 올라오고,
     안 돌아오면 그대로 갑니다. 원래 곡선은 <b>옅게 남겨</b> 두어야
     「원래는 이랬는데」가 보입니다.                                  */
  var shockPath='',shockMark='',shockBand='';
  var nowHid=!!(shock&&shock.age&&Math.abs(shock.age-me)<3);
  if(shock&&shock.age&&shock.age<hi){
    var sa=Math.max(lo,shock.age), yrs=Math.max(0.5,(shock.off||6)/12);
    var back=Math.min(hi,sa+yrs);
    var floorY=base-6;
    var sp='M'+x(lo)+','+(cy+16)+
      ' C'+x(lo+(Math.min(sa,ret)-lo)*0.45)+','+(cy-16)+' '+x(sa-1)+','+(cy-4)+' '+x(sa)+','+(cy-2)+
      ' L'+x(sa)+','+floorY;
    if(shock.forever){ sp+=' L'+x(hi)+','+floorY; }
    else if(shock.recover){
      sp+=' L'+x(back)+','+floorY+' C'+x(back+1)+','+(cy+6)+' '+x(back+3)+','+(cy)+' '+
          x(Math.min(hi,ret))+','+cy;
      if(ret<hi)sp+=' L'+x(ret)+','+lowy+' L'+x(np)+','+lowy+' L'+x(hi)+','+(lowy-16);
    }else{
      /* 안 돌아옴 — 바닥보다 조금 위에서 이어집니다 */
      var half=(cy+floorY)/2;
      sp+=' L'+x(back)+','+floorY+' L'+x(back+1)+','+half+' L'+x(hi)+','+half;
    }
    shockPath='<path d="'+sp+'" fill="none" stroke="'+gC(shock.tone||'bad')+'" stroke-width="3" '+
      'stroke-linejoin="round"/>';
    shockBand='<rect x="'+x(sa).toFixed(1)+'" y="'+(top-4)+'" width="'+Math.max(2,(x(back)-x(sa))).toFixed(1)+'" '+
      'height="'+(base-top+4)+'" fill="'+gC(shock.tone||'bad')+'" opacity=".10"/>';
    /* 딱지 너비는 글자 수로 잡습니다 — 「92」 고정이면 긴 이름이 삐져나옵니다 */
    var sw=Math.max(92,Math.round((shock.label||'').length*11.6)+18);
    shockMark='<g><line x1="'+x(sa).toFixed(1)+'" y1="'+(top-22)+'" x2="'+x(sa).toFixed(1)+'" y2="'+base+'" '+
      'stroke="'+gC(shock.tone||'bad')+'" stroke-width="2.6"/>'+
      '<rect x="'+(x(sa)-sw/2).toFixed(1)+'" y="'+(top-40)+'" width="'+sw+'" height="21" rx="10" '+
      'fill="'+gC(shock.tone||'bad')+'"/>'+
      '<text x="'+x(sa).toFixed(1)+'" y="'+(top-25)+'" text-anchor="middle" font-size="11.5" '+
      'font-weight="800" fill="#fff">'+gEsc(shock.label||'')+'</text></g>';
  }

  var bandH=15, by=top+4;
  var bandSvg=(bands||[]).map(function(b,i){
    var x1=x(b.from), x2=x(b.to), w=Math.max(3,x2-x1), yy=by+i*(bandH+5);
    var tw=b.t.length*7.2+10, inside=(w>=tw), tx, anchor;
    if(inside){ tx=x1+6; anchor='start'; }
    else if(x2+tw<W-R){ tx=x2+6; anchor='start'; }
    else { tx=x1-6; anchor='end'; }
    return '<g><rect x="'+x1.toFixed(1)+'" y="'+yy+'" width="'+w.toFixed(1)+'" '+
      'height="'+bandH+'" rx="7" fill="'+gC(b.tone)+'" opacity=".17"/>'+
      '<rect x="'+x1.toFixed(1)+'" y="'+yy+'" width="'+w.toFixed(1)+'" '+
      'height="'+bandH+'" rx="7" fill="none" stroke="'+gC(b.tone)+'" stroke-width="1.2" opacity=".55"/>'+
      '<text x="'+tx.toFixed(1)+'" y="'+(yy+11)+'" text-anchor="'+anchor+'" font-size="10.5" '+
      'font-weight="800" fill="'+gC(b.tone)+'">'+gEsc(b.t)+'</text></g>';
  }).join('');

  /* 표시(마커) — 두 줄로 엇갈려 놓고, <b>가장자리에서는 안쪽으로</b> 붙입니다.
     예전에는 오른쪽 끝 「보장 2건 끝」이 그림 밖으로 반쯤 나갔습니다.      */
  var markSvg=(marks||[]).map(function(m,i){
    var mx=x(m.age), ly=base+17+(i%2)*16;
    var anchor='middle', tx=mx, tw=m.t.length*6.6;
    if(mx-tw/2<L){anchor='start';tx=L;}
    else if(mx+tw/2>W-R){anchor='end';tx=W-R;}
    return '<g><line x1="'+mx.toFixed(1)+'" y1="'+(by-6)+'" x2="'+mx.toFixed(1)+'" y2="'+base+'" '+
      'stroke="'+gC(m.tone)+'" stroke-width="1.3" stroke-dasharray="3 3" opacity=".8"/>'+
      '<circle cx="'+mx.toFixed(1)+'" cy="'+base+'" r="3.6" fill="'+gC(m.tone)+'"/>'+
      '<text x="'+tx.toFixed(1)+'" y="'+ly+'" text-anchor="'+anchor+'" font-size="10.5" '+
      'font-weight="800" fill="'+gC(m.tone)+'">'+gEsc(m.t)+'</text></g>';
  }).join('');

  /* 나이 눈금은 <b>맨 아래 한 줄</b>에만 — 마커 라벨과 안 겹칩니다 */
  var ticks='',a;
  for(a=Math.ceil(lo/10)*10;a<=hi;a+=10){
    ticks+='<text x="'+x(a).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" '+
      'fill="var(--sv-dim,#9CA3AF)">'+a+'세</text>';
  }

  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" '+
    'aria-label="지금 '+me+'세부터 '+hi+'세까지의 인생 로드맵">'+
    '<line x1="'+L+'" y1="'+base+'" x2="'+(W-R)+'" y2="'+base+'" stroke="var(--sv-line,#CBD2DD)" stroke-width="1.4"/>'+
    shockBand+bandSvg+
    '<path d="'+curve+'" fill="none" stroke="var(--sv-pri,#3182f6)" stroke-width="2.6" stroke-linejoin="round" '+
      'opacity="'+(shock?'.25':'.85')+'"'+(shock?' stroke-dasharray="5 4"':'')+'/>'+
    shockPath+
    '<text x="'+(x(lo)+4)+'" y="'+(cy-14)+'" font-size="10.5" font-weight="800" fill="var(--sv-pri,#3182f6)" opacity=".9">벌어들이는 돈</text>'+
    markSvg+shockMark+ticks+
    '<g><line x1="'+x(me).toFixed(1)+'" y1="'+(top-16)+'" x2="'+x(me).toFixed(1)+'" y2="'+(base+6)+'" '+
      'stroke="var(--sv-now,#111827)" stroke-width="2.4"/>'+
    /* 사건이 지금 나이에 떨어지면 두 딱지가 같은 자리에 겹칩니다 —
       그때는 검은 딱지를 지웁니다. 사건 딱지에 이미 그 나이가 적혀 있습니다. */
    (nowHid?'':
      ('<rect x="'+(x(me)-31).toFixed(1)+'" y="'+(top-32)+'" width="62" height="20" rx="10" fill="var(--sv-now,#111827)"/>'+
       '<text x="'+x(me).toFixed(1)+'" y="'+(top-18)+'" text-anchor="middle" font-size="11" '+
       'font-weight="800" fill="var(--sv-now-ink,#fff)">지금 '+me+'세</text>'))+'</g>'+
    '</svg>';
}

/* ── 3층 연금 기둥 ──────────────────────────────────────────────
   채워진 기둥 / 비어 있는 기둥이 한눈에 갈리는 것이 전부입니다.
   금액을 모르면 <b>비어 있다</b>가 아니라 <b>모른다</b>로 그립니다 —
   둘은 다릅니다 (CLAUDE.md 1번).                                  */
function gPillars(rows){
  var W=660,H=232,L=30,R=30,B=54,T=22;
  var n=rows.length, pw=(W-L-R)/n, bw=Math.min(118,pw-26), base=H-B;
  var out='';
  rows.forEach(function(r,i){
    var cx=L+pw*i+pw/2, x=cx-bw/2;
    var h=(r.state==='ok')?(base-T):(r.state==='some'?(base-T)*0.45:0);
    var col=(r.state==='ok')?'#059669':(r.state==='some'?'#d97706':'var(--sv-line,#CBD2DD)');
    out+='<rect x="'+x+'" y="'+T+'" width="'+bw+'" height="'+(base-T)+'" rx="10" '+
      'fill="none" stroke="#DDE3EC" stroke-width="1.5" stroke-dasharray="'+(r.state==='none'?'5 4':'0')+'"/>';
    if(h>0)out+='<rect x="'+x+'" y="'+(base-h)+'" width="'+bw+'" height="'+h+'" rx="10" fill="'+col+'" opacity=".92"/>';
    out+='<text x="'+cx+'" y="'+(base+20)+'" text-anchor="middle" font-size="12.5" font-weight="800" '+
      'fill="var(--sv-ink,#191f28)">'+gEsc(r.t)+'</text>'+
      '<text x="'+cx+'" y="'+(base+36)+'" text-anchor="middle" font-size="10.5" fill="#6b7684">'+
      gEsc(r.sub)+'</text>'+
      '<text x="'+cx+'" y="'+(h>0?(base-h-9):(base-10))+'" text-anchor="middle" font-size="11.5" '+
      'font-weight="800" fill="'+(r.state==='none'?'#6b7684':col)+'">'+gEsc(r.label)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="3층 연금">'+
    '<line x1="'+L+'" y1="'+base+'" x2="'+(W-R)+'" y2="'+base+'" stroke="var(--sv-line,#CBD2DD)" stroke-width="1.4"/>'+
    out+'</svg>';
}

/* ── 소득 공백 ──────────────────────────────────────────────────
   은퇴한 날 소득이 <b>수직으로</b> 떨어지고, 국민연금이 시작될 때까지
   바닥이 이어지는 그림. 그 바닥의 <b>길이</b>가 이 장의 숫자입니다.   */
function gGap(me,retire,nps,hi){
  var W=680,H=210,L=26,R=26,T=26,B=42;
  hi=hi||90;
  var pw=W-L-R, base=H-B;
  var x=function(a){return L+pw*Math.max(0,Math.min(1,(a-me)/(hi-me)));};
  var top=T+16, low=base-18;
  var g='';
  if(retire&&nps&&nps>retire){
    g='<rect x="'+x(retire).toFixed(1)+'" y="'+top+'" width="'+(x(nps)-x(retire)).toFixed(1)+'" '+
      'height="'+(base-top)+'" fill="#e5484d" opacity=".10"/>'+
      '<text x="'+((x(retire)+x(nps))/2).toFixed(1)+'" y="'+(top+16)+'" text-anchor="middle" '+
      'font-size="12" font-weight="800" fill="#e5484d">소득 공백 '+(nps-retire)+'년</text>';
  }
  var path='M'+x(me)+','+top+' L'+(retire?x(retire):x(hi))+','+top;
  if(retire){
    path+=' L'+x(retire)+','+low;
    if(nps&&nps>retire)path+=' L'+x(nps)+','+low+' L'+x(nps)+','+(low-26)+' L'+x(hi)+','+(low-26);
    else path+=' L'+x(hi)+','+low;
  }
  var ticks='',a;
  for(a=Math.ceil(me/10)*10;a<=hi;a+=10)
    ticks+='<text x="'+x(a).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10" fill="#8b95a1">'+a+'세</text>';
  var mk=function(age,t,col){
    if(!age)return '';
    return '<line x1="'+x(age).toFixed(1)+'" y1="'+(T-4)+'" x2="'+x(age).toFixed(1)+'" y2="'+base+'" '+
      'stroke="'+col+'" stroke-width="1.3" stroke-dasharray="3 3"/>'+
      '<circle cx="'+x(age).toFixed(1)+'" cy="'+base+'" r="3.6" fill="'+col+'"/>'+
      '<text x="'+x(age).toFixed(1)+'" y="'+(base+18)+'" text-anchor="middle" font-size="11" '+
      'font-weight="800" fill="'+col+'">'+gEsc(t)+'</text>';
  };
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="은퇴와 국민연금 사이 소득 공백">'+
    g+
    '<line x1="'+L+'" y1="'+base+'" x2="'+(W-R)+'" y2="'+base+'" stroke="var(--sv-line,#CBD2DD)" stroke-width="1.4"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--sv-pri,#3182f6)" stroke-width="2.8" stroke-linejoin="round"/>'+
    '<text x="'+(x(me)+5)+'" y="'+(top-7)+'" font-size="11" font-weight="800" fill="var(--sv-pri,#3182f6)">버는 돈</text>'+
    mk(retire,'은퇴 '+(retire||'')+'세','#e5484d')+
    mk(nps,'국민연금 '+(nps||'')+'세','#059669')+
    ticks+'</svg>';
}

/* ── 필요보장액 게이지 ──────────────────────────────────────────
   쌓아 올린 필요액(생활비·교육비·부채 − 자산) 옆에 <b>지금 사망보장</b>을
   나란히 세웁니다. 모자란 만큼이 눈에 보이면 설명이 필요 없습니다.    */
function gNeed(N){
  var W=660,H=200,T=24,B=44,L=40,R=40;
  var base=H-B, mx=Math.max(N.need,N.have,1), sc=(base-T)/mx;
  var bw=112, gapx=70;
  var x1=W/2-bw-gapx/2, x2=W/2+gapx/2;
  var parts=[
    {v:N.liveWon, c:'var(--sv-pri,#3182f6)', t:'유족 생활비'},
    {v:N.eduWon,  c:'#8a4bff', t:'교육비'},
    {v:N.debtWon, c:'#d97706', t:'부채'}
  ].filter(function(p){return p.v>0;});
  var out='',y=base;
  parts.forEach(function(p){
    var h=p.v*sc; y-=h;
    out+='<rect x="'+x1+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+Math.max(1,h).toFixed(1)+'" fill="'+p.c+'" opacity=".9"/>';
    if(h>17)out+='<text x="'+(x1+bw/2)+'" y="'+(y+h/2+4).toFixed(1)+'" text-anchor="middle" '+
      'font-size="10.5" font-weight="800" fill="#fff">'+gEsc(p.t)+'</text>';
  });
  if(N.assetWon>0){
    var ah=N.assetWon*sc;
    out+='<rect x="'+x1+'" y="'+(y-ah).toFixed(1)+'" width="'+bw+'" height="'+Math.max(1,ah).toFixed(1)+'" '+
      'fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="4 3"/>'+
      '<text x="'+(x1-6)+'" y="'+(y-ah/2+4).toFixed(1)+'" text-anchor="end" font-size="10.5" '+
      'font-weight="800" fill="#059669">− 자산</text>';
  }
  var hh=N.have*sc;
  out+='<rect x="'+x2+'" y="'+(base-hh).toFixed(1)+'" width="'+bw+'" height="'+Math.max(1,hh).toFixed(1)+'" '+
    'rx="4" fill="var(--sv-ink,#191f28)" opacity=".85"/>';
  if(N.gap>0){
    var gy=base-N.need*sc;
    out+='<line x1="'+(x1-14)+'" y1="'+gy.toFixed(1)+'" x2="'+(x2+bw+14)+'" y2="'+gy.toFixed(1)+'" '+
      'stroke="#e5484d" stroke-width="1.6" stroke-dasharray="5 4"/>'+
      '<rect x="'+x2+'" y="'+gy.toFixed(1)+'" width="'+bw+'" height="'+Math.max(1,(N.gap*sc)).toFixed(1)+'" '+
      'rx="4" fill="#e5484d" opacity=".16"/>'+
      '<text x="'+(x2+bw/2)+'" y="'+(gy+Math.max(14,N.gap*sc/2)).toFixed(1)+'" text-anchor="middle" '+
      'font-size="11.5" font-weight="800" fill="#e5484d">모자람</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="필요보장액과 지금 사망보장">'+
    '<line x1="'+(L-14)+'" y1="'+base+'" x2="'+(W-R+14)+'" y2="'+base+'" stroke="var(--sv-line,#CBD2DD)" stroke-width="1.4"/>'+
    out+
    '<text x="'+(x1+bw/2)+'" y="'+(base+20)+'" text-anchor="middle" font-size="12.5" font-weight="800" fill="var(--sv-ink,#191f28)">필요한 돈</text>'+
    '<text x="'+(x2+bw/2)+'" y="'+(base+20)+'" text-anchor="middle" font-size="12.5" font-weight="800" fill="var(--sv-ink,#191f28)">지금 사망보장</text>'+
    '<text x="'+(x1+bw/2)+'" y="'+(base+36)+'" text-anchor="middle" font-size="11" fill="#6b7684">'+gEsc(N.needT)+'</text>'+
    '<text x="'+(x2+bw/2)+'" y="'+(base+36)+'" text-anchor="middle" font-size="11" fill="#6b7684">'+gEsc(N.haveT)+'</text>'+
    '</svg>';
}

cost:{

 read:'① 빨간 산을 손가락으로 따라 그리며 <b>「치료비는 이렇게 솟았다 내려옵니다」</b><br>② 주황 점선을 왼쪽에서 오른쪽으로 쭉 그으며 <b>「생활비는 안 내려옵니다」</b><br>③ 바닥 빗금을 짚으며 <b>「그리고 이 기간 버는 돈이 0 입니다」</b><br>④ 파란 점선을 짚으며 <b>「지금 나올 진단비는 여기까지입니다」</b><br><br>네 동작입니다. 순서를 지키십시오. 말보다 <b>손가락</b>이 설명합니다.',
 deep:'<b>총부담 = 치료비 + 생활비 + 못 버는 돈.</b> 이 중 실손이 보는 건 <b>치료비 일부</b>뿐입니다. 간병비와 소득 상실은 통째로 남습니다 — 그래서 빨간 산 아래가 아니라 <b>주황 선 아래</b>가 이 그림의 요점입니다.<br><br>· <b>숫자는 반드시 「근거에서 가져오기」로 넣으십시오.</b> 맨손으로 지어내면 고객이 「그건 선생님 생각이잖아요」로 받습니다. 단추를 누르면 화면에 출처가 같이 찍힙니다 — 그게 이 장의 방어막입니다.<br><br>· <b>쉬는 기간은 고객에게 물어서 넣으십시오.</b> 「암이면 6개월 쉽니다」는 거짓말입니다. 직업·회사 제도에 따라 완전히 다릅니다. <b>회사 병가·휴직 제도가 있는지, 그때 급여가 얼마나 나오는지</b>를 먼저 물으면 이 계산이 훨씬 현실적으로 꽂힙니다.<br><br>· 자영업자면 소득이 <b>0 이 아니라 마이너스</b>일 수 있습니다. 가게가 도는 동안 고정비는 계속 나가니까요. 이 경우 곡선보다 더 나쁩니다 — 그 말씀을 드리십시오.<br><br>· 맞벌이면 배우자 소득이 남습니다. 그럼 이 그림이 완화됩니다. <b>완화되는 건 완화된다고 말하십시오.</b> 과장하면 그 자리에서 신뢰를 잃습니다.',
 qa:[['그렇게까지 오래 쉬나요?','사람마다 다릅니다. 고객님 회사는 병가나 휴직 제도가 어떻게 되어 있나요? 그 숫자로 다시 그려 드리겠습니다.'],

pension:{
 say:['이번엔 아프지 않고 <b>오래 사실 때</b> 이야기입니다.',
      '은퇴하시면 소득이 멈추는데, 국민연금은 그날부터 바로 나오지 않습니다.',

 open:'여기까지는 「아플 때」 이야기였습니다. 이 장은 <b>안 아프고 오래 사실 때</b> 이야기입니다.',
 why:'보장만 이야기하고 끝내면 반쪽입니다. 그리고 이게 핵심인데 — <b>소득 공백을 못 메우면 결국 보험을 깹니다.</b> 그러니까 연금 이야기는 <b>지금 이 보장을 지키는</b> 이야기이기도 합니다. 이 연결을 말할 수 있으면 20년차입니다. 대부분의 설계사는 보장 상담과 연금 상담을 <b>따로</b> 합니다.',
 read:'① 앞 「인생 한 장」의 <b>소득 공백 띠</b>로 돌아가 「이 구간이 여기입니다」 하고 두 장을 잇습니다.<br>② 빨간 구간을 짚으며 <b>「이 몇 년은 어디서 나옵니까」</b> 하고 <b>묻고 멈춥니다.</b><br>③ 세 기둥으로 넘어가 <b>비어 있는 기둥</b>만 짚습니다.<br><br>⚠ 기둥 높이는 「준비가 됐다」가 아니라 <b>「우리가 안다」</b>입니다. 3층에 금액이 떠도 그건 <b>넣고 계신 돈</b>이지 나올 돈이 아닙니다 — 이 말을 안 하면 고객이 「나는 연금 100만원 나오는구나」로 듣습니다.',
 deep:'<b>① 소득 공백이 이 장의 숫자입니다.</b> 은퇴 나이와 국민연금 개시 나이를 넣으면 몇 년이 비는지, 그동안 얼마가 필요한지가 나옵니다. 개시 나이는 <b>출생연도별 법정 표</b>라 계산해도 안전합니다. 다만 <b>조기수령 감액·연기 가산의 율은 말하지 마십시오</b> — 「있다」까지만입니다.<br><br><b>② 예상 수령액을 절대 짐작하지 마십시오.</b> 공단에서 본인 인증으로 바로 나옵니다. 화면의 링크를 눌러 <b>그 자리에서 같이 확인</b>하면 상담의 격이 달라집니다. 짐작해서 말했다가 실제와 다르면 그 한 번으로 끝납니다.<br><br><b>③ 2층(퇴직연금)은 이 문서에 없습니다.</b> DB·DC·IRP 중 어느 쪽인지 <b>본인도 모르시는 분이 많습니다.</b> 여기서 물어보면 대부분 답을 못 하시는데, 그 자체가 다음 상담 약속이 됩니다. 「회사 인사팀에 한 번 확인해 보시고 다음에 그것까지 넣어서 다시 그려 드리겠습니다」 — 이게 오늘 이 장에서 가장 쓸모 있는 마무리입니다.<br><br><b>④ 은퇴 후 건강보험료</b>가 가장 자주 놓치는 자리입니다. 직장에서 지역으로 바뀌면 산정 방식이 달라지고, <b>소득이 없어져도 재산에 따라</b> 부과될 수 있습니다. 자녀 피부양자 등재도 요건이 있습니다. 숫자는 공단으로 넘기십시오.<br><br><b>⑤ 장수 리스크.</b> 모아 둔 돈을 쪼개 쓰는 방식은 다 쓰면 끝입니다. 연금의 값은 <b>수익률이 아니라 끊기지 않는다</b>는 데 있습니다. 그래서 <b>연금을 수익률로 비교하면 반드시 집니다</b> — 비교하는 자리로 끌려가지 마십시오.<br><br><b>⑥ 이미 넣고 계신 게 있으면 먼저 인정하십시오.</b> 앞에서 「보장이 비었다」고 했다고 여기서도 지적하면 사람이 닫힙니다. 화면에 뜬 연금성 계약을 짚으며 <b>「이건 이미 준비하고 계신 거네요」</b> 하고 칭찬할 자리입니다.<br><br><b>⑦ 비과세는 결론입니다.</b> 「비과세 상품입니다」라고 말하는 순간, 요건 하나가 어긋났을 때 고객 앞에서 무너집니다. <b>요건만</b> 보여 주고 판단은 세무 전문가에게 넘기십시오.',
 qa:[['국민연금 얼마 나와요?','제가 짐작으로 말씀드리면 안 됩니다. 지금 공단에서 같이 확인해 보실까요? (링크를 누른다 — 이 동작 자체가 신뢰입니다)'],
     ['퇴직연금이요? 그게 뭐죠','회사에서 쌓아 주는 겁니다. DB인지 DC인지에 따라 아주 다른데, 인사팀에 한 번만 확인해 주시면 다음에 그것까지 넣어서 다시 그려 드리겠습니다.'],

     ['비과세 되는 거죠?','요건을 충족하면 그렇습니다. 요건이 몇 가지 있어서 세무 쪽으로 정확히 확인해 드리는 게 맞습니다.'],

whole:{
 say:['이 돈만은 <b>고객님이 못 쓰시는 돈</b>입니다. 남는 분들이 쓰시는 돈이니까요.',

  var o={}, P=(A&&A.person)||{};
  if(P.name)o.f_name=P.name;
  if(P.age)o.f_age=String(P.age);
  if(P.sex)o.f_gender=P.sex;
  if(P.age&&typeof kdNpsAge==='function'){
    var born=(new Date()).getFullYear()-P.age, np=kdNpsAge(born);
    if(np)o.f_npage=String(np);
  }
  if(A&&A.g){
    /* 담보가 <b>한 건도 없으면</b> 0 이 맞습니다 — 문서를 다 읽었으니까요.
       담보는 있는데 <b>금액을 못 읽었으면</b> 비워 둡니다(모름 ≠ 0). */
    function cov(G,won){ if(!G||G.n===0)return '0'; return kdMan(won===undefined?G.won:won); }
    var DP=(typeof kdDeathFromPension==='function')?kdDeathFromPension(A):{won:0};
    var dAll=(A.g.death?A.g.death.won:0)||0;
    o.c_death =cov(A.g.death, Math.max(0,dAll-(DP.won||0)));
    o.c_cancer=cov(A.g.cancer_diag);
    o.c_brain =cov(A.g.brain);
    o.c_heart =cov(A.g.heart);
    o.c_care  =cov(A.g.care);
    o.c_silson=(A.silsonN>0)?'1':'0';
  }
  if(A&&typeof kdPremSplit==='function'){
    var SP=kdPremSplit(A);
    if(SP.pay)o.f_ins=kdMan(SP.pay);
  }
  /* 대출은 우리가 「끝나는 나이」로 받고 재무설계는 「남은 햇수」로 받습니다 */
  L=L||{};
  var end=parseInt(L.loanEnd||'',10), age=P.age;
  if(isFinite(end)&&age&&end>age)o.f_loanyr=String(end-age);
  var k;
  for(k in KD_LINK_ASK){ var v=L[KD_LINK_ASK[k]]; if(v!==undefined&&v!=='')o[k]=String(v); }

  /* 「대출 잔액」이 비어 있고 「집에 걸린 대출」만 적혀 있으면 그것을 옮겨 둡니다.
     빚이 <b>적어도 그만큼은</b> 있는 것이 사실이고, 비워 두면 계산기가 0 으로 셉니다.
     ⚠ 짐작이 아니라 <b>옮겨 적기</b>입니다 — 화면에 보이게 들어가니 더 있으면 올려 적으십시오. */
  F=F||{};
  if((F.f_debt===undefined||F.f_debt==='') && F.f_hdebt) o.f_debt=String(F.f_hdebt);
  return o;
}

/* ── 「12, 8」 → [{k-name,k-age}] ── */
function kdRows(csv,kind){
  var out=[], a=String(csv||'').split(/[,，]/), i, n=0;
  for(i=0;i<a.length;i++){
    var v=parseInt(String(a[i]).replace(/[^0-9]/g,''),10);
    if(!isFinite(v))continue;
    n++;
    if(kind==='k')out.push({'k-name':'자녀'+n,'k-age':String(v)});
    else out.push({'p-rel':(n===1?'본가':'처가'),'p-age':String(v)});
  }
  return out;
}

/* ── 내보내기 : 재무설계가 받는 모양 그대로 ── */
function kdLinkSnap(st){
  var A=st.A, L=st.L||{}, F=st.F||{};
  var auto=kdLinkAuto(A,L,F), f={}, i, r;
  for(i=0;i<KD_LINK.length;i++){
    r=KD_LINK[i];
    var v=(F[r.id]!==undefined&&F[r.id]!=='')?F[r.id]:auto[r.id];
    if(v===undefined||v===null)v='';
    f[r.id]=String(v);          /* 빈칸은 빈칸으로 — 0 으로 채우지 않습니다 */
  }
  return {v:2, f:f, kids:kdRows(L.kids,'k'), parents:kdRows(L.parents,'p'),
          from:'KB보장분석', at:(new Date()).toISOString().slice(0,10)};
}
/* ── 들여오기 : 재무설계에서 온 값을 우리 칸에 ── */
function kdLinkPut(o, st){
  if(!o||!o.f)return null;
  var f=o.f, L=st.L||{}, F=st.F||{}, k;
  for(k in f){ if(f[k]!==undefined&&f[k]!=='')F[k]=String(f[k]); }
  /* 우리 화면이 쓰는 칸으로도 되돌립니다 */
  for(k in KD_LINK_ASK){ if(f[k]!==undefined&&f[k]!=='')L[KD_LINK_ASK[k]]=String(f[k]); }
  if(o.kids&&o.kids.length)L.kids=o.kids.map(function(x){return x['k-age'];}).join(', ');
  if(o.parents&&o.parents.length)L.parents=o.parents.map(function(x){return x['p-age'];}).join(', ');
  if(f.f_loanyr&&st.A&&st.A.person&&st.A.person.age){
    var yr=parseInt(f.f_loanyr,10);
    if(isFinite(yr))L.loanEnd=String(st.A.person.age+yr);
  }
  return {L:L,F:F};
}

/* ── CRM 과 말 트기 ──────────────────────────────────────────────
   쓰는 쪽에서 아래 둘을 끼워 주면 됩니다.
     kdBridge({ snap:함수, put:함수, intro:함수 })      ← 한 번만
   ⚠ 부모 창이 없으면(그냥 파일로 열었을 때) 아무 일도 안 합니다.   */
/* ── CRM 안인가 밖인가 ────────────────────────────────────────────
   CRM 안에서는 <b>iframe 으로</b> 열립니다. 그때는 계산기를 새 창으로
   띄우는 대신, <b>CRM 에게 열어 달라고</b> 부탁하는 편이 낫습니다 —
   CRM 에는 이미 「재무설계 계산기」가 있고, 값을 밀어 넣는 길(FP_MAP)도
   깔려 있어서 <b>숫자를 두 번 치지 않아도</b> 됩니다.
   ⚠ 혼자 열었을 때(파일을 그냥 더블클릭)는 부모 창이 없습니다 —
     그때는 옛날처럼 새 창으로 엽니다. 둘 다 되어야 합니다.        */
function kdInCrm(){
  try{ return !!(window.parent && window.parent!==window); }catch(e){ return false; }
}

/* CRM 에게 「이 값으로 계산기를 열어 주십시오」 — 열렸으면 true */
function kdCalcHandoff(data){
  if(!kdInCrm()) return false;
  try{ window.parent.postMessage({t:'apex:calc', data:data}, '*'); return true; }
  catch(e){ return false; }
}
function kdBridge(h){
  function reply(src,org,msg){ try{src.postMessage(msg,org||'*');}catch(e){} }
  window.addEventListener('message',function(ev){
    var m=ev.data;
    if(!m||typeof m!=='object'||!m.t||(''+m.t).indexOf('apex:')!==0)return;
    if(m.t==='apex:snap'){
      reply(ev.source,ev.origin,{t:'apex:snap:ok',id:m.id,data:h.snap?h.snap():null});
    }else if(m.t==='apex:put'){
      var ok=true; try{ h.put&&h.put(m.data); }catch(e){ ok=false; }
      reply(ev.source,ev.origin,{t:'apex:put:ok',id:m.id,ok:ok});
    }else if(m.t==='apex:intro'){
      try{ h.intro&&h.intro(m.data||{}); }catch(e){}
    }else if(m.t==='apex:jump'){
      try{ h.jump&&h.jump(m.to); }catch(e){}
    }
  });
  try{ if(window.parent&&window.parent!==window)window.parent.postMessage({t:'apex:ready'},'*'); }catch(e){}
}

</script>
<script>
/* ── 노후자원.js ── */
/* ═══════════════════════════════════════════════════════════════════
   노후자원.js — <b>이미 가지고 계신 것</b>을 어림합니다.

     ① 퇴직금   — 4대보험 + 근속 햇수로
     ② 주택연금 — 집값 + 나이로

   왜 이 둘인가 : 노후 이야기를 하면 대개 「앞으로 얼마를 더 모을까」로
   갑니다. 그런데 <b>이미 가지고 계신 것</b>을 먼저 세어 드리면 이야기가
   달라집니다 — 「생각보다 있으시네요」에서 시작하는 상담이 됩니다.

   ⚠ 여기 나오는 값은 <b>어림</b>입니다. 약속이 아닙니다.
     각 함수가 돌려주는 note 를 <b>반드시 화면에 같이</b> 내십시오.
   ═══════════════════════════════════════════════════════════════════ */


/* ───────────────────────────────────────────────────────────────────
   ① 주택연금  (한국주택금융공사)

   아래 표는 <b>공사가 공시한 숫자를 그대로</b> 옮긴 것입니다.
     일반주택 · 종신지급방식 · 정액형 · 단위 <b>천원</b>
     기준일 2026-03-01 (이 날짜 이후 신규 신청자)
     출처 https://www.hf.go.kr/ko/sub03/sub03_01_01_02.do

   ⚠ <b>공사가 해마다 바꿉니다.</b> 바뀌면 이 표를 다시 받아 적어야 합니다 —
     KD_HF_AT 날짜가 오래됐으면 화면에도 그 날짜가 그대로 찍히니
     고객이 「언제 기준인지」 알 수 있습니다. 임의로 고치지 마십시오.
   ⚠ 뒤쪽 칸이 앞쪽과 같은 값인 것은 <b>오타가 아니라 한도</b>입니다
     (80세 9억 이후가 4,060 에서 멈추는 것처럼).
   ─────────────────────────────────────────────────────────────────── */
var KD_HF_AT='2026-03-01';
var KD_HF_SRC='한국주택금융공사 월지급금 예시(일반주택·종신지급·정액형)';
var KD_HF_AGE=[55,60,65,70,75,80];
var KD_HF=[ /*        1억   2억   3억   4억   5억   6억   7억   8억   9억  10억  11억  12억 */
 /* 55세 */ [ 156,  312,  468,  624,  780,  936, 1092, 1248, 1404, 1560, 1716, 1872],
 /* 60세 */ [ 210,  421,  632,  842, 1053, 1264, 1475, 1685, 1896, 2107, 2318, 2528],
 /* 65세 */ [ 252,  505,  758, 1011, 1264, 1517, 1770, 2023, 2276, 2529, 2782, 3035],
 /* 70세 */ [ 307,  615,  923, 1231, 1539, 1847, 2155, 2462, 2770, 3078, 3386, 3414],
 /* 75세 */ [ 381,  762, 1143, 1525, 1906, 2287, 2669, 3050, 3431, 3666, 3666, 3666],
 /* 80세 */ [ 483,  966, 1449, 1932, 2416, 2899, 3382, 3865, 4060, 4060, 4060, 4060]
];

/* 표에서 한 칸을 꺼냅니다. 표에 없는 나이·집값은 <b>사이를 이어서</b> 봅니다.
   (공사 표는 5살·1억 간격이라 그 사이는 공사도 따로 계산합니다 — 그래서 어림입니다) */
function kdHfMonthly(age, eok){
  if(eok<=0) return 0;
  if(eok>12) eok=12;                       /* 12억이 넘어도 12억까지만 반영됩니다 */
  if(age<55) return 0;
  if(age>80) age=80;

  /* 나이 — 표의 두 줄 사이를 이어서 */
  var i=0; while(i<KD_HF_AGE.length-1 && KD_HF_AGE[i+1]<=age) i++;
  var rowA=KD_HF[i], rowB=KD_HF[Math.min(i+1,KD_HF.length-1)];
  var aA=KD_HF_AGE[i], aB=KD_HF_AGE[Math.min(i+1,KD_HF_AGE.length-1)];
  var ta=(aB===aA)?0:(age-aA)/(aB-aA);

  /* 집값 — 1억 미만은 1억 칸을 비례로, 그 위는 두 칸 사이를 이어서 */
  function at(row,e){
    if(e<=1) return row[0]*e;
    var j=Math.floor(e)-1; if(j>=row.length-1) return row[row.length-1];
    return row[j]+(row[j+1]-row[j])*(e-Math.floor(e));
  }
  var won=(at(rowA,eok)*(1-ta)+at(rowB,eok)*ta)*1000;   /* 천원 → 원 */
  return Math.round(won/1000)*1000;
}

/* 집 한 채로 <b>다달이 얼마</b>가 나오는지.
   homeWon 집 시세(원) · age 나이 · hdebtWon 집에 걸린 대출(원) */
function kdHousePension(age, homeWon, hdebtWon){
  var o={ok:false, age:age, won:0, note:'', warn:''};
  if(!(homeWon>0)){ o.why='집 시세를 적어 주십시오.'; return o; }

  var eok=homeWon/100000000;
  o.eok=eok;

  /* 만 55세부터 받습니다 — 아직이면 <b>몇 살부터</b> 얼마인지를 보여 줍니다 */
  var useAge=(age>=55)?age:55;
  o.won=kdHfMonthly(useAge, eok);
  o.from=useAge;
  o.later=(age<55);
  o.ok=o.won>0;

  if(eok>12) o.note='집값이 12억을 넘어도 <b>12억까지만</b> 반영됩니다.';
  if(hdebtWon>0){
    /* short = 카드에 늘 보이는 <b>한 줄</b> · warn = 길게 풀어 쓴 것 */
    o.short='⚠ 집에 걸린 대출 '+Math.round(hdebtWon/10000).toLocaleString()+'만원을 '+
            '<b>먼저 갚아야</b> 합니다 — 그만큼 <b>다달이 받는 돈이 줄어듭니다.</b>';
    o.warn='집에 걸린 대출 '+Math.round(hdebtWon/10000).toLocaleString()+'만원은 '+
           '<b>가입할 때 먼저 갚아야 합니다.</b> 연금에서 목돈을 꺼내 갚는 길이 있지만, '+
           '꺼낸 만큼 <b>다달이 받는 돈이 줄어듭니다</b> — 줄어드는 폭은 공사가 계산합니다.';
  }
  return o;
}

/* 이 집이 주택연금이 되는 집인지 — <b>요건은 공사가 봅니다.</b> 여기서는 안내만 */
var KD_HF_NOTE=
  '만 <b>55세</b>부터(부부면 나이 적은 분 기준), <b>공시가격 12억원 이하</b> 주택이면 신청할 수 있습니다. '+
  '위 금액은 <b>시세</b>로 어림한 것이고, 가입 가능 여부는 <b>공시가격</b>으로 따집니다 — '+
  '공시가격은 보통 시세보다 낮습니다. 실제 금액과 가입 여부는 <b>한국주택금융공사 심사</b>로 정해집니다.';


/* ───────────────────────────────────────────────────────────────────
   ② 퇴직금  (근로자퇴직급여 보장법)

   법정 퇴직금 = <b>퇴직 전 3개월 평균임금</b>의 30일분 × 재직일수 ÷ 365

   우리는 3개월 평균임금을 모릅니다. 그래서 <b>월 소득 × 근속 햇수</b>로
   어림합니다. 평균임금에는 상여·연차수당이 들어가서 보통 월급보다
   <b>큽니다</b> — 그러니 여기 나오는 값은 <b>적게 잡은 쪽</b>입니다.

   ⚠ 두 가지를 반드시 같이 말해야 합니다
     · 4대보험에 들지 않은 일(사업소득 3.3%)은 <b>법정 퇴직금이 없습니다</b>
     · DC형 퇴직연금이면 이미 쌓인 적립금이 곧 그 돈입니다 — <b>두 번 세면 안 됩니다</b>
   ─────────────────────────────────────────────────────────────────── */
function kdSeverance(o){
  var r={ok:false, why:''};
  var ins=String(o.ins===undefined?'':o.ins);
  var yr=parseFloat(o.years), inc=parseFloat(o.income);   /* income 은 만원 */

  if(ins==='0'){
    r.why='4대보험에 들지 않는 일(사업소득 3.3%)은 <b>법정 퇴직금 대상이 아닙니다.</b> '+
          '그래서 그만두는 날 나오는 목돈이 없습니다 — 노후 자금을 <b>스스로</b> 만들어 두셔야 합니다.';
    r.none=true; return r;
  }
  if(ins!=='1'){ r.why='4대보험에 드셨는지 알려 주십시오.'; return r; }
  if(!(yr>0)){ r.why='근속 햇수를 적어 주십시오.'; return r; }
  if(yr<1){
    r.why='1년을 채우셔야 법정 퇴직금이 생깁니다. <b>'+
          (Math.round((1-yr)*12))+'개월</b> 남으셨습니다.';
    r.none=true; return r;
  }
  if(!(inc>0)){ r.why='월 소득을 적어 주십시오.'; return r; }

  r.ok=true;
  r.now=Math.round(inc*yr);                                  /* 만원 */
  var more=(o.retAge>0 && o.age>0)?Math.max(0,o.retAge-o.age):0;
  r.more=more;
  r.at=Math.round(inc*(yr+more));
  return r;
}

var KD_SEV_NOTE=
  '법으로 정한 퇴직금은 <b>퇴직 전 3개월 평균임금</b>으로 계산합니다. '+
  '여기서는 그 대신 <b>월 소득 × 근속 햇수</b>로 어림했습니다 — 평균임금에는 상여·연차수당이 들어가서 '+
  '보통 월급보다 커지므로, <b>실제로는 이보다 많은 편</b>입니다. '+
  '중간정산을 받으셨거나 DC형이면 달라집니다. 정확한 금액은 <b>회사·퇴직연금 사업자</b>에게 확인하십시오.';
var KD_SEV_DC=
  '⚠ 퇴직연금이 <b>DC형</b>이면 위 금액이 따로 더 생기는 것이 아니라, '+
  '「퇴직연금 적립」 칸에 이미 쌓여 있는 그 돈입니다 — <b>두 번 세지 않도록</b> 하십시오.';

</script>
<script>
/* ── 돈기준.js ── */
/* ═══════════════════════════════════════════════════════════════════
   돈기준.js — <b>왜 이 금액인가</b>와 <b>돈을 어떻게 나눌까</b>

   ⚠ 이 글은 <b>고객님 화면에 그대로</b>, 고객님 앞에서 뜹니다.
     설명하는 말투가 아니라 <b>마주 앉아 말씀드리는 말투</b>로 씁니다.

   ⚠ 여기 적힌 기준은 <b>설계사가 정한 기준</b>입니다. 규정이 아닙니다.
     화면에도 그렇게 적혀 있고, 그 문장을 빼면 금소법상 부적합한 단정이
     될 수 있습니다 — <b>빼지 마십시오.</b>

function kdRpEsc(s){
  return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function kdRpDate(d){
  d=d||new Date();
  return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일';
}

function kdReportHtml(st){
  var A=st.A, L=st.L||{}, N=st.N||{}, C=st.C||{}, ME=st.ME||{}, SIM=st.SIM||null;
  var P=A.person||{}, who=P.name||st.name||'고객님';
  var today=kdRpDate();
  var pages=[], no=0;

  var meName=(ME.name||'').trim();
  var meLine=[ME.org,ME.area,ME.tel].filter(function(x){return (x||'').trim();}).join(' · ');

  var toc=[];
  /* 쪽마다 <b>몇 번 장의 무엇</b>인지 머리에 답니다 — 받자마자 어디를 펴야 할지 압니다 */
  function page(cls,body,sec){
    no++;
    if(sec)toc.push({n:no,t:sec});
    var num=sec?('<b class="sec n">'+(toc.length<10?'0':'')+toc.length+'</b> '+kdRpEsc(sec)+' · '):'';
    var head='<div class="rp-hd">'+num+'<b>'+kdRpEsc(who)+'</b>님 보장분석 결과 보고서'+
      '<span class="r">'+today+'</span></div>';
    var foot='<div class="rp-ft"><span>이 보고서는 <b>KB 보장분석 문서에서 읽은 값</b>과 '+
      '<b>상담 중 넣은 값</b>으로 만들었습니다. 보장 여부와 지급액은 약관과 보험사 심사 결과에 따릅니다.</span>'+
      '<span class="no n">'+no+'</span></div>';
    pages.push('<section class="rp-pg '+(cls||'')+'">'+head+body+foot+'</section>');
  }

  /* ── ① 표지 ── */
  no++;
  pages.push('<section class="rp-pg rp-cv">'+
    '<div class="rp-cv-top">'+
      '<div class="rp-cv-em">A</div>'+
      '<div class="rp-cv-k">보장분석 결과 보고서</div>'+
      '<h1 class="rp-cv-t">지금 무엇이 있고<br>무엇이 비어 있는지</h1>'+
      '<div class="rp-cv-w">오늘 화면으로 보신 것을 그대로 옮겨 적었습니다.<br>'+
        '숫자는 <b>가지고 계신 증권에 적힌 그대로</b>이고, 없는 값은 비워 두었습니다.</div>'+
    '</div>'+
    '<div class="rp-cv-bd">'+
      '<div class="rp-cv-who">'+
        '<div class="rp-cv-f"><div class="l">받으시는 분</div><div class="v">'+kdRpEsc(who)+' 님</div></div>'+
        (P.age?('<div class="rp-cv-f"><div class="l">나이</div><div class="v n">'+P.age+'세'+

      '<div class="t">오늘 상담</div>'+

        '<i>담당 · '+kdRpEsc(meName||'')+(ME.tel?(' ('+kdRpEsc(ME.tel)+')'):'')+'</i></div>'+
    '</div>', '읽어 주십시오');

  /* 목차는 쪽을 다 만든 뒤에야 번호를 압니다 — 표지의 자리에 나중에 끼웁니다 */
  var tocHtml='<div class="rp-toc"><div class="tt">이 보고서에 담긴 것</div><ol>'+
    toc.map(function(t){return '<li><span>'+kdRpEsc(t.t)+'</span><b class="n">'+t.n+'</b></li>';}).join('')+
    '</ol></div>';
  pages[0]=pages[0].replace('<!--TOC-->',tocHtml);

}

function kdRpCss(){
  if(document.getElementById('kdRpCss'))return;
  var st=document.createElement('style');
  st.id='kdRpCss'; st.textContent=KD_RP_CSS;
  document.head.appendChild(st);
}
function kdReportOpen(state){
  kdRpCss();
  var host=document.getElementById('kdRpHost');

    host=document.createElement('div');
    host.id='kdRpHost';
    document.body.appendChild(host);

    '<div><div class="t">📄 보고서 미리보기</div>'+
      '<div class="s">보이는 이 모양 그대로 인쇄됩니다 · 대본과 지급 사례 사진은 들어가지 않습니다</div></div>'+
    '<div class="sp">'+
      '<button class="btn btn-pri" onclick="window.print()">인쇄 · PDF 저장</button>'+
      '<button class="btn" onclick="kdReportClose()">닫기</button>'+
    '</div></div>';
  host.innerHTML=bar+kdReportHtml(state);
  document.body.classList.add('rpt');
  window.scrollTo(0,0);
}
function kdReportClose(){
  var host=document.getElementById('kdRpHost');
  if(host)host.innerHTML='';
  document.body.classList.remove('rpt');
}

/* ── 자리에 따라 <b>이 두 줄만</b> 다릅니다 ────────────────────────
   내 컴퓨터 : KB상담자료_가로\index.html + 사례\ + ..\통합상담_APEX.html
   CRM 안    : app\상담자료\ 에 <b>사진 18장과 계산기가 이미 있습니다</b> —
              같은 폴더에 놓으니 폴더 이름이 없어지고 ../ 도 빠집니다.
   ⚠ 여기를 손으로 고치지 마십시오. CRM 판은 <b>만들기_CRM.js</b> 가 만듭니다 —
     손으로 고치면 다음에 만들 때 되돌아갑니다.                        */
var KD_CASE_DIR = "";
var KD_CALC_URL = "통합상담_APEX.html";


var W={K:null,A:null,name:'',slides:[],i:0,cost:null,life:null,need:null,sim:null,me:null,review:null,facts:null,
       theme:'dark'};

function esc(s){return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function $(id){return document.getElementById(id);}

/* 세로판 화면코드가 기대하는 이름들 — 같은 저장소를 씁니다 */
var V=W; function kdEsc(s){return esc(s);}
function kdSave(){
  try{localStorage.setItem('kdCost',JSON.stringify(W.cost||{}));
      localStorage.setItem('kdLife',JSON.stringify(W.life||{}));
      localStorage.setItem('kdNeed',JSON.stringify(W.need||{}));
      localStorage.setItem('kdMe',JSON.stringify(W.me||{}));
      localStorage.setItem('kdReview',JSON.stringify(W.review||[]));}catch(e){}
}
function kdLoad(){
  try{W.theme=localStorage.getItem('kdTheme')||'dark';}catch(e){W.theme='dark';}
  themeApply();
  try{
    var c=localStorage.getItem('kdCost'); if(c)W.cost=JSON.parse(c);
    var l=localStorage.getItem('kdLife'); if(l)W.life=JSON.parse(l);
    var n=localStorage.getItem('kdNeed'); if(n)W.need=JSON.parse(n);
    var me=localStorage.getItem('kdMe'); if(me)W.me=JSON.parse(me);
    var rv=localStorage.getItem('kdReview'); if(rv){var p=JSON.parse(rv); if(p&&p.length)W.review=p;}
  }catch(e){}
  if(!W.cost)W.cost={dz:'',careWon:'',offM:'',liveWon:''};
  if(!W.life)W.life={retire:'',kids:'',parents:'',loanEnd:'',retNeed:''};
  if(!W.need)W.need={liveM:'',liveY:'',eduMan:'',debtMan:'',assetMan:''};

  if(!W.review)W.review=JSON.parse(JSON.stringify(KD_REVIEW_DEFAULT));
}

function bootBox(h){var b=$('bootBox');if(b)b.innerHTML=h;}
function readFile(f){
  if(!f)return;
  if(f.size>PDF_MAX_MB*1024*1024){bootBox('<div class="note n-bad">'+PDF_MAX_MB+'MB 이하만 읽습니다.</div>');return;}
  bootBox('<div class="note n-flat">'+esc(f.name)+' 을(를) 읽는 중입니다…</div>');
  extractPdfText(f).then(function(txt){
    if(!txt||txt.replace(/\s/g,'').length<200){
      bootBox('<div class="note n-warn">글자가 거의 안 뽑혔습니다 — <b>그림으로 된 PDF</b> 입니다. '+
        'KB 홈페이지에서 <b>내려받은 원본</b>이어야 읽힙니다.</div>');return;}
    if(!kbLooks(txt)){
      bootBox('<div class="note n-bad">이 파일은 <b>KB 보장분석표가 아닙니다.</b> '+
        '남의 서식을 억지로 읽으면 담보와 금액이 어긋납니다 — <b>읽지 않고 멈췄습니다.</b></div>');return;}
    var K; try{K=kbParse(txt);}catch(e){
      bootBox('<div class="note n-bad">읽다가 멈췄습니다 — '+esc((e&&e.message)||'')+'</div>');return;}
    if(!K.ok){bootBox('<div class="note n-warn">KB 서식은 맞는데 <b>'+esc(K.why||'')+'</b> — 아무것도 넣지 않았습니다.</div>');return;}
    start(K,f.name);
  },function(e){bootBox('<div class="note n-bad">PDF 를 열지 못했습니다 — '+esc(pdfWhy(e))+'</div>');});

}

function go(i){
  if(!W.slides.length)return;
  W.i=Math.max(0,Math.min(W.slides.length-1,i));
  var s=W.slides[W.i];
  $('stage').innerHTML='<div class="sl on '+(slClass(s)||'')+'">'+slide(s)+'</div>';
  $('pg').textContent=(W.i+1)+' / '+W.slides.length;
  $('barName').textContent=esc(W.name)+' · '+esc(s.t);
  $('dots').innerHTML=W.slides.map(function(x,n){
    return '<i class="'+(n===W.i?'on':'')+'" title="'+esc(x.t)+'" onclick="go('+n+')"></i>';}).join('');
  $('sc').innerHTML=sayHtml(s);
  /* 소개카드는 화면 <b>전체</b>가 한 장면입니다 — 아래 막대까지 어둡게 */
  document.body.classList.toggle('cine', s.k==='me'||s.k==='end');

}

var KD_TONE={
  cover:'', why:'bad', evi:'ok', road:'', sheet:'', money:'deep', renew:'bad',
  need:'', story:'warn', news:'bad', cost:'bad', expire:'warn', pension:'ok',
  elder:'warn', whole:'deep', nation:'ok', order:'', care:'ok', compare:'',
  promise:'deep', review:'deep', close:'deep', money2:'ok'
};
function slTone(s){
  /* 시뮬을 켜면 그 장 전체가 <b>사건의 색</b>이 됩니다 */
  if(s.k==='road'&&W.sim&&typeof KD_SIM_MAP!=='undefined'&&KD_SIM_MAP[W.sim.ev]){
    var t=KD_SIM_MAP[W.sim.ev].tone;
    return ' tone-'+(t==='worst'?'bad':(t==='bad'?'bad':'warn'));
  }
  var t2=KD_TONE[s.k]; return t2?(' tone-'+t2):'';
}
function slClass(s){
  if(s.k==='evi')return ('wide tall'+slTone(s)).replace(/^ /,'');
  if(s.k==='road')return ('life'+slTone(s)).replace(/^ /,'');
  if(s.k==='sheet')return ('cov'+slTone(s)).replace(/^ /,'');
  if(s.k==='money')return ('pay'+slTone(s)).replace(/^ /,'');
  if(s.k==='facts')return ('fx'+slTone(s)).replace(/^ /,'');
  if(s.k==='me')return ('intro'+slTone(s)).replace(/^ /,'');
  if(s.k==='end')return ('intro'+slTone(s)).replace(/^ /,'');        /* 엔딩도 같은 시네마틱 옷 */
  if(s.k==='money2')return ('cls'+slTone(s)).replace(/^ /,'');
  if(s.k==='calc')return ('cls'+slTone(s)).replace(/^ /,'');
  if(s.k==='promise'||s.k==='review')return ('hd2v'+slTone(s)).replace(/^ /,'');
  if(s.k==='elder')return ('eld'+slTone(s)).replace(/^ /,'');
  if(s.k==='pension'||s.k==='whole')return ('pw'+slTone(s)).replace(/^ /,'');
  if(s.k==='cost')return ('wide tall'+slTone(s)).replace(/^ /,'');
  if(s.k==='expire'||s.k==='compare')return ('wide'+slTone(s)).replace(/^ /,'');
  if(s.k==='order'||s.k==='care')return ('hd3'+slTone(s)).replace(/^ /,'');
  if(s.k==='concept'||s.k==='keep80'||s.k==='oldcure'||s.k==='std'||s.k==='msplit')return ('flow'+slTone(s)).replace(/^ /,'');
  if(s.k==='news')return ('hd2'+slTone(s)).replace(/^ /,'');
  return (''+slTone(s)).replace(/^ /,'');
}
function slide(s){
  switch(s.k){
    case 'me':return sMe();

    case 'cover':return sCover();

function moneyCards(M,R){
  var k=[];
  if(M.nowM&&M.oldM)k.push({t:'생활비 — 지금 → 노후',v:kdNum(M.nowM)+'만 → '+kdNum(M.oldM)+'만',
    s:(M.dropM>0?('매달 '+kdNum(M.dropM)+'만원을 줄이셔야 합니다'):'노후에 더 쓰시는 계획입니다'),c:''});
  if(M.gapY)k.push({t:'소득 공백 '+M.gapY+'년',v:(M.gapWon?kdWonR(M.gapWon):'—'),
    s:M.retire+'세 은퇴 → 국민연금 '+M.nps+'세',c:'hot'});
  if(M.shortM!==null)k.push({t:'국민연금 받아도 매달',
    v:(M.shortM>0?('−'+kdNum(M.shortM)+'만'):('+'+kdNum(-M.shortM)+'만')),
    s:(M.shortM>0?('노후 '+kdNum(M.oldM)+'만 − 연금 '+kdNum(M.npsM)+'만'+
        (M.shortWon?(' · '+M.nps+'~'+M.shortTo+'세면 '+kdWonR(M.shortWon)):'')):'연금이 노후 생활비를 덮습니다'),
    c:(M.shortM>0?'hot':'good')});
  if(M.careM)k.push({t:'부모 간병'+(M.careY?(' '+kdNum(M.careY)+'년'):''),
    v:(M.careWon?kdWonR(M.careWon):('월 '+kdNum(M.careM)+'만')),
    s:(M.careWon?('월 '+kdNum(M.careM)+'만 × '+(M.careY*12)+'개월'):'기간(년)을 넣으시면 총액이 나옵니다'),c:'hot'});

  var money = k.length
    ? ('<div class="kpi" style="grid-template-columns:repeat('+k.length+',1fr)">'+k.map(function(x){
        return '<div class="kpi-c'+(x.c?' '+x.c:'')+'"><div class="kpi-t">'+esc(x.t)+'</div>'+
          '<div class="kpi-v num" style="font-size:clamp(17px,2.9vh,30px)">'+esc(x.v)+'</div>'+
          '<div class="kpi-s">'+esc(x.s)+'</div></div>';}).join('')+'</div>')
    : '<div class="note n-warn" style="margin:0">아래 칸에 <b>생활비·국민연금·간병비</b>를 넣으시면 여기에 '+
      '<b>금액</b>이 섭니다. KB 보장분석에는 이 값들이 <b>하나도 안 적혀 있어</b> 앱이 만들 수 없습니다.</div>';

  var wry = R.worries.length
    ? ('<div class="wry" style="grid-template-columns:repeat('+Math.min(4,R.worries.length)+',1fr)">'+
       R.worries.slice(0,4).map(function(w){
         return '<div class="wry-c one"><div class="wry-t">'+esc(w.t)+'</div>'+
                '<div class="wry-w">'+esc(w.why)+'</div></div>';}).join('')+'</div>')
    : (R.needs?'<div class="note n-warn" style="margin:0">은퇴·자녀·부모를 넣으시면 그 자리부터 그립니다. <b>평균으로 채우지 않습니다.</b></div>'
              :'<div class="note n-ok" style="margin:0">지금 넣으신 것으로는 <b>겹치는 자리가 없습니다.</b></div>');
  return money+wry;
}

/* 시뮬 모드의 도미노 네 칸 — ① 나가는 돈 ② 나오는 돈 ③ 모자란 돈 ④ 그 뒤 */
function simCards(S){
  var E=S.E;
  var c1 = E.forever
    ? {t:'① 그때부터',v:'소득 0',s:'버는 돈이 그 자리에서 멈춥니다',c:'hot'}
    : {t:'① 그때 당장 나가는 돈',v:kdWonR(S.outWon),
       s:(S.costWon?('치료·간병 '+kdWonR(S.costWon)):'')+
         (S.lostWon?(' + 그동안 생활비 '+kdWonR(S.lostWon)):'')+
         (!S.liveM&&!E.keepIncome?' · 생활비를 넣으시면 같이 셉니다':''),c:'hot'};
  var shown = E.forever ? S.rawWon : S.inWon;
  var c2 = {t:(E.forever?'② 보험에 적힌 사망보장':'② 지금 보험에서 나오는 돈'),
    v:(shown?kdWonR(shown):'없음'),
    /* 실직·소득감소는 <b>보험이 메우는 자리가 아닙니다.</b> 여기서 「담보가 없습니다」라고
       말하면 없는 상품을 파는 소리가 됩니다 — 자리를 바로 말합니다. */
    s:(S.parts.length?S.parts.map(function(p){return esc(p.t)+' '+kdWonR(p.won);}).join(' · ')
       :((E.pay&&E.pay.length)?'해당 담보가 <b>한 건도 없습니다</b>'
                              :'이건 <b>보험이 메우는 자리가 아닙니다</b> — 고용보험·저축이 봅니다')),
    c:(shown?'':'hot')};
  var c3 = E.forever
    ? {t:'③ 남는 가족이 실제로 쓸 돈',v:(S.inWon?kdWonR(S.inWon):'없음'),
       s:(S.penDeath
          ? ('적힌 '+kdWonR(S.rawWon)+' 중 <b>'+kdWonR(S.penDeath)+'은 연금·저축에 붙은 것</b>이라 뺐습니다 — '+
             '쌓인 돈일 수 있어 <b>계약 내용으로 확인</b>해야 합니다')
          : '질병·일반 사망보장만 셌습니다'),
       c:(S.inWon?(S.penDeath?'hot':''):'hot')}
    : {t:'③ 모자란 돈',v:(S.gapWon>0?kdWonR(S.gapWon):'없음'),
       s:(S.gapWon>0?((E.pay&&E.pay.length)?'①에서 ②를 뺀 금액입니다'
                    :'보험이 아니라 <b>모아 둔 돈</b>으로 메우는 자리입니다')
                   :'지금 보장으로 덮입니다'),
       c:(S.gapWon>0?'hot':'good')};
  var c4 = {t:'④ 그 뒤',v:((S.recover||E.keepIncome)&&!E.forever)?'돌아옵니다':'안 돌아옵니다',
    s:E.after, c:(((S.recover||E.keepIncome)&&!E.forever)?'':'hot')};

  var cards='<div class="kpi" style="grid-template-columns:repeat(4,1fr)">'+
    [c1,c2,c3,c4].map(function(x){
      return '<div class="kpi-c'+(x.c?' '+x.c:'')+'"><div class="kpi-t">'+esc(x.t)+'</div>'+
        '<div class="kpi-v num" style="font-size:clamp(16px,2.7vh,28px)">'+esc(x.v)+'</div>'+
        '<div class="kpi-s">'+x.s+'</div></div>';}).join('')+'</div>';

  var hit = S.hits.length
    ? ('<div class="wry" style="grid-template-columns:1fr"><div class="wry-c one">'+
       '<div class="wry-t">그 나이엔 이미 <b>'+S.hits.map(esc).join(' · ')+'</b> 이 겹쳐 있습니다</div>'+
       '<div class="wry-w">겹침</div></div></div>')
    : '<div class="note n-flat" style="margin:0">그 나이에 로드맵에서 겹치는 일은 없습니다.</div>';
  return cards+hit;
}

function simOn(k){
  var E=KD_SIM_MAP[k]; if(!E)return;
  var me=(W.A.person&&W.A.person.age)||40;
  W.sim={ev:k, age:String(me), off:String(E.offM), cost:String(E.costM), recover:E.recover};
  go(W.i);
}
function simOff(){ W.sim=null; go(W.i); }
function simSet(){
  if(!W.sim)return;
  var g=function(id){var e=$(id);return e?e.value.replace(/[^0-9.]/g,''):'';};
  W.sim.age=g('smAge')||W.sim.age;
  if($('smOff'))W.sim.off=g('smOff');
  if($('smCost'))W.sim.cost=g('smCost');
  if($('smRec'))W.sim.recover=($('smRec').value==='1');
  go(W.i);
}

/* 칸 하나 — 라벨 한 줄 고정 + 단위를 칸 안에 붙여 <b>줄이 안 어긋나게</b> */
function fi(id,lab,val,ph,unit){
  return '<div class="lf-f"><label class="lbl">'+esc(lab)+'</label>'+
    '<div class="lf-i"><input class="inp num" id="'+id+'" value="'+esc(val||'')+'" placeholder="'+esc(ph)+'">'+
    (unit?('<span class="lf-u">'+esc(unit)+'</span>'):'')+'</div></div>';
}
function roadSet(){
  var g=function(id,num){var e=$(id);if(!e)return '';return num?e.value.replace(/[^0-9.]/g,''):e.value;};
  W.life=W.life||{};
  W.life.retire=g('rdRet',1); W.life.kids=g('rdKids'); W.life.parents=g('rdPar');
  W.life.loanEnd=g('rdLoan',1);
  W.life.liveNow=g('lfNow',1); W.life.liveOld=g('lfOld',1);
  W.life.npsAmt=g('lfNps',1);  W.life.careCost=g('lfCare',1); W.life.careYears=g('lfCareY',1);
  /* 연금 장과 <b>같은 값</b>을 씁니다 — 두 번 묻지 않습니다 */
  if(W.life.liveOld)W.life.retNeed=W.life.liveOld;
  kdSave(); go(W.i);
}

/* ── 5. 내 보장 한눈에 ─────────────────────────────────────────
   <b>한눈에</b>가 목적입니다. 줄로 늘어놓으면 읽어야 하고, 읽게 하면
   진 겁니다. 아홉 칸을 <b>격자에 놓고 색으로</b> 갈라서, 맨 위 한 줄이
   먼저 결론을 말하게 했습니다 — 「아홉 칸 중 여섯 칸이 비었습니다」.

   ⚠ 「없음」이 제일 중요한 정보인데 예전에는 <b>회색</b>이라 안 보였습니다.
   제일 눈에 띄어야 합니다.                                          */
function sSheet(){
  var A=W.A,p=A.person;
  var keys=['cancer_diag','cancer_main','cancer_nonpay','brain','heart','circ','surgery','nsurg','care'];
  var cnt={none:0,low:0,ok:0};
  var cells=keys.map(function(k){
    var G=A.g[k], line=kdLineOf(A,k), st=kdGState(G,line);
    /* ⚠ 게이지는 100%에서 멈추지만 <b>숫자는 실제값</b>을 적습니다.
       2,000만이 권장 1,500만이면 133% 입니다 — 100%로 깎아 적으면
       「딱 맞췄다」로 읽혀, 넉넉한 자리를 칭찬할 기회를 잃습니다. */
    var real = line ? Math.round(G.won/line*100) : (G.won>0?100:0);
    var pct  = Math.max(0,Math.min(100,real));
    var tone, cls;
    if(st.s==='none'){tone='bad';cls='c-none';cnt.none++;}
    else if(st.s==='daily'||st.s==='low'){tone='warn';cls='c-low';cnt.low++;}
    else {tone='ok';cls='c-ok';cnt.ok++;}
    var big = (st.s==='none') ? '없음' : (st.s==='daily' ? '하루치만' : kdWonR(G.won));
    return '<div class="cv '+cls+'">'+
      '<div class="cv-h">'+(G.ic||'')+' '+esc(G.t)+'</div>'+
      '<div class="cv-v num">'+esc(big)+'</div>'+
      '<div class="cv-g"><i style="width:'+pct+'%;background:'+gC(tone)+'"></i></div>'+
      '<div class="cv-s">'+(line?('권장 '+kdWonR(line)):'권장 기준 없음')+
        ' · '+(G.n?('담보 '+G.n+'개'):'담보 없음')+
        (line&&real>0?(' · <b>'+real+'%</b>'):'')+'</div>'+
      /* ⚠ 여기에 비유 한 줄을 넣었더니 <b>담보 이름이 잘렸습니다.</b>
         비유는 아래 「비어 있으면 이런 일이 생깁니다」가 통째로 받습니다. */
    '</div>';
  }).join('');

  /* 비어 있는 칸마다 <b>무슨 일이 생기는지</b>를 한 줄씩. 0원은 느낌이 없습니다. */
  var lossRows=KD_GROUPS.map(function(G0){ return G0.key; })
    .filter(function(k){ var G=A.g[k]; if(!G)return false;
      return kdGState(G,kdLineOf(A,k)).s==='none' && typeof KD_GAP!=='undefined' && KD_GAP[k]; })
    .map(function(k){ var G=A.g[k], P=KD_GAP[k];
      return '<div class="loss"><div class="loss-h">'+(G.ic||'')+' '+esc(G.t)+
        '<span>'+P.what+'</span></div><div class="loss-p">'+
        '<em>'+esc(P.m)+'</em> '+P.say+'</div></div>'; });
  var loss = lossRows.length
    ? ('<div class="loss-wrap"><div class="loss-t">비어 있으면 <b>이런 일이 생깁니다</b></div>'+
        lossRows.slice(0,3).join('')+
        (lossRows.length>3?('<div class="loss-more">그 밖에 <b>'+(lossRows.length-3)+'칸</b>이 더 비어 있습니다 — 보고서에 다 적어 두었습니다.</div>'):'')+
      '</div>')
    : '';

  var head='<div class="cv-sum">'+
    '<span class="s-none">비었음 <b>'+cnt.none+'</b></span>'+
    '<span class="s-low">모자람 <b>'+cnt.low+'</b></span>'+
    '<span class="s-ok">찼음 <b>'+cnt.ok+'</b></span>'+
    '<em>아홉 칸 중 <b>'+(cnt.none+cnt.low)+'칸</b>을 오늘 같이 보겠습니다</em></div>';

  /* 권장금액을 안 잡은 것들 — 칩 한 줄 */
  var etc=['death','death_acc','disab','hosp'].map(function(k){
    var G=A.g[k]; if(!G)return '';
    var st=kdGState(G,null);
    return '<span'+(st.s==='none'?' class="z"':'')+'>'+(G.ic?G.ic+' ':'')+esc(G.t)+
      ' <b>'+esc(st.label)+'</b></span>';
  }).join('');

  return '<div class="in">'+
   '<div class="lf-hd">'+
     '<div><div class="kick">Chapter 2 · 내 보장</div>'+
       '<h2 class="t2" style="margin:0">'+(p.name?esc(p.name)+'님이 ':'')+'지금 들고 계신 것</h2></div>'+
     '<div class="lf-sub">칸 색이 <b>지금 상태</b>입니다 — 빨강은 없는 것, 주황은 모자란 것, 초록은 찬 것. '+
       '게이지는 금액이 아니라 <b>권장금액까지 얼마나 찼는지</b>입니다'+
       (p.age?(' (<b>'+p.age+'세</b> 기준)'):'')+'.</div>'+
   '</div>'+
   head+
   '<div class="cvg">'+cells+'</div>'+
   loss+
   '<div class="cv-etc">'+
     '<div class="note '+(A.silsonN?'n-flat':'n-bad')+'" style="margin:0">'+
       (A.silsonN?('🏥 실손 <b>'+A.silsonN+'건</b> — 여러 개 들고 계셔도 <b>합쳐서 나오지 않습니다</b>')
                 :'🏥 <b>실손이 한 건도 없습니다</b>')+'</div>'+
     '<div class="chips">'+etc+'</div>'+
   '</div>'+
   '<div class="foot" style="margin:0">'+KD_REC_NOTE+' '+
     (A.lapsed.length?('실효·해지 <b>'+A.lapsed.length+'건</b>은 빼고 셌습니다. '):'')+
     (A.noAmt?('금액을 못 읽은 담보 <b>'+A.noAmt+'개</b>는 <b>0 으로 세지 않았습니다.</b> '):'')+
     '계약·담보·금액은 <b>KB 보장분석 PDF 에 적힌 글자 그대로</b>이고, 보장 여부와 지급액은 '+
     '<b>약관과 보험사 심사 결과</b>에 따릅니다.</div>'+
   '</div>';
}

/* ── 6. 지금 내시는 돈 ─────────────────────────────────────────
   합계가 아니라 <b>어디로 가는지</b>가 이 장의 내용입니다.
   보장과 저축을 <b>색으로</b> 갈라 놓으면 한 줄로 끝납니다.        */
function sMoney(){
  var A=W.A, S=kdPremSplit(A);
  var max=0,i;
  for(i=0;i<S.rows.length;i++)if(S.rows[i].won>max)max=S.rows[i].won;

  /* 한 줄 스택바 — 이 장의 그림 */
  var stack='';
  if(S.pay>0){
    stack='<div class="pay-bar">'+
      (S.guard>0?('<div class="pb g" style="flex:'+S.guard+'"><b>보장</b>'+
        '<span>'+kdPrem(S.guard)+' · '+S.guardPct+'%</span></div>'):'')+
      (S.save>0?('<div class="pb s" style="flex:'+S.save+'"><b>저축 · 연금</b>'+
        '<span>'+kdPrem(S.save)+' · '+S.savePct+'%</span></div>'):'')+
    '</div>';
  }

  var rows=S.rows.map(function(r){
    var tone = r.kind==='guard' ? 'pri' : (r.kind==='save' ? 'purple' : (r.kind==='paid' ? 'ok' : 'dim'));
    var lab  = r.kind==='paid' ? '납입완료' : (r.kind==='none' ? '금액 미제공' : kdPrem(r.won));
    var tag  = r.kind==='guard' ? '보장' : (r.kind==='save' ? '저축·연금' : (r.kind==='paid' ? '다 내셨음' : '확인 필요'));
    return {t:(r.c.co||'?'), sub:tag+' · '+(r.c.nm||''),
            v:r.won, pct:max?Math.round(r.won/max*100):0, tone:tone, label:lab};
  });

  /* 이 장의 한 문장 */
  var punch;
  if(S.save>0 && S.guard>0)
    punch='<div class="note '+(S.guardPct<50?'n-bad':'n-flat')+'" style="margin:0;font-size:var(--tx)">'+
      '매달 <b>'+kdPrem(S.pay)+'</b> 중 <b>보장에 가는 건 '+kdPrem(S.guard)+'</b>입니다'+
      (S.guardPct<50?(' — 나머지 <b>'+S.savePct+'%</b>는 저축·연금 쪽으로 갑니다.'):'.')+'</div>';
  else if(S.save>0&&!S.guard)
    punch='<div class="note n-bad" style="margin:0;font-size:var(--tx)">매달 내시는 돈이 '+
      '<b>전부 저축·연금</b>으로 보입니다 — <b>보장에 가는 돈이 없습니다.</b></div>';
  else
    punch='<div class="note n-flat" style="margin:0;font-size:var(--tx)">'+
      '매달 <b>'+kdPrem(S.pay)+'</b>이 나갑니다. 저축·연금으로 보이는 계약은 <b>없습니다.</b></div>';

  return '<div class="in">'+
   '<div class="lf-hd">'+
     '<div><div class="kick">Chapter 2 · 지금 내시는 돈</div>'+
       '<h2 class="t2" style="margin:0">매달 '+kdPrem(S.pay)+'이<br>어디로 가고 있는가</h2></div>'+
     '<div class="lf-sub">한 해로 치면 <b>'+kdPrem(S.pay*12)+'</b>입니다. '+
       '이 돈이 아깝다는 말씀이 아니라, <b>어디에 얼마가 가 있는지</b> 한 번도 안 보신 것뿐입니다.</div>'+
   '</div>'+

   '<div class="kpi" style="grid-template-columns:repeat(3,1fr)">'+
     '<div class="kpi-c'+(S.guardPct<50?' hot':'')+'"><div class="kpi-t">🛡️ 보장에 가는 돈</div>'+
       '<div class="kpi-v num" style="font-size:clamp(19px,3.2vh,34px)">'+kdPrem(S.guard)+'</div>'+
       '<div class="kpi-s">'+S.guardN+'건 · 전체의 '+S.guardPct+'%</div></div>'+
     '<div class="kpi-c"><div class="kpi-t">💰 저축·연금으로 보이는 것</div>'+
       '<div class="kpi-v num" style="font-size:clamp(19px,3.2vh,34px);color:var(--purple)">'+kdPrem(S.save)+'</div>'+
       '<div class="kpi-s">'+S.saveN+'건 · 전체의 '+S.savePct+'% · <b>이름으로 짐작한 것</b></div></div>'+
     '<div class="kpi-c good"><div class="kpi-t">✅ 다 내신 것 (안 나감)</div>'+
       '<div class="kpi-v num" style="font-size:clamp(19px,3.2vh,34px)">'+(S.paidUpN?S.paidUpN+'건':'없음')+'</div>'+
       '<div class="kpi-s">'+(S.paidUpN?('돈은 안 나가고 보장은 갑니다'):'납입완료된 계약이 없습니다')+'</div></div>'+
   '</div>'+

   stack+
   punch+
   payVsHome(S)+
   /* ⚠ 계약이 많으면 이 목록이 <b>조용히 잘립니다</b>(칸 안에서만 넘쳐서
      넘침 자에도 안 걸립니다). 다섯 건까지만 보이고 나머지는 세어 줍니다 —
      전부는 보고서에 있습니다. */
   '<div class="pay-list">'+gBars(rows.slice(0,5),max)+'</div>'+
   (rows.length>5?('<div class="pay-more">그 밖 <b>'+(rows.length-5)+'건</b>은 보고서에 다 적어 두었습니다.</div>'):'')+

   '<div class="foot" style="margin:0">보장과 저축을 가른 것은 <b>계약 이름</b>뿐입니다 — '+
     '연금·변액·저축·달러 같은 말이 들어간 계약을 저축 쪽으로 놓았습니다. '+

/* 매달 내는 돈을 <b>집값</b>에 견줍니다.
   ⚠ 아파트 시세를 밖에서 끌어오지 않습니다 — 출처가 필요하고 남의 집은
     와닿지도 않습니다. <b>고객님이 적어 주신 집값</b>에만 견주고,
     안 적으셨으면 <b>견주지 않습니다.</b> (모름 ≠ 0)
   ⚠ 「보험료가 아깝다」는 말이 아닙니다. 20년이면 이만한 돈이 되니
     <b>어디에 가 있는지 한 번은 보자</b>는 뜻으로만 씁니다. */
function payVsHome(S){
  if(!(S.pay>0)) return '';
  var yr=20, total=S.pay*12*yr;
  var F=W.facts||{};
  var home=parseFloat(String(F.f_home||'').replace(/,/g,''))*10000;
  var has=isFinite(home)&&home>0;
  var pct=has?Math.round(total/home*100):0;
  var mx=has?Math.max(total,home):total;
  function bar(t,sub,won,tone){
    return '<div class="pvh-r"><div class="pvh-t"><b>'+esc(t)+'</b><span>'+sub+'</span></div>'+
      '<div class="pvh-l"><i style="width:'+Math.round(won/mx*100)+'%;background:'+gC(tone)+'"></i></div>'+
      '<div class="pvh-v num" style="color:'+gC(tone)+'">'+kdWonR(won)+'</div></div>';
  }
  return '<div class="pvh">'+
    '<div class="pvh-h">이 돈을 <b>'+yr+'년</b> 더 내면 '+kdWonR(total)+'입니다</div>'+
    bar('20년치 보험료','매달 '+kdPrem(S.pay)+' × 12 × '+yr+'년', total, 'deep')+
    (has
      ? (bar('지금 사시는 집','고객정보에 적어 주신 시세',home,'ok')+
         '<div class="pvh-n">집값의 <b>'+pct+'%</b>가 보험으로 나갑니다. '+
           '아깝다는 말씀이 아니라, <b>집은 값을 아시면서</b> 이 돈은 어디에 가 있는지 '+
           '한 번도 안 보셨다는 뜻입니다.</div>')
      : '<div class="pvh-n">「🧾 고객정보」에 <b>집 시세</b>를 적어 주시면 '+
        '<b>고객님 집값</b>에 견주어 보여 드립니다. 남의 아파트 값은 넣지 않았습니다.</div>')+
  '</div>';
}

/* ── 영수증 띠 ────────────────────────────────────────────────
   ⚠ 걸린 게 없으면 <b>빈 문자열</b>을 돌려줍니다 — 자리 자체가 안 생깁니다.
   ⚠ 「보여 드려도 되는 근거(ok)」가 없으면 kdRcOf 가 안 내줍니다.       */
function rcStrip(key){
  if(typeof kdRcOf!=='function') return '';
  var r=kdRcOf(key); if(!r) return '';
  var src=(typeof KD_RC_DIR!=='undefined'?KD_RC_DIR:'')+r.f;
  var nums=(r.sum||[]).map(function(x){
    return '<div class="rcs-n"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>';
  }).join('');
  return '<div class="rcs" onclick="rcBig('+JSON.stringify(key).replace(/"/g,'&quot;')+')">'+
    '<img src="'+esc(src)+'" alt="진료비 계산서" loading="lazy" draggable="false" '+
      'oncontextmenu="return false" onerror="this.closest(\'.rcs\').style.display=\'none\'">'+
    '<div class="rcs-b">'+
      '<div class="rcs-t">🧾 실제 진료비 계산서 — <b>'+esc(r.t||'')+'</b>'+
        (r.when?('<span> · '+esc(r.when)+'</span>'):'')+'</div>'+
      (nums?('<div class="rcs-g">'+nums+'</div>'):'')+
      '<div class="rcs-m">눌러서 크게 보기</div>'+
    '</div></div>';
}
/* 확대창 — 지급증거 장이 쓰는 그 창을 같이 씁니다 */
function rcBig(key){
  var r=kdRcOf(key); if(!r) return;
  $('lbImg').src=(typeof KD_RC_DIR!=='undefined'?KD_RC_DIR:'')+r.f;

    ' — 사람·병원·시기에 따라 다릅니다';

function evidHtml(E){
  var qr=(typeof KD_QR!=='undefined')?KD_QR[E.id]:null, nums='';

    nums='<div style="display:flex;gap:clamp(8px,1.4vw,18px);flex-wrap:wrap;align-items:center;margin:.5em 0">'+
      E.stats.map(function(x,i){

          gDonut(x.pct,x.tone,i===0?104:76)+
          '<div><b style="font-size:var(--sm)">'+esc(x.t)+'</b>'+
          '<div style="font-size:var(--xs);color:var(--ink4);max-width:11em;line-height:1.5">'+esc(x.d)+'</div></div></div>';
      }).join('')+'</div>';
  }
  /* money — <b>한 번에 드는 돈</b>(총액). bars 는 「월 얼마」라 말이 다릅니다. */
  if(E.money&&E.money.length){
    var mm=0;E.money.forEach(function(b){if(b.hi>mm)mm=b.hi;});
    nums+=gBars(E.money.map(function(b){
      return {t:b.t,sub:b.sub,v:b.hi,pct:mm?b.hi/mm*100:0,tone:b.tone,
              label:(b.lo===b.hi?kdWonR(b.hi):(kdWonR(b.lo)+'~'+kdWonR(b.hi)))};}));
  }
  if(E.bars&&E.bars.length){

    nums=gBars(E.bars.map(function(b){
      return {t:b.t,sub:b.sub,v:b.hi,pct:b.hi/mx*100,tone:b.tone,
              label:'월 '+kdWonR(b.lo)+'~'+kdWonR(b.hi)};}))+
      (E.plan?('<div class="chips" style="margin-top:.4em">'+E.plan.map(function(p){
        return '<span><b>'+esc(p[0])+'</b> '+esc(p[1])+'</span>';}).join('')+'</div>'):'');
  }
  return '<div class="news">'+
    '<div class="news-h">'+esc(E.tag)+' · '+esc(E.src)+' '+esc(E.date)+'</div>'+
    '<div class="news-t">'+esc(E.title)+'</div>'+
    '<div style="font-size:var(--xs);color:var(--ink4);line-height:1.6">'+esc(E.base)+'</div>'+
    nums+
    (E.note?('<div class="note n-flat" style="font-size:var(--xs);margin:.45em 0 0">'+E.note+'</div>'):'')+
    (E.say?('<div class="news-p">'+E.say+'</div>'):'')+
    '<div style="display:flex;align-items:center;gap:.7em;margin-top:.5em;flex-wrap:wrap">'+
      (qr?('<img src="'+qr+'" alt="원문 QR" style="width:clamp(56px,8vh,84px);height:auto;'+
        'border:1px solid var(--ink7);border-radius:8px;background:#fff;padding:2px">'+
        '<div style="font-size:var(--xs);color:var(--ink4);line-height:1.5">고객님 폰으로 찍으시면<br><b>원문</b>이 열립니다</div>'):'')+
      '<a class="btn noprint" href="'+E.url+'" target="_blank" rel="noopener">원문 열기 →</a>'+
    '</div></div>';
}

      '병·사람·병원마다 달라 앱이 정할 수 없습니다 — <b>사장님이 넣으신 값</b>으로만 그립니다.</div></div></div>';

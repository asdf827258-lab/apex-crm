<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>사주 × MBTI 상담카드 — 고객 성향·궁합·상담전략</title>
<meta name="description" content="생년월일과 태어난 시간으로 사주를 뽑고, 48문항 성향검사와 합쳐 고객 성향·나와의 궁합·상담 전략까지 한 장으로."/>
<!--
  사주 × MBTI 상담카드 — 영업용 상담 준비 도구
  ─────────────────────────────────────────────────────────────
  · 생년월일 + 태어난 시간 → 사주 4기둥을 실제로 계산한다.
    절기는 태양황경으로 구하고(입춘·경칩…), 일주는 율리우스 적일로 뽑는다.
    검증: 2000-01-01 무오일 · 1949-10-01 갑자일 · 입춘 2024 = 2/4 17:21(공식 17:27)
  · 48문항 성향검사(MBTI형)와 합쳐 성향을 읽는다.
  · 내 카드(설계사)와 비교해 궁합과 "상담을 어떻게 할지"를 뽑는다.
  · 결제 없음. 전부 열려 있다.
  · 혼자 도는 파일이다 — 서버도, 인터넷에서 받아오는 그림·글꼴도 없다.
  · 스크롤은 전용 스크롤 칸(.pane)이 맡는다. 어디에 끼워 넣어도 스크롤된다.
-->
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:#2F2C40;background:#F6F3FF;
  background-image:radial-gradient(90% 60% at 8% 0%,#FFEAF4 0%,rgba(255,234,244,0) 55%),
                   radial-gradient(80% 55% at 95% 4%,#E3F0FF 0%,rgba(227,240,255,0) 58%);
  -webkit-text-size-adjust:100%;
}
/* ── 스크롤 칸 ────────────────────────────────────────────────
   화면을 머리 / 탭 / 스크롤 칸 세 층으로 나눈다. 스크롤은 가운데
   칸이 혼자 맡는다. iframe 안이든 앱 안이든 여기서 굴러간다.       */
.shell{height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:0;max-width:1240px;margin:0 auto;padding:0}
.pane{flex:1;min-height:0;overflow-y:scroll;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:auto;scrollbar-color:#8B7BF0 #E9E3FF;padding:16px 14px 30px;position:relative}
.pane::-webkit-scrollbar{width:14px}
.pane::-webkit-scrollbar-track{background:#E9E3FF;border-radius:99px;margin:8px 2px}
.pane::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#8B7BF0,#B78CF5);border-radius:99px;border:3px solid #E9E3FF;min-height:44px}
.pane::-webkit-scrollbar-thumb:hover{background:#7C6BE8}
/* 화면 높이를 못 받는 곳(임베드 등)에서는 문서 스크롤로 되돌린다 */
body.flow{overflow:auto;height:auto}
body.flow .shell{height:auto;min-height:100vh}
body.flow .pane{overflow:visible;flex:none;min-height:0}
.scrollhint{position:sticky;bottom:-14px;margin:0 -14px -18px;height:44px;pointer-events:none;
  background:linear-gradient(180deg,rgba(246,243,255,0),rgba(246,243,255,.95));display:flex;align-items:flex-end;justify-content:center;
  font-size:11px;font-weight:800;color:#9B93BE;padding-bottom:6px;transition:opacity .2s}
.scrollhint.off{opacity:0}
/* ── 머리 ─────────────────────────────────────────────────── */
.top{flex:none;display:flex;align-items:center;gap:11px;padding:12px 16px;background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid #EAE4FB}
.top .logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#8B7BF0,#FF9EC4);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.top .ti{flex:1;min-width:0}
.top .ti b{display:block;font-size:15px;font-weight:900;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ti span{display:block;font-size:11px;color:#8C86A8;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mecard{flex:none;display:flex;align-items:center;gap:7px;background:#F4F1FF;border:1px solid #E4DDFF;border-radius:999px;
  padding:6px 12px;font-size:11.5px;font-weight:800;color:#6F63C4;cursor:pointer;white-space:nowrap}
.tabs{flex:none;display:flex;gap:4px;padding:8px 12px;background:rgba(255,255,255,.7);border-bottom:1px solid #EFEAFC;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:800;color:#8C86A8;
  padding:9px 14px;border-radius:12px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#8B7BF0;color:#fff;box-shadow:0 5px 14px rgba(139,123,240,.32)}
.tabs button:disabled{opacity:.35;cursor:default}
/* ── 판 ───────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:1fr;gap:14px;max-width:100%}
@media(min-width:1000px){
  .grid.hd{grid-template-columns:340px 1fr;align-items:start}
  .grid.hd .sticky{position:sticky;top:0}
}
.card{background:#fff;border-radius:22px;padding:20px 18px;box-shadow:0 10px 26px rgba(112,96,190,.11),0 1px 3px rgba(112,96,190,.06)}
.card + .card{margin-top:13px}
h1{font-size:23px;font-weight:900;margin:0;letter-spacing:-.5px;line-height:1.35}
h2{font-size:16px;font-weight:900;margin:0;letter-spacing:-.3px;display:flex;align-items:center;gap:7px}
h2 .n{background:#8B7BF0;color:#fff;font-size:11px;font-weight:900;border-radius:8px;padding:3px 8px;flex:none}
p{margin:8px 0 0;font-size:13px;line-height:1.75;color:#615C78}
.sub{font-size:12px;color:#948FB0;line-height:1.7}
.hr{height:1px;background:#F0ECFA;margin:14px 0}
.btn{width:100%;border:none;border-radius:15px;padding:14px;font-size:15px;font-weight:900;font-family:inherit;cursor:pointer;
  background:linear-gradient(135deg,#8B7BF0,#B78CF5);color:#fff;box-shadow:0 7px 16px rgba(139,123,240,.33);transition:transform .12s}
.btn:active{transform:translateY(2px)}
.btn.sm{padding:11px;font-size:13.5px}
.btn.ghost{background:#F4F1FF;color:#6F63C4;box-shadow:none}
.btn.line{background:#fff;color:#6F63C4;border:2px solid #E4DDFF;box-shadow:none}
.btn.dark{background:linear-gradient(135deg,#3B3357,#5A4E86);box-shadow:0 7px 16px rgba(59,51,87,.28)}
.row{display:flex;gap:9px}.row>*{flex:1}
label{display:block;font-size:11.5px;font-weight:800;color:#8C86A8;margin:0 0 5px 3px}
.inp,select{width:100%;border:2px solid #EDE8FC;border-radius:13px;padding:12px 13px;font-size:14.5px;font-family:inherit;
  color:#2F2C40;background:#FCFBFF;outline:none;transition:border-color .15s}
.inp:focus,select:focus{border-color:#B9AEFF;background:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid #EDE8FC;background:#fff;color:#7A748F;border-radius:12px;padding:9px 14px;font-size:13px;
  font-weight:800;cursor:pointer;font-family:inherit}
.seg button.on{background:#8B7BF0;border-color:#8B7BF0;color:#fff}
.mbtigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:520px){.mbtigrid{grid-template-columns:repeat(4,1fr)}}
.mbtigrid button{border:2px solid #EDE8FC;background:#fff;color:#6B6584;border-radius:11px;padding:9px 2px;font-size:12.5px;
  font-weight:900;cursor:pointer;font-family:inherit}
.mbtigrid button.on{background:#8B7BF0;border-color:#8B7BF0;color:#fff}
/* 표 */
.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th{background:#F5F2FF;color:#6A6296;text-align:left;padding:10px 11px;font-size:11.5px;font-weight:900;white-space:nowrap}
.tb td{padding:10px 11px;border-top:1px solid #F2EFFA;line-height:1.65;color:#4F4A66;vertical-align:top}
.tb tbody tr:nth-child(even) td{background:#FDFCFF}
.tbwrap{border-radius:16px;overflow:hidden;border:1px solid #F0ECFA;margin-top:11px}
.tbwrap.scrollx{overflow-x:auto}
.tbwrap.scrollx .tb{min-width:560px}
@media(max-width:760px){
  .stack .tb{min-width:0}
  .stack thead{display:none}
  .stack tbody tr{display:block;padding:13px 14px;border-top:1px solid #F2EFFA}
  .stack tbody tr:first-child{border-top:none}
  .stack tbody tr:nth-child(even) td{background:transparent}
  .stack td{display:flex;gap:9px;align-items:flex-start;border:none;padding:4px 0;background:transparent}
  .stack td::before{content:attr(data-l);flex:none;width:58px;font-size:10.5px;font-weight:900;color:#A9A2C6;padding-top:2px}
  .stack td.head{display:block;font-size:14px;font-weight:900;color:#2F2C40;padding:0 0 7px}
  .stack td.head::before{content:none}
  .stack td.full{display:block}
  .stack td.full::before{display:block;width:auto;margin-bottom:3px}
  .stack td.plain{display:block}
  .stack td.plain::before{content:none}
}
.pill{display:inline-block;font-size:10.5px;font-weight:900;border-radius:999px;padding:3px 9px;white-space:nowrap}
.bar{display:flex;align-items:center;gap:7px;margin-top:5px}
.bar b{font-size:10px;color:#A9A2C6;width:10px;text-align:center}
.bar .t{flex:1;min-width:50px;height:7px;border-radius:999px;background:#F0ECFA;overflow:hidden}
.bar .t>i{display:block;height:100%;background:linear-gradient(90deg,#8B7BF0,#FF9EC4)}
/* 사주 판 */
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pil{border-radius:16px;padding:11px 6px;text-align:center;background:#FAF8FF;border:1px solid #EFEAFC}
.pil .lb{font-size:10.5px;font-weight:900;color:#9B93BE}
.pil .gz{font-size:26px;font-weight:900;line-height:1.15;margin-top:5px;letter-spacing:-1px}
.pil .kr{font-size:11.5px;font-weight:800;color:#6B6584;margin-top:3px}
.pil .oh{font-size:10px;font-weight:800;margin-top:5px;border-radius:999px;padding:2px 7px;display:inline-block}
.pil.day{background:linear-gradient(160deg,#F3EFFF,#FFF0F7);border-color:#DED3FF}
.ohbars{display:flex;gap:7px;margin-top:12px}
.ohbar{flex:1;text-align:center}
.ohbar .t{height:74px;border-radius:11px;background:#F4F1FB;display:flex;align-items:flex-end;overflow:hidden}
.ohbar .t>i{display:block;width:100%;border-radius:9px;transition:height .4s}
.ohbar .lb{font-size:11px;font-weight:900;margin-top:6px}
.ohbar .cn{font-size:10.5px;color:#948FB0;font-weight:800}
.score{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:30px;font-weight:900;line-height:1}
.ring .v span{font-size:10.5px;color:#948FB0;font-weight:800;margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed #F0ECFA}
.kv:last-child{border-bottom:none}
.kv b{color:#2F2C40;text-align:right}
.note{border-radius:14px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-top:11px}
.note.warn{background:#FFF6E9;color:#9A5B0C}
.note.bad{background:#FFF0F1;color:#BB3A54}
.note.ok{background:#EDF9F4;color:#1F7A61}
.note.info{background:#F1EEFF;color:#5E52A8}
.q{text-align:center;padding:24px 16px 20px}
.qno{display:inline-block;background:#FFF0F7;color:#FF7FB0;font-size:11.5px;font-weight:900;padding:5px 12px;border-radius:999px}
.qtext{font-size:19px;font-weight:800;line-height:1.55;margin:13px 4px 2px;letter-spacing:-.3px;min-height:56px;display:flex;align-items:center;justify-content:center}
.scale{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px}
.dot{border:3px solid #D6CCFF;background:#fff;border-radius:50%;cursor:pointer;padding:0;transition:transform .12s,background .12s}
.dot:active{transform:scale(.9)}
.dot.on{background:#8B7BF0;border-color:#8B7BF0}
.dot.no{border-color:#FFD3B0}.dot.no.on{background:#FFA46B;border-color:#FFA46B}
.slab{display:flex;justify-content:space-between;margin:10px 4px 0;font-size:11.5px;font-weight:800}
.slab .y{color:#8B7BF0}.slab .n{color:#FFA46B}
.track{position:relative;height:9px;border-radius:999px;background:#EEE9FB;margin-top:16px}
.track>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8B7BF0,#FF9EC4);transition:width .3s}
.runner{position:absolute;top:-24px;transform:translateX(-50%);transition:left .3s}
.masc{display:block;filter:drop-shadow(0 6px 10px rgba(112,96,190,.2))}
.chiplist{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{background:#F4F1FF;color:#6F63C4;font-size:11.5px;font-weight:800;border-radius:999px;padding:5px 11px}
.talk{border-left:4px solid #8B7BF0;background:#FAF8FF;border-radius:0 13px 13px 0;padding:11px 13px;margin-top:9px;font-size:13px;line-height:1.75}
.talk.bad{border-color:#FF8DA1;background:#FFF6F7}
.talk.good{border-color:#5BC8A8;background:#F2FBF8}
.foot{text-align:center;font-size:10.5px;color:#A9A2C6;line-height:1.8;margin-top:22px}
@media print{
  html,body{height:auto;overflow:visible}
  .top,.tabs,.scrollhint,.btn{display:none!important}
  .shell{height:auto}.pane{overflow:visible}
  .card{box-shadow:none;border:1px solid #eee;break-inside:avoid}
}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="logo">🔮</div>
    <div class="ti"><b>사주 × MBTI 상담카드</b><span id="topSub">생년월일과 태어난 시간, 그리고 48문항</span></div>
    <button class="mecard" id="meBtn" onclick="goStep('me')">내 카드</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="pane" id="pane"><div id="view"></div><div class="scrollhint" id="hint">▼ 아래로 더 있어요</div></div>
</div>
<div class="toast" id="toast" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:#2F2C40;color:#fff;font-size:13px;font-weight:700;padding:11px 17px;border-radius:999px;opacity:0;transition:opacity .2s,transform .2s;z-index:90;pointer-events:none;max-width:88vw;text-align:center"></div>
<script>
/* ── 성향검사 48문항 (앱과 같은 문항·같은 채점) ─────────────────── */
var MBTI_SCALE=[{v:3,t:'매우 그래요'},{v:2,t:'그래요'},{v:1,t:'조금 그래요'},
  {v:-1,t:'조금 아니에요'},{v:-2,t:'아니에요'},{v:-3,t:'전혀 아니에요'}];
var MBTI_AXIS=[
  {key:'EI',a:'E',b:'I',an:'외향',bn:'내향',q:'기운을 어디서 얻나'},
  {key:'SN',a:'S',b:'N',an:'감각',bn:'직관',q:'무엇을 먼저 보나'},
  {key:'TF',a:'T',b:'F',an:'사고',bn:'감정',q:'무엇으로 결정하나'},
  {key:'JP',a:'J',b:'P',an:'판단',bn:'인식',q:'어떻게 매듭짓나'}];
var MBTI_PAIR=[
  [0,7,'먼저 말을 건다 ↔ 먼저 연락이 부담스럽다'],
  [1,11,'만나면 기운이 난다 ↔ 사람이 많으면 지친다'],
  [13,15,'있는 것을 다듬는다 ↔ 새로운 시도를 한다'],
  [19,18,'겪은 것만 믿는다 ↔ 가능성을 발견한다'],
  [24,34,'근거를 먼저 본다 ↔ 느낌을 먼저 본다'],
  [27,26,'분명히 짚는다 ↔ 상처받을 말은 삼킨다'],
  [37,46,'미리 끝내 놓는다 ↔ 마감이 닥쳐야 한다'],
  [36,40,'일정을 미리 정한다 ↔ 그때그때 다닌다']];
var MBTI_TIP={
  E:'말로 풀게 두세요. 결론은 함께 소리 내어 정리합니다.',
  I:'재촉하지 마세요. 자료를 먼저 주고 혼자 볼 시간을 줍니다.',
  S:'숫자·사례·서류부터. 큰 그림은 뒤로 미룹니다.',
  N:'큰 그림과 5년 뒤 이야기 먼저. 세부는 요약해서.',
  T:'비교표와 손익으로. 감정에 호소하면 오히려 닫힙니다.',
  F:'가족·사람 이야기부터. 숫자는 마음이 열린 뒤에.',
  J:'일정과 다음 단계를 그 자리에서 정해 줍니다.',
  P:'선택지를 두세 개 남겨 두고 스스로 고르게 합니다.'};

var MBTI_Q = [
  { t: '처음 만난 자리에서도 내가 먼저 말을 건다.',              ax: 'EI', k: 1 },
  { t: '사람을 여럿 만나고 오면 오히려 기운이 난다.',            ax: 'EI', k: 1 },
  { t: '혼자 있는 시간이 있어야 머릿속이 정리된다.',             ax: 'EI', k: -1 },
  { t: '전화보다 문자로 정리해서 보내는 편이 편하다.',           ax: 'EI', k: -1 },
  { t: '모임에서 분위기를 띄우는 쪽에 가깝다.',                  ax: 'EI', k: 1 },
  { t: '생각이 정리되기 전에는 말을 잘 꺼내지 않는다.',          ax: 'EI', k: -1 },
  { t: '하루에 약속이 서너 개 있어도 힘들지 않다.',              ax: 'EI', k: 1 },
  { t: '잘 모르는 사람에게 먼저 연락하는 일이 부담스럽다.',      ax: 'EI', k: -1 },
  { t: '말을 하면서 생각이 정리되는 편이다.',                    ax: 'EI', k: 1 },
  { t: '쉬는 날은 집에서 조용히 보내는 것이 좋다.',              ax: 'EI', k: -1 },
  { t: '새로운 모임에 초대받으면 일단 나가 본다.',               ax: 'EI', k: 1 },
  { t: '사람 많은 자리에 오래 있으면 지친다.',                   ax: 'EI', k: -1 },

  { t: '설명을 들을 때 구체적인 숫자와 사례가 있어야 이해된다.', ax: 'SN', k: 1 },
  { t: '새것을 벌이기보다 지금 있는 것을 다듬는 편이 재미있다.', ax: 'SN', k: 1 },
  { t: '사실보다 그 뒤에 숨은 뜻이 먼저 보인다.',                ax: 'SN', k: -1 },
  { t: '늘 하던 방식이 지루해서 새로운 시도를 해 본다.',         ax: 'SN', k: -1 },

function jdnOf(y,m,d){var a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function jdKst(y,m,d,H,Mi){return jdnOf(y,m,d)-0.5+((H-9)+(Mi||0)/60)/24;}
function sunLong(jd){
  var T=(jd-2451545)/36525;
  var L0=280.46646+36000.76983*T+0.0003032*T*T;
  var M=(357.52911+35999.05029*T-0.0001537*T*T)*Math.PI/180;
  var C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  var O=(125.04-1934.136*T)*Math.PI/180;
  var lam=L0+C-0.00569-0.00478*Math.sin(O);
  return ((lam%360)+360)%360;
}
function ipchunJd(y){var lo=jdKst(y,2,1,0,0),hi=jdKst(y,2,10,0,0),i,mid;
  for(i=0;i<52;i++){mid=(lo+hi)/2;if(sunLong(mid)<315)lo=mid;else hi=mid;}return (lo+hi)/2;}
function jdToKst(jd){
  var z=jd+0.5+9/24,Z=Math.floor(z),f=z-Z,a=Z;
  if(Z>=2299161){var al=Math.floor((Z-1867216.25)/36524.25);a=Z+1+al-Math.floor(al/4);}
  var b=a+1524,c=Math.floor((b-122.1)/365.25),d0=Math.floor(365.25*c),e=Math.floor((b-d0)/30.6001);
  var day=b-d0-Math.floor(30.6001*e),mo=e<14?e-1:e-13,yr=mo>2?c-4716:c-4715;
  var h=f*24,H=Math.floor(h),Mi=Math.round((h-H)*60);if(Mi===60){Mi=0;H++;}
  return {y:yr,m:mo,d:day,H:H,Mi:Mi,
    txt:yr+'년 '+mo+'월 '+day+'일 '+('0'+H).slice(-2)+':'+('0'+Mi).slice(-2)};
}
/* 절입 시각 — 지금 달의 시작(절입)과 다음 절입 */
function termJd(jd,dir){
  var lam=sunLong(jd), base=Math.floor((((lam-315)%360)+360)%360/30)*30+315;
  var target=((base%360)+360)%360;
  if(dir>0)target=(target+30)%360;
  var lo=jd-(dir>0?0:40), hi=jd+(dir>0?40:0),i,mid;
  function diff(x){var v=sunLong(x)-target;while(v<-180)v+=360;while(v>180)v-=360;return v;}
  if(diff(lo)*diff(hi)>0)return null;
  for(i=0;i<52;i++){mid=(lo+hi)/2;if(diff(lo)*diff(mid)<=0)hi=mid;else lo=mid;}
  return (lo+hi)/2;
}
var TERM_NAME=['입춘','경칩','청명','입하','망종','소서','입추','백로','한로','입동','대설','소한'];

/* 사주 계산 — sunTime: 진태양시 보정(분) */
function sajuCalc(y,m,d,H,Mi,adjMin){
  var mm=(Mi||0)+(adjMin||0), hh=H;
  while(mm<0){mm+=60;hh--;} while(mm>=60){mm-=60;hh++;}
  var dy=y,dm=m,dd=d;
  if(hh<0){hh+=24;var pj=jdnOf(y,m,d)-1,pk=jdToKst(pj+0.5-9/24+0.5);dy=pk.y;dm=pk.m;dd=pk.d;}
  if(hh>=24){hh-=24;var nj=jdnOf(y,m,d)+1,nk=jdToKst(nj+0.5-9/24+0.5);dy=nk.y;dm=nk.m;dd=nk.d;}
  var jd=jdKst(dy,dm,dd,hh,mm), lam=sunLong(jd);
  var sy=(jd>=ipchunJd(dy))?dy:dy-1;
  var yi=((sy-1984)%60+60)%60, yg=yi%10, yj=yi%12;
  var mj=(Math.floor((((lam-315)%360)+360)%360/30)+2)%12;
  var mg=((yg%5)*2+2+((mj-2+12)%12))%10;
  var dayN=jdnOf(dy,dm,dd)+(hh>=23?1:0), di=((dayN+49)%60+60)%60, dg=di%10, dj=di%12;
  var zi=Math.floor(((hh+1)%24)/2), hg=((dg%5)*2+zi)%10;
  var prev=termJd(jd,-1), next=termJd(jd,1);
  var toPrev=prev?(jd-prev):null, toNext=next?(next-jd):null;
  return {
    jd:jd,lam:lam,sajuYear:sy,adj:adjMin||0,
    yg:yg,yj:yj,mg:mg,mj:mj,dg:dg,dj:dj,hg:hg,hj:zi,
    pillars:[{lb:'년주',g:yg,j:yj},{lb:'월주',g:mg,j:mj},{lb:'일주',g:dg,j:dj,day:true},{lb:'시주',g:hg,j:zi}],
    term:{prev:prev,next:next,prevName:TERM_NAME[Math.floor((((sunLong(prev||jd)-315)%360)+360)%360/30)]||'',
          nextName:TERM_NAME[(Math.floor((((lam-315)%360)+360)%360/30)+1)%12]||'',
          toPrevDays:toPrev,toNextDays:toNext},
    edge:(toPrev!==null&&toPrev<0.05)||(toNext!==null&&toNext<0.05),
    hourEdge:(mm%120===0)||(((hh*60+mm)+60)%120<20)||(((hh*60+mm)+60)%120>100)
  };
}

function ohCount(s){

  [s.yg,s.mg,s.dg,s.hg].forEach(function(g){o[GAN_OH[g]]++;});

function sipsinOf(dayG,otherG){
  var a=GAN_OH[dayG],b=GAN_OH[otherG],same=(GAN_YIN[dayG]===GAN_YIN[otherG]);
  if(a===b)return same?'비견':'겁재';
  if(OH_SAENG[a]===b)return same?'식신':'상관';
  if(OH_GEUK[a]===b)return same?'편재':'정재';
  if(OH_GEUK[b]===a)return same?'편관':'정관';
  return same?'편인':'정인';
}

/* 일간 강약 — 월지·같은 편 개수로 간단 판정 */
function strengthOf(s){
  var mine=GAN_OH[s.dg], help=0, i;
  var gs=[s.yg,s.mg,s.hg], js=[s.yj,s.mj,s.dj,s.hj];
  for(i=0;i<gs.length;i++){var o=GAN_OH[gs[i]];if(o===mine||OH_SAENG[o]===mine)help++;}
  for(i=0;i<js.length;i++){var o2=JI_OH[js[i]];if(o2===mine||OH_SAENG[o2]===mine)help+=(i===1?1.5:1);}
  var monthOk=(JI_OH[s.mj]===mine||OH_SAENG[JI_OH[s.mj]]===mine);

function yearLuck(s,today){
  var t=today||new Date();

}

function scoreAns(ans){
  var by={},i;
  for(i=0;i<MBTI_AXIS.length;i++)by[MBTI_AXIS[i].key]={sum:0,cnt:0};
  for(i=0;i<MBTI_Q.length;i++){var v=ans[i],q=MBTI_Q[i];if(!v)continue;by[q.ax].sum+=q.k*v;by[q.ax].cnt++;}
  var axes=MBTI_AXIS.map(function(a){
    var s=by[a.key].sum,max=by[a.key].cnt*3||1,pa=Math.round(((s+max)/(max*2))*100);
    pa=Math.max(0,Math.min(100,pa));
    var ratio=Math.abs(s)/max,cl=clarity(ratio),letter=s>=0?a.a:a.b;
    return {key:a.key,a:a.a,b:a.b,an:a.an,bn:a.bn,q:a.q,sum:s,max:max,cnt:by[a.key].cnt,pctA:pa,pctB:100-pa,

  });

    return {label:p[2],pct:(!va||!vb)?null:Math.round((1-Math.abs(va+vb)/6)*100)};});
  var done=pairs.filter(function(p){return p.pct!==null;});
  return {axes:axes,code:axes.map(function(x){return x.letter;}).join(''),
    consistency:done.length?Math.round(done.reduce(function(s,p){return s+p.pct;},0)/done.length):0,pairs:pairs,mode:'test'};
}

function combine(p){
  if(!p.saju||!personCode(p))return {rows:[],hits:0,sip:p.saju?sipsinTable(p.saju):null,
    oh:p.saju?ohCount(p.saju):null,strength:p.saju?strengthOf(p.saju):null,none:true};
  var s=p.saju,sip=sipsinTable(s),oh=ohCount(s),code=personCode(p),rows=[];
  var g=sip.count;
  function ax(i){return p.res?p.res.axes[i]:null;}
  /* E/I — 비겁·식상이 많으면 밖으로, 인성이 많으면 안으로 */
  var out=g.비겁+g.식상, inn=g.인성;
  rows.push({axis:'E · I',test:code.charAt(0)==='E'?'외향(E)':'내향(I)',
    saju:out>inn?'밖으로 나가는 힘이 강함(비겁·식상 '+out+')':(inn>out?'안으로 모으는 힘이 강함(인성 '+inn+')':'반반'),
    hit:(code.charAt(0)==='E')===(out>=inn),
    read:(code.charAt(0)==='E')===(out>=inn)?'검사와 사주가 같은 말을 한다. 보이는 대로 대하면 된다.'
      :'검사에서는 '+(code.charAt(0)==='E'?'외향':'내향')+'인데 사주는 반대다. 밖에서는 '+(code.charAt(0)==='E'?'활발하지만 속으로는 혼자 정리하는':'조용하지만 마음은 밖을 향하는')+' 사람일 수 있다.'});
  /* S/N — 재성·관성은 현실, 인성·식상은 관념 */
  var real=g.재성+g.관성, idea=g.인성+g.식상;
  rows.push({axis:'S · N',test:code.charAt(1)==='S'?'감각(S)':'직관(N)',
    saju:real>idea?'현실·실리 쪽이 두껍다(재성·관성 '+real+')':(idea>real?'생각·구상 쪽이 두껍다(인성·식상 '+idea+')':'반반'),
    hit:(code.charAt(1)==='S')===(real>=idea),
    read:(code.charAt(1)==='S')===(real>=idea)?'숫자와 사실로 접근하면 그대로 통한다.'
      :'말은 '+(code.charAt(1)==='S'?'구체적으로 하지만 마음은 그림을 본다':'그림으로 하지만 결국 숫자에서 결정한다')+'. 둘 다 준비해 가야 한다.'});
  /* T/F — 관성·재성은 기준, 식상·인성은 마음 */
  var logic=g.관성+g.재성, heart=g.식상+g.인성;
  rows.push({axis:'T · F',test:code.charAt(2)==='T'?'사고(T)':'감정(F)',
    saju:logic>heart?'기준·계산이 앞선다(관성·재성 '+logic+')':(heart>logic?'마음·표현이 앞선다(식상·인성 '+heart+')':'반반'),
    hit:(code.charAt(2)==='T')===(logic>=heart),
    read:(code.charAt(2)==='T')===(logic>=heart)?'근거로 설득하면 된다. 감정 호소는 아껴라.'
      :'겉은 '+(code.charAt(2)==='T'?'논리지만 결정 순간에는 사람을 본다':'따뜻하지만 조건이 안 맞으면 냉정해진다')+'.'});
  /* J/P — 관성·인성은 틀, 식상·비겁은 자유 */
  var fix=g.관성+g.인성, free=g.식상+g.비겁;
  rows.push({axis:'J · P',test:code.charAt(3)==='J'?'판단(J)':'인식(P)',
    saju:fix>free?'틀과 순서를 지키는 힘(관성·인성 '+fix+')':(free>fix?'벌이고 바꾸는 힘(식상·비겁 '+free+')':'반반'),
    hit:(code.charAt(3)==='J')===(fix>=free),
    read:(code.charAt(3)==='J')===(fix>=free)?'일정을 정해 주면 그대로 간다.'
      :'계획은 '+(code.charAt(3)==='J'?'세우지만 마음은 여지를 원한다':'느슨해 보여도 마지막엔 몰아친다')+'.'});
  var hits=rows.filter(function(r){return r.hit;}).length;
  return {rows:rows,hits:hits,sip:sip,oh:oh,strength:strengthOf(s)};
}
/* 궁합 */
function fitCalc(me,cl){
  var a=me.saju,b=cl.saju,mc=personCode(me),cc=personCode(cl),items=[],sj=50,mb=50;
  var hasS=!!(a&&b), hasM=!!(mc&&cc);
  var jr=hasS?jiRel(a.dj,b.dj):null, gr=hasS?ganRel(a.dg,b.dg):null, of1={lack:[],filled:[]};
  if(hasS){
    items.push({k:'일지 관계',v:jr.k,s:jr.s,txt:jr.txt}); sj+=jr.s;
    items.push({k:'일간 관계',v:gr.k,s:gr.s,txt:gr.txt}); sj+=gr.s;
    of1=ohFill(ohCount(a),ohCount(b));
    var ofS=of1.filled.length?12:(of1.lack.length?-3:0);
    items.push({k:'오행 보완',v:of1.filled.length?of1.filled.join('·')+' 채워줌':(of1.lack.length?'못 채움':'해당 없음'),s:ofS,
      txt:of1.filled.length?'내게 없는 '+of1.filled.join('·')+' 기운을 상대가 갖고 있다. 내가 못 하는 이야기를 상대가 편하게 받는다.'
        :'서로 없는 것을 채워주지는 않는다. 대화의 폭을 내가 넓혀야 한다.'});
    sj+=ofS;
  }
  if(hasM)['SN','TF','JP','EI'].forEach(function(k){
    var i=({EI:0,SN:1,TF:2,JP:3})[k];
    var same=mc.charAt(i)===cc.charAt(i), r=same?MB_COMPAT[k].same:MB_COMPAT[k].diff;
    items.push({k:'성향 '+({EI:'말의 양',SN:'설명 방식',TF:'결정 기준',JP:'속도'})[k],
      v:mc.charAt(i)+' vs '+cc.charAt(i),s:r.s,txt:r.txt,mb:true});
    mb+=r.s*1.1;
  });
  /* 사주가 좋다고 상담이 되는 게 아니고, 성향이 어긋난다고 안 되는 것도 아니다.
     두 쪽을 따로 매기고 반반으로 합친다. */
  sj=hasS?Math.max(8,Math.min(98,Math.round(sj))):null;
  mb=hasM?Math.max(8,Math.min(98,Math.round(mb))):null;
  var sc=(sj===null)?mb:((mb===null)?sj:Math.round((sj+mb)/2));
  var lv=sc>=80?{t:'아주 잘 맞음',c:'#1F7A61',bg:'#EAF8F3'}:sc>=65?{t:'잘 맞는 편',c:'#6F63C4',bg:'#F1EEFF'}
    :sc>=50?{t:'보통 — 준비하면 된다',c:'#9A5B0C',bg:'#FFF6E9'}:{t:'어긋나기 쉬움 — 방식을 바꿔야 한다',c:'#BB3A54',bg:'#FFF0F1'};
  return {score:sc,sajuScore:sj,mbtiScore:mb,level:lv,items:items,jr:jr,gr:gr,fill:of1,hasS:hasS,hasM:hasM};
}
/* 상담 전략 — 축마다 나 / 상대 / 이대로 하면 / 이렇게 바꿔라 */
function talkPlan(me,cl){
  var mc=personCode(me),cc=personCode(cl),rows=[],i;
  var keys=['EI','SN','TF','JP'];
  for(i=0;i<4;i++){
    var k=keys[i],M=mc.charAt(i),Y=cc.charAt(i),ST=STRATEGY[k],box;
    if(M===Y)box=(M===ST.SS.me)?ST.SS:ST.II;
    else box=(M===ST.ME.me)?ST.ME:ST.MI;
    rows.push({label:ST.label,me:M,you:Y,same:M===Y,risk:box.risk,fix:box.fix});
  }
  var hasS=!!cl.saju;
  var sip=hasS?sipsinTable(cl.saju):null,top=hasS?sip.top:'',meta=hasS?SIP_META[top]:null;
  var oh=hasS?ohCount(cl.saju):null,lack=[],k2;
  if(oh)for(k2 in oh)if(oh[k2]===0)lack.push(k2);
  var luck=hasS?yearLuck(cl.saju):null;
  var opens=meta?[meta.open]:[];
  if(cc.charAt(1)==='S')opens.push('"오늘은 숫자 세 개만 보고 가시죠 — 월 보험료, 보장금액, 기간."');
  else opens.push('"지금 준비하시는 게 5년 뒤 어떤 그림이 되는지부터 말씀드릴게요."');
  if(cc.charAt(2)==='F')opens.push('"이 돈이 결국 누구를 지키는 돈인지부터 여쭤볼게요."');
  else opens.push('"비교표 한 장 준비했습니다. 근거부터 보시죠."');
  var avoid=meta?[meta.avoid]:[];
  if(cc.charAt(3)==='P')avoid.push('"오늘 결정하셔야 합니다" — 재촉은 바로 닫히게 만든다.');
  else avoid.push('"천천히 보시고 연락 주세요" — 이 유형은 기한이 없으면 흘려보낸다.');
  if(cc.charAt(0)==='I')avoid.push('말 끊기. 5초 침묵을 못 견디고 내가 채우면 상대는 입을 닫는다.');
  else avoid.push('자료만 내밀고 조용히 있기. 이 유형은 말이 오가야 마음이 열린다.');
  var closes=meta?[meta.close]:[];
  if(cc.charAt(3)==='J')closes.push('"다음 주 화요일 오전, 서류 정리해서 다시 뵙겠습니다" — 날짜를 먼저 박는다.');
  else closes.push('"두 가지 안을 두고 가겠습니다. 편하신 걸로 알려주세요" — 고르게 둔다.');
  return {rows:rows,sipTop:top,meta:meta,lack:lack,luck:luck,opens:opens,avoid:avoid,closes:closes,
    sameCount:rows.filter(function(r){return r.same;}).length};
}

  if(mode==='saju')return ['ice','sum','deep','fit','ins','saju'];

    var list=tabsFor(S.mode);

      '<button onclick="newClient()">＋ 새 고객</button>';

function calcPerson(p){
  var y=num(p.y),m=num(p.m),d=num(p.d);
  if(!y||!m||!d)return false;
  var H=p.noTime?12:(p.H===''||p.H===null||p.H===undefined?12:p.H);
  p.saju=sajuCalc(y,m,d,H,p.noTime?0:(p.Mi||0),p.adj?-32:0);
  return true;
}
function savePerson(who){
  var p=who==='me'?S.me:S.cl;
  grab(who);
  if(!p.name){toast('이름을 넣어주세요');return;}
  var y=num(p.y),m=num(p.m),d=num(p.d);
  if(who!=='me'&&S.mode==='mbti'&&!y){
    if(!personCode(p)){toast('유형을 고르거나 48문항 검사를 해주세요');return;}
    save();S.step='board';S.tab='ice';draw();return;
  }
  if(!y||!m||!d||y<1900||y>2100||m<1||m>12||d<1||d>31){toast('생년월일을 다시 확인해 주세요 (1900~2100)');return;}
  if(!p.noTime&&(p.H===''||p.H===null||p.H===undefined)){toast('태어난 시간을 고르거나 "시간을 모릅니다"를 눌러주세요');return;}
  if(who!=='me'&&S.mode==='saju'){calcPerson(p);save();S.step='board';S.tab='ice';draw();toast('사주 풀이가 준비됐습니다');return;}
  calcPerson(p);save();
  if(!personCode(p)){toast('사주를 계산했습니다. 이제 유형을 고르거나 검사를 하세요.');draw();
    setTimeout(function(){var e=document.querySelector('.mbtigrid');if(e&&e.scrollIntoView)e.scrollIntoView({block:'center',behavior:'smooth'});},60);return;}
  if(who==='me'){toast('내 카드를 저장했습니다');S.step=(S.cl.name?'client':'client');draw();}
  else{S.step=ready(S.cl)?'board':'client';draw();if(ready(S.cl))toast('결과가 준비됐습니다');}
}
/* ── 48문항 ── */
function startTest(who){
  S.target=who;S.ans={};S.i=0;S.step='test';save();draw();
}
function viewTest(){
  var i=S.i,q=MBTI_Q[i],cur=S.ans[i],pct=Math.round(i/48*100),sz=[34,27,21,21,27,34];
  return '<div class="card">'+
    '<div class="track"><div class="runner" style="left:'+Math.max(4,pct)+'%">'+mascot('ENFP',32)+'</div><i style="width:'+pct+'%"></i></div>'+
    '<div style="display:flex;justify-content:space-between;margin-top:9px;font-size:12px;font-weight:800;color:#8C86A8">'+
      '<span>'+(S.target==='me'?'내 검사':'고객 검사')+' · '+(i+1)+' / 48</span><span>'+pct+'%</span></div></div>'+
    '<div class="card q" id="qcard"><span class="qno">Q'+(i+1)+'</span>'+
      '<div class="qtext">'+esc(q.t)+'</div>'+
      '<div class="scale">'+MBTI_SCALE.map(function(o,n){
        return '<button class="dot'+(o.v<0?' no':'')+(cur===o.v?' on':'')+'" style="width:'+sz[n]+'px;height:'+sz[n]+'px" aria-label="'+o.t+'" onclick="pick('+o.v+')"></button>';}).join('')+'</div>'+
      '<div class="slab"><span class="y">그래요 👍</span><span class="n">아니에요 👎</span></div>'+
      '<div class="row" style="margin-top:16px">'+
        '<button class="btn line sm" onclick="qPrev()"'+(i===0?' disabled style="opacity:.45"':'')+'>← 이전</button>'+
        '<button class="btn ghost sm" onclick="qQuit()">그만두기</button></div>'+
    '</div><div class="foot">정답은 없습니다. 오래 고민하지 말고 먼저 떠오르는 쪽을 고르세요.</div>';
}
function pick(v){
  S.ans[S.i]=v;
  var c=$('qcard');
  if(c){var bs=c.querySelectorAll('.dot');for(var n=0;n<bs.length;n++)bs[n].classList.toggle('on',MBTI_SCALE[n].v===v);}
  save();
  setTimeout(function(){
    if(S.i>=47){finishTest();return;}
    S.i++;save();draw();
  },220);
}
function qPrev(){if(S.i>0){S.i--;save();draw();}}
function qQuit(){S.step=(S.target==='me')?'me':'client';save();draw();}
function finishTest(){
  var miss=[],i;for(i=0;i<48;i++)if(!S.ans[i])miss.push(i);
  if(miss.length){S.i=miss[0];draw();toast('아직 답하지 않은 문항이 '+miss.length+'개 있습니다');return;}
  var r=scoreAns(S.ans),p=(S.target==='me')?S.me:S.cl;
  p.res=r;p.mbti=r.code;
  S.step=(S.target==='me')?'me':(ready(S.cl)?'board':'client');
  save();draw();toast('검사 완료 — '+r.code);
}

function ringSvg(v,color){
  var r=52,c=2*Math.PI*r,off=c*(1-v/100);
  return '<svg viewBox="0 0 120 120" width="118" height="118">'+
    '<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="#F0ECFA" stroke-width="12"/>'+
    '<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round"'+
    ' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/></svg>';
}
function pillarsHtml(p,small){
  var s=p.saju,list=s.pillars.slice(0);
  if(p.noTime)list=list.slice(0,3);
  return '<div class="pillars">'+list.map(function(x){
    var oh1=GAN_OH[x.g],oh2=JI_OH[x.j];
    return '<div class="pil'+(x.day?' day':'')+'"><div class="lb">'+x.lb+(x.day?' · 나':'')+'</div>'+
      '<div class="gz">'+GANH[x.g]+'<br>'+JIH[x.j]+'</div>'+
      '<div class="kr">'+GAN[x.g]+JI[x.j]+'</div>'+
      '<div class="oh" style="color:'+OH_META[oh1].c+';background:'+OH_META[oh1].bg+'">'+oh1+'·'+oh2+'</div></div>';
  }).join('')+(p.noTime?'<div class="pil" style="opacity:.5"><div class="lb">시주</div><div class="gz" style="font-size:20px;padding-top:6px">?</div><div class="kr">시간 모름</div></div>':'')+'</div>';
}
function ohBars(oh){
  var mx=Math.max(1,oh.목,oh.화,oh.토,oh.금,oh.수);
  return '<div class="ohbars">'+['목','화','토','금','수'].map(function(k){
    var m=OH_META[k],h=Math.round(oh[k]/mx*100);
    return '<div class="ohbar"><div class="t"><i style="height:'+(oh[k]?Math.max(14,h):0)+'%;background:'+m.c+'"></i></div>'+
      '<div class="lb" style="color:'+m.c+'">'+m.emo+' '+k+'</div><div class="cn">'+oh[k]+'개</div></div>';
  }).join('')+'</div>';
}

function sinsalOf(s){

  var hit={};
  base.forEach(function(b){
    g=grpOf(b);if(!g)return;
    if(jis.indexOf(g.do)>=0)hit['도화']=JI[g.do];
    if(jis.indexOf(g.yeok)>=0)hit['역마']=JI[g.yeok];

  for(i=0;i<jis.length;i++)if(ce.indexOf(jis[i])>=0)hit['천을귀인']=JI[jis[i]];
  for(var k in hit)out.push({name:k,ji:hit[k],meta:SINSAL_META[k]});

  if(se==='겨울'){txt='한겨울에 태어난 '+oh+'(木火土金水 중 '+oh+') 기운이십니다. 몸을 데워줄 불(火) 기운이 곁에 있어야 일이 잘 풀리십니다.';need='화';}
  else if(se==='여름'){txt='한여름에 태어난 '+oh+' 기운이십니다. 열을 식혀줄 물(水) 기운이 있어야 멀리 오래 가십니다.';need='수';}
  else if(se==='봄'){txt='봄에 태어난 '+oh+' 기운이십니다. 뻗어나가는 힘이 강해서 방향만 잡히면 빠르게 자라십니다.';need='금';}
  else{txt='가을에 태어난 '+oh+' 기운이십니다. 거두고 매듭짓는 기운이라 결정이 분명하십니다.';need='화';}
  return {season:se,need:need,txt:txt};
}
/* 대운 — 10년마다 바뀌는 큰 흐름 */
function daeun(s,gender,noTime){
  var yangYear=(GAN_YIN[s.yg]===0), male=(gender!=='F');
  var forward=(yangYear&&male)||(!yangYear&&!male);
  var days=forward?(s.term.toNextDays||0):(s.term.toPrevDays||0);
  var start=Math.max(1,Math.round(days/3));
  var list=[],i,idx=((s.mg%10)*1);
  var mIdx=(function(){ /* 월주의 60갑자 자리 */
    for(var n=0;n<60;n++)if(n%10===s.mg&&n%12===s.mj)return n;return 0;})();
  for(i=1;i<=8;i++){
    var k=((mIdx+(forward?i:-i))%60+60)%60;
    list.push({age:start+(i-1)*10,g:k%10,j:k%12,
      sip:sipsinOf(s.dg,k%10),sipJ:sipsinOf(s.dg,JI_HIDE[k%12]),un:unseong(s.dg,k%12)});
  }
  return {forward:forward,start:start,list:list,
    why:(yangYear?'양(陽)년':'음(陰)년')+'에 태어난 '+(male?'남자':'여자')+'라 '+(forward?'순행':'역행')+'합니다'};
}
function ageNow(y,m,d){
  var t=new Date(),a=t.getFullYear()-Number(y);
  if(t.getMonth()+1<Number(m)||(t.getMonth()+1===Number(m)&&t.getDate()<Number(d)))a--;
  return a;
}

function funcStack(code){

  var domIsJ=((jAtt==='e')===E);
  var dom=domIsJ?(J+jAtt):(P+pAtt), aux=domIsJ?(P+pAtt):(J+jAtt);
  function flip(f){var x=f.charAt(0),a=f.charAt(1);
    var op={S:'N',N:'S',T:'F',F:'T'}[x];return op+(a==='e'?'i':'e');}
  return {dom:dom,aux:aux,ter:flip(aux),inf:flip(dom)};
}

/* 받침에 따라 조사를 고른다 — "화개이 들어" 같은 말이 손님 앞에 나가면 안 된다 */
function josa(w,a,b){
  var c=(w||'').charCodeAt((w||'').length-1);
  if(isNaN(c))return a;
  var has=(c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28!==0):true;
  return has?a:b;
}
function blessing(p){
  var s=p.saju,code=personCode(p),out=[];
  if(s){
    out.push(GAN_DEEP[s.dg].bless);
    var oh=ohCount(s),lack=[],many=[],k;
    for(k in oh){if(oh[k]===0)lack.push(k);if(oh[k]>=3)many.push(k);}
    if(many.length)out.push(OH_META[many[0]].emo+' '+many[0]+' 기운이 두터우십니다 — '+OH_META[many[0]].key+'의 힘이 남다르다는 뜻입니다. 그 힘으로 여기까지 오셨습니다.');
    var sn=sinsalOf(s).filter(function(x){return x.meta.good;});
    if(sn.length)out.push(sn[0].meta.emo+' 사주에 '+sn[0].name+josa(sn[0].name,'이','가')+' 들어 있습니다. '+sn[0].meta.line);
    var un=unseong(s.dg,s.dj),um=UNSEONG_META[un];
    if(um&&um.good)out.push('일지가 '+un+' 자리입니다 — '+um.t+'. '+um.line);
  }
  if(code&&TYPE_BLESS[code])out.push(TYPE_BLESS[code]);
  return out;
}

  nos=[

  ];
  if(code.charAt(0)==='I')nos.push('말을 끊고 내가 채우는 것 — 이 분은 5초 뒤에 말을 시작합니다. 기다리세요.');
  else nos.push('자료만 내밀고 조용히 있는 것 — 이 분은 말이 오가야 마음이 열립니다.');
  return {opens:opens,asks:asks,nos:nos,bless:blessing(p)};

/* ══════════════════════════════════════════════════════════════════
   9. 스크롤 칸 관리 · 시작
   ══════════════════════════════════════════════════════════════════ */
function hintCheck(){
  var p=$('pane'),h=$('hint');if(!p||!h)return;
  var more=(p.scrollHeight-p.clientHeight-p.scrollTop)>40;
  h.classList.toggle('off',!more);
}
(function(){
  var p=$('pane');
  if(p)p.addEventListener('scroll',hintCheck,{passive:true});
  window.addEventListener('resize',function(){fitShell();hintCheck();});
  document.addEventListener('keydown',function(e){
    if(!p)return;
    if(e.key==='PageDown'){p.scrollTop+=p.clientHeight*0.9;e.preventDefault();}
    if(e.key==='PageUp'){p.scrollTop-=p.clientHeight*0.9;e.preventDefault();}
    if(e.key==='Home'&&e.ctrlKey){p.scrollTop=0;}
    if(e.key==='End'&&e.ctrlKey){p.scrollTop=p.scrollHeight;}
  });
})();
/* 화면 높이를 제대로 못 받는 곳(작은 iframe 등)에서는 문서 스크롤로 되돌린다 */
function fitShell(){
  var p=$('pane');if(!p)return;
  var h=p.clientHeight;
  if(h<220)document.body.classList.add('flow');
  else document.body.classList.remove('flow');
}
(function boot(){
  var d=load();
  if(d){
    if(d.me)S.me=d.me; if(d.cl)S.cl=d.cl;
    S.ans=d.ans||{};S.i=d.i||0;S.tab=d.tab||'ice';S.mode=d.mode||'both';
    S.step=ready(S.cl)?'board':(S.me.name?'client':'me');
  }
  fitShell();draw();
  setTimeout(function(){fitShell();hintCheck();},250);
})();

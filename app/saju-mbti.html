<!DOCTYPE html>
<html data-theme="light" lang="ko">
<head>
<meta charset="UTF-8"/>
<!-- ★ data-theme="light" · color-scheme:light 는 「이 화면이 하얀다」는 뜻이 아니라
     「<b>폰의 다크 모드를 따라가지 않는다</b>」는 못입니다. 이 장은 신당이라
     언제나 먹빛이고, 그래서돀록 폰 설정에 따라 <b>흔들리면 안 됩니다</b>.
     app/apex-map.html(자비스 HUD)이 같은 꼴입니다. check-lightmode 가 봅니다. -->
<meta name="color-scheme" content="light"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>사주 × MBTI 상담카드 — 고객 성향·궁합·상담전략</title>
<meta name="description" content="생년월일과 태어난 시간으로 사주를 뽑고, 48문항 성향검사와 합쳐 고객 성향·나와의 궁합·상담 전략까지 한 장으로."/>
<!--
  사주 × MBTI 상담카드 — 영업용 상담 준비 도구
  ─────────────────────────────────────────────
  ⛔ <b>이 장을 고객(365일 · clients)과 잉지 마십시오.</b>
     2026-11-20 사장님 말씀 — 「아니 이으면 안된다, 이건 따로 쓸거」.
     제가 「고객 화면에 사주 카드 단추가 없습니다, 이을까요」 하고
     받은 답입니다. <b>빠진 것이 아니라 일부러 그렇게 둔 것</b>입니다.
     지금 붙어 있는 곧은 <b>채용 대기열</b> 하나뿐이고, 그렇게 둡니다.
  ─────────────────────────────────────────────────────────────
  · 생년월일 + 태어난 시간 → 사주 4기둥을 실제로 계산한다.
    절기는 태양황경으로 구하고(입춘·경칩…), 일주는 율리우스 적일로 뽑는다.
    검증: 2000-01-01 무오일 · 1949-10-01 갑자일 · 입춘 2024 = 2/4 17:21(공식 17:27)
  · 48문항 성향검사(MBTI형)와 합쳐 성향을 읽는다.
  · 내 카드(설계사)와 비교해 궁합과 "상담을 어떻게 할지"를 뽑는다.
  · 결제 없음. 전부 열려 있다.
  · 혼자 도는 파일이다 — 서버도, 인터넷에서 받아오는 그림·글꼴도 없다.
  · 스크롤은 전용 스크롤 칸(.pane)이 맡는다. 어디에 끼워 넣어도 스크롤된다.
-->
<style>
/* ══ 토스 결 ══════════════════════════════════════════════════════
   회색 바탕 위에 흰 카드, 파란 버튼 하나, 넉넉한 여백.
   장식은 줄이고 글자 크기와 간격으로 말한다. 귀여움은 캐릭터와
   살짝 통통한 모서리·눌림에만 남긴다.                              */
:root{
  --blue:#3182F6; --blue-d:#1B64DA; --blue-l:#E8F3FF; --blue-b:#C9E2FF;
  --bg:#F2F4F6; --card:#FFFFFF; --line:#E5E8EB; --line-l:#F2F4F6;
  --ink:#191F28; --ink2:#4E5968; --ink3:#8B95A1; --ink4:#B0B8C1;
  --green:#00A05A; --green-l:#E8F8F0; --red:#F04452; --red-l:#FEECEE;
  --amber:#C77700; --amber-l:#FFF6E5;
  --r:20px; --r-s:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%;letter-spacing:-0.02em}
/* ── 스크롤 칸 ── */
.shell{height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:0;max-width:1120px;margin:0 auto;background:var(--bg)}
.pane{flex:1;min-height:0;overflow-y:scroll;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:auto;scrollbar-color:var(--ink4) var(--line-l);padding:16px 16px 40px;position:relative}
.pane::-webkit-scrollbar{width:12px}
.pane::-webkit-scrollbar-track{background:var(--line-l);border-radius:99px;margin:6px 2px}
.pane::-webkit-scrollbar-thumb{background:var(--ink4);border-radius:99px;border:3px solid var(--line-l);min-height:44px}
.pane::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
body.flow{overflow:auto;height:auto}
body.flow .shell{height:auto;min-height:100vh}
body.flow .pane{overflow:visible;flex:none;min-height:0}
.scrollhint{position:sticky;bottom:2px;margin:12px auto -6px;width:fit-content;pointer-events:none;
  background:rgba(25,31,40,.72);color:#fff;font-size:12px;font-weight:700;padding:7px 14px;border-radius:99px;
  transition:opacity .2s;letter-spacing:-.02em}
.scrollhint.off{opacity:0}
/* ── 머리 ── */
.top{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top .logo{width:36px;height:36px;border-radius:12px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.top .ti{flex:1;min-width:0}
.top .ti b{display:block;font-size:15px;font-weight:800;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ti span{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mecard{flex:none;display:flex;align-items:center;gap:6px;background:var(--blue-l);border:none;border-radius:10px;
  padding:8px 12px;font-size:12px;font-weight:700;color:var(--blue-d);cursor:pointer;white-space:nowrap;font-family:inherit;transition:transform .12s}
.mecard:active{transform:scale(.96)}
.mecard.cl{background:var(--green-l);color:var(--green)}
.tabs{flex:none;display:flex;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:none;background:var(--bg);font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink2);
  padding:9px 15px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:transform .12s,background .16s}
.tabs button:active{transform:scale(.96)}
.tabs button.on{background:var(--blue);color:#fff}
.tabs button:disabled{opacity:.4;cursor:default}
/* ── 카드 ── */
.grid{display:grid;grid-template-columns:1fr;gap:12px;max-width:100%}
@media(min-width:1000px){.grid.hd{grid-template-columns:340px 1fr;align-items:start}.grid.hd .sticky{position:sticky;top:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r);padding:22px 20px;animation:rise .26s ease both}
.card + .card{margin-top:12px}
h1{font-size:23px;font-weight:800;margin:0;letter-spacing:-.045em;line-height:1.38}
h2{font-size:17px;font-weight:800;margin:0;letter-spacing:-.04em;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--blue-l);color:var(--blue-d);font-size:11.5px;font-weight:800;border-radius:8px;padding:4px 9px;flex:none;letter-spacing:0}
p{margin:10px 0 0;font-size:14.5px;line-height:1.65;color:var(--ink2)}
.sub{font-size:12.5px;color:var(--ink3);line-height:1.6}
.hr{height:1px;background:var(--line-l);margin:16px 0}
/* ── 버튼 ── */
.btn{width:100%;border:none;border-radius:var(--r-s);padding:15px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
  background:var(--blue);color:#fff;letter-spacing:-.03em;transition:transform .12s,background .16s}
.btn:active{transform:scale(.98);background:var(--blue-d)}
.btn.sm{padding:12px;font-size:14px;border-radius:12px}
.btn.ghost{background:var(--blue-l);color:var(--blue-d)}
.btn.ghost:active{background:var(--blue-b)}
.btn.line{background:var(--bg);color:var(--ink2)}
.btn.line:active{background:var(--line)}
.btn.dark{background:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
/* ── 입력 ── */
label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 8px 2px}
.inp,select{width:100%;border:none;background:var(--bg);border-radius:12px;padding:14px 15px;font-size:15px;font-family:inherit;
  color:var(--ink);outline:none;transition:box-shadow .16s;letter-spacing:-.02em}
.inp:focus,select:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.inp::placeholder{color:var(--ink4)}
textarea.inp{line-height:1.6;font-size:15px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:none;background:var(--bg);color:var(--ink2);border-radius:10px;padding:11px 14px;font-size:13.5px;
  font-weight:700;cursor:pointer;font-family:inherit;transition:transform .12s}
.seg button:active{transform:scale(.96)}
.seg button.on{background:var(--blue);color:#fff}
.mbtigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mbtigrid button{border:none;background:var(--bg);color:var(--ink2);border-radius:10px;padding:11px 2px;font-size:13px;
  font-weight:800;cursor:pointer;font-family:inherit;transition:transform .12s}
.mbtigrid button:active{transform:scale(.94)}
.mbtigrid button.on{background:var(--blue);color:#fff}
/* ── 표 ── */
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{background:#FBFCFD;color:var(--ink3);text-align:left;padding:11px 14px;font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:0}
.tb td{padding:13px 14px;border-top:1px solid var(--line-l);line-height:1.6;color:var(--ink2);vertical-align:top}
.tbwrap{border-radius:16px;overflow:hidden;background:var(--bg);margin-top:12px}
.tbwrap.scrollx{overflow-x:auto}
.tbwrap.scrollx .tb{min-width:560px}
.tbwrap .tb tbody td{background:var(--card)}
.tbwrap .tb tbody tr:first-child td{border-top:none}
@media(max-width:760px){
  .stack .tb{min-width:0}
  .stack thead{display:none}
  .stack tbody tr{display:block;padding:16px;border-top:1px solid var(--line-l);background:var(--card)}
  .stack tbody tr:first-child{border-top:none}
  .stack td{display:flex;gap:10px;align-items:flex-start;border:none;padding:5px 0;background:transparent}
  .stack td::before{content:attr(data-l);flex:none;width:58px;font-size:11.5px;font-weight:700;color:var(--ink3);padding-top:2px}
  .stack td.head{display:block;font-size:15px;font-weight:800;color:var(--ink);padding:0 0 8px}
  .stack td.head::before{content:none}
  .stack td.full{display:block}
  .stack td.full::before{display:block;width:auto;margin-bottom:4px}
  .stack td.plain{display:block}
  .stack td.plain::before{content:none}
  .compact .tb{min-width:0;font-size:13px}
}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:8px;padding:4px 9px;white-space:nowrap;letter-spacing:0}
.bar{display:flex;align-items:center;gap:7px;margin-top:6px}
.bar b{font-size:11px;color:var(--ink4);width:11px;text-align:center}
.bar .t{flex:1;min-width:50px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .t>i{display:block;height:100%;background:var(--blue);border-radius:99px}
/* ── 신당(점집) 화면 ──────────────────────────────────────────
   먹색 바탕 · 주칠 붉은색 · 금박. 신당 탭에 들어가면 화면 전체가
   바뀌고, 다른 탭으로 나가면 원래 토스 화면으로 돌아온다.        */
/* ══ 먹빛 신당 — 화면 전부가 이 옷을 입는다 ════════════════════════
   사장님 말씀 2026-11-20 「진짜 점집 같은 무서운 사례와 디자인」.

   ★ 전에는 「대문」 과 「신당 풀이」 두 칸만 검었고 나머지는 흰 화면이라,
     고객이 넘기다 보면 두 프로그램을 왔다 갔다 하는 느낌이 났습니다.
     이제 body.shrine-on 을 늘 켭니다 — 아래 변수만 갈아끼우면 모든 칸이
     따라옵니다(색을 칸마다 베껴 적지 않습니다 · 5번).

   값: 먹빛 바탕 #0A0506 · 주사(朱砂) #8C1F17 · 금박 #C9A227 · 한지 #E8DCC4.
   전보다 바탕을 네 단계 어둡게, 붉은색을 한 단계 탁하게 내렸습니다 —
   형광 빨강은 점집이 아니라 경보기처럼 보입니다.                     */
body.shrine-on{--bg:#050203;--card:#0E0706;--line:#3A2219;--line-l:#160D0B;
  --ink:#E8DCC4;--ink2:#B9A684;--ink3:#8A7A61;--ink4:#6B5D49;
  --blue:#8C1F17;--blue-d:#C23B2E;--blue-l:#1E100D;--blue-b:#4A201A;
  --green:#8FBF6F;--green-l:#15200F;--red:#C23B2E;--red-l:#24100D;
  --amber:#C9A227;--amber-l:#241B0C;}
body.shrine-on{background:
  radial-gradient(760px 300px at 50% -8%, rgba(168,26,20,.34), transparent 70%),
  radial-gradient(560px 240px at 50% 112%, rgba(201,162,39,.09), transparent 72%),
  #050203;}
/* ★ 촛불이 방을 흔듭니다 — 아주 천천히, 아주 조금. 멀미 나면 안 됩니다. */
body.shrine-on::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(70% 55% at 50% 42%, transparent 38%, rgba(0,0,0,.62) 100%);
  animation:shrBreathe 7.5s ease-in-out infinite}
@keyframes shrBreathe{0%,100%{opacity:.85}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){body.shrine-on::after{animation:none}}
body.shrine-on .card{box-shadow:0 1px 0 rgba(168,26,20,.16) inset, 0 10px 30px rgba(0,0,0,.6)}
body.shrine-on h1{letter-spacing:-.045em}
body.shrine-on .pane{position:relative;z-index:1}
.pa-bar{text-align:center}
.pa-hint{display:block;margin-top:9px;font-size:12.5px;color:var(--ink3);letter-spacing:-.02em}
/* 십신 표 — 읽는 글이 아니라 견주는 표라 한 줄에 눕힙니다 */
.shw-h{background:var(--blue-l);border-color:var(--blue-b)}
.shw .foot{display:none}
.shw button[onclick="window.print()"]{display:none}

.shw-s{margin-top:6px;font-size:13px;color:var(--ink2)}
@media print{.shw-h{break-before:page}}
.mesip{margin-top:10px;border-top:1px solid var(--line-l)}
.mesip-r{display:flex;align-items:baseline;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line-l)}
.mesip-p{flex:none;width:38px;font-size:12.5px;color:var(--ink3);letter-spacing:-.03em}
.mesip-c{flex:none;width:22px;font-size:15px;font-weight:800;color:var(--ink)}
.mesip-n{font-size:14.5px;letter-spacing:-.03em;color:var(--ink)}
.mesip-g{margin-left:auto;font-size:12px;color:var(--ink3)}
/* ★ 제목 밑 붉은 붓자국 — 그림 파일이 아니라 그라디언트입니다(9번).
   끝이 흐려져야 붓이지, 네모로 끝나면 밑줄입니다. */
body.shrine-on h1{position:relative;padding-bottom:11px}
body.shrine-on h1::after{content:'';position:absolute;left:0;bottom:0;width:62px;height:3px;border-radius:2px;
  background:linear-gradient(90deg, rgba(194,59,46,.95) 0%, rgba(168,26,20,.7) 55%, rgba(168,26,20,0) 100%)}
/* ★ 번호는 둥근 알약이 아니라 <b>낙관</b>처럼 — 네모에 살짝 기울여 찍습니다 */
body.shrine-on h2 .n{background:#7E1D14;color:#F2E2C8;border-radius:3px;padding:5px 8px;
  box-shadow:0 0 0 1px rgba(242,226,200,.22) inset;transform:rotate(-2deg)}
body.shrine-on .mehard{border-color:#5A1812;box-shadow:0 0 0 1px rgba(168,26,20,.2) inset, 0 12px 34px rgba(0,0,0,.72)}
body.shrine-on .mehard h2 .n{background:#A81A14}
body.shrine-on .say.hard{border-left-width:4px}
@media print{
  /* ★★ 깔개 둘(한지 결·어둠)은 position:fixed 라 <b>인쇄하면 종이를 통째로 덮습니다</b>.
     처음에 이 줄이 없어 네 장이 전부 새카맣게 나왔습니다 — 눈으로 PDF 를 뽑아 보고 알았습니다 (4-1번). */
  body.shrine-on::before, body.shrine-on::after{display:none!important}
  /* ★★ <b>.shell 이 먹빛을 쥐고 있었습니다</b> — body 만 희게 해 두어서, 신당 화면은
     여태 인쇄하면 종이가 새카맣게 나왔습니다(한 장짜리 인쇄도 마찬가지였습니다).
     PDF 를 실제로 뽑아 보고서야 찾았습니다 — 화면만 보고는 절대 못 봅니다 (4-1번). */
  .shell,.pane,#printAll,.pa-sheet{background:#fff!important}
  /* 인쇄는 흰 종이입니다 — 붓자국과 낙관은 종이에서도 보이게 먹빛으로 */
  body.shrine-on h1::after{background:#8C1F17}
  body.shrine-on h2 .n{background:#8C1F17!important;color:#fff!important;transform:none}
  /* 설명회 한 장의 <b>화면용 안내</b>는 종이에 안 찍습니다 */
  .shw-meta{display:none!important}
}
/* 한지 결 — 그림 파일을 안 받아 옵니다(9번). 결은 그라디언트로 냅니다. */
body.shrine-on::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:
    repeating-linear-gradient(0deg,rgba(232,220,196,.022) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(232,220,196,.014) 0 1px,transparent 1px 4px);}
body.shrine-on .top,body.shrine-on .tabs,body.shrine-on .pane{position:relative;z-index:1}
body.shrine-on .top{background:#0E0807;border-bottom:1px solid #30201B}
body.shrine-on .tabs{background:#0E0807;border-bottom:1px solid #30201B}
body.shrine-on .tabs button{background:#170E0C;color:#B9A684;border:1px solid #2A1B17}
body.shrine-on .tabs button.on{background:#8C1F17;color:#F3E7CF;border-color:#A8392C;
  box-shadow:0 0 0 1px rgba(201,162,39,.35) inset}
body.shrine-on .card{background:#140C0A;border:1px solid #30201B;
  box-shadow:0 1px 0 rgba(232,220,196,.03) inset, 0 18px 40px -28px #000}
body.shrine-on .bmk.a{background:#8C1F17}
body.shrine-on .bmk.o{background:#1E1411}
body.shrine-on .bband{background:#170E0C}
body.shrine-on .pil{background:#170E0C}
body.shrine-on .pil.day{background:#24110E;outline:1px solid #6B2A22}
body.shrine-on .scrollhint{background:rgba(140,31,23,.94);color:#F3E7CF}
/* ★ 토스트는 밝은 쪽 변수(--ink)를 바탕에 쓰고 있어, 먹빛에서는 바탕도
   글자도 한지색이 되어 <b>한 글자도 안 읽혔습니다</b> — 실제로 그렇게 찍혔습니다.
   먹빛에서는 뒤집습니다. */

     속으로 물려 내려가므로 html 한 줄이면 됩니다 — * 규칙은 안 씁니다.

function sajuCalc(y,m,d,H,Mi,adjMin){

  var dy=y,dm=m,dd=d;

  if(hh>=24){hh-=24;var nj=jdnOf(y,m,d)+1,nk=jdToKst(nj+0.5-9/24+0.5);dy=nk.y;dm=nk.m;dd=nk.d;}
  var jd=jdKst(dy,dm,dd,hh,mm), lam=sunLong(jd);

  var zi=Math.floor(((hh+1)%24)/2), hg=((dg%5)*2+zi)%10;

    term:{prev:prev,next:next,prevName:TERM_NAME[Math.floor((((sunLong(prev||jd)-315)%360)+360)%360/30)]||'',
          nextName:TERM_NAME[(Math.floor((((lam-315)%360)+360)%360/30)+1)%12]||'',

function clarity(r){
  if(r>=0.60)return {t:'아주 뚜렷',c:'#00A05A',bg:'#E8F8F0'};
  if(r>=0.36)return {t:'뚜렷',c:'#1B64DA',bg:'#E8F3FF'};
  if(r>=0.19)return {t:'보통',c:'#C77700',bg:'#FFF6E5'};
  if(r>=0.07)return {t:'약함',c:'#C77700',bg:'#FFF6E5'};
  return {t:'경계 · 둘 다',c:'#F04452',bg:'#FEECEE'};
}
function scoreAns(ans){
  var by={},i;
  for(i=0;i<MBTI_AXIS.length;i++)by[MBTI_AXIS[i].key]={sum:0,cnt:0};
  for(i=0;i<MBTI_Q.length;i++){var v=ans[i],q=MBTI_Q[i];if(!v)continue;by[q.ax].sum+=q.k*v;by[q.ax].cnt++;}
  var axes=MBTI_AXIS.map(function(a){
    var s=by[a.key].sum,max=by[a.key].cnt*3||1,pa=Math.round(((s+max)/(max*2))*100);
    pa=Math.max(0,Math.min(100,pa));
    var ratio=Math.abs(s)/max,cl=clarity(ratio),letter=s>=0?a.a:a.b;
    return {key:a.key,a:a.a,b:a.b,an:a.an,bn:a.bn,q:a.q,sum:s,max:max,cnt:by[a.key].cnt,pctA:pa,pctB:100-pa,
      letter:letter,other:s>=0?a.b:a.a,ratio:ratio,clarity:cl.t,cc:cl.c,cbg:cl.bg,border:cl.t.indexOf('경계')===0,tip:MBTI_TIP[letter]};
  });
  var pairs=MBTI_PAIR.map(function(p){var va=ans[p[0]],vb=ans[p[1]];
    return {label:p[2],pct:(!va||!vb)?null:Math.round((1-Math.abs(va+vb)/6)*100)};});
  var done=pairs.filter(function(p){return p.pct!==null;});
  return {axes:axes,code:axes.map(function(x){return x.letter;}).join(''),
    consistency:done.length?Math.round(done.reduce(function(s,p){return s+p.pct;},0)/done.length):0,pairs:pairs,mode:'test'};
}
/* 유형을 직접 고른 경우 — 표는 같은 모양으로 만들되 "직접 선택"으로 표시 */
function fakeRes(code){
  var axes=MBTI_AXIS.map(function(a,i){
    var letter=code.charAt(i),isA=(letter===a.a);
    return {key:a.key,a:a.a,b:a.b,an:a.an,bn:a.bn,q:a.q,sum:isA?18:-18,max:36,cnt:12,
      pctA:isA?75:25,pctB:isA?25:75,letter:letter,other:isA?a.b:a.a,ratio:.5,
      clarity:'직접 선택',cc:'#4E5968',cbg:'#F2F4F6',border:false,tip:MBTI_TIP[letter]};
  });
  return {axes:axes,code:code,consistency:null,pairs:[],mode:'pick'};
}
function personCode(p){return (p.res&&p.res.code)||p.mbti||'';}
/* 무엇으로 볼지에 따라 필요한 것이 다르다 —
   사주 전문이면 유형이 없어도 되고, MBTI 전문이면 생년월일이 없어도 된다 */

/* 검사 결과와 사주가 같은 말을 하는가, 다른 말을 하는가 */
function combine(p){
  if(!p.saju||!personCode(p))return {rows:[],hits:0,sip:p.saju?sipsinTable(p.saju):null,
    oh:p.saju?ohCount(p.saju):null,strength:p.saju?strengthOf(p.saju):null,none:true};
  var s=p.saju,sip=sipsinTable(s),oh=ohCount(s),code=personCode(p),rows=[];
  var g=sip.count;
  function ax(i){return p.res?p.res.axes[i]:null;}
  /* E/I — 비겁·식상이 많으면 밖으로, 인성이 많으면 안으로 */
  var out=g.비겁+g.식상, inn=g.인성;
  rows.push({axis:'E · I',test:code.charAt(0)==='E'?'외향(E)':'내향(I)',
    saju:out>inn?'밖으로 나가는 힘이 강함(비겁·식상 '+out+')':(inn>out?'안으로 모으는 힘이 강함(인성 '+inn+')':'반반'),
    hit:(code.charAt(0)==='E')===(out>=inn),
    read:(code.charAt(0)==='E')===(out>=inn)?'검사와 사주가 같은 말을 한다. 보이는 대로 대하면 된다.'
      :'검사에서는 '+(code.charAt(0)==='E'?'외향':'내향')+'인데 사주는 반대다. 밖에서는 '+(code.charAt(0)==='E'?'활발하지만 속으로는 혼자 정리하는':'조용하지만 마음은 밖을 향하는')+' 사람일 수 있다.'});
  /* S/N — 재성·관성은 현실, 인성·식상은 관념 */
  var real=g.재성+g.관성, idea=g.인성+g.식상;
  rows.push({axis:'S · N',test:code.charAt(1)==='S'?'감각(S)':'직관(N)',
    saju:real>idea?'현실·실리 쪽이 두껍다(재성·관성 '+real+')':(idea>real?'생각·구상 쪽이 두껍다(인성·식상 '+idea+')':'반반'),
    hit:(code.charAt(1)==='S')===(real>=idea),
    read:(code.charAt(1)==='S')===(real>=idea)?'숫자와 사실로 접근하면 그대로 통한다.'
      :'말은 '+(code.charAt(1)==='S'?'구체적으로 하지만 마음은 그림을 본다':'그림으로 하지만 결국 숫자에서 결정한다')+'. 둘 다 준비해 가야 한다.'});
  /* T/F — 관성·재성은 기준, 식상·인성은 마음 */
  var logic=g.관성+g.재성, heart=g.식상+g.인성;
  rows.push({axis:'T · F',test:code.charAt(2)==='T'?'사고(T)':'감정(F)',
    saju:logic>heart?'기준·계산이 앞선다(관성·재성 '+logic+')':(heart>logic?'마음·표현이 앞선다(식상·인성 '+heart+')':'반반'),
    hit:(code.charAt(2)==='T')===(logic>=heart),
    read:(code.charAt(2)==='T')===(logic>=heart)?'근거로 설득하면 된다. 감정 호소는 아껴라.'
      :'겉은 '+(code.charAt(2)==='T'?'논리지만 결정 순간에는 사람을 본다':'따뜻하지만 조건이 안 맞으면 냉정해진다')+'.'});
  /* J/P — 관성·인성은 틀, 식상·비겁은 자유 */
  var fix=g.관성+g.인성, free=g.식상+g.비겁;
  rows.push({axis:'J · P',test:code.charAt(3)==='J'?'판단(J)':'인식(P)',
    saju:fix>free?'틀과 순서를 지키는 힘(관성·인성 '+fix+')':(free>fix?'벌이고 바꾸는 힘(식상·비겁 '+free+')':'반반'),
    hit:(code.charAt(3)==='J')===(fix>=free),
    read:(code.charAt(3)==='J')===(fix>=free)?'일정을 정해 주면 그대로 간다.'

function fitCalc(me,cl){
  var a=me.saju,b=cl.saju,mc=personCode(me),cc=personCode(cl),items=[],sj=50,mb=50;
  var hasS=!!(a&&b), hasM=!!(mc&&cc), hasB=!!(me.blood&&cl.blood), bl=null;
  var jr=hasS?jiRel(a.dj,b.dj):null, gr=hasS?ganRel(a.dg,b.dg):null, of1={lack:[],filled:[]};
  if(hasS){
    items.push({k:'일지 관계',v:jr.k,s:jr.s,txt:jr.txt}); sj+=jr.s;
    items.push({k:'일간 관계',v:gr.k,s:gr.s,txt:gr.txt}); sj+=gr.s;
    of1=ohFill(ohCount(a),ohCount(b));
    var ofS=of1.filled.length?12:(of1.lack.length?-3:0);
    items.push({k:'오행 보완',v:of1.filled.length?of1.filled.join('·')+' 채워줌':(of1.lack.length?'못 채움':'해당 없음'),s:ofS,
      txt:of1.filled.length?'내게 없는 '+of1.filled.join('·')+' 기운을 상대가 갖고 있다. 내가 못 하는 이야기를 상대가 편하게 받는다.'
        :'서로 없는 것을 채워주지는 않는다. 대화의 폭을 내가 넓혀야 한다.'});
    sj+=ofS;
  }
  if(hasM)['SN','TF','JP','EI'].forEach(function(k){
    var i=({EI:0,SN:1,TF:2,JP:3})[k];
    var same=mc.charAt(i)===cc.charAt(i), r=same?MB_COMPAT[k].same:MB_COMPAT[k].diff;
    items.push({k:'성향 '+({EI:'말의 양',SN:'설명 방식',TF:'결정 기준',JP:'속도'})[k],
      v:mc.charAt(i)+' vs '+cc.charAt(i),s:r.s,txt:r.txt,mb:true});
    mb+=r.s*1.1;
  });
  /* 사주가 좋다고 상담이 되는 게 아니고, 성향이 어긋난다고 안 되는 것도 아니다.
     두 쪽을 따로 매기고 반반으로 합친다. */
  if(hasB){
    bl=bloodScore(me.blood,cl.blood);
    items.push({k:'혈액형',v:me.blood+'형 vs '+cl.blood+'형',s:Math.round((bl-60)/2),bloodRow:true,
      txt:bloodFit(me.blood,cl.blood)});
  }
  sj=hasS?Math.max(8,Math.min(98,Math.round(sj))):null;
  mb=hasM?Math.max(8,Math.min(98,Math.round(mb))):null;
  var parts=[];if(sj!==null)parts.push(sj);if(mb!==null)parts.push(mb);if(bl!==null)parts.push(bl);
  var sc=parts.length?Math.round(parts.reduce(function(x,y){return x+y;},0)/parts.length):50;
  var lv=sc>=80?{t:'아주 잘 맞음',c:'#00A05A',bg:'#E8F8F0'}:sc>=65?{t:'잘 맞는 편',c:'#1B64DA',bg:'#E8F3FF'}
    :sc>=50?{t:'보통 — 준비하면 된다',c:'#C77700',bg:'#FFF6E5'}:{t:'어긋나기 쉬움 — 방식을 바꿔야 한다',c:'#F04452',bg:'#FEECEE'};
  return {score:sc,sajuScore:sj,mbtiScore:mb,bloodScore:bl,level:lv,items:items,jr:jr,gr:gr,fill:of1,hasS:hasS,hasM:hasM,hasB:hasB};
}
/* 상담 전략 — 축마다 나 / 상대 / 이대로 하면 / 이렇게 바꿔라 */
function talkPlan(me,cl){
  var mc=personCode(me),cc=personCode(cl),rows=[],i;
  var keys=['EI','SN','TF','JP'];
  for(i=0;i<4;i++){
    var k=keys[i],M=mc.charAt(i),Y=cc.charAt(i),ST=STRATEGY[k],box;
    if(M===Y)box=(M===ST.SS.me)?ST.SS:ST.II;
    else box=(M===ST.ME.me)?ST.ME:ST.MI;
    rows.push({label:ST.label,me:M,you:Y,same:M===Y,risk:box.risk,fix:box.fix});
  }
  var hasS=!!cl.saju;
  var sip=hasS?sipsinTable(cl.saju):null,top=hasS?sip.top:'',meta=hasS?SIP_META[top]:null;
  var oh=hasS?ohCount(cl.saju):null,lack=[],k2;
  if(oh)for(k2 in oh)if(oh[k2]===0)lack.push(k2);
  var luck=hasS?yearLuck(cl.saju):null;
  var opens=meta?[meta.open]:[];
  if(cc.charAt(1)==='S')opens.push('"오늘은 숫자 세 개만 보고 가시죠 — 월 보험료, 보장금액, 기간."');
  else opens.push('"지금 준비하시는 게 5년 뒤 어떤 그림이 되는지부터 말씀드릴게요."');
  if(cc.charAt(2)==='F')opens.push('"이 돈이 결국 누구를 지키는 돈인지부터 여쭤볼게요."');
  else opens.push('"비교표 한 장 준비했습니다. 근거부터 보시죠."');
  var avoid=meta?[meta.avoid]:[];
  if(cc.charAt(3)==='P')avoid.push('"오늘 결정하셔야 합니다" — 재촉은 바로 닫히게 만든다.');
  else avoid.push('"천천히 보시고 연락 주세요" — 이 유형은 기한이 없으면 흘려보낸다.');
  if(cc.charAt(0)==='I')avoid.push('말 끊기. 5초 침묵을 못 견디고 내가 채우면 상대는 입을 닫는다.');
  else avoid.push('자료만 내밀고 조용히 있기. 이 유형은 말이 오가야 마음이 열린다.');
  var closes=meta?[meta.close]:[];
  if(cc.charAt(3)==='J')closes.push('"다음 주 화요일 오전, 서류 정리해서 다시 뵙겠습니다" — 날짜를 먼저 박는다.');
  else closes.push('"두 가지 안을 두고 가겠습니다. 편하신 걸로 알려주세요" — 고르게 둔다.');
  return {rows:rows,sipTop:top,meta:meta,lack:lack,luck:luck,opens:opens,avoid:avoid,closes:closes,
    sameCount:rows.filter(function(r){return r.same;}).length};
}

  var p=who==='me'?S.me:S.cl;

function calcPerson(p){
  var y=num(p.y),m=num(p.m),d=num(p.d);

  var H=p.noTime?12:(p.H===''||p.H===null||p.H===undefined?12:p.H);
  p.saju=sajuCalc(y,m,d,H,p.noTime?0:(p.Mi||0),p.adj?-32:0);
  return true;

function savePerson(who){
  var p=who==='me'?S.me:S.cl;
  grab(who);
  if(!p.name){toast('이름을 넣어주세요');return;}
  var y=num(p.y),m=num(p.m),d=num(p.d);
  if(who!=='me'&&S.mode==='mbti'&&!y){
    if(!personCode(p)){toast('유형을 고르거나 48문항 검사를 해주세요');return;}
    save();S.step='board';S.tab='ice';draw();return;
  }
  if(!y||!m||!d||y<1900||y>2100||m<1||m>12||d<1||d>31){toast('생년월일을 다시 확인해 주세요 (1900~2100)');return;}
  if(!p.noTime&&(p.H===''||p.H===null||p.H===undefined)){toast('태어난 시간을 고르거나 "시간을 모릅니다"를 눌러주세요');return;}
  if(who!=='me'&&S.mode==='blood'){
    if(!p.blood){toast('혈액형을 골라주세요');return;}
    save();S.step='board';S.tab='ice';draw();return;
  }
  if(who!=='me'&&S.mode==='saju'){calcPerson(p);save();S.step='board';S.tab='ice';draw();toast('사주 풀이가 준비됐습니다');return;}
  calcPerson(p);save();
  if(!personCode(p)){toast('사주를 계산했습니다. 이제 유형을 고르거나 검사를 하세요.');draw();
    setTimeout(function(){var e=document.querySelector('.mbtigrid');if(e&&e.scrollIntoView)e.scrollIntoView({block:'center',behavior:'smooth'});},60);return;}
  if(who==='me'){toast('내 카드를 저장했습니다');S.step=(S.cl.name?'client':'client');draw();}
  else{S.step=ready(S.cl)?'board':'client';draw();if(ready(S.cl))toast('결과가 준비됐습니다');}
}

function pick(v){
  S.ans[S.i]=v;
  var c=$('qcard');
  if(c){var bs=c.querySelectorAll('.dot');for(var n=0;n<bs.length;n++)bs[n].classList.toggle('on',MBTI_SCALE[n].v===v);}
  save();
  setTimeout(function(){

function qPrev(){if(S.i>0){S.i--;save();draw();}}

function finishTest(){
  var miss=[],i;for(i=0;i<48;i++)if(!S.ans[i])miss.push(i);
  if(miss.length){S.i=miss[0];draw();toast('아직 답하지 않은 문항이 '+miss.length+'개 있습니다');return;}
  var r=scoreAns(S.ans),p=(S.target==='me')?S.me:S.cl;
  p.res=r;p.mbti=r.code;
  S.step=(S.target==='me')?'me':(ready(S.cl)?'board':'client');
  save();draw();toast('검사 완료 — '+r.code);
}

var GUEST={on:false};

  var q=['for=client','mode='+encodeURIComponent(S.mode)];
  if(BRAND.org)q.push('org='+encodeURIComponent(BRAND.org));
  if(BRAND.hq)q.push('hq='+encodeURIComponent(BRAND.hq));
  if(BRAND.aplus)q.push('logo1='+encodeURIComponent(BRAND.aplus));

  if(who)q.push('agent='+encodeURIComponent(who));

function yongsin(s){
  var mine=GAN_OH[s.dg],st=strengthOf(s),jh=johu(s),oh=ohCount(s);
  var sik=OH_SAENG[mine],jae=OH_GEUK[mine],gwan=ohGeukBy(mine),inn=ohGenOf(mine);
  var need,avoid,why,how;
  if(st.level==='신강'){
    need=[sik,jae,gwan];avoid=[inn,mine];
    why='기운이 넘치십니다. 여기에 더 채워 드리면 넘쳐 흘러 버립니다.';
    how='쓰고 내보내야 풀리는 사주이십니다. 담아두면 체하십니다.';
  }else if(st.level==='신약'){
    need=[inn,mine];avoid=[jae,gwan];
    why='기운이 모자라십니다. 여기서 더 쓰라고 하면 꺾이십니다.';
    how='먼저 채우고 나서 쓰셔야 하는 사주이십니다. 도와주는 사람이 반드시 있어야 하십니다.';
  }else{
    need=[jh.need,sik];avoid=[];
    why='기운이 고르십니다. 크게 모자라지도, 넘치지도 않으십니다.';
    how='철에 맞춰 조절만 하시면 되는 사주이십니다. 이런 사주가 오래 가십니다.';
  }
  var primary=need[0];
  if(jh.season==='겨울'||jh.season==='여름'){       /* 한철에 태어나면 계절 보정이 먼저다 */
    primary=jh.need;
    if(need.indexOf(primary)<0)need.unshift(primary);
  }
  need=uniqArr(need);avoid=uniqArr(avoid);
  var i=avoid.indexOf(primary);if(i>=0)avoid.splice(i,1);
  return {mine:mine,st:st,jh:jh,oh:oh,need:need,avoid:avoid,primary:primary,
    why:why,how:how,urgent:(oh[primary]===0),sik:sik,jae:jae,gwan:gwan,inn:inn};
}

   ⛔ 그런데 여기가 1번(지어내지 않는다)과 부딪히기 제일 쉬운 자리입니다.
     그래서 <b>규칙을 둡니다</b> —
       ① 한 줄도 지어내지 않는다. 아래 모든 줄은 십신 개수 · 일간 강약 ·
          공망 · 대운처럼 <b>이미 계산해 둔 값</b>에서만 나온다. 근거(why)를
          줄마다 달아 두어 나중에 되짚을 수 있게 한다.

          물건을 파는 자리가 되면 그 순간 이 앱은 못 쓰는 앱이 된다 (2번).

var HIT_BAN=/병|암|사고|다치|죽|수명|요절|단명|이혼|파산/;
function ageKo(n){
  var T=['','열','스물','서른','마흔','쉰','예순','일흔','여든','아흔'],
      O=['','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉'];
  n=Number(n)||0; if(n<1||n>99)return n+'세';
  var t=Math.floor(n/10),o=n%10;
  return (T[t]||'')+(o?(t?O[o]:['','한','두','세','네','다섯','여섯','일곱','여덟','아홉'][o]):'')+'살';
}
/* 패에서 바로 읽히는 것만 고릅니다. 센 신호가 위로 옵니다. */
function shrHits(s,y){
  var c=sipsinTable(s).count, weak=(y.st.level==='신약'), out=[];
  function add(w,t,why){ if(HIT_BAN.test(t))return; out.push({w:w,t:t,why:why}); }

  if(c.관성>=3) add(9,'위에서 누르는 사람이 늘 있으셨습니다. 그만두고 싶을 때마다 참으셨지요.',
                    '관성 '+c.관성+'개 — 여덟 자 가운데 나를 누르는 글자가 이만큼입니다');
  if(c.관성===0) add(7,'매인 자리를 오래 못 견디십니다. 시키는 대로만 하라는 곳에서는 끝까지 못 가셨을 겁니다.',
                     '관성 0개 — 나를 눌러 세우는 글자가 하나도 없습니다');
  if(c.인성===0) add(8,'기댈 데가 없으셨습니다. 힘들다는 소리를 할 데가 마땅치 않으셨지요.',
                     '인성 0개 — 나를 받쳐 주는 글자가 하나도 없습니다');
  if(c.인성>=3) add(6,'생각이 먼저 갑니다. 정해 놓고도 밤에 한참 뒤척이십니다.',

  if(c.비겁===0) add(7,'끝까지 같이 가는 사람이 없으십니다. 사람은 많은데 혼자라고 느끼실 때가 있으시지요.',

  if(c.비겁>=3) add(6,'사람이 끊이지 않습니다. 그런데 내 것이 자꾸 밖으로 나갑니다.',
                    '비겁 '+c.비겁+'개 — 같은 편이 많으면 나눠 쓰게 됩니다');
  if(c.식상===0) add(6,'속에 담아 두십니다. 터뜨릴 데가 없어 혼자 삭이신 적이 많으시지요.',

  if(c.식상>=3) add(6,'말이 먼저 나갑니다. 그 말 때문에 손해 보신 적이 한 번은 있으십니다.',

  if(c.재성>=2&&weak) add(9,'돈은 보입니다. 그런데 손에 안 쥐어집니다. 버셔도 남지를 않으시지요.',
                          '재성 '+c.재성+'개인데 일간이 신약 — 쥘 손보다 쥘 것이 큽니다');
  if(c.재성===0) add(7,'모으는 재주로 사시는 분이 아닙니다. 쥐려고 하실수록 더 빠져나갔을 겁니다.',
                     '재성 0개 — 내가 다루는 글자가 하나도 없습니다');
  out.sort(function(a,b){return b.w-a.w;});
  return out.slice(0,3);

function shrTurn(du,age){
  var i,n=null;
  for(i=0;i<du.list.length;i++)if(du.list[i].age>age){n=du.list[i];break;}
  if(!n)return null;

}

var INS_AX=[

  lo:'먼저 말을 못 걸지. 그래서 소개 끊기는 달은 그대로 비는 달이야 — <b>벌이를 운에 맡기고 있는 거다.</b>'},

 {k:'지속', t:'오래 끌고 가기', why:'관성(매듭) + 토(土) 기운',
  hi:'한 번 잡으면 오래 가. 이 일에서 제일 큰 밑천이니 그거 믿고 가라.',
  lo:'오래를 못 끌어. 계약은 따는데 유지가 안 되면 <b>그건 남의 계약이야</b> — 수수료는 환수로 돌아온다.'},
 {k:'숫자', t:'숫자 다루기',    why:'인성(들여 익힘) + 금(金) 기운',
  hi:'표하고 숫자는 손에 붙어. 그건 네 무기다.',
  lo:'숫자를 오래 못 봐. 그러니 매번 밤을 새지 — <b>밤새워 만든 표일수록 틀린다.</b> 틀을 짜 두고 채워 넣어.'},
 {k:'자립', t:'혼자 버티기',    why:'비겁(같은 편) + 일간 강약',
  hi:'혼자서도 굴러가. 그 힘으로 여기까지 온 거다.',
  lo:'혼자 두면 처져. 의지가 모자라서가 아니라 <b>생긴 게 그래</b> — 다짐으로는 안 고쳐진다. 옆에 사람을 붙여.'}
];
/* 0~10. 모두 계산된 값에서만 나옵니다 — 손으로 박은 점수가 없습니다. */
function insFit(s){
  var c=sipsinTable(s).count, oh=ohCount(s), st=strengthOf(s);
  var lv=(st.level==='신강'?2:st.level==='중화'?1:0);
  function cap(n){return Math.max(0,Math.min(10,Math.round(n)));}
  var v={
    만남: cap(c.식상*2.2 + c.비겁*1.6 + 2),
    거절: cap(lv*2.2 + c.인성*1.8 + c.비겁*0.8 + 1),
    지속: cap(c.관성*1.9 + oh['토']*1.1 + 1),
    숫자: cap(c.인성*1.9 + oh['금']*1.2 + 1),
    자립: cap(c.비겁*2.2 + lv*1.8 + 1)
  };
  var rows=INS_AX.map(function(a){
    var n=v[a.k];
    return {k:a.k,t:a.t,n:n,why:a.why,hi:n>=6,
      say:(n>=6?a.hi:a.lo),
      src:(a.k==='만남'?('식상 '+c.식상+' · 비겁 '+c.비겁)
         : a.k==='거절'?('일간 '+st.level+' · 인성 '+c.인성)
         : a.k==='지속'?('관성 '+c.관성+' · 토 '+oh['토'])
         : a.k==='숫자'?('인성 '+c.인성+' · 금 '+oh['금'])
         :              ('비겁 '+c.비겁+' · 일간 '+st.level))};
  });
  var up=rows.filter(function(r){return r.hi;}), dn=rows.filter(function(r){return !r.hi;});
  return {rows:rows,up:up,dn:dn,cnt:c,oh:oh,st:st,
    sum:Math.round(rows.reduce(function(a,r){return a+r.n;},0)/rows.length*10)/10};
}
/* 일을 푸는 방식 — 용신에서 곧바로 나옵니다 */
/* ── 독한 소리 — 아픈 말도 <b>여덟 자에서 나온 것만</b> 합니다 (1번)
   사장님 말씀 2026-11-22 「냉정하고 좋은말만 하지말고 센것도 디테일하게」.
   ⚠ 세게 말하는 것과 지어내는 것은 다릅니다. 규칙마다 센 수가 붙고, 화면에
     그 수를 같이 적습니다. 병·수명·이혼·파산은 HIT_BAN 이 그대로 버립니다. */
function meHard(s){
  var c=sipsinTable(s).count, oh=ohCount(s), st=strengthOf(s), weak=(st.level==='신약'), out=[];
  function add(w,t,why){ if(HIT_BAN.test(t))return; out.push({w:w,t:t,why:why}); }

  if(c.인성===0&&weak) add(10,'배울 틈도 없이 버티기만 했지. 그러니 십 년을 해도 삼 년치만 쌓여 — <b>같은 벽에 매번 처음처럼 부딪히는 거다.</b>',
    '인성 0개 · 일간 신약 — 받쳐 주는 글자가 없는데 쓸 힘도 모자랍니다');
  if(c.재성>=2&&weak) add(10,'버는 족족 나가지. 더 벌어 봐야 더 나갈 뿐이야 — 쥐는 손이 작은 거라 수입이 두 배 되도 남는 건 똑같다.',
    '재성 '+c.재성+'개인데 일간이 신약 — 쥘 손보다 쥘 것이 큽니다');
  if(c.관성>=2&&c.인성===0&&weak) add(10,'받쳐 주는 것 하나 없이 눌리기만 했어. 이 자리가 제일 고단한 자리다 — 버티는 데 힘을 다 쓰니 나아갈 몫이 안 남지.',
    '관성 '+c.관성+'개 · 인성 0개 · 일간 신약');
  if(c.관성>=3&&weak) add(9,'참는 걸 성실이라 부르고 있구나. 그 둘은 달라. <b>눌려서 보낸 세월은 경력으로 안 쌓인다.</b>',
    '관성 '+c.관성+'개 · 일간 신약');
  if(st.level==='신강'&&c.인성>=2) add(9,'제 판단이 맞다고 믿지. 남의 말은 듣는 시늉만 하고 — 그러니 틀렸을 때 아무도 안 말려 주는 거야.',
    '일간 신강 · 인성 '+c.인성+'개 — 힘도 있고 제 생각을 받쳐 주는 글자도 많습니다');
  if(c.식상===0) add(8,'속으로만 삭이지. 옆에서는 괜찮은 줄 알아 — 그러다 한 번에 터지고, 그 한 번으로 사람이 끊긴다.',
    '식상 0개 — 밖으로 내보내는 글자가 하나도 없습니다');
  if(c.비겁===0) add(8,'사람은 많지. 그런데 진짜 일 터지면 전화할 데가 없어. <b>인맥하고 내 편은 다른 거다.</b>',
    '비겁 0개 — 나와 같은 편 글자가 하나도 없습니다');
  if(c.관성===0) add(8,'매인 자리를 못 견디지. 그래서 자주 옮겼고, 옮길 때마다 쌓아 둔 걸 거기 두고 왔어.',
    '관성 0개 — 나를 눌러 세우는 글자가 하나도 없습니다');
  if(c.식상>=2&&c.관성>=2) add(8,'하고 싶은 것하고 해야 하는 것이 늘 부딪히지. 둘 다 쥐고 있으니 <b>둘 다 반쪽인 거다.</b>',
    '식상 '+c.식상+'개 · 관성 '+c.관성+'개 — 내보내는 글자와 누르는 글자가 같이 셉니다');
  if(st.level==='신강'&&c.비겁>=3) add(8,'밀어붙이는 힘은 넉넉해. 그 힘으로 <b>사람을 밀어내고 있는 게</b> 탈이지.',
    '일간 신강 · 비겁 '+c.비겁+'개');
  if(c.인성>=3) add(7,'준비가 덜 됐다고? 그 말은 평생 안 끝나. 재는 동안 때는 그냥 지나간다.',
    '인성 '+c.인성+'개 — 받아 들이고 재는 글자가 많습니다');
  if(c.식상>=3) add(7,'말이 먼저 나가지. 그 말로 번 것보다 잃은 게 많을 거야 — <b>너만 모르고 있어.</b>',
    '식상 '+c.식상+'개');
  if(c.비겁>=3) add(7,'사람 좋다는 소리 듣지. 그 소리 값으로 <b>제 몫을 내주고 있는 거다.</b>',
    '비겁 '+c.비겁+'개 — 같은 편이 많으면 나눠 쓰게 됩니다');
  if(c.재성===0) add(7,'모으는 재주로 사는 사람이 아니야. 쥐려고 애쓸수록 더 빠져나가 — 쥐는 길 말고 <b>버는 길</b>을 넓혀.',
    '재성 0개 — 내가 다루는 글자가 하나도 없습니다');
  if(c.인성>=2&&c.식상===0) add(7,'들이기만 하고 내보내질 않아. 머리에는 쌓였는데 손에 잡히는 게 없지.',
    '인성 '+c.인성+'개 · 식상 0개');
  var zero=['목','화','토','금','수'].filter(function(k){return oh[k]===0;});
  if(zero.length>=2) add(6,'없는 기운이 둘이야. 사람이 고루 될 리가 없는데 <b>안 되는 쪽을 자꾸 제 탓으로 돌리고 있어.</b>',
    '오행에 '+zero.join('·')+' 가 0개 — 여덟 자에 아예 없는 기운입니다');

  out.sort(function(a,b){return b.w-a.w;});

  var s=cl.saju,sip=s?sipsinTable(s):null,oh=s?ohCount(s):null;

  var axes=!code?'':'<div class="card"><h2><span class="n">네 축</span>내 방식 — 이대로 하면 되는 것과 바꿔야 하는 것</h2>'+
    '<div class="tbwrap stack"><table class="tb"><thead><tr><th style="width:52px">축</th><th style="width:200px">이렇게 하세요</th><th>왜</th></tr></thead><tbody>'+
    code.split('').map(function(ch){
      var a=SELL_AX[ch];if(!a)return '';
      return '<tr><td class="head"><b style="font-size:17px;color:#1B64DA">'+ch+'</b></td>'+
        '<td class="full" data-l="이렇게"><b>'+esc(a.t)+'</b></td>'+
        '<td class="full" data-l="왜">'+a.d+'</td></tr>';}).join('')+
    '</tbody></table></div>'+
    '<div style="font-size:12.5px;font-weight:900;color:#F04452;margin-top:16px">🚫 이 사람이 가장 자주 하는 실수</div>'+
    code.split('').map(function(ch){var a=SELL_AX[ch];return a?'<div class="talk bad">'+esc(a.no)+'</div>':'';}).join('')+
  '</div>';
  /* 숫자 vs 감성 비중 */
  var numW=Math.round(Math.max(20,Math.min(80, 50 + (code&&code.charAt(2)==='T'?14:-14) + (sip?(sip.count.재성*5-sip.count.인성*3):0) )));

    '<p class="sub">이 사람이 <b>자연스럽게 잘 하는 쪽</b>의 비율입니다. 반대쪽은 의식해서 준비해야 채워집니다.</p>'+
    '<div class="mix"><span style="width:'+numW+'%;background:#1B64DA">📊 숫자 '+numW+'%</span>'+
    '<span style="width:'+(100-numW)+'%;background:#F0637E">💗 마음 '+(100-numW)+'%</span></div>'+
    '<div class="note '+(numW>=62?'info':(numW<=38?'warn':'ok'))+'">'+
    (numW>=62?'숫자로 설명하는 게 편한 사람입니다. <b>마지막 한 문장만 사람 이야기로</b> 닫으세요. "결국 가족이 받는 돈입니다." 이 한 줄이 계약을 만듭니다.'
     :numW<=38?'마음으로 여는 게 편한 사람입니다. <b>표 한 장을 꼭 들고</b> 가세요. 공감은 문을 열고, 숫자가 결재를 통과시킵니다.'
     :'양쪽을 다 쓸 수 있는 배합입니다. 상대가 숫자형이면 숫자부터, 감성형이면 사람부터 — <b>순서만 바꿔서</b> 쓰세요.')+'</div>'+
  '</div>';
  /* 사주 기반 영업 동기와 함정 */

    var top=sip.top,m=SIP_META[top];
    var lacks=[];for(var k in OH_META)if(!oh[k])lacks.push(k);
    return '<div class="card"><h2><span class="n">사주</span>나를 움직이는 힘 — '+top+' 우세</h2>'+
      '<div class="tbwrap stack"><table class="tb"><tbody>'+
      [['마음의 결',m.mind],['내가 원하는 것',m.want],
       ['내 영업의 함정',({비겁:'남의 방식을 안 받아들여 혼자 헤맵니다. 선임 동행 3회만은 그대로 따라 해 보세요.',
         식상:'말이 앞서 숫자 확인을 건너뜁니다. 제안 전에 수치를 한 번 더 보세요.',
         재성:'돈이 되는 건에만 집중해 작은 건을 버립니다. 소개는 작은 건에서 나옵니다.',
         관성:'틀을 벗어나는 개척을 부담스러워합니다. 정해진 채널 안에서 깊게 파세요.',

      '</tbody></table></div>'+
      (lacks.length?'<div class="note warn">사주에 <b>'+lacks.join('·')+'</b> 기운이 없습니다 — '+
        lacks.map(function(k){return OH_META[k].emo+' '+k+'('+OH_META[k].key+')';}).join(', ')+
        ' 쪽은 타고난 힘이 아니라 <b>배워서 채워야 하는 영역</b>입니다. 그 방향의 영업을 주력으로 두지 마세요.</div>':'')+
    '</div>';
  })();
  /* 하루 루틴 */
  var rt=sellRoutine(sc);
  var rout='<div class="card"><h2><span class="n">루틴</span>하루에 이만큼이면 됩니다</h2>'+
    '<div class="curve">'+
      '<div class="cv"><div class="t">신규 접촉</div><div class="v" style="color:#F0637E">'+rt.nw+'</div><div class="d">하루 기준</div></div>'+
      '<div class="cv"><div class="t">면담 약속</div><div class="v" style="color:#1B64DA">'+rt.mt+'</div><div class="d">주 기준</div></div>'+
      '<div class="cv"><div class="t">제안·클로징</div><div class="v" style="color:#00A05A">'+rt.pr+'</div><div class="d">주 기준</div></div>'+
    '</div>'+
    '<div class="note '+(sc.v.keep<50?'warn':'ok')+'">'+rt.note+'</div>'+
    '<div class="note info">가장 맞는 채널은 <b>'+esc(salesChannels(sc)[0].n)+'</b>입니다. 이 활동량을 그 채널에 쓰세요.</div>'+
  '</div>';
  /* 맞는 고객 · 거절 대응 · 클로징 */
  var cust=!ty?'':'<div class="card"><h2><span class="n">고객</span>나와 잘 맞는 고객, 어려운 고객</h2>'+
    '<div class="tbwrap stack"><table class="tb"><tbody>'+
    '<tr><td class="head"><b style="color:#00A05A">편한 고객</b></td><td class="plain">'+(ty.fit||[]).join(' · ')+
      ' — 내 말의 속도와 결정 방식이 비슷합니다. 여기서는 내 방식 그대로 가세요.</td></tr>'+
    '<tr><td class="head"><b style="color:#F04452">어려운 고객</b></td><td class="plain">'+(ty.rub||[]).join(' · ')+
      ' — 내 방식이 그대로는 안 통합니다. <b>속도를 상대에 맞추고</b> 자료를 한 장 더 준비하세요.</td></tr>'+
    '</tbody></table></div>'+
    '<div style="font-size:12.5px;font-weight:900;color:#C77700;margin-top:16px">🛡 거절을 들었을 때</div>'+
    '<div class="talk">"생각해 보겠다" → <b>"네, 당연합니다. 어떤 부분이 가장 걸리세요?"</b> — 거절을 질문으로 바꿉니다.</div>'+
    '<div class="talk">"돈이 없다" → <b>"지금 금액을 맞추는 게 목적이 아닙니다. 순서를 정하는 게 목적입니다."</b></div>'+
    '<div class="talk">"이미 있다" → <b>"잘하셨습니다. 겹치는 부분만 같이 확인해 드리겠습니다."</b> — 비교가 아니라 점검으로.</div>'+
    '<div style="font-size:12.5px;font-weight:900;color:#00A05A;margin-top:16px">🤝 이 사람에게 맞는 클로징</div>'+
    '<div class="talk good">'+esc(ty.close||'')+'</div>'+
    (sc.v.close<50?'<div class="note bad">클로징이 약한 편입니다. <b>위 문장을 그대로 외워서</b> 쓰세요. 상황에 맞춰 바꾸려 하면 그 자리에서 말이 안 나옵니다.</div>'
                  :'<div class="note ok">클로징은 강점입니다. 요청하는 걸 미루지 마세요. 이 사람은 그 자리에서 물어야 성과가 납니다.</div>')+
  '</div>';
  var coach=agentOnly('<div class="card"><h2><span class="n">🔒 리더용</span>이 사람을 어떻게 가르칠까</h2>'+
    '<div class="tbwrap stack"><table class="tb"><tbody>'+
    '<tr><td class="head"><b>가르치는 방식</b></td><td class="plain">'+esc(ty&&ty.work?ty.work:'기준과 절차를 먼저 알려 주세요.')+'</td></tr>'+
    '<tr><td class="head"><b>첫 3개월</b></td><td class="plain">'+esc(salesChannels(sc)[0].n)+'만 시키세요. 여러 채널을 동시에 주면 전부 얕아집니다.</td></tr>'+
    '<tr><td class="head"><b>칭찬 포인트</b></td><td class="plain">'+(sc.v.keep>=62?'성과가 아니라 <b>꾸준함</b>을 짚어 주세요. 이 사람은 그걸로 더 갑니다.'
      :'성과가 없어도 <b>활동량 숫자</b>를 먼저 칭찬하세요. 성과로만 평가하면 활동량이 먼저 무너집니다.')+'</td></tr>'+
    '<tr><td class="head"><b>하지 말 것</b></td><td class="plain">'+(code&&code.charAt(3)==='P'?'빡빡한 일일 보고. 숨 막혀서 보고 자체를 피하게 됩니다. 주 1회로 묶으세요.'
      :'계획을 자꾸 바꾸는 것. 이 사람은 바뀐 계획에 적응하는 데 에너지를 다 씁니다.')+'</td></tr>'+
    '</tbody></table></div></div>');
  var pr='<div class="card"><button class="btn line sm" onclick="window.print()">🖨 이 리포트 인쇄 · PDF로 저장</button></div>';
  return head+axes+mix+sj+rout+cust+coach+pr+footNote();
}
function tabSum(){

    '<div class="row" style="margin-top:11px"><button class="btn ghost sm" onclick="goTab(\'ice\')">덕담 더 보기 →</button>'+

    '<div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="goTab(\'worry\')">💬 고민 상담 →</button>'+

      (cb.hits>=3?(S.view==='agent'?'읽히는 대로 대하면 됩니다.':'보이는 모습과 속이 같은, 한결같은 분이십니다.')
        :'겉으로 보이는 모습과 속이 다른 부분이 있습니다. '+(S.view==='agent'?'성향 파악 탭에서 어디가 다른지 보세요.':'상황에 따라 다른 얼굴을 쓰실 수 있다는 뜻입니다.'))+'</div>')+

      (plan?('<div class="hr"></div><h2 style="font-size:14px">오늘 이 세 가지만 지키세요</h2>'+
        plan.rows.filter(function(r){return !r.same&&r.label!=='말의 양';}).concat(plan.rows.filter(function(r){return !r.same&&r.label==='말의 양';})).slice(0,2).map(function(r){
          return '<div class="talk">✅ <b>'+esc(r.label)+'</b> — '+esc(r.fix)+'</div>';}).join('')+
        (plan.opens.length?'<div class="talk good">🗣 첫마디 — '+esc(plan.opens[0])+'</div>':'')+

        '<div class="row" style="margin-top:12px"><button class="btn ghost sm" onclick="goTab(\'talk\')">상담 전략 →</button>'+
        '<button class="btn ghost sm" style="color:#F04452" onclick="goTab(\'risk\')">🔒 리스크 진단 →</button></div>'):'')+
    '</div>';
  }
  return '<div class="grid hd"><div class="sticky">'+left+'</div><div>'+right+'</div></div>'+footNote();
}

function sinsalOf(s){
  var jis=[s.yj,s.mj,s.dj,s.hj],out=[],i,g,base=[s.yj,s.dj];
  function grpOf(j){for(i=0;i<SAM_GROUP.length;i++)if(SAM_GROUP[i].ji.indexOf(j)>=0)return SAM_GROUP[i];return null;}
  var hit={};
  base.forEach(function(b){
    g=grpOf(b);if(!g)return;
    if(jis.indexOf(g.do)>=0)hit['도화']=JI[g.do];
    if(jis.indexOf(g.yeok)>=0)hit['역마']=JI[g.yeok];
    if(jis.indexOf(g.hwa)>=0)hit['화개']=JI[g.hwa];
  });
  var ce=CHEONEUL[s.dg]||[];
  for(i=0;i<jis.length;i++)if(ce.indexOf(jis[i])>=0)hit['천을귀인']=JI[jis[i]];
  for(var k in hit)out.push({name:k,ji:hit[k],meta:SINSAL_META[k]});
  return out;
}

function johu(s){
  var se=SEASON[s.mj],oh=GAN_OH[s.dg],txt='',need='';
  if(se==='겨울'){txt='한겨울에 태어난 '+oh+'(木火土金水 중 '+oh+') 기운이십니다. 몸을 데워줄 불(火) 기운이 곁에 있어야 일이 잘 풀리십니다.';need='화';}
  else if(se==='여름'){txt='한여름에 태어난 '+oh+' 기운이십니다. 열을 식혀줄 물(水) 기운이 있어야 멀리 오래 가십니다.';need='수';}
  else if(se==='봄'){txt='봄에 태어난 '+oh+' 기운이십니다. 뻗어나가는 힘이 강해서 방향만 잡히면 빠르게 자라십니다.';need='금';}
  else{txt='가을에 태어난 '+oh+' 기운이십니다. 거두고 매듭짓는 기운이라 결정이 분명하십니다.';need='화';}
  return {season:se,need:need,txt:txt};
}
/* 대운 — 10년마다 바뀌는 큰 흐름 */
function daeun(s,gender,noTime){
  var yangYear=(GAN_YIN[s.yg]===0), male=(gender!=='F');
  var forward=(yangYear&&male)||(!yangYear&&!male);
  var days=forward?(s.term.toNextDays||0):(s.term.toPrevDays||0);
  var start=Math.max(1,Math.round(days/3));
  var list=[],i,idx=((s.mg%10)*1);
  var mIdx=(function(){ /* 월주의 60갑자 자리 */
    for(var n=0;n<60;n++)if(n%10===s.mg&&n%12===s.mj)return n;return 0;})();
  for(i=1;i<=8;i++){
    var k=((mIdx+(forward?i:-i))%60+60)%60;
    list.push({age:start+(i-1)*10,g:k%10,j:k%12,
      sip:sipsinOf(s.dg,k%10),sipJ:sipsinOf(s.dg,JI_HIDE[k%12]),un:unseong(s.dg,k%12)});
  }
  return {forward:forward,start:start,list:list,
    why:(yangYear?'양(陽)년':'음(陰)년')+'에 태어난 '+(male?'남자':'여자')+'라 '+(forward?'순행':'역행')+'합니다'};
}
function ageNow(y,m,d){
  var t=new Date(),a=t.getFullYear()-Number(y);
  if(t.getMonth()+1<Number(m)||(t.getMonth()+1===Number(m)&&t.getDate()<Number(d)))a--;
  return a;
}

    '<div class="tbwrap stack"><table class="tb"><thead><tr><th style="width:84px">순서</th><th style="width:110px">기능</th><th style="width:150px">무엇을 보는가</th><th>상담에서</th></tr></thead><tbody>'+
    order.map(function(o){var m=FUNC_META[o[1]];
      return '<tr><td class="head"><b>'+o[0]+'</b></td><td data-l="기능"><b>'+o[1]+'</b> '+m.n+'</td>'+
        '<td data-l="무엇을">'+m.t+' — '+esc(m.line)+'</td>'+
        '<td class="full" data-l="상담에서">'+esc(m.ins)+'</td></tr>';}).join('')+
    '</tbody></table></div>'+
    '<div class="note warn"><b>스트레스를 받으면</b> — '+esc(STRESS[fs.inf])+' 이럴 때는 설득하지 말고 시간을 드리는 편이 낫습니다.</div>'+
  '</div>';
  var t3=ty.str?'<div class="card"><h2><span class="n">3</span>강점 · 조심할 점 · 궁합</h2>'+
    '<div class="tbwrap stack"><table class="tb"><thead><tr><th style="width:36px">#</th><th>강점</th><th>'+(S.view==='agent'?'조심할 점':'조금만 더 하시면 좋은 것')+'</th></tr></thead><tbody>'+
    ty.str.map(function(x,i){return '<tr><td class="head">'+(i+1)+'</td><td class="full" data-l="강점">'+esc(x)+'</td><td class="full" data-l="조심">'+esc(ty.care[i]||'')+'</td></tr>';}).join('')+
    '</tbody></table></div>'+
    '<div class="talk good">💚 잘 맞는 유형 — '+ty.fit.map(function(c){return c+'('+(MBTI_TYPES[c]||{}).nick+')';}).join(' · ')+'</div>'+
    '<div class="talk bad">🧡 부딪히기 쉬운 유형 — '+ty.rub.map(function(c){return c+'('+(MBTI_TYPES[c]||{}).nick+')';}).join(' · ')+'</div>'+
  '</div>':'';
  var t4='<div class="card"><h2><span class="n">4</span>상담 진행표</h2>'+
    '<div class="tbwrap stack"><table class="tb"><thead><tr><th style="width:116px">단계</th><th>이렇게</th></tr></thead><tbody>'+
    [['1 · 첫 만남',ty.open],['2 · 자료',ty.doc],['3 · 속도',ty.pace],['4 · 마무리',ty.close],['5 · 반론',ty.obj],['함께 일할 때',ty.work]]
      .map(function(r){return '<tr><td class="head"><b>'+r[0]+'</b></td><td class="plain">'+esc(r[1]||'')+'</td></tr>';}).join('')+
    '</tbody></table></div></div>';
  return head+t1+t2+t3+t4+footNote();
}

/* ══════════════════════════════════════════════════════════════════
   18. 인생 운 — 살면서 알고 있어야 할 것들
   ══════════════════════════════════════════════════════════════════
   사주를 보는 이유는 앞일을 맞히려는 게 아니라, 내가 어디에 강하고
   어디가 비어 있는지를 알고 대비하려는 것이다. 열 가지 영역을 근거와
   함께 정리하고, 시기별 흐름과 앞으로 12년을 같이 놓는다.
   길흉을 단정하지 않는다 — "이런 결이니 이렇게 준비하시라"까지만 쓴다. */

var OH_BODY={목:'간·담(눈·근육·스트레스)',화:'심장·소장(혈압·수면)',토:'비위(소화·당)',
  금:'폐·대장(호흡기·피부)',수:'신장·방광(허리·비뇨·귀)'};
var OH_SEASON_CARE={목:'봄·환절기',화:'한여름',토:'환절기',금:'가을·건조할 때',수:'한겨울'};

/* 남녀에 따라 배우자·자식을 보는 자리가 다르다 */
function spouseStar(g){return g==='F'?'관성':'재성';}
function childStar(g){return g==='F'?'식상':'관성';}

function lifeLuck(p){
  var s=p.saju;if(!s)return null;
  var sip=sipsinTable(s),cnt=sip.count,oh=ohCount(s),st=strengthOf(s),sn=sinsalOf(s);
  var names={};sn.forEach(function(x){names[x.name]=x.ji;});
  var g=p.gender||'M',out=[];
  function lv(n,hi,mid){return n>=hi?{t:'강함',c:'#00A05A',bg:'#E8F8F0'}:(n>=mid?{t:'보통',c:'#1B64DA',bg:'#E8F3FF'}:{t:'약함',c:'#C77700',bg:'#FFF6E5'});}
  var lack=[],many=[],k;
  for(k in oh){if(oh[k]===0)lack.push(k);if(oh[k]>=3)many.push(k);}

  /* 1. 재물운 */
  var jae=cnt.재성,bi=cnt.비겁;
  out.push({key:'재물운',emo:'💰',base:'재성 '+jae+'개 · 비겁 '+bi+'개 · '+st.level,
    level:lv(jae,2,1),
    read:(jae===0?'사주에 재성이 없습니다. 큰돈을 좇기보다 <b>꾸준한 수입과 안정</b>이 맞는 결입니다. 없다고 돈이 없는 게 아니라, 돈을 <b>버는 방식</b>이 남과 다르다는 뜻입니다 — 기술·전문성·사람으로 버는 쪽입니다.'
      :(jae>=3&&st.level==='신약'?'재성이 많은데 일간이 약합니다(재다신약). 돈 벌 기회는 계속 오는데 <b>몸과 시간이 못 따라가는</b> 형태입니다. 혼자 다 하려 하지 말고 사람을 쓰셔야 합니다.'
      :(st.level==='신강'?'일간이 튼튼하고 재성이 있습니다. <b>벌어서 지키는 힘</b>이 함께 있습니다. 본인 판단으로 움직일 때 결과가 좋습니다.'
      :'재물의 결이 무난합니다. 크게 터뜨리기보다 <b>새는 곳을 막는 관리</b>에서 차이가 납니다.'))),
    care:(bi>=3?'비겁이 많아 <b>동업·보증·돈거래</b>에서 손실이 나기 쉽습니다. 문서 없이 하는 약속을 피하세요.'
      :(jae>=3?'큰 건에 몰아 넣는 습관을 조심하세요. 나눠 두는 것이 이 사주의 안전장치입니다.'
      :'목돈이 생겼을 때 바로 쓰지 말고 한 달만 묵혀 보세요.')),
    bless:'돈은 그릇만큼 담깁니다. 그릇을 키워오신 만큼 들어올 자리는 이미 만들어져 있습니다.'});

  /* 2. 직업·사업운 */
  var gwan=cnt.관성,sik=cnt.식상;
  out.push({key:'직업·사업운',emo:'💼',base:'관성 '+gwan+'개 · 식상 '+sik+'개 · 재성 '+jae+'개',
    level:lv(Math.max(gwan,sik),2,1),
    read:(gwan>sik?'<b>조직과 직책</b>이 맞는 결입니다. 기준과 절차가 있는 곳에서 힘이 납니다. 자리를 맡을수록 안정됩니다.'
      :(sik>gwan?'<b>내 이름으로 하는 일</b>이 맞는 결입니다. 시키는 대로만 하는 자리에서는 오래 못 버팁니다. 기술·표현·영업처럼 결과가 눈에 보이는 일이 좋습니다.'
      :'조직과 자기 일 양쪽 다 됩니다. 어느 쪽이든 <b>사람과 엮이는 일</b>에서 성과가 납니다.')),
    care:(sik>=3?'벌여놓은 일이 많아지면 마무리가 샙니다. 세 개를 넘기지 마세요.'
      :(gwan>=3?'책임을 너무 많이 지십니다. 거절도 능력입니다.'
      :'기회가 왔을 때 준비된 사람만 잡습니다. 자격·기술 하나는 늘 다듬어 두세요.')),
    bless:'해오신 일이 헛되지 않았습니다. 쌓인 것이 다음 자리를 부릅니다.'});

  /* 3. 건강운 */
  var weak=lack.length?lack:(many.length?many:[]);
  out.push({key:'건강운',emo:'🩺',base:(lack.length?'없는 기운 '+lack.join('·'):'')+(many.length?(lack.length?' / ':'')+'많은 기운 '+many.join('·'):'')||'오행이 고른 편',
    level:(lack.length>=2?{t:'주의',c:'#F04452',bg:'#FEECEE'}:(lack.length===1?{t:'보통',c:'#C77700',bg:'#FFF6E5'}:{t:'양호',c:'#00A05A',bg:'#E8F8F0'})),
    read:(weak.length?('<b>'+weak.join('·')+'</b> 기운이 '+(lack.length?'비어 있습니다':'한쪽으로 몰려 있습니다')+' — '+
        weak.map(function(k2){return k2+'은 '+OH_BODY[k2];}).join(', ')+' 쪽입니다. 이 자리가 먼저 지치기 쉬우니 '+
        weak.map(function(k2){return OH_SEASON_CARE[k2];}).filter(function(v,i,a2){return a2.indexOf(v)===i;}).join('·')+'에 특히 살피세요.')
      :'오행이 고르게 있어 크게 치우치는 곳이 없습니다. 지금 습관만 지켜도 좋습니다.'),
    care:'사주로 병을 진단하지 않습니다. <b>어느 쪽이 먼저 지치는지</b>를 아는 용도로만 쓰세요. 실제 증상은 반드시 병원에서 확인하셔야 합니다.',
    bless:'몸이 보내는 신호를 일찍 알아채는 것도 복입니다. 아는 만큼 오래 건강하십니다.'});

  /* 4. 배우자·인연운 */
  var sp=spouseStar(g),spn=cnt[sp],ilji=sipsinOf(s.dg,JI_HIDE[s.dj]);
  var chung=[s.yj,s.mj,s.hj].some(function(j){return (j+6)%12===s.dj;});
  out.push({key:'배우자·인연운',emo:'💞',base:'일지 '+JI[s.dj]+'('+ilji+') · '+sp+' '+spn+'개'+(chung?' · 일지 충 있음':''),
    level:lv(spn,2,1),
    read:'배우자 자리는 <b>일지('+JI[s.dj]+')</b> 입니다. '+esc2(SIP10[ilji])+' 이 결을 가진 사람과 살게 되거나, 배우자에게서 그런 모습을 보게 됩니다. '+
      (spn===0?sp+'이 없어 인연이 늦거나 조용하게 옵니다. 서두르면 오히려 어긋납니다.'
        :(spn>=3?sp+'이 많아 인연의 폭이 넓습니다. 고르는 기준을 분명히 두셔야 합니다.'
        :'인연의 결이 무난합니다. 서로의 속도를 맞추는 데서 갈립니다.')),
    care:(chung?'일지가 다른 기둥과 충합니다. <b>같은 이야기를 반복해서 부딪히는</b> 자리가 있습니다. 말의 순서를 바꾸면 크게 줄어듭니다.'
      :'상대의 방식이 나와 다를 뿐 틀린 게 아니라는 것만 기억하시면 됩니다.'),
    bless:'오래 같이 있어주는 사람이 가장 큰 재산입니다. 그 자리를 지켜오신 것 자체가 복입니다.'});

  /* 5. 자식·아랫사람운 */
  var ch=childStar(g),chn=cnt[ch];
  out.push({key:'자식·아랫사람운',emo:'🧒',base:'시주 '+(p.noTime?'(시간 모름)':GAN[s.hg]+JI[s.hj])+' · '+ch+' '+chn+'개',
    level:p.noTime?{t:'확인 필요',c:'#C77700',bg:'#FFF6E5'}:lv(chn,2,1),
    read:(p.noTime?'태어난 시간을 모르면 자식·말년 자리를 못 봅니다. 시간을 확인하시면 이 항목이 채워집니다.'
      :'말년과 자식 자리는 <b>시주('+GAN[s.hg]+JI[s.hj]+')</b> 입니다. '+esc2(UNSEONG_META[unseong(s.dg,s.hj)].line)+' '+
        (chn===0?ch+'이 없어 자식·아랫사람과의 인연이 담백합니다. 붙잡기보다 지켜봐 주는 쪽이 잘 맞습니다.'
          :'아랫사람을 키우는 데서 보람을 얻는 결입니다.')),
    care:'기대가 클수록 서운함도 큽니다. 해준 것을 세지 않는 것이 이 자리를 편하게 만듭니다.',
    bless:'키운 사람이 곧 남는 재산입니다. 뿌린 정성은 어떤 식으로든 돌아옵니다.'});

  /* 6. 부모·가족운 */
  out.push({key:'부모·가족운',emo:'🏠',base:'년주 '+GAN[s.yg]+JI[s.yj]+' · 월주 '+GAN[s.mg]+JI[s.mj]+' · 인성 '+cnt.인성+'개',
    level:lv(cnt.인성,2,1),
    read:'년주는 조상·부모 자리, 월주는 부모·형제와 사회에 나가는 자리입니다. 인성이 '+cnt.인성+'개로 '+
      (cnt.인성>=2?'<b>받은 것이 많은</b> 결입니다. 배움과 보살핌이 뒤에 있었습니다.'
        :(cnt.인성===0?'<b>스스로 일어선</b> 결입니다. 기댈 곳 없이 해내신 힘이 곧 실력입니다.'
        :'무난합니다. 필요할 때 도움이 닿는 정도입니다.')),
    care:'가족 일은 잘잘못을 가리기 시작하면 끝이 없습니다. 돈이 얽히면 문서로 남기세요.',
    bless:'지금 계신 자리는 누군가의 수고 위에 있습니다. 그 마음을 아는 것만으로 이미 효도입니다.'});

  /* 7. 인복·귀인운 */
  out.push({key:'인복·귀인운',emo:'🍀',base:'비겁 '+bi+'개'+(names['천을귀인']?' · 천을귀인 '+names['천을귀인']:'')+(names['도화']?' · 도화 '+names['도화']:''),
    level:(names['천을귀인']?{t:'좋음',c:'#00A05A',bg:'#E8F8F0'}:lv(bi,2,1)),
    read:(names['천을귀인']?'<b>천을귀인</b>이 있습니다. 사주에서 가장 좋은 별로 봅니다 — 결정적인 순간에 도와주는 분이 나타납니다. '
      :'')+(names['도화']?'<b>도화</b>가 있어 사람이 모이고 첫인상이 좋습니다. 소개가 소개를 부릅니다. '
      :'')+(bi>=3?'같은 편이 많아 사람 속에서 힘이 납니다. 다만 그만큼 나눠야 할 몫도 생깁니다.'
      :(bi<=1?'혼자 결정하고 혼자 책임지는 결입니다. 사람을 늘리면 판이 커집니다.':'')),
    care:'귀인은 기다린다고 오지 않습니다. <b>먼저 베푼 자리</b>에서 나타납니다.',
    bless:'사람이 재산입니다. 그동안 챙기신 인연들이 앞으로 큰 힘이 되어 돌아옵니다.'});

  /* 8. 공부·자기계발운 */
  out.push({key:'공부·자기계발운',emo:'📚',base:'인성 '+cnt.인성+'개'+(names['화개']?' · 화개 '+names['화개']:''),
    level:lv(cnt.인성+(names['화개']?1:0),2,1),
    read:(cnt.인성>=2?'배우는 힘이 좋습니다. 자격·전문성으로 승부하는 쪽이 잘 맞습니다. '
      :'배움보다 몸으로 익히는 쪽이 빠릅니다. 현장에서 배우는 방식이 맞습니다. ')+
      (names['화개']?'<b>화개</b>가 있어 혼자 파고드는 힘이 남다릅니다. 깊이 들어가는 공부·기술·예술에 인연이 있습니다.':''),
    care:'배우기만 하고 써먹지 않으면 인성이 <b>게으름</b>으로 바뀝니다. 배운 것은 반드시 한 번은 써보세요.',
    bless:'배움에는 늦은 때가 없습니다. 지금 시작하셔도 늦지 않습니다.'});

  /* 9. 이동·해외운 */
  out.push({key:'이동·해외운',emo:'🐎',base:(names['역마']?'역마 '+names['역마']:'역마 없음')+' · 수 '+oh.수+'개',
    level:(names['역마']?{t:'많음',c:'#1B64DA',bg:'#E8F3FF'}:{t:'적음',c:'#C77700',bg:'#FFF6E5'}),
    read:(names['역마']?'<b>역마</b>가 있습니다. 한자리에 오래 머물기보다 <b>움직여야 풀리는</b> 결입니다. 이사·출장·해외·이직이 잦을 수 있고, 그 움직임이 기회가 됩니다.'
      :'한자리에서 뿌리내리는 결입니다. 자주 옮기면 오히려 힘이 빠집니다. 옮길 때는 크게 한 번만 옮기세요.'),
    care:'움직임이 많은 해에는 <b>계약서와 안전</b>을 두 번 확인하세요. 서두르다 생기는 일이 대부분입니다.',
    bless:'길 위에서 만나는 인연이 인생을 바꿉니다. 움직이신 만큼 세상이 넓어지셨을 겁니다.'});

  /* 10. 명예·직위운 */
  var jeonggwan=sip.rows.filter(function(r){return r.name==='정관';}).length;
  out.push({key:'명예·직위운',emo:'🎖️',base:'관성 '+gwan+'개'+(jeonggwan?' (정관 '+jeonggwan+')':''),
    level:lv(gwan,2,1),

var BLOOD_ORDER=['A','B','O','AB'];
function bloodBadge(k,size){
  var B=BLOOD[k]; if(!B)return '';
  var s=size||26;
  return '<span class="bbadge" style="width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s*0.42)+'px;'+
    'background:'+B.color+'22;color:'+B.color+'">'+k+'</span>';
}
function bloodKey(a,b){
  var ia=BLOOD_ORDER.indexOf(a),ib=BLOOD_ORDER.indexOf(b);
  return (ia<=ib)?(a+'|'+b):(b+'|'+a);
}
function bloodFit(a,b){
  if(!a||!b)return '';
  return BLOOD_FIT[bloodKey(a,b)]||'';
}

/* ══════════════════════════════════════════════════════════════════
   20. 리스크 진단 — 설계사만 보는 화면
   ══════════════════════════════════════════════════════════════════
   좋은 말만 하면 상담은 편하지만 계약은 오래 못 간다. 어디서 깨질지,
   어디서 민원이 날지, 어디서 해지가 나올지를 미리 짚는다.
   이 화면은 고객에게 보여주지 않는다.                                */
function riskScan(cl,me){
  var out=[],code=personCode(cl),s=cl.saju;
  var sip=s?sipsinTable(s):null,st=s?strengthOf(s):null,oh=s?ohCount(s):null;
  var cnt=sip?sip.count:{비겁:0,식상:0,재성:0,관성:0,인성:0};
  var lack=[],many=[],k;
  if(oh)for(k in oh){if(oh[k]===0)lack.push(k);if(oh[k]>=3)many.push(k);}
  function add(lv,area,sig,why,todo){out.push({lv:lv,area:area,sig:sig,why:why,todo:todo});}
  var HI={t:'높음',c:'#F04452',bg:'#FEECEE'},MID={t:'보통',c:'#C77700',bg:'#FFF6E5'},LO={t:'낮음',c:'#00A05A',bg:'#E8F8F0'};

  /* 유지(실효·해지) 리스크 */
  if(st&&st.level==='신약'&&cnt.재성>=3)
    add(HI,'유지','재성이 많은데 일간이 약합니다(재다신약)','벌 기회는 많은데 몸과 현금흐름이 못 따라가는 구조라, 납입이 길어지면 부담이 먼저 옵니다.',
      '월 납입을 소득의 8~10% 안쪽으로 잡고, 감액·납입유예 방법을 계약 전에 미리 설명해 두세요.');
  if(code&&code.charAt(3)==='P')
    add(MID,'유지','P 성향 — 마음이 바뀔 여지를 늘 남겨둡니다','즉흥적으로 정한 뒤 며칠 지나 번복하거나 청약철회로 이어지기 쉽습니다.',
      '계약 당일 저녁에 결정 사항을 문자로 정리해 보내세요. 번복률이 눈에 띄게 줄어듭니다.');
  if(cnt.식상>=3)
    add(MID,'유지','식상이 두터워 묶이는 걸 답답해합니다','장기 납입 상품에서 중도 이탈 가능성이 있습니다.',
      '해지 대신 감액·유지 방법을 먼저 알려두고, 2년차·5년차에 먼저 연락해 확인하세요.');

  /* 결정 리스크 */
  if(cnt.인성>=3||(st&&st.level==='신약'))
    add(MID,'결정','이해가 안 되면 움직이지 않고, 주변 의견에 흔들립니다','상담 자리에서는 좋았다가 집에 가서 뒤집히는 전형적인 자리입니다.',
      '결정에 영향 주는 사람(배우자·부모)을 처음부터 같이 앉히거나, 그분께 드릴 자료를 따로 준비하세요.');
  if(cnt.비겁>=3)
    add(MID,'결정','비겁이 많아 남이 정해주는 걸 싫어합니다','밀어붙이면 그 자리에서 닫히고, 비교당하면 자존심이 상합니다.',
      '"결정은 사장님이 하십니다"를 먼저 말하고, 선택지 두 개만 놓으세요.');
  if(code&&code.charAt(2)==='T'&&me&&personCode(me).charAt(2)==='F')
    add(MID,'결정','고객은 T, 나는 F — 설득 언어가 어긋납니다','감성으로 다가갈수록 "근거가 없다"고 느낍니다.',
      '비교표·손익부터 꺼내고 가족 이야기는 근거 뒤에 한 줄만 붙이세요.');

  /* 민원·불완전판매 리스크 */
  if(code&&(code.charAt(1)==='S'&&code.charAt(2)==='T'))
    add(HI,'민원','사실 관계를 그대로 기억하고 대조합니다','설명과 약관이 한 글자라도 다르면 나중에 문제 제기로 이어집니다.',
      '모르는 건 모른다고 답하고, 확인 후 문서로 회신하세요. 구두 약속을 남기지 마세요.');
  if(sip&&sip.rows.some(function(r){return r.name==='정관';}))
    add(MID,'민원','정관 — 절차와 명분을 중요하게 봅니다','절차가 어긋나면 상품이 좋아도 문제를 삼습니다.',
      '서명·설명 확인 절차를 빠짐없이 밟고, 안내문을 반드시 남기세요.');

  /* 건강 고지 리스크 */
  if(lack.length||many.length){
    var w=(lack.length?lack:many);
    add(MID,'고지','오행이 '+(lack.length?'비어':'몰려')+' 있는 쪽 — '+w.join('·'),
      w.map(function(x){return x+'('+OH_BODY[x]+')';}).join(', ')+' 쪽이 먼저 지치기 쉬운 결입니다. 그 계통 진료 이력이 있을 가능성을 염두에 두세요.',
      '알릴의무 질문을 그 부위 중심으로 한 번 더 짚어 확인하세요. 사주로 병을 단정하는 것이 아니라, 빠뜨리지 않으려는 확인입니다.');
  }

  /* 변화 시기 리스크 */
  if(s){
    var ah=yearAhead(cl,10).filter(function(x){return x.rel==='충';});
    if(ah.length)add(MID,'변화',ah.map(function(x){return x.year+'년';}).join(', ')+' 은 일지와 충하는 해입니다',
      '이사·이직·사업 변동이 몰리기 쉬운 시기라 주소·직장·계좌 변경이 자주 생깁니다.',
      '그 해에는 연락처·주소 갱신을 먼저 확인하세요. 실효의 절반은 연락 두절에서 납니다.');
  }

  /* 관계 리스크 */
  if(me&&ready(me)){
    var f=fitCalc(me,cl);
    if(f.hasS&&f.jr&&f.jr.k==='충')
      add(MID,'관계','일지가 충하는 조합입니다','같은 말을 해도 부딪히기 쉬운 자리라 사소한 일에서 감정이 상할 수 있습니다.',
        '설명 순서를 상대 방식으로 바꾸고, 중요한 안내는 문서로 남기세요.');
    if(f.mbtiScore!==null&&f.mbtiScore<45)
      add(MID,'관계','성향 궁합이 '+f.mbtiScore+'점입니다','대화 언어가 달라 오해가 쌓이기 쉽습니다.',
        '상담 전략 탭의 "이렇게 바꿔라"를 그대로 지키면 대부분 해소됩니다.');
  }
  if(!out.length)add(LO,'전반','두드러지는 위험 신호가 없습니다','성향과 사주 어느 쪽에서도 크게 걸리는 자리가 보이지 않습니다.',
    '기본만 지키면 됩니다 — 설명은 문서로, 약속은 날짜로, 연락은 주기대로.');
  return out;
}

var AGENT={name:'',tel:''};
(function(){

})();

function setWorryCat(k){
  S.worry=S.worry||{};S.worry.cat=k;
  var c=WORRY_CATS.filter(function(x){return x.k===k;})[0];
  S.worry.catName=c?c.n:'';save();draw();
}
function worryStart(){
  var txt=(val('worryTxt')||'').replace(/^\s+|\s+$/g,'');
  S.worry=S.worry||{};S.worry.txt=txt;
  if(!S.worry.cat){
    var g=worryGuess(txt);
    if(g)setWorryCat(g);
    else{toast('고민 종류를 골라주세요');return;}
  }
  S.worry.done=true;save();draw();
  var m=$('pane');if(m)m.scrollTop=0;
}
function worryReset(){S.worry={};save();draw();}
function tabWorry(){
  var cl=S.cl,w=S.worry||{};
  if(!w.done){
    var cats='<div class="seg" style="margin-top:10px">'+WORRY_CATS.map(function(c){
      return '<button class="'+(w.cat===c.k?'on':'')+'" onclick="setWorryCat(\''+c.k+'\')">'+c.emo+' '+c.n+'</button>';}).join('')+'</div>';
    var ex=w.cat?('<div class="sub" style="margin-top:7px">예) '+esc((WORRY_CATS.filter(function(c){return c.k===w.cat;})[0]||{}).ex||'')+'</div>'):'';
    return '<div class="card"><h1>지금 가장 걸리는 것 하나</h1>'+
      '<p>점을 쳐 드리는 것이 아닙니다. 이 고민이 <b>왜 생겼는지</b>를 '+esc(cl.name||'')+' 님의 타고난 결과 성향에서 찾아드리고, <b>이번 달에 할 것 세 가지</b>와 <b>하지 말 것</b>을 정리해 드립니다.</p>'+
      cats+ex+
      '<div style="margin-top:14px"><label>고민을 편하게 적어주세요 (선택)</label>'+
      '<textarea class="inp" id="worryTxt" rows="4" placeholder="예) 지금 회사를 계속 다녀야 할지 모르겠습니다. 3년째인데 인정받는 느낌이 없어요." style="resize:vertical">'+esc(w.txt||'')+'</textarea>'+
      '<div class="sub" style="margin-top:6px">적지 않으셔도 됩니다. 적어주시면 종류를 자동으로 골라드립니다. 이 내용은 이 기기에만 저장됩니다.</div></div>'+
      '<button class="btn" style="margin-top:14px" onclick="worryStart()">고민 풀어보기</button>'+
    '</div>'+
    footNote();
  }
  var o=worrySolve(cl,w.cat,w.txt||'');
  var head='<div class="card"><div class="sub">'+o.cat.emo+' '+esc(o.cat.n)+'</div>'+
    '<h1 style="margin-top:4px">'+o.one+'</h1>'+

    '<div class="row" style="margin-top:12px"><button class="btn ghost sm" onclick="worryReset()">다른 고민 물어보기</button>'+
    '<button class="btn line sm" onclick="window.print()">🖨 인쇄 · PDF</button></div>'+
  '</div>';
  var why='<div class="card"><h2><span class="n">원인</span>왜 이 고민이 생겼나</h2>'+
    '<div class="tbwrap stack"><table class="tb"><tbody>'+
    [['사주에서 보면',o.sajuWhy+(o.sajuWhy?' — ':'')+o.now.replace(/<[^>]+>/g,'')],
     ['성향에서 보면',(o.mindWhy||'')+' '+(o.mindTail||'')]].map(function(r){
      return '<tr><td class="head"><b>'+r[0]+'</b></td><td class="plain">'+esc(r[1])+'</td></tr>';}).join('')+

    o.dos.map(function(x,i){return '<div class="talk good">'+(i+1)+'. '+x+'</div>';}).join('')+

  '</div>';
  return head+why+act+when+close+footNote();
}

function relPlan(me,other,rk){
  var R=roleOf(rk),g=roleGroup(rk),mc=personCode(me),oc=personCode(other);
  var tips=REL_TIPS[g==='client'?'side':g];
  var rows=[],keys=['EI','SN','TF','JP'],labels={EI:'말의 양',SN:'설명 방식',TF:'결정 기준',JP:'속도'},i;
  for(i=0;i<4;i++){
    var k=keys[i],M=mc?mc.charAt(i):'',Y=oc?oc.charAt(i):'';
    if(!Y)continue;
    var ST=STRATEGY[k],box=null;
    if(mc){if(M===Y)box=(M===ST.SS.me)?ST.SS:ST.II; else box=(M===ST.ME.me)?ST.ME:ST.MI;}
    rows.push({label:labels[k],me:M,you:Y,same:M===Y,
      tip:(tips&&tips[Y])||'',risk:box?box.risk:'',fix:box?box.fix:''});
  }
  var og=oc?grp(oc):'',mg=mc?grp(mc):'';
  var gr=(me.saju&&other.saju)?ganRel(me.saju.dg,other.saju.dg):null;
  var jr=(me.saju&&other.saju)?jiRel(me.saju.dj,other.saju.dj):null;
  var sajuLine=gr?((GAN_ROLE[gr.k]&&GAN_ROLE[gr.k][g==='client'?'client':g])||gr.txt):'';
  var bg=(g==='client')?'side':g;
  var bloodTip=(other.blood&&BLOOD_ROLE[bg])?BLOOD_ROLE[bg][other.blood]:'';
  var bloodPairTxt=(me.blood&&other.blood)?bloodFit(me.blood,other.blood):'';
  var out={role:R,group:g,rows:rows,og:og,mg:mg,gr:gr,jr:jr,saju:sajuLine,
    blood:other.blood||'',bloodTip:bloodTip,bloodPair:bloodPairTxt,myBlood:me.blood||'',
    learn:og?LEARN[og]:'',manage:og?MANAGE[og]:'',grow:og?GROW[og]:null,
    ogName:og?PAL[og].name:'',mgName:mg?PAL[mg].name:''};
  /* 역할별 실전 표 */
  if(g==='up'){
    out.table=[
      ['보고는 이렇게',(oc&&oc.charAt(1)==='S')?'숫자·사실·완료 여부 세 줄로. 결론을 맨 앞에 두세요.':'결론과 방향 한 줄 먼저, 근거는 그 밑에 세 줄로.'],
      ['지시를 받을 때',(oc&&oc.charAt(3)==='J')?'마감과 우선순위를 그 자리에서 확인하세요. 나중에 묻는 게 더 큰 실점입니다.':'중간 점검 시점을 내가 먼저 제안하세요. 방향이 바뀌어도 손해가 적습니다.'],
      ['인정받는 법',(oc&&oc.charAt(2)==='T')?'결과와 근거로. 노력을 강조하면 오히려 감점입니다.':'과정에서의 태도와 팀 기여를 함께 말하세요. 숫자만으로는 마음이 안 움직입니다.'],
      ['부딪힐 때',rows.filter(function(r){return !r.same;}).length?('가장 어긋나는 것은 <b>'+rows.filter(function(r){return !r.same;})[0].label+'</b>입니다. 이 지점에서 감정이 상하기 쉽습니다.'):'네 축이 비슷해 크게 부딪히지 않습니다. 대신 같은 실수를 같이 놓칠 수 있습니다.'],
      ['배울 것',og?LEARN[og]:'']
    ];
  }else if(g==='down'){
    out.table=[
      ['지시하는 법',(oc&&oc.charAt(1)==='S')?'예시와 순서를 주세요. "알아서"가 가장 어려운 유형입니다.':'왜 하는지부터 말해주세요. 이유가 있으면 방법은 스스로 찾습니다.'],
      ['피드백 주는 법',(oc&&oc.charAt(2)==='T')?'근거를 들어 정확하게. 돌려 말하면 못 알아듣습니다.':'따로 불러서, 잘한 것 먼저. 공개 지적은 오래 남습니다.'],
      ['동기 스위치',(oc&&oc.charAt(0)==='E')?'사람들 앞에서의 인정. 발표·발언 기회를 주면 살아납니다.':'조용한 인정과 자율. 개인적으로 건네는 한마디가 더 큽니다.'],
      ['맡길 것 · 맡기면 안 될 것',og?(GROW[og][0]+' / '+GROW[og][1]):''],
      ['키우는 법',og?MANAGE[og]:'']
    ];
  }else if(g==='side'){
    out.table=[
      ['일 나누기',(oc&&oc.charAt(1)==='S')?'상대에게 실행·확인을, 나는 방향을 잡는 편이 낫습니다.':'상대에게 아이디어·기획을, 나는 마감을 챙기는 편이 낫습니다.'],
      ['회의에서',(oc&&oc.charAt(0)==='E')?'상대가 먼저 말합니다. 정리와 결론을 내가 맡으세요.':'따로 물어보면 핵심이 나옵니다. 회의 전에 한 번 의견을 받아두세요.'],
      ['갈등이 날 때',rows.filter(function(r){return !r.same;}).length?('<b>'+rows.filter(function(r){return !r.same;})[0].label+'</b>에서 부딪힙니다. 옳고 그름이 아니라 방식의 차이입니다.'):'비슷해서 편합니다. 대신 둘 다 약한 부분을 채워줄 사람이 따로 필요합니다.'],
      ['함께 하면 좋은 일',(og&&mg&&og!==mg)?'서로 없는 것을 채웁니다 — '+PAL[mg].name+'과 '+PAL[og].name+'의 조합은 기획과 실행이 갈립니다.':'같은 결이라 속도가 붙습니다. 다만 놓치는 것도 같습니다.']
    ];
  }else{
    out.table=[
      ['첫 만남',(oc&&MBTI_TYPES[oc])?MBTI_TYPES[oc].open:''],
      ['자료',(oc&&MBTI_TYPES[oc])?MBTI_TYPES[oc].doc:''],
      ['속도',(oc&&MBTI_TYPES[oc])?MBTI_TYPES[oc].pace:''],
      ['마무리',(oc&&MBTI_TYPES[oc])?MBTI_TYPES[oc].close:''],
      ['반론이 올 때',(oc&&MBTI_TYPES[oc])?MBTI_TYPES[oc].obj:'']
    ];
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════
   9. 스크롤 칸 관리 · 시작
   ══════════════════════════════════════════════════════════════════ */
function hintCheck(){
  var p=$('pane'),h=$('hint');if(!p||!h)return;
  var more=(p.scrollHeight-p.clientHeight-p.scrollTop)>40;
  h.classList.toggle('off',!more);
}
(function(){
  var p=$('pane');
  if(p)p.addEventListener('scroll',hintCheck,{passive:true});
  window.addEventListener('resize',function(){fitShell();hintCheck();});
  document.addEventListener('keydown',function(e){
    if(!p)return;
    if(e.key==='PageDown'){p.scrollTop+=p.clientHeight*0.9;e.preventDefault();}
    if(e.key==='PageUp'){p.scrollTop-=p.clientHeight*0.9;e.preventDefault();}
    if(e.key==='Home'&&e.ctrlKey){p.scrollTop=0;}
    if(e.key==='End'&&e.ctrlKey){p.scrollTop=p.scrollHeight;}
  });
})();
/* 화면 높이를 제대로 못 받는 곳(작은 iframe 등)에서는 문서 스크롤로 되돌린다 */
function fitShell(){
  var p=$('pane');if(!p)return;
  var h=p.clientHeight;
  if(h<220)document.body.classList.add('flow');
  else document.body.classList.remove('flow');
}
(function boot(){
  var d=load();
  if(d){
    if(d.me)S.me=d.me; if(d.cl)S.cl=d.cl;
    S.ans=d.ans||{};S.i=d.i||0;S.tab=d.tab||'ice';S.mode=d.mode||'both';S.view=d.view||'agent';S.worry=d.worry||{};
    S.step=ready(S.cl)?'board':(S.me.name?'client':'me');
  }
  /* ★ 나만 보는 판 — 「나」 가 곧 그 사람입니다. 내 카드 걸음을 건너뛰고
     바로 생년월일 칸으로 갑니다(안 그러면 적어 넣은 것이 S.me 로 들어가
     풀이가 영영 안 섭니다 — 실제로 그렇게 막혀 봤습니다). */
  if(MEONLY.on){
    S.view='agent'; S.mode='saju';
    if(!ready(S.cl)&&ready(S.me))S.cl=S.me;          /* 전에 내 카드를 적어 두셨으면 그대로 씁니다 */
    S.step=ready(S.cl)?'board':'client';
    if(['mepil','meins','mework','metime'].indexOf(S.tab)<0)S.tab='mepil';
  }
  if(BRIEF.on){
    S.view='agent';
    if(briefTake()){S.step='board';S.tab='brief';save();}
    else S.step=ready(S.cl)?'board':'client';
  }
  if(GUEST.on){
    S.view='client';
    if(GUEST.mode)S.mode=GUEST.mode;
    if(!d||!ready(S.cl))S.step='cover';
    var gl=tabsFor(S.mode,'client');
    if(gl.indexOf(S.tab)<0)S.tab=gl[0];
  }
  fitShell();draw();
  setTimeout(function(){fitShell();hintCheck();},250);
})();

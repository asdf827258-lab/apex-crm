<title>블로그 공장 — APEX</title>
<!--
  블로그 공장 — <b>블로그에 올리는 일</b> 하나만 하는 화면
  ══════════════════════════════════════════════════════════════════════
  이것은 CRM 안의 기능이 아니다. <b>글을 올리는 일</b>이 주인공이라
  따로 떼어 놓았다. 앱을 열고 메뉴를 찾아 들어가는 동안 오늘 발행이
  끝나 버리기 때문이다. 주소만 눌러 바로 열고, 여기서 끝난다.

  세 걸음이면 끝난다.
     ① 오늘 쓸 것 고르기 — 글감은 이미 있는 것에서 나온다
     ② 초안 — 그 글감에 묶여서 나온다
     ③ 올리기 — <b>서식 있는 복사</b> + <b>그림 내려받기</b>

  ③ 이 이 화면의 이유다. 마크다운을 그대로 붙이면 네이버 편집기에는
  <b>## 이 글자 그대로 보인다.</b> 제목도 표도 안 산다. 그래서 여기서
  <b>서식(HTML)으로 복사</b>한다 — 붙이면 제목·표·인용이 그대로 선다.

  <b>지어내지 않는 규칙은 그대로다.</b>
    · 글감이 없으면 그 줄은 비워 둔다 (없는 것을 만들지 않는다)
    · 근거에 없는 수치는 [[확인 필요: …]] 로 남는다
    · 세금은 요건만 · 보험료는 「심사 결과에 따릅니다」
    · 실명이 남아 있으면 잡는다
    · 축·눈금이 있는 그래프는 그리지 않는다 — 그 숫자가 우리에게 없다

  <b>자료를 여기에 다시 적어 두지 않았다.</b>
    8통장 이름 · 순서표 · 메뉴 이름  →  apex-map-data.js (지도)
    뉴스                              →  /api/market?kind=news&cat=…
                                         (칸은 config/sources.json 이 정한다)
    준법 문구                          →  config/compliance.json
    AI 연결 · 내 소개                  →  앱에 저장해 둔 그 값 (같은 브라우저)
  한 곳이 바뀌면 여기도 같이 바뀐다. 두 벌로 적어 두면 한쪽만 늙는다.
-->
<style>

*{box-sizing:border-box}
body{margin:0;background:#F1F5F9;color:var(--ink);
     font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:1.65}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 80px}
header{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}

h1{font-size:17px;margin:0;font-weight:800}
h1 span{color:var(--brand)}
.tag{font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--soft);border:1px solid var(--line);color:var(--sub)}

.card .desc{font-size:12px;color:var(--sub);margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:var(--bg);
       color:var(--ink);padding:7px 13px;font-weight:700;font-size:12.5px}
button:hover{background:var(--soft)}
button.p{background:var(--brand);border-color:var(--brand);color:#fff}
button.p:hover{filter:brightness(1.08)}
button.sm{padding:3px 9px;font-size:11.5px;font-weight:700}
button:disabled{opacity:.5;cursor:default}
input,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--bg);color:var(--ink)}
label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);margin:0 0 4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-size:11px;color:var(--sub);font-weight:700;background:var(--soft)}
.seed{border-left:4px solid var(--brand);background:var(--soft);border-radius:9px;padding:9px 11px;margin-bottom:7px}
.seed .t{font-size:12.5px;font-weight:800}
.seed .w{font-size:11px;color:var(--sub);margin-top:2px}
.seed .e{font-size:11px;color:var(--warn);margin-top:4px}
.chip{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:20px;
      padding:2px 9px;font-size:11px;margin:2px 4px 2px 0}
.chip a{cursor:pointer;font-weight:800;color:var(--sub);text-decoration:none}
.who{display:inline-block;border-radius:20px;padding:1px 8px;font-size:10.5px;font-weight:800}
.who.c{background:#EFF6FF;color:#1D4ED8}
.who.t{background:#FFF7ED;color:#9A3412}
.gate{border-radius:9px;padding:9px 11px;font-size:12px;margin:10px 0}
.gate.ok{background:var(--okbg);border:1px solid #A7F3D0;color:#065F46}
.gate.no{background:var(--badbg);border:1px solid #FECACA;color:var(--bad)}
.gate ul{margin:6px 0 0 16px;padding:0}
.dots{display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--sub)}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--line);display:inline-block;font-style:normal}
.dots i.on{background:var(--ok)}
.dots i.now{box-shadow:0 0 0 2px var(--brand)}
tr.now>td{background:#EBF3FF}
tr.late>td{background:#FFF7E6}
.big{font-size:15px;padding:11px 16px}
.art{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:9px}
.art .t{font-size:12.5px;font-weight:800}

.art .pv{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.art .pv svg{max-width:100%;height:auto;display:block}
.art .alt{font-size:10.5px;color:var(--dim);margin:6px 0 5px}
.body{border:1px solid var(--line);border-radius:11px;padding:16px 18px;background:#fff;font-size:14px}
.body h2{font-size:17px;margin:20px 0 8px;font-weight:800;border-left:4px solid var(--brand);padding-left:9px}
.body h3{font-size:15px;margin:16px 0 6px;font-weight:800}
.body p{margin:9px 0}
.body table{margin:10px 0;font-size:13px}
.body th,.body td{border:1px solid var(--line)}
.body blockquote{margin:10px 0;padding:9px 13px;background:var(--soft);border-left:4px solid var(--brand);color:var(--sub)}
.body ul,.body ol{margin:8px 0 8px 20px;padding:0}
.ph{border:2px dashed #BFDBFE;background:#EFF6FF;border-radius:9px;padding:11px 13px;margin:11px 0;
    font-size:12.5px;color:#1D4ED8;font-weight:700}
.hole{background:#FEF9C3;border-bottom:2px solid #CA8A04;font-weight:700;padding:0 3px}
.steps{font-size:12.5px;margin:8px 0 0;padding:0;list-style:none}
.steps li{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.steps input{width:auto;margin-top:3px}
.steps li.done{color:var(--dim);text-decoration:line-through}
.note{font-size:11.5px;color:var(--sub);background:var(--soft);border:1px solid var(--line);
      border-radius:9px;padding:9px 11px;line-height:1.7;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0F172A;color:#fff;
       padding:9px 16px;border-radius:22px;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;
       transition:opacity .2s;z-index:99;max-width:90vw}
.toast.on{opacity:.96}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--brand);
      border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:640px){.wrap{padding:10px 10px 70px}.card{padding:13px}}
</style>

const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;')

let TT;
function toast(m, ms) { const t = $('toast'); t.textContent = m; t.classList.add('on');

/* ══════════ 뉴스 — 서버 창구에서 칸별로 받는다 ══════════
   낱말표를 여기 다시 적지 않는다. 어느 매체가 어느 칸인지는
   config/sources.json 이 정하고, 서버가 그대로 나눠 준다. */
async function pullNews(){
  const b=$('btnNews')||{}; b.disabled=true; if('innerHTML' in b) b.innerHTML='<span class="spin"></span> 받는 중…';
  const cats=[...new Set(ORDER.filter(k=>KINDS[k].cat).flatMap(k=>KINDS[k].cat.split(',')))];
  const items=[], errs=[];
  for (const c of cats){
    try{
      const h={Accept:'application/json'};
      const tok=LS('apptoken'); if(tok) h['X-App-Token']=tok;
      const r=await fetch('/api/market?kind=news&cat='+encodeURIComponent(c),{headers:h});
      const txt=await r.text();
      if(r.status===401) throw new Error('공유 토큰이 맞지 않습니다');
      if(!r.ok) throw new Error('서버가 '+r.status+' 로 답했습니다');
      let j; try{ j=JSON.parse(txt); }
      catch(e){ throw new Error('서버 창구(/api/market)가 아직 없습니다'); }
      for (const n of (j.news||j.items||[])){
        const t=String(n.title||'').replace(/<[^>]+>/g,'').trim();
        if(!t||items.some(x=>x.t.slice(0,28)===t.slice(0,28))) continue;
        items.push({ t, u:n.link||'', s:n.source||'', d:String(n.date||'').slice(0,16), cat:c });
      }
    }catch(e){ errs.push(c+': '+(e.message||'실패')); }
  }
  S.news={ at:kday(0).toISOString().replace('T',' ').slice(0,16),
           items, err:errs.join(' · ') };
  save(); b.disabled=false; if('textContent' in b) b.textContent='📰 오늘 뉴스 받기'; paint();
  toast(items.length ? (items.length+'건 받았습니다') : ('못 받았습니다 — '+(errs[0]||'기사가 없습니다')));
}

/* ══════════ 편성 ══════════ */
/* ══════════ 오늘이 며칠인가 — 한 곳만 안다 ══════════
   여러 곳에서 날짜를 다시 세면 하루가 어긋난다. 한국 시각(UTC+9) 하나로 센다. */
function kday(plus){ return new Date(Date.now()+9*36e5+(plus||0)*864e5); }
function ymd(plus){ return kday(plus).toISOString().slice(0,10); }
function dlabel(plus){
  const d=kday(plus);
  return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+'('+['일','월','화','수','목','금','토'][d.getUTCDay()]+')';
}
/* 오늘 쓸 줄이 몇 번째인가 — 이 답도 한 곳에서만 한다 */
function todayAt(){ const t=ymd(0); return S.rows.findIndex(r=>r.ymd===t); }
/* 밀린 줄 — 오늘보다 이전인데 아직 안 올린 것 */
function lateRows(){ const t=ymd(0);
  return S.rows.map((r,i)=>({r,i})).filter(x=>x.r.ymd && x.r.ymd<t && !x.r.up); }
/* 뉴스가 오늘 받아 온 것인가 — 어제 기사로 「오늘의 경제」 를 쓰면 날짜가 틀린 글이 나간다 */
function newsFresh(){ return String(S.news.at||'').slice(0,10)===ymd(0); }
/* 오늘까지 며칠을 이어서 올렸나 — 오늘 것을 아직 안 올렸으면 어제부터 센다 */
function streak(){
  const up={}; S.rows.forEach(r=>{ if(r.up&&r.ymd) up[r.ymd]=1; });
  let n=0, from=up[ymd(0)]?0:-1;
  for(let d=from;d>-400;d--){ if(!up[ymd(d)]) break; n++; }
  return n;
}
function plan(){
  const s=seeds(), used={}, rows=[];
  ORDER.forEach(k=>used[k]=0);
  /* 이미 써 둔 것은 날짜로 찾아 그대로 옮긴다 — 다시 편성한다고 어제 쓴 글을 지우면 안 된다 */
  const keep={}; S.rows.forEach(r=>{ if(r.ymd&&(r.out||r.up)) keep[r.ymd]=r; });
  const n=S.perweek*4, gap=Math.max(1,Math.round(7/S.perweek));
  for(let i=0;i<n;i++){
    const day=i*gap, k2=ymd(day);
    if(keep[k2]){ rows.push(keep[k2]); delete keep[k2]; continue; }
    const kind=MIX[i%MIX.length], pool=s[kind]||[];
    const seed=pool.length?pool[used[kind]%pool.length]:null;
    used[kind]++;
    rows.push({ ymd:k2, when:dlabel(day), kind, seed, out:'', guard:null, up:false });
  }
  /* 편성 밖으로 밀려난 것도 안 버린다 — 지난 것이라도 쓴 글은 쓴 글이다 */
  const left=Object.keys(keep).sort().map(d=>keep[d]);
  S.rows=left.concat(rows); save(); paint();
  const empty=rows.filter(r=>!r.seed).length;
  toast((empty ? (n+'편 편성 — 글감이 없어 '+empty+'줄은 비워 뒀습니다') : (n+'편을 편성했습니다'))+
        (left.length?(' · 써 두신 '+left.length+'편은 그대로 뒀습니다'):''));
}
function setWeek(n){ S.perweek=n; save(); paint(); }
function setLen(k){ if(!LENS[k]) return; S.len=k; save(); paint(); }

/* ══════════ AI — 앱에 저장해 둔 연결을 그대로 쓴다 ══════════ */
function aiReady(){ return LS('conn','direct')==='proxy' ? !!LS('proxy') : !!LS('apikey'); }
async function ask(system,user,max){
  const proxy=LS('conn','direct')==='proxy';
  const url=proxy?LS('proxy'):'https://api.anthropic.com/v1/messages';
  if(!url) throw new Error('맨 위 «연결» 에서 AI 를 먼저 연결해 주세요.');
  const headers={'Content-Type':'application/json'};
  if(proxy){ const t=LS('apptoken'); if(t) headers['X-App-Token']=t; }
  else{ const k=LS('apikey'); if(!k) throw new Error('맨 위 «연결» 에서 AI 를 먼저 연결해 주세요.');
        headers['x-api-key']=k; headers['anthropic-version']='2023-06-01';
        headers['anthropic-dangerous-direct-browser-access']='true'; }
  const model=LS('model'); const messages=[{role:'user',content:user}];
  let out='';
  /* 길이 제한에 걸리면 이어 쓴다 — 블로그 글은 길어서 한 번에 안 끝난다 */
  for(let round=0; round<4; round++){
    const payload={ max_tokens:max||9000, system, messages };
    if(model) payload.model=model;
    const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(payload)});
    const txt=await r.text();
    if(!r.ok){ let m=txt; try{ const j=JSON.parse(txt); m=(j.error&&j.error.message)||j.message||txt; }catch(e){}
               throw new Error(m.slice(0,200)); }
    const j=JSON.parse(txt);
    const t=typeof j.text==='string' ? j.text
      : (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    out+=t;
    if(j.stop_reason!=='max_tokens'||!t) break;
    messages.push({role:'assistant',content:t.replace(/\s+$/,'')});
    messages.push({role:'user',content:'방금 응답이 길이 제한으로 끊겼어. 마지막 글자 바로 다음부터 인사말 없이 이어서 끝까지 완성해줘. 이미 쓴 내용은 반복하지 마.'});
  }
  return out;
}
function sysPrompt(){
  const per=LS('persona','');
  return (per?per+'\n\n':'')+
  '너는 보험·재무 블로그 글을 쓴다. 네이버·티스토리 검색에 걸리게 쓰되, 아래 규칙을 어기면 실패다.\n\n'+
  '[절대 규칙]\n'+
  '1. 아래 [근거] 에 없는 수치·통계·순위·후기·사례를 만들어 쓰지 않는다. 필요하면 그 자리에 [[확인 필요: 무엇을 확인해야 하는지]] 라고 빈칸으로 남긴다. 그럴듯하게 채우면 실패다.\n'+
  '2. 기사는 제목·언론사·날짜·링크만 인용한다. 기사 본문을 옮겨 적지 않는다(저작권).\n'+
  '3. 세금은 결론을 말하지 않는다. 「비과세입니다」 라고 끝내지 말고 요건만 적고 「요건 충족 시」 와 「구체적인 판단은 세무 전문가에게 확인하시기 바랍니다」 를 넣는다. 한도·나이·개월 수 같은 숫자는 법령 개정으로 바뀌므로 적지 않는다.\n'+
  '4. 보험료·보장·인수를 말할 때는 「심사 결과에 따릅니다」 를 넣는다.\n'+
  '5. 고객 실명·동료 실명·특정할 수 있는 사연을 쓰지 않는다. 예를 들 때는 「40대 직장인」 처럼 일반화하고, 이름이 필요하면 홍길동을 쓴다.\n'+
  '6. 「업계 1위」 「무조건」 「원금 보장」 「100% 지급」 같은 단정·최상급을 쓰지 않는다.\n'+
  '7. 동료가 읽는 글에서도 수입·수수료·소득을 보장한다고 쓰지 않는다 — 모집 광고도 규정을 받는다.\n'+
  '8. 이미지 자리표시는 [쓸 수 있는 그림] 에 있는 것만 부른다. 「고객 사진」 처럼 목록에 없는 그림을 부르지 않는다 — 우리가 만들지 못해 그 자리가 빈 채로 올라간다. 형식은 [이미지: 그림 이름 | alt: 대체텍스트] 로 쓰고 이름은 목록 그대로 쓴다.\n'+
  '9. 글 끝에 「## 이 글이 딛고 선 것」 을 두고 받은 [근거] 를 그대로 옮겨 적는다.';
}
/* 최근에 올린 글의 제목 — <b>우리가 쓴 것</b>이라 지어낸 자료가 아니다.
   매일 쓰면 같은 이야기가 돌아온다. 이웃은 그때 떨어진다. */
function recentTitles(not){
  const out=[];
  for(let i=S.rows.length-1;i>=0&&out.length<7;i--){
    const r=S.rows[i]; if(!r.out||r===not) continue;
    const m=r.out.match(/##\s*제목[^\n]*\n+\s*[-*\d.)\s]*([^\n]{4,60})/);
    const t=(m?m[1]:(r.seed&&r.seed.title)||'').replace(/^["'\u201c\u201d]|["'\u201c\u201d]$/g,'').trim();
    if(t&&out.indexOf(t)<0) out.push(t);
  }
  return out;
}
function userPrompt(row){
  const s=row.seed, d=KINDS[row.kind], L=lenNow(), rt=recentTitles(row);
  return '[근거]\n'+s.src+'\n\n[읽는 사람] '+d.reader+
    '\n\n[쓸 수 있는 그림] '+d.art.map(a=>'「'+ART[a].t+'」').join(' · ')+
    ' — 이 이름들만 쓴다. 우리가 직접 그려 넣을 수 있는 그림이 이것뿐이다.\n\n'+
    (rt.length?('[요 며칠 이미 올린 글]\n'+rt.map(t=>'· '+t).join('\n')+
      '\n이것들과 <b>같은 이야기를 다시 하지 않는다.</b> 제목도 각도도 겹치지 않게 쓴다. '+
      '겹칠 수밖에 없는 소재면 <b>지난번에 안 다룬 쪽</b>을 잡는다.\n\n'):'')+
    d.order(s)+
    '\n\n[출력 형식 — Markdown]\n'+
    '## 제목 후보 5개\n숫자형·질문형·공감형·정보형을 섞어서 만든다. 핵심어를 앞쪽에 두되 단정·과장·최상급은 쓰지 않는다.\n'+
    '## 본문\n소제목(##) '+L.subs+'개, 소제목마다 '+L.sent+' 이상으로 충분히 풀어 쓴다. 본문 '+L.chars+' 이상을 채운다 — 중간에 요약하듯 끊으면 실패다. '+
    '비교표 1개 이상. [쓸 수 있는 그림] 중에서 골라 [이미지: 그림 이름 | alt: 대체텍스트] 자리표시를 본문에 넣는다.\n'+
    '## 해시태그\n10개(대형+롱테일)\n## 메타 설명\n2줄\n## 이 글이 딛고 선 것\n위 [근거] 를 그대로 옮겨 적는다.\n\n'+
    '길이가 모자라 끊기더라도 마지막 「## 이 글이 딛고 선 것」 까지 반드시 끝맺는다.';
}
async function draft(i){
  const row=S.rows[i]; if(!row) return;
  if(!row.seed){ toast('이 줄은 글감이 없습니다. 위에서 글감을 채워 주세요.'); return; }
  if(!aiReady()){ toast('맨 위 «연결» 에서 AI 를 먼저 연결해 주세요.'); CONN_OPEN=true; paint();
    $('conn').scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(S.busy>=0){ toast('한 편씩 만듭니다.'); return; }
  S.busy=i; paint();
  try{
    await comply();
    row.out=await ask(sysPrompt(),userPrompt(row),lenNow().max);
    row.guard=guard(row.out,row.kind);
    S.busy=-1; save(); paint(); show(i);
  }catch(e){ S.busy=-1; paint(); toast('만들지 못했습니다 — '+(e.message||'네트워크 오류')); }
}

/* ══════════ 발행 게이트 ══════════ */
function names(t){
  const out=[]; let m; const re=/([가-힣]{2,4})(님|씨)(?![가-힣])/g;
  while((m=re.exec(t))){ const w=m[1]+m[2];
    if(NOTNAME[w]||NOTNAME[m[1]]) continue;
    if(!out.includes(w)) out.push(w); }
  return out;
}
function artAsked(t){
  const out=[]; let m; const re=/\[이미지\s*:\s*([^\]|]+)/g;
  while((m=re.exec(t))){ const n=m[1].replace(/\s+/g,'').replace(/[「」'"]/g,'');
    if(n&&!out.includes(n)) out.push(n); }
  return out;
}
/* 넉넉히 견준다 — 이름이 조금 달라도 같은 그림이면 통과시킨다 */
function artMissing(t,kind){
  const have=(KINDS[kind]?KINDS[kind].art:[]).map(a=>ART[a].t.replace(/\s+/g,''));
  return artAsked(t).filter(a=>!have.some(b=>a.includes(b)||b.includes(a)));
}
function guard(t,kind){
  const hits=[];
  BAN.forEach(b=>{ b.re.lastIndex=0; let m; while((m=b.re.exec(t))) hits.push({w:m[0],why:b.why}); });
  names(t).forEach(n=>hits.push({w:n,why:'사람 이름처럼 보입니다 — 실명은 나가면 안 됩니다'}));
  const miss=NEED.filter(n=>n.when.test(t)&&!n.must.test(t)).map(n=>n.why);
  const noart=kind?artMissing(t,kind):[];
  noart.forEach(n=>miss.push('「'+n+'」 는 우리가 그릴 수 있는 그림이 아닙니다 — 목록의 그림으로 바꾸거나 그 자리를 지우세요'));
  const holes=t.match(/\[\[확인\s*필요[^\]]*\]\]/g)||[];
  return { hits, miss, holes, noart, ok:!hits.length&&!miss.length&&!holes.length };
}

<script src="blog-art.js"></script>
<script>
/* ══════════ 마크다운 → 보이는 글 ══════════
   네이버 편집기는 마크다운을 모른다. 「##」 이 글자 그대로 보인다.
   그래서 여기서 HTML 로 만들고, <b>서식 있는 복사</b>로 넘긴다. */
function md2html(md,forPaste){
  const lines=String(md||'').split('\n');
  let h='', inTable=false, tRows=[], inList='';
  const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\[\[확인\s*필요([^\]]*)\]\]/g, forPaste?'[확인 필요$1]':'<span class="hole">[[확인 필요$1]]</span>');
  const flushList = () => { if(inList){ h+='</'+inList+'>'; inList=''; } };
  const flushTable = () => {
    if(!inTable) return;
    const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    const head=cells(tRows[0]), body=tRows.slice(2).map(cells);
    h+='<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
       body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    inTable=false; tRows=[];
  };
  for(const raw of lines){
    const s=raw.trim();
    if(/^\|.*\|$/.test(s)){ if(!inTable){ flushList(); inTable=true; tRows=[]; } tRows.push(s); continue; }
    flushTable();
    if(!s){ flushList(); continue; }
    const img=s.match(/^\[이미지\s*:\s*([^\]|]+)(?:\|\s*alt\s*:\s*([^\]]*))?\]$/);
    if(img){ flushList();
      h+='<div class="ph">🖼️ 여기에 <b>'+esc(img[1].trim())+'</b> 그림을 넣으세요'+
         (img[2]?' <span style="font-weight:400">(alt: '+esc(img[2].trim())+')</span>':'')+'</div>'; continue; }
    let m;
    if((m=s.match(/^###\s+(.*)$/))){ flushList(); h+='<h3>'+inline(m[1])+'</h3>'; continue; }
    if((m=s.match(/^##\s+(.*)$/))){ flushList(); h+='<h2>'+inline(m[1])+'</h2>'; continue; }
    if((m=s.match(/^#\s+(.*)$/))){ flushList(); h+='<h2>'+inline(m[1])+'</h2>'; continue; }
    if((m=s.match(/^>\s?(.*)$/))){ flushList(); h+='<blockquote>'+inline(m[1])+'</blockquote>'; continue; }
    if((m=s.match(/^[-*]\s+(.*)$/))){ if(inList!=='ul'){ flushList(); h+='<ul>'; inList='ul'; }
      h+='<li>'+inline(m[1])+'</li>'; continue; }
    if((m=s.match(/^\d+[.)]\s+(.*)$/))){ if(inList!=='ol'){ flushList(); h+='<ol>'; inList='ol'; }
      h+='<li>'+inline(m[1])+'</li>'; continue; }
    flushList(); h+='<p>'+inline(s)+'</p>';
  }
  flushTable(); flushList();
  return h;
}

/* ══════════ 올리기 ══════════ 이 화면의 이유 */
function packText(i){
  const row=S.rows[i], c=S.comply, out=row.out;
  let tail='';
  if(c){
    tail='\n\n──────────\n'+(c['카드_하단_고정']||'');
    if(/변액|펀드|주식|투자|ETF|수익률/.test(out)&&c['투자상품_문구']) tail+='\n'+c['투자상품_문구'];
    if(/달러|외화|환율/.test(out)&&c['달러보험_문구']) tail+='\n'+c['달러보험_문구'];
    if(/세액공제|비과세|절세|상속|증여|과세/.test(out)&&c['세제_문구']) tail+='\n'+c['세제_문구'];
    /* 없는 것은 안 적는다 — 심의필 번호를 안 받으셨는데 적으면 그것이 거짓말이다 */
    const stamp=[c['소속']||'', c['광고심의필']?('광고심의필 '+c['광고심의필']):''].filter(Boolean).join(' · ');
    if(stamp) tail+='\n'+stamp;
  }else{
    tail='\n\n──────────\n[준법 문구를 못 읽었습니다 — config/compliance.json 을 확인하고 회사 문구를 직접 붙여 주세요]';
  }
  return out+tail;
}
/* 서식 있는 복사 — 붙이면 제목·표·인용이 그대로 선다.
   안 되는 브라우저에서는 글자만이라도 넘어가게 한다. */
async function copyRich(i){
  const row=S.rows[i];
  if(!row.guard||!row.guard.ok){ toast('고칠 곳이 남아 있습니다. 위 빨간 칸을 먼저 처리해 주세요.'); return; }
  await comply();          /* 저장해 둔 글을 다시 열었을 때도 준법 문구가 붙게 */
  const text=packText(i);
  const html='<div style="font-family:sans-serif;line-height:1.7">'+md2html(text,true)+'</div>';
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html],{type:'text/html'}),

  }catch(e){
    try{ await navigator.clipboard.writeText(text); toast('글자만 복사했습니다 (이 브라우저는 서식 복사를 못 합니다)'); }

/* ══════════ 오늘 한 편 ══════════
   매일 쓰려면 아침에 <b>누를 단추가 하나</b>여야 한다. 뉴스 받기·편성·글감 찾기·초안을
   따로 누르게 하면 사흘째에 안 열게 된다. 다만 <b>글감이 없으면 만들지 않는다</b> —
   무엇을 어디에 적어야 하는지 말하고 그 칸으로 데려다 놓는 데서 멈춘다. (CLAUDE.md 1) */
function freshSeed(kind){
  const pool=(seeds()[kind]||[]); if(!pool.length) return null;
  /* 이미 글로 쓴 글감은 건너뛴다 — 같은 이야기를 이틀 연속 올리게 된다 */
  const done={}; S.rows.forEach(r=>{ if(r.out&&r.seed) done[r.seed.title]=1; });
  const un=pool.filter(x=>!done[x.title]);
  return un.length?un[0]:pool[0];   /* 담은 것은 맨 앞이 최신이다 — 오늘 아침 적은 것부터 쓴다 */
}

/* 앞으로 며칠을 더 쓸 수 있나 — 글감이 바닥나는 날을 <b>바닥나기 전에</b> 말한다.
   아침에 열어 보고서야 「없습니다」 를 만나면 그날은 못 쓴다. */
/* 앞으로 <b>이레</b>만 본다. 한 달치를 재면 어느 갈래든 반드시 바닥나서
   날마다 「비었습니다」 가 뜬다 — 그러면 아무도 안 읽는다. (CLAUDE.md 8) */
const RUNDAYS = 7;
function runway(){
  const s=seeds(), left={}, t=ymd(0), end=ymd(RUNDAYS), dry={};
  ORDER.forEach(k=>left[k]=(s[k]||[]).length);
  S.rows.forEach(r=>{ if(r.out&&r.seed&&left[r.kind]) left[r.kind]--; });
  let n=0;
  for(const r of S.rows){
    if(!r.ymd||r.ymd<t||r.ymd>=end||r.up||r.out) continue;
    /* 빈 갈래 하나로 「하루밖에 못 쓴다」 고 말하지 않는다 — 그 갈래만 비었을 뿐이다.
       대신 <b>어느 갈래가 비었는지</b>를 이름으로 말한다. */
    if(left[r.kind]>0){ left[r.kind]--; n++; } else dry[r.kind]=1;
  }
  return { n, dry:ORDER.filter(k=>dry[k]) };
}

}

               '<button class="sm" onclick="copyAlt('+i+',\''+a.id+'\')">alt 복사</button></div>')+
      '</div>').join('')+
    '<h2 style="margin-top:18px">본문 — 붙여넣으면 이렇게 보입니다</h2>'+
    '<div class="body">'+md2html(packText(i),false)+'</div>'+
  '</div>';
  $('view').scrollIntoView({behavior:'smooth',block:'start'});
}
function pngOne(i,id){ const r=build(id,S.rows[i]); if(r.err){ toast(r.err); return; } png(r); }
function copyAlt(i,id){ const r=build(id,S.rows[i]); if(r.err){ toast(r.err); return; }
  navigator.clipboard.writeText(r.alt).then(()=>toast('alt 를 복사했습니다'),()=>toast('복사하지 못했습니다')); }

/* ══════════ 연결 — 앱과 <b>같은 저장칸</b>에 쓴다 ══════════
   여기서 넣으면 앱에도 그대로 들어가고, 앱에서 넣으면 여기서도 쓰인다.
   칸을 따로 만들면 두 벌이 되어 「앱에서는 되는데 여기서는 안 되는」
   자리가 생긴다 (CLAUDE.md 5).

   키는 <b>이 브라우저에만</b> 남는다. 서버로 보내지 않는다. 화면에도
   통째로 다시 띄우지 않는다 — 어깨너머로 읽히고, 캡처에 찍힌다.
   저장해 둔 것은 앞뒤 몇 자만 보여 준다 (CLAUDE.md 10).            */
const LSset = (k, v) => { try{ v ? localStorage.setItem(LSK(k), v) : localStorage.removeItem(LSK(k)); }catch(e){} };
const mask = v => !v ? '' : (v.length <= 12 ? '••••' : v.slice(0,7) + '…' + v.slice(-4));
let CONN_OPEN = false;
function connOpen(){ CONN_OPEN = !CONN_OPEN; paint(); if(CONN_OPEN) $('conn').scrollIntoView({behavior:'smooth',block:'center'}); }
function connMode(m){ LSset('conn', m); paint(); }
function connSave(){
  const m = LS('conn','direct');
  if (m === 'proxy'){
    const u = ($('c_proxy').value||'').trim();
    if (u && !/^https?:\/\//.test(u)){ toast('프록시 주소는 https:// 로 시작해야 합니다.'); return; }
    LSset('proxy', u); LSset('apptoken', ($('c_tok').value||'').trim());
  } else {
    const k = ($('c_key').value||'').trim();
    /* 빈 칸이면 지우지 않는다 — 넣어 둔 키를 실수로 날리지 않게 */
    if (k){
      if (!/^sk-ant-/.test(k)) toast('Claude 키는 보통 sk-ant- 로 시작합니다. 그대로 저장은 했습니다.');
      LSset('apikey', k);
    }
  }
  LSset('model', ($('c_model').value||'').trim());
  const org=($('c_org').value||'').trim(), nm=($('c_name').value||'').trim(), ttl=($('c_title').value||'').trim();
  if (org || nm){
    /* 그림 꼬리말에 들어갈 이름. 앱이 쓰는 그 칸에 그대로 쓴다.
       로그인 전 앱도 이 칸(guest)을 본다. */
    try{ localStorage.setItem('apex_intro_guest', JSON.stringify({ org, name:nm, title:ttl, at:Date.now() })); }catch(e){}
  }
  if ($('c_key')) $('c_key').value = '';
  /* 저장하면 연결됨이 되어 이 칸이 닫히던 자리 — 넣자마자 사라져서
     제대로 들어갔는지 확인할 수가 없었다. 저장 뒤에는 열어 둔다.
     («연결 확인» 을 눌러 보시라고 두는 것이기도 하다.) */
  CONN_OPEN = true;
  toast('저장했습니다 — 앱에도 같이 반영됩니다');
  paint();
}
function connClear(){
  if (!confirm('저장해 둔 연결(키·프록시·토큰)을 지울까요? 앱에서도 같이 지워집니다.')) return;
  ['apikey','proxy','apptoken','model'].forEach(k => LSset(k, ''));
  toast('지웠습니다'); paint();
}
async function connTest(){
  const b = $('c_test'); b.disabled = true; b.innerHTML = '<span class="spin"></span> 부르는 중…';
  try{
    const out = await ask('한 단어로만 답한다.', '연결 확인. 「좋습니다」 라고만 답해줘.', 32);
    toast(out && out.trim() ? ('연결됐습니다 — AI 가 답했습니다: ' + out.trim().slice(0,20)) : '답이 비어서 왔습니다');
  }catch(e){ toast('연결 안 됩니다 — ' + (e.message||'').slice(0,120), 6000); }
  b.disabled = false; b.textContent = '🔌 연결 확인';
  paint();
}
function connBox(){
  const m = LS('conn','direct'), ok = aiReady();
  let intro = {};
  try{ intro = JSON.parse(localStorage.getItem('apex_intro_guest')||'null') || {}; }catch(e){}
  return '<h2>⚙ 연결 — 이 브라우저에만 저장됩니다</h2>'+
    '<div class="desc">앱(APEX)에 넣어 두셨다면 <b>그대로 쓰입니다</b> — 여기서 넣으면 앱에도 같이 들어갑니다. '+
    '<b>키는 서버로 보내지 않고 이 브라우저에만</b> 남습니다.</div>'+
    '<div class="row" style="margin-bottom:10px">'+
      '<button class="'+(m==='direct'?'p':'')+'" onclick="connMode(\'direct\')">① 내 API 키 직접</button>'+
      '<button class="'+(m==='proxy'?'p':'')+'" onclick="connMode(\'proxy\')">② 서버 프록시(키 없이)</button>'+
    '</div>'+
    (m==='proxy'
      ? '<div style="margin-bottom:8px"><label>프록시 주소</label>'+
        '<input id="c_proxy" placeholder="https://내사이트/api/generate" value="'+esc(LS('proxy'))+'"></div>'+
        '<div style="margin-bottom:8px"><label>공유 토큰 (서버에 SHARED_TOKEN 을 걸어 두셨을 때만)</label>'+
        '<input id="c_tok" placeholder="비워 두면 미사용" value="'+esc(LS('apptoken'))+'"></div>'
      : '<div style="margin-bottom:8px"><label>내 Claude API 키'+
        (LS('apikey')?' <span style="color:var(--ok)">— 저장돼 있습니다 ('+esc(mask(LS('apikey')))+')</span>':'')+'</label>'+
        '<input id="c_key" type="password" autocomplete="off" placeholder="'+(LS('apikey')?'바꿀 때만 새로 넣으세요':'sk-ant-…')+'"></div>')+
    '<div style="margin-bottom:8px"><label>모델 (비워 두면 서버·앱이 정한 기본값)</label>'+
    '<input id="c_model" placeholder="예: claude-sonnet-4-6" value="'+esc(LS('model'))+'"></div>'+
    '<div class="row" style="margin-bottom:12px">'+
      '<button class="p" onclick="connSave()">저장</button>'+
      '<button id="c_test" onclick="connTest()"'+(ok?'':' disabled')+'>🔌 연결 확인</button>'+
      '<button onclick="connClear()">지우기</button>'+
    '</div>'+
    '<h2 style="font-size:14px">그림 꼬리말에 넣을 이름 <span style="font-weight:400;font-size:12px;color:var(--sub)">(비워 두면 아무것도 안 넣습니다)</span></h2>'+
    '<div class="row">'+
      '<div style="flex:1;min-width:150px"><label>소속</label><input id="c_org" placeholder="예: ○○본부" value="'+esc(intro.org||'')+'"></div>'+
      '<div style="flex:1;min-width:110px"><label>이름</label><input id="c_name" placeholder="예: 홍길동" value="'+esc(intro.name||'')+'"></div>'+
      '<div style="flex:1;min-width:110px"><label>직함</label><input id="c_title" placeholder="예: 사업단장" value="'+esc(intro.title||'')+'"></div>'+
    '</div>'+
    '<div class="note">넣어 두시면 그림 오른쪽 아래에 <b>소속 · 이름 직함</b>이 들어갑니다. '+
    '안 넣으시면 <b>아무것도 안 넣습니다</b> — 없는 이름을 만들지 않습니다. '+
    '앱에 「내 소개」를 이미 적어 두셨다면 그것을 그대로 씁니다.</div>';
}

function paint(){
  paintSeeds(); paintRows(); paintToday();
  /* 연결이 안 돼 있으면 묻지 않아도 열어 둔다 — 여기서 막히면 아무것도 못 한다 */
  const box = $('conn'), want = CONN_OPEN || !aiReady();
  box.hidden = !want;
  if (want) box.innerHTML = connBox();
  $('tgAi').textContent=aiReady()?('AI 연결됨'+(LS('conn','direct')==='proxy'?' · 프록시':' · 내 키')):'AI 연결 안 됨 — 누르세요';
  $('tgAi').className='tag '+(aiReady()?'on':'off');
  /* ── 못 받았으면 <b>왜</b> 못 받았는지 화면에 남긴다 ────────────────
     전에는 실패를 toast 한 줄로만 알렸다. toast 는 몇 초 뒤 사라지고,
     배지는 「뉴스 아직 안 받음」 그대로였다 — 누른 사람은 <b>눌리지도
     않은 줄</b> 알았다. 실제로 그래서 「블로그가 작동도 안 된다」로
     보였다. 이유를 배지 옆에 <b>남겨 둔다</b> (CLAUDE.md 1번). */
  const n=(S.news.items||[]).length;
  $('tgNews').textContent=n?('뉴스 '+n+'건 · '+S.news.at):'뉴스 아직 안 받음';
  $('tgNews').className='tag '+(n?'on':(S.news.err?'off':''));
  /* 회사 문구가 안 들어가 있으면 <b>기본값이라고 계속 말한다</b> — 조용히 붙어 나가면 회사 것인 줄 안다 */
  const cbox=$('cmp'), cwant=CMP_OPEN;
  cbox.hidden=!cwant;
  if(cwant) cbox.innerHTML=cmpBox();
  $('tgCmp').textContent=S.complyMine?'준법 문구 — 회사 것':'준법 문구 — 기본값입니다';
  $('tgCmp').className='tag '+(S.complyMine?'on':'off');
  paintNewsWhy();
}
/* 무엇 때문에 못 받았나 · 무엇을 하면 되나 */
function newsFix(err){
  const e=String(err||'');
  if(/토큰/.test(e))
    return '아래 <b>⚙ 연결</b>을 열고 <b>② 서버 프록시</b> 칸의 <b>공유 토큰</b>에 '+
           '앱과 같은 값을 넣어 주세요. 앱(APEX)에 이미 넣어 두셨다면 그 값이 그대로 쓰입니다.';
  if(/아직 없습니다|서버가 4|서버가 5/.test(e))
    return '서버 창구(/api/market)가 응답하지 않습니다. 잠시 뒤 다시 눌러 보세요.';
  return '';
}
function paintNewsWhy(){
  let box=document.getElementById('newsWhy');
  const err=(S.news&&S.news.err)||'', n=(S.news.items||[]).length;
  if(!err||n){ if(box&&box.parentNode) box.parentNode.removeChild(box); return; }
  if(!box){
    box=document.createElement('div'); box.id='newsWhy';
    box.setAttribute('style','margin:8px 0 0;padding:9px 11px;border-radius:9px;'+
      'background:#FEF3F2;border:1px solid #F8CFCB;color:#7A1F1A;font-size:12px;line-height:1.7');
    const t=document.getElementById('tgNews');
    (t&&t.parentNode?t.parentNode:document.body).appendChild(box);
  }
  const fix=newsFix(err);
  box.innerHTML='<b>뉴스를 못 받았습니다</b> — '+esc(err)+
    (fix?('<br>'+fix):'')+
    '<br><span style="opacity:.8">글감이 없으면 글을 만들지 않습니다 — 없는 기사를 지어내지 않습니다.</span>';
}
/* 준법 문구는 열 때 한 번 미리 읽어 둔다 — 읽고 나서 딱지를 다시 그린다 */
load(); paint(); comply().then(paint);
</script>

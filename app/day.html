<style>
/* ─────────────────────────────────────────────────────────────
   하루 한 장 — 폰에서 쓰는 판.

   지금은 TFA 업무관리에서 보고 → DB 통합 CRM 을 열고 → 명단에서 찾고
   → 표를 옆으로 밀어 기록합니다. 왕복이 네 번입니다. 폰에서 표는
   최악입니다 — 손가락 하나로 가로 스크롤을 하게 됩니다.

   그래서 한 장으로 합칩니다. 한 번에 한 사람만 세우고, 전화를 걸고,
   돌아와서 세 번 눌러 기록합니다. 그 기록이 날짜를 만들고,
   그 날짜가 내일의 명단이 됩니다. 그게 캘린더입니다.
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#F2F5FA; --card:#FFFFFF; --sunk:#E9EFF8;
  --ink:#0B2447; --ink2:#42566F; --ink3:#7C8DA5; --hair:#DBE3F0;
  --core:#1A56DB; --core2:#3B82F6; --glow:rgba(26,86,219,.14);
  --miss:#B45309; --miss-bg:rgba(180,83,9,.10);
  --no:#B91C1C;   --no-bg:rgba(185,28,28,.10);
  --yes:#15803D;  --yes-bg:rgba(21,128,61,.10);
  --sh:0 8px 22px -14px rgba(11,36,71,.5);
  --sh2:0 -6px 20px -12px rgba(11,36,71,.28);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070C16; --card:#111A2B; --sunk:#192335;
  --ink:#E9F0FB; --ink2:#A9BBD4; --ink3:#6D8099; --hair:#233149;
  --core:#5E92FF; --core2:#38BDF8; --glow:rgba(94,146,255,.20);
  --miss:#FBBF24; --miss-bg:rgba(251,191,36,.14);
  --no:#F87171;   --no-bg:rgba(248,113,113,.14);
  --yes:#4ADE80;  --yes-bg:rgba(74,222,128,.14);
  --sh:0 12px 30px -16px rgba(0,0,0,.9);
  --sh2:0 -8px 24px -14px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --bg:#070C16; --card:#111A2B; --sunk:#192335;
  --ink:#E9F0FB; --ink2:#A9BBD4; --ink3:#6D8099; --hair:#233149;
  --core:#5E92FF; --core2:#38BDF8; --glow:rgba(94,146,255,.20);
  --miss:#FBBF24; --miss-bg:rgba(251,191,36,.14);
  --no:#F87171;   --no-bg:rgba(248,113,113,.14);
  --yes:#4ADE80;  --yes-bg:rgba(74,222,128,.14);
  --sh:0 12px 30px -16px rgba(0,0,0,.9);
  --sh2:0 -8px 24px -14px rgba(0,0,0,.85);
}
/* 글씨체는 APEX 본체·DB 통합 CRM 과 <b>같은 것 하나</b>만 쓴다.
   다른 글씨체를 쓰면 폰에서 열었을 때 남의 앱처럼 보이고,
   구글 폰트를 따로 받느라 첫 화면이 늦게 뜬다.
   숫자를 줄맞춤해야 하는 자리는 같은 글씨체의 고정폭 숫자(tabular-nums)를 쓴다. */
:root{
  --f:'Pretendard','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;
  overscroll-behavior-y:none}
.phone{max-width:460px;margin:0 auto;height:100vh;height:100dvh;
  display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (max-width:639px){ body{overflow:hidden;height:100dvh} }
@media (min-width:640px){
  body{background:linear-gradient(160deg,#0B2447 0%,#1A56DB 100%);padding:22px 0}
  .phone{border-radius:26px;overflow:hidden;box-shadow:0 30px 70px -30px rgba(0,0,0,.7);
    height:min(880px,calc(100vh - 44px))}
}

/* ── 위 ── */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--hair);
  padding:11px 16px 10px}
.t1{display:flex;align-items:center;gap:9px}
.t1 b{font-family:var(--f);font-weight:900;font-size:19px;letter-spacing:-.6px;
  white-space:nowrap;flex:none}
.t1 .sp{min-width:0}
.pill{overflow:hidden;text-overflow:ellipsis;max-width:112px}
.t1 span{font-size:12px;color:var(--ink3);font-weight:700}
.t1 .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.pill{font-family:var(--f);font-variant-numeric:tabular-nums;font-size:10px;font-weight:600;border-radius:99px;
  padding:4px 9px;border:1px dashed var(--hair);color:var(--ink3);white-space:nowrap}
.pill.on{border-style:solid;border-color:var(--core);color:var(--core);background:var(--glow)}
.t2{display:flex;gap:7px;margin-top:9px}
.kpi{flex:1;background:var(--sunk);border-radius:11px;padding:7px 9px;text-align:center}
.kpi b{display:block;font-family:var(--f);font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;line-height:1.2;
  font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:10px;color:var(--ink3);margin-top:1px}
.kpi.a b{color:var(--miss)} .kpi.b b{color:var(--core)} .kpi.c b{color:var(--yes)}

/* ── 본문 ── */
.body{flex:1;overflow-y:auto;padding:14px 14px 90px;-webkit-overflow-scrolling:touch}
.sec{font-family:var(--f);font-weight:800;font-size:11.5px;color:var(--ink3);
  letter-spacing:.02em;margin:20px 2px 8px;display:flex;align-items:center;gap:7px}
.sec i{font-style:normal;font-family:var(--f);font-variant-numeric:tabular-nums;font-size:10px;background:var(--sunk);
  border-radius:99px;padding:2px 7px;color:var(--ink2)}
.sec:first-child{margin-top:2px}

/* 지금 이 사람 */
.now{background:var(--card);border:1px solid var(--hair);border-radius:18px;box-shadow:var(--sh);
  overflow:hidden}
.now-h{padding:15px 16px 13px;border-bottom:1px solid var(--hair)}
.now-t{display:flex;align-items:flex-start;gap:10px}
.now-t b{font-family:var(--f);font-weight:900;font-size:23px;letter-spacing:-.7px;line-height:1.2}
.tag{font-family:var(--f);font-weight:800;font-size:10.5px;border-radius:99px;
  padding:3px 9px;white-space:nowrap;margin-top:4px}
.tag.miss{background:var(--miss-bg);color:var(--miss)}
.tag.no{background:var(--no-bg);color:var(--no)}
.tag.yes{background:var(--yes-bg);color:var(--yes)}
.tag.new{background:var(--glow);color:var(--core)}
.now-s{font-size:12px;color:var(--ink3);margin-top:3px}
.now-w{font-size:13px;color:var(--ink2);line-height:1.75;margin-top:9px;
  background:var(--sunk);border-radius:11px;padding:9px 12px}
.now-w b{color:var(--ink);font-weight:800}
.call{display:flex;gap:8px;padding:13px 16px;border-bottom:1px solid var(--hair)}
.call a,.call button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  border:0;border-radius:13px;padding:15px 10px;font-family:var(--f);font-weight:800;
  font-size:15.5px;cursor:pointer;text-decoration:none;font-family:var(--f)}
.call .go{background:var(--core);color:#fff;box-shadow:0 6px 16px -8px var(--core)}
.call .sk{flex:0 0 88px;background:var(--sunk);color:var(--ink3);font-size:13px}
.rec{padding:13px 16px 15px}
.rl{font-family:var(--f);font-weight:800;font-size:11px;color:var(--ink3);margin:0 0 7px}
.r3{display:flex;gap:7px}
.r3 button{flex:1;border:1.5px solid var(--hair);background:var(--card);border-radius:12px;padding:12px 4px;
  font-family:var(--f);font-weight:800;font-size:14px;color:var(--ink2);cursor:pointer}
.r3 button.on.miss{border-color:var(--miss);background:var(--miss-bg);color:var(--miss)}
.r3 button.on.no{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.r3 button.on.yes{border-color:var(--yes);background:var(--yes-bg);color:var(--yes)}
.rn{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.rn button{border:1.5px solid var(--hair);background:var(--card);border-radius:11px;padding:9px 13px;
  font-family:var(--f);font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px;color:var(--ink2);cursor:pointer}
.rn button.on{border-color:var(--core);background:var(--glow);color:var(--core)}
.memo{width:100%;border:1.5px solid var(--hair);background:var(--card);border-radius:12px;padding:11px 12px;
  font:inherit;font-size:14px;color:var(--ink);margin-top:4px;resize:none;min-height:46px}
.memo:focus{outline:none;border-color:var(--core)}
.save{width:100%;border:0;border-radius:14px;padding:16px;background:var(--ink);color:var(--bg);
  font-family:var(--f);font-weight:900;font-size:16px;cursor:pointer;margin-top:11px}
.save[disabled]{opacity:.35}
.save.ready{background:var(--core);color:#fff;box-shadow:0 8px 20px -10px var(--core)}

/* 줄 */
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--hair);
  border-radius:13px;padding:11px 13px;margin-bottom:7px;width:100%;text-align:left;font:inherit;
  color:inherit;cursor:pointer}
.row .tm{flex:none;font-family:var(--f);font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px;color:var(--core);
  width:42px;font-variant-numeric:tabular-nums}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-family:var(--f);font-weight:800;font-size:14.5px;letter-spacing:-.3px}
.row .m span{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{flex:none;font-size:11px;color:var(--ink3);font-family:var(--f);font-variant-numeric:tabular-nums}
.row.bad{border-color:var(--no)}
.row.bad .r{color:var(--no)}
.empty{font-size:12.5px;color:var(--ink3);text-align:center;padding:22px 10px;line-height:1.9}

/* 주간 */
.wk{display:flex;gap:5px;margin-bottom:12px}
.wd{flex:1;background:var(--card);border:1px solid var(--hair);border-radius:13px;padding:9px 3px 8px;
  text-align:center;cursor:pointer}
.wd.on{border-color:var(--core);background:var(--glow)}
.wd.today b{color:var(--core)}
.wd span{display:block;font-size:10px;color:var(--ink3)}
.wd b{display:block;font-family:var(--f);font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;margin:2px 0 5px;
  font-variant-numeric:tabular-nums}
.wd .dots{display:flex;gap:3px;justify-content:center;min-height:7px;align-items:center}
.wd .dot{display:block;width:5px;height:5px;border-radius:50%;flex:none}
.dot.ap{background:var(--core)} .dot.cl{background:var(--miss)} .dot.bd{background:var(--yes)}

/* 사람 */
.find{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--hair);
  border-radius:13px;padding:0 12px;margin-bottom:9px}
.find input{flex:1;border:0;background:transparent;font:inherit;font-size:14.5px;color:var(--ink);padding:12px 0}
.find input:focus{outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;margin-bottom:3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--hair);background:var(--card);border-radius:99px;
  padding:7px 13px;font-family:var(--f);font-weight:700;font-size:12.5px;color:var(--ink2);cursor:pointer}
.chips button.on{background:var(--core);border-color:var(--core);color:#fff}

/* 아래 ── 엄지가 닿는 곳 */
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--card);
  border-top:1px solid var(--hair);box-shadow:var(--sh2);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;border:0;background:transparent;padding:9px 4px 7px;cursor:pointer;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font:inherit}
.tab b{font-family:var(--f);font-weight:800;font-size:11.5px}
.tab .ic{font-size:19px;line-height:1}
.tab.on{color:var(--core);background:var(--glow)}
.tf{background:var(--card);border:1.5px solid var(--core);border-radius:15px;padding:13px 15px;
  margin-bottom:12px;box-shadow:var(--sh)}
.tf>b{display:block;font-family:var(--f);font-weight:900;font-size:13px;color:var(--core)}
.tf>b s{text-decoration:none;font-weight:600;font-size:10px;color:var(--ink3);
  font-family:var(--f);font-variant-numeric:tabular-nums}
.tf>p{margin:7px 0 0;font-size:14px;line-height:1.8;color:var(--ink);white-space:pre-wrap}
.tf>q{display:block;quotes:none;margin-top:9px;background:var(--sunk);border-radius:10px;
  padding:9px 11px;font-size:11.5px;color:var(--ink2);line-height:1.7}
.tf>em{display:flex;gap:7px;margin-top:11px;font-style:normal}
.tf>em button{flex:1;border:0;border-radius:11px;padding:11px 6px;background:var(--core);color:#fff;
  font-family:var(--f);font-weight:800;font-size:12.5px;cursor:pointer}
.tf>em button.gh{flex:0 0 auto;background:var(--sunk);color:var(--ink2);padding:11px 13px}
.tab .bdg{position:absolute;transform:translate(15px,-4px);background:var(--no);color:#fff;
  font-family:var(--f);font-variant-numeric:tabular-nums;font-size:9px;font-weight:600;border-radius:99px;padding:1px 5px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);background:var(--ink);
  color:var(--bg);border-radius:12px;padding:11px 18px;font-size:13.5px;font-weight:700;opacity:0;
  pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:88%;text-align:center;line-height:1.6}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:11px;color:var(--ink3);line-height:1.8;background:var(--sunk);border-radius:12px;
  padding:11px 13px;margin-top:14px}
.note b{color:var(--ink2);font-weight:800}

/* 약속 고르기 · 고객 카드 · 못 올린 것 · 들어갈 내용 */
.rl b.req{font-family:var(--f);font-variant-numeric:tabular-nums;font-size:9px;font-weight:600;color:var(--no);
  background:var(--no-bg);border-radius:99px;padding:2px 7px;margin-left:5px}
.rl span{font-weight:400;color:var(--ink3);font-size:10.5px;margin-left:5px}
.pickd{position:relative;display:inline-flex;align-items:center;border:1.5px solid var(--hair);
  background:var(--card);border-radius:11px;padding:9px 13px;font-family:var(--f);font-variant-numeric:tabular-nums;
  font-weight:600;font-size:12.5px;color:var(--ink2);cursor:pointer;overflow:hidden}
.pickd.on{border-color:var(--core);background:var(--glow);color:var(--core)}
.pickd input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.apok{margin-top:10px;background:var(--yes-bg);border-radius:11px;padding:10px 13px;font-size:13.5px;
  color:var(--ink);line-height:1.6}
.apok b{font-family:var(--f);font-weight:900}
.apok.past{background:var(--no-bg)}
.back{background:var(--glow);border-radius:11px;padding:10px 13px;font-size:13px;color:var(--ink);
  margin-bottom:11px;line-height:1.6}
.back b{font-family:var(--f);font-weight:800;color:var(--core)}
.warn{margin-top:8px;font-size:11.5px;color:var(--no);line-height:1.6;text-align:center}
.warn b{font-weight:800}

.c365{margin-top:9px;border:1px dashed var(--hair);border-radius:12px;padding:10px 12px;
  display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.c365>b{width:100%;display:flex;align-items:center;gap:6px;
  font-family:var(--f);font-weight:800;font-size:11px;color:var(--ink3);
  margin-bottom:2px}
.c365>b i{font-style:normal;font-family:var(--f);font-variant-numeric:tabular-nums;font-size:9px;background:var(--sunk);
  border-radius:99px;padding:2px 7px;margin-left:5px;color:var(--ink3)}
.c365 span{font-size:12.5px;color:var(--ink);line-height:1.6}
.c365 span em{font-style:normal;font-size:10px;color:var(--ink3);display:block}
.c365>u{width:100%;text-decoration:none;font-size:10.5px;color:var(--ink3);margin-top:3px}
.c365.none{display:block;font-size:12px;color:var(--ink3);line-height:1.7}
.c365.none b{color:var(--ink2);font-weight:800}

.bk{background:var(--miss-bg);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--ink);
  line-height:1.65;margin-bottom:12px}
.bk b{font-weight:800;color:var(--miss)}
.bk span{display:block;font-size:11.5px;color:var(--ink3);margin-top:6px}
.bk em{font-style:normal;display:inline-flex;gap:4px;margin:0 4px}
.bk u{text-decoration:none;border:1px solid var(--hair);background:var(--card);border-radius:8px;
  padding:3px 9px;font-family:var(--f);font-variant-numeric:tabular-nums;font-weight:600;font-size:11.5px;
  color:var(--ink2);cursor:pointer}
.bk u.on{background:var(--miss);border-color:var(--miss);color:#fff}
.qbar{display:flex;align-items:center;gap:9px;background:var(--no-bg);border-radius:12px;padding:10px 13px;
  font-size:12.5px;color:var(--ink);margin-bottom:12px;line-height:1.5}
.qbar b{font-family:var(--f);font-variant-numeric:tabular-nums;font-weight:600;color:var(--no)}
.qbar.old{display:block}
.qbar.old span{display:flex;gap:6px;margin-top:9px}
.qbar.old button{margin-left:0;flex:1}
.qbar button.gh{background:transparent;border:1px solid var(--no);color:var(--no)}
.nop{background:var(--sunk);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--ink);
  line-height:1.6;margin-top:14px}
.nop b{font-weight:800;color:var(--miss)}
.nop span{display:block;font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.7}
.nop a{display:inline-block;margin-top:8px;text-decoration:none;background:var(--core);color:#fff;
  border-radius:10px;padding:9px 14px;font-family:var(--f);font-weight:800;font-size:12px}

<script>
(function(){
'use strict';


/* ══════════════════════════════════════════════════════════════════
   혼자 열렸을 때 — 스스로 서버에 붙는다

   앱 안(iframe)이면 부모가 이미 읽어 둔 것을 쓴다. 그런데 폰 홈 화면에
   아이콘으로 담아 두면 부모가 없다. 그때 아무것도 못 하면 이 판은
   쓸모가 없다. 그래서 db-crm.html 이 하는 것과 같은 방식으로 붙는다 —
   같은 주소, 같은 열쇠, 이미 로그인해 둔 그 사람으로.
   새 로그인창을 만들지 않는다. APEX 에 한 번 들어와 있으면 그대로 된다.
   ══════════════════════════════════════════════════════════════════ */
var SB=null, ME=null, SRV=null, AUTH='';
function sbBoot(){
  if(P())return;                                   /* 부모가 있으면 그쪽 */
  if(typeof window.supabase==='undefined'){AUTH='';return;}
  var cfg=window.APEX_SB||null;
  if(!cfg||!cfg.url){try{cfg=JSON.parse(localStorage.getItem('apexSupabaseConfigV1')||'null');}catch(e){cfg=null;}}
  if(!cfg||!cfg.url||!cfg.key){AUTH='서버 설정이 없습니다 — APEX 를 한 번 열어 주세요';paint();return;}
  try{SB=window.supabase.createClient(cfg.url,cfg.key);}catch(e){AUTH='서버에 붙지 못했습니다';paint();return;}
  AUTH='서버에 붙는 중…'; paint();
  SB.auth.getSession().then(function(r){
    var u=r&&r.data&&r.data.session&&r.data.session.user;
    if(!u){SB=null;AUTH='로그인이 필요합니다 — APEX 에서 한 번 로그인하시면 여기도 열립니다';paint();return;}
    ME={id:u.id,name:''};
    SB.from('profiles').select('name').eq('id',u.id).single().then(function(x){
      if(x&&x.data&&x.data.name)ME.name=x.data.name;
      srvLoad();
    },function(){srvLoad();});
  },function(){SB=null;AUTH='서버에 붙지 못했습니다 — 신호를 확인해 주세요';paint();});
}
var DBCOLS='id,assigned_to,customer_name,phone,region,assigned_date';
function srvLoad(){
  if(!SB||!ME)return;
  AUTH='기록을 읽는 중…'; paint();
  var q=function(pp){return pp.then(function(r){return r;},function(e){return {error:e||{message:'실패'}};});};
  var down=function(m){return /column|42703|does not exist|schema cache/i.test(''+(m||''));};
  /* 서버마다 칸이 다르다. 없는 칸이 하나 있다고 전부 못 읽으면 안 된다 */
  var qDb=function(){
    return q(SB.from('dbs').select(DBCOLS+',source,stage,next_appt,contracted_at,policy_sent_at').eq('assigned_to',ME.id))
      .then(function(r){
        if(!r||!r.error||!down((r.error||{}).message))return r;
        return q(SB.from('dbs').select(DBCOLS+',source').eq('assigned_to',ME.id)).then(function(r2){
          if(!r2||!r2.error||!down((r2.error||{}).message))return r2;
          return q(SB.from('dbs').select(DBCOLS).eq('assigned_to',ME.id));
        });
      });
  };
  Promise.all([
    qDb(),
    q(SB.from('calls').select('db_id,created_by,call_at,result,memo,appointment_at')
        .eq('created_by',ME.id).order('call_at',{ascending:false}).limit(3000)),
    q(SB.from('clients').select('id,advisor_id,name_masked,created_at').eq('advisor_id',ME.id)),
    q(SB.from('saved_reports').select('id,client_id,content').eq('kind','client_meta'))
  ]).then(function(r){
    var dbs=r[0].error?[]:(r[0].data||[]), calls=r[1].error?[]:(r[1].data||[]);
    var cls=r[2].error?[]:(r[2].data||[]), mets=r[3].error?[]:(r[3].data||[]);
    if(r[0].error){AUTH='배정 DB 를 읽지 못했습니다 — '+((r[0].error.message||'')+'').slice(0,50);paint();return;}
    SRV={db:calcDb(dbs,calls), cli:calcCli(cls,mets), todo:[], live:true};
    AUTH=''; bust(); srcLoad(); paint();
  });
}
/* 통화 기록을 배정 DB 줄에 붙인다 — CRM 화면이 세는 것과 같은 규칙 */
function calcDb(dbs,calls){
  var by={},i,c,d;
  for(i=0;i<calls.length;i++){
    c=calls[i]; if(!c.db_id)continue;
    var a=by[c.db_id]||(by[c.db_id]={n:0,last:'',res:'',appt:'',memo:'',h:[]});
    a.n++;
    d=(''+(c.call_at||'')).slice(0,10);
    if(d>a.last){a.last=d;a.res=c.result||'';a.memo=(''+(c.memo||'')).slice(0,90);}
    /* 지난번에 무슨 말을 들었는지 — 세 번치까지 들고 다닌다.
       이것이 다음 통화의 첫 마디가 된다. 기록이 나에게 돌아오는 자리다 */
    if(c.memo&&a.h.length<3)a.h.push({d:d,r:c.result||'',m:(''+c.memo).slice(0,140)});
    if(c.appointment_at&&c.appointment_at>a.appt)a.appt=c.appointment_at;
  }
  var out=[];
  for(i=0;i<dbs.length;i++){
    var x=dbs[i], a2=by[x.id]||{n:0,last:'',res:'',appt:'',memo:'',h:[]};
    var base=a2.last||(''+(x.assigned_date||'')).slice(0,10);
    var ap=(''+(x.next_appt||'')); if(a2.appt>ap)ap=a2.appt;
    out.push({id:x.id,name:x.customer_name||'(이름 없음)',phone:x.phone||'',
      region:x.region||'',src:(''+(x.source||'')).trim()||'일반',
      stage:(''+(x.stage||'')).trim(),
      cAt:(''+(x.contracted_at||'')).slice(0,10),pAt:(''+(x.policy_sent_at||'')).slice(0,10),
      n:a2.n,res:a2.res||'',memo:a2.memo,appt:ap,lastAt:a2.last,hist:a2.h||[],
      days:base?ago(base):9999});
  }
  return out;
}
/* 생일까지 며칠 남았나 — MM-DD 만 있으므로 올해로, 지났으면 내년으로 */
function bdDays(bd){
  if(!/^\d{2}-\d{2}$/.test(''+(bd||'')))return -1;
  var y=parseInt(T0().slice(0,4),10);
  var d=Math.round((new Date(y+'-'+bd+'T00:00:00Z')-new Date(T0()+'T00:00:00Z'))/86400000);
  if(d<0)d=Math.round((new Date((y+1)+'-'+bd+'T00:00:00Z')-new Date(T0()+'T00:00:00Z'))/86400000);
  return d;
}
function calcCli(cls,mets){
  var m={},R={},i,out=[];
  for(i=0;i<mets.length;i++){m[mets[i].client_id]=mets[i].content||{};R[mets[i].client_id]=mets[i].id;}
  for(i=0;i<cls.length;i++){
    var c=cls[i], v=m[c.id]||{}, t=(v.touch&&v.touch.length)?v.touch[0].d:'';
    var bd=v.bd||'', bi=-1;
    if(/^\d{2}-\d{2}$/.test(bd)){
      var y=parseInt(T0().slice(0,4),10);
      bi=Math.round((new Date(y+'-'+bd+'T00:00:00Z')-new Date(T0()+'T00:00:00Z'))/86400000);
      if(bi<0)bi=Math.round((new Date((y+1)+'-'+bd+'T00:00:00Z')-new Date(T0()+'T00:00:00Z'))/86400000);
    }
    out.push({id:c.id,name:c.name_masked||'(이름 없음)',rid:R[c.id]||'',raw:v,
      plan:(v.next&&v.next.what)||'',due:(v.next&&v.next.due)||'',bd:bd,bdIn:bi,
      man:(v.fp?(Object.keys(v.fp).length+'/24칸'):''),
      days:t?ago(t):((''+(c.created_at||'')).slice(0,10)?ago((''+c.created_at).slice(0,10)):9999)});
  }
  return out;
}

function P(){try{var p=window.parent;if(p&&p!==window&&typeof p.go==='function')return p;}catch(e){}return null;}
function T0(){return new Date(Date.now()+9*3600000).toISOString().slice(0,10);}
function Tn(n){return new Date(Date.now()+9*3600000+n*86400000).toISOString().slice(0,10);}
function ago(d){if(!d)return 9999;return Math.max(0,Math.round((new Date(T0()+'T00:00:00Z')-new Date((''+d).slice(0,10)+'T00:00:00Z'))/86400000));}
function esc(s){return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* CRM 의 crmMask 와 앱의 osMaskName 은 글자 하나까지 같다 — 그래서 이름으로 고객을 찾을 수 있다 */
function mask(n){
  var p=P();try{if(p&&typeof p.osMaskName==='function')return p.osMaskName(n);}catch(e){}
  var t=(''+(n||'')).trim();
  if(t.length<=1)return t;
  if(t.length===2)return t.charAt(0)+'*';
  var m='',i;for(i=1;i<t.length-1;i++)m+='*';
  return t.charAt(0)+m+t.charAt(t.length-1);
}
/* 가린 이름은 「첫 글자 · 길이 · 끝 글자」 만 남는다 (김민수 → 김*수).
   그래서 그 셋으로 맞춘다. CRM 도 같은 규칙으로 중복을 막고 있다.
   완벽하지는 않다 — 같은 성에 같은 글자 수면 헷갈릴 수 있다.
   그래서 여기서는 「열어보기」 에만 쓰고, 쓰기에는 쓰지 않는다. */
function sameName(a,b){
  var A=(''+(a||'')).replace(/\s/g,''), B=(''+(b||'')).replace(/\s/g,'');
  if(!A||!B)return false;
  if(A===B)return true;
  if(A.length!==B.length||A.charAt(0)!==B.charAt(0))return false;
  var x=A.charAt(A.length-1), y=B.charAt(B.length-1), m=function(c){return c==='*'||c==='○';};
  return x===y||m(x)||m(y);
}

/* ── 다음 연락일 ────────────────────────────────────────────────
   「부재면 사흘 뒤」 같은 규칙을 여기서 지어내지 않는다.
   「무엇을 언제 해야 하는가」 는 고객관리 쪽이 정하는 것이고,
   근거 없는 숫자를 화면에 박아 두면 매일 틀린 명단이 뜬다.

   그래서 날짜는 <b>사람이 고른 것</b>과 <b>실제로 잡힌 약속</b> 두 가지만
   쓴다. 아무도 안 정했으면 「미정」 이다 — 지어내지 않는다.        */
function nextOf(r,v){
  if(v.next[r.id])return v.next[r.id];      /* 사람이 고른 날 */
  if(r.appt)return (''+r.appt).slice(0,10); /* 잡힌 상담 약속 */
  return '';                                 /* 미정 */
}
function due(r,v){var d=nextOf(r,v);return d?(d<=T0()):false;}

   200건짜리 DB 로 돌려 보니 「오늘 걸 사람 198명」 이 떴다.
   밀린 사람이 전부 오늘로 몰리기 때문이다. 그 화면을 열면 사람은
   앱을 닫는다. 압도당하면 아무것도 안 하는 것과 같다.

   그래서 상한을 둔다. 급한 순으로 오늘 몫만 세우고, 나머지는
   「밀린 사람」 으로 접어 둔다. 매일 조금씩 흘러나간다.
   상한은 대표가 정한다 — 하루 열 통 하는 사람과 서른 통 하는
   사람에게 같은 숫자를 들이밀면 둘 다 안 쓴다.                  */
var CAPK='apex_day_cap';
function CAP(){var v=0;try{v=parseInt(localStorage.getItem(CAPK)||'20',10);}catch(e){v=20;}
  return (v>0&&v<=200)?v:20;}

/* ── 오늘 걸 사람 — 급한 순 ── */
function queueAll(){
  if(_Q)return _Q;
  var R=rows(),v=L(),out=[],i;
  /* 오늘 세울 사람을 고르는 근거는 셋뿐이다 — 전부 사실이다.
       ① 오늘 잡힌 약속        ② 사람이 정한 날짜가 됐음
       ③ 아직 한 번도 안 걸었음 · 계약은 됐는데 증권이 안 감
     그 밖은 「손 놓은 지 오래된 순」 으로만 세운다. 이것도 사실이다. */
  for(i=0;i<R.db.length;i++){
    var r=R.db[i];
    if(r.stage==='증권전달')continue;
    if(v.done[r.id])continue;
    var w=0, ap=(r.appt&&(''+r.appt).slice(0,10));
    if(ap===T0())w=100;                            /* 오늘 약속 */
    else if(r.stage==='계약완료')w=90;             /* 증권이 안 감 — 밀리면 민원 */
    else if(due(r,v))w=80+Math.min(r.days,15);     /* 정해 둔 날이 됐다 */
    else if(ap&&ap>T0())continue;                  /* 약속이 앞에 있으면 오늘 아니다 */
    else if(!r.n)w=60+Math.min(r.days,30);         /* 한 번도 안 걸었다 */
    else if(v.next[r.id])continue;                 /* 정해 둔 날이 아직 안 왔다 */
    else w=Math.min(r.days,40);                    /* 손 놓은 지 오래된 순 */
    out.push({r:r,w:w});
  }
  out.sort(function(a,b){return b.w-a.w;});
  _Q=out.map(function(x){return x.r;});return _Q;
}
/* 기계가 정한 순서가 늘 옳지는 않다. 대표에게는 「오늘은 이 사람부터」
   라는 감이 있다. 명단에서 누르면 그 사람이 맨 앞에 선다.           */
var PIN='';
function queue(){
  var l=queueAll().slice(0,CAP()),i;
  if(PIN){
    var all=queueAll(),f=null;
    for(i=0;i<all.length;i++)if(all[i].id===PIN){f=all[i];break;}
    if(f){ l=l.filter(function(r){return r.id!==PIN;}); l.unshift(f); }
    else PIN='';
  }
  return l;
}
function backlog(){return Math.max(0,queueAll().length-CAP());}
function why(r){
  if(r.appt&&(''+r.appt).slice(0,10)===T0())return '<b>오늘 '+(''+r.appt).slice(11,16)+' 상담</b>입니다. 시간·장소·가져갈 것을 먼저 확인합니다.';
  if(r.stage==='계약완료')return '계약은 끝났는데 <b>증권이 아직 안 갔습니다.</b> 밀리면 민원이 됩니다.';
  if(r.res==='상담')return '상담까지 간 사람입니다. <b>다음 약속</b>을 잡는 것이 오늘 목표입니다.';
  if(!r.n)return '받은 지 '+r.days+'일 · <b>아직 한 통도 안 걸었습니다.</b>';
  if(r.res==='부재')return r.days+'일 전 마지막 통화 · '+r.n+'번 걸었습니다. <b>시간대를 바꿔</b> 겁니다.';
  if(r.res==='거절')return r.days+'일 전 거절. 그때의 「아니오」는 <b>그날의 아니오</b>였을 뿐입니다.';
  return r.days+'일 전 통화 · '+r.n+'번.';
}

/* ══════════════════════════════════════════════════════════════════
   고객 365일 — 폰에서도 고친다

   전에는 열어보기만 했다. 그런데 상담을 마치고 차 안에서 「다음에 증권
   가져다 드리기 · 다음 주 화요일」 을 정하는 그 순간이 제일 정확하다.
   컴퓨터 앞에 앉을 때쯤이면 절반은 잊는다.

   그래서 두 가지만 고칠 수 있게 한다 — <b>다음 할 일</b>과 <b>생일</b>.
   앱의 cmNextSave() · cmBdSave() 가 넣는 것과 <b>글자 하나까지 같은 모양</b>
   으로 넣는다. 팩트파인딩·가족·접촉 기록은 <b>원본을 통째로 들고 있다가
   그대로 도로 넣는다</b> — 폰에서 고쳤다고 컴퓨터에서 적은 것이 날아가면
   그것으로 끝이다.
   ══════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════
   지난번에 들은 말이 오늘의 첫 마디가 된다

   지금 메모를 적는 이유는 「관리 당하려고」다. 그래서 안 적는다.
   두 줄 적어 봐야 회사가 볼 뿐, 나한테 돌아오는 것이 없다.

   뒤집는다. 오늘 적은 한 줄이 다음에 이 사람이 뜰 때 <b>맨 위에</b> 뜬다.
   안 적으면 다음에 내가 맨땅에서 시작한다. 벌이 아니라 손해라서 적게 된다.

   화법은 여기서 만들지 않는다 — 지난 메모에서 낱말을 뽑아
   db-crm.html 의 처방전(RX_LIST)을 <b>대신 찾아 준다.</b>
   대표가 거기 한 곳만 고치면 이 자리도 같이 바뀐다.
   ══════════════════════════════════════════════════════════════════ */
var SAY=[/부담|비싸|비쌉|여유|보험료/,
         /바쁘|시간이|나중|이따|회의|운전/,
         /생각|고민|검토|알아보|보고서/,
         /남편|아내|배우자|와이프|가족|부모님/,
         /이미|가입|들어 ?있|아는 ?설계사|아는 ?사람/,
         /필요 ?없|관심 ?없|됐다|됐습니다|안 ?한다/,
         /암|뇌|심장|진단|수술|입원|실손|치료비/,
         /연금|노후|퇴직|저축|이자|수익/,
         /자녀|아이|교육|학자금/,
         /증권|서류|자료|보내|카톡|소개/];
/* 받침이 있으면 「을」, 없으면 「를」. 이런 것이 어긋나면 사람이 먼저 안다 */
function eul(w){
  var c=(''+w).charCodeAt((''+w).length-1);
  if(c<0xAC00||c>0xD7A3)return '을';
  return ((c-0xAC00)%28)?'을':'를';
}
function sayWord(m){var i,x;for(i=0;i<SAY.length;i++){x=(''+(m||'')).match(SAY[i]);if(x)return x[0];}return '';}
function memoClean(m){return (''+(m||'')).replace(/^\[장소\][^\n]*\n?/,'').replace(/\s+/g,' ').trim();}
function histOf(r){
  if(r.hist&&r.hist.length)return r.hist;
  return r.memo?[{d:r.lastAt||'',r:r.res||'',m:r.memo}]:[];
}
/* 첫 마디는 「지난번에 들은 말을 그대로 되돌려 주는 한 문장」 뿐이다.
   화법을 새로 쓰지 않는다 — 자세한 것은 아래 처방전이 맡는다.

   메모는 「보험료가 부담된다고 하심.」 처럼 3인칭 기록체로 적힌다.
   그걸 그대로 따옴표에 넣으면 말이 안 된다. 첫 문장만 떼고
   기록체 꼬리(~고 하심 · ~하셨음 · ~함)를 잘라 낸다.            */
function memoSay(m){
  var q=memoClean(m).split(/[.·]/)[0].trim();
  q=q.replace(/\s*고?\s*(하심|하셨음|하셨습니다|하셨다|했음|하였음|함)\s*$/,'').trim();
  q=q.replace(/[,\s]+$/,'');
  if(q.length>20)q=q.slice(0,20)+'…';
  return q;
}
function firstLine(r,h){
  var q=memoSay(h.m);
  return q ? ('"'+r.name+'님, 지난번에 「'+q+'」 하신 것 — 그 부분부터 말씀드리려고 연락드렸습니다."')
           : ('"'+r.name+'님, 지난번 통화 이어서 연락드렸습니다."');
}
function lastSay(r){
  if(!r.n)return '';                       /* 첫 통화면 지난번이 없다 */
  var H=histOf(r);
  if(!H.length)
    return '<div class="last none"><b>🔁 지난번 메모가 없습니다</b>'+
      '<span>오늘 한 줄만 남기시면, <b>다음에 이 자리에 그대로</b> 뜹니다. '+
      '다음 통화를 맨땅에서 시작하지 않게 됩니다.</span></div>';
  var h0=H[0], w=sayWord(h0.m);
  var h='<div class="last"><b>🔁 지난번'+(h0.d?(' · '+h0.d.slice(5,7).replace(/^0/,'')+'월 '+h0.d.slice(8).replace(/^0/,'')+'일'):'')+
        (h0.r?(' ('+esc(h0.r)+')'):'')+'</b>'+
        '<q>'+esc(memoClean(h0.m))+'</q>';
  if(H.length>1)h+='<u>그 전 '+(H.length-1)+'번 · '+
     H.slice(1).map(function(x){return esc(memoClean(x.m).slice(0,18));}).join(' / ')+'</u>';
  h+='<em>오늘 첫 마디</em><i>'+esc(firstLine(r,h0))+'</i>';
  if(w)h+='<u class="k">아래 처방전에 <b>「'+esc(w)+'」</b>'+eul(w)+' 미리 넣어 두었습니다</u>';
  return h+'</div>';
}

function tagOf(r){
  if(r.stage==='계약완료')return ['yes','증권 보낼 것'];
  if(r.res==='상담')return ['yes','진행중'];
  if(!r.n)return ['new','미진행'];
  if(r.res==='부재')return ['miss','부재 '+r.n+'차'];
  if(r.res==='거절')return ['no','거절'];
  return ['new','—'];
}

/* ══════════════════════════════════════════════════════════════════
   등록 — 폰 명단에서 골라 CRM 으로

   전화를 거는 것이 목적이 아니다. 관리가 목적이다. 그래서 제일 중요한
   것은 「폰에 있는 사람을 CRM 에 올리는 것」 이다. 웹으로 하니까
   누르는 순간 CRM 에 들어가고, 컴퓨터에서 그대로 보인다.

   폰마다 길이 다르다 — 그래서 세 갈래를 다 연다.
     1) 주소록에서 바로 고르기 — 안드로이드 크롬만 된다
     2) 연락처 파일(.vcf)     — 아이폰 포함 어디서나 된다
     3) 붙여넣기              — 카톡·엑셀에서 긁어온 것
   하나가 막혀도 나머지로 간다. 화면이 무엇이 되고 안 되는지 밝힌다.

   넣는 모양은 CRM 의 「DB 등록」 과 같다 —
     assigned_date · assigned_to · customer_name · phone
     source · region · report_name · memo · created_by · updated_at
   ══════════════════════════════════════════════════════════════════ */
var RG={list:[],pick:{},src:'',region:'',from:'',busy:false};
/* DB 종류는 대표가 app_config 의 db_sources 로 정한다 — db-crm.html 과 같은 자리다.
   여기에 박아 두면 대표가 고쳤을 때 폰만 안 따라간다. 서버 값을 그대로 읽고,
   못 읽으면 db-crm.html 이 쓰는 기본 목록과 똑같은 것으로 돈다. */
var SRC_FALLBACK=['일반','방송','보장분석','농협','소개','지인','개척'];
var SRC_SRV=null;
function srcList(){
  var a=(SRC_SRV&&SRC_SRV.length)?SRC_SRV:SRC_FALLBACK, out=[], seen={}, i;
  for(i=0;i<a.length;i++){var v=(''+a[i]).trim();if(v&&!seen[v]){seen[v]=1;out.push(v);}}
  /* 이미 그 종류로 저장된 DB 가 있으면 목록에서 지웠어도 고를 수는 있게 */
  var R=rows();
  for(i=0;i<R.db.length;i++){var w=(''+(R.db[i].src||'')).trim();if(w&&!seen[w]){seen[w]=1;out.push(w);}}
  return out;
}
function srcSafe(v){v=(''+(v||'')).trim();return v||(srcList()[0]||'일반');}
function srcLoad(){
  var sb=sbOf();
  if(SRC_SRV||!sb)return;
  SRC_SRV=[];
  sb.from('app_config').select('key,value').eq('key','db_sources').then(function(r){
    if(!r||r.error||!r.data||!r.data[0])return;
    var v=(''+(r.data[0].value||'')).split(',').map(function(x){return x.trim();}).filter(Boolean);
    if(v.length){SRC_SRV=v;paint();}
  },function(){});
}

function telNorm(t){return (''+(t||'')).replace(/[^0-9]/g,'');}
function telTail(t){var d=telNorm(t);return d.length>=8?d.slice(-8):d;}
function telShow(t){
  var d=telNorm(t);
  if(d.length===11)return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  if(d.length===10)return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  return (''+(t||'')).trim();
}
/* 이미 CRM 에 있는 사람인가 — 번호 뒷자리, 없으면 이름으로 */
function already(n,t){
  var R=rows(),i,tt=telTail(t),nm=(''+(n||'')).replace(/\s/g,'');
  for(i=0;i<R.db.length;i++){
    var d=R.db[i];
    if(tt&&telTail(d.phone)===tt)return true;
    if(!tt&&nm&&(''+(d.name||'')).replace(/\s/g,'')===nm)return true;
  }
  return false;
}
function rgAdd(list,from){
  var seen={},out=[],i;
  for(i=0;i<list.length;i++){
    var n=(''+(list[i].n||'')).trim(), t=telShow(list[i].t);
    if(!n&&!t)continue;
    var k=telTail(t)||n;
    if(seen[k])continue; seen[k]=1;
    out.push({n:n||'(이름 없음)',t:t,dup:already(n,t)});
  }
  RG.list=out; RG.from=from; RG.pick={};
  for(i=0;i<out.length;i++)if(!out[i].dup)RG.pick[i]=1;   /* 이미 있는 사람은 빼고 다 고른다 */
  TAB='reg'; paint();
  dToast(out.length+'명을 불러왔습니다 — 고를 사람만 남기세요');
}

/* ── 1) 주소록에서 바로 ── */
function canPick(){try{return !!(navigator.contacts&&navigator.contacts.select);}catch(e){return false;}}
window.rgPick=function(){
  if(!canPick()){dToast('이 폰에서는 주소록 바로 고르기가 안 됩니다 — 연락처 파일이나 붙여넣기를 쓰세요');return;}
  navigator.contacts.select(['name','tel'],{multiple:true}).then(function(cs){
    var l=(cs||[]).map(function(c){
      return {n:(c.name&&c.name[0])||'', t:(c.tel&&c.tel[0])||''};});
    if(!l.length){dToast('고른 사람이 없습니다');return;}
    rgAdd(l,'주소록');
  },function(){dToast('주소록을 열지 못했습니다');});
};

/* ── 2) 연락처 파일(.vcf) — 아이폰도 된다 ── */
window.rgFile=function(inp){
  var f=inp&&inp.files&&inp.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){ rgAdd(vcf(''+rd.result),'연락처 파일'); inp.value=''; };
  rd.readAsText(f,'utf-8');
};
function vcf(txt){
  var out=[],cards=(''+txt).split(/BEGIN:VCARD/i),i;
  for(i=1;i<cards.length;i++){
    var c=cards[i].replace(/\r/g,''), n='', t='';
    var fn=c.match(/\nFN[^:\n]*:([^\n]*)/i);
    if(fn)n=fn[1].trim();
    if(!n){var nn=c.match(/\nN[^:\n]*:([^\n]*)/i);
      if(nn)n=nn[1].split(';').filter(Boolean).reverse().join('').trim();}
    var te=c.match(/\nTEL[^:\n]*:([^\n]*)/i);
    if(te)t=te[1].trim();
    if(n||t)out.push({n:n,t:t});
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════
   캘린더에 담기 · 문자 · 처방전 · 받아쓰기

   앱 전체를 뒤져 보니 `VEVENT` 가 0 건이었다. 즉 지금까지 「캘린더」 는
   앱 안에 그린 그림이었고, <b>폰이 울린 적이 없다.</b> 상담을 잡아도
   알람이 없다. 그래서 약속을 잡으면 그 자리에서 .ics 를 만든다 —
   서버도, 대행사도, 새 표도 필요 없다.

   문자는 db-crm.html 이 이미 쓰는 방식을 그대로 따른다. 아이폰은
   &body= 안드로이드는 ?body= 이고, 번호는 숫자만 남긴다. 본인 폰의
   문자앱이 열리므로 <b>본인 번호로</b> 나간다.

   화법은 새로 쓰지 않는다. db-crm.html 의 RX_LIST 를 그대로 읽어 온다.
   대표가 거기 한 곳만 고치면 폰도 같이 바뀐다.
   ══════════════════════════════════════════════════════════════════ */

/* ── 캘린더에 담기 (.ics) ── */
function icsAt(d,t){ return (''+d).replace(/-/g,'')+'T'+(''+t).replace(':','')+'00'; }
function icsEsc(v){ return (''+(v||'')).replace(/([,;\\\\])/g,'\\\\$1').replace(/\n/g,'\\\\n'); }
function icsUid(seed){return 'apex-'+Math.abs(hashOf(seed))+'@apexyunpro';}
/* 캘린더 규격은 한 줄이 75바이트를 넘으면 안 된다. 한글은 한 자에 3바이트라
   스물다섯 자면 넘는다. 넘겨 보내면 어떤 폰에서는 일정이 통째로 안 들어간다 */
function icsFold(s2){
  var out=[],cur='',b=0,i,ch,n;
  for(i=0;i<s2.length;i++){
    ch=s2.charAt(i);
    n=ch.charCodeAt(0)<128?1:3;
    if(b+n>72){out.push(cur);cur=' ';b=1;}
    cur+=ch;b+=n;
  }
  out.push(cur);
  return out.join('\r\n');
}
/* 한 건 = VEVENT 하나.
     al  알림을 몇 분 전에 울릴까 (0 이면 그 시각에)
     rr  되풀이 규칙 (매일 아침 알림에만 쓴다)                     */
function icsEv(e){
  var st=icsAt(e.d,e.t), en=icsAt(e.d,addM(e.t,e.dur||60));
  var al=(e.al===0)?'TRIGGER:PT0S':('TRIGGER:-PT'+(e.al||60)+'M');
  return ['BEGIN:VEVENT','UID:'+icsUid(e.d+e.t+e.sum),
    'DTSTAMP:'+icsAt(T0(),'00:00')+'Z',
    'DTSTART;TZID=Asia/Seoul:'+st,'DTEND;TZID=Asia/Seoul:'+en,
    (e.rr?('RRULE:'+e.rr):''),
    'SUMMARY:'+icsEsc(e.sum),
    (e.place?('LOCATION:'+icsEsc(e.place)):''),
    'DESCRIPTION:'+icsEsc((e.desc||'')+(e.desc?'\n':'')+'APEX 하루 한 장에서 잡은 일입니다.'),
    'BEGIN:VALARM',al,'ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.sum),
    'END:VALARM','END:VEVENT'].filter(Boolean).join('\r\n');
}
function icsDoc(evs){
  var head=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//APEX YUN PRO//하루 한 장//KO',
    'CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VTIMEZONE','TZID:Asia/Seoul',
    'BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0900','TZOFFSETTO:+0900',
    'TZNAME:KST','END:STANDARD','END:VTIMEZONE'];
  var body=evs.map(icsEv);
  return head.concat(body).concat(['END:VCALENDAR'])
    .join('\r\n').split('\r\n').map(icsFold).join('\r\n');
}
function icsMake(nm,d,t,place,memo){
  return icsDoc([{d:d,t:t,dur:60,sum:nm+' 상담',place:place,desc:memo,al:60}]);
}
function addM(t,m){
  var p2=(''+t).split(':'), mm=(parseInt(p2[0],10)*60+parseInt(p2[1]||'0',10)+(m||0))%1440;
  var h2=Math.floor(mm/60), n2=mm%60;
  return (h2<10?'0':'')+h2+':'+(n2<10?'0':'')+n2;
}
function addH(t,h){return addM(t,h*60);}
function hashOf(s2){var h=0,i;for(i=0;i<s2.length;i++)h=(h*31+s2.charCodeAt(i))|0;return h;}
/* 폰에 건네준다. 막혀 있으면 글자로라도 보여 준다 — 조용히 실패하지 않는다 */
function icsGive(name,txt){
  try{
    var bl=new Blob([txt],{type:'text/calendar;charset=utf-8'});
    var u=URL.createObjectURL(bl), a=document.createElement('a');
    a.href=u; a.download=name+'.ics'; document.body.appendChild(a); a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},1200);
    return true;
  }catch(e){ ICS=txt; paint(); return false; }
}
window.dIcs=function(nm,d,t,place){
  if(icsGive(nm+'_상담_'+d, icsMake(nm,d,t,place,'')))
    dToast('캘린더에 담았습니다 — 한 시간 전에 알람이 옵니다');
};

/* ══════════════════════════════════════════════════════════════════
   알림 — 폰이 먼저 울리게

   좋은 화면을 만들어도 폰은 <b>열어야</b> 보이는 물건이다. 사람은 안 연다.
   그래서 폰이 먼저 울려야 한다. 서버도, 푸시 등록도, 앱스토어도 없이
   울리게 하는 길이 하나 있다 — <b>폰 캘린더</b>다.

   시각이 있는 것(상담 약속)은 그 시각에, 한 시간 전 알림.
   시각이 없는 것(걸 사람·고객 365일 기한·생일)은 그날 아침 9시에 알림만.
   한 번 담으면 앱을 안 열어도 그날 폰이 울린다.
   ══════════════════════════════════════════════════════════════════ */
function bellEvents(days){
  var M=weekMap(days), out=[], i, j;
  for(i=0;i<days.length;i++){
    var d=days[i], ev=M[d]||[];
    for(j=0;j<ev.length;j++){
      var e=ev[j];
      if(e.k==='ap'&&/^\d\d:\d\d$/.test(e.t))
        out.push({d:d,t:e.t,dur:60,sum:e.n+' 상담',desc:e.s,al:60});
      else
        out.push({d:d,t:'09:00',dur:15,al:0,
          sum:(e.k==='bd'?'🎂 ':(e.k==='cl'?'📞 ':''))+e.n+' — '+(e.k==='bd'?'생일':(e.s||'할 일')),
          desc:e.s||''});
    }
  }
  return out;
}
function weekDays(){
  var d0=new Date(Date.now()+9*3600000), dow=d0.getUTCDay(), a=[], i;
  for(i=0;i<7;i++)a.push(Tn(i-dow+(dow===0?-6:1)));
  return a;
}
function bellN(days){return bellEvents(days).length;}
window.dBell=function(scope){
  var days=(scope==='week')?weekDays():[T0()];
  var ev=bellEvents(days);
  if(!ev.length){dToast('담을 일정이 없습니다');return;}
  if(icsGive('APEX_'+(scope==='week'?'이번주':T0()), icsDoc(ev)))
    dToast(ev.length+'건을 폰 캘린더에 담았습니다 — 그날 폰이 울립니다');
};

var RX={list:null,tried:false,q:'',open:'',auto:''};
function rxLoad(){
  if(RX.tried)return; RX.tried=true;
  try{
    fetch('/db-crm.html',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
      var m=t.match(/var\s+RX_LIST\s*=\s*(\[[\s\S]*?\n\];)/);
      if(!m){RX.list=[];paint();return;}
      try{ RX.list=(new Function('return '+m[1].replace(/;\s*$/,'')))()||[]; }
      catch(e){ RX.list=[]; }
      paint();
    },function(){RX.list=[];});
  }catch(e){RX.list=[];}
}
function rxHit(q){
  if(!RX.list||!RX.list.length||!q)return [];
  var k=(''+q).replace(/\s/g,''),out=[],i;
  for(i=0;i<RX.list.length;i++){
    var x=RX.list[i], hay=((x.say||'')+' '+((x.k||''))+' '+((x.also||[]).join(' '))).replace(/\s/g,'');
    if(hay.indexOf(k)>=0||k.indexOf((x.say||'').replace(/\s/g,'').slice(0,4))>=0)out.push(x);
  }
  return out.slice(0,3);
}

  if(!canHear()){dToast('이 폰에서는 받아쓰기가 안 됩니다');return;}

  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  REC=new SR(); REC.lang='ko-KR'; REC.interimResults=true; REC.continuous=true;

   사람이 바뀌면 버린다 — 남의 메모가 따라붙으면 큰일이다.        */
var PK='apex_day_pick';
function PICKload(){
  var v=null;
  try{v=JSON.parse(localStorage.getItem(PK)||'null');}catch(e){v=null;}
  if(!v||typeof v!=='object')v={};
  return {who:v.who||'',res:v.res||'',next:v.next||'',memo:v.memo||'',
          apD:v.apD||'',apT:v.apT||'',place:v.place||'',calledAt:v.calledAt||''};
}
var PICK=PICKload();
function PICKsave(){try{localStorage.setItem(PK,JSON.stringify(PICK));}catch(e){}}
function PICKclear(){PICK={who:'',res:'',next:'',memo:'',apD:'',apT:'',place:'',calledAt:''};
  try{localStorage.removeItem(PK);}catch(e){}}
/* 지금 세워 둔 사람과 적어 둔 것이 다른 사람이면 버린다 */
function PICKfit(r){
  if(!r){if(PICK.who)PICKclear();return;}
  if(PICK.who&&PICK.who!==r.id)PICKclear();
  if(!PICK.who){PICK.who=r.id;PICKsave();}
}

/* 시각이 정해진 것(약속·기한·생일)과 「그날 걸 사람」은 다르다.
   오늘 판에서는 앞의 것만 「일정」이다 — 걸 사람은 이미 위에 세워 두었다.
   주간 판에서는 둘 다 봐야 한다. 그래야 어느 날이 비었는지가 보인다. */
function dayEvents(day,withCalls){
  var R=rows(),v=L(),out=[],i;
  for(i=0;i<R.db.length;i++){
    var r=R.db[i];
    if(r.appt&&(''+r.appt).slice(0,10)===day)
      out.push({t:(''+r.appt).slice(11,16),k:'ap',n:r.name,s:'상담 · '+(r.region||''),id:r.id});
    else if(withCalls&&!v.done[r.id]&&nextOf(r,v)===day&&r.stage!=='증권전달')
      out.push({t:'📞',k:'cl',n:r.name,s:'전화 · '+(tagOf(r)[1]),id:r.id});
  }
  for(i=0;i<R.cli.length;i++){
    var c=R.cli[i];
    if(c.bdIn>=0&&Tn(c.bdIn)===day)out.push({t:'🎂',k:'bd',n:c.name,s:'생일',id:c.id});
    if(c.due===day)out.push({t:'⏰',k:'cl',n:c.name,s:c.plan||'적어 둔 일',id:c.id});
  }
  out.sort(function(a,b){return (a.t<b.t?-1:1);});
  return out;
}
function evRow(e){

/* 이레치를 한 번에 모은다 — 예전에는 하루마다 명단 전체를 훑어
   이레면 일곱 바퀴였다. 200명이면 1,400번이다. */
function weekMap(days){
  var R=rows(),v=L(),m={},i,j;
  for(i=0;i<days.length;i++)m[days[i]]=[];
  for(i=0;i<R.db.length;i++){
    var r=R.db[i],d;
    if(r.appt){d=(''+r.appt).slice(0,10);if(m[d])m[d].push({t:(''+r.appt).slice(11,16),k:'ap',n:r.name,s:'상담 · '+(r.region||''),id:r.id});continue;}
    if(v.done[r.id]||r.stage==='증권전달')continue;
    d=nextOf(r,v);if(m[d])m[d].push({t:'📞',k:'cl',n:r.name,s:'전화 · '+(tagOf(r)[1]),id:r.id});
  }
  for(i=0;i<R.cli.length;i++){
    var c=R.cli[i];
    if(c.bdIn>=0){var bd=Tn(c.bdIn);if(m[bd])m[bd].push({t:'🎂',k:'bd',n:c.name,s:'생일',id:c.id});}
    if(c.due&&m[c.due])m[c.due].push({t:'⏰',k:'cl',n:c.name,s:c.plan||'적어 둔 일',id:c.id});
  }
  for(j in m)m[j].sort(function(a,b){return a.t<b.t?-1:1;});
  return m;
}

/* 폰이 앱을 재우거나 화면이 꺼지는 그 순간에 확실히 붙잡는다.

/* ── 시각 — 「그 순간」 으로만 담는다 ──────────────────────────────
   전에는 한국 시각을 글자로 만든 뒤 다시 읽었다. 폰 시간대가 한국이면
   맞았지만, 시간대가 다른 기기(해외·컴퓨터)에서는 <b>아홉 시간이
   어긋난 시각</b>이 CRM 에 들어갔다. 통화 기록의 시각이 틀리면
   「몇 시에 걸었나」 가 통째로 무너진다.

   이제 걸린 그 순간을 그대로 담고(ISO), 보여 줄 때만 한국 시각으로 읽는다.
   약속 시각은 사람이 「내일 오후 2시」 라고 고른 것이므로
   <b>한국 시각이라고 못박아서</b> 담는다 — 기기 시간대에 흔들리지 않는다. */
function kstHM(iso){
  if(!iso)return '';
  var t=new Date(iso);
  if(isNaN(t))return (''+iso).slice(11,16);
  return new Date(t.getTime()+9*3600000).toISOString().slice(11,16);
}
function apptISO(d,t){
  if(!d||!t)return null;
  var x=new Date(d+'T'+t+':00+09:00');
  return isNaN(x)?null:x.toISOString();
}

/* ── CRM 에 넣을 한 줄 — saveCall() 이 넣는 것과 글자 하나까지 같다 ── */
function payloadOf(r){
  var memo=(PICK.memo||'').trim();
  if(PICK.res==='상담'&&PICK.place)memo=('[장소] '+PICK.place+(memo?('\n'+memo):''));
  return {
    db_id: r.id,
    created_by: meOf()||'(로그인한 나)',
    call_at: PICK.calledAt||new Date().toISOString(),
    result: PICK.res,
    appointment_at: (PICK.res==='상담')?apptISO(PICK.apD,PICK.apT):null,
    memo: memo,
    first_call_issue: false
  };
}

/* ── 못 올린 것은 폰에 쌓아 둔다 ────────────────────────────────
   지하철·엘리베이터에서 기록이 날아가면 이 판은 못 쓴다.
   먼저 폰에 넣고 → 서버에 올리고 → 성공하면 지운다.
   실패하면 위에 「못 올린 것 n건」 이 뜨고 신호가 오면 저절로 올라간다. */
/* 「연속 며칠」 은 하루 빠지면 0 이 된다. 그러면 그만두게 만든다.
   그래서 이 달에 며칠 했는지로 센다 — 빠져도 이어서 간다.       */
var MK='apex_day_month';
function MD(){var v={};try{v=JSON.parse(localStorage.getItem(MK)||'{}')||{};}catch(e){v={};}
  var m=T0().slice(0,7);
  if(v.m!==m)v={m:m,d:{}};
  if(!v.d)v.d={};
  return v;}
function MDadd(){var v=MD();if(!v.d[T0()]){v.d[T0()]=1;try{localStorage.setItem(MK,JSON.stringify(v));}catch(e){}}}
function MDn(){var v=MD(),n=0,k;for(k in v.d)n++;return n;}
function MDpast(){var d=new Date(Date.now()+9*3600000);return d.getUTCDate();}

var QK='apex_day_queue';
function Q(){var v=[];try{v=JSON.parse(localStorage.getItem(QK)||'[]')||[];}catch(e){v=[];}return v.push?v:[];}
function Qset(v){try{localStorage.setItem(QK,JSON.stringify(v));}catch(e){}}
function Qadd(p){var v=Q();v.push({at:Date.now(),p:p});Qset(v);}
var DAY_MS=86400000;
function Qold(){var v=Q(),n=0,i;for(i=0;i<v.length;i++)if(Date.now()-(v[i].at||0)>DAY_MS)n++;return n;}
window.dOldOk=function(){
  /* 사람이 확인했으니 나이를 오늘로 고쳐 올린다 */
  var v=Q(),i;for(i=0;i<v.length;i++)v[i].at=Date.now();Qset(v);
  Qflush(function(k){dToast(k>0?'올렸습니다':'아직 안 올라갑니다');});
};
window.dOldDrop=function(){
  var v=Q(),out=[],i,n=0;
  for(i=0;i<v.length;i++){if(Date.now()-(v[i].at||0)>DAY_MS)n++;else out.push(v[i]);}
  Qset(out);dToast(n+'건을 버렸습니다');paint();
};

var flushing=false;
function Qflush(cb){
  var sb=sbOf(), v=Q();
  if(!sb||!v.length||flushing){if(cb)cb(0);return;}
  /* 하루가 넘은 기록은 저절로 올리지 않는다.
     그 사이에 컴퓨터에서 같은 통화를 또 적었을 수 있다 — 중복이 된다.
     기계가 조용히 두 줄을 만드는 것보다, 사람에게 한 번 묻는 것이 낫다. */
  if(Date.now()-(v[0].at||0)>DAY_MS){if(cb)cb(0);return;}
  flushing=true;
  var one=v[0];
  sb.from('calls').insert(one.p).then(function(res){
    flushing=false;
    if(res&&res.error){if(cb)cb(-1);paint();return;}
    var w=Q();w.shift();Qset(w);
    /* 앱이 보는 숫자도 같이 새로 읽는다 — CRM·TFA 가 바로 따라온다 */
    reload();
    if(w.length)Qflush(cb); else {if(cb)cb(1);paint();}
  },function(){flushing=false;if(cb)cb(-1);paint();});
}
window.dRetry=function(){Qflush(function(k){dToast(k>0?'올렸습니다':'아직 안 올라갑니다 — 신호를 확인해 주세요');});};

var SHOW=null, SHOWN=0;   /* 미리보기에서 「이렇게 들어갑니다」 를 보여 주는 자리 */
window.dSave=function(){
  var q=queue();if(!q.length||!canSave())return;
  keepMemo();
  var v=L(),r=q[0],pl=payloadOf(r);

  v.done[r.id]=1;
  /* 안 고르면 안 정한 것이다. 지어내지 않는다 */
  if(PICK.res==='상담'&&PICK.apD)v.next[r.id]=PICK.apD;
  else if(PICK.next)v.next[r.id]=PICK.next;
  else delete v.next[r.id];
  v.log=(v.log||[]);
  v.log.push({id:r.id,nm:r.name,res:PICK.res,memo:pl.memo,ap:pl.appointment_at||'',at:pl.call_at});
  v.calls=(v.calls||0)+1;
  MDadd();   /* 오늘 한 통이라도 걸었으면 이 달 달력에 도장 */
  Lset(v);

  if(sbOf()){
    Qadd(pl);
    var nx=v.next[r.id]||'';
    Qflush(function(k){ dToast(k>0?('CRM 에 남겼습니다'+(PICK.res==='상담'?(' · 약속 '+PICK.apD.slice(5))
                                                       :(nx?(' · 다음 '+nx.slice(5)):' · 다음 날짜는 미정')))
                                  :'폰에 넣어 두었습니다 — 신호가 오면 올립니다'); });
  }else{
    SHOW=pl;   /* 미리보기 — 서버에 안 올리고, 무엇이 들어가는지 그대로 보여 준다 */
  }
  PICKclear();PIN='';
  paint();
};

  if(nextOf(found,v)>T0()){v.next[found.id]=T0();Lset(v);}
  PIN=id; PICKclear(); TAB='today'; paint();

};
var tt=0;
window.dToast=function(m){var e=$('toast');e.textContent=m;e.classList.add('on');

sbBoot();

/* 팀장이 보낸 말은 켜자마자 한 번, 그 뒤 1분에 한 번쯤 본다.
   딴 화면을 보고 있어도 계속 본다 — 그래야 컴퓨터에서 다른 탭을 보다가
   알림이 뜬다. 브라우저가 알아서 뒤로 미뤄 주므로 배터리는 축나지 않는다.
   돌아왔을 때는 기다리지 않고 바로 본다.                             */
function tfTick(force){
  var t=Date.now();
  if(!force&&t-TF.pollAt<55000)return;
  TF.pollAt=t; tfLoad(!TF.loaded);       /* 처음 한 번은 조용히 — 눈앞에 띠가 뜨니까 */
}
setTimeout(function(){tfTick(true);},1200);
setInterval(function(){tfTick(false);},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tfTick(true);});
/* 앱 안이면 부모가 자료를 읽을 때까지 몇 번 다시 그린다 */

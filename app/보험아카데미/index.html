<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보험 마스터 아카데미 — 신입 자가학습 과정</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="scene3d.css?v=20260827i">
<style>
:root{
  /* Toss palette */
  --blue:#3182f6; --blue-d:#1b64da; --blue-dd:#1957b8; --blue-l:#e8f3ff; --blue-ll:#f4f9ff;
  --navy:#191f28; --navy2:#333d4b;
  --gold:#3182f6; --gold2:#8bbdfa;            /* 기존 gold 참조를 토스 블루로 승계 */
  --yellow:#ffc043; --yellow-l:#fff8e6;
  --paper:#f2f4f6; --card:#ffffff;
  --ink:#191f28; --ink2:#4e5968; --ink3:#8b95a1; --ink4:#b0b8c1;
  --line:#e5e8eb; --line2:#f2f4f6;
  --ok:#02a678; --ok-l:#e7f9f2;
  --warn:#ff8a00; --warn-l:#fff4e6;
  --red:#f04452; --red-l:#ffeff0;
  --key:#3182f6;
  --r:20px; --r2:14px; --r3:10px;
  --sh:0 1px 3px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.045);
  --sh2:0 2px 8px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.7;-webkit-text-size-adjust:100%;
  font-feature-settings:'tnum';letter-spacing:-.02em;font-weight:400}
b,strong{font-weight:700;color:var(--ink)}
em.hl{font-style:normal;background:linear-gradient(transparent 58%,#f6e6a8 58%);font-weight:600}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#side{width:280px;flex:none;background:#fff;color:var(--ink2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
  overflow-y:auto;padding:20px 0 40px}
#main{flex:1;min-width:0;padding:34px 44px 110px;max-width:1080px}
.brand{padding:6px 22px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand h1{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
  .brand p{font-size:12px;color:var(--ink3);margin-top:3px;letter-spacing:.02em}
.prog{padding:12px 20px 14px}
.prog .bar{height:8px;border-radius:8px;background:var(--line2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0;transition:width .4s}
.prog .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-bottom:6px}
nav a{display:flex;gap:10px;align-items:flex-start;padding:10px 22px;color:var(--ink2);text-decoration:none;
  font-size:14px;font-weight:500;border-left:3px solid transparent;transition:.15s;border-radius:0 10px 10px 0}
nav a:hover{background:var(--blue-ll);color:var(--ink)}
nav a.on{background:var(--blue-l);border-left-color:var(--blue);color:var(--blue-d);font-weight:700}
nav a .lv{flex:none;width:26px;font-size:11.5px;color:var(--ink4);font-weight:700;padding-top:2px;text-align:right}
nav a .tx{flex:1}
nav a .dn{flex:none;font-size:11px;color:var(--ok);opacity:0;padding-top:2px}
nav a.done .dn{opacity:1;color:var(--gold2)}
.navsep{font-size:11px;letter-spacing:.1em;color:var(--ink4);padding:18px 22px 6px;font-weight:700}

/* ---------- header ---------- */
.hd{margin-bottom:18px}
.hd .kick{font-size:12px;letter-spacing:.02em;color:var(--blue);font-weight:700}
.hd h2{font-size:32px;font-weight:800;letter-spacing:-.045em;margin:6px 0 8px;line-height:1.28}
.hd .sub{color:var(--ink3);font-size:15px;font-weight:500}
.core{background:var(--blue-l);color:var(--blue-dd);border-radius:var(--r);
  padding:22px 24px;margin:20px 0 26px;font-size:17px;font-weight:700;line-height:1.65;
  border:0}
.core span{display:block;font-size:12px;letter-spacing:0;color:var(--blue);font-weight:700;margin-bottom:7px;opacity:.9}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:0;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:26px}
.tabs button{border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--ink3);
  padding:12px 4px;margin-right:20px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--blue-d);border-bottom-color:var(--blue);background:transparent}

/* ---------- content blocks ---------- */
.pane{display:none}.pane.on{display:block;animation:fade .22s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h3.bh{font-size:22px;font-weight:800;letter-spacing:-.035em;margin:38px 0 14px;padding-left:0;
  border-left:0;line-height:1.35;color:var(--ink)}
h3.bh:first-child{margin-top:4px}
p.bp{margin:0 0 14px;font-size:16px;color:var(--ink2);line-height:1.75}
ul.bl{margin:0 0 15px;padding-left:2px;list-style:none}
ul.bl li{position:relative;padding-left:20px;margin-bottom:9px;font-size:15.5px;color:var(--ink2);line-height:1.7}
ul.bl li:before{content:'';position:absolute;left:4px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.tw{overflow-x:auto;margin:0 0 18px;border-radius:18px;border:0;background:#fff;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px}
th,td{padding:13px 14px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top;color:var(--ink2)}
th{background:var(--paper);color:var(--ink2);font-weight:700;font-size:13.5px;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody tr:nth-child(even){background:#fff}
tbody tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;color:var(--ink)}
.cal{border-radius:16px;padding:18px 20px;margin:0 0 18px;font-size:15.5px;border:0;line-height:1.68;font-weight:500}
.cal.key{background:var(--blue-l);color:var(--blue-dd)}
.cal.warn{background:var(--warn-l);color:#a35a00}
.cal.tip{background:var(--ok-l);color:#00806a}
.cal:before{display:block;font-size:12px;letter-spacing:0;font-weight:700;margin-bottom:7px;opacity:.72}
.cal.key:before{content:'CHECK POINT'}
.cal.warn:before{content:'주의'}
.cal.tip:before{content:'TIP'}
.svgw{background:#fff;border:0;border-radius:18px;padding:20px;margin:0 0 18px;overflow-x:auto;box-shadow:var(--sh)}
.svgw svg{width:100%;height:auto;min-width:460px;display:block}
.bx{fill:#fff;stroke:#e5e8eb;stroke-width:1.5}
.bx.a{fill:#f9fafb;stroke:#b9c6dd}.bx.b{fill:#e9f0fb;stroke:#9dbbe4}
.bx.c{fill:#fff4e6;stroke:#e9c99a}.bx.d{fill:#eaf7f0;stroke:#a4d6bd}
.bx.e{fill:#f7ecf3;stroke:#dcb6cf}.bx.f{fill:#fdeaea;stroke:#eeb2b2}
.tt{font:700 13.5px 'Pretendard Variable',sans-serif;fill:#333d4b;text-anchor:middle}
.ts{font:400 11.5px 'Pretendard Variable',sans-serif;fill:#5b6a83;text-anchor:middle}
.em{font-weight:800;fill:#ff8a00}
.ar{stroke:#8b95a1;stroke-width:2;fill:none;marker-end:url(#mk)}
.ln{stroke:#e5e8eb;stroke-width:3}
.dot{fill:var(--gold)}.dot2{fill:#8b95a1}

/* ---------- cost cards ---------- */
.costs{display:grid;gap:11px;margin:0 0 20px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.cc{background:#fff;border:0;border-radius:18px;padding:18px 19px;box-shadow:var(--sh)}
.cc .tg{font-size:11.5px;letter-spacing:0;font-weight:700;color:var(--blue);margin-bottom:4px}
.cc h4{font-size:16.5px;font-weight:800;letter-spacing:-.035em;line-height:1.35}
.cc .dx{font-size:12.4px;color:var(--ink3);margin:1px 0 9px}
.cc dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px;margin-bottom:9px}
.cc dt{color:var(--ink3)}
.cc dd{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.cc dd.mine{color:var(--red);font-size:17px}
.cc .key{font-size:13px;background:var(--paper);border-radius:10px;padding:9px 11px;color:var(--ink2);margin-bottom:9px;font-weight:600}
.cc .note{font-size:13.5px;color:var(--ink3);line-height:1.65}
.cc .rat{height:5px;border-radius:5px;background:#f2f4f6;overflow:hidden;margin-bottom:9px}
.cc .rat i{display:block;height:100%;background:linear-gradient(90deg,#e07b6a,#f04452)}

/* ---------- design / script / ask / quiz ---------- */
.gd{counter-reset:g;margin-bottom:8px}
.gd li{list-style:none;position:relative;padding:18px 20px 18px 56px;background:#fff;border:0;border-radius:16px;margin-bottom:10px;font-size:15.5px;color:var(--ink2);line-height:1.7;box-shadow:var(--sh)}
.gd li:before{counter-increment:g;content:counter(g);position:absolute;left:18px;top:18px;width:26px;height:26px;border-radius:9px;background:var(--blue-l);color:var(--blue-d);font-size:13px;font-weight:800;
  display:grid;place-items:center}
.sc{background:#fff;border:0;border-radius:18px;padding:20px 22px;margin-bottom:11px;box-shadow:var(--sh)}
.sc .k{display:inline-block;font-size:12px;font-weight:700;letter-spacing:0;background:var(--blue-l);color:var(--blue-d);padding:5px 12px;border-radius:999px;margin-bottom:12px}
.sc .q{font-size:15px;color:var(--ink3);padding-left:28px;position:relative;margin-bottom:12px}
.sc .q:before{content:'고객';position:absolute;left:0;top:0;font-size:10.5px;font-weight:800;color:var(--ink3)}
.sc .a{font-size:16px;padding-left:28px;position:relative;line-height:1.8;color:var(--ink)}
.sc .a:before{content:'나';position:absolute;left:0;top:3px;font-size:11.5px;font-weight:700;color:var(--blue)}
.sc .cp{float:right;font-size:11.5px;border:1px solid var(--line);background:#fafaf7;border-radius:7px;
  padding:3px 9px;cursor:pointer;color:var(--ink3)}
.sc .cp:hover{border-color:var(--gold);color:var(--navy)}
.ak li{list-style:none;background:#fff;border:0;border-radius:16px;padding:16px 20px 16px 48px;
  margin-bottom:8px;font-size:15.5px;position:relative;box-shadow:var(--sh);color:var(--ink2)}
.ak li:before{content:'Q';position:absolute;left:20px;top:16px;font-weight:800;color:var(--blue);font-size:14px}
.qz{background:#fff;border:0;border-radius:18px;padding:22px 24px;margin-bottom:12px;box-shadow:var(--sh)}
.qz .qq{font-size:17px;font-weight:700;margin-bottom:16px;line-height:1.5;letter-spacing:-.03em}
.qz .qq i{color:var(--blue);font-style:normal;margin-right:7px}
.qz .op{display:block;width:100%;text-align:left;font:inherit;font-size:15.5px;border:0;background:var(--paper);border-radius:14px;padding:15px 18px;margin-bottom:9px;cursor:pointer;transition:.14s;color:var(--ink2)}
.qz .op:hover{border-color:transparent;background:var(--line)}
.qz .op.ok{background:var(--ok-l);color:#00806a;font-weight:700;box-shadow:inset 0 0 0 2px var(--ok);border-color:transparent}
.qz .op.no{background:var(--red-l);color:var(--red);box-shadow:inset 0 0 0 2px var(--red);border-color:transparent}
.qz .why{display:none;font-size:14.5px;background:var(--blue-ll);border-radius:14px;padding:15px 18px;color:var(--ink2);margin-top:8px;line-height:1.7}
.qz.ans .why{display:block}
.ban li{list-style:none;background:#ffeff0;border:0;border-radius:16px;padding:16px 20px 16px 46px;
  margin-bottom:8px;font-size:15.5px;position:relative;color:#c9313d;line-height:1.7}
.ban li:before{content:'×';position:absolute;left:20px;top:16px;font-weight:800;color:var(--red)}

.done-btn{margin-top:34px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:14px;padding:14px 22px;cursor:pointer}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-d)}
.btn.g{background:var(--blue);color:#fff}.btn.g:hover{background:var(--blue-d)}
.btn.o{background:var(--paper);color:var(--ink2)}.btn.o:hover{background:var(--line)}
.hint{font-size:12.6px;color:var(--ink3)}

/* ---------- cost DB screen ---------- */
.filt{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.filt button{font:inherit;font-size:14px;font-weight:600;border:0;background:#fff;border-radius:999px;padding:10px 18px;cursor:pointer;color:var(--ink2);box-shadow:var(--sh)}
.filt button.on{background:var(--blue);color:#fff;border-color:transparent}
.mini{font-size:12.8px;color:var(--ink3);margin-bottom:14px}

/* ---------- case study ---------- */
.csel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.csel button{font:inherit;font-size:13.2px;font-weight:600;border:0;background:#fff;border-radius:16px;padding:12px 16px;cursor:pointer;color:var(--ink2);text-align:left;line-height:1.4;box-shadow:var(--sh)}
.csel button b{display:block;font-size:14.6px;color:var(--ink);font-weight:800}
.csel button span{font-size:11.4px;color:var(--ink3)}
.csel button.on{background:var(--blue);border-color:transparent;color:#fff}
.csel button.on b{color:#fff}.csel button.on span{color:var(--gold2)}
.prof{background:#fff;border:0;border-radius:18px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--sh)}
.prof dl{display:grid;grid-template-columns:96px 1fr;gap:5px 12px;font-size:14px}
.prof dt{color:var(--ink3);font-weight:600}
.prof dd{color:var(--ink)}
.brief{background:var(--ink);color:#fff;border-radius:20px;padding:22px 26px;margin-bottom:20px;font-size:16.5px;line-height:1.7;border-left:0}
.brief b{color:var(--gold2)}
.st{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;text-align:center;
  font-size:12px;font-weight:800;color:#fff}
.st.O{background:#02a678}.st.T{background:#c9902a}.st.X{background:#f04452}
.hole{background:#fff;border:0;border-left:4px solid var(--red);border-radius:18px;padding:20px 22px;margin-bottom:13px;box-shadow:var(--sh)}
.hole h4{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-bottom:7px;line-height:1.45}
.hole h4 i{font-style:normal;color:#f04452;margin-right:7px}
.hole p{font-size:14.4px;color:var(--ink);margin-bottom:11px}
.plans{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));margin-bottom:8px}
.pl{background:#fff;border:0;border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;box-shadow:var(--sh)}
.pl.rec{border-color:var(--gold);border-width:2px;box-shadow:0 0 0 2px var(--blue), var(--sh2);border:0}
.pl .pn{font-size:16px;font-weight:800;letter-spacing:-.02em}
.pl .pf{font-size:14.6px;font-weight:800;color:#f04452;margin:3px 0 11px}
.pl .rb{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:0;background:var(--blue);color:#fff;border-radius:999px;padding:2px 9px;margin-bottom:6px}
.pl ul{list-style:none;margin-bottom:11px;flex:1}
.pl li{font-size:13.5px;padding-left:15px;position:relative;margin-bottom:6px;line-height:1.55}
.pl li:before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.pl .pnote{font-size:13px;color:var(--ink2);background:#f7f8fb;border-radius:9px;padding:10px 12px;line-height:1.6}
.n{font-size:10px;font-weight:800;background:#e8f3ff;color:#3182f6;border-radius:4px;padding:1px 5px;margin-left:3px}
.kk{font-size:10px;font-weight:800;background:#fdf0e0;color:#a35a00;border-radius:4px;padding:1px 5px;margin-left:3px}
.drill{counter-reset:d}
.drill li{list-style:none;background:#fffbf0;border:0;border-radius:16px;padding:18px 22px 18px 52px;margin-bottom:9px;font-size:15.5px;position:relative;color:#7a5800}
.drill li:before{counter-increment:d;content:counter(d);position:absolute;left:18px;top:18px;width:21px;height:21px;border-radius:9px;background:var(--blue);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center}

.drill li{cursor:pointer}
.drill li .dq{font-weight:600}
.drill li .da{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #d9c48f;
  font-size:14px;line-height:1.75;color:#3a2f14;font-weight:400}
.drill li.open .da{display:block}
.drill li .tog{float:right;font-size:11.5px;color:#8a6d1e;font-weight:700}
/* ---------- book (통독) ---------- */
.bkbar{position:sticky;top:0;z-index:20;background:var(--paper);padding:10px 0 12px;margin-bottom:6px;
  border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bkbar .hint{margin-left:auto}
.bkch{margin:0 0 10px;padding:26px 0 0;border-top:3px solid var(--navy)}
.bkch:first-of-type{border-top:0;padding-top:0}
.bkch .bkkick{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:800}
.bkch h2{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:3px 0 4px;line-height:1.3}
.bkch .sub{color:var(--ink2);font-size:13.5px;margin-bottom:12px}
.bksec{font-size:12px;letter-spacing:.1em;font-weight:800;color:#fff;background:var(--navy2);
  display:inline-block;padding:4px 12px;border-radius:20px;margin:26px 0 12px}
.toc{background:#fff;border:0;border-radius:18px;padding:24px 28px;margin-bottom:26px;box-shadow:var(--sh)}
.toc h3{font-size:15px;font-weight:800;margin-bottom:10px}
.toc ol{margin:0;padding-left:20px}
.toc li{font-size:14px;margin-bottom:5px}
.toc a{color:var(--ink);text-decoration:none}
.toc a:hover{color:var(--gold);text-decoration:underline}
@media print{
  .bkbar{display:none!important}
  .bkch{page-break-before:always}
  .bkch:first-of-type{page-break-before:auto}
  .drill li .da{display:block!important}
}

/* ---------- book cover / parts ---------- */
.cover{background:linear-gradient(160deg,#3182f6 0%,#1b64da 60%,#1957b8 100%);color:#fff;border-radius:24px;padding:64px 44px 48px;margin-bottom:30px;position:relative;overflow:hidden}
.cover:before{content:'';position:absolute;inset:16px;border:1px solid rgba(201,162,39,.35);border-radius:10px;pointer-events:none}
.cover .cv1{font-size:12px;letter-spacing:.3em;color:var(--gold2);font-weight:800;margin-bottom:16px}
.cover h1{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.22;margin-bottom:12px}
.cover h1 em{font-style:normal;color:var(--gold2);display:block;font-size:20px;font-weight:700;margin-top:10px;letter-spacing:-.02em}
.cover .cv2{font-size:15px;color:#d1d6db;line-height:1.8;margin:26px 0 30px;max-width:560px}
.cover .cvmeta{display:flex;gap:26px;flex-wrap:wrap;font-size:12.5px;color:#8fa3c4;
  border-top:1px solid rgba(255,255,255,.13);padding-top:18px}
.cover .cvmeta b{display:block;color:var(--gold2);font-size:11px;letter-spacing:.1em;margin-bottom:3px}
.part{background:var(--blue);color:#fff;border-radius:20px;padding:34px 30px;margin:0 0 24px;text-align:center}
.part .pn{font-size:11.5px;letter-spacing:.28em;color:var(--gold2);font-weight:800}
.part h2{font-size:27px;font-weight:800;letter-spacing:-.03em;margin:8px 0 6px;color:#fff}
.part p{font-size:14px;color:#d1d6db}
.pref{background:#fff;border:0;border-radius:18px;padding:26px 28px;margin-bottom:26px;box-shadow:var(--sh)}
.pref h3{font-size:18px;font-weight:800;margin-bottom:12px;letter-spacing:-.02em}
.pref p{font-size:14.8px;margin-bottom:11px;line-height:1.78}
.pref ol{padding-left:20px;margin:0 0 11px}
.pref li{font-size:14.6px;margin-bottom:6px}
.colo{background:#fff;border:0;border-radius:18px;padding:24px 28px;margin-top:26px;
  font-size:13px;color:var(--ink2);line-height:1.85;box-shadow:var(--sh)}
.colo b{color:var(--ink)}
.bkcase{border-top:1px solid var(--line);padding-top:24px;margin-top:26px}
.bkcase:first-of-type{border-top:0;padding-top:0;margin-top:0}
.bkcase>.cs-h{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.bkcase>.cs-s{font-size:13px;color:var(--ink3);margin-bottom:14px}
@media print{
  .cover{page-break-after:always;border-radius:0}
  .part{page-break-before:always}
  .bkcase{page-break-before:always}
  .colo{page-break-before:always}

<script>
(function(){
'use strict';
var C = window.CURRICULUM || [], COSTS = window.COSTS || [];
var KEY='bohum_academy_v1';
var state = JSON.parse(localStorage.getItem(KEY)||'{}');
state.done = state.done || {};
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

/* ── 현장 과제 기록 ────────────────────────────────────────────────
   고객 표시와 한 줄은 이 기기에만 남는다. 서버로는 건수와 날짜만 간다.
   이 표에는 로그인이 없어서 링크를 아는 사람은 읽을 수 있다 — 개인정보를 올리지 않는다. */
var PKEY = 'bohum_prac_v1';
var PR = JSON.parse(localStorage.getItem(PKEY) || '{}');
function psave(){ try{ localStorage.setItem(PKEY, JSON.stringify(PR)); }catch(e){} }
function prac(id){ return (window.PRACTICE || []).filter(function(x){ return x.id === id; })[0] || null; }
function pRows(id){ return (PR[id] && PR[id].rows) || []; }
function pDone(id){ var t = prac(id); return !!t && pRows(id).length >= t.n; }
/* 본문을 읽었고 과제가 아직 안 끝난 레벨 — 앞에서부터 하나 */
function pNext(){
  var list = window.PRACTICE || [];
  for(var i=0;i<list.length;i++){
    var t = list[i];
    if(state.done[t.id] && !pDone(t.id)) return t;
  }
  return null;
}
/* 서버로는 숫자만 — p_L4 : 3 */
function pPush(){
  if(!(window.SYNC && tname())) return;
  var out = {}, k;
  for(k in state.done) if(state.done[k]) out[k] = 1;
  (window.PRACTICE || []).forEach(function(t){
    var n = pRows(t.id).length;
    if(n) out['p_' + t.id] = n;
  });
  SYNC.pushProgress(tname(), out);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

    '<div class="navsep">본문</div>'+
    C.map(function(c){
    return '<a href="#'+c.id+'" data-id="'+c.id+'" class="'+(state.done[c.id]?'done':'')+'">'+
      '<span class="lv">L'+c.lvl+'</span><span class="tx">'+esc(c.title)+'</span><span class="dn">●</span></a>';

function costCard(n){

function figDesign(d){
  var H = window.FIGH; if(!H) return '';
  var T=H.T, rows=[];
  (d.must||[]).forEach(function(m){ rows.push({n:m.n, v:3, c:'B', note:m.amt}); });
  (d.opt||[]).forEach(function(x){ rows.push({n:String(x).replace(/<[^>]+>/g,'').slice(0,22), v:2, c:'o', note:'여력 되면'}); });
  (d.skip||[]).forEach(function(x){ rows.push({n:String(x).replace(/<[^>]+>/g,'').slice(0,22), v:1, c:'m', note:'지금은 아님'}); });
  if(!rows.length) return '';
  var b = H.bars(rows, {title:'담보 우선순위 — 위에서부터 채운다', max:3, x0:196, bh:26, gap:9});
  var s = b.s;
  s += H.tx(196, b.h+18, '반드시', {a:'start', size:10.6, w:800, fill:T.B.s});
  s += H.tx(300, b.h+18, '여력 되면', {a:'start', size:10.6, w:800, fill:T.o.t});
  s += H.tx(410, b.h+18, '지금은 아님', {a:'start', size:10.6, w:800, fill:H.INK3});
  return H.wrap(b.h+30, s);
}
function figBudget(d){
  var H = window.FIGH; if(!H) return '';
  var mu=(d.must||[]).length, op=(d.opt||[]).length, sk=(d.skip||[]).length;
  var st = H.stack([
    {n:'반드시 ('+mu+')', v:Math.max(mu,1)*3, c:'B'},
    {n:'여력 ('+op+')',   v:Math.max(op,1)*2, c:'o'},
    {n:'보류 ('+sk+')',   v:Math.max(sk,1)*1, c:'m'}
  ], {title:'예산이 줄면 오른쪽부터 사라진다'});
  var s = st.s;
  s += H.tx(360, st.h+18, '담보를 빼기 전에 <tspan font-weight="800">가입금액을 줄이고 기간을 줄인다</tspan> — 빠진 담보는 나중에 못 넣는다',
            {size:11.4, w:600, fill:H.INK2});
  return H.wrap(st.h+30, s);
}
function figCaseMap(c){
  var H = window.FIGH; if(!H) return '';
  var mp = (c.map||[]).slice(0,10);
  if(!mp.length) return '';
  var rows = mp.map(function(r){
    return {n: String(r[1]).replace(/<[^>]+>/g,'').slice(0,18), v:[r[2]==='T'?'D':r[2]]};
  });
  var m = H.matrix(['진단'], rows, {title:'담보 지도 — 한눈에 보는 구멍', x0:250, rh:26});
  var s = m.s;
  var O=0,D=0,X=0;
  mp.forEach(function(r){ if(r[2]==='O')O++; else if(r[2]==='X')X++; else D++; });
  s += H.box(24, m.h+10, 214, 46, 'g', {r:11});
  s += H.tx(131, m.h+40, '있다  '+O+'개', {size:13, w:800, fill:H.T.g.t});
  s += H.box(253, m.h+10, 214, 46, 'o', {r:11});
  s += H.tx(360, m.h+40, '부족  '+D+'개', {size:13, w:800, fill:H.T.o.t});
  s += H.box(482, m.h+10, 214, 46, 'r', {r:11});
  s += H.tx(589, m.h+40, '없다  '+X+'개', {size:13, w:800, fill:H.T.r.t});
  s += H.tx(360, m.h+80, '말로 설명하지 말고 <tspan font-weight="800">이 그림을 돌려서 보여준다</tspan>', {size:11.6, w:600, fill:H.INK2});
  return H.wrap(m.h+96, s);
}
function figCasePlans(c){
  var H = window.FIGH; if(!H) return '';
  var ks=['a','b','c'], tone={a:'m',b:'B',c:'o'}, out=[];
  ks.forEach(function(k){ if(c.plans && c.plans[k]) out.push({k:k, p:c.plans[k]}); });
  if(!out.length) return '';
  var s = H.tx(360,20,'제안 3안 — 고객이 고르게 한다',{size:13.5,w:800,fill:H.INK});
  var w = (720-28-(out.length-1)*14)/out.length;
  out.forEach(function(o,i){
    var x=14+i*(w+14), t=o.p.recommend?'B':tone[o.k], T=H.T[t];
    s += H.box(x,38,w,150,t,{r:13});
    if(o.p.recommend){
      s += '<rect x="'+(x+w/2-30)+'" y="30" width="60" height="20" rx="10" fill="'+H.T.B.s+'"/>';

var AUDIT_SQL = "select 'academy_* (CRM 소유 · 건드리지 말 것)' as grp,\n       string_agg(c.relname, ', ' order by c.relname) as tables\nfrom pg_class c join pg_namespace n on n.oid=c.relnamespace\nwhere n.nspname='public' and c.relkind='r' and c.relname like 'academy%'\nunion all\nselect 'bohum_* (보험 마스터 아카데미)',\n       string_agg(c.relname, ', ' order by c.relname)\nfrom pg_class c join pg_namespace n on n.oid=c.relnamespace\nwhere n.nspname='public' and c.relkind='r' and c.relname like 'bohum%'\nunion all\nselect '전체 테이블 수', count(*)::text\nfrom pg_class c join pg_namespace n on n.oid=c.relnamespace\nwhere n.nspname='public' and c.relkind='r'\nunion all\nselect '익명(anon) 정책이 붙은 표  <<< 여기가 핵심',\n       string_agg(distinct c.relname, ', ')\nfrom pg_class c join pg_namespace n on n.oid=c.relnamespace\njoin pg_policy p on p.polrelid=c.oid\njoin pg_roles  r on r.oid=any(p.polroles) and r.rolname='anon'\nwhere n.nspname='public';";

function growStat(who){
  var doneN = 0; C.forEach(function(c){ if(state.done[c.id]) doneN++; });
  var scores = {}, avg = 0, cnt = 0;
  if(who){
    QUIZ.forEach(function(s){ var b = best(s.id, who); if(b){ scores[s.id]=b.pct; avg+=b.pct; cnt++; } });
  }
  avg = cnt? Math.round(avg/cnt) : 0;
  var stage = 1;
  STAGES.forEach(function(st){
    var okDone = st.need.every(function(id){ return state.done[id]; });
    var okTest = st.tests.every(function(id){ return (scores[id]||0) >= (st.n===4?80:70); });
    if(okDone && okTest) stage = Math.min(4, st.n + (st.n<4?1:0));
  });
  if(stage===4 && !(cnt===QUIZ.length && avg>=80)) stage = 4;
  return {doneN:doneN, total:C.length, scores:scores, avg:avg, cnt:cnt, stage:stage};
}
function nextAction(who, st){

  }

  for(var i=0;i<cur.need.length;i++){

    if(!state.done[id]){
      var ch = C.filter(function(x){return x.id===id;})[0];

    if(sc===undefined) return {t:'테스트 '+q+' 응시', d:set?set.n:'', h:'#TQ-'+q, why:'아직 안 봤다'};

/* 본문 전체가 하나의 함수 안에 들어 있어서 밖에서는 아무것도 못 부른다.
   APEX OS 안에서 열렸을 때 로그인한 이름을 받기 위해 문을 하나만 낸다. */
window.__bohumSetWho = function(n){
  n = String(n==null?'':n).replace(/^\s+|\s+$/g,'');
  if(!n || n === tname()) return false;
  tsetname(n);
  try{ route(); }catch(e){}
  return true;
};
function norm(s){ return String(s||'').toLowerCase().replace(/[\s,.\/·・\-_'"()\[\]%~:;!?→]/g,''); }
function blankOk(v, arr){
  var n = norm(v); if(!n) return false;
  return arr.some(function(a){
    var na = norm(a);
    if(n === na) return true;
    var toks = String(a).split(/[\s,\/·]+/).filter(Boolean).map(norm).filter(Boolean);
    if(toks.length > 1) return toks.every(function(t){ return n.indexOf(t) >= 0; });
    if(/^[0-9]+$/.test(na)) return new RegExp('(^|[^0-9])' + na + '([^0-9]|$)').test(n);
    return na.length >= 2 && n.indexOf(na) >= 0;
  });
}

    } else if(q.t==='multi'){
      var cs = Array.prototype.slice.call(item.querySelectorAll('input[type=checkbox]:checked')).map(function(x){return +x.value;});
      mine = cs.join(',');
      ok = cs.length===q.a.length && q.a.every(function(a){return cs.indexOf(a)>=0;});
      part = ok?1:0;
    } else {
      var t = item.querySelector('.qta').value; mine=t;
      if(q.self){ part = null; }
      else {
        var keys = q.key||[], hit = keys.filter(function(k){ return norm(t).indexOf(norm(k))>=0; }).length;
        part = keys.length? hit/keys.length : (t.trim().length>20?1:0);
        ok = part>=0.6;
      }
    }
    answers[i]=mine;
    if(part!==null){ max+=1; got+=part; if(part<1) wrong.push(i); }

    var badge = part===null? '<span class="rb self">자유 답변</span>'
              : (part>=1? '<span class="rb o">정답</span>'
              : (part>0? '<span class="rb p">부분 '+Math.round(part*100)+'%</span>' : '<span class="rb x">오답</span>'));
    var ansHtml='';
    if(q.t==='blank') ansHtml = '<div class="ra"><b>정답</b> '+esc(q.a[0])+'</div>';
    else if(q.t==='choice') ansHtml = '<div class="ra"><b>정답</b> '+(q.a+1)+'번 — '+q.c[q.a]+'</div>';
    else if(q.t==='multi') ansHtml = '<div class="ra"><b>정답</b> '+q.a.map(function(a){return (a+1)+'번';}).join(' · ')+'</div>';
    else if(!q.self) ansHtml = '<div class="ra"><b>모범답안</b> '+q.model+'</div>'+
        ((q.key&&q.key.length)?'<div class="rk">필수 키워드 — '+q.key.map(function(k){
          return '<span class="'+((norm(mine).indexOf(norm(k))>=0)?'hit':'miss')+'">'+esc(k)+'</span>';
        }).join('')+'</div>':'');
    else ansHtml = '<div class="ra"><b>참고 답안</b> '+q.model+'</div>';

    res.className='qres show '+(part===null?'self':(part>=1?'ok':(part>0?'part':'no')));
    res.innerHTML = badge + ansHtml + '<div class="rw">'+q.why+'</div>'+
      (q.ref? '<a class="rl" href="'+q.ref+'">→ 해당 화면에서 다시 보기</a>':'');
  });
  var pct = max? Math.round(got/max*100) : 0;
  var db=tload(); db[who]=db[who]||{attempts:[]};
  db[who].attempts.push({id:s.id, n:s.n, cat:s.cat, score:Math.round(got*10)/10, max:max, pct:pct,
                         date:new Date().toISOString().slice(0,10), wrong:wrong});
  tsave(db);
  if(window.SYNC) SYNC.pushScore({name:who, id:s.id, n:s.n, cat:s.cat,
    score:Math.round(got*10)/10, max:max, pct:pct, wrong:wrong});
  var box=document.createElement('div');
  box.className='score '+(pct>=80?'good':(pct>=60?'mid':'bad'));
  box.innerHTML = '<div class="sp">'+pct+'<i>점</i></div>'+
    '<div class="sd"><b>'+esc(who)+'</b> · '+esc(s.n)+'<br>'+
    Math.round(got*10)/10+' / '+max+' 문항'+(wrong.length?' · 틀린 문항 '+wrong.map(function(w){return (w+1);}).join(', '):' · 전부 정답')+'</div>'+
    (pct>=80?'<div class="sm">통과 — 이 영역은 실전에서 써도 됩니다.</div>'
     :(pct>=60?'<div class="sm">조금 더. 틀린 문항의 해설과 링크를 따라가 보세요.</div>'
     :'<div class="sm">해당 LEVEL을 다시 읽고 재응시하세요. 점수는 최고점만 기록됩니다.</div>'));
  var form=document.getElementById('qform');
  form.parentNode.insertBefore(box, form);
  window.scrollTo(0, 0);
}

function hl(txt,q){
  var i = txt.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(txt.slice(0,110))+(txt.length>110?'…':'');
  var a=Math.max(0,i-42), b=Math.min(txt.length,i+q.length+78);
  return (a>0?'…':'')+esc(txt.slice(a,i))+'<mark>'+esc(txt.slice(i,i+q.length))+'</mark>'+esc(txt.slice(i+q.length,b))+(b<txt.length?'…':'');
}
function renderSearch(q){
  q = (q||'').trim();
  var h = '<div class="hd"><div class="kick">검색</div><h2>“'+esc(q)+'”</h2></div>';
  if(q.length<1) return h+'<div class="snone">검색어를 입력하세요</div>';
  var ql = q.toLowerCase();
  var qs = ql.replace(/\s+/g,'');                     // 띄어쓰기 무시용
  var toks = ql.split(/\s+/).filter(function(t){return t.length>0;});
  var res = buildIndex().map(function(r){
    var tl = r.t.toLowerCase(), bl = r.b.toLowerCase();
    var ti = tl.indexOf(ql), bi = bl.indexOf(ql), sc = 0;
    if(ti>=0) sc += 100-Math.min(ti,90);
    if(bi>=0) sc += 20;
    if(sc===0 && qs.length>1){                        // 「숨은보험금」→「숨은 보험금」
      var tn = tl.replace(/\s+/g,''), bn = bl.replace(/\s+/g,'');
      if(tn.indexOf(qs)>=0) sc += 80;
      else if(bn.indexOf(qs)>=0) sc += 16;
    }
    if(sc===0 && toks.length>1){                      // 여러 단어를 모두 포함
      var all = toks.every(function(t){ return tl.indexOf(t)>=0 || bl.indexOf(t)>=0; });
      if(all) sc += 12;
    }
    return sc? {r:r, sc:sc} : null;
  }).filter(Boolean).sort(function(a,b){return b.sc-a.sc;}).slice(0,60);
  if(!res.length) return h+'<div class="snone">결과가 없습니다.<br><span style="font-size:12.5px">예: 뇌경색 · 협심증 · 1-7종 · 배액술 · 산정특례 · 유사암 · CDR</span></div>';
  h += '<div class="mini">'+res.length+'건</div><div class="sres">'+res.map(function(o){
    return '<a class="sr" href="'+o.r.h+'"><span class="srk '+o.r.k+'">'+o.r.k+'</span>'+
      '<h4>'+hl(o.r.t,q)+'</h4><p>'+hl(o.r.b,q)+'</p></a>';
  }).join('')+'</div>';
  return h+footer();
}

function renderCards(){
  var h='<div class="hd"><div class="kick">부록 B</div><h2>화법 전체 카드</h2>'+
    '<div class="sub">10개 레벨의 모든 화법을 한 곳에 · 출퇴근 암기용</div></div>';
  function scHTML(x){
    return '<div class="sc">'+(x.k?'<span class="k">'+esc(x.k)+'</span>':'')+
      (!x.q||x.q==='—'?'':'<div class="q">'+esc(x.q)+'</div>')+'<div class="a">'+x.a+'</div></div>';
  }
  var n = 0;
  C.forEach(function(c){ n += (c.scripts||[]).length; });
  CASES.forEach(function(c){ n += (c.script||[]).length; });
  n += DISEASE.length + DESIGN.length + (HEALTH?1:0);
  h = h.replace('<div class="sub">10개 레벨의 모든 화법을 한 곳에 · 출퇴근 암기용</div>',
    '<div class="sub">본문 · 질병 · 설계 · 케이스 · 서비스 화법 '+n+'개 · 출퇴근 암기용</div>');
  h += '<div class="cal tip">눈으로 읽으면 남지 않습니다. 한 장씩 <b>소리 내어 3번</b> 읽으세요.</div>';
  C.forEach(function(c){
    h += '<h3 class="bh">LEVEL '+c.lvl+' · '+esc(c.title)+'</h3>'+ (c.scripts||[]).map(scHTML).join('');
  });
  if(DISEASE.length)
    h += '<h3 class="bh">질병 백과 · '+DISEASE.length+'종</h3>'+
      DISEASE.map(function(d){ return scHTML({k:d.name+' — '+d.talk.k, q:d.talk.q, a:d.talk.a}); }).join('');
  if(DESIGN.length)
    h += '<h3 class="bh">설계편 · '+DESIGN.length+'가지 상황</h3>'+
      DESIGN.map(function(d){ return scHTML({k:'['+d.g+'] '+d.title, q:d.talk.q, a:d.talk.a}); }).join('');
  if(CASES.length)
    h += '<h3 class="bh">케이스 스터디 · '+CASES.length+'건</h3>'+
      CASES.map(function(c){ return (c.script||[]).map(function(x){ return scHTML({k:c.name+' — '+x.k, q:x.q, a:x.a}); }).join(''); }).join('');
  if(HEALTH)
    h += '<h3 class="bh">헬스케어 서비스</h3>'+ scHTML({k:HEALTH.talk.k, q:HEALTH.talk.q, a:HEALTH.talk.a});
  return h+footer();
}

    '<li>js · css 를 수정하면 <code>index.html</code>의 <code>?v=</code> 값을 반드시 올릴 것 (안 올리면 옛 파일이 계속 쓰인다)</li>'+
    '<li>인쇄 시 모든 탭이 펼쳐진 상태로 출력되어 <b>PDF 교재</b>로 바로 쓸 수 있다</li></ul>'+
    footer();
}
function footer(){
  return '<div class="foot">본 교재는 내부 교육용 자료입니다. 보장 내용 · 지급 기준은 <b>반드시 해당 상품의 약관</b>이 우선하며, 회사 · 상품 · 가입시기에 따라 달라질 수 있습니다.<br>'+
    '통계 출처 — 통계청(2019 · 2024), 건강보험심사평가원(2021 · 2022), 국민건강보험공단(2022), 한국소비자원, 한국리서치(2023), 삼성서울병원 암교육센터 등. 치료비 사례는 2022~2025년 실제 진료비 계산서 기준이며 개인 · 병원 · 시기에 따라 다를 수 있습니다.</div>';
}

/* ---------- router ---------- */
function route(){
  var id = location.hash.replace('#','') || (C[0] && C[0].id) || 'DB';
  var v = document.getElementById('view');
  var c = C.filter(function(x){return x.id===id;})[0];
  if(c) v.innerHTML = renderChapter(c);
  else if(id==='DB'){ v.innerHTML = renderDB(); paintDB('전체'); }
  else if(id==='CASE'){ v.innerHTML = renderCaseShell(); paintCase(0); }
  else if(id==='LESSON'){ v.innerHTML = renderLessonShell(); paintLesson(0); }
  else if(id==='DZ'){ v.innerHTML = renderDzList(); paintDzGrid('전체'); }
  else if(id.indexOf('DZ-')===0){ v.innerHTML = renderDzDetail(id.slice(3)); }
  else if(id==='ANALYSIS'){ v.innerHTML = renderAnalysisShell(); paintAnalysis(0); }
  else if(id==='DESIGN'){ v.innerHTML = renderDesignList(); }
  else if(id.indexOf('DS-')===0){ v.innerHTML = renderDesignDetail(id.slice(3)); }
  else if(id==='SRC'){ v.innerHTML = renderSrc(); paintSrc('전체',''); }
  else if(id.indexOf('SRC-')===0){ v.innerHTML = renderSrcDetail(id.slice(4)); }
  else if(id==='GROW'){ v.innerHTML = renderGrow(); }
  else if(id==='PRAC'){ v.innerHTML = renderPrac(); }
  else if(id==='TEST'){ v.innerHTML = renderTest(); }
  else if(id==='TEAM'){ v.innerHTML = renderTeam(); loadTeam(); }
  else if(id.indexOf('TQ-')===0){ QSET = id.slice(3); v.innerHTML = renderQuiz(QSET); }
  else if(id==='HEALTH'){ v.innerHTML = renderHealth(); }
  else if(id==='SURG'){ v.innerHTML = renderSurg(); }
  else if(id==='TERMS'){ v.innerHTML = renderTerms(); }
  else if(id.indexOf('T-')===0){ v.innerHTML = renderTermDetail(id.slice(2)); }
  else if(id==='GAL'){ v.innerHTML = renderGal(); paintGal('an'); }
  else if(id==='SEARCH'){ v.innerHTML = renderSearch(LASTQ); }
  else if(id==='BOOK') v.innerHTML = renderBook();
  else if(id==='CARD') v.innerHTML = renderCards();
  else if(id==='GUIDE'){ v.innerHTML = renderGuide();
    var _sb=document.getElementById('sqlbox');
    if(_sb){ _sb.value = SUPA_SQL;
      _sb.addEventListener('focus', function(){ this.select(); });
      _sb.addEventListener('click', function(){ this.select(); }); }
    if(window.SYNC) SYNC.check().then(function(ok){
      if(!document.getElementById('setupsteps')) return;
      if(ok){ stepDone(1); stepDone(2); setMsg('ok','이미 연결돼 있습니다. 팀원 점수가 자동으로 모입니다.'); }
      else setMsg('no','아직 서버가 설정되지 않았습니다 — '+esc(SYNC.state.msg));
    }); }
  else { location.hash = C[0].id; return; }
  Array.prototype.forEach.call(document.querySelectorAll('nav a'), function(a){
    a.classList.toggle('on', a.dataset.id===id);
  });
  drawer(false);
  window.scrollTo(0,0);
  CUR = c || null;
  CURHASH = id;
}
var CUR = null, QSET = null, CURHASH = '';
function bind(){
  var v = document.getElementById('view');
  v.addEventListener('click', function(e){
    var c = CUR;
    var t = e.target;
    // tabs
    if(t.matches('.tabs button')){
      Array.prototype.forEach.call(v.querySelectorAll('.tabs button'), function(b){b.classList.toggle('on', b===t);});
      Array.prototype.forEach.call(v.querySelectorAll('.pane'), function(p){p.classList.toggle('on', p.dataset.p===t.dataset.p);});
      return;
    }
    // quiz
    if(t.matches('.qz .op')){
      var box = t.closest('.qz'); if(box.classList.contains('ans')) return;
      var ans = +box.dataset.a, pick = +t.dataset.j;
      box.classList.add('ans');
      Array.prototype.forEach.call(box.querySelectorAll('.op'), function(b,j){
        if(j===ans) b.classList.add('ok'); else if(j===pick) b.classList.add('no');
      });
      return;
    }
    // copy script
    if(t.matches('.cp') && c){
      var s = c.scripts[+t.dataset.cp];
      var txt = '['+s.k+']\n'+(s.q==='—'?'':'고객: '+s.q+'\n')+'나: '+s.a.replace(/<[^>]+>/g,'');
      navigator.clipboard && navigator.clipboard.writeText(txt).then(function(){ t.textContent='복사됨'; setTimeout(function(){t.textContent='복사';},1200); });
      return;
    }
    // 현장 과제 — 기록
    if(t.dataset && t.dataset.padd){
      var pid = t.dataset.padd, task = prac(pid);
      var w1 = document.getElementById('pw-'+pid), n1 = document.getElementById('pn-'+pid);
      var wv = (w1 ? w1.value : '').trim(), nv = (n1 ? n1.value : '').trim();
      if(!wv && !nv){ if(w1) w1.focus(); return; }
      if(!PR[pid]) PR[pid] = {rows:[]};
      var d = new Date();
      PR[pid].rows.push({ who:wv || '—', note:nv,
        at:(d.getMonth()+1)+'/'+d.getDate() });
      psave(); pPush(); route();
      return;
    }
    if(t.dataset && t.dataset.pdel){
      var did = t.dataset.pdel, di = +t.dataset.i;
      if(PR[did] && PR[did].rows) PR[did].rows.splice(di, 1);
      psave(); pPush(); route();
      return;
    }
    // done
    if(t.id==='dbtn' && c){
      state.done[c.id] = !state.done[c.id]; save(); buildNav();
      pPush();
      t.textContent = state.done[c.id] ? '● 학습 완료됨 (취소)' : '이 레벨 학습 완료로 표시';
      t.className = 'btn '+(state.done[c.id]?'o':'g');
      return;
    }
    // lightbox
    var im = t.closest('.fig img, .gal figure');
    if(im){
      var el = t.tagName==='IMG' ? t : im.querySelector('img');
      if(el){ document.getElementById('lbi').src = el.src;
        document.getElementById('lbc').textContent = el.dataset.cap || '';
        document.getElementById('lb').classList.add('on'); }
      return;
    }
    if(t.closest('#srcnav')){ var sb=t.closest('#srcnav button'); if(sb) paintSrc(sb.dataset.c, undefined); return; }
    if(t.id==='whoset'){ var vv=document.getElementById('whoin').value.trim(); if(vv){ tsetname(vv); route(); } return; }
    var wp=t.closest('.pill.who');
    if(wp){ tsetname(wp.dataset.n); route(); return; }
    if(t.id==='qgrade'){ if(QSET) gradeQuiz(QSET); return; }
    if(t.id==='stepOpen' || t.id==='sqlcopy'){
      var copied = copySQL();
      var after = copied ? Promise.resolve(true)
        : (navigator.clipboard ? navigator.clipboard.writeText(SUPA_SQL).then(function(){return true;})
                                  .catch(function(){return false;})
                               : Promise.resolve(false));
      if(t.id==='sqlcopy'){
        after.then(function(ok){
          setMsg(ok?'ok':'no', ok
            ? 'SQL 이 <b>복사됐습니다</b> — Supabase SQL Editor 에 붙여넣고 Run 하세요.'
            : '복사가 막혀 있습니다. 아래 상자를 <b>클릭하면 전체 선택</b>되니 Ctrl+C 하세요.');
        });
        return;
      }
      var det=document.querySelector('.sqldet'); if(det) det.open = true;
      after.then(function(ok){ openSqlTab(ok); });
      return;
    }
    if(t.id==='auditOpen'){
      var ac = (function(){
        var ta=document.createElement('textarea'); ta.value=AUDIT_SQL;
        ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, AUDIT_SQL.length);
        var o=false; try{ o=document.execCommand('copy'); }catch(e){ o=false; }
        document.body.removeChild(ta); return o;
      })();
      var aref = (window.SYNC ? SYNC.cfg.url.split('//')[1].split('.')[0] : '');
      window.open('https://supabase.com/dashboard/project/' + aref + '/sql/new?content=' + encodeURIComponent(AUDIT_SQL),
                  '_blank', 'noopener');
      setMsg(ac?'wait':'no', ac
        ? '점검 쿼리가 새 탭에 들어갔습니다. <b>Run</b> 을 누르세요. 비어 있으면 <b>Ctrl+V</b> (복사해 뒀습니다).<br>'+
          '<b>익명(anon) 정책이 붙은 표</b> 줄에 <b>bohum_scores, bohum_progress</b> 둘만 있어야 정상입니다.'
        : '새 탭은 열렸지만 자동 복사가 막혔습니다. 탭에 쿼리가 비어 있으면 <code>_audit_names.sql</code> 파일을 여세요.');
      return;
    }
    if(t.id==='stepCheck'){
      setMsg('wait','확인 중…');
      SYNC.check().then(function(ok){
        if(ok){ stepDone(2); setMsg('ok','서버 연결됐습니다. 이제 팀원이 어느 기기에서 응시해도 <a href="#TEAM">팀 현황</a> 에 모입니다.'); }
        else setMsg('no','아직 미연결 — '+esc(SYNC.state.msg)+'<br>①에서 연 탭에서 <b>Run</b> 을 눌렀는지 확인하고 다시 눌러주세요.');
      });
      return;
    }
    if(t.id==='stepPush'){
      setMsg('wait','올리는 중…');
      SYNC.check().then(function(ok){ return ok? SYNC.pushAllLocal(tload()) : -1; })
        .then(function(n){
          if(n<0) setMsg('no','서버에 연결되지 않았습니다 — '+esc(SYNC.state.msg));
          else { stepDone(3); setMsg('ok', n+'건을 서버로 올렸습니다. <a href="#TEAM">팀 현황</a> 에서 확인하세요.'); }
        });
      return;
    }
    if(t.id==='syncpull'){ loadTeam(); return; }
    if(t.id==='syncpush'){
      if(!window.SYNC) return;
      t.textContent='올리는 중…';
      SYNC.check().then(function(ok){ return ok? SYNC.pushAllLocal(tload()) : -1; })
        .then(function(n){
          alert(n<0 ? ('서버에 연결되지 않았습니다.\n' + SYNC.state.msg) : (n+'건을 서버로 올렸습니다.'));
          loadTeam();
        });
      return;
    }
    if(t.id==='tclear'){ if(confirm('이 기기의 테스트 기록을 전부 지웁니다. 되돌릴 수 없습니다.')){ tsave({}); route(); } return; }
    // disease card
    var dzc = t.closest('.dzcard');
    if(dzc){ location.hash = 'DZ-'+dzc.dataset.i; return; }
    // disease category
    if(t.closest('#dznav')){
      var db = t.closest('#dznav button'); if(db) paintDzGrid(db.dataset.c); return;
    }
    // procedure step
    if(t.closest('.proc3d .pn')){
      var pb = t.closest('.proc3d .pn button'); if(!pb) return;
      var box = pb.closest('.proc3d'), k = +pb.dataset.k;
      Array.prototype.forEach.call(box.querySelectorAll('.pn button'), function(b,j){ b.classList.toggle('on', j===k); });
      Array.prototype.forEach.call(box.querySelectorAll('.pf'), function(f,j){ f.classList.toggle('on', j===k); });
      return;
    }
    // Q&A
    var qa = t.closest('.qa .qh');
    if(qa){ qa.parentElement.classList.toggle('open'); return; }
    // analysis nav
    if(t.closest('#adnav')){
      var ab = t.closest('#adnav button'); if(ab) paintAnalysis(+ab.dataset.i); return;
    }
    // design card
    var dc = t.closest('.dcard');
    if(dc){ location.hash = 'DS-'+dc.dataset.i; return; }
    // lesson nav
    if(t.closest('.lsn-nav')){
      var lb = t.closest('.lsn-nav button'); if(lb) paintLesson(+lb.dataset.i); return;
    }
    // term card
    var tc = t.closest('.tcard');
    if(tc){ location.hash = 'T-'+tc.dataset.i; return; }
    // gallery tabs
    if(t.closest('#galtab')){
      var gb = t.closest('#galtab button'); if(gb) paintGal(gb.dataset.g); return;
    }
    // drill answer toggle
    var dli = t.closest('.drill li');
    if(dli){
      dli.classList.toggle('open');
      var tg = dli.querySelector('.tog');
      if(tg) tg.textContent = dli.classList.contains('open') ? '접기 ▴' : '답 보기 ▾';
      return;
    }
    // case selector
    if(t.closest('#csel')){
      var cb = t.closest('#csel button'); if(cb) paintCase(+cb.dataset.i);
      return;
    }
    // db filter
    if(t.matches('#filt button')){
      Array.prototype.forEach.call(v.querySelectorAll('#filt button'), function(b){b.classList.toggle('on', b===t);});
      paintDB(t.dataset.c);
      return;
    }
  });
}
function drawer(on){
  document.getElementById('side').classList.toggle('open', on);
  document.getElementById('scrim').classList.toggle('on', on);
}
document.getElementById('mo').addEventListener('click', function(){
  drawer(!document.getElementById('side').classList.contains('open'));
});
document.getElementById('scrim').addEventListener('click', function(){ drawer(false); });
document.addEventListener('input', function(e){
  if(e.target && e.target.id==='srcq'){ paintSrc(undefined, e.target.value); return; }
  if(e.target && e.target.id==='sgq'){
    var b = document.getElementById('sgbody');
    if(b) b.innerHTML = surgTables(e.target.value);
  }
});
window.addEventListener('hashchange', route);
(function(){
  var qi = document.getElementById('q'), tmr;
  qi.addEventListener('input', function(){
    clearTimeout(tmr);
    tmr = setTimeout(function(){
      LASTQ = qi.value;
      if(LASTQ.trim().length>0){
        if(location.hash==='#SEARCH') document.getElementById('view').innerHTML = renderSearch(LASTQ);
        else location.hash = 'SEARCH';
      }
    }, 220);
  });
  qi.addEventListener('keydown', function(e){ if(e.key==='Escape'){ qi.value=''; history.back(); } });
  var lb = document.getElementById('lb');
  lb.addEventListener('click', function(){ lb.classList.remove('on'); document.getElementById('lbi').src=''; });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') lb.classList.remove('on'); });
})();
buildNav(); bind(); route();
})();
</script>

{t:"갱신형 vs 비갱신형", k:"갱신형 비갱신형 전기납 적용요율 위험율 이자율 사업비율", cat:"설계", lv:"L1",
 one:"갱신형은 주기마다 보험료가 오르고 만기까지 계속 낸다. 비갱신형은 가입 시점 요율로 고정된다.",
 body:"<b>갱신형</b> — 3·5년 주기 갱신, 보험 전 기간 납입, 갱신시점 요율. 가입 시 저렴하나 갱신 시 인상되고 일부 담보는 가입 거절 가능.<br><b>비갱신형</b> — 만기까지 보장(예: 100세), 특정 기간 납입(10·20년), 가입시점 요율. 가입 시 비싸지만 납입 완료 후에도 만기까지 보장.<br><b>적합 대상</b> — 갱신형: 나이가 많거나 보험료 부담이 있는 경우, 향후 위험률 감소 예상, 단기 목적 / 비갱신형: 젊고 부담 없는 경우, 향후 위험률 증가 예상, 장기 목적<br>※ 적용요율 = 보험료 산출 시 반영되는 <b>위험율·이자율·사업비율</b><br><b>핵심 전략</b> — 소득이 끊기는 시점(정년) 전에 납입이 끝나도록 <b>납입기간을 설계</b>한다.",
 img:[], cov:[], cost:[]},

{t:"급여 · 비급여 · 선별급여", k:"급여 비급여 선별급여 본인부담 공단부담 영수증 읽는법", cat:"제도", lv:"L1",
 one:"이것만 알면 절반은 끝난다. 총액이 아니라 <b>내가 내는 돈</b>이 전부다.",
 body:"<b>급여</b> — 건강보험이 인정한 항목. 공단 + 본인(일부) 부담.<br><b>선별급여</b> — 효과는 있으나 본인부담률이 높은 항목(50~90%).<br><b>비급여</b> — 건강보험이 인정하지 않는 항목. <b>전액 본인 부담</b>. 로봇수술, 다초점렌즈, 도수치료, 일부 MRI, 상급병실 차액.<br><b>영수증 읽는 법</b> — ⑥진료비 총액 → ⑦공단부담 총액 → <b>⑧환자부담 총액</b>. 고객에게 보여줄 숫자는 ⑧이다.<br><b>증거</b> — 같은 전립선암 치료인데 세기조절 방사선(급여)은 본인부담 <b>2만 3천원</b>, 중입자(비급여)는 <b>6,000만원</b>.",
 img:[], cov:["실손의료보험"], cost:[7,1,21,27]},

{t:"소득공백", k:"소득공백 실직률 46.4% 복귀율30% 간병파산 돌봄사직 진단비목적", cat:"설계", lv:"L1",
 one:"진단비의 정체는 치료비가 아니라 <b>일을 못 하는 동안의 월급</b>이다.",
 body:"암 진단 후 실직률 <b>46.4%</b>(삼성서울병원 암교육센터)<br>암 경험자 5년 내 직장 복귀율 <b>30%</b>(Psycho-Oncology, Wiley)<br>간병비 일 12~17만원, 월 <b>400~500만원</b>(2023 간병시민연대·전국보건의료산업노조)<br>가족 간병인의 중등도 이상 우울 <b>59.9%</b><br>한국 1인 가구 비중 <b>33.4%</b>(716.5만 가구, 2021)<br><b>진단비 규모 기준선</b> — 근로자는 월 고정지출 × 12~18개월, <b>자영업자는 18~24개월</b>(상병수당·유급병가 없음).",
 img:[], cov:["암진단비","생활비담보","간병인사용일당"], cost:[10]},

{t:"납입면제", k:"납입면제 보험료납입면제 암 2대질환 후유장해", cat:"설계", lv:"L3",
 one:"특정 사유 발생 시 이후 보험료를 회사가 대신 낸다. 사실상 보험금이다.",
 body:"통상 암·2대질환(뇌·심) 진단 또는 일정 이상 후유장해 발생 시 적용된다.<br><b>의미</b> — 진단을 받아 소득이 끊긴 바로 그 시점에 매달 나가는 돈이 사라진다. 20년납 계약에서 5년 차에 면제되면 15년치 보험료가 절약되는 셈.<br><b>실무</b> — 갱신형 담보 비중이 높은 고객일수록 납입면제가 없으면 위험하다. 반드시 검토할 것.",
 img:[], cov:["납입면제"], cost:[]}
,

{t:"관상동맥", k:"관상동맥 coronary LM LAD LCX RCA 좌주간부 좌전하행지 좌회선지 우관상동맥", cat:"심장", lv:"L3",
 one:"심장 근육 자체에 피를 공급하는 3줄기 혈관. 여기가 막히면 심장이 굶는다.",
 body:"심장은 피를 짜내는 펌프지만, <b>그 펌프도 자기가 쓸 피를 따로 받는다.</b> 그 배관이 관상동맥이다. 심장 표면을 왕관처럼 감싸 붙은 이름.<br><b>구조</b> — <b>좌주간부(LM)</b>에서 갈라져 <b>좌전하행지(LAD)</b>가 좌심실 앞면, <b>좌회선지(LCX)</b>가 옆·뒷면을 담당하고, <b>우관상동맥(RCA)</b>이 우심실과 전기전도로에 피를 준다.<br><b>왜 중요한가</b> — 좌주간부가 막히면 좌심실 전체가 위험해 응급도가 가장 높고, 여러 혈관이 동시에 좁아지면 스텐트보다 <b>우회술(CABG)</b>로 간다. 즉 <b>막힌 위치가 처치를 결정하고, 처치가 수술비 담보를 결정한다.</b>",
 img:["ch/ch_004b.jpg"], cov:["허혈성심장질환진단비","종수술비"], cost:[17,29]},

{t:"심근은 재생되지 않는다", k:"심근 괴사 재생 흉터 비가역 심근경색 후유증", cat:"심장", lv:"L3",
 one:"죽은 심장 근육은 다시 자라지 않는다. 그 자리는 흉터가 되고, 흉터는 뛰지 않는다.",
 body:"간은 잘라내도 어느 정도 자라고 뼈는 붙는다. <b>심장 근육은 아니다.</b> 심근경색으로 근육 일부가 죽으면 펌프 힘이 <b>영구적으로</b> 줄고, 남은 근육이 그만큼 더 일해야 한다.<br>그 끝이 <b>심부전</b>이다. 심근경색과 심부전은 별개의 병이 아니라 <b>같은 이야기의 앞뒤</b>다.<br><b>설계 함의</b> — 심장은 '치료하면 낫는 병'이 아니라 <b>'관리하며 사는 병'</b>이다. 일회성·소멸성 진단비로 끝내면 안 되는 근거가 이 한 줄이다.",
 img:[], cov:["심장질환진단비","수술비","입원일당"], cost:[9]},

{t:"불안정형 협심증", k:"불안정협심증 I20.0 급성관상동맥증후군 ACS 쉴때 흉통", cat:"심장", lv:"L3",
 one:"플라크가 터지기 직전 상태. 쉴 때도 아프고 점점 심해진다. 코드 I20.0.",
 body:"안정형 협심증은 좁아진 정도가 일정해 <b>힘쓸 때만</b> 아프고 쉬면 가라앉는다. 불안정형은 다르다. 플라크가 불안정해져 <b>혈전이 만들어지는 중</b>이라 안정 시에도 통증이 오고 빈도·강도가 커진다.<br><b>급성관상동맥증후군</b>으로 묶여 심근경색과 같은 응급 취급을 받는다. 이것이 <b>특정 허혈성 심장질환에 I20.0이 포함되는 이유</b>다.<br><b>주의</b> — 대상 코드 범위는 상품마다 다르다. 반드시 약관 코드표로 확인한다.",
 img:[], cov:["특정허혈성심장질환진단비","허혈성심장질환진단비"], cost:[17]},

{t:"변이형 협심증", k:"변이형협심증 이형협심증 연축 프린츠메탈 I20.1 새벽 흉통 경련", cat:"심장", lv:"L3",
 one:"혈관이 경련하듯 조여져 생기는 협심증. 막힌 게 아니라 조여진 것. 코드 I20.1.",
 body:"동맥경화로 좁아진 게 아니라 관상동맥이 <b>갑자기 수축(연축)</b>해 혈류가 끊긴다. 주로 <b>새벽·안정 시</b>에 발생한다.<br><b>왜 놓치기 쉬운가</b> — 경련이 풀린 상태에서 관상동맥 CT를 찍으면 <b>정상으로 보일 수 있다.</b> 그래서 진단이 늦어지고, 그 사이 경련이 오래 지속되면 급사 위험이 있다.<br>I20.0과 함께 <b>특정 허혈성 심장질환</b>에 들어간다.",
 img:[], cov:["특정허혈성심장질환진단비"], cost:[]},

{t:"관상동맥조영술 (CAG)", k:"관상동맥조영술 CAG 조영술 카테터 심혈관조영 진단 시술관문", cat:"심장", lv:"L3",
 one:"손목·사타구니 동맥으로 관을 넣어 관상동맥을 직접 보는 검사. 진단이자 시술의 관문.",
 body:"심장 검사는 <b>심전도 → 심장초음파 → 운동부하검사 → 관상동맥 CT → 관상동맥조영술</b> 순으로 깊어진다. 조영술은 그 마지막 단계다.<br><b>상담에서 가장 중요한 지점</b> — 조영술로 보다가 막힌 것이 확인되면 <b>그 자리에서 바로 스텐트 시술로 넘어가는 경우가 많다.</b> 고객이 \"검사만 받는 줄 알았는데 시술을 받았다\"고 하는 상황이 여기서 나온다.<br><b>질문 요령</b> — \"심전도만 하셨어요, CT나 조영술까지 하셨어요?\" 심전도만 정상인 것은 관상동맥이 깨끗하다는 뜻이 아니다. 고지의무 파악에도 직결된다.",
 img:[], cov:["종수술비","질병시술비"], cost:[17]},

{t:"심부전 (I50)", k:"심부전 I50 EF 박출률 NYHA 숨참 부종 재입원 만성심부전", cat:"심장", lv:"L3",
 one:"펌프 힘이 떨어져 몸이 필요한 만큼 피를 못 보내는 상태. 여러 심장병의 종착역.",
 body:"별개의 병이 아니라 <b>결승선</b>이다 — 심근경색으로 근육을 잃었거나, 고혈압으로 오래 과부하가 걸렸거나, 판막이 망가졌거나.<br><b>EF(박출률)</b> — 좌심실이 한 번에 짜내는 비율. 정상은 대략 55~70% 수준. 다만 <b>EF가 정상인데도 심부전인 유형</b>이 있다. 짜내는 힘이 아니라 <b>늘어나 받아들이는 능력</b>이 떨어진 경우로, \"수치는 정상인데 왜 숨차죠?\"의 답이 여기 있다.<br><b>NYHA 분류</b> — Ⅰ 일상 지장 없음 / Ⅱ 보통 활동에 숨참 / Ⅲ 조금만 움직여도 숨참 / Ⅳ <b>쉴 때도</b> 숨참.<br><b>담보 관점</b> — 가장 큰 특징은 <b>입원과 퇴원의 반복</b>이다. 한 번 크게 받고 끝나는 진단비형과 가장 안 맞는 병이며, <b>입원일당·반복지급형·간병</b>이 실제로 일한다. 허혈성(I20~I25)에는 포함되지 않는다.",
 img:[], cov:["심장질환진단비","입원일당","간병인사용일당"], cost:[9]},

{t:"심방세동 (I48)", k:"심방세동 부정맥 I47 I48 I49 심인성색전 항응고제 전극도자절제술", cat:"심장", lv:"L3",
 one:"심방이 수축하지 못하고 잘게 떠는 부정맥. 심장에서 생긴 혈전이 뇌를 막는다.",
 body:"심방이 제대로 짜내지 못하면 피가 고이고, 고인 피는 굳는다. 그 덩어리가 떨어져 나가 혈류를 타고 올라가 <b>뇌혈관을 막으면 뇌경색(I63)</b>이다. 이를 <b>심인성 색전</b>이라 한다.<br>즉 <b>부정맥은 심장병이면서 동시에 뇌졸중의 원인</b>이다. 그래서 항응고제를 쓴다.<br><b>치료</b> — 약물 조절, <b>전극도자절제술(RFCA)</b>, 맥이 느린 경우 <b>인공심박동기</b>.<br><b>담보의 큰 구멍</b> — I47~I49 계열은 <b>허혈성 심장질환(I20~I25)에 포함되지 않는다.</b> 허혈성 진단비만 갖고 있으면 부정맥은 0원이다. <b>심장질환(I00~I52)</b> 범위 담보가 있어야 잡힌다.",
 img:[], cov:["심장질환진단비","뇌혈관질환진단비"], cost:[]},

{t:"심장판막질환", k:"판막 승모판 대동맥판 I34 I35 I36 I37 I39 협착 폐쇄부전 TAVI 판막치환", cat:"심장", lv:"L3",
 one:"심장의 문 4개가 좁아지거나(협착) 새는(폐쇄부전) 병.",
 body:"심장은 방 4개 사이에 문(판막)이 4개 있다. 이 문이 제대로 열리지 않거나 닫히지 않으면 피가 역류하거나 밀려나가지 못한다.<br><b>코드</b> — 주로 <b>I34(승모판) · I35(대동맥판) · I36 · I37</b> 계열. I05~I09는 류마티스성, I39는 다른 질환에 동반된 경우다.<br><b>치료</b> — 판막성형 또는 판막치환. 고령에서 흔한 대동맥판막 협착은 예전엔 개흉이 필수였으나 지금은 <b>TAVI</b>로 카테터를 통해 판막을 넣기도 한다. <b>개흉이냐 아니냐에 따라 종수술비 구분이 달라진다.</b><br><b>주의</b> — 허혈성(I20~I25)이 아니다. 허혈성 담보로는 잡히지 않는다.",
 img:[], cov:["심장질환진단비","종수술비"], cost:[]},

{t:"심근병증 (I42)", k:"심근병증 I42 비후성 확장성 급사 심장근육", cat:"심장", lv:"L3",
 one:"관상동맥은 멀쩡한데 심장 근육 자체가 두꺼워지거나 늘어나 기능을 잃는 병.",
 body:"혈관 문제가 아니라 <b>근육 자체의 문제</b>다. 근육이 두꺼워지는 비후성, 늘어나 얇아지는 확장성 등이 있다. 젊은 층 급사의 원인이 되기도 한다.<br><b>담보 관점</b> — 허혈성(I20~I25)이 아니므로 허혈성 진단비로는 지급되지 않는다. <b>심장질환(I00~I52)</b> 범위여야 한다. 진행하면 심부전으로 이어지고, 중증에서는 <b>좌심실보조장치(LVAD)</b>나 심장이식까지 간다.",
 img:[], cov:["심장질환진단비"], cost:[]},

{t:"PCI · 스텐트 삽입술", k:"PCI 경피적관상동맥중재술 스텐트 풍선확장 POBA 재협착 비관혈", cat:"심장", lv:"L3",
 one:"혈관으로 관을 넣어 좁아진 관상동맥을 넓히고 스텐트를 유치하는 시술. 비관혈.",
 body:"유도철사와 카테터를 넣고 → 풍선으로 혈관을 넓힌 뒤 → 스텐트를 남겨 혈류를 회복시킨다. 가슴을 열지 않는 <b>비관혈 시술</b>이다.<br><b>수술비</b> — 실제 사례(치료비DB 17번)에서 <b>종수술비 3종</b>으로 분류됐다. 치료재료(스텐트)가 비급여로 159만원 발생했다.<br><b>끝이 아니다</b> — 스텐트는 막힌 곳을 뚫은 것이지 동맥경화를 고친 게 아니다. <b>재협착</b>이 오거나 다른 혈관이 새로 막힐 수 있어 <b>매회 반복 지급되는 담보</b>가 중요하다.",
 img:["ch/ch_004b.jpg"], cov:["종수술비","질병시술비","허혈성심장질환진단비"], cost:[17]},

{t:"인공심박동기 · 전극도자절제술", k:"인공심박동기 페이스메이커 ICD 제세동기 전극도자절제술 RFCA 부정맥시술", cat:"심장", lv:"L3",
 one:"부정맥을 다루는 두 갈래 처치. 맥이 느리면 심박동기, 빠르면 절제술.",
 body:"<b>인공심박동기</b> — 맥이 지나치게 느릴 때 피부밑에 기기를 넣고 전극선을 심장에 연결해 전기신호를 대신 준다. 치명적 부정맥에는 <b>삽입형 제세동기(ICD)</b>를 쓴다.<br><b>전극도자절제술(RFCA)</b> — 심방세동 등 빈맥성 부정맥에서 카테터로 이상 전기회로 부위를 지져 없앤다. 비관혈 시술.<br><b>수술비 주의</b> — 기기 삽입·시술은 <b>약관상 수술의 정의</b>에 해당하는지 따져야 한다. 절단·절제가 없으면 1-5종에서 면책될 수 있고, 그 자리를 <b>1-7종</b>이 메우는 구조다. 반드시 약관으로 확인한다.",
 img:[], cov:["종수술비","질병시술비"], cost:[]},

{t:"항혈소판제 · 심장 재활", k:"항혈소판제 아스피린 이중항혈소판 DAPT 심장재활 재협착 추적검사 예후", cat:"심장", lv:"L3",
 one:"스텐트 후에도 끝나지 않는다. 약과 추적검사와 재활이 계속된다.",
 body:"<b>항혈소판제</b> — 스텐트 표면에 피가 굳지 않도록 하는 약. 초기에는 두 가지를 함께 쓰고 이후 줄이는데, <b>기간은 스텐트 종류·병변에 따라 다르므로 담당의 판단</b>이다. 자의로 끊으면 스텐트 안에 혈전이 생겨 위험하다.<br>여기에 <b>고지혈증약·혈압약·당뇨약</b>이 대개 함께 간다. 원인인 동맥경화를 계속 눌러야 하기 때문이다.<br><b>심장 재활</b> — 운동 능력 회복과 재발 감소를 목표로 하는 프로그램이 있으나 시행 기관과 적용 범위가 제한적이라 이용 여부는 확인이 필요하다.<br><b>상담 활용</b> — 진단은 한 번이지만 <b>약값·추적검사·재시술·소득 영향은 계속</b>된다. 일회성 진단비로 부족한 실제 근거다.",
 img:[], cov:["치료비담보","수술비","입원일당"], cost:[9,17]}

{t:"편마비", k:"편마비 반신마비 한쪽마비 좌뇌 우뇌 교차 운동신경", cat:"뇌", lv:"L3",
 one:"손상된 뇌의 반대쪽 팔다리에 힘이 빠지는 상태. 뇌졸중 후유증의 대표.",
 body:"운동신경이 뇌간에서 <b>교차</b>하기 때문에 <b>좌뇌가 손상되면 오른쪽</b>이 마비된다. 그리고 대부분 언어중추가 좌뇌에 있어 <b>우측 마비에는 언어장애가 함께 오는 경우가 많다.</b><br><b>생활에서 필요해지는 것</b> — 이동 보조, 옷 입기, 화장실 동행. 편마비만 있으면 보조기구로 어느 정도 대응되지만 <b>실어증·연하장애가 겹치면 사실상 24시간 돌봄</b>이 된다.<br><b>담보</b> — 회복되지 않으면 <b>후유장해</b> 평가 대상이 되고, 재활 기간에는 입원일당·간병이 실제로 일한다.",
 img:[], cov:["후유장해","간병인사용일당","입원일당"], cost:[8]},

{t:"실어증", k:"실어증 브로카 베르니케 운동성실어 감각성실어 언어장애 언어치료", cat:"뇌", lv:"L3",

 body:"<b>운동성(브로카형)</b> — 무슨 말인지는 아는데 <b>말이 안 나온다.</b> 답답함이 크고 우울로 이어지기 쉽다.<br><b>감각성(베르니케형)</b> — 말은 유창하게 나오는데 <b>내용이 맞지 않고 남의 말을 이해하지 못한다.</b> 겉보기에 멀쩡해 보여 주변이 상태를 오해하기 쉽다.<br><b>왜 비용이 되는가</b> — 본인이 의사표현을 못 하므로 <b>병원 동행·설명 대행이 상시 필요</b>해진다. 언어치료가 재활의 주요 항목으로 장기간 들어간다.",
 img:[], cov:["간병인사용일당","입원일당","후유장해"], cost:[]},

{t:"연하장애", k:"연하장애 삼킴장애 흡인성폐렴 콧줄 비위관 위루관 재입원", cat:"뇌", lv:"L3",
 one:"삼키는 근육이 마비돼 음식이 기도로 넘어가는 상태. 재입원의 흔한 원인.",
 body:"뇌졸중 후유증 중 <b>실무적으로 가장 중요한데 교재에서 가장 자주 빠지는</b> 항목이다.<br>삼킴이 안 되면 음식·침이 폐로 들어가 <b>흡인성 폐렴</b>이 생긴다. 그러면 다시 입원한다. 즉 <b>뇌졸중 환자의 입원은 뇌졸중 때문에만 생기지 않는다.</b><br>식사 전 과정에 사람이 붙어야 하고, 심하면 <b>콧줄(비위관)이나 위루관</b>으로 영양을 공급한다.<br><b>설계 함의</b> — 진단비 한 번으로 끝나지 않는 구조의 실체가 이것이다. <b>반복 입원</b>에 대응하는 담보가 필요하다.",
 img:[], cov:["입원일당","간병인사용일당","질병입원"], cost:[8]},

{t:"골든타임 (뇌졸중)", k:"골든타임 혈전제거술 기계적혈전제거 정맥내혈전용해 증상발생시각 119", cat:"뇌", lv:"L3",
 one:"뇌는 혈류가 끊기면 분 단위로 죽는다. 도착 시간이 치료 선택지를 정한다.",
 body:"경색이면 <b>정맥내 혈전용해</b>(약으로 녹임)나 <b>기계적 혈전제거술</b>(카테터로 직접 꺼냄)로 간다. 적용 가능 시간은 <b>환자 상태·영상 소견·병원 사정에 따라 달라지므로 숫자로 단정하지 않는다.</b> 고객에게는 \"빠를수록 선택지가 많아진다\"까지만 말한다.<br><b>기준은 증상이 시작된 시각</b>이다. 자고 일어나 발견한 경우 마지막으로 멀쩡했던 시각으로 본다.<br><b>초기 신호</b> — 한쪽 얼굴 처짐 · 한쪽 팔 힘빠짐 · 말이 어눌해짐. 갑자기 하나라도 생기면 즉시 119. 뇌졸중은 <b>아프지 않은 경우가 많아</b> 참고 기다리다 시간을 놓친다.",
 img:[], cov:["뇌혈관질환진단비","질병수술비"], cost:[]},

{t:"코일색전술 · 클립결찰술", k:"코일색전술 클립결찰 개두술 동맥류 지주막하출혈 재출혈", cat:"뇌", lv:"L3",
 one:"터진(또는 터질) 뇌동맥류를 막는 두 가지 방법. 개두 여부가 갈린다.",
 body:"<b>클립결찰술</b> — 머리를 열고 동맥류 목에 클립을 물려 막는다(관혈).<br><b>코일색전술</b> — 혈관으로 카테터를 넣어 동맥류 안을 코일로 채워 막는다(비관혈).<br>목표는 같다 — <b>재출혈 차단</b>. 지주막하출혈은 재출혈 시 치명률이 크게 올라간다.<br><b>수술비 관점</b> — 개두냐 혈관내 접근이냐에 따라 <b>종수술비 구분이 달라진다.</b> 절단·절제가 없는 시술은 1-5종에서 면책될 수 있어 <b>1-7종이 그 자리를 메우는</b> 전형적인 사례다. 반드시 약관으로 확인한다.",
 img:[], cov:["종수술비","질병수술비","뇌혈관질환진단비"], cost:[]},

{t:"뇌졸중 재활 3단계", k:"재활 급성기 회복기 유지기 재활병원 요양병원 물리치료 작업치료", cat:"뇌", lv:"L3",
 one:"급성기 → 회복기 → 유지기. 회복은 회복기에 가장 크게 일어난다.",
 body:"<b>급성기</b> — 생명 안정화. 가능한 범위에서 조기 재활을 시작한다.<br><b>회복기</b> — 집중 재활. 하루 여러 차례 물리·작업·언어치료가 들어가고 <b>회복의 대부분이 이 구간에 일어난다.</b> 기간이 길고 입원이 동반된다.<br><b>유지기</b> — 회복이 완만해진 뒤 기능을 지키는 단계. 치료보다 <b>돌봄의 영역</b>으로 넘어간다.<br><b>병원을 옮겨 다닌다</b> — 급성기 병원 → 재활병원 → 요양병원·재가. 옮길 때마다 비용 구조와 본인부담이 달라진다.<br>재활 항목은 <b>급여와 비급여가 섞여</b> 있어 실손만으로 메워지지 않는 구간이 생긴다.",
 img:[], cov:["입원일당","간병인사용일당","실손의료비"], cost:[8]},

{t:"후유장해 판정 시점", k:"후유장해 장해분류표 증상고정 판정시점 신경계장해 지급률 분쟁", cat:"뇌", lv:"L3",
 one:"장해는 증상이 고정된 뒤에 판정한다. 발병 직후에 청구하는 게 아니다.",
 body:"뇌졸중은 <b>후유장해 담보가 실제로 지급되는 대표 질환</b>이다. 다만 지급은 약관의 <b>장해분류표</b>를 따르고, 신경계 장해는 <b>일상생활 동작의 제한 정도</b>로 평가한다.<br><b>가장 흔한 분쟁</b> — 장해는 증상이 고정된 뒤 판정하므로 발병 직후에는 확정되지 않는다. 이걸 모르고 청구하면 \"왜 지금 안 나오냐\"가 된다. <b>미리 안내해두면 분쟁이 사라진다.</b><br>지급률·판정 기준은 <b>상품마다 다르다.</b> 숫자를 외워 말하지 말고 해당 약관 장해분류표로 확인한다. 절차는 LEVEL 8 보상 실무 참조.",
 img:[], cov:["후유장해","질병후유장해"], cost:[]},

{t:"편측무시", k:"편측무시 반측공간무시 두정엽 공간지각 안전사고", cat:"뇌", lv:"L3",
 one:"한쪽 공간을 아예 인식하지 못하는 상태. 마비가 아닌데 못 쓴다.",

 talk:{q:"수입이 들쭉날쭉해서요.",a:"그래서 <b>작게 시작</b>하시죠. 지금 감당 확실한 금액으로 담보만 다 열어두고, 수입 좋으실 때 금액을 올리면 됩니다. <b>담보가 없으면 0원이지만 금액이 작으면 나올 사유는 살아 있어요.</b> 나중에 올리는 게 새로 드는 것보다 훨씬 쉽습니다."}},

 must:[
  {n:"[개인] 뇌·심 범위 확대",amt:"I60~I69 / I20~I25",why:"—"},

  {n:"[법인] 영업배상책임",amt:"—",why:"제조·서비스업 필수"}],

 skip:["—"],
 budget:"개인과 법인을 <b>분리</b>해서 산정",

{id:"D19", g:"건강상태", title:"표준체 (건강)", sub:"지금이 가장 좋은 조건",

 must:[{n:"전 담보 정상 인수로 확보",amt:"—",why:"부담보 없이 넣을 수 있는 유일한 시기"},
  {n:"비갱신 100세 만기",amt:"—",why:"요율 고정"}],

{id:"D20", g:"건강상태", title:"경증 유병자", sub:"고혈압 · 고지혈 · 당뇨 복용 중",

 risk:["\"어차피 안 될 것\"이라 지레 포기","시간이 갈수록 조건 악화","뇌·심 전조질환 보유"],
 must:[
  {n:"일반심사 먼저 시도",amt:"—",why:"되면 보험료가 가장 싸다"},
  {n:"뇌혈관 · 허혈성심장 <b>넓은 범위</b>",amt:"I60~I69 / I20~I25",why:"고혈압·당뇨는 전조질환"},
  {n:"실손",amt:"—",why:"현재 진료비가 전부 자비"}],
 opt:["간편심사 3.5.5 병행 검토","질병후유장해(투석·실명 대비)"],
 skip:["—"],
 budget:"할증 감안 · <b>금액은 줄여도 범위는 유지</b>",
 trap:["범위를 좁혀 보험료를 아끼면 정작 협심증·뇌경색에서 0원이 된다","부담보 조건이 붙어도 <b>안 넣는 것보다 낫다</b>"],
 talk:{q:"저 혈압약 먹는데 되나요?",a:"됩니다. 순서만 지키면 돼요. <b>일반심사부터</b> 넣어보고, 안 되면 간편심사를 낮은 단계부터 올라갑니다. 그리고 하나만 말씀드리면, 고혈압은 뇌·심장 <b>전조질환</b>이에요. 그래서 그쪽 담보 범위는 절대 좁히시면 안 됩니다."}},

{id:"D21", g:"건강상태", title:"중증 유병자", sub:"입원 · 수술 이력 있음",

 must:[
  {n:"<b>실손 먼저</b>(유병자 실손)",amt:"—",why:"나이 들수록 가장 먼저 막힌다"},
  {n:"간편심사 단계별 시도",amt:"3.1.5 → 3.3.5 → 3.5.5",why:"낮은 단계부터. 통과되는 것 중 가장 저렴한 것"},
  {n:"상해 담보",amt:"3%형",why:"인수 가능성이 높다"}],
 opt:["암·뇌·심 진단비(간편)","입원일당","질병후유장해"],

 budget:"할증 반영 · <b>낮게 시작해 단계적 증액</b>",
 trap:["<b>간편고지 3대 질문</b>을 정확히 대입해 어느 단계가 가능한지 먼저 판정할 것","수술일·진단일 <b>정확한 날짜</b>를 확인. 며칠 차이로 단계가 갈린다"],
 talk:{q:"저는 보험 안 돼요. 예전에 거절당했어요.",a:"어떤 걸로 넣으셨어요? … 일반심사로 넣으셨네요. 그건 거절될 수밖에 없어요. <b>순서가 있습니다.</b> 간편심사만 해도 단계가 일곱 개예요. 거절당하신 게 아니라 <b>맞는 문을 안 두드리신</b> 겁니다. 세 가지만 여쭤볼게요."}},

{id:"D22", g:"건강상태", title:"가족력 보유", sub:"확률이 아니라 준비 시점의 문제",

 risk:["해당 질병 발병률 상승 (부모 암 시 자녀 1.8~2.9배 / 형제자매 2.0~3.1배)","본인이 발병하면 그때는 가입 불가"],
 must:[
  {n:"해당 질병 담보 <b>두껍게</b>",amt:"일반 기준의 1.5배",why:"가족력 반영"},
  {n:"재발·계속받는암",amt:"—",why:"가족성 암은 재발 위험도 높다"},

  {n:"골절·깁스",amt:"—",why:"낙상"}],

 talk:{q:"이 나이에도 되나요?",a:"됩니다. 다만 <b>되는 것부터</b> 찾아야 해요. 간편심사라고 질문이 세 개로 줄어드는 상품이 있습니다. 지금 되는 걸 확보해 두는 게, 몇 년 뒤엔 그마저도 어려워지거든요."}},

{id:"D28", g:"예산", title:"월 50만원", sub:"간병까지 · 가족 단위 가능",

 {q:"왜 심장 근육은 재생이 안 돼요?",a:"간이나 피부는 재생되는데 심근세포는 거의 재생되지 않습니다. 죽은 자리는 <b>흉터 조직</b>으로 바뀌는데, 흉터는 수축을 못 해요. 그래서 죽은 만큼 심장이 평생 약해집니다. 이게 나중에 <b>심부전</b>이 되는 이유예요."},

 {q:"일은 언제부터 할 수 있어요?",a:"손상이 작으면 몇 주 안에 복귀하시는 분도 있고, 크면 몇 달 걸립니다. 다만 <b>육체적으로 힘든 일</b>은 제한이 생기는 경우가 많아요. 그래서 진단비가 치료비가 아니라 <b>그동안의 생활비</b>라고 말씀드리는 겁니다."},
 {q:"재발하나요?",a:"할 수 있습니다. 뚫은 자리가 다시 좁아지기도 하고, 다른 혈관에 새로 생기기도 해요. 그래서 <b>한 번 받고 끝나는 진단비</b>보다 계속 나오는 수술비·치료비를 같이 두시는 게 좋습니다."},
 {q:"미리 알 방법은 없어요?",a:"완벽하진 않지만 <b>혈압·콜레스테롤·혈당</b> 세 가지를 관리하는 게 가장 확실합니다. 그리고 가족력 있으시면 심장 CT를 한 번 찍어보는 것도 방법이에요. 다만 <b>검사에서 뭔가 나오면 그 뒤로는 보험 가입이 어려워집니다.</b> 순서를 생각하셔야 해요."}],

 {q:"나을 수 있어요?",a:"솔직히 말씀드리면 <b>완치 개념이 아닙니다.</b> 관리하는 병이에요. 약을 잘 드시고 물·소금 조절하시면 오래 안정적으로 지내실 수 있는데, 관리가 흐트러지면 급성으로 나빠져서 입원하게 됩니다."},
 {q:"그럼 입원을 자주 하나요?",a:"네, 그게 이 병의 경제적 실체예요. <b>좋아졌다 나빠졌다를 반복하면서 그때마다 입원</b>합니다. 그래서 심부전은 진단비 한 번보다 <b>입원일당이 실제로 일하는</b> 병이에요. 그것도 180일짜리 말고 365일짜리로요."},
 {q:"보험금 나와요?",a:"담보 이름을 봐야 합니다. <b>심장질환 진단비(I00~I52)</b>가 있으면 나와요. 그런데 <b>허혈성 심장질환 진단비만</b> 있으면 안 나옵니다. 심부전은 I50이라 그 범위 밖이거든요. 이거 모르시는 분들이 정말 많아요."},
 {q:"기계를 넣는다는데 그게 뭐예요?",a:"부정맥이 같이 오면 <b>제세동기</b>를, 심장이 박자가 안 맞으면 <b>재동기화 기기</b>를 넣습니다. 가슴 피부 아래에 넣는 시술인데 보험에서는 인공심박조율기 매입술로 <b>3종 수술</b>에 해당합니다."},
 {q:"심장이식도 하나요?",a:"약이랑 기기로 안 되는 말기에 합니다. 다만 대상이 아주 제한적이에요. 보험으로는 심장 이식수술이 <b>5종</b>으로 가장 높은 등급입니다. 그 전 단계로 좌심실보조장치를 다는 경우도 있고요."},
 {q:"얼마나 사나요?",a:"제가 예후를 말씀드릴 입장은 아니고요, 다만 <b>중증도(NYHA 분류)</b>에 따라 크게 달라집니다. 중요한 건 이 병이 <b>길게 가는 병</b>이라는 거예요. 그래서 간병까지 시야에 넣으셔야 합니다."},
 {q:"부모님이 심부전인데 저도 준비해야 하나요?",a:"직접 유전되는 병이라기보다 <b>원인이 되는 것들(고혈압·심근경색·당뇨)</b>이 가족력을 탑니다. 그리고 지금 어머님을 돌보시게 되면 <b>본인 시간과 비용</b>이 나가요. 그래서 부모님 간병 담보와 본인 담보를 같이 보셔야 합니다."}],

 {q:"증상이 하나도 없었는데요?",a:"그게 이 병의 특징입니다. <b>터지기 전까지 대개 아무 증상이 없어요.</b> 그래서 검진에서 우연히 발견되는 경우가 대부분입니다. 요즘 뇌 MRA 찍는 분이 늘면서 발견이 많아졌어요."},
 {q:"터지면 어떻게 돼요?",a:"<b>지주막하출혈</b>이 됩니다. 극심한 두통이 갑자기 오고 구토하고 목이 뻣뻣해져요. 뇌출혈 중에서도 예후가 좋지 않은 편이라 응급 상황입니다."},
 {q:"수술 안 하고 지켜봐도 돼요?",a:"크기·위치·모양·나이·가족력을 종합해서 의사 선생님이 판단하십니다. 작으면 정기적으로 영상만 보면서 추적하기도 해요. 다만 <b>커지거나 모양이 나쁘면</b> 미리 막습니다."},
 {q:"막는 방법은 뭐가 있어요?",a:"두 가지예요. <b>코일색전술</b>은 사타구니로 관을 넣어서 동맥류 안을 코일로 채웁니다. 머리를 안 열어요. <b>클립결찰술</b>은 머리를 열고 클립으로 목을 물리는 겁니다."},
 {q:"보험에서 나오나요?",a:"여기가 중요합니다. 뇌동맥류는 코드가 <b>I67.1</b>이에요. <b>뇌혈관질환(I60~I69)</b> 담보면 나옵니다. 그런데 많은 분들이 갖고 계신 <b>뇌졸중 진단비는 I67이 빠져 있어서</b> 안 나와요."},
 {q:"그럼 지금 그 담보를 넣으면 되나요?",a:"안타깝지만 <b>이미 발견되신 뒤에는 어렵습니다.</b> 고지 대상이라 뇌 관련 담보에 부담보가 붙거나 인수가 거절될 수 있어요. 그래서 이 병이 \"건강할 때 넓은 담보를 잡아두라\"는 말의 가장 좋은 예입니다."},
 {q:"가족 중에 있으면 저도 검사해야 하나요?",a:"가족력이 있으면 발병 위험이 <b>1.8배</b>로 올라갑니다. 검사 여부는 의사 선생님과 상의하셔야 하는데요, <b>보험 관점에서만</b> 말씀드리면 검사 전에 담보를 확인해 두시는 게 순서상 맞습니다."},
 {q:"시술하면 완전히 끝나요?",a:"대부분 안정적이지만 <b>재개통되거나 새로 생기는</b> 경우가 있어서 정기적으로 영상을 봅니다. 그래서 추적 검사 비용이 계속 나가요."},
 {q:"여자가 더 많다면서요?",a:"네, 여성이 <b>1.6배</b> 많습니다. 그리고 심장질환이 있으면 2배, 고혈압이 있으면 1.5배예요. 여성이면서 고혈압이 있으시면 한 번 확인해 보실 만합니다."}],
talk:{k:"검진 발견 전에",q:"저는 검진 잘 받으니까 괜찮아요.",
 a:"검진을 잘 받으시는 건 정말 좋은 습관입니다. 다만 순서를 하나만 말씀드릴게요.<br>요즘 뇌 MRA에서 <b>뇌동맥류</b>가 발견되는 분이 늘었어요. 국내에 10만명당 52.2명입니다. 그런데 <b>발견되는 순간부터는 뇌 관련 담보 가입이 어려워집니다.</b><br>그래서 검진에서 뭐가 나오기 <b>전에</b> 담보를 잡아두시는 게 맞습니다. 지금이 조건이 제일 좋은 때예요."}
},

qna:[
 {q:"후유증이 남는다는 게 어느 정도예요?",a:"뇌는 부위마다 담당이 달라서요. 운동영역이 손상되면 <b>반대쪽 팔다리가 마비</b>되고, 언어영역이면 <b>말이 안 나오거나 이해가 안 되고</b>, 삼킴 관련이면 <b>음식을 못 삼킵니다.</b>"},
 {q:"삼키기 어려운 게 왜 위험해요?",a:"음식이 식도가 아니라 <b>기도로 넘어가서</b> 폐렴이 생깁니다. 흡인성 폐렴이라고 하는데 반복되면 아주 위험해요. 그래서 콧줄이나 위루관을 하시는 경우도 있습니다."},
 {q:"재활하면 원래대로 돌아오나요?",a:"<b>죽은 뇌세포는 돌아오지 않습니다.</b> 다만 다른 부위가 기능을 나눠 맡는 경우가 있어서 재활로 상당히 회복되시는 분도 많아요. 빨리 시작할수록 좋습니다."},
 {q:"재활은 얼마나 오래 해요?",a:"몇 달에서 몇 년입니다. 이게 이 병의 <b>진짜 비용</b>이에요. 급성기 치료는 며칠이고 산정특례도 30일뿐인데, 재활과 간병은 그 뒤로 계속 갑니다."},
 {q:"간병인은 꼭 써야 하나요?",a:"스스로 일상생활이 어려우면 필요합니다. 가족이 하실 수도 있는데, <b>가족 간병인의 59.9%가 중등도 이상 우울</b>을 겪는다는 조사가 있어요. 그리고 일을 그만두시면 가구 소득이 이중으로 줍니다."},
 {q:"간병비가 얼마예요?",a:"2023년 기준 일 <b>12~17만원</b>, 월 <b>400~500만원</b>입니다. 실제 치매 환자 기록을 보면 입원이 212일, 403일, 2일 해서 <b>617일</b>인 경우도 있었어요."},
 {q:"나라에서 도와주는 건 없어요?",a:"<b>장기요양등급</b>이 있습니다. 등급을 받으면 재가급여나 시설급여를 쓸 수 있어요. 2022년 기준 판정받으신 분 중 <b>87.8%</b>가 인정됐습니다. 신청해 보실 만합니다."},
 {q:"보험금은 나오나요?",a:"담보 이름을 봐야 해요. 후유증은 코드가 <b>I69</b>인데, <b>뇌혈관질환(I60~I69)</b> 담보여야 들어갑니다. 뇌출혈이나 뇌졸중 담보에는 I69가 <b>빠져 있어요.</b>"},
 {q:"후유장해 보험금은 어떻게 받아요?",a:"<b>후유장해 진단서</b>가 필요합니다. 장해지급률이라는 퍼센트가 나오고 거기에 가입금액을 곱해요. 다만 주치의 선생님이 발급을 꺼리시는 경우가 있어서, 그럴 땐 손해사정사나 변호사를 통하는 경로가 있습니다."},
 {q:"청구 기한이 지났으면 못 받나요?",a:"후유장해는 좀 다릅니다. 보통 보험금 청구는 3년인데, <b>후유장해는 진단서 발급 시점이 기산점</b>이에요. 그래서 사고가 3년 넘었어도 아직 후유장해 진단서를 안 받으셨다면 청구 가능합니다."}],
talk:{k:"간병이 진짜 비용",q:"뇌졸중은 진단비 있으면 되죠?",
 a:"진단비는 <b>시작</b>일 뿐이에요. 이 병의 진짜 비용은 그 뒤에 있습니다.<br>급성기 치료는 며칠이고 산정특례도 <b>30일</b>뿐이에요. 그런데 재활은 몇 달에서 몇 년이고, 스스로 못 움직이시면 <b>간병인이 필요합니다.</b> 월 400~500만원이에요.<br>그리고 후유증은 코드가 <b>I69</b>인데 뇌졸중 담보에는 이게 빠져 있습니다. 뇌혈관질환으로 넓히고, <b>간병일당 365일형</b>을 같이 두셔야 이 병이 커버됩니다."}

 {q:"중입자 치료는 되나요?",a:"폐암도 대상입니다. 다만 비용이 <b>약 5천만원</b>이고 검사·체재비까지 하면 평균 1억이에요. 실제 중입자 영수증에서 총액 6,005만원 중 공단 부담이 <b>5만원</b>이었습니다. 나머지는 전부 본인부담이었어요."},

 a:"그게 요즘 바뀐 부분이에요. 표적항암제 맞으신 영수증을 보면 <b>외래인데 407만원</b>이 나왔습니다. 약품비만 405만원이 비급여였고요.<br>요즘은 입원 안 하고 <b>외래로 다니면서</b> 항암을 받으세요. 그래서 <b>암직접치료 통원비</b> 담보가 없으면 큰 구멍이 생깁니다."}

 why:'통지의무 위반 시에는 <b>삭감 지급</b> 또는 해지다. 해지되더라도 변경된 직업 · 직무와 관계없이 발생한 사유는 지급된다.', ref:'#L8'},

{t:'multi', q:'고지의무 위반으로 보험사가 계약을 해지할 수 <b>없게</b> 되는 경우는? (복수)',
 c:['회사가 그 사실을 안 날로부터 1개월이 지난 때','보험계약자의 책임개시일 이후 2년이 지난 때(진단계약은 1년)','최초 계약일로부터 3년이 지난 때','보험료를 3회 이상 납입한 때'],
 a:[0,1,2],
 why:'제척기간 세 가지다. 특히 <b>고지의무 위반이라도 2년 이내에 그 보험과 관련한 병원 기록이 없으면 해지할 수 없고, 3년이 지나면 상법상 해지가 불가</b>하다. 납입 횟수는 기준이 아니다.', ref:'#L8'},

{t:'choice', q:'대리 진단 · 진단서 위변조 등 <b>사기 계약</b>은 몇 년 이내에 취소할 수 있나?',
 c:['1년','2년','3년','5년'], a:3,
 why:'무진단계약 2년 · 상법 3년과 달리, 사기 계약은 <b>민법 · 형법</b>이 적용되어 <b>5년</b> 이내 취소가 가능하다.', ref:'#L8'},

{t:'blank', q:'첫 번째 보험료를 납입한 시점을 보험회사의 <b>____개시일</b>로 보고 보험계약의 효력이 발생한다.',
 a:['책임','책임개시'],
 why:'보장기간의 시작점은 청약일이 아니라 <b>책임개시일</b>이다. 면책 · 감액 기간도 여기서부터 센다.', ref:'#L8'},

{t:'choice', q:'면책기간과 감액기간의 차이로 옳은 것은?',
 c:['면책은 일부만 지급, 감액은 전혀 지급 안 함','면책은 <b>책임을 지지 않는</b> 기간, 감액은 <b>비율에 따라 일부만</b> 지급하는 기간','둘 다 같은 말이다','면책은 보험료를 안 내는 기간이다'], a:1,
 why:'면책 = 그 기간에 발생한 사고 · 진단에 대해 <b>책임을 지지 않음</b>. 감액 = 약정 금액 중 <b>비율에 따라 일부만</b> 지급.', ref:'#L8'},

{t:'blank', q:'일반암은 보통 가입 후 ____일이 지난날부터 보장되고, 그 뒤 <b>1년</b>까지는 ____%만 지급되는 경우가 많다.',
 a:['90 50','90,50','91 50'],
 why:'통상 <b>90일 면책</b> → 가입 91일 이후부터 보장, 1년까지 <b>50% 감액</b>, 1년 이후 100%. 소액암 · 유사암은 감액 조건이 다르다. <b>상품마다 다르므로 약관이 우선</b>이다.', ref:'#L8'},

{t:'choice', q:'치아보험의 <b>보철</b>(크라운 · 브릿지 · 틀니) 치료는 통상 어떤 구조인가?',
 c:['면책 없음 · 감액 없음','90일 면책 후 바로 100%','90일 면책 + 이후 2년까지 50% 감액','1년 면책 후 100%'], a:2,
 why:'보존치료(충치 · 레진)는 면책이 짧고 감액도 1년 수준이지만, <b>보철은 90일 면책 + 2년까지 50% 감액</b>인 경우가 많다. "이가 아파서 왔어요"는 이미 늦다.', ref:'#L7'},

{t:'short', q:'고객이 "예전에 병원 다닌 걸 굳이 다 써야 하나요? 대충 쓰면 안 돼요?"라고 물었다. 뭐라고 답할 것인가?',
 model:'사실대로 쓰셔야 합니다. 축소해서 쓰면 나중에 고지의무 위반으로 <b>계약이 해지되고 보험금도 못 받습니다</b>. 지금 사실대로 쓰면 부담보(그 부위만 빼고 인수)나 할증으로라도 <b>나머지는 전부 보장</b>받으실 수 있어요. 빠지는 것보다 안 빠지는 게 훨씬 많습니다.',
 key:['사실대로','해지','부담보'],
 why:'설계사가 병력 축소 고지를 안내하는 것은 <b>절대 금지</b>다. 사실대로 고지하고 부담보 · 할증으로 인수하는 편이 고객에게 유리하다.', ref:'#L8'},

{t:'short', q:'가입 3년이 지난 고객이 고지하지 않은 병력 때문에 불안해한다. 설명해야 할 핵심 두 가지는?',
 model:'① 최초 계약일로부터 <b>3년이 지나면 상법상 해지가 불가</b>합니다. ② 다만 <b>대리진단 · 진단서 위변조 같은 사기 계약</b>은 5년 이내 취소될 수 있습니다. 또 2년 이내에 그 보험과 관련한 병원 기록이 없으면 해지할 수 없습니다.',
 key:['3년','해지','사기'],
 why:'제척기간을 정확히 아는 것이 고객 불안을 다루는 기술이다. 다만 <b>고의로 숨기라는 안내는 절대 금지</b>다.', ref:'#L8'},

{t:'blank', q:'통지의무는 변경 사실을 안 날부터 ____개월 안에 알려야 한다.',
 a:['1','일','한'],
 why:'직업 · 직무 · 운전 관련 변경은 <b>안 날부터 1개월</b>. 실무에서는 이직 · 승진 · 배달 부업 시작 등을 점검 때 반드시 묻는다.', ref:'#L8'}
]},

{t:'blank', q:'2015년 3월 11일 이후 계약의 보험금 청구권 소멸시효는 ____년이다. (근거: 상법 662조)',
 a:['3','삼'],
 why:'2015.3.10 이전은 2년, <b>2015.3.11 이후는 3년</b>. 그리고 <b>이전 계약도 3년 소급 적용</b>된다.', ref:'#L8'},

{t:'multi', q:'소멸시효 <b>기산점</b>(세기 시작하는 날)이 맞게 짝지어진 것은? (복수)',
 c:['질병 — 진단을 받은 날(의사 확진 판정 날짜)','교통사고 — 사고가 발생한 당일','후유장해 — 사고가 발생한 당일','후유장해 — 장해에 대한 의사의 확진이 내려진 날'],
 a:[0,1,3],
 why:'<b>후유장해만 예외</b>다. 사고일이 아니라 <b>후유장해 진단서 발급 시점</b>이 기산점이다. → 3년이 지난 사고라도 아직 진단서를 받지 않았다면 청구할 수 있다.', ref:'#L8'},

{t:'choice', q:'이미 <b>해지한</b> 보험에 대해 가입 기간 중 발생한 사고의 보험금 청구는?',
 c:['해지했으므로 불가능하다','가입 기간 중 발생한 사고라면 <b>청구 가능</b>하다','해지 후 1년 안에만 가능하다','보험료를 다시 내야 가능하다'], a:1,
 why:'해지 여부와 무관하게 <b>보험가입 기간 중에 발생한 사고</b>면 청구 가능하다. 신규 고객에게 "예전에 해지한 보험 있으세요?"를 반드시 물어야 하는 이유다.', ref:'#L8'},

{t:'multi', q:'보험사가 요청해도 <b>절대 서명하면 안 되는</b> 서류는? (복수)',
 c:['면책동의서','개인정보제공활용동의서','부제소합의서','의료자문동의서','의무기록열람동의서'],
 a:[0,2,3],
 why:'<b>면책동의서</b>(지급되지 않는다는 데 동의) · <b>부제소합의서</b>(민·형사 소송 안 하겠다) · <b>의료자문동의서</b>(보험사 고용 의료진 판단에 맡김)는 서명 금지. 개인정보 · 의무기록열람 동의서는 <b>용도를 확인하고 병원 열람만 허용</b>해 서명한다. <b>백지 서류는 절대 금지</b>.', ref:'#L8'},

{t:'multi', q:'보험사가 <b>현장조사</b>를 진행하는 이유는? (복수)',
 c:['보험 가입 후 3년 이내인 경우 고지의무 위반 확인','고액 보험금인 경우 면책 사유가 있는지 확인','사고 내용이 불명확하거나 재해사고의 내용 파악','후유장해 보험금 지급을 위한 후유장해 평가','설계사의 실적을 확인하기 위해'],
 a:[0,1,2,3],
 why:'현장조사는 네 가지 목적이다. 조사가 나왔다는 것 자체가 부지급을 뜻하지는 않지만, <b>서명 요구 서류를 그 자리에서 읽어야 한다</b>.', ref:'#L8'},

{t:'blank', q:'의료자문이란 보험회사가 보험금 지급 여부 결정을 위하여 의료법 제____조에 따른 의료기관 소속 전문가에게 <b>의학적 소견</b>을 구하는 행위다.',
 a:['3','삼'],
 why:'의료법 <b>제3조</b>. 의료자문은 <b>동의 사항</b>이지 의무가 아니다. 부동의할 수 있다.', ref:'#L8'},

{t:'multi', q:'보험사가 의료자문을 실시할 때 계약자에게 <b>설명해야 하는</b> 사항은? (보험협회 표준내부통제기준 제12조 · 복수)',
 c:['의료자문 의뢰 사유','의료자문 의뢰 내용','의료자문을 의뢰할 때 제공하는 자료의 내용','자문의사의 실명과 연락처'],
 a:[0,1,2],
 why:'제12조 설명의무 3가지다. <b>서면(설명서)</b>으로 제공하고 계약자가 이해했음을 서명 등으로 확인받아야 한다. 자문의 실명 공개는 의무가 아니다.', ref:'#L8'},

{t:'choice', q:'주치의 소견과 보험사 자문의 소견이 다를 때 취할 수 있는 조치는?',
 c:['보험사 자문의 소견을 따라야 한다','<b>제3의료기관</b>을 선정해 동시감정을 실시한다','무조건 소송한다','보험금을 포기한다'], a:1,
 why:'제3의료기관 <b>동시감정</b>을 요구할 수 있다. 이때 보험사의 <b>직전 1년 의료자문 병원 리스트</b>를 요청해 그 리스트에 없는 기관에서 실시하는 것이 중요하다(표준내부통제기준 제22조).', ref:'#L8'},

{t:'multi', q:'자동차부상치료비(운전자보험) 청구 시 <b>대인 처리를 한</b> 경우 필요한 서류는? (복수)',
 c:['보험금청구서','지급결의서(대인 담당자에게 요청)','신분증 사본','초진기록지'],
 a:[0,1,2],
 why:'대인 처리한 경우는 <b>청구서 + 지급결의서 + 신분증 사본</b>. 대인 처리를 <b>하지 않은</b> 경우에는 여기에 <b>초진기록지</b>가 추가된다. 서류에 <b>상해급수</b>가 적혀 있으면 별도 진단서 없이 청구된다.', ref:'#L7'},

{t:'short', q:'신규 고객을 처음 만났을 때 <b>보상 관점에서 반드시 물어야 할 질문</b> 하나와 그 이유를 쓰시오.',
 model:'"지난 <b>3년</b> 안에 병원에 입원하시거나 수술하신 적, 크게 다치신 적 있으세요?" — 청구권 소멸시효가 3년이라 <b>아직 청구할 수 있는 보험금이 남아 있을 수 있다</b>. 이미 낸 보험료로 받을 돈을 찾아주는 것이 가장 빠르게 신뢰를 얻는 방법이고, 실제로 <b>수술비 · 입원일당 · 골절진단비</b>가 가장 자주 나온다. 해지한 보험도 가입 기간 중 사고면 청구 가능하다.',
 key:['3년','소멸시효','수술비'],
 why:'첫 만남에서 파는 대신 <b>찾아주는 것</b>으로 시작하면 관계의 성격이 달라진다.', ref:'#L8'},

{t:'short', q:'고객이 "보험사에서 서류에 사인하라고 하는데 해도 되냐"고 전화가 왔다. 어떤 순서로 확인시킬 것인가?',
 model:'① <b>서류 이름을 그대로 읽어달라고</b> 한다. ② 면책동의서 · 부제소합의서 · 의료자문동의서면 <b>지금 사인하지 마시라</b>고 한다. ③ 개인정보 · 의무기록열람동의서면 <b>용도와 열람 범위(기간 · 병원)를 특정</b>해서 사인하시라고 한다. ④ <b>백지 서류는 절대 금지</b>. ⑤ 왜 필요한지 · 비용은 누가 내는지를 <b>서면으로</b> 받으시라고 안내한다.',
 key:['서류 이름','백지','서면'],
 why:'설계사가 대신 판단하지 않는다. <b>절차가 있다는 것을 알려주는 자리</b>다.', ref:'#L8'},

{t:'blank', q:'후유장해 보험금을 청구하려면 <b>____진단서</b>가 반드시 필요하며, 이 서류의 <b>발급 시점</b>이 소멸시효 기산점이 된다.',
 a:['후유장해','장해'],
 why:'주치의가 발급을 꺼리는 경우가 있어 손해사정사 · 변호사와 연계된 자문 의료진을 통하는 경로가 쓰이기도 한다.', ref:'#L6'}
]},

{t:'choice', q:'2022년 6월 대법원 판결에 따라 백내장 수술은 어떻게 보상되나?',

 c:['연령이 50세 이상일 것','전립선 용적이 100cc 미만일 것','IPSS(국제전립선증상점수)가 8점 이상일 것','외측엽(lateral lobe) 환자 중 기존의 내시경 수술을 원하지 않는 환자일 것','가족력이 있을 것'],

{t:'choice', q:'발달지연의 정의로 옳은 것은?',

{t:'short', q:'네 가지 보상기준 쟁점(백내장 · 전립선비대증 · 무릎줄기세포 · 발달지연)의 <b>공통 교훈</b>을 한 문장으로 쓰시오.',

{t:'short', q:'고객이 "무릎에 줄기세포 주사 맞으려는데 실비 되죠?"라고 물었다. 어떻게 답할 것인가?',

 key:['가입 시점','특약','치료받기 전'],

{t:'blank', q:'2022년 민원의 <b>3분의 1</b>이 ____ 수술 건이었다.',

{t:'short', q:'고객이 "수술했는데 왜 보험금이 안 나와요?"라고 항의한다. 무엇부터 확인할 것인가?',

{t:'choice', q:'순환계질환치료비가 <b>진단비와 성격이 다른</b> 가장 큰 이유는?',
 c:['보험료가 싸서','순환계질환은 <b>평생 반복 치료</b>가 이어지는데 진단비는 맨 앞 한 번만 나오기 때문','가입이 쉬워서','실손과 중복되어서'], a:1,
 why:'스텐트 재협착 → 재시술, 심방세동 → 전극도자절제술 재시술, 심부전 → 반복 입원. 목돈형이 아니라 <b>반복 지급형</b>이 맞는 성격이다.', ref:'#L4'},

{t:'multi', q:'순환계질환치료비 증권에서 <b>반드시 확인</b>해야 할 것은? (복수)',
 c:['담보명 옆 코드 범위 (I00~I99 인지 좁은지)','급여 · 비급여 구분','연간 한도 · 횟수','갱신 여부','설계사 이름'],
 a:[0,1,2,3],
 why:'담보명이 같아도 이 넷이 다르면 <b>완전히 다른 담보</b>다. 특히 갱신형이 많아 고령에 보험료가 오른다.', ref:'#ANALYSIS'},

{t:'blank', q:'암 주요치료비의 대상이 되는 일반암 질병분류기호는 <b>____ ~ ____</b> 이다.',
 a:['C00 C97','C00~C97'],
 why:'일반암 <b>C00~C97</b> / 제자리암 D00~D09 / 경계성종양 D37~D48 / 전이(이차성) C77~C79.', ref:'#L4'},

{t:'multi', q:'통상 <b>유사암</b>으로 분류되어 감액 지급되거나 별도 담보인 것은? (복수)',
 c:['갑상선암 C73','기타피부암 C44','제자리암 D00~D09','경계성종양 D37~D48','위암 C16'],
 a:[0,1,2,3],
 why:'유사암은 보통 <b>10~20%만</b> 지급된다. 위암 C16은 일반암이다.', ref:'#L3'},

{t:'choice', q:'암 주요치료비의 보장 기간으로 가장 일반적인 것은?',
 c:['진단 후 1년','진단 후 3년','<b>진단 후 5년</b>','종신'], a:2,
 why:'5년이 비용이 가장 집중되는 구간이다. 5년 이후는 <b>재발암 진단비 + 종수술비</b>가 메운다.', ref:'#L4'},

{t:'choice', q:'비급여 암주요치료비(하이클래스형)가 <b>따로 필요한</b> 가장 근본적인 이유는?',
 c:['보험료가 싸서','<b>산정특례가 급여에만 적용</b>되어 비급여를 고르는 순간 무력화되기 때문','실손이 없어서','회사가 권해서'], a:1,
 why:'갑상선암 로봇수술 본인부담 <b>1,586만원</b>(비급여 처치·수술료 1,434만). 암이어도 비급여 술식이면 5% 경감이 사라진다.', ref:'#L4'},

{t:'multi', q:'비급여 암주요치료비의 <b>대상이 될 수 있는</b> 치료는? (복수)',
 c:['급여 조건을 벗어난 표적 · 면역항암제','양성자 · 중입자 치료','로봇수술 등 비급여 술식','급여 기본 수술료'],
 a:[0,1,2],
 why:'다만 <b>대상 치료의 정의가 상품마다 다르다</b>. 「신의료기술평가를 통과한 것에 한함」 같은 조건이 붙기도 한다.', ref:'#L4'},

{t:'short', q:'고객이 "실비 있으면 비급여도 다 되는 거 아니에요?"라고 물었다. 어떻게 답할 것인가?',
 model:'실손은 <b>이미 쓴 돈의 일부를 나중에 돌려주는</b> 겁니다. 세 가지가 걸려요. ① 4세대는 비급여 <b>자기부담 30%</b>에 공제까지 있고 ② 비급여를 많이 쓰면 <b>다음 해 보험료가 최대 3배</b>까지 오르고 ③ 무엇보다 <b>사후 정산</b>이라 지금 중입자 1억을 결정할 목돈이 되지 못합니다. 그래서 <b>정액으로 먼저 나오는</b> 비급여 치료비 담보를 따로 두는 겁니다.',
 key:['사후 정산','자기부담','정액'],
 why:'실손은 <b>회수</b>, 주요치료비는 <b>치료를 고를 자유</b>. 성격이 다르므로 서로를 대체하지 못한다.', ref:'#L4'},

{t:'short', q:'증권에 「급성심근경색진단비 3,000만원」만 있는 40대 고객이다. 순환계질환치료비를 왜 권하는지 설명하시오.',
 model:'급성심근경색은 <b>I21~I23</b>입니다. 협심증(I20)부터가 이미 빠져요. 게다가 고혈압 I10, 부정맥 I44~I49, 심부전 I50, 대동맥류 I71, 하지정맥류 I83 — 실제로 병원에 자주 가게 되는 코드들이 <b>전부 범위 밖</b>입니다. 그리고 심장 · 혈관은 한 번 시작되면 <b>평생 반복</b>되는데 진단비는 맨 앞 한 번만 나옵니다. 지금 있는 3,000만원을 없애자는 게 아니라 <b>그 뒤를 받치는 담보</b>를 얹자는 겁니다.',
 key:['I21','협심증','반복','얹'],
 why:'기존 계약을 부정하지 않고 <b>얹는</b> 방식이 승환 위험도 피하고 고객도 받아들인다.', ref:'#L4'},

{t:'short', q:'"하이클래스 넣으면 표적항암제 다 나오죠?"라는 질문에 어떻게 답해야 하나?',
 model:'"다 나온다"고 말씀드릴 수 없습니다. ① <b>이름은 회사마다 다르고</b> ② <b>대상 치료의 정의</b>가 상품마다 달라요. 「신의료기술평가를 통과한 것에 한함」 같은 조건이 붙기도 하고 ③ <b>한도 · 횟수 · 5년 제한</b>도 다릅니다. 고객님 계약 기준으로 <b>약관을 확인해서</b> 알려드리겠습니다.',
 key:['회사마다','약관','한도'],
 why:'단정하면 <b>불완전판매</b>다. 특정 상품명을 단정해서 말하지 않는 것이 원칙이다.', ref:'#L4'}
]},

/* ══════════ 설계 ① ══════════ */
{id:'D1', cat:'설계', n:'설계 ① 원칙 · 우선순위 · 예산', sub:'무엇부터 채우고 무엇부터 자르는가', mins:12, q:[

{t:'choice', q:'보장분석의 <b>목적</b>으로 가장 옳은 것은?',
 c:['고객 보장의 부족함을 증명하는 것','<b>우선순위를 합의</b>하는 것','가능한 많은 담보를 넣는 것','기존 계약을 해지시키는 것'], a:1,
 why:'"다 채우자"고 하면 아무것도 못 채운다. 분석은 <b>무엇부터</b>를 함께 정하는 과정이다.', ref:'#ANALYSIS'},

{t:'multi', q:'예산이 부족할 때 <b>자르는 순서</b>가 맞게 배열된 것은? (해당하는 원칙 모두)',
 c:['① 담보를 빼기 전에 가입금액을 먼저 줄인다','② 그다음 보장기간을 줄인다(100세→80세, 종신→정기)','③ 치아 · 저축성 · 부가특약을 마지막에 자른다','④ 실손 · 암 · 뇌 · 심 진단비 · 수술비는 절대 자르지 않는다'],
 a:[0,1,2,3],
 why:'핵심은 <b>담보를 빼지 말고 한도를 낮춘다</b>는 것. 빠진 담보는 나중에 병력이 생기면 <b>다시 못 넣는다</b>. 지금 지킬 수 있는 계약이 완벽한 실효 계약보다 낫다.', ref:'#L10'},

{t:'blank', q:'보장성과 저축성의 비율은 대략 ____ : ____ 를 기준선으로 본다.',
 a:['7 3','7,3','7:3','70 30'],
 why:'보장이 안 끝났는데 저축부터 하지 않는다. 다만 절대 기준이 아니라 부채 · 부양가족 · 기존 자산에 따라 조정한다.', ref:'#ANALYSIS'},

{t:'blank', q:'가구 소득 대비 총 보험료는 대략 ____ ~ ____ % 선을 기준으로 본다.',
 a:['8 12','8,12','8~12'],
 why:'이보다 높으면 <b>유지가 안 되고</b>, 낮으면 필요 담보가 빠져 있을 가능성이 크다. 유지 못 하는 설계는 설계가 아니다.', ref:'#ANALYSIS'},

{t:'choice', q:'담보 지도(○△×)를 쓰는 이유로 가장 옳은 것은?',
 c:['보기에 좋아서','말로 설명하는 대신 <b>빈칸을 눈에 보이게</b> 만들기 위해','상품을 많이 팔기 위해','회사 규정이라서'], a:1,
 why:'"부족합니다"는 주장이지만 표는 사실이다. 축마다 <b>판정선</b>이 정해져 있어야 하며, 감으로 ○를 주지 않는다.', ref:'#ANALYSIS'},

{t:'short', q:'진단비 필요액을 계산하는 공식을 쓰고, 월 소득 300만원 · 준비 치료비 2,000만원인 고객의 예시를 계산하시오.',
 model:'<b>진단비 = 치료비 목돈 + 소득공백 12~24개월분</b>. 월 300만 × 18개월 = 5,400만 + 2,000만 = <b>약 7,400만원</b>.',
 key:['소득공백','치료비'],
 why:'계산 결과를 그대로 팔지 않는다. 필요액은 <b>목표</b>이고 제안은 <b>지금 지킬 수 있는 것</b>이다. 둘을 나란히 보여준다.', ref:'#ANALYSIS'},

{t:'choice', q:'제안서를 만들 때 <b>첫 장에 와야 할 것</b>은?',
 c:['제안하는 신상품','보험료 비교표','<b>고객의 지금 상태</b> — 기존 계약을 그대로 그리고 좋은 것부터 말한다','치료비 사례'], a:2,
 why:'①을 건너뛰고 제안부터 시작하면 「팔러 왔구나」가 된다. <b>기존 계약을 먼저 인정하는 것</b>이 제안을 듣게 만드는 유일한 방법이다.', ref:'#L10'},

{t:'multi', q:'20대 고객 설계에서 <b>상대적으로 비중을 높여야</b> 하는 담보는? (복수)',
 c:['상해 · 운전자','실손','간병 · 치매','저축 · 연금 위주'],
 a:[0,1],
 why:'20대는 <b>상해 · 운전자</b>가 크고, 60대는 <b>간병 · 치매</b>가 커진다. 암 · 뇌 · 심은 40대에 정점. 다만 기준선일 뿐 직업 · 가족력 · 기존계약으로 조정한다.', ref:'#L10'},

{t:'choice', q:'월 예산 20만원 고객에게 30만원짜리 「완벽한」 설계를 제안하는 것은 왜 문제인가?',
 c:['보험료가 아까워서','<b>유지되지 않아 실효되면 그때까지 낸 돈과 보장이 모두 사라지기 때문</b>','회사 실적에 안 좋아서','고객이 화를 내서'], a:1,
 why:'실효된 100점 설계보다 <b>유지되는 70점 설계</b>가 낫다. 예산은 제약이 아니라 설계 조건이다.', ref:'#DESIGN'},

{t:'short', q:'고객이 "지금 있는 보험 다 해지하고 새로 하면 안 될까요?"라고 물었다. 어떻게 답하고 무엇을 조심할 것인가?',
 model:'"먼저 지금 계약부터 보겠습니다. 해지가 답인 경우는 생각보다 드물어요." — 특히 <b>구실손 · 완납된 계약 · 예전 조건이 좋은 계약</b>은 해지하면 고객 손해가 명백하다. 부족한 부분은 <b>추가</b>하거나 과한 부분은 <b>감액</b>으로 해결한다. 비교 내용을 <b>서면</b>으로 남기고 고객이 선택하게 한다. 충분한 설명 없이 기존 계약을 소멸시키면 <b>부당 승환</b>이 되어 제재 대상이다.',
 key:['부당 승환','감액','서면'],
 why:'설계사가 먼저 해지를 말하지 않는 것이 원칙이다.', ref:'#T-'},

{t:'blank', q:'기왕증이 있어 전부 거절하는 대신 특정 부위 · 질환만 보장에서 제외하고 인수하는 것을 ____라고 한다.',
 a:['부담보','특정부위부담보','부담보 특약'],
 why:'한시 부담보(1~5년)와 전 기간 부담보가 있다. <b>한시 부담보는 해제 시점을 캘린더에 걸어두고</b> 그때 재설계하는 것이 실무다.', ref:'#T-'},

{t:'choice', q:'설계할 때 「보험료가 싸다」를 주된 근거로 삼으면 안 되는 이유는?',
 c:['회사가 싫어해서','싼 이유는 대개 <b>보장 범위 · 기간 · 한도가 좁기 때문</b>이라 비교 대상이 되는 순간 가격 싸움이 되기 때문','고객이 안 믿어서','규정 위반이라서'], a:1,
 why:'상품이 바뀌면 할 말이 없어진다. 「돈이 언제 끊기는지」를 논리로 삼으면 상품이 바뀌어도 논리가 남는다.', ref:'#L0'}
]},

/* ══════════ 설계 ② ══════════ */
{id:'D2', cat:'설계', n:'설계 ② 상황별 실전', sub:'사람이 다르면 답이 다르다', mins:14, q:[

{t:'multi', q:'30대 외벌이 · 자녀 2명 가장에게 <b>반드시</b> 들어가야 할 담보는? (복수)',
 c:['실손','암 · 뇌 · 심 진단비','사망보험금(정기) — 자녀 독립까지','수술비 · 입원일당','고액 저축성보험'],
 a:[0,1,2,3],
 why:'외벌이 가장의 핵심 리스크는 <b>소득 단절</b>이다. 사망은 종신보다 <b>정기</b>로 필요한 기간에 큰 금액을 깐다. 저축성은 보장이 끝난 뒤다.', ref:'#DESIGN'},

{t:'choice', q:'자영업자 설계에서 직장인과 <b>가장 크게 달라지는</b> 지점은?',
 c:['암 진단비 금액','<b>소득 보전</b> — 아프면 가게가 멈춘다. 유급 병가가 없다','실손 세대','치아보험'], a:1,
 why:'직장인은 병가 · 상병수당 · 4대보험이 일부 완충하지만 자영업자는 <b>0</b>이다. 진단비 · 입원일당 · 생활비 담보의 비중을 높인다. 영업배상책임도 함께 본다.', ref:'#DESIGN'},

{t:'choice', q:'현장직(건설 · 제조) 고객 설계에서 특히 중요한 것은?',
 c:['저축성보험','<b>상해 담보와 후유장해</b> — 그리고 직업 변경 시 통지의무','치아보험','연금'], a:1,
 why:'상해 위험이 크고 <b>후유장해</b>가 실제로 발생한다. 3% 이상 후유장해를 넣어야 자주 지급된다. 직업이 바뀌면 <b>1개월 내 통지</b>해야 한다.', ref:'#DESIGN'},

{t:'multi', q:'60대 이상 고객 설계에서 비중을 높여야 하는 담보는? (복수)',
 c:['간병 담보','치매 담보','장기요양 지원','태아보험'],
 a:[0,1,2],
 why:'60대 이상은 <b>간병 · 치매</b>가 포트폴리오의 3분의 1 수준까지 커진다. 진단비 한 번보다 <b>매달 나오는 돈</b>이 실제로 더 오래 쓰인다.', ref:'#L10'},

{t:'choice', q:'가족력(직계 암 · 심장질환)이 있는 고객에게 해야 할 조정은?',
 c:['가입을 미룬다','해당 질환 <b>진단비 금액을 높이고</b> 검진 · 사후관리를 함께 설계한다','가족력은 무시한다','저축성으로 대체한다'], a:1,
 why:'가족력은 <b>금액을 키울 근거</b>이지 거절 사유가 아니다. 다만 이미 증상이 있으면 고지 대상이다.', ref:'#DESIGN'},

{t:'blank', q:'타인을 피보험자로 하는 계약(예: 자녀가 부모를)에는 피보험자 본인의 <b>____ 동의</b>가 반드시 필요하다.',
 a:['서면','서면동의'],
 why:'동의가 없으면 <b>계약이 무효</b>가 될 수 있다. 가족이 대신 서명하는 것은 절대 안 된다. 고령 부모 계약에서 특히 문제가 된다 — 상담 자리에 <b>피보험자 본인</b>이 있어야 한다.', ref:'#T-'},

{t:'choice', q:'회사의 <b>단체보험</b>이 있는 고객에게 설명해야 할 핵심은?',
 c:['개인 보험은 필요 없다','<b>퇴사 · 이직하면 소멸</b>하며 보장 범위를 회사가 정한다','단체보험이 더 좋다','실손과 중복되어 손해다'], a:1,
 why:'단체보험은 <b>회사가 주는 것</b>이라 내가 통제할 수 없다. 개인 계약과 반드시 구분해서 설명한다.', ref:'#T-'},

{t:'choice', q:'법인 대표에게 <b>경영인정기보험</b>을 설명할 때 주 논리로 삼으면 <b>안 되는</b> 것은?',
 c:['대표 유고 시 금융권 여신 회수 · 거래처 이탈 · 직원 동요에 대응할 시간','법인의 존속 자금 마련','<b>손금 인정 · 절세</b>','개인 종신과의 역할 차이'], a:2,
 why:'손금 인정 여부는 계약 구조와 세법 해석에 따라 달라진다. <b>절세를 주 논리로 삼지 말고</b> 반드시 세무 전문가와 연계한다.', ref:'#T-'},

{t:'short', q:'예산 월 10만원인 사회초년생에게 무엇을 어떤 순서로 넣을 것인가?',
 model:'① <b>실손</b> — 가장 자주 쓰고 가장 싸다. ② <b>암 · 뇌 · 심 진단비</b> — 금액은 작아도 담보 자체를 넣어둔다(나중엔 병력이 생겨 못 넣는다). ③ <b>수술비(1-5종 + 1-7종)</b> — 젊을 때 실제로 자주 쓰는 담보. ④ <b>상해 · 운전자</b>. 저축 · 연금은 나중이다. 금액은 줄여도 <b>담보 종류는 빠뜨리지 않는다</b>.',
 key:['실손','진단비','수술비'],
 why:'"빠진 담보는 나중에 못 넣는다"가 이 순서의 이유다.', ref:'#DESIGN'},

{t:'short', q:'유병자 고객 상담에서 <b>순서</b>가 왜 중요한가? 올바른 순서를 쓰시오.',
 model:'① 먼저 <b>표준체 심사가 가능한지</b> 확인한다(간편심사는 보험료가 비싸다). ② 안 되면 <b>간편심사(3 · 2 · 5 등)</b>로 간다. ③ 그래도 안 되면 <b>부담보</b> 조건으로 인수한다. ④ 절대 병력을 축소해 답하도록 안내하지 않는다 — 고지의무 위반이 되면 고객이 전부 잃는다.',
 key:['표준체','간편심사','부담보'],
 why:'바로 유병자 상품부터 꺼내면 고객은 불필요하게 비싼 보험료를 낸다.', ref:'#L7'},

{t:'multi', q:'태아보험의 진짜 가치는? (복수)',
 c:['저체중아 육아비용 · 인큐베이터 · 선천이상 수술 보장','아이가 건강할 때 <b>표준체로</b> 100세 계약을 만들 수 있다','나중에는 병력이 생겨 같은 조건이 안 나온다','산모의 노후 대비'],
 a:[0,1,2],
 why:'태아 특약은 출생 전후에만 쓰이고 사라지지만, <b>어린이보험으로 이어지는 계약</b>이 본체다. 가입 시점(통상 임신 22주 전후)이 보장 범위를 정한다.', ref:'#L7'},

{t:'choice', q:'맞벌이 부부 설계에서 흔히 놓치는 것은?',
 c:['둘 다 실손만 있으면 된다','<b>한 사람이 쉬면 소득이 절반으로 준다</b> — 각자에게 소득보전 담보가 필요하다','사망보험금은 필요 없다','간병은 나중 일이다'], a:1,
 why:'맞벌이는 「둘이 벌어 안전하다」가 아니라 「둘 다 멈추면 안 되는 구조」다. 한쪽이 아프면 다른 쪽이 간병으로 또 멈춘다.', ref:'#DESIGN'}
]},

{id:'D3', cat:'설계', n:'설계 ③ 담보 지도 · 증권 읽기', sub:'이름이 아니라 코드를 읽는다', mins:12, q:[

{t:'choice', q:'가장 <b>넓은</b> 범위를 보장하는 담보는?',
 c:['뇌출혈진단비 (I60~I62)','뇌졸중진단비 (I60~I63)','<b>뇌혈관질환진단비 (I60~I69)</b>','뇌경색진단비 (I63)'], a:2,
 why:'뇌혈관질환(I60~I69) > 뇌졸중(I60~I63) > 뇌출혈(I60~I62). <b>뇌동맥류(I67.1)는 뇌졸중 담보에서 빠진다</b>.', ref:'#L3'},

{t:'choice', q:'급성심근경색진단비만 있는 고객에게 <b>빠져 있는</b> 것은?',
 c:['암','<b>협심증(I20)</b> — I21~I23만 보장되므로','골절','치아'], a:1,
 why:'급성심근경색은 I21~I23. <b>협심증은 통째로 빠진다</b>. 심장질환 발병의 절반 이상이 협심증이라 실무에서 가장 자주 발견되는 구멍이다.', ref:'#L3'},

{t:'multi', q:'증권을 읽을 때 담보명과 함께 <b>반드시</b> 확인해야 하는 것은? (복수)',
 c:['질병코드 범위','가입금액','만기 · 납입기간','갱신 여부','설계사 이름'],
 a:[0,1,2,3],
 why:'담보명은 <b>마케팅</b>이고 코드 범위가 <b>계약</b>이다. 그리고 갱신형이면 나중에 보험료가 오른다는 점을 반드시 알려야 한다.', ref:'#ANALYSIS'},

{t:'blank', q:'모든 질병에 붙는 코드 체계를 ____라고 하며, 보험 담보는 이 코드의 <b>범위</b>로 정의된다.',
 a:['KCD','한국표준질병사인분류','케이씨디'],
 why:'진단서에 적히는 I63, C16, M51 같은 코드가 KCD다.', ref:'#T-'},

{t:'choice', q:'「질병수술비」가 있는데도 수술 후 보험금이 안 나온 경우, 가장 가능성 높은 이유는?',
 c:['보험료를 안 냈다','<b>절단 · 절제가 없는 처치</b>였다','병원이 작았다','입원을 안 했다'], a:1,
 why:'질병수술비도 <b>절단 · 절제</b>를 요구한다. 배액술 · 시술 · 천자는 안 나온다.', ref:'#SURG'},

{t:'multi', q:'담보 지도 24축 중 <b>「장기」 그룹</b>에 속하는 것은? (복수)',
 c:['간병','치매','후유장해','장기요양','운전자'],
 a:[0,1,2,3],
 why:'치료비 / 진단비 / 수술 / 입원 / <b>장기</b> / 생활 6그룹 × 4축 = 24축. 장기 그룹은 치료가 끝난 뒤에 작동하는 담보들이다.', ref:'#ANALYSIS'},

{t:'choice', q:'후유장해 담보에서 <b>80% 이상</b>만 가입되어 있는 고객에게 설명할 것은?',
 c:['충분하다','80% 이상은 「거의 전신」에만 반응한다 — <b>3% 이상</b>을 함께 넣어야 실제로 자주 지급된다','후유장해는 필요 없다','금액을 낮춰야 한다'], a:1,
 why:'손가락 상실 5%, 한쪽 귀 청력 상실 25%, 척추 심한 운동장해 40% — 이런 일상적 장해는 80% 담보로는 <b>한 푼도 안 나온다</b>.', ref:'#L6'},

{t:'choice', q:'실손이 4세대인 고객이 도수치료를 자주 받는다. 무엇을 알려야 하나?',
 c:['상관없다','비급여 이용량에 따라 <b>다음 해 보험료가 최대 +300%</b>까지 오를 수 있다','도수치료는 보장 안 된다','급여로 바꾸면 된다'], a:1,
 why:'4세대는 <b>급여</b>는 차등이 없고 <b>비급여</b>만 1~5등급 차등(1등급 −5% / 5등급 +300%). 3대 비급여는 별도 한도도 있다(도수 · 체외충격파 · 증식 350만/50회 등).', ref:'#L2'},

{t:'short', q:'증권을 처음 받았을 때 <b>보는 순서</b>를 쓰시오.',
 model:'① 계약자 · 피보험자 · 수익자 ② 만기 · 납입기간 · <b>갱신 여부</b> ③ 실손 <b>세대</b> ④ 암 · 뇌 · 심 진단비의 <b>코드 범위</b>와 가입금액 ⑤ 수술비 종류(질병수술비 / 1-5종 / 1-7종 / N대) ⑥ 입원 · 간병 · 후유장해 ⑦ 생활 담보(운전자 · 배상책임 · 치아). 좋은 것부터 말한다.',
 key:['갱신','세대','코드'],
 why:'순서 없이 보면 빠뜨린다. 특히 <b>갱신 여부와 실손 세대</b>는 재설계 판단을 완전히 바꾼다.', ref:'#ANALYSIS'},

{t:'short', q:'고객 증권에 「뇌졸중진단비 2,000만원」만 있다. 어떤 구멍을 어떻게 설명할 것인가?',
 model:'뇌졸중은 <b>I60~I63</b>입니다. 여기서 <b>뇌동맥류(I67.1)</b>가 빠져요. 뇌동맥류는 여성이 1.6배, 고혈압 1.5배, 가족력 1.8배로 흔한데 코일색전술만 해도 비용이 큽니다. <b>뇌혈관질환(I60~I69)</b>으로 한 겹 더 깔면 이 구멍이 메워집니다. 지금 있는 2,000만원을 없애자는 게 아니라 <b>위에 얹는</b> 겁니다.',
 key:['I67','뇌혈관질환','뇌동맥류'],
 why:'기존 계약을 부정하지 않고 <b>얹는</b> 방식이 승환 위험도 피하고 고객도 받아들인다.', ref:'#L3'},

{t:'multi', q:'실손만 있고 진단비가 없는 고객에게 설명해야 할 「실손이 못 막는 것」은? (복수)',
 c:['안 벌린 돈(휴직 · 감봉 · 폐업)','간병비','생활비','비급여 술식을 선택할 목돈'],
 a:[0,1,2,3],
 why:'실손은 <b>이미 쓴 치료비의 일부 회수</b>다. 자기부담을 빼고, 영수증이 있어야 하고, 치료비 항목에 한해서. 나머지 넷은 아무도 안 준다.', ref:'#L2'},

{t:'choice', q:'같은 「암진단비 3,000만원」인데 A는 재발암 담보가 있고 B는 없다. 실무적 차이는?',
 c:['차이 없다','일반암 진단비는 <b>최초 1회</b>로 끝나고 이후 재가입도 어렵다. 재발암은 암이 남아 있으면 <b>2년마다</b> 계속 지급된다','재발암은 보험료만 비싸다','B가 더 좋다'], a:1,
 why:'위암 재발률 55%, 유방암은 15년째에도 25% 재발한다. <b>5년이 끝이 아니다</b>.', ref:'#L3'}
]},

{id:'X1', cat:'종합', n:'종합 실전 — 설계 + 보상', sub:'실제 상담 상황', mins:16, q:[

{t:'short', q:'【케이스】 42세 남 · 자영업(식당) · 배우자와 자녀 2명 · 월 소득 450만 · 예산 월 25만.<br>기존: 실손(2세대), 암진단비 2,000만, 종신 5,000만(월 18만).<br>이 고객의 <b>가장 큰 구멍 3가지</b>와 <b>조정 방향</b>을 쓰시오.',
 model:'<b>구멍</b> ① 뇌 · 심장 진단비가 <b>0원</b> ② 수술비 · 입원일당 없음 — 자영업자는 아프면 가게가 멈추는데 소득 보전 장치가 전무 ③ 후유장해 · 간병 없음.<br><b>조정</b> 종신 5,000만(월 18만)이 예산의 72%를 먹고 있다 → <b>정기</b>로 전환하거나 감액해 재원을 만든다(해지가 아니라 감액 · 전환 검토). 그 재원으로 뇌혈관(I60~I69) · 허혈성심장(I20~I25) 진단비 + 1-5종/1-7종 수술비 + 입원일당을 깐다. 2세대 실손은 <b>그대로 둔다</b>.',
 key:['뇌','심장','수술비','정기','실손'],
 why:'사망보험금이 예산을 잡아먹는 전형이다. <b>기존 계약을 해지가 아니라 감액 · 전환</b>으로 다루는 것이 승환 위험을 피하는 방법이다.', ref:'#CASE'},

{t:'short', q:'【케이스】 고객이 3개월 전 <b>담낭절제술</b>(복강경)을 받았다고 지나가듯 말했다. 청구 안 했다고 한다.<br>확인할 것과 청구 가능한 담보를 쓰시오.',
 model:'<b>확인</b> ① 수술기록지 · 진단서 · 진료비 영수증 ② 가입한 수술비 담보 종류 ③ 소멸시효 3년 이내이므로 <b>지금 청구 가능</b>.<br><b>담보</b> 실손(치료비) / 질병수술비(담낭 절제 = 절제 있음 ○) / 1-5종(36번 담낭 · 담도 관혈수술 <b>3종</b>) / 1-7종(급여 ADRG) / 질병입원일당 / N대 수술비에 포함되면 추가. <b>복층으로 여러 담보가 동시에</b> 나온다.',
 key:['3년','수술비','입원일당','실손'],

<script>
/* ═══════════════════════════════════════════════════════════════
   팀 점수 서버 취합 — Supabase REST
   · 서버가 없거나 실패하면 조용히 localStorage 만 쓴다 (앱은 절대 멈추지 않는다)
   · anon 키는 브라우저 공개용이다. service_role 키는 절대 넣지 말 것.
   · 테이블 : bohum_scores / bohum_progress
   · ⚠ academy_* 라는 이름은 쓰지 말 것. 같은 프로젝트의 CRM 이 academy_progress 를
     이미 쓰고 있어서 2026-08-27 에 실제로 충돌했다 (아래 supabase.sql 주석 참고).
   ═══════════════════════════════════════════════════════════════ */
window.SYNC = (function(){
'use strict';

var CFG = {
  url : 'https://miakdhxtqofpndtlyzxa.supabase.co',
  key : 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pYWtkaHh0cW9mcG5kdGx5enhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNzA5NDIsImV4cCI6MjA5OTc0Njk0Mn0.Rodj7B8brXLiIP3g4kLJl4oCzMKlbYzy1SgwSAFhzOU',
  team: 'APEX'
};

var STATE = { ok:null, msg:'확인 전', last:0 };   // ok: true 연결 / false 미설정·실패 / null 아직

function dev(){
  try{
    var d = localStorage.getItem('bohum_device');
    if(!d){ d = 'd' + Math.random().toString(36).slice(2,10); localStorage.setItem('bohum_device', d); }
    return d;
  }catch(e){ return 'unknown'; }
}
function H(extra){
  var h = { 'apikey':CFG.key, 'Authorization':'Bearer '+CFG.key, 'Content-Type':'application/json' };
  if(extra) for(var k in extra) h[k]=extra[k];
  return h;
}
function url(path){ return CFG.url + '/rest/v1/' + path; }

function fail(e){
  STATE.ok = false;
  STATE.msg = (e && e.message) ? e.message : '연결 실패';
  return null;
}

/* 연결 · 테이블 존재 확인 */
function check(){
  if(!CFG.url || !CFG.key){ STATE.ok=false; STATE.msg='설정 없음'; return Promise.resolve(false); }
  return fetch(url('bohum_scores?select=id&limit=1'), {headers:H()})
    .then(function(r){
      if(r.ok){ STATE.ok=true; STATE.msg='연결됨'; return true; }
      if(r.status===404 || r.status===400){ STATE.ok=false; STATE.msg='테이블 없음 — 운영 가이드 6번에서 설정하세요'; return false; }
      STATE.ok=false; STATE.msg='서버 응답 '+r.status; return false;
    })
    .catch(function(e){ fail(e); return false; });
}

/* 응시 결과 1건 전송 */
function pushScore(a){
  if(STATE.ok === false) return Promise.resolve(false);
  var row = {
    team:CFG.team, name:a.name, set_id:a.id, set_name:a.n, cat:a.cat,
    score:a.score, max_q:a.max, pct:a.pct, wrong:a.wrong||[], device:dev()
  };
  return fetch(url('bohum_scores'), {method:'POST', headers:H({'Prefer':'return=minimal'}), body:JSON.stringify(row)})
    .then(function(r){ if(r.ok){ STATE.ok=true; STATE.msg='연결됨'; return true; } STATE.ok=false; STATE.msg='전송 실패 '+r.status; return false; })
    .catch(function(e){ fail(e); return false; });
}

/* 진도 upsert (team,name 기준) */
function pushProgress(name, done){
  if(STATE.ok === false || !name) return Promise.resolve(false);
  var row = { team:CFG.team, name:name, done:done||{}, updated_at:new Date().toISOString() };
  return fetch(url('bohum_progress?on_conflict=team,name'),
      {method:'POST', headers:H({'Prefer':'resolution=merge-duplicates,return=minimal'}), body:JSON.stringify(row)})
    .then(function(r){ return r.ok; })
    .catch(function(){ return false; });
}

/* 팀 전체 결과 (사람 × 세트 최고점) */
function pullTeam(){
  if(STATE.ok === false) return Promise.resolve(null);
  var q = 'bohum_scores?select=name,set_id,set_name,cat,pct,score,max_q,created_at'
        + '&team=eq.' + encodeURIComponent(CFG.team)
        + '&order=created_at.desc&limit=2000';
  return fetch(url(q), {headers:H()})
    .then(function(r){ if(!r.ok){ STATE.ok=false; STATE.msg='조회 실패 '+r.status; return null; } STATE.ok=true; STATE.msg='연결됨'; return r.json(); })
    .catch(function(e){ return fail(e); });
}
function pullProgress(){
  if(STATE.ok === false) return Promise.resolve(null);
  return fetch(url('bohum_progress?select=name,done,updated_at&team=eq.'+encodeURIComponent(CFG.team)), {headers:H()})
    .then(function(r){ return r.ok? r.json() : null; })
    .catch(function(){ return null; });
}

/* 이 기기에 쌓인 기록을 서버로 한 번에 올린다 (뒤늦게 서버를 켠 경우) */
function pushAllLocal(db){
  if(STATE.ok === false || !db) return Promise.resolve(0);
  var jobs = [];
  Object.keys(db).forEach(function(n){
    (db[n].attempts||[]).forEach(function(a){
      jobs.push(pushScore({name:n, id:a.id, n:a.n, cat:a.cat, score:a.score, max:a.max, pct:a.pct, wrong:a.wrong}));
    });
  });
  return Promise.all(jobs).then(function(rs){ return rs.filter(Boolean).length; });
}

return { cfg:CFG, state:STATE, check:check, pushScore:pushScore, pushProgress:pushProgress,
         pullTeam:pullTeam, pullProgress:pullProgress, pushAllLocal:pushAllLocal, device:dev };
})();

</script>

 {t:"list",x:[

 ]},

 {t:"list",x:[
  "<b>뇌경색은 피를 녹여야 하고, 뇌출혈은 피를 멈춰야 한다.</b> 그래서 어느 쪽인지 모르는 상태에서 혈전용해제를 쓰면 출혈 환자를 죽일 수 있다.",
  "이것이 응급실에서 <b>가장 먼저 CT부터 찍는 이유</b>다. 출혈이 있는지부터 배제해야 다음 치료가 결정된다.",
  "<b>발병 구성</b> — 뇌경색이 뇌출혈보다 훨씬 흔하다. 그런데 담보는 '뇌출혈'로만 들어가 있는 경우가 많다. 여기가 가장 큰 구멍이다.",
  "<b>심장과의 연결</b> — 뇌경색 원인 중 하나가 <b>심방세동에서 떨어져 나온 혈전</b>이다. 부정맥 파트에서 본 그 고리가 여기서 받아진다. 즉 <b>심장 담보와 뇌 담보는 한 사람의 한 사건에서 동시에 걸린다.</b>"
 ]},

 {t:"img",x:"an/an_027.jpg",cap:"뇌경색(I63) 기전 ① — 심장에서 생긴 혈전이 이동해 뇌혈관을 막는다 (뇌색전증)"},
 {t:"img",x:"an/an_029.jpg",cap:"뇌경색(I63) 기전 ② — 뇌동맥 자체의 혈전이 자라 혈관을 막는다 (뇌혈전증)"},
 {t:"p",x:"심장은 근육이 죽고, 뇌는 신경이 죽는다. 그리고 <b>둘 다 재생되지 않는다.</b> 차이는 속도다. 뇌는 혈류가 끊기면 분 단위로 죽어 나간다. 그래서 뇌졸중 치료의 절반은 <b>얼마나 빨리 병원에 왔는가</b>로 결정된다."},
 {t:"table",head:["단계","무엇을 하나","핵심"],rows:[

  ["큰 혈관이 막혔으면","<b>기계적 혈전제거술</b> — 카테터로 혈전을 직접 꺼냄","용해제보다 시간 여유가 있는 경우가 있음"],

 ]},
 {t:"callout",k:"warn",x:"<b>시간 기준은 숫자로 단정하지 말 것.</b> 혈전용해·혈전제거의 적용 가능 시간은 환자 상태, 영상 소견, 병원 사정에 따라 달라진다. 고객에게는 \"<b>빠를수록 선택지가 많아진다</b>\"까지만 말하고, 구체적 시간은 담당의 판단이라고 안내한다."},
 {t:"list",x:[
  "<b>증상이 시작된 시각</b>이 치료 결정의 기준이다. 자고 일어나 발견한 경우 마지막으로 멀쩡했던 시각을 기준으로 본다.",
  "가족이 기억해야 할 초기 신호 — <b>한쪽 얼굴이 처짐 · 한쪽 팔에 힘이 빠짐 · 말이 어눌해짐</b>. 하나라도 갑자기 생기면 즉시 119.",
  "\"조금 쉬면 낫겠지\"가 가장 위험하다. 뇌졸중은 아프지 않은 경우가 많아 참고 기다리다 시간을 놓친다."
 ]},

 {t:"h",x:"14. 후유증 — 여기서부터가 진짜 비용이다"},
 {t:"fig",x:"l3-sequela"},
 {t:"p",x:"심장은 순간의 병이고 뇌는 그 다음이 길다고 했다. 그 \"다음\"의 구체적인 내용이 이것이다. <b>교재에 이 목록이 없어서 간병 필요성이 추상적으로만 설명되고 있었다.</b>"},
 {t:"table",head:["후유증","실제로 어떤 상태인가","생활에서 무엇이 필요해지는가"],rows:[
  ["<b>편마비</b>","손상된 뇌의 <b>반대쪽</b> 팔다리에 힘이 빠짐","이동 보조 · 옷 입기 · 화장실 동행"],
  ["<b>실어증</b>","말이 안 나오거나(운동성), 유창하나 이해를 못 함(감각성)","의사표현 대행 · 병원 동행 필수"],
  ["<b>연하장애</b>","삼키는 근육이 마비돼 음식이 기도로 넘어감","<b>식사 전 과정 보조</b> · 콧줄·위루관"],
  ["편측무시","한쪽 공간을 아예 인식하지 못함","안전 감독 상시 필요"],
  ["인지·감정 변화","기억력 저하 · 감정조절 어려움 · 우울","돌보는 가족의 소진이 가장 큰 지점"],
  ["경직·통증","마비된 팔다리가 굳고 아픔","지속적 재활 · 약물"]
 ]},
 {t:"callout",k:"warn",x:"<b>연하장애를 반드시 기억할 것.</b> 삼킴이 안 되면 음식이 폐로 들어가 <b>흡인성 폐렴</b>이 생기고, 이게 재입원의 흔한 이유가 된다. 즉 뇌졸중 환자의 입원은 <b>뇌졸중 때문에만 생기지 않는다.</b> 진단비 한 번으로 끝나지 않는 구조가 여기서 완성된다."},
 {t:"p",x:"그리고 이 목록을 보면 <b>왜 가족이 일을 그만두게 되는지</b>가 보인다. 편마비만 있으면 시설·보조기구로 어느 정도 대응되지만, 여기에 <b>실어증과 연하장애가 겹치면 사실상 24시간 사람이 붙어야 한다.</b> 간병비가 왜 월 단위로 나가는지의 실체다."},

 {t:"h",x:"15. 재활 — 회복에는 창(窓)이 있다"},
 {t:"fig",x:"l3-rehab"},
 {t:"list",x:[
  "<b>급성기</b> — 생명을 안정시키는 단계. 이 시기에도 가능한 범위에서 조기 재활을 시작한다.",
  "<b>회복기</b> — 집중 재활 단계. <b>회복은 이 구간에 가장 크게 일어난다.</b> 하루 여러 차례의 물리·작업·언어치료가 들어간다.",
  "<b>유지기</b> — 회복 속도가 완만해진 뒤 기능을 지키는 단계. 여기서부터는 치료보다 <b>돌봄의 영역</b>으로 넘어간다.",
  "<b>병원을 옮겨 다닌다</b> — 급성기 병원 → 재활병원 → 요양병원·재가로 이어지는 경우가 많다. 그때마다 비용 구조와 본인부담이 달라진다.",
  "재활치료는 항목·기간에 따라 <b>급여와 비급여가 섞여</b> 있어 실손만으로는 메워지지 않는 구간이 생긴다."
 ]},
 {t:"callout",k:"key",x:"설계 포인트 — 회복기의 집중 재활은 <b>기간이 길고 입원이 동반</b>된다. 그래서 뇌 쪽은 진단비보다 <b>입원일당 · 간병인사용일당 · 후유장해</b>가 실제로 돈을 만들어낸다. 뇌졸중에 진단비만 넣은 설계가 절반짜리인 이유가 이 구간이다."},

 {t:"h",x:"16. 후유장해 — 뇌에서만 생기는 담보"},
 {t:"fig",x:"l3-disability-time"},
 {t:"list",x:[
  "치료가 끝나도 기능이 돌아오지 않으면 <b>장해</b>가 남는다. 뇌졸중은 후유장해 담보가 실제로 지급되는 대표적인 질환이다.",
  "지급은 약관의 <b>장해분류표</b>에 따르며, 신경계 장해는 <b>일상생활 동작의 제한 정도</b>로 평가한다.",
  "<b>평가 시점이 중요하다.</b> 장해는 증상이 고정된 뒤 판정하므로, 발병 직후가 아니라 일정 기간이 지난 뒤 청구하게 된다. 이걸 모르면 \"왜 지금 안 나오냐\"는 분쟁이 생긴다.",
  "지급률과 판정 기준은 <b>상품마다 다르다.</b> 숫자를 외워서 말하지 말고 해당 약관 장해분류표로 확인한다."
 ]},
 {t:"callout",k:"warn",x:"후유장해는 <b>보상 실무 난이도가 가장 높은 담보</b> 중 하나다. 청구 시점·진단서 문구·평가 기준에서 분쟁이 잦다. 자세한 절차는 LEVEL 8 보상 실무에서 다룬다."},

 {t:"list",x:[
  "<b>심장은 펌프다.</b> 방 4개가 순서대로 짜내면서 피를 돌린다. 방 사이의 문이 판막이다.",
  "<b>그런데 펌프도 밥을 먹어야 한다.</b> 심장 근육에 피를 대주는 별도의 혈관이 <b>관상동맥</b>이다. 심장 표면을 왕관처럼 감싸고 있어서 붙은 이름이다.",
  "관상동맥은 크게 <b>좌주간부(LM)</b> → <b>좌전하행지(LAD)</b> · <b>좌회선지(LCX)</b>, 그리고 <b>우관상동맥(RCA)</b> 세 줄기다.",
  "<b>심장 안에 피가 가득해도 관상동맥이 막히면 심장 근육은 굶어 죽는다.</b> 이 한 문장이 허혈성 심장질환 전체의 출발점이다."
 ]},
 {t:"callout",k:"key",x:"고객용 30초 설명 — \"심장은 피를 짜내는 펌프인데요, <b>그 펌프도 자기가 쓸 피를 따로 받아요.</b> 그 배관이 관상동맥입니다. 심장 안에 피가 아무리 많아도 그 배관이 막히면 심장 근육이 굶어서 죽습니다. 그게 심근경색이에요.\""},

 {t:"h",x:"19. 왜 막히면 끝인가 — 심근은 재생되지 않는다"},
 {t:"p",x:"이게 심장 파트에서 <b>가장 중요한 한 줄</b>인데 대부분의 교재에 없다. 간은 잘라내도 어느 정도 자란다. 피부는 아물고, 뼈는 붙는다. <b>그런데 죽은 심장 근육은 다시 자라지 않는다.</b> 그 자리는 흉터 조직으로 바뀌고, 흉터는 뛰지 않는다."},
 {t:"list",x:[
  "심근경색으로 근육의 일부가 죽으면 → 펌프 힘이 <b>영구적으로</b> 줄어든다.",
  "줄어든 힘으로 평생을 버텨야 하니 → 남은 근육에 과부하가 걸린다.",
  "그 끝이 <b>심부전</b>이다. 즉 심근경색과 심부전은 별개의 병이 아니라 <b>같은 이야기의 앞뒤</b>다.",
  "그래서 심장은 \"치료하면 낫는 병\"이 아니라 <b>\"관리하며 사는 병\"</b>이 된다. 담보 설계가 일회성 진단비로 끝나면 안 되는 이유가 여기 있다."
 ]},

 {t:"list",x:[

  "I20.1 변이형은 막힌 게 아니라 <b>조여진 것</b>이라 관상동맥 CT에서 정상으로 보일 수 있다. 진단이 늦기 쉽고, 그 사이 급사 위험이 있다.",
  "반면 <b>안정형 협심증이 가장 흔하다.</b> 특정 허혈성 담보만 있으면 가장 흔한 것을 놓친다. 그래서 <b>허혈성 심장질환(I20~I25) 범위</b>가 기본이어야 한다."
 ]},

 {t:"table",head:["단계","검사","무엇을 보나","한계"],rows:[

  ["2","심장초음파 (Echo)","펌프 힘(EF), 판막 상태, 벽 움직임","혈관 자체는 못 본다"],

  ["5","<b>관상동맥조영술 (CAG)</b>","혈관에 직접 관을 넣어 확인","<b>진단이자 시술의 관문</b>"]
 ]},
 {t:"callout",k:"key",x:"5단계 <b>관상동맥조영술(CAG)</b>이 상담에서 가장 중요한 지점이다. 손목·사타구니 동맥으로 관을 넣어 조영제를 뿌려 보는데, <b>보다가 막힌 게 확인되면 그 자리에서 바로 스텐트로 넘어가는 경우가 많다.</b> 즉 검사받으러 들어갔다가 시술받고 나오는 구조다. 고객이 \"검사만 받는 줄 알았는데\"라고 하는 상황이 여기서 나온다."},
 {t:"list",x:[
  "고객에게 물어야 할 것 — \"<b>심전도만</b> 하셨어요, 아니면 <b>CT나 조영술</b>까지 하셨어요?\"",
  "심전도만 정상인 것은 '지금 이 순간 부정맥이 없다'는 뜻에 가깝다. 관상동맥이 깨끗하다는 뜻이 아니다.",
  "이 질문 하나로 상담의 깊이가 달라진다. 그리고 <b>고지의무 대상</b>을 정확히 파악하는 데도 직결된다."
 ]},

 {t:"h",x:"22. 무엇을 하는가 — 시술·수술 스펙트럼과 수술비 매핑"},
 {t:"p",x:"심장은 \"스텐트 아니면 우회술\" 두 가지가 아니다. 병이 어디냐에 따라 완전히 다른 처치가 들어가고, <b>처치의 종류가 곧 수술비 담보의 갈림길</b>이 된다."},
 {t:"table",head:["문제","처치","방식","수술비 관점"],rows:[

  ["판막이 망가짐","판막성형 · <b>판막치환(TAVI 포함)</b>","개흉 또는 카테터","방식에 따라 종 구분이 갈림"],

 {t:"callout",k:"warn",x:"<b>종수술비를 단순화하지 말 것.</b> \"1-7종은 비급여 미보상이라 나쁘다\"는 틀린 설명이다. 정답은 <b>짝꿍 관계</b>다 — <b>1-5종</b>은 급여·비급여 무관하고 매회 반복되지만 <b>절단·절제가 없으면 면책</b>이다. <b>1-7종</b>은 급여만·연 1회지만 <b>시술·흡인·천자까지 보장</b>한다. 그래서 심장에서 <b>혈전제거술·배액술은 1-7종에서만 잡히는</b> 일이 생긴다. 둘 중 하나가 아니라 둘 다 필요한 이유다."},
 {t:"p",x:"그리고 심장의 진짜 문제는 <b>한 번으로 끝나지 않는다</b>는 것이다. 스텐트를 넣은 혈관이 다시 좁아지기도 하고(재협착), 다른 혈관이 새로 막히기도 한다. <b>매회 반복 지급되는 담보</b>가 심장에서 특히 중요한 이유다."},

 {t:"p",x:"교재에 이 병이 없었다. 그런데 고령 고객 상담에서 가장 자주 만나게 되는 심장병이 이것이다. 심부전은 <b>별개의 병이 아니라 여러 심장병의 결승선</b>이다 — 심근경색으로 근육을 잃었거나, 고혈압으로 오래 과부하가 걸렸거나, 판막이 망가졌거나."},
 {t:"list",x:[
  "<b>EF (박출률)</b> — 좌심실이 한 번에 짜내는 비율. 정상은 대략 55~70% 수준이다. 이 숫자가 낮을수록 펌프 힘이 떨어진 것이다.",
  "다만 <b>EF가 정상인데도 심부전인 경우가 있다.</b> 짜내는 힘이 아니라 <b>늘어나 받아들이는 능력</b>이 떨어진 유형이다. \"수치 정상인데 왜 숨차죠?\"의 답이 여기 있다.",
  "<b>NYHA 분류</b> — 증상으로 나누는 4단계. Ⅰ은 일상에 지장 없음, Ⅱ는 보통 활동에 숨참, Ⅲ은 조금만 움직여도 숨참, Ⅳ는 <b>쉴 때도</b> 숨참.",
  "가장 중요한 특징 — <b>입원과 퇴원을 반복한다.</b> 악화되면 입원, 조절되면 퇴원, 다시 악화. 이 반복이 심부전 비용의 본체다."
 ]},
 {t:"callout",k:"key",x:"심부전은 <b>진단비형 담보와 가장 안 맞는 병</b>이다. 한 번 크게 받고 끝나는 구조가 아니라 <b>입원이 반복</b>되기 때문이다. 그래서 <b>입원일당 · 반복 지급형 담보 · 간병</b>이 실제로 일을 한다. 고령 고객 설계에서 이 구조를 놓치면 보장이 텅 빈다."},

 {t:"callout",k:"key",x:"이 다섯 줄이 <b>왜 일회성 진단비로 부족한지</b>에 대한 실제 근거다. 진단은 한 번이지만 <b>약값 · 추적검사 · 재시술 · 소득 영향은 계속</b>된다. 상담에서 이 이야기를 하면 치료비·수술비 담보의 필요성이 저절로 따라온다."},

design:[
 "<b>진단비 3종 기본</b> — 일반암 / 뇌혈관질환(I60~I69) / 허혈성 심장질환(I20~I25). 좁은 담보(뇌출혈 · 급성심근경색)만 있으면 반드시 넓히기.",
 "<b>유사암 · 소액암 갭 메우기</b> — 갑상선 · 유방 · 전립선은 발생률 상위인데 지급률이 낮다. 별도 특약 또는 수술비 · 치료비로 보완.",
 "<b>재발 · 전이 대비</b> — 암재발진단비(2년마다 반복), 계속받는암진단비를 추가.",
 "<b>고액암 특약</b> — 3대 · 5대 · 10대 고액암은 치료비가 크고 생존기간이 길다. 여력이 되면 추가.",
 "<b>납입면제</b> — 암 · 2대질환 · 후유장해 납입면제는 반드시 검토. 진단 후 보험료 부담이 사라지는 것도 보험금이다.",
 "<b>가족력 반영</b> — 부모 · 형제 병력을 물어 해당 암의 담보를 두껍게 한다.",
 "<b>청구 전 확인 순서</b> — 암은 '조직검사 결과지'와 <b>질병분류코드</b>부터 본다. 영상 소견만으로 청구하면 부지급 사유가 된다.",
 "<b>뇌는 진단비보다 그 뒤</b> — 회복기 집중 재활은 기간이 길고 입원이 동반된다. <b>입원일당 · 간병인사용일당 · 후유장해</b>를 한 묶음으로 본다.",
 "<b>부정맥 구멍 점검</b> — 허혈성 심장질환(I20~I25) 진단비만 있으면 부정맥 · 심부전 · 판막 · 심근병증이 전부 무보장이다. <b>심장질환(I00~I52)</b> 범위가 있는지 확인한다.",
 "<b>산정특례 이후</b> — 특례 기간이 끝난 뒤의 추적검사 · 재발관리 부담이 비어 있는지 본다. 재발 · 전이는 5년 뒤에도 온다."
],
scripts:[
 {k:"코드 화법",q:"저 뇌졸중 진단비 있어요.",a:"좋습니다. 그런데 뇌 담보는 <b>세 겹</b>이에요. 뇌출혈(제일 좁음) → 뇌졸중 → 뇌혈관질환(제일 넓음). 실제 통계로 보면 뇌출혈은 전체 뇌 질환의 <b>8.7%</b>밖에 안 돼요. 지금 갖고 계신 게 어느 겹인지, 증권에서 코드 범위만 같이 확인해볼까요?"},
 {k:"심장 화법",q:"심근경색 진단비 5천 있어요.",a:"급성심근경색은 심장질환 중 <b>12%</b>입니다. 실제로 제일 많이 생기는 건 협심증인데 <b>64.8%</b>예요. 협심증은 급성심근경색 담보로는 한 푼도 안 나옵니다. 스텐트 한 번에 본인부담 258만원 나온 영수증이 있어요."},
 {k:"유사암 갭",q:"암 진단비 5천이면 충분하죠?",a:"암 종류에 따라 달라요. 여성분 발생 1위가 유방암(21.5%), 2위가 갑상선암(19.8%)인데 이 둘은 <b>유사암 · 소액암</b>으로 분류돼서 10~20%만 나오는 경우가 많습니다. 갑상선암 로봇수술 영수증 실제 본인부담이 <b>1,586만원</b>이었어요."},
 {k:"재발 화법",q:"한 번 받으면 되는 거 아니에요?",a:"위암은 재발률이 <b>55%</b>예요. 그런데 일반 암진단비는 최초 1회 받으면 끝나고, 그 뒤엔 새로 가입도 안 됩니다. 재발암 진단비는 암이 남아 있으면 <b>2년마다</b> 계속 나와요. 완치될 때까지요."},
 {k:"조직검사 확인",q:"검사에서 암인 것 같대요.",a:"많이 놀라셨겠어요. 하나만 먼저 여쭐게요 — <b>조직검사 결과지</b>는 받으셨어요? 영상에서 보이는 것만으로는 보험에서 확정으로 안 봐서요. 결과지 나오면 거기 적힌 <b>코드</b>까지 같이 봐드릴게요."},
 {k:"뇌 후유증",q:"뇌졸중은 진단비 있으면 되는 거 아니에요?",a:"진단비는 <b>처음 한 번</b>이에요. 뇌는 그 다음이 길어서요 — 재활이 몇 달씩 가고, <b>삼킴이 어려워지면 폐렴으로 다시 입원</b>하시는 경우가 많습니다. 그건 병명이 폐렴이라 뇌 담보로는 안 나와요. 그래서 입원이랑 간병이 같이 있어야 합니다."},
 {k:"심장 반복성",q:"스텐트 넣었으니 이제 괜찮죠?",a:"뚫어 놓으신 거지 <b>혈관이 새것이 된 건 아니에요.</b> 그 자리가 다시 좁아지기도 하고 다른 혈관이 막히기도 해서 약을 계속 드시고 검사도 계속 받으세요. 그래서 심장은 <b>한 번 받고 끝나는 담보</b>보다 계속 받을 수 있는 쪽이 맞습니다."},
 {k:"납입면제",q:"보험료 부담돼요.",a:"그래서 <b>납입면제</b>를 꼭 봅니다. 암 진단받으시면 그 뒤 보험료는 회사가 대신 냅니다. 아파서 소득이 끊긴 그 시점에 매달 나가는 돈이 사라지는 거예요. 이것도 사실상 보험금입니다."}
],

 {q:"뇌 질환 발병 구성에서 '기타 뇌혈관질환(I67 등)'의 비중은?",c:["8.7%","12.1%","38.9%","54.1%"],a:2,why:"심평원 2022 기준 기타 뇌혈관질환 38.9%. 좁은 담보로는 못 잡는 큰 덩어리다."},
 {q:"약관상 암 진단확정의 근거로 인정되는 것은?",c:["CT · MRI 영상 소견","건강검진 결과지","병리 전문의의 조직검사 결과","주치의 구두 소견"],a:2,why:"영상은 추정일 뿐이다. 조직검사에서 확진되며, 결과지의 C·D 코드가 일반암/유사암을 가른다."},
 {q:"병기(TNM)와 진단비의 관계로 옳은 것은?",c:["4기일수록 진단비가 더 나온다","병기와 무관하게 진단비는 한 번 나온다","1기는 진단비 대상이 아니다","M1이면 진단비가 두 배다"],a:1,why:"진단비는 병기와 무관하게 한 번이다. 그런데 실제 비용은 병기에 따라 몇 배로 갈린다 — 반복 지급형 치료비가 필요한 근거."},

 {q:"심방세동(I48)이 뇌경색을 만드는 경로는?",c:["혈압이 올라 혈관이 터진다","심장에 고인 피가 굳어 떨어져 나가 뇌혈관을 막는다","뇌혈관이 경련한다","콜레스테롤이 뇌에 쌓인다"],a:1,why:"심인성 색전. 부정맥은 심장병이면서 동시에 뇌졸중의 원인이라, 두 담보가 한 사건에서 동시에 걸린다."},
 {q:"'심근은 재생되지 않는다'가 설계에 주는 함의는?",c:["진단비 하나면 충분하다","일회성 진단비보다 반복 지급되는 치료비 · 수술비가 필요하다","수술비는 불필요하다","실손만 있으면 된다"],a:1,why:"죽은 심근은 흉터가 되어 펌프 힘이 영구히 준다. 심장은 낫는 병이 아니라 관리하며 사는 병이 된다."},
 {q:"특정 허혈성 심장질환에 I20.0 · I20.1만 포함되는 이유는?",c:["가장 흔한 협심증이라서","당장 생명을 위협하는 유형만 골라 넣었기 때문","치료비가 가장 비싸서","진단이 쉬워서"],a:1,why:"I20.0 불안정형은 심근경색 직전 단계, I20.1 변이형은 경련 지속 시 급사 위험이 있다. 가장 흔한 것은 오히려 안정형이다."}

design:[
 "<b>수술비 복층설계 3층 구조</b> — ① 실손(실제 지출) ② 질병 / 상해수술비 + 종수술비(넓게) ③ N대 수술비 + 특정질병수술비(깊게).",
 "종수술비는 <b>1-5종 + 1-7종(이상)을 함께</b> 넣는 것이 정석이다. 1-5종은 비급여 · 반복지급을, 1-7종은 절단 · 절제 없는 시술(혈전제거 · 배액 · 요실금 · 치핵)을 담당한다. 하나만 있으면 반드시 구멍이 생긴다.",
 "<b>암 · 뇌혈관 · 허혈성심장 수술비</b>는 별도로 추가한다 — 큰 수술까지 커버.",
 "인공관절수술 · 창상봉합 · 충수염절제 같은 <b>단일 특약</b>도 설계해 볼 것. 다빈도 수술 표를 근거로 삼는다.",
 "고객 증권 점검 3문장 — ① 종 수술비가 몇 종형인가 ② 비급여를 보상하는가 ③ N대가 몇 대이고 내 가족력 질병이 그 안에 있는가."
],
scripts:[
 {k:"수술 정의",q:"수술이면 다 나오는 거 아니에요?",a:"약관에는 '기구를 사용해 <b>절단 · 절제</b> 등의 조작을 가하는 것'이라고 돼 있어요. 그래서 주사기로 빨아들이는 흡인, 바늘 꽂는 천자, 검사 목적 복강경은 수술로 안 봅니다. 실제로 이것 때문에 못 받는 분들이 정말 많아요."},
 {k:"종 확인",q:"저 종수술비 있어요.",a:"몇 종형인지 보셨어요? 이게 <b>둘 중 하나만 있으면 반드시 구멍이 납니다.</b> 1-5종은 비급여도 주고 같은 병으로 여러 번 줘요. 대신 <b>절단 · 절제가 없으면 안 나옵니다.</b> 1-7종은 반대로 시술이나 흡인도 주는데 <b>급여만</b> 줘요. 그래서 둘을 같이 넣는 겁니다."},
 {k:"짝꿍 설명",q:"수술비를 왜 두 종류나 넣어요?",a:"실제 사례로 보여드릴게요. 뇌혈관 <b>혈전제거술</b>은 절단 · 절제가 없어서 1-5종에서 <b>0원</b>인데 1-7종에선 5종으로 나옵니다. 반대로 자궁근종 <b>하이푸 수술</b>은 전액 비급여라 1-7종에선 <b>0원</b>인데 1-5종에선 나와요. 하나만 갖고 계시면 <b>둘 중 하나는 반드시 못 받습니다.</b>"},
 {k:"배액술 근거",q:"그런 일이 흔한가요?",a:"<b>배액술</b>이라고 고름 빼는 시술이 있는데요, 2020년에 <b>62,453명</b>이 받았습니다. 갑상선 수술 받은 분이 30,377명이니까 <b>2배</b>예요. 이게 1-5종에선 안 나오고 1-7종에서 나옵니다. 흔한 정도가 아니라 갑상선보다 많아요."},
 {k:"복층 설명",q:"수술비를 왜 여러 개 넣어요?",a:"심장 하나만 예로 들게요. 스텐트는 <b>3종</b>, 우회수술은 <b>5종</b>입니다. 같은 심장인데 다르죠. 여기에 N대 수술비가 겹치면 <b>두 군데서</b> 나옵니다. 진단비처럼 한 번 받고 끝나는 게 아니라, 수술할 때마다 계속 나오는 게 수술비예요."},
 {k:"빈도 화법",q:"저는 건강해서 수술할 일 없어요.",a:"우리나라에서 제일 많이 하는 수술 1위가 <b>백내장</b>이고, 40대는 <b>치핵</b>, 20~30대는 <b>제왕절개</b>예요. 암 수술은 순위권에 거의 없습니다. 수술비는 큰 병 대비가 아니라 <b>살면서 쓰는 담보</b>예요."},

design:[

scripts:[
 {k:"운전자 화법",q:"자동차보험 있는데 운전자보험도 필요해요?",a:"자동차보험은 <b>상대방</b>을 위한 민사 보험이고, 운전자보험은 <b>나</b>를 위한 형사 보험이에요. 스쿨존에서 사고 나면 민식이법상 벌금형 자체가 없고 징역 3년부터입니다. 그때 필요한 건 벌금이 아니라 <b>변호사</b>예요. 그것도 경찰 조사 단계부터요."},
 {k:"일배책 화법",q:"배상책임 그거 얼마나 쓰겠어요.",a:"지급 건수가 2016년 5만 건에서 2023년 <b>21만 건</b>으로 늘었어요. 아랫집 누수, 애가 남의 폰 깨뜨린 거, 강아지가 사람 문 거 — 다 됩니다. 보험료는 월 몇백원이고요. 그리고 <b>2개 넣으면</b> 자기부담금 20만원까지 다 받으실 수 있어요."},
 {k:"치아 화법",q:"치아보험은 나중에 필요할 때 들죠.",a:"그게 안 되는 유일한 담보예요. 가입하고 <b>91일은 면책</b>, 보철은 <b>2년까지 절반만</b> 나옵니다. 아프고 나서 들면 그 치료는 못 받아요. 그리고 치과는 본인부담률이 <b>76%</b>예요. 일반 진료의 두 배입니다."},
 {k:"태아 화법",q:"애 낳고 들면 안 돼요?",a:"태아 특약과 산모 특약은 <b>출산 전에만</b> 넣을 수 있어요. 보통 16주나 20주 이후부터 가입 가능하고요. 선천이상 수술비 같은 건 태어난 다음엔 못 넣습니다. 지금이 딱 그 시기예요."},
 {k:"유병자 화법",q:"저 당뇨 있는데 보험 되나요?",a:"됩니다. 다만 순서가 중요해요. 일반 심사부터 넣어보고, 안 되면 간편심사를 <b>낮은 단계부터</b> 올라갑니다. 처음부터 제일 쉬운 걸로 가면 보험료를 손해 보시거든요. 최근 3개월 안에 입원이나 수술 소견 받으신 적 있으세요?"}
],

function growStat(who){
  var doneN = 0; C.forEach(function(c){ if(state.done[c.id]) doneN++; });
  var scores = {}, avg = 0, cnt = 0;
  if(who){
    QUIZ.forEach(function(s){ var b = best(s.id, who); if(b){ scores[s.id]=b.pct; avg+=b.pct; cnt++; } });
  }
  avg = cnt? Math.round(avg/cnt) : 0;
  var stage = 1;
  STAGES.forEach(function(st){
    var okDone = st.need.every(function(id){ return state.done[id]; });
    var okTest = st.tests.every(function(id){ return (scores[id]||0) >= (st.n===4?80:70); });
    if(okDone && okTest) stage = Math.min(4, st.n + (st.n<4?1:0));
  });
  if(stage===4 && !(cnt===QUIZ.length && avg>=80)) stage = 4;
  return {doneN:doneN, total:C.length, scores:scores, avg:avg, cnt:cnt, stage:stage};
}
function nextAction(who, st){
  /* 지금 해야 할 딱 한 가지 */
  var cur = STAGES[st.stage-1];
  for(var i=0;i<cur.need.length;i++){
    var id = cur.need[i];
    if(!state.done[id]){
      var ch = C.filter(function(x){return x.id===id;})[0];
      return {t:'본문 '+id+' 읽기', d:ch? ch.title : '', h:'#'+id, why:'이 단계는 여기서부터다'};
    }
  }
  for(var j=0;j<cur.tests.length;j++){
    var q = cur.tests[j], sc = st.scores[q];
    var set = null; QUIZ.forEach(function(x){ if(x.id===q) set=x; });
    if(sc===undefined) return {t:'테스트 '+q+' 응시', d:set?set.n:'', h:'#TQ-'+q, why:'아직 안 봤다'};
    if(sc < (st.stage===4?80:70)) return {t:'테스트 '+q+' 재응시', d:(set?set.n:'')+' · 현재 '+sc+'점', h:'#TQ-'+q, why:'통과선까지 '+((st.stage===4?80:70)-sc)+'점'};
  }
  /* 약점 영역 */
  var worst=null;
  QUIZ.forEach(function(s){ var v=st.scores[s.id]; if(v!==undefined && (!worst || v<worst.v)) worst={id:s.id, v:v, n:s.n}; });
  if(worst && worst.v<90) return {t:'약점 보강 — '+worst.n, d:'현재 '+worst.v+'점', h:'#TQ-'+worst.id, why:'가장 낮은 영역'};
  if(st.doneN < st.total) return {t:'남은 본문 마저 읽기', d:st.doneN+' / '+st.total+' 완료', h:'#BOOK', why:'완독까지 '+(st.total-st.doneN)+'개'};
  return {t:'케이스 9건 다시 풀기', d:'답 보지 않고', h:'#CASE', why:'실전 감각 유지'};
}

function tsave(o){ try{ localStorage.setItem(TKEY, JSON.stringify(o)); }catch(e){} }
function tname(){ try{ return localStorage.getItem(NKEY)||''; }catch(e){ return ''; } }

function norm(s){ return String(s||'').toLowerCase().replace(/[\s,.\/·・\-_'"()\[\]%~:;!?→]/g,''); }
function blankOk(v, arr){
  var n = norm(v); if(!n) return false;
  return arr.some(function(a){
    var na = norm(a);
    if(n === na) return true;
    var toks = String(a).split(/[\s,\/·]+/).filter(Boolean).map(norm).filter(Boolean);
    if(toks.length > 1) return toks.every(function(t){ return n.indexOf(t) >= 0; });
    if(/^[0-9]+$/.test(na)) return new RegExp('(^|[^0-9])' + na + '([^0-9]|$)').test(n);
    return na.length >= 2 && n.indexOf(na) >= 0;
  });
}

function gradeQuiz(id){
  var s=null; QUIZ.forEach(function(x){ if(x.id===id) s=x; });
  if(!s) return;
  var who=tname(), got=0, max=0, wrong=[], answers={};
  s.q.forEach(function(q,i){
    var item = document.querySelector('.qitem[data-i="'+i+'"]');
    var res = item.querySelector('.qres'), ok=false, part=0, mine='';
    if(q.t==='blank'){
      var v = item.querySelector('.qin').value; mine=v;
      ok = blankOk(v, q.a);
      part = ok?1:0;
    } else if(q.t==='choice'){
      var r = item.querySelector('input[type=radio]:checked');
      mine = r? r.value : '';
      ok = r && +r.value===q.a; part = ok?1:0;
    } else if(q.t==='multi'){
      var cs = Array.prototype.slice.call(item.querySelectorAll('input[type=checkbox]:checked')).map(function(x){return +x.value;});
      mine = cs.join(',');
      ok = cs.length===q.a.length && q.a.every(function(a){return cs.indexOf(a)>=0;});
      part = ok?1:0;
    } else {
      var t = item.querySelector('.qta').value; mine=t;
      if(q.self){ part = null; }
      else {
        var keys = q.key||[], hit = keys.filter(function(k){ return norm(t).indexOf(norm(k))>=0; }).length;
        part = keys.length? hit/keys.length : (t.trim().length>20?1:0);
        ok = part>=0.6;
      }
    }
    answers[i]=mine;
    if(part!==null){ max+=1; got+=part; if(part<1) wrong.push(i); }

    var badge = part===null? '<span class="rb self">자유 답변</span>'
              : (part>=1? '<span class="rb o">정답</span>'
              : (part>0? '<span class="rb p">부분 '+Math.round(part*100)+'%</span>' : '<span class="rb x">오답</span>'));
    var ansHtml='';
    if(q.t==='blank') ansHtml = '<div class="ra"><b>정답</b> '+esc(q.a[0])+'</div>';
    else if(q.t==='choice') ansHtml = '<div class="ra"><b>정답</b> '+(q.a+1)+'번 — '+q.c[q.a]+'</div>';
    else if(q.t==='multi') ansHtml = '<div class="ra"><b>정답</b> '+q.a.map(function(a){return (a+1)+'번';}).join(' · ')+'</div>';
    else if(!q.self) ansHtml = '<div class="ra"><b>모범답안</b> '+q.model+'</div>'+
        ((q.key&&q.key.length)?'<div class="rk">필수 키워드 — '+q.key.map(function(k){
          return '<span class="'+((norm(mine).indexOf(norm(k))>=0)?'hit':'miss')+'">'+esc(k)+'</span>';
        }).join('')+'</div>':'');
    else ansHtml = '<div class="ra"><b>참고 답안</b> '+q.model+'</div>';

    res.className='qres show '+(part===null?'self':(part>=1?'ok':(part>0?'part':'no')));
    res.innerHTML = badge + ansHtml + '<div class="rw">'+q.why+'</div>'+
      (q.ref? '<a class="rl" href="'+q.ref+'">→ 해당 화면에서 다시 보기</a>':'');
  });
  var pct = max? Math.round(got/max*100) : 0;
  var db=tload(); db[who]=db[who]||{attempts:[]};
  db[who].attempts.push({id:s.id, n:s.n, cat:s.cat, score:Math.round(got*10)/10, max:max, pct:pct,
                         date:new Date().toISOString().slice(0,10), wrong:wrong});
  tsave(db);
  if(window.SYNC) SYNC.pushScore({name:who, id:s.id, n:s.n, cat:s.cat,
    score:Math.round(got*10)/10, max:max, pct:pct, wrong:wrong});
  var box=document.createElement('div');
  box.className='score '+(pct>=80?'good':(pct>=60?'mid':'bad'));
  box.innerHTML = '<div class="sp">'+pct+'<i>점</i></div>'+
    '<div class="sd"><b>'+esc(who)+'</b> · '+esc(s.n)+'<br>'+
    Math.round(got*10)/10+' / '+max+' 문항'+(wrong.length?' · 틀린 문항 '+wrong.map(function(w){return (w+1);}).join(', '):' · 전부 정답')+'</div>'+
    (pct>=80?'<div class="sm">통과 — 이 영역은 실전에서 써도 됩니다.</div>'
     :(pct>=60?'<div class="sm">조금 더. 틀린 문항의 해설과 링크를 따라가 보세요.</div>'
     :'<div class="sm">해당 LEVEL을 다시 읽고 재응시하세요. 점수는 최고점만 기록됩니다.</div>'));
  var form=document.getElementById('qform');
  form.parentNode.insertBefore(box, form);
  window.scrollTo(0, 0);
}

function loadTeam(){
  if(!window.SYNC){ TEAMDB = tload(); route(); return; }
  SYNC.check().then(function(ok){
    return ok ? SYNC.pullTeam() : null;
  }).then(function(rows){
    TEAMDB = mergeTeam(rows);
    if(CURHASH==='TEAM') document.getElementById('view').innerHTML = renderTeam();
  }).catch(function(){ TEAMDB = tload(); });
}
function syncBadge(){
  var st = window.SYNC ? SYNC.state : null;
  if(!st) return '';
  if(st.ok === true)  return '<span class="sync on">서버 연결됨 · 팀 전체 기록</span>';
  if(st.ok === false) return '<span class="sync off">서버 미연결 · 이 기기 기록만 표시</span>'+
    '<a class="btn p sm" href="#GUIDE" style="text-decoration:none">서버 연결하기 (버튼 3번)</a>';
  return '<span class="sync wait">서버 확인 중…</span>';
}
function renderTeam(){
  var db = TEAMDB || tload(), names=Object.keys(db);
  var h = '<div class="hd"><div class="kick">테스트</div><h2>팀 현황</h2>'+
    '<div class="sub">사람별 · 시험별 최고점</div></div>'+
    '<div class="syncbar">'+syncBadge()+
      '<button class="btn o sm" id="syncpush">이 기기 기록 서버로 올리기</button>'+
      '<button class="btn o sm" id="syncpull">새로고침</button></div>';
  if(!names.length) return h+'<div class="cal warn">아직 응시 기록이 없습니다.</div>'+
    '<div class="done-btn"><a class="btn p" href="#TEST" style="text-decoration:none">← 테스트로</a></div>'+footer();
  h += '<div class="tw"><table><thead><tr><th>이름</th>'+
    QUIZ.map(function(s){return '<th>'+esc(s.id)+'</th>';}).join('')+'<th>평균</th></tr></thead><tbody>'+
    names.map(function(n){
      var sum=0, cnt=0;
      var tds = QUIZ.map(function(s){
        var b=best(s.id,n);
        if(b){ sum+=b.pct; cnt++; }
        return '<td style="text-align:center">'+(b?'<span class="sc'+(b.pct>=80?' g':(b.pct>=60?' o':' r'))+'">'+b.pct+'</span>':'<span class="sc n">–</span>')+'</td>';
      }).join('');
      var avg = cnt? Math.round(sum/cnt) : 0;
      return '<tr><td><b>'+esc(n)+'</b></td>'+tds+'<td style="text-align:center"><b>'+(cnt?avg:'–')+'</b></td></tr>';
    }).join('')+'</tbody></table></div>'+
    '<div class="cal tip">'+QUIZ.map(function(s){return '<b>'+s.id+'</b> '+esc(s.n);}).join(' · ')+'</div>';
  h += '<h3 class="bh">최근 응시</h3><div class="tw"><table><thead><tr><th>날짜</th><th>이름</th><th>시험</th><th>점수</th></tr></thead><tbody>';
  var all=[]; names.forEach(function(n){ (db[n].attempts||[]).forEach(function(a){ all.push({n:n,a:a}); }); });
  all.reverse();
  h += all.slice(0,20).map(function(o){
    return '<tr><td>'+esc(o.a.date)+'</td><td>'+esc(o.n)+'</td><td>'+esc(o.a.n)+'</td>'+
      '<td><span class="sc'+(o.a.pct>=80?' g':(o.a.pct>=60?' o':' r'))+'">'+o.a.pct+'</span></td></tr>';
  }).join('')+'</tbody></table></div>';
  h += '<div class="done-btn"><a class="btn o" href="#TEST" style="text-decoration:none">← 테스트로</a>'+
       '<button class="btn o" id="tclear">이 기기 기록 전부 지우기</button></div>';
  return h+footer();
}

function surgTables(q){
  q = (q||'').trim();
  var out = '', hit = 0;
  SURG.groups.forEach(function(g){
    var rows = g.items.filter(function(it){
      return !q || (it.n+' '+it.t+' '+it.sub+' '+g.g).indexOf(q) >= 0;
    });
    if(!rows.length) return;
    hit += rows.length;
    out += '<div class="sggrp"><div class="sgh">'+esc(g.g)+
      (g.note?'<em>'+esc(g.note)+'</em>':'')+'</div>'+
      '<div class="tw"><table class="sgt"><thead><tr><th style="width:64px">번호</th><th>수술명</th><th style="width:64px">종</th></tr></thead><tbody>'+
      rows.map(function(it){
        return '<tr><td class="sgn">'+esc(it.n)+'</td><td><b>'+esc(it.t)+'</b>'+
          (it.sub?'<div class="sgs">'+esc(it.sub)+'</div>':'')+'</td>'+
          '<td><span class="sgk k'+it.k+'">'+it.k+'</span></td></tr>';
      }).join('')+'</tbody></table></div></div>';
  });
  if(!hit) return '<div class="cal warn">「'+esc(q)+'」에 해당하는 항목이 표에 <b>없습니다</b>. 표에 없으면 1-5종으로는 지급되지 않습니다 — 1-7종 · 질병수술비 쪽을 확인하세요.</div>';
  return (q?'<div class="sgcnt">'+hit+'개 항목</div>':'')+out;
}

function hl(txt,q){
  var i = txt.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(txt.slice(0,110))+(txt.length>110?'…':'');
  var a=Math.max(0,i-42), b=Math.min(txt.length,i+q.length+78);
  return (a>0?'…':'')+esc(txt.slice(a,i))+'<mark>'+esc(txt.slice(i,i+q.length))+'</mark>'+esc(txt.slice(i+q.length,b))+(b<txt.length?'…':'');
}
function renderSearch(q){
  q = (q||'').trim();
  var h = '<div class="hd"><div class="kick">검색</div><h2>“'+esc(q)+'”</h2></div>';
  if(q.length<1) return h+'<div class="snone">검색어를 입력하세요</div>';
  var ql = q.toLowerCase();
  var qs = ql.replace(/\s+/g,'');                     // 띄어쓰기 무시용
  var toks = ql.split(/\s+/).filter(function(t){return t.length>0;});
  var res = buildIndex().map(function(r){
    var tl = r.t.toLowerCase(), bl = r.b.toLowerCase();
    var ti = tl.indexOf(ql), bi = bl.indexOf(ql), sc = 0;
    if(ti>=0) sc += 100-Math.min(ti,90);
    if(bi>=0) sc += 20;
    if(sc===0 && qs.length>1){                        // 「숨은보험금」→「숨은 보험금」
      var tn = tl.replace(/\s+/g,''), bn = bl.replace(/\s+/g,'');
      if(tn.indexOf(qs)>=0) sc += 80;
      else if(bn.indexOf(qs)>=0) sc += 16;
    }
    if(sc===0 && toks.length>1){                      // 여러 단어를 모두 포함
      var all = toks.every(function(t){ return tl.indexOf(t)>=0 || bl.indexOf(t)>=0; });
      if(all) sc += 12;
    }
    return sc? {r:r, sc:sc} : null;
  }).filter(Boolean).sort(function(a,b){return b.sc-a.sc;}).slice(0,60);
  if(!res.length) return h+'<div class="snone">결과가 없습니다.<br><span style="font-size:12.5px">예: 뇌경색 · 협심증 · 1-7종 · 배액술 · 산정특례 · 유사암 · CDR</span></div>';
  h += '<div class="mini">'+res.length+'건</div><div class="sres">'+res.map(function(o){
    return '<a class="sr" href="'+o.r.h+'"><span class="srk '+o.r.k+'">'+o.r.k+'</span>'+
      '<h4>'+hl(o.r.t,q)+'</h4><p>'+hl(o.r.b,q)+'</p></a>';
  }).join('')+'</div>';
  return h+footer();
}

      box.classList.add('ans');
      Array.prototype.forEach.call(box.querySelectorAll('.op'), function(b,j){
        if(j===ans) b.classList.add('ok'); else if(j===pick) b.classList.add('no');
      });
      return;
    }
    // copy script
    if(t.matches('.cp') && c){
      var s = c.scripts[+t.dataset.cp];
      var txt = '['+s.k+']\n'+(s.q==='—'?'':'고객: '+s.q+'\n')+'나: '+s.a.replace(/<[^>]+>/g,'');
      navigator.clipboard && navigator.clipboard.writeText(txt).then(function(){ t.textContent='복사됨'; setTimeout(function(){t.textContent='복사';},1200); });
      return;
    }
    // done
    if(t.id==='dbtn' && c){
      state.done[c.id] = !state.done[c.id]; save(); buildNav();
      if(window.SYNC && tname()) SYNC.pushProgress(tname(), state.done);
      t.textContent = state.done[c.id] ? '● 학습 완료됨 (취소)' : '이 레벨 학습 완료로 표시';
      t.className = 'btn '+(state.done[c.id]?'o':'g');
      return;
    }
    // lightbox
    var im = t.closest('.fig img, .gal figure');
    if(im){
      var el = t.tagName==='IMG' ? t : im.querySelector('img');
      if(el){ document.getElementById('lbi').src = el.src;
        document.getElementById('lbc').textContent = el.dataset.cap || '';
        document.getElementById('lb').classList.add('on'); }
      return;
    }
    if(t.closest('#srcnav')){ var sb=t.closest('#srcnav button'); if(sb) paintSrc(sb.dataset.c, undefined); return; }
    if(t.id==='whoset'){ var vv=document.getElementById('whoin').value.trim(); if(vv){ tsetname(vv); route(); } return; }
    var wp=t.closest('.pill.who');
    if(wp){ tsetname(wp.dataset.n); route(); return; }
    if(t.id==='qgrade'){ if(QSET) gradeQuiz(QSET); return; }
    if(t.id==='stepOpen' || t.id==='sqlcopy'){
      var copied = copySQL();
      var after = copied ? Promise.resolve(true)
        : (navigator.clipboard ? navigator.clipboard.writeText(SUPA_SQL).then(function(){return true;})
                                  .catch(function(){return false;})
                               : Promise.resolve(false));
      if(t.id==='sqlcopy'){
        after.then(function(ok){
          setMsg(ok?'ok':'no', ok
            ? 'SQL 이 <b>복사됐습니다</b> — Supabase SQL Editor 에 붙여넣고 Run 하세요.'
            : '복사가 막혀 있습니다. 아래 상자를 <b>클릭하면 전체 선택</b>되니 Ctrl+C 하세요.');
        });
        return;
      }
      var det=document.querySelector('.sqldet'); if(det) det.open = true;
      after.then(function(ok){ openSqlTab(ok); });
      return;
    }
    if(t.id==='stepCheck'){
      setMsg('wait','확인 중…');
      SYNC.check().then(function(ok){
        if(ok){ stepDone(2); setMsg('ok','서버 연결됐습니다. 이제 팀원이 어느 기기에서 응시해도 <a href="#TEAM">팀 현황</a> 에 모입니다.'); }
        else setMsg('no','아직 미연결 — '+esc(SYNC.state.msg)+'<br>①에서 연 탭에서 <b>Run</b> 을 눌렀는지 확인하고 다시 눌러주세요.');
      });
      return;
    }
    if(t.id==='stepPush'){
      setMsg('wait','올리는 중…');
      SYNC.check().then(function(ok){ return ok? SYNC.pushAllLocal(tload()) : -1; })
        .then(function(n){
          if(n<0) setMsg('no','서버에 연결되지 않았습니다 — '+esc(SYNC.state.msg));
          else { stepDone(3); setMsg('ok', n+'건을 서버로 올렸습니다. <a href="#TEAM">팀 현황</a> 에서 확인하세요.'); }
        });
      return;
    }
    if(t.id==='syncpull'){ loadTeam(); return; }
    if(t.id==='syncpush'){
      if(!window.SYNC) return;
      t.textContent='올리는 중…';
      SYNC.check().then(function(ok){ return ok? SYNC.pushAllLocal(tload()) : -1; })
        .then(function(n){
          alert(n<0 ? ('서버에 연결되지 않았습니다.\n' + SYNC.state.msg) : (n+'건을 서버로 올렸습니다.'));
          loadTeam();
        });
      return;
    }
    if(t.id==='tclear'){ if(confirm('이 기기의 테스트 기록을 전부 지웁니다. 되돌릴 수 없습니다.')){ tsave({}); route(); } return; }
    // disease card
    var dzc = t.closest('.dzcard');
    if(dzc){ location.hash = 'DZ-'+dzc.dataset.i; return; }
    // disease category
    if(t.closest('#dznav')){
      var db = t.closest('#dznav button'); if(db) paintDzGrid(db.dataset.c); return;
    }
    // procedure step
    if(t.closest('.proc3d .pn')){
      var pb = t.closest('.proc3d .pn button'); if(!pb) return;
      var box = pb.closest('.proc3d'), k = +pb.dataset.k;
      Array.prototype.forEach.call(box.querySelectorAll('.pn button'), function(b,j){ b.classList.toggle('on', j===k); });
      Array.prototype.forEach.call(box.querySelectorAll('.pf'), function(f,j){ f.classList.toggle('on', j===k); });
      return;
    }
    // Q&A
    var qa = t.closest('.qa .qh');
    if(qa){ qa.parentElement.classList.toggle('open'); return; }
    // analysis nav
    if(t.closest('#adnav')){
      var ab = t.closest('#adnav button'); if(ab) paintAnalysis(+ab.dataset.i); return;
    }
    // design card
    var dc = t.closest('.dcard');
    if(dc){ location.hash = 'DS-'+dc.dataset.i; return; }
    // lesson nav
    if(t.closest('.lsn-nav')){
      var lb = t.closest('.lsn-nav button'); if(lb) paintLesson(+lb.dataset.i); return;
    }
    // term card
    var tc = t.closest('.tcard');
    if(tc){ location.hash = 'T-'+tc.dataset.i; return; }
    // gallery tabs
    if(t.closest('#galtab')){
      var gb = t.closest('#galtab button'); if(gb) paintGal(gb.dataset.g); return;
    }
    // drill answer toggle
    var dli = t.closest('.drill li');
    if(dli){
      dli.classList.toggle('open');
      var tg = dli.querySelector('.tog');
      if(tg) tg.textContent = dli.classList.contains('open') ? '접기 ▴' : '답 보기 ▾';
      return;
    }
    // case selector
    if(t.closest('#csel')){
      var cb = t.closest('#csel button'); if(cb) paintCase(+cb.dataset.i);
      return;
    }
    // db filter
    if(t.matches('#filt button')){
      Array.prototype.forEach.call(v.querySelectorAll('#filt button'), function(b){b.classList.toggle('on', b===t);});
      paintDB(t.dataset.c);
      return;
    }
  });
}
function drawer(on){
  document.getElementById('side').classList.toggle('open', on);
  document.getElementById('scrim').classList.toggle('on', on);
}
document.getElementById('mo').addEventListener('click', function(){
  drawer(!document.getElementById('side').classList.contains('open'));
});
document.getElementById('scrim').addEventListener('click', function(){ drawer(false); });
document.addEventListener('input', function(e){
  if(e.target && e.target.id==='srcq'){ paintSrc(undefined, e.target.value); return; }
  if(e.target && e.target.id==='sgq'){
    var b = document.getElementById('sgbody');
    if(b) b.innerHTML = surgTables(e.target.value);
  }
});
window.addEventListener('hashchange', route);
(function(){
  var qi = document.getElementById('q'), tmr;
  qi.addEventListener('input', function(){
    clearTimeout(tmr);
    tmr = setTimeout(function(){
      LASTQ = qi.value;
      if(LASTQ.trim().length>0){
        if(location.hash==='#SEARCH') document.getElementById('view').innerHTML = renderSearch(LASTQ);
        else location.hash = 'SEARCH';
      }
    }, 220);
  });
  qi.addEventListener('keydown', function(e){ if(e.key==='Escape'){ qi.value=''; history.back(); } });
  var lb = document.getElementById('lb');
  lb.addEventListener('click', function(){ lb.classList.remove('on'); document.getElementById('lbi').src=''; });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') lb.classList.remove('on'); });
})();
buildNav(); bind(); route();
})();
</script>
</body>
</html>

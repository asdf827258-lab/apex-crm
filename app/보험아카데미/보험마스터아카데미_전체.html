<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보험 마스터 아카데미 — 신입 자가학습 과정</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ═══════════ 3D 수업 씬 ═══════════ */
.lsn-nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
.lsn-nav button{font:inherit;font-size:13.5px;font-weight:700;border:0;background:#fff;border-radius:14px;padding:12px 16px;cursor:pointer;color:var(--ink2);line-height:1.35;text-align:left;box-shadow:var(--sh)}
.lsn-nav button b{display:block;font-size:11.5px;color:var(--blue);letter-spacing:0;margin-bottom:2px}
.lsn-nav button.on{background:var(--blue);border-color:transparent;color:#fff}
.lsn-nav button.on b{color:#cfe4ff}

.teach{display:flex;gap:16px;align-items:flex-start;background:linear-gradient(135deg,#3182f6,#1b64da);
  color:#fff;border-radius:20px;padding:24px 26px;margin-bottom:20px;box-shadow:0 10px 30px rgba(14,27,48,.22)}
.teach .av{flex:none;width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.22);
  display:grid;place-items:center;font-size:22px;box-shadow:0 4px 14px rgba(201,162,39,.4)}
.teach .tw2{flex:1}
.teach .tw2 b{display:block;font-size:11px;letter-spacing:.18em;color:var(--gold2);margin-bottom:5px}
.teach .tw2 p{font-size:17px;line-height:1.75;margin:0;font-weight:500}

.sc3d{perspective:1400px;background:linear-gradient(180deg,#f9fafb 0%,#f2f4f6 100%);border:0;border-radius:24px;padding:34px 20px 16px;margin-bottom:22px;overflow:hidden;position:relative}
.sc3d .stage{transform-style:preserve-3d;position:relative;min-height:300px;
  display:flex;align-items:center;justify-content:center}
.sc3d .cap{text-align:center;font-size:13px;color:var(--ink3);margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}

/* ── 01 항아리 ── */
.s-pot .stage{min-height:330px}
.s-pot .floor{position:absolute;bottom:26px;left:50%;transform:translateX(-50%) rotateX(74deg);
  width:520px;height:220px;border-radius:50%;background:radial-gradient(ellipse,#c9d3e5 0%,rgba(201,211,229,0) 70%)}
.s-pot .pot{position:relative;width:132px;height:120px;transform:translateZ(40px);animation:flt 4.5s ease-in-out infinite}
.s-pot .pot-body{position:absolute;inset:14px 0 0;border-radius:14px 14px 50% 50%/10px 10px 62px 62px;
  background:linear-gradient(160deg,#b4794a,#8a5730 46%,#6d422238 100%),linear-gradient(#a06b41,#7d4f2c);
  box-shadow:inset -14px -10px 26px rgba(0,0,0,.28),inset 12px 8px 20px rgba(255,255,255,.16),0 16px 26px rgba(60,35,15,.3)}
.s-pot .pot-lip{position:absolute;top:4px;left:50%;transform:translateX(-50%) rotateX(66deg);
  width:112px;height:36px;border-radius:50%;background:linear-gradient(#8a5730,#4e2f19);
  box-shadow:0 0 0 6px #a06b41,inset 0 4px 10px rgba(0,0,0,.5)}
.s-pot .pot-shine{position:absolute;top:32px;left:22px;width:20px;height:52px;border-radius:50%;
  background:linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,0));filter:blur(2px)}
.s-pot .coins{position:absolute;inset:0;pointer-events:none}
.s-pot .coins i{position:absolute;left:50%;top:52%;width:19px;height:19px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#ffe89a,#d9a520 58%,#a97c12);
  box-shadow:0 2px 5px rgba(0,0,0,.3);animation:toss 3.6s cubic-bezier(.4,0,.5,1) infinite;animation-delay:var(--d)}
@keyframes toss{0%{transform:translate(var(--x),42px) scale(.85);opacity:0}
 18%{opacity:1}70%{transform:translate(calc(var(--x)*.1),-52px) scale(1)}
 88%{transform:translate(0,4px) scale(.7);opacity:1}100%{transform:translate(0,10px) scale(.5);opacity:0}}
.s-pot .folk{position:absolute;bottom:44px;left:50%;width:0}
.s-pot .folk b{position:absolute;left:var(--l);bottom:0;width:22px;height:46px;border-radius:11px 11px 4px 4px;
  background:linear-gradient(#93a5c2,#5d6f90);
  box-shadow:0 6px 12px rgba(40,55,85,.25)}
.s-pot .folk b:before{content:'';position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  width:15px;height:15px;border-radius:50%;background:#93a5c2}
.s-pot .folk b.hit{background:linear-gradient(#e58f6a,#c05f3c)}
.s-pot .folk b.hit:before{background:#e58f6a}
.s-pot .rain{position:absolute;bottom:96px;left:calc(50% + 56px);width:44px;height:60px}
.s-pot .rain s{position:absolute;top:0;left:calc(var(--i)*11px);width:2px;height:11px;border-radius:2px;
  background:#7fa8dd;animation:drop 1.1s linear infinite;animation-delay:calc(var(--i)*.22s);text-decoration:none}
@keyframes drop{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(52px);opacity:0}}

/* ── 02 놀이공원 ── */
.s-park .stage{gap:16px;flex-wrap:wrap;min-height:300px}
.s-park .tkt{width:132px;padding:16px 12px;border-radius:14px;color:#fff;text-align:center;
  transform:rotateY(16deg) rotateX(6deg);box-shadow:-10px 14px 26px rgba(20,35,60,.26);animation:flt 5s ease-in-out infinite}
.s-park .tkt-a{background:linear-gradient(150deg,#3182f6,#1b64da)}
.s-park .tkt-b{background:linear-gradient(150deg,#d05a5a,#95302f);transform:rotateY(-16deg) rotateX(6deg);animation-delay:.6s}
.s-park .tkt .tk-t{display:block;font-size:14px;font-weight:800}
.s-park .tkt .tk-s{display:block;font-size:11px;opacity:.82;margin:2px 0 9px}
.s-park .tkt em{display:inline-block;font-style:normal;font-size:12px;font-weight:800;background:rgba(255,255,255,.22);
  border-radius:20px;padding:3px 12px}
.s-park .gate{width:176px;border-radius:14px;overflow:hidden;background:#fff;
  box-shadow:0 14px 30px rgba(30,45,75,.18);transform:translateZ(30px)}
.s-park .gate .g-top{background:#4e5968;color:#fff;font-size:12.5px;font-weight:800;padding:8px;text-align:center}
.s-park .g-ok .g-top{background:#02a678}
.s-park .g-no .g-top{background:#f04452}
.s-park .gate .g-body{padding:14px 12px;text-align:center}
.s-park .gate .chk,.s-park .gate .xx{font-size:30px;font-weight:800;display:block;margin-bottom:6px}
.s-park .gate .chk{color:#02a678}.s-park .gate .xx{color:#f04452}
.s-park .gate p{font-size:12.4px;color:#4e5968;line-height:1.55;margin-bottom:8px}
.s-park .gate b{font-size:12.6px;color:#191f28}
.s-park .gate b.red{color:#f04452}

/* ── 03 실손 vs 정액 ── */
.s-two .stage{gap:20px;flex-wrap:wrap}
.s-two .box{width:290px;background:#fff;border-radius:16px;overflow:hidden;
  box-shadow:0 16px 34px rgba(25,40,70,.16);transform:rotateY(9deg) translateZ(20px)}
.s-two .box-r{transform:rotateY(-9deg) translateZ(20px)}
.s-two .bx-h{background:linear-gradient(120deg,#3182f6,#1b64da);color:#fff;font-weight:800;font-size:15px;padding:11px;text-align:center}
.s-two .bx-h.alt{background:linear-gradient(120deg,#3182f6,#a07d10)}
.s-two .bx-b{display:flex;align-items:center;justify-content:center;gap:10px;padding:22px 14px;background:#f7f9fc}
.s-two .rcpt{width:56px;height:70px;background:#fff;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.14);padding:9px 7px}
.s-two .rcpt i{display:block;height:4px;border-radius:2px;background:#d1d6db;margin-bottom:6px}
.s-two .rcpt i:nth-child(2){width:70%}.s-two .rcpt i:nth-child(4){width:50%}
.s-two .arw{font-size:20px;color:#8b95a1}
.s-two .cashout{width:76px;height:52px;border-radius:8px;background:linear-gradient(#02a678,#00806a);
  color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:800;box-shadow:0 6px 14px rgba(30,110,70,.3)}
.s-two .evt{width:60px;height:60px;border-radius:50%;background:linear-gradient(#ff6b6b,#f04452);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800;box-shadow:0 6px 14px rgba(150,35,25,.3)}
.s-two .env{width:96px;padding:11px 8px;border-radius:8px;background:linear-gradient(#f5d97a,#d9a520);
  text-align:center;box-shadow:0 6px 14px rgba(160,120,15,.3)}
.s-two .env b{display:block;font-size:16px;color:#4a3505}
.s-two .env span{font-size:10.5px;color:#6b5310}
.s-two .bx-f{padding:13px 15px;font-size:12.8px;color:#4e5968;line-height:1.6;text-align:center}
.s-two .bx-f small{display:block;color:#8b95a1;margin-top:4px;font-size:11.5px}

/* ── 04 뇌 3겹 ── */
.s-nest .stage{flex-direction:column;gap:20px}
.s-nest .ring{border-radius:50%;display:grid;place-items:center;position:relative;
  box-shadow:0 14px 30px rgba(30,45,75,.14),inset 0 2px 10px rgba(255,255,255,.6)}
.s-nest .r3{width:280px;height:280px;background:linear-gradient(150deg,#e8f3ff,#c9e2ff);transform:rotateX(52deg);animation:flt 6s ease-in-out infinite}
.s-nest .r2{width:200px;height:200px;background:linear-gradient(150deg,#b8d9ff,#8bbdfa)}
.s-nest .r1{width:124px;height:124px;background:linear-gradient(150deg,#8bbdfa,#6ba6f9)}
.s-nest .core{width:70px;height:70px;border-radius:50%;background:linear-gradient(150deg,#ff6b6b,#d63846);
  color:#fff;display:grid;place-items:center;text-align:center;line-height:1.2;box-shadow:0 6px 16px rgba(140,25,20,.4)}
.s-nest .core b{font-size:16px}.s-nest .core span{font-size:9.5px;opacity:.85}
.s-nest .rl{position:absolute;top:6px;left:50%;transform:translateX(-50%) rotateX(-52deg);
  font-size:10.5px;font-weight:800;color:#191f28;white-space:nowrap;background:rgba(255,255,255,.9);
  padding:2px 8px;border-radius:20px}
.s-nest .rl b{color:#1b64da}
.s-nest .pcts{width:100%;max-width:420px;display:grid;gap:8px}
.s-nest .pc{display:flex;align-items:center;gap:10px}
.s-nest .pc i{height:14px;border-radius:7px;background:linear-gradient(90deg,#6ba6f9,#1b64da);width:var(--w);
  min-width:26px;box-shadow:0 3px 8px rgba(26,74,150,.3)}
.s-nest .pc span{font-size:12.4px;color:#4e5968;white-space:nowrap}
.s-nest .pc b{color:#333d4b}

/* ── 05 심장 마트료시카 ── */
.s-heart .stage{flex-direction:column;gap:22px}
.s-heart .dolls{display:flex;align-items:flex-end;gap:-10px;transform-style:preserve-3d}
.s-heart .doll{border-radius:50% 50% 44% 44%/58% 58% 42% 42%;display:grid;place-items:center;
  text-align:center;color:#fff;margin-right:-22px;box-shadow:0 14px 26px rgba(30,45,75,.22);
  animation:flt 5.5s ease-in-out infinite}
.s-heart .doll span{font-size:10.5px;line-height:1.45;padding:0 8px}
.s-heart .doll b{font-size:11px}
.s-heart .d4{width:150px;height:186px;background:linear-gradient(160deg,#8b95a1,#4e5968);animation-delay:0s}
.s-heart .d3{width:126px;height:158px;background:linear-gradient(160deg,#6ba6f9,#2f5fa8);animation-delay:.3s}
.s-heart .d2{width:104px;height:132px;background:linear-gradient(160deg,#ffa842,#ff8a00);animation-delay:.6s}
.s-heart .d1{width:84px;height:108px;background:linear-gradient(160deg,#ff6b6b,#d63846);margin-right:0;animation-delay:.9s}
.s-heart .hbar{width:100%;max-width:430px;display:grid;gap:8px}
.s-heart .hb{display:flex;align-items:center;gap:10px}
.s-heart .hb i{height:15px;border-radius:8px;width:var(--w);background:var(--c);min-width:30px;
  box-shadow:0 3px 8px rgba(0,0,0,.18)}
.s-heart .hb span{font-size:12.4px;color:#4e5968;white-space:nowrap}
.s-heart .hb b{color:#333d4b}

/* ── 06 열쇠 ── */
.s-key .stage{gap:24px;flex-wrap:wrap;align-items:stretch}
.s-key .kcol{display:grid;gap:12px}
.s-key .keycard{width:236px;background:#fff;border-radius:18px;padding:20px 22px;box-shadow:var(--sh);transform:rotateY(11deg);border-top:4px solid;border:0}
.s-key .k5{border-color:#1b64da}.s-key .k7{border-color:#ff8a00}
.s-key .keycard b{font-size:17px;color:#333d4b}
.s-key .keycard span{display:block;font-size:11.5px;color:#8b95a1;margin-bottom:9px}
.s-key .keycard ul{list-style:none;margin-bottom:9px}
.s-key .keycard li{font-size:12.4px;color:#4e5968;padding-left:13px;position:relative;margin-bottom:4px}
.s-key .keycard li:before{content:'';position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:#3182f6}
.s-key .keycard em{font-style:normal;font-weight:800;color:#02a678}
.s-key .keycard .warn{font-size:11.8px;background:#ffeff0;color:#c9313d;border-radius:7px;padding:7px 9px}
.s-key .dcol{display:grid;gap:10px}
.s-key .door{width:206px;background:linear-gradient(#fff,#f4f7fb);border-radius:16px;padding:16px 18px;box-shadow:var(--sh);transform:rotateY(-11deg);border:0}
.s-key .door .dn{display:block;font-size:13.5px;font-weight:800;color:#333d4b;margin-bottom:7px}
.s-key .dbadge{display:inline-block;font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;margin:0 4px 4px 0}
.s-key .dbadge.ok{background:#e7f9f2;color:#02a678}
.s-key .dbadge.no{background:#ffeff0;color:#f04452}
.s-key .door small{display:block;font-size:11px;color:#8b95a1;margin-top:2px}

/* ── 07 쿠폰 ── */
.s-cpn .stage{gap:22px;flex-wrap:wrap}
.s-cpn .coupon{width:206px;background:linear-gradient(150deg,#ffe8b0,#ffc043);border-radius:14px;padding:18px 16px;
  text-align:center;box-shadow:0 14px 28px rgba(150,120,20,.24);transform:rotateY(13deg) rotateZ(-2deg);
  position:relative;animation:flt 5s ease-in-out infinite}
.s-cpn .coupon:before,.s-cpn .coupon:after{content:'';position:absolute;top:50%;width:18px;height:18px;border-radius:50%;
  background:#f2f4f6;transform:translateY(-50%)}
.s-cpn .coupon:before{left:-9px}.s-cpn .coupon:after{right:-9px}
.s-cpn .coupon b{display:block;font-size:19px;color:#4a3505}
.s-cpn .coupon span{display:block;font-size:12px;color:#6b5310;margin:4px 0 8px}
.s-cpn .coupon em{font-style:normal;font-size:11.5px;background:rgba(255,255,255,.55);border-radius:20px;padding:3px 10px;color:#4a3505}
.s-cpn .coupon .excl{margin-top:11px;font-size:11.5px;color:#c9313d;background:rgba(255,255,255,.7);border-radius:7px;padding:6px}
.s-cpn .cmp{display:flex;gap:14px}
.s-cpn .cc{width:158px;background:#fff;border-radius:13px;overflow:hidden;box-shadow:0 12px 26px rgba(25,40,70,.15)}
.s-cpn .cch{padding:10px;text-align:center;font-size:12.8px;font-weight:800;color:#fff;background:#02a678}
.s-cpn .bad .cch{background:#f04452}
.s-cpn .cch small{display:block;font-weight:600;font-size:10.5px;opacity:.85;margin-top:2px}
.s-cpn .bar{height:120px;display:flex;align-items:flex-end;justify-content:center;padding:10px;background:#f6f8fb}
.s-cpn .bar i{width:44px;height:var(--h);border-radius:6px 6px 0 0;background:linear-gradient(#02a678,#00806a);
  box-shadow:0 -3px 10px rgba(30,110,70,.25)}
.s-cpn .bar i.r{background:linear-gradient(#ff6b6b,#d63846);box-shadow:0 -3px 10px rgba(150,35,25,.25)}
.s-cpn .ccf{padding:11px;text-align:center;font-size:11.5px;color:#8b95a1}
.s-cpn .ccf b{display:block;font-size:17px;color:#02a678;margin:2px 0}
.s-cpn .ccf b.red{color:#f04452}

/* ── 08 집 ── */
.s-house .stage{gap:26px;flex-wrap:wrap;align-items:center}
.s-house .hs{display:flex;flex-direction:column;gap:6px;transform:rotateY(-13deg) rotateX(5deg)}
.s-house .fl{width:280px;border-radius:9px;padding:11px 15px;color:#fff;box-shadow:0 8px 18px rgba(25,40,70,.2)}
.s-house .fl span{font-size:10.5px;opacity:.8;letter-spacing:.1em}
.s-house .fl b{display:block;font-size:13.5px;margin:1px 0}
.s-house .fl small{font-size:11px;opacity:.8}
.s-house .f4{background:linear-gradient(120deg,#9d9dff,#5b5bd6);width:214px;margin-left:33px}
.s-house .f3{background:linear-gradient(120deg,#3ab7d6,#0e8bad);width:248px;margin-left:16px}
.s-house .f2{background:linear-gradient(120deg,#3182f6,#96790e)}
.s-house .f1{background:linear-gradient(120deg,#3182f6,#333d4b)}
.s-house .base{width:308px;margin-left:-14px;background:linear-gradient(#333d4b,#191f28);color:#fff;
  border-radius:0 0 12px 12px;padding:10px;text-align:center;font-size:12.5px;box-shadow:0 12px 24px rgba(20,30,50,.3)}
.s-house .cutorder{position:relative;padding-left:8px}
.s-house .ct{font-size:12.5px;color:#4e5968;line-height:1.6;background:#fff;border-radius:10px;padding:11px 14px;
  box-shadow:0 8px 18px rgba(25,40,70,.12);margin-bottom:8px}
.s-house .ct b{color:#f04452}
.s-house .ar4,.s-house .ar3,.s-house .ar2{font-size:19px;color:#f04452;text-align:center;line-height:1}
.s-house .ar3{opacity:.66}.s-house .ar2{opacity:.4}

/* ── 스텝 · 화법 ── */
.stp{counter-reset:sp;margin-bottom:20px}
.stp li{list-style:none;position:relative;padding:22px 26px 22px 66px;background:#fff;border:0;border-radius:20px;margin-bottom:10px;box-shadow:var(--sh)}
.stp li:before{counter-increment:sp;content:counter(sp);position:absolute;left:22px;top:22px;width:30px;height:30px;border-radius:10px;background:var(--blue-l);color:var(--blue-d);font-size:14px;font-weight:800;display:grid;place-items:center}
.stp li h4{font-size:18px;font-weight:800;letter-spacing:-.035em;margin-bottom:8px;color:var(--ink)}
.stp li p{font-size:16px;line-height:1.8;margin:0;color:var(--ink2)}
.lsn-talk{background:#fff;border:0;border-radius:20px;padding:24px 26px;margin-bottom:18px;box-shadow:var(--sh2)}
.lsn-talk .lt{font-size:12px;letter-spacing:0;font-weight:800;color:var(--blue);margin-bottom:10px}
.lsn-talk .lq{font-size:14.4px;color:var(--ink2);padding-left:30px;position:relative;margin-bottom:10px}
.lsn-talk .lq:before{content:'고객';position:absolute;left:0;top:1px;font-size:10.5px;font-weight:800;color:var(--ink3)}
.lsn-talk .la{font-size:16.5px;line-height:1.85;padding-left:30px;position:relative}
.lsn-talk .la:before{content:'나';position:absolute;left:0;top:2px;font-size:10.5px;font-weight:800;color:var(--gold)}
.lsn-one{background:var(--ink);color:#fff;border-radius:20px;padding:22px 26px;font-size:17.5px;font-weight:600;border-left:0;margin-bottom:8px;letter-spacing:-.03em}
.lsn-one span{display:block;font-size:12px;letter-spacing:0;color:var(--gold2);font-weight:700;margin-bottom:7px}

/* ═══════════ 검색 ═══════════ */
.sbox{padding:10px 16px 4px}
.sbox input{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:11px 12px 11px 34px;outline:none}
.sbox input::placeholder{color:var(--ink4)}
.sbox input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px var(--blue-l)}
.sbox{position:relative}
.sbox:before{content:'🔍';position:absolute;left:26px;top:19px;font-size:12px;opacity:.6}
.sres{margin-bottom:26px}
.sr{display:block;background:#fff;border:0;border-radius:16px;padding:18px 20px;
  margin-bottom:8px;text-decoration:none;color:inherit;transition:.14s;box-shadow:var(--sh)}
.sr:hover{border-color:transparent;box-shadow:var(--sh2);transform:translateY(-1px)}
.sr .srk{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;border-radius:20px;
  padding:2px 9px;margin-bottom:5px}
.srk.용어{background:#e8f3ff;color:#1b64da}.srk.본문{background:#f0f0ff;color:#5b5bd6}
.srk.케이스{background:#fff4e6;color:#a35a00}.srk.치료비{background:#ffeff0;color:#f04452}
.srk.화법{background:#e7f9f2;color:#02a678}.srk.수업{background:#fff8e6;color:#1957b8}
.srk.이미지{background:#f2f4f6;color:#4e5968}
.sr h4{font-size:16px;font-weight:800;letter-spacing:-.03em;margin-bottom:3px}
.sr p{font-size:14px;color:var(--ink3);line-height:1.6}
.sr mark{background:var(--blue-l);color:var(--blue-d);border-radius:4px;padding:1px 3px;font-weight:700}
.snone{text-align:center;color:var(--ink3);font-size:14px;padding:40px 0}

/* ═══════════ 용어 사전 ═══════════ */
.tgrid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-bottom:22px}
.tcard{background:#fff;border:0;border-radius:18px;padding:20px 22px;cursor:pointer;transition:.14s;box-shadow:var(--sh)}
.tcard:hover{border-color:transparent;box-shadow:var(--sh2);transform:translateY(-2px)}
.tcard .tc{font-size:11.5px;letter-spacing:0;font-weight:700;color:var(--blue);margin-bottom:3px}
.tcard h4{font-size:18px;font-weight:800;letter-spacing:-.035em;margin-bottom:6px}
.tcard p{font-size:14px;color:var(--ink3);line-height:1.6}
.tdet{background:#fff;border:0;border-radius:20px;padding:28px 30px;margin-bottom:20px;box-shadow:var(--sh)}
.tdet h3{font-size:26px;font-weight:800;letter-spacing:-.04em;margin-bottom:4px}
.tdet .tone{font-size:17px;color:var(--blue-dd);font-weight:700;background:var(--blue-l);border-radius:16px;padding:18px 20px;margin:10px 0 14px;border-left:0}
.tdet .tbody{font-size:16px;line-height:1.85;margin-bottom:14px;color:var(--ink2)}
.tdet .tmeta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.tdet .tm{font-size:12.5px;font-weight:700;background:var(--paper);border:0;border-radius:999px;padding:7px 14px;color:var(--ink2)}
.tdet .tm b{color:var(--navy2)}

/* ═══════════ 이미지 ═══════════ */
.fig{margin:0 0 18px;background:#fff;border:0;border-radius:18px;overflow:hidden;box-shadow:var(--sh)}
.fig img{width:100%;display:block;cursor:zoom-in}
.fig figcaption{font-size:13.5px;color:var(--ink3);padding:14px 18px;line-height:1.6;background:#fff}
.gal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.gal figure{margin:0;background:#fff;border:0;border-radius:16px;overflow:hidden;cursor:zoom-in;box-shadow:var(--sh)}
.gal img{width:100%;height:132px;object-fit:cover;display:block}
.gal figcaption{font-size:12px;color:var(--ink3);padding:9px 11px;line-height:1.45}
.lb{position:fixed;inset:0;background:rgba(10,18,32,.92);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:88vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb .lbx{position:absolute;top:16px;right:20px;color:#fff;font-size:30px;cursor:pointer;line-height:1}
.lb .lbc{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#cbd5e6;font-size:13px;padding:0 30px}
@media print{.lb{display:none!important}}

/* ═══════════ 질병 백과 3D ═══════════ */
.dz-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.dz-nav button{font:inherit;font-size:13.5px;font-weight:700;border:0;background:#fff;border-radius:999px;
  padding:10px 18px;cursor:pointer;color:var(--ink2);box-shadow:var(--sh)}
.dz-nav button.on{background:var(--blue);color:#fff}
.dzgrid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-bottom:10px}
.dzcard{background:#fff;border-radius:18px;padding:18px 20px;cursor:pointer;transition:.14s;box-shadow:var(--sh)}
.dzcard:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.dzcard b{display:block;font-size:17px;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
.dzcard code{font-size:12px;color:var(--blue);font-weight:700;background:var(--blue-l);
  border-radius:6px;padding:2px 7px;margin-left:6px}
.dzcard span{display:block;font-size:13.5px;color:var(--ink3);line-height:1.55;margin-top:6px}

/* 장기 3D */
.organ3d{perspective:1200px;background:linear-gradient(180deg,#f9fafb,#eef1f5);border-radius:24px;
  padding:30px 20px 18px;margin-bottom:20px;position:relative;overflow:hidden}
.organ3d .og{transform-style:preserve-3d;position:relative;min-height:270px;
  display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.organ3d .cap{text-align:center;font-size:13px;color:var(--ink3);margin-top:14px;
  padding-top:10px;border-top:1px solid var(--line)}
.ly{position:relative;border-radius:20px;box-shadow:0 18px 40px rgba(25,40,70,.16);
  display:grid;place-items:center;text-align:center;color:#fff;padding:16px;
  animation:flt 5.5s ease-in-out infinite}
.ly b{display:block;font-size:15px;font-weight:800;letter-spacing:-.03em}
.ly span{font-size:11.5px;opacity:.9;line-height:1.45}
.ly.h1{width:172px;height:206px;background:linear-gradient(155deg,#ff8f8f,#e03e4e);border-radius:46% 46% 42% 42%/54% 54% 46% 46%}
.ly.h2{width:150px;height:180px;background:linear-gradient(155deg,#7fb2f8,#2f6fd0)}
.ly.h3{width:150px;height:180px;background:linear-gradient(155deg,#9d9dff,#5b5bd6)}
.ly.h4{width:150px;height:180px;background:linear-gradient(155deg,#ffc46b,#e08b1f)}
.ly.h5{width:150px;height:180px;background:linear-gradient(155deg,#6fd6b6,#02a678)}
.ly.h6{width:150px;height:180px;background:linear-gradient(155deg,#b0b8c1,#6b7684)}
.ly.sm{width:120px;height:132px;font-size:13px}
.pinw{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;background:#fff;border-radius:999px;padding:5px 11px;font-size:11.5px;
  font-weight:700;color:var(--ink);box-shadow:var(--sh);white-space:nowrap}

/* 수술 진행 3D */
.proc3d{background:linear-gradient(180deg,#f9fafb,#eef1f5);border-radius:24px;padding:26px 22px 18px;
  margin-bottom:22px;perspective:1000px}
.proc3d .ph{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:14px;letter-spacing:.02em}
.proc3d .pv{position:relative;min-height:230px;transform-style:preserve-3d;margin-bottom:16px}
.proc3d .pf{display:none}
.proc3d .pf.on{display:block;animation:pfin .3s ease}
@keyframes pfin{from{opacity:0;transform:translateY(8px) rotateX(6deg)}to{opacity:1;transform:none}}
.proc3d .pf .pt{font-size:19px;font-weight:800;letter-spacing:-.035em;color:var(--ink);margin-bottom:6px}
.proc3d .pf .pd{font-size:15.5px;color:var(--ink2);line-height:1.75;margin-bottom:14px}
.vessel{height:96px;border-radius:48px;background:linear-gradient(180deg,#ffd2d2,#f2a0a0);
  position:relative;overflow:hidden;box-shadow:inset 0 6px 16px rgba(150,40,40,.22),var(--sh);
  transform:rotateX(12deg)}
.vessel .lumen{position:absolute;left:0;right:0;top:26px;bottom:26px;border-radius:44px;
  background:linear-gradient(180deg,#8b1f28,#c0343f);transition:.5s}
.vessel .plq{position:absolute;background:linear-gradient(#ffe9a8,#e0b957);border-radius:50%;transition:.5s}
.vessel .cath{position:absolute;top:50%;transform:translateY(-50%);height:8px;border-radius:6px;
  background:linear-gradient(90deg,#cfd6e3,#8b95a1);transition:.5s}
.vessel .bal{position:absolute;top:50%;transform:translateY(-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#c9e2ff);transition:.5s;box-shadow:0 0 0 2px #8bbdfa}
.vessel .stent{position:absolute;top:50%;transform:translateY(-50%);border-radius:8px;
  background:repeating-linear-gradient(45deg,#c9d3e5 0 5px,#8b95a1 5px 10px);opacity:0;transition:.5s}
.vessel .flow{position:absolute;top:50%;left:0;transform:translateY(-50%);width:14px;height:14px;
  border-radius:50%;background:#ff5a5a;opacity:0}
.flowing .flow{opacity:1;animation:fl 1.4s linear infinite}
@keyframes fl{from{left:-6%}to{left:104%}}
.proc3d .pn{display:flex;gap:7px;flex-wrap:wrap}
.proc3d .pn button{font:inherit;font-size:13px;font-weight:700;border:0;background:#fff;
  border-radius:12px;padding:9px 14px;cursor:pointer;color:var(--ink3);box-shadow:var(--sh)}
.proc3d .pn button.on{background:var(--blue);color:#fff}

/* Q&A */
.qa{background:#fff;border-radius:18px;box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.qa .qh{padding:18px 22px 18px 52px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;
  position:relative;line-height:1.55;letter-spacing:-.03em}
.qa .qh:before{content:'Q';position:absolute;left:22px;top:18px;color:var(--blue);font-weight:800}
.qa .qh:after{content:'▾';position:absolute;right:22px;top:19px;color:var(--ink4);font-size:13px;transition:.2s}
.qa.open .qh:after{transform:rotate(180deg)}
.qa .qb{display:none;padding:0 22px 20px 52px;font-size:15.5px;line-height:1.85;color:var(--ink2);
  position:relative}
.qa.open .qb{display:block}
.qa .qb:before{content:'A';position:absolute;left:22px;top:0;color:var(--ok);font-weight:800}

/* ===== 1~5종 수술분류표 ===== */
.sgq{display:flex;gap:14px;align-items:flex-start;background:var(--card);border-radius:16px;
  padding:16px 18px;margin:10px 0;box-shadow:var(--sh)}
.sgq b{flex:0 0 auto;min-width:52px;text-align:center;padding:6px 0;border-radius:999px;
  font-size:13.5px;font-weight:800;color:#fff}
.sgq span{font-size:14.5px;line-height:1.7;color:var(--ink2)}
.sgq b.k1{background:#8bbdfa}.sgq b.k2{background:#5aa0f7}.sgq b.k3{background:#3182f6}
.sgq b.k4{background:#1b64da}.sgq b.k5{background:#0f3f8f}
.sgsearch{margin:14px 0 6px}
.sgsearch input{width:100%;box-sizing:border-box;border:none;background:var(--card);
  border-radius:14px;padding:15px 18px;font-size:15.5px;font-family:inherit;color:var(--ink);
  box-shadow:var(--sh);outline:none}
.sgsearch input:focus{box-shadow:0 0 0 2px var(--blue),var(--sh)}
.sgcnt{font-size:13px;color:var(--ink3);font-weight:700;margin:8px 2px 12px}
.sggrp{margin:18px 0}
.sgh{font-size:15px;font-weight:800;color:var(--ink);margin:0 0 8px;padding-left:12px;
  border-left:4px solid var(--blue)}
.sgh em{display:block;font-style:normal;font-size:12.5px;font-weight:600;color:var(--ink3);margin-top:3px;line-height:1.6}
table.sgt td{vertical-align:top}
.sgn{font-variant-numeric:tabular-nums;color:var(--ink3);font-weight:700;font-size:13.5px}
.sgs{margin-top:4px;font-size:12.5px;line-height:1.65;color:var(--ink3)}
.sgk{display:inline-block;min-width:28px;text-align:center;padding:4px 0;border-radius:8px;
  font-size:13px;font-weight:800;color:#fff}
.sgk.k1{background:#8bbdfa}.sgk.k2{background:#5aa0f7}.sgk.k3{background:#3182f6}
.sgk.k4{background:#1b64da}.sgk.k5{background:#0f3f8f}
.srk.수술표{background:#eef6ff;color:#1b64da}

/* ===== 헬스케어 서비스 ===== */
.hstage{background:var(--card);border-radius:18px;padding:20px 22px 8px;margin:0 0 14px;box-shadow:var(--sh)}
.hstage .hsh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hstage .hsh b{font-size:16.5px;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
.hstage .hsh em{font-style:normal;font-size:13px;font-weight:600;color:var(--ink3)}
.hstage ul.bl{margin-bottom:14px}
.hstage .cal{margin-bottom:16px}
.srk.서비스{background:#eafaf4;color:#02795b}

/* ===== 원본 자료 검색 ===== */
.srcgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:20px}
.srccard{display:block;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--sh);
  text-decoration:none;color:inherit;transition:transform .12s}
.srccard:hover{transform:translateY(-2px)}
.srccard .th{aspect-ratio:4/3;background:var(--line2);display:grid;place-items:center;overflow:hidden}
.srccard .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.srccard .th .notxt{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ink4)}
.srccard .mt{padding:11px 13px 13px}
.srccard .mt b{display:block;font-size:13px;font-weight:800;line-height:1.4;letter-spacing:-.02em;
  color:var(--ink);margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.srccard .mt span{font-size:11px;color:var(--ink3);font-weight:600}
.srctx{background:var(--card);border-radius:16px;padding:20px 22px;box-shadow:var(--sh);margin-bottom:18px}
.srctx p{font-size:14.5px;line-height:1.75;color:var(--ink2);margin:0 0 8px}
.srctx p:last-child{margin:0}
.srk.원본{background:#f4efe6;color:#8a6a2f}
.srk.테스트{background:#efeaff;color:#5b45c9}

/* ===== 테스트 ===== */
.whobox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);
  border-radius:16px;padding:16px 18px;box-shadow:var(--sh);margin-bottom:16px}
.whobox .wl{font-size:13px;font-weight:800;color:var(--ink3)}
.whobox input{flex:1;min-width:160px;border:none;background:var(--paper);border-radius:12px;
  padding:12px 15px;font-size:15px;font-family:inherit;color:var(--ink);outline:none}
.whobox input:focus{box-shadow:0 0 0 2px var(--blue)}
.pill.who{cursor:pointer}
.pill.who:hover{background:var(--blue-l);color:var(--blue-d)}
.pill.go{text-decoration:none;background:var(--navy);color:#fff}
.qsets{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));margin-bottom:20px}
.qset{display:block;background:var(--card);border-radius:18px;padding:18px 19px;box-shadow:var(--sh);
  text-decoration:none;color:inherit;border-left:4px solid var(--line)}
.qset.done{border-left-color:var(--warn)}
.qset.pass{border-left-color:var(--ok)}
.qset .qn{font-size:16px;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
.qset .qsub{font-size:12.6px;color:var(--ink3);margin:3px 0 11px}
.qset .qm{display:flex;gap:9px;align-items:center;font-size:11.6px;color:var(--ink3);font-weight:600}
.qset .qm b{margin-left:auto;color:var(--ok);font-size:12.4px}
.qset .qm i{margin-left:auto;font-style:normal;color:var(--ink4)}
.qitem{background:var(--card);border-radius:18px;padding:20px 22px;box-shadow:var(--sh);margin-bottom:13px}
.qhd{display:flex;gap:12px;align-items:flex-start;margin-bottom:13px}
.qhd i{flex:none;width:25px;height:25px;border-radius:50%;background:var(--navy);color:#fff;
  font-style:normal;font-size:12.4px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.qtx{font-size:15.4px;line-height:1.68;font-weight:600;color:var(--ink)}
.qin{width:100%;box-sizing:border-box;border:none;background:var(--paper);border-radius:12px;
  padding:13px 16px;font-size:15.5px;font-family:inherit;color:var(--ink);outline:none}
.qin:focus{box-shadow:0 0 0 2px var(--blue)}
.qta{width:100%;box-sizing:border-box;border:none;background:var(--paper);border-radius:12px;
  padding:13px 16px;font-size:15px;font-family:inherit;line-height:1.7;color:var(--ink);outline:none;resize:vertical}
.qta:focus{box-shadow:0 0 0 2px var(--blue)}
.qopts{display:grid;gap:7px}
.qopt{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border-radius:12px;
  padding:12px 15px;cursor:pointer;font-size:14.4px;line-height:1.6;color:var(--ink2)}
.qopt:hover{background:var(--blue-ll)}
.qopt input{margin-top:3px;accent-color:var(--blue);flex:none}
.qres{display:none}
.qres.show{display:block;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.rb{display:inline-block;font-size:11.4px;font-weight:800;padding:4px 11px;border-radius:999px;margin-bottom:9px}
.rb.o{background:#e7f8f2;color:#026e51}.rb.x{background:#ffeff0;color:#c0303b}
.rb.p{background:#fff4e6;color:#a35400}.rb.self{background:var(--line2);color:var(--ink3)}
.ra{font-size:14.2px;line-height:1.72;color:var(--ink2);margin-bottom:9px}
.ra b{color:var(--ink);margin-right:6px}
.rk{font-size:12px;color:var(--ink3);margin-bottom:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rk span{padding:3px 9px;border-radius:8px;font-weight:700}
.rk .hit{background:#e7f8f2;color:#026e51}
.rk .miss{background:#ffeff0;color:#c0303b}
.rw{font-size:13.4px;line-height:1.7;color:var(--ink3);background:var(--paper);border-radius:12px;padding:12px 15px}
.rl{display:inline-block;margin-top:9px;font-size:12.6px;font-weight:800;color:var(--blue);text-decoration:none}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-radius:20px;padding:24px 26px;margin-bottom:18px;color:#fff}
.score.good{background:linear-gradient(135deg,#02a678,#028462)}
.score.mid{background:linear-gradient(135deg,#ff8a00,#d97400)}
.score.bad{background:linear-gradient(135deg,#f04452,#c9313d)}
.score .sp{font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:1}
.score .sp i{font-size:19px;font-style:normal;margin-left:3px}
.score .sd{font-size:14px;line-height:1.6;opacity:.94}
.score .sm{flex-basis:100%;font-size:13.4px;font-weight:700;background:rgba(255,255,255,.18);
  border-radius:12px;padding:11px 15px;margin-top:4px}
.sc{display:inline-block;min-width:38px;padding:4px 8px;border-radius:9px;font-size:12.6px;font-weight:800}
.sc.g{background:#e7f8f2;color:#026e51}.sc.o{background:#fff4e6;color:#a35400}
.sc.r{background:#ffeff0;color:#c0303b}.sc.n{background:var(--line2);color:var(--ink4)}

/* ===== 성장 경로 ===== */
.growhero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-radius:20px;
  padding:24px 26px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#4e5968,#333d4b)}
.growhero.s2{background:linear-gradient(135deg,#3182f6,#1b64da)}
.growhero.s3{background:linear-gradient(135deg,#ff8a00,#d97400)}
.growhero.s4{background:linear-gradient(135deg,#02a678,#028462)}
.growhero .gs{font-size:46px;font-weight:800;letter-spacing:-.05em;line-height:.9}
.growhero .gs i{display:block;font-size:11px;font-style:normal;letter-spacing:.16em;opacity:.72;margin-bottom:4px}
.growhero .gd{font-size:15px;line-height:1.62}
.growhero .gd b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.growhero .gd span{font-size:12.8px;opacity:.82}
.growhero .gp{flex-basis:100%;display:flex;gap:6px;margin-top:4px}
.growhero .gp span{flex:1;text-align:center;font-size:11.6px;font-weight:700;padding:7px 0;
  border-radius:9px;background:rgba(255,255,255,.14);opacity:.6}
.growhero .gp span.on{opacity:1;background:rgba(255,255,255,.3)}
.growhero .gp span.now{opacity:1;background:#fff;color:#191f28}
.nextone{display:block;background:var(--card);border-radius:20px;padding:22px 24px;margin-bottom:18px;
  box-shadow:var(--sh);text-decoration:none;color:inherit;border-left:5px solid var(--blue)}
.nextone .nl{font-size:11.4px;font-weight:800;letter-spacing:.08em;color:var(--blue);margin-bottom:7px}
.nextone .nt{font-size:21px;font-weight:800;letter-spacing:-.04em;color:var(--ink)}
.nextone .nd{font-size:13.4px;color:var(--ink2);margin-top:4px}
.nextone .nw{font-size:12.4px;color:var(--ink3);margin-top:9px}
.stagebox{background:var(--card);border-radius:18px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;opacity:.62}
.stagebox.now{opacity:1;box-shadow:0 0 0 2px var(--blue),var(--sh)}
.stagebox.done{opacity:.85}

<script>
/* ═══════════════════════════════════════════════════════════════
   3D 도해 라이브러리 — 코어 + 본문 도해
   사용법 : 커리큘럼 블록에  {t:"fig",x:"도해이름"}
   ═══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

/* ───────── 팔레트 ───────── */
var T = {
  b:{f:'#e8f3ff',s:'#bcd8fa',d:'#9cc4f5',t:'#1957b8'},   // 파랑
  B:{f:'#3182f6',s:'#1b64da',d:'#164c9f',t:'#ffffff'},   // 진파랑(강조)
  g:{f:'#e7f8f2',s:'#aee2cf',d:'#8fd4bb',t:'#026e51'},   // 초록
  G:{f:'#02a678',s:'#028462',d:'#016348',t:'#ffffff'},
  o:{f:'#fff4e6',s:'#f4d3a4',d:'#eabf85',t:'#a35400'},   // 주황
  O:{f:'#ff8a00',s:'#d97400',d:'#b35f00',t:'#ffffff'},
  r:{f:'#ffeff0',s:'#f8c2c7',d:'#f0a6ad',t:'#c0303b'},   // 빨강
  R:{f:'#f04452',s:'#c9313d',d:'#a52630',t:'#ffffff'},
  n:{f:'#ffffff',s:'#e5e8eb',d:'#d1d6db',t:'#333d4b'},   // 흰
  m:{f:'#f2f4f6',s:'#e0e4e8',d:'#cdd2d8',t:'#4e5968'},   // 회
  k:{f:'#333d4b',s:'#191f28',d:'#0d1117',t:'#ffffff'}    // 검정
};
var INK='#191f28', INK2='#4e5968', INK3='#8b95a1', LINE='#e5e8eb';
function esc(s){return String(s).replace(/&(?!#?\w+;)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ───────── 3D 박스 ───────── */
function box(x,y,w,h,tone,o){
  o=o||{}; var c=T[tone]||T.n, r=(o.r===0?0:(o.r||13)), z=(o.z===0?0:(o.z||5));
  var s='';
  if(z) s+='<rect x="'+(x+z)+'" y="'+(y+z)+'" width="'+w+'" height="'+h+'" rx="'+r+'" fill="'+c.d+'" opacity="'+(o.zo||.55)+'"/>';
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" fill="'+c.f+'" stroke="'+c.s+'" stroke-width="'+(o.sw||1.4)+'"/>';
  return s;
}
/* 라벨 있는 3D 박스 : 제목 + 여러 줄 */
function card(x,y,w,h,tone,title,lines,o){
  o=o||{}; var c=T[tone]||T.n, s=box(x,y,w,h,tone,o);
  var cx=x+w/2, ty=y+(o.ty||24);
  if(title) s+=tx(cx,ty,title,{size:o.ts||13.5,w:800,fill:o.tc||c.t});
  (lines||[]).forEach(function(L,i){
    s+=tx(cx, ty+(o.gap||18)+i*(o.lh||16), L, {size:o.ls||11.5,w:500,fill:o.lc||(tone==='k'||tone==='B'||tone==='R'||tone==='G'||tone==='O'?'rgba(255,255,255,.82)':INK2)});
  });
  return s;
}
/* 텍스트 */
function tx(x,y,s,o){
  o=o||{};
  return '<text x="'+x+'" y="'+y+'" text-anchor="'+(o.a||'middle')+'" '+
    'font-size="'+(o.size||12)+'" font-weight="'+(o.w||600)+'" fill="'+(o.fill||INK2)+'"'+
    (o.ls?' letter-spacing="'+o.ls+'"':'')+'>'+s+'</text>';
}
/* 화살표 */
function ar(x1,y1,x2,y2,o){
  o=o||{};
  return '<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'" stroke="'+(o.c||'#a8b0b8')+'" stroke-width="'+(o.w||2.2)+
    '" fill="none" marker-end="url(#mk)"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+'/>';
}
function ln(x1,y1,x2,y2,o){
  o=o||{};
  return '<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'" stroke="'+(o.c||LINE)+'" stroke-width="'+(o.w||3)+
    '" fill="none" stroke-linecap="round"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+'/>';
}
function wrap(vb,inner){ return '<svg viewBox="0 0 720 '+vb+'" role="img" aria-label="도해">'+inner+'</svg>'; }

/* ───────── 재사용 차트 ───────── */
/* 가로 막대 : rows=[{n,v,c,note}] */
function bars(rows, o){
  o=o||{};
  var x0=o.x0||186, W=o.W||480, top=o.top||34, bh=o.bh||30, gap=o.gap||13;
  var max=o.max||Math.max.apply(null,rows.map(function(r){return r.v;}));
  var s = o.title? tx(360,20,o.title,{size:13.5,w:800,fill:INK}):'';
  rows.forEach(function(r,i){
    var y=top+i*(bh+gap), w=Math.max(4, W*r.v/max), c=T[r.c||'B'];
    s+=tx(x0-12,y+bh/2+4,r.n,{a:'end',size:12,w:700,fill:INK});
    s+='<rect x="'+x0+'" y="'+y+'" width="'+W+'" height="'+bh+'" rx="8" fill="#f2f4f6"/>';
    s+='<rect x="'+(x0+3)+'" y="'+(y+3)+'" width="'+w+'" height="'+bh+'" rx="8" fill="'+c.d+'" opacity=".45"/>';
    s+='<rect x="'+x0+'" y="'+y+'" width="'+w+'" height="'+bh+'" rx="8" fill="'+c.f+'" stroke="'+c.s+'" stroke-width="1.2"/>';
    var inside = w>150;
    s+=tx(inside?(x0+w-12):(x0+w+10), y+bh/2+4.5, r.note||'', {a:inside?'end':'start',size:11.8,w:800,fill:inside?(c.t):INK2});
  });
  return {h: top+rows.length*(bh+gap)+4, s:s};
}
/* 단계 흐름 : items=[{t,d,c}] */
function flow(items,o){
  o=o||{};
  var n=items.length, pad=o.pad||14, W=720-pad*2, gapx=o.gapx||16;
  var w=(W-(n-1)*gapx)/n, h=o.h||96, y=o.y||34;
  var s = o.title? tx(360,20,o.title,{size:13.5,w:800,fill:INK}):'';
  items.forEach(function(it,i){
    var x=pad+i*(w+gapx);
    s+=card(x,y,w,h,it.c||'b','',[],{});
    s+=tx(x+w/2,y+24,'<tspan font-size="10.5" fill="'+INK3+'">'+(i+1)+'</tspan>',{size:10.5});
    s+=tx(x+w/2,y+44,it.t,{size:12.8,w:800,fill:T[it.c||'b'].t});
    (it.d||[]).forEach(function(d,j){ s+=tx(x+w/2,y+62+j*15,d,{size:10.8,w:500,fill:INK2}); });
    if(i<n-1) s+=ar(x+w+2,y+h/2,x+w+gapx-3,y+h/2);
  });
  return {h:y+h+8, s:s};
}
/* 타임라인 : pts=[{x%,t,d[],c}] */
function timeline(pts,o){
  o=o||{};
  var y=o.y||96, L=54, R=666;
  var s = o.title? tx(360,20,o.title,{size:13.5,w:800,fill:INK}):'';
  if(o.sub) s+=tx(360,38,o.sub,{size:11.5,w:500,fill:INK3});
  s+=ln(L,y,R,y,{w:4});
  pts.forEach(function(p){
    var x=L+(R-L)*p.p, c=T[p.c||'B'];
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+(p.big?10:8)+'" fill="'+c.f+'" stroke="'+c.s+'" stroke-width="3"/>';
    s+=tx(x,y-20,p.t,{size:12.4,w:800,fill:INK});
    (p.d||[]).forEach(function(d,j){ s+=tx(x,y+26+j*16,d,{size:11,w:500,fill:INK2}); });
  });
  return {h:y+30+(o.rows||2)*16, s:s};
}
/* 좌우 비교 */
function split(A,B,o){
  o=o||{};
  var y=o.y||34, h=o.h||o.hh||160, w=336;
  var s = o.title? tx(360,20,o.title,{size:13.5,w:800,fill:INK}):'';
  [[14,A],[370,B]].forEach(function(pair){
    var x=pair[0], D=pair[1];
    s+=box(x,y,w,h,D.c||'n',{});
    s+=tx(x+w/2,y+27,D.t,{size:14,w:800,fill:T[D.c||'n'].t});
    if(D.s) s+=tx(x+w/2,y+46,D.s,{size:11,w:600,fill:INK3});
    (D.d||[]).forEach(function(L,i){
      s+=tx(x+w/2, y+(D.s?68:56)+i*17, L, {size:11.6,w:500,fill:INK2});
    });
  });
  if(o.vs) s+=tx(360,y+h/2+5,'vs',{size:12,w:800,fill:INK3});
  return {h:y+h+8, s:s};
}
/* 매트릭스 (히트맵) : cols[], rows=[{n,v:[..]}]  v: 'O'|'D'|'X'|텍스트 */
function matrix(cols,rows,o){
  o=o||{};
  var x0=o.x0||150, W=720-x0-16, cw=W/cols.length, rh=o.rh||30, y0=o.y0||46;
  var s = o.title? tx(360,20,o.title,{size:13.5,w:800,fill:INK}):'';
  cols.forEach(function(c,i){ s+=tx(x0+cw*i+cw/2, y0-10, c, {size:11.2,w:800,fill:INK2}); });
  rows.forEach(function(r,ri){
    var y=y0+ri*rh;
    s+=tx(x0-10,y+rh/2+4,r.n,{a:'end',size:11.6,w:700,fill:INK});
    r.v.forEach(function(v,ci){
      var x=x0+cw*ci, tone = v==='O'?'g':(v==='X'?'r':(v==='△'||v==='D'?'o':'m'));
      var c=T[tone];
      s+='<rect x="'+(x+2)+'" y="'+(y+2)+'" width="'+(cw-4)+'" height="'+(rh-4)+'" rx="7" fill="'+c.f+'" stroke="'+c.s+'" stroke-width="1.1"/>';
      var lab = v==='O'?'○':(v==='X'?'×':(v==='D'?'△':v));
      s+=tx(x+cw/2,y+rh/2+4.5,lab,{size:(lab.length>2?10.4:13),w:800,fill:c.t});
    });
  });
  return {h:y0+rows.length*rh+8, s:s};
}
/* 스택 바 (예산·구성) : segs=[{n,v,c}] */
function stack(segs,o){
  o=o||{};
  var x0=o.x0||40, W=640, y=o.y||44, h=o.h||46;
  var tot=segs.reduce(function(a,b){return a+b.v;},0);
  var s = o.title? tx(360,20,o.title,{size:13.5,w:800,fill:INK}):'';
  var x=x0;
  segs.forEach(function(g,i){

 {k:"가족력 연결",q:"아버지가 위암이셨어요.",a:"그러면 이건 꼭 말씀드려야 해요. 부모가 암이면 자녀 발병률이 <b>1.8~2.9배</b>고, 위암은 특히 재발률이 <b>55%</b>입니다. 지금 암진단비는 <b>한 번 받으면 끝</b>이에요. 재발했을 때 나오는 담보를 하나 넣어두시는 게 좋겠습니다."},
 {k:"클로징 — 3안",q:"얼마나 더 내야 해요?",a:"세 가지로 만들어 왔어요. <b>A안</b>은 지금 계약 다 두고 구멍만 막는 거, 월 11만원. <b>B안</b>은 제가 권해드리는 수준으로 치료비까지 넣어서 18만원. <b>C안</b>은 여유 되실 때의 이상적인 그림이고요. 지금은 A안이나 B안 중에 고르시면 되고, C안은 <b>3년 뒤 목표</b>로 갖고 계시면 됩니다."}

drill:[
 {q:"이 고객의 암진단비 적정 규모를 '월 고정지출 × 12~24개월' 기준으로 계산해 보라. 답은 얼마인가?",
  a:"월 고정지출 295만원 기준. <b>12개월 = 3,540만원 / 24개월 = 7,080만원.</b> 현재 3,000만원이므로 <b>최소선에도 미달</b>한다. 다만 이 고객은 직장인이라 병가·상병수당 여지가 있고 배우자 소득 가능성도 있으므로, 현실적 목표는 <b>5,000만원(약 17개월치)</b>. B안에서 3,000→5,000만으로 증액한 근거가 이것이다. 자영업자라면 24개월치를 기준선으로 잡아야 한다."},
 {q:"1-8종 수술비를 1-5종으로 바꾸자고 제안할 때, 고객이 \"종 수가 줄어드는데 손해 아니에요?\"라고 물으면 어떻게 답할 것인가?",
  a:"<b>\"바꾸는 게 아니라 하나 더 얹는 겁니다.\"</b> 애초에 이 질문을 받았다면 설명이 잘못된 것이다. 1-8종을 <b>빼자고 해서는 안 된다</b>.<br><br><b>정확한 사실</b> — 1-5종은 <b>급여 · 비급여 구분 없이</b> 보상하고 <b>같은 병으로 매회 반복</b> 지급되지만 <b>절단 · 절제가 없으면 면책</b>이다. 1-8종은 ADRG 코드 기반이라 <b>급여만, 연 1회</b>지만 <b>흡인 · 천자 · 시술까지</b> 잡고 요실금 · 치핵 · 제왕절개도 보장한다.<br><br><b>답변 문장</b> — \"1-8종 그대로 두세요. 좋은 담보예요. 다만 비급여 로봇수술이나 같은 병으로 두 번 수술하는 경우는 1-8종이 못 잡습니다. 그 자리를 1-5종이 채우는 거예요. <b>둘은 경쟁이 아니라 짝꿍</b>입니다.\""},
 {q:"구실손(2세대 표준화Ⅱ)을 4세대로 전환하라고 권해야 하는가? 판단 근거로 무엇을 먼저 물어야 하는가?",
  a:"<b>권하지 않는다. 단, 결정은 고객이 한다.</b><br>먼저 물어야 할 것 — ① 최근 2년간 <b>도수치료·비급여 주사·MRI</b> 이용 횟수와 금액 ② 현재 실손 보험료와 최근 3년 인상 폭 ③ 가족 중 비급여를 자주 쓰는 사람이 있는지.<br>이 고객은 34세·내근직·특이 치료이력 없음 → 비급여 사용이 적을 가능성이 높아 4세대가 <b>보험료상 유리할 수 있다</b>. 그러나 2세대 표준화Ⅱ는 자기부담 20%로 4세대(급여20/비급여30)보다 유리하고, 재가입주기도 15년 대 5년이다. <b>보험료 부담이 크지 않다면 유지</b>가 정석. 전환은 되돌릴 수 없으므로 장단점을 서면으로 안내하고 고객이 선택하게 한다."},
 {q:"A안에서 예산이 5만원 더 줄어야 한다면 무엇을 먼저 손볼 것인가? (담보 삭제 vs 가입금액 하향)",
  a:"<b>담보를 빼지 말고 가입금액을 낮춘다.</b> 담보가 없으면 0원이지만 금액이 작아도 지급 사유는 살아 있고, 나중에 증액하는 것이 신규 가입보다 훨씬 쉽다.<br>구체적 조정 순서 — ① 뇌혈관·허혈성심장 각 2,000만 → <b>각 1,000만</b>(약 -3만) ② 1-5종 수술비 5종 500만 → <b>300만</b>(약 -1.5만) ③ 질병후유장해 5,000만 → <b>3,000만</b>(약 -1만).<br><b>절대 빼면 안 되는 것</b> — 질병후유장해 담보 자체와 뇌·심 담보의 <b>코드 범위</b>. 범위를 좁혀 절약하면(뇌혈관→뇌졸중) 정작 발생 빈도가 높은 구간에서 0원이 된다. <b>금액은 줄여도 범위는 줄이지 않는다</b>가 원칙이다."}
]
},

drill:[
 {q:"이 고객이 4세대 전환에 <b>불리한</b> 이유를 두 가지 이상 근거를 들어 설명해 보라.",
  a:"① <b>보유 조건이 압도적으로 유리하다</b> — 1세대(표준화 이전)는 자기부담 0%(약제 5천원), 손보 기준 보장비율 100%. 4세대는 급여 20%·비급여 30% 자기부담에 보장비율 급여 80%·비급여 70%다. 같은 100만원 비급여 진료 시 1세대는 사실상 전액, 4세대는 70만원 한도에서 30% 공제 후 지급된다.<br>② <b>비급여 이용량이 많다</b> — 도수치료 월 2회 = 연 24회. 4세대는 직전 1년 비급여 보험금에 따라 보험료가 <b>최대 +300% 할증</b>된다. 도수치료 단가에 따라 3~5단계 진입이 충분히 가능하다.<br>③ <b>재가입주기</b> — 1세대는 만기까지 유지되나 4세대는 5년마다 재가입하며 그때의 제도가 적용된다.<br>④ <b>비가역성</b> — 전환하면 1세대로 돌아갈 수 없다."},
 {q:"\"1세대 실손이니까 다른 건 필요 없다\"고 말하는 고객에게 어떻게 답할 것인가? 실손이 못 막는 것 세 가지를 대라.",
  a:"실손은 <b>병원에 낸 돈을 돌려주는 보험</b>이지, 삶을 유지시켜 주는 보험이 아니다.<br>① <b>소득공백</b> — 카페 문을 닫으면 매출이 0이 된다. 실손은 매출을 보전해주지 않는다. 암 진단 후 실직률 46.4%, 5년 내 복귀율 30%.<br>② <b>간병비</b> — 간병인 비용은 실손 보장 대상이 아니다. 월 400~500만원. 1인 가구라 대체 인력도 없다.<br>③ <b>보장 제외 항목</b> — 1세대는 오히려 <b>치매·치질·치과·정신과가 면책</b>이고 한방 통원도 안 된다. \"1세대라서 다 된다\"는 것은 사실이 아니다.<br>추가로 언급할 것 — 후유장해(영구 훼손 상태에 대한 정액 보상)는 실손으로 대체 불가."},
 {q:"1인 가구 · 자영업자에게 진단비 규모를 계산해줄 때 근로소득자와 무엇이 달라야 하는가?",
  a:"세 가지를 더한다.<br>① <b>상병수당·유급병가가 없다</b> → 근로자는 12개월치를 기준선으로 잡아도 되지만 자영업자는 <b>18~24개월치</b>가 기준.<br>② <b>고정비가 멈추지 않는다</b> → 임대료·직원 인건비·대출 이자는 문을 닫아도 나간다. 개인 생활비 240만원 외에 <b>사업 고정비</b>를 별도로 물어 합산해야 한다.<br>③ <b>복귀 후 매출 회복 기간</b> → 폐업 후 재개업 시 단골 이탈로 매출이 즉시 회복되지 않는다. 6개월 완충을 더한다.<br>이 고객 기준 — 개인 240만 × 18개월 = 4,320만 + 사업 고정비 확인분. 현재 5,000만원은 <b>겨우 최소선</b>이며, 진단비 증액보다 <b>간병·입원일당(월 지급형)</b>으로 현금흐름을 만드는 편이 실효성이 높다."},
 {q:"모친(71세, 관절염) 담보를 본인 계약에 함께 넣는 것과 별도 계약으로 분리하는 것 중 무엇이 나은가? 이유는?",
  a:"<b>별도 계약으로 분리한다.</b><br>① <b>고지의무 주체가 다르다</b> — 피보험자가 다르면 고지 내용도 다르다. 한 증권에 묶으면 한쪽의 고지 문제가 계약 전체 해지로 번질 수 있다.<br>② <b>보험료 구조</b> — 71세 피보험자를 얹으면 계약 전체의 보험료가 무거워지고, 본인 담보를 조정할 때 함께 흔들린다.<br>③ <b>인수 조건</b> — 71세·관절염은 간편심사 대상일 가능성이 높다. 본인(43세·건강)은 일반심사가 가능한데 함께 묶으면 유리한 조건을 못 쓴다.<br>④ <b>납입 주체 문제</b> — 계약자를 딸(본인)로 하고 피보험자를 모친으로 하는 구조는 가능하나, 보험금 수익자 지정과 세무 이슈를 미리 정리해야 한다.<br>실무 팁 — 모친 계약은 <b>간병·요양 중심</b>으로 최소 구성하고, 본인 계약을 무겁게 만들지 않는다."}
]

script:[

 {k:"질문 3개로 좁히기",q:"그럼 저는 어디까지 되나요?",a:"딱 세 가지만 여쭤볼게요. <b>①</b> 최근 3개월 안에 병원에서 입원하라, 수술하라, 다시 검사받으라는 말 들으신 적 있으세요? <b>②</b> 최근 5년 안에 입원하거나 수술받으신 적은요? <b>③</b> 암 · 협심증 · 심근경색 · 뇌졸중 · 간경화 · 심장판막증 진단받으신 적 있으세요? … ②만 걸리시네요. 담낭 3년 전이면 <b>충분히 방법이 있습니다.</b>"},
 {k:"실손 우선순위",q:"암보험부터 하고 싶은데요.",a:"이해합니다. 그런데 순서를 바꾸시죠. <b>실손이 먼저</b>예요. 고객님 지금 고혈압 · 당뇨로 계속 병원 다니시잖아요. 그게 다 자비입니다. 실손은 그 돈을 매달 돌려받는 거예요. 그리고 나이 드실수록 실손이 제일 먼저 막힙니다. <b>지금 잡아두셔야 해요.</b>"},
 {k:"가족력 프레임",q:"저는 아직 괜찮아요.",a:"아버님 뇌경색, 형님이 54세에 심근경색이라고 하셨죠. 형제자매가 그러면 본인 발병률이 <b>2~3배</b>로 올라갑니다. 게다가 고혈압 · 당뇨 · 고지혈은 뇌졸중 전조질환 <b>세 가지 중 두 개</b>예요. 이건 확률 얘기가 아니라 <b>준비 시점</b>의 얘기입니다."},
 {k:"범위 설득",q:"보험료 아끼게 싼 걸로 해주세요.",a:"싸게 하는 방법이 두 가지인데, 하나는 <b>금액을 줄이는 것</b>이고 하나는 <b>범위를 줄이는 것</b>이에요. 금액은 줄이셔도 됩니다. 그런데 <b>범위는 줄이시면 안 돼요.</b> 뇌출혈만 넣으면 실제 뇌 질환의 8.7%만 나와요. 형님 케이스인 협심증은 심장질환의 64.8%인데 급성심근경색 담보로는 0원이고요."},
 {k:"시간 압박(정당한)",q:"좀 더 생각해볼게요.",a:"천천히 결정하셔도 되는데, 하나만 알아두세요. 유병자 보험은 <b>시간이 갈수록 조건이 나빠집니다.</b> 오늘 3.3.5로 되던 게 내년에 3.5.5로 올라가고, 새로운 진단이 하나 붙으면 또 달라져요. 지금이 가장 좋은 조건입니다. 부담되시면 <b>A안 13만원부터</b> 시작하시죠."}

drill:[
 {q:"이 고객의 간편고지 3대 질문 답을 정리하고, 어느 단계(3.0.5 ~ 3.10.10)부터 시도할지 순서를 써라.",
  a:"<b>3대 질문 대입</b><br>① 3개월 이내 입원·수술·추가검사 필요소견 → <b>없음</b> (고혈압·당뇨는 약 복용 유지 중, 신규 소견 없음)<br>② N년 이내 입원·수술 → <b>3년 전 담낭절제술 해당</b><br>③ 5·10년 이내 6대 질병 진단·입원·수술 → <b>없음</b><br><br><b>시도 순서</b> — ①과 ③이 깨끗하고 ②만 걸리므로, ②의 기준 연수가 <b>3년보다 짧은</b> 상품을 찾으면 된다.<br>1) <b>일반심사</b> 먼저 시도 (거절 가능성 높으나 무료다. 되면 보험료가 가장 싸다)<br>2) <b>3.5.5 / 3.5.10</b> — ②가 5년 기준이면 담낭절제술(3년 전)이 걸린다 → 부담보 조건부 인수 협의<br>3) <b>3.3.5</b> — ②가 <b>3년 기준</b>. 3년 '전'이므로 경계선. 수술일자를 정확히 확인해야 한다(3년 경과 여부가 인수를 가른다)<br>4) 안 되면 <b>3.1.5 → 3.0.5</b>로 내려간다<br><br><b>실무 포인트</b> — 담낭절제술 <b>정확한 수술일</b>을 먼저 확인하라. 며칠 차이로 3년 경과 여부가 갈리고, 그게 보험료를 20~30% 좌우한다. 며칠 남았다면 <b>기다렸다 청약</b>하는 것도 전략이다."},
 {q:"\"실손보다 암보험이 먼저\"라고 주장하는 고객을 설득할 근거 세 가지를 대라.",
  a:"① <b>지금 새고 있는 돈이 있다</b> — 고혈압 8년·당뇨 4년으로 정기적으로 병원에 다니고 있다. 그 진료비·약제비가 전액 자비다. 실손은 그 돈을 <b>매달 즉시</b> 돌려준다. 암보험은 암에 걸려야 작동한다.<br>② <b>인수 난이도가 실손이 더 빨리 올라간다</b> — 51세·유병자에게 실손은 나이와 신규 진단에 가장 민감하다. 지금 확보하지 않으면 55세, 60세엔 더 어렵다.<br>③ <b>실손이 모든 담보의 바닥이다</b> — 암에 걸려도 비급여 치료비의 상당 부분을 실손이 먼저 받친다. 실손 없이 암진단비만 있으면 진단금을 치료비로 다 쓰고 생활비가 남지 않는다(진단비의 본래 목적인 소득공백 보전이 무너진다).<br><b>화법</b> — \"암보험 안 하자는 게 아니라 <b>같은 달에 둘 다</b> 하자는 겁니다. 순서만 실손을 먼저 넣겠다는 거예요.\""},
 {q:"이 고객에게 <b>급성심근경색 진단비</b>만 제안하는 것이 왜 잘못된 설계인지 통계로 설명하라.",
  a:"허혈성 심장질환의 실제 발병 구성(심평원 2022)은 <b>협심증 64.8%</b>, 만성 허혈성 심장병 22.9%, <b>급성심근경색 12.1%</b>다.<br>즉 급성심근경색 진단비만 넣으면 <b>8명 중 7명은 0원</b>이다. 형이 54세에 심근경색이었다는 사실이 오히려 함정인데, 형제자매 가족력은 <b>허혈성 심장질환 전반</b>의 위험을 높이는 것이지 급성심근경색만 높이는 것이 아니다.<br>실제 치료 경로도 그렇다 — 관상동맥이 완전히 막히기까지 15~20년이 걸리고, 그 전에 <b>협심증 → 스텐트 삽입술</b>로 관리한다. 스텐트 시술의 실제 본인부담은 258만원이었고 이건 급성심근경색 진단비로 <b>한 푼도</b> 나오지 않는다.<br><b>결론</b> — 담보명은 <b>허혈성 심장질환(I20~I25)</b>이어야 한다. 금액을 2,000만에서 1,000만으로 낮출지언정 범위는 좁히지 않는다."},
 {q:"건설 현장 직군의 직업 급수가 인수 · 보험료에 미치는 영향을 어떻게 사전에 확인할 것인가?",
  a:"<b>확인 순서</b><br>① <b>정확한 직무를 묻는다</b> — \"건설업\"이 아니라 \"현장에서 직접 작업을 하시나요, 관리·감독만 하시나요?\", \"고소작업(2m 이상)이 있나요?\", \"중장비를 직접 조작하시나요?\" 이 고객은 <b>소장급 관리직</b>이므로 직접 작업직보다 급수가 낮을 가능성이 높다.<br>② <b>회사별 직업급수표를 조회</b> — 같은 직무라도 회사마다 1~5급(또는 A~E)이 다르다. 청약 전 설계 프로그램에서 직업코드를 넣어 <b>상해 담보 인수 가능 여부와 보험료</b>를 미리 확인한다.<br>③ <b>상해 담보만 영향을 받는다</b> — 질병 담보(암·뇌·심)는 직업급수와 무관하다. 급수가 높아 상해가 비싸면 <b>상해는 최소로, 질병은 정상으로</b> 나눠 설계할 수 있다.<br>④ <b>통지의무를 미리 안내</b> — 현장이 바뀌어 직무가 달라지면 <b>1개월 내 통지</b>해야 한다. 안 하면 보험금이 삭감 지급된다. 계약 시점에 반드시 문서로 안내하고 서명받아 둔다."},
 {q:"예산 35만원 안에서 A안(13만)과 B안(27만) 중 무엇을 권할 것인가? 판단 근거는?",
  a:"<b>B안(27만)을 권한다.</b> 다만 <b>A안을 먼저 청약하고 B안을 같은 달에 추가</b>하는 2단계로 진행한다.<br><b>근거</b><br>① 예산 35만 안에 B안 27만이 들어간다. 여력 8만이 남으므로 무리한 설계가 아니다.<br>② 이 고객은 <b>시간이 적</b>이다. 유병자는 새 진단이 하나 붙을 때마다 조건이 나빠진다. \"나중에 추가\"가 실제로는 \"영원히 못 함\"이 되는 유형이다.<br>③ 가족력(부친 뇌경색·형 심근경색)과 본인 전조질환(고혈압·당뇨·고지혈)이 <b>이미 실현 단계</b>에 가깝다. 뇌·심 담보를 미룰 이유가 없다.<br><b>단, A안을 먼저 넣는 이유</b> — 유병자 실손과 상해 담보는 인수 확률이 높다. 이걸 먼저 승인시켜 <b>\"나도 보험이 되는구나\"</b>를 경험하게 만들면 B안 진행이 훨씬 수월해진다. 심리적 장벽을 깨는 것이 이 케이스의 진짜 관문이다.<br><b>주의</b> — 자녀 교육비 120만원이 나가는 시기다. 고3 자녀가 대학에 가면 지출이 더 는다. <b>납입기간을 길게(20년납 이상)</b> 잡아 월 부담을 낮추는 것이 현실적이다."}

 {k:"유방암 가족력",q:"엄마가 유방암이셨어요.",a:"그건 꼭 반영해야 해요. 모친이 암이면 자녀 발병률이 <b>1.8~2.9배</b>고, 여성 암 1위가 유방암(21.5%)입니다. 그런데 유방암은 회사에 따라 <b>소액암</b>으로 잡혀서 일반암의 10~20%만 나올 수 있어요. 유방절제술 실제 본인부담이 <b>904만원</b>이었습니다. 여성암 담보를 따로 하나 두시죠."},

drill:[
 {q:"태아 · 산모 특약을 출산 후에는 넣을 수 없는 이유를 고객에게 30초 안에 설명해 보라.",
  a:"<b>모범 답안(구술용)</b> — \"태아 특약이 보장하는 건 <b>주산기 질환</b>, 그러니까 임신 후반부터 출생 직후 사이에 생기는 문제와 <b>선천이상 수술</b>이에요. 아이가 태어나고 나면 그건 이미 <b>발생 여부가 확정된 사건</b>이 됩니다. 보험은 아직 일어나지 않은 일에만 걸 수 있어요. 그래서 출산 전에만 가입이 됩니다. 산모 특약도 마찬가지로 임신·출산 과정의 위험을 보는 거라 출산이 끝나면 대상 자체가 사라져요.\"<br><br><b>덧붙일 실무 정보</b> — 가입 가능 시기는 기형아 검사 이후(16주) 또는 정밀 초음파 이후(20주)부터이며 회사에 따라 <b>22주 또는 30주에 마감</b>. 현재 21주이므로 회사별 마감 주차를 <b>당일 확인</b>해야 한다."},
 {q:"남편의 필요 사망보장액을 계산하라. 어떤 항목을 더하고 어떤 항목을 빼야 하는가?",
  a:"<b>더할 것</b><br>① 전세대출 잔액 (일시 상환 필요액)<br>② 자녀 독립까지 생활비 — 가구 고정지출 430만 중 남편 기여분(소득 비율로 안분) × 남은 개월수. 자녀 0세 → 22세 독립 가정 시 264개월<br>③ 자녀 교육비 총액 (대학 포함)<br>④ 배우자 노후 부족분<br>⑤ 사망 정리자금(장례·세금 등) 약 1,000만원<br><br><b>뺄 것</b><br>① 유족연금(국민연금) 예상 수령액<br>② 배우자 소득 — 아내가 간호사로 <b>독립적 소득이 있다</b>. 이 케이스에서 가장 크게 빼는 항목<br>③ 기존 종신 5,000만원<br>④ 보유 금융자산·퇴직금<br><br><b>결론</b> — 맞벌이라 홑벌이 가정보다 필요액이 작다. 그래서 종신을 증액하는 대신 <b>60세 만기 정기보험 3억</b>으로 자녀 독립 시점까지의 기간 위험만 덮는 B안이 합리적이다. <b>기간이 정해진 위험은 기간이 정해진 상품으로</b> 덮는다."},
 {q:"종신보험 증액 대신 정기보험 추가를 권하는 근거를 보험료 구조로 설명하라.",
  a:"종신보험은 <b>언젠가 반드시 지급</b>되는 구조라 보험료에 <b>적립 요소</b>가 들어간다. 정기보험은 정해진 기간 내 사망 시에만 지급되므로 사실상 <b>순수 위험보험료</b>만으로 구성된다. 같은 3억이라도 33세 남성 기준 정기(60세 만기)와 종신의 보험료 차이는 통상 <b>수 배</b>다.<br><br><b>설계 논리</b> — 사망보장 필요액은 <b>시간에 따라 줄어드는 곡선</b>이다. 자녀가 독립하고 대출을 갚으면 큰 보장이 필요 없어진다. 그런데 종신은 필요액이 줄어든 뒤에도 같은 보험료를 낸다. 그래서<br>· <b>줄어드는 부분</b> = 정기보험으로 (자녀 독립·대출 상환 시점까지)<br>· <b>끝까지 남는 부분</b> = 종신으로 (상속자금·연금전환·장례비)<br>이렇게 나누는 것이 정석이다. 이 케이스는 <b>종신 5,000만(유지) + 정기 3억(60세 만기, 신규)</b>."},
 {q:"부부 둘 다 4세대 실손이다. 이들에게 4세대의 <b>장점</b>을 설명하려면 무엇을 먼저 확인해야 하는가?",
  a:"<b>최근 1년간 비급여 보험금 수령액</b>을 확인해야 한다. 4세대는 이 금액으로 다음 해 보험료가 결정되기 때문이다.<br>· 1단계(비급여 미청구) → <b>할인</b><br>· 2단계(100만원 미만) → 유지<br>· 3단계(100~150만) → +100% / 4단계(150~300만) → +200% / 5단계(300만 이상) → +300%<br><br><b>이 부부의 상황</b> — 30대 초반, 특이 치료이력 없음 → <b>1~2단계</b>에 있을 가능성이 높다. 즉 4세대의 <b>할인 구간</b>에 해당하며 이건 구실손에는 없는 혜택이다.<br><br><b>단, 주의해서 함께 말할 것</b> — ① 출산 후 아이가 아프면 비급여(주사·검사) 사용이 늘 수 있다 ② 아내가 3교대 근무로 <b>도수치료</b>를 받게 되면 할증 구간에 들어갈 수 있다 ③ 5년마다 재가입이며 그때의 제도가 적용된다.<br>→ 그래서 실손에만 의존하지 말고 <b>정액 담보(수술비·입원일당)</b>를 함께 깔아야 한다는 결론으로 연결한다."},
 {q:"예산이 30만원뿐이라면 A안만 하고 끝낼 것인가, B안에서 무엇을 덜어낼 것인가?",
  a:"<b>A안(30만)으로 마무리하되, B안을 '3개월 뒤 약속'으로 문서화한다.</b><br><br><b>이유</b> — 이 케이스에서 <b>시간이 정해진 것은 태아·산모 특약뿐</b>이다. 나머지 담보는 출산 후에 넣어도 조건이 크게 나빠지지 않는다(부부 모두 30대 초반·건강). 무리해서 B안을 밀어넣으면 출산 후 육아비용이 늘 때 <b>실효(失效)</b> 위험이 커지고, 그게 가장 나쁜 결과다.<br><br><b>그래도 B안 일부를 넣어야 한다면 우선순위</b><br>1) [아내] 여성암·유사암 진단비 — 유방암 가족력이 명확하고, 아내가 임신성 당뇨 검사를 앞두고 있어 <b>새 진단이 붙기 전</b>에 확보해야 한다<br>2) [남편] 정기보험 3억 — 보험료가 저렴하고 자녀 출생 시점의 핵심 리스크<br>3) 뇌·심 담보 — 가장 미뤄도 되는 항목(30대 초반)<br><br><b>실무 조치</b> — 육아휴직 복귀 예정일을 캘린더에 걸고, 그때 B안을 다시 제안한다. \"지금 안 하는 것\"과 \"안 하는 것\"을 명확히 구분해서 기록으로 남긴다."}

script:[

 {k:"간병 — 이미 겪고 있는 위험",q:"간병보험까지요?",a:"어머님 요양원 계시고, 남편분 재활 다니시죠. 이 집은 간병이 <b>앞으로의 걱정이 아니라 지금 하고 계신 일</b>이에요. 그런데 정작 어머님이나 남편분 아니라 <b>본인</b>이 그렇게 되면요? 지금 딸 아들한테 그걸 맡기실 건가요? 간병인 쓰면 월 400~500만원입니다."},

 {q:"\"신규 계약 없이 6만원을 낮추는\" A안을 먼저 제시하는 것이 왜 전략적으로 유리한가?",

 {q:"10년납 비갱신을 권하는 논리를 '총 납입액'이 아니라 '<b>납입 종료 시점</b>'으로 설명해 보라.",

 {k:"후유장해 가성비",q:"후유장해가 뭐예요?",a:"쉽게 말해 <b>몸에 영구적으로 남는 손상</b>에 대해 나오는 돈이에요. 3%형으로 넣으면 디스크만 있어도 10%, 인공관절 한쪽이면 20%가 나옵니다. 부위별로 각각, 그리고 <b>반복해서</b> 나와요. 26세면 보험료가 정말 쌉니다. 이 담보가 지금 가성비 1등이에요."},
 {k:"수술 빈도",q:"저 건강해서 수술할 일 없어요.",a:"10대 수술 1위가 <b>맹장(충수절제술)</b>이에요. 20~30대는 치핵이랑 탈장이고요. 암 수술은 순위에 거의 없습니다. 수술비는 큰 병 대비가 아니라 <b>살면서 그냥 쓰는 담보</b>예요. 맹장수술 실제 본인부담이 150만원 나온 영수증이 있습니다."},

drill:[
 {q:"어린이보험 30세 만기를 앞둔 고객에게, 만기까지 기다렸다가 가입하는 것과 지금 가입하는 것의 차이를 설명하라.",
  a:"<b>세 가지가 달라진다.</b><br>① <b>요율</b> — 비갱신 담보는 가입 시점 나이로 보험료가 확정된다. 26세와 30세의 차이는 작아 보이지만 <b>20년 납입 총액</b>으로 환산하면 유의미하고, 이 차이는 평생 고정된다.<br>② <b>건강 상태</b> — 4년 사이 건강검진에서 무엇이라도 나오면(고지혈·간수치·결절 등) 부담보 조건이 붙거나 인수가 거절될 수 있다. <b>26세의 깨끗한 고지</b>는 그 자체가 자산이다.<br>③ <b>무보험 공백</b> — 만기 후 신규 가입 사이에 공백이 생기면 그 기간의 사고·진단은 어디서도 보상받지 못한다. 게다가 그 기간에 생긴 진단은 <b>새 계약의 고지 대상</b>이 되어 이중으로 불리해진다.<br><br><b>실무 처리</b> — 지금 신규 계약을 만들고, 어린이보험은 <b>만기까지 그대로 유지</b>한다. 중복이 아깝다고 미리 해지하면 4년간의 보장을 버리는 것이다(실손만 중복 가입을 피하면 된다)."},
 {q:"월 소득 265만원인 사회초년생에게 적정 보험료 비중은 얼마이며, B안(22만원)은 그 범위 안에 있는가?",
  a:"<b>일반 기준</b> — 20대 사회초년생 권장 비중은 <b>월소득의 6~8%</b>. 265만원 기준 <b>16만~21만원</b>이다.<br><b>B안 22만원 = 8.3%</b> → 권장 범위를 <b>약간 초과</b>한다.<br><br><b>그럼에도 B안을 권할 수 있는 근거</b><br>① 26세 요율로 <b>평생 고정</b>되므로 이 지출은 미래 비용의 선지급 성격이다<br>② 20년납이라 <b>46세에 납입이 종료</b>된다. 소득이 가장 높은 40대 후반부터는 부담이 0이 된다<br>③ 미혼·부양가족 없음 → 지금이 가처분소득 비중이 가장 자유로운 시기다<br><br><b>반대로 A안(15만, 5.7%)을 권해야 하는 경우</b><br>· 학자금 대출 상환이 아직 많이 남아 있고 조기 상환 계획이 있을 때<br>· 이직·이사 등 단기 목돈 계획이 있을 때<br>· 결혼 계획이 2~3년 내에 있을 때(그때 재설계 필요)<br><br><b>판단</b> — 학자금 25만원을 상환 중이므로 <b>A안(15만)으로 시작하고, 학자금 상환 종료 시점에 B안으로 증액</b>하는 2단계가 가장 현실적이다. 이때 <b>증액 시점을 계약서에 메모</b>해두고 캘린더에 건다."},
 {q:"예산이 15만원뿐일 때 실손 · 진단비 · 후유장해 · 수술비 중 무엇을 먼저 넣고 무엇을 빼겠는가?",
  a:"<b>넣는 순서</b><br>1) <b>실손</b> — 논쟁의 여지가 없다. 4년 뒤 소멸하므로 반드시 신규 확보. 모든 치료비의 바닥이다.<br>2) <b>질병후유장해 3%</b> — 26세에 가장 저렴하고 지급 범위가 가장 넓다. 부위별·반복 지급이라 평생 누적 효과가 크다.<br>3) <b>1-5종 수술비</b> — 20~30대가 실제로 겪는 사건(맹장·치핵·탈장)에 즉시 작동한다. 급여·비급여 모두 보상.<br>4) <b>일배책</b> — 월 몇백 원 수준인데 자취 중 누수·물건 파손에서 바로 쓰인다.<br><br><b>미루는 것 — 진단비</b><br>· 암·뇌·심 진단비는 26세 <b>발생 확률이 낮다</b>. 암 발생의 대부분은 35세 이후에 집중된다(35~64세 48.1%, 65세 이상 47.8%).<br>· 게다가 어린이보험에 <b>암진단비 2,000만원이 4년간 남아 있다</b>. 이 기간이 완충 역할을 한다.<br>· 단, <b>조부 대장암 가족력</b>이 있으므로 학자금 상환이 끝나는 대로 최우선으로 추가한다.<br><br><b>핵심 원칙</b> — 예산이 작을 때는 <b>확률이 높고 보험료가 싼 담보</b>부터 채운다. 금액이 큰 담보(진단비)를 무리하게 넣어 실효되는 것이 최악이다."},
 {q:"이 고객이 \"부모님과 상의하겠다\"고 했다. 다음 만남을 만들기 위해 무엇을 남기고 나올 것인가?",
  a:"<b>남기고 나올 것 세 가지</b><br>① <b>담보 지도 표 1장</b> — ○△×가 찍힌 표. 설명 없이도 부모가 이해한다. 특히 \"<b>전 담보 30세 만기</b>\" 줄에 표시를 해둔다. 부모가 가장 놀랄 지점이 여기다.<br>② <b>3안 비교표</b> — 금액과 담보만. 고객이 부모에게 그대로 설명할 수 있어야 한다.<br>③ <b>내 연락처와 \"부모님 증권도 봐드립니다\"라는 한 줄</b> — 이게 진짜 목적이다.<br><br><b>다음 만남을 만드는 법</b><br>· \"상의해보세요\"로 끝내지 말고 <b>날짜를 잡는다</b> — \"어머님 언제 뵈세요? 그럼 그다음 주 화요일쯤 제가 한번 연락드릴게요.\"<br>· <b>부모 증권 분석을 제안</b>한다. 26세 고객의 계약 하나보다 <b>부모 세대 재설계</b>가 훨씬 크고, 부모는 이미 보험을 여러 개 갖고 있다.<br>· 부모가 이 어린이보험을 <b>20년 넘게 납입</b>했다는 사실을 상기시킨다 — 보험에 대한 신뢰가 이미 있는 가정이다.<br><br><b>하지 말 것</b> — \"부모님 설득해 드릴까요?\" 같은 압박. 26세 고객이 부모 앞에서 스스로 설명할 수 있게 <b>자료를 단순하게</b> 만들어 주는 것이 전부다."}

script:[

drill:[
 {q:"이 케이스에서 '<b>정리해야 할 중복</b>'과 '<b>유지해야 할 중복</b>'을 구분하고 각각의 근거를 대라.",
  a:"<b>정리해야 할 중복 — 암진단비 8,000만원</b><br>· 정액 담보는 여러 계약에 있어도 <b>각각 전액 지급</b>되므로 중복 자체가 손해는 아니다. 그러나 <b>필요액을 초과한 배치</b>가 문제다.<br>· 아내의 뇌·심 담보가 0원인 상태에서 암에만 8,000만원이 몰려 있는 것은 <b>위험 분산 실패</b>다.<br>· 조치 — 두 계약 중 <b>조건이 불리한 쪽</b>(80세 만기 B증권)의 암 담보를 감액하고, 그 보험료를 뇌·심으로 옮긴다. <b>해지가 아니라 감액</b>이며 다른 담보는 유지한다.<br><br><b>유지해야 할 중복 — 일상생활배상책임 2개</b><br>· 배상책임은 <b>비례보상</b>이라 중복 이익이 없어 보이지만, <b>자기부담금이 각 계약에서 따로 공제</b>된다.<br>· 40만원 손해 시 — 1개 보유: 40−20=20만원 수령 / 2개 보유: A사 20만 + B사 20만 = <b>40만원 전액</b> 수령.<br>· 한도도 1억 → 2억으로 늘어난다. 2019년 진돗개 안면 교상 <b>2억 배상</b> 판례(서울중앙지법 2017가단5230966)를 감안하면 의미가 있다.<br><br><b>정리하면 안 되는 또 하나 — 실손</b><br>· 부부가 각 1개씩만 보유 중이므로 중복이 아니다. 실손은 <b>비례보상</b>이라 2개 이상 가입하면 손해이지만, 지금은 정상 상태다."},
 {q:"\"같은 보험료로 담보를 8개 늘린다\"는 B안의 논리를 고객에게 숫자로 증명해 보라.",
  a:"<b>종이에 두 개의 표를 나란히 그린다.</b><br><br><b>[현재] 월 87만원</b><br>· 아내 암 8,000만 (중복) · 남편 암 5,000만<br>· 남편 뇌졸중 2,000만 · 남편 급성심근경색 2,000만<br>· 저축 30만원<br>· 뇌(아내) × · 심장(아내) × · 수술비 ×× · 후유장해 ×× · 운전자 ×× · 여성암 ×<br><br><b>[B안] 월 87만원 (동일)</b><br>· 아내 암 5,000만 · 남편 암 5,000만<br>· <b>아내 뇌혈관 2,000만 신규</b> · <b>부부 허혈성심장 각 2,000만 신규</b><br>· <b>부부 1-5종 수술비 신규</b> · <b>부부 질병후유장해 신규</b><br>· <b>부부 운전자보험 신규</b> · <b>아내 여성암·유사암 신규</b><br>· 남편 뇌 담보 범위 확대<br><br><b>핵심 문장</b> — \"보험료는 <b>한 원도 안 늘었습니다.</b> 암에 몰려 있던 걸 빈 곳으로 옮긴 것뿐이에요. 대신 ×가 <b>8개 사라졌습니다.</b>\"<br><br><b>주의</b> — 저축보험 30만원 처리는 <b>고객이 목적을 확인한 뒤</b> 결정한다. 만기·목적을 모른 채 \"저축을 줄이자\"고 하면 부당 권유가 된다. 확인 후 <b>고객이 선택</b>하게 한다."},
 {q:"남편의 대장 선종 제거 이력이 인수에 미치는 영향과, 이를 고객에게 설명하는 방법을 써라.",
  a:"<b>인수에 미치는 영향</b><br>① 대장 관련 담보(대장암·소화기 질환)에 <b>부담보(특정부위 부담보)</b>가 붙을 가능성이 높다. 통상 일정 기간(1~5년) 또는 전 기간 대장 관련 질환을 보장에서 제외한다.<br>② 암 진단비 전체가 거절되는 것은 아니다 — <b>대장만 제외하고 나머지는 보장</b>되는 형태가 일반적이다.<br>③ 추가 선종이 발견되거나 이형성이 확인되면 조건이 더 나빠진다.<br>④ 고지의무 대상이므로 <b>반드시 사실대로</b> 기재해야 한다.<br><br><b>설명 방법</b><br>\"작년에 용종 떼신 거, 이거 <b>반드시 적어야</b> 합니다. 숨기면 나중에 대장 아닌 걸로 청구해도 계약 전체가 흔들려요.<br>적으면 어떻게 되냐면, <b>대장 쪽만 일정 기간 빼고</b> 나머지는 다 되는 조건이 나올 가능성이 큽니다. 대장이 빠지는 건 아쉽지만, <b>안 빠지는 나머지가 훨씬 많아요.</b><br>그리고 이게 중요한데, 지금은 이 조건이라도 되지만 <b>용종이 또 나오면 그때는 더 어려워집니다.</b> 지금이 제일 좋은 조건이에요.\"<br><br><b>실무</b> — 조직검사 결과지(선종 vs 과형성 용종)를 확보하면 인수 조건이 달라질 수 있다. <b>서류를 먼저 챙기고</b> 청약한다."},
 {q:"저축보험 월 30만원을 \"줄이자\"고 말하기 전에 반드시 확인해야 할 것 네 가지는?",
  a:"① <b>가입 목적</b> — 노후 / 자녀 학자금 / 주택 / 목적 없음. 목적이 명확하고 만기가 그 시점에 맞으면 <b>건드리지 않는다</b>.<br>② <b>만기와 경과 기간</b> — 2015년 가입이면 10년 만기가 도래했을 수 있다. 만기가 지났다면 이미 정리 대상이 아니라 <b>수령·재투자 상담</b>이다. 또한 <b>비과세 요건(10년 유지)</b> 충족 여부가 결정적이다.<br>③ <b>해지 시 손실</b> — 사업비 구조상 중도 해지하면 원금 손실이 날 수 있다. <b>해지환급금을 반드시 조회</b>한 뒤 말해야 한다. 조회 없이 \"줄이자\"고 하면 고객이 손해를 본다.<br>④ <b>대안 — 감액·납입중지·중도인출</b> — 해지만이 방법이 아니다. 감액완납, 납입유예, 중도인출 등으로 <b>비과세 요건을 지키면서</b> 부담만 줄일 수 있는 경우가 많다.<br><br><b>절대 하지 말 것</b> — 해지환급금과 비과세 요건을 확인하지 않고 해지를 권하는 것. 이는 <b>부당 승환</b>으로 이어질 수 있고, 고객이 실제 금전 손해를 본다. 확인 결과를 <b>서면으로 제시</b>하고 고객이 선택하게 한다."},
 {q:"이 부부에게 C안(월 99만, 소득의 12.7%)을 지금 권하지 않는 이유를 설명하고, 언제 다시 제안할지 계획을 세워라.",
  a:"<b>지금 권하지 않는 이유</b><br>① 월 고정지출 690만원 중 <b>주담대 원리금 180만 + 교육비 150만</b>이 이미 절반에 가깝다. 가처분 여력이 90만원뿐이다.<br>② 자녀가 중2·초5 → 교육비는 앞으로 <b>더 늘어난다</b>(고등학교·대학).<br>③ 무리하게 넣으면 3~5년 내 실효 위험. <b>실효는 최악의 결과</b>다 — 낸 돈도 잃고 보장도 잃는다.<br>④ B안으로 이미 <b>구조적 결함이 해결</b>된다. C안은 결함 해결이 아니라 두께 보강이다.<br><br><b>다시 제안할 시점 — 세 가지 트리거</b><br>1) <b>주담대 완납 또는 금리 인하로 원리금이 크게 줄 때</b> → 여유 180만원 중 일부를 보장으로<br>2) <b>큰아이 대학 입학 후 교육비 구조가 확정될 때</b> (사교육비 → 등록금으로 전환)<br>3) <b>부부 중 한 명이 승진·이직으로 소득이 오를 때</b><br><br><b>실무 조치</b><br>· C안을 <b>인쇄해서 남기고</b> \"3년 뒤 목표\"라고 적어 준다. 팔지 못한 제안이 아니라 <b>미래의 약속</b>으로 만든다.<br>· <b>12개월 뒤 점검 일정</b>을 캘린더에 건다. 이때 소득·지출 변화를 확인한다.<br>· 그 사이에 <b>보상 지원</b>으로 신뢰를 쌓는다 — 자녀 골절, 아내 갑상선 추적검사 등 청구 기회가 반드시 생긴다."}

script:[
 {k:"전환 — 개인에서 법인으로",q:"제 보험 봐주시는 거죠?",a:"개인 보험은 <b>생각보다 잘 되어 있으세요.</b> 그런데 오늘 제가 여쭤보고 싶은 건 다른 겁니다. <b>대표님이 6개월 병원에 계시면 회사는 어떻게 되나요?</b> 직원 14분 급여랑 거래처는요?"},

 {k:"협심증 — 가족력",q:"심근경색 3천 있는데요?",a:"아버님이 심근경색으로 돌아가셨다고 하셨죠. 그런데 실제로 심장질환 중에 급성심근경색은 <b>12%</b>고, <b>협심증이 64.8%</b>예요. 대표님 지금 고혈압에 수면무호흡까지 있으시면 협심증 쪽 확률이 훨씬 높습니다. 그런데 지금 증권으로는 협심증에 <b>0원</b>이에요."},
 {k:"제조물 책임",q:"공장 화재보험은 들었어요.",a:"화재는 <b>내 재산</b>이고요, 제가 여쭙는 건 <b>내가 만든 제품</b>이에요. 제품 결함으로 거래처나 소비자가 손해를 보면 그건 <b>제조물 책임</b>입니다. 개인 일상생활배상책임으로는 절대 안 나와요. 확률은 낮은데 터지면 회사가 흔들리는 위험, 이런 게 <b>보험으로 넘겨야 하는</b> 전형입니다."},
 {k:"직원 복리후생",q:"직원 보험까지요?",a:"14명이면 충분히 됩니다. 단체 보장성보험은 <b>세 가지가 동시에</b> 해결돼요. 직원 복리후생이 좋아지고, 이직률이 줄고, 법인에서 비용 처리가 됩니다. 요즘 중소기업에서 사람 못 구해서 힘드시잖아요. 이게 생각보다 큰 무기예요."},
 {k:"전문가 연계 — 선을 긋기",q:"세금 얼마나 아껴요?",a:"그건 제가 단언하면 안 되는 영역이에요. 법인 계약은 <b>손금 인정 요건</b>이 있고 계약 구조에 따라 결과가 달라집니다. 그래서 저는 <b>세무사님과 같이</b> 진행합니다. 제가 보험 구조를 짜고, 세무 판단은 세무사님이 확인해 주시는 방식이에요. 그게 대표님한테 안전합니다."}

drill:[
 {q:"개인 보험과 법인 보험의 목적 차이를 대표에게 한 문장으로 설명해 보라.",
  a:"<b>\"개인 보험은 가족이 살아남기 위한 돈이고, 법인 보험은 회사가 살아남기 위한 돈입니다.\"</b><br><br><b>구체적 대비</b><br>· <b>개인 종신 2억</b> — 계약자·수익자가 개인(또는 유족). 유가족의 생활비·상속세 재원. 대표가 사망해도 이 돈은 <b>회사로 가지 않는다</b>.<br>· <b>경영인정기보험</b> — 계약자·수익자가 <b>법인</b>. 대표 유고 시 법인이 받아 직원 급여·거래처 대금·차입금 상환·후계자 확보 기간의 운영자금으로 쓴다.<br><br><b>추가로 짚을 것</b> — 대표 유고 시 법인이 겪는 실제 문제는 ① 금융권 여신 회수·신규 대출 중단 ② 핵심 거래처 이탈 ③ 직원 동요·이탈 ④ 지분 상속에 따른 경영권 분쟁이다. 이 중 <b>①~③은 시간을 벌면 해결</b>되는 문제이고, 그 시간을 사는 것이 법인 보험이다.<br><br><b>주의</b> — 법인 보험의 <b>비용 처리·손금 인정</b>은 계약 구조와 세법 해석에 따라 달라진다. 설계사가 세무 효과를 확정적으로 말하면 안 되며, <b>반드시 세무 전문가와 연계</b>한다."},
 {q:"이 대표에게 협심증 보장을 설득할 때 사용할 통계와 실제 치료비 사례를 조합해 스크립트를 써라.",
  a:"<b>스크립트</b><br>\"대표님, 아버님이 심근경색으로 돌아가셨다고 하셨죠. 그래서 심근경색 3,000만원 넣으신 거 잘하신 겁니다.<br>그런데 하나만 확인하실게요. 심평원 통계로 허혈성 심장질환 중에 <b>급성심근경색은 12.1%</b>예요. 제일 많은 건 <b>협심증으로 64.8%</b>입니다. 만성 허혈성 심장병이 22.9%고요.<br>왜 그러냐면, 관상동맥이 완전히 막히기까지 <b>15~20년</b>이 걸려요. 그 전에 건강검진에서 잡히고 <b>스텐트</b>로 뚫습니다. 우리나라 의료 수준이 심근경색까지 잘 안 가게 만들어요.<br>그러니까 대표님이 실제로 만날 확률이 높은 건 <b>협심증 → 스텐트</b>입니다. 실제 영수증 보면 스텐트 삽입술 본인부담이 <b>258만원</b>, 우회수술까지 가면 <b>584만원</b>이에요. 그런데 지금 증권으로는 <b>둘 다 0원</b>입니다.<br>담보명을 <b>허혈성 심장질환(I20~I25)</b>으로 하나 추가하시죠. 지금 있는 급성심근경색은 그대로 두시고요.\"<br><br><b>강화 요소</b> — 고혈압 약 복용 중 + 수면무호흡 진단은 심혈관 위험을 높이는 인자다. 다만 <b>의학적 단정은 피하고</b> \"관리가 필요한 상태\" 정도로 표현한다."},
 {q:"법인 계약을 제안할 때 설계사가 <b>넘지 말아야 할 선</b>은 무엇인가? 세 가지를 대라.",
  a:"① <b>세무 효과를 확정적으로 단언하지 않는다</b><br>\"이거 전액 손금 처리됩니다\", \"세금 얼마 아낍니다\" 같은 표현 금지. 법인 보험의 손금 인정 여부는 계약 구조·수익자 지정·해지환급금 처리 방식에 따라 달라지고, 세법 해석과 과세 관청의 판단이 개입한다. <b>반드시 세무 전문가 확인을 전제</b>로 말한다.<br><br>② <b>법률·정관 자문을 대신하지 않는다</b><br>임원 퇴직금 지급 규정, 정관 변경, 주주총회 결의는 <b>법무·세무 영역</b>이다. 설계사는 \"이런 것이 필요합니다\"까지만 말하고 <b>전문가에게 연결</b>한다. 직접 규정 문안을 만들어 주면 책임 문제가 발생한다.<br><br>③ <b>절세를 주된 판매 논리로 삼지 않는다</b><br>보험의 본질은 <b>위험 이전</b>이다. 절세를 전면에 내세우면 ㉠ 나중에 세무 처리가 달라졌을 때 민원이 되고 ㉡ 부당 권유로 해석될 수 있다. <b>\"대표 유고 시 법인 존속\"이라는 위험 관리 논리</b>가 주(主)이고 세무는 부(副)여야 한다.<br><br><b>실무 원칙</b> — 법인 상담은 <b>혼자 가지 않는다</b>. 세무사 또는 법인 전문 지원 조직과 팀으로 움직인다. 이것이 대표에게도 안전하고 설계사에게도 안전하다."},
 {q:"직원 14명 규모의 법인에 단체 보장성보험을 제안할 때, 대표가 가장 궁금해할 세 가지 질문을 예상하고 답을 준비하라.",
  a:"<b>Q1. \"돈이 얼마나 들어요?\"</b><br>→ 인당 소액으로도 설계가 가능하다. 보장 범위(상해만 / 상해+질병 / 진단비 포함)에 따라 단가가 크게 달라지므로 <b>예산을 먼저 정하고 거기에 맞춰</b> 설계하는 방식을 제안한다. \"인당 월 ○만원 이내\"로 상한을 정해두면 대표가 결정하기 쉽다.<br><br><b>Q2. \"직원이 그만두면 어떻게 돼요?\"</b><br>→ 단체보험은 <b>재직 중</b> 보장이 원칙이며, 퇴사 시 피보험자에서 제외되고 신규 입사자로 대체하는 구조가 일반적이다. 상품별로 개인 계약 전환(승계) 가능 여부가 다르므로 <b>약관을 확인</b>해 안내한다.<br><br><b>Q3. \"산재보험 있는데 또 필요해요?\"</b><br>→ 산재는 <b>업무상 재해</b>만 보상한다. 단체 보장성보험은 <b>업무 외 상해와 질병</b>까지 커버할 수 있다. 직원이 주말에 다치거나 질병으로 입원하는 경우 산재로는 해결되지 않는다. 또한 산재 처리 자체가 회사에 부담이 되는 경우(보험료율 상승 우려)의 완충 역할도 한다.<br><br><b>대표에게 가장 잘 먹히는 프레임</b> — \"요즘 사람 구하기 어려우시죠. <b>급여를 10만원 올리는 것보다 보험을 넣어주는 게 직원에게 더 크게 느껴집니다.</b> 급여는 세금 떼고 받지만 보험은 온전히 혜택이거든요.\" 단, <b>세무 처리는 세무사 확인 사항</b>임을 함께 밝힌다."},
 {q:"이 케이스에서 <b>다음 상담 약속</b>을 만들기 위해 첫 만남을 어떻게 마무리할 것인가?",
  a:"<b>마무리 구조 — 숙제를 주고 나온다</b><br><br>① <b>오늘의 결론을 한 문장으로</b><br>\"대표님 개인 보험은 협심증 하나만 보완하면 됩니다. 그건 제가 다음에 서류 가져올게요. <b>오늘 진짜 얘기는 회사 쪽이었습니다.</b>\"<br><br>② <b>확인 숙제 3가지를 남긴다</b> (대표가 직접 해야 하는 것)<br>· 공장 화재·재산종합보험 <b>증권 사본</b><br>· <b>정관에 임원 퇴직금 지급 규정이 있는지</b> — 세무사에게 확인 요청<br>· 직원 14명의 <b>연령대 분포</b> (단체보험 설계용)<br>→ 숙제가 있으면 다음 만남의 명분이 생긴다. 그리고 대표가 세무사에게 물어보는 순간 <b>이 논의가 회사 안에서 살아있는 안건</b>이 된다.<br><br>③ <b>다음 만남에 누가 올지 정한다</b><br>\"다음엔 <b>세무사님도 같이</b> 뵈면 좋겠습니다. 제가 보험 구조 짜 오고, 세무 판단은 세무사님이 봐주시는 게 대표님한테 제일 안전해요.\" → 전문가를 부르는 순간 설계사의 급이 달라진다.<br><br>④ <b>날짜를 확정한다</b><br>\"이번 달 말이 결산 바쁘실까요? 그럼 다음 달 둘째 주 어느 요일이 편하세요?\" — 열린 질문이 아니라 <b>선택지를 주는 질문</b>으로 닫는다.<br><br><b>절대 하지 말 것</b> — 첫 만남에 법인 상품 청약서를 꺼내는 것. 법인 계약은 <b>구조 설계와 전문가 검토가 선행</b>되어야 하며, 서두르면 신뢰를 잃는다."}
]

script:[
 {k:"딸에게 먼저",q:"엄마 보험 하나도 없는데 지금이라도 될까요?",a:"됩니다. 그런데 <b>따님한테 먼저</b> 여쭤볼게요. 어머님이 갑자기 3개월 입원하시면, 세 분 중에 누가 병원에 계실 수 있으세요? … 그렇죠, 다들 직장이 있으시니까요. 그럼 간병인을 써야 하는데 <b>월 400~500만원</b>입니다. 오늘 얘기는 사실 <b>어머님 보험이 아니라 세 분 얘기</b>예요."},
 {k:"어머니 존중",q:"(어머니) 나는 됐어, 애들 돈 쓰게 하기 싫어.",a:"어머님, 그 마음 잘 압니다. 그런데 이건 <b>어머님이 자식들한테 짐이 안 되시는</b> 방법이에요. 나중에 아프시면 애들이 회사를 쉬거나 돈을 내야 하잖아요. 지금 조금씩 준비해두시면 <b>그때 애들이 안 힘들어요.</b> 어머님이 애들을 도와주시는 거예요."},
 {k:"인수 가능성",q:"고혈압에 수술도 했는데 되나요?",a:"<b>간편심사</b>라는 게 있어요. 질문이 세 개로 줄어듭니다. 최근 3개월 안에 입원·수술 소견 있으셨나요? 없으시죠. 최근 5년 안에 입원·수술은요? 3년 전 담낭염 입원이 있으시네요. 암·뇌졸중·심근경색 같은 큰 병 진단은요? 없으시고요. <b>충분히 방법이 있습니다.</b>"},
 {k:"낙상 프레임",q:"엄마 아직 정정하세요.",a:"그래서 지금 하셔야 해요. 골다공증에 무릎 관절염 있으시면 <b>한 번 넘어지는 게</b> 제일 무섭습니다. 대퇴골 골절되면 고관절 인공관절 수술로 가는데, 실제 본인부담이 <b>426만원</b> 나온 영수증이 있어요. 그리고 그 뒤로 거동이 어려워지시면 <b>간병이 시작</b>됩니다."},
 {k:"치매 타이밍",q:"치매까지는 좀…",a:"외할머님이 치매셨다고 하셨죠. 치매 담보는 <b>나이가 문턱</b>이에요. 71세면 아직 되는 상품이 있는데, 75세 넘어가면 선택지가 확 줄어듭니다. 그리고 치매는 진단비 한 번으로 안 끝나요. 실제 기록 보면 한 분이 <b>617일</b>을 입원하셨습니다."},
 {k:"3남매 합의",q:"저희 셋이서 나눠 낼게요.",a:"좋은 방법입니다. 그런데 <b>지금 정하고 가셔야</b> 할 게 하나 있어요. 계약자를 누구로 할지, 나중에 보험금 받으시면 누가 받을지요. 이거 안 정하면 <b>나중에 형제간에 얘기가 나옵니다.</b> 오늘 세 분 합의해서 적어두시죠. 세금 문제도 있어서 필요하면 세무사님도 연결해 드릴게요."}

drill:[
 {q:"이 상담의 <b>실질적 의사결정권자</b>는 누구인가? 상담 진행 방식을 어떻게 설계할 것인가?",
  a:"<b>의사결정권자는 자녀 3인(특히 동석한 장녀)</b>이다. 보험료를 부담하는 주체이고, 리스크가 실현될 때 시간과 돈을 쓰는 것도 자녀이기 때문이다.<br><br><b>그러나 피보험자는 어머니</b>이므로 다음 원칙을 지킨다.<br>① <b>어머니를 대화에서 배제하지 않는다</b> — 딸만 보고 말하면 어머니가 소외감을 느껴 \"난 됐다\"로 방어한다. 반드시 어머니에게 직접 말을 걸고 <b>동의를 구한다</b>. 피보험자 동의는 법적으로도 필수다(타인의 생명보험 계약).<br>② <b>부담과 혜택의 방향을 뒤집어 설명한다</b> — \"자식이 돈을 쓴다\"가 아니라 \"<b>어머니가 자식의 부담을 덜어주신다</b>\"로 프레임을 바꾼다. 70대 부모의 가장 큰 동기는 <b>자식에게 짐이 되지 않는 것</b>이다.<br>③ <b>자리에 없는 형제를 반드시 참여시킨다</b> — 3남매가 분담한다면 나머지 두 명이 동의하지 않으면 실행되지 않는다. 장녀에게 \"두 분께 이 표 그대로 보여주세요\"라고 자료를 준다.<br><br><b>진행 방식</b> — 1차: 어머니 + 장녀(현황 파악·인수 가능성 확인) → 2차: <b>3남매 전원 참석</b>(분담과 계약구조 합의) → 3차: 청약. 2차를 건너뛰면 반드시 무산된다."},
 {q:"71세 · 고혈압 12년 · 3년 전 담낭염 입원 · 백내장 수술 이력. 간편고지 3대 질문에 대입하고 인수 전략을 세워라.",
  a:"<b>3대 질문 대입</b><br>① <b>3개월 이내</b> 입원·수술·추가검사 필요소견 → <b>없음</b> (고혈압·관절염은 유지 치료, 신규 소견 없음). 단, <b>무릎 주사 치료</b>가 \"추가검사·수술 필요소견\"에 해당하는지 반드시 확인 필요.<br>② <b>N년 이내</b> 입원·수술 → <b>2년 전 백내장 수술 + 3년 전 담낭염 입원</b> 모두 해당. 이것이 가장 큰 제약.<br>③ <b>5·10년 이내 6대 질병</b>(암·협심증·심근경색·뇌졸중·간경화·심장판막증) → <b>없음</b><br><br><b>인수 전략</b><br>· ②가 <b>2년 전·3년 전</b> 두 건이므로 5년 기준(3.x.5) 상품은 대부분 걸린다.<br>· 따라서 <b>②의 기준 연수가 1년인 상품</b>부터 검토한다 — 3.1.5 계열은 \"1년 이내 입원·수술\"만 묻는다. 백내장(2년 전)·담낭염(3년 전) 모두 <b>1년을 넘겼으므로 통과 가능</b>.<br>· 시도 순서 — <b>3.1.5 → 3.3.5 → 3.5.5 → 3.0.5</b> 순으로 조건과 보험료를 비교한다. 무조건 낮은 단계가 좋은 게 아니라 <b>통과되는 것 중 가장 저렴한 것</b>을 찾는 것이 목적이다.<br>· ③이 깨끗한 것이 큰 강점이다 — 6대 질병 이력이 없으면 간편심사 대부분에서 유리하다.<br><br><b>실무 확인 사항</b> — 백내장 수술 <b>정확한 날짜</b>, 담낭염 입원 <b>기간과 수술 여부</b>(절제술이면 수술 이력), 무릎 주사가 <b>처치인지 시술인지</b>. 이 세 가지를 서류로 확인한 뒤 청약한다."},
 {q:"자녀 3인이 보험료를 분담할 때 계약자 · 피보험자 · 수익자를 어떻게 설정할 것인가? 고려해야 할 위험은?",
  a:"<b>기본 구조 옵션</b><br>· <b>안 1</b> 계약자=어머니 / 피보험자=어머니 / 수익자=어머니(생존급부)·법정상속인(사망) → 가장 단순하나, 자녀가 낸 보험료가 <b>어머니에게 증여</b>된 것으로 볼 여지가 있다.<br>· <b>안 2</b> 계약자=자녀 1인 / 피보험자=어머니 / 수익자=계약자 → 관리는 편하나 <b>다른 형제와 분쟁</b> 소지가 크다. 보험금이 계약자 1인에게 귀속된다.<br>· <b>안 3</b> 계약자=어머니 / 자녀 3인이 <b>어머니에게 생활비를 지원</b>하고 어머니가 납입 → 실질에 부합하나 자금 흐름 기록이 필요하다.<br><br><b>고려해야 할 위험</b><br>① <b>세무</b> — 계약자·피보험자·수익자 관계에 따라 상속세·증여세·소득세 취급이 달라진다. <b>설계사가 단정하면 안 되며 세무 전문가 확인이 필수</b>다.<br>② <b>형제 분쟁</b> — 간병일당·입원일당 같은 생존급부는 실제로 <b>간병을 부담한 자녀</b>에게 가야 공정한데, 계약 구조가 그렇게 되어 있지 않으면 갈등이 생긴다.<br>③ <b>납입 중단 위험</b> — 3인 중 1인이 사정으로 빠지면 계약이 흔들린다. <b>대표 납입자 1인 + 정산 방식</b>이 실무적으로 안정적이다.<br>④ <b>피보험자 동의</b> — 타인을 피보험자로 하는 계약은 <b>피보험자의 서면 동의</b>가 반드시 필요하다(어머니 본인 서명).<br><br><b>실무 처리</b> — 3남매가 모인 자리에서 ㉠ 누가 계약자인지 ㉡ 매월 얼마씩 어떻게 정산하는지 ㉢ 생존급부는 누구에게 쓰는지 ㉣ 사망보험금 배분을 <b>메모로 남기고 각자 서명</b>하게 한다. 법적 효력이 완전하지 않더라도 <b>분쟁 예방 효과</b>가 크다."},
 {q:"\"나는 됐다, 애들 돈 쓰게 하기 싫다\"는 어머니의 거절을 어떻게 다룰 것인가?",
  a:"<b>이 말은 거절이 아니라 <u>자기 존엄에 대한 선언</u>이다.</b> 정면으로 설득하면 반발한다. 프레임을 뒤집는다.<br><br><b>하지 말아야 할 대응</b><br>· \"아니에요, 필요해요\" — 어머니의 판단을 부정한다<br>· \"자녀분들이 원하세요\" — 어머니를 결정에서 배제한다<br>· 공포 소구(\"치매 걸리면…\") — 70대에게 과도한 불안은 방어를 강화한다<br><br><b>권장 대응 — 방향 전환</b><br>\"어머님, 그 마음이 제일 중요한 마음이에요. 그런데 하나만 생각해 보세요.<br>지금 아무것도 안 하시면, 나중에 아프실 때 <b>애들이 회사를 쉬거나 돈을 내야</b> 합니다. 간병인이 월 400~500만원이거든요.<br>그런데 지금 <b>한 달에 몇만 원</b>으로 준비해 두시면, 그때 애들이 안 힘들어요.<br>이건 애들 돈을 쓰는 게 아니라 <b>어머님이 애들을 미리 도와주시는</b> 겁니다.\"<br><br><b>보조 장치</b><br>① <b>금액을 작게 쪼개 보여준다</b> — \"세 분이 <b>한 사람당 3만원</b>씩이에요. 커피 몇 잔이죠.\"<br>② <b>자녀가 직접 말하게 한다</b> — 설계사보다 딸이 \"엄마, 우리가 하고 싶어서 그래\"라고 말하는 것이 훨씬 강하다. 대화의 주도권을 딸에게 넘긴다.<br>③ <b>결정을 미루지 않는다</b> — \"오늘 결정 안 하셔도 됩니다. 다만 <b>되는지 안 되는지만</b> 먼저 확인해 볼게요.\" 인수 심사를 먼저 진행하면 심리적 문턱이 낮아진다."},
 {q:"이 케이스에서 상속 · 증여 논의로 확장하는 것이 적절한가? 적절하다면 언제, 어떻게 꺼낼 것인가?",
  a:"<b>적절하다. 단, 첫 상담에서는 절대 꺼내지 않는다.</b><br><br><b>이유 — 꺼내지 말아야 할 때</b><br>· 어머니가 살아 계신 자리에서 상속 얘기를 꺼내면 <b>\"내 죽을 날 계산하나\"</b>로 받아들여진다.<br>· 3남매 사이에 <b>합의되지 않은 이슈</b>일 가능성이 높다. 설계사가 먼저 꺼내면 갈등의 촉매가 된다.<br>· 간병 담보 계약도 아직 체결 전이다. <b>신뢰 자본이 부족</b>하다.<br><br><b>꺼내도 되는 시점 — 세 가지 신호</b><br>1) <b>고객(자녀)이 먼저 물을 때</b> — \"엄마 아파트는 나중에 어떻게 해야 해요?\" 가장 이상적.<br>2) <b>계약이 체결되고 6개월~1년 뒤 점검 상담</b>에서 자연스럽게.<br>3) <b>어머니 건강에 실제 변화가 생겼을 때</b> — 이때는 자녀들이 먼저 절박해진다.<br><br><b>꺼내는 방법</b><br>어머니가 없는 자리에서, 자녀에게 <b>질문 형태</b>로.<br>\"실례가 안 된다면 하나만 여쭤볼게요. 어머님 아파트 말인데요, <b>세 분이 나중에 어떻게 하실지</b> 얘기 나눠보신 적 있으세요? … 아직이시면, 지금 미리 정리해두시는 게 나중에 훨씬 편하세요. 제가 세무사님 소개해 드릴 수 있습니다.\"<br><br><b>선 긋기</b> — 상속세 계산, 증여 시점 판단, 아파트 명의 변경은 <b>세무·법무 영역</b>이다. 설계사는 <b>필요성을 인지시키고 전문가에게 연결</b>하는 역할까지만 한다. 직접 세액을 계산해 주면 안 된다."}
]

 body:"막히는 방식이 두 가지다. <b>뇌색전증</b>은 심장이나 목의 큰 혈관에서 만들어진 혈전(피떡)이 떨어져 나가 뇌혈관을 막는 것이고, <b>뇌혈전증</b>은 동맥경화로 뇌혈관이 점점 좁아지다가 그 자리에서 혈전이 생겨 막는 것이다.<br><b>실무 포인트</b> — 전체 뇌 질환 발병의 <b>44.4%</b>로 가장 큰 덩어리다(심평원 2022). 그런데 '뇌출혈진단비'만 갖고 있으면 <b>한 푼도 못 받는다</b>. 골든타임은 혈전용해제 4.5시간, 혈전제거술 6시간.",
 img:["an/an_027.jpg","an/an_029.jpg"], cov:["뇌혈관질환진단비","뇌졸중진단비","혈전용해치료비","혈전제거수술비"], cost:[8]},

{t:"뇌출혈", k:"뇌출혈 I60 I61 I62 뇌내출혈 지주막하출혈 출혈성뇌졸중 터짐 혈압", cat:"뇌", lv:"L3",
 one:"뇌혈관이 터져서 생기는 뇌혈관 장애. 코드 I60~I62.",
 body:"<b>뇌내출혈</b>은 고혈압이 주원인으로 뇌 속 혈관이 파열되는 것, <b>지주막하출혈</b>은 뇌동맥류가 주원인으로 뇌를 싸고 있는 지주막 아래 혈관이 파열되는 것이다.<br><b>실무 포인트</b> — 이름이 무서워서 고객이 가장 잘 아는 병이지만, 실제 발병 비중은 <b>8.7%</b>에 불과하다(지주막하 2.6 + 뇌내 5.1 + 기타 비외상성 1.0). 담보 범위가 가장 좁다.<br>20~30대에서는 오히려 뇌경색보다 <b>뇌출혈 비율이 높다</b>.",
 img:["an/an_022.jpg"], cov:["뇌출혈진단비","뇌졸중진단비","뇌혈관질환진단비"], cost:[8]},

{t:"뇌동맥류", k:"뇌동맥류 I67.1 코일색전술 클립결찰술 시한폭탄 파열 지주막하", cat:"뇌", lv:"L3",
 one:"뇌동맥 혈관이 풍선처럼 부풀어 오른 상태. 터지면 지주막하출혈이 된다. 코드 I67.1.",
 body:"<b>파열되기 전까지 증상이 거의 없다.</b> 국내 발생은 10만명당 <b>52.2명</b>, 파열로 인한 지주막하출혈은 10만명당 23.5명(분당서울대 김택균 교수팀, 100만명 9년 추적).<br><b>위험도</b> — 여성 <b>1.6배</b>, 심장질환자 <b>2배</b>, 고혈압 환자 <b>1.5배</b>, 가족력 <b>1.8배</b>.<br><b>치료</b> — 터지기 전에 <b>코일색전술</b>(혈관 안에서 코일로 채움) 또는 <b>클립결찰술</b>(개두 후 클립으로 묶음)로 예방한다.<br><b>담보 함정</b> — I67은 <b>뇌졸중형에 포함되지 않는다</b>. 뇌혈관질환(I60~I69)이어야 잡힌다.",
 img:["an/an_024.jpg","an/an_025.jpg"], cov:["뇌혈관질환진단비","뇌혈관수술비"], cost:[]},

{t:"뇌졸중", k:"뇌졸중 stroke 중풍 I60 I63 I65 I66 뇌졸중진단비", cat:"뇌", lv:"L3",
 one:"뇌출혈 + 뇌경색을 묶은 개념. 담보로는 I60~I63, I65, I66.",
 body:"터지면 뇌출혈(출혈성 뇌졸중), 막히면 뇌경색(허혈성 뇌졸중)이다. 담보 범위로는 <b>뇌출혈 < 뇌졸중 < 뇌혈관질환</b> 3단계 중 가운데.<br><b>빠지는 것</b> — I64(미분류 뇌졸중), <b>I67(기타 뇌혈관질환 38.9%)</b>, I68, <b>I69(후유증 6.7%)</b>. 즉 뇌동맥류와 뇌혈관질환 후유증이 안 잡힌다.<br><b>청년 뇌졸중</b> 15~45세 환자가 2013년 13,892명 → 2016년 <b>21,709명</b>으로 급증. 원인은 고지혈·고혈압·당뇨의 젊은층 확산.",
 img:["an/an_022.jpg","an/an_031.jpg"], cov:["뇌졸중진단비"], cost:[8]},

{t:"뇌혈관질환", k:"뇌혈관질환 I60 I69 가장넓은 뇌담보 I67 I68", cat:"뇌", lv:"L3",
 one:"I60~I69 전체. 뇌 담보 중 <b>가장 넓다</b>.",
 body:"뇌출혈(I60~62) + 뇌경색(I63) + 미분류 뇌졸중(I64) + 뇌전동맥·대뇌동맥 폐쇄협착(I65,I66) + <b>기타 뇌혈관질환(I67, 뇌동맥류·대뇌죽상경화증 포함)</b> + 달리 분류된 뇌혈관장애(I68) + <b>뇌혈관질환 후유증(I69)</b>.<br><b>왜 이걸 넣어야 하나</b> — 실제 발병에서 기타 뇌혈관질환이 <b>38.9%</b>, 후유증이 <b>6.7%</b>다. 좁은 담보로 보험료를 아끼면 실제 발병의 절반 가까이를 놓친다.",
 img:[], cov:["뇌혈관질환진단비","뇌혈관수술비"], cost:[8]},

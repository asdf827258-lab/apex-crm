<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>질병 보험가이드 · 질병 → 원인 → 치료과정 → 담보 → 화법</title>
<!--
  질병 보험가이드 — 고객 앞에서 답해야 하는 다섯 가지를 한 자리에.

  이 화면은 <b>아무 숫자도 스스로 만들지 않습니다.</b> 질병·담보·화법은 전부
  app/질병가이드-data.js 한 벌에서 나옵니다. 그 파일이 없으면 화면을 세우지 않고
  「자료를 못 읽었습니다」 라고 적습니다 — 빈 표를 그럴듯하게 세우지 않습니다.

  담보 이름은 app/index.html 의 INS_KEY·INS_AREA 가 아는 이름만 씁니다.
  질병코드는 KCD_DATA 에 있는 코드만 씁니다. scripts/check-disease.js 가 견줍니다.

  준법 문구와 상담사 이름은 상담자료 공통 덧붙임(apex-deck.js)이 붙입니다.
  여기서 따로 쓰지 않습니다 — 두 곳에 두면 언젠가 서로 달라집니다.
-->
<style>
  :root{
    --ink:#0D1117; --ink2:#1C2434; --ink3:#374151; --ink4:#6B7280; --ink5:#9AA2AD;
    --line:#E5E7EB; --line2:#EEF0F3; --bg:#F7F8FA; --card:#FFFFFF;
    --blue:#1A56DB; --blue-l:#EFF4FF; --green:#059669; --green-l:#ECFDF5;
    --red:#DC2626; --red-l:#FEF2F2; --amber:#D97706; --amber-l:#FFFBEB;
    --purple:#7C3AED; --purple-l:#F5F3FF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%;}
  b{font-weight:800;}
  a{color:var(--blue);}

  /* ── 머리 ── */
  .top{background:linear-gradient(135deg,#0F172A 0%,#1A56DB 68%,#38BDF8 130%);color:#fff;padding:26px 20px 22px;}
  .top .wrap{max-width:1180px;margin:0 auto;}
  .top .ey{font-size:11px;font-weight:800;letter-spacing:.14em;color:#BFDBFE;}
  .top h1{font-size:23px;font-weight:800;letter-spacing:-.03em;margin:6px 0 7px;}
  .top p{font-size:13px;color:#DBEAFE;max-width:760px;}
  .top .flow{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;}
  .top .flow span{font-size:11.5px;font-weight:800;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;}

  /* ── 도구줄 ── */
  .bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:11px 20px;}
  .bar .wrap{max-width:1180px;margin:0 auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
  .q{flex:1;min-width:200px;font-family:inherit;font-size:13.5px;padding:10px 14px;
    border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);}
  .q:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.1);}
  .btn{font-family:inherit;font-size:12.5px;font-weight:800;padding:9px 15px;border-radius:10px;
    border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;white-space:nowrap;}
  .btn:hover{border-color:var(--blue);color:var(--blue);}
  .btn.on{background:var(--blue);border-color:var(--blue);color:#fff;}

  .main{max-width:1180px;margin:0 auto;padding:20px 20px 120px;}

  /* ── 질병 고르기 ── */
  .grp{margin-bottom:22px;}
  .grp-hd{display:flex;align-items:baseline;gap:9px;margin:0 0 10px;}
  .grp-hd h2{font-size:15px;font-weight:800;letter-spacing:-.02em;}
  .grp-hd span{font-size:11.5px;color:var(--ink4);}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:11px;}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;
    cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;text-align:left;
    font-family:inherit;color:inherit;width:100%;display:block;}
  .dcard:hover{border-color:var(--blue);box-shadow:0 6px 18px rgba(15,23,42,.07);transform:translateY(-1px);}
  .dcard .ic{font-size:21px;}
  .dcard .nm{font-size:15px;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em;}
  .dcard .one{font-size:12px;color:var(--ink4);line-height:1.55;}
  .dcard .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
  .dcard .tags i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--blue);
    background:var(--blue-l);border-radius:6px;padding:2px 7px;}
  .none{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:26px;
    text-align:center;font-size:13px;color:var(--ink4);}

  /* ── 상세 ── */
  .detail{display:none;}
  .detail.on{display:block;}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:19px 20px;margin-bottom:13px;}
  .sec>h3{font-size:14.5px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-bottom:11px;}
  .sec>h3 em{font-style:normal;font-size:10.5px;font-weight:800;color:#fff;background:var(--ink2);
    border-radius:6px;padding:2px 7px;letter-spacing:.03em;}
  .sec p{font-size:13.5px;color:var(--ink3);margin-bottom:9px;}
  .sec p:last-child{margin-bottom:0;}

  .hero{background:linear-gradient(135deg,#0F172A,#1A56DB 72%);color:#fff;border:0;}
  .hero h2{font-size:24px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:10px;}
  .hero .one{font-size:14px;color:#DBEAFE;margin-top:8px;}
  .hero .codes{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
  .hero .codes i{font-style:normal;font-size:11px;font-weight:700;background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:4px 9px;}
  .hero .codes i b{font-family:'Menlo',monospace;font-weight:800;margin-right:5px;color:#93C5FD;}

  .ul{list-style:none;}
  .ul li{font-size:13px;color:var(--ink3);padding:6px 0 6px 17px;position:relative;border-bottom:1px dashed var(--line2);}
  .ul li:last-child{border-bottom:0;}
  .ul li:before{content:'';position:absolute;left:3px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--blue);}
  .ul.warn li:before{background:var(--red);}

  /* 범위표 */
  .range{border:1.5px solid var(--red);border-radius:14px;overflow:hidden;background:var(--red-l);}
  .range .rh{font-size:13px;font-weight:800;color:var(--red);padding:11px 14px;border-bottom:1px solid rgba(220,38,38,.2);}
  .range table{width:100%;border-collapse:collapse;background:#fff;}
  .range th,.range td{font-size:12.5px;text-align:left;padding:9px 13px;border-bottom:1px solid var(--line2);}
  .range th{background:#FAFBFC;font-weight:800;color:var(--ink4);font-size:11px;letter-spacing:.03em;}
  .range td.c{font-family:'Menlo',monospace;font-weight:800;color:var(--blue);}
  .range .rd{font-size:12.5px;color:var(--ink3);padding:11px 14px;}

  /* 치료 여정 */
  .path{display:flex;flex-direction:column;gap:0;}
  .stage{display:grid;grid-template-columns:44px 1fr;gap:13px;position:relative;padding-bottom:16px;}
  .stage:last-child{padding-bottom:0;}
  .stage .rail{position:relative;display:flex;flex-direction:column;align-items:center;}
  .stage .dot{width:38px;height:38px;border-radius:12px;background:var(--blue-l);border:1.5px solid var(--blue);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;}
  .stage .line{flex:1;width:2px;background:var(--line);margin-top:5px;min-height:14px;}
  .stage:last-child .line{display:none;}
  .stage .body{padding-bottom:3px;}
  .stage .k{font-size:14px;font-weight:800;letter-spacing:-.02em;}
  .stage .dur{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-l);
    border-radius:6px;padding:2px 8px;margin-left:7px;}
  .stage .desc{font-size:12.8px;color:var(--ink3);margin-top:5px;}
  .stage .pays{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
  .stage .pay{font-size:11.5px;font-weight:700;color:var(--green);background:var(--green-l);
    border:1px solid rgba(5,150,105,.25);border-radius:999px;padding:4px 11px;cursor:pointer;
    font-family:inherit;}
  .stage .pay:hover{background:#D1FAE5;}
  .stage .nopay{font-size:11.5px;color:var(--ink5);background:#F3F4F6;border-radius:999px;padding:4px 11px;}
  .stage .watch{font-size:12.3px;color:var(--ink3);background:var(--amber-l);
    border-left:3px solid var(--amber);border-radius:0 9px 9px 0;padding:9px 12px;margin-top:9px;}
  .stage .watch b{color:#92400E;}

  /* 막히는 자리 */
  .traps{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px;}
  .trap{background:var(--red-l);border:1px solid rgba(220,38,38,.22);border-radius:12px;padding:13px 14px;}
  .trap .t{font-size:13px;font-weight:800;color:var(--red);margin-bottom:5px;}
  .trap .d{font-size:12.3px;color:var(--ink3);}

  /* 화법 */
  .talk-open{background:var(--purple-l);border-left:3px solid var(--purple);border-radius:0 10px 10px 0;
    padding:12px 14px;font-size:13.2px;color:var(--ink2);margin-bottom:13px;}
  .spin{display:grid;gap:7px;margin-bottom:13px;}
  .spin .row{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;
    background:#FAFBFC;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;}
  .spin .lb{font-size:12px;font-weight:800;color:#fff;background:var(--purple);border-radius:7px;
    text-align:center;padding:3px 0;}
  .spin .tx{font-size:13px;color:var(--ink2);}
  .bi{font-size:13px;color:var(--ink2);background:var(--blue-l);border-radius:11px;padding:12px 14px;margin-bottom:13px;}
  .bi:before{content:'비유 ';font-size:10.5px;font-weight:800;color:var(--blue);letter-spacing:.06em;display:block;margin-bottom:4px;}
  .obj{display:grid;gap:8px;}
  .obj .o{border:1px solid var(--line);border-radius:11px;overflow:hidden;}
  .obj .oq{font-size:12.8px;font-weight:800;color:var(--ink2);background:#FAFBFC;padding:9px 13px;border-bottom:1px solid var(--line2);}
  .obj .oq:before{content:'“';}.obj .oq:after{content:'”';}
  .obj .oa{font-size:12.8px;color:var(--ink3);padding:10px 13px;}

  /* 근거 */
  .src{list-style:none;}
  .src li{font-size:12.3px;padding:7px 0;border-bottom:1px dashed var(--line2);}
  .src li:last-child{border-bottom:0;}
  .src a{text-decoration:none;font-weight:700;}
  .src a:hover{text-decoration:underline;}

  /* 담보 되짚기 */
  .cov{display:grid;gap:9px;}
  .cov .c{border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .cov .cn{font-size:13.2px;font-weight:800;color:var(--green);margin-bottom:6px;}
  .cov .cl{font-size:12.3px;color:var(--ink3);padding:3px 0;}
  .cov .cl b{color:var(--ink2);}

  .disc{background:#FAFBFC;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:14px;}
  .disc div{font-size:11.8px;color:var(--ink4);padding:4px 0;}
  .disc div b{color:var(--ink3);}

  .backrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px;}

  /* ── 그림 — 확대해서 들여다보기 ─────────────────────────────
     조직은 돌려 보는 것이 아니라 들여다보는 것입니다. 끌면 옮겨지고,
     + − · 두 손가락 · 두 번 누르기로 크게 봅니다. 이름표를 끄면
     고객 앞에서 하나씩 짚어 가며 설명하실 수 있습니다. */
  .dzart{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#FBFCFD;}
  .dzart-tools{display:flex;gap:6px;padding:9px 11px;border-bottom:1px solid var(--line2);
    background:#FAFBFC;flex-wrap:wrap;align-items:center;}
  .dzart-b{font-family:inherit;font-size:12px;font-weight:800;padding:6px 12px;border-radius:8px;
    border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;}
  .dzart-b:hover{border-color:var(--blue);color:var(--blue);}
  .dzart-b.on{background:var(--blue);border-color:var(--blue);color:#fff;}
  .dzart-view{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;
    background:#fff;overflow:hidden;}
  .dzart.dragging .dzart-view{cursor:grabbing;}
  .dzart-view svg{display:block;width:100%;height:auto;}
  .dzart.nolbl .lbl{display:none;}
  .dzart-hint{font-size:11px;color:var(--ink5);padding:8px 12px;border-top:1px solid var(--line2);background:#FAFBFC;}
  .dzflat{overflow-x:auto;padding:6px 2px 4px;}
  .dzflat svg{display:block;margin:0 auto;}
  .dzrow{display:flex;gap:14px;align-items:flex-end;justify-content:center;min-width:min-content;}
  .viz{border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px;background:#fff;}
  .viz .vt{font-size:14px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;}
  .viz .vd{font-size:12.8px;color:var(--ink3);margin-bottom:12px;}
  .viz .vn{font-size:11px;color:var(--ink5);margin-top:10px;}

  /* ── 술식 ── */
  .ops{display:grid;gap:10px;}
  .op{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;}
  .op .oh{background:#FAFBFC;border-bottom:1px solid var(--line2);padding:11px 14px;
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .op .on{font-size:14px;font-weight:800;letter-spacing:-.02em;}
  .op .oe{font-size:11px;font-weight:700;color:var(--ink5);font-family:'Menlo',monospace;}
  .op .ok{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 8px;margin-left:auto;}
  .op .ok.수술{background:#EFF4FF;color:var(--blue);}
  .op .ok.시술,.op .ok.검사·시술,.op .ok.수술·시술{background:#F5F3FF;color:var(--purple);}
  .op .ok.약물,.op .ok.방사선,.op .ok.치료{background:#ECFDF5;color:var(--green);}
  .op .ok.재활,.op .ok.돌봄,.op .ok.검사,.op .ok.제도{background:#FFFBEB;color:var(--amber);}
  .op .ob{padding:12px 14px;}
  .op .orow{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:5px 0;font-size:12.8px;color:var(--ink3);}
  .op .orow i{font-style:normal;font-size:10.5px;font-weight:800;color:#fff;background:var(--ink4);
    border-radius:6px;text-align:center;padding:3px 0;height:fit-content;}
  .op .orow i.ins{background:var(--red);}
  .op .pays{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}

  /* ── 설계사 전용 · 이렇게 설계합니다 ─────────────────────────
     고객 화면과 눈에 띄게 다르게 합니다. 실수로 고객 앞에서 펴지 않도록. */
  .sec.pro{border:1.5px solid #0F172A;background:linear-gradient(180deg,#F8FAFC,#fff);}
  .sec.pro>h3 em{background:#0F172A;}
  .pro-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;
    color:#fff;background:#0F172A;border-radius:6px;padding:3px 9px;margin-left:auto;letter-spacing:.02em;}
  .pro-why{background:#0F172A;border-radius:12px;padding:14px 16px;margin-bottom:13px;}
  .pro-why div{font-size:13px;color:#E2E8F0;padding:4px 0;line-height:1.7;}
  .pro-why div b{color:#FCD34D;}
  .pro-why div:before{content:'· ';color:#64748B;}
  .fear{display:grid;gap:9px;margin-bottom:14px;}
  .fear .f{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:0 12px 12px 0;
    background:#fff;padding:12px 14px;}
  .fear .fs{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.65;}
  .fear .fw{font-size:12.2px;color:var(--ink4);margin-top:7px;padding-left:11px;border-left:2px solid var(--line);}
  .fear .ft{font-size:12.8px;color:#065F46;background:var(--green-l);border-radius:8px;padding:8px 11px;margin-top:8px;}
  .lay{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px;background:#fff;}
  .lay .lh{background:#0F172A;color:#fff;padding:10px 14px;}
  .lay .ln{font-size:13.5px;font-weight:800;}
  .lay .ld{font-size:11.8px;color:#CBD5E1;margin-top:3px;}
  .lay table{width:100%;border-collapse:collapse;}
  .lay th{font-size:10.5px;font-weight:800;color:var(--ink4);background:#FAFBFC;text-align:left;
    padding:7px 12px;border-bottom:1px solid var(--line2);letter-spacing:.03em;}
  .lay td{font-size:12.4px;color:var(--ink3);padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top;}
  .lay tr:last-child td{border-bottom:0;}
  .lay td.k{font-weight:800;color:var(--green);white-space:nowrap;}
  .lay td.s{font-weight:700;color:var(--blue);white-space:nowrap;}
  .lay td.g{color:var(--red);}
  .lay .kbtn{font-family:inherit;font-size:12.4px;font-weight:800;color:var(--green);background:none;
    border:0;padding:0;cursor:pointer;text-align:left;text-decoration:underline dotted;}
  .pro-first{background:var(--blue-l);border-radius:11px;padding:12px 14px;margin-bottom:11px;}
  .pro-first div{font-size:12.8px;color:var(--ink2);padding:3px 0;}
  .pro-check{background:#FFFBEB;border:1px solid rgba(217,119,6,.3);border-radius:11px;padding:12px 14px;}
  .pro-check .t{font-size:12px;font-weight:800;color:#B45309;margin-bottom:6px;}
  .pro-check div.c{font-size:12.6px;color:var(--ink3);padding:4px 0 4px 16px;position:relative;}
  .pro-check div.c:before{content:'□';position:absolute;left:0;color:#D97706;font-weight:800;}

  /* ── 설계 연습 ─────────────────────────────────────────────
     체크만 하고 끝나면 연습이 아닙니다. 채점 뒤에 <b>그래서 무슨 말을
     하는지</b> 까지 나와야 그날 상담에서 씁니다. */
  .drill-hd{background:#0F172A;color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:13px;}
  .drill-hd h4{font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .drill-hd p{font-size:12.5px;color:#CBD5E1;margin-top:6px;line-height:1.65;}
  .drill-pick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px;}
  .drill-pick button{font-family:inherit;font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;}
  .drill-pick button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .dl{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px;background:#fff;}
  .dl .dlh{background:#FAFBFC;border-bottom:1px solid var(--line2);padding:10px 14px;}
  .dl .dln{font-size:13.5px;font-weight:800;}
  .dl .dld{font-size:11.8px;color:var(--ink4);margin-top:3px;}
  .dl label{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line2);
    cursor:pointer;font-size:13px;}
  .dl label:last-child{border-bottom:0;}
  .dl label:hover{background:#FAFBFC;}
  .dl input{margin-top:3px;width:17px;height:17px;accent-color:#1A56DB;flex:0 0 auto;cursor:pointer;}
  .dl .dk{font-weight:800;color:var(--ink);}
  .dl .ds{font-size:11.5px;color:var(--ink4);font-weight:700;margin-left:6px;}
  .drill-run{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0;}
  .btn-run{font-family:inherit;font-size:13.5px;font-weight:800;padding:11px 20px;border-radius:11px;
    border:0;background:var(--blue);color:#fff;cursor:pointer;}
  .btn-run:hover{background:#1447B8;}
  .score{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#0F172A;border-radius:14px;
    padding:16px 18px;margin-bottom:13px;}
  .score .n{font-size:34px;font-weight:800;color:#fff;line-height:1;font-family:'Menlo',monospace;}
  .score .n em{font-style:normal;font-size:17px;color:#94A3B8;}
  .score .t{flex:1;min-width:200px;}
  .score .t b{display:block;font-size:14.5px;color:#fff;}
  .score .t span{font-size:12.3px;color:#CBD5E1;}
  .miss{border:1px solid rgba(220,38,38,.3);border-radius:12px;overflow:hidden;margin-bottom:11px;}
  .miss .mh{background:var(--red);color:#fff;font-size:12.5px;font-weight:800;padding:9px 14px;}
  .miss .m{padding:11px 14px;border-bottom:1px solid var(--line2);}
  .miss .m:last-child{border-bottom:0;}
  .miss .mk{font-size:13.2px;font-weight:800;color:var(--red);}
  .miss .md{font-size:12.4px;color:var(--ink3);margin-top:4px;}
  .miss .mg{font-size:12.4px;color:var(--ink2);background:var(--red-l);border-radius:8px;padding:7px 10px;margin-top:6px;}
  .got{border:1px solid rgba(5,150,105,.3);border-radius:12px;overflow:hidden;margin-bottom:11px;}
  .got .gh{background:var(--green);color:#fff;font-size:12.5px;font-weight:800;padding:9px 14px;}
  .got .g{font-size:12.6px;color:var(--ink3);padding:9px 14px;border-bottom:1px solid var(--line2);}
  .got .g:last-child{border-bottom:0;}
  .got .g b{color:var(--green);}
  .script{border:1.5px solid var(--purple);border-radius:14px;overflow:hidden;margin-bottom:11px;}
  .script .sh{background:var(--purple);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .script .sh b{font-size:13.5px;font-weight:800;}
  .script .sh span{font-size:11.5px;color:#EDE9FE;}
  .script .sb{padding:14px 16px;background:#fff;}
  .script .step{margin-bottom:13px;}
  .script .step:last-child{margin-bottom:0;}
  .script .sk{font-size:10.5px;font-weight:800;color:var(--purple);letter-spacing:.06em;margin-bottom:5px;}
  .script .sl{font-size:13.6px;color:var(--ink);line-height:1.75;}
  .script .sl+.sl{margin-top:6px;}
  .cpbtn{font-family:inherit;font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:8px;
    border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.15);color:#fff;cursor:pointer;margin-left:auto;}

  /* ── 사례 ── */
  .cases{display:grid;gap:11px;}
  .case{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;}
  .case .ch{padding:11px 14px;border-bottom:1px solid var(--line2);background:#FAFBFC;}
  .case .cn{font-size:14px;font-weight:800;letter-spacing:-.02em;}
  .case .cw{font-size:11.8px;color:var(--ink4);margin-top:3px;}
  .case .cb{padding:12px 14px;}
  .case .cst{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:12.5px;color:var(--ink3);
    padding:5px 0;border-bottom:1px dashed var(--line2);}
  .case .cst:last-of-type{border-bottom:0;}
  .case .cst b{color:var(--ink2);}
  .case .cpay{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0;}
  .case .cpay span{font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 11px;
    border:1px solid;background:#fff;}
  .case .clesson{font-size:12.5px;color:var(--ink2);background:var(--blue-l);border-radius:9px;
    padding:10px 12px;margin-top:10px;}
  .case .cgap{font-size:12.3px;color:var(--ink3);background:var(--amber-l);border-left:3px solid var(--amber);
    border-radius:0 9px 9px 0;padding:9px 12px;margin-top:9px;}
  .case .cwarn{font-size:11px;color:var(--ink5);margin-top:9px;}

  /* ── 용어 ── */
  .terms{display:grid;gap:9px;}
  .term{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;}
  .term .tt{font-size:13.5px;font-weight:800;letter-spacing:-.02em;}
  .term .te{font-size:11px;font-weight:700;color:var(--ink5);font-family:'Menlo',monospace;margin-left:7px;}
  .term .td{font-size:12.8px;color:var(--ink3);margin-top:5px;}
  .term .ti{font-size:12.3px;color:var(--ink3);background:var(--green-l);border-left:3px solid var(--green);
    border-radius:0 9px 9px 0;padding:8px 11px;margin-top:8px;}
  .term .ti b{color:#065F46;}

  @media(max-width:640px){
    .top h1{font-size:19px;} .main{padding:15px 13px 130px;}
    .sec{padding:15px 14px;} .hero h2{font-size:20px;}
    .cards{grid-template-columns:1fr;}
    .dzart-hint{font-size:10.5px;}
  }

  /* ── 인쇄 — 고객께 드리는 자료가 잘리면 안 됩니다 ── */
  @media print{
    body{background:#fff;}
    .bar,.backrow,.noprint{display:none !important;}
    .top{background:#0F172A !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .main{max-width:none;padding:0;}
    .sec,.stage,.trap,.dcard,.range,.obj .o{page-break-inside:avoid;break-inside:avoid;}
    .sec{border-color:#D5D9E0;box-shadow:none;margin-bottom:9px;}
    .detail.on{display:block !important;}
    .cards{grid-template-columns:1fr 1fr;}
    a{color:#1A56DB;text-decoration:none;}
    .stage .pay,.trap,.bi,.talk-open,.stage .watch,.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    /* 종이에서는 확대할 수 없으니 처음 크기 그대로, 이름표는 켜서 인쇄한다 */
    .dzart{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .dzart-tools,.dzart-hint{display:none;}
    .dzart.nolbl .lbl{display:inline;}
    .viz,.op,.case,.term,.dzflat,.dzart,.lay,.fear .f{page-break-inside:avoid;break-inside:avoid;}
    .sec.pro{border-color:#0F172A;}
    .pro-why,.lay .lh{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .dzflat{overflow:visible;}
    .dzflat svg,.dzrow svg{max-width:100%;height:auto;}
  }
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="ey">APEX YUN PRO · 질병 보험가이드</div>
  <h1>질병 → 원인 → 치료과정 → 담보 → 화법</h1>
  <p>고객 앞에서 답해야 하는 다섯 가지를 질병마다 한 자리에 모았습니다.
     담보 이름은 보장분석이 쓰는 이름 그대로이고, 숫자는 출처가 있는 것만 적었습니다.</p>
  <div class="flow"><span>① 어떤 병인가</span><span>② 왜 생기나</span><span>③ 어떻게 치료하나</span>
    <span>④ 그때 나오는 담보</span><span>⑤ 어떻게 말하나</span></div>
</div></div>

<div class="bar"><div class="wrap">
  <input class="q" id="q" placeholder="질병 · 증상 · 담보 이름으로 찾기 (예: 뇌경색, 표적항암, 투석, 간병)" oninput="paint()">
  <button class="btn" id="bAll" onclick="setGrp('')">전체</button>
  <span id="grpBtns"></span>
  <button class="btn" onclick="covAll()">💊 담보 말모이</button>
  <button class="btn" onclick="termsAll()">📖 용어 사전</button>
  <button class="btn" onclick="drillOpen('')">🎯 설계 연습</button>
  <button class="btn" onclick="printAll()">📚 전부 펼쳐 인쇄</button>
  <button class="btn" onclick="window.print()">🖨 인쇄</button>
</div></div>

<div class="main">
  <div id="listPane"></div>
  <div class="detail" id="detailPane"></div>
</div>

<script src="../질병가이드-data.js"></script>
<script src="../질병가이드-도해.js"></script>
<script src="../상담자료/apex-deck.js"></script>
<script>
'use strict';

var D = window.DZ_DATA || null;
var GRP = '';
var CUR = '';

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* 자료 안의 <b> 만 살린다 — 나머지 태그는 글자로 만든다 */
function rich(s){ return esc(s).replace(/&lt;(\/?b)&gt;/g,'<$1>'); }

function payName(p){ return p.k + (p.n ? '(' + p.n + ')' : ''); }

/* ── 자료를 못 읽었으면 화면을 세우지 않는다 ───────────────────
   빈 표를 그럴듯하게 세우면 상담 자리에서 없는 것을 있는 것처럼 말하게 된다. */
function noData(why){
  document.getElementById('listPane').innerHTML =
    '<div class="none"><b>아무 자료도 만들지 않습니다.</b><br><br>' + esc(why) +
    '<br><br>app/질병가이드-data.js 가 함께 올라갔는지 확인해 주세요.</div>';
}

/* ══ 목록 ══════════════════════════════════════════════════ */
function hit(d, q){
  if (!q) return true;
  var hay = [d.name, d.one, d.find, d.grp].join(' ');
  (d.path || []).forEach(function(s){
    hay += ' ' + s.k + ' ' + s.desc;
    (s.pay || []).forEach(function(p){ hay += ' ' + payName(p); });
  });
  (d.trap || []).forEach(function(t){ hay += ' ' + t.t; });
  return hay.indexOf(q) >= 0;
}

function listHtml(){
  var q = (document.getElementById('q').value || '').replace(/^\s+|\s+$/g,'');
  var h = '', any = 0;
  D.grp.forEach(function(g){
    if (GRP && GRP !== g.k) return;
    var rows = D.list.filter(function(d){ return d.grp === g.k && hit(d, q); });
    if (!rows.length) return;
    any += rows.length;
    h += '<div class="grp"><div class="grp-hd"><h2>' + g.ic + ' ' + esc(g.k) +
         '</h2><span>' + esc(g.d) + '</span></div><div class="cards">';
    rows.forEach(function(d){
      h += '<button class="dcard" onclick="open_(\'' + d.id + '\')">' +
           '<div class="ic">' + d.ic + '</div>' +
           '<div class="nm">' + esc(d.name) + '</div>' +
           '<div class="one">' + rich(d.one) + '</div>' +
           '<div class="tags"><i>치료 ' + d.path.length + '단계</i>' +
           '<i>막히는 자리 ' + (d.trap || []).length + '</i>' +
           (d.range ? '<i>범위 함정</i>' : '') + '</div></button>';
    });
    h += '</div></div>';
  });
  if (!any) h = '<div class="none">찾는 말이 없습니다. 다른 낱말로 해 보세요 — 예: 뇌경색, 표적항암, 투석, 간병, 유사암.</div>';
  return h;
}

/* ══ 상세 ══════════════════════════════════════════════════ */
function stageHtml(s){
  var pays = (s.pay || []).length
    ? (s.pay || []).map(function(p){
        return '<button class="pay" onclick="findCov(\'' + esc(p.k).replace(/'/g,'') + '\')">' +
               esc(payName(p)) + '</button>'; }).join('')
    : '<span class="nopay">이 단계에서 열리는 담보 없음</span>';
  return '<div class="stage"><div class="rail"><div class="dot">' + s.ic + '</div><div class="line"></div></div>' +
    '<div class="body"><div><span class="k">' + esc(s.k) + '</span>' +
    '<span class="dur">' + esc(s.dur) + '</span></div>' +
    '<div class="desc">' + rich(s.desc) + '</div>' +
    '<div class="pays">' + pays + '</div>' +
    (s.watch ? '<div class="watch"><b>여기서 갈립니다 · </b>' + rich(s.watch) + '</div>' : '') +
    '</div></div>';
}

function detailHtml(d){
  return '<div class="backrow noprint">' +
    '<button class="btn" onclick="close_()">← 질병 목록</button>' +
    '<button class="btn" onclick="window.print()">🖨 이 질병 인쇄</button></div>' +
    detailBody(d) + discHtml();
}

/* 한 질병의 몸통 — 화면에서 여는 것과 전부 인쇄가 <b>같은 글</b>을 쓴다 */
function detailBody(d){
  var h = '';

  /* 표지 */
  h += '<div class="sec hero"><h2>' + d.ic + ' ' + esc(d.name) + '</h2>' +
       '<div class="one">' + rich(d.one) + '</div>';
  if ((d.codes || []).length) {
    h += '<div class="codes">' + d.codes.map(function(c){
      return '<i><b>' + esc(c[0]) + '</b>' + esc(c[1]) + '</i>'; }).join('') + '</div>';
  }
  h += '</div>';

  /* ① 어떤 병인가 */
  h += '<div class="sec"><h3><em>①</em>어떤 병입니까</h3>' +
       (d.what || []).map(function(t){ return '<p>' + rich(t) + '</p>'; }).join('') + '</div>';

  /* ② 그림으로 — 말로 3분 걸리는 것을 10초에 */
  h += vizHtml(d);

  /* 범위 함정 */
  if (d.range) {
    h += '<div class="sec"><h3><em>!</em>범위가 곧 돈입니다</h3><div class="range">' +
      '<div class="rh">' + rich(d.range.t) + '</div>' +
      '<table><tr><th>담보가 담는 말</th><th>코드 범위</th><th>차지하는 몫</th></tr>' +
      d.range.rows.map(function(r){
        return '<tr><td><b>' + esc(r[0]) + '</b></td><td class="c">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>';
      }).join('') + '</table>' +
      '<div class="rd">' + rich(d.range.d) + '</div></div></div>';
  }

  /* ② 왜 생기나 */
  h += '<div class="sec"><h3><em>③</em>왜 생깁니까</h3>' +
       (d.cause.why || []).map(function(t){ return '<p>' + rich(t) + '</p>'; }).join('') +
       '<ul class="ul">' + (d.cause.risk || []).map(function(r){
         return '<li>' + rich(r) + '</li>'; }).join('') + '</ul>' +
       '<div class="watch" style="margin-top:11px;font-size:12.3px;color:#374151;background:#FFFBEB;' +
       'border-left:3px solid #D97706;border-radius:0 9px 9px 0;padding:9px 12px;">' +
       '<b>말할 때 · </b>' + rich(d.cause.say) + '</div></div>';

  /* ③ 치료과정 + ④ 담보 */
  h += '<div class="sec"><h3><em>④</em>어떻게 치료하고, 그때 어떤 담보가 나옵니까</h3>' +
       '<p style="font-size:12.5px;color:#6B7280;margin-bottom:14px;">' +
       '초록 알약이 그 단계에서 열리는 담보입니다. 눌러 보시면 <b>그 담보가 다른 질병 어디에서 또 일하는지</b> 보여 드립니다.</p>' +
       '<div class="path">' + d.path.map(stageHtml).join('') + '</div></div>';

  /* ⑤ 술식 상세 · ⑥ 사례 · ⑦ 설계사용 설계 */
  h += opsHtml(d) + casesHtml(d) + planHtml(d);

  /* ⑧ 막히는 자리 */
  if ((d.trap || []).length) {
    h += '<div class="sec"><h3><em>⑧</em>여기서 자주 막힙니다</h3><div class="traps">' +
      d.trap.map(function(t){
        return '<div class="trap"><div class="t">' + esc(t.t) + '</div><div class="d">' + rich(t.d) + '</div></div>';
      }).join('') + '</div></div>';
  }

  /* ⑥ 화법 */
  h += '<div class="sec"><h3><em>⑨</em>어떻게 말합니까</h3>' +
    '<div class="talk-open">' + rich(d.talk.open) + '</div>' +
    '<div class="spin">' + (d.talk.spin || []).map(function(s){
      return '<div class="row"><div class="lb">' + esc(s[0]) + '</div><div class="tx">' + rich(s[1]) + '</div></div>';
    }).join('') + '</div>' +
    (d.talk.bi ? '<div class="bi">' + rich(d.talk.bi) + '</div>' : '') +
    '<div class="obj">' + (d.talk.obj || []).map(function(o){
      return '<div class="o"><div class="oq">' + esc(o[0]) + '</div><div class="oa">' + rich(o[1]) + '</div></div>';
    }).join('') + '</div></div>';

  /* ⑦ 근거 */
  h += '<div class="sec"><h3><em>⑩</em>근거</h3>';
  if ((d.src || []).length) {
    h += '<ul class="src">' + d.src.map(function(s){
      return '<li>· ' + esc(s[0]) + ' <a href="' + esc(s[1]) + '" target="_blank" rel="noopener">원문 ↗</a></li>';
    }).join('') + '</ul>';
  } else {
    h += '<p style="font-size:12.5px;color:#6B7280;">이 질병에는 <b>아직 확인한 기사·통계를 붙이지 않았습니다.</b> ' +
         '확인하지 못한 숫자를 적지 않으려고 비워 둡니다 — 상담에서는 이 화면의 설명까지만 쓰시고, ' +
         '숫자가 필요하면 1차 자료를 직접 확인해 인용하십시오.</p>';
  }
  h += '</div>';

  return h;
}

/* 전부 펼쳐 인쇄 — 한 권으로 묶어 들고 다니실 수 있게.
   화면에서 하나씩 여는 것과 <b>같은 글</b>을 그대로 이어 붙인다. 인쇄용 글을
   따로 쓰지 않는다 — 두 벌이 되면 한쪽만 고쳐지고, 인쇄물만 옛말을 하게 된다. */
function printAll(){
  var h = '<div class="backrow noprint">' +
    '<button class="btn" onclick="close_()">← 질병 목록</button>' +
    '<button class="btn" onclick="window.print()">🖨 지금 인쇄</button></div>';
  h += '<div class="sec hero"><h2>📚 질병 보험가이드 — 전부</h2>' +
    '<div class="one">질병 ' + D.list.length + '종 · 담보 ' + (D.cov || []).length + '가지</div></div>';
  D.list.forEach(function(d){ h += detailBody(d); });
  h += discHtml();
  showDetail(h);
  setTimeout(function(){ try { window.print(); } catch (e) {} }, 400);
}

/* ══ 담보 되짚기 — 이 담보는 어디에서 일하나 ══════════════ */
function findCov(name){
  var rows = [];
  D.list.forEach(function(d){
    d.path.forEach(function(s){
      (s.pay || []).forEach(function(p){
        if (p.k === name) rows.push({ d: d, s: s, p: p });
      });
    });
  });
  var h = '<div class="backrow noprint">' +
    '<button class="btn" onclick="close_()">← 질병 목록</button>' +
    (CUR ? '<button class="btn" onclick="open_(\'' + CUR + '\')">← 보던 질병으로</button>' : '') + '</div>';
  var v = vocab(name);
  h += '<div class="sec"><h3><em>담보</em>' + esc(name) + ' 는 어디에서 일합니까</h3>';
  if (v) {
    h += '<div class="bi" style="background:#ECFDF5;"><span style="font-size:10.5px;font-weight:800;' +
      'color:#059669;letter-spacing:.06em;display:block;margin-bottom:4px;">무슨 돈입니까</span>' +
      rich(v.d) + '</div>';
    if (v.w) h += '<div class="stage"><div class="body" style="grid-column:1/-1"><div class="watch">' +
      '<b>여기서 갈립니다 · </b>' + rich(v.w) + '</div></div></div>';
  }
  h += '<p style="font-size:12.5px;color:#6B7280;margin:12px 0;">이 담보 하나가 <b>몇 개의 질병, 몇 개의 단계</b>에서 열리는지 보여 드립니다. ' +
    '고객에게 「이 담보 왜 넣어요?」 라는 질문을 받으면 이 화면을 보여 주십시오.</p><div class="cov">';
  if (!rows.length) {
    h += '<div class="none">이 담보가 걸린 단계를 찾지 못했습니다.</div>';
  } else {
    var by = {};
    rows.forEach(function(r){ (by[r.d.id] = by[r.d.id] || { d: r.d, rows: [] }).rows.push(r); });
    Object.keys(by).forEach(function(k){
      var g = by[k];
      h += '<div class="c"><div class="cn">' + g.d.ic + ' ' + esc(g.d.name) + '</div>' +
        g.rows.map(function(r){
          return '<div class="cl">' + r.s.ic + ' <b>' + esc(r.s.k) + '</b> · ' + esc(r.s.dur) +
                 ' — ' + esc(payName(r.p)) + '</div>';
        }).join('') +
        '<div style="margin-top:8px"><button class="btn noprint" onclick="open_(\'' + g.d.id + '\')">이 질병 열기 →</button></div></div>';
    });
  }
  h += '</div></div>' + discHtml();
  showDetail(h);
}

/* ── 설계사 전용 · 이렇게 설계합니다 ────────────────────────
   고객용 설명과 섞지 않는다. 위험감 화법도 여기 있다 — 겁을 주는 것이 아니라
   구조를 보여 주는 말이라, 문제 뒤에는 반드시 해결이 오게 짝지어 둔다. */
/* ══ 설계 연습 ═══════════════════════════════════════════════
   질병 하나를 놓고 <b>내가 짠 대로 담보를 체크</b>한 다음 채점을 받습니다.
   채점만 하면 연습이 아닙니다 — <b>그래서 무슨 말을 하는지</b>까지
   그 자리에서 나와야 그날 상담에서 씁니다.

   대본은 지어내지 않습니다. 이미 자료에 있는 말(SPIN 질문 · 위험감 화법 ·
   담보 설명 · 비유 · 거절 대응)을 <b>체크한 대로 골라 이어 붙인</b> 것입니다.
   그래서 체크가 달라지면 대본도 달라집니다.                            */
var DRILL = { dz: '', picked: {}, done: false };

function drillMusts(d){
  var out = [];
  ((d.plan && d.plan.layers) || []).forEach(function(L){
    (L.rows || []).forEach(function(r){ if (r.must) out.push({ L: L, r: r }); });
  });
  return out;
}
/* 오늘의 한 문제 — 날짜로 정해서 매일 같은 문제가 나오지 않게 */
function drillToday(){
  var t = new Date(Date.now() + 9 * 3600 * 1000);
  return D.list[Math.floor(t.getTime() / 86400000) % D.list.length];
}
function drillDz(){
  var i;
  for (i = 0; i < D.list.length; i++) if (D.list[i].id === DRILL.dz) return D.list[i];
  return null;
}
function drillOpen(id){
  DRILL.dz = id || drillToday().id;
  DRILL.picked = {}; DRILL.done = false;
  drillPaint();
  try { location.hash = 'drill'; } catch (e) {}
}
function drillPick(id){ DRILL.dz = id; DRILL.picked = {}; DRILL.done = false; drillPaint(); window.scrollTo(0, 0); }
function drillToggle(k){ DRILL.picked[k] = !DRILL.picked[k]; }
function drillAll(on){
  var d = drillDz(); if (!d) return;
  ((d.plan && d.plan.layers) || []).forEach(function(L){
    (L.rows || []).forEach(function(r){ DRILL.picked[r.k] = !!on; });
  });
  DRILL.done = false; drillPaint();
}
function drillScore(){ DRILL.done = true; drillPaint(); window.scrollTo(0, 0); }
function drillAgain(){ DRILL.picked = {}; DRILL.done = false; drillPaint(); window.scrollTo(0, 0); }
function nextDz(id){
  var i;
  for (i = 0; i < D.list.length; i++) if (D.list[i].id === id) return D.list[(i + 1) % D.list.length].id;
  return D.list[0].id;
}

function drillPaint(){
  var d = drillDz();
  if (!d) { showDetail('<div class="none">질병을 고르지 못했습니다.</div>'); return; }
  var h = '<div class="backrow noprint">' +
    '<button class="btn" onclick="close_()">← 질병 목록</button>' +
    '<button class="btn" onclick="open_(\'' + d.id + '\')">이 질병 가이드 보기</button>' +
    '<button class="btn" onclick="window.print()">🖨 인쇄</button></div>';

  h += '<div class="drill-hd"><h4>🎯 설계 연습 — ' + d.ic + ' ' + esc(d.name) + '</h4>' +
    '<p>이 고객에게 <b>내가 넣을 담보</b>를 골라 보십시오. 채점하면 빠뜨린 자리와 함께 ' +
    '<b>그 설계를 고객에게 설명하는 대본</b>이 나옵니다. 정답을 외우는 것이 아니라 ' +
    '<b>빠뜨리는 자리를 몸에 익히는 것</b>이 목적입니다.</p></div>';

  h += '<div class="drill-pick noprint">' + D.list.map(function(x){
    return '<button class="' + (x.id === d.id ? 'on' : '') + '" onclick="drillPick(\'' + x.id + '\')">' +
      x.ic + ' ' + esc(x.name.replace(/\([^)]*\)/, '')) + '</button>'; }).join('') + '</div>';

  if (!DRILL.done) {
    h += '<div class="drill-run noprint">' +
      '<button class="btn" onclick="drillAll(1)">전부 켜기</button>' +
      '<button class="btn" onclick="drillAll(0)">전부 끄기</button></div>';
    h += ((d.plan && d.plan.layers) || []).map(function(L){
      return '<div class="dl"><div class="dlh"><div class="dln">' + esc(L.n) + '</div>' +
        '<div class="dld">' + rich(L.d) + '</div></div>' +
        (L.rows || []).map(function(r){
          return '<label><input type="checkbox" ' + (DRILL.picked[r.k] ? 'checked ' : '') +
            'onchange="drillToggle(\'' + esc(r.k).replace(/'/g, '') + '\')">' +
            '<span><span class="dk">' + esc(r.k) + '</span>' +
            (r.std ? '<span class="ds">' + rich(r.std) + '</span>' : '') + '</span></label>';
        }).join('') + '</div>';
    }).join('');
    h += '<div class="drill-run noprint"><button class="btn-run" onclick="drillScore()">채점하고 화법 받기 →</button></div>';
    h += discHtml();
    showDetail(h);
    return;
  }

  /* ── 채점 ── */
  var musts = drillMusts(d);
  var got = musts.filter(function(x){ return DRILL.picked[x.r.k]; });
  var miss = musts.filter(function(x){ return !DRILL.picked[x.r.k]; });
  var extra = [];
  ((d.plan && d.plan.layers) || []).forEach(function(L){
    (L.rows || []).forEach(function(r){ if (DRILL.picked[r.k] && !r.must) extra.push({ L: L, r: r }); });
  });
  var pct = musts.length ? Math.round(got.length / musts.length * 100) : 0;
  var word = pct === 100 ? '빠진 자리가 없습니다'
    : (pct >= 70 ? '큰 틀은 섰습니다 — 아래 자리가 비었습니다'
    : (pct >= 40 ? '절반입니다 — 비어 있는 쪽이 실제로 돈이 나가는 자리입니다' : '다시 한 번 보십시오'));

  h += '<div class="score"><div class="n">' + got.length + '<em>/' + musts.length + '</em></div>' +
    '<div class="t"><b>' + esc(word) + '</b>' +
    '<span>꼭 들어가야 하는 자리 ' + musts.length + '개 중 ' + got.length + '개를 넣으셨습니다' +
    (extra.length ? ' · 더 얹은 담보 ' + extra.length + '개' : '') + '</span></div>' +
    '<button class="btn noprint" style="background:#fff" onclick="drillAgain()">다시 하기</button></div>';

  if (miss.length) {
    h += '<div class="miss"><div class="mh">빠뜨린 자리 ' + miss.length + '개 — 여기가 실제로 비는 곳입니다</div>' +
      miss.map(function(x){
        var v = vocab(x.r.k);
        return '<div class="m"><div class="mk">' + esc(x.r.k) +
          '<span style="font-weight:600;color:#6B7280;font-size:11.5px"> · ' + esc(x.L.n) + '</span></div>' +
          (v ? '<div class="md">' + rich(v.d) + '</div>' : '') +
          '<div class="md" style="color:#374151">왜 넣는가 · ' + rich(x.r.why || '') + '</div>' +
          (x.r.gap ? '<div class="mg"><b>없으면 · </b>' + rich(x.r.gap) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
  } else {
    h += '<div class="got"><div class="gh">꼭 들어가야 하는 자리를 다 넣으셨습니다</div>' +
      '<div class="g">이제 남은 것은 <b>금액과 순서</b>입니다. 아래 대본으로 설명 연습을 이어 가십시오.</div></div>';
  }

  if (got.length + extra.length) {
    h += '<div class="got"><div class="gh">넣으신 것 ' + (got.length + extra.length) + '개</div>' +
      got.concat(extra).map(function(x){
        var v = vocab(x.r.k);
        return '<div class="g"><b>' + esc(x.r.k) + '</b> · ' + rich(x.r.why || (v ? v.d : '')) + '</div>';
      }).join('') + '</div>';
  }

  h += drillScriptHtml(d, got.concat(extra), miss);

  h += '<div class="pro-first"><div style="font-size:12px;font-weight:800;color:#1A56DB;margin-bottom:4px">' +
    '예산이 빠듯할 때 이 순서로</div>' +
    ((d.plan && d.plan.first) || []).map(function(t){ return '<div>' + rich(t) + '</div>'; }).join('') + '</div>';

  h += '<div class="pro-check" style="margin-top:11px"><div class="t">상담 전 증권에서 확인</div>' +
    ((d.plan && d.plan.check) || []).map(function(t){ return '<div class="c">' + rich(t) + '</div>'; }).join('') + '</div>';

  h += '<div class="drill-run noprint"><button class="btn-run" onclick="drillAgain()">다시 하기</button>' +
    '<button class="btn" onclick="drillPick(\'' + nextDz(d.id) + '\')">다음 질병으로 →</button>' +
    '<button class="btn" onclick="open_(\'' + d.id + '\')">이 질병 가이드 보기</button></div>';

  h += discHtml();
  showDetail(h);
}

/* ── 대본 — 체크한 대로 골라 이어 붙인다 ── */
function drillScriptHtml(d, picked, miss){
  var T = d.talk || {}, P = d.plan || {};
  var spin = T.spin || [];
  var h = '<div class="script"><div class="sh"><b>🗣 이 설계를 이렇게 설명하십시오</b>' +
    '<span>체크하신 대로 골라 이은 대본입니다</span>' +
    '<button class="cpbtn noprint" onclick="drillCopy()">📋 복사</button></div><div class="sb" id="dscript">';

  function step(k, lines){
    return '<div class="step"><div class="sk">' + k + '</div>' +
      lines.map(function(t){ return '<div class="sl">' + rich(t) + '</div>'; }).join('') + '</div>';
  }
  if (spin.length) {
    h += step('① 문을 엽니다 — 묻고 기다립니다',
      [spin[0][1]].concat(spin.length > 1 ? [spin[1][1]] : []));
  }
  if ((P.fear || []).length) {
    h += step('② 위험을 짚습니다 — 그리고 바로 해결로 넘어갑니다',
      [P.fear[0].say, '→ ' + P.fear[0].then]);
  }
  var byLayer = [];
  picked.forEach(function(x){
    var f = null, i;
    for (i = 0; i < byLayer.length; i++) if (byLayer[i].n === x.L.n) f = byLayer[i];
    if (!f) { f = { n: x.L.n, rows: [] }; byLayer.push(f); }
    f.rows.push(x.r);
  });
  if (byLayer.length) {
    var lines = [];
    byLayer.forEach(function(g){
      lines.push('<b>' + esc(g.n) + '</b>');
      g.rows.forEach(function(r){
        var v = vocab(r.k);
        lines.push('· <b>' + esc(r.k) + '</b> — ' + (v ? v.d : '') + ' ' + (r.why || ''));
      });
    });
    h += step('③ 넣은 것을 층으로 설명합니다 — 담보 이름부터 말하지 말고 <b>무슨 돈인지</b>부터', lines);
  } else {
    h += step('③ 넣은 것', ['아직 아무것도 안 고르셨습니다. 위에서 담보를 골라 보십시오.']);
  }
  if (T.bi) h += step('④ 한 문장으로 묶습니다', [T.bi]);
  if (spin.length > 3) h += step('⑤ 닫습니다 — 결정을 묻지 말고 <b>다음 걸음</b>을 물으십시오', [spin[3][1]]);
  if ((P.check || []).length) {
    h += step('⑥ 숙제를 드립니다', ['「다음에 뵐 때 증권에서 <b>' +
      String(P.check[0]).replace(/<[^>]+>/g, '') + '</b> 만 확인해 오시면 정확히 맞춰 드리겠습니다.」']);
  }
  if ((T.obj || []).length) {
    h += '<div class="step"><div class="sk">이런 말이 나오면</div>' +
      T.obj.map(function(o){
        return '<div class="sl" style="background:#FAFBFC;border-radius:9px;padding:9px 11px;margin-top:6px">' +
          '<b>“' + esc(o[0]) + '”</b><br>→ ' + rich(o[1]) + '</div>';
      }).join('') + '</div>';
  }
  if (miss.length) {
    h += '<div class="step"><div class="sk" style="color:#DC2626">대본에 없는 것 — 빠뜨리셨기 때문입니다</div>' +
      '<div class="sl" style="color:#374151;font-size:12.8px">' +
      miss.map(function(x){ return esc(x.r.k); }).join(' · ') +
      ' 를 넣으셨다면 이 자리에 <b>한 줄씩 더</b> 들어갔을 것입니다.</div></div>';
  }
  h += '</div></div>';
  h += '<div style="font-size:11.5px;color:#9AA2AD;margin:-4px 0 12px;line-height:1.7">' +
    '이 대본은 <b>그대로 읽는 원고가 아니라 순서를 잡아 주는 뼈대</b>입니다. ' +
    '확정되지 않은 지급·인수 결과를 단정해서 말하지 않고, 기존 계약 해지를 전제로 권유하지 않습니다. ' +
    '(금융소비자보호법상 설명의무·부당권유 금지)</div>';
  return h;
}
function drillCopy(){
  var el = document.getElementById('dscript');
  if (!el) return;
  var t = el.innerText;
  try {
    if (navigator.clipboard) navigator.clipboard.writeText(t);
    else {
      var ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
  } catch (e) {}
}

  }).join('');

  h += '<div class="pro-first"><div style="font-size:12px;font-weight:800;color:#1A56DB;margin-bottom:4px">' +
    '예산이 빠듯할 때 이 순서로</div>' +
    (P.first || []).map(function(t){ return '<div>' + rich(t) + '</div>'; }).join('') + '</div>';

  h += '<div class="pro-check"><div class="t">증권에서 이것만은 확인</div>' +
    (P.check || []).map(function(t){ return '<div class="c">' + rich(t) + '</div>'; }).join('') + '</div>';

  h += '<div style="font-size:11.5px;color:#9AA2AD;margin-top:12px;line-height:1.7">' +
    '기준선은 <b>대표님 판단 기준</b>이며 고객의 소득·고정지출·부양가족에 따라 조정합니다 — 그대로 확정하지 마십시오. ' +
    '담보 이름과 지급 조건은 회사·개정회차마다 다르고, <b>최종 지급은 약관과 보험사 심사 결과에 따릅니다.</b> ' +
    '인수 가능 여부를 설계사가 확정해 말하지 않습니다.</div>';

  h += '</div>';
  return h;
}

/* ── 사례 ── */
function caseById(id){
  var C = D.cases || [], i;
  for (i = 0; i < C.length; i++) if (C[i].id === id) return C[i];
  return null;
}
function casesHtml(d){
  var ids = d.caseIds || [];
  var L = ids.map(caseById).filter(Boolean);
  if (!L.length) {
    return '<div class="sec"><h3><em>⑥</em>이런 분이 이렇게 받으셨습니다</h3>' +
      '<p style="font-size:12.5px;color:#6B7280;">이 질병에는 <b>아직 사례를 붙이지 않았습니다.</b> ' +
      '없는 사례를 지어내지 않습니다 — 청구·사후관리 화면의 지급사례에서 비슷한 건을 찾아보십시오.</p></div>';
  }
  return '<div class="sec"><h3><em>⑥</em>이런 분이 이렇게 받으셨습니다</h3>' +
    '<p style="font-size:12.5px;color:#6B7280;margin-bottom:12px;">위의 치료 흐름이 <b>한 사람에게 실제로 어떻게 흘러가는지</b>입니다. ' +
    '사람은 견본이고, <b>금액은 구조를 보여 주는 예시</b>입니다 — 지급을 보장하는 숫자가 아닙니다.</p><div class="cases">' +
    L.map(function(c){
      return '<div class="case"><div class="ch"><div class="cn">' + (c.ic || '🩺') + ' ' + esc(c.name) +
        (c.code ? ' <span class="oe">' + esc(c.code) + '</span>' : '') + '</div>' +
        (c.who ? '<div class="cw">' + esc(c.who) + '</div>' : '') + '</div><div class="cb">' +
        (c.stages || []).map(function(st){
          return '<div class="cst"><span>' + st.ic + '</span><span><b>' + esc(st.k) + '</b>' +
            (st.dur ? ' · ' + esc(st.dur) : '') + ' — ' + esc(st.desc) +
            ((st.pay || []).length ? '<br><span style="color:#059669;font-weight:700">' + esc(st.pay.join(' · ')) + '</span>' : '') +
            '</span></div>';
        }).join('') +
        ((c.payout || []).length
          ? '<div class="cpay">' + c.payout.map(function(p){
              return '<span style="border-color:' + esc(p.color) + ';color:' + esc(p.color) + '">' +
                     esc(p.tag) + ' ' + esc('' + p.value) + '만</span>'; }).join('') + '</div>'
          : '') +
        (c.gap ? '<div class="cgap"><b>남는 자리 · </b>' + esc(c.gap) + '</div>' : '') +
        (c.lesson ? '<div class="clesson"><b>여기서 배울 것 · </b>' + esc(c.lesson) + '</div>' : '') +
        '<div class="cwarn">사람은 견본이며 금액은 예시입니다 · 실제 지급은 약관과 보험사 심사 결과에 따릅니다.</div>' +
        '</div></div>';
    }).join('') + '</div></div>';
}

/* ── 용어 사전 ── */
function termsAll(){
  var q = (document.getElementById('q').value || '').replace(/^\s+|\s+$/g,'');
  var byG = {}, order = [];
  (D.terms || []).forEach(function(t){
    if (q && (t.t + ' ' + (t.en || '') + ' ' + t.d + ' ' + (t.ins || '')).indexOf(q) < 0) return;
    if (!byG[t.g]) { byG[t.g] = []; order.push(t.g); }
    byG[t.g].push(t);
  });
  var h = '<div class="backrow noprint">' +
    '<button class="btn" onclick="close_()">← 질병 목록</button>' +
    (CUR ? '<button class="btn" onclick="open_(\'' + CUR + '\')">← 보던 질병으로</button>' : '') +
    '<button class="btn" onclick="window.print()">🖨 인쇄</button></div>';
  h += '<div class="sec"><h3><em>📖</em>용어 사전 — 진단서에 적힌 그 말</h3>' +
    '<p style="font-size:12.5px;color:#6B7280;margin-bottom:12px;">' +
    '고객이 진단서를 들고 와 묻는 말들입니다. 위 검색칸에 낱말을 넣으면 여기서도 걸러집니다. ' +
    '제도의 기간·한도 같은 <b>바뀌는 숫자는 적지 않았습니다</b> — 개정되면 틀린 말이 되기 때문입니다.</p>';
  if (!order.length) {
    h += '<div class="none">찾는 용어가 없습니다. 다른 낱말로 해 보세요 — 예: 스텐트, 표적, 유사암, 부담보.</div>';
  }
  order.forEach(function(g){
    h += '<div class="grp-hd" style="margin:16px 0 8px"><h2 style="font-size:13px">' + esc(g) + '</h2>' +
         '<span>' + byG[g].length + '개</span></div><div class="terms">';
    byG[g].forEach(function(t){
      h += '<div class="term"><div class="tt">' + esc(t.t) +
        (t.en ? '<span class="te">' + esc(t.en) + '</span>' : '') + '</div>' +
        '<div class="td">' + rich(t.d) + '</div>' +
        (t.ins ? '<div class="ti"><b>보험에서 · </b>' + rich(t.ins) + '</div>' : '') + '</div>';
    });
    h += '</div>';
  });
  h += '</div>' + discHtml();
  showDetail(h);
}

/* 담보 말모이 — 이 자료가 쓰는 담보 이름과 그 뜻은 한 곳에만 있다 */
function vocab(k){
  var C = D.cov || [], i;
  for (i = 0; i < C.length; i++) if (C[i].k === k) return C[i];
  return null;
}
function covUsedBy(k){
  var out = [];
  D.list.forEach(function(d){
    var n = 0;
    d.path.forEach(function(s){ (s.pay || []).forEach(function(p){ if (p.k === k) n++; }); });
    if (n) out.push(d.ic + ' ' + d.name);
  });
  return out;
}
function covAll(){
  var byArea = {}, order = [];
  (D.cov || []).forEach(function(c){
    if (!byArea[c.area]) { byArea[c.area] = []; order.push(c.area); }
    byArea[c.area].push(c);
  });
  var h = '<div class="backrow noprint">' +
    '<button class="btn" onclick="close_()">← 질병 목록</button>' +
    (CUR ? '<button class="btn" onclick="open_(\'' + CUR + '\')">← 보던 질병으로</button>' : '') +
    '<button class="btn" onclick="window.print()">🖨 인쇄</button></div>';
  h += '<div class="sec"><h3><em>💊</em>담보 말모이 — 이 돈이 무슨 돈입니까</h3>' +
    '<p style="font-size:12.5px;color:#6B7280;margin-bottom:14px;">이 자료가 쓰는 담보 이름은 <b>여기 적힌 것뿐</b>입니다. ' +
    '보장분석이 쓰는 이름 그대로라, 증권에서 같은 말로 찾으실 수 있습니다.</p>';
  order.forEach(function(a){
    h += '<div class="grp-hd" style="margin:16px 0 8px"><h2 style="font-size:13px">' + esc(a) + '</h2>' +
         '<span>' + byArea[a].length + '개</span></div><div class="cov">';
    byArea[a].forEach(function(c){
      var usedBy = covUsedBy(c.k);
      h += '<div class="c"><div class="cn">' + esc(c.k) + '</div>' +
        '<div class="cl">' + rich(c.d) + '</div>' +
        (c.w ? '<div class="watch" style="margin-top:8px">' + '<b>여기서 갈립니다 · </b>' + rich(c.w) + '</div>' : '') +
        (usedBy.length ? '<div class="cl" style="margin-top:8px;color:#6B7280">여기에서 일합니다 — ' + esc(usedBy.join(' · ')) + '</div>' : '') +
        '<div style="margin-top:8px"><button class="btn noprint" onclick="findCov(\'' + esc(c.k).replace(/'/g,'') + '\')">단계별로 보기 →</button></div>' +
        '</div>';
    });
    h += '</div>';
  });
  h += '</div>' + discHtml();
  showDetail(h);
}

function discHtml(){
  return '<div class="disc">' +
    '<div><b>치료 · </b>' + rich(D.disc.med) + '</div>' +
    '<div><b>지급 · </b>' + rich(D.disc.pay) + '</div>' +
    '<div><b>숫자 · </b>' + rich(D.disc.num) + '</div>' +
    '<div><b>제도 · </b>산정특례·장기요양 같은 <b>제도의 조건과 기간은 개정될 수 있습니다.</b> ' +
    '상담 자리에서 제도의 숫자를 외워 말하지 마시고, 링크의 1차 자료로 그날 확인하십시오.</div>' +
    '</div>';
}

/* ══ 화면 전환 ═════════════════════════════════════════════ */
function showDetail(h){
  document.getElementById('detailPane').innerHTML = h;
  try { if (window.DZ_VIZ) DZ_VIZ.bind(document.getElementById('detailPane')); } catch (e) {}
  document.getElementById('detailPane').classList.add('on');
  document.getElementById('listPane').style.display = 'none';
  window.scrollTo(0, 0);
}
function open_(id){
  var d = null, i;
  for (i = 0; i < D.list.length; i++) if (D.list[i].id === id) d = D.list[i];
  if (!d) return;
  CUR = id;
  showDetail(detailHtml(d));
  try { location.hash = id; } catch (e) {}
  say('open', id);
}
function close_(){
  CUR = '';
  document.getElementById('detailPane').classList.remove('on');
  document.getElementById('listPane').style.display = '';
  try { location.hash = ''; } catch (e) {}
  window.scrollTo(0, 0);
}
function setGrp(k){
  GRP = k;
  paint();
  var b = document.getElementById('grpBtns').getElementsByTagName('button'), i;
  document.getElementById('bAll').className = 'btn' + (k ? '' : ' on');
  for (i = 0; i < b.length; i++) b[i].className = 'btn' + (b[i].getAttribute('data-k') === k ? ' on' : '');
}
function paint(){
  if (!D) return;
  document.getElementById('listPane').innerHTML = listHtml();
}

/* ── 앱(틀) 과 주고받는 말 — 상담자료 덱과 같은 규약 ── */
function say(t, v){
  try { parent.postMessage({ t: 'apex:guide', act: t, id: v }, location.origin); } catch (e) {}
}
window.addEventListener('message', function(ev){
  if (ev.origin !== location.origin) return;
  var m = ev.data;
  if (!m || typeof m !== 'object') return;
  if (m.t === 'apex:jump' && m.to === 'drill') drillOpen('');
  else if (m.t === 'apex:jump' && m.to) open_(m.to);
  if (m.t === 'apex:home') close_();
});

/* ══ 시작 ══════════════════════════════════════════════════ */
(function boot(){
  if (!D || !D.list || !D.list.length) {
    noData('질병 자료(DZ_DATA)를 읽지 못했습니다.');
    return;
  }
  document.getElementById('grpBtns').innerHTML = D.grp.map(function(g){
    return '<button class="btn" data-k="' + esc(g.k) + '" onclick="setGrp(\'' + esc(g.k) + '\')">' +
           g.ic + ' ' + esc(g.k) + '</button>';
  }).join(' ');
  setGrp('');
  var hash = (location.hash || '').replace('#','');
  if (hash === 'drill') drillOpen('');
  else if (hash) open_(hash);
  say('ready', '');
})();
</script>

<!DOCTYPE html>
<html data-theme="light" lang="ko">
<head>
<meta charset="utf-8">
<!-- 🤍 흰색 고정 — 앱에 어두운 판이 없습니다 (check-lightmode) -->
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>업무구분</title>
<!-- 색·글꼴은 app/ui.css 한 곳에서 옵니다 — 여기서 색을 또 적지 않습니다 (5번) -->
<link rel="stylesheet" href="ui.css">
<style id="wsCss">
/* ══════════════════════════════════════════════════════════════════
   🗂 업무구분 — 담당자별 할 일 (판 X420)

   사장님 말씀 2026-11-06 — 회의 「담당자별 할 일」 표(그림)를 주시며
   「이 부분을 업무구분으로 짓고, html로 수정할 수 있도록 만들어」.

   ★ 그림이던 표를 <b>글로</b> 옮겼습니다 — 칸을 눌러 바로 고칩니다.
     담당자·할 일을 더하고 · 지우고 · 올리고 · 내리고, 할 일마다 완료를 겁니다.
   ★ 적은 것은 열쇠 <b>apex_worksplit_v1</b> 하나에 담깁니다. 앱 안에서 열면
     바깥 창의 apex-kv-sync.js 가 그 열쇠를 <b>조직 한 벌(apex_org_kv)</b>로 올려
     폰·PC·팀 모두 같은 표를 봅니다. 고칠 수 있는 사람은 <b>EM 권한</b>뿐이고
     (서버 정책 em_is_em() 과 같은 자리), 그 판단은 <b>APEX_KV.canOrg() 한 곳</b>이
     합니다 — 여기서 권한 목록을 또 적지 않습니다 (5번).
   ★ 서버를 따로 부르지 않습니다 — 올리고 받는 것은 apex-kv-sync 가 합니다 (7번).
   ★ 인쇄는 A4 한 장 꼴 · 숫자 글꼴 tnum 을 안 씁니다 (4-1번).
   점검 : scripts/check-worksplit.js
   ══════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --ink:var(--t-ink); --ink2:var(--t-ink-2); --sub:var(--t-sub);
  --line:var(--t-line); --line2:var(--t-line-2);
  --bg:var(--t-bg); --card:var(--t-card); --soft:var(--t-bg-2);
  --pt:var(--t-point); --pt-d:var(--t-point-d); --pt-l:var(--t-point-l);
  --pos:var(--t-pos-d); --pos-l:var(--t-pos-l);
  --neg:var(--t-neg-d); --neg-l:var(--t-neg-l);
  --warn:var(--t-warn-d); --warn-l:var(--t-warn-l);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--t-font);font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;letter-spacing:-.2px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pt);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* ── 사람마다 색 — 값은 ui.css 의 토큰에서만 (5번). 여섯 빛깔을 돌려 씁니다 ── */
.c0{--c:var(--t-point);  --cl:var(--t-point-l)}
.c1{--c:var(--t-teal-d); --cl:var(--t-teal-l)}
.c2{--c:var(--t-pur);    --cl:var(--t-pur-l)}
.c3{--c:var(--t-pos-d);  --cl:var(--t-pos-l)}
.c4{--c:var(--t-warn-d); --cl:var(--t-warn-l)}
.c5{--c:var(--t-ind-d);  --cl:var(--t-ind-l)}

/* ── 위 띠 ── */
.ws-bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.ws-bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ws-bar h1{font-size:18px;margin:0 auto 0 0;font-weight:800}
.ws-btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--t-r-btn);background:var(--card);
  font-size:14px;font-weight:700}
.ws-btn:hover{background:var(--soft)}
.ws-btn.on{background:var(--pt);border-color:var(--pt);color:var(--t-on)}
.ws-btn:disabled{opacity:.45;cursor:not-allowed}
.ws-perm{max-width:1180px;margin:0 auto;padding:0 16px 10px;font-size:13px;color:var(--sub)}
.ws-perm b{color:var(--ink2)}
.ws-perm.view{color:var(--warn)}

.ws-paper{max-width:1180px;margin:0 auto;padding:20px 16px 48px}

/* ── 머리 · 요약 띠 — 가볍게, 첫 화면에 일이 더 보이게 ── */
.ws-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin:6px 0 12px}
.ws-title{font-size:28px;font-weight:900;margin:0;letter-spacing:-.8px}
.ws-sub{font-size:14px;color:var(--sub);margin:4px 0 0;white-space:pre-wrap}
.ws-sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.ws-stat{display:inline-flex;align-items:baseline;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:6px 14px}
.ws-stat .n{font-size:20px;font-weight:900;letter-spacing:-.6px}
.ws-stat .l{font-size:13px;font-weight:700;color:var(--sub)}
.ws-stat.ok .n{color:var(--pos)}
.ws-stat.left .n{color:var(--pt-d)}
.ws-stat.todo{background:var(--warn-l);border-color:transparent}
.ws-stat.todo .n{color:var(--warn)}
.ws-prog{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:13px;font-weight:700;color:var(--sub)}
.ws-bar2{flex:1 1 auto;height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.ws-bar2 i{display:block;height:100%;background:var(--pos);border-radius:99px}

/* ── 몸 — 컴퓨터는 왼쪽에 담당자 목록을 세워 두고 오른쪽을 위에서 아래로 읽습니다 ── */
.ws-main{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.ws-main.q{display:block}
.ws-side{position:sticky;top:96px}
.ws-side-h{font-size:13px;font-weight:800;color:var(--sub);margin:2px 4px 8px}
.ws-chips{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--t-r);padding:8px}
.ws-chip{min-height:44px;width:100%;padding:0 10px 0 8px;border:0;border-radius:10px;background:none;
  display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;text-align:left}
.ws-chip:hover{background:var(--cl)}
.ws-chip .d{flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:var(--c);color:#fff;font-size:13px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center}
.ws-chip .w{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-chip .k{flex:0 0 auto;color:var(--sub);font-weight:600;font-size:13px}
.ws-only{width:100%;margin-top:6px}

/* ── 보기 바꾸개 ── */
.ws-view{display:inline-flex;gap:4px;background:var(--line2);border-radius:14px;padding:4px;margin:0 0 16px}
.ws-vbtn{min-height:44px;padding:0 16px;border:0;border-radius:11px;background:none;font-size:15px;font-weight:800;color:var(--ink2)}
.ws-vbtn.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ── 업무별 카드 — 갈래는 한 색, 사람 색은 사람에만 ── */
.ws-tcard{--c:var(--t-point);--cl:var(--t-point-l)}
.ws-tcard.other{--c:var(--t-sub);--cl:var(--t-bg-2)}
.ws-tchip{--c:var(--t-point);--cl:var(--t-point-l)}
.ws-to{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 0 10px;padding:10px 12px;background:var(--pt-l);border-radius:12px}
.ws-tcard.other .ws-to{background:var(--soft)}
.ws-to .l{font-size:14px;font-weight:900;color:var(--pt-d);margin-right:2px}
.ws-pill{min-height:34px;padding:0 12px;border:0;border-radius:99px;background:var(--card);color:var(--c);font-size:14px;font-weight:800;
  box-shadow:inset 0 0 0 1.5px var(--c)}
.ws-pill:hover{background:var(--cl)}
.ws-tb{flex:1 1 auto;min-width:0}
.ws-ptag{display:inline-block;font-size:13px;font-weight:800;color:var(--c);background:var(--cl);border-radius:6px;padding:1px 7px;margin-bottom:3px}
.ws-tcard .ws-t{display:block}

/* ── 사람별 카드 — 한 줄에 한 사람, 한 줄짜리 셋은 나란히 ── */
.ws-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start;grid-auto-flow:row dense}
.ws-card{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--t-r);
  padding:16px 20px 12px;scroll-margin-top:110px}
.ws-card.one{grid-column:auto}
.ws-main.q .ws-card.one{grid-column:1/-1}
.ws-card.flash{box-shadow:0 0 0 3px var(--cl)}
.ws-chead{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.ws-av{flex:0 0 auto;width:42px;height:42px;border-radius:13px;background:var(--cl);color:var(--c);
  font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center}
.ws-hb{flex:1 1 auto;min-width:0}
.ws-name{font-size:20px;font-weight:900;letter-spacing:-.4px;white-space:pre-wrap;line-height:1.3}
.ws-meta{display:flex;align-items:center;gap:8px;margin-top:3px}
.ws-cnt{font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
.ws-cnt.all{color:var(--pos)}
.ws-meta .ws-bar2{height:6px;max-width:180px}
.ws-meta .ws-bar2 i{background:var(--c)}
.ws-list{list-style:none;margin:0;padding:0}
.ws-card.cols .ws-list{columns:2;column-gap:32px}
.ws-it{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-top:1px solid var(--line2);break-inside:avoid}
.ws-card .ws-it:first-child{border-top:0}
.ws-card.cols .ws-it{border-top:0;border-bottom:1px solid var(--line2)}
.ws-no{flex:0 0 auto;min-width:24px;height:24px;border-radius:8px;background:var(--cl);color:var(--c);
  font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.ws-ck{flex:0 0 auto;width:22px;height:22px;margin:1px 0 0;accent-color:var(--pos);cursor:pointer}
.ws-t{flex:1 1 auto;min-width:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:15px}
.ws-it.done .ws-t{color:var(--sub);text-decoration:line-through}
.ws-it.done .ws-no{background:var(--pos-l);color:var(--pos)}
.ws-card.one .ws-t{font-size:16px;font-weight:600}
.ws-fin{display:none;font-size:14px;font-weight:700;color:var(--pos);padding:6px 0}
body.undone .ws-it.done{display:none}
body.undone .ws-card.alldone .ws-fin{display:block}

/* ── 아직 정할 것 · 꼬리말 ── */
.ws-extra{grid-column:1/-1;background:var(--warn-l);border:1px solid transparent;border-radius:var(--t-r);padding:16px 18px}
.ws-extra h2{margin:0 0 8px;font-size:18px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ws-tag{font-size:13px;font-weight:800;color:var(--warn);background:var(--card);border-radius:99px;padding:2px 10px}
.ws-extra .ws-it{border-top:1px solid rgba(0,0,0,.06)}
.ws-extra .ws-it:first-child{border-top:0}
.ws-dot{flex:0 0 auto;width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--warn)}
.ws-note{margin:14px 2px 0;font-size:13px;color:var(--sub);white-space:pre-wrap}

/* ── 🔎 무엇을 문의하시나요 ── */
.ws-find{max-width:1180px;margin:16px auto 0;padding:0 16px}
.ws-find-in{background:var(--card);border:2px solid var(--pt);border-radius:var(--t-r);padding:14px 16px}
.ws-find-l{display:block;font-size:18px;font-weight:900;margin-bottom:8px;letter-spacing:-.4px}
.ws-find-box{display:flex;gap:8px}
.ws-find-box .ws-btn{white-space:nowrap}
#wsQ{flex:1 1 auto;min-width:0;min-height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;
  font:inherit;font-size:17px;background:var(--soft);color:var(--ink)}
#wsQ:focus{outline:2px solid var(--pt);background:var(--card)}
.ws-topics{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ws-topic{min-height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:700}
.ws-topic:hover{border-color:var(--pt);background:var(--pt-l)}
.ws-topic .k{color:var(--sub);font-weight:600;margin-left:4px}
.ws-topic.on{background:var(--pt);color:var(--t-on);border-color:var(--pt)}
.ws-topic.on .k{color:inherit}
.ws-res{background:var(--pt-l);border-radius:var(--t-r);padding:14px 16px;margin-bottom:14px;font-size:15px}
.ws-res .big{font-size:19px;font-weight:900;letter-spacing:-.4px}
.ws-res .sub{color:var(--ink2);margin-top:4px}
.ws-res.none{background:var(--warn-l)}
mark{background:var(--t-warn-l);color:var(--t-warn-d);font-weight:800;border-radius:3px;padding:0 1px}
.ws-extra .ws-tag.none{color:var(--neg)}
.ws-exp{max-width:1180px;margin:0 auto;padding:0 16px 12px}
.ws-exp-in{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--pt-l);border-radius:var(--t-r-sm);padding:12px}
.ws-exp-in .ws-btn{background:var(--card)}
.ws-exp-note{flex:1 1 100%;margin:2px 2px 0;font-size:13px;color:var(--ink2)}
#wsExport.on{background:var(--pt-l);border-color:var(--pt);color:var(--pt-d)}
body.edit .ws-find,body.exp #wsEdit,body.exp #wsUndo,body.exp #wsReset,body.exp #wsExport,body.exp .ws-help{display:none!important}

/* ── 고치기 ── */
body.edit [data-ed]{outline:1px dashed var(--line);border-radius:4px;min-height:1.4em;cursor:text}
body.edit [data-ed]:focus{outline:2px solid var(--pt);background:var(--pt-l)}
[data-ed]:empty:before{content:attr(data-ph);color:var(--sub)}
.ws-tool{display:none;flex:0 0 auto;gap:3px}
body.edit .ws-tool{display:inline-flex}
.ws-mini{min-width:36px;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:13px;font-weight:700}
.ws-mini:hover{background:var(--soft)}
.ws-mini.x{color:var(--neg)}
.ws-add{display:none;margin-top:8px;min-height:40px;padding:0 14px;border:1px dashed var(--pt);border-radius:8px;
  background:var(--card);color:var(--pt-d);font-size:14px;font-weight:700}
body.edit .ws-add{display:inline-block}
.ws-addrow{display:none;grid-column:1/-1}
body.edit .ws-addrow{display:block}
.ws-help{display:none;max-width:1148px;margin:12px auto 0;padding:10px 14px;border-radius:var(--t-r-sm);
  background:var(--pt-l);color:var(--ink2);font-size:13px}
body.edit .ws-help{display:block}
body.edit .ws-it.done{display:flex}
/* 고칠 때는 카드를 넓게 — ↑↓✕ 셋이 서면 세 칸짜리 카드에서 글이 낱말마다 꺾였습니다 */
body.edit .ws-card.one{grid-column:1/-1}
body.edit .ws-card.cols .ws-list{columns:1}
.ws-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--t-on);
  border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;z-index:50}

@media(max-width:1000px){
  .ws-main{display:block}
  .ws-side{position:static}
  .ws-side-h{display:none}
  .ws-chips{flex-direction:row;flex-wrap:wrap;background:none;border:0;padding:0;margin-bottom:14px;gap:8px}
  .ws-chip{width:auto;min-height:40px;border:1px solid var(--line);border-radius:99px;background:var(--card);padding:0 12px 0 8px}
  .ws-chip .d{border-radius:50%;width:22px;height:22px}
  .ws-only{width:auto;margin:0 0 0 auto}
}
@media(max-width:820px){
  .ws-card.cols .ws-list{columns:1}
  .ws-grid{grid-template-columns:1fr}
  .ws-card.one{grid-column:1/-1}
}
@media(max-width:640px){
  .ws-paper{padding:14px 12px 40px}
  .ws-title{font-size:24px}
  .ws-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .ws-stat{flex-direction:column;align-items:center;gap:0;border-radius:14px;padding:8px 4px}
  .ws-stat .n{font-size:22px}
  .ws-stat .l{font-size:13px;letter-spacing:-.4px}
  /* 이름표는 <b>한 줄</b>로 옆으로 밉니다 — 여덟 줄이 한 화면을 다 먹었습니다 */
  .ws-chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px 14px;padding:0 12px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .ws-chip .w{overflow:visible}
  .ws-chips::-webkit-scrollbar{display:none}
  .ws-chip{flex:0 0 auto;white-space:nowrap}
  .ws-only{order:-1;margin-left:0;flex:0 0 auto;white-space:nowrap}
  .ws-card{padding:14px 14px 10px}
  .ws-find{padding:0 12px;margin-top:12px}
  #wsQx{display:none!important}   /* 폰은 찾기 칸 안에 ✕ 가 따로 섭니다 — 둘이면 「지우기」 가 두 줄로 꺾였습니다 */
  .ws-topics{flex-wrap:nowrap;overflow-x:auto;margin:10px -16px 0;padding:0 16px 4px;scrollbar-width:none}
  .ws-topics::-webkit-scrollbar{display:none}
  .ws-topic{flex:0 0 auto;white-space:nowrap}
}

/* ── 인쇄 — 띠·단추·이름표 줄은 안 나옵니다. tnum 을 켜지 않습니다 (4-1번) ── */
@page{size:A4;margin:10mm}
@media print{
  body{background:#fff;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ws-view,.ws-bar,.ws-perm,.ws-help,.ws-exp,.ws-tool,.ws-add,.ws-addrow,.ws-toast,.ws-chips,.ws-find{display:none!important}
  .ws-paper{padding:0;max-width:none}
  body.edit [data-ed]{outline:0;background:none}
  body.undone .ws-it.done{display:flex}
  .ws-main{display:block}
  .ws-side{display:none!important}
  .ws-grid{grid-template-columns:1fr 1fr;gap:8px}
  .ws-card,.ws-card.one{grid-column:auto;border-left-width:4px}
  .ws-card.cols{grid-column:1/-1}
  .ws-card,.ws-extra{break-inside:avoid;padding:10px 12px}
  .ws-card.cols{break-inside:auto}
  .ws-stat{padding:8px 12px}
  .ws-stat .n{font-size:22px}
  .ws-t{font-size:12px}
  .ws-name{font-size:16px}
  .ws-av{width:34px;height:34px;font-size:15px}
}
</style>
</head>
<body>
<div class="ws-bar"><div class="ws-bar-in">
  <h1>업무구분</h1>
  <button type="button" class="ws-btn" id="wsEdit">고치기</button>
  <button type="button" class="ws-btn" id="wsUndo" disabled>되돌리기</button>
  <button type="button" class="ws-btn" id="wsPrint">인쇄</button>
  <button type="button" class="ws-btn" id="wsExport" title="지금 표를 한 파일로 내려받습니다 — 카톡으로 돌려 보는 보기 전용">내보내기</button>
  <button type="button" class="ws-btn" id="wsReset">처음 표로</button>
</div>
<div class="ws-exp" id="wsExpPanel" hidden><div class="ws-exp-in">
  <button type="button" class="ws-btn" id="wsExpView">설계사용 — 보기 전용 파일</button>
  <button type="button" class="ws-btn" id="wsExpOwn">내 수정용 — 고칠 수 있는 파일</button>

}

}

function save(){

}

  clearTimeout(saveT); saveT=null;

}

function $(id){ return document.getElementById(id); }

function ed(e,get,set,ph,opt){
  e.setAttribute('data-ed','1'); e.setAttribute('data-ph',ph||'');

  e.addEventListener('input',function(){ set(e.innerText.replace(/\n$/,'')); save(); });

    var t=(ev.clipboardData||window.clipboardData); if(!t) return;
    ev.preventDefault();
    document.execCommand('insertText',false,t.getData('text/plain')||t.getData('Text')||'');

}

var TOPICS=[

  ['업무분담·처리 기준',['업무분담','처리기준','TO DO']],['홍보물·소식지',['카드뉴스','소식지','배너','포스터']],
  ['보고·일지',['보고서','동행일지','달력']],['TA',['TA 문화','TA 개별']],
  ['세일즈플러스·라인업',['세일즈플러스','라인업']],['고등',['고등']]
];
var Q='';
/* 보기 — 'topic'(업무별 · 처음) · 'person'(사람별). 고칠 때·찾을 때는 사람별로 섭니다(고치는 단위가 사람 줄이라) */
var VIEW='topic';
function tview(){ return VIEW==='topic' && !query() && !document.body.classList.contains('edit'); }
/* 업무별 묶음 — 화면도 이미지도 <b>이 한 곳</b>에 묻습니다 (5번).
   ★ 낱말로 묶어 한 줄이 여러 갈래에 설 수 있습니다. 어느 갈래에도 안 든 줄은 「그 밖의 일」 에 그대로 섭니다 — 빠뜨리지 않습니다 */
function groups(){
  var G=TOPICS.map(function(x){ return {label:x[0],q:{any:x[1],ex:x[2]||[]},words:x[1],items:[]}; });
  var other={label:'그 밖의 일',q:null,words:[],items:[],other:true};
  S.rows.forEach(function(r,ri){ r.items.forEach(function(it,ii){
    var any=false;
    G.forEach(function(g){ if(hitItem(g.q,r.who,it.t)){ g.items.push({ri:ri,ii:ii}); any=true; } });
    if(!any) other.items.push({ri:ri,ii:ii});
  }); });
  var out=G.filter(function(g){ return g.items.length; });
  if(other.items.length) out.push(other);
  out.forEach(function(g){ var seen={}; g.ppl=[]; g.done=0;
    g.items.forEach(function(z){ if(!seen[z.ri]){ seen[z.ri]=1; g.ppl.push(z.ri); } if(S.rows[z.ri].items[z.ii].done) g.done++; }); });
  return out;
}
function hashSync(){
  var a=[]; if(Q) a.push('q='+encodeURIComponent(Q)); if(VIEW==='person') a.push('v=person');
  try{ history.replaceState(null,'',a.length?'#'+a.join('&'):location.pathname+location.search); }catch(e){}
}
function setView(v){ VIEW=v==='person'?'person':'topic'; hashSync(); render(); }
function norm(x){ return String(x||'').toLowerCase().replace(/[\s·・,.\-\/&()「」:~→]+/g,''); }
/* 지금 무엇을 찾나 — 단추 이름이면 그 낱말 중 하나라도(할 일 글만), 친 말이면 낱말이 모두(이름 포함) */
function query(){
  var q=(Q||'').trim(); if(!q||document.body.classList.contains('edit')) return null;
  for(var i=0;i<TOPICS.length;i++) if(TOPICS[i][0]===q) return {q:q,any:TOPICS[i][1],ex:TOPICS[i][2]||[],words:TOPICS[i][1]};
  var w=q.split(/\s+/).filter(function(x){ return norm(x); });
  return w.length?{q:q,all:w.map(norm),words:w}:null;
}
function hitItem(Qo,who,t){
  if(Qo.any){ var h=norm(t); (Qo.ex||[]).forEach(function(x){ h=h.split(norm(x)).join('|'); });
    return Qo.any.some(function(w){ return h.indexOf(norm(w))>=0; }); }
  var hh=norm(who+' '+t); return Qo.all.every(function(w){ return hh.indexOf(w)>=0; });
}
/* 줄마다 걸렸나 — 화면도 이미지도 <b>이 한 곳</b>에 묻습니다 (5번). 이름으로 걸리면 그분 할 일이 다 */
function hits(Qo){
  return S.rows.map(function(r){
    var byName=!Qo.any && Qo.all.every(function(w){ return norm(r.who).indexOf(w)>=0; });
    return r.items.map(function(it){ return byName||hitItem(Qo,r.who,it.t); });
  });
}
function topicCount(words,ex){
  var Qo={any:words,ex:ex||[]}, n=0;
  S.rows.forEach(function(r){ if(r.items.some(function(it){ return hitItem(Qo,r.who,it.t); })) n++; });
  return n;
}
/* 찾은 글자에 형광 — 글은 textContent 로만 넣습니다(날글을 HTML 로 안 넣음) */
function marked(node,text,words){
  node.textContent='';
  var ws=(words||[]).filter(Boolean).map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); });
  if(!ws.length){ node.textContent=text; return; }
  var re=new RegExp('('+ws.join('|')+')','gi'), last=0, m;
  text=String(text||'');
  while((m=re.exec(text))){
    if(m.index>last) node.appendChild(document.createTextNode(text.slice(last,m.index)));
    node.appendChild(el('mark',null,m[0])); last=m.index+m[0].length;
    if(!m[0].length) re.lastIndex++;
  }
  if(last<text.length) node.appendChild(document.createTextNode(text.slice(last)));
}
function setQ(v,fromInput){
  Q=String(v||'');
  if(!fromInput) $('wsQ').value=Q;
  $('wsQx').hidden=!Q;
  hashSync();
  render();
}

/* ── 업무별 카드 — 「무엇을」 이 머리, 「누구에게」 가 바로 밑 ──
   ★ 사람 색(.c0~.c5)은 <b>사람</b>에만 씁니다 — 갈래 카드는 한 색이라 색이 곧 사람을 뜻합니다 */
function topicCards(g,GR){
  GR.forEach(function(G,gi){
    var n=G.items.length;
    var cd=el('section','ws-card ws-tcard'+(G.other?' other':'')+(n>=6?' cols':'')+(n&&G.done===n?' alldone':''));
    cd.setAttribute('data-g',gi); cd.setAttribute('data-topic',G.label);
    var hh=el('div','ws-chead'); hh.appendChild(el('div','ws-av',first(G.label)));
    var hb=el('div','ws-hb'); hb.appendChild(el('div','ws-name',G.label));
    var mt=el('div','ws-meta'); mt.appendChild(el('span','ws-cnt'+(n&&G.done===n?' all':''),'할 일 '+n+'줄 · '+G.done+' 끝냄'));
    if(n>1) mt.appendChild(bar(G.done/n));
    hb.appendChild(mt); hh.appendChild(hb); cd.appendChild(hh);
    /* 누구에게 — 사람을 누르면 사람별 보기에서 그분 카드로 */
    var wr=el('div','ws-to'); wr.appendChild(el('span','l',G.other?'맡은 분':'문의 →'));
    G.ppl.forEach(function(ri){
      var b=el('button','ws-pill c'+(ri%6),S.rows[ri].who||'이름 없음'); b.type='button';
      b.addEventListener('click',function(){ setView('person');
        var cd2=document.querySelector('.ws-card[data-row="'+ri+'"]'); if(cd2){ cd2.scrollIntoView({block:'start'}); cd2.classList.add('flash'); setTimeout(function(){ cd2.classList.remove('flash'); },1200); } });
      wr.appendChild(b);
    });
    cd.appendChild(wr);
    var ul=el('ul','ws-list');
    G.items.forEach(function(z){
      var r=S.rows[z.ri], it=r.items[z.ii];
      var li=el('li','ws-it'+(it.done?' done':''));
      var ck=el('input','ws-ck'); ck.type='checkbox'; ck.checked=!!it.done; ck.disabled=!canEdit(); ck.setAttribute('aria-label','완료');
      ck.addEventListener('change',function(){ it.done=ck.checked; saveNow(); render(); });
      li.appendChild(ck);
      var bx=el('div','ws-tb'); bx.appendChild(el('span','ws-ptag c'+(z.ri%6),r.who||'이름 없음'));
      var t=el('div','ws-t'); marked(t,it.t,G.words); bx.appendChild(t);
      li.appendChild(bx); ul.appendChild(li);
    });
    cd.appendChild(ul);
    cd.appendChild(el('div','ws-fin','✓ 다 끝냈습니다'));
    g.appendChild(cd);
  });
}

/* 이름에서 첫 글자 — 카드 머리의 동그라미에 */
function first(w){ var m=String(w||'').replace(/^[^가-힣A-Za-z0-9]+/,''); return m?m.charAt(0):'?'; }
function bar(pct){ var b=el('div','ws-bar2'), i=el('i'); i.style.width=Math.round(pct*100)+'%'; b.appendChild(i); return b; }
/* 셈은 <b>이 한 곳</b>에서 — 요약판 · 이름표 · 카드가 같은 수를 씁니다 (5번) */
function tally(){
  var T={all:0,done:0,rows:S.rows.length,extra:S.extra.filter(function(x){return (x.t||'').trim();}).length,per:[]};
  S.rows.forEach(function(r){
    var n=r.items.length, d=r.items.filter(function(x){return x.done;}).length;
    T.all+=n; T.done+=d; T.per.push({n:n,d:d});
  });
  return T;
}

  hd.appendChild(hl); P.appendChild(hd);

  /* 요약판 */

  var pg=el('div','ws-prog'); pg.appendChild(el('span',null,'전체 진행'));
  pg.appendChild(bar(T.all?T.done/T.all:0)); pg.appendChild(el('span',null,(T.all?Math.round(T.done/T.all*100):0)+'%'));

  /* 보기 바꾸개 — 업무별 | 사람별 */

  else S.rows.forEach(function(r,ri){
    var c=el('button','ws-chip c'+(ri%6)); c.type='button';

    c.appendChild(el('span','k',T.per[ri].d+'/'+T.per[ri].n));
    c.addEventListener('click',function(){

      cd.scrollIntoView({behavior:'smooth',block:'start'});
      cd.classList.add('flash'); setTimeout(function(){ cd.classList.remove('flash'); },1200);

  var only=el('button','ws-btn ws-only'+(document.body.classList.contains('undone')?' on':''),

  ch.appendChild(only);
  var main=el('div','ws-main'+(Qo?' q':'')), side=el('aside','ws-side');
  side.appendChild(el('div','ws-side-h',TV?'업무 — 누르면 그 칸으로':'담당자 — 누르면 그 카드로'));
  side.appendChild(ch);
  if(Qo) side.hidden=true;
  main.appendChild(side); P.appendChild(main);

  /* 카드 — 업무별이면 갈래 카드, 사람별이면 사람 카드 */
  var g=el('div','ws-grid');
  if(GR) topicCards(g,GR);
  else S.rows.forEach(function(r,ri){
    var n=r.items.length, dn=T.per[ri].d;
    var vis=HIT?HIT[ri].filter(Boolean).length:n;
    if(HIT&&!vis) return;
    var cd=el('section','ws-card c'+(ri%6)+(vis>=6?' cols':'')+(n<=1?' one':'')+(n&&dn===n?' alldone':''));
    cd.setAttribute('data-row',ri);
    var hh=el('div','ws-chead');
    hh.appendChild(el('div','ws-av',first(r.who)));
    var hb=el('div','ws-hb'), nm=el('div','ws-name');
    hb.appendChild(ed(nm,function(){return r.who;},function(v){r.who=v;},'담당자'));
    var mt=el('div','ws-meta');
    mt.appendChild(el('span','ws-cnt'+(n&&dn===n?' all':''),dn+'/'+n+' 완료'));
    if(n>1) mt.appendChild(bar(dn/n));
    hb.appendChild(mt); hh.appendChild(hb);
    var wtool=el('div','ws-tool');
    wtool.appendChild(mini('↑','담당자 위로',function(){ snap(); if(move(S.rows,ri,-1)){ saveNow(); render(); } }));
    wtool.appendChild(mini('↓','담당자 아래로',function(){ snap(); if(move(S.rows,ri,1)){ saveNow(); render(); } }));
    wtool.appendChild(mini('✕','담당자 지우기',function(){
      if(!confirm('「'+(r.who||'이름 없음')+'」 줄을 할 일 '+n+'개와 함께 지울까요? (되돌리기로 살릴 수 있습니다)')) return;
      snap(); S.rows.splice(ri,1); saveNow(); render();
    },1));
    hh.appendChild(wtool);
    cd.appendChild(hh);

    var ul=el('ol','ws-list');
    r.items.forEach(function(it,ii){
      if(HIT&&!HIT[ri][ii]) return;
      var li=el('li','ws-it'+(it.done?' done':''));
      var ck=el('input','ws-ck'); ck.type='checkbox'; ck.checked=!!it.done; ck.disabled=!canEdit();
      ck.setAttribute('aria-label','완료');
      ck.addEventListener('change',function(){ it.done=ck.checked; saveNow(); render(); });
      li.appendChild(ck);
      if(n>1) li.appendChild(el('span','ws-no',String(ii+1)));
      var t=el('div','ws-t');

          ev.preventDefault(); snap(); r.items.splice(ii+1,0,{t:'',done:false}); FOCUS=[ri,ii+1]; saveNow(); render();
        }else if(ev.key==='Backspace'&&!t.innerText.replace(/\n/g,'')&&!ev.isComposing){
          ev.preventDefault(); snap(); r.items.splice(ii,1); FOCUS=ii>0?[ri,ii-1]:null; saveNow(); render();
        }

      tool.appendChild(mini('↑','위로',function(){ snap(); if(move(r.items,ii,-1)){ saveNow(); render(); } }));
      tool.appendChild(mini('↓','아래로',function(){ snap(); if(move(r.items,ii,1)){ saveNow(); render(); } }));
      tool.appendChild(mini('✕','이 할 일 지우기',function(){ snap(); r.items.splice(ii,1); saveNow(); render(); },1));

    var add=el('button','ws-add','+ 할 일'); add.type='button';
    add.addEventListener('click',function(){ snap(); r.items.push({t:'',done:false}); FOCUS=[ri,r.items.length-1]; saveNow(); render(); });

    g.appendChild(cd);
  });
  var ar=el('div','ws-addrow'), ab=el('button','ws-add','+ 담당자 더하기'); ab.type='button';
  ab.addEventListener('click',function(){ snap(); S.rows.push({who:'',items:[{t:'',done:false}]}); saveNow(); render();
    var ws=P.querySelectorAll('.ws-card .ws-name'); if(ws.length) ws[ws.length-1].focus(); });
  ar.appendChild(ab); g.appendChild(ar);

  /* 아직 정할 것 */

  eh.appendChild(ed(et,function(){return S.extraTitle;},function(v){S.extraTitle=v;},'제목'));
  eh.appendChild(el('span','ws-tag'+(Qo?' none':''),Qo?'담당이 아직 안 정해졌습니다':'아직 정할 것 '+T.extra));
  ex.appendChild(eh);
  var eu=el('ul','ws-list');
  var xn=0;
  S.extra.forEach(function(it,ii){
    if(Qo&&!((it.t||'').trim()&&hitItem(Qo,'',it.t))) return;
    xn++;
    var li=el('li','ws-it'); li.appendChild(el('span','ws-dot'));

    li.appendChild(ed(t,function(){return it.t;},function(v){it.t=v;},'정할 것',{keys:function(ev){
      if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ ev.preventDefault(); snap(); S.extra.splice(ii+1,0,{t:''}); FOCUS=['x',ii+1]; saveNow(); render(); }
      else if(ev.key==='Backspace'&&!t.innerText.replace(/\n/g,'')&&!ev.isComposing){ ev.preventDefault(); snap(); S.extra.splice(ii,1); FOCUS=ii>0?['x',ii-1]:null; saveNow(); render(); }
    }}));
    t.setAttribute('data-ri','x'); t.setAttribute('data-ii',ii);
    if(Qo) marked(t,it.t,Qo.words);
    var tool=el('div','ws-tool');
    tool.appendChild(mini('↑','위로',function(){ snap(); if(move(S.extra,ii,-1)){ saveNow(); render(); } }));
    tool.appendChild(mini('↓','아래로',function(){ snap(); if(move(S.extra,ii,1)){ saveNow(); render(); } }));
    tool.appendChild(mini('✕','지우기',function(){ snap(); S.extra.splice(ii,1); saveNow(); render(); },1));
    li.appendChild(tool);
    eu.appendChild(li);
  });
  ex.appendChild(eu);
  var xa=el('button','ws-add','+ 정할 것'); xa.type='button';
  xa.addEventListener('click',function(){ snap(); S.extra.push({t:''}); FOCUS=['x',S.extra.length-1]; saveNow(); render(); });
  ex.appendChild(xa);
  if(!(Qo&&!xn)) g.appendChild(ex);
  var bd=el('div','ws-body'); bd.appendChild(g); main.appendChild(bd);
  var nt=el('p','ws-note'); P.appendChild(ed(nt,function(){return S.note;},function(v){S.note=v;},'꼬리말'));

  if(FOCUS){
    var f=P.querySelector('[data-ri="'+FOCUS[0]+'"][data-ii="'+FOCUS[1]+'"]'); FOCUS=null;
    if(f){ f.focus(); try{ var rg=document.createRange(); rg.selectNodeContents(f); rg.collapse(false);
      var sl=window.getSelection(); sl.removeAllRanges(); sl.addRange(rg); }catch(e){} }
  }
}

function who(){
  var p=perm(), w=$('wsWho'), t;
  w.className='ws-perm'+(p==='view'?' view':'');
  if(p==='export'){ w.innerHTML='<b>보기용 파일</b>입니다 — '+(AT?AT+' 에 내보낸':'회의 때')+' 업무구분입니다. 바뀐 내용은 앱의 「업무구분」 에서 보십시오.'; return; }
  if(p==='team') t='<b>EM 권한</b> — 고치면 팀 전체 화면이 같이 바뀝니다.';
  else if(p==='view') t='<b>보기 전용</b> — 팀이 함께 보는 표라 EM 권한만 고칩니다.';
  else if(p==='own') t='<b>내 수정용 파일</b> — 고친 것은 이 브라우저에 바로 남습니다. 다른 기기로 옮기려면 「내보내기 → 내 수정용」 으로 다시 받으십시오. 앱의 팀 표와는 따로입니다.';
  else if(p==='wait') t='권한을 아직 못 읽었습니다 — 고친 것이 팀에 올라가는지 <b>모릅니다</b>. 잠시 뒤 다시 열어 보십시오.';
  else t='앱 밖에서 열었습니다 — 고친 것은 <b>이 기기에만</b> 남습니다.';
  t+=AT?' · 마지막 고침 '+AT:' · 아직 고친 적 없음 (회의 표 그대로)';
  w.innerHTML=t;
  $('wsEdit').disabled=!canEdit(); $('wsReset').disabled=!canEdit();
  if(!canEdit()) document.body.classList.remove('edit');
}

function toast(m){
  var d=$('wsToast'); if(!d){ d=el('div','ws-toast'); d.id='wsToast'; document.body.appendChild(d); }
  d.textContent=m; d.hidden=false; clearTimeout(d._t); d._t=setTimeout(function(){ d.hidden=true; },2200);
}

$('wsEdit').addEventListener('click',function(){
  if(!canEdit()) return;
  var on=!document.body.classList.contains('edit');
  if(on&&Q){ Q=''; $('wsQ').value=''; $('wsQx').hidden=true; }
  document.body.classList.toggle('edit',on);
  this.classList.toggle('on',on); this.textContent=on?'다 고쳤음':'고치기';
  if(!on&&saveT) saveNow();
  render();
});
$('wsUndo').addEventListener('click',function(){
  if(!UNDO.length) return;
  S=JSON.parse(UNDO.pop()); saveNow(); render();
  this.disabled=!UNDO.length; toast('한 걸음 되돌렸습니다');
});
$('wsPrint').addEventListener('click',function(){ if(saveT) saveNow(); window.print(); });
/* ── 📤 내보내기 — 지금 표를 한 파일로 (카톡으로 돌려 보는 보기 전용) ──
   ★ 색은 ui.css 에서 <b>지금 이 화면이 쓰는 값</b>만 읽어 파일 안에 적습니다 — 받는 쪽엔 ui.css 가 없습니다.
   ★ 서버를 안 부릅니다. 고객 정보는 표에 없습니다(담당자·할 일뿐). */
function exportHtml(mode){
  mode=mode==='own'?'own':'view';
  if(saveT) saveNow();
  var css=($('wsCss')||{}).textContent||'', seen={}, vars=[], m, re=/var\((--t-[a-z0-9-]+)/g;
  var cs=getComputedStyle(document.documentElement);
  while((m=re.exec(css))){ if(seen[m[1]]) continue; seen[m[1]]=1; var v=cs.getPropertyValue(m[1]).trim(); if(v) vars.push(m[1]+':'+v); }
  var root=document.documentElement.cloneNode(true);

  /* ⚠ 파일 이름은 영문으로 — 한글 이름을 주면 브라우저에 따라 「download」(확장자 없음)로 떨어져
     폰에서 안 열립니다(점검 브라우저에서 실제로 그랬습니다). 안의 제목은 한글입니다. */
  var name='APEX_worksplit_'+(mode==='own'?'edit_':'')+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.html';
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));

  $('wsExpPanel').hidden=true; $('wsExport').classList.remove('on');

}

/* ── 🖼 이미지(PNG) — 카톡 사진으로 보내는 세로 한 장 (폭 1080px) ──────────
   ★ 그림은 캔버스에 <b>직접</b> 그립니다 — 바깥 라이브러리를 안 받습니다(서버 0 · 7번).
   ★ 색은 화면과 같은 토큰에서 · 사람 색은 .c0~.c5 가 정한 그대로 읽어 옵니다(또 적지 않음 · 5번).
   ★ 찾는 중이면 걸린 줄만 · 걸린 사람만 — 화면과 같은 hits() 에 묻습니다.
   ★ 숫자 글꼴 tnum 을 안 씁니다(4-1번) — 캔버스 글자는 그림이라 다시 읽히지 않으니 표의 원본은 HTML 파일입니다. */
function poster(){
  if(saveT) saveNow();
  var Qo=query(), T=tally(), HT=Qo?hits(Qo):null, GR=tview()?groups():null;
  var W=1080, PAD=56, CP=40, cs=getComputedStyle(document.documentElement);
  function tk(n){ return cs.getPropertyValue(n).trim(); }
  var C={bg:tk('--t-bg'),card:tk('--t-card'),ink:tk('--t-ink'),ink2:tk('--t-ink-2'),sub:tk('--t-sub'),line:tk('--t-line-2'),
    pos:tk('--t-pos-d'),posl:tk('--t-pos-l'),warn:tk('--t-warn-d'),warnl:tk('--t-warn-l'),pt:tk('--t-point-d'),ptl:tk('--t-point-l')};
  var PAL=[]; for(var i=0;i<6;i++){ var pe=el('div','c'+i); document.body.appendChild(pe);
    var ps=getComputedStyle(pe); PAL.push({c:ps.getPropertyValue('--c').trim(),l:ps.getPropertyValue('--cl').trim()}); pe.parentNode.removeChild(pe); }
  var FONT=getComputedStyle(document.body).fontFamily;
  var cv=document.createElement('canvas'), x=cv.getContext('2d'), names=[];
  function fo(px,w){ x.font=(w||400)+' '+px+'px '+FONT; }
  function wrap(t,mw){
    var out=[]; String(t||'').split('\n').forEach(function(par){
      var line=''; par.split(/(\s+)/).forEach(function(tok){
        if(!tok) return;
        if(x.measureText(line+tok).width<=mw){ line+=tok; return; }
        if(line.trim()){ out.push(line.replace(/\s+$/,'')); line=''; }
        tok=tok.replace(/^\s+/,'');
        while(x.measureText(tok).width>mw){       /* 한 낱말이 한 줄을 넘으면 글자로 */
          var k=tok.length; while(k>1&&x.measureText(tok.slice(0,k)).width>mw) k--;
          out.push(tok.slice(0,k)); tok=tok.slice(k);
        }
        line=tok;
      });
      out.push(line.replace(/\s+$/,''));
    });
    return out;
  }
  function rr(X,Y,w,h,r,fill){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r);
    x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); x.fillStyle=fill; x.fill(); }
  function txt(t,X,Y,px,w,col){ fo(px,w); x.fillStyle=col; x.textBaseline='top'; x.fillText(t,X,Y); }
  function pass(draw){
    var y=PAD, IW=W-PAD*2;
    if(draw){ x.fillStyle=C.bg; x.fillRect(0,0,W,cv.height); }
    /* 머리 */
    fo(60,900); wrap(S.title||'업무구분',IW).forEach(function(l){ if(draw) txt(l,PAD,y,60,900,C.ink); y+=74; });
    fo(28,500); wrap(S.sub,IW).forEach(function(l){ if(draw) txt(l,PAD,y,28,500,C.sub); y+=40; });
    if(draw) txt('기준 '+(AT||'회의 때 표 그대로'),PAD,y+4,24,600,C.sub); y+=52;
    if(Qo){
      var ppl=[]; HT.forEach(function(h,ri){ var k=h.filter(Boolean).length; if(k) ppl.push(S.rows[ri].who+'('+k+')'); });
      fo(30,600); var pl=wrap(ppl.length?'이분들께 문의하세요: '+ppl.join(' · '):'업무구분에 적힌 담당이 없습니다',IW-56);
      fo(44,900); var ql=wrap('「'+Qo.q+'」 문의',IW-56);
      var bh=36+ql.length*56+pl.length*42+20;
      if(draw){ rr(PAD,y,IW,bh,28,ppl.length?C.ptl:C.warnl); var yy=y+30;
        ql.forEach(function(l){ txt(l,PAD+28,yy,44,900,C.ink); yy+=56; });
        pl.forEach(function(l){ txt(l,PAD+28,yy+4,30,600,C.ink2); yy+=42; }); }
      y+=bh+28;
    }else{
      var st=[[T.all,'할 일 전체',C.ink,C.card],[T.done,'끝낸 것',C.pos,C.card],[T.all-T.done,'남은 것',C.pt,C.card],[T.extra,'아직 정할 것',C.warn,C.warnl]];
      var sw=(IW-3*16)/4;
      st.forEach(function(z,k){ var X=PAD+k*(sw+16);
        if(draw){ rr(X,y,sw,130,26,z[3]); txt(String(z[0]),X+26,y+20,56,900,z[2]); txt(z[1],X+26,y+86,24,700,C.sub); } });
      y+=130+36;
    }
    /* 업무별 — 「무엇을 → 누구에게」 문의처 한 장.
       ★ 할 일 글은 안 싣습니다 — 한 줄이 여러 갈래에 서서 글까지 실으면 14,000px 가까이 되어
         카톡 사진으로는 못 읽습니다(실제로 재어 봤습니다). 글은 사람별 이미지 · HTML 에 있습니다. */
    if(GR){
      var LW=300, RX=PAD+CP+LW+24, RW=W-PAD-CP-RX;
      var rows=GR.map(function(G){
        fo(34,900); var ll=wrap(G.label,LW);
        fo(28,800); var pr=[], cx=0, line=[];
        G.ppl.forEach(function(ri){ var nm=S.rows[ri].who||'이름 없음', w=x.measureText(nm).width+32;
          if(cx&&cx+w>RW){ pr.push(line); line=[]; cx=0; } line.push({ri:ri,nm:nm,w:w}); cx+=w+10; });
        if(line.length) pr.push(line);
        var h=Math.max(ll.length*44+34, pr.length*56)+36;
        return {G:G,ll:ll,pr:pr,h:h};
      });
      var th=CP+56; rows.forEach(function(r){ th+=r.h; }); th+=CP-10;
      if(draw){
        rr(PAD,y,IW,th,30,C.card);
        txt('무엇을',PAD+CP,y+CP,26,900,C.sub); txt('누구에게 문의하나',RX,y+CP,26,900,C.sub);
      }
      var yy=y+CP+56;
      rows.forEach(function(r,k){
        names.push(r.G.label);
        if(draw){
          x.fillStyle=C.line; x.fillRect(PAD+CP,yy,IW-2*CP,2);
          r.ll.forEach(function(l,li){ txt(l,PAD+CP,yy+18+li*44,34,900,r.G.other?C.sub:C.ink); });
          txt('할 일 '+r.G.items.length+'줄',PAD+CP,yy+18+r.ll.length*44+2,22,700,C.sub);
          r.pr.forEach(function(line,li){ var px=RX;
            line.forEach(function(z){ var P=PAL[z.ri%6]; rr(px,yy+18+li*56,z.w,46,23,P.l); txt(z.nm,px+16,yy+26+li*56,28,800,P.c); px+=z.w+10; }); });
        }
        yy+=r.h;
      });
      y+=th+20;
    }
    /* 사람별 카드 */
    else S.rows.forEach(function(r,ri){
      var idx=[]; r.items.forEach(function(it,ii){ if(!HT||HT[ri][ii]) idx.push(ii); });
      if(HT&&!idx.length) return;
      names.push(r.who);
      var P=PAL[ri%6], n=r.items.length, dn=r.items.filter(function(z){ return z.done; }).length;
      var TX=PAD+CP+(n>1?56:44), TW=W-PAD-CP-TX;
      var blocks=idx.map(function(ii){ fo(30,n>1?500:600); return {ii:ii,it:r.items[ii],ls:wrap(r.items[ii].t,TW)}; });
      var ch=CP+76+20; blocks.forEach(function(b){ ch+=b.ls.length*44+22; }); ch+=CP-22;
      if(draw){
        rr(PAD,y,IW,ch,30,C.card); x.fillStyle=P.c; x.fillRect(PAD,y+30,10,ch-60); rr(PAD,y,10,ch,5,P.c);
        rr(PAD+CP,y+CP,76,76,22,P.l); fo(36,900); x.fillStyle=P.c; x.textAlign='center'; x.textBaseline='middle';
        x.fillText(first(r.who),PAD+CP+38,y+CP+40); x.textAlign='left';
        txt(r.who||'이름 없음',PAD+CP+96,y+CP+2,40,900,C.ink);
        txt(dn+'/'+n+' 완료',PAD+CP+96,y+CP+52,24,700,dn===n&&n?C.pos:C.sub);
      }
      var yy=y+CP+76+20;
      blocks.forEach(function(b,bi){
        if(draw){
          if(bi) { x.fillStyle=C.line; x.fillRect(TX,yy-12,TW,2); }
          if(n>1){ rr(PAD+CP,yy,40,40,12,b.it.done?C.posl:P.l); fo(22,800); x.fillStyle=b.it.done?C.pos:P.c;
            x.textAlign='center'; x.textBaseline='middle'; x.fillText(String(b.ii+1),PAD+CP+20,yy+21); x.textAlign='left'; }
          else if(b.it.done){ rr(PAD+CP,yy+4,32,32,9,C.posl); }
          b.ls.forEach(function(l,li){
            var ly=yy+li*44; txt(l,TX,ly,30,n>1?500:600,b.it.done?C.sub:C.ink);
            if(b.it.done){ fo(30,500); x.fillStyle=C.sub; x.fillRect(TX,ly+20,x.measureText(l).width,2); }
          });
        }
        yy+=b.ls.length*44+22;
      });
      y+=ch+20;
    });
    /* 아직 정할 것 */
    var ex=S.extra.filter(function(it){ return (it.t||'').trim() && (!Qo||hitItem(Qo,'',it.t)); });
    if(ex.length){
      fo(28,500); var el2=ex.map(function(it){ return wrap(it.t,IW-2*CP-28); });
      var eh=CP+50+16; el2.forEach(function(ls){ eh+=ls.length*40+14; }); eh+=CP-14;
      if(draw){ rr(PAD,y,IW,eh,30,C.warnl);
        txt(S.extraTitle||'추가 확정할 사항',PAD+CP,y+CP,34,900,C.ink);
        fo(34,900); var tw=x.measureText(S.extraTitle||'추가 확정할 사항').width;
        var tag=Qo?'담당이 아직 안 정해졌습니다':'아직 정할 것 '+T.extra; fo(22,800); var gw=x.measureText(tag).width+28;
        rr(PAD+CP+tw+16,y+CP+2,gw,40,20,C.card); txt(tag,PAD+CP+tw+30,y+CP+10,22,800,Qo?tk('--t-neg-d'):C.warn);
        var yy2=y+CP+50+16;
        el2.forEach(function(ls){ x.fillStyle=C.warn; x.beginPath(); x.arc(PAD+CP+7,yy2+20,7,0,Math.PI*2); x.fill();
          ls.forEach(function(l,li){ txt(l,PAD+CP+28,yy2+li*40,28,500,C.ink); }); yy2+=ls.length*40+14; });
      }
      y+=eh+20;
    }
    /* 꼬리 */
    fo(22,500); wrap(S.note,IW).forEach(function(l){ if(draw) txt(l,PAD,y+8,22,500,C.sub); y+=32; });
    if(draw) txt('APEX · 업무구분 · '+now()+' 에 뽑음',PAD,y+12,22,600,C.sub);
    y+=44+PAD;
    return y;
  }
  cv.width=W; cv.height=100;
  var H=pass(false); names=[];
  cv.height=Math.min(H,32000); pass(true);
  return {canvas:cv,h:H,names:names,q:Qo?Qo.q:''};
}
function exportPng(){

    setTimeout(function(){ URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); },1500);

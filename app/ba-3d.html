<!doctype html>
<html data-theme="light" lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>치료 한 바퀴 — 보장 전·후</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
  보장 전·후 만들기(app/ba.html) 의 3번 「이 일이 생기면 — 치료 한 바퀴」 · 4번 「왜 보장이 넓어야 하나」.
  ba.html 이 iframe 으로 띄우고, 고객 이름 · 나이 · 지금/조정 후 보장(만원)을 주소의 # 뒤에 실어 보낸다
  (# 뒤는 서버로 안 간다). 받은 것이 없으면 견본 고객 값으로 그린다.
  three.js 로 그린 3D(조명 · 그림자) — 장면 · 사람 · 장비는 전부 직접 만든 것이다.
  ※ 원본 시안은 Desktop\코드\치료여정_3D시안.html (판 X232 에서 옮김).
  ■ 장면(병실·수술실·주사실…)은 전부 이 파일이 <b>직접 그린</b> 아이소메트릭 3D 다 — 남의 사진을 옮기지 않는다.
    실제 모습은 「네이버에서 실제 사례 보기」 로 <b>링크</b>만 건다.
  ■ 보장 금액은 ba.html 견본 고객(doSample) 값 그대로 — 지금(전) / 조정 후.
  ■ 치료비는 <b>출처가 있는 숫자만</b> 적고, 없는 자리는 비운다(지어내지 않는다). 출처는 SRC 한 곳.
-->
<style>
:root{color-scheme:light;
 --bl:#3182F6;--bl2:#E8F3FF;--blt:#1B64DA;--nv:#191F28;--gy:#4E5968;--gy2:#8B95A1;--ln:#E5E8EB;
 --rd:#E5484D;--rd2:#FFF0F0;--gr:#0F9D6E;--gr2:#E7F8F1;--bg:#EEF2F7;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--nv);
 font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;letter-spacing:-.02em}
.fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:1280px;height:720px;flex:none;background:#fff;border-radius:24px;overflow:hidden;position:relative;
 box-shadow:0 24px 60px rgba(20,40,80,.16);transform-origin:center center;display:grid;grid-template-rows:64px 1fr}
/* ── 머리 ── */
.hd{display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--ln)}
.hd .ttl{font-weight:800;font-size:18px;white-space:nowrap}
.hd .ttl small{display:block;font-size:11.5px;font-weight:600;color:var(--gy2);margin-top:1px}
.tabs{display:flex;gap:6px;margin-left:8px}
.tabs button{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:8px 15px;font:inherit;font-size:14px;font-weight:700;color:var(--gy);cursor:pointer}
.tabs button.on{background:var(--nv);border-color:var(--nv);color:#fff}
.hd .case{margin-left:auto;font-size:13px;font-weight:700;color:var(--gy);background:#F2F4F6;border-radius:99px;padding:7px 14px;white-space:nowrap}
.hint{position:absolute;right:16px;top:18px;z-index:5;font-size:11.5px;font-weight:700;color:var(--gy2);background:rgba(255,255,255,.85);border:1px solid var(--ln);border-radius:99px;padding:5px 11px}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gy);z-index:30;background:#fff}
.embed .fit{inset:0}.embed #stage{border-radius:0;box-shadow:none}
.whymode .bd{display:block}.whymode .side,.whymode .steps,.whymode .nav,.whymode #over,.whymode .hint{display:none}
.whymode .scene{position:absolute;inset:64px 0 0 0}
.whymode #px{background:#F4F7FB;backdrop-filter:none}
.whymode .pxc{width:1180px;box-shadow:none;border:1px solid var(--ln)}
.whymode .pxs,.whymode .pxph{height:440px}
.whymode .pxh button{display:none}
.hd .ex{font-size:11.5px;font-weight:700;color:#B45309;background:#FFF7E6;border-radius:6px;padding:3px 7px;margin-left:6px}
/* ── 몸 ── */
.bd{display:grid;grid-template-columns:770px 1fr;min-height:0}
.scene{position:relative;overflow:hidden;
 background:radial-gradient(120% 90% at 40% 30%,#FFFFFF 0%,#EEF3FA 55%,#DCE5F1 100%)}
.cam{position:absolute;inset:0;perspective:1400px}
.rig{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.rig canvas{position:absolute;left:0;top:0;cursor:grab}
.rig canvas:active{cursor:grabbing}
.enter{animation:enter .55s cubic-bezier(.2,.7,.3,1)}
@keyframes enter{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
/* 장면 위 글 */
.badge{position:absolute;left:22px;top:18px;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
 border:1px solid var(--ln);border-radius:16px;padding:10px 16px 11px;box-shadow:0 6px 20px rgba(20,40,80,.08)}
.badge em{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
 background:var(--bl);color:#fff;font-size:13px;font-weight:800;margin-right:8px;vertical-align:2px}
.badge b{font-size:21px;font-weight:800}
.badge span{display:block;font-size:12.5px;font-weight:700;color:var(--gy2);margin-top:3px;padding-left:32px}
.pin{position:absolute;z-index:6;transform:translate(-50%,-100%);cursor:pointer;pointer-events:auto}
.pin .tag{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:5px 10px;font-size:12.5px;font-weight:800;
 white-space:nowrap;box-shadow:0 4px 14px rgba(20,40,80,.14);color:var(--nv)}
.pin .tag i{font-style:normal;color:var(--bl);margin-right:4px}
.pin .stick{width:2px;height:22px;background:linear-gradient(var(--bl),rgba(49,130,246,0));margin:0 auto}
.pin .dot{width:12px;height:12px;border-radius:50%;background:var(--bl);margin:-6px auto 0;box-shadow:0 0 0 0 rgba(49,130,246,.5);animation:ping 1.8s infinite}
.pin.on .tag{background:var(--nv);color:#fff;border-color:var(--nv)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(49,130,246,.55)}80%{box-shadow:0 0 0 12px rgba(49,130,246,0)}100%{box-shadow:0 0 0 0 rgba(49,130,246,0)}}
.pin.bt .tag{padding:7px 10px 8px;font-size:13px;line-height:1.45}
.pin.bt .tag em{font-style:normal;display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--nv);color:#fff;font-size:11px;align-items:center;justify-content:center;margin-right:5px;vertical-align:1px}
.pin.bt .tag span{display:block;font-size:11.5px;font-weight:700;color:var(--gy)}
.pin.bt .tag span.a{color:var(--blt);font-weight:800}
.pin.bt .tag span i,.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.legend{position:absolute;right:20px;top:58px;z-index:5;display:flex;gap:12px;font-size:12px;font-weight:700;color:var(--gy);background:rgba(255,255,255,.9);border:1px solid var(--ln);border-radius:99px;padding:6px 14px}
.what3{position:absolute;left:18px;bottom:74px;z-index:5;width:322px;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);
 border:1px solid var(--ln);border-radius:14px;padding:9px 12px 9px;box-shadow:0 6px 18px rgba(20,40,80,.08)}
.tl{margin:0;padding:0;list-style:none;position:relative}
.tl li{font-size:12.5px;font-weight:600;color:var(--gy);line-height:1.45;padding:2px 0 3px 16px;position:relative}
.tl li::before{content:'';position:absolute;left:3px;top:7px;width:7px;height:7px;border-radius:50%;background:#fff;border:2px solid var(--bl)}
.tl li::after{content:'';position:absolute;left:7px;top:15px;bottom:-4px;width:1.5px;background:#CFE3FF}
.tl li:last-child::after{display:none}
.tl li b{color:var(--nv)}
.what3 h5{margin:0 0 4px;font-size:11.5px;font-weight:800;color:var(--gy2)}
.what3 .what li{font-size:12.5px;padding:1px 0 1px 13px}
.what3 .what li::before{top:8px}
.mbtn{margin-left:auto;border:1px solid var(--ln);background:#fff;border-radius:99px;padding:8px 14px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;color:var(--nv)}
.mbtn+.case{margin-left:8px}
.src.mdl{width:560px}
.src .how{margin:0 0 8px;padding-left:18px;font-size:13px;color:var(--gy);line-height:1.7}
.slot{display:flex;gap:10px;align-items:center;border:1.5px dashed #C9D3E0;border-radius:14px;padding:10px 12px;margin-bottom:8px;background:#FBFCFD}
.slot.ok{border-style:solid;border-color:#9FD8C2;background:#F3FBF7}.slot.dg{border-color:var(--bl);background:var(--bl2)}
.slot .sl{flex:1;min-width:0}.slot .sl b{display:block;font-size:14px}.slot .sl span{display:block;font-size:11.5px;color:var(--gy2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sl em{display:block;font-style:normal;font-size:11.5px;font-weight:800;color:var(--gr);margin-top:2px}.slot .sl em.no{color:var(--gy2)}.slot .sl em.er{color:var(--rd)}
.slot .sb{display:flex;flex-direction:column;gap:4px;flex:none}
.slot .sb a,.slot .sb label,.slot .sb button{font:inherit;font-size:11.5px;font-weight:800;text-align:center;border:1px solid var(--ln);background:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;color:var(--nv);text-decoration:none}
.slot .sb a{background:#1CAAD9;border-color:#1CAAD9;color:#fff}.slot .sb input{display:none}
.mfold{display:flex;gap:8px;margin:4px 0 12px}.mfold label{flex:1;text-align:center;border-radius:12px;padding:11px 8px;font-weight:800;font-size:14px;cursor:pointer;background:var(--bl);color:#fff}
.mfold label+label{background:#fff;color:var(--nv);border:1px solid var(--ln)}.mfold input{display:none}
#mtoast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--nv);color:#fff;font-weight:800;font-size:13.5px;border-radius:99px;padding:10px 18px;opacity:0;transition:.25s;z-index:40;pointer-events:none}
#mtoast.on{opacity:1;transform:translate(-50%,0)}
.pxbtn{position:absolute;right:16px;top:52px;z-index:6;border:0;border-radius:99px;padding:10px 16px;font:inherit;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,#3182F6,#6C5CE7);box-shadow:0 8px 20px rgba(49,130,246,.35);cursor:pointer}
.pxbig{display:block;width:100%;border:0;border-radius:14px;padding:11px 14px;text-align:left;font:inherit;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#3182F6,#6C5CE7);cursor:pointer;margin-top:auto}
.pxbig span{display:block;font-size:11.5px;font-weight:700;opacity:.85;margin-top:1px}
.pxbig+.links{margin-top:0}
#px{position:absolute;inset:0;z-index:30;display:none;background:rgba(15,22,32,.42);backdrop-filter:blur(3px);align-items:center;justify-content:center}
#px.on{display:flex}
.pxc{width:700px;background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(10,20,40,.3);padding:14px 18px 12px;animation:enter .35s}
.pxh{display:flex;align-items:center;gap:10px;margin-bottom:4px}.pxh b{font-size:18px}.pxh span{font-size:12.5px;font-weight:800;color:var(--gy2)}
.pxh button{margin-left:auto;border:0;background:#F2F4F7;border-radius:8px;padding:6px 10px;font:inherit;font-weight:800;cursor:pointer}
.pxs{display:block;width:100%;height:360px;background:#F8FAFC;border-radius:16px}
.pxcap{font-size:16.5px;font-weight:700;color:var(--nv);line-height:1.55;margin:10px 4px 8px;min-height:52px}
.pxcap b{color:var(--blt)}
.pxn{display:flex;align-items:center;gap:10px}.pxn button{border:1px solid var(--ln);background:#fff;border-radius:10px;padding:7px 14px;font:inherit;font-weight:800;cursor:pointer}
.pxn button.go{background:var(--nv);border-color:var(--nv);color:#fff}
.pxd{flex:1;display:flex;justify-content:center;gap:7px}.pxd i{width:9px;height:9px;border-radius:50%;background:#D5DCE6;cursor:pointer}.pxd i.on{background:var(--bl);width:24px;border-radius:5px}
.pxnote{font-size:11px;color:var(--gy2);font-weight:600;margin-top:7px;text-align:center}
.pxph{height:360px;display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.pxph.n1{grid-template-columns:1fr}.pxph.n3{grid-template-columns:repeat(3,1fr)}.pxph.n4{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
.pxph a{position:relative;display:block;border-radius:14px;overflow:hidden;background:#EEF2F7;text-decoration:none;min-height:0}
.pxph img{width:100%;height:100%;object-fit:cover;display:block}
.pxph span{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 7px;background:linear-gradient(transparent,rgba(10,16,28,.82));color:#fff;font-size:13px;font-weight:800;line-height:1.35}
.pxph small{display:block;font-size:10px;font-weight:600;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pxnv{margin-left:auto;font-size:12px;font-weight:800;color:#fff;background:#03C75A;border-radius:8px;padding:6px 10px;text-decoration:none}
.pxnv+button{margin-left:6px!important}
.pxwhy{display:block;width:100%;border:1.5px solid #FFD27A;border-radius:14px;padding:9px 14px;text-align:left;font:inherit;font-size:14px;font-weight:800;color:#7A4B00;background:#FFF7E3;cursor:pointer}
.pxwhy span{display:block;font-size:11.5px;font-weight:700;opacity:.8;margin-top:1px}
.pxwhy.big{margin-top:auto;padding:12px 14px;font-size:15px}
.pxwhy.big+.links{margin-top:0}
.side{padding:12px 16px 10px;gap:7px}
.side .card{padding:10px 13px}
.side .row{padding:3px 0}
.side table.pay td{padding:3.5px 0}
.side .sum{padding:9px 14px}.side .sum div b{font-size:21px}
.side .gap{font-size:12px;line-height:1.45}
.pxbig{padding:8px 13px;font-size:14px}
.side .links a,.side .links button{padding:7px 6px}
.side .note{font-size:10px;line-height:1.4}
.bub{position:absolute;z-index:7;transform:translate(-50%,0);pointer-events:none;font-weight:900;font-size:22px;color:var(--gr);
 text-shadow:0 2px 0 #fff,0 0 12px #fff;animation:rise 1.1s cubic-bezier(.2,.7,.3,1) .35s both;white-space:nowrap}
.bub small{display:block;font-size:11.5px;font-weight:800;color:var(--gy);text-align:center}
@keyframes rise{0%{opacity:0;transform:translate(-50%,24px) scale(.8)}25%{opacity:1;transform:translate(-50%,-6px) scale(1.06)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
/* 단계 줄 */
.steps{position:absolute;left:18px;right:18px;bottom:14px;z-index:5;display:flex;gap:6px;align-items:stretch}
.steps button{flex:1 1 0;min-width:0;border:1px solid var(--ln);background:rgba(255,255,255,.94);border-radius:13px;padding:7px 9px;
 font:inherit;text-align:left;cursor:pointer;box-shadow:0 3px 10px rgba(20,40,80,.06)}
.steps button b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button span{display:block;font-size:11px;font-weight:700;color:var(--gy2)}
.steps button.on{background:var(--nv);border-color:var(--nv)}
.steps button.on b{color:#fff}.steps button.on span{color:#C9D3E0}
.steps button.all{flex:0 0 108px;background:var(--bl2);border-color:#CFE3FF}
.steps button.all b{color:var(--blt)}
.steps button.all.on{background:var(--bl);border-color:var(--bl)}.steps button.all.on b{color:#fff}
.nav{position:absolute;top:50%;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:#fff;
 font-size:18px;font-weight:800;color:var(--gy);cursor:pointer;box-shadow:0 4px 12px rgba(20,40,80,.1)}
.nav.l{left:14px}.nav.r{right:14px}
/* ── 오른쪽 ── */
.side{border-left:1px solid var(--ln);padding:16px 18px 14px;overflow:hidden;display:flex;flex-direction:column;gap:10px;background:#FBFCFD}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px 14px}
.card h4{margin:0 0 7px;font-size:12.5px;font-weight:800;color:var(--gy2);display:flex;align-items:center;gap:6px}
.card h4 em{font-style:normal;margin-left:auto;font-weight:700;color:var(--gy2);font-size:11.5px}
.what{margin:0;padding:0;list-style:none}
.what li{font-size:13.5px;font-weight:600;color:var(--gy);padding:2px 0 2px 14px;position:relative;line-height:1.5}
.what li::before{content:'';position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--bl)}
.what li b{color:var(--nv)}
.row{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-top:1px dashed #EEF0F3;font-size:13.5px}
.row:first-of-type{border-top:0}
.row .n{flex:1;min-width:0;font-weight:700}
.row .n small{display:block;font-size:11px;font-weight:600;color:var(--gy2);margin-top:1px}
.row .v{font-weight:800;white-space:nowrap}
.row .v.na{color:var(--gy2);font-weight:700;font-size:12px}
.row sup a{font-size:10px;color:var(--bl);text-decoration:none;font-weight:800;margin-left:2px}
table.pay{width:100%;border-collapse:collapse;font-size:13px}
table.pay th{font-size:11px;color:var(--gy2);font-weight:800;text-align:right;padding:0 0 4px}
table.pay th:first-child{text-align:left}
table.pay td{padding:5px 0;border-top:1px dashed #EEF0F3;text-align:right;font-weight:800;white-space:nowrap}
table.pay td:first-child{text-align:left;white-space:normal;font-weight:700}
table.pay td:first-child small{display:block;font-size:11px;color:var(--gy2);font-weight:600}
table.pay td.b{color:var(--gy2)}
table.pay td.a{color:var(--blt)}
table.pay td .no{color:var(--rd);font-weight:800;font-size:12px}
table.pay td .nn{color:var(--gy2);font-weight:700;font-size:12px}
table.pay tr.hl td{background:#FFFBEA}
.sum{display:grid;grid-template-columns:1fr 26px 1fr;align-items:center;background:var(--nv);color:#fff;border-radius:16px;padding:12px 16px}
.sum div span{display:block;font-size:11.5px;font-weight:700;opacity:.7}
.sum div b{font-size:24px;font-weight:900;letter-spacing:-.03em}
.sum .ar{text-align:center;font-weight:900;opacity:.6}
.sum .a b{color:#9FD0FF}
.gap{font-size:12.5px;font-weight:700;color:var(--gy);line-height:1.55;padding:0 2px}
.gap b{color:var(--nv)}.gap .r{color:var(--rd)}.gap .o{color:var(--gr)}
.links{display:flex;gap:6px;margin-top:auto}
.links a,.links button{flex:1;text-align:center;border-radius:12px;padding:9px 6px;font:inherit;font-size:12.5px;font-weight:800;text-decoration:none;cursor:pointer;border:1px solid var(--ln);background:#fff;color:var(--nv)}
.links a.nv{background:#03C75A;border-color:#03C75A;color:#fff}
.note{font-size:10.5px;color:var(--gy2);line-height:1.5;font-weight:600}
/* 출처 서랍 */
.src{position:absolute;inset:64px 0 0 auto;width:510px;background:#fff;z-index:20;border-left:1px solid var(--ln);padding:18px 20px;
 transform:translateX(100%);transition:transform .3s;overflow:auto;box-shadow:-12px 0 30px rgba(20,40,80,.08)}
.src.on{transform:none}
.src h3{margin:0 0 10px;font-size:16px}
.src ol{margin:0;padding-left:18px}
.src li{font-size:13px;line-height:1.55;margin-bottom:9px;color:var(--gy)}
.src li b{color:var(--nv)}
.src li a{color:var(--bl);font-weight:700;word-break:break-all;font-size:11.5px}
.src .x{position:absolute;right:16px;top:14px;border:0;background:#F2F4F6;border-radius:8px;padding:6px 10px;font:inherit;font-weight:800;cursor:pointer}
/* 한 바퀴 표 */
table.ov{width:100%;border-collapse:collapse;font-size:13px}
table.ov th{font-size:11px;color:var(--gy2);font-weight:800;text-align:right;padding:0 0 5px}
table.ov th:first-child{text-align:left}
table.ov td{padding:6px 0;border-top:1px dashed #EEF0F3;text-align:right;font-weight:800;white-space:nowrap}
table.ov td:first-child{text-align:left;font-weight:700}
table.ov tr.t td{border-top:2px solid var(--nv);font-size:14px}
.loop{font-size:12.5px;font-weight:700;color:var(--gy);background:#F5F7FA;border:1px dashed #C9D3E0;border-radius:12px;padding:8px 11px;line-height:1.55}

 pxT(cx,ly,label,{fs:16})+(sub?pxT(cx,ly+20,sub,{fs:13,w:700,c:PXC.gy}):''),delay||0);}
function wyCov(k){return COV.b[k]!==undefined||COV.a[k]!==undefined;}
function wyRow(y,name,b,a,note){
 return pxFade('<rect x="40" y="'+(y-26)+'" width="560" height="52" rx="12" fill="#fff" stroke="'+PXC.ln+'"/>'+

  pxT(430,y+6,b===undefined?'없음':man(b),{fs:15,c:b===undefined?PXC.rd:PXC.gy})+

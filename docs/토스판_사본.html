<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APEX 사본 · 오늘 · 고객 · 콘텐츠</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --t-ink:#191F28; --t-sub:#6B7684; --t-sub2:#8B95A1; --t-line:#E5E8EB;
  --t-bg:#F2F4F6; --t-card:#FFFFFF;
  --t-point:#1A56DB; --t-point-l:#EBF3FF; --t-point-d:#123A96;
  --t-pos:#059669; --t-pos-l:#ECFDF5; --t-warn:#D97706; --t-warn-l:#FFF7ED;
  --t-neg:#DC2626; --t-neg-l:#FEF2F2; --t-pur:#7C3AED; --t-pur-l:#F5F3FF;
  --t-seal:#FFF9EC; --t-sealk:#8A6A2F;
  --t-r:20px; --t-r-btn:15px; --t-r-sm:13px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Pretendard','Malgun Gothic',-apple-system,sans-serif;color:var(--t-ink);background:#DFE3E8}
button,input,textarea,select{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
input,textarea{border:0;background:none}

/* ── 겉틀 ── */
#shell{height:100%;display:flex;justify-content:center;padding:18px}
#app{width:100%;max-width:1360px;height:100%;background:var(--t-bg);border-radius:22px;overflow:hidden;
  display:flex;box-shadow:0 10px 40px rgba(0,0,0,.09)}
body.phone #shell{padding:22px}
body.phone #app{max-width:390px;border-radius:34px;border:9px solid #0B0D10}

/* ── 사이드바 ── */
.side{width:244px;flex:0 0 244px;background:#fff;border-right:1px solid #EEF1F4;display:flex;flex-direction:column}
body.phone .side,body.narrow .side{display:none}
.logo{height:62px;flex:0 0 62px;display:flex;align-items:center;gap:10px;padding:0 18px}
.logo .m{width:30px;height:30px;border-radius:9px;background:var(--t-point);color:#fff;font-size:12.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;letter-spacing:-.05em}
.logo .n{font-size:15px;font-weight:800;letter-spacing:-.03em}
.logo .n small{display:block;font-size:10.5px;color:var(--t-sub2);font-weight:600;letter-spacing:0}
.snav{flex:1;padding:4px 10px;overflow-y:auto}
.glab{font-size:11px;font-weight:800;color:#AEB6BE;padding:13px 10px 5px}
.it{display:flex;align-items:center;gap:9px;height:38px;padding:0 10px;border-radius:11px;font-size:13.5px;
  font-weight:600;color:#4E5968;letter-spacing:-.02em;width:100%;text-align:left}
.it .e{width:18px;text-align:center;font-size:13px}
.it .c{margin-left:auto;font-size:11px;font-weight:800;background:#F2F4F6;color:var(--t-sub2);border-radius:6px;padding:2px 7px}
.it.on{background:var(--t-point-l);color:var(--t-point);font-weight:700}
.it.on .c{background:var(--t-point);color:#fff}
.sfoot{flex:0 0 58px;border-top:1px solid #F1F3F5;display:flex;align-items:center;gap:9px;padding:0 15px}
.sfoot .av{width:28px;height:28px;border-radius:9px;background:#E8EDF3;color:#5B6572;font-size:11.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.sfoot .t{font-size:12.5px;font-weight:700;letter-spacing:-.02em}
.sfoot .t small{display:block;font-size:10.5px;color:var(--t-sub2);font-weight:600}

/* ── 본문 ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{height:58px;flex:0 0 58px;display:flex;align-items:center;padding:0 22px;gap:10px}
body.phone .top{height:50px;flex:0 0 50px;padding:0 16px}
.top .bk{font-size:20px;color:var(--t-sub2);width:28px;text-align:left}
.top .d{font-size:13.5px;color:var(--t-sub);font-weight:600}
.top .r{margin-left:auto;display:flex;gap:7px;align-items:center}
.pil{height:32px;border-radius:10px;background:#fff;display:flex;align-items:center;padding:0 12px;
  font-size:12.5px;font-weight:700;color:var(--t-sub);white-space:nowrap}
.pil.b{background:var(--t-point);color:#fff}
.pil.w{background:var(--t-warn-l);color:var(--t-warn)}
.scr{flex:1;overflow-y:auto;padding:0 22px 26px}
body.phone .scr{padding:0 16px 20px}
.scr::-webkit-scrollbar{width:7px}.scr::-webkit-scrollbar-thumb{background:#D7DCE2;border-radius:7px}
.tabbar{display:none;height:64px;flex:0 0 64px;background:#fff;border-top:1px solid #F1F3F5;padding-bottom:8px}
body.phone .tabbar,body.narrow .tabbar{display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:10.5px;font-weight:700;color:#C4CBD2}
.tabbar button.on{color:var(--t-point)}
.tabbar .i{width:20px;height:20px;border-radius:7px;background:currentColor;opacity:.9}

/* ── 공용 ── */
.h1{font-size:24px;font-weight:800;letter-spacing:-.035em;line-height:1.3;padding-top:2px}
.h1 span{color:var(--t-sub2)}
body.phone .h1{font-size:21px}
.sub{margin-top:8px;font-size:13.5px;color:var(--t-sub);line-height:1.6;letter-spacing:-.01em}
.t-card{background:var(--t-card);border-radius:var(--t-r);padding:20px 22px}
.t-card+.t-card{margin-top:12px}
.lab{font-size:11.5px;font-weight:800;color:var(--t-point);letter-spacing:.01em}
.t-btn{height:52px;border-radius:var(--t-r-btn);background:var(--t-point);color:#fff;font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center;width:100%;letter-spacing:-.02em}
.t-btn.g{background:#F2F4F6;color:#4E5968}
.t-btn.sm{height:42px;font-size:14px;border-radius:12px}
.row2{display:flex;gap:8px}
.t-chip{height:36px;padding:0 14px;border-radius:11px;background:#fff;color:var(--t-sub);font-size:13px;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.t-chip.on{background:var(--t-ink);color:#fff}
.t-chip b{color:var(--t-point)}.t-chip.on b{color:#8FB4FF}
.chips{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.pbar{height:6px;border-radius:6px;background:#E3E7EB;overflow:hidden;margin-top:11px}
.pbar i{display:block;height:100%;background:var(--t-point);border-radius:6px;transition:.3s}
.empty{padding:40px 10px;text-align:center;color:var(--t-sub2);font-size:14px;font-weight:600;line-height:1.7}
.note{background:var(--t-warn-l);border-radius:14px;padding:13px 16px;font-size:12.5px;line-height:1.6;
  color:#8A5A12;font-weight:600;margin-top:12px}
.note b{color:#7A4E0A}

/* 사람 줄 */
.t-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #F3F5F7;width:100%;text-align:left}
.t-row:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:14px;background:var(--t-point-l);color:var(--t-point);font-weight:800;
  font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.nm{font-size:15px;font-weight:700;letter-spacing:-.025em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mt{font-size:12px;color:var(--t-sub2);margin-top:4px;font-weight:600;line-height:1.45}
.stg{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:7px;background:#F2F4F6;color:var(--t-sub)}
.stg.due{background:var(--t-warn-l);color:var(--t-warn)}
.rt{margin-left:auto;display:flex;gap:6px;align-items:center;flex:0 0 auto}
.gb{height:34px;padding:0 12px;border-radius:10px;background:#F5F7F9;color:#4E5968;font-size:12.5px;font-weight:700}
.gb.b{background:var(--t-point);color:#fff}

/* 오늘 한 분 */
.one .hd{display:flex;align-items:center;gap:12px}
.one .nm2{font-size:21px;font-weight:800;letter-spacing:-.035em}
.one .why{margin-top:13px;font-size:12.5px;color:var(--t-sub2);font-weight:600;background:#F7F9FA;border-radius:11px;
  padding:10px 13px;line-height:1.5}
.one .aim{margin-top:15px;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1.45}
.one .way{margin-top:9px;font-size:13px;color:var(--t-sub);line-height:1.6}
.one .tools{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap}
.one .tools span{font-size:11.5px;font-weight:700;color:#4E5968;background:#F5F7F9;border-radius:9px;padding:6px 10px}

/* 타임라인 */
.ev{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #F3F5F7}
.ev:last-child{border-bottom:0}
.ev .d{width:9px;height:9px;border-radius:9px;background:var(--t-point);margin-top:6px;flex:0 0 9px}
.ev .d.g{background:#D7DCE2}
.ev .t{font-size:13.5px;font-weight:700;letter-spacing:-.025em}
.ev .s{font-size:11.5px;color:var(--t-sub2);margin-top:3px;font-weight:600;line-height:1.5}
.ev .u{margin-left:auto;font-size:11px;font-weight:700;color:var(--t-point);background:var(--t-point-l);
  border-radius:8px;padding:5px 8px;align-self:flex-start;flex:0 0 auto}

/* 입력 */
.fld{margin-top:14px}
.fld .l{font-size:12px;font-weight:800;color:var(--t-sub2)}
.fld input,.fld textarea{width:100%;border-bottom:2px solid var(--t-line);font-size:18px;font-weight:700;
  letter-spacing:-.03em;padding:12px 0 10px;margin-top:2px}
.fld textarea{font-size:15px;font-weight:600;letter-spacing:-.01em;min-height:76px;resize:vertical;line-height:1.6;
  border:1.5px solid var(--t-line);border-radius:12px;padding:12px 14px;margin-top:6px}
.fld input:focus,.fld textarea:focus{outline:0;border-color:var(--t-point)}
.dupw{margin-top:13px;background:var(--t-warn-l);border-radius:14px;padding:14px 16px;display:none}
.dupw.on{display:block}
.quick3{display:flex;gap:7px;margin-top:16px}
.quick3 button{flex:1;background:#fff;border-radius:14px;padding:13px 8px;text-align:center}
.quick3 .e{font-size:18px}
.quick3 .t{margin-top:6px;font-size:11.5px;font-weight:700;letter-spacing:-.02em}

/* 캐러셀 */
.slides{display:flex;gap:8px;margin-top:13px;overflow-x:auto;padding-bottom:6px}
.slides::-webkit-scrollbar{height:5px}.slides::-webkit-scrollbar-thumb{background:#D7DCE2;border-radius:5px}
.sl{flex:0 0 146px;height:183px;border-radius:12px;background:#0F2A52;color:#fff;padding:13px 12px;
  display:flex;flex-direction:column;overflow:hidden}
.sl .no{font-size:9.5px;font-weight:800;opacity:.55}
.sl .tx{margin-top:8px;font-size:13px;font-weight:800;line-height:1.45;letter-spacing:-.03em}
.sl .sm{margin-top:7px;font-size:10px;line-height:1.5;opacity:.78;font-weight:600}
.sl.w{background:#fff;color:var(--t-ink);border:1px solid var(--t-line)}
.sl.w .sm{opacity:1;color:var(--t-sub2)}
.sl.seal{background:var(--t-seal);color:var(--t-sealk);border:1px solid #EFE0BE}
.sl.seal .tx{font-size:10.5px;line-height:1.55}
.sl.seal .sm{font-size:9px;color:var(--t-sealk);opacity:.92}
.chk .r{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:12px;line-height:1.5;font-weight:600}
.chk .r .i{width:16px;height:16px;border-radius:6px;flex:0 0 16px;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:800;color:#fff;margin-top:1px}
.chk .r.ok .i{background:var(--t-pos)}.chk .r.ok{color:#3F4A57}
.chk .r.no .i{background:var(--t-warn)}.chk .r.no{color:var(--t-warn)}
.newsit{background:#fff;border-radius:14px;padding:13px 15px;margin-bottom:8px;width:100%;text-align:left;
  border:2px solid transparent}
.newsit.on{border-color:var(--t-point)}
.newsit .t{font-size:13.5px;font-weight:700;letter-spacing:-.025em;line-height:1.45}
.newsit .m{margin-top:6px;font-size:11px;color:var(--t-sub2);font-weight:600}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dh{font-size:11px;font-weight:800;color:var(--t-sub2);text-align:center;padding:5px 0}
.cd{min-height:76px;background:#F7F9FA;border-radius:10px;padding:5px}
body.phone .cd{min-height:58px;padding:3px}
.cd.out{background:transparent}
.cd.now{background:var(--t-point-l);box-shadow:inset 0 0 0 2px var(--t-point)}
.dn{font-size:11px;font-weight:800;color:var(--t-sub2)}
.dt{margin-top:3px;font-size:9.5px;font-weight:700;border-radius:5px;padding:2px 4px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.phone .dt{font-size:8px;padding:1px 3px}
.dt.sns{background:var(--t-pur-l);color:var(--t-pur)}
.dt.bd{background:var(--t-pos-l);color:var(--t-pos)}
.dt.end{background:var(--t-warn-l);color:var(--t-warn)}
.dt.region{background:var(--t-point-l);color:var(--t-point)}
.dt.more{color:#B0B8C1}
/* 요일 리듬 */
.rhy{display:flex;gap:8px;margin-top:13px}
.rhy div{flex:1;background:#fff;border-radius:16px;padding:15px 13px;border:2px solid transparent}
.rhy div.on{border-color:var(--t-point);background:var(--t-point-l)}
.rhy .w{font-size:12px;font-weight:800;color:var(--t-sub2)}
.rhy div.on .w{color:var(--t-point)}
.rhy .t{margin-top:7px;font-size:15px;font-weight:700;letter-spacing:-.025em}
.rhy .d{margin-top:5px;font-size:11.5px;color:var(--t-sub2);line-height:1.5;font-weight:600}
.scriptbox{background:#F7F9FA;border-radius:14px;padding:15px 17px;margin-top:10px}
.scriptbox .sh{font-size:11.5px;font-weight:800;color:var(--t-pur)}
.scriptbox .sl2{display:flex;gap:10px;padding:7px 0;font-size:13px;line-height:1.6}
.scriptbox .sl2 b{flex:0 0 52px;color:var(--t-sub2);font-size:11.5px;font-weight:800;padding-top:2px}

/* 시트 */
#dim{position:fixed;inset:0;background:rgba(10,14,20,.42);display:none;z-index:40}
#dim.on{display:block}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:480px;background:#fff;
  border-radius:24px 24px 0 0;padding:24px 20px 26px;transition:.25s cubic-bezier(.4,0,.2,1);z-index:41}
#sheet.on{transform:translate(-50%,0)}
#sheet .q{font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.4}
#sheet .qs{margin-top:8px;font-size:13px;color:var(--t-sub2);font-weight:600}
#sheet .opts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#sheet .opts button{flex:1;min-width:92px;height:50px;border-radius:13px;background:#F5F7F9;color:#4E5968;
  font-size:14.5px;font-weight:700}
#sheet .opts button.p{background:var(--t-point);color:#fff}
#sheet .cl{margin-top:12px;width:100%;height:48px;border-radius:13px;background:#F2F4F6;color:var(--t-sub);
  font-size:14.5px;font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;background:#191F28;color:#fff;
  padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;transition:.2s;z-index:60;pointer-events:none;
  max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.viewsw{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;gap:6px;background:#fff;border-radius:12px;
  padding:5px;box-shadow:0 4px 16px rgba(0,0,0,.14)}
.viewsw button{height:32px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--t-sub)}
.viewsw button.on{background:var(--t-ink);color:#fff}
@media (max-width:900px){
  .side{display:none} .tabbar{display:flex} #shell{padding:0} #app{border-radius:0}
  /* 좁은 폭에서 위 띠가 안 밀리게 — 넘치면 옆으로 넘깁니다 */
  .top{overflow-x:auto;scrollbar-width:none} .top::-webkit-scrollbar{height:0}
  /* 아래 탭바를 가리지 않게 */
  .viewsw{bottom:76px}
}
/* 어떤 폭에서도 본문이 창을 밀지 않습니다 */
.main{overflow:hidden}
.top{min-width:0}
</style></head>
<body>

<div id="shell"><div id="app">
  <aside class="side">
    <div class="logo"><div class="m">A</div><div class="n">APEX 사본<small id="who">윤시현 단장</small></div></div>
    <div class="snav" id="snav"></div>
    <div class="sfoot"><div class="av">윤</div><div class="t">윤시현<small>온탑본부 · 단장</small></div></div>
  </aside>
  <div class="main">
    <div class="top" id="top"></div>
    <div class="scr" id="scr"></div>
    <div class="tabbar" id="tabbar"></div>
  </div>
</div></div>

<div id="dim"></div><div id="sheet"></div><div id="toast"></div>
<div class="viewsw"><button id="vpc" class="on">PC</button><button id="vph">폰</button></div>

<script>
/* ══════════════════════════════════════════════════════════════
   APEX 사본 — 저장은 이 브라우저(localStorage)에만 합니다.
   서버도 부르지 않고 아무것도 내보내지 않습니다.
   그릇 규칙은 「고객그릇」 설계안 그대로입니다:
     · 열쇠는 숫자만 남긴 전화번호
     · 사건은 쌓기만 한다(지우지 않고 되돌림 표시만)
     · 지금 단계·마지막 접촉은 쌓인 것에서 계산한다
     · 이름은 가린 것이 기본, 실명은 이 브라우저에만
   ══════════════════════════════════════════════════════════════ */
var KEY='apex_copy_v1';
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function toast(m){var t=$('toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._h);
  t._h=setTimeout(function(){t.classList.remove('on');},2100);}
function pk(s){return String(s||'').replace(/\D/g,'');}
function mask(n){n=String(n||'');return n?n.charAt(0)+Array(n.length).join('○'):'';}
function d0(d){d=d||new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function ymd(d){d=d||new Date();function p(x){return (x<10?'0':'')+x;}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function ago(n){var d=new Date();d.setDate(d.getDate()-n);return d.toISOString();}
function days(a,b){return Math.round((d0(new Date(b))-d0(new Date(a)))/864e5);}
function fmt(iso){var d=new Date(iso),t=days(iso,new Date());
  return t===0?'오늘':t===1?'어제':t===2?'그저께':(d.getMonth()+1)+'월 '+d.getDate()+'일';}

/* ── 규칙: 단계 열 개. apex-stage.js 의 문장을 그대로 옮겼습니다 ── */
var ORDER=['미접촉','부재','거절','TA','AP','PC','CS','계약완료','증권전달','소개완료'];
var EMO={'미접촉':'🆕','부재':'📵','거절':'🚫','TA':'☎️','AP':'🤝','PC':'📞','CS':'✍️',
         '계약완료':'🏆','증권전달':'📜','소개완료':'🙌'};

/* ══ 30일 약속 — 밀착관리의 뼈대 ═══════════════════════════════════
   실제 앱의 ccCfg() 값을 그대로 씁니다 — days 30 · vipDays 14 · vipMan 100만원.
   「30일 안에 모든 고객에게」 가 이 앱이 지키자고 만든 약속입니다.
   단계(진행 중)와는 <b>다른 축</b>입니다. 계약이 끝난 분도 약속은 살아 있습니다. */
var CC={days:30,vipDays:14,vipMan:100};
function isVip(p){return num(infoOf(p).premium)>=CC.vipMan;}
function cycleOf(p){return isVip(p)?CC.vipDays:CC.days;}
/* 접촉은 <b>통화·만남</b>만 셉니다 — 단계를 옮긴 것은 접촉이 아닙니다 */
function lastTouch(p){
  var e=DB.events.filter(function(x){return x.key===p.key&&!x.undone&&
    (x.kind==='call'||x.kind==='meet');}).sort(function(a,b){return new Date(b.at)-new Date(a.at);});
  return e.length?e[0].at:null;
}
function band(p){
  var l=lastTouch(p), cy=cycleOf(p);
  if(!l)return {k:'never',col:'#6B7684',d:days(p.since,new Date()),cy:cy,
    t:'한 번도 연락 안 함 · 등록 '+days(p.since,new Date())+'일'};
  var d=days(l,new Date());
  if(d>=cy)return {k:'over',col:'#FF9500',d:d,cy:cy,t:d+'일째 — '+cy+'일 약속을 넘겼습니다'};
  if(d>=Math.max(1,Math.round(cy*5/6)))return {k:'soon',col:'#D97706',d:d,cy:cy,t:d+'일째 — 곧 넘깁니다'};
  return {k:'ok',col:'#8B95A1',d:d,cy:cy,t:(d===0?'오늘 연락함':d+'일 전에 연락함')};
}
/* 이번 주기 안에 몇 분을 뵈었나 — 0 은 전원이 목표라는 뜻 */
function promise(){
  var all=people(), kept=all.filter(function(p){var b=band(p);return b.k==='ok'||b.k==='soon';});
  return {all:all.length,kept:kept.length,over:all.filter(function(p){return band(p).k==='over';}).length,
          never:all.filter(function(p){return band(p).k==='never';}).length};
}
/* 만난 뒤 한 줄 — 안 남기면 다음 계산이 전부 틀어집니다 */
function noteRate(){
  var m=0,n=0;
  DB.events.forEach(function(e){
    if(e.undone||e.kind!=='call')return;
    m++;
    var has=DB.events.some(function(x){return x.key===e.key&&!x.undone&&x.kind==='memo'&&
      Math.abs(new Date(x.at)-new Date(e.at))<6*3600*1000;});
    if(has)n++;
  });
  return {all:m,with:n,pct:m?Math.round(n/m*100):null};
}

function nextBirth(mmdd){
  var m=String(mmdd).match(/(\d{1,2})\D+(\d{1,2})/); if(!m)return null;
  var now=new Date(), y=now.getFullYear();
  var d=new Date(y,+m[1]-1,+m[2]); if(d0(d)<d0(now))d=new Date(y+1,+m[1]-1,+m[2]);
  return d;
}

/* ── 계산: 쌓인 것에서 지금을 구한다 ── */
function evs(k){return DB.events.filter(function(e){return e.key===k&&!e.undone;})
  .sort(function(a,b){return new Date(b.at)-new Date(a.at);});}
function stageOf(k){var s=evs(k).filter(function(e){return e.kind==='stage'&&e.stage;});
  return s.length?s[0].stage:'미접촉';}
function lastAt(k){var e=evs(k);return e.length?e[0].at:DB.people[k].since;}
function dueDays(k){ /* 0 이면 오늘, 양수면 며칠 지났나, 음수면 아직 */
  var st=stageOf(k), w=WAIT[st]==null?7:WAIT[st];
  return days(lastAt(k),new Date())-w;
}
function people(){return Object.keys(DB.people).map(function(k){return DB.people[k];});}
function touchedToday(k){var t=ymd();
  return DB.events.some(function(e){return e.key===k&&!e.undone&&ymd(new Date(e.at))===t;});}
/* 한 분에 거리가 여럿이어도 <b>오늘 자리에는 하나만</b> 세운다.
   나머지는 그분 화면에 모여 있다 — 「한 분 = 한 퀘스트」 */
function queue(){
  var out=[];
  people().forEach(function(p){
    if(touchedToday(p.key))return;
    var cs=[];
    if(p.appt)cs.push({type:'appt',sc:1000});
    /* ★ 사람이 손으로 적어 둔 「다음 할 일」 — 규칙이 만든 것보다 앞섭니다.
       실제 앱의 client_meta.next{what,due} 가 이 자리입니다. */
    if(p.next&&p.next.what&&p.next.due&&p.next.due<=ymd())
      cs.push({type:'next',sc:900});
    var d=dueDays(p.key); if(d>=0)cs.push({type:'stage',sc:520+Math.min(d,30)*3});
    signals(p).forEach(function(s){cs.push({type:'sig',s:s,sc:s.sc});});
    /* 30일 약속을 넘긴 분 — 단계와 상관없이 오늘 자리에 선다 */
    var b=band(p);
    if(b.k==='over')cs.push({type:'cycle',b:b,sc:500+Math.min(b.d-b.cy,60)*2});
    else if(b.k==='never')cs.push({type:'cycle',b:b,sc:560});
    if(!cs.length)return;
    cs.sort(function(a,b){return b.sc-a.sc;});
    cs[0].p=p; cs[0].more=cs.length-1; out.push(cs[0]);
  });
  out.sort(function(a,b){return b.sc-a.sc;});
  return out;
}
function doneToday(){
  var t=ymd();
  var ks={};DB.events.forEach(function(e){
    if(!e.undone&&ymd(new Date(e.at))===t&&e.kind!=='memo'&&e.at)ks[e.key]=1;});
  return Object.keys(ks).length;
}
function push(k,o){
  o.id='e'+Date.now()+Math.random().toString(36).slice(2,6);o.at=new Date().toISOString();o.key=k;
  DB.events.unshift(o);save();
}

/* ── 오늘 동선 — 약속 + 「가는 김에」 ────────────────────────────────
   실제 앱에는 apex-route.js 가 있고 카카오 길찾기로 구간 거리를 잽니다.
   여기서는 같은 짜임만 보여 드립니다 — 약속이 선 지역에 사는 분을 붙입니다. */
function rKey(s){return String(s||'').replace(/\s+/g,'');}
function todayRoute(){
  var ap=people().filter(function(p){return p.appt;})
    .sort(function(a,b){return a.appt<b.appt?-1:1;});
  var rg={}; ap.forEach(function(p){if(p.region)rg[rKey(p.region)]=1;});
  var seen={}; ap.forEach(function(p){seen[p.key]=1;});
  var near=queue().map(function(c){return c.p;}).filter(function(p){
    return !seen[p.key] && p.region && rg[rKey(p.region)];});
  return {ap:ap,near:near,regions:Object.keys(rg)};
}

var GOAL={call:5,meet:2,note:3};
function activity(){
  var t=ymd(), a={call:0,meet:0,note:0};
  DB.events.forEach(function(e){
    if(e.undone||ymd(new Date(e.at))!==t)return;
    if(e.kind==='call')a.call++;
    else if(e.kind==='meet'||(e.kind==='call'&&e.result==='만남'))a.meet++;
    else if(e.kind==='memo'||e.kind==='photo')a.note++;
  });
  a.done=Math.min(1,(a.call/GOAL.call+a.meet/GOAL.meet+a.note/GOAL.note)/3);
  return a;
}

/* ── 달력 — 한 달을 미리 짜 둔다 ────────────────────────────────────
   영업만 하시게 하려면 「오늘 뭐 하지」를 매일 새로 정하지 않아야 합니다.
   월·수·금은 나를 알리는 날, 화·목은 지역을 묶어 도는 날로 리듬을 고정합니다. */
var DOW=['일','월','화','수','목','금','토'];
var SNSDAY={1:['카드뉴스','뉴스 하나를 캐러셀 다섯 장으로'],
            3:['블로그','한 편 — 기계가 먼저 걸릴 자리를 봅니다'],
            5:['릴스 대본','나를 알리는 30초 — 주 1회면 충분합니다']};
function monthDays(y,m){return new Date(y,m+1,0).getDate();}
function monthPlan(y,m){
  var P={}, add=function(d,k,t){var s=ymd(new Date(y,m,d));(P[s]=P[s]||[]).push({k:k,t:t});};
  var last=monthDays(y,m), i, w;
  for(i=1;i<=last;i++){ w=new Date(y,m,i).getDay();
    if(SNSDAY[w])add(i,'sns',SNSDAY[w][0]); }
  people().forEach(function(p){
    var I=infoOf(p);
    if(I.birth){var b=nextBirth(I.birth);
      if(b&&b.getFullYear()===y&&b.getMonth()===m){
        var d=b.getDate()-7; if(d<1)d=1; add(d,'bd',mask(p.name)+'님 생일 준비');}}
    if(I.policyEnd){var e=new Date(I.policyEnd);
      if(!isNaN(e)){var pre=new Date(e); pre.setDate(pre.getDate()-30);
        if(pre.getFullYear()===y&&pre.getMonth()===m)
          add(pre.getDate(),'end',mask(p.name)+'님 만기 안내');}}
  });
  /* 지역의 날 — 같은 지역에 세 분 넘으면 화·목 빈 날에 몰아 둡니다 */
  var byR={}; people().forEach(function(p){var r=rKey(p.region);if(r)byR[r]=(byR[r]||0)+1;});
  var hot=Object.keys(byR).filter(function(r){return byR[r]>=3;})
    .sort(function(a,b){return byR[b]-byR[a];});
  var slot=[]; for(i=1;i<=last;i++){w=new Date(y,m,i).getDay(); if(w===2||w===4)slot.push(i);}
  hot.forEach(function(r,j){ if(slot[j*2])add(slot[j*2],'region',r+' 도는 날 · '+byR[r]+'명'); });
  return P;
}

    '<div class="sub">월·수·금은 <b>나를 알리는 날</b>, 화·목은 <b>지역을 묶어 도는 날</b>. '+

    '<div class="row2" style="margin-top:14px;flex-wrap:wrap">'+

     ['bd','생일 준비',cnt.bd],['end','만기 안내',cnt.end]].map(function(x){

    DOW.map(function(d){return '<div class="dh">'+d+'</div>';}).join('')+cells+'</div></div>'+

  var b=e.target.closest('[data-go],[data-open],[data-f],[data-stage],[data-undo],[data-eye],[data-do],[data-skip],'+
    '[data-call],[data-add],[data-n],[data-up],[data-r],[data-q],[data-info],[data-ba],'+
    '[data-cal],[data-route],[data-region],[data-news2],[data-goc],[data-next],[data-nextdone],[data-tool],[data-help]');
  if(!b)return;
  var D=b.dataset;
  if(D.go){ if(D.go==='add')go('add'); else go(D.go); return; }
  if(D.open){ go('person',D.open); return; }
  if(D.f){ F=D.f; paint(); return; }
  if(D.goc){ F=D.goc; go('clients'); return; }
  if(D.tool){ toast(esc(D.tool)+' — 실제 앱에서는 그 화면이 열립니다'); return; }
  if(D.help){ var hp=D.help.split('|');
    if(hp[1]){F=hp[1];go('clients');} else go(hp[0]); return; }
  if(D.next){ var pn=DB.people[D.next]; if(!pn)return;
    var nx=pn.next||{}, dflt=(function(){var d=new Date();d.setDate(d.getDate()+7);return ymd(d);})();
    sheet('<div class="q">다음에 무엇을 하기로<br>하셨나요?</div>'+
      '<div class="qs">이게 남아야 관리입니다 — 규칙이 만든 카드보다 앞에 섭니다</div>'+
      '<input id="nw" value="'+esc(nx.what||'')+'" placeholder="예) 배우자와 같이 한 번 더 뵙기" '+
      'style="width:100%;height:54px;border-bottom:2px solid var(--t-line);font-size:18px;font-weight:700;margin-top:16px">'+
      '<input id="nd" value="'+esc(nx.due||dflt)+'" placeholder="2026-10-01" '+
      'style="width:100%;height:50px;border-bottom:2px solid var(--t-line);font-size:16px;font-weight:700;margin-top:10px">'+
      '<div class="opts"><button class="p" data-r="다음저장|'+D.next+'">넣기</button>'+
      (nx.what?'<button data-r="다음지움|'+D.next+'">지우기</button>':'')+'</div>'+
      '<button class="cl" data-r="|">닫기</button>');
    setTimeout(function(){try{$('nw').focus();}catch(e){}},90); return; }
  if(D.nextdone){ var pd=DB.people[D.nextdone]; if(!pd)return;
    push(D.nextdone,{kind:'memo',body:'다음 할 일 끝 — '+((pd.next||{}).what||'')});
    pd.next=null; save(); paint(); toast('끝냈습니다 — 다음 할 일을 새로 적어 두세요'); return; }
  if(D.eye){ REAL[D.eye]=!REAL[D.eye]; paint(); return; }
  if(D.stage){ var a=D.stage.split('|'); if(a[0]===stageOf(a[1])){toast('이미 그 단계입니다');return;}
    push(a[1],{kind:'stage',stage:a[0],body:''}); paint();
    toast('줄 하나가 쌓였습니다 — 다음엔 '+(WAIT[a[0]]||'—')+'일 뒤'); return; }
  if(D.undo){ DB.events.forEach(function(x){if(x.id===D.undo)x.undone=true;}); save(); paint();
    toast('되돌렸습니다 — 기록은 남습니다'); return; }
  if(D.do){ askResult(D.do); return; }
  if(D.call){ askResult(D.call); return; }
  /* 접는 것도 줄 하나다 — 같은 단계를 다시 찍어 「마지막 기록」만 오늘로 옮긴다 */
  if(D.skip){ push(D.skip,{kind:'stage',stage:stageOf(D.skip),body:'오늘은 접음'}); paint();
    toast('오늘은 접었습니다 — 규칙대로 다시 올라옵니다'); return; }
  if(D.add){ var c=D.add.split('|');
    if(c[0]==='memo'){ sheet('<div class="q">한 줄만 적어 주세요</div>'+
      '<textarea id="mb" style="width:100%;min-height:86px;border:1.5px solid var(--t-line);border-radius:12px;'+
      'padding:12px 14px;font-size:14px;margin-top:14px;line-height:1.6" placeholder="예) 배우자와 상의 후 답 주신다고 함"></textarea>'+
      '<div class="opts"><button class="p" data-r="메모저장|'+c[1]+'">넣기</button></div>'+
      '<button class="cl" data-r="|">닫기</button>'); }
    else { sheet('<div class="q">무엇을 찍으시겠어요?</div>'+
      '<div class="opts"><button class="p" data-r="사진증권|'+c[1]+'">증권</button>'+
      '<button data-r="사진명함|'+c[1]+'">명함</button><button data-r="사진그밖|'+c[1]+'">그 밖</button></div>'+
      '<button class="cl" data-r="|">닫기</button>'); }
    return; }
  /* 보장분석 읽어오기 — 실제로는 app/ba.html 의 읽기 엔진이 policies·coverages 에 넣습니다.
     여기서는 「넣으면 이렇게 채워진다」를 보여 드리는 것뿐입니다. */
  if(D.ba){ var pb=DB.people[D.ba]; if(!pb)return;
    var e2=new Date(); e2.setDate(e2.getDate()+22);
    pb.info=pb.info||{};
    pb.info.insurer='KB 외 2곳 · 4건';
    pb.info.premium=pb.info.premium||'31';
    pb.info.policyEnd=ymd(e2);
    /* 납입 만기는 계약일 + payment_term 으로 셉니다 — 실제로는 apex_term_years() 가 읽습니다 */
    var e3=new Date(); e3.setDate(e3.getDate()+11);
    pb.info.payEnd=ymd(e3);
    pb.info.cd=pb.info.cd||(function(){var d=new Date();d.setFullYear(d.getFullYear()-3);return ymd(d);})();
    pb.info.gaps='치료비, 간병';
    push(D.ba,{kind:'photo',body:'보장분석 PDF 읽음 — 계약 4건 · 담보 37개 · 납입/보장 만기 계산됨'});
    paint();
    toast('읽었습니다 — 네 칸이 채워지고 거리가 <b>'+signals(pb).length+'가지</b> 생겼습니다');
    return; }
  if(D.info){ var ai=D.info.split('|'), f=null;
    INFO.forEach(function(x){if(x.k===ai[0])f=x;});
    var pi=DB.people[ai[1]]; if(!f||!pi)return;
    sheet('<div class="q">'+esc(f.t)+'</div><div class="qs">'+esc(f.hint)+'</div>'+
      '<input id="iv" value="'+esc(infoOf(pi)[f.k]||'')+'" placeholder="'+esc(f.ph||'')+'" '+
      'style="width:100%;height:56px;border-bottom:2px solid var(--t-line);font-size:20px;font-weight:700;'+
      'letter-spacing:-.03em;margin-top:16px" autocomplete="off">'+
      '<div class="opts"><button class="p" data-r="정보|'+f.k+'|'+ai[1]+'">넣기</button></div>'+
      '<button class="cl" data-r="|">닫기</button>');
    setTimeout(function(){try{$('iv').focus();}catch(e){}},90); return; }
  if(D.n){ NSEL=NEWS.filter(function(x){return x.id==D.n;})[0]; paint(); return; }
  if(D.news2){ NSEL=NEWS.filter(function(x){return x.id==D.news2;})[0]; go('content');
    toast('이 뉴스로 캐러셀을 세웠습니다'); return; }
  if(D.cal){ CALM=parseInt(D.cal,10); paint(); return; }
  if(D.route){ toast(D.route==='near'
    ? '가는 김에 걸 분들을 오늘 맨 위로 올립니다 — 실제로는 한 번에 통화 목록이 뜹니다'
    : '카카오 길찾기로 구간 거리를 재서 순서를 세웁니다 (apex-route.js · route-km)'); return; }
  if(D.region){ toast(esc(D.region)+' 에 오늘 걸 분들을 하루로 묶습니다 — 달력의 「지역의 날」로 갑니다'); return; }
  if(D.up){ toast(esc(D.up)+' — 사본이라 실제로 올라가지는 않습니다'); return; }
  if(D.q){ toast(D.q+' 는 사본에 아직 없습니다 — 구성만 잡아 두었습니다'); return; }
  if(D.r!=null){
    var a2=D.r.split('|'), what=a2[0], k=a2[1]; unsheet(); if(!what)return;
    if(what==='다음저장'){ var pn2=DB.people[a2[1]]; if(!pn2)return;
      var w2=($('nw')&&$('nw').value||'').trim(), d2=($('nd')&&$('nd').value||'').trim();
      if(!w2){toast('무엇을 할지 적어 주세요');return;}
      pn2.next={what:w2,due:d2}; save(); paint(); toast('적어 두었습니다'); return; }
    if(what==='다음지움'){ var pn3=DB.people[a2[1]]; if(pn3){pn3.next=null;save();paint();toast('지웠습니다');} return; }
    if(what==='정보'){ var pp=DB.people[a2[2]]; if(!pp)return;
      var v=($('iv')&&$('iv').value||'').trim();
      pp.info=pp.info||{}; if(v)pp.info[a2[1]]=v; else delete pp.info[a2[1]];
      save(); paint();
      var n=signals(pp).length;
      toast(v?('넣었습니다'+(n?' — 이분께 거리가 <b>'+n+'가지</b>':'')):'비웠습니다'); return; }
    if(what==='메모저장'){ var v=($('mb')&&$('mb').value||'').trim();
      if(v){push(k,{kind:'memo',body:v});toast('쌓았습니다');} paint(); return; }
    if(what.indexOf('사진')===0){ push(k,{kind:'photo',body:what.slice(2)});toast('쌓았습니다');paint();return; }
    var mapr={'통화됨':'TA','부재':'부재','거절':'거절','만남':'PC','다음에':null};
    push(k,{kind:'call',result:what,body:''});
    var ns=mapr[what];
    if(ns&&ns!==stageOf(k))push(k,{kind:'stage',stage:ns,body:'통화 결과로'});
    paint(); toast(mask(DB.people[k].name)+'님 — '+what+' 로 남겼습니다'); return; }
});

/* 폰 보기 */
$('vpc').addEventListener('click',function(){document.body.classList.remove('phone');
  this.classList.add('on');$('vph').classList.remove('on');});
$('vph').addEventListener('click',function(){document.body.classList.add('phone');
  this.classList.add('on');$('vpc').classList.remove('on');});

if(!load())seed();
paint();
/* 주소 끝에 #clients · #content · #p=01012345678 을 붙이면 그 화면으로 바로 갑니다.
   알람을 눌렀을 때 한 번에 그 자리로 보내는 것과 같은 길입니다. */
(function(){
  var hsh=String(location.hash||'').replace('#','');
  if(!hsh)return;
  var m=hsh.match(/^p=(\d+)$/);
  if(m){ if(DB.people[m[1]])go('person',m[1]); return; }
  if(['today','clients','cal','tools','map','help','content','me','rules','add'].indexOf(hsh)>=0)go(hsh);
})();
</script>
</body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APEX 목각 · 폰 — 맞춰 갈 기준</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
/* ══════════════════════════════════════════════════════════════
   디자인은 목업.html(s1~s9) 그대로입니다.
   PC판(APEX_목각.html)과 같은 칸에 저장하므로,
   폰에서 적으신 것이 PC에서도 그대로 보입니다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --ink:#191F28; --sub:#8B95A1; --sub2:#6B7684; --line:#E5E8EB; --bg:#F2F4F6;
  --point:#1A56DB; --point-l:#EBF3FF; --pos:#059669; --pos-l:#ECFDF5;
  --warn:#D97706; --warn-l:#FFF7ED; --neg:#DC2626; --neg-l:#FEF2F2;
  --pur:#7C3AED; --pur-l:#F5F3FF;
  --font:'Pretendard','Malgun Gothic',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:#fff;color:var(--ink)}

/* ── 화면 고르는 줄 (폰 바깥) ── */
.head{padding:34px 34px 4px}
.head h1{font-size:26px;font-weight:800;letter-spacing:-.025em}
.head p{margin-top:8px;font-size:14.5px;color:var(--sub2);line-height:1.6}
.pickbar{display:flex;flex-wrap:wrap;gap:7px;padding:16px 34px 0;max-width:980px}
.pickbar div{height:34px;padding:0 14px;border-radius:11px;background:#F2F4F6;font-size:13px;font-weight:700;
  color:var(--sub2);display:flex;align-items:center;cursor:pointer;letter-spacing:-.01em}
.pickbar div.on{background:var(--ink);color:#fff}
.stage{padding:26px 34px 60px;display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap}
.cap{font-size:14px;font-weight:700;color:var(--sub2);margin-bottom:12px;letter-spacing:-.01em}
.cap b{color:var(--ink)}
.side{flex:1;min-width:300px;max-width:520px}
.side .box{background:#F7F9FA;border-radius:18px;padding:20px 22px;margin-bottom:12px}
.side .box h3{font-size:15px;font-weight:800;letter-spacing:-.02em}
.side .box p{margin-top:8px;font-size:13.5px;color:var(--sub2);line-height:1.7;font-weight:500}
.side .box p b{color:var(--ink);font-weight:700}

/* ── 폰 ── */
.phone{position:relative;width:410px;flex:0 0 410px;height:864px;background:#0B0D10;border-radius:46px;padding:10px;
  box-shadow:0 18px 40px rgba(0,0,0,.14)}
.scr{width:390px;height:844px;border-radius:38px;overflow:hidden;position:relative;background:var(--bg);
  display:flex;flex-direction:column}

/* 상태바 */
.sb{height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 30px;font-size:14px;font-weight:700;letter-spacing:-.01em}
.sb .r{display:flex;align-items:center;gap:5px}
.sig{display:flex;align-items:flex-end;gap:2px;height:11px}
.sig i{width:3px;background:currentColor;border-radius:1px}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:11px}
.bat{width:24px;height:12px;border:1.6px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.bat::after{content:"";position:absolute;inset:2px;right:7px;background:currentColor;border-radius:2px}
.bat::before{content:"";position:absolute;right:-4px;top:3.5px;width:2px;height:5px;background:currentColor;border-radius:0 2px 2px 0;opacity:.6}

/* 공통 조각 */
.body{flex:1;overflow:auto;padding:0 24px}
.body::-webkit-scrollbar{width:0}
.h1{font-size:27px;font-weight:800;line-height:1.38;letter-spacing:-.03em}
.h1 em{font-style:normal;color:var(--point)}
.sub{margin-top:12px;font-size:15px;color:var(--sub2);line-height:1.55;letter-spacing:-.01em}
.card{background:#fff;border-radius:20px;padding:20px}
.btn{height:56px;border-radius:15px;background:var(--point);color:#fff;font-size:17px;font-weight:700;
  display:flex;align-items:center;justify-content:center;letter-spacing:-.02em;cursor:pointer}
.btn.g{background:#F2F4F6;color:var(--sub2)}
.foot{padding:0 24px 30px}
.ghost{text-align:center;font-size:14px;color:var(--sub);margin-top:16px;font-weight:600;cursor:pointer}
.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.x{font-size:22px;color:var(--sub);font-weight:400;line-height:1;cursor:pointer}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:9px;background:#D7DCE2}
.dots i.on{background:var(--point);width:20px}
.step{font-size:13px;font-weight:700;color:var(--sub)}

/* 1. 잠금화면 */
.lock{background:linear-gradient(165deg,#0F2A52 0%,#123A73 45%,#0A1C38 100%);color:#fff}
.lock .clock{margin-top:44px;text-align:center}
.lock .clock .t{font-size:82px;font-weight:700;letter-spacing:-.045em;line-height:1}
.lock .clock .d{margin-top:6px;font-size:16px;opacity:.72;font-weight:600}
.noti{margin:38px 18px 0;background:rgba(255,255,255,.93);border-radius:22px;padding:16px 18px;color:var(--ink);
  box-shadow:0 10px 26px rgba(0,0,0,.24);cursor:pointer}
.noti .nh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub2);font-weight:700}
.noti .ico{width:20px;height:20px;border-radius:6px;background:var(--point);color:#fff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;letter-spacing:-.04em}
.noti .nt{margin-top:9px;font-size:16.5px;font-weight:800;letter-spacing:-.022em;line-height:1.35}
.noti .nb{margin-top:5px;font-size:14.5px;color:var(--sub2);line-height:1.45;letter-spacing:-.01em}
.noti.small{margin-top:10px;opacity:.55;transform:scale(.965)}
.lockfoot{position:absolute;bottom:34px;left:0;right:0;text-align:center;color:rgba(255,255,255,.62);font-size:13.5px;font-weight:600}
.lockbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:5px;background:rgba(255,255,255,.5)}

/* 2. 헤드업 배너 */
.dim{position:absolute;inset:0;background:rgba(10,14,20,.28)}
.heads{position:absolute;top:56px;left:12px;right:12px;background:#fff;border-radius:22px;padding:16px 18px;
  box-shadow:0 16px 36px rgba(0,0,0,.26)}
.heads .acts{display:flex;gap:8px;margin-top:14px}
.heads .acts div{flex:1;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:14.5px;font-weight:700;cursor:pointer}
.heads .acts .p{background:var(--point);color:#fff}
.heads .acts .s{background:#F2F4F6;color:var(--sub2)}

/* 목록행 */
.row{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid #F1F3F5}
.row:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:13px;background:var(--point-l);color:var(--point);font-weight:800;font-size:15px;
  display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.av.p{background:var(--pur-l);color:var(--pur);font-size:12.5px;letter-spacing:-.04em}
.row .nm{font-size:16px;font-weight:700;letter-spacing:-.02em}
.row .mt{font-size:13px;color:var(--sub);margin-top:3px;font-weight:500}
.nm{font-size:16px;font-weight:700;letter-spacing:-.02em}
.mt{font-size:13px;color:var(--sub);margin-top:3px;font-weight:500}
.row .rt{margin-left:auto;display:flex;align-items:center;gap:8px}
.chk{width:26px;height:26px;border-radius:26px;border:2px solid #D7DCE2;display:block;cursor:pointer}
.chk.on{background:var(--point);border-color:var(--point);position:relative}
.chk.on::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border:2.5px solid #fff;
  border-top:0;border-left:0;transform:rotate(42deg)}
.tag{font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;background:#FFF7ED;color:var(--warn)}
.tag.g{background:var(--pos-l);color:var(--pos)}.tag.p{background:var(--pur-l);color:var(--pur)}
.tag.r{background:var(--neg-l);color:var(--neg)}.tag.b{background:var(--point-l);color:var(--point)}
.tag.s{background:#F2F4F6;color:var(--sub2)}

/* 3지선다 */
.pick{display:flex;gap:7px;margin-top:13px}
.pick div{flex:1;height:46px;border-radius:12px;background:#F5F7F9;color:var(--sub2);font-size:14.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:1.5px solid transparent;cursor:pointer}
.pick div.on{background:var(--point);color:#fff}
.pick div.no{background:#FEF2F2;color:var(--neg)}

/* 금액 */
.amt{text-align:center;padding:26px 0 8px}
.amt .v{font-size:44px;font-weight:800;letter-spacing:-.045em}
.amt .v span{font-size:26px;margin-left:3px;font-weight:700}
.amt .d{margin-top:10px;font-size:14px;color:var(--pos);font-weight:700}
.chips{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.chips div{padding:9px 15px;border-radius:11px;background:#fff;font-size:14px;font-weight:700;color:var(--sub2);cursor:pointer}
.chips div.on{background:var(--ink);color:#fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:20px}
.pad div{height:56px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:600;
  letter-spacing:-.02em;cursor:pointer}
.pad div.s{font-size:19px;color:var(--sub)}

/* 시간칩 */
.tchip{display:flex;gap:7px;margin-top:12px}
.tchip div{padding:11px 0;flex:1;border-radius:12px;background:#F5F7F9;text-align:center;font-size:15px;
  font-weight:700;color:var(--sub2);cursor:pointer}
.tchip div.on{background:var(--point);color:#fff}

/* 완료 */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:40px}
.ring{width:96px;height:96px;border-radius:96px;background:var(--point);display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 30px rgba(26,86,219,.3)}
.ring::after{content:"";width:26px;height:46px;border:6px solid #fff;border-top:0;border-left:0;
  transform:rotate(42deg) translate(-3px,-4px);border-radius:2px}
.done h2{margin-top:28px;font-size:27px;font-weight:800;letter-spacing:-.03em}
.done p{margin-top:11px;font-size:15.5px;color:var(--sub2);font-weight:600}
.stats{display:flex;gap:9px;margin-top:34px;width:100%}
.stats div{flex:1;background:#fff;border-radius:16px;padding:16px 0;text-align:center}
.stats .n{font-size:22px;font-weight:800;letter-spacing:-.03em}
.stats .l{font-size:12.5px;color:var(--sub);margin-top:4px;font-weight:600}

/* 홈 */
.hero{background:linear-gradient(140deg,#1A56DB,#123A96);border-radius:22px;padding:22px;color:#fff;margin-top:6px;
  box-shadow:0 10px 24px rgba(26,86,219,.24)}
.hero .q{font-size:20px;font-weight:800;line-height:1.45;letter-spacing:-.03em}
.hero .s{margin-top:9px;font-size:13.5px;opacity:.82;line-height:1.5}
.hero .b{margin-top:16px;height:46px;border-radius:13px;background:#fff;color:var(--point);font-size:15.5px;
  font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer}
.greet{padding:4px 0 14px;font-size:22px;font-weight:800;letter-spacing:-.03em}
.greet span{color:var(--sub)}
.hc{background:#fff;border-radius:20px;padding:18px 20px;margin-top:11px}
.hc .t{font-size:12.5px;font-weight:800;color:var(--point);letter-spacing:.01em}
.hc .m{margin-top:7px;font-size:17px;font-weight:700;letter-spacing:-.025em;line-height:1.4}
.hc .m small{color:var(--sub);font-size:13.5px;font-weight:600;display:block;margin-top:5px;letter-spacing:-.01em}
.go{margin-top:14px;height:48px;border-radius:13px;background:var(--point);color:#fff;font-size:15.5px;
  font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.go.g{background:#F2F4F6;color:var(--ink)}
.two{display:flex;gap:8px;margin-top:14px}
.two .go{flex:1;margin-top:0}
.bar{height:6px;border-radius:6px;background:#EDF0F3;margin-top:13px;overflow:hidden}
.bar i{display:block;height:100%;width:25%;background:var(--point);border-radius:6px}
.tabs{height:70px;flex:0 0 70px;background:#fff;border-top:1px solid #F1F3F5;display:flex;padding-bottom:12px}
.tabs div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;
  font-weight:700;color:#C4CBD2;cursor:pointer}
.tabs div.on{color:var(--point)}
.tabs .i{width:22px;height:22px;border-radius:7px;background:currentColor;opacity:.9}

/* 알림 설정 */
.srow{display:flex;align-items:center;gap:14px;padding:17px 0;border-bottom:1px solid #F1F3F5}
.srow:last-child{border-bottom:0}
.srow .tm{font-size:16px;font-weight:800;width:52px;letter-spacing:-.02em;flex:0 0 52px}
.srow .ds{font-size:15px;font-weight:700;letter-spacing:-.02em}
.srow .ds small{display:block;font-size:12.5px;color:var(--sub);font-weight:500;margin-top:3px}
.sw{margin-left:auto;width:48px;height:28px;border-radius:28px;background:var(--point);position:relative;flex:0 0 48px;cursor:pointer}
.sw::after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:22px;background:#fff}
.sw.off{background:#D7DCE2}
.sw.off::after{right:auto;left:3px}
.note{margin-top:16px;background:#FFF7ED;border-radius:16px;padding:16px 18px;font-size:14px;line-height:1.6;
  color:#8A5A12;font-weight:600;letter-spacing:-.01em}
.note b{color:#7A4E0A}
.note.bl{background:var(--point-l);color:#12408F}.note.bl b{color:var(--point)}
.note.gr{background:var(--pos-l);color:#065F46}.note.gr b{color:#047857}
.note.gy{background:#F7F9FA;color:var(--sub2);font-weight:500}.note.gy b{color:var(--ink)}
.nh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub2);font-weight:700}
.ico{width:20px;height:20px;border-radius:6px;background:var(--point);color:#fff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;letter-spacing:-.04em}
.nt{margin-top:9px;font-size:16.5px;font-weight:800;letter-spacing:-.022em;line-height:1.35}
.nb{margin-top:5px;font-size:14.5px;color:var(--sub2);line-height:1.45;letter-spacing:-.01em}

/* 상담현황 한 줄 — 홈에 띄우는 것 */
.flowbar{display:flex;gap:4px;align-items:center;margin-top:13px}
.flowbar .st{flex:1;min-width:0;text-align:center;padding:10px 2px;border-radius:12px;background:#F7F9FA;
  color:var(--sub);cursor:pointer}
.flowbar .st.on{background:var(--point-l);color:var(--point)}
.flowbar .st b{display:block;font-size:17px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.flowbar .st span{display:block;margin-top:4px;font-size:10px;font-weight:700;white-space:nowrap}
.flowbar .ar{flex:0 0 auto;color:#C4CBD2;font-size:10px;font-weight:700}

/* 폰 안에서 적는 칸 */
.fl{margin-top:14px}
.fl label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px;letter-spacing:-.01em}
.inp{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;padding:0 14px;font:inherit;
  font-size:15px;font-weight:600;color:var(--ink);background:#fff;outline:none;letter-spacing:-.02em}
.inp:focus{border-color:var(--point);box-shadow:0 0 0 3px var(--point-l)}
textarea.inp{height:auto;min-height:96px;padding:12px 14px;line-height:1.65;font-weight:500;resize:vertical}
select.inp{cursor:pointer}
.kvp{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid #F1F3F5;font-size:14.5px}
.kvp:last-child{border-bottom:0}
.kvp .k{color:var(--sub);font-weight:600;flex:0 0 96px;font-size:13.5px}
.kvp .v{font-weight:700;letter-spacing:-.02em}
.mini{height:44px;padding:0 12px;border-radius:10px;background:#F2F4F6;color:var(--sub2);font-size:13px;
  font-weight:700;display:flex;align-items:center;cursor:pointer}
.mini.b{background:var(--point);color:#fff}
.lockcard{border:1.5px solid #F3D9A8;background:#FFFDF8}
.rrnv{font-size:20px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin-top:12px}
.say{background:#F7F9FA;border-radius:14px;padding:14px 16px;margin-top:12px;font-size:14px;line-height:1.8;
  color:#33383D;white-space:pre-wrap;letter-spacing:-.01em}
.src{font-size:12.5px;color:var(--sub);font-weight:500;line-height:1.65;padding:9px 0;border-top:1px solid #F1F3F5}
.src b{color:var(--ink);font-weight:700}.src i{font-style:normal;color:var(--point);font-weight:700}
.sect{font-size:12.5px;font-weight:800;color:var(--point);letter-spacing:.01em;padding:18px 0 2px}

/* 홈 머리줄 — 사본 사진 */
/* ── 맨 윗칸 ────────────────────────────────────────────────
   PC 판과 같은 결입니다. 날짜는 굵게 · 요일은 흐리게,
   알약에는 작은 아이콘 칸을 두고 숫자만 진하게.            */
.hrow{display:flex;align-items:flex-start;padding:14px 0 4px}
.hrow .d{font-size:16px;font-weight:800;letter-spacing:-.035em;color:var(--ink);white-space:nowrap}
.hrow .d em{font-style:normal;color:var(--sub);font-weight:700;font-size:13px;margin-left:6px}
.hrow .d i{display:block;font-style:normal;margin-top:3px;font-size:11.5px;font-weight:700;
  color:var(--point);letter-spacing:-.01em}
.hrow .r{margin-left:auto;display:flex;gap:6px;padding-top:2px}
.hp{height:34px;padding:0 11px;border-radius:11px;background:#fff;color:var(--sub);font-size:12px;
  font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;letter-spacing:-.02em;
  box-shadow:0 1px 2px rgba(16,24,40,.05)}
.hp .ic{width:20px;height:20px;border-radius:7px;background:#F2F4F6;display:flex;align-items:center;
  justify-content:center;font-size:11px;flex:0 0 20px}
.hp b{color:var(--ink);font-weight:800;font-size:13px;letter-spacing:-.03em}
.hp.w{background:var(--warn-l);color:var(--warn);box-shadow:none}
.hp.w .ic{background:rgba(217,119,6,.13)}
.hp.w b{color:var(--warn)}
.hp.g2{background:var(--pos-l);color:var(--pos);box-shadow:none}
.hp.g2 .ic{background:rgba(5,150,105,.13)}
.hp.g2 b{color:var(--pos)}

/* 사본 사진의 한 분 카드 */
.who2{display:flex;align-items:center;gap:14px;margin-top:14px}
.who2 .nm2{font-size:20px;font-weight:800;letter-spacing:-.035em}
.who2 .meta{margin-top:4px;font-size:13px;color:var(--sub2);font-weight:600;letter-spacing:-.01em}
.aim{margin-top:15px;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1.45}
.wayl{margin-top:9px;font-size:13.5px;color:var(--sub);line-height:1.6;font-weight:500}
/* 통화 멘트 — 뒤에 숨기지 않고 그대로 폅니다 */
.ment{background:#F7F9FA;border-radius:15px;padding:14px 16px;margin-top:11px}
.ment .mh{display:flex;align-items:center;gap:8px}
.ment .mn{width:24px;height:24px;border-radius:8px;background:var(--point);color:#fff;font-size:11.5px;
  font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 24px}
.ment .mt2{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:-.01em}
.ment .ms{margin-top:8px;font-size:15px;font-weight:700;letter-spacing:-.025em;line-height:1.55;color:var(--ink)}
.ment .md{margin-top:7px;font-size:12.5px;color:var(--sub);font-weight:500;line-height:1.65}
.ment.no{background:var(--neg-l)}.ment.no .mt2{color:var(--neg)}
.ment.no .ms{font-size:13px;font-weight:600;color:#8A2020}

function sayFor(c){

  if(String(c.clm&&(c.clm.s||c.clm)).indexOf('입원')>-1)return '입원';
  if(c.src==='기고객'&&c.idle>=30)return '기고객';
  return '';
}

/* ── 이분께 거리가 몇 가지 — 사본의 「거리」 ─────────────────
   드릴 말씀거리를 셉니다. 지어내지 않고 아는 것만 셉니다.        */
function geori(c){
  var L=[],k=DB.kb[c.id],m=memoOf(c.id),i;
  if(c.ins.due&&c.ins.due.indexOf('D-')===0)L.push('만기 '+c.ins.due);
  if(c.tg&&c.tg[1]==='생일 D-1')L.push('내일 생일');
  if(String(c.clm&&(c.clm.s||c.clm)).indexOf('문의')>-1)L.push('청구 문의');
  if(c.src==='소개')L.push('소개해 주신 분');
  if(k){var g=kbSum(kbRead(k.raw));if(g.gap.length)L.push('빈 통장 '+g.gap.length+'칸');}
  if(typeof MADI!=='undefined')
    for(i=0;i<MADI.length;i++)if(MADI[i].nm===c.nm)L.push('계약 '+MADI[i].mon+'개월 마디');
  if(m.care)L.push(m.care);
  return L;
}
/* 「🤝 AP · 만남 · 오늘 10:00 · 오전 10~11시에 받으심」 */
function metaLine(c){
  var g=STAGE[c.st],p=[g.e+' '+c.st,g.ch];
  if(c.appt)p.push('오늘 '+c.appt);
  if(c.best)p.push(c.best);
  return E(p.join(' · '));
}
/* 「오늘 10:00 에 만납니다 · 이분께 거리가 2가지」 */
function whyLine(c){
  var G=geori(c),a=[];
  if(c.appt)a.push('<b>오늘 '+E(c.appt)+'</b> 에 만납니다');
  else a.push(c.why);
  if(G.length)a.push('이분께 <b>거리가 '+G.length+'가지</b> — '+E(G.join(' · ')));
  return a.join(' · ');
}

/* ══ 달력 ══════════════════════════════════════════════════════
   「다음 분」을 줄로 늘어놓지 않고 <b>날짜 위에</b> 얹습니다.
   약속 · 다시 걸 날 · 생일 · 만기 · 마디가 그날에 점으로 섭니다.
   날짜를 지어내지 않습니다 — 아는 날만 찍습니다.

var KIND={appt:['appt','오늘 약속'],next:['next','다시 걸 날'],bd:['bd','생일'],
          due:['due','만기'],madi:['madi','마디']};
function keyOf(dt){return (dt.getMonth()+1)+'-'+dt.getDate();}
function keyPlus(n){return keyOf(new Date(NOW.getTime()+n*86400000));}
function calEvents(){
  var M={},i,m;
  function add(k,o){ if(!M[k])M[k]=[]; M[k].push(o); }
  for(i=0;i<PPL.length;i++){var c=PPL[i];
    if(c.appt)add(keyOf(NOW),{k:'appt',t:c.appt+' · '+c.nm+'님 '+c.st,id:c.id});
    if(c.nextK)add(c.nextK,{k:'next',t:c.nm+'님 다시 걸 날',id:c.id});
    if(c.tg&&c.tg[1]==='생일 D-1')add(keyPlus(1),{k:'bd',t:c.nm+'님 생일',id:c.id});
    m=/D-([0-9]+)/.exec(c.ins.due||'');
    if(m)add(keyPlus(parseInt(m[1],10)),{k:'due',t:c.nm+'님 만기',id:c.id});
  }
  if(typeof MADI!=='undefined')for(i=0;i<MADI.length;i++){
    var x=MADI[i],mm=/([0-9]+)월[ ]*([0-9]+)일/.exec(x.d||'');
    if(mm)add(parseInt(mm[1],10)+'-'+parseInt(mm[2],10),{k:'madi',t:x.nm+'님 '+x.mon+'개월 마디',id:''});
  }
  return M;
}
/* 한 달치 그림 — mo 는 이번 달을 0 으로 센 값 */
function calGrid(mo,mini){
  var M=calEvents(),i,j,k;
  var base=new Date(NOW.getFullYear(),NOW.getMonth()+(mo||0),1);
  var y=base.getFullYear(),mth=base.getMonth();
  var first=new Date(y,mth,1).getDay();
  var last=new Date(y,mth+1,0).getDate();
  var h='<div class="cal"><div class="cw">';
  for(i=0;i<7;i++)h+='<div class="hd">'+WD[i]+'</div>';
  for(i=0;i<first;i++)h+='<div class="dy off"></div>';
  for(i=1;i<=last;i++){
    var key=(mth+1)+'-'+i, L=M[key]||[], seen={}, dots='';
    for(j=0;j<L.length;j++)if(!seen[L[j].k]){seen[L[j].k]=1;dots+='<i class="'+L[j].k+'"></i>';}
    var isT=(y===NOW.getFullYear()&&mth===NOW.getMonth()&&i===NOW.getDate());
    h+='<div class="dy'+(isT?' td':'')+(S.day===key?' sel':'')+'"'+A('day',key)+'>'+i+
      '<span class="dots">'+dots+'</span></div>';
  }
  h+='</div></div>';
  return h;
}
/* 고른 날에 무엇이 있나 */
function calList(key){

function dplus(n){var d=new Date(NOW.getTime()+n*86400000);return (d.getMonth()+1)+'월 '+d.getDate()+'일';}
/* ── 전화 기록 창 ─────────────────────────────────────────────
   ① 위 — 이 말로 시작하세요 (다섯 마디 + 보낼 말)
   ② 아래 — 어떻게 됐나요 (결과 다섯 개)
   전화를 걸면서 읽고, 끊고 나서 아래를 누르시면 됩니다.        */
function vSheet(){
  var c=byId(S.sheet);if(!c)return '';
  var i,h='<div class="sheet"><div class="bg"'+A('close')+'></div><div class="bx">';
  /* ① 할 말이 먼저 */
  h+='<div class="shead"><span class="l">💬 이 말로 시작하세요</span>'+
   '<span class="rr"><div class="mini b"'+A('cpta',c.id)+'>📋 다섯 마디</div>'+
   '<div class="mini"'+A('cpone',c.id)+'>📋 보낼 말</div></span></div>'+
   '<div class="five">';
  for(i=0;i<TAF.length;i++){var y=TAF[i];
    var l2=(y.n==='③')?(String(c.say).split(String.fromCharCode(10))[2]||y.s):y.s;
    h+='<div class="fv"><span class="fn">'+y.n+'</span><span class="ft">'+E(l2)+'</span></div>';}
  h+='</div>';
  var sk=sayFor(c);
  if(sk)h+='<div class="note">'+SAYS[sk].e+' '+E(sk)+' — 하지 말 것 : '+E(SAYS[sk].avoid.split('.')[0])+'</div>';
  h+='<div class="mini2">문자·카톡으로 보내실 때</div><div class="say">'+E(c.say)+'</div>';
  /* ② 결과는 그 밑에 */
  h+='<div class="sdiv"></div>'+
   '<h3>'+E(c.nm)+'님,<br>어떻게 됐나요?</h3>'+
   '<div class="ps">누르면 바로 쌓이고, <b>다음에 뜰 날짜도 규칙이 정합니다</b></div>'+
   '<div class="g3">';
  for(i=0;i<RESK.length;i++){var r=RES[RESK[i]];
    h+='<div class="'+r.cls+'"'+A('res',c.id+'|'+RESK[i])+'>'+E(r.t)+'</div>';}
  h+='</div><div class="cl"'+A('close')+'>닫기</div></div></div>';
  return h;
}

var ANSWAY={
 '돈이 부담':'보험료를 늘리지 않고 <b>자리를 옮기는 쪽</b>으로 다시 폅니다',
 '필요를 못 느끼심':'빈 통장 하나만 짚어 <b>「여기가 아프면 나올 돈이 없습니다」</b> 로 엽니다',
 '회사가 마음에 안 드심':'같은 보장을 <b>다른 회사로 짜서</b> 비교표만 보여 드립니다',
 '아직 모르겠음':'전화로 <b>「어느 쪽이 제일 걸리셨어요」</b> 한 마디만 여쭙습니다',
 '만기 안내부터':'지금 것이 언제 끊기는지만 말씀드리고 <b>결정은 다음에</b> 받습니다',
 '새로 제안':'만기를 빌미로 <b>전체를 다시</b> 펴 놓습니다',
 '청구부터':'<b>청구를 끝내 드리고</b> 보장 이야기는 그 다음에 꺼냅니다',
 '보장 이야기 먼저':'청구는 짧게 안내하고 <b>비어 있는 자리</b>부터 폅니다',
 '이번 주':'이번 주 안으로 <b>날짜 두 개</b>를 드리고 고르시게 합니다',
 '다음 주':'다음 주로 잡고 <b>같은 구 다른 분</b>과 같은 날로 묶습니다',
 '아직 모름':'날짜를 지금 정하지 않고 <b>「언제가 편하세요」</b> 만 여쭙습니다',
 '예 · 여쭙겠습니다':'증권을 드린 뒤 <b>가족 한 분</b>만 여쭙습니다',
 '오늘은 말고':'오늘은 <b>고마움과 청구 방법</b>까지만 하고 끝냅니다'
};
function asksOf(c){
  var m=memoOf(c.id),a=DB.ask[c.id]||{},k=DB.kb[c.id],L=[],d=DB.rrn[c.id];
  function add(id,q,why,opts,note){ if(a[id]===undefined)L.push({id:id,q:q,why:why,opts:opts,note:note}); }

  /* 막힌 자리 — 오래 멈춰 있으면 왜 멈췄는지부터 */
  if((c.st==='PC'||c.st==='CS')&&c.idle>=7)
    add('block','무엇이 걸리셨을까요?',c.st+'에서 '+c.idle+'일째 조용해서 여쭙습니다',
      ['돈이 부담','필요를 못 느끼심','회사가 마음에 안 드심','아직 모르겠음'],
      '고르시면 다음에 걸 때 그 자리부터 엽니다');

  /* 만기가 닥쳤으면 */
  if(c.ins.due&&c.ins.due.indexOf('D-')===0)
    add('due','만기 안내부터 할까요, 새로 제안할까요?','만기가 '+c.ins.due+' 라서 여쭙습니다',
      ['만기 안내부터','새로 제안'],'이 답이 첫 문장을 바꿉니다');

  /* 청구 문의가 떠 있으면 */
  if(c.clm&&String(c.clm.s||c.clm).indexOf('문의')>-1)
    add('clm','청구부터 도와드릴까요?','청구 문의를 남기고 사흘이 지나서 여쭙습니다',
      ['청구부터','보장 이야기 먼저'],'여기서 신뢰가 갈립니다');

  /* 만나는 자리인데 약속이 없으면 */
  if(isMeet(c.st)&&!c.appt)
    add('when','언제 뵙는 게 좋을까요?','만나야 하는 자리인데 약속이 아직 없어서 여쭙습니다',
      ['이번 주','다음 주','아직 모름'],'고르시면 동선에 같이 세웁니다');

  /* 증권을 드리는 자리면 */
  if(c.st==='증권전달')
    add('ref','이 자리에서 소개를 여쭐까요?','증권을 직접 드리는 자리가 소개를 받는 유일한 자리라서 여쭙습니다',
      ['예 · 여쭙겠습니다','오늘은 말고'],'우편으로 보내면 이 자리가 없어집니다');

  /* 첫 문장에 붙일 말이 아직 없으면 */
  if(!m.hook)
    add('hook','이분이 제일 걱정하시는 게 뭔가요?','첫 문장에 붙일 말이 아직 안 적혀 있어서 여쭙습니다',
      ['아이 교육비','노후 · 은퇴','부모님','병원비','직접 적기'],'적어 두시면 홈 카드 첫 문장이 이 말로 바뀝니다');

  /* 요즘 상황이 안 적혀 있으면 */
  if(!m.care)
    add('care','요즘 이분께 무슨 일이 있나요?','상황 칸이 비어 있어서 여쭙습니다',
      ['결혼 준비','출산 · 육아','이직 · 퇴사','이사 · 내 집','자녀 진학','건강 문제','부모님 일','없음'],
      '상황이 적히면 고객 목록에도 그 말이 뜹니다');

  /* 보장분석을 아직 안 읽었으면 */
  if(!k)
    add('kb','증권을 갖고 계신가요?','보장분석을 아직 안 읽어서 여쭙습니다',
      ['있음 · 넣겠습니다','아직 못 받음','안 갖고 계심'],'넣으시면 빈 통장과 할 말이 바로 나옵니다');

  /* 빈 통장이 있으면 어디부터 여쭐지 */
  if(k){var s=kbSum(kbRead(k.raw));
    if(s.gap.length)add('gap','비어 있는 곳 중 어디부터 여쭐까요?',
      s.gap.join(' · ')+' 이 비어 있어서 여쭙습니다',s.gap.slice(0,4),
      '고르신 통장의 「물을 것」이 상담 자리에 올라옵니다');}

  /* 청약이 가까운데 주민번호가 없으면 */
  if(!d&&(c.st==='CS'||c.st==='계약완료'))
    add('rrn','주민등록번호를 지금 적어 둘까요?','청약 서류를 쓰는 자리라서 여쭙습니다',
      ['지금 적겠습니다','나중에'],'적어도 서버로는 안 갑니다 — 이 기기에만 둡니다');

  /* 상령일이 가까우면 */
  if(d){var b=rrnBirth(d);
    if(b){var ia=insAge(b);
      if(ia.d<=90)add('age','상령일 이야기를 꺼낼까요?','상령일이 '+ia.d+'일 남아서 여쭙습니다',
        ['꺼내겠습니다','말 안 하겠습니다'],'그날이 지나면 같은 보장도 보험료가 올라갑니다');}}

  return L;
}
function askCount(){var n=0,i;for(i=0;i<PPL.length;i++)n+=asksOf(PPL[i]).length;return n;}
function answersOf(c){
  var a=DB.ask[c.id]||{},out=[],ks=Object.keys(a),i;
  for(i=0;i<ks.length;i++)out.push([ks[i],a[ks[i]]]);
  return out;
}
/* 답에 따라 다음에 할 것이 바뀝니다 */
function wayOf(c){
  var a=DB.ask[c.id]||{},ks=['block','due','clm','when','ref'],i;
  for(i=0;i<ks.length;i++)if(a[ks[i]]&&ANSWAY[a[ks[i]]])return ANSWAY[a[ks[i]]];
  return '';
}

/* ── 통화 멘트 ────────────────────────────────────────────────
   전화를 여는 다섯 마디와, 그 분 상황에서 그대로 말할 것.
   단추 뒤에 두지 않고 화면에 펴 둡니다.                        */
/* ── 통화 멘트 ────────────────────────────────────────────────
   c   — 그 분 (③ 용건 한 줄이 그 분 말로 바뀝니다)
   sm  — 접은 판. 홈에서는 문장만, 통화 멘트 화면에서는 왜까지.  */
function taFrame(c,sm){
  var i,h='<div class="c"><div class="sayh">'+
   '<span class="l">📞 전화를 여는 다섯 마디</span>'+
   (sm?'':'<span class="mt" style="margin:0">차례대로 읽으시면 됩니다</span>')+
   '<span class="rr"><div class="mini b"'+A('cpta',c?c.id:'')+'>📋 복사</div>'+
   (sm?('<div class="mini"'+A('s','ment')+'>왜 이렇게</div>'):'')+'</span></div>';
  if(sm){
    h+='<div class="five">';
    for(i=0;i<TAF.length;i++){var y=TAF[i];
      var l2=(y.n==='③'&&c)?(String(c.say).split(String.fromCharCode(10))[2]||y.s):y.s;
      h+='<div class="fv"><span class="fn">'+y.n+'</span><span class="ft">'+E(l2)+'</span></div>';}
    return h+'</div></div>';
  }
  for(i=0;i<TAF.length;i++){var x=TAF[i];
    var line=(x.n==='③'&&c)?(String(c.say).split(String.fromCharCode(10))[2]||x.s):x.s;
    h+='<div class="ment"><div class="mh"><span class="mn">'+x.n+'</span>'+
      '<span class="mt2">'+E(x.t)+'</span></div>'+
      '<div class="ms">'+E(line)+'</div>'+
      '<div class="md">'+E(x.d)+'</div></div>';}
  return h+'</div>';
}
function sayCard(k,sm){
  var g=SAYS[k];if(!g)return '';
  var h='<div class="c"><div class="sayh">'+
   '<span class="l">'+g.e+' '+E(k)+' — 그대로 말할 것</span>'+
   (sm?'':'<span class="mt" style="margin:0">'+E(g.t)+'</span>')+
   '<span class="rr"><div class="mini b"'+A('cpsay',k)+'>📋 복사</div>'+
   (sm?('<div class="mini"'+A('s','ment')+'>더 보기</div>'):'')+'</span></div>'+
   '<div class="say">'+E(g.say)+'</div>';
  if(sm)return h+'<div class="note">하지 말 것 — '+E(g.avoid.split('.')[0])+'</div></div>';
  return h+
   '<div class="ment"><div class="mt2">그래도 어려우시면</div><div class="ms">'+E(g.next)+'</div></div>'+
   '<div class="ment no"><div class="mt2">하지 말 것</div><div class="ms">'+E(g.avoid)+'</div></div>'+
   '<div class="ment no"><div class="mt2">여기서 멈춥니다</div><div class="ms">'+E(g.stop)+'</div></div>'+
   '<div class="ment ok"><div class="mt2">한마디</div><div class="ms">'+E(g.tip)+'</div></div></div>';
}

var ASKN={block:'걸리는 것',due:'만기 쪽',clm:'청구 쪽',when:'뵙는 때',ref:'소개',
          hook:'제일 걱정',care:'요즘 상황',kb:'증권',gap:'먼저 여쭐 곳',rrn:'주민번호',age:'상령일'};


/* 폰 — 여쭙는 카드 */
function askCard(c,one){
  var L=asksOf(c),A2=answersOf(c),i,j,h='';
  if(L.length){
    var n=one?1:L.length;
    h+='<div class="sect">❓ 여쭙겠습니다'+(L.length>1?(' · '+L.length+'개 중 '+n+'개'):'')+'</div>'+
      '<div class="card"><div class="mt" style="margin:0">'+E(c.nm)+'님 상황을 보고 생긴 질문입니다</div>';
    for(i=0;i<L.length&&i<n;i++){var q=L[i];
      h+='<div class="askq"><div class="qq">'+E(q.q)+'</div>'+
        '<div class="qw">왜 묻나 — '+E(q.why)+'</div><div class="chips">';
      for(j=0;j<q.opts.length;j++)
        h+='<div'+A('ans',c.id+'|'+q.id+'|'+q.opts[j])+'>'+E(q.opts[j])+'</div>';
      h+='</div>'+(q.note?('<div class="qn">'+E(q.note)+'</div>'):'')+'</div>';}
    if(one&&L.length>1)h+='<div class="go g"'+A('s','ask')+'>남은 '+(L.length-1)+'개 마저 답하기</div>';
    h+='</div>';
  }
  if(A2.length){
    h+='<div class="sect">✅ 여쭤서 알게 된 것</div><div class="card">';
    for(i=0;i<A2.length;i++)
      h+='<div class="kvp"><span class="k">'+E(ASKN[A2[i][0]]||A2[i][0])+'</span>'+
        '<span class="v">'+E(A2[i][1])+'</span></div>';
    var w=wayOf(c);
    if(w)h+='<div class="note bl">그래서 다음엔 — '+w+'</div>';
    h+='<div class="go g"'+A('ansclr',c.id)+'>다시 묻기</div></div>';
  }
  return h;
}

function copy(t,okmsg){
  function ok(){toast(okmsg);}
  function fb(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';
    document.body.appendChild(a);a.select();
    try{document.execCommand('copy');ok();}catch(e){toast('복사가 막혔습니다');}
    document.body.removeChild(a);}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
}

function fire(el,ev){
  var n=el;
  while(n&&n!==document.body){
    if(n.getAttribute&&n.getAttribute('data-a'))break;
    n=n.parentNode;
  }
  if(!n||n===document.body||!n.getAttribute)return;
  var a=n.getAttribute('data-a'),v=n.getAttribute('data-v');
  if(ACT[a]){if(ev)ev.stopPropagation();ACT[a](v,n);}
}
document.addEventListener('click',function(e){
  var tn=e.target&&e.target.tagName;
  if(tn==='TEXTAREA'||tn==='SELECT'||tn==='INPUT'||tn==='OPTION')return;
  fire(e.target,e);
});

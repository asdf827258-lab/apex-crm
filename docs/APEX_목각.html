<!doctype html>
<html data-theme="light" lang="ko"><head><meta charset="utf-8">
<meta name="color-scheme" content="light"/>
<meta name="viewport" content="width=1280">
<title>APEX 목각 — 맞춰 갈 기준</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
/* ══════════════════════════════════════════════════════════════
   디자인은 목업_PC.html 그대로입니다. 색·글씨·둥근 정도·여백을
   한 군데도 바꾸지 않았습니다. 바꾼 것은 「내용」뿐입니다.
   ══════════════════════════════════════════════════════════════ */
:root{ color-scheme:light;  /* 🌗 흰색 고정 (사장님 말씀 2026-10-03) */
  --ink:#191F28;--sub:#6B7684;--sub2:#8B95A1;--line:#E5E8EB;--bg:#F2F4F6;--card:#fff;
  --point:#1A56DB;--point-l:#EBF3FF;--pos:#059669;--pos-l:#ECFDF5;--warn:#D97706;--warn-l:#FFF7ED;
  --neg:#DC2626;--neg-l:#FEF2F2;--pur:#7C3AED;--pur-l:#F5F3FF;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:'Pretendard','Malgun Gothic',sans-serif;color:var(--ink);background:#fff}

/* ── 앱 껍데기 ── */
.app{width:100%;min-width:1180px;height:100vh;display:flex;background:var(--bg);overflow:hidden}

/* 사이드바 */
.side{width:252px;flex:0 0 252px;background:#fff;border-right:1px solid #EEF1F4;display:flex;flex-direction:column}
.logo{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;flex:0 0 64px}
.logo .m{width:30px;height:30px;border-radius:9px;background:var(--point);color:#fff;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;letter-spacing:-.05em}
.logo .n{font-size:15.5px;font-weight:800;letter-spacing:-.03em}
.logo .n small{display:block;font-size:11px;color:var(--sub2);font-weight:600;letter-spacing:0}
.sfind{margin:0 14px 10px;height:38px;border-radius:11px;background:#F5F7F9;display:flex;align-items:center;
  padding:0 12px;gap:8px;font-size:13.5px;color:var(--sub2);font-weight:500;cursor:pointer}
.sfind .k{margin-left:auto;font-size:11px;background:#fff;border-radius:6px;padding:3px 6px;color:#B0B8C1;font-weight:700}
.snav{flex:1;overflow:auto;padding:0 10px}
.glab{font-size:11px;font-weight:800;color:#AEB6BE;letter-spacing:.02em;padding:14px 10px 6px}
.it{display:flex;align-items:center;gap:9px;height:36px;padding:0 10px;border-radius:10px;font-size:13.5px;
  font-weight:600;color:#4E5968;letter-spacing:-.02em;cursor:pointer}
.it .e{width:17px;text-align:center;font-size:13px}
.it .c{margin-left:auto;font-size:11px;font-weight:800;background:#F2F4F6;color:var(--sub2);border-radius:6px;padding:2px 6px}
.it.on{background:var(--point-l);color:var(--point);font-weight:700}
.it.on .c{background:var(--point);color:#fff}
.more{padding:10px 10px 0;font-size:12.5px;color:var(--sub2);font-weight:700;cursor:pointer}
.sfoot{flex:0 0 62px;border-top:1px solid #F1F3F5;display:flex;align-items:center;gap:9px;padding:0 16px}
.sfoot .av{width:30px;height:30px;border-radius:10px;background:#E8EDF3;color:#5B6572;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.sfoot .t{font-size:13px;font-weight:700;letter-spacing:-.02em}
.sfoot .t small{display:block;font-size:11px;color:var(--sub2);font-weight:600}

/* 본문 */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top{height:64px;flex:0 0 64px;display:flex;align-items:center;padding:0 30px;gap:14px}
.top .d{font-size:14px;color:var(--sub);font-weight:600}
.top .r{margin-left:auto;display:flex;align-items:center;gap:9px}
.pill{height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;gap:7px;padding:0 13px;
  font-size:13px;font-weight:700;color:var(--sub);letter-spacing:-.01em;cursor:pointer}
.pill.b{background:var(--point);color:#fff}
.pill.w{background:var(--warn-l);color:var(--warn)}
.cont{flex:1;overflow:auto;padding:4px 30px 40px}

h2.pt{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.3}
h2.pt span{color:var(--sub2)}
.psub{margin-top:8px;font-size:14.5px;color:var(--sub);letter-spacing:-.01em}
.cols{display:flex;gap:16px;margin-top:20px;align-items:flex-start}
.col{flex:1;min-width:0}
.col.side2{flex:0 0 344px}

.c{background:#fff;border-radius:20px;padding:22px 24px}
.c+.c{margin-top:14px}
.c .lab{font-size:12px;font-weight:800;color:var(--point);letter-spacing:.01em}
.c .ttl{margin-top:8px;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1.4}
.c .ttl small{display:block;font-size:13.5px;color:var(--sub2);font-weight:600;margin-top:6px;letter-spacing:-.01em}
.btn{height:48px;border-radius:13px;background:var(--point);color:#fff;font-size:15.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;letter-spacing:-.02em;margin-top:16px;cursor:pointer}
.btn.g{background:#F2F4F6;color:var(--ink)}
.btn.sm{height:38px;font-size:13.5px;border-radius:10px;margin-top:0;padding:0 16px;display:inline-flex}
.hero{background:linear-gradient(120deg,#1A56DB,#123A96);border-radius:20px;padding:26px 28px;color:#fff;
  display:flex;align-items:center;gap:24px}
.hero .q{font-size:23px;font-weight:800;line-height:1.45;letter-spacing:-.035em}
.hero .s{margin-top:9px;font-size:13.5px;opacity:.8}
.hero .b{margin-left:auto;flex:0 0 auto;height:50px;padding:0 26px;border-radius:13px;background:#fff;color:var(--point);
  font-size:15.5px;font-weight:800;display:flex;align-items:center;cursor:pointer}
.bar{height:7px;border-radius:7px;background:#EDF0F3;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--point);border-radius:7px}

/* 목록 */
.rowl{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #F3F5F7}
.rowl:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:14px;background:var(--point-l);color:var(--point);font-weight:800;font-size:15px;
  display:flex;align-items:center;justify-content:center;flex:0 0 42px}
.av.t{font-size:12.5px;letter-spacing:-.04em}
.av.p{background:var(--pur-l);color:var(--pur)}
.nm{font-size:15.5px;font-weight:700;letter-spacing:-.025em}
.mt{font-size:13px;color:var(--sub2);margin-top:4px;font-weight:500;letter-spacing:-.01em}
.rt{margin-left:auto;display:flex;gap:7px;align-items:center}
.tg{font-size:11.5px;font-weight:800;padding:5px 9px;border-radius:8px;background:var(--warn-l);color:var(--warn)}
.tg.g{background:var(--pos-l);color:var(--pos)}.tg.p{background:var(--pur-l);color:var(--pur)}
.tg.r{background:var(--neg-l);color:var(--neg)}.tg.b{background:var(--point-l);color:var(--point)}
.tg.s{background:#F2F4F6;color:var(--sub)}
.ghostb{height:36px;padding:0 14px;border-radius:10px;background:#F5F7F9;color:#4E5968;font-size:13px;font-weight:700;
  display:flex;align-items:center;cursor:pointer}
.ghostb.b{background:var(--point);color:#fff}
.chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.chips div{height:36px;padding:0 15px;border-radius:11px;background:#fff;font-size:13.5px;font-weight:700;
  color:var(--sub);display:flex;align-items:center;gap:6px;cursor:pointer}
.chips div.on{background:var(--ink);color:#fff}
.chips div b{color:var(--point)}
.chips div.on b{color:#8FB4FF}

/* 큰 숫자 */
.big{font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:1.1}
.big small{font-size:22px;margin-left:3px}
.delta{margin-top:10px;font-size:14px;font-weight:700;color:var(--pos)}
.kpi{display:flex;gap:12px;margin-top:16px}
.kpi div{flex:1;background:#F7F9FA;border-radius:14px;padding:14px 12px;min-width:0}
.kpi .n{font-size:19px;font-weight:800;letter-spacing:-.035em;white-space:nowrap}
.kpi .l{font-size:11.5px;color:var(--sub2);margin-top:4px;font-weight:600;white-space:nowrap}

/* 칸반 */
.kan{display:flex;gap:12px;margin-top:20px;align-items:flex-start}
.kan .k{flex:1;background:#EDEFF2;border-radius:18px;padding:14px 12px;min-width:0}
.kan .kh{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;padding:0 6px 12px;letter-spacing:-.02em}
.kan .kh .cnt{font-size:11.5px;background:#fff;border-radius:7px;padding:2px 7px;color:var(--sub)}
.kc{background:#fff;border-radius:14px;padding:14px 15px;margin-bottom:9px;cursor:pointer}
.kc .n{font-size:14.5px;font-weight:700;letter-spacing:-.025em}
.kc .m{font-size:12.5px;color:var(--sub2);margin-top:5px;font-weight:600}
.kc .f{margin-top:10px;display:flex;align-items:center;gap:6px}
.kc .f .t{font-size:11px;font-weight:800;padding:4px 8px;border-radius:7px;background:var(--point-l);color:var(--point)}
.kc .f .w{margin-left:auto;font-size:12px;color:#B0B8C1;font-weight:700}

/* 도구 타일 */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.tile{background:#fff;border-radius:18px;padding:20px 22px;cursor:pointer}
.tile .e{width:42px;height:42px;border-radius:13px;background:var(--point-l);display:flex;align-items:center;
  justify-content:center;font-size:19px}
.tile .n{margin-top:14px;font-size:16px;font-weight:700;letter-spacing:-.025em}
.tile .d{margin-top:6px;font-size:13px;color:var(--sub2);line-height:1.5;font-weight:500}
.find{height:52px;border-radius:15px;background:#fff;display:flex;align-items:center;padding:0 20px;gap:11px;
  font-size:15.5px;color:var(--sub2);font-weight:500;margin-top:18px;cursor:pointer}

/* 타임라인 */
.tl{margin-top:6px}
.tle{display:flex;gap:14px;padding:13px 0}
.tle .dot{width:9px;height:9px;border-radius:9px;background:var(--point);margin-top:6px;flex:0 0 9px;position:relative}
.tle .dot::after{content:"";position:absolute;left:4px;top:14px;width:1px;height:38px;background:#E5E8EB}
.tle:last-child .dot::after{display:none}
.tle .dot.g{background:#D7DCE2}
.tle .t{font-size:14.5px;font-weight:700;letter-spacing:-.025em}
.tle .s{font-size:12.5px;color:var(--sub2);margin-top:4px;font-weight:500;line-height:1.5}
.note{background:var(--warn-l);border-radius:14px;padding:15px 17px;font-size:13.5px;line-height:1.6;
  color:#8A5A12;font-weight:600;margin-top:14px;letter-spacing:-.01em}
.note b{color:#7A4E0A}
/* .tg 가 .g/.p/.r/.b 를 갖는 것과 같은 방식입니다 — 색만 다릅니다 */
.note.b{background:var(--point-l);color:#12408F}.note.b b{color:var(--point)}
.note.g{background:var(--pos-l);color:#065F46}.note.g b{color:#047857}
.note.s{background:#F7F9FA;color:var(--sub);font-weight:500}.note.s b{color:var(--ink)}

/* 보낼 말 — 보이는 그대로 복사 */
.say{background:#F7F9FA;border-radius:14px;padding:16px 18px;margin-top:14px;font-size:13.5px;line-height:1.85;
  color:#33383D;white-space:pre-wrap;letter-spacing:-.01em}
.sayh{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.sayh .l{font-size:12px;font-weight:800;color:var(--point)}
.sayh .rr{margin-left:auto;display:flex;gap:7px}

/* 한 장 */
.kv{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F3F5F7;font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--sub2);font-weight:600;flex:0 0 96px}
.kv .v{font-weight:700;letter-spacing:-.02em}

/* 맞출 것 */
.tb{background:#fff;border-radius:20px;padding:8px 24px;margin-top:16px}
.tr{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #F3F5F7}
.tr:last-child{border-bottom:0}
.tr .no{flex:0 0 26px;font-size:12px;font-weight:800;color:#B0B8C1;padding-top:2px}
.tr .w{flex:1;min-width:0}
.tr .w b{font-size:14.5px;font-weight:700;letter-spacing:-.025em;display:block}
.tr .w span{display:block;font-size:12.5px;color:var(--sub2);margin-top:4px;font-weight:500;line-height:1.55}
.tr .st{flex:0 0 auto}

/* 상담현황 한 줄 — 홈에 띄우는 것 */
.flowbar{display:flex;gap:6px;align-items:center;margin-top:14px}
.flowbar .st{flex:1;min-width:0;text-align:center;padding:12px 4px;border-radius:14px;background:#F7F9FA;
  color:var(--sub2);cursor:pointer}
.flowbar .st.on{background:var(--point-l);color:var(--point)}
.flowbar .st b{display:block;font-size:20px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.flowbar .st span{display:block;margin-top:5px;font-size:11.5px;font-weight:700;white-space:nowrap}
.flowbar .ar{flex:0 0 auto;color:#C4CBD2;font-size:12px;font-weight:700}

/* 적는 칸 — 카드 안에 들어가는 입력 */
.fl{margin-top:14px}
.fl label{display:block;font-size:12px;font-weight:800;color:var(--sub2);letter-spacing:-.01em;margin-bottom:6px}
.inp,textarea.inp,select.inp{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;
  font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:#fff;letter-spacing:-.02em;outline:none}
.inp:focus{border-color:var(--point);box-shadow:0 0 0 3px var(--point-l)}
textarea.inp{height:auto;min-height:86px;padding:12px 14px;line-height:1.65;font-weight:500;resize:vertical}
select.inp{cursor:pointer}
.f2{display:flex;gap:10px}.f2>div{flex:1;min-width:0}
.savedot{font-size:12px;font-weight:700;color:var(--pos);margin-left:auto}

/* 주민등록번호 — 이 기기에만 */
.lockcard{border:1.5px solid #F3D9A8;background:#FFFDF8}
.rrn{display:flex;align-items:center;gap:10px;margin-top:12px}
.rrn .v{flex:1;font-size:19px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.rrn .v.none{font-size:14px;font-weight:600;color:var(--sub2);letter-spacing:-.01em}

/* 읽은 표 */
.tt{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
.tt th{text-align:left;font-size:11.5px;font-weight:800;color:var(--sub2);padding:0 8px 8px 0;white-space:nowrap}
.tt td{padding:9px 8px 9px 0;border-top:1px solid #F3F5F7;font-weight:600;letter-spacing:-.02em;vertical-align:top}
.tt td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tt td.s{color:var(--sub2);font-weight:500;font-size:12.5px}
.src{font-size:12px;color:var(--sub2);font-weight:500;line-height:1.6;padding:8px 0;border-top:1px solid #F3F5F7}
.src b{color:var(--ink);font-weight:700}
.src i{font-style:normal;color:var(--point);font-weight:700}

/* 결과 시트 — 누르면 바로 쌓입니다 */
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center}
.sheet .bg{position:absolute;inset:0;background:rgba(10,14,20,.34)}
.sheet .bx{position:relative;width:520px;max-width:92vw;background:#fff;border-radius:24px;
  padding:28px 28px 22px;box-shadow:0 22px 60px rgba(0,0,0,.26)}
.sheet h3{font-size:23px;font-weight:800;letter-spacing:-.035em;line-height:1.38}
.sheet .ps{margin-top:10px;font-size:14px;color:var(--sub2);font-weight:600;letter-spacing:-.01em}
.sheet .g3{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap}
.sheet .g3 div{flex:1 1 30%;min-width:0;height:54px;border-radius:14px;background:#F5F7F9;color:var(--sub);
  font-size:15.5px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;
  letter-spacing:-.02em}
.sheet .g3 div.p{background:var(--point);color:#fff}
.sheet .g3 div.n{background:var(--neg-l);color:var(--neg)}
.sheet .cl{margin-top:9px;height:52px;border-radius:14px;background:#F2F4F6;color:var(--sub);font-size:15.5px;
  font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sheet .rule{margin-top:16px;background:#F7F9FA;border-radius:14px;padding:13px 16px;font-size:12.5px;
  color:var(--sub2);font-weight:500;line-height:1.7}
.sheet .rule b{color:var(--ink);font-weight:700}

/* PC ↔ 폰 */
.swch{position:fixed;right:22px;bottom:22px;z-index:65;display:flex;background:#fff;border-radius:15px;
  padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.swch div{height:38px;padding:0 18px;border-radius:11px;font-size:14px;font-weight:800;display:flex;
  align-items:center;cursor:pointer;color:var(--sub);letter-spacing:-.02em}
.swch div.on{background:var(--ink);color:#fff}

/* 알림쪽지 */
#tt{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);background:#191F28;color:#fff;
  font-size:13.5px;font-weight:600;padding:13px 20px;border-radius:13px;opacity:0;pointer-events:none;
  transition:.18s;z-index:60;max-width:560px;letter-spacing:-.01em}
#tt.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body>
<div id="app"></div>
<div id="tt"></div>

<script>
/* ══ 0. 글자 안전하게 ═════════════════════════════════════════ */
function E(s){return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
/* 누를 곳 표시 — 따옴표 사고를 구조적으로 없애려고 onclick 을 안 씁니다 */
function A(act,val){return ' data-a="'+E(act)+'"'+(val!=null?(' data-v="'+E(val)+'"'):'');}
function $(id){return document.getElementById(id);}
var _tk;
function toast(m){var t=$('tt');t.textContent=m;t.className='on';
  clearTimeout(_tk);_tk=setTimeout(function(){t.className='';},2600);}

/* ══ 1. 오늘 날짜 (UTC 아니라 이 기기 시각) ════════════════════ */
var NOW=new Date();
var WD=['일','월','화','수','목','금','토'];
var TODAY=(NOW.getMonth()+1)+'월 '+NOW.getDate()+'일 '+WD[NOW.getDay()]+'요일';

/* ══ 2. 사람 — 모두 가상 인물입니다 ═══════════════════════════ */
var PPL=[
 {id:'p1',nm:'김민수',ini:'김',age:'48세 · 남 · 자영업 · 배우자 1 자녀 2',rg:'강남구',src:'보장분석10DB',
  st:'AP',idle:1,cnt:2,appt:'',tg:['r','만기 D-30'],
  mt:'어제 부재 · 2회차 · 마지막 접촉 14일 전',
  why:'<b>만기가 30일 남았습니다</b> — 이 자리를 놓치면 보장이 끊깁니다',
  aim:'만기 안내로 다시 걸기',
  how:'어제 부재였습니다. 오전 10~11시에 받은 이력이 가장 많습니다.',
  hook:'아이 교육비가 제일 걱정이라고 하셨습니다',
  ins:{n:'4건',fee:'31만',due:'D-30',

function rrnOk(d){

      mm=parseInt(d.substr(2,2),10),dd=parseInt(d.substr(4,2),10),cent;

  var a=ageOf(b),half=new Date(NOW.getFullYear(),b.m-1,b.d);
  half.setMonth(half.getMonth()+6);

  if(NOW>=half){ /* 올해 생일+6개월을 이미 지났습니다 */
    a=a+1; up=new Date(NOW.getFullYear()+1,b.m-1,b.d); up.setMonth(up.getMonth()+6);

  else{ var h0=new Date(NOW.getFullYear()-1,b.m-1,b.d); h0.setMonth(h0.getMonth()+6);
        if(NOW>=h0){a=a+1;up=half;} else {up=h0;} }

    if(!w){skip.push([i+1,t,'금액은 읽었는데 어느 통장인지 모르겠습니다']);continue;}
    /* 담보 이름 = 금액·만기 글자를 뺀 앞쪽 */
    var nm=t.replace(/[0-9][0-9,\.]*\s*(억|만원|만|원)/g,'').replace(/[0-9]{2,3}\s*세\s*(만기|만료|까지)?/g,'')
            .replace(/[0-9]{1,2}\s*년\s*(납|만기)/g,'').replace(/[|\t]+/g,' ').replace(/\s{2,}/g,' ').trim();
    if(nm.length>22)nm=nm.slice(0,22);
    out.push({ln:i+1,raw:t,nm:nm||w,w:w,hit:hit,won:won,term:termOf(t),pay:payOf(t)});
  }
  return {rows:out,skip:skip};
}
/* 갈래별 합계와 빈 자리 */
function kbSum(r){
  var m={},i,gap=[],have=[];
  for(i=0;i<r.rows.length;i++){var x=r.rows[i];m[x.w]=(m[x.w]||0)+x.won;}
  for(i=0;i<WALL.length;i++){
    if(m[WALL[i]]!==undefined)have.push([WALL[i],m[WALL[i]]]);
    else gap.push(WALL[i]);
  }
  return {m:m,have:have,gap:gap};
}
/* 읽은 것으로 관리 멘트를 만듭니다 — 근거가 있는 말만 씁니다 */
function kbTalk(nm,r,s){
  var L=[];
  L.push(nm+'님 증권을 읽어 보니 '+r.rows.length+'개 담보가 들어 있습니다.');
  if(s.have.length){
    var t=[],i;
    for(i=0;i<s.have.length;i++)t.push(s.have[i][0]+' '+manStr(s.have[i][1]));
    L.push('채워져 있는 곳 — '+t.join(' · ')+'.');
  }
  if(s.gap.length){
    L.push('비어 있는 곳 — '+s.gap.join(' · ')+'. 여기가 아프면 나올 돈이 한 곳도 없습니다.');
    L.push('보험료를 더 내시라는 말씀이 아니라, 지금 내고 계신 안에서 자리를 옮기는 이야기부터 드리겠습니다.');
  }else{
    L.push('여덟 통장이 다 채워져 있습니다. 금액이 지금 상황에 맞는지만 같이 보시죠.');
  }
  L.push('');
  L.push('비율·한도·기간 같은 숫자는 그때그때 바뀌니, 정확한 값은 같이 보면서 확인해 드리겠습니다.');
  return L.join('\n');
}

/* ══ 9-2. 접근에서 계약까지 — 열 단계를 실시간으로 ════════════

function stageCard(st,c){
  var g=STAGE[st];if(!g)return '';
  var h='<div class="c"><div class="lab">'+g.e+' '+E(st)+' · '+E(g.ch)+'로 합니다</div>'+
   '<div class="ttl">'+g.aim+'<small>'+E(g.way)+'</small></div>'+
   '<div class="note b" style="margin-top:14px">판단 — <b>'+E(g.q)+'</b></div>'+
   '<div class="note s">앱이 이미 아는 것 — '+E(g.know)+'</div>';
  if(g.good)h+='<div class="note g">'+g.good+'</div>';
  if(g.warn)h+='<div class="note">끊긴 데 — '+g.warn+'</div>';
  h+='<div class="chips" style="margin-top:14px">';
  for(var i=0;i<g.tools.length;i++)
    h+='<div style="background:#F7F9FA"'+A('say','「'+g.tools[i]+'」 를 엽니다')+'>'+E(g.tools[i])+'</div>';
  h+='</div>';
  var nx=GO[st];
  h+='<div class="note s" style="margin-top:12px">'+
   (nx?('여기서 잘되면 다음은 <b>'+E(nx)+'</b> 입니다.'):'여기가 마지막 자리입니다 — 다음이 없습니다.')+
   (c?(' 지금 '+E(c.nm)+'님이 이 자리에 계십니다.'):'')+'</div></div>';
  return h;
}

  h+='<div class="c"><div class="lab">소개가 끊기는 자리</div>'+

/* ══ 10. 상담현황 ═════════════════════════════════════════════ */
function vCon(){
  var i,j,tot=0,stuck=0;

function keep(id){var t=$('ta_'+id);if(t){var s=S.madi[id]||(S.madi[id]={});s.text=t.value;}}
function copy(t,okmsg){
  function ok(){toast(okmsg);}
  function fb(){var a=document.createElement('textarea');a.value=t;
    a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();
    try{document.execCommand('copy');ok();}catch(e){toast('복사가 막혔습니다');}
    document.body.removeChild(a);}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);
  else fb();
}

   else{s.edit=true;draw();var t=$('ta_'+v);if(t)t.focus();}},
 snt:function(v){var s=S.madi[v]||(S.madi[v]={});s.sent=!s.sent;draw();
   toast(s.sent?'보냈다고 적었습니다':'표시를 지웠습니다');},
 cp:function(v){var s=S.madi[v]||(S.madi[v]={});
   if(s.edit)keep(v);
   var m=madiById(v);if(!m)return;
   copy(s.text!=null?s.text:m.say,'복사했습니다 — 보이는 그대로 들어갔습니다');},

 /* ── 주민등록번호 ── */
 rrnsave:function(v){
   var el=$('rrn_in');if(!el)return;
   var d=rrnDigits(el.value);
   if(d.length!==13){toast('열세 자리를 다 적어 주십시오 — 지금 '+d.length+'자리입니다');return;}
   if(!rrnOk(d)){toast('맞지 않는 번호입니다. 한 자리 잘못 치신 것 같습니다');return;}
   if(!rrnBirth(d)){toast('앞자리를 못 읽었습니다. 생년월일을 확인해 주십시오');return;}
   DB.rrn[v]=d;save();S.show='';draw();
   var c=byId(v);toast((c?c.nm+'님 ':'')+'번호를 이 기기에만 저장했습니다 — 서버로 안 갑니다');},
 rrnshow:function(v){S.show=(S.show===v?'':v);draw();
   if(S.show===v)toast('펴 두었습니다 — 다 쓰시면 「가리기」를 눌러 주십시오');},
 rrncopy:function(v){var d=DB.rrn[v];if(!d)return;
   copy(rrnFull(d),'복사했습니다 — 붙여 넣으신 뒤에는 그 칸도 비워 주십시오');},
 rrndel:function(v){if(!DB.rrn[v])return;
   delete DB.rrn[v];save();S.show='';draw();toast('지웠습니다. 이 기기에서 완전히 없어졌습니다');},

 /* ── 적어 두기 ── */
 mosave:function(v){
   var m=memoOf(v),g=function(id){var e=$(id);return e?e.value:'';};
   m.care=g('mo_care');m.fam=g('mo_fam');m.hook=g('mo_hook');
   m.day=g('mo_day');m.todo=g('mo_do');m.memo=g('mo_memo');
   m.at=(NOW.getMonth()+1)+'/'+NOW.getDate();
   save();draw();
   toast('적어 두었습니다 — 홈 카드의 첫 문장이 이 말로 바뀝니다');},
 moclear:function(v){DB.memo[v]={};save();draw();toast('비웠습니다');},

 /* ── 보장분석 ── */
 kbgo:function(v){S.cur=v;S.nav='kb';draw();},
 kbdemo:function(v){var e=$('kb_in');
   if(e){e.value=KBDEMO;e.focus();toast('예시를 넣었습니다 — 「읽어서 정리하기」를 눌러 보십시오');}
   else{DB.kb[v]={raw:KBDEMO,at:(NOW.getMonth()+1)+'/'+NOW.getDate()};save();S.cur=v;S.nav='kb';draw();}},
 kbread:function(v){
   var e=$('kb_in');if(!e){S.cur=v;S.nav='kb';draw();return;}
   var raw=e.value;
   if(!raw.trim()){toast('붙여 넣으신 글이 없습니다');return;}
   var r=kbRead(raw);
   if(!r.rows.length){toast('담보를 한 줄도 못 읽었습니다 — 담보명과 금액이 같은 줄에 있어야 합니다');return;}
   DB.kb[v]={raw:raw,at:(NOW.getMonth()+1)+'/'+NOW.getDate()};save();draw();
   toast('담보 '+r.rows.length+'개를 읽었습니다'+(r.skip.length?(' · 못 읽은 줄 '+r.skip.length+'개는 아래에 적어 뒀습니다'):''));},
 kbdel:function(v){delete DB.kb[v];if(DB.home===v)DB.home='';save();draw();toast('읽은 것을 지웠습니다');},
 kbhome:function(v){
   if(DB.home===v){DB.home='';save();draw();toast('홈에서 내렸습니다');return;}
   DB.home=v;save();draw();
   var c=byId(v);toast((c?c.nm+'님 ':'')+'보장분석을 홈에 띄웠습니다 — 홈 맨 위에서 관리하십시오');},
 kbcp:function(v){var k=DB.kb[v],c=byId(v);if(!k||!c)return;
   var r=kbRead(k.raw);copy(kbTalk(c.nm,r,kbSum(r)),'관리 멘트를 복사했습니다');}
};
function fire(el,ev){
  var n=el;
  while(n&&n!==document.body){
    if(n.getAttribute&&n.getAttribute('data-a'))break;
    n=n.parentNode;
  }
  if(!n||n===document.body||!n.getAttribute)return;
  var a=n.getAttribute('data-a'),v=n.getAttribute('data-v');
  if(ACT[a]){if(ev)ev.stopPropagation();ACT[a](v,n);}
}
document.addEventListener('click',function(e){
  var tn=e.target&&e.target.tagName;
  if(tn==='TEXTAREA'||tn==='SELECT'||tn==='INPUT'||tn==='OPTION')return;
  fire(e.target,e);
});
/* 주소 뒤에 ?v=rt 처럼 붙이면 그 화면으로 바로 열립니다 */
(function(){var q=/[?&]v=([a-z0-9]+)/i.exec(location.search);if(q)S.nav=q[1];})();
draw();
</script>

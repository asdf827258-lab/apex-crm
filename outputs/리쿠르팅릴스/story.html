<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>막막이 릴스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* 이야기형 리쿠르팅 릴스 — 신입 설계사 「막막이」 가 영업의 다섯 고비에서 막히고, 앱으로 넘긴다.
   1080×1920 · 30fps. 시간은 전부 render(t) 하나가 정한다(CSS 애니메이션 없음 — 프레임마다 같은 그림).
   고비마다 붙인 해법은 앱에 실제로 있는 메뉴 이름이다(app/index.html 의 TABS). 지어낸 기능을 넣지 않는다. */
:root{--bg:#0B0F17;--ink:#fff;--blue:#2F6BFF;--sky:#5AC8FA;--red:#FF3B4E;--gold:#FFC83D;--green:#2BD67B;--sub:rgba(255,255,255,.62)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:Pretendard,'WenQuanYi Zen Hei',sans-serif;color:var(--ink);letter-spacing:-.04em;word-break:keep-all}
#stage{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:-200px;background:
  radial-gradient(900px 900px at 20% 15%,rgba(47,107,255,.35),transparent 60%),
  radial-gradient(800px 800px at 85% 80%,rgba(90,200,250,.22),transparent 60%),var(--bg)}
#bg.red{background:radial-gradient(900px 900px at 50% 30%,rgba(255,59,78,.30),transparent 60%),radial-gradient(700px 700px at 80% 90%,rgba(120,60,200,.18),transparent 60%),#0A0A12}
#grid{position:absolute;inset:0;opacity:.08;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:90px 90px}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
.scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:320px 70px 420px;text-align:center}
.scene.mid{justify-content:center}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:320px 70px 0}
.el{display:block;will-change:transform,opacity;white-space:nowrap}
.big{font-weight:900;line-height:1.04}
.mdl{font-weight:800;line-height:1.15}
.sub{font-weight:600;color:var(--sub)}
.hl{color:var(--blue);text-shadow:0 0 60px rgba(47,107,255,.6)}
.hr{color:var(--red);text-shadow:0 0 50px rgba(255,59,78,.55)}
.hgr{color:var(--green);text-shadow:0 0 50px rgba(43,214,123,.45)}
.box{display:inline-block;background:var(--ink);color:var(--bg);padding:0 .18em;border-radius:.12em}
.boxr{display:inline-block;background:var(--red);color:#fff;padding:0 .18em;border-radius:.12em}
.chipk{display:inline-block;font-size:44px;font-weight:900;padding:12px 30px;border-radius:999px;background:rgba(255,59,78,.18);border:3px solid var(--red);color:#FF8A95}
.chipk.ok{background:rgba(43,214,123,.15);border-color:var(--green);color:#7CF0B0}
.bub{position:relative;display:inline-block;background:#fff;color:#191F28;font-weight:900;font-size:84px;padding:34px 54px;border-radius:56px;margin-top:40px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.bub:after{content:'';position:absolute;left:50%;bottom:-38px;margin-left:-30px;border:30px solid transparent;border-top:40px solid #fff;border-bottom:0}
.mono{font-size:52px;font-weight:700;color:rgba(255,255,255,.7);margin-top:46px}
.core{font-size:92px;font-weight:900;line-height:1.1;margin-top:34px}
.tags{margin-top:26px;font-size:36px;font-weight:800;color:var(--sky);letter-spacing:-.02em}
.chip{display:inline-block;margin:12px 10px;padding:20px 36px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);font-size:54px;font-weight:800}
.chip b{color:var(--green)}
.fine{position:absolute;left:70px;right:70px;bottom:430px;font-size:26px;line-height:1.5;color:rgba(255,255,255,.45);font-weight:500;text-align:center;white-space:normal}
/* 위 띠 */
#bar{position:absolute;left:60px;right:60px;top:90px;height:8px;border-radius:8px;background:rgba(255,255,255,.18)}
#bar i{display:block;height:100%;width:0;border-radius:8px;background:#fff}
#brand{position:absolute;left:0;right:0;top:130px;text-align:center;font-size:34px;font-weight:800;letter-spacing:.18em;color:rgba(255,255,255,.55)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#grain{position:absolute;inset:0;opacity:.06;pointer-events:none;mix-blend-mode:overlay}
/* 앱 화면 카드(예시) */
.card2{width:900px;border-radius:48px;background:#F4F6FA;color:#191F28;padding:40px 40px 34px;text-align:left;white-space:normal;letter-spacing:-.03em;box-shadow:0 50px 120px rgba(0,0,0,.55);position:relative}
.card2 .tag{position:absolute;top:30px;right:34px;font-size:22px;font-weight:800;color:#8B95A1;background:#E8EBF0;padding:6px 14px;border-radius:10px}
.card2 h4{font-size:44px;font-weight:900}
.card2 .cap{font-size:27px;color:#6B7684;font-weight:600;margin:6px 0 22px}
.in{background:#fff;border-radius:28px;padding:22px 26px;margin-top:16px;box-shadow:0 4px 18px rgba(25,31,40,.06)}
.r{display:flex;align-items:center;gap:16px;font-size:31px;font-weight:700;padding:10px 0}
.r .k{width:46px;height:46px;border-radius:14px;background:#1A56DB;color:#fff;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.r small{color:#8B95A1;font-weight:600;font-size:25px;margin-left:auto}
.ck{width:46px;height:46px;border-radius:14px;border:4px solid #C9D0DA;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px;color:transparent}
.ck.on{background:#1A56DB;border-color:#1A56DB;color:#fff}
.tr{flex:1;height:26px;border-radius:13px;background:#E8EBF0;position:relative;overflow:hidden}
.tr b{position:absolute;left:0;top:0;bottom:0;border-radius:13px;width:0}
.tabs span{display:inline-block;font-size:26px;font-weight:800;padding:10px 20px;border-radius:999px;background:#E8EBF0;color:#6B7684;margin-right:8px}
.tabs span.on{background:#191F28;color:#fff}
.sk{height:22px;border-radius:11px;background:#E8EBF0;margin:12px 0}
.lb{display:inline-block;max-width:80%;padding:18px 26px;border-radius:28px;font-size:30px;font-weight:800;margin:8px 0}
.lb.l{background:#E8EBF0;border-top-left-radius:8px}
.lb.rr{background:#1A56DB;color:#fff;border-top-right-radius:8px}
.doc{font-size:28px;line-height:1.75;font-weight:600;color:#333D4B}
.mk{position:relative;display:inline}
.mk i{position:absolute;left:-4px;right:-4px;top:12%;bottom:4%;background:#FFE14D;border-radius:6px;z-index:0;transform-origin:0 50%;transform:scaleX(0)}
.mk span{position:relative;z-index:1}
.pdf{display:inline-flex;align-items:center;gap:14px;background:#fff;border:3px dashed #C9D0DA;border-radius:22px;padding:18px 26px;font-size:30px;font-weight:800}
.btn{display:block;text-align:center;background:#1A56DB;color:#fff;border-radius:22px;padding:20px;font-size:31px;font-weight:900;margin-top:18px}
/* 캐릭터 */
#chr{position:absolute;left:0;top:0;width:400px;height:500px;transform-origin:0 0;overflow:visible}
#chr svg{overflow:visible}
.fx{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="grid"></div>
  <div id="cam">
    <div class="scene" id="s0" data-t="0,3"></div>

    <div class="scene" id="s1" data-t="3,5">
      <span class="el mdl" style="font-size:86px" data-a="up" data-in="3.0">설계사가 그만두는</span>

      <span class="el mdl" style="font-size:110px" data-a="up" data-in="31.0">약속 <span class="hr">안</span> 한다.</span>

      <span class="el big" style="font-size:168px" data-a="slam" data-in="32.0">약속한다.</span>
    </div>

    <div class="scene" id="s9" data-t="33.5,37.5">
      <span class="el mdl" style="font-size:84px" data-a="up" data-in="33.5">댓글에</span>
      <span class="el big" style="font-size:180px;margin:24px 0 34px" data-a="stamp" data-rot="-3" data-in="34.0"><span class="box">「무기」</span></span>
      <span class="el mdl" style="font-size:76px" data-a="up" data-in="34.75">남기면 DM 드려요 📩</span>
      <span class="el" style="font-size:44px;font-weight:900;letter-spacing:.2em;margin-top:40px;color:rgba(255,255,255,.8)" data-a="up" data-in="35.25">APEX · YUN PRO</span>
      <div class="fine el" data-a="up" data-in="35.5">보험설계사로 일하려면 자격시험 합격과 등록 절차가 필요합니다.<br>수입은 활동과 성과에 따라 사람마다 다릅니다.</div>
    </div>

    <!-- 막막이 — 직접 그린 SVG(남의 캐릭터를 쓰지 않는다). 발끝이 (200,490). -->

        <path d="M172 287 L192 350 M228 287 L208 350" stroke="#1E46C7" stroke-width="6"/>
        <rect x="214" y="372" width="70" height="30" rx="7" fill="#fff"/>
        <text id="badge" x="249" y="394" text-anchor="middle" font-size="19" font-weight="900" fill="#191F28" font-family="Pretendard">막막이</text>

<script>
// ───────── 타깃별 후킹(0~3초) — 글은 위, 막막이는 아래 ─────────
var VARIANTS = {
  A:{bg:'red',mood:'sad',lines:[
    '<span class="el big" style="font-size:170px" data-a="slam" data-in="0.05">월급 <span class="hr">빼고</span></span>',
    '<span class="el big" style="font-size:170px" data-a="slam" data-in="0.6">다 오른다.</span>',
    '<span class="el sub" style="font-size:64px;margin-top:40px" data-a="type" data-in="1.3" data-dur="0.9">언제까지 버틸 건데?</span>']},
  B:{bg:'',mood:'tired',lines:[
    '<span class="el mdl" style="font-size:110px" data-a="up" data-in="0.05">아이 하원 시간,</span>',
    '<span class="el big" style="font-size:150px;margin-top:10px" data-a="slam" data-in="0.6"><span class="hl">내가</span> 정하는</span>',
    '<span class="el big" style="font-size:150px" data-a="slam" data-in="1.1">직업.</span>',
    '<span class="el sub" style="font-size:64px;margin-top:40px" data-a="type" data-in="1.7" data-dur="0.7">…있긴 할까?</span>']},
  C:{bg:'red',mood:'panic',lines:[
    '<span class="el mdl" style="font-size:120px" data-a="up" data-in="0.05">아직도</span>',
    '<span class="el big" style="font-size:150px" data-a="slam" data-in="0.55"><span class="boxr">감</span>으로 영업해?</span>',
    '<span class="el sub" style="font-size:60px;margin-top:40px" data-a="type" data-in="1.3" data-dur="0.9">엑셀 · 메모장 · 기억력으로?</span>']}
};
var VK=(location.hash||'#A').slice(1); var V=VARIANTS[VK]||VARIANTS.A;
document.getElementById('s0').innerHTML=V.lines.join('');

// ───────── 다섯 고비 — 고민(1.75초) → 해법(2.75초) ─────────
// 해법 꼬리표(tags)는 앱 메뉴 이름 그대로. 화면 카드는 「예시 화면」 — 금액은 적지 않고, 이름은 홍길동 · 김○○ 로 가린다.
var P0=5, PL=4.5, PA=1.75;

var TOTAL=37.5, BEAT=0.5;
function clamp(x,a,b){return x<a?a:x>b?b:x;}
function eo(x){return 1-Math.pow(1-x,3);}
function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
function back(x){var c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
function rnd(n){var x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x);}

var scenes=[].slice.call(document.querySelectorAll('.scene')).map(function(s){
  var r=s.getAttribute('data-t').split(',').map(Number);
  return {el:s,a:r[0],b:r[1],items:[].slice.call(s.querySelectorAll('.el')),
    draws:[].slice.call(s.querySelectorAll('.draw')),grows:[].slice.call(s.querySelectorAll('.grow')),
    marks:[].slice.call(s.querySelectorAll('.mk i')),checks:[].slice.call(s.querySelectorAll('.ck[data-on]'))};
});
[].slice.call(document.querySelectorAll('[data-a="type"]')).forEach(function(e){e._txt=e.textContent;});

function anim(e,t){
  var a=e.getAttribute('data-a'), t0=+e.getAttribute('data-in'), d=t-t0, out=e.getAttribute('data-out');
  if(d<0){e.style.opacity=0;e.style.transform='none';return;}
  var tf='',op=1;
  if(a==='slam'){var p=clamp(d/0.16,0,1);op=p;tf='scale('+(2.3-1.3*eo(p))+')';
    if(d>0.16&&d<0.4){var k=(0.4-d)/0.24;tf+=' translate('+((rnd(t*97)-.5)*22*k)+'px,'+((rnd(t*31)-.5)*22*k)+'px)';}}
  else if(a==='stamp'){var p2=clamp(d/0.18,0,1),rt=e.hasAttribute('data-rot')?+e.getAttribute('data-rot'):-12;tf='rotate('+((rt+2)*eo(p2)-2)+'deg) scale('+(3-2*eo(p2))+')';op=p2;}
  else if(a==='up'){var p3=clamp(d/0.28,0,1);tf='translateY('+(70*(1-eo(p3)))+'px)';op=p3;}
  else if(a==='drop'){var p5=clamp(d/0.32,0,1);tf='translateY('+(-160*(1-eo(p5)))+'px) rotate('+(-3*(1-eo(p5)))+'deg)';op=clamp(p5*1.6,0,1);}
  else if(a==='pop'){var p4=clamp(d/0.3,0,1);tf='scale('+(0.4+0.6*back(p4))+')';op=clamp(p4*2,0,1);}
  else if(a==='type'){var dur=+e.getAttribute('data-dur')||0.8;var n=Math.floor(clamp(d/dur,0,1)*e._txt.length);
    e.textContent=e._txt.slice(0,n)+(n<e._txt.length&&Math.floor(t*6)%2===0?'▌':'');}
  if(out!==null){var o=t-(+out);if(o>=0){op*=clamp(1-o/0.12,0,1);tf+=' translateY('+(-60*clamp(o/0.12,0,1))+'px)';}}
  e.style.opacity=op;e.style.transform=tf||'none';
}

// ───────── 막막이 — 자리·크기·표정을 시간표로 ─────────
// {t, x(발 가운데), y(발끝), s, m(표정), arm:[왼,오른 각도]}
var ARMS={sad:[14,-14],panic:[158,-158],blank:[30,-30],tired:[6,-6],happy:[140,-140],point:[18,-132],proud:[22,-150],wave:[18,-150]};
var CH=[{t:0,x:540,y:1520,s:0.95,m:V.mood},{t:3,x:540,y:1500,s:0.95,m:'tired'},{t:4.1,x:540,y:1500,s:0.95,m:'sad'}];
PAINS.forEach(function(p){
  CH.push({t:p.a,x:540,y:1500,s:1.0,m:p.mood});
  CH.push({t:p.b,x:540,y:1600,s:0.38,m:'happy'});      // 해법 때는 글 아래로 — 카드·핵심 줄을 가리지 않게
  CH.push({t:p.b+0.6,x:540,y:1600,s:0.38,m:'point'});
});
CH.push({t:27.5,x:540,y:1520,s:0.9,m:'proud'});
CH.push({t:30.5,x:540,y:2300,s:0.9,m:'proud'});   // 「수입은…」 동안은 화면 밖으로
CH.push({t:33.5,x:540,y:1400,s:0.5,m:'wave'});
var chr=document.getElementById('chr'), cAll=document.getElementById('cAll'), cHead=document.getElementById('cHead');
var armL=document.getElementById('armL'), armR=document.getElementById('armR'), badge=document.getElementById('badge');
var cloud=document.getElementById('cloud'), rain=document.getElementById('rain'), spark=document.getElementById('spark');
var fxs=[].slice.call(document.querySelectorAll('#chr .fx[class*="f-"]'));
var MOVE=0.32;
function charAt(t){
  var i=0; while(i+1<CH.length&&CH[i+1].t<=t)i++;
  var k=CH[i], prev=CH[Math.max(0,i-1)], q=i===0?1:eio(clamp((t-k.t)/MOVE,0,1));
  var x=prev.x+(k.x-prev.x)*q, y=prev.y+(k.y-prev.y)*q, s=prev.s+(k.s-prev.s)*q, m=k.m, d=t-k.t;
  var bob=0, sx=1, sy=1, shx=0, rot=0, hr=0;
  var ph=(t%BEAT)/BEAT;
  if(m==='sad'){bob=Math.sin(t*3)*4;hr=Math.sin(t*2)*3;}
  else if(m==='panic'||m==='blank'){shx=(rnd(Math.floor(t*30)*1.7)-.5)*(m==='panic'?14:6);hr=m==='blank'?Math.sin(t*5)*6:0;}
  else if(m==='tired'){rot=Math.sin(t*2.2)*3;hr=-8+Math.sin(t*2.2)*4;bob=Math.sin(t*2.2)*3;}
  else if(m==='happy'){var j=Math.abs(Math.sin(Math.PI*d/0.3));bob=-j*60;sy=1+0.08*(1-j);sx=1-0.06*(1-j);}
  else {bob=-Math.exp(-ph*5)*10;sy=1+0.03*Math.exp(-ph*5);}
  // 표정이 바뀌는 순간 찌그러졌다 편다
  if(d>=0&&d<0.18){var sq=Math.sin(Math.PI*d/0.18);sy*=1-0.12*sq;sx*=1+0.1*sq;}
  chr.style.transform='translate('+(x-200*s+shx)+'px,'+(y-490*s+bob)+'px) scale('+s+')';
  cAll.setAttribute('transform','rotate('+rot+' 200 490) translate(200 490) scale('+sx+' '+sy+') translate(-200 -490)');
  cHead.setAttribute('transform','rotate('+hr+' 200 300)');
  var A=ARMS[m]||[10,-10], w=(m==='wave')?Math.sin(t*12)*22:(m==='happy'?Math.sin(t*14)*10:(m==='panic'?Math.sin(t*20)*8:0));
  armL.setAttribute('transform','translate(132,322) rotate('+(A[0]+(m==='happy'?-w:0))+')');
  armR.setAttribute('transform','translate(268,322) rotate('+(A[1]+w)+')');
  fxs.forEach(function(g){g.style.display=(' '+g.getAttribute('class')+' ').indexOf(' f-'+m+' ')>=0?'inline':'none';});
  var gloomy=(m==='sad'||m==='panic'||m==='blank'||m==='tired')&&t>=3;
  cloud.style.display=gloomy?'inline':'none';
  if(gloomy){var h='';for(var r=0;r<7;r++){var ry=((t*700+r*53)%110);h+='<path d="M'+(125+r*25)+' '+(60+ry)+' l-6 18"/>';}rain.innerHTML=h;}
  cloud.setAttribute('transform','translate(0 '+(-150+Math.sin(t*2)*6)+')');
  spark.style.display=(m==='happy'||m==='proud'||m==='point'||m==='wave')?'inline':'none';
  spark.setAttribute('opacity',0.6+0.4*Math.sin(t*9));
  var tears=document.getElementById('tears');tears.setAttribute('transform','translate(0 '+((t*90)%30)+')');
  if(m==='panic'){document.getElementById('pupL').setAttribute('cx',150+Math.sin(t*25)*9);document.getElementById('pupR').setAttribute('cx',250+Math.sin(t*25)*9);}
  badge.textContent=t>=27.75?'척척이':'막막이';
  chr.style.opacity=t>=30.5&&t<33.5?0:1;
}

var cam=document.getElementById('cam'),flash=document.getElementById('flash'),bg=document.getElementById('bg'),bar=document.querySelector('#bar i');
var gctx=document.getElementById('grain').getContext('2d'),gimg=gctx.createImageData(540,960);
var IMPACTS=[];
scenes.forEach(function(s){s.items.forEach(function(e){var a=e.getAttribute('data-a');if(a==='slam'||a==='stamp'){var v=+e.getAttribute('data-in');if(IMPACTS.indexOf(v)<0)IMPACTS.push(v);}});});
var CUTS=[3,5].concat(PAINS.map(function(p){return p.a;}).slice(1)).concat([27.5,30.5,33.5]);
var SOLS=PAINS.map(function(p){return p.b;});
var FLASHES=CUTS.concat(SOLS,[32]);

function render(t){
  bar.style.width=(100*t/TOTAL)+'%';
  var red=(t<3&&V.bg==='red')||(t>=3&&t<5)||(t>=30.5&&t<32);
  PAINS.forEach(function(p){if(t>=p.a&&t<p.b)red=true;});
  bg.classList.toggle('red',!!red);
  bg.style.transform='translate('+(Math.sin(t*0.6)*60)+'px,'+(Math.cos(t*0.45)*60)+'px)';
  scenes.forEach(function(s){
    var on=t>=s.a&&t<s.b; s.el.style.display=on?'flex':'none'; if(!on)return;
    var w=clamp((t-s.a)/0.12,0,1);
    s.el.style.transform=s.a>0?'translateX('+(160*(1-eo(w)))+'px)':'none';
    s.el.style.filter=s.a>0&&w<1?'blur('+(14*(1-w))+'px)':'none';
    s.items.forEach(function(e){anim(e,t);});
    s.draws.forEach(function(e){e.setAttribute('stroke-dashoffset',100-100*eo(clamp((t-(+e.getAttribute('data-in')))/0.8,0,1)));});
    s.grows.forEach(function(e){e.style.width=(+e.getAttribute('data-w')*eo(clamp((t-(+e.getAttribute('data-in')))/0.5,0,1)))+'%';});
    s.marks.forEach(function(e){e.style.transform='scaleX('+eo(clamp((t-(+e.getAttribute('data-in')))/0.35,0,1))+')';});
    s.checks.forEach(function(e){e.classList.toggle('on',t>=+e.getAttribute('data-on'));});
  });
  charAt(t);
  var ph=(t%BEAT)/BEAT,pulse=0.012*Math.exp(-ph*6),punch=0;
  IMPACTS.forEach(function(i){var d=t-i;if(d>=0&&d<0.35)punch=Math.max(punch,0.05*Math.exp(-d*12));});
  if(t>=31.75&&t<32)pulse=0;
  cam.style.transform='scale('+(1+pulse+punch)+')';
  var f=0;FLASHES.forEach(function(c){var d=t-c;if(d>=0&&d<0.15)f=Math.max(f,0.55*(1-d/0.15));});
  flash.style.opacity=f;
  var seed=Math.floor(t*30),d8=gimg.data;
  for(var i=0;i<d8.length;i+=4){var v=rnd(i*0.37+seed*7.1)*255;d8[i]=d8[i+1]=d8[i+2]=v;d8[i+3]=255;}
  gctx.putImageData(gimg,0,0);
}

// render.js 가 소리를 맞출 순간들
window.REEL={total:TOTAL,fps:30,prefix:'스토리릴스',cues:function(){
  var ins=function(sel){return [].slice.call(document.querySelectorAll(sel)).map(function(e){return +e.getAttribute('data-in');});};
  return {total:TOTAL,impacts:IMPACTS,cuts:CUTS.concat(SOLS),
    pops:ins('[data-a="pop"],[data-a="drop"]'),
    ticks:[].slice.call(document.querySelectorAll('.ck[data-on]')).map(function(e){return +e.getAttribute('data-on');}),
    types:[].slice.call(document.querySelectorAll('[data-a="type"]')).map(function(e){var a=+e.getAttribute('data-in'),d=+e.getAttribute('data-dur')||0.8;return [a,a+d,e._txt.length];}),
    sparse:PAINS.map(function(p){return [p.a,p.b];}),uhoh:PAINS.map(function(p){return p.a+0.2;}),dings:SOLS,
    hush:[31.75,32.0],riser:[30.5,31.75]};
}};
window.render=render;
render(0);
